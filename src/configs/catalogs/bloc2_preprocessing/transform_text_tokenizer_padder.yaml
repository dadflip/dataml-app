id: "transform_text_tokenizer_padder"
name: "Transform: Tokenizer & Padder (RNN/Transformer)"
description: "Ce composant combine deux opérations majeures du NLP : la tokénisation et le padding. La tokénisation segmente le texte brut (phrases, documents) en unités élémentaires (mots, sous-mots) puis les associe à des indices entiers selon un dictionnaire de vocabulaire. Le padding vient ensuite ajuster toutes ces séquences d'entiers à une taille unique. C'est le pipeline d'ingestion classique pour préparer des données textuelles brutes aux modèles d'apprentissage profond."
math_theory: |
  Soit un corpus de documents $D = \{d_1, \dots, d_N\}$. L'étape de tokénisation établit une fonction de projection bijective $\textcolor{#3b82f6}{V} : \text{Token} \rightarrow \{1, 2, \dots, \textcolor{#10b981}{V_{\text{max}}}\}$ où $\textcolor{#10b981}{V_{\text{max}}}$ est la taille maximale du vocabulaire (les mots les plus fréquents). Chaque document $d_i$ est converti en une séquence d'entiers $S_i = [\textcolor{#3b82f6}{V}(w_{i,1}), \textcolor{#3b82f6}{V}(w_{i,2}), \dots, \textcolor{#3b82f6}{V}(w_{i, L_i})]$. Ensuite, la fonction de padding $P(S_i)$ ajuste la longueur de $S_i$ à une constante $\textcolor{#fbbf24}{L}$ : $P(S_i) = S_i \oplus \textcolor{#ef4444}{\mathbf{0}_{L - L_i}}$ si $L_i < \textcolor{#fbbf24}{L}$, et $P(S_i) = S_i[1:\textcolor{#fbbf24}{L}]$ si $L_i > \textcolor{#fbbf24}{L}$. Le tenseur résultant est dans $\textcolor{#8b5cf6}{\mathbb{N}^{N \times L}}$.
