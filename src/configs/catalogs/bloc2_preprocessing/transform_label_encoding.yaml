id: "transform_label_encoding"
name: "Transform: Ordinal/Label Encoding"
description: "L'Ordinal Encoding transforme les variables catégorielles en valeurs entières distinctes. Chaque modalité unique d'une colonne catégorielle se voit attribuer un entier. Bien que très utile et économe en mémoire pour les algorithmes ensemblistes à base d'arbres (comme Random Forest ou XGBoost), cette méthode introduit une notion d'ordre et de distance arithmétique factice qui peut fortement pénaliser les modèles linéaires ou basés sur la distance."
math_theory: |
  Soit une caractéristique catégorielle $\textcolor{#3b82f6}{X}$ avec un ensemble de modalités $\textcolor{#10b981}{C} = \{c_1, c_2, \dots, c_k\}$. L'encodage ordinal correspond à une fonction d'injection $f: \textcolor{#10b981}{C} \rightarrow \{0, 1, \dots, k-1\}$, telle que $\textcolor{#ef4444}{X_{enc}} = f(\textcolor{#3b82f6}{X})$. Par conséquent, pour deux observations $x_i, x_j$, la distance $|f(x_i) - f(x_j)|$ devient mathématiquement significative, ce qui justifie son usage restreint selon les algorithmes.
