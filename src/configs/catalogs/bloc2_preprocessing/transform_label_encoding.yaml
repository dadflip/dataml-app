category: "4.1 Preprocessing"
tags: ["transform", "encoding", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "À utiliser prioritairement pour des variables ordinales (où l'ordre a un sens intrinsèque) ou lors de l'entraînement de modèles à base d'arbres de décision qui savent partitionner efficacement des variables continues/ordinales sans être affectés par l'échelle des valeurs."
use_cases:
  - "Encodage de niveaux de diplômes ou de tranches de revenus."
  - "Préparation de features catégorielles à haute cardinalité pour LightGBM ou XGBoost."
pros:
  - "N'augmente pas la dimensionnalité de l'espace des caractéristiques."
  - "Très économe en ressources mémoire."
  - "Conserve la relation d'ordre pour les variables ordinales."
cons:
  - "Impose un ordre arbitraire qui peut fausser les modèles linéaires, régressions logistiques et réseaux de neurones."
hyperparameters: {}
code_template: |
  import pandas as pd
  from sklearn.preprocessing import OrdinalEncoder
  from sklearn.compose import ColumnTransformer

  print("[TRANSFORM] Ordinal Encoding...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      cat_cols = df.select_dtypes(exclude=['number', 'datetime']).columns.tolist()
      if 'target_name' in locals() and target_name in cat_cols:
          cat_cols.remove(target_name)
          
      if len(cat_cols) > 0:
          # On utilise OrdinalEncoder plutôt que LabelEncoder pour supporter plusieurs colonnes simultanément dans un Pipeline
          oe = OrdinalEncoder(handle_unknown='use_encoded_value', unknown_value=-1)
          
          ct = ColumnTransformer(
              [('oe', oe, cat_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'ordinal_encoding'
          pipeline_steps[step_name] = ct
          
          res = ct.fit_transform(df)
          if isinstance(res, np.ndarray):
              df = pd.DataFrame(res, columns=ct.get_feature_names_out())
          else:
              df = res
              
          print(f"[TRANSFORM] Ordinal Encoding appliqué sur {len(cat_cols)} colonnes.")
      else:
          print("[AVERTISSEMENT] Aucune colonne catégorielle à encoder.")

