id: "transform_text_cleaning"
name: "Transform: Clean Text"
description: "Nettoie et normalise les colonnes de texte brut en appliquant une serie de transformations : conversion en minuscules, suppression de la ponctuation et des caracteres speciaux, et suppression des espaces superflus. C'est une etape prerequise indispensable avant toute vectorisation textuelle (TF-IDF, CountVectorizer, embeddings)."
math_theory: |
  Le nettoyage de texte est un processus de normalisation qui reduit l'espace des tokens :
  - **Lowercasing** : Reduit l'alphabet de $\textcolor{#3b82f6}{|\Sigma_{maj}|} + \textcolor{#10b981}{|\Sigma_{min}|}$ a $\textcolor{#10b981}{|\Sigma_{min}|}$ symboles, fusionnant "Chat" et "chat" en un seul token.
  - **Suppression ponctuation** : Applique une expression reguliere $\text{re.sub}(\textcolor{#fbbf24}{r'[^a-zA-Z0-9\backslash s]'}, '', \textcolor{#ef4444}{s})$ pour ne garder que les caracteres alphanumeriques.
  - **Tokenisation** : Decoupe le texte en une sequence de tokens $\textcolor{#8b5cf6}{t} = [t_1, t_2, ..., t_n]$.
  Ces etapes reduisent le vocabulaire $V$ et ameliorent la qualite des representations vectorielles en aval.
