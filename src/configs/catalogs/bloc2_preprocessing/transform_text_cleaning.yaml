id: "transform_text_cleaning"
name: "Transform: Clean Text"
description: "Nettoie le texte. Intégré au pipeline."
category: "4.1 Preprocessing"
tags: ["transform", "nlp", "text", "pandas", "pipeline"]
applies_to: ["Texte"]
when_to_use: "Avant vectorisation."
pros:
  - "Harmonise la casse."
cons:
  - "Peut supprimer info utile."
hyperparameters:
  text_col: "Colonne de texte"
code_template: |
  import pandas as pd
  import re
  from sklearn.preprocessing import FunctionTransformer
  from sklearn.compose import ColumnTransformer

  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]

  print(f"[TRANSFORM] Text Cleaning (col={TEXT_COL})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      def clean_text_func(X):
          # X can be a DataFrame or Series
          if isinstance(X, pd.DataFrame):
              X = X.copy()
              for col in X.columns:
                  X[col] = X[col].astype(str).str.lower().apply(lambda s: re.sub(r'[^a-zA-Z0-9\s]', '', s))
              return X
          else:
              return pd.Series(X).astype(str).str.lower().apply(lambda s: re.sub(r'[^a-zA-Z0-9\s]', '', s)).to_frame()

      if TEXT_COL in df.columns:
          cleaner = FunctionTransformer(clean_text_func)
          
          ct = ColumnTransformer(
              [('text_clean', cleaner, [TEXT_COL])],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'text_cleaner'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
