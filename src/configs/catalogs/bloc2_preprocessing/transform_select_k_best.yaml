category: "4.1 Preprocessing"
tags: ["transform", "feature-engineering", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "A utiliser lorsque votre jeu de donnees a trop de variables (haute dimensionnalite) et que vous souhaitez reduire le bruit en ne gardant que les K features les plus discriminantes."
use_cases:
  - "Reduction de dimensionnalite avant un modele de classification sur des donnees genomiques (milliers de genes)."
  - "Selection des variables les plus pertinentes dans un dataset marketing avec des centaines de features."
  - "Acceleration de l'entrainement d'un modele en eliminant les variables non informatives."
pros:
  - "Tres rapide a calculer, meme sur de grands datasets."
  - "Reduit le surapprentissage en eliminant les variables bruitees."
  - "Fonctionne comme un filtre pre-modele, independant de l'algorithme de ML choisi."
cons:
  - "Test univarie : ne detecte pas les interactions entre variables (une variable seule peu informative peut etre cruciale en combinaison avec une autre)."
  - "Suppose une relation lineaire entre la variable et la cible (ANOVA F-test)."
  - "Le choix de K est arbitraire et necessite souvent une validation croisee."
hyperparameters:
  k: "Nombre de variables."
code_template: |
  import pandas as pd
  from sklearn.feature_selection import SelectKBest, f_classif
  from sklearn.compose import ColumnTransformer

  # [PARAM: K_FEATURES | number]
  K_FEATURES = 10
  # [/PARAM]

  print(f"[TRANSFORM] SelectKBest (k={K_FEATURES})...")
  if 'df' in locals() and 'target_name' in locals() and target_name:
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=['number']).columns.tolist()
      if target_name in num_cols: num_cols.remove(target_name)
      
      if len(num_cols) > 0:
          k = min(K_FEATURES, len(num_cols))
          skb = SelectKBest(score_func=f_classif, k=k)
          
          ct = ColumnTransformer(
              [('skb', skb, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'select_k_best'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
