id: "transform_select_k_best"
name: "Transform: Select K Best Features"
description: "Selectionne automatiquement les K variables les plus informatives en fonction d'un test statistique univarie (par defaut ANOVA F-test pour la classification). Cela permet de reduire la dimensionnalite en ne gardant que les features les plus correlees a la variable cible."
math_theory: |
  Le test ANOVA F utilise par defaut (f_classif) calcule pour chaque variable $\textcolor{#3b82f6}{x_j}$ le rapport F entre la variance inter-classes et la variance intra-classe :
  $$ \textcolor{#fbbf24}{F_j} = \frac{\text{Variance inter-classes}}{\text{Variance intra-classe}} = \frac{\sum_{c=1}^{C} n_c (\textcolor{#10b981}{\bar{x}_{jc}} - \textcolor{#8b5cf6}{\bar{x}_j})^2 / (C-1)}{\sum_{c=1}^{C} \sum_{i \in c} (\textcolor{#3b82f6}{x_{ij}} - \textcolor{#10b981}{\bar{x}_{jc}})^2 / (N-C)} $$
  ou $C$ est le nombre de classes, $n_c$ le nombre d'observations dans la classe $c$, $\textcolor{#10b981}{\bar{x}_{jc}}$ la moyenne de la variable $j$ dans la classe $c$, et $\textcolor{#8b5cf6}{\bar{x}_j}$ la moyenne globale.
  Les $\textcolor{#ef4444}{K}$ variables avec les scores $\textcolor{#fbbf24}{F_j}$ les plus eleves sont retenues.
  Ce test suppose l'independance des variables (il ne capture pas les interactions entre features).
