category: "4.1 Preprocessing"
tags: ["transform", "timeseries", "feature-engineering", "pandas", "pipeline"]
applies_to: ["Séries Temporelles"]
when_to_use: "À appliquer obligatoirement lorsque vous utilisez des algorithmes de Machine Learning tabulaires (Random Forest, XGBoost, LightGBM) pour des prédictions sur des données séquentielles chronologiques."
use_cases:
  - "Prévision de la demande ou des ventes (Forecasting) à partir de l'historique récent."
  - "Détection d'anomalies dans des flux de données de capteurs IoT."
  - "Modélisation financière pour la prédiction de cours ou de volatilité."
pros:
  - "Transforme efficacement un problème de série temporelle en un problème d'apprentissage supervisé classique."
  - "Explicite fortement les composantes d'autocorrélation linéaire ou non-linéaire du signal pour le modèle."
  - "Méthode très rapide à implémenter et facilement interprétable (l'importance du lag correspond à l'impact du passé)."
cons:
  - "Entraîne inévitablement la création de valeurs manquantes (NaNs) en début de série temporelle."
  - "Démultiplie le nombre de colonnes (dimensionnalité accrue), augmentant le risque de surapprentissage si $K$ est trop grand."
  - "Inadéquat pour traiter des dynamiques à très long terme par rapport aux architectures récurrentes (RNN) ou de type Transformer."
hyperparameters:
  lag_col: "Colonne"
code_template: |
  import pandas as pd
  from sklearn.preprocessing import FunctionTransformer
  from sklearn.compose import ColumnTransformer

  # [PARAM: LAG_COL | string]
  LAG_COL = "value"
  # [/PARAM]
  # [PARAM: N_LAGS | number]
  N_LAGS = 3
  # [/PARAM]

  print(f"[TRANSFORM] Time Series Lag (col={LAG_COL}, lags={N_LAGS})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      def ts_lag_func(X):
          X_df = pd.DataFrame(X)
          lagged = pd.DataFrame()
          for i in range(1, int(N_LAGS) + 1):
              lagged[f"lag_{i}"] = X_df.iloc[:, 0].shift(i)
          # Fill NaN with 0 for sklearn pipeline compatibility, or backfill
          return lagged.bfill().fillna(0)

      if LAG_COL in df.columns:
          lagger = FunctionTransformer(ts_lag_func, feature_names_out=lambda self, input_features: [f"{LAG_COL}_lag_{i}" for i in range(1, int(N_LAGS) + 1)])
          
          ct = ColumnTransformer(
              [('ts_lag', lagger, [LAG_COL])],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'ts_lag'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
