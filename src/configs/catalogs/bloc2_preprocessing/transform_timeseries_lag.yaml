id: "transform_timeseries_lag"
name: "Transform: Time Series Lag"
description: "La création de variables décalées (lag features) est une technique fondamentale d'ingénierie des caractéristiques pour les séries temporelles. Elle consiste à décaler les valeurs passées d'une série pour les aligner avec les observations actuelles. Cela permet à des algorithmes d'apprentissage supervisé classiques, qui supposent l'indépendance des observations, de capter la structure temporelle, l'autocorrélation et la dynamique historique des données."
math_theory: |
  Soit une série temporelle univariée $X = \{\textcolor{#3b82f6}{x_t}\}_{t=1}^T$. L'opérateur de décalage temporel (lag operator) d'ordre $\textcolor{#fbbf24}{k}$, noté $L^{\textcolor{#fbbf24}{k}}$, transforme la série de sorte que $L^{\textcolor{#fbbf24}{k}} \textcolor{#3b82f6}{x_t} = x_{t-\textcolor{#fbbf24}{k}}$. Pour créer un ensemble de caractéristiques (features) prédictives au temps $t$, on construit un vecteur d'observations passées $\textcolor{#10b981}{F_t} = [x_{t-1}, x_{t-2}, \dots, x_{t-\textcolor{#fbbf24}{K}}]$ pour un nombre maximum de lags $\textcolor{#fbbf24}{K}$. Le modèle cherchera alors à approximer une fonction $f$ telle que $\textcolor{#3b82f6}{x_t} \approx f(\textcolor{#10b981}{x_{t-1}, \dots, x_{t-K}})$. Les $\textcolor{#fbbf24}{K}$ premières lignes de la matrice résultante contiendront des valeurs manquantes (\textcolor{#ef4444}{NaN}) dues à l'absence d'historique.
