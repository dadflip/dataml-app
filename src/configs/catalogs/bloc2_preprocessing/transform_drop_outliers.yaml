id: "transform_drop_outliers"
name: "Transform: Z-Score Outliers"
description: "Filtre et supprime les observations (lignes) contenant des valeurs extrêmes ou aberrantes sur les variables numériques, en utilisant la méthode du Z-score par rapport à un seuil défini."
math_theory: |
  Pour chaque observation $\textcolor{#3b82f6}{x_i}$ d'une variable numérique de moyenne $\textcolor{#fbbf24}{\mu}$ et d'écart-type $\textcolor{#8b5cf6}{\sigma}$, on calcule le Z-score : $$ \textcolor{#10b981}{Z_i} = \frac{\textcolor{#3b82f6}{x_i} - \textcolor{#fbbf24}{\mu}}{\textcolor{#8b5cf6}{\sigma}} $$ L'observation est considérée comme une anomalie et retirée si $|\textcolor{#10b981}{Z_i}| > Z_{thresh}$.
