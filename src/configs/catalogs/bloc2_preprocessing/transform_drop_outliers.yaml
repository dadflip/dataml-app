category: "4.1 Preprocessing"
tags: ["transform", "cleaning", "outliers", "tabular", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Pour nettoyer le jeu de données d'entraînement des valeurs extrêmes dues à des erreurs de capteurs ou de saisie, qui pourraient déstabiliser des modèles sensibles (comme la régression linéaire)."
use_cases:
  - "Nettoyage préliminaire avant l'utilisation de modèles linéaires ou de k-Means."
  - "Filtrage de séries temporelles financières ou de capteurs IoT comportant des pics non physiques."
pros:
  - "Améliore grandement la robustesse des modèles basés sur la distance (ex: SVM, KNN) ou sur la variance."
  - "Technique standardisée, rapide et bien comprise statistiquement."
cons:
  - "Extrêmement risqué au sein d'un pipeline complet si appliqué lors de l'inférence, car la suppression de lignes désynchronise les prédictions."
  - "Le Z-score suppose que la distribution sous-jacente est proche d'une loi normale."
hyperparameters:
  z_thresh: "Seuil du Z-Score (souvent 3.0)."
code_template: |
  import pandas as pd
  import numpy as np
  from scipy import stats
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: Z_THRESH | number]
  Z_THRESH = 3.0
  # [/PARAM]

  print(f"[TRANSFORM] Détection et suppression outliers (Z > {Z_THRESH})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      def drop_outliers_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X
          num_cols = X_df.select_dtypes(include=[np.number]).columns
          if len(num_cols) > 0:
              z_scores = np.abs(stats.zscore(X_df[num_cols], nan_policy='omit'))
              mask = (z_scores < Z_THRESH) | np.isnan(z_scores)
              return X_df[mask.all(axis=1)]
          return X_df

      transformer = FunctionTransformer(drop_outliers_func)
      
      step_name = 'drop_outliers'
      pipeline_steps[step_name] = transformer
      
      df_shape_before = df.shape
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Lignes supprimées: {df_shape_before[0] - df.shape[0]}")

