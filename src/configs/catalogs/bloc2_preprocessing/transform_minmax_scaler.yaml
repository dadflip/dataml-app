id: "transform_minmax_scaler"
name: "Transform: MinMax Scaler"
description: "Le MinMax Scaler, ou normalisation min-max, projette l'ensemble des valeurs numériques d'une variable continue dans un intervalle spécifique, typiquement borné entre 0 et 1. Contrairement à la standardisation qui modifie la dispersion autour d'une moyenne nulle, cette technique préserve rigoureusement la forme exacte de la distribution d'origine. C'est une étape de prétraitement incontournable pour les algorithmes sensibles à l'échelle (Réseaux de Neurones, K-Means) et dans les environnements où les valeurs doivent être positives."
math_theory: |
  Pour chaque caractéristique $\textcolor{#3b82f6}{X}$, la transformation opère un redimensionnement linéaire défini par : $$ \textcolor{#10b981}{X_{scaled}} = \frac{\textcolor{#3b82f6}{X} - \textcolor{#ef4444}{X_{min}}}{\textcolor{#fbbf24}{X_{max}} - \textcolor{#ef4444}{X_{min}}} $$ où $\textcolor{#ef4444}{X_{min}}$ et $\textcolor{#fbbf24}{X_{max}}$ représentent respectivement la valeur minimale et maximale de la caractéristique observée dans les données d'entraînement.
