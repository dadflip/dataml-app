category: "4.1 Preprocessing"
tags: ["transform", "scaling", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Indispensable lorsque l'algorithme sous-jacent est sensible aux amplitudes des variables, particulièrement pour les réseaux de neurones, les machines à vecteurs de support (SVM) ou les méthodes basées sur la distance (K-Nearest Neighbors). Idéal quand on a des limites théoriques connues sur les variables."
use_cases:
  - "Mise à l'échelle des intensités de pixels dans des données d'image."
  - "Normalisation des variables pour l'entraînement d'algorithmes d'apprentissage profond."
pros:
  - "Préserve intégralement toutes les relations linéaires et la forme de la distribution originelle."
  - "Garantit que les valeurs de la caractéristique resteront strictement circonscrites dans l'intervalle [0, 1]."
cons:
  - "Extrêmement vulnérable à la présence de valeurs aberrantes (outliers), car ces dernières dictent les bornes $X_{min}$ et $X_{max}$, écrasant ainsi la variance du reste des données."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import MinMaxScaler
  from sklearn.compose import ColumnTransformer

  print("[TRANSFORM] MinMaxScaler...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          scaler = MinMaxScaler()
          ct = ColumnTransformer(
              [('mm_scaler', scaler, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'minmax_scaler'
          pipeline_steps[step_name] = (step_name, ct)
  
  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
