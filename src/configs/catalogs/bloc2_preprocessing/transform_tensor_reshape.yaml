id: "transform_tensor_reshape"
name: "Transform: Reshape to 3D Tensor (RNN/LSTM)"
description: "Redimensionne un DataFrame 2D de forme (N_samples, N_features) en un tenseur 3D de forme (N_samples, Time_steps, Features) requis par les reseaux recurrents (RNN, LSTM, GRU). Cette etape est indispensable car ces architectures attendent des sequences temporelles en entree."
math_theory: |
  Un reseau recurrent (RNN/LSTM/GRU) attend un tenseur d'entree de forme :
  $$ \textcolor{#3b82f6}{X} \in \mathbb{R}^{\textcolor{#10b981}{N} \times \textcolor{#fbbf24}{T} \times \textcolor{#ef4444}{F}} $$
  ou $\textcolor{#10b981}{N}$ est le nombre d'echantillons, $\textcolor{#fbbf24}{T}$ le nombre de pas de temps (time steps), et $\textcolor{#ef4444}{F}$ le nombre de features par pas de temps.
  La contrainte de reshape est : $\textcolor{#fbbf24}{T} \times \textcolor{#ef4444}{F} = \textcolor{#8b5cf6}{D}$ ou $\textcolor{#8b5cf6}{D}$ est le nombre total de colonnes du DataFrame original.
  Par exemple, un DataFrame de forme $(1000, 20)$ peut etre reshape en $(1000, 5, 4)$ (5 pas de temps, 4 features chacun) ou $(1000, 20, 1)$ (20 pas de temps, 1 feature).
  Le LSTM traite ensuite chaque sequence via ses portes (forget, input, output) avec des poids partages dans le temps.
