category: "4.1 Preprocessing"
tags: ["transform", "reshape", "timeseries", "rnn"]
applies_to: ["Tabulaire", "Series Temporelles"]
when_to_use: "A utiliser lorsque vous souhaitez alimenter un reseau recurrent (LSTM, GRU, RNN simple) avec des donnees tabulaires plates qui representent en realite des sequences temporelles."
use_cases:
  - "Conversion d'un dataset de capteurs IoT (colonnes = mesures a differents instants) en sequences pour un LSTM."
  - "Reshape de donnees financieres (cours de bourse sur N jours) pour un modele de prediction de prix LSTM."
  - "Preparation de donnees medicales (signaux EEG, ECG) pour classification par reseau recurrent."
pros:
  - "Rend les donnees tabulaires plates compatibles avec les architectures recurrentes (LSTM, GRU)."
  - "Compatible avec le pipeline sklearn via FunctionTransformer."
  - "Tres rapide (simple reshape numpy sans copie de donnees)."
cons:
  - "Le nombre de colonnes doit etre divisible par le nombre de time_steps choisi."
  - "Le choix du nombre de pas de temps (T) et de features (F) est critique et depend du domaine."
  - "Le DataFrame est converti en numpy array 3D, perdant les noms de colonnes."
hyperparameters:
  time_steps: "Nombre de pas de temps."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: TIME_STEPS | number]
  TIME_STEPS = 1
  # [/PARAM]

  print(f"[TRANSFORM] Reshape Tensor (Time_steps={TIME_STEPS})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      def reshape_3d(X):
          X_arr = np.array(X)
          n_samples = X_arr.shape[0]
          if len(X_arr.shape) == 1:
              X_arr = X_arr.reshape(-1, 1)
          n_cols = X_arr.shape[1]
          t_steps = int(TIME_STEPS)
          
          if n_cols % t_steps != 0:
              raise ValueError(f"Le nombre de colonnes ({n_cols}) n'est pas divisible par {t_steps}.")
              
          n_features = n_cols // t_steps
          X_reshaped = X_arr.reshape((n_samples, t_steps, n_features))
          
          return X_reshaped

      transformer = FunctionTransformer(reshape_3d)
      
      step_name = 'tensor_reshape'
      pipeline_steps[step_name] = (step_name, transformer)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
