  graph TD
    A[2D DataFrame] --> B[Convert to NumPy Array]
    B --> C{Cols divisible by Time_steps?}
    C -- Yes --> D[Reshape to 3D Tensor]
    C -- No --> E[Raise ValueError]
    D --> F[FunctionTransformer]
    F --> G[Add to Pipeline Steps]
    G --> H[Update Data Contract Variables]
    E --> H
    style A fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
    style H fill:#10b981,stroke:#059669,stroke-width:2px

