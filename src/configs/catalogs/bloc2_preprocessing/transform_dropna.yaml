id: "transform_dropna"
name: "Transform: Drop NaNs"
description: "Supprime les lignes contenant des valeurs manquantes dans un jeu de données. Cette opération est suivie dans le pipeline via un FunctionTransformer afin de s'intégrer harmonieusement à scikit-learn."
math_theory: |
  Soit un jeu de données représenté par une matrice $\textcolor{#3b82f6}{X} \in \mathbb{R}^{n \times m}$ avec $n$ échantillons et $m$ caractéristiques. Pour un sous-ensemble de colonnes $S \subseteq \{1, \dots, m\}$, on définit le vecteur indicateur de présence $\textcolor{#fbbf24}{v_i} = 1$ si $\forall j \in S, \textcolor{#3b82f6}{X}_{i,j}$ n'est pas NaN, et $0$ sinon. La matrice filtrée $\textcolor{#10b981}{X'}$ est composée des lignes $\textcolor{#3b82f6}{X}_i$ pour lesquelles $\textcolor{#fbbf24}{v_i} = 1$. Formellement, $\textcolor{#10b981}{X'} = \{ \textcolor{#3b82f6}{X}_i \mid \forall j \in S, \textcolor{#3b82f6}{X}_{i,j} \neq \text{NaN} \}$.
