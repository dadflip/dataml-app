category: "4.1 Preprocessing"
tags: ["transform", "cleaning", "tabular", "pandas", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "À utiliser lorsque le nombre de valeurs manquantes (NaN) est extrêmement faible par rapport à la taille totale du jeu de données, ou lorsque l'imputation risque d'introduire un biais indésirable."
use_cases:
  - "Nettoyage initial d'un grand jeu de données tabulaire comportant moins de 1% de lignes incomplètes."
  - "Retrait des variables cibles (labels) manquantes avant l'entraînement, car elles ne peuvent pas être imputées de manière fiable."
pros:
  - "Extrêmement rapide et simple à mettre en œuvre."
  - "N'introduit aucun biais statistique (tel que la réduction de variance), contrairement aux méthodes d'imputation complexes."
cons:
  - "Entraîne une perte d'information en supprimant potentiellement des lignes avec des valeurs valides dans d'autres colonnes."
  - "Souvent déconseillé pour la phase d'inférence (production) où chaque prédiction compte ; il est généralement préférable d'imputer les valeurs manquantes."
hyperparameters:
  subset: "Colonnes spécifiques à vérifier (vide = toutes)."
code_template: |
  import pandas as pd
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: SUBSET_COLS | string]
  SUBSET_COLS = ""
  # [/PARAM]

  print("[TRANSFORM] Suppression des lignes avec NaNs...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      subset = [c.strip() for c in SUBSET_COLS.split(",") if c.strip()] if SUBSET_COLS else None
      if subset:
          subset = [c for c in subset if c in df.columns]
          if not subset:
              subset = None  # fallback if all subset cols are invalid

      def drop_na_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X
          return X_df.dropna(subset=subset)

      transformer = FunctionTransformer(drop_na_func)
      pipeline_steps['dropna'] = transformer
      
      df_shape_before = df.shape
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Lignes supprimées (NaN): {df_shape_before[0] - df.shape[0]}")

