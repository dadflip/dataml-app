id: "transform_image_to_tensor"
name: "Transform: Image ToTensor & Normalize"
description: "Convertit des images PIL ou numpy arrays en Tenseurs PyTorch (format CHW) et normalise leurs valeurs. Cette étape transpose les canaux de couleur et redimensionne les valeurs des pixels dans l'intervalle [0, 1] ou applique une normalisation basée sur la moyenne et l'écart-type d'un dataset de référence (ex: ImageNet)."
math_theory: |
  La conversion en tenseur (ToTensor) redimensionne les valeurs d'origine $\textcolor{#3b82f6}{I_{orig}} \in [0, 255]$ vers la plage continue $[0, 1]$ :
  $$ \textcolor{#fbbf24}{T} = \frac{\textcolor{#3b82f6}{I_{orig}}}{255.0} $$
  La normalisation standardise ensuite chaque canal de couleur $c \in \{R, G, B\}$ avec la moyenne $\textcolor{#ef4444}{\mu_c}$ et l'écart-type $\textcolor{#8b5cf6}{\sigma_c}$ attendus par les modèles pré-entraînés (ex: $\mu = [0.485, 0.456, 0.406]$, $\sigma = [0.229, 0.224, 0.225]$) :
  $$ \textcolor{#10b981}{T'_{c}} = \frac{\textcolor{#fbbf24}{T_c} - \textcolor{#ef4444}{\mu_c}}{\textcolor{#8b5cf6}{\sigma_c}} $$
  Cela centre la distribution des pixels autour de 0, favorisant ainsi la convergence des gradients.
