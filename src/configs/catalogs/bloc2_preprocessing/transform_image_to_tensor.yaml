category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Étape de pré-traitement absolument indispensable juste avant de passer les images dans un réseau de neurones convolutif PyTorch, car ces réseaux opèrent mathématiquement sur des tenseurs flottants normalisés."
use_cases:
  - "Intégration d'images dans un flux de données PyTorch (Dataset / DataLoader)."
  - "Préparation au Transfer Learning en alignant la distribution des pixels sur celle d'ImageNet."
pros:
  - "Accélère la convergence de l'optimiseur grâce à la normalisation statistique des entrées."
  - "Conforme les données au format natif PyTorch (C x H x W), optimisé pour les convolutions sur GPU."
cons:
  - "Convertir et stocker l'intégralité d'un DataFrame de tenseurs en mémoire vive (RAM) peut s'avérer très lourd pour les grands datasets."
hyperparameters:
  img_col: "Colonne images"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]

  print(f"[TRANSFORM] Conversion ToTensor & Normalization sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def to_tensor_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          transform_ops = T.Compose([
              T.ToTensor(),
              T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])
          ])
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: transform_ops(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(to_tensor_func)
      pipeline_steps['image_to_tensor'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Conversion ToTensor appliquée.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

