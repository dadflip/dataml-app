id: "transform_text_padding"
name: "Transform: Text Sequence Padding"
description: "Le padding est une technique essentielle en traitement du langage naturel (NLP) permettant d'uniformiser la longueur des séquences de mots (ou tokens) dans un jeu de données. En ajoutant des zéros (ou une valeur spécifique) aux séquences trop courtes ou en tronquant les séquences trop longues, cette opération garantit que toutes les entrées fournies à un réseau de neurones partagent une dimension identique, prérequis fondamental pour le calcul tensoriel en batch."
math_theory: |
  Soit un ensemble de séquences $\textcolor{#3b82f6}{S} = \{\textcolor{#3b82f6}{s_1}, \textcolor{#3b82f6}{s_2}, \dots, \textcolor{#3b82f6}{s_N}\}$ où chaque séquence $\textcolor{#3b82f6}{s_i}$ a une longueur $L_i$. Soit $\textcolor{#fbbf24}{L_{\text{max}}}$ la longueur cible (paramètre `max_len`). La fonction de padding $P(\textcolor{#3b82f6}{s_i}, \textcolor{#fbbf24}{L_{\text{max}}})$ est définie ainsi : si $L_i < \textcolor{#fbbf24}{L_{\text{max}}}$, on concatène un vecteur nul de taille $(\textcolor{#fbbf24}{L_{\text{max}}} - L_i)$ tel que $P(\textcolor{#3b82f6}{s_i}) = [s_{i,1}, s_{i,2}, \dots, s_{i,L_i}, \textcolor{#ef4444}{0, \dots, 0}]$. Si $L_i > \textcolor{#fbbf24}{L_{\text{max}}}$, la séquence est tronquée : $P(\textcolor{#3b82f6}{s_i}) = [s_{i,1}, s_{i,2}, \dots, s_{i,\textcolor{#fbbf24}{L_{\text{max}}}}]$. Ainsi, la matrice résultante $\textcolor{#10b981}{X}$ est de dimension $N \times \textcolor{#fbbf24}{L_{\text{max}}}$.
