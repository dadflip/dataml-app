category: "4.1 Preprocessing"
tags: ["transform", "nlp", "text", "pandas", "pipeline"]
applies_to: ["Texte"]
when_to_use: "Cette étape est indispensable avant l'entraînement de réseaux de neurones récurrents (RNN, LSTM, GRU) ou convolutionnels (CNN 1D) qui requièrent des entrées de taille fixe au sein d'un même batch d'apprentissage."
use_cases:
  - "Préparation de corpus textuels pour l'analyse de sentiments."
  - "Uniformisation de phrases pour des tâches de traduction automatique (seq2seq)."
  - "Traitement de séries temporelles de longueurs variables avant modélisation."
pros:
  - "Permet le traitement parallélisé (batching) sur GPU, accélérant drastiquement l'entraînement."
  - "Évite les erreurs de dimensionnalité lors des opérations tensorielles dans les frameworks de deep learning."
  - "Conserve l'ordre séquentiel tout en offrant une structure rigide au modèle."
cons:
  - "Les zéros ajoutés (padding) peuvent biaiser l'apprentissage si le modèle ne gère pas le masquage (masking)."
  - "Augmente l'empreinte mémoire pour les jeux de données contenant majoritairement des séquences très courtes mélangées à quelques séquences très longues."
  - "La troncature (truncating) entraîne inévitablement une perte d'information pour les séquences dépassant la longueur maximale."
hyperparameters:
  seq_col: "Colonne list"
  max_len: "Longueur"
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import FunctionTransformer
  from sklearn.compose import ColumnTransformer

  # [PARAM: SEQ_COL | string]
  SEQ_COL = "sequences"
  # [/PARAM]
  # [PARAM: MAX_LEN | number]
  MAX_LEN = 100
  # [/PARAM]

  print(f"[TRANSFORM] Text Padding (col={SEQ_COL}, max_len={MAX_LEN})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      def pad_sequences_func(X):
          X_list = X[X.columns[0]].tolist() if isinstance(X, pd.DataFrame) else X.tolist()
          padded = []
          for seq in X_list:
              if not isinstance(seq, (list, np.ndarray)):
                  seq = []
              if len(seq) > MAX_LEN:
                  padded.append(seq[:MAX_LEN])
              else:
                  padded.append(list(seq) + [0] * (MAX_LEN - len(seq)))
          return np.array(padded)

      if SEQ_COL in df.columns:
          padder = FunctionTransformer(pad_sequences_func)
          
          ct = ColumnTransformer(
              [('padding', padder, [SEQ_COL])],
              remainder='passthrough', verbose_feature_names_out=False
          )
          
          step_name = 'text_padding'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
