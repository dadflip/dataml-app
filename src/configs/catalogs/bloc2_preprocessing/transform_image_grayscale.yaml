category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Optimal lorsque l'information chromatique (couleur) est non pertinente pour la tâche à accomplir, comme l'analyse de formes, la détection de contours ou la lecture de texte."
use_cases:
  - "Reconnaissance optique de caractères (OCR) sur des documents numérisés."
  - "Imagerie médicale classique (radiographies, échographies) intrinsèquement monocanale."
pros:
  - "Divise par 3 l'espace mémoire requis pour stocker l'image et réduit proportionnellement le nombre de paramètres nécessaires dans les premières couches convolutives."
  - "Force le modèle à se concentrer sur les caractéristiques structurelles et morphologiques plutôt que sur des biais de couleur (ex: fond d'image)."
cons:
  - "Perte irréversible de l'information chromatique, ce qui est critique si la couleur détermine la classe (ex: feu tricolore, diagnostic dermatologique)."
  - "Peut rendre indiscernables certains objets ayant la même luminance mais des teintes différentes."
hyperparameters:
  img_col: "Colonne images"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]

  print(f"[TRANSFORM] Conversion en Grayscale sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def grayscale_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          gray = T.Grayscale(num_output_channels=1)
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: gray(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(grayscale_func)
      pipeline_steps['image_grayscale'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Image Grayscale appliqué.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

