id: "transform_image_grayscale"
name: "Transform: Image Grayscale"
description: "Convertit des images RGB (3 canaux) en images en niveaux de gris (1 canal) afin de simplifier la représentation visuelle tout en réduisant drastiquement l'empreinte mémoire."
math_theory: |
  La conversion d'une image RGB vers des niveaux de gris est une projection linéaire de l'espace tridimensionnel (Rouge, Vert, Bleu) vers un espace unidimensionnel (Luminance). La formule standardisée (CIE 1931 ou Rec. 601) pondère les canaux en fonction de la perception humaine de la luminosité. Si un pixel est représenté par le vecteur $[\textcolor{#ef4444}{R}, \textcolor{#10b981}{G}, \textcolor{#3b82f6}{B}]^T$, la valeur en niveaux de gris $\textcolor{#fbbf24}{Y}$ est calculée par : $$\textcolor{#fbbf24}{Y} = 0.2989 \cdot \textcolor{#ef4444}{R} + 0.5870 \cdot \textcolor{#10b981}{G} + 0.1140 \cdot \textcolor{#3b82f6}{B}$$. Cette opération réduit le tenseur d'entrée de la dimension $(H, W, 3)$ à $(H, W, 1)$.
