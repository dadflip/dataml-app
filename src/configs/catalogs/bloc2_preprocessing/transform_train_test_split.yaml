id: "transform_train_test_split"
name: "Transform: Train / Test Split & Compile"
description: "Cette étape terminale assure la division rigoureuse des données en sous-ensembles d'entraînement et de test. Elle scelle également le pipeline de transformation de scikit-learn (ou imblearn) en compilant l'ensemble des opérations précédentes. Cette démarche garantit qu'aucune fuite de données (data leakage) ne se produise, en veillant à ce que le modèle soit évalué sur un jeu de test complètement invisible lors de l'apprentissage."
math_theory: |
  Soit un jeu de données $\textcolor{#3b82f6}{\mathcal{D}} = \{(x_i, y_i)\}_{i=1}^N$. La fonction de split génère aléatoirement, ou via stratification, deux sous-ensembles disjoints : un ensemble d'entraînement $\textcolor{#10b981}{\mathcal{D}_{\text{train}}}$ de taille $N_{\text{train}}$ et un ensemble de test $\textcolor{#fbbf24}{\mathcal{D}_{\text{test}}}$ de taille $\textcolor{#8b5cf6}{N_{\text{test}}}$ tels que $\textcolor{#10b981}{\mathcal{D}_{\text{train}}} \cup \textcolor{#fbbf24}{\mathcal{D}_{\text{test}}} = \textcolor{#3b82f6}{\mathcal{D}}$ et $\textcolor{#10b981}{\mathcal{D}_{\text{train}}} \cap \textcolor{#fbbf24}{\mathcal{D}_{\text{test}}} = \emptyset$. Le rapport est régi par le paramètre de taille de test $\textcolor{#8b5cf6}{\alpha}$ tel que $\textcolor{#8b5cf6}{N_{\text{test}}} \approx \textcolor{#8b5cf6}{\alpha} N$. Dans le cas d'une stratification sur la variable cible catégorielle $y$, la distribution de probabilité conditionnelle satisfait $\mathbb{P}(\textcolor{#ef4444}{y = c} | \textcolor{#10b981}{\mathcal{D}_{\text{train}}}) \approx \mathbb{P}(\textcolor{#ef4444}{y = c} | \textcolor{#fbbf24}{\mathcal{D}_{\text{test}}}) \approx \mathbb{P}(\textcolor{#ef4444}{y = c} | \textcolor{#3b82f6}{\mathcal{D}})$ pour chaque classe $c$.
