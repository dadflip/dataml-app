id: "transform_polynomial_features"
name: "Transform: Polynomial Features"
description: "Génère automatiquement de nouvelles variables à partir des colonnes numériques existantes en créant toutes les combinaisons polynomiales jusqu'à un degré donné. Par exemple, pour deux variables x1 et x2 avec un degré 2, le transformeur crée x1², x2², et x1·x2. Cela permet aux modèles linéaires de capturer des relations non linéaires."
math_theory: |
  Soit un vecteur de caractéristiques $x = [\textcolor{#3b82f6}{x_1}, \textcolor{#3b82f6}{x_2}, ..., x_d]$. La transformation polynomiale de degré $\textcolor{#fbbf24}{p}$ génère toutes les combinaisons :
  $$ \textcolor{#10b981}{\phi(x)} = [1, \textcolor{#3b82f6}{x_1}, \textcolor{#3b82f6}{x_2}, ..., \textcolor{#8b5cf6}{x_1^2}, \textcolor{#ef4444}{x_1 x_2}, ..., x_d^{\textcolor{#fbbf24}{p}}] $$
  Le nombre total de nouvelles caractéristiques est donné par le coefficient binomial :
  $$ N_{features} = \binom{d + \textcolor{#fbbf24}{p}}{\textcolor{#fbbf24}{p}} - 1 $$
  Par exemple, pour $d=3$ variables et un degré $\textcolor{#fbbf24}{p}=2$, on obtient $\binom{5}{2} - 1 = 9$ caractéristiques (les 3 originales + 3 carrés + 3 interactions croisées).
  Un modèle linéaire $y = w^T \textcolor{#10b981}{\phi(x)}$ devient alors capable de modéliser des frontières de décision non linéaires dans l'espace original.
