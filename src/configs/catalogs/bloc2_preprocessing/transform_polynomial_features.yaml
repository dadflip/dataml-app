category: "4.1 Preprocessing"
tags: ["transform", "feature-engineering", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "À utiliser lorsque vos modèles linéaires (régression linéaire, régression logistique) sous-performent et que vous suspectez des relations non linéaires ou des interactions entre variables dans vos données."
use_cases:
  - "Amélioration d'une régression linéaire pour capturer des tendances quadratiques (ex: prix immobilier vs surface)."
  - "Création de termes d'interaction pour un modèle de scoring où l'effet combiné de deux variables est plus informatif que chaque variable seule."
  - "Feature engineering automatisé avant une sélection de variables (SelectKBest) pour ne garder que les termes polynomiaux les plus pertinents."
pros:
  - "Permet aux modèles linéaires simples de capturer des relations non linéaires complexes sans changer d'algorithme."
  - "Création automatique et exhaustive de toutes les interactions et puissances possibles."
  - "Compatible avec le pipeline sklearn pour un déploiement propre."
cons:
  - "Explosion combinatoire du nombre de features avec le degré et le nombre de variables (ex: 100 variables au degré 3 = 176 851 features)."
  - "Risque élevé de surapprentissage (overfitting) si le degré est trop élevé ou si la régularisation est insuffisante."
  - "Augmente considérablement le temps de calcul et la mémoire nécessaire."
hyperparameters:
  degree: "Degré (ex: 2)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import PolynomialFeatures
  from sklearn.compose import ColumnTransformer

  # [PARAM: DEGREE | number]
  DEGREE = 2
  # [/PARAM]

  print(f"[TRANSFORM] PolynomialFeatures (degree={DEGREE})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          poly = PolynomialFeatures(degree=DEGREE, include_bias=False)
          ct = ColumnTransformer(
              [('poly', poly, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'poly_features'
          pipeline_steps[step_name] = (step_name, ct)
          
  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
