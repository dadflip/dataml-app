id: "transform_simple_imputer"
name: "Transform: Simple Imputer"
description: "Impute les valeurs manquantes via la moyenne/médiane. Ajouté au preprocessor."
category: "4.1 Preprocessing"
tags: ["transform", "imputation", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Dès que des valeurs numériques ou catégorielles manquent."
pros:
  - "Très exportable et robuste en production."
cons:
  - "Peut biaiser la distribution."
hyperparameters:
  strategy_num: "mean, median"
  strategy_cat: "most_frequent, constant"
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.impute import SimpleImputer
  from sklearn.compose import ColumnTransformer

  # [PARAM: STRATEGY_NUM | string]
  STRATEGY_NUM = "median"
  # [/PARAM]

  print(f"[TRANSFORM] SimpleImputer (num={STRATEGY_NUM})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      cat_cols = df.select_dtypes(exclude=[np.number, 'datetime']).columns.tolist()
      
      if 'target_name' in locals():
          if target_name in num_cols: num_cols.remove(target_name)
          if target_name in cat_cols: cat_cols.remove(target_name)
          
      transformers = []
      if len(num_cols) > 0:
          num_imputer = SimpleImputer(strategy=STRATEGY_NUM)
          transformers.append(('num_imputer', num_imputer, num_cols))
      if len(cat_cols) > 0:
          cat_imputer = SimpleImputer(strategy='most_frequent')
          transformers.append(('cat_imputer', cat_imputer, cat_cols))
          
      if transformers:
          ct = ColumnTransformer(
              transformers,
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'simple_imputer'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
illustration_mermaid: |
  graph TD
    A[Raw Data] --> B{Are there columns?}
    B -- Yes --> C[Initialize Numerical & Categorical Imputers]
    C --> D[Create ColumnTransformer]
    D --> E[Add to Pipeline Steps]
    B -- No --> F[Skip SimpleImputer]
    E --> G[Update Data Contract Variables]
    F --> G
    style A fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
    style G fill:#10b981,stroke:#059669,stroke-width:2px

