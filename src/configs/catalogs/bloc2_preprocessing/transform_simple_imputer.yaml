id: "transform_simple_imputer"
name: "Transform: Simple Imputer"
description: "Remplace les valeurs manquantes (NaN) par une statistique simple calculee sur la colonne : la moyenne, la mediane, le mode (valeur la plus frequente) ou une constante. Traite separement les colonnes numeriques et categoriques pour appliquer la strategie la plus adaptee a chaque type."
math_theory: |
  Pour une colonne numerique $\textcolor{#3b82f6}{x_j}$ avec $n$ valeurs observees et $m$ valeurs manquantes (\textcolor{#ef4444}{NaN}) :
  - **Moyenne** : $\hat{x}_{ij} = \textcolor{#10b981}{\bar{x}_j} = \frac{1}{n} \sum_{k=1}^{n} \textcolor{#3b82f6}{x_{kj}}$
  - **Mediane** : $\hat{x}_{ij} = \textcolor{#fbbf24}{Q_2(x_j)}$ (50e percentile des valeurs observees)
  - **Mode** : $\hat{x}_{ij} = \arg\max_v \text{count}(\textcolor{#3b82f6}{x_{kj}} = v)$
  La \textcolor{#fbbf24}{mediane} est preferee a la \textcolor{#10b981}{moyenne} lorsque la distribution est asymetrique ou contient des outliers, car elle est un estimateur plus robuste de la tendance centrale.
  Pour les variables categoriques, le \textcolor{#8b5cf6}{mode} (most_frequent) est la strategie standard.
