category: "4.1 Preprocessing"
tags: ["transform", "nlp", "text", "sklearn", "pipeline"]
applies_to: ["Texte"]
when_to_use: "Utile comme première étape d'extraction de caractéristiques (features) pour le NLP classique (Natural Language Processing) ou comme baseline rapide sur du texte."
use_cases:
  - "Classification de texte simple avec un modèle Naive Bayes ou Régression Logistique."
  - "Détection de spam basée sur la présence de mots-clés."
  - "Analyse de sentiments sur des commentaires très courts."
pros:
  - "Implémentation très rapide et facile à interpréter."
  - "Efficace avec des modèles probabilistes comme Multinomial Naive Bayes."
cons:
  - "Accorde une importance démesurée aux mots très fréquents mais peu informatifs (stopwords, s'ils ne sont pas filtrés)."
  - "Perd totalement l'ordre séquentiel et le contexte sémantique des mots."
  - "Peut générer des matrices creuses de très haute dimensionnalité."
hyperparameters:
  text_col: "Colonne texte"
  max_features: "Nb de features"
code_template: |
  import pandas as pd
  from sklearn.feature_extraction.text import CountVectorizer
  from sklearn.compose import ColumnTransformer

  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]
  # [PARAM: MAX_FEATURES | number]
  MAX_FEATURES = 1000
  # [/PARAM]

  print(f"[TRANSFORM] Application de CountVectorizer sur '{TEXT_COL}'...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      if TEXT_COL in df.columns:
          vec = CountVectorizer(max_features=MAX_FEATURES)
          transformer = ColumnTransformer(
              transformers=[('count_vec', vec, TEXT_COL)],
              remainder='passthrough'
          )
          
          # Fit and transform
          transformed_data = transformer.fit_transform(df)
          
          # Handle sparse matrices correctly
          import scipy.sparse
          if scipy.sparse.issparse(transformed_data):
              transformed_data = transformed_data.toarray()
              
          feature_names = transformer.get_feature_names_out()
          df = pd.DataFrame(transformed_data, columns=feature_names)
          
          pipeline_steps['count_vectorizer'] = transformer
          print(f"[TRANSFORM] CountVectorizer appliqué. Nouvelles features créées.")
      else:
          print(f"[AVERTISSEMENT] La colonne '{TEXT_COL}' n'existe pas dans df.")

