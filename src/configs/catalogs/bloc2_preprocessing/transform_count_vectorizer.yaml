id: "transform_count_vectorizer"
name: "Transform: Count Vectorizer"
description: "Convertit une collection de documents textuels en une matrice d'occurrences (Bag-of-Words), représentant la fréquence d'apparition de chaque mot."
math_theory: |
  Le modèle vectoriel spatial (Bag-of-Words) représente chaque document $\textcolor{#3b82f6}{d}$ par un vecteur de dimension $V$ (taille du vocabulaire). L'élément $\textcolor{#10b981}{x_{i,j}}$ de la matrice correspond au nombre d'occurrences du terme $\textcolor{#fbbf24}{t_j}$ dans le document $\textcolor{#3b82f6}{d_i}$ : $$ \textcolor{#10b981}{x_{i,j}} = \sum_{w \in \textcolor{#3b82f6}{d_i}} \mathbb{I}(w = \textcolor{#fbbf24}{t_j}) $$
