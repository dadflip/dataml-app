    E --> F[Fit & Transform Data]
    F --> G{Is result sparse?}
    G -- Yes --> H[Convert to Dense Array]
    G -- No --> I[Keep Array]
    H --> J[Create new DataFrame with Feature Names]
    I --> J
    J --> K[Update pipeline_steps & df]
    D --> K
    K --> L[Vectorized Data]
    style A fill:#eff6ff,stroke:#94a3b8,stroke-width:2px
    style L fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

