id: "transform_drop_columns"
name: "Transform: Drop Columns"
description: "Supprime des colonnes inutiles."
category: "4.1 Preprocessing"
tags: ["transform", "cleaning", "tabular", "pandas", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Pour retirer explicitement des colonnes."
pros:
  - "Réduit le bruit pour les modèles."
cons:
  - "Peut supprimer de l'information utile."
hyperparameters:
  columns_to_drop: "Noms des colonnes séparés par des virgules."
code_template: |
  import pandas as pd
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: COLUMNS_TO_DROP | string]
  COLUMNS_TO_DROP = ""
  # [/PARAM]

  print(f"[TRANSFORM] Suppression des colonnes : {COLUMNS_TO_DROP}...")
  if 'df' in locals() and COLUMNS_TO_DROP.strip():
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      cols_to_drop = [c.strip() for c in COLUMNS_TO_DROP.split(",") if c.strip()]
      
      def drop_cols_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X
          return X_df.drop(columns=cols_to_drop, errors='ignore')

      transformer = FunctionTransformer(drop_cols_func)
      pipeline_steps['drop_columns'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Colonnes supprimées (si elles existaient).")

illustration_mermaid: |
  graph TD
    A[Input DataFrame] --> B{COLUMNS_TO_DROP provided?}
    B -- Yes --> C[Parse columns list]
    B -- No --> D[Skip and return original]
    C --> E[Initialize FunctionTransformer]
    E --> F[df.drop columns with errors='ignore']
    F --> G[Update pipeline_steps & df]
    D --> G
    G --> H[Output DataFrame]
    style A fill:#eff6ff,stroke:#94a3b8,stroke-width:2px
    style H fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

