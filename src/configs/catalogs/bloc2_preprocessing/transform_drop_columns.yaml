id: "transform_drop_columns"
name: "Transform: Drop Columns"
description: "Élimine explicitement une liste de colonnes spécifiées du DataFrame, permettant de retirer les identifiants, les données redondantes ou les variables induisant une fuite de données (data leakage)."
math_theory: |
  Il s'agit d'une projection orthogonale simple de l'espace des descripteurs. Pour une matrice de caractéristiques $\textcolor{#3b82f6}{X} \in \mathbb{R}^{N \times D}$, la suppression de $K$ colonnes produit un nouvel espace $\textcolor{#10b981}{X'} \in \mathbb{R}^{N \times (D - K)}$, réduisant ainsi la dimensionnalité intrinsèque de l'entrée.
