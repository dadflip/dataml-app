category: "4.1 Preprocessing"
tags: ["transform", "cleaning", "tabular", "pandas", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Lorsqu'il faut nettoyer manuellement les variables identifiées comme inutiles ou risquées suite à l'Analyse Exploratoire des Données (EDA)."
use_cases:
  - "Suppression des identifiants (IDs), clés primaires ou noms propres."
  - "Élimination des variables provoquant des fuites d'informations (target leakage)."
  - "Retrait des variables hautement corrélées détectées précédemment."
pros:
  - "Diminue l'empreinte mémoire et accélère l'entraînement."
  - "Réduit efficacement le bruit et évite l'overfitting potentiel induit par des variables parasites."
cons:
  - "Action irréversible (si non gérée par copie) : une suppression hâtive peut détruire un fort signal prédictif."
  - "Nécessite de connaître exactement le nom de la colonne (sensibilité à la casse et aux espaces)."
hyperparameters:
  columns_to_drop: "Noms des colonnes séparés par des virgules."
code_template: |
  import pandas as pd
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: COLUMNS_TO_DROP | string]
  COLUMNS_TO_DROP = ""
  # [/PARAM]

  print(f"[TRANSFORM] Suppression des colonnes : {COLUMNS_TO_DROP}...")
  if 'df' in locals() and COLUMNS_TO_DROP.strip():
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      cols_to_drop = [c.strip() for c in COLUMNS_TO_DROP.split(",") if c.strip()]
      
      def drop_cols_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X
          return X_df.drop(columns=cols_to_drop, errors='ignore')

      transformer = FunctionTransformer(drop_cols_func)
      pipeline_steps['drop_columns'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Colonnes supprimées (si elles existaient).")

