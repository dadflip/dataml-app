category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "À utiliser prioritairement durant l'entraînement de réseaux de neurones (CNN) sur des images naturelles, lorsque la symétrie horizontale n'affecte pas la sémantique de l'objet (ex: chats, voitures, paysages)."
use_cases:
  - "Entraînement de modèles de classification d'images pour augmenter artificiellement la taille du dataset."
  - "Régularisation lors de l'apprentissage de détecteurs d'objets pour éviter le surapprentissage (overfitting)."
pros:
  - "Augmente artificiellement la taille du jeu de données d'entraînement très facilement."
  - "Réduit le surapprentissage (overfitting) de manière prouvée et efficace."
  - "Extrêmement rapide à calculer, n'impactant quasiment pas les temps de chargement."
cons:
  - "Ne doit pas être utilisé si le sens de lecture ou la latéralité est critique (ex: classification de chiffres, lettres, ou imagerie médicale où droite/gauche a un sens clinique)."
hyperparameters:
  img_col: "Colonne images"
  p: "Proba"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]
  # [PARAM: P | number]
  P = 0.5
  # [/PARAM]

  print(f"[TRANSFORM] Application Random Horizontal Flip (p={P}) sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def random_flip_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          flip = T.RandomHorizontalFlip(p=P)
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: flip(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(random_flip_func)
      pipeline_steps['image_random_flip'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Random Flip appliqué.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

