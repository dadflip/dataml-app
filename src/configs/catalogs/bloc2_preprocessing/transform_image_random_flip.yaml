id: "transform_image_random_flip"
name: "Transform: Image Random Flip"
description: "Data Augmentation."
category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Augmentation."
pros:
  - "Évite overfitting."
cons:
  - "Aléatoire."
hyperparameters:
  img_col: "Colonne images"
  p: "Proba"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]
  # [PARAM: P | number]
  P = 0.5
  # [/PARAM]

  print(f"[TRANSFORM] Application Random Horizontal Flip (p={P}) sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def random_flip_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          flip = T.RandomHorizontalFlip(p=P)
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: flip(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(random_flip_func)
      pipeline_steps['image_random_flip'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Random Flip appliqué.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

