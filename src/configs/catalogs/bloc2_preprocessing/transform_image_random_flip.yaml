id: "transform_image_random_flip"
name: "Transform: Image Random Flip"
description: "Applique un retournement horizontal aléatoire (Random Horizontal Flip) aux images avec une probabilité donnée. Cette technique d'augmentation de données enrichit le jeu de données d'entraînement en générant de nouvelles perspectives, ce qui aide le modèle à généraliser l'apprentissage sans mémoriser l'orientation stricte."
math_theory: |
  Le retournement horizontal agit sur la matrice des pixels de taille $\textcolor{#3b82f6}{H} \times \textcolor{#3b82f6}{W} \times C$. Pour un pixel de coordonnées spatiales $(x, y)$, la nouvelle valeur est donnée par une réflexion sur l'axe vertical central :
  $$ \textcolor{#10b981}{I_{new}}(x, y, c) = \textcolor{#3b82f6}{I_{orig}}(\textcolor{#3b82f6}{W} - 1 - x, y, c) $$
  L'application de ce retournement suit une distribution de Bernoulli $\textcolor{#fbbf24}{Z} \sim \mathcal{B}(\textcolor{#ef4444}{p})$ où $\textcolor{#ef4444}{p}$ est la probabilité définie par l'utilisateur :
  $$ T(I) = \textcolor{#fbbf24}{Z} \cdot \textcolor{#10b981}{I_{new}} + (1 - \textcolor{#fbbf24}{Z}) \cdot \textcolor{#3b82f6}{I_{orig}} $$
