id: "transform_image_to_tensor_paths"
name: "Transform: Image Paths to Tensor"
description: "Lit les images directement depuis leurs chemins d'accès sur le disque (paths), effectue un redimensionnement, les convertit en Tenseurs PyTorch (CHW), puis les normalise. Cette fonction combine le chargement I/O et la préparation des tenseurs en une seule étape fluide, gérant les erreurs de lecture à la volée."
math_theory: |
  Le pipeline complet modélise une fonction composée sur le chemin de fichier $\textcolor{#3b82f6}{x_p}$ :
  $$ f(\textcolor{#3b82f6}{x_p}) = (\textcolor{#8b5cf6}{N} \circ \textcolor{#fbbf24}{T_{tensor}} \circ \textcolor{#10b981}{R} \circ \textcolor{#ef4444}{L})(\textcolor{#3b82f6}{x_p}) $$
  Où :
  - $\textcolor{#ef4444}{L}$ : Chargement de l'image (décodage JPEG/PNG) $\rightarrow$ matrice spatiale $[0, 255]$
  - $\textcolor{#10b981}{R}$ : Redimensionnement spatial bilinéaire
  - $\textcolor{#fbbf24}{T_{tensor}}$ : Projection dans l'espace tensoriel continu $[0, 1]$
  - $\textcolor{#8b5cf6}{N}$ : Normalisation standard : $\hat{X} = \frac{X - \mu}{\sigma}$ par canal
  Les images corrompues (où $\textcolor{#ef4444}{L}(\textcolor{#3b82f6}{x_p})$ échoue) sont projetées vers un espace nul et filtrées.
