category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Lorsque le dataframe contient uniquement des chemins de fichiers et qu'il faut directement les exploiter pour entraîner un CNN, par exemple juste après l'utilisation du module `load_image_directory`."
use_cases:
  - "Pré-traitement de bout-en-bout pour les datasets d'images volumineux qui ne tiennent pas initialement en mémoire."
  - "Mise en place de pipelines de Deep Learning simplifiés à partir d'un dossier de fichiers."
pros:
  - "Centralise les étapes complexes de lecture, redimensionnement et normalisation en un seul bloc pratique."
  - "Intègre une gestion d'erreur propre : les fichiers corrompus sont ignorés sans faire planter l'application."
cons:
  - "Si le jeu de données est massif (dizaines de milliers d'images), charger tous les tenseurs en une seule fois dans la mémoire RAM du DataFrame va causer un 'Out Of Memory' (OOM)."
  - "Moins flexible qu'un DataLoader PyTorch asynchrone qui charge les batchs à la demande (lazy loading)."
hyperparameters:
  img_path_col: "Colonne contenant les chemins d'images."
  resize: "Redimensionner les images (ex: 224)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import FunctionTransformer
  try:
      import torchvision.transforms as T
      from PIL import Image
  except ImportError:
      T = None
      print("[ERREUR] torchvision ou PIL non installé.")
      
  # [PARAM: IMG_PATH_COL | string]
  IMG_PATH_COL = "image_path"
  # [/PARAM]
  # [PARAM: RESIZE | number]
  RESIZE = 224
  # [/PARAM]

  print(f"[TRANSFORM] Chargement depuis '{IMG_PATH_COL}' vers tenseurs (resize: {RESIZE})...")
  if 'df' in locals() and IMG_PATH_COL in df.columns and T is not None:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def paths_to_tensor_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          
          transform_ops = T.Compose([
              T.Resize((RESIZE, RESIZE)),
              T.ToTensor(),
              T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])
          ])
          
          def load_and_transform(path):
              try:
                  img = Image.open(path).convert('RGB')
                  return transform_ops(img)
              except Exception as e:
                  return None
                  
          X_df['tensor_image'] = X_df[IMG_PATH_COL].apply(load_and_transform)
          X_df = X_df.dropna(subset=['tensor_image']).reset_index(drop=True)
          return X_df

      transformer = FunctionTransformer(paths_to_tensor_func)
      pipeline_steps['image_paths_to_tensor'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Images chargées et transformées dans 'tensor_image'.")
  elif T is None:
      pass
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_PATH_COL}' introuvable.")

