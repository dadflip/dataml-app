id: "transform_smote"
name: "Transform: SMOTE (Oversampling)"
description: "Genere des exemples synthetiques pour la classe minoritaire afin de reequilibrer la distribution des classes. SMOTE (Synthetic Minority Over-sampling Technique) cree de nouvelles observations en interpolant lineairement entre des echantillons existants de la classe sous-representee et leurs K plus proches voisins."
math_theory: |
  Pour chaque echantillon \textcolor{#3b82f6}{x_i} de la classe minoritaire, SMOTE :
  1. Identifie ses $K$ plus proches voisins parmi les echantillons de la meme classe
  2. Selectionne aleatoirement un voisin \textcolor{#10b981}{x_{nn}}
  3. Genere un point synthetique par interpolation lineaire :
  $$ \textcolor{#ef4444}{x_{new}} = \textcolor{#3b82f6}{x_i} + \textcolor{#fbbf24}{\lambda} \cdot (\textcolor{#10b981}{x_{nn}} - \textcolor{#3b82f6}{x_i}) $$
  ou $\textcolor{#fbbf24}{\lambda} \sim \mathcal{U}(0, 1)$ est un coefficient aleatoire tire d'une distribution uniforme.
  Le nombre de points synthetiques generes depend du ratio de reequilibrage souhaite.
  Variantes courantes : Borderline-SMOTE (ne genere qu'autour des frontieres de decision), ADASYN (adaptatif selon la densite locale).
math_illustration_svg: |
  <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
