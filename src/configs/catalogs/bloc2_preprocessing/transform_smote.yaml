category: "4.1 Preprocessing"
tags: ["transform", "imbalance", "tabular", "imblearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "A utiliser lorsque vos classes sont tres desequilibrees (ex: 95% vs 5%) et que le modele a tendance a predire uniquement la classe majoritaire. Typique en detection de fraude, diagnostic medical ou detection d'anomalies."
use_cases:
  - "Reequilibrage d'un dataset de detection de fraude bancaire (0.1% de cas positifs)."
  - "Augmentation de la classe minoritaire pour un diagnostic medical rare."
  - "Amelioration du rappel (recall) d'un modele de classification desequilibre."
pros:
  - "Evite le biais vers la classe majoritaire et ameliore le rappel sur la classe minoritaire."
  - "Plus intelligent que le simple sur-echantillonnage (duplication) car il genere de la diversite."
  - "Compatible avec le pipeline imblearn pour un deploiement propre."
cons:
  - "Peut generer des echantillons synthetiques bruites si les classes se chevauchent spatialement."
  - "Calcul potentiellement lent sur de tres grands datasets (recherche KNN)."
  - "Ne doit JAMAIS etre applique sur les donnees de test (uniquement sur le train set)."
hyperparameters:
  sampling_strategy: "auto"
code_template: |
  import pandas as pd
  try:
      from imblearn.over_sampling import SMOTE
  except ImportError:
      SMOTE = None
      print("[ERREUR] Installez imbalanced-learn.")

  print("[TRANSFORM] SMOTE...")
  if 'df' in locals() and 'target_name' in locals() and target_name and SMOTE:
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      if target_name in df.columns:
          smote = SMOTE()
          
          # SMOTE est un sampler imblearn. Il s'applique a la fin sur X et y entiers
          step_name = 'smote'
          pipeline_steps[step_name] = (step_name, smote)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
