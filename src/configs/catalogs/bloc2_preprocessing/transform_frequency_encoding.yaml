id: "transform_frequency_encoding"
name: "Transform: Frequency Encoding"
description: "Encode les variables catégorielles en remplaçant chaque modalité par sa fréquence d'apparition relative dans le jeu de données d'entraînement."
math_theory: |
  Soit une variable catégorielle $\textcolor{#3b82f6}{C}$ prenant ses valeurs dans un ensemble de modalités $\{c_1, c_2, \dots, c_k\}$. Pour un jeu de données contenant $\textcolor{#8b5cf6}{N}$ échantillons, si la modalité $\textcolor{#fbbf24}{c_i}$ apparaît $\textcolor{#10b981}{n_i}$ fois, son encodage fréquentiel (normalisé) est défini par la probabilité empirique : $$P(\textcolor{#3b82f6}{C} = \textcolor{#fbbf24}{c_i}) = \frac{\textcolor{#10b981}{n_i}}{\textcolor{#8b5cf6}{N}}$$. Chaque occurrence de la modalité $\textcolor{#fbbf24}{c_i}$ dans les données est ainsi remplacée par le scalaire $\textcolor{#ef4444}{P(C = c_i)} \in [0, 1]$.
math_illustration_svg: |
