category: "4.1 Preprocessing"
tags: ["transform", "encoding", "tabular", "category_encoders", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Particulièrement efficace lorsque la fréquence d'une catégorie est fortement corrélée avec la variable cible (ex: des catégories rares ont un comportement spécifique)."
use_cases:
  - "Traitement de variables catégorielles à très haute cardinalité où le One-Hot Encoding produirait une matrice trop creuse."
  - "Détection de fraude ou de pannes, où la rareté d'un événement (faible fréquence) porte une valeur prédictive majeure."
pros:
  - "Maintient un espace de caractéristiques compact puisqu'il n'ajoute aucune nouvelle colonne."
  - "Préserve l'information sur la popularité ou la rareté de chaque catégorie."
cons:
  - "Nécessite le package externe category_encoders."
  - "Risque de collision (perte d'information) si deux catégories distinctes possèdent exactement la même fréquence d'apparition."
hyperparameters: {}
code_template: |
  import pandas as pd
  try:
      import category_encoders as ce
  except ImportError:
      ce = None
      print("[ERREUR] Installez category_encoders: !pip install category_encoders")

  print("[TRANSFORM] Frequency Encoding...")
  if 'df' in locals() and ce:
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      cat_cols = df.select_dtypes(exclude=['number', 'datetime']).columns.tolist()
      if 'target_name' in locals() and target_name in cat_cols:
          cat_cols.remove(target_name)
          
      if len(cat_cols) > 0:
          fe = ce.CountEncoder(cols=cat_cols, normalize=True)
          
          step_name = 'freq_encoding'
          pipeline_steps[step_name] = fe
          df = fe.fit_transform(df)
          print(f"[TRANSFORM] Encodage fréquentiel appliqué sur {len(cat_cols)} colonnes.")
      else:
          print("[AVERTISSEMENT] Aucune colonne catégorielle trouvée pour l'encodage.")

