id: "transform_frequency_encoding"
name: "Transform: Frequency Encoding"
description: "Encode par la fréquence d'apparition (%)."
category: "4.1 Preprocessing"
tags: ["transform", "encoding", "tabular", "category_encoders", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Quand la fréquence porte une information utile."
pros:
  - "N'ajoute pas de colonnes."
cons:
  - "Nécessite le package category_encoders."
hyperparameters: {}
code_template: |
  import pandas as pd
  try:
      import category_encoders as ce
  except ImportError:
      ce = None
      print("[ERREUR] Installez category_encoders: !pip install category_encoders")

  print("[TRANSFORM] Frequency Encoding...")
  if 'df' in locals() and ce:
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      cat_cols = df.select_dtypes(exclude=['number', 'datetime']).columns.tolist()
      if 'target_name' in locals() and target_name in cat_cols:
          cat_cols.remove(target_name)
          
      if len(cat_cols) > 0:
          fe = ce.CountEncoder(cols=cat_cols, normalize=True)
          
          step_name = 'freq_encoding'
          pipeline_steps[step_name] = fe
          df = fe.fit_transform(df)
          print(f"[TRANSFORM] Encodage fréquentiel appliqué sur {len(cat_cols)} colonnes.")
      else:
          print("[AVERTISSEMENT] Aucune colonne catégorielle trouvée pour l'encodage.")

illustration_mermaid: |
  graph TD
    A[Input DataFrame] --> B{ce installed?}
    B -- Yes --> C[Identify categorical cols]
    B -- No --> D[Error / Skip]
    C --> E{Any cat_cols?}
    E -- Yes --> F[Initialize ce.CountEncoder]
    E -- No --> G[Skip and Warn]
    F --> H[Fit & Transform df]
    H --> I[Update pipeline_steps]
    I --> J[Frequency Encoded DataFrame]
    D --> J
    G --> J
    style A fill:#eff6ff,stroke:#94a3b8,stroke-width:2px
    style J fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

