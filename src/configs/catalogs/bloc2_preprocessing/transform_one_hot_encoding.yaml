id: "transform_one_hot_encoding"
name: "Transform: One-Hot Encoding"
description: "Le One-Hot Encoding (OHE) convertit chaque modalité d'une variable catégorielle en une nouvelle caractéristique binaire distincte (indicatrice). Cette méthode est essentielle pour les algorithmes qui ne peuvent pas exploiter la structure catégorielle directement et qui risqueraient d'interpréter à tort un ordre hiérarchique si on utilisait un encodage ordinal. L'OHE transforme le jeu de données en augmentant son espace de représentation, produisant souvent une matrice creuse (sparse) pour limiter la consommation mémoire."
math_theory: |
  Soit une variable catégorielle $\textcolor{#3b82f6}{X}$ ayant un ensemble de $k$ modalités distinctes $\{\textcolor{#fbbf24}{C_1}, \textcolor{#fbbf24}{C_2}, \dots, \textcolor{#fbbf24}{C_k}\}$. L'OHE transforme chaque observation $x_i$ en un vecteur binaire $\textcolor{#10b981}{V_i} = [v_{i,1}, v_{i,2}, \dots, v_{i,k}]$ de dimension $k$, où $v_{i,j} = 1$ si $x_i = \textcolor{#fbbf24}{C_j}$ et $0$ sinon. Pour éviter la multicolinéarité parfaite (le piège des variables muettes / dummy variable trap) dans les modèles linéaires, on retire souvent la première colonne, réduisant l'espace à $k-1$ dimensions.
