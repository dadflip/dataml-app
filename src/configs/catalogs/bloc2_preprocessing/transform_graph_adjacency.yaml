category: "4.1 Preprocessing"
tags: ["transform", "graph", "pytorch-geometric", "gnn"]
applies_to: ["Graphes"]
when_to_use: "Absolument indispensable dans un pipeline de graphe pour lier les caractéristiques des nœuds (contenues dans le DataFrame) à la topologie du graphe (matrice d'adjacence) avant d'appliquer un modèle GCN, GAT ou GraphSAGE."
use_cases:
  - "Préparation des données structurelles (réseaux sociaux, molécules) pour un entraînement sous PyTorch Geometric."
  - "Conservation de la topologie relationnelle lors des étapes intermédiaires du pipeline DataML."
pros:
  - "Respecte scrupuleusement le contrat de flux de données DataML en séparant les features (Dataframe) et la topologie (Meta)."
  - "Extrêmement léger en mémoire grâce à l'utilisation du format COO pour les arêtes."
cons:
  - "Il s'agit techniquement d'une opération d'injection dans l'environnement (scope global) ; elle ne modifie pas le DataFrame en soi."
  - "Rend le pipeline dépendant de la présence de la clé 'edge_index' dans les métadonnées."
hyperparameters:
  none: "Aucun."
code_template: |
  import pandas as pd
  from sklearn.preprocessing import FunctionTransformer

  print(f"[TRANSFORM] Injection de l'Edge Index...")
  if 'df' in locals() and 'meta' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      if 'edge_index' in meta:
          # On injecte la variable dans le scope global pour que le modèle du Bloc 3 y ait accès
          global global_edge_index
          global_edge_index = meta['edge_index']
          
          def identity_transform(X):
              return X

          transformer = FunctionTransformer(identity_transform)
          
          step_name = 'graph_edge_index_injector'
          pipeline_steps[step_name] = transformer
          print("[TRANSFORM] Edge index injecté globalement.")
      else:
          print("[AVERTISSEMENT] 'edge_index' introuvable dans 'meta'.")

