id: "transform_graph_adjacency"
name: "Transform: Graph Edge Index Injector"
description: "Extrait et injecte l'index des arêtes (edge_index) depuis les métadonnées globales vers le contexte d'exécution, afin de le rendre disponible pour les modèles de réseaux de neurones sur graphes (GNN) dans le Bloc 3."
math_theory: |
  Un graphe orienté $G = (\textcolor{#3b82f6}{V}, \textcolor{#10b981}{E})$ est constitué de nœuds $\textcolor{#3b82f6}{V}$ et d'arêtes $\textcolor{#10b981}{E}$. L'`edge_index` représente la matrice d'adjacence sous forme de liste de paires de coordonnées au format COO (Coordinate format). Formellement, il s'agit d'une matrice $\textcolor{#fbbf24}{E_{idx}} \in \mathbb{Z}^{2 \times |E|}$ où chaque colonne $\begin{pmatrix} \textcolor{#3b82f6}{u} \\ \textcolor{#3b82f6}{v} \end{pmatrix}$ indique une arête dirigée du nœud source $\textcolor{#3b82f6}{u}$ vers le nœud cible $\textcolor{#3b82f6}{v}$. Cette représentation creuse est optimale pour le calcul de la propagation de l'information (message passing) dans les GNN : $$\textcolor{#8b5cf6}{H^{(l+1)}} = \sigma(\tilde{D}^{-1/2} \textcolor{#10b981}{\tilde{A}} \tilde{D}^{-1/2} H^{(l)} W^{(l)})$$ où $\textcolor{#10b981}{\tilde{A}}$ est déduit de $\textcolor{#fbbf24}{E_{idx}}$.
