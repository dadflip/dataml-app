id: "transform_target_encoding"
name: "Transform: Target Encoding"
description: "Encode les variables categoriques en remplacant chaque categorie par la moyenne de la variable cible pour cette categorie. Particulierement adapte aux variables a haute cardinalite (villes, codes postaux, identifiants) ou le One-Hot Encoding genererait un nombre excessif de colonnes."
math_theory: |
  Pour une variable categorique \textcolor{#3b82f6}{c} et une variable cible \textcolor{#10b981}{y}, l'encodage cible avec lissage (smoothing) est :
  $$ \text{TE}(\textcolor{#3b82f6}{c_k}) = \frac{\textcolor{#8b5cf6}{n_k} \cdot \textcolor{#10b981}{\bar{y}_{c_k}} + \textcolor{#fbbf24}{m} \cdot \textcolor{#10b981}{\bar{y}}}{\textcolor{#8b5cf6}{n_k} + \textcolor{#fbbf24}{m}} $$
  ou $\textcolor{#10b981}{\bar{y}_{c_k}} = \frac{1}{\textcolor{#8b5cf6}{n_k}} \sum_{i: c_i = c_k} \textcolor{#10b981}{y_i}$ est la moyenne de la cible pour la categorie \textcolor{#3b82f6}{c_k}, \textcolor{#8b5cf6}{n_k} le nombre d'observations dans cette categorie, \textcolor{#10b981}{\bar{y}} la moyenne globale de la cible, et \textcolor{#fbbf24}{m} le parametre de lissage (smoothing).
  Le lissage agit comme une regularisation bayesienne : pour les categories rares (\textcolor{#8b5cf6}{n_k} petit), l'encodage se rapproche de la moyenne globale \textcolor{#10b981}{\bar{y}}, evitant ainsi le surapprentissage.
