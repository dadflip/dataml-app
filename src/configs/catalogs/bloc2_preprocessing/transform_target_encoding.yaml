category: "4.1 Preprocessing"
tags: ["transform", "encoding", "tabular", "category_encoders", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "A privilegier pour les variables categoriques a haute cardinalite (centaines ou milliers de categories uniques) ou le One-Hot Encoding exploserait la dimensionnalite."
use_cases:
  - "Encodage de codes postaux ou de noms de villes dans un modele de prediction immobiliere."
  - "Transformation d'identifiants utilisateurs en features numeriques dans un systeme de recommandation."
  - "Encodage de references produits pour un modele de prediction de ventes."
pros:
  - "Tres performant pour les variables a haute cardinalite (pas d'explosion dimensionnelle)."
  - "Capture directement la relation entre la categorie et la variable cible."
  - "Le lissage (smoothing) protege contre le surapprentissage des categories rares."
cons:
  - "Necessite le package category_encoders (pas inclus dans sklearn de base)."
  - "Risque de fuite de donnees (data leakage) si applique sans validation croisee."
  - "Perd l'information ordinale ou hierarchique des categories."
hyperparameters:
  smoothing: "Parametre de lissage."
code_template: |
  import pandas as pd
  try:
      import category_encoders as ce
  except ImportError:
      ce = None
      print("[ERREUR] Installez category_encoders: !pip install category_encoders")
  from sklearn.compose import ColumnTransformer

  # [PARAM: SMOOTHING | number]
  SMOOTHING = 10
  # [/PARAM]

  print("[TRANSFORM] Target Encoding...")
  if 'df' in locals() and 'target_name' in locals() and target_name and ce:
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      cat_cols = df.select_dtypes(exclude=['number', 'datetime']).columns.tolist()
      if target_name in cat_cols: cat_cols.remove(target_name)
          
      if len(cat_cols) > 0:
          te = ce.TargetEncoder(cols=cat_cols, smoothing=SMOOTHING)
          
          step_name = 'target_encoding'
          pipeline_steps[step_name] = (step_name, te)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
