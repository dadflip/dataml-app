category: "4.1 Preprocessing"
tags: ["transform", "nlp", "text", "sklearn", "pipeline"]
applies_to: ["Texte"]
when_to_use: "Privilégié lorsque l'on utilise des algorithmes de Machine Learning classiques (Régression Logistique, Random Forest, SVM) sur des données textuelles, et que l'ordre des mots n'a pas d'importance critique."
use_cases:
  - "Classification de documents et filtrage de spam."
  - "Extraction de mots-clés (keywords extraction) pour le référencement."
  - "Calcul de similarité entre textes (via similarité cosinus) pour des moteurs de recherche basiques."
pros:
  - "Mise en évidence algorithmique des mots véritablement discriminants dans un contexte donné."
  - "Très rapide à calculer et ne requiert pas d'entraînement lourd comparé aux embeddings de Deep Learning."
  - "Excellente baseline, simple à interpréter et robuste sur de petits jeux de données."
cons:
  - "Ne prend pas en compte le contexte, la sémantique ou l'ordre des mots (perte de la structure phrastique)."
  - "Génère des matrices de caractéristiques extrêmement creuses (sparse matrices) et de très grande dimensionnalité."
  - "Inadapté pour capturer des nuances linguistiques subtiles (ironie, polysémie) ou des relations syntaxiques."
hyperparameters:
  text_col: "Colonne de texte"
  max_features: "Nb de features"
code_template: |
  import pandas as pd
  from sklearn.feature_extraction.text import TfidfVectorizer
  from sklearn.compose import ColumnTransformer

  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]
  # [PARAM: MAX_FEATURES | number]
  MAX_FEATURES = 1000
  # [/PARAM]

  print(f"[TRANSFORM] TF-IDF Vectorizer (col={TEXT_COL}, max_features={MAX_FEATURES})...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      if TEXT_COL in df.columns:
          tfidf = TfidfVectorizer(max_features=int(MAX_FEATURES))
          
          ct = ColumnTransformer(
              [('tfidf', tfidf, TEXT_COL)], # Use string TEXT_COL, not list, to pass 1D series
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'tfidf'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
