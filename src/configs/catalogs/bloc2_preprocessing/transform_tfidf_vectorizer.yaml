id: "transform_tfidf_vectorizer"
name: "Transform: TF-IDF Vectorizer"
description: "Le TF-IDF (Term Frequency - Inverse Document Frequency) est une méthode statistique de pondération utilisée pour évaluer l'importance d'un mot dans un document relativement à un corpus entier. Contrairement à un simple comptage d'occurrences (Bag of Words), cette approche pénalise les mots très fréquents (comme les articles ou prépositions) et valorise les mots rares, souvent plus porteurs de sens pour différencier les documents."
math_theory: |
  Pour un terme $\textcolor{#10b981}{t}$ dans un document $\textcolor{#10b981}{d}$ au sein d'un corpus $D$, la pondération s'exprime comme $\text{TF-IDF}(\textcolor{#10b981}{t}, \textcolor{#10b981}{d}, D) = \textcolor{#3b82f6}{\text{tf}(\textcolor{#10b981}{t}, \textcolor{#10b981}{d})} \times \textcolor{#fbbf24}{\text{idf}(\textcolor{#10b981}{t}, D)}$. La fréquence du terme (TF) est souvent le comptage brut $\textcolor{#3b82f6}{f_{t,d}}$. L'Inverse Document Frequency (IDF) est calculé par $\textcolor{#fbbf24}{\text{idf}(\textcolor{#10b981}{t}, D)} = \log\left(\frac{\textcolor{#8b5cf6}{N}}{1 + |\{d \in D : \textcolor{#10b981}{t} \in d\}|}\right)$, où $\textcolor{#8b5cf6}{N}$ est le nombre total de documents dans $D$, et le dénominateur représente le nombre de documents contenant le terme $\textcolor{#10b981}{t}$. Le terme est lissé par l'ajout de $1$ pour éviter les divisions par zéro.
