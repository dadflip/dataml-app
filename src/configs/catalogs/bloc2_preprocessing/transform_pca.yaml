category: "4.1 Preprocessing"
tags: ["transform", "feature-engineering", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "À privilégier face à un grand nombre de variables hautement corrélées (multicolinéarité), pour accélérer l'entraînement d'algorithmes complexes, ou pour visualiser la structure de données massives en 2D ou 3D."
use_cases:
  - "Réduction de dimensionnalité de vecteurs de features très larges (ex: descripteurs d'images, expressions géniques)."
  - "Décorrélation de facteurs macro-économiques avant un modèle de régression."
pros:
  - "Atténue significativement les problèmes liés au fléau de la dimensionnalité."
  - "Supprime la multicolinéarité intrinsèque entre les caractéristiques d'entrée."
  - "Améliore l'efficacité computationnelle (réduction de la mémoire et accélération de l'entraînement)."
cons:
  - "Détruit l'interprétabilité des variables : les nouvelles composantes n'ont généralement aucune signification métier tangible."
  - "Sensible à la mise à l'échelle : nécessite impérativement une standardisation (StandardScaler) préalable des données."
hyperparameters:
  n_components: "Nombre composantes (ou % variance)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.decomposition import PCA
  from sklearn.compose import ColumnTransformer

  # [PARAM: N_COMPONENTS | string]
  N_COMPONENTS = "0.95"
  # [/PARAM]

  print("[TRANSFORM] PCA...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          n_comp = float(N_COMPONENTS) if "." in str(N_COMPONENTS) else int(N_COMPONENTS)
          pca = PCA(n_components=n_comp)
          
          ct = ColumnTransformer(
              [('pca', pca, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'pca'
          pipeline_steps[step_name] = (step_name, ct)
          
  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
