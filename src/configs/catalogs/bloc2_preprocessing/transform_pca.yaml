id: "transform_pca"
name: "Transform: PCA (Analyse Composantes Principales)"
description: "L'Analyse en Composantes Principales (PCA) est une technique de réduction de dimensionnalité non supervisée. Elle transforme un espace de variables potentiellement corrélées en un nouvel espace de variables orthogonales (et donc décorrélées) appelées composantes principales. Ces composantes sont ordonnées de manière à capturer séquentiellement la variance maximale du jeu de données. La PCA est couramment utilisée pour la compression d'information, la réduction du bruit, et la lutte contre le fléau de la dimensionnalité tout en conservant la majeure partie de la variance."
math_theory: |
  Soit $\textcolor{#3b82f6}{X} \in \mathbb{R}^{n \times p}$ une matrice de données préalablement centrée (moyenne nulle). La PCA repose sur la décomposition spectrale de la matrice de covariance :
  $$ \textcolor{#10b981}{C} = \frac{1}{n-1} \textcolor{#3b82f6}{X}^T \textcolor{#3b82f6}{X} $$
  En résolvant l'équation aux valeurs propres $\textcolor{#10b981}{C} v = \textcolor{#fbbf24}{\lambda} v$, on extrait les vecteurs propres $\textcolor{#8b5cf6}{V}$ (composantes principales) et leurs valeurs propres associées $\textcolor{#fbbf24}{\lambda}$ (variance expliquée).

  Les données projetées dans le nouvel espace s'obtiennent par $\textcolor{#ef4444}{Z} = \textcolor{#3b82f6}{X} \textcolor{#8b5cf6}{V_k}$, où $\textcolor{#8b5cf6}{V_k}$ regroupe les $k$ premiers vecteurs propres. Le ratio de variance expliquée par les $k$ composantes est :
  $$ \text{Var. expliquée} = \frac{\sum_{i=1}^{k} \textcolor{#fbbf24}{\lambda_i}}{\sum_{i=1}^{p} \textcolor{#fbbf24}{\lambda_i}} $$
