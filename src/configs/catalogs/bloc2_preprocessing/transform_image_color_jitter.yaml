id: "transform_image_color_jitter"
name: "Transform: Image Color Jitter"
description: "Technique de Data Augmentation qui modifie aléatoirement la luminosité, le contraste, la saturation et la teinte d'une image pour améliorer la robustesse du modèle."
math_theory: |
  Le Color Jitter applique des transformations stochastiques dans l'espace colorimétrique. Par exemple, pour la luminosité, si $\textcolor{#3b82f6}{I}$ est l'image originale (les valeurs des pixels), la nouvelle image $\textcolor{#10b981}{I'}$ est obtenue par : $$\textcolor{#10b981}{I'} = \textcolor{#fbbf24}{\alpha} \cdot \textcolor{#3b82f6}{I}$$ où $\textcolor{#fbbf24}{\alpha} \sim \mathcal{U}(1 - \text{jitter}, 1 + \text{jitter})$. Le contraste est ajusté en modulant l'écart à la moyenne de luminance de l'image. La saturation et la teinte (hue) sont souvent ajustées dans l'espace HSV, en perturbant le canal $\textcolor{#8b5cf6}{H}$ (teinte) par un décalage $\textcolor{#ef4444}{\Delta \theta} \sim \mathcal{U}(-\text{jitter}/2, \text{jitter}/2)$ et le canal $\textcolor{#fbbf24}{S}$ (saturation) par un facteur multiplicatif.
