category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "À utiliser lors de l'entraînement de modèles de vision par ordinateur pour les rendre invariants aux conditions d'éclairage et aux variations de colorimétrie environnementale."
use_cases:
  - "Classification d'images en extérieur où les conditions météorologiques ou l'heure de la journée modifient l'exposition."
  - "Reconnaissance d'objets sur des appareils avec différentes calibrations de capteurs photographiques."
pros:
  - "Augmente considérablement la capacité de généralisation du modèle en simulant divers environnements lumineux."
  - "Facilement paramétrable pour s'adapter à la distribution des données réelles (jitter_factor ajustable)."
cons:
  - "Peut détruire de l'information sémantique vitale si la couleur est l'unique caractéristique discriminante (ex: trier des citrons jaunes vs citrons verts)."
  - "L'application de transformations multiples ralentit la boucle de chargement des données si elle n'est pas correctement parallélisée."
hyperparameters:
  img_col: "Colonne images"
  jitter_factor: "Facteur"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]
  # [PARAM: JITTER_FACTOR | number]
  JITTER_FACTOR = 0.5
  # [/PARAM]

  print(f"[TRANSFORM] Application de Color Jitter sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def color_jitter_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          jitter = T.ColorJitter(brightness=JITTER_FACTOR, contrast=JITTER_FACTOR, 
                                 saturation=JITTER_FACTOR, hue=min(0.5, JITTER_FACTOR/2))
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: jitter(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(color_jitter_func)
      pipeline_steps['image_color_jitter'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Color Jitter appliqué avec succès.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

