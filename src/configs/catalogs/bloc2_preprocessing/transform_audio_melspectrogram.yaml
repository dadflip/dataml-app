id: "transform_audio_melspectrogram"
name: "Transform: Audio MelSpectrogram"
description: "Transforme un signal audio brut (waveform) en un Mel-spectrogramme, une représentation temps-fréquence adaptée à la perception auditive humaine en appliquant une échelle de Mel."
math_theory: |
  Le spectrogramme de Mel $\textcolor{#3b82f6}{M(f, t)}$ est obtenu en appliquant un banc de filtres triangulaires $\textcolor{#10b981}{H_m(k)}$ sur le spectre de puissance $\textcolor{#fbbf24}{|X(t, f)|^2}$ issu de la transformée de Fourier à court terme (STFT) : $$ \textcolor{#3b82f6}{M_m} = \log \left( \sum_{k} \textcolor{#fbbf24}{|X(k)|^2} \textcolor{#10b981}{H_m(k)} \right) $$
