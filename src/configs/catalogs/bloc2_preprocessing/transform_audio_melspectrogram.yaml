code_template: |
  import pandas as pd
  import torch
  from sklearn.preprocessing import FunctionTransformer
  try:
      import torchaudio.transforms as AT
  except ImportError:
      AT = None
      print("[ERREUR] Installez torchaudio: pip install torchaudio")

  # [PARAM: AUDIO_COL | string]
  AUDIO_COL = "waveform"
  # [/PARAM]

  print(f"[TRANSFORM] Application de MelSpectrogram sur '{AUDIO_COL}'...")
  if 'df' in locals() and AT is not None:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def melspectrogram_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          if AUDIO_COL in X_df.columns:
              melspec = AT.MelSpectrogram()
              X_df[AUDIO_COL] = X_df[AUDIO_COL].apply(
                  lambda x: melspec(x) if isinstance(x, torch.Tensor) else x
              )
          return X_df

      transformer = FunctionTransformer(melspectrogram_func)
      pipeline_steps['audio_melspectrogram'] = transformer
      df = transformer.fit_transform(df)
      print("[TRANSFORM] MelSpectrogram appliqué avec succès.")
  elif AT is None:
      print("[AVERTISSEMENT] torchaudio n'est pas installé, transformation ignorée.")

