id: "transform_power_transformer"
name: "Transform: Yeo-Johnson (Power Transformer)"
description: "Applique une transformation de puissance (Yeo-Johnson ou Box-Cox) pour rendre la distribution de chaque variable numérique aussi proche que possible d'une gaussienne. Cela est crucial pour les algorithmes qui supposent la normalité des données (régression linéaire, LDA, tests statistiques)."
math_theory: |
  La transformation de Yeo-Johnson est définie par morceaux selon le signe de $\textcolor{#3b82f6}{x}$ :
  $$ \psi(\textcolor{#3b82f6}{x}, \textcolor{#10b981}{\lambda}) = \begin{cases} \frac{(\textcolor{#3b82f6}{x}+1)^{\textcolor{#10b981}{\lambda}} - 1}{\textcolor{#10b981}{\lambda}} & \text{si } \textcolor{#10b981}{\lambda} \neq 0, \textcolor{#3b82f6}{x} \geq 0 \\ \ln(\textcolor{#3b82f6}{x}+1) & \text{si } \textcolor{#10b981}{\lambda} = 0, \textcolor{#3b82f6}{x} \geq 0 \\ -\frac{(-\textcolor{#3b82f6}{x}+1)^{2-\textcolor{#10b981}{\lambda}} - 1}{2-\textcolor{#10b981}{\lambda}} & \text{si } \textcolor{#10b981}{\lambda} \neq 2, \textcolor{#3b82f6}{x} < 0 \\ -\ln(-\textcolor{#3b82f6}{x}+1) & \text{si } \textcolor{#10b981}{\lambda} = 2, \textcolor{#3b82f6}{x} < 0 \end{cases} $$
  Le parametre optimal $\textcolor{#fbbf24}{\hat{\lambda}}$ est estime par maximum de vraisemblance en maximisant la log-vraisemblance de la distribution transformee sous l'hypothese de normalite.
  Contrairement a Box-Cox (qui necessite $\textcolor{#3b82f6}{x} > 0$), Yeo-Johnson gere nativement les valeurs negatives et nulles.
