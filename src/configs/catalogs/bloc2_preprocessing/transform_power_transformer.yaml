id: "transform_power_transformer"
name: "Transform: Yeo-Johnson (Power Transformer)"
description: "Rend les distributions gaussiennes."
category: "4.1 Preprocessing"
tags: ["transform", "scaling", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Asymétrie positive ou négative."
pros:
  - "Gère les valeurs négatives (Yeo-Johnson)."
cons:
  - "Calcul lourd."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import PowerTransformer
  from sklearn.compose import ColumnTransformer

  print("[TRANSFORM] PowerTransformer (Yeo-Johnson)...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          pt = PowerTransformer(method='yeo-johnson')
          ct = ColumnTransformer(
              [('pt', pt, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'power_transform'
          pipeline_steps[step_name] = (step_name, ct)
          
          df = pd.DataFrame(ct.fit_transform(df), columns=df.columns, index=df.index)
          print("[TRANSFORM] PowerTransformer ajouté au pipeline.")
      else:
          print("[TRANSFORM] Aucune colonne numérique.")
  else:
      print("[ERREUR] 'df' introuvable.")
