category: "4.1 Preprocessing"
tags: ["transform", "scaling", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "A utiliser lorsque vos variables presentent une forte asymetrie (skewness) positive ou negative, et que votre modele suppose la normalite des distributions (regression lineaire, analyse discriminante)."
use_cases:
  - "Normalisation de variables financieres fortement asymetriques (revenus, montants de transactions)."
  - "Preparation de donnees pour une Analyse en Composantes Principales (ACP) ou un test statistique parametrique."
  - "Amelioration des performances d'un modele de regression lineaire sur des donnees a distribution en L."
pros:
  - "Gere nativement les valeurs negatives et nulles (contrairement a Box-Cox)."
  - "Estimation automatique du parametre lambda optimal par maximum de vraisemblance."
  - "Ameliore significativement les performances des modeles qui supposent la normalite."
cons:
  - "Calcul plus lourd que StandardScaler ou MinMaxScaler."
  - "La transformation inverse peut etre imprecise pour des valeurs extremes."
  - "Peut ne pas fonctionner si la distribution est multimodale."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import PowerTransformer
  from sklearn.compose import ColumnTransformer

  print("[TRANSFORM] PowerTransformer (Yeo-Johnson)...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          pt = PowerTransformer(method='yeo-johnson')
          ct = ColumnTransformer(
              [('pt', pt, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'power_transform'
          pipeline_steps[step_name] = (step_name, ct)
          
  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
