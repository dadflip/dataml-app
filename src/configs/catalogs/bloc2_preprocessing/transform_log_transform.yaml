category: "4.1 Preprocessing"
tags: ["transform", "scaling", "tabular", "numpy", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Essentiel pour le traitement de variables financières, de comptages, ou toute caractéristique présentant une forte asymétrie vers la droite (skewness) avec une longue traîne. À utiliser avant l'application de modèles linéaires qui présupposent la normalité des résidus."
use_cases:
  - "Transformation de variables monétaires (salaires, prix, revenus)."
  - "Lissage de métriques comportementales asymétriques (nombre de clics, nombre de vues)."
pros:
  - "Réduit significativement la sensibilité du modèle aux valeurs aberrantes extrêmes."
  - "Convertit les relations multiplicatives (exponentielles) en relations additives, facilitant la modélisation linéaire."
  - "Gère proprement les valeurs nulles grâce à l'ajout de la constante $1$."
cons:
  - "Strictement inapplicable aux valeurs fortement négatives ($x \\le -1$)."
  - "Rend l'interprétation directe des coefficients du modèle moins intuitive par rapport à l'échelle d'origine."
hyperparameters:
  columns: "Colonnes à transformer (séparées par virgule)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import FunctionTransformer
  from sklearn.compose import ColumnTransformer

  # [PARAM: COLUMNS | string]
  COLUMNS = ""
  # [/PARAM]

  print(f"[TRANSFORM] Log Transform (log1p) sur: {COLUMNS}...")
  if 'df' in locals() and COLUMNS.strip():
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      cols_to_log = [c.strip() for c in COLUMNS.split(",") if c.strip() in df.columns]
      
      if cols_to_log:
          log_transformer = FunctionTransformer(np.log1p, validate=False)
          
          ct = ColumnTransformer(
              [('log1p', log_transformer, cols_to_log)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          pipeline_steps['log_transform'] = ct
          
          res = ct.fit_transform(df)
          if isinstance(res, np.ndarray):
              df = pd.DataFrame(res, columns=ct.get_feature_names_out())
          else:
              df = res
              
          print(f"[TRANSFORM] Log Transform appliqué sur {len(cols_to_log)} colonnes.")
      else:
          print("[AVERTISSEMENT] Aucune des colonnes spécifiées n'existe dans df.")

