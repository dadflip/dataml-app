id: "transform_log_transform"
name: "Transform: Log Transform (log1p)"
description: "La transformation logarithmique (via la fonction log1p) applique un logarithme naturel incrémenté de 1 aux valeurs numériques. Cette méthode est extrêmement puissante pour atténuer l'impact des valeurs aberrantes (outliers) et stabiliser la variance des variables présentant une asymétrie positive forte. Elle permet souvent de rapprocher la distribution empirique des données vers une forme s'apparentant à une distribution normale, ce qui facilite grandement l'apprentissage des algorithmes linéaires."
math_theory: |
  La transformation log1p est définie par la fonction $\textcolor{#3b82f6}{f(x)} = \ln(1 + \textcolor{#10b981}{x})$. Cette formulation mathématique garantit que la fonction reste définie et retourne $0$ lorsque $\textcolor{#10b981}{x} = 0$, résolvant ainsi le problème du logarithme standard $\ln(0)$ qui tend vers $-\infty$. Elle requiert néanmoins que le domaine de définition soit restreint aux réels $\textcolor{#10b981}{x} > -1$.
