id: "transform_knn_imputer"
name: "Transform: KNN Imputer"
description: "Remplace les valeurs manquantes en se basant sur les K plus proches voisins."
category: "4.1 Preprocessing"
tags: ["transform", "imputation", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Quand on veut une imputation précise."
pros:
  - "Souvent de bien meilleures performances prédictives."
cons:
  - "Coûteux en calcul."
hyperparameters:
  n_neighbors: "Nombre de voisins (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.impute import KNNImputer
  from sklearn.compose import ColumnTransformer

  # [PARAM: N_NEIGHBORS | int]
  N_NEIGHBORS = 5
  # [/PARAM]

  print("[TRANSFORM] KNNImputer...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      
      if len(num_cols) > 0:
          ct = ColumnTransformer(
              [('knn', KNNImputer(n_neighbors=N_NEIGHBORS), num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'knn_imputer'
          pipeline_steps[step_name] = (step_name, ct)
          
          df = pd.DataFrame(ct.fit_transform(df), columns=df.columns, index=df.index)
          print(f"[TRANSFORM] Imputation KNN ({N_NEIGHBORS} voisins) ajoutée au pipeline.")
      else:
          print("[TRANSFORM] Aucune colonne numérique à imputer.")
  else:
      print("[ERREUR] 'df' introuvable.")
_metadata:
  bloc: 2
  section: "4_preprocessing"
