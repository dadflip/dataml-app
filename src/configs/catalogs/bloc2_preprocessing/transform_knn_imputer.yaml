id: "transform_knn_imputer"
name: "Transform: KNN Imputer"
description: "Remplace les valeurs manquantes (NaN) en imputant la valeur moyenne estimée à partir des K plus proches voisins (KNN). Cette méthode exploite la similarité entre les individus dans l'espace des descripteurs pour inférer la valeur la plus probable pour la donnée manquante."
math_theory: |
  Pour une observation $x_i$ avec une caractéristique $j$ manquante (i.e. $x_{ij}$ est NaN), l'imputateur KNN recherche l'ensemble $\mathcal{N}_{\textcolor{#fbbf24}{K}}(x_i)$ des $\textcolor{#fbbf24}{K}$ voisins les plus proches qui possèdent une valeur observée pour la caractéristique $j$.
  La distance utilisée pour trouver les voisins ignore les valeurs manquantes via une métrique de distance euclidienne pondérée ou ignorante (NaN-Euclidean distance) :
  $$ \textcolor{#3b82f6}{d_{nan}}(x, y) = \sqrt{\frac{\textcolor{#8b5cf6}{D}}{\textcolor{#8b5cf6}{D_{valide}}} \sum_{d \in V} (x_d - y_d)^2} $$
  où $V$ est l'ensemble des dimensions non manquantes à la fois pour $x$ et $y$, $\textcolor{#8b5cf6}{D}$ est le nombre total de dimensions, et $\textcolor{#8b5cf6}{D_{valide}}$ la taille de $V$.
  La valeur imputée est la moyenne de la caractéristique $j$ sur ces voisins, pondérée ou non :
  $$ \textcolor{#10b981}{\hat{x}_{ij}} = \frac{1}{\textcolor{#fbbf24}{K}} \sum_{k \in \mathcal{N}_{\textcolor{#fbbf24}{K}}(x_i)} x_{kj} $$
