category: "4.1 Preprocessing"
tags: ["transform", "imputation", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Privilégier cette approche lorsque les relations entre les différentes variables sont fortes (multivariées) et que la simple imputation par la moyenne (univariée) détruirait la variance naturelle ou la corrélation structurelle des données."
use_cases:
  - "Nettoyage de bases de données médicales où les paramètres des patients sont intrinsèquement corrélés (ex: âge, IMC, tension)."
  - "Prétraitement de données de capteurs IoT avec des pannes occasionnelles."
pros:
  - "Préserve la distribution et les corrélations multivariées mieux que l'imputation par moyenne/médiane univariée."
  - "Conduit fréquemment à de meilleures performances sur les modèles prédictifs avals."
cons:
  - 'La complexité temporelle de la recherche des voisins O(N²) rend cette méthode très lente et coûteuse sur les grands jeux de données.'
  - 'Sensible au fléau de la dimensionnalité (Curse of Dimensionality) si le jeu de données a de très nombreuses variables.'
hyperparameters:
  n_neighbors: "Nombre de voisins (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.impute import KNNImputer
  from sklearn.compose import ColumnTransformer

  # [PARAM: N_NEIGHBORS | int]
  N_NEIGHBORS = 5
  # [/PARAM]

  print("[TRANSFORM] KNNImputer...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      
      if len(num_cols) > 0:
          ct = ColumnTransformer(
              [('knn', KNNImputer(n_neighbors=N_NEIGHBORS), num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'knn_imputer'
          pipeline_steps[step_name] = ct
          
          res = ct.fit_transform(df)
          if isinstance(res, np.ndarray):
              df = pd.DataFrame(res, columns=ct.get_feature_names_out())
          else:
              df = res
              
          print(f"[TRANSFORM] KNNImputer appliqué sur {len(num_cols)} colonnes numériques.")
      else:
          print("[AVERTISSEMENT] Aucune colonne numérique à imputer.")

