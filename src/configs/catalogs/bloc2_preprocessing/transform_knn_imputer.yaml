id: "transform_knn_imputer"
name: "Transform: KNN Imputer"
description: "Remplace les valeurs manquantes en se basant sur les K plus proches voisins."
category: "4.1 Preprocessing"
tags: ["transform", "imputation", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Quand on veut une imputation précise."
pros:
  - "Souvent de bien meilleures performances prédictives."
cons:
  - "Coûteux en calcul."
hyperparameters:
  n_neighbors: "Nombre de voisins (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.impute import KNNImputer
  from sklearn.compose import ColumnTransformer

  # [PARAM: N_NEIGHBORS | int]
  N_NEIGHBORS = 5
  # [/PARAM]

  print("[TRANSFORM] KNNImputer...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      
      if len(num_cols) > 0:
          ct = ColumnTransformer(
              [('knn', KNNImputer(n_neighbors=N_NEIGHBORS), num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'knn_imputer'
          pipeline_steps[step_name] = ct
          
          res = ct.fit_transform(df)
          if isinstance(res, np.ndarray):
              df = pd.DataFrame(res, columns=ct.get_feature_names_out())
          else:
              df = res
              
          print(f"[TRANSFORM] KNNImputer appliqué sur {len(num_cols)} colonnes numériques.")
      else:
          print("[AVERTISSEMENT] Aucune colonne numérique à imputer.")

illustration_mermaid: |
  graph TD
    A[Input DataFrame] --> B[Extract Numeric Columns]
    B --> C{Any Numeric Cols?}
    C -- Yes --> D[Initialize KNNImputer]
    C -- No --> E[Skip]
    D --> F[ColumnTransformer with remainder='passthrough']
    F --> G[Fit & Transform df]
    G --> H[Convert Output to DataFrame]
    H --> I[Update pipeline_steps & df]
    E --> I
    I --> J[Imputed DataFrame]
    style A fill:#eff6ff,stroke:#94a3b8,stroke-width:2px
    style J fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

