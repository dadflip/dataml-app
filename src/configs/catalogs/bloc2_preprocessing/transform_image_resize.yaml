id: "transform_image_resize"
name: "Transform: Image Resize"
description: "Redimensionne uniformément les images à une taille spécifique (hauteur et largeur) en utilisant des algorithmes d'interpolation. C'est une étape de standardisation essentielle car les réseaux de neurones (comme les CNN) exigent généralement des tenseurs d'entrée de dimensions fixes."
math_theory: |
  Le redimensionnement d'une image $I$ de dimensions $\textcolor{#3b82f6}{H_{in}} \times \textcolor{#3b82f6}{W_{in}}$ vers une nouvelle taille $\textcolor{#10b981}{H_{out}} \times \textcolor{#10b981}{W_{out}}$ se fait souvent par interpolation bilinéaire.
  Pour trouver la valeur d'un pixel cible aux coordonnées $(x, y)$, on le mappe vers les coordonnées fractionnaires de l'image source :
  $$ x_{src} = x \cdot \frac{\textcolor{#3b82f6}{W_{in}}}{\textcolor{#10b981}{W_{out}}}, \quad y_{src} = y \cdot \frac{\textcolor{#3b82f6}{H_{in}}}{\textcolor{#10b981}{H_{out}}} $$
  La valeur est ensuite calculée comme une somme pondérée des 4 pixels voisins les plus proches :
  $$ \textcolor{#10b981}{I_{out}}(x, y) = \sum_{i=0}^1 \sum_{j=0}^1 w_{ij} \cdot \textcolor{#3b82f6}{I_{in}}(\lfloor x_{src} \rfloor + i, \lfloor y_{src} \rfloor + j) $$
  où les poids $w_{ij}$ dépendent des distances fractionnaires aux voisins.
