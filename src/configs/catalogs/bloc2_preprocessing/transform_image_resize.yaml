id: "transform_image_resize"
name: "Transform: Image Resize"
description: "Redimensionne les images (PIL)."
category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Forcer la même taille."
pros:
  - "Standardise la taille."
cons:
  - "Déforme l'image."
hyperparameters:
  img_col: "Colonne images"
  size: "Taille"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]

  # [PARAM: SIZE | number]
  SIZE = 256
  # [/PARAM]

  # [PARAM: CROP_SIZE | number]
  CROP_SIZE = 224
  # [/PARAM]

  print(f"[TRANSFORM] Image Resize sur '{IMG_COL}'...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      if IMG_COL in df.columns:
          def resize_func(X):
              X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X
              tf = T.Compose([T.Resize(SIZE), T.CenterCrop(CROP_SIZE)])
              X_df[IMG_COL] = X_df[IMG_COL].apply(lambda x: tf(x) if isinstance(x, Image.Image) else x)
              return X_df

          transformer = FunctionTransformer(resize_func)
          
          step_name = 'image_resize'
          pipeline_steps[step_name] = (step_name, transformer)
          
          df = transformer.transform(df)
          print("[TRANSFORM] Resize appliqué.")
      else:
          print("[ERREUR] Colonne introuvable.")
  else:
      print("[ERREUR] 'df' introuvable.")
_metadata:
  bloc: 2
