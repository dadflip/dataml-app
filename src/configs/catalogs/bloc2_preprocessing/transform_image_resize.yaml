category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Obligatoire avant de regrouper (batcher) des images hétérogènes pour les passer dans un modèle de Deep Learning qui nécessite une taille d'entrée fixe (ex: 224x224 pour ResNet)."
use_cases:
  - "Préparation d'un dataset d'images de tailles variables issues du web."
  - "Réduction de la résolution globale pour accélérer les temps d'entraînement et réduire l'empreinte mémoire."
pros:
  - "Standardise le format des données pour permettre le calcul vectorisé par batch."
  - "Permet de contrôler le compromis entre résolution spatiale et consommation mémoire."
cons:
  - "Si le ratio d'aspect initial n'est pas respecté, cela crée des déformations (étirement/écrasement) qui peuvent perturber le modèle."
  - "Une réduction drastique de taille détruit des détails fins (haute fréquence)."
hyperparameters:
  img_col: "Colonne images"
  size: "Taille"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]
  # [PARAM: SIZE | number]
  SIZE = 224
  # [/PARAM]

  print(f"[TRANSFORM] Redimensionnement d'images ({SIZE}x{SIZE}) sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def image_resize_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          resize_op = T.Resize((SIZE, SIZE))
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: resize_op(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(image_resize_func)
      pipeline_steps['image_resize'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Images redimensionnées.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

