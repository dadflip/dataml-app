id: "transform_image_resize"
name: "Transform: Image Resize"
description: "Redimensionne les images (PIL)."
category: "4.1 Preprocessing"
tags: ["transform", "image", "multimedia", "torchvision", "pipeline"]
applies_to: ["Images"]
when_to_use: "Forcer la même taille."
pros:
  - "Standardise la taille."
cons:
  - "Déforme l'image."
hyperparameters:
  img_col: "Colonne images"
  size: "Taille"
code_template: |
  import pandas as pd
  import torchvision.transforms as T
  from PIL import Image
  from sklearn.preprocessing import FunctionTransformer

  # [PARAM: IMG_COL | string]
  IMG_COL = "image"
  # [/PARAM]
  # [PARAM: SIZE | number]
  SIZE = 224
  # [/PARAM]

  print(f"[TRANSFORM] Redimensionnement d'images ({SIZE}x{SIZE}) sur '{IMG_COL}'...")
  if 'df' in locals() and IMG_COL in df.columns:
      if 'pipeline_steps' not in locals():
          pipeline_steps = {}
          
      def image_resize_func(X):
          X_df = pd.DataFrame(X) if not isinstance(X, pd.DataFrame) else X.copy()
          resize_op = T.Resize((SIZE, SIZE))
          X_df[IMG_COL] = X_df[IMG_COL].apply(
              lambda x: resize_op(x) if isinstance(x, Image.Image) else x
          )
          return X_df

      transformer = FunctionTransformer(image_resize_func)
      pipeline_steps['image_resize'] = transformer
      df = transformer.fit_transform(df)
      print(f"[TRANSFORM] Images redimensionnées.")
  else:
      print(f"[AVERTISSEMENT] Colonne '{IMG_COL}' introuvable.")

illustration_mermaid: |
  graph TD
    A[Image DataFrame] --> B{Does IMG_COL exist?}
    B -- Yes --> C[Initialize T.Resize with SIZE]
    B -- No --> D[Skip and Warn]
    C --> E[Apply resize to each PIL Image]
    E --> F[Update pipeline_steps & df]
    D --> F
    F --> G[Resized Images]
    style A fill:#eff6ff,stroke:#94a3b8,stroke-width:2px
    style G fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

