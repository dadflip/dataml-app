category: "4.1 Preprocessing"
tags: ["transform", "scaling", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "A utiliser systematiquement avant tout modele sensible a l'echelle des variables : reseaux de neurones, SVM, KNN, regression logistique avec regularisation, ACP."
use_cases:
  - "Normalisation des features avant un reseau de neurones pour accelerer la convergence de la descente de gradient."
  - "Mise a l'echelle avant un SVM a noyau RBF (tres sensible aux differences d'echelle)."
  - "Preparation des donnees pour une Analyse en Composantes Principales (ACP)."
pros:
  - "Accelere significativement la convergence des algorithmes d'optimisation (descente de gradient)."
  - "Indispensable pour les algorithmes bases sur la distance (KNN, K-Means, SVM)."
  - "Integre nativement au pipeline sklearn, tres simple a deployer."
cons:
  - "Tres sensible aux valeurs aberrantes (outliers) qui deforment la moyenne et l'ecart-type."
  - "Suppose implicitement que les donnees suivent une distribution approximativement gaussienne."
  - "Ne borne pas les valeurs dans un intervalle fixe (contrairement a MinMaxScaler)."
hyperparameters:
  with_mean: "Centrer les donnees."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import StandardScaler
  from sklearn.compose import ColumnTransformer

  # [PARAM: WITH_MEAN | boolean]
  WITH_MEAN = True
  # [/PARAM]

  print("[TRANSFORM] StandardScaler...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          scaler = StandardScaler(with_mean=WITH_MEAN)
          ct = ColumnTransformer(
              [('std_scaler', scaler, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'standard_scaler'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
