id: "transform_standard_scaler"
name: "Transform: Standard Scaler"
description: "Centre et reduit les variables numeriques en appliquant la standardisation Z-score. Chaque variable est transformee pour avoir une moyenne de 0 et un ecart-type de 1. C'est l'etape de preprocessing la plus courante pour les algorithmes sensibles a l'echelle des donnees."
math_theory: |
  Pour chaque variable \textcolor{#fbbf24}{x_j}, la standardisation (Z-score) est definie par :
  $$ \textcolor{#10b981}{z_{ij}} = \frac{\textcolor{#fbbf24}{x_{ij}} - \textcolor{#3b82f6}{\mu_j}}{\textcolor{#8b5cf6}{\sigma_j}} $$
  ou $\textcolor{#3b82f6}{\mu_j} = \frac{1}{N} \sum_{i=1}^{N} \textcolor{#fbbf24}{x_{ij}}$ est la moyenne et $\textcolor{#8b5cf6}{\sigma_j} = \sqrt{\frac{1}{N} \sum_{i=1}^{N} (\textcolor{#fbbf24}{x_{ij}} - \textcolor{#3b82f6}{\mu_j})^2}$ est l'ecart-type de la variable $j$.

  Apres transformation : $\mathbb{E}[\textcolor{#10b981}{z_j}] = 0$ et $\text{Var}(\textcolor{#10b981}{z_j}) = 1$.
  Cette transformation est essentielle pour les algorithmes bases sur la distance (KNN, SVM, K-Means) et ceux utilisant la descente de gradient (reseaux de neurones, regression logistique), car elle place toutes les variables sur la meme echelle.
