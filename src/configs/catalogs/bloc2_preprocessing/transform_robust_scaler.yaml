id: "transform_robust_scaler"
name: "Transform: Robust Scaler"
description: "Met a l'echelle les variables numeriques en utilisant la mediane et l'ecart interquartile (IQR) au lieu de la moyenne et l'ecart-type. Cette methode est beaucoup plus resistante aux valeurs aberrantes (outliers) que le StandardScaler, car la mediane et l'IQR ne sont pas sensibles aux valeurs extremes."
math_theory: |
  Pour chaque variable $\textcolor{#3b82f6}{x_j}$, la transformation est definie par :
  $$ x'_{ij} = \frac{x_{ij} - \textcolor{#10b981}{Q_2(x_j)}}{\textcolor{#fbbf24}{Q_3(x_j)} - \textcolor{#fbbf24}{Q_1(x_j)}} = \frac{x_{ij} - \textcolor{#10b981}{\text{mediane}(x_j)}}{\textcolor{#fbbf24}{\text{IQR}(x_j)}} $$
  ou $\textcolor{#fbbf24}{Q_1}$, $\textcolor{#10b981}{Q_2}$, $\textcolor{#fbbf24}{Q_3}$ sont respectivement le premier quartile (25e percentile), la mediane (50e percentile) et le troisieme quartile (75e percentile).
  L'\textcolor{#fbbf24}{IQR} (Interquartile Range) = $\textcolor{#fbbf24}{Q_3} - \textcolor{#fbbf24}{Q_1}$ mesure la dispersion des 50% centraux des donnees, ignorant completement les queues de distribution (\textcolor{#ef4444}{outliers}).
  Apres transformation, la mediane vaut 0 et l'IQR vaut 1, mais les valeurs ne sont pas bornees dans un intervalle fixe.
