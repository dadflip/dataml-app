category: "4.1 Preprocessing"
tags: ["transform", "scaling", "tabular", "sklearn", "pipeline"]
applies_to: ["Tabulaire"]
when_to_use: "Privilegier cette methode lorsque vos donnees contiennent de nombreuses valeurs aberrantes (outliers) qui fausseraient la mise a l'echelle par StandardScaler ou MinMaxScaler."
use_cases:
  - "Normalisation de donnees financieres avec des transactions extremes (fraude, montants exceptionnels)."
  - "Preprocessing de donnees de capteurs avec des pics de bruit sporadiques."
  - "Mise a l'echelle de donnees medicales ou les valeurs atypiques sont frequentes (ex: taux sanguins)."
pros:
  - "Tres robuste face aux valeurs aberrantes grace a l'utilisation de la mediane et de l'IQR."
  - "Ne modifie pas la forme de la distribution des donnees."
  - "Compatible avec le pipeline sklearn pour un deploiement reproductible."
cons:
  - "Ne borne pas les valeurs dans un intervalle strict comme MinMaxScaler."
  - "Peut etre moins adapte si les donnees suivent une distribution gaussienne sans outliers (StandardScaler serait preferable)."
  - "La notion de robustesse diminue si plus de 50% des donnees sont aberrantes."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import RobustScaler
  from sklearn.compose import ColumnTransformer

  print("[TRANSFORM] RobustScaler...")
  if 'df' in locals():
      if 'pipeline_steps' not in locals(): pipeline_steps = {}
      
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if 'target_name' in locals() and target_name in num_cols:
          num_cols.remove(target_name)
          
      if len(num_cols) > 0:
          scaler = RobustScaler()
          ct = ColumnTransformer(
              [('rob_scaler', scaler, num_cols)],
              remainder='passthrough', verbose_feature_names_out=False
          )
          try: ct.set_output(transform="pandas")
          except: pass
          
          step_name = 'robust_scaler'
          pipeline_steps[step_name] = (step_name, ct)

  if 'X_train' not in locals(): X_train = None
  if 'X_test' not in locals(): X_test = None
  if 'y_train' not in locals(): y_train = None
  if 'y_test' not in locals(): y_test = None
  if 'preprocessor' not in locals(): preprocessor = None
  if 'feature_names_out' not in locals(): feature_names_out = None
  if 'task_type' not in locals(): task_type = "classification"
  if 'meta' not in locals(): meta = {}
