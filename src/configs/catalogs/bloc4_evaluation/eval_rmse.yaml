id: "eval_rmse"
name: "Eval: Root Mean Squared Error (RMSE)"
description: >
  Calcule la racine de l'erreur quadratique moyenne (RMSE) entre les valeurs reelles
  et les predictions. Le RMSE est exprime dans la meme unite que la variable cible,
  ce qui le rend plus interpretable que le MSE.
category: "Metriques de Regression"
tags: ["eval", "regression", "rmse", "erreur", "metrique"]
applies_to: ["Regression"]
when_to_use: >
  Utiliser lorsque l'on souhaite une mesure d'erreur interpretable dans la meme unite
  que la variable cible, tout en penalisant les grandes erreurs.
pros:
  - "Meme unite que la variable cible, donc facilement interpretable"
  - "Penalise les grandes erreurs plus que le MAE"
  - "Metrique standard pour les competitions et benchmarks"
cons:
  - "Sensible aux valeurs aberrantes (outliers)"
  - "Ne permet pas de comparer des modeles sur des echelles differentes"
  - "Moins robuste que le MAE face aux distributions asymetriques"
code_template: |
  evaluation_metrics = {}
  try:
      from sklearn.metrics import mean_squared_error
      import numpy as np

      print("[EVAL] Calcul du Root Mean Squared Error (RMSE)...")

      mse_value = mean_squared_error(y_test, y_pred)
      rmse_value = np.sqrt(mse_value)

      evaluation_metrics["rmse"] = float(rmse_value)
      evaluation_metrics["mse"] = float(mse_value)

      print(f"[EVAL] RMSE = {rmse_value:.6f}")

  except Exception as e:
      print(f"[EVAL] Erreur lors du calcul du RMSE : {e}")
      evaluation_metrics["rmse"] = None
      evaluation_metrics["error"] = str(e)
