id: "eval_reconstruction_error"
name: "Eval: Erreur de Reconstruction Moyenne"
description: "Calcule l'erreur de reconstruction moyenne (MSE, MAE) entre les donnees originales et reconstruites. Metrique fondamentale pour evaluer les autoencoders et modeles generatifs a reconstruction."
category: "Generative Models"
tags: ["eval", "reconstruction", "autoencoder", "generative", "mse", "mae"]
applies_to: ["Generative", "Autoencoder", "Regression"]
when_to_use: "Lorsqu'on evalue un autoencoder, VAE ou tout modele generatif base sur la reconstruction. y_test contient les donnees originales et y_pred les reconstructions."
pros:
  - "Metrique simple et directe pour les modeles a reconstruction"
  - "MSE et MAE couvrent differents aspects de la qualite"
  - "La distribution des erreurs revele les outliers et modes de defaillance"
cons:
  - "Ne capture pas la qualite perceptuelle (images floues peuvent avoir un bon MSE)"
  - "Necessite que y_test et y_pred aient la meme dimensionnalite"
  - "Non applicable aux modeles generatifs sans reconstruction (GAN pur)"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  try:
      y_true = np.array(y_test, dtype=np.float64)
      y_p = np.array(y_pred, dtype=np.float64)

      if y_true.shape != y_p.shape:
          print(f"[EVAL] Shapes incompatibles: y_test={y_true.shape}, y_pred={y_p.shape}")
          evaluation_metrics["status"] = "error"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

