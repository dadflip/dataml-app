id: "eval_bleu_score"
name: "Eval: Score BLEU"
description: "Calcule le score BLEU (Bilingual Evaluation Understudy) pour evaluer la qualite de sequences generees en NLP. Compare les n-grammes entre les textes de reference et generes."
category: "Generative Models"
tags: ["eval", "bleu", "nlp", "text_generation", "translation", "sequence"]
applies_to: ["NLP", "Text Generation", "Translation"]
when_to_use: "Pour evaluer la qualite de traductions automatiques, de texte genere, ou de tout systeme produisant des sequences de tokens. y_test contient les references, y_pred les predictions (listes de tokens ou chaines de caracteres)."
pros:
  - "Metrique standard en traduction automatique et generation de texte"
  - "Calcul rapide base sur le recouvrement de n-grammes"
  - "Score corpus-level et par echantillon disponibles"
cons:
  - "Ne capture pas le sens semantique ni la fluence"
  - "Penalise les paraphrases valides"
  - "Necessite nltk pour l'implementation standard (fallback disponible)"
code_template: |
  import numpy as np
  from collections import Counter

  evaluation_metrics = {}

  try:
      # Ensure y_test and y_pred are sequences (list of strings or list of token lists)
      y_ref = list(y_test)
      y_hyp = list(y_pred)

      if len(y_ref) != len(y_hyp):
          print(f"[EVAL] BLEU: longueurs differentes: {len(y_ref)} refs vs {len(y_hyp)} hyps")
          evaluation_metrics["status"] = "error"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

