id: "eval_multiclass_confusion_heatmap"
name: "Eval: Matrice de Confusion Heatmap"
description: "Affiche une matrice de confusion sous forme de heatmap Seaborn avec annotations (comptages et pourcentages). Adaptee pour la classification binaire et multiclasse."
category: "Classification Diagnostics"
tags: ["eval", "confusion_matrix", "heatmap", "classification", "seaborn", "plot", "matplotlib"]
applies_to: ["Classification"]
when_to_use: "Pour visualiser en detail les erreurs de classification par classe. La heatmap est plus lisible que la matrice brute, surtout avec de nombreuses classes."
pros:
  - "Visualisation claire des confusions inter-classes"
  - "Annotations avec comptages et pourcentages pour une lecture complete"
  - "Fonctionne en binaire et multiclasse"
cons:
  - "Necessite seaborn"
  - "Peut devenir difficile a lire avec un tres grand nombre de classes (>20)"
  - "Ne fonctionne qu'en classification"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  if task_type not in ("classification", "binary", "multiclass"):
      print("[EVAL] Matrice de confusion heatmap: classification uniquement.")
      evaluation_metrics["status"] = "skipped"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

_metadata:
  bloc: 4
  section: "1_evaluation"
