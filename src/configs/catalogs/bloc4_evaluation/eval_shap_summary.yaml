id: "eval_shap_summary"
name: "Eval: SHAP Summary Plot"
description: "Genere un graphique SHAP summary montrant la contribution de chaque variable aux predictions. Utilise TreeExplainer si possible, sinon KernelExplainer en fallback."
category: "Interpretabilite"
tags: ["eval", "shap", "interpretability", "features", "plot", "matplotlib"]
applies_to: ["Classification", "Regression"]
when_to_use: "Lorsqu'on veut comprendre finement comment chaque variable influence les predictions individuelles. Les SHAP values offrent des explications theoriquement fondees (theorie des jeux)."
pros:
  - "Explications locales et globales coherentes (valeurs de Shapley)"
  - "Visualisation riche montrant l'impact et la direction de chaque feature"
  - "Fondement theorique solide (theorie des jeux cooperatifs)"
cons:
  - "Necessite la bibliotheque shap (pip install shap)"
  - "KernelExplainer peut etre tres lent sur de grands datasets"
  - "Necessite X_test en plus des variables du contrat"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  try:
      import shap
  except ImportError:
      print("[EVAL] Bibliotheque 'shap' non installee. pip install shap")
      evaluation_metrics["status"] = "skipped"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

