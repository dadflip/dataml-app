id: "eval_shap_summary"
name: "Eval: SHAP Summary Plot"
description: "Genere un graphique SHAP summary montrant la contribution de chaque variable aux predictions. Utilise TreeExplainer si possible, sinon KernelExplainer en fallback."
category: "Interpretabilite"
tags: ["eval", "shap", "interpretability", "features", "plot", "matplotlib"]
applies_to: ["Classification", "Regression"]
when_to_use: "Lorsqu'on veut comprendre finement comment chaque variable influence les predictions individuelles. Les SHAP values offrent des explications theoriquement fondees (theorie des jeux)."
pros:
  - "Explications locales et globales coherentes (valeurs de Shapley)"
  - "Visualisation riche montrant l'impact et la direction de chaque feature"
  - "Fondement theorique solide (theorie des jeux cooperatifs)"
cons:
  - "Necessite la bibliotheque shap (pip install shap)"
  - "KernelExplainer peut etre tres lent sur de grands datasets"
  - "Necessite X_test en plus des variables du contrat"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  try:
      import shap
  except ImportError:
      print("[EVAL] Bibliotheque 'shap' non installee. pip install shap")
      evaluation_metrics["status"] = "skipped"
      evaluation_metrics["reason"] = "shap library not installed"
  else:
      try:
          if "X_test" not in dir() and "X_test" not in globals():
              print("[EVAL] X_test requis pour SHAP summary.")
              evaluation_metrics["status"] = "skipped"
              evaluation_metrics["reason"] = "X_test not available in scope"
          else:
              # Subsample for performance
              max_samples = 200
              if hasattr(X_test, "shape"):
                  n_samples = X_test.shape[0]
              else:
                  n_samples = len(X_test)

              if n_samples > max_samples:
                  idx = np.random.RandomState(42).choice(n_samples, max_samples, replace=False)
                  if hasattr(X_test, "iloc"):
                      X_sample = X_test.iloc[idx]
                  else:
                      X_sample = X_test[idx]
                  print(f"[EVAL] Sous-echantillonnage a {max_samples} observations pour SHAP.")
              else:
                  X_sample = X_test

              # Try to extract the final estimator from the pipeline
              estimator = full_pipeline
              if hasattr(full_pipeline, "named_steps"):
                  step_names = list(full_pipeline.named_steps.keys())
                  estimator = full_pipeline.named_steps[step_names[-1]]
              elif hasattr(full_pipeline, "steps"):
                  estimator = full_pipeline.steps[-1][1]

              # Try TreeExplainer first, then fallback to KernelExplainer
              explainer = None
              shap_values = None
              try:
                  explainer = shap.TreeExplainer(estimator)
                  # Transform X_sample through preprocessing steps
                  if hasattr(full_pipeline, "named_steps") and len(full_pipeline.steps) > 1:
                      from sklearn.pipeline import Pipeline
                      preprocess = Pipeline(full_pipeline.steps[:-1])
                      X_transformed = preprocess.transform(X_sample)
                  else:
                      X_transformed = X_sample
                  shap_values = explainer.shap_values(X_transformed)
                  print("[EVAL] TreeExplainer utilise.")
              except Exception:
                  print("[EVAL] TreeExplainer non applicable, fallback vers KernelExplainer...")
                  try:
                      bg = shap.sample(X_sample, min(50, len(X_sample)))
                      explainer = shap.KernelExplainer(full_pipeline.predict, bg)
                      X_transformed = X_sample
                      shap_values = explainer.shap_values(X_sample, nsamples=100)
                      print("[EVAL] KernelExplainer utilise.")
                  except Exception as inner_e:
                      raise RuntimeError(f"Aucun Explainer SHAP compatible: {inner_e}")

              # Plot
              fig, ax = plt.subplots(figsize=(10, 8))
              plt.sca(ax)

              if isinstance(shap_values, list):
                  # Multiclass: plot the first class
                  shap.summary_plot(shap_values[0], X_transformed, show=False, plot_size=None)
              else:
                  shap.summary_plot(shap_values, X_transformed, show=False, plot_size=None)

              plt.title("SHAP Summary Plot")
              plt.tight_layout()

              fig_path = "shap_summary.png"
              plt.savefig(fig_path, dpi=150, bbox_inches="tight")
              plt.close("all")
              print(f"[EVAL] Figure sauvegardee: {fig_path}")

              # Compute mean absolute SHAP values for top features
              if isinstance(shap_values, list):
                  sv = np.abs(np.array(shap_values[0]))
              else:
                  sv = np.abs(np.array(shap_values))
              mean_shap = sv.mean(axis=0)
              top_idx = np.argsort(mean_shap)[::-1][:10]

              try:
                  if hasattr(X_transformed, "columns"):
                      feat_names = X_transformed.columns.tolist()
                  else:
                      feat_names = [f"feature_{i}" for i in range(mean_shap.shape[0])]
              except Exception:
                  feat_names = [f"feature_{i}" for i in range(mean_shap.shape[0])]

              top_features = {}
              for i in top_idx:
                  top_features[str(feat_names[i])] = float(round(mean_shap[i], 6))

              evaluation_metrics["status"] = "success"
              evaluation_metrics["figure_path"] = fig_path
              evaluation_metrics["top_shap_features"] = top_features
              evaluation_metrics["n_samples_used"] = int(min(n_samples, max_samples))

      except Exception as e:
          print(f"[EVAL] Erreur SHAP summary: {e}")
          evaluation_metrics["status"] = "error"
          evaluation_metrics["error"] = str(e)
