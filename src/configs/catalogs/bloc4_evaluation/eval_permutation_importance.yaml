id: "eval_permutation_importance"
name: "Eval: Importance par Permutation"
description: "Calcule l'importance des features par permutation : mesure la degradation du score en melangeant chaque variable individuellement. Methode model-agnostic applicable a tout pipeline sklearn."
category: "Interpretabilite"
tags: ["eval", "permutation", "importance", "features", "interpretability"]
applies_to: ["Classification", "Regression"]
when_to_use: "Lorsqu'on veut connaitre l'importance relative des variables sans dependre de la structure interne du modele. Utile pour detecter les variables non informatives et simplifier le modele."
pros:
  - "Methode model-agnostic, fonctionne avec tout estimateur sklearn"
  - "Facile a interpreter : impact direct sur le score"
  - "Prend en compte les interactions implicitement (via le pipeline complet)"
cons:
  - "Peut etre lent si le dataset est volumineux (n_repeats permutations par feature)"
  - "Necessite X_test en plus des variables du contrat"
  - "Biaise si des features sont fortement correlees entre elles"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  try:
      from sklearn.inspection import permutation_importance

      # X_test must be available in scope
      if "X_test" not in dir() and "X_test" not in globals():
          print("[EVAL] X_test requis pour l'importance par permutation.")
          evaluation_metrics["status"] = "skipped"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

