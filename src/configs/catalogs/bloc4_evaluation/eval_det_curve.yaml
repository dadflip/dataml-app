id: "eval_det_curve"
name: "Eval: Courbe DET (Detection Error Tradeoff)"
description: "Trace la courbe DET qui represente le taux de faux positifs contre le taux de faux negatifs sur une echelle de deviance normale. Alternative a la courbe ROC pour mieux visualiser les differences entre classifieurs."
category: "Calibration"
tags: ["eval", "det", "classification", "plot", "matplotlib", "error_tradeoff"]
applies_to: ["Classification"]
when_to_use: "Lorsqu'on souhaite comparer les compromis entre faux positifs et faux negatifs. Particulierement utile en detection (fraude, intrusion) ou les deux types d'erreurs ont des couts differents."
pros:
  - "Meilleure lisibilite que la courbe ROC pour comparer des modeles proches"
  - "Echelle de deviance normale qui etire les regions d'interet"
  - "Standard dans la communaute de reconnaissance vocale et biometrie"
cons:
  - "Necessite y_proba (predict_proba)"
  - "Moins connue que la courbe ROC, peut etre moins intuitive"
  - "Uniquement pour la classification binaire ou one-vs-rest"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  if task_type not in ("classification", "binary", "multiclass"):
      print("[EVAL] Courbe DET: applicable uniquement en classification.")
      evaluation_metrics["status"] = "skipped"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

