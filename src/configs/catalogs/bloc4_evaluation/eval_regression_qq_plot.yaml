id: "eval_regression_qq_plot"
name: "Eval: Q-Q Plot des Residus"
description: "Trace le diagramme Q-Q (quantile-quantile) des residus de regression contre une distribution normale. Permet de verifier l'hypothese de normalite des erreurs."
category: "Regression Diagnostics"
tags: ["eval", "regression", "qqplot", "residuals", "normality", "plot", "matplotlib"]
applies_to: ["Regression"]
when_to_use: "Apres un modele de regression, pour verifier si les residus suivent une distribution normale. Hypothese sous-jacente de nombreux modeles lineaires et tests statistiques."
pros:
  - "Diagnostic visuel classique et bien compris"
  - "Detecte les queues lourdes, l'asymetrie et les outliers"
  - "Complete par le test de Shapiro-Wilk pour un resultat quantitatif"
cons:
  - "Ne fonctionne que pour la regression"
  - "Le test de Shapiro-Wilk est sensible a la taille de l'echantillon"
  - "La normalite des residus n'est pas toujours requise (grands echantillons)"
code_template: |
  import numpy as np
  import matplotlib
  matplotlib.use("Agg")
  import matplotlib.pyplot as plt

  evaluation_metrics = {}

  if task_type in ("classification", "binary", "multiclass"):
      print("[EVAL] Q-Q Plot: applicable uniquement en regression.")
      evaluation_metrics["status"] = "skipped"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

