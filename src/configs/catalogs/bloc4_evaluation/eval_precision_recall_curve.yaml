id: "eval_precision_recall_curve"
name: "Eval: Precision-Recall Curve Plot"
description: >
  Genere et sauvegarde la courbe Precision-Recall (PR) pour chaque classe.
  Cette courbe illustre le compromis entre precision et rappel a differents
  seuils de decision. L'aire sous la courbe PR (AP) est egalement calculee.
  Particulierement utile pour les problemes de classification desequilibres
  ou la courbe ROC peut etre trop optimiste. Necessite y_proba.
category: "Visualisation d'Evaluation"
tags: ["eval", "classification", "precision_recall", "courbe", "visualisation", "probabilites"]
applies_to: ["Classification"]
when_to_use: >
  Utiliser pour visualiser le compromis precision/rappel, surtout lorsque
  les classes sont desequilibrees. La courbe PR est plus informative que la
  courbe ROC lorsque la classe positive est rare. Necessite que y_proba soit
  disponible.
pros:
  - "Plus informative que la courbe ROC pour les classes desequilibrees"
  - "Visualise le compromis precision/rappel a tous les seuils"
  - "Permet de choisir un seuil optimal selon le besoin metier"
  - "L'AP (Average Precision) resume la courbe en un seul chiffre"
cons:
  - "Necessite les probabilites predites (y_proba)"
  - "L'interpretation peut etre complexe en multiclasse"
  - "Necessite matplotlib pour la generation du graphique"
  - "La courbe peut etre bruitee avec peu d'echantillons"
code_template: |
  evaluation_metrics = {}
  try:
      from sklearn.metrics import precision_recall_curve, average_precision_score
      from sklearn.preprocessing import label_binarize
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import os

      print("[EVAL] Generation de la courbe Precision-Recall...")

      if y_proba is None:
          print("[EVAL] y_proba est None, courbe PR impossible a generer.")
          evaluation_metrics["precision_recall_curve"] = None
          evaluation_metrics["error"] = "y_proba requis pour la courbe PR"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

