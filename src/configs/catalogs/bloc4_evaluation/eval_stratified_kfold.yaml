id: "eval_stratified_kfold"
name: "Eval: Stratified K-Fold Cross Validation"
description: "Validation croisee stratifiee qui preserve la distribution des classes dans chaque pli. Recommande pour les jeux de donnees desequilibres."
category: "Validation Croisee"
tags: ["eval", "cross_validation", "stratified", "kfold", "classification", "sklearn"]
applies_to: ["Classification"]
when_to_use: "Pour la classification, surtout avec des classes desequilibrees, afin de garantir que chaque pli contient une proportion representant de chaque classe."
pros:
  - "Preserve la distribution des classes dans chaque pli."
  - "Plus fiable que le K-Fold standard pour des classes desequilibrees."
cons:
  - "Applicable uniquement a la classification."
  - "Necessite X_train et y_train dans le scope."
code_template: |
  import numpy as np
  from sklearn.model_selection import StratifiedKFold, cross_val_score

  # [PARAM: N_FOLDS | number]
  N_FOLDS = 5
  # [/PARAM]

  # [PARAM: SCORING | string]
  SCORING = "accuracy"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

