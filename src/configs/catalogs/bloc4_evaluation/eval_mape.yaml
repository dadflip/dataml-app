id: "eval_mape"
name: "Eval: Mean Absolute Percentage Error (MAPE)"
description: >
  Calcule l'erreur absolue moyenne en pourcentage (MAPE) entre les valeurs reelles
  et les predictions. La MAPE exprime l'erreur en pourcentage de la valeur reelle,
  ce qui la rend independante de l'echelle. Attention : non definie lorsque y_test
  contient des zeros.
category: "Metriques de Regression"
tags: ["eval", "regression", "mape", "pourcentage", "erreur", "metrique"]
applies_to: ["Regression"]
when_to_use: >
  Utiliser lorsque l'on souhaite exprimer l'erreur en pourcentage pour faciliter la
  communication avec des parties prenantes non techniques, ou pour comparer des modeles
  sur des echelles differentes.
pros:
  - "Independante de l'echelle, permet de comparer des modeles sur des donnees differentes"
  - "Exprimee en pourcentage, donc tres intuitive"
  - "Utile pour la communication avec des decideurs"
cons:
  - "Non definie quand y_test contient des valeurs nulles (division par zero)"
  - "Asymetrique : penalise davantage les sous-estimations que les sur-estimations"
  - "Peut donner des valeurs extremes avec des valeurs cibles proches de zero"
code_template: |
  evaluation_metrics = {}
  try:
      from sklearn.metrics import mean_absolute_percentage_error
      import numpy as np

      print("[EVAL] Calcul du Mean Absolute Percentage Error (MAPE)...")

      # Check for zeros in y_test
      y_test_array = np.array(y_test)
      n_zeros = np.sum(y_test_array == 0)
      if n_zeros > 0:
          print(f"[EVAL] Attention : {n_zeros} valeur(s) nulle(s) detectee(s) dans y_test.")

      mape_value = mean_absolute_percentage_error(y_test, y_pred)

      evaluation_metrics["mape"] = float(mape_value)
      evaluation_metrics["mape_percentage"] = float(mape_value * 100)

      print(f"[EVAL] MAPE = {mape_value:.6f} ({mape_value * 100:.2f}%)")

      if n_zeros > 0:
          evaluation_metrics["warning"] = f"{n_zeros} valeur(s) nulle(s) dans y_test, MAPE peut etre instable"

  except Exception as e:
      print(f"[EVAL] Erreur lors du calcul du MAPE : {e}")
      evaluation_metrics["mape"] = None
      evaluation_metrics["error"] = str(e)
