id: "eval_confidence_interval_bootstrap"
name: "Eval: Intervalle de Confiance par Bootstrap"
description: "Estime un intervalle de confiance a 95% sur la metrique principale (accuracy pour la classification, RMSE pour la regression) par reeechantillonnage bootstrap."
category: "Calibration"
tags: ["eval", "bootstrap", "confidence_interval", "statistics", "robustness"]
applies_to: ["Classification", "Regression"]
when_to_use: "Lorsqu'on veut quantifier l'incertitude sur la performance du modele. Indispensable pour reporter des resultats fiables et comparer rigoureusement des modeles."
pros:
  - "Methode non-parametrique, aucune hypothese sur la distribution"
  - "Applicable a n'importe quelle metrique"
  - "Fournit une mesure d'incertitude manquante dans les scores ponctuels"
cons:
  - "Peut etre lent avec un grand nombre d'iterations"
  - "Ne remplace pas la validation croisee pour l'estimation de generalisation"
  - "Intervalle potentiellement trop etroit si le jeu de test est petit"
