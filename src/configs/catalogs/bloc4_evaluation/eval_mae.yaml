id: "eval_mae"
name: "Eval: Mean Absolute Error (MAE)"
description: >
  Calcule l'erreur absolue moyenne (MAE) entre les valeurs reelles et les predictions.
  Le MAE represente la moyenne des ecarts absolus et est moins sensible aux valeurs
  aberrantes que le MSE ou le RMSE.
category: "Metriques de Regression"
tags: ["eval", "regression", "mae", "erreur", "metrique"]
applies_to: ["Regression"]
when_to_use: >
  Utiliser lorsque l'on souhaite une mesure d'erreur robuste aux outliers, ou lorsque
  toutes les erreurs doivent etre traitees de maniere egale independamment de leur amplitude.
pros:
  - "Robuste aux valeurs aberrantes comparee au MSE/RMSE"
  - "Interpretable directement dans l'unite de la variable cible"
  - "Traite toutes les erreurs de maniere egale"
cons:
  - "Non differentiable en zero, peut poser probleme pour certains optimiseurs"
  - "Ne penalise pas davantage les grandes erreurs"
  - "Peut masquer des predictions tres eloignees ponctuelles"
code_template: |
  evaluation_metrics = {}
  try:
      from sklearn.metrics import mean_absolute_error

      print("[EVAL] Calcul du Mean Absolute Error (MAE)...")

      mae_value = mean_absolute_error(y_test, y_pred)

      evaluation_metrics["mae"] = float(mae_value)

      print(f"[EVAL] MAE = {mae_value:.6f}")

  except Exception as e:
      print(f"[EVAL] Erreur lors du calcul du MAE : {e}")
      evaluation_metrics["mae"] = None
      evaluation_metrics["error"] = str(e)
