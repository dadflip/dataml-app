id: "eval_decision_boundary_plot"
name: "Eval Plot: Decision Boundary (2D PCA)"
description: "Réduit les données de test en 2D via PCA et trace les frontières de décision du modèle."
category: "Classification Visualizations"
tags: ["eval", "plot", "classification", "pca", "decision-boundary"]
applies_to: ["Classification"]
when_to_use: "Pour comprendre visuellement comment le modèle sépare les classes dans l'espace des features (projeté)."
pros:
  - "Très intuitif pour expliquer la complexité du modèle."
cons:
  - "La projection 2D perd de l'information, la frontière réelle peut être différente."
code_template: |
  import os
  import numpy as np
  import matplotlib.pyplot as plt
  from sklearn.decomposition import PCA
  from matplotlib.colors import ListedColormap

  evaluation_metrics = {}

  if task_type == "classification" and 'full_pipeline' in locals() and 'X_test' in locals() and 'y_test' in locals():
      print("[EVAL] Génération du Decision Boundary Plot (PCA 2D)...")
      try:
          os.makedirs("outputs/evaluation", exist_ok=True)
          
          # Récupération des données brutes
          X_arr = np.array(X_test)
          if len(X_arr.shape) > 2:
              X_arr = X_arr.reshape(X_arr.shape[0], -1)
              
          # Reduction à 2D pour la visualisation
          pca = PCA(n_components=2)
          X_pca = pca.fit_transform(X_arr)
          
          # Création d'une grille
          x_min, x_max = X_pca[:, 0].min() - 1, X_pca[:, 0].max() + 1
          y_min, y_max = X_pca[:, 1].min() - 1, X_pca[:, 1].max() + 1
          xx, yy = np.meshgrid(np.arange(x_min, x_max, 0.1),
                               np.arange(y_min, y_max, 0.1))
          
          # Projection inverse de la grille vers l'espace original
          grid_original = pca.inverse_transform(np.c_[xx.ravel(), yy.ravel()])
          
          # Prédiction sur la grille
          Z = full_pipeline.predict(grid_original)
          
          # Mapping des labels en entiers si ce sont des strings
          classes = np.unique(y_test)
          label_map = {c: i for i, c in enumerate(classes)}
          Z_mapped = np.array([label_map.get(z, 0) for z in Z])
          Z_mapped = Z_mapped.reshape(xx.shape)
          y_mapped = np.array([label_map.get(y, 0) for y in y_test])
          
          fig, ax = plt.subplots(figsize=(10, 8))
          cmap_light = ListedColormap(['#FFAAAA', '#AAFFAA', '#AAAAFF', '#FFFFAA', '#FFAAFF'][:len(classes)])
          cmap_bold = ListedColormap(['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'][:len(classes)])
          
          ax.contourf(xx, yy, Z_mapped, alpha=0.3, cmap=cmap_light)
          scatter = ax.scatter(X_pca[:, 0], X_pca[:, 1], c=y_mapped, cmap=cmap_bold, edgecolor='k', s=20)
          
          ax.set_title('Decision Boundary (Projected via PCA)')
          ax.set_xlabel('Principal Component 1')
          ax.set_ylabel('Principal Component 2')
          
          plot_path = "outputs/evaluation/decision_boundary.png"
          fig.savefig(plot_path, dpi=300)
          plt.close(fig)
          
          evaluation_metrics["decision_boundary_plot"] = plot_path
          print(f"[EVAL] Plot sauvegardé sous {plot_path}")
      except Exception as e:
          print(f"[EVAL ERREUR] Impossible de générer le plot : {str(e)}")
