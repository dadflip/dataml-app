id: "eval_fid_score"
name: "Eval: Score FID (Frechet Inception Distance)"
description: "Approximation du score FID (Frechet Inception Distance) pour les modeles generatifs. Calcule la distance de Frechet entre les distributions gaussiennes multivariees des features reelles et generees."
category: "Generative Models"
tags: ["eval", "fid", "generative", "distance", "frechet", "image_generation"]
applies_to: ["Generative", "GAN", "VAE"]
when_to_use: "Pour evaluer la qualite de donnees generees en comparant leur distribution statistique aux donnees reelles. y_test contient les vecteurs de features reels, y_pred les vecteurs de features generes (issus d'un extracteur comme InceptionV3 ou autre)."
pros:
  - "Metrique standard pour l'evaluation des modeles generatifs d'images"
  - "Capture a la fois la qualite et la diversite des echantillons generes"
  - "Score unique facilitant la comparaison entre modeles"
cons:
  - "Necessite scipy pour le calcul de la racine carree matricielle"
  - "Approximation gaussienne peut etre inadequate pour des distributions multimodales"
  - "Les features doivent etre pre-extraites (Inception, etc.) avant d'appeler cette evaluation"
code_template: |
  import numpy as np

  evaluation_metrics = {}

  try:
      from scipy.linalg import sqrtm

      y_real = np.array(y_test, dtype=np.float64)
      y_gen = np.array(y_pred, dtype=np.float64)

      # Ensure 2D feature vectors
      if y_real.ndim == 1:
          y_real = y_real.reshape(-1, 1)
      if y_gen.ndim == 1:
          y_gen = y_gen.reshape(-1, 1)

      if y_real.shape[1] != y_gen.shape[1]:
          print(f"[EVAL] FID: dimensions incompatibles: {y_real.shape[1]} vs {y_gen.shape[1]}")
          evaluation_metrics["status"] = "error"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

