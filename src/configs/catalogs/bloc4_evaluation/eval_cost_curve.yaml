id: "eval_cost_curve"
name: "Eval Plot: Cost Curve"
description: "Trace le coût attendu normalisé en fonction du seuil, utile quand les Faux Positifs et Faux Négatifs ont des coûts asymétriques."
category: "Classification Visualizations"
tags: ["eval", "plot", "classification", "binary", "cost", "business-metric"]
applies_to: ["Classification Binaire"]
when_to_use: "Lorsque vous connaissez le coût financier (ou l'impact) d'un Faux Positif par rapport à un Faux Négatif."
pros:
  - "Lie directement les performances du modèle aux KPI métier (euros/dollars)."
cons:
  - "Nécessite de définir les coûts (ici simulés par défaut à FP=1, FN=5)."
code_template: |
  import os
  import numpy as np
  import matplotlib.pyplot as plt
  from sklearn.metrics import roc_curve

  evaluation_metrics = {}

  if task_type == "classification" and 'y_test' in locals() and 'y_proba' in locals() and y_proba is not None:
      classes = np.unique(y_test)
      if len(classes) == 2:
          print("[EVAL] Génération du Cost Curve Plot...")
          try:
              os.makedirs("outputs/evaluation", exist_ok=True)
              
              # [PARAM: COST_FP | number]
              COST_FP = 1.0
              # [/PARAM]
              
              # [PARAM: COST_FN | number]
              COST_FN = 5.0
              # [/PARAM]
              
              y_true = (y_test == classes[1]).astype(int)
              probas = y_proba[:, 1]
              
              fpr, tpr, thresholds = roc_curve(y_true, probas)
              fnr = 1 - tpr
              
              # Probabilité à priori de la classe positive
              p_pos = np.mean(y_true)
              p_neg = 1 - p_pos
              
              # Expected Cost Normalisé (Formule simplifiée de Drummond et Holte)
              # Cost = (FNR * p_pos * Cost_FN) + (FPR * p_neg * Cost_FP)
              expected_costs = (fnr * p_pos * float(COST_FN)) + (fpr * p_neg * float(COST_FP))
              
              # Filtrer les seuils hors limites de probabilité (inf/nan)
              valid = (thresholds <= 1.0) & (thresholds >= 0.0)
              thresholds = thresholds[valid]
              expected_costs = expected_costs[valid]
              
              best_idx = np.argmin(expected_costs)
              best_thresh = thresholds[best_idx]
              min_cost = expected_costs[best_idx]
              
              fig, ax = plt.subplots(figsize=(8, 6))
              ax.plot(thresholds, expected_costs, 'b-', linewidth=2)
              ax.axvline(best_thresh, color='r', linestyle='--', label=f'Min Cost (Thresh: {best_thresh:.2f})')
              ax.scatter([best_thresh], [min_cost], color='red', zorder=5)
              
              ax.set_title(f'Cost Curve (Cost FP={COST_FP}, Cost FN={COST_FN})')
              ax.set_xlabel('Probability Threshold')
              ax.set_ylabel('Expected Cost')
              ax.legend()
              ax.grid(True, alpha=0.3)
              
              plot_path = "outputs/evaluation/cost_curve.png"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

