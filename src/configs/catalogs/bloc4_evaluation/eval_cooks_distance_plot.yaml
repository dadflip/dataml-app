id: "eval_cooks_distance_plot"
name: "Eval Plot: Cook's Distance"
description: "Mesure l'influence de chaque point de donnée sur le modèle de régression. Plus la distance est grande, plus le point est un outlier influent."
category: "Regression Visualizations"
tags: ["eval", "plot", "regression", "outliers", "yellowbrick-like"]
applies_to: ["Regression"]
when_to_use: "Pour identifier les points de données aberrants qui 'tirent' la droite de régression vers eux de manière disproportionnée."
pros:
  - "Très puissant pour l'analyse d'erreurs (Debugging Data)."
cons:
  - "Généralement défini stricto sensu pour la régression linéaire (Ols), ici on l'approxime via le levier."
code_template: |
  import os
  import numpy as np
  import matplotlib.pyplot as plt
  try:
      from yellowbrick.regressor import CooksDistance
  except ImportError:
      CooksDistance = None

  evaluation_metrics = {}

  if task_type == "regression" and 'full_pipeline' in locals() and 'X_train' in locals() and 'y_train' in locals():
      print("[EVAL] Génération du Cook's Distance Plot...")
      try:
          os.makedirs("outputs/evaluation", exist_ok=True)
          
          if CooksDistance is not None:
              # Yellowbrick gère tout
              fig, ax = plt.subplots(figsize=(10, 6))
              visualizer = CooksDistance(full_pipeline, ax=ax)
              visualizer.fit(X_train, y_train)
              visualizer.finalize()
              
              plot_path = "outputs/evaluation/cooks_distance.png"
illustration_mermaid: |
    graph LR
      Pred([Predictions]) --> Metric{Evaluation}
      Actual([Ground Truth]) --> Metric
      style Metric fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff

