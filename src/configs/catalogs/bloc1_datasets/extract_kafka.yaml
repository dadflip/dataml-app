id: "extract_kafka"
name: "Extract: Apache Kafka"
description: "Consomme les messages d'un topic Kafka et les dump."
category: "1. Extract"
tags: ["extract", "kafka", "stream", "bigdata"]
code_template: |
  from kafka import KafkaConsumer
  import os

  # [PARAM: BROKER | string]
  BROKER = "localhost:9092"
  # [/PARAM]
  
  # [PARAM: TOPIC | string]
  TOPIC = "my_data_topic"
  # [/PARAM]
  
  # [PARAM: MAX_MESSAGES | string]
  MAX_MESSAGES = "100"
  # [/PARAM]
  
  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/kafka_dump.jsonlines"
  # [/PARAM]

  print(f"[EXTRACT] Consommation Kafka de {TOPIC} (Broker: {BROKER})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      consumer = KafkaConsumer(TOPIC, bootstrap_servers=BROKER, auto_offset_reset='earliest', consumer_timeout_ms=5000)
      
      count = 0
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          for message in consumer:
              val = message.value.decode('utf-8')
              f.write(val + "\\n")
              count += 1
              if count >= int(MAX_MESSAGES):
                  break
                  
      print(f"[EXTRACT] Succès Kafka. {count} messages dumpés.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec de la connexion Kafka : {str(e)}")
      raise e

  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "kafka", "path": DEST_PATH}
_metadata:
  bloc: 1
  section: "1_extract"
