id: load_feather
name: 'Load: Fichier Feather'
description: Charge un dataset au format binaire Apache Arrow Feather (haute vitesse).
category: 2. Load
tags:
- load
- feather
- arrow
- pandas
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.feather"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Chargement du fichier Feather depuis {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier Feather introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      df = pd.read_feather(FILE_PATH)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Feather. L'accès direct en mémoire a pris {duration:.2f}s pour {df.shape[0]} lignes.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'pyarrow' est requis pour lire les fichiers Feather.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de lire le fichier Feather : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "unknown"
  meta = {"format": "feather", "shape": df.shape}
