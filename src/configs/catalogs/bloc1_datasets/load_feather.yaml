id: load_feather
name: 'Load: Fichier Feather'
description: Charge un dataset au format binaire Apache Arrow Feather (haute vitesse).
category: 2. Load
tags:
- load
- feather
- arrow
- pandas
code_template: "import pandas as pd\nimport time\nimport os\n\n# [PARAM: FILE_PATH\
  \ | file]\nFILE_PATH = \"./data/raw/data.feather\"\n# [/PARAM]\n\n# [PARAM: TARGET_COL\
  \ | string]\nTARGET_COL = \"target\"\n# [/PARAM]\n\nprint(f\"[LOAD] Chargement du\
  \ fichier Feather depuis {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n\
  \    raise FileNotFoundError(f\"[ERREUR LOAD] Fichier Feather introuvable : {FILE_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    df = pd.read_feather(FILE_PATH)\n \
  \   \n    duration = time.time() - start_time\n    print(f\"[LOAD] Succès Feather.\
  \ L'accès direct en mémoire a pris {duration:.2f}s pour {df.shape[0]} lignes.\"\
  )\nexcept ImportError:\n    print(\"[ERREUR LOAD] Le module 'pyarrow' est requis\
  \ pour lire les fichiers Feather.\")\n    raise\nexcept Exception as e:\n    print(f\"\
  [ERREUR LOAD] Impossible de lire le fichier Feather : {str(e)}\")\n    raise e\n\
  \ntarget_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else None\n\
  task_type = \"unknown\"\nmeta = {\"format\": \"feather\", \"shape\": df.shape}\n"
