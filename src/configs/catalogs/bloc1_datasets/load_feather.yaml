id: load_feather
name: 'Load: Fichier Feather'
description: |
  Charge en mémoire des ensembles de données tabulaires au format binaire Feather, basé sur la spécification Apache Arrow. Conçu pour des performances de lecture et d'écriture maximales, ce bloc permet d'importer instantanément (souvent en une fraction de seconde) des millions de lignes, tout en préservant fidèlement les types de données (y compris les catégories et les dates). C'est la méthode de choix pour contourner les limitations de vitesse et de typage associées aux fichiers CSV traditionnels.
when_to_use: 'Optez pour ce bloc lorsque vous devez charger fréquemment de gros DataFrames Pandas lors de phases de développement itératives, ou comme format de sérialisation intermédiaire hautement performant entre plusieurs étapes de votre pipeline MLOps.'
use_cases:
  - 'Reprise rapide d''un pipeline de Machine Learning à partir de caractéristiques (features) préalablement calculées et stockées sur disque.'
  - 'Échange de gros volumes de données entre des processus Python et R, car le format Feather est agnostique et optimisé pour ces langages.'
  - 'Mise en cache (caching) de données propres pour accélérer drastiquement le démarrage des scripts d''entraînement itératifs.'
pros:
  - 'Performances d''Entrée/Sortie (I/O) exceptionnelles : de loin l''une des méthodes les plus rapides pour lire des données tabulaires en Pandas, grâce à son architecture orientée colonne (columnar memory format).'
  - 'Garantie d''un typage strict : contrairement au CSV, vous ne perdrez jamais les types de données spécifiques de Pandas (comme datetime, boolean ou categorical) après rechargement.'
  - 'Aucun parsing coûteux ni inférence de type, car la disposition des données sur le disque correspond exactement à leur disposition en mémoire (zéro copie).'
cons:
  - 'Format principalement pensé pour le stockage éphémère ou intermédiaire, et moins adapté pour l''archivage à très long terme comparé à Parquet.'
  - 'Nécessite impérativement l''installation de la librairie externe pyarrow.'
  - 'Pas de support natif pour des filtres de type "pushdown" (charger seulement certaines lignes conditionnelles) aussi avancés que ceux disponibles avec le format Parquet.'
category: 2. Load
tags:
- load
- feather
- arrow
- pandas
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.feather"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Chargement du fichier Feather depuis {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier Feather introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      df = pd.read_feather(FILE_PATH)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Feather. L'accès direct en mémoire a pris {duration:.2f}s pour {df.shape[0]} lignes.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'pyarrow' est requis pour lire les fichiers Feather.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de lire le fichier Feather : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "unknown"
  meta = {"format": "feather", "shape": df.shape}
