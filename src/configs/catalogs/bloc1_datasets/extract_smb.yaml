id: extract_smb
name: 'Extract: Partage Windows (SMB)'
description: Télécharge un fichier depuis un partage réseau Windows.
category: 1. Extract
tags:
- extract
- smb
- windows
- network
code_template: "import shutil\nimport os\nimport time\n\n# [PARAM: SMB_UNC_PATH |\
  \ string]\nSMB_UNC_PATH = r\"\\\\\\\\SERVER\\\\Share\\\\data.csv\"\n# [/PARAM]\n\
  \n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/smb_data.csv\"\n# [/PARAM]\n\
  \nprint(f\"[EXTRACT] Copie depuis le partage SMB : {SMB_UNC_PATH}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    shutil.copy2(SMB_UNC_PATH,\
  \ DEST_PATH)\n    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT]\
  \ Succès SMB. Fichier copié en {duration:.2f}s.\")\nexcept Exception as e:\n   \
  \ print(f\"[ERREUR EXTRACT] Erreur de réseau Windows (Permissions SMB) : {str(e)}\"\
  )\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta =\
  \ {\"source\": \"smb\", \"path\": DEST_PATH}\n"
