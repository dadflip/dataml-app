id: extract_smb
name: 'Extract: Partage Windows (SMB)'
description: Télécharge un fichier depuis un partage réseau Windows.
when_to_use: "Lorsqu'il faut importer des données depuis un partage réseau d'entreprise Windows (SMB/CIFS)."
use_cases:
  - "Récupération de fichiers plats (CSV, Excel) exportés par un SI sur un serveur de fichiers."
  - "Accès sécurisé à un répertoire partagé interne."
pros:
  - "Intégration native avec les environnements d'entreprise."
  - "Ne nécessite pas d'agent sur la source, un simple accès réseau suffit."
cons:
  - "Peut rencontrer des problèmes de pare-feu ou de droits (Active Directory)."
  - "Débit limité par le réseau local."
category: 1. Extract
tags:
- extract
- smb
- windows
- network
code_template: |
  import shutil
  import os
  import time
  import pandas as pd

  # [PARAM: SMB_UNC_PATH | string]
  SMB_UNC_PATH = r"\\SERVER\Share\data.csv"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/smb_data.csv"
  # [/PARAM]

  print(f"[EXTRACT] Copie depuis le partage SMB : {SMB_UNC_PATH}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      shutil.copy2(SMB_UNC_PATH, DEST_PATH)
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès SMB. Fichier copié en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Erreur de réseau Windows (Permissions SMB) : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {"source": "smb", "path": DEST_PATH}

