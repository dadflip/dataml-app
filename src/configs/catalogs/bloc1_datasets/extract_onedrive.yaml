id: extract_onedrive
name: 'Extract: Microsoft OneDrive'
description: Télécharge un fichier partagé publiquement depuis OneDrive.
category: 1. Extract
tags:
- extract
- onedrive
- microsoft
- cloud
code_template: |
  import urllib.request
  import os
  import time

  # [PARAM: DIRECT_LINK | string]
  DIRECT_LINK = "https://onedrive.live.com/download?cid=XXX&resid=XXX&authkey=XXX"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/onedrive_data.zip"
  # [/PARAM]

  print(f"[EXTRACT] Téléchargement depuis OneDrive...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      req = urllib.request.Request(DIRECT_LINK, headers={'User-Agent': 'Mozilla/5.0'})
      with urllib.request.urlopen(req) as response, open(DEST_PATH, 'wb') as out_file:
          out_file.write(response.read())
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès OneDrive. Fichier téléchargé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Echec du lien OneDrive : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "onedrive", "path": DEST_PATH}
illustration_mermaid: |
    flowchart TD
    A([FILE_PATH]) --> B[Load EXTRACT_ONEDRIVE]
    B --> df([df])
    
    style A fill:#3b82f6,color:#fff
    style B fill:#10b981,color:#fff
    style df fill:#f59e0b,color:#fff



        subgraph Operations [OneDrive Extract]
            Req([urllib.request.Request])
            UrlOpen([urllib.request.urlopen])
            Write([Write to Local File])
            OutFile[(Zip File)]
        end

        subgraph Outputs [Contract Variables]
            df((df = None))
            target((target_name = None))
            task((task_type = 'unknown'))
            meta((meta: dict))
        end

        LINK --> Req
        Req --> UrlOpen
        UrlOpen -->|response.read| Write
        DEST --> OutFile
        Write --> OutFile
        OutFile -.-> meta

        style Config fill:#f8fafc,stroke:#cbd5e1,stroke-width:2px
        style Req fill:#3b82f6,stroke:#1d4ed8,stroke-width:2px,color:#fff
        style UrlOpen fill:#10b981,stroke:#047857,stroke-width:2px,color:#fff
        style Write fill:#f59e0b,stroke:#b45309,stroke-width:2px,color:#fff
        style OutFile fill:#8b5cf6,stroke:#6d28d9,stroke-width:2px,color:#fff
        style Outputs fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px

