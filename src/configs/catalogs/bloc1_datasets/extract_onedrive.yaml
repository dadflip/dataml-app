id: extract_onedrive
name: 'Extract: Microsoft OneDrive'
description: Télécharge un fichier partagé publiquement depuis OneDrive.
category: 1. Extract
tags:
- extract
- onedrive
- microsoft
- cloud
code_template: "import urllib.request\nimport os\nimport time\n\n# [PARAM: DIRECT_LINK\
  \ | string]\nDIRECT_LINK = \"https://onedrive.live.com/download?cid=XXX&resid=XXX&authkey=XXX\"\
  \n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/onedrive_data.zip\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Téléchargement depuis OneDrive...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    req = urllib.request.Request(DIRECT_LINK,\
  \ headers={'User-Agent': 'Mozilla/5.0'})\n    with urllib.request.urlopen(req) as\
  \ response, open(DEST_PATH, 'wb') as out_file:\n        out_file.write(response.read())\n\
  \        \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès\
  \ OneDrive. Fichier téléchargé en {duration:.2f}s.\")\nexcept Exception as e:\n\
  \    print(f\"[ERREUR EXTRACT] Echec du lien OneDrive : {str(e)}\")\n    raise e\n\
  \ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"\
  onedrive\", \"path\": DEST_PATH}\n"
