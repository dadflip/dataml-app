id: load_image
name: 'Load: Image (JPG, PNG, TIFF)'
description: "Charge une image sous forme de matrice NumPy (RGB)."
when_to_use: "Lorsque vous avez besoin de charger, d'inspecter ou de traiter une seule image (par exemple JPG, PNG) pour des tâches de vision par ordinateur."
use_cases:
  - "Inférence de modèle sur une image spécifique fournie par l'utilisateur."
  - "Test rapide de filtres de traitement d'image ou d'augmentations de données."
  - "Création d'exemples de démonstration pour des algorithmes de Computer Vision."
pros:
  - "Conversion automatique de l'espace de couleurs BGR (OpenCV) vers RGB (standard ML)."
  - "Basé sur OpenCV, l'une des bibliothèques les plus rapides pour l'I/O d'images."
  - "Extrait instantanément la dimension (shape) de l'image en tant que métadonnée."
cons:
  - "Ne charge qu'une seule image à la fois, non adapté pour les batchs complets."
  - "Nécessite l'installation d'OpenCV (cv2) dans l'environnement Python."
category: 2. Load
tags:
- load
- image
- cv2
- media
code_template: |
  import cv2
  import numpy as np
  import time
  import os
  import pandas as pd

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/photo.jpg"
  # [/PARAM]

  print(f"[LOAD] Lecture de l'image : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier Image introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      
      # Lecture OpenCV (BGB par défaut)
      img_bgr = cv2.imread(FILE_PATH)
      if img_bgr is None:
          raise ValueError("Le fichier n'est pas une image valide ou est corrompu.")
          
      # Conversion BGR -> RGB pour compatibilité ML/DL
      img_rgb = cv2.cvtColor(img_bgr, cv2.COLOR_BGR2RGB)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès. Image {img_rgb.shape} chargée en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'opencv-python' (cv2) est requis.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de charger l'image : {str(e)}")
      raise e

  df = pd.DataFrame([{"path": FILE_PATH, "image_shape": img_rgb.shape}])
  target_name = ""
  task_type = "computer_vision"
  meta = {"format": "image", "shape": img_rgb.shape}
