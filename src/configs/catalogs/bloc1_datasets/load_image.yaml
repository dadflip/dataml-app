id: load_image
name: 'Load: Image (JPG, PNG, TIFF)'
description: Charge une image sous forme de matrice NumPy (RGB).
category: 2. Load
tags:
- load
- image
- cv2
- media
code_template: "import cv2\nimport numpy as np\nimport time\nimport os\n\n# [PARAM:\
  \ FILE_PATH | file]\nFILE_PATH = \"./data/raw/photo.jpg\"\n# [/PARAM]\n\nprint(f\"\
  [LOAD] Lecture de l'image : {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n\
  \    raise FileNotFoundError(f\"[ERREUR LOAD] Fichier Image introuvable : {FILE_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    \n    # Lecture OpenCV (BGB par défaut)\n\
  \    img_bgr = cv2.imread(FILE_PATH)\n    if img_bgr is None:\n        raise ValueError(\"\
  Le fichier n'est pas une image valide ou est corrompu.\")\n        \n    # Conversion\
  \ BGR -> RGB pour compatibilité ML/DL\n    img_rgb = cv2.cvtColor(img_bgr, cv2.COLOR_BGR2RGB)\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[LOAD] Succès. Image\
  \ {img_rgb.shape} chargée en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"\
  [ERREUR LOAD] Le module 'opencv-python' (cv2) est requis.\")\n    raise\nexcept\
  \ Exception as e:\n    print(f\"[ERREUR LOAD] Impossible de charger l'image : {str(e)}\"\
  )\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"computer_vision\"\
  \nmeta = {\"format\": \"image\", \"shape\": img_rgb.shape}\n"
