id: load_dicom
name: 'Load: Image Médicale DICOM'
description: Charge une image médicale au format DICOM et extrait ses métadonnées
  (Patient, Modalité).
category: 2. Load
tags:
- load
- dicom
- medical
- image
code_template: |
  import pydicom
  import numpy as np
  import time
  import os
  import pandas as pd

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/scan.dcm"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier DICOM : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier DICOM introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      dcm = pydicom.dcmread(FILE_PATH)
      
      # Extraction des pixels en matrice NumPy
      pixel_data = dcm.pixel_array
      
      # Récupération de métadonnées médicales basiques
      patient_name = str(dcm.PatientName) if 'PatientName' in dcm else "Inconnu"
      modality = str(dcm.Modality) if 'Modality' in dcm else "Inconnue"
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès DICOM. Patient: {patient_name}, Modalité: {modality}.")
      print(f"[LOAD] Matrice {pixel_data.shape} extraite en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'pydicom' est requis pour les images DICOM.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de parser le DICOM : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "computer_vision"
  meta = {
      "format": "dicom",
      "shape": pixel_data.shape,
      "patient": patient_name,
      "modality": modality
  }

illustration_mermaid: |
  flowchart TD
      subgraph Config [Parameters]
          FILE([FILE_PATH])
      end

      subgraph Operations [DICOM Load]
          Check([os.path.exists])
          Pydicom([pydicom.dcmread])
          Pix([dcm.pixel_array])
          MetaExtract([Extract Patient/Modality])
      end

      subgraph Outputs [Contract Variables]
          df((df = pd.DataFrame))
          target((target_name = ''))
          task((task_type = 'computer_vision'))
          meta((meta: dict))
      end

      FILE --> Check
      Check --> Pydicom
      Pydicom --> Pix
      Pydicom --> MetaExtract
      Pix -.-> meta
      MetaExtract -.-> meta

      style Config fill:#f8fafc,stroke:#cbd5e1,stroke-width:2px
      style Check fill:#64748b,stroke:#475569,stroke-width:2px,color:#fff
      style Pydicom fill:#3b82f6,stroke:#1d4ed8,stroke-width:2px,color:#fff
      style Pix fill:#10b981,stroke:#047857,stroke-width:2px,color:#fff
      style MetaExtract fill:#f59e0b,stroke:#b45309,stroke-width:2px,color:#fff
      style Outputs fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px

