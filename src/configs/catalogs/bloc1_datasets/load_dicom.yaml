id: load_dicom
name: 'Load: Image Médicale DICOM'
description: Charge une image médicale au format DICOM et extrait ses métadonnées
  (Patient, Modalité).
category: 2. Load
tags:
- load
- dicom
- medical
- image
code_template: "import pydicom\nimport numpy as np\nimport time\nimport os\n\n# [PARAM:\
  \ FILE_PATH | file]\nFILE_PATH = \"./data/raw/scan.dcm\"\n# [/PARAM]\n\nprint(f\"\
  [LOAD] Lecture du fichier DICOM : {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n\
  \    raise FileNotFoundError(f\"[ERREUR LOAD] Fichier DICOM introuvable : {FILE_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    dcm = pydicom.dcmread(FILE_PATH)\n\
  \    \n    # Extraction des pixels en matrice NumPy\n    pixel_data = dcm.pixel_array\n\
  \    \n    # Récupération de métadonnées médicales basiques\n    patient_name =\
  \ str(dcm.PatientName) if 'PatientName' in dcm else \"Inconnu\"\n    modality =\
  \ str(dcm.Modality) if 'Modality' in dcm else \"Inconnue\"\n    \n    duration =\
  \ time.time() - start_time\n    print(f\"[LOAD] Succès DICOM. Patient: {patient_name},\
  \ Modalité: {modality}.\")\n    print(f\"[LOAD] Matrice {pixel_data.shape} extraite\
  \ en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"[ERREUR LOAD] Le module\
  \ 'pydicom' est requis pour les images DICOM.\")\n    raise\nexcept Exception as\
  \ e:\n    print(f\"[ERREUR LOAD] Impossible de parser le DICOM : {str(e)}\")\n \
  \   raise e\n\ndf = None\ntarget_name = None\ntask_type = \"computer_vision\"\n\
  meta = {\n    \"format\": \"dicom\",\n    \"shape\": pixel_data.shape,\n    \"patient\"\
  : patient_name,\n    \"modality\": modality\n}\n"
