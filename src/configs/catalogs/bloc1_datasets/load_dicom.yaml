id: load_dicom
name: 'Load: Image Médicale DICOM'
description: "Charge une image ou un scan médical au format standardisé DICOM (Digital Imaging and Communications in Medicine) en utilisant la bibliothèque Pydicom. Ce bloc extrait non seulement la matrice de pixels bruts (l'imagerie elle-même, comme une IRM ou un scanner) sous forme de tableau NumPy, mais il décode également les métadonnées cliniques encapsulées dans le fichier (telles que le nom du patient, le type d'équipement, ou la modalité d'acquisition). Il prépare ainsi un environnement idéal pour des tâches de Computer Vision appliquées au domaine de la santé."
when_to_use: "À utiliser exclusivement dans le cadre de projets d'imagerie médicale, d'intelligence artificielle en santé, ou de recherche clinique nécessitant de lire des scans issus d'équipements médicaux professionnels."
use_cases:
  - "Détection automatisée de tumeurs, de fractures ou d'anomalies sur des radiographies ou IRM."
  - "Segmentation d'organes à partir de scanners (CT scans) pour la planification chirurgicale."
  - "Classification de pathologies médicales et assistance au diagnostic radiologique."
  - "Extraction et anonymisation de données cliniques stockées dans les en-têtes DICOM."
pros:
  - "Standard absolu de l'imagerie médicale, incontournable pour les projets cliniques."
  - "Permet de récupérer simultanément l'image et une richesse exceptionnelle d'informations de contexte (métadonnées)."
  - "La matrice extraite est directement compatible avec les frameworks de Deep Learning (PyTorch, TensorFlow)."
cons:
  - "Fichiers souvent très lourds, surtout pour des IRM ou scanners 3D à haute résolution."
  - "Nécessite la bibliothèque spécialisée pydicom."
  - "Le prétraitement (normalisation des intensités, fenêtrage Hounsfield) reste à la charge de l'utilisateur, ce bloc effectuant uniquement l'extraction."
category: 2. Load
tags:
- load
- dicom
- medical
- image
code_template: |
  import pydicom
  import numpy as np
  import time
  import os
  import pandas as pd

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/scan.dcm"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier DICOM : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier DICOM introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      dcm = pydicom.dcmread(FILE_PATH)
      
      # Extraction des pixels en matrice NumPy
      pixel_data = dcm.pixel_array
      
      # Récupération de métadonnées médicales basiques
      patient_name = str(dcm.PatientName) if 'PatientName' in dcm else "Inconnu"
      modality = str(dcm.Modality) if 'Modality' in dcm else "Inconnue"
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès DICOM. Patient: {patient_name}, Modalité: {modality}.")
      print(f"[LOAD] Matrice {pixel_data.shape} extraite en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'pydicom' est requis pour les images DICOM.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de parser le DICOM : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "computer_vision"
  meta = {
      "format": "dicom",
      "shape": pixel_data.shape,
      "patient": patient_name,
      "modality": modality
  }

