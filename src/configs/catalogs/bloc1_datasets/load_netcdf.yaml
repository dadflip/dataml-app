id: "load_netcdf"
name: "Load: Géoscience NetCDF"
description: "Ce bloc charge un fichier de données multidimensionnelles au format NetCDF (.nc), souvent utilisé en géosciences, climatologie et océanographie. Il convertit le jeu de données en format tabulaire et extrait les métadonnées (dimensions, variables)."
when_to_use: "À utiliser pour exploiter des données météorologiques, climatiques ou scientifiques structurées sur des grilles spatiales et temporelles."
use_cases:
  - "Prédiction météorologique ou climatique à partir de séries temporelles spatialisées."
  - "Analyse des températures de surface océanique pour des études environnementales."
  - "Modélisation des données satellitaires en sciences de la Terre."
pros:
  - "Gère nativement les tableaux de données multidimensionnels."
  - "Extrait facilement les métadonnées attachées via la bibliothèque xarray."
cons:
  - "L'aplatissement (flatten) en DataFrame Pandas peut s'avérer très coûteux en mémoire pour de gros fichiers."
  - "Nécessite les packages `xarray` et `netCDF4`."
category: "2. Load"
tags: ["load", "netcdf", "weather", "science"]
code_template: |
  import pandas as pd
  import os
  import xarray as xr

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.netcdf"
  # [/PARAM]

  meta = {"source": "NETCDF", "path": FILE_PATH}

  if os.path.exists(FILE_PATH):
      try:
          # Load the NetCDF file
          ds = xr.open_dataset(FILE_PATH)
          # Convert to Pandas DataFrame and flatten
          df = ds.to_dataframe().reset_index()
          meta["dimensions"] = list(ds.dims)
          meta["variables"] = list(ds.data_vars)
      except Exception as e:
          print(f"Error loading NetCDF file {FILE_PATH}: {e}")
          df = pd.DataFrame()
  else:
      print(f"File not found: {FILE_PATH}")
      df = pd.DataFrame()

  if not df.empty and len(df.columns) > 0:
      target_name = df.columns[-1]
  else:
      target_name = "target"

  task_type = "regression"
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
  flowchart LR
      A[/"📄 FILE_PATH"/] --> B{"xr.open_dataset & Convert"}
      C[/"🎯 TARGET_COL"/] --> D{"Check TARGET_COL"}
      B --> E(["📊 df (DataFrame)"])
      E --> D
      D --> F(["🎯 target_name"])
      D --> G(["⚙️ task_type"])
      D --> H(["ℹ️ meta (...)"])
