id: eda_timeseries_lineplot
name: 'EDA: Série Temporelle'
description: Trace l'évolution temporelle globale.
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- tabular
- lineplot
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns
  
  # [PARAM: TIME_COL | string]
  TIME_COL = "date"
  # [/PARAM]
  
  if TIME_COL in df.columns and 'target_name' in locals() and target_name:
      time_series = pd.to_datetime(df[TIME_COL], errors='coerce')
      plt.figure(figsize=(15, 5))
      sns.lineplot(x=time_series, y=df[target_name])
      plt.title(f"Évolution de {target_name} au cours du temps ({TIME_COL})")
      plt.xticks(rotation=45)
      plt.tight_layout()
      plt.show()
  else:
      print("[EDA] TIME_COL ou target_name introuvable.")
illustration_mermaid: |
    graph TD
      DF([DataFrame]) --> Check{Check TIME_COL & target_name}
      Check -- Valid --> ToDate[pd.to_datetime]
      ToDate --> Plot[sns.lineplot]
      Plot --> Show[plt.show]
      Check -- Missing --> Err[Print Error]
      style ToDate fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style Plot fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
