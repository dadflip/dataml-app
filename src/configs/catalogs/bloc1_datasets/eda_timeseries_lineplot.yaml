code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\n\n# [PARAM: TIME_COL | string]\nTIME_COL = \"date\"\n# [/PARAM]\n\nif\
  \ TIME_COL in df.columns and 'target_name' in locals() and target_name:\n    time_series\
  \ = pd.to_datetime(df[TIME_COL], errors='coerce')\n    plt.figure(figsize=(15, 5))\n\
  \    sns.lineplot(x=time_series, y=df[target_name])\n    plt.title(f\"Évolution\
  \ de {target_name} au cours du temps ({TIME_COL})\")\n    plt.xticks(rotation=45)\n\
  \    plt.tight_layout()\n    plt.show()\nelse:\n    print(\"[EDA] TIME_COL ou target_name\
  \ introuvable.\")\n"
