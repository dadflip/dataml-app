id: "load_video"
name: "Load: Vidéo (MP4, AVI)"
description: "Ouvre un flux vidéo (par exemple MP4 ou AVI) et charge les premières frames sous forme de données aplaties en utilisant OpenCV."
when_to_use: "Idéal pour l'extraction de séquences d'images depuis des vidéos dans des cas d'utilisation de vision par ordinateur ou d'analyse d'images."
use_cases:
  - "Extraction de frames pour l'entraînement de modèles de classification d'images."
  - "Prétraitement de données vidéo pour la détection d'objets."
  - "Analyse d'échantillons vidéo pour l'extraction de caractéristiques visuelles."
pros:
  - "Utilise OpenCV pour une compatibilité étendue avec les formats vidéo."
  - "Extrait automatiquement les métadonnées utiles (FPS, dimensions, nombre total de frames)."
  - "Limite l'extraction à un échantillon (ex: 10 frames) pour éviter les dépassements de mémoire."
cons:
  - "Ne charge pas la vidéo entière, seulement un aperçu (configurable dans le code)."
  - "Le format d'image aplati n'est pas optimal pour tous les réseaux de neurones sans redimensionnement."
category: "2. Load"
tags: ["load", "video", "cv2", "media"]
code_template: |
  import pandas as pd
  import os
  import cv2
  import numpy as np

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.mp4"
  # [/PARAM]

  meta = {"source": "VIDEO", "path": FILE_PATH}
  df = pd.DataFrame()

  if os.path.exists(FILE_PATH):
      try:
          cap = cv2.VideoCapture(FILE_PATH)
          
          meta["fps"] = cap.get(cv2.CAP_PROP_FPS)
          meta["total_frames"] = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          meta["width"] = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))
          meta["height"] = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))
          
          frames = []
          # Extract up to 10 frames to avoid OOM
          max_frames = 10
          frame_count = 0
          
          while cap.isOpened() and frame_count < max_frames:
              ret, frame = cap.read()
              if not ret:
                  break
              
              # Convert BGR to RGB
              frame = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
              
              # Flatten frame for DataFrame storage
              frames.append({
                  "frame_index": frame_count,
                  "frame_data": frame.flatten()
              })
              frame_count += 1
              
          cap.release()
          df = pd.DataFrame(frames)
      except Exception as e:
          print(f"Error loading video file {FILE_PATH}: {e}")
  else:
      print(f"File not found: {FILE_PATH}")

  target_name = "frame_data"
  task_type = "computer_vision"
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
  flowchart LR
