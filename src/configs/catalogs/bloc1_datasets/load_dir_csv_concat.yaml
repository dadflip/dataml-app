id: load_dir_csv_concat
name: 'Load: Dossier de Fichiers CSV'
description: 'Ce composant explore un répertoire cible afin de détecter, lire et fusionner (concaténer) automatiquement l''ensemble des fichiers au format CSV qu''il contient. Il est pensé pour les environnements de données fragmentées, où des exports successifs, des logs journaliers ou des extractions massives (Big Data) génèrent de multiples fichiers CSV partageant le même schéma (les mêmes colonnes). En utilisant Pandas, le script itère sur chaque fichier, les charge en mémoire en gérant les types de séparateurs paramétrables, et les empile verticalement (axis=0) pour produire un unique DataFrame global prêt pour l''analyse ou l''entraînement de modèles.'
when_to_use: 'Idéal lorsque vos données tabulaires sont réparties en plusieurs fichiers CSV (par exemple, un fichier par mois ou par machine) et que vous avez besoin de les consolider en une seule table globale pour l''analyse globale ou l''apprentissage.'
use_cases:
- 'Consolidation de logs d''événements journaliers ou horaires issus de serveurs.'
- 'Agrégation d''extractions de bases de données morcelées en plusieurs parties (ex: part_01.csv, part_02.csv).'
- 'Fusion de données de séries temporelles collectées par plusieurs capteurs distincts au même format.'
pros:
- 'Automatisation complète du processus de fusion : plus besoin de concaténer manuellement dans Excel ou via des scripts complexes.'
- 'Flexibilité grâce au séparateur paramétrable (virgule, point-virgule, tabulation).'
- 'Tolérance à l''ordre alphabétique ou temporel selon les noms de fichiers gérée nativement par glob.'
cons:
- 'Gourmand en mémoire vive (RAM) si la somme totale des CSV est très volumineuse.'
- 'Suppose que tous les fichiers CSV partagent strictement le même schéma (colonnes identiques), sinon la concaténation créera des colonnes vides (NaN).'
category: 2. Load
tags:
- load
- directory
- csv
- concat
code_template: |
  import os
  import glob
  import pandas as pd
  import time

  # [PARAM: DIRECTORY_PATH | dir]
  DIRECTORY_PATH = "./data/extracted/csv_parts"
  # [/PARAM]

  # [PARAM: SEP | string]
  SEP = ","
  # [/PARAM]

  print(f"[LOAD] Concaténation des CSV dans {DIRECTORY_PATH}...")
  if not os.path.exists(DIRECTORY_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Le dossier n'existe pas : {DIRECTORY_PATH}")

  try:
      start_time = time.time()
      
      csv_files = glob.glob(os.path.join(DIRECTORY_PATH, "*.csv"))
      if not csv_files:
          raise ValueError(f"Aucun fichier CSV trouvé dans {DIRECTORY_PATH}")
          
      dfs = []
      for file in csv_files:
          dfs.append(pd.read_csv(file, sep=SEP, low_memory=False))
          
      # Concaténation verticale
      df = pd.concat(dfs, ignore_index=True)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès. {len(csv_files)} fichiers fusionnés ({df.shape[0]} lignes) en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur lors de la fusion des CSV : {str(e)}")
      raise e

  target_name = ""
  task_type = "unknown"
  meta = {"format": "directory_csv", "files_merged": len(csv_files), "shape": df.shape}

