id: load_dir_csv_concat
name: 'Load: Dossier de Fichiers CSV'
description: Parcourt un dossier et concatène tous les fichiers CSV trouvés en un
  seul DataFrame.
category: 2. Load
tags:
- load
- directory
- csv
- concat
code_template: "import os\nimport glob\nimport pandas as pd\nimport time\n\n# [PARAM:\
  \ DIRECTORY_PATH | dir]\nDIRECTORY_PATH = \"./data/extracted/csv_parts\"\n# [/PARAM]\n\
  \n# [PARAM: SEP | string]\nSEP = \",\"\n# [/PARAM]\n\nprint(f\"[LOAD] Concaténation\
  \ des CSV dans {DIRECTORY_PATH}...\")\nif not os.path.exists(DIRECTORY_PATH):\n\
  \    raise FileNotFoundError(f\"[ERREUR LOAD] Le dossier n'existe pas : {DIRECTORY_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    \n    csv_files = glob.glob(os.path.join(DIRECTORY_PATH,\
  \ \"*.csv\"))\n    if not csv_files:\n        raise ValueError(f\"Aucun fichier\
  \ CSV trouvé dans {DIRECTORY_PATH}\")\n        \n    dfs = []\n    for file in csv_files:\n\
  \        dfs.append(pd.read_csv(file, sep=SEP, low_memory=False))\n        \n  \
  \  # Concaténation verticale\n    df = pd.concat(dfs, ignore_index=True)\n    \n\
  \    duration = time.time() - start_time\n    print(f\"[LOAD] Succès. {len(csv_files)}\
  \ fichiers fusionnés ({df.shape[0]} lignes) en {duration:.2f}s.\")\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR LOAD] Erreur lors de la fusion des CSV : {str(e)}\"\
  )\n    raise e\n\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"format\"\
  : \"directory_csv\", \"files_merged\": len(csv_files), \"shape\": df.shape}\n"
