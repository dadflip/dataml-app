id: extract_http
name: 'Extract: Fichier distant (HTTP/HTTPS)'
description: Télécharge un fichier brut depuis une URL publique.
category: 1. Extract
tags:
- extract
- http
- download
code_template: "import urllib.request\nimport os\nimport time\n\n# [PARAM: FILE_URL\
  \ | string]\nFILE_URL = \"https://example.com/data.csv\"\n# [/PARAM]\n\n# [PARAM:\
  \ DEST_PATH | string]\nDEST_PATH = \"./data/raw/data.csv\"\n# [/PARAM]\n\nprint(f\"\
  [EXTRACT] Téléchargement depuis {FILE_URL} vers {DEST_PATH}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    # On simule un navigateur\
  \ pour éviter certains blocages\n    req = urllib.request.Request(FILE_URL, headers={'User-Agent':\
  \ 'Mozilla/5.0'})\n    with urllib.request.urlopen(req) as response, open(DEST_PATH,\
  \ 'wb') as out_file:\n        out_file.write(response.read())\n        \n    duration\
  \ = time.time() - start_time\n    size_mb = os.path.getsize(DEST_PATH) / (1024 *\
  \ 1024)\n    print(f\"[EXTRACT] Succès. Fichier ({size_mb:.2f} MB) téléchargé en\
  \ {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec\
  \ du téléchargement : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\n\
  task_type = \"unknown\"\nmeta = {\"source\": \"http\", \"path\": DEST_PATH}\n"
