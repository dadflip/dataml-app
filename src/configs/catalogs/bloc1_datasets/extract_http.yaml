id: extract_http
name: 'Extract: Fichier distant (HTTP/HTTPS)'
description: "Télécharge un fichier brut depuis une URL publique (HTTP/HTTPS) en émulant un navigateur pour éviter certains blocages."
when_to_use: "Pour récupérer un dataset hébergé librement sur le web (ex: archives publiques, fichiers de recherche open data)."
use_cases:
  - "Import de datasets depuis des plateformes comme Kaggle (via des liens directs), UCI Machine Learning ou des sites institutionnels."
  - "Téléchargement d'annotations complémentaires depuis un bucket S3 ou GCS public."
pros:
  - "Simple et universel, ne nécessite souvent aucune authentification."
  - "Compatible avec quasiment tous les types de fichiers (CSV, ZIP, JSON)."
cons:
  - "Les téléchargements volumineux peuvent être lents ou interrompus."
  - "Sensible aux changements d'URL ou aux restrictions de type anti-bot."
category: 1. Extract
tags:
- extract
- http
- download
code_template: |
  import urllib.request
  import os
  import time

  # [PARAM: FILE_URL | string]
  FILE_URL = "https://example.com/data.csv"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/data.csv"
  # [/PARAM]

  print(f"[EXTRACT] Téléchargement depuis {FILE_URL} vers {DEST_PATH}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      # On simule un navigateur pour éviter certains blocages
      req = urllib.request.Request(FILE_URL, headers={'User-Agent': 'Mozilla/5.0'})
      with urllib.request.urlopen(req) as response, open(DEST_PATH, 'wb') as out_file:
          out_file.write(response.read())
          
      duration = time.time() - start_time
      size_mb = os.path.getsize(DEST_PATH) / (1024 * 1024)
      print(f"[EXTRACT] Succès. Fichier ({size_mb:.2f} MB) téléchargé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec du téléchargement : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "http", "path": DEST_PATH}
