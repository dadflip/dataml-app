id: load_dir_parquet_partitioned
name: 'Load: Parquet Partitionné'
description: 'Charge un dataset Parquet Big Data organisé en sous-dossiers de partition
  (ex: /year=2023/month=05/).'
category: 2. Load
tags:
- load
- directory
- parquet
- bigdata
code_template: "import pandas as pd\nimport time\nimport os\n\n# [PARAM: DIRECTORY_PATH\
  \ | dir]\nDIRECTORY_PATH = \"./data/extracted/parquet_db\"\n# [/PARAM]\n\nprint(f\"\
  [LOAD] Chargement du dataset Parquet partitionné depuis {DIRECTORY_PATH}...\")\n\
  if not os.path.exists(DIRECTORY_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD]\
  \ Le dossier n'existe pas : {DIRECTORY_PATH}\")\n\ntry:\n    start_time = time.time()\n\
  \    \n    # pandas (via pyarrow ou fastparquet) gère nativement le directory de\
  \ partitions\n    df = pd.read_parquet(DIRECTORY_PATH, engine='auto')\n    \n  \
  \  duration = time.time() - start_time\n    print(f\"[LOAD] Succès Parquet Partitionné.\
  \ {df.shape[0]} lignes chargées en {duration:.2f}s.\")\nexcept ImportError:\n  \
  \  print(\"[ERREUR LOAD] Le module 'pyarrow' ou 'fastparquet' est requis.\")\n \
  \   raise\nexcept Exception as e:\n    print(f\"[ERREUR LOAD] Erreur lors de la\
  \ lecture des partitions Parquet : {str(e)}\")\n    raise e\n\ntarget_name = None\n\
  task_type = \"unknown\"\nmeta = {\"format\": \"parquet_partitioned\", \"shape\"\
  : df.shape}\n"
