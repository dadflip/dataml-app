id: load_dir_parquet_partitioned
name: 'Load: Parquet Partitionné'
description: 'Ce connecteur est spécialisé dans le chargement de données tabulaires massives (Big Data) stockées sous forme de fichiers Parquet partitionnés. Le format Parquet est orienté colonne, hautement compressé et optimisé pour l''analytique. La particularité des datasets partitionnés est leur structuration hiérarchique sur le disque, utilisant des répertoires pour segmenter les données selon certaines colonnes clés (par exemple, par année puis par mois : /year=2024/month=10/). Grâce à la puissance de la bibliothèque Pandas (et du moteur pyarrow ou fastparquet sous-jacent), ce bloc détecte automatiquement ces partitions, les déduit comme des colonnes virtuelles, et recompose le DataFrame complet de façon transparente et performante.'
when_to_use: 'À utiliser face à des jeux de données d''entreprise volumineux structurés dans des Data Lakes (Hadoop, S3, stockage local Big Data) utilisant le standard de partitionnement Hive/Spark pour le format Parquet.'
use_cases:
- 'Analyse de téraoctets de données transactionnelles historiques.'
- 'Chargement de logs web massifs segmentés temporellement (année, mois, jour).'
- 'Ingestion de données IoT ou télémétriques partitionnées par région et par capteur.'
- 'Transition de processus Data Engineering complexes (Spark) vers de l''analytique locale en Python/Pandas.'
pros:
- 'Performances de lecture exceptionnelles et empreinte mémoire très faible (grâce au stockage en colonnes).'
- 'Découverte automatique du schéma de partitionnement : les dossiers /key=value/ deviennent instantanément des colonnes utiles.'
- 'Prêt pour l''ère du Big Data, gère parfaitement les types de données complexes et les valeurs manquantes.'
cons:
- 'Nécessite l''installation de dépendances supplémentaires souvent lourdes (pyarrow ou fastparquet).'
- 'Gourmand en RAM si l''ensemble des partitions téléchargées dépasse la capacité de la machine locale.'
category: 2. Load
tags:
- load
- directory
- parquet
- bigdata
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: DIRECTORY_PATH | dir]
  DIRECTORY_PATH = "./data/extracted/parquet_db"
  # [/PARAM]

  print(f"[LOAD] Chargement du dataset Parquet partitionné depuis {DIRECTORY_PATH}...")
  if not os.path.exists(DIRECTORY_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Le dossier n'existe pas : {DIRECTORY_PATH}")

  try:
      start_time = time.time()
      
      # pandas (via pyarrow ou fastparquet) gère nativement le directory de partitions
      df = pd.read_parquet(DIRECTORY_PATH, engine='auto')
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Parquet Partitionné. {df.shape[0]} lignes chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'pyarrow' ou 'fastparquet' est requis.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur lors de la lecture des partitions Parquet : {str(e)}")
      raise e

  target_name = ""
  task_type = "unknown"
  meta = {"format": "parquet_partitioned", "shape": df.shape}

