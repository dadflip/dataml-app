id: extract_kaggle
name: 'Extract: Kaggle API'
description: Télécharge et décompresse un dataset via l'API officielle Kaggle.
category: 1. Extract
tags:
- extract
- kaggle
- api
code_template: "import os\nimport time\n\n# [PARAM: DATASET_ID | string]\nDATASET_ID\
  \ = \"paultimothymooney/chest-xray-pneumonia\"\n# [/PARAM]\n\n# [PARAM: DEST_DIR\
  \ | dir]\nDEST_DIR = \"./data/raw/kaggle\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Appel\
  \ à l'API Kaggle pour le dataset {DATASET_ID}...\")\nos.makedirs(DEST_DIR, exist_ok=True)\n\
  \ntry:\n    # L'import vérifie la présence du fichier ~/.kaggle/kaggle.json\n  \
  \  import kaggle\n    start_time = time.time()\n    \n    # Télécharge et dézippe\
  \ à la volée\n    kaggle.api.dataset_download_files(DATASET_ID, path=DEST_DIR, unzip=True)\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès Kaggle.\
  \ Données prêtes dans {DEST_DIR} en {duration:.2f}s.\")\nexcept ImportError:\n \
  \   print(\"[ERREUR EXTRACT] Le module 'kaggle' n'est pas installé.\")\n    raise\n\
  except Exception as e:\n    print(f\"[ERREUR EXTRACT] Impossible de télécharger\
  \ via Kaggle : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type\
  \ = \"unknown\"\nmeta = {\"source\": \"kaggle\", \"path\": DEST_DIR}\n"
illustration_mermaid: |
    graph LR
      Source[(Source)] -->|Load| Node([Extract Data])
      style Source fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style Node fill:#eff6ff,stroke:#3b82f6,stroke-width:2px

