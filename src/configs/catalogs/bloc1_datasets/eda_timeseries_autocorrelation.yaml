id: eda_timeseries_autocorrelation
name: 'EDA: Autocorrélation (ACF/PACF)'
description: Affiche les fonctions d'autocorrélation pour les séries temporelles.
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- acf
- statsmodels
code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nfrom statsmodels.graphics.tsaplots\
  \ import plot_acf, plot_pacf\n\n# [PARAM: TIME_COL | string]\nTIME_COL = \"date\"\
  \n# [/PARAM]\n\nif TIME_COL in df.columns and 'target_name' in locals() and target_name:\n\
  \    temp_df = df.dropna(subset=[TIME_COL, target_name]).sort_values(TIME_COL)\n\
  \    ts = temp_df[target_name].values\n    \n    fig, axes = plt.subplots(1, 2,\
  \ figsize=(16, 4))\n    plot_acf(ts, ax=axes[0], lags=40, title=f\"Autocorrélation\
  \ (ACF) de {target_name}\")\n    plot_pacf(ts, ax=axes[1], lags=40, title=f\"Autocorrélation\
  \ Partielle (PACF)\")\n    plt.show()\nelse:\n    print(\"[EDA] Colonnes temporelles\
  \ manquantes.\")\n"
