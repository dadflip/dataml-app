id: eda_timeseries_autocorrelation
name: 'EDA: Autocorrélation (ACF/PACF)'
description: Affiche les graphiques des fonctions d'autocorrélation (ACF) et d'autocorrélation partielle (PACF) pour analyser les dépendances temporelles d'une série.
when_to_use: "À utiliser pour identifier la saisonnalité, les tendances et les retards pertinents lors de la modélisation de séries temporelles (ex: modèles ARIMA)."
use_cases:
  - Détermination des paramètres p et q pour un modèle ARIMA.
  - Vérification de la présence d'une composante saisonnière dans les ventes mensuelles.
  - Analyse des résidus d'un modèle pour s'assurer qu'il ne reste pas d'information temporelle inexpliquée.
pros:
  - Indispensable pour la modélisation statistique avancée des séries temporelles.
  - Permet de quantifier visuellement la mémoire d'un processus stochastique.
  - Identifie clairement les effets saisonniers et les cycles.
cons:
  - L'interprétation des graphiques ACF/PACF nécessite de bonnes connaissances en statistiques.
  - Très sensible aux séries non stationnaires (nécessite souvent une différenciation préalable).
  - Ne gère pas nativement les valeurs manquantes sans traitement préalable (suppression ou imputation).
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- acf
- statsmodels
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  from statsmodels.graphics.tsaplots import plot_acf, plot_pacf
  
  # [PARAM: TIME_COL | string]
  TIME_COL = "date"
  # [/PARAM]
  
  if TIME_COL in df.columns and 'target_name' in locals() and target_name:
      temp_df = df.dropna(subset=[TIME_COL, target_name]).sort_values(TIME_COL)
      ts = temp_df[target_name].values
      
      fig, axes = plt.subplots(1, 2, figsize=(16, 4))
      plot_acf(ts, ax=axes[0], lags=40, title=f"Autocorrélation (ACF) de {target_name}")
      plot_pacf(ts, ax=axes[1], lags=40, title=f"Autocorrélation Partielle (PACF)")
      plt.show()
  else:
      print("[EDA] Colonnes temporelles manquantes.")
illustration_mermaid: |
    graph TD
      DF[/ df /] --> Params[/ TIME_COL, target_name /]
      Params --> Check{ check_cols }
      Check -- Valid --> SortDrop{ dropna_sort }
      SortDrop --> Sub{ plt.subplots }
      Sub --> Axes([ ax1, ax2 ])
      Axes --> ACF{ plot_acf }
      Axes --> PACF{ plot_pacf }
      ACF --> Show{ plt.show }
      PACF --> Show
      ACF --> Fig([ fig ])
      Check -- Missing --> Err([ Error ])
      
      style DF fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
