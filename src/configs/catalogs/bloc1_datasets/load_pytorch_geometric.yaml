id: "load_pytorch_geometric"
name: "Load: PyTorch Geometric (Graph to DataFrame + Edge Index)"
description: "Charge les données d'un graphe. Exporte les caractéristiques des nœuds dans `df` et cache la matrice d'adjacence `edge_index` dans le dictionnaire `meta` pour respecter le contrat."
when_to_use: "Idéal pour initialiser des tâches d'apprentissage sur graphes (Graph Neural Networks) en chargeant des datasets standards via la bibliothèque PyTorch Geometric."
use_cases:
  - "Classification de nœuds sur des graphes de citations (ex: Cora, Citeseer, Pubmed)."
  - "Prédiction de liens ou analyse de communautés dans des réseaux complexes."
  - "Élaboration de GNN pour des tâches relationnelles ou spatiales."
pros:
  - "Intégration directe avec les datasets classiques de la recherche en ML."
  - "Sépare clairement les caractéristiques (nodes) de la topologie (edges) dans le pipeline."
cons:
  - "Nécessite l'installation complète de l'écosystème PyTorch et PyTorch Geometric."
  - "La manipulation des arêtes via `meta` peut sembler moins intuitive qu'un format purement tabulaire."
category: "2. Load"
tags: ["load", "graph", "pytorch-geometric", "gnn"]
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      from torch_geometric.datasets import Planetoid
      import torch_geometric.transforms as T
  except ImportError:
      Planetoid = None
      print("[ERREUR LOAD] 'torch_geometric' n'est pas installé.")

  # [PARAM: DATASET_NAME | string]
  DATASET_NAME = "Cora"
  # [/PARAM]

  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "pytorch_geometric", "dataset": DATASET_NAME, "edge_index": []}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
        A[/"📄 DATASET_NAME (Cora)"/] --> B{"PyTorch Geometric Load()"}
        C[/"🎯 TARGET_COL"/] --> D{"Check TARGET_COL"}
        B --> E(["📊 df (Node Features)"])
        E --> D
        D --> F(["🎯 target_name"])
        D --> G(["⚙️ task_type"])
        D --> H(["ℹ️ meta (edge_index)"])
        style A fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
        style C fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
