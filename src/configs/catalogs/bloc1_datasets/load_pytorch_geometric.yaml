id: "load_pytorch_geometric"
name: "Load: PyTorch Geometric (Graph to DataFrame + Edge Index)"
description: "Charge les données d'un graphe. Exporte les caractéristiques des nœuds dans `df` et cache la matrice d'adjacence `edge_index` dans le dictionnaire `meta` pour respecter le contrat."
category: "2. Load"
tags: ["load", "graph", "pytorch-geometric", "gnn"]
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      from torch_geometric.datasets import Planetoid
      import torch_geometric.transforms as T
  except ImportError:
      Planetoid = None
      print("[ERREUR LOAD] 'torch_geometric' n'est pas installé.")

  # [PARAM: DATASET_NAME | string]
  DATASET_NAME = "Cora"
  # [/PARAM]

  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "pytorch_geometric", "dataset": DATASET_NAME, "edge_index": []}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
      A[fa:fa-project-diagram DATASET_NAME<br/>Cora] -->|PyTorch Geometric| B(fa:fa-cogs Load Graph)
      B --> C[(df<br/>Node Features)]
      B --> D{{meta<br/>edge_index}}
      B --> E([target_name, task_type])
      
      style A fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style B fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
      style C fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
      style D fill:#fef3c7,stroke:#d97706,stroke-width:2px
      style E fill:#f3f4f6,stroke:#6b7280,stroke-width:2px

_metadata:
  bloc: 1
  section: "2_load"
