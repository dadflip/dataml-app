id: eda_text_ngrams
name: 'EDA: N-Grams les plus fréquents'
description: Extrait les bigrammes ou trigrammes les plus courants du texte.
category: 3. Exploratory Data Analysis
tags:
- eda
- text
- nlp
- ngrams
code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\nfrom sklearn.feature_extraction.text import CountVectorizer\n\n# [PARAM:\
  \ TEXT_COL | string]\nTEXT_COL = \"text\"\n# [/PARAM]\n\n# [PARAM: N_GRAM | number]\n\
  N_GRAM = 2\n# [/PARAM]\n\nif TEXT_COL in df.columns:\n    corpus = df[TEXT_COL].dropna()\n\
  \    vec = CountVectorizer(ngram_range=(N_GRAM, N_GRAM), stop_words='english').fit(corpus)\n\
  \    bag_of_words = vec.transform(corpus)\n    sum_words = bag_of_words.sum(axis=0)\
  \ \n    \n    words_freq = [(word, sum_words[0, idx]) for word, idx in vec.vocabulary_.items()]\n\
  \    words_freq = sorted(words_freq, key=lambda x: x[1], reverse=True)[:20]\n  \
  \  \n    df_freq = pd.DataFrame(words_freq, columns=['N-gram', 'Fréquence'])\n \
  \   \n    plt.figure(figsize=(10, 8))\n    sns.barplot(x='Fréquence', y='N-gram',\
  \ data=df_freq, palette='viridis')\n    plt.title(f\"Top 20 {N_GRAM}-grams dans\
  \ {TEXT_COL}\")\n    plt.show()\nelse:\n    print(f\"[EDA] Colonne {TEXT_COL} introuvable.\"\
  )\n"
