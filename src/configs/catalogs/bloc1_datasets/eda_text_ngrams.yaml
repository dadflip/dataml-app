id: eda_text_ngrams
name: 'EDA: N-Grams les plus fréquents'
description: "Extraction et visualisation des N-grammes (bigrammes, trigrammes, etc.) les plus fréquents dans un corpus textuel."
when_to_use: "Pour comprendre les termes ou expressions qui reviennent le plus souvent dans une colonne de texte."
use_cases:
  - "Analyse des sujets principaux dans des avis clients ou commentaires."
  - "Identification des collocations courantes dans des articles."
pros:
  - "Met en évidence des mots composés souvent plus pertinents que de simples unigrammes."
  - "Utilise CountVectorizer pour une extraction rapide."
cons:
  - "Peut consommer beaucoup de mémoire sur de très gros corpus textuels."
  - "Ne filtre que les stopwords anglais par défaut."
category: 3. Exploratory Data Analysis
tags:
- eda
- text
- nlp
- ngrams
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns
  from sklearn.feature_extraction.text import CountVectorizer
  
  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]
  
  # [PARAM: N_GRAM | number]
  N_GRAM = 2
  # [/PARAM]
  
  if TEXT_COL in df.columns:
      corpus = df[TEXT_COL].dropna()
      vec = CountVectorizer(ngram_range=(N_GRAM, N_GRAM), stop_words='english').fit(corpus)
      bag_of_words = vec.transform(corpus)
      sum_words = bag_of_words.sum(axis=0) 
      
      words_freq = [(word, sum_words[0, idx]) for word, idx in vec.vocabulary_.items()]
      words_freq = sorted(words_freq, key=lambda x: x[1], reverse=True)[:20]
      
      df_freq = pd.DataFrame(words_freq, columns=['N-gram', 'Fréquence'])
      
      plt.figure(figsize=(10, 8))
      sns.barplot(x='Fréquence', y='N-gram', data=df_freq, palette='viridis')
      plt.title(f"Top 20 {N_GRAM}-grams dans {TEXT_COL}")
      plt.show()
  else:
      print(f"[EDA] Colonne {TEXT_COL} introuvable.")
