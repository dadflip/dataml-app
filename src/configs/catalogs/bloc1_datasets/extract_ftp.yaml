id: extract_ftp
name: 'Extract: Serveur FTP'
description: Télécharge un fichier depuis un serveur FTP public ou privé.
category: 1. Extract
tags:
- extract
- ftp
- server
code_template: "import ftplib\nimport os\nimport time\n\n# [PARAM: FTP_HOST | string]\n\
  FTP_HOST = \"ftp.example.com\"\n# [/PARAM]\n\n# [PARAM: FTP_PATH | string]\nFTP_PATH\
  \ = \"/pub/data.csv\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH =\
  \ \"./data/raw/ftp_data.csv\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Connexion FTP vers\
  \ {FTP_HOST}...\")\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n\
  \    start_time = time.time()\n    ftp = ftplib.FTP(FTP_HOST)\n    ftp.login() #\
  \ Anonyme par défaut\n    \n    with open(DEST_PATH, 'wb') as local_file:\n    \
  \    ftp.retrbinary(f\"RETR {FTP_PATH}\", local_file.write)\n        \n    ftp.quit()\n\
  \    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès FTP. Fichier\
  \ rapatrié en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR\
  \ EXTRACT] Impossible de récupérer le fichier FTP : {str(e)}\")\n    raise e\n\n\
  df = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"ftp\"\
  , \"path\": DEST_PATH}\n"
