id: extract_ftp
name: 'Extract: Serveur FTP'
description: Télécharge un fichier depuis un serveur FTP public ou privé.
when_to_use: Utile pour s'interfacer avec des systèmes legacy ou des partenaires externes qui mettent à disposition des fichiers plats (CSV, JSON, XML) via un serveur FTP.
use_cases:
  - Rapatriement de fichiers de transactions bancaires ou commerciales.
  - Téléchargement d'archives ou de données publiques.
pros:
  - Standard universel, très répandu dans les environnements professionnels historiques.
  - Facile à automatiser et scripter.
cons:
  - Protocole FTP standard non chiffré (contrairement à SFTP/FTPS).
  - Gestion parfois délicate des modes actif/passif derrière des pare-feux.
category: 1. Extract
tags:
- extract
- ftp
- server
code_template: |
  import ftplib
  import os
  import time
  
  # [PARAM: FTP_HOST | string]
  FTP_HOST = "ftp.example.com"
  # [/PARAM]
  
  # [PARAM: FTP_PATH | string]
  FTP_PATH = "/pub/data.csv"
  # [/PARAM]
  
  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/ftp_data.csv"
  # [/PARAM]
  
  print(f"[EXTRACT] Connexion FTP vers {FTP_HOST}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)
  
  try:
      start_time = time.time()
      ftp = ftplib.FTP(FTP_HOST)
      ftp.login() # Anonyme par défaut
      
      with open(DEST_PATH, 'wb') as local_file:
          ftp.retrbinary(f"RETR {FTP_PATH}", local_file.write)
          
      ftp.quit()
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès FTP. Fichier rapatrié en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Impossible de récupérer le fichier FTP : {str(e)}")
      raise e
  
  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "ftp", "path": DEST_PATH}
