id: extract_image_folder_zip
name: 'Extract: Image Folder (from ZIP URL)'
description: Télécharge une archive ZIP contenant un dossier d'images structuré, puis
  l'extrait sur le disque.
category: 1. Extract
tags:
- extract
- image
- vision
- zip
code_template: "import os\nimport time\nimport urllib.request\nimport zipfile\n\n\
  # [PARAM: ZIP_URL | string]\nZIP_URL = \"https://example.com/dataset_images.zip\"\
  \n# [/PARAM]\n\n# [PARAM: DEST_DIR | string]\nDEST_DIR = \"./data/raw/images_extracted\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Téléchargement et extraction du ZIP depuis {ZIP_URL}...\"\
  )\nos.makedirs(DEST_DIR, exist_ok=True)\n\ntry:\n    start_time = time.time()\n\
  \    zip_path = os.path.join(DEST_DIR, \"temp_dataset.zip\")\n    \n    urllib.request.urlretrieve(ZIP_URL,\
  \ zip_path)\n    \n    with zipfile.ZipFile(zip_path, 'r') as zip_ref:\n       \
  \ zip_ref.extractall(DEST_DIR)\n        \n    os.remove(zip_path) # Nettoyage\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] ZIP téléchargé\
  \ et extrait avec succès dans {DEST_DIR} en {duration:.2f}s.\")\n    \n    df =\
  \ None\n    target_name = None\n    task_type = \"image_classification\"\n    meta\
  \ = {\"source\": \"zip_url\", \"url\": ZIP_URL, \"path\": DEST_DIR}\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR EXTRACT] Échec de l'extraction ZIP : {str(e)}\")\n\
  \    raise e\n"
