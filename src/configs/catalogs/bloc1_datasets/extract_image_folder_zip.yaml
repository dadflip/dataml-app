id: extract_image_folder_zip
name: 'Extract: Image Folder (from ZIP URL)'
description: "Télécharge une archive ZIP contenant un dossier d'images structuré (souvent par classes), puis l'extrait sur le disque local."
when_to_use: "Lorsque le dataset est un ensemble d'images brutes regroupées dans une archive compressée et exposée via une URL."
use_cases:
  - "Projets de classification d'images où chaque dossier correspond à une classe cible."
  - "Récupération d'assets visuels hébergés de manière statique sur le web."
pros:
  - "Combine téléchargement et extraction en une seule étape propre."
  - "Nettoie automatiquement le fichier ZIP temporaire après extraction."
cons:
  - "Nécessite beaucoup d'espace disque (pour le ZIP et les données décompressées)."
  - "Peut être lent et gourmand en mémoire pour de très grandes archives."
category: 1. Extract
tags:
- extract
- image
- vision
- zip
code_template: |
  import os
  import time
  import urllib.request
  import zipfile

  # [PARAM: ZIP_URL | string]
  ZIP_URL = "https://example.com/dataset_images.zip"
  # [/PARAM]

  # [PARAM: DEST_DIR | string]
  DEST_DIR = "./data/raw/images_extracted"
  # [/PARAM]

  print(f"[EXTRACT] Téléchargement et extraction du ZIP depuis {ZIP_URL}...")
  os.makedirs(DEST_DIR, exist_ok=True)

  try:
      start_time = time.time()
      zip_path = os.path.join(DEST_DIR, "temp_dataset.zip")
      
      urllib.request.urlretrieve(ZIP_URL, zip_path)
      
      with zipfile.ZipFile(zip_path, 'r') as zip_ref:
          zip_ref.extractall(DEST_DIR)
          
      os.remove(zip_path) # Nettoyage
      
      duration = time.time() - start_time
      print(f"[EXTRACT] ZIP téléchargé et extrait avec succès dans {DEST_DIR} en {duration:.2f}s.")
      
      df = DEST_DIR
      target_name = "target"
      task_type = "image_classification"
      meta = {"source": "zip_url", "url": ZIP_URL, "path": DEST_DIR}
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec de l'extraction ZIP : {str(e)}")
      raise e
