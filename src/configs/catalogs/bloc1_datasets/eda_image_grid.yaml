id: eda_image_grid
name: 'EDA: Grille d''Images'
description: Affiche un batch d'images en grille.
category: 3. Exploratory Data Analysis
tags:
- eda
- images
- multimedia
code_template: "import matplotlib.pyplot as plt\nimport torchvision.transforms as\
  \ T\nfrom torchvision.utils import make_grid\nimport torch\n\n# [PARAM: NUM_IMAGES\
  \ | number]\nNUM_IMAGES = 16\n# [/PARAM]\n\nif 'dataset' in locals():\n    imgs\
  \ = [dataset[i][0] for i in range(min(NUM_IMAGES, len(dataset)))]\nelse:\n    imgs\
  \ = []\n    print(\"[EDA] Dataset non trouvé dans l'environnement local.\")\n\n\
  if len(imgs) > 0:\n    tensors = [T.ToTensor()(img) if not isinstance(img, torch.Tensor)\
  \ else img for img in imgs]\n    grid = make_grid(tensors, nrow=int(len(tensors)**0.5))\n\
  \    plt.figure(figsize=(10, 10))\n    plt.imshow(grid.permute(1, 2, 0).numpy())\n\
  \    plt.axis('off')\n    plt.title(f\"Aperçu de {len(imgs)} images\")\n    plt.show()\n"
