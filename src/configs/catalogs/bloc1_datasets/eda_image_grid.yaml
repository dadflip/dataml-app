id: eda_image_grid
name: 'EDA: Grille d''Images'
description: Affiche un batch d'images sous forme de grille pour une inspection visuelle rapide de la qualité du dataset.
when_to_use: À utiliser au début d'un projet de vision par ordinateur pour vérifier visuellement le contenu et la validité du jeu de données d'images.
use_cases:
- "Vérification de l'intégrité des images après le chargement"
- "Inspection visuelle des transformations appliquées"
- "Aperçu global de la diversité du jeu de données"
pros:
- "Permet de repérer rapidement les images corrompues"
- "Très simple et intuitif à interpréter"
- "Code minimaliste utilisant des standards comme torchvision"
cons:
- "Limité au contrôle visuel, sans analyse quantitative"
- "Peut être gourmand en mémoire pour de larges résolutions"
category: 3. Exploratory Data Analysis
tags:
- eda
- images
- multimedia
code_template: |
  import matplotlib.pyplot as plt
  import torchvision.transforms as T
  from torchvision.utils import make_grid
  import torch

  # [PARAM: NUM_IMAGES | number]
  NUM_IMAGES = 16
  # [/PARAM]

  if 'dataset' in locals():
      imgs = [dataset[i][0] for i in range(min(NUM_IMAGES, len(dataset)))]
  else:
      imgs = []
      print("[EDA] Dataset non trouvé dans l'environnement local.")

  if len(imgs) > 0:
      tensors = [T.ToTensor()(img) if not isinstance(img, torch.Tensor) else img for img in imgs]
      grid = make_grid(tensors, nrow=int(len(tensors)**0.5))
      plt.figure(figsize=(10, 10))
      plt.imshow(grid.permute(1, 2, 0).numpy())
      plt.axis('off')
      plt.title(f"Aperçu de {len(imgs)} images")
      plt.show()
illustration_mermaid: |
    flowchart TD
        InDataset[/ dataset /] --> Check{ Check_Dataset }
