id: eda_image_grid
name: 'EDA: Grille d''Images'
description: Affiche un batch d'images en grille.
category: 3. Exploratory Data Analysis
tags:
- eda
- images
- multimedia
code_template: |
  import matplotlib.pyplot as plt
  import torchvision.transforms as T
  from torchvision.utils import make_grid
  import torch

  # [PARAM: NUM_IMAGES | number]
  NUM_IMAGES = 16
  # [/PARAM]

  if 'dataset' in locals():
      imgs = [dataset[i][0] for i in range(min(NUM_IMAGES, len(dataset)))]
  else:
      imgs = []
      print("[EDA] Dataset non trouvé dans l'environnement local.")

  if len(imgs) > 0:
      tensors = [T.ToTensor()(img) if not isinstance(img, torch.Tensor) else img for img in imgs]
      grid = make_grid(tensors, nrow=int(len(tensors)**0.5))
      plt.figure(figsize=(10, 10))
      plt.imshow(grid.permute(1, 2, 0).numpy())
      plt.axis('off')
      plt.title(f"Aperçu de {len(imgs)} images")
      plt.show()
illustration_mermaid: |
    flowchart TD
        Dataset([Image Dataset]) --> Check{Is dataset available?}
        Check -- Yes --> Extract[Extract First N Images]
        Extract --> Convert[Convert to PyTorch Tensors]
        Convert --> Grid[Make Grid of Images]
        Grid --> Transpose[Permute Dimensions for Matplotlib]
        Transpose --> Plot{{Display Image Grid}}
        Check -- No --> Error[/Print Error/]
        
        style Dataset fill:#0284c7,stroke:#0369a1,color:#fff
        style Convert fill:#10b981,stroke:#059669,color:#fff
        style Grid fill:#8b5cf6,stroke:#7c3aed,color:#fff
