id: load_html_tables
name: 'Load: Tableaux HTML'
description: Parse une page web HTML et extrait tous les tableaux <table> dans une
  liste de DataFrames.
category: 2. Load
tags:
- load
- html
- tables
- pandas
code_template: "import pandas as pd\nimport time\nimport os\n\n# [PARAM: FILE_PATH\
  \ | file]\nFILE_PATH = \"./data/raw/page.html\"\n# [/PARAM]\n\nprint(f\"[LOAD] Extraction\
  \ des tableaux HTML depuis {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n\
  \    raise FileNotFoundError(f\"[ERREUR LOAD] Fichier HTML introuvable : {FILE_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    # read_html nécessite lxml ou html5lib\n\
  \    dfs = pd.read_html(FILE_PATH)\n    \n    duration = time.time() - start_time\n\
  \    print(f\"[LOAD] Succès HTML. {len(dfs)} tableaux trouvés en {duration:.2f}s.\"\
  )\n    \n    # Par défaut on garde le premier tableau, souvent le plus grand ou\
  \ le principal\n    df = dfs[0] if len(dfs) > 0 else pd.DataFrame()\nexcept ImportError:\n\
  \    print(\"[ERREUR LOAD] Le module 'lxml' est requis.\")\n    raise\nexcept ValueError:\n\
  \    print(\"[ERREUR LOAD] Aucun tableau trouvé dans le fichier HTML.\")\n    df\
  \ = pd.DataFrame()\n    dfs = []\nexcept Exception as e:\n    print(f\"[ERREUR LOAD]\
  \ Erreur de lecture HTML : {str(e)}\")\n    raise e\n\ntarget_name = None\ntask_type\
  \ = \"unknown\"\nmeta = {\"format\": \"html_table\", \"tables_found\": len(dfs),\
  \ \"primary_shape\": df.shape}\n"
illustration_mermaid: |
    graph LR
      Source[(Source)] -->|Load| Node([Extract Data])
      style Source fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style Node fill:#eff6ff,stroke:#3b82f6,stroke-width:2px

