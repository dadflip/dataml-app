id: load_html_tables
name: 'Load: Tableaux HTML'
description: Parse une page web HTML et extrait tous les tableaux <table> dans une liste de DataFrames.
when_to_use: À utiliser lorsque vous devez récupérer des données structurées affichées sous forme de tableaux classiques directement depuis une page web ou un fichier HTML local.
use_cases:
  - "Web scraping de données statistiques publiques."
  - "Extraction de données financières depuis des rapports HTML."
  - "Collecte d'informations depuis des wikis ou catalogues en ligne."
pros:
  - "Extraction très rapide et automatique grâce à Pandas (read_html)."
  - "Permet de récupérer plusieurs tables simultanément."
cons:
  - "Nécessite souvent des dépendances supplémentaires comme lxml ou html5lib."
  - "Les tableaux HTML mal formés ou générés dynamiquement (JavaScript) ne seront pas correctement extraits."
category: 2. Load
tags:
- load
- html
- tables
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/page.html"
  # [/PARAM]

  print(f"[LOAD] Extraction des tableaux HTML depuis {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier HTML introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      # read_html nécessite lxml ou html5lib
      dfs = pd.read_html(FILE_PATH)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès HTML. {len(dfs)} tableaux trouvés en {duration:.2f}s.")
      
      # Par défaut on garde le premier tableau, souvent le plus grand ou le principal
      df = dfs[0] if len(dfs) > 0 else pd.DataFrame()
  except ImportError:
      print("[ERREUR LOAD] Le module 'lxml' est requis.")
      raise
  except ValueError:
      print("[ERREUR LOAD] Aucun tableau trouvé dans le fichier HTML.")
      df = pd.DataFrame()
      dfs = []
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur de lecture HTML : {str(e)}")
      raise e

  target_name = ""
  task_type = "unknown"
  meta = {"format": "html_table", "tables_found": len(dfs), "primary_shape": df.shape}
