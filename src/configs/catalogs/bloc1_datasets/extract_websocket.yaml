id: extract_websocket
name: 'Extract: WebSocket Stream'
description: Écoute un WebSocket pendant N secondes et enregistre les trames.
when_to_use: "Pour capturer un flux de données en temps réel via un protocole WebSocket (événements, ticks de marché)."
use_cases:
  - "Enregistrement de cotations boursières ou cryptos depuis un exchange (Binance, Coinbase)."
  - "Récupération d'un flux d'événements live IoT ou de télémétrie."
pros:
  - "Permet de constituer un historique depuis un flux en continu."
  - "Léger et asynchrone."
cons:
  - "Bloquant pendant la durée d'écoute spécifiée."
  - "Risque de perte de données si la connexion est interrompue (nécessite une stratégie de reconnexion dans un usage avancé)."
category: 1. Extract
tags:
- extract
- websocket
- stream
- realtime
code_template: |
  import asyncio
  import websockets
  import os
  import time
  import pandas as pd

  # [PARAM: WS_URL | string]
  WS_URL = "wss://stream.binance.com:9443/ws/btcusdt@trade"
  # [/PARAM]

  # [PARAM: DURATION_SEC | string]
  DURATION_SEC = "5"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/websocket_stream.jsonlines"
  # [/PARAM]

  print(f"[EXTRACT] Écoute de {WS_URL} pendant {DURATION_SEC} sec...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  async def dump_stream():
      messages = []
      start_time = time.time()
      try:
          async with websockets.connect(WS_URL) as websocket:
              while (time.time() - start_time) < int(DURATION_SEC):
                  msg = await asyncio.wait_for(websocket.recv(), timeout=2.0)
                  messages.append(msg)
      except asyncio.TimeoutError:
          pass
      
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          for m in messages:
              f.write(m + "\n")
      return len(messages)

  try:
      count = asyncio.run(dump_stream())
      print(f"[EXTRACT] Succès WebSocket. {count} messages capturés.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec WebSocket : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {"source": "websocket", "path": DEST_PATH}

