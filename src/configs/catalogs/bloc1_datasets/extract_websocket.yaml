id: extract_websocket
name: 'Extract: WebSocket Stream'
description: Écoute un WebSocket pendant N secondes et enregistre les trames.
category: 1. Extract
tags:
- extract
- websocket
- stream
- realtime
code_template: "import asyncio\nimport websockets\nimport os\nimport time\n\n# [PARAM:\
  \ WS_URL | string]\nWS_URL = \"wss://stream.binance.com:9443/ws/btcusdt@trade\"\n\
  # [/PARAM]\n\n# [PARAM: DURATION_SEC | string]\nDURATION_SEC = \"5\"\n# [/PARAM]\n\
  \n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/websocket_stream.jsonlines\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Écoute de {WS_URL} pendant {DURATION_SEC} sec...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\nasync def dump_stream():\n\
  \    messages = []\n    start_time = time.time()\n    try:\n        async with websockets.connect(WS_URL)\
  \ as websocket:\n            while (time.time() - start_time) < int(DURATION_SEC):\n\
  \                msg = await asyncio.wait_for(websocket.recv(), timeout=2.0)\n \
  \               messages.append(msg)\n    except asyncio.TimeoutError:\n       \
  \ pass\n    \n    with open(DEST_PATH, \"w\", encoding=\"utf-8\") as f:\n      \
  \  for m in messages:\n            f.write(m + \"\\\\n\")\n    return len(messages)\n\
  \ntry:\n    count = asyncio.run(dump_stream())\n    print(f\"[EXTRACT] Succès WebSocket.\
  \ {count} messages capturés.\")\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT]\
  \ Échec WebSocket : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\n\
  task_type = \"unknown\"\nmeta = {\"source\": \"websocket\", \"path\": DEST_PATH}\n"
