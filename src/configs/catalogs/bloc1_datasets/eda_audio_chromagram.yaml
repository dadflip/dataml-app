id: eda_audio_chromagram
name: 'EDA: Visualisation Temporelle Audio'
description: Trace la puissance du signal audio (Energy).
category: 3. Exploratory Data Analysis
tags:
- eda
- audio
- multimedia
code_template: "import matplotlib.pyplot as plt\nimport numpy as np\n\nif 'waveform'\
  \ in locals():\n    signal = waveform[0].numpy()\n    # Calcul de l'énergie locale\
  \ au carré (fenêtres glissantes très basique)\n    window = 100\n    energy = np.convolve(signal**2,\
  \ np.ones(window)/window, mode='same')\n    \n    plt.figure(figsize=(10, 4))\n\
  \    plt.plot(energy, color='orange')\n    plt.title(\"Énergie temporelle du signal\
  \ audio\")\n    plt.xlabel(\"Frames\")\n    plt.ylabel(\"Énergie\")\n    plt.show()\n\
  else:\n    print(\"[EDA] Tensor 'waveform' introuvable.\")\n"
