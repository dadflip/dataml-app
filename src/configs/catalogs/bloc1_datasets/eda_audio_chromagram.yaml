id: eda_audio_chromagram
name: 'EDA: Visualisation Temporelle Audio'
description: "Trace la puissance du signal audio (énergie temporelle) à l'aide d'une fenêtre glissante."
when_to_use: "Pour visualiser les variations d'intensité d'un signal audio au fil du temps."
use_cases:
  - "Détection de silences ou d'attaques."
  - "Analyse de la dynamique d'un enregistrement."
pros:
  - "Calcul rapide et simple."
  - "Visualisation claire des pics d'énergie."
cons:
  - "Perte des informations fréquentielles."
  - "Sensible au bruit ambiant."
category: 3. Exploratory Data Analysis
tags:
- eda
- audio
- multimedia
code_template: |
  import matplotlib.pyplot as plt
  import numpy as np

  if 'waveform' in locals():
      signal = waveform[0].numpy()
      # Calcul de l'énergie locale au carré (fenêtres glissantes très basique)
      window = 100
      energy = np.convolve(signal**2, np.ones(window)/window, mode='same')
      
      plt.figure(figsize=(10, 4))
      plt.plot(energy, color='orange')
      plt.title("Énergie temporelle du signal audio")
      plt.xlabel("Frames")
      plt.ylabel("Énergie")
      plt.show()
  else:
      print("[EDA] Tensor 'waveform' introuvable.")
