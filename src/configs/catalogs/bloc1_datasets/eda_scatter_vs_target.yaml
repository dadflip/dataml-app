id: eda_scatter_vs_target
name: 'EDA: Scatter vs Target'
description: Nuage de points de chaque feature contre une cible continue.
when_to_use: "Pour explorer la relation entre plusieurs variables prédictives continues et une variable cible continue (problème de régression)."
use_cases:
  - "Recherche visuelle d'une tendance linéaire ou non-linéaire."
  - "Détection de corrélations fortes avec la cible."
pros:
  - "Très parlant pour identifier visuellement si une feature est un bon prédicteur."
  - "Aide à identifier les outliers spécifiques qui faussent une relation."
cons:
  - "Uniquement pertinent pour les problèmes de régression avec une cible continue."
  - "Risque de sur-saturation de l'image (overplotting) si le dataset est massif."
category: 3. Exploratory Data Analysis
tags:
- eda
- scatter
- tabular
- regression
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns
  
  if 'target_name' in locals() and target_name and target_name in df.columns:
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if target_name in num_cols:
          num_cols.remove(target_name)
      if len(num_cols) > 12:
          num_cols = num_cols[:12]
          
      print(f"[EDA] === SCATTER PLOTS vs {target_name} ===")
      plt.figure(figsize=(15, 4 * ((len(num_cols) + 2) // 3)))
      for i, col in enumerate(num_cols):
          plt.subplot(((len(num_cols) + 2) // 3), 3, i + 1)
          sns.scatterplot(data=df, x=col, y=target_name, alpha=0.5)
          plt.title(f"{target_name} vs {col}")
      plt.tight_layout()
      plt.show()
  else:
      print("[EDA] Cible (target_name) introuvable ou non définie.")
