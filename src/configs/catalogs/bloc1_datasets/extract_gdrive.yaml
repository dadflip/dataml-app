id: extract_gdrive
name: 'Extract: Google Drive'
description: Télécharge un fichier public depuis Google Drive.
when_to_use: Parfait pour récupérer rapidement des données partagées publiquement par la communauté ou des collaborateurs via des liens Google Drive.
use_cases:
  - Récupération de datasets open-source partagés via Drive.
  - Téléchargement de poids de modèles de machine learning ou de jeux de données massifs.
pros:
  - Outil `gdown` très robuste pour le téléchargement de gros fichiers depuis Drive.
  - Extrêmement simple pour le partage de données ponctuelles.
cons:
  - Limité aux fichiers accessibles publiquement avec un lien.
  - Google Drive impose parfois des limites de téléchargement quotidien (quotas).
category: 1. Extract
tags:
- extract
- gdrive
- google
code_template: |
  import os
  import time
  import subprocess

  # [PARAM: FILE_ID | string]
  FILE_ID = "1A2B3C4D5E6F7G8H9I"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/gdrive_data.csv"
  # [/PARAM]

  print(f"[EXTRACT] Téléchargement depuis Google Drive (ID: {FILE_ID})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      # gdown est très robuste pour les gros fichiers Drive
      result = subprocess.run(
          ["gdown", f"https://drive.google.com/uc?id={FILE_ID}", "-O", DEST_PATH],
          capture_output=True, text=True
      )
      
      if result.returncode != 0:
          raise RuntimeError(result.stderr)
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès GDrive. Fichier rapatrié en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Erreur gdown (Lien privé ou module non installé) : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "gdrive", "path": DEST_PATH}
