id: extract_gdrive
name: 'Extract: Google Drive'
description: Télécharge un fichier public depuis Google Drive.
category: 1. Extract
tags:
- extract
- gdrive
- google
code_template: "import os\nimport time\nimport subprocess\n\n# [PARAM: FILE_ID | string]\n\
  FILE_ID = \"1A2B3C4D5E6F7G8H9I\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\n\
  DEST_PATH = \"./data/raw/gdrive_data.csv\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Téléchargement\
  \ depuis Google Drive (ID: {FILE_ID})...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    # gdown est très robuste\
  \ pour les gros fichiers Drive\n    result = subprocess.run(\n        [\"gdown\"\
  , f\"https://drive.google.com/uc?id={FILE_ID}\", \"-O\", DEST_PATH],\n        capture_output=True,\
  \ text=True\n    )\n    \n    if result.returncode != 0:\n        raise RuntimeError(result.stderr)\n\
  \        \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès\
  \ GDrive. Fichier rapatrié en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"\
  [ERREUR EXTRACT] Erreur gdown (Lien privé ou module non installé) : {str(e)}\")\n\
  \    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"\
  source\": \"gdrive\", \"path\": DEST_PATH}\n"
