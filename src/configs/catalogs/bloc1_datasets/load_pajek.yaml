id: "load_pajek"
name: "Load: Fichier Pajek (.net)"
description: "Ce composant charge une structure de graphe depuis un fichier au format Pajek (.net). Il s'appuie sur la bibliothèque NetworkX pour extraire les caractéristiques des nœuds dans une DataFrame et conserver les relations (les arêtes) dans les métadonnées."
when_to_use: "À utiliser pour charger des réseaux complexes ou sociaux à analyser via des modèles d'apprentissage sur graphe (Graph Neural Networks) ou pour des analyses de centralité."
use_cases:
  - "Analyse de la propagation d'informations dans un réseau social."
  - "Détection de communautés ou de structures sous-jacentes dans des graphes de communication."
  - "Prédiction de liens (Link Prediction) ou classification de nœuds (Node Classification)."
pros:
  - "Prend en charge la structure riche des graphes (nœuds, arêtes, poids)."
  - "Sépare intelligemment les attributs des nœuds et la topologie du graphe (`edge_index`)."
cons:
  - "Le traitement des graphes très denses via NetworkX peut être lent en Python pur."
  - "Nécessite la bibliothèque `networkx` qui peut demander des conversions supplémentaires pour PyTorch Geometric."
category: "2. Load"
tags: ["load", "graph", "pajek", "networkx"]
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      import networkx as nx
  except ImportError:
      nx = None
      print("[ERREUR LOAD] 'networkx' n'est pas installé.")

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/graph.net"
  # [/PARAM]

  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "pajek", "path": FILE_PATH, "edge_index": []}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
  flowchart LR
      A[/"📄 FILE_PATH"/] --> B{"Read Pajek Graph"}
      C[/"🎯 TARGET_COL"/] --> D{"Check TARGET_COL"}
      B --> E(["📊 df (DataFrame)"])
      E --> D
      D --> F(["🎯 target_name"])
      D --> G(["⚙️ task_type"])
      D --> H(["ℹ️ meta (...)"])
      style A fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
      style C fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
      style B fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style D fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style E fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
