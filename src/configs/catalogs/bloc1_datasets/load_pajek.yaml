id: "load_pajek"
name: "Load: Fichier Pajek (.net)"
description: "Charge un graphe au format Pajek (.net) via NetworkX. Exporte les attributs des noeuds dans df et l'edge_index dans meta."
category: "2. Load"
tags: ["load", "graph", "pajek", "networkx"]
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      import networkx as nx
  except ImportError:
      nx = None
      print("[ERREUR LOAD] 'networkx' n'est pas installé.")

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/graph.net"
  # [/PARAM]

  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "pajek", "path": FILE_PATH, "edge_index": []}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
      A[fa:fa-project-diagram FILE_PATH<br/>graph.net] -->|networkx| B(fa:fa-cogs Read Pajek Graph)
      B --> C[(df<br/>Node Attributes)]
      B --> D{{meta<br/>edge_index}}
      B --> E([target_name, task_type])
      
      style A fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style B fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
      style C fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
      style D fill:#fef3c7,stroke:#d97706,stroke-width:2px
      style E fill:#f3f4f6,stroke:#6b7280,stroke-width:2px

_metadata:
  bloc: 1
  section: "2_load"
