id: "load_pdb"
name: "Load: Protéine 3D PDB"
description: "Charge les coordonnées atomiques 3D d'une protéine (.pdb) via Biopython."
when_to_use: "À utiliser pour charger et analyser des structures protéiques 3D expérimentales ou prédites (ex: issues d'AlphaFold) afin d'extraire des caractéristiques géométriques ou physico-chimiques."
use_cases:
  - "Prédiction de sites de liaison ou d'interactions protéine-protéine."
  - "Analyse structurelle et extraction de features pour des graphes moléculaires (GNN)."
  - "Modélisation des facteurs B (B-factors) ou de la flexibilité de la protéine."
pros:
  - "Permet de travailler avec des données spatiales et tridimensionnelles réelles."
  - "Gère automatiquement l'extraction des modèles, chaînes, résidus et atomes via Biopython."
cons:
  - "Le chargement peut être lent pour de très grandes structures multimériques."
  - "Génère un grand nombre de lignes (une par atome), nécessitant parfois une agrégation au niveau du résidu."
category: "2. Load"
tags: ["load", "pdb", "protein", "3d"]
code_template: |
  import pandas as pd
  import os
  from Bio.PDB import PDBParser
  import warnings

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.pdb"
  # [/PARAM]

  meta = {"source": "PDB", "path": FILE_PATH}

  if os.path.exists(FILE_PATH):
      try:
          # Use Biopython to parse the PDB file
          parser = PDBParser(PERMISSIVE=1)
          
          # Suppress Biopython warnings for missing elements
          with warnings.catch_warnings():
              warnings.simplefilter('ignore')
              structure = parser.get_structure("protein", FILE_PATH)

          atoms_data = []
          for model in structure:
              for chain in model:
                  for residue in chain:
                      for atom in residue:
                          atoms_data.append({
                              "model": model.id,
                              "chain": chain.id,
                              "residue_name": residue.resname,
                              "residue_id": residue.id[1],
                              "atom_name": atom.name,
                              "x": atom.coord[0],
                              "y": atom.coord[1],
                              "z": atom.coord[2],
                              "bfactor": atom.bfactor,
                              "occupancy": atom.occupancy
                          })
          df = pd.DataFrame(atoms_data)
          meta["num_atoms"] = len(df)
      except Exception as e:
          print(f"Error loading PDB file {FILE_PATH}: {e}")
          df = pd.DataFrame()
  else:
      print(f"File not found: {FILE_PATH}")
      df = pd.DataFrame()

  target_name = "bfactor"
  task_type = "regression"
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
        A[/"📄 FILE_PATH (data.pdb)"/] --> B{"Biopython Parse()"}
