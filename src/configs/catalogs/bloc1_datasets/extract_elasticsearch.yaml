id: extract_elasticsearch
name: 'Extract: Elasticsearch'
description: Recherche et dump des documents depuis un index Elasticsearch (Scroll
  API).
category: 1. Extract
tags:
- extract
- elasticsearch
- search
- nosql
code_template: "from elasticsearch import Elasticsearch\nfrom elasticsearch.helpers\
  \ import scan\nimport json\nimport os\nimport time\n\n# [PARAM: ES_URL | string]\n\
  ES_URL = \"http://localhost:9200\"\n# [/PARAM]\n\n# [PARAM: INDEX_NAME | string]\n\
  INDEX_NAME = \"logs-*\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH\
  \ = \"./data/raw/es_dump.jsonlines\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Scan de l'index\
  \ {INDEX_NAME} sur Elasticsearch ({ES_URL})...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    es = Elasticsearch(ES_URL)\n\
  \    \n    query = {\"query\": {\"match_all\": {}}}\n    count = 0\n    \n    with\
  \ open(DEST_PATH, \"w\", encoding=\"utf-8\") as f:\n        for doc in scan(es,\
  \ query=query, index=INDEX_NAME):\n            f.write(json.dumps(doc[\"_source\"\
  ]) + \"\\\\n\")\n            count += 1\n            \n    duration = time.time()\
  \ - start_time\n    print(f\"[EXTRACT] Succès Elasticsearch. {count} documents dumpés\
  \ en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT]\
  \ Échec Elasticsearch : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\n\
  task_type = \"unknown\"\nmeta = {\"source\": \"elasticsearch\", \"path\": DEST_PATH}\n"
