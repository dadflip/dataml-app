id: load_dir_text_corpus
name: 'Load: Dossier de Textes (Corpus)'
description: Parcourt un dossier et lit tous les fichiers textes bruts (.txt) dans
  un DataFrame.
category: 2. Load
tags:
- load
- directory
- text
- nlp
code_template: "import os\nimport glob\nimport pandas as pd\nimport time\n\n# [PARAM:\
  \ DIRECTORY_PATH | dir]\nDIRECTORY_PATH = \"./data/extracted/text_corpus\"\n# [/PARAM]\n\
  \nprint(f\"[LOAD] Lecture des fichiers texte dans {DIRECTORY_PATH}...\")\nif not\
  \ os.path.exists(DIRECTORY_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD]\
  \ Le dossier n'existe pas : {DIRECTORY_PATH}\")\n\ntry:\n    start_time = time.time()\n\
  \    \n    txt_files = glob.glob(os.path.join(DIRECTORY_PATH, \"*.txt\"))\n    if\
  \ not txt_files:\n        raise ValueError(f\"Aucun fichier .txt trouvé dans {DIRECTORY_PATH}\"\
  )\n        \n    data = []\n    for file in txt_files:\n        with open(file,\
  \ 'r', encoding='utf-8') as f:\n            content = f.read()\n            data.append({\n\
  \                \"filename\": os.path.basename(file),\n                \"text\"\
  : content\n            })\n            \n    df = pd.DataFrame(data)\n    \n   \
  \ duration = time.time() - start_time\n    print(f\"[LOAD] Succès Corpus NLP. {len(txt_files)}\
  \ textes lus en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR\
  \ LOAD] Erreur lors de la lecture du corpus : {str(e)}\")\n    raise e\n\ntarget_name\
  \ = None\ntask_type = \"nlp\"\nmeta = {\"format\": \"directory_text\", \"documents\"\
  : len(df)}\n"
