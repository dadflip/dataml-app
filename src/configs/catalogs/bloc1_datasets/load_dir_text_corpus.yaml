id: load_dir_text_corpus
name: 'Load Text Directory'
description: "Charge un dossier contenant de multiples fichiers texte (.txt) dans un DataFrame pandas. Chaque ligne du DataFrame représentera un fichier avec son nom et son contenu complet."
when_to_use: "À utiliser pour charger un corpus de documents textuels non structurés en préparation pour du Traitement du Langage Naturel (NLP)."
use_cases:
  - "Chargement d'articles de presse pour analyse de sentiment."
  - "Lecture de descriptions produits pour classification thématique."
pros:
  - "Très simple à utiliser pour un corpus plat de fichiers .txt."
  - "Parfait pour initialiser une tâche NLP basique."
cons:
  - "Ne gère pas les sous-dossiers (corpus hiérarchique)."
  - "Peut consommer beaucoup de mémoire si les fichiers texte sont très volumineux."
category: 2. Data Loading
tags:
- load
- nlp
- text
- directory
code_template: |
  import os
  import glob
  import pandas as pd
  import time

  # [PARAM: DIRECTORY_PATH | dir]
  DIRECTORY_PATH = "./data/extracted/text_corpus"
  # [/PARAM]

  print(f"[LOAD] Lecture des fichiers texte dans {DIRECTORY_PATH}...")
  if not os.path.exists(DIRECTORY_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Le dossier n'existe pas : {DIRECTORY_PATH}")

  try:
      start_time = time.time()
      
      txt_files = glob.glob(os.path.join(DIRECTORY_PATH, "*.txt"))
      if not txt_files:
          raise ValueError(f"Aucun fichier .txt trouvé dans {DIRECTORY_PATH}")
          
      data = []
      for file in txt_files:
          with open(file, 'r', encoding='utf-8') as f:
              content = f.read()
              data.append({
                  "filename": os.path.basename(file),
                  "text": content
              })
              
      df = pd.DataFrame(data)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Corpus NLP. {len(txt_files)} textes lus en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur lors de la lecture du corpus : {str(e)}")
      raise e

  target_name = ""
  task_type = "nlp"
  meta = {"format": "directory_text", "documents": len(df)}

