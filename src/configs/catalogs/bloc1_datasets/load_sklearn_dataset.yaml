id: load_sklearn_dataset
name: 'Load: Sklearn Dataset'
description: "Charge un jeu de données intégré depuis sklearn.datasets (ex: iris, breast_cancer, diabetes) dans un DataFrame Pandas."
when_to_use: "À utiliser pour des tests rapides, des tutoriels ou le prototypage de modèles de machine learning sans avoir à charger des fichiers externes."
use_cases:
  - "Évaluation de nouveaux algorithmes sur des données standardisées."
  - "Création d'exemples reproductibles de pipelines ML."
  - "Découverte et apprentissage des concepts de base en data science."
pros:
  - "Données propres et prêtes à l'emploi (aucun prétraitement requis)."
  - "Chargement immédiat en mémoire sans configuration complexe."
  - "Idéal pour valider le fonctionnement d'un script ou d'un modèle."
cons:
  - "Taille des jeux de données très restreinte."
  - "Ne reflète pas la complexité et le bruit des données réelles d'entreprise."
category: 2. Load
tags:
- load
- sklearn
- datasets
- tabular
code_template: |
  import pandas as pd
  from sklearn import datasets

  # [PARAM: DATASET_NAME | string | options: iris, breast_cancer, diabetes, digits, wine]
  DATASET_NAME = "iris"
  # [/PARAM]

  print(f"[LOAD] Chargement du dataset sklearn : {DATASET_NAME}...")

  try:
      if DATASET_NAME == "iris":
          data = datasets.load_iris(as_frame=True)
      elif DATASET_NAME == "breast_cancer":
          data = datasets.load_breast_cancer(as_frame=True)
      elif DATASET_NAME == "diabetes":
          data = datasets.load_diabetes(as_frame=True)
      elif DATASET_NAME == "wine":
          data = datasets.load_wine(as_frame=True)
      elif DATASET_NAME == "digits":
          data = datasets.load_digits(as_frame=True)
      else:
          raise ValueError(f"Dataset {DATASET_NAME} non pris en charge.")
      
      df = data.frame
      target_name = "target"
          
      print(f"[LOAD] Succès. {df.shape[0]} lignes, {df.shape[1]} colonnes chargées.")
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de charger le dataset : {str(e)}")
      raise e

  task_type = "classification" if df[target_name].nunique() < 20 else "regression"
  meta = {"format": "sklearn_bunch", "dataset": DATASET_NAME, "shape": df.shape}

