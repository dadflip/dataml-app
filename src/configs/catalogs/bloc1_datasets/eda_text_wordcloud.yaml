id: eda_text_wordcloud
name: 'EDA: Nuage de Mots'
description: Génère un WordCloud à partir d'une colonne de texte pour visualiser les mots les plus fréquents.
when_to_use: À utiliser lors de l'exploration initiale de données textuelles pour identifier rapidement les termes prédominants et les thèmes récurrents dans une colonne spécifique.
use_cases:
  - Analyse des avis clients pour extraire les mots-clés positifs ou négatifs.
  - Exploration de descriptions de produits ou de résumés d'articles.
  - Visualisation des hashtags les plus populaires dans des données de réseaux sociaux.
pros:
  - Fournit une vue d'ensemble très intuitive et visuelle des données textuelles.
  - Permet d'identifier rapidement les tendances ou les mots-clés dominants sans analyse complexe.
  - Facilement compréhensible par un public non technique.
cons:
  - Ne donne pas de contexte sur l'utilisation des mots (ex: ironie, négation).
  - La taille des mots peut parfois être trompeuse si de nombreux mots vides (stop words) ne sont pas filtrés.
  - Difficile d'analyser quantitativement les fréquences précises.
category: 3. Exploratory Data Analysis
tags:
- eda
- text
- nlp
- wordcloud
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  from wordcloud import WordCloud
  
  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]
  
  if TEXT_COL in df.columns:
      text_data = " ".join([str(t) for t in df[TEXT_COL] if isinstance(t, str)])
      if text_data.strip():
          wordcloud = WordCloud(width=800, height=400, background_color='white').generate(text_data)
          plt.figure(figsize=(12, 6))
          plt.imshow(wordcloud, interpolation='bilinear')
          plt.axis('off')
          plt.title("Nuage de mots")
          plt.show()
      else:
          print("[EDA] Texte vide.")
  else:
      print(f"[EDA] Colonne {TEXT_COL} introuvable.")
