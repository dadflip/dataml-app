code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nfrom wordcloud\
  \ import WordCloud\n\n# [PARAM: TEXT_COL | string]\nTEXT_COL = \"text\"\n# [/PARAM]\n\
  \nif TEXT_COL in df.columns:\n    text_data = \" \".join([str(t) for t in df[TEXT_COL]\
  \ if isinstance(t, str)])\n    if text_data.strip():\n        wordcloud = WordCloud(width=800,\
  \ height=400, background_color='white').generate(text_data)\n        plt.figure(figsize=(12,\
  \ 6))\n        plt.imshow(wordcloud, interpolation='bilinear')\n        plt.axis('off')\n\
  \        plt.title(\"Nuage de mots\")\n        plt.show()\n    else:\n        print(\"\
  [EDA] Texte vide.\")\nelse:\n    print(f\"[EDA] Colonne {TEXT_COL} introuvable.\"\
  )\n"
