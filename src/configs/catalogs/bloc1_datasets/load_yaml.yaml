id: "load_yaml"
name: "Load: Configuration YAML"
description: "Parse un fichier de configuration YAML en dictionnaire Python."
category: "2. Load"
tags: ["load", "yaml", "config", "dict"]
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/config.yaml"
  # [/PARAM]

  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "YAML", "path": FILE_PATH}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
        YAML[("YAML File\n(.yaml)")] -->|FILE_PATH| Load(["Load\nYAML"])
        Load --> df(["df (None)"])
        Load --> target_name(["target_name (None)"])
        Load --> task_type(["task_type ('unknown')"])
        Load --> meta(["meta (dict)"])

        style YAML fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style Load fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
        style df fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px
        style target_name fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px
        style task_type fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px
        style meta fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px

_metadata:
  bloc: 1
  section: "2_load"
