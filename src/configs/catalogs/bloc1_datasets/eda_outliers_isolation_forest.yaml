id: eda_outliers_isolation_forest
name: 'EDA: Détection Outliers (Isolation Forest)'
description: Repère visuellement les anomalies multivariées via Isolation Forest.
category: 3. Exploratory Data Analysis
tags:
- eda
- outliers
- tabular
- sklearn
code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\nfrom sklearn.ensemble import IsolationForest\n\n\
  # [PARAM: CONTAMINATION | number]\nCONTAMINATION = 0.05\n# [/PARAM]\n\nnum_df =\
  \ df.select_dtypes(include=[np.number]).dropna()\nif len(num_df) > 50 and len(num_df.columns)\
  \ >= 2:\n    iso = IsolationForest(contamination=CONTAMINATION, random_state=42)\n\
  \    preds = iso.fit_predict(num_df)\n    \n    cols = num_df.columns[:2]\n    \n\
  \    plt.figure(figsize=(8, 6))\n    scatter = plt.scatter(num_df[cols[0]], num_df[cols[1]],\
  \ c=preds, cmap='coolwarm', alpha=0.7)\n    plt.title(f\"Isolation Forest : Outliers\
  \ sur {cols[0]} vs {cols[1]}\")\n    plt.xlabel(cols[0])\n    plt.ylabel(cols[1])\n\
  \    # -1 (rouge) = outlier, 1 (bleu) = inlier\n    plt.show()\n    print(f\"[EDA]\
  \ {sum(preds == -1)} outliers détectés sur {len(num_df)} lignes ({(sum(preds ==\
  \ -1)/len(num_df)*100):.1f}%).\")\nelse:\n    print(\"[EDA] Dataset inadapté pour\
  \ Isolation Forest.\")\n"
