id: eda_audio_waveform
name: 'EDA: Waveform (Audio)'
description: Affiche le signal temporel d'un audio.
category: 3. Exploratory Data Analysis
tags:
- eda
- audio
- multimedia
- matplotlib
code_template: "import matplotlib.pyplot as plt\n\n# On suppose un 'waveform' chargé\
  \ par torchaudio dans le scope\nif 'waveform' in locals():\n    plt.figure(figsize=(10,\
  \ 4))\n    if waveform.shape[0] == 1:\n        plt.plot(waveform[0].numpy())\n \
  \       plt.title(\"Waveform - Mono\")\n    else:\n        plt.plot(waveform[0].numpy(),\
  \ label=\"Left\")\n        plt.plot(waveform[1].numpy(), alpha=0.5, label=\"Right\"\
  )\n        plt.title(\"Waveform - Stéréo\")\n        plt.legend()\n    plt.ylabel(\"\
  Amplitude\")\n    plt.xlabel(\"Frames\")\n    plt.show()\nelse:\n    print(\"[EDA]\
  \ Aucun Tensor 'waveform' trouvé dans le scope local.\")\n"
