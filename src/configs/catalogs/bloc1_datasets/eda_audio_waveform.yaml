id: eda_audio_waveform
name: 'EDA: Waveform (Audio)'
description: "Affiche le signal temporel d'un audio (amplitude en fonction du temps)."
when_to_use: "Pour vérifier l'intégrité globale d'un enregistrement et ses niveaux d'amplitude."
use_cases:
  - "Vérification des silences avant ou après un enregistrement."
  - "Détection de saturation (clipping) dans le signal audio."
pros:
  - "Très rapide à afficher."
  - "Prise en charge du mono et de la stéréo."
cons:
  - "Ne permet pas de distinguer les fréquences."
  - "Peut être peu lisible si le signal est très long."
category: 3. Exploratory Data Analysis
tags:
- eda
- audio
- multimedia
- matplotlib
code_template: |
  import matplotlib.pyplot as plt

  # On suppose un 'waveform' chargé par torchaudio dans le scope
  if 'waveform' in locals():
      plt.figure(figsize=(10, 4))
      if waveform.shape[0] == 1:
          plt.plot(waveform[0].numpy())
          plt.title("Waveform - Mono")
      else:
          plt.plot(waveform[0].numpy(), label="Left")
          plt.plot(waveform[1].numpy(), alpha=0.5, label="Right")
          plt.title("Waveform - Stéréo")
          plt.legend()
      plt.ylabel("Amplitude")
      plt.xlabel("Frames")
      plt.show()
  else:
      print("[EDA] Aucun Tensor 'waveform' trouvé dans le scope local.")
