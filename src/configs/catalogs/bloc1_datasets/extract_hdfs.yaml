id: extract_hdfs
name: 'Extract: Hadoop HDFS'
description: "Télécharge un fichier (CSV, Parquet, etc.) de manière non sécurisée ou sécurisée depuis un cluster Hadoop HDFS."
when_to_use: "Lorsque le dataset d'entraînement est stocké sur un datalake Hadoop sur site ou sur le cloud (HDFS)."
use_cases:
  - "Récupération d'un gros volume de logs centralisés."
  - "Extraction de tables consolidées par des jobs Spark/Hive."
pros:
  - "Transfert direct depuis l'écosystème Big Data."
  - "Idéal pour les jeux de données massifs pré-processés."
cons:
  - "Nécessite un accès réseau au cluster Hadoop (Namenode)."
  - "La configuration des droits et utilisateurs HDFS peut être complexe."
category: 1. Extract
tags:
- extract
- hdfs
- hadoop
- bigdata
code_template: |
  from hdfs import InsecureClient
  import os
  import time

  # [PARAM: HDFS_URL | string]
  HDFS_URL = "http://namenode:50070"
  # [/PARAM]

  # [PARAM: HDFS_USER | string]
  HDFS_USER = "hadoop"
  # [/PARAM]

  # [PARAM: REMOTE_PATH | string]
  REMOTE_PATH = "/user/hadoop/data.csv"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/hdfs_data.csv"
  # [/PARAM]

  print(f"[EXTRACT] Connexion HDFS ({HDFS_URL})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      client = InsecureClient(HDFS_URL, user=HDFS_USER)
      client.download(REMOTE_PATH, DEST_PATH, overwrite=True)
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès HDFS. Fichier téléchargé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec HDFS : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "hdfs", "path": DEST_PATH}
