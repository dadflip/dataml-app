id: extract_hdfs
name: 'Extract: Hadoop HDFS'
description: Télécharge un fichier depuis un cluster Hadoop.
category: 1. Extract
tags:
- extract
- hdfs
- hadoop
- bigdata
code_template: "from hdfs import InsecureClient\nimport os\nimport time\n\n# [PARAM:\
  \ HDFS_URL | string]\nHDFS_URL = \"http://namenode:50070\"\n# [/PARAM]\n\n# [PARAM:\
  \ HDFS_USER | string]\nHDFS_USER = \"hadoop\"\n# [/PARAM]\n\n# [PARAM: REMOTE_PATH\
  \ | string]\nREMOTE_PATH = \"/user/hadoop/data.csv\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH\
  \ | string]\nDEST_PATH = \"./data/raw/hdfs_data.csv\"\n# [/PARAM]\n\nprint(f\"[EXTRACT]\
  \ Connexion HDFS ({HDFS_URL})...\")\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\
  \ntry:\n    start_time = time.time()\n    client = InsecureClient(HDFS_URL, user=HDFS_USER)\n\
  \    client.download(REMOTE_PATH, DEST_PATH, overwrite=True)\n    \n    duration\
  \ = time.time() - start_time\n    print(f\"[EXTRACT] Succès HDFS. Fichier téléchargé\
  \ en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT]\
  \ Échec HDFS : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type\
  \ = \"unknown\"\nmeta = {\"source\": \"hdfs\", \"path\": DEST_PATH}\n"
