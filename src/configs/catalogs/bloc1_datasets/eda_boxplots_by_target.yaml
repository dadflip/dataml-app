code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\n\nif 'target_name' in locals() and target_name\
  \ and target_name in df.columns:\n    num_cols = df.select_dtypes(include=[np.number]).columns.tolist()\n\
  \    if target_name in num_cols:\n        num_cols.remove(target_name)\n    if len(num_cols)\
  \ > 12:\n        num_cols = num_cols[:12]\n        \n    print(f\"[EDA] === BOXPLOTS\
  \ by {target_name} ===\")\n    plt.figure(figsize=(15, 4 * ((len(num_cols) + 2)\
  \ // 3)))\n    for i, col in enumerate(num_cols):\n        plt.subplot(((len(num_cols)\
  \ + 2) // 3), 3, i + 1)\n        sns.boxplot(data=df, x=target_name, y=col)\n  \
  \      plt.title(f\"{col} by {target_name}\")\n    plt.tight_layout()\n    plt.show()\n\
  else:\n    print(\"[EDA] Cible (target_name) introuvable ou non définie.\")\n"
