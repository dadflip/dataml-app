id: eda_boxplots_by_target
name: 'EDA: Boxplots vs Target'
description: "Affiche des boîtes à moustaches (boxplots) pour visualiser la distribution des variables numériques par classe cible."
when_to_use: "Pour explorer la relation entre une variable catégorielle (cible) et des variables numériques."
use_cases:
  - "Identifier les variables les plus discriminantes pour une classification."
  - "Détecter les valeurs aberrantes (outliers) pour chaque classe."
pros:
  - "Permet de visualiser la médiane, les quartiles et les valeurs extrêmes."
  - "Idéal pour la sélection de caractéristiques (feature selection)."
cons:
  - "Ne montre pas la distribution sous-jacente aussi bien qu'un violin plot."
  - "Peut devenir illisible s'il y a trop de classes."
category: 3. Exploratory Data Analysis
tags:
- eda
- boxplot
- tabular
- classification
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns

  if 'target_name' in locals() and target_name and target_name in df.columns:
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if target_name in num_cols:
          num_cols.remove(target_name)
      if len(num_cols) > 12:
          num_cols = num_cols[:12]
          
      print(f"[EDA] === BOXPLOTS by {target_name} ===")
      plt.figure(figsize=(15, 4 * ((len(num_cols) + 2) // 3)))
      for i, col in enumerate(num_cols):
          plt.subplot(((len(num_cols) + 2) // 3), 3, i + 1)
          sns.boxplot(data=df, x=target_name, y=col)
          plt.title(f"{col} by {target_name}")
      plt.tight_layout()
      plt.show()
  else:
      print("[EDA] Cible (target_name) introuvable ou non définie.")
illustration_mermaid: |
    graph TD
      A[/DataFrame df/] --> B{Target valid & exists?}
      A2[/target_name/] --> B
      B -- Yes --> C{Select numerical columns}
      C --> D{Target in num_cols?}
      D -- Yes --> E{Remove target}
      D -- No --> F{Columns > 12?}
      E --> F
      F -- Yes --> G{Truncate to 12}
      F -- No --> H{Keep columns}
      G --> I{Create Subplots}
      H --> I
      I --> J{Iterate & Plot sns.boxplot}
      J --> K([Display Boxplots])
      B -- No --> L([Print Error])

