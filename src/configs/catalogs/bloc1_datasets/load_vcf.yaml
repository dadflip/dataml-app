id: "load_vcf"
name: "Load: Variants Génomiques VCF"
description: "Charge et parse un fichier Variant Call Format (.vcf), souvent utilisé en génomique, pour extraire les mutations et leurs annotations."
when_to_use: "Utilisez ce bloc pour importer des données de variants génétiques depuis des fichiers VCF (compressés ou non) pour des analyses de bioinformatique ou d'associations génétiques."
use_cases:
  - "Étude d'associations pangénomiques (GWAS)."
  - "Analyse de mutations dans des cohortes cliniques."
  - "Filtrage et annotation de variants (SNPs, indels)."
pros:
  - "Gère automatiquement les en-têtes (lignes commençant par ##)."
  - "Prend en charge les fichiers VCF compressés (.gz)."
  - "Extrait la liste des chromosomes et le nombre total de variants."
cons:
  - "Peut consommer beaucoup de mémoire pour de très gros fichiers VCF."
  - "Les annotations complexes (champ INFO) ne sont pas automatiquement éclatées."
category: "2. Load"
tags: ["load", "vcf", "genetics", "variants"]
code_template: |
  import pandas as pd
  import os
  import gzip

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.vcf"
  # [/PARAM]

  meta = {"source": "VCF", "path": FILE_PATH}
  df = pd.DataFrame()

  if os.path.exists(FILE_PATH):
      try:
          open_func = gzip.open if FILE_PATH.endswith('.gz') else open
          
          skip_rows = 0
          with open_func(FILE_PATH, 'rt') as f:
              for line in f:
                  if line.startswith('##'):
                      skip_rows += 1
                  else:
                      break
                      
          df = pd.read_csv(
              FILE_PATH, 
              sep='\t', 
              skiprows=skip_rows, 
              compression='gzip' if FILE_PATH.endswith('.gz') else 'infer'
          )
          
          if not df.empty and '#CHROM' in df.columns:
              df = df.rename(columns={'#CHROM': 'CHROM'})
              meta["num_variants"] = len(df)
              meta["chromosomes"] = df['CHROM'].unique().tolist()
      except Exception as e:
          print(f"Error loading VCF file {FILE_PATH}: {e}")
  else:
      print(f"File not found: {FILE_PATH}")

  target_name = "QUAL" if not df.empty and "QUAL" in df.columns else "target"
  task_type = "classification"
output_variables:
  - df
  - target_name
  - task_type
  - meta
