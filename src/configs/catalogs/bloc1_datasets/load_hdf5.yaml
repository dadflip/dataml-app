id: load_hdf5
name: 'Load: Hiérarchique HDF5'
description: Charge un dataset multidimensionnel depuis un fichier HDF5 (.h5).
category: 2. Load
tags:
- load
- hdf5
- scientific
- matrix
code_template: "import h5py\nimport time\nimport os\n\n# [PARAM: FILE_PATH | file]\n\
  FILE_PATH = \"./data/raw/data.h5\"\n# [/PARAM]\n\n# [PARAM: DATASET_NAME | string]\n\
  DATASET_NAME = \"my_dataset\"\n# [/PARAM]\n\nprint(f\"[LOAD] Lecture HDF5 depuis\
  \ {FILE_PATH} (Dataset: {DATASET_NAME})...\")\nif not os.path.exists(FILE_PATH):\n\
  \    raise FileNotFoundError(f\"[ERREUR LOAD] Fichier HDF5 introuvable : {FILE_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    \n    with h5py.File(FILE_PATH, 'r')\
  \ as f:\n        if DATASET_NAME not in f:\n            available = list(f.keys())\n\
  \            raise KeyError(f\"Le dataset '{DATASET_NAME}' n'existe pas. Datasets\
  \ disponibles : {available}\")\n            \n        # On charge les données en\
  \ mémoire (NumPy array)\n        data = f[DATASET_NAME][:]\n        \n    duration\
  \ = time.time() - start_time\n    print(f\"[LOAD] Succès HDF5. Matrice {data.shape}\
  \ chargée en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"[ERREUR LOAD]\
  \ Le module 'h5py' est requis.\")\n    raise\nexcept Exception as e:\n    print(f\"\
  [ERREUR LOAD] Erreur de lecture HDF5 : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name\
  \ = None\ntask_type = \"unknown\"\nmeta = {\"format\": \"hdf5\", \"shape\": data.shape}\n"
