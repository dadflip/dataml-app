id: extract_scraper_bs4
name: 'Extract: Web Scraping (BeautifulSoup)'
description: Extrait le code HTML brut d'une page statique via BeautifulSoup.
category: 1. Extract
tags:
- extract
- scraping
- html
- bs4
code_template: "import requests\nfrom bs4 import BeautifulSoup\nimport os\nimport\
  \ time\n\n# [PARAM: TARGET_URL | string]\nTARGET_URL = \"https://example.com\"\n\
  # [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/scraped_page.html\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Web Scraping de la page {TARGET_URL}...\")\n\
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time =\
  \ time.time()\n    headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64;\
  \ x64)'}\n    response = requests.get(TARGET_URL, headers=headers, timeout=15)\n\
  \    response.raise_for_status()\n    \n    soup = BeautifulSoup(response.content,\
  \ 'html.parser')\n    # On sauvegarde le HTML formatté (prettify)\n    with open(DEST_PATH,\
  \ \"w\", encoding=\"utf-8\") as f:\n        f.write(soup.prettify())\n        \n\
  \    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès Scraping.\
  \ Page sauvegardée en {duration:.2f}s.\")\nexcept requests.exceptions.RequestException\
  \ as e:\n    print(f\"[ERREUR EXTRACT] Échec du téléchargement de la page : {str(e)}\"\
  )\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta =\
  \ {\"source\": \"scraping_bs4\", \"path\": DEST_PATH}\n"
