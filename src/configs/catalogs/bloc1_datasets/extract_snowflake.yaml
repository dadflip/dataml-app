id: extract_snowflake
name: 'Extract: Snowflake Data Warehouse'
description: Interroge un cluster Snowflake via le connecteur officiel Python.
category: 1. Extract
tags:
- extract
- snowflake
- dwh
- sql
code_template: |
  import snowflake.connector
  import pandas as pd
  import os
  import time

  # [PARAM: USER | string]
  USER = "user_name"
  # [/PARAM]

  # [PARAM: PASSWORD | string]
  PASSWORD = "secret_password"
  # [/PARAM]

  # [PARAM: ACCOUNT | string]
  ACCOUNT = "xy12345.us-east-1"
  # [/PARAM]

  # [PARAM: WAREHOUSE | string]
  WAREHOUSE = "COMPUTE_WH"
  # [/PARAM]

  # [PARAM: QUERY | string]
  QUERY = "SELECT * FROM my_db.my_schema.my_table"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/snowflake_export.csv"
  # [/PARAM]

  print(f"[EXTRACT] Interrogation du Data Warehouse Snowflake ({ACCOUNT})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      ctx = snowflake.connector.connect(
          user=USER,
          password=PASSWORD,
          account=ACCOUNT,
          warehouse=WAREHOUSE
      )
      
      # execute_dataframe nécessite pandas et pyarrow (option de fetch très rapide)
      cursor = ctx.cursor()
      cursor.execute(QUERY)
      df_temp = cursor.fetch_pandas_all()
      
      df_temp.to_csv(DEST_PATH, index=False)
      ctx.close()
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Snowflake. {df_temp.shape[0]} lignes dumpées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec de la connexion ou requête Snowflake : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {"source": "snowflake", "path": DEST_PATH}

illustration_mermaid: |
  flowchart TD
      subgraph Config [Parameters]
          CRED([USER / PWD])
          ACC([ACCOUNT / WH])
          QRY([QUERY])
          DEST([DEST_PATH])
      end

      subgraph Operations [Snowflake Extract]
          Conn([snowflake.connect])
          Cur([cursor.execute])
          Fetch([fetch_pandas_all])
          Save([to_csv])
          OutFile[(Local CSV)]
      end

      subgraph Outputs [Contract Variables]
          df((df = pd.DataFrame))
          target((target_name = ''))
          task((task_type = 'unknown'))
          meta((meta: dict))
      end

      CRED & ACC --> Conn
      Conn --> Cur
      QRY --> Cur
      Cur --> Fetch
      Fetch --> Save
      DEST --> OutFile
      Save --> OutFile
      OutFile -.-> meta

      style Config fill:#f8fafc,stroke:#cbd5e1,stroke-width:2px
      style Conn fill:#3b82f6,stroke:#1d4ed8,stroke-width:2px,color:#fff
      style Cur fill:#10b981,stroke:#047857,stroke-width:2px,color:#fff
      style Fetch fill:#f59e0b,stroke:#b45309,stroke-width:2px,color:#fff
      style Save fill:#8b5cf6,stroke:#6d28d9,stroke-width:2px,color:#fff
      style OutFile fill:#64748b,stroke:#475569,stroke-width:2px,color:#fff
      style Outputs fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px

