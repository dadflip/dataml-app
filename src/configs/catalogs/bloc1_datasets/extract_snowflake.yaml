id: extract_snowflake
name: 'Extract: Snowflake Data Warehouse'
description: Interroge un cluster Snowflake via le connecteur officiel Python.
category: 1. Extract
tags:
- extract
- snowflake
- dwh
- sql
code_template: "import snowflake.connector\nimport pandas as pd\nimport os\nimport\
  \ time\n\n# [PARAM: USER | string]\nUSER = \"user_name\"\n# [/PARAM]\n\n# [PARAM:\
  \ PASSWORD | string]\nPASSWORD = \"secret_password\"\n# [/PARAM]\n\n# [PARAM: ACCOUNT\
  \ | string]\nACCOUNT = \"xy12345.us-east-1\"\n# [/PARAM]\n\n# [PARAM: WAREHOUSE\
  \ | string]\nWAREHOUSE = \"COMPUTE_WH\"\n# [/PARAM]\n\n# [PARAM: QUERY | string]\n\
  QUERY = \"SELECT * FROM my_db.my_schema.my_table\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH\
  \ | string]\nDEST_PATH = \"./data/raw/snowflake_export.csv\"\n# [/PARAM]\n\nprint(f\"\
  [EXTRACT] Interrogation du Data Warehouse Snowflake ({ACCOUNT})...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    ctx = snowflake.connector.connect(\n\
  \        user=USER,\n        password=PASSWORD,\n        account=ACCOUNT,\n    \
  \    warehouse=WAREHOUSE\n    )\n    \n    # execute_dataframe nécessite pandas\
  \ et pyarrow (option de fetch très rapide)\n    cursor = ctx.cursor()\n    cursor.execute(QUERY)\n\
  \    df_temp = cursor.fetch_pandas_all()\n    \n    df_temp.to_csv(DEST_PATH, index=False)\n\
  \    ctx.close()\n    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT]\
  \ Succès Snowflake. {df_temp.shape[0]} lignes dumpées en {duration:.2f}s.\")\nexcept\
  \ Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec de la connexion ou requête\
  \ Snowflake : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type\
  \ = \"unknown\"\nmeta = {\"source\": \"snowflake\", \"path\": DEST_PATH}\n"
