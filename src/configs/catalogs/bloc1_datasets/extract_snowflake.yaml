id: extract_snowflake
name: 'Extract: Snowflake Data Warehouse'
description: Interroge un cluster Snowflake via le connecteur officiel Python.
when_to_use: "Pour récupérer un volume important de données structurées hébergées sur un entrepôt de données Snowflake."
use_cases:
  - "Extraction de tables de dimensions ou faits pour l'entraînement d'un modèle."
  - "Analyse ponctuelle de données massives du Data Warehouse."
pros:
  - "Connecteur officiel très performant (utilise pyarrow)."
  - "Déchargement rapide avec fetch_pandas_all()."
cons:
  - "Nécessite des identifiants et un entrepôt virtuel (warehouse) actifs."
  - "Attention à la volumétrie en RAM si la requête retourne trop de lignes."
category: 1. Extract
tags:
- extract
- snowflake
- dwh
- sql
code_template: |
  import snowflake.connector
  import pandas as pd
  import os
  import time

  # [PARAM: USER | string]
  USER = "user_name"
  # [/PARAM]

  # [PARAM: PASSWORD | string]
  PASSWORD = "secret_password"
  # [/PARAM]

  # [PARAM: ACCOUNT | string]
  ACCOUNT = "xy12345.us-east-1"
  # [/PARAM]

  # [PARAM: WAREHOUSE | string]
  WAREHOUSE = "COMPUTE_WH"
  # [/PARAM]

  # [PARAM: QUERY | string]
  QUERY = "SELECT * FROM my_db.my_schema.my_table"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/snowflake_export.csv"
  # [/PARAM]

  print(f"[EXTRACT] Interrogation du Data Warehouse Snowflake ({ACCOUNT})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      ctx = snowflake.connector.connect(
          user=USER,
          password=PASSWORD,
          account=ACCOUNT,
          warehouse=WAREHOUSE
      )
      
      # execute_dataframe nécessite pandas et pyarrow (option de fetch très rapide)
      cursor = ctx.cursor()
      cursor.execute(QUERY)
      df_temp = cursor.fetch_pandas_all()
      
      df_temp.to_csv(DEST_PATH, index=False)
      ctx.close()
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Snowflake. {df_temp.shape[0]} lignes dumpées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec de la connexion ou requête Snowflake : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {"source": "snowflake", "path": DEST_PATH}

