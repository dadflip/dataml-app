id: load_matlab
name: 'Load: Fichier MATLAB (.mat)'
description: "Charge les matrices et variables sauvegardées dans un fichier MATLAB."
when_to_use: "Lorsque vous travaillez avec des données issues du monde de la recherche, de l'ingénierie (traitement du signal, automatique) ou de vieux projets qui utilisaient l'environnement MATLAB."
use_cases:
  - "Migration d'algorithmes et de données de MATLAB vers Python."
  - "Chargement de séries temporelles (ex: EEG, capteurs) enregistrées via MATLAB/Simulink."
  - "Import de structures de données scientifiques complexes (matrices creuses, tenseurs)."
pros:
  - "Conserve la structure des données d'origine grâce à SciPy."
  - "Permet de récupérer plusieurs variables distinctes depuis un seul et même fichier `.mat`."
  - "Idéal pour réutiliser de vieux jeux de données académiques souvent fournis dans ce format."
cons:
  - "Ne renvoie pas un DataFrame Pandas prêt à l'emploi (nécessite d'extraire la bonne clé)."
  - "Peut rencontrer des problèmes de compatibilité avec les versions très récentes ou très anciennes des fichiers `.mat`."
category: 2. Load
tags: ["load", "matlab", "scipy", "matrix"]
code_template: |
  import pandas as pd
  import scipy.io
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.mat"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier MATLAB : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier MATLAB introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      mat_data = scipy.io.loadmat(FILE_PATH)
      duration = time.time() - start_time
      print(f"[LOAD] Succès MATLAB. Variables chargées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur de lecture MATLAB : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {"format": "matlab", "variables": [k for k in mat_data.keys() if not k.startswith('__')]}
