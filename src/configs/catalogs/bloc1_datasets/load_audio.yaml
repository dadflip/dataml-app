id: load_audio
name: 'Load: Audio (WAV, MP3)'
description: Charge un fichier audio sous forme de série temporelle (Librosa).
category: 2. Load
tags:
- load
- audio
- wav
- librosa
code_template: "import time\nimport os\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/sound.wav\"\n# [/PARAM]\n\n# [PARAM: SAMPLE_RATE | string]\nSAMPLE_RATE\
  \ = \"22050\"\n# [/PARAM]\n\nprint(f\"[LOAD] Lecture du fichier audio : {FILE_PATH}...\"\
  )\nif not os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD]\
  \ Fichier Audio introuvable : {FILE_PATH}\")\n\ntry:\n    start_time = time.time()\n\
  \    import librosa\n    \n    # Le parametre sr=None conserve le taux d'échantillonnage\
  \ d'origine\n    sr_target = int(SAMPLE_RATE) if SAMPLE_RATE.isdigit() else None\n\
  \    y, sr = librosa.load(FILE_PATH, sr=sr_target)\n    \n    duration = time.time()\
  \ - start_time\n    print(f\"[LOAD] Succès Audio. {len(y)} échantillons lus à {sr}\
  \ Hz en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"[ERREUR LOAD] Le module\
  \ 'librosa' est requis.\")\n    raise\nexcept Exception as e:\n    print(f\"[ERREUR\
  \ LOAD] Impossible de parser le fichier audio : {str(e)}\")\n    raise e\n\ndf =\
  \ None\ntarget_name = None\ntask_type = \"audio_processing\"\nmeta = {\"format\"\
  : \"audio\", \"sample_rate\": sr, \"length\": len(y)}\n"
