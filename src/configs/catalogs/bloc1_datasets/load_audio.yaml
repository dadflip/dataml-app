id: load_audio
name: 'Load: Audio (WAV, MP3)'
description: "Charge et décode un fichier audio (formats WAV, MP3, etc.) pour le convertir en une série temporelle unidimensionnelle à l'aide de la bibliothèque spécialisée Librosa. Ce bloc gère l'ingestion du signal acoustique brut, échantillonne les données selon la fréquence cible spécifiée (ou conserve l'originale), et prépare les structures fondamentales (vecteur d'amplitudes et fréquence d'échantillonnage) pour les étapes ultérieures de traitement du signal ou d'extraction de caractéristiques (comme les MFCC ou les spectrogrammes)."
when_to_use: "À utiliser dès lors que votre pipeline d'apprentissage automatique ou d'analyse nécessite d'ingérer des données sonores ou vocales brutes pour de la classification, de la transcription ou de la génération."
use_cases:
  - "Reconnaissance vocale (Speech-to-Text) et analyse de la parole."
  - "Classification de sons environnementaux ou d'événements acoustiques."
  - "Détection d'anomalies audio (maintenance prédictive sur des machines)."
  - "Analyse des sentiments à partir du ton de la voix."
pros:
  - "Exploite Librosa, le standard de l'industrie pour l'analyse audio en Python."
  - "Gère automatiquement le rééchantillonnage de la fréquence (resampling) si nécessaire."
  - "Extraction simple et immédiate des caractéristiques essentielles (longueur, sample_rate)."
cons:
  - "Consommation mémoire importante pour les fichiers audio très longs (chargement intégral en mémoire vive)."
  - "Ne gère pas nativement le streaming audio en temps réel ou par petits lots (batch processing)."
  - "Nécessite souvent des étapes de prétraitement complexes (spectrogrammes) avant de nourrir un modèle de Deep Learning."
category: 2. Load
tags:
- load
- audio
- wav
- librosa
code_template: |
  import time
  import os
  import pandas as pd

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/sound.wav"
  # [/PARAM]

  # [PARAM: SAMPLE_RATE | string]
  SAMPLE_RATE = "22050"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier audio : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier Audio introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      import librosa
      
      # Le parametre sr=None conserve le taux d'échantillonnage d'origine
      sr_target = int(SAMPLE_RATE) if SAMPLE_RATE.isdigit() else None
      y, sr = librosa.load(FILE_PATH, sr=sr_target)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Audio. {len(y)} échantillons lus à {sr} Hz en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'librosa' est requis.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de parser le fichier audio : {str(e)}")
      raise e

  df = pd.DataFrame({"audio_data": y})
  target_name = ""
  task_type = "audio_processing"
  meta = {"format": "audio", "sample_rate": sr, "length": len(y)}

