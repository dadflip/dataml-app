id: "load_sqlite"
name: "Load: Base SQLite (.db)"
description: "Exécute une requête SQL directement sur un fichier de base SQLite local."
category: "2. Load"
tags: ["load", "sqlite", "sql", "db"]
code_template: |
  import sqlite3
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/database.db"
  # [/PARAM]

  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "SQLite", "path": FILE_PATH}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
        DB[("SQLite DB\n(.db)")] -->|FILE_PATH| Load(["Load\nSQLite"])
        Load --> df(["df (None)"])
        Load --> target_name(["target_name (None)"])
        Load --> task_type(["task_type ('unknown')"])
        Load --> meta(["meta (dict)"])

        style DB fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style Load fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
        style df fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px
        style target_name fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px
        style task_type fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px
        style meta fill:#f3f4f6,stroke:#9ca3af,stroke-width:1px

_metadata:
  bloc: 1
  section: "2_load"
