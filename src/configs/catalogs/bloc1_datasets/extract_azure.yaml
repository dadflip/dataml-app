id: extract_azure
name: 'Extract: Azure Blob Storage'
description: Télécharge un fichier depuis un conteneur Azure.
category: 1. Extract
tags:
- extract
- azure
- blob
code_template: "from azure.storage.blob import BlobServiceClient\nimport os\nimport\
  \ time\n\n# [PARAM: CONN_STR | string]\nCONN_STR = \"DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net\"\
  \n# [/PARAM]\n\n# [PARAM: CONTAINER_NAME | string]\nCONTAINER_NAME = \"my-container\"\
  \n# [/PARAM]\n\n# [PARAM: BLOB_NAME | string]\nBLOB_NAME = \"data.csv\"\n# [/PARAM]\n\
  \n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/azure_data.csv\"\n# [/PARAM]\n\
  \nprint(f\"[EXTRACT] Connexion à Azure Blob Storage ({CONTAINER_NAME})...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    blob_service_client\
  \ = BlobServiceClient.from_connection_string(CONN_STR)\n    blob_client = blob_service_client.get_blob_client(container=CONTAINER_NAME,\
  \ blob=BLOB_NAME)\n    \n    with open(DEST_PATH, \"wb\") as download_file:\n  \
  \      download_file.write(blob_client.download_blob().readall())\n        \n  \
  \  duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès Azure. Fichier\
  \ téléchargé en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR\
  \ EXTRACT] Erreur Azure Storage : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name\
  \ = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"azure\", \"path\": DEST_PATH}\n"
