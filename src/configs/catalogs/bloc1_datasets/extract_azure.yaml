id: extract_azure
name: 'Extract: Azure Blob Storage'
description: Télécharge un fichier depuis un conteneur Azure.
when_to_use: À utiliser pour récupérer des jeux de données stockés dans le cloud Azure Blob Storage.
use_cases:
- Chargement de données brutes centralisées dans un data lake Azure.
- Partage de fichiers de données entre différentes applications via Azure.
pros:
- Intégration native avec l'écosystème cloud Microsoft.
- Téléchargement fiable et sécurisé avec les chaînes de connexion.
cons:
- Nécessite de configurer des clés d'accès et une chaîne de connexion.
- Les temps de téléchargement dépendent de la taille du blob et de la bande passante.
category: 1. Extract
tags:
- extract
- azure
- blob
code_template: |
  from azure.storage.blob import BlobServiceClient
  import os
  import time
  
  # [PARAM: CONN_STR | string]
  CONN_STR = "DefaultEndpointsProtocol=https;AccountName=...;AccountKey=...;EndpointSuffix=core.windows.net"
  # [/PARAM]
  
  # [PARAM: CONTAINER_NAME | string]
  CONTAINER_NAME = "my-container"
  # [/PARAM]
  
  # [PARAM: BLOB_NAME | string]
  BLOB_NAME = "data.csv"
  # [/PARAM]
  
  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/azure_data.csv"
  # [/PARAM]
  
  print(f"[EXTRACT] Connexion à Azure Blob Storage ({CONTAINER_NAME})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)
  
  try:
      start_time = time.time()
      blob_service_client = BlobServiceClient.from_connection_string(CONN_STR)
      blob_client = blob_service_client.get_blob_client(container=CONTAINER_NAME, blob=BLOB_NAME)
      
      with open(DEST_PATH, "wb") as download_file:
          download_file.write(blob_client.download_blob().readall())
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Azure. Fichier téléchargé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Erreur Azure Storage : {str(e)}")
      raise e
  
  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "azure", "path": DEST_PATH}
