id: "eda_violinplots"
name: "EDA: Violin Plots vs Target"
description: "Affiche la distribution détaillée des variables numériques par classe."
category: "3. Exploratory Data Analysis"
tags: ["eda", "violin", "tabular", "seaborn"]
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns

  if 'target_name' in locals() and target_name and target_name in df.columns:
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if target_name in num_cols:
          num_cols.remove(target_name)
      if len(num_cols) > 8:
          num_cols = num_cols[:8]
          
      print(f"[EDA] === VIOLIN PLOTS by {target_name} ===")
      plt.figure(figsize=(15, 5 * ((len(num_cols) + 1) // 2)))
      for i, col in enumerate(num_cols):
          plt.subplot(((len(num_cols) + 1) // 2), 2, i + 1)
          sns.violinplot(data=df, x=target_name, y=col)
          plt.title(f"{col} by {target_name}")
      plt.tight_layout()
      plt.show()
  else:
      print("[EDA] Cible introuvable.")
