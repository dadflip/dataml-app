id: eda_violinplots
name: 'EDA: Violin Plots vs Target'
description: Affiche la distribution détaillée de plusieurs variables numériques découpées selon les classes de la variable cible via des graphiques en violon.
when_to_use: À utiliser pour analyser la relation entre des variables continues (features) et une variable cible catégorielle, afin d'identifier les variables les plus discriminantes.
use_cases:
  - Comparer la distribution des âges, revenus, et scores d'activité selon qu'un client a souscrit ou non à une offre (cible binaire).
  - Évaluer comment des caractéristiques physiques de fleurs (longueur des pétales) varient selon l'espèce (cible multiclasses).
  - Identifier la présence d'outliers et les densités conditionnelles asymétriques.
pros:
  - Plus informatif que les boîtes à moustaches (boxplots) car il montre l'estimation de la densité (KDE) et potentiellement la multimodalité.
  - Permet de comparer plusieurs variables numériques simultanément sur une même grille de sous-graphiques.
  - Idéal pour la sélection de features en machine learning de classification.
cons:
  - Difficile à lire si la cible catégorielle a un grand nombre de classes (chevauchement visuel).
  - Les estimations de densité peuvent dépasser les valeurs réelles min/max (artefact KDE).
  - Peut être lent à calculer sur de très grands jeux de données sans échantillonnage.
category: 3. Exploratory Data Analysis
tags:
- eda
- violin
- tabular
- seaborn
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns
  
  if 'target_name' in locals() and target_name and target_name in df.columns:
      num_cols = df.select_dtypes(include=[np.number]).columns.tolist()
      if target_name in num_cols:
          num_cols.remove(target_name)
      if len(num_cols) > 8:
          num_cols = num_cols[:8]
          
      print(f"[EDA] === VIOLIN PLOTS by {target_name} ===")
      plt.figure(figsize=(15, 5 * ((len(num_cols) + 1) // 2)))
      for i, col in enumerate(num_cols):
          plt.subplot(((len(num_cols) + 1) // 2), 2, i + 1)
          sns.violinplot(data=df, x=target_name, y=col)
          plt.title(f"{col} by {target_name}")
      plt.tight_layout()
      plt.show()
  else:
      print("[EDA] Cible introuvable.")
illustration_mermaid: |
    graph TD
      DF[/ df /] --> Params[/ target_name /]
