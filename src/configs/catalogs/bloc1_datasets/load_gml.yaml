id: load_gml
name: 'Load: Fichier GML (Graph Modelling Language)'
description: Charge un graphe au format GML via NetworkX. Exporte les attributs des noeuds dans df et l'edge_index dans meta.
when_to_use: À utiliser lorsque vous devez importer des graphes modélisés avec le format texte standard GML (Graph Modelling Language), très répandu dans les logiciels d'analyse de réseaux.
use_cases:
  - "Analyse de réseaux sociaux."
  - "Cartographie de réseaux ou d'infrastructures."
  - "Étude de relations complexes (citations, transport)."
pros:
  - "Format texte lisible par l'homme."
  - "Support robuste via NetworkX."
cons:
  - "Moins performant pour les graphes gigantesques en raison de sa nature textuelle."
  - "La conversion en DataFrame peut être lourde si les attributs sont nombreux."
category: 2. Load
tags:
- load
- graph
- gml
- networkx
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      import networkx as nx
  except ImportError:
      nx = None
      print("[ERREUR LOAD] 'networkx' n'est pas installé.")

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/graph.gml"
  # [/PARAM]

  # [PARAM: TARGET_ATTR | string]
  TARGET_ATTR = ""
  # [/PARAM]

  print(f"[LOAD] Chargement du graphe GML depuis {FILE_PATH}...")

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {}

  try:
      if nx is not None:
          start_time = time.time()
          G = nx.read_gml(FILE_PATH)
          
          node_data = []
          for node_id, attrs in G.nodes(data=True):
              row = {"node_id": node_id}
              row.update(attrs)
              node_data.append(row)
          df = pd.DataFrame(node_data)
          
          node_list = list(G.nodes())
          node2idx = {n: i for i, n in enumerate(node_list)}
          src = [node2idx[u] for u, v in G.edges()]
          dst = [node2idx[v] for u, v in G.edges()]
          edge_index = np.array([src, dst], dtype=np.int64)
          
          duration = time.time() - start_time
          print(f"[LOAD] Succès GML. {G.number_of_nodes()} noeuds, {G.number_of_edges()} arêtes en {duration:.2f}s.")
          
          target_name = TARGET_ATTR if TARGET_ATTR and TARGET_ATTR in df.columns else ""
          task_type = "node_classification" if target_name else "graph_unsupervised"
          meta = {"format": "gml", "shape": df.shape, "edge_index": edge_index, "node_list": node_list}
  except Exception as e:
      print(f"[ERREUR LOAD] Échec du chargement GML : {str(e)}")
      raise e
