id: load_gml
name: 'Load: Fichier GML (Graph Modelling Language)'
description: Charge un graphe au format GML via NetworkX. Exporte les attributs des
  noeuds dans df et l'edge_index dans meta.
category: 2. Load
tags:
- load
- graph
- gml
- networkx
code_template: "import pandas as pd\nimport numpy as np\nimport time\ntry:\n    import\
  \ networkx as nx\nexcept ImportError:\n    nx = None\n    print(\"[ERREUR LOAD]\
  \ 'networkx' n'est pas installé.\")\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/graph.gml\"\n# [/PARAM]\n\n# [PARAM: TARGET_ATTR | string]\nTARGET_ATTR\
  \ = \"\"\n# [/PARAM]\n\nprint(f\"[LOAD] Chargement du graphe GML depuis {FILE_PATH}...\"\
  )\n\ntry:\n    if nx is not None:\n        start_time = time.time()\n        G =\
  \ nx.read_gml(FILE_PATH)\n        \n        node_data = []\n        for node_id,\
  \ attrs in G.nodes(data=True):\n            row = {\"node_id\": node_id}\n     \
  \       row.update(attrs)\n            node_data.append(row)\n        df = pd.DataFrame(node_data)\n\
  \        \n        node_list = list(G.nodes())\n        node2idx = {n: i for i,\
  \ n in enumerate(node_list)}\n        src = [node2idx[u] for u, v in G.edges()]\n\
  \        dst = [node2idx[v] for u, v in G.edges()]\n        edge_index = np.array([src,\
  \ dst], dtype=np.int64)\n        \n        duration = time.time() - start_time\n\
  \        print(f\"[LOAD] Succès GML. {G.number_of_nodes()} noeuds, {G.number_of_edges()}\
  \ arêtes en {duration:.2f}s.\")\n        \n        target_name = TARGET_ATTR if\
  \ TARGET_ATTR and TARGET_ATTR in df.columns else None\n        task_type = \"node_classification\"\
  \ if target_name else \"graph_unsupervised\"\n        meta = {\"format\": \"gml\"\
  , \"shape\": df.shape, \"edge_index\": edge_index, \"node_list\": node_list}\n \
  \   else:\n        df = None\n        target_name = None\n        task_type = \"\
  unknown\"\n        meta = {}\nexcept Exception as e:\n    print(f\"[ERREUR LOAD]\
  \ Échec du chargement GML : {str(e)}\")\n    raise e\n"
