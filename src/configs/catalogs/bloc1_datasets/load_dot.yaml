id: load_dot
name: 'Load: Fichier DOT (Graphviz)'
description: >
  Charge un graphe défini au format DOT (standard de Graphviz) en exploitant les bibliothèques NetworkX et pydot. 
  Ce composant parse le fichier pour extraire à la fois les entités (nœuds) et leurs relations (arêtes). 
  Les attributs des nœuds sont consolidés sous forme de DataFrame (df), tandis que la topologie du graphe est stockée sous la forme d'un tenseur d'adjacence (edge_index) injecté dans les métadonnées (meta), un format idéal pour le Deep Learning sur graphes (GNN).
when_to_use: >
  Idéal lorsque vous devez importer des structures relationnelles complexes ou des hiérarchies exportées depuis d'autres outils d'analyse ou de visualisation sous le format standardisé DOT.
use_cases:
  - "Analyse de réseaux sociaux ou de diffusion d'informations modélisés en DOT."
  - "Préparation de données pour la classification de nœuds (Node Classification) avec des Graph Neural Networks."
  - "Étude de la topologie de réseaux informatiques ou de dépendances logicielles."
pros:
  - "Supporte nativement le format de description de graphe le plus répandu (Graphviz)."
  - "Sépare élégamment les attributs descriptifs des nœuds et la structure relationnelle pure."
  - "Format de sortie directement compatible avec des librairies de pointe comme PyTorch Geometric (via edge_index)."
cons:
  - "Nécessite des dépendances supplémentaires (pydot, networkx) qui peuvent alourdir l'environnement de base."
  - "Peut être lent ou gourmand en mémoire lors du parsing de graphes gigantesques (millions de nœuds)."
category: 2. Load
tags:
- load
- graph
- dot
- graphviz
- networkx
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      import networkx as nx
      from networkx.drawing.nx_pydot import read_dot
  except ImportError:
      nx = None
      print("[ERREUR LOAD] 'networkx' ou 'pydot' n'est pas installé.")

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/graph.dot"
  # [/PARAM]

  # [PARAM: TARGET_ATTR | string]
  TARGET_ATTR = ""
  # [/PARAM]

  print(f"[LOAD] Chargement du graphe DOT depuis {FILE_PATH}...")

  try:
      if nx is not None:
          start_time = time.time()
          G = read_dot(FILE_PATH)
          
          node_data = []
          for node_id, attrs in G.nodes(data=True):
              row = {"node_id": node_id}
              row.update(attrs)
              node_data.append(row)
          df = pd.DataFrame(node_data)
          
          node_list = list(G.nodes())
          node2idx = {n: i for i, n in enumerate(node_list)}
          src = [node2idx[u] for u, v in G.edges()]
          dst = [node2idx[v] for u, v in G.edges()]
          edge_index = np.array([src, dst], dtype=np.int64)
          
          duration = time.time() - start_time
          print(f"[LOAD] Succès DOT. {G.number_of_nodes()} noeuds, {G.number_of_edges()} arêtes en {duration:.2f}s.")
          
          target_name = TARGET_ATTR if TARGET_ATTR and TARGET_ATTR in df.columns else ""
          task_type = "node_classification" if target_name else "graph_unsupervised"
          meta = {"format": "dot", "shape": df.shape, "edge_index": edge_index, "node_list": node_list}
      else:
          df = pd.DataFrame()
          target_name = ""
          task_type = "unknown"
          meta = {}
          raise ImportError("Missing dependencies")
  except Exception as e:
      print(f"[ERREUR LOAD] Échec du chargement DOT : {str(e)}")
      raise e

