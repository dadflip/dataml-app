id: extract_sftp
name: 'Extract: Serveur SFTP'
description: Télécharge un fichier de manière sécurisée via Paramiko.
when_to_use: Pour récupérer des jeux de données mis à disposition sur un serveur de fichiers sécurisé (SFTP).
use_cases:
  - Transfert de fichiers de données confidentiels inter-entreprises.
  - Synchronisation périodique de dumps de bases de données.
pros:
  - Haut niveau de sécurité grâce au chiffrement SSH.
  - Protocole très répandu et standard dans les échanges B2B.
cons:
  - Nécessite la gestion sécurisée des mots de passe ou clés SSH.
  - Peut être lent pour de très grands volumes de données.
category: 1. Extract
tags:
- extract
- sftp
- ssh
code_template: |
  import paramiko
  import os
  import time
  import pandas as pd

  # [PARAM: HOST | string]
  HOST = "sftp.example.com"
  # [/PARAM]

  # [PARAM: USER | string]
  USER = "username"
  # [/PARAM]

  # [PARAM: PWD | string]
  PWD = "password"
  # [/PARAM]

  # [PARAM: REMOTE_PATH | string]
  REMOTE_PATH = "/secure/data.csv"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/sftp_data.csv"
  # [/PARAM]

  print(f"[EXTRACT] Connexion SFTP à {HOST}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      ssh = paramiko.SSHClient()
      ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
      ssh.connect(HOST, username=USER, password=PWD)
      
      sftp = ssh.open_sftp()
      sftp.get(REMOTE_PATH, DEST_PATH)
      sftp.close()
      ssh.close()
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès SFTP en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec SFTP : {str(e)}")
      raise e

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {"source": "sftp", "path": DEST_PATH}

