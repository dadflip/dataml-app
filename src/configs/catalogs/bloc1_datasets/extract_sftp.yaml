id: extract_sftp
name: 'Extract: Serveur SFTP'
description: Télécharge un fichier de manière sécurisée via Paramiko.
category: 1. Extract
tags:
- extract
- sftp
- ssh
code_template: "import paramiko\nimport os\nimport time\n\n# [PARAM: HOST | string]\n\
  HOST = \"sftp.example.com\"\n# [/PARAM]\n\n# [PARAM: USER | string]\nUSER = \"username\"\
  \n# [/PARAM]\n\n# [PARAM: PWD | string]\nPWD = \"password\"\n# [/PARAM]\n\n# [PARAM:\
  \ REMOTE_PATH | string]\nREMOTE_PATH = \"/secure/data.csv\"\n# [/PARAM]\n\n# [PARAM:\
  \ DEST_PATH | string]\nDEST_PATH = \"./data/raw/sftp_data.csv\"\n# [/PARAM]\n\n\
  print(f\"[EXTRACT] Connexion SFTP à {HOST}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    ssh = paramiko.SSHClient()\n\
  \    ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())\n    ssh.connect(HOST,\
  \ username=USER, password=PWD)\n    \n    sftp = ssh.open_sftp()\n    sftp.get(REMOTE_PATH,\
  \ DEST_PATH)\n    sftp.close()\n    ssh.close()\n    \n    duration = time.time()\
  \ - start_time\n    print(f\"[EXTRACT] Succès SFTP en {duration:.2f}s.\")\nexcept\
  \ Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec SFTP : {str(e)}\")\n    raise\
  \ e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\"\
  : \"sftp\", \"path\": DEST_PATH}\n"
