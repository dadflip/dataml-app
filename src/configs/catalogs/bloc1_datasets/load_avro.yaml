id: load_avro
name: 'Load: Fichier Avro'
description: Charge un fichier de sérialisation de données Apache Avro.
category: 2. Load
tags:
- load
- avro
- bigdata
- pandas
code_template: "import pandas as pd\nimport time\nimport os\n\n# [PARAM: FILE_PATH\
  \ | file]\nFILE_PATH = \"./data/raw/data.avro\"\n# [/PARAM]\n\n# [PARAM: TARGET_COL\
  \ | string]\nTARGET_COL = \"target\"\n# [/PARAM]\n\nprint(f\"[LOAD] Chargement du\
  \ fichier Avro depuis {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n   \
  \ raise FileNotFoundError(f\"[ERREUR LOAD] Fichier Avro introuvable : {FILE_PATH}\"\
  )\n\ntry:\n    start_time = time.time()\n    # pandavro est la méthode la plus simple\
  \ pour lier Avro et Pandas\n    import pandavro as pdx\n    df = pdx.read_avro(FILE_PATH)\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[LOAD] Succès Avro.\
  \ {df.shape[0]} lignes chargées en {duration:.2f}s.\")\nexcept ImportError:\n  \
  \  print(\"[ERREUR LOAD] Le module 'pandavro' est requis (pip install pandavro).\"\
  )\n    raise\nexcept Exception as e:\n    print(f\"[ERREUR LOAD] Impossible de lire\
  \ le fichier Avro : {str(e)}\")\n    raise e\n\ntarget_name = TARGET_COL if TARGET_COL\
  \ and TARGET_COL in df.columns else None\ntask_type = \"unknown\"\nmeta = {\"format\"\
  : \"avro\", \"shape\": df.shape}\n"
