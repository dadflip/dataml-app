id: load_avro
name: 'Load: Fichier Avro'
description: "Charge des données tabulaires stockées au format Apache Avro, un système de sérialisation de données orienté ligne très populaire dans les architectures Big Data (comme Hadoop ou Kafka). Ce bloc utilise la bibliothèque pandavro pour lire le fichier binaire compressé et son schéma intégré, puis le convertir de manière fluide et rapide en un DataFrame Pandas. Il préserve scrupuleusement les types de données complexes et offre d'excellentes performances d'ingestion."
when_to_use: "Idéal lorsque vous travaillez avec des pipelines de données distribués, des systèmes de streaming, ou des exports de bases de données Big Data où les données sont sérialisées en Avro pour optimiser le stockage et garantir la consistance des schémas."
use_cases:
  - "Ingestion de flux de données (logs, événements temporels) provenant d'Apache Kafka."
  - "Traitement analytique de données exportées depuis un data lake ou Hadoop."
  - "Migration de données structurées avec une forte garantie sur le typage (schéma intégré)."
pros:
  - "Excellente conservation des types de données grâce au schéma fortement typé embarqué dans le fichier."
  - "Fichier compact et binaire, offrant un gain d'espace de stockage significatif par rapport à du CSV ou du JSON."
  - "Vitesse de lecture et de sérialisation/désérialisation très élevée."
cons:
  - "Nécessite la bibliothèque externe pandavro (et fastavro en sous-dépendance)."
  - "Format binaire non lisible par l'œil humain (impossible de l'ouvrir dans un éditeur de texte standard)."
  - "Moins d'outils d'exploration visuelle rapide comparé au CSV."
category: 2. Load
tags:
- load
- avro
- bigdata
- pandas
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.avro"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Chargement du fichier Avro depuis {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier Avro introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      # pandavro est la méthode la plus simple pour lier Avro et Pandas
      import pandavro as pdx
      df = pdx.read_avro(FILE_PATH)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Avro. {df.shape[0]} lignes chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'pandavro' est requis (pip install pandavro).")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de lire le fichier Avro : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "unknown"
  meta = {"format": "avro", "shape": df.shape}

