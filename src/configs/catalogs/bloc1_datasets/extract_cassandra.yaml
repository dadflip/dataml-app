id: extract_cassandra
name: 'Extract: Apache Cassandra'
description: Exécute une requête CQL sur un cluster Cassandra.
category: 1. Extract
tags:
- extract
- cassandra
- cql
- nosql
code_template: "from cassandra.cluster import Cluster\nimport pandas as pd\nimport\
  \ os\nimport time\n\n# [PARAM: HOST | string]\nHOST = \"127.0.0.1\"\n# [/PARAM]\n\
  \n# [PARAM: KEYSPACE | string]\nKEYSPACE = \"my_keyspace\"\n# [/PARAM]\n\n# [PARAM:\
  \ CQL_QUERY | string]\nCQL_QUERY = \"SELECT * FROM my_table LIMIT 1000\"\n# [/PARAM]\n\
  \n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/cassandra_export.csv\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Connexion au cluster Cassandra ({HOST})...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    cluster = Cluster([HOST])\n    session = cluster.connect(KEYSPACE)\n\
  \    \n    # Récupération sous forme de dictionnaire dict_factory pour pandas\n\
  \    from cassandra.query import dict_factory\n    session.row_factory = dict_factory\n\
  \    \n    rows = session.execute(CQL_QUERY)\n    df_temp = pd.DataFrame(list(rows))\n\
  \    \n    df_temp.to_csv(DEST_PATH, index=False)\n    cluster.shutdown()\n    \n\
  \    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès Cassandra.\
  \ {df_temp.shape[0]} lignes exportées en {duration:.2f}s.\")\nexcept Exception as\
  \ e:\n    print(f\"[ERREUR EXTRACT] Échec Cassandra : {str(e)}\")\n    raise e\n\
  \ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"\
  cassandra\", \"path\": DEST_PATH}\n"
