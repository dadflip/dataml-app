id: eda_text_sentiment
name: 'EDA: Distribution des Sentiments'
description: "Analyse de la polarité des textes via TextBlob pour afficher la distribution des sentiments (négatif à positif)."
when_to_use: "Pour mesurer la satisfaction globale ou l'émotion exprimée dans des données textuelles non structurées."
use_cases:
  - "Analyser la répartition des sentiments dans des reviews de produits."
  - "Catégoriser des tweets ou des commentaires selon leur ton."
pros:
  - "Très facile à utiliser grâce à la librairie TextBlob (sans entraînement préalable)."
  - "Donne une indication rapide de la polarité générale du jeu de données."
cons:
  - "TextBlob est optimisé pour l'anglais et peut être imprécis sur des jargons spécifiques ou du sarcasme."
  - "Lent sur de très volumineux datasets à cause du traitement par ligne."
category: 3. Exploratory Data Analysis
tags:
- eda
- text
- nlp
- sentiment
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns
  from textblob import TextBlob
  
  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]
  
  if TEXT_COL in df.columns:
      print("[EDA] Calcul des scores de sentiment en cours...")
      polarities = df[TEXT_COL].dropna().astype(str).apply(lambda x: TextBlob(x).sentiment.polarity)
      
      plt.figure(figsize=(8, 5))
      sns.histplot(polarities, bins=30, kde=True, color='teal')
      plt.title(f"Distribution de Polarité des Sentiments - {TEXT_COL}")
      plt.xlabel("Polarité (-1 = Négatif, 1 = Positif)")
      plt.show()
  else:
      print(f"[EDA] Colonne {TEXT_COL} introuvable.")
