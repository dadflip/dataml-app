code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\nfrom textblob import TextBlob\n\n# [PARAM: TEXT_COL | string]\nTEXT_COL\
  \ = \"text\"\n# [/PARAM]\n\nif TEXT_COL in df.columns:\n    print(\"[EDA] Calcul\
  \ des scores de sentiment en cours...\")\n    polarities = df[TEXT_COL].dropna().astype(str).apply(lambda\
  \ x: TextBlob(x).sentiment.polarity)\n    \n    plt.figure(figsize=(8, 5))\n   \
  \ sns.histplot(polarities, bins=30, kde=True, color='teal')\n    plt.title(f\"Distribution\
  \ de Polarité des Sentiments - {TEXT_COL}\")\n    plt.xlabel(\"Polarité (-1 = Négatif,\
  \ 1 = Positif)\")\n    plt.show()\nelse:\n    print(f\"[EDA] Colonne {TEXT_COL}\
  \ introuvable.\")\n"
