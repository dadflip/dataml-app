id: eda_audio_spectrogram_plot
name: 'EDA: Spectrogramme (Matplotlib)'
description: Génère un spectrogramme visuel via matplotlib sans torchaudio.
category: 3. Exploratory Data Analysis
tags:
- eda
- audio
- multimedia
- spectrogram
code_template: "import matplotlib.pyplot as plt\n\n# [PARAM: SAMPLE_RATE | number]\n\
  SAMPLE_RATE = 16000\n# [/PARAM]\n\nif 'waveform' in locals():\n    # Convertir stereo\
  \ en mono pour la visualisation\n    if waveform.shape[0] > 1:\n        signal =\
  \ waveform.mean(dim=0).numpy()\n    else:\n        signal = waveform[0].numpy()\n\
  \        \n    plt.figure(figsize=(12, 5))\n    plt.specgram(signal, Fs=SAMPLE_RATE,\
  \ cmap='magma')\n    plt.title(\"Spectrogramme du signal audio\")\n    plt.ylabel(\"\
  Fréquence (Hz)\")\n    plt.xlabel(\"Temps (s)\")\n    plt.colorbar(format='%+2.0f\
  \ dB')\n    plt.show()\nelse:\n    print(\"[EDA] Tensor 'waveform' introuvable.\"\
  )\n"
