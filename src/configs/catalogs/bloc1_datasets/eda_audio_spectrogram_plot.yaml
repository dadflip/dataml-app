id: "eda_audio_spectrogram_plot"
name: "EDA: Spectrogramme (Matplotlib)"
description: "Génère un spectrogramme visuel via matplotlib sans torchaudio."
category: "3. Exploratory Data Analysis"
tags: ["eda", "audio", "multimedia", "spectrogram"]
code_template: |
  import matplotlib.pyplot as plt

  # [PARAM: SAMPLE_RATE | number]
  SAMPLE_RATE = 16000
  # [/PARAM]

  if 'waveform' in locals():
      # Convertir stereo en mono pour la visualisation
      if waveform.shape[0] > 1:
          signal = waveform.mean(dim=0).numpy()
      else:
          signal = waveform[0].numpy()
          
      plt.figure(figsize=(12, 5))
      plt.specgram(signal, Fs=SAMPLE_RATE, cmap='magma')
      plt.title("Spectrogramme du signal audio")
      plt.ylabel("Fréquence (Hz)")
      plt.xlabel("Temps (s)")
      plt.colorbar(format='%+2.0f dB')
      plt.show()
  else:
      print("[EDA] Tensor 'waveform' introuvable.")
