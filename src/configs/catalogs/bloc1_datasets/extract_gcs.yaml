id: extract_gcs
name: 'Extract: Google Cloud Storage'
description: Télécharge un fichier depuis un bucket GCP Storage.
when_to_use: Recommandé lors de l'intégration avec des pipelines data hébergés sur Google Cloud Platform, pour ingérer des fichiers stockés dans un bucket GCS.
use_cases:
  - Récupération de datasets ML préparés sur Google Cloud.
  - Synchronisation de fichiers de données entre services GCP et locaux.
pros:
  - Très rapide et hautement disponible.
  - Sécurité robuste grâce aux credentials IAM Google Cloud.
cons:
  - Nécessite la configuration du fichier de credentials GOOGLE_APPLICATION_CREDENTIALS.
  - Dépendance réseau à GCP.
category: 1. Extract
tags:
- extract
- gcs
- gcp
- cloud
code_template: |
  from google.cloud import storage
  import os
  import time
  
  # [PARAM: BUCKET_NAME | string]
  BUCKET_NAME = "my-gcp-bucket"
  # [/PARAM]
  
  # [PARAM: BLOB_NAME | string]
  BLOB_NAME = "data.csv"
  # [/PARAM]
  
  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/gcs_data.csv"
  # [/PARAM]
  
  print(f"[EXTRACT] Téléchargement depuis gs://{BUCKET_NAME}/{BLOB_NAME}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)
  
  try:
      start_time = time.time()
      # Assurez-vous que GOOGLE_APPLICATION_CREDENTIALS est défini
      client = storage.Client()
      bucket = client.bucket(BUCKET_NAME)
      blob = bucket.blob(BLOB_NAME)
      
      blob.download_to_filename(DEST_PATH)
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès GCP. Fichier téléchargé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec GCS : {str(e)}")
      raise e
  
  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "gcs", "path": DEST_PATH}
