id: extract_gcs
name: 'Extract: Google Cloud Storage'
description: Télécharge un fichier depuis un bucket GCP Storage.
category: 1. Extract
tags:
- extract
- gcs
- gcp
- cloud
code_template: "from google.cloud import storage\nimport os\nimport time\n\n# [PARAM:\
  \ BUCKET_NAME | string]\nBUCKET_NAME = \"my-gcp-bucket\"\n# [/PARAM]\n\n# [PARAM:\
  \ BLOB_NAME | string]\nBLOB_NAME = \"data.csv\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH\
  \ | string]\nDEST_PATH = \"./data/raw/gcs_data.csv\"\n# [/PARAM]\n\nprint(f\"[EXTRACT]\
  \ Téléchargement depuis gs://{BUCKET_NAME}/{BLOB_NAME}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    # Assurez-vous que GOOGLE_APPLICATION_CREDENTIALS\
  \ est défini\n    client = storage.Client()\n    bucket = client.bucket(BUCKET_NAME)\n\
  \    blob = bucket.blob(BLOB_NAME)\n    \n    blob.download_to_filename(DEST_PATH)\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès GCP.\
  \ Fichier téléchargé en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"\
  [ERREUR EXTRACT] Échec GCS : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name\
  \ = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"gcs\", \"path\": DEST_PATH}\n"
