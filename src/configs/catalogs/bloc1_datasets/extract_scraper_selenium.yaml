id: extract_scraper_selenium
name: 'Extract: Web Scraping (Selenium)'
description: Pilote un navigateur Chrome headless pour extraire une page web dynamique
  (JavaScript).
category: 1. Extract
tags:
- extract
- scraping
- selenium
- dynamic
code_template: "from selenium import webdriver\nfrom selenium.webdriver.chrome.options\
  \ import Options\nimport os\nimport time\n\n# [PARAM: TARGET_URL | string]\nTARGET_URL\
  \ = \"https://example.com/dynamic\"\n# [/PARAM]\n\n# [PARAM: WAIT_SEC | string]\n\
  WAIT_SEC = \"3\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/scraped_dynamic.html\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Lancement de Selenium en mode Headless pour {TARGET_URL}...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    chrome_options = Options()\n    chrome_options.add_argument(\"\
  --headless\")\n    chrome_options.add_argument(\"--no-sandbox\")\n    chrome_options.add_argument(\"\
  --disable-dev-shm-usage\")\n    \n    driver = webdriver.Chrome(options=chrome_options)\n\
  \    driver.get(TARGET_URL)\n    \n    print(f\"[EXTRACT] Attente de {WAIT_SEC}s\
  \ pour le chargement du JavaScript...\")\n    time.sleep(int(WAIT_SEC))\n    \n\
  \    html_content = driver.page_source\n    driver.quit()\n    \n    with open(DEST_PATH,\
  \ \"w\", encoding=\"utf-8\") as f:\n        f.write(html_content)\n        \n  \
  \  duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès Selenium.\
  \ DOM sauvegardé en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR\
  \ EXTRACT] Échec du scraping Selenium : {str(e)}\")\n    raise e\n\ndf = None\n\
  target_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"scraping_selenium\"\
  , \"path\": DEST_PATH}\n"
