id: eda_target_distribution
name: 'EDA: Distribution de la Target'
description: "Analyse spécifique de la distribution de la variable cible pour identifier son type (Régression ou Classification) et ses caractéristiques."
when_to_use: "Au tout début de l'exploration des données pour comprendre la nature de ce que vous cherchez à prédire."
use_cases:
  - "Vérifier le déséquilibre des classes pour un problème de classification (Target catégorielle)."
  - "Observer l'asymétrie ou les valeurs extrêmes (outliers) pour un problème de régression (Target continue)."
pros:
  - "Adaptation automatique selon le type de la Target (numérique vs catégorielle)."
  - "Donne une vue immédiate des proportions ou de la distribution."
cons:
  - "L'heuristique de détection (nunique > 20) peut parfois se tromper sur certaines variables discrètes."
category: 3. Exploratory Data Analysis
tags:
- eda
- target
- tabular
- seaborn
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns
  
  # target_name provient du bloc LOAD précédent
  if 'target_name' in locals() and target_name and target_name in df.columns:
      plt.figure(figsize=(8, 5))
      if pd.api.types.is_numeric_dtype(df[target_name]) and df[target_name].nunique() > 20:
          print(f"[EDA] Target '{target_name}' détectée comme CONTINUE (Régression).")
          sns.histplot(df[target_name].dropna(), kde=True, color='purple')
          plt.title(f"Distribution Continue de la cible : {target_name}")
      else:
          print(f"[EDA] Target '{target_name}' détectée comme CATÉGORIELLE (Classification).")
          val_counts = df[target_name].value_counts(normalize=True) * 100
          print("Répartition (%) :\n", val_counts)
          sns.countplot(data=df, x=target_name, order=df[target_name].value_counts().index, palette='viridis')
          plt.title(f"Distribution Catégorielle de la cible : {target_name}")
      plt.show()
  else:
      print("[EDA] AVERTISSEMENT : target_name n'est pas définie ou introuvable dans df.")
illustration_mermaid: |
    graph TD
      In1[/df/] --> P1{Check target_name}
      In2[/target_name/] --> P1
      P1 -- Valide --> P2{Check type & unique > 20}
      P2 -- Continue --> P3{sns.histplot}
      P2 -- Catégorielle --> P4{sns.countplot}
      P3 --> Out1([Fig: Dist Continue])
      P4 --> Out2([Fig: Dist Catégorielle])
      P1 -- Invalide --> Out3([Print Avertissement])
      
      style In1 fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
