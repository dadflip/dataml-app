id: eda_target_distribution
name: 'EDA: Distribution de la Target'
description: Analyse spécifique de la variable cible (Régression ou Classification).
category: 3. Exploratory Data Analysis
tags:
- eda
- target
- tabular
- seaborn
code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\n\n# target_name provient du bloc LOAD précédent\n\
  if 'target_name' in locals() and target_name and target_name in df.columns:\n  \
  \  plt.figure(figsize=(8, 5))\n    if pd.api.types.is_numeric_dtype(df[target_name])\
  \ and df[target_name].nunique() > 20:\n        print(f\"[EDA] Target '{target_name}'\
  \ détectée comme CONTINUE (Régression).\")\n        sns.histplot(df[target_name].dropna(),\
  \ kde=True, color='purple')\n        plt.title(f\"Distribution Continue de la cible\
  \ : {target_name}\")\n    else:\n        print(f\"[EDA] Target '{target_name}' détectée\
  \ comme CATÉGORIELLE (Classification).\")\n        val_counts = df[target_name].value_counts(normalize=True)\
  \ * 100\n        print(\"Répartition (%) :\\n\", val_counts)\n        sns.countplot(data=df,\
  \ x=target_name, order=df[target_name].value_counts().index, palette='viridis')\n\
  \        plt.title(f\"Distribution Catégorielle de la cible : {target_name}\")\n\
  \    plt.show()\nelse:\n    print(\"[EDA] AVERTISSEMENT : target_name n'est pas\
  \ définie ou introuvable dans df.\")\n"
