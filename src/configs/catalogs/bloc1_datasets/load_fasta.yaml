id: load_fasta
name: 'Load: Séquences ADN FASTA'
description: Parse un fichier de séquences génétiques FASTA via Biopython.
category: 2. Load
tags:
- load
- fasta
- bioinformatics
- dna
code_template: "import time\nimport os\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/sequence.fasta\"\n# [/PARAM]\n\nprint(f\"[LOAD] Parsing FASTA : {FILE_PATH}...\"\
  )\nif not os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD]\
  \ Fichier FASTA introuvable : {FILE_PATH}\")\n\ntry:\n    start_time = time.time()\n\
  \    from Bio import SeqIO\n    \n    records = list(SeqIO.parse(FILE_PATH, \"fasta\"\
  ))\n    count = len(records)\n    \n    duration = time.time() - start_time\n  \
  \  print(f\"[LOAD] Succès FASTA. {count} séquences chargées en {duration:.2f}s.\"\
  )\nexcept ImportError:\n    print(\"[ERREUR LOAD] Le module 'biopython' est requis\
  \ (pip install biopython).\")\n    raise\nexcept Exception as e:\n    print(f\"\
  [ERREUR LOAD] Erreur de parsing FASTA : {str(e)}\")\n    raise e\n\ndf = None\n\
  target_name = None\ntask_type = \"nlp_sequence\"\nmeta = {\"format\": \"fasta\"\
  , \"num_sequences\": count}\n"
