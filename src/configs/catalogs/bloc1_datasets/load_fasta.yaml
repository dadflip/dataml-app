id: load_fasta
name: 'Load: Séquences ADN FASTA'
description: Parse un fichier de séquences génétiques FASTA via Biopython.
category: 2. Load
tags:
- load
- fasta
- bioinformatics
- dna
code_template: |
  import time
  import os
  import pandas as pd

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/sequence.fasta"
  # [/PARAM]

  print(f"[LOAD] Parsing FASTA : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier FASTA introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      from Bio import SeqIO
      
      records = list(SeqIO.parse(FILE_PATH, "fasta"))
      count = len(records)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès FASTA. {count} séquences chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'biopython' est requis (pip install biopython).")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur de parsing FASTA : {str(e)}")
      raise e

  df = pd.DataFrame([{"id": r.id, "sequence": str(r.seq)} for r in records])
  target_name = ""
  task_type = "nlp_sequence"
  meta = {"format": "fasta", "num_sequences": count}
illustration_mermaid: |
  flowchart TD
      A([FILE_PATH]) --> B[Load FASTA]
      B --> df([df])
      
      style A fill:#3b82f6,color:#fff
      style B fill:#10b981,color:#fff
      style df fill:#f59e0b,color:#fff

