id: load_edgelist
name: 'Load: Edge List (CSV/TSV)'
description: >
  Charge un graphe relationnel à partir d'un fichier tabulaire simple (CSV ou TSV) listant exclusivement ses arêtes sous forme de paires (source, cible). 
  Il reconstruit automatiquement la topologie du réseau et permet l'intégration optionnelle d'un fichier séparé contenant les caractéristiques (features) des nœuds. 
  À la sortie, il fournit un DataFrame représentant les nœuds et un 'edge_index' structuré dans les métadonnées pour l'analyse de graphes.
when_to_use: >
  Utilisez ce composant lorsque vos données de graphe sont sauvegardées de manière très rudimentaire et tabulaire, typiquement lors de l'export de bases de données relationnelles ou d'interactions par paires, et que vous souhaitez reconstruire le graphe en mémoire.
use_cases:
  - "Analyse de graphes de transactions financières pour la détection de fraudes."
  - "Modélisation des réseaux d'interactions protéines-protéines en bio-informatique."
  - "Systèmes de recommandation basés sur un graphe bipartite d'interactions utilisateurs-articles."
pros:
  - "Extrêmement flexible, supportant n'importe quel fichier CSV/TSV basique décrivant des connexions."
  - "Permet d'associer un fichier complémentaire pour enrichir les nœuds avec des caractéristiques (features)."
  - "Formate automatiquement les arêtes (edge_index) pour la compatibilité avec les réseaux de neurones sur graphes."
cons:
  - "L'absence de métadonnées intrinsèques dans l'Edge List nécessite parfois de manipuler les index de manière précautionneuse."
  - "Moins performant que des bases de graphes dédiées pour l'interrogation directe en mémoire."
category: 2. Load
tags:
- load
- graph
- edgelist
- csv
- networkx
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      import networkx as nx
  except ImportError:
      nx = None
      print("[ERREUR LOAD] 'networkx' n'est pas installé.")

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/edges.csv"
  # [/PARAM]

  # [PARAM: SEP | string]
  SEP = ","
  # [/PARAM]

  # [PARAM: NODE_FEATURES_PATH | string]
  NODE_FEATURES_PATH = ""
  # [/PARAM]

  print(f"[LOAD] Chargement de l'Edge List depuis {FILE_PATH}...")

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {}

  try:
      if nx is not None:
          start_time = time.time()
          
          edges_df = pd.read_csv(FILE_PATH, sep=SEP, header=0)
          src_col = edges_df.columns[0]
          dst_col = edges_df.columns[1]
          
          G = nx.from_pandas_edgelist(edges_df, source=src_col, target=dst_col)
          
          # Si un fichier de features de noeuds est fourni, on le charge
          if NODE_FEATURES_PATH and NODE_FEATURES_PATH.strip():
              df = pd.read_csv(NODE_FEATURES_PATH, sep=SEP)
          else:
              # Sinon on génère un df basique avec les identifiants de noeuds
              df = pd.DataFrame({"node_id": list(G.nodes())})
          
          node_list = list(G.nodes())
          node2idx = {n: i for i, n in enumerate(node_list)}
          src = [node2idx[u] for u, v in G.edges()]
          dst = [node2idx[v] for u, v in G.edges()]
          edge_index = np.array([src, dst], dtype=np.int64)
          
          duration = time.time() - start_time
          print(f"[LOAD] Succès Edge List. {G.number_of_nodes()} noeuds, {G.number_of_edges()} arêtes en {duration:.2f}s.")
          
          target_name = ""
          task_type = "graph_unsupervised"
          meta = {"format": "edgelist", "shape": df.shape, "edge_index": edge_index, "node_list": node_list}
  except Exception as e:
      print(f"[ERREUR LOAD] Échec du chargement Edge List : {str(e)}")
      raise e
