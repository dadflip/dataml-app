id: load_edgelist
name: 'Load: Edge List (CSV/TSV)'
description: Charge un graphe défini par une liste d'arêtes (source, target) dans
  un fichier CSV ou TSV. Construit le df des noeuds et l'edge_index dans meta.
category: 2. Load
tags:
- load
- graph
- edgelist
- csv
- networkx
code_template: "import pandas as pd\nimport numpy as np\nimport time\ntry:\n    import\
  \ networkx as nx\nexcept ImportError:\n    nx = None\n    print(\"[ERREUR LOAD]\
  \ 'networkx' n'est pas installé.\")\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/edges.csv\"\n# [/PARAM]\n\n# [PARAM: SEP | string]\nSEP = \",\"\n\
  # [/PARAM]\n\n# [PARAM: NODE_FEATURES_PATH | string]\nNODE_FEATURES_PATH = \"\"\n\
  # [/PARAM]\n\nprint(f\"[LOAD] Chargement de l'Edge List depuis {FILE_PATH}...\"\
  )\n\ntry:\n    if nx is not None:\n        start_time = time.time()\n        \n\
  \        edges_df = pd.read_csv(FILE_PATH, sep=SEP, header=0)\n        src_col =\
  \ edges_df.columns[0]\n        dst_col = edges_df.columns[1]\n        \n       \
  \ G = nx.from_pandas_edgelist(edges_df, source=src_col, target=dst_col)\n      \
  \  \n        # Si un fichier de features de noeuds est fourni, on le charge\n  \
  \      if NODE_FEATURES_PATH and NODE_FEATURES_PATH.strip():\n            df = pd.read_csv(NODE_FEATURES_PATH,\
  \ sep=SEP)\n        else:\n            # Sinon on génère un df basique avec les\
  \ identifiants de noeuds\n            df = pd.DataFrame({\"node_id\": list(G.nodes())})\n\
  \        \n        node_list = list(G.nodes())\n        node2idx = {n: i for i,\
  \ n in enumerate(node_list)}\n        src = [node2idx[u] for u, v in G.edges()]\n\
  \        dst = [node2idx[v] for u, v in G.edges()]\n        edge_index = np.array([src,\
  \ dst], dtype=np.int64)\n        \n        duration = time.time() - start_time\n\
  \        print(f\"[LOAD] Succès Edge List. {G.number_of_nodes()} noeuds, {G.number_of_edges()}\
  \ arêtes en {duration:.2f}s.\")\n        \n        target_name = None\n        task_type\
  \ = \"graph_unsupervised\"\n        meta = {\"format\": \"edgelist\", \"shape\"\
  : df.shape, \"edge_index\": edge_index, \"node_list\": node_list}\n    else:\n \
  \       df = None\n        target_name = None\n        task_type = \"unknown\"\n\
  \        meta = {}\nexcept Exception as e:\n    print(f\"[ERREUR LOAD] Échec du\
  \ chargement Edge List : {str(e)}\")\n    raise e\n"
