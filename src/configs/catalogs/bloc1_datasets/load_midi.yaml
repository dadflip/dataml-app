id: load_midi
name: 'Load: Fichier MIDI'
description: "Ce bloc permet de parser et d'extraire des événements depuis un fichier musical MIDI. Il transforme les notes et pistes en une structure de données tabulaire exploitable en apprentissage automatique."
when_to_use: "À utiliser lorsque vous travaillez sur des projets de génération musicale, d'analyse de mélodies ou de transcription automatique et que vous possédez des données brutes au format MIDI."
use_cases:
  - "Génération de nouvelles séquences musicales par réseaux de neurones (ex: RNN, Transformers)."
  - "Classification de genres musicaux à partir de motifs mélodiques."
  - "Extraction de caractéristiques rythmiques et harmoniques pour l'analyse musicologique."
pros:
  - "Extraction structurée et détaillée des événements musicaux (notes, vélocité, tempo)."
  - "Format très léger par rapport aux fichiers audio bruts (WAV, MP3)."
cons:
  - "Ne contient pas la forme d'onde audio (pas de timbre ou de texture sonore réelle)."
  - "Nécessite la bibliothèque externe `mido`."
category: 2. Load
tags: ["load", "midi", "music", "audio"]
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/music.mid"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier MIDI : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier MIDI introuvable : {FILE_PATH}")

  events = []
  try:
      start_time = time.time()
      import mido
      mid = mido.MidiFile(FILE_PATH)
      
      for i, track in enumerate(mid.tracks):
          for msg in track:
              event = msg.dict()
              event['track'] = i
              events.append(event)
              
      duration = time.time() - start_time
      print(f"[LOAD] Succès MIDI. {len(events)} événements chargés en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'mido' est requis (pip install mido).")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur de lecture MIDI : {str(e)}")
      raise e

  df = pd.DataFrame(events)
  target_name = ""
  task_type = "unknown"
  meta = {"format": "midi", "path": FILE_PATH, "events_count": len(events)}
output_variables:
  - df
  - target_name
  - task_type
  - meta
