id: extract_api_paginated
name: 'Extract: API REST (Paginée)'
description: Extrait toutes les pages d'une API REST qui utilise une pagination (offset/limit).
category: 1. Extract
tags:
- extract
- api
- rest
- pagination
code_template: "import requests\nimport json\nimport os\nimport time\n\n# [PARAM:\
  \ BASE_URL | string]\nBASE_URL = \"https://api.example.com/v1/records\"\n# [/PARAM]\n\
  \n# [PARAM: MAX_PAGES | string]\nMAX_PAGES = \"5\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH\
  \ | string]\nDEST_PATH = \"./data/raw/api_paginated.jsonlines\"\n# [/PARAM]\n\n\
  print(f\"[EXTRACT] Extraction paginée depuis {BASE_URL}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    page = 1\n    total_records\
  \ = 0\n    \n    with open(DEST_PATH, \"w\", encoding=\"utf-8\") as f:\n       \
  \ while page <= int(MAX_PAGES):\n            resp = requests.get(f\"{BASE_URL}?page={page}&limit=100\"\
  , timeout=15)\n            if resp.status_code != 200:\n                break\n\
  \                \n            data = resp.json()\n            # Suppose que l'API\
  \ renvoie { \"data\": [...] }\n            records = data.get(\"data\", [])\n  \
  \          if not records:\n                break\n                \n          \
  \  for r in records:\n                f.write(json.dumps(r) + \"\\\\n\")\n     \
  \           \n            total_records += len(records)\n            page += 1\n\
  \            time.sleep(0.5) # Anti rate-limit\n            \n    duration = time.time()\
  \ - start_time\n    print(f\"[EXTRACT] Succès Pagination API. {total_records} records\
  \ extraits en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR\
  \ EXTRACT] Échec API paginée : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name\
  \ = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"api_paginated\", \"path\"\
  : DEST_PATH}\n"
