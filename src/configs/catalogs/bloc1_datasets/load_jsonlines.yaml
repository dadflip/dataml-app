id: "load_jsonlines"
name: "Load: Fichier JSONL (JSON Lines)"
description: "Charge un fichier contenant un objet JSON valide par ligne."
when_to_use: "Lorsque vous traitez des logs, des historiques d'événements, ou des données textuelles NLP exportées (ex: tweets, reviews) où chaque ligne est un document JSON indépendant."
use_cases:
  - "Analyse de fichiers de logs applicatifs ou de télémétrie."
  - "Traitement de datasets NLP volumineux qui ne tiennent pas dans un JSON classique."
  - "Ingestion de flux de données (streaming) sauvegardés de manière incrémentale sur disque."
pros:
  - "Format très robuste : une ligne corrompue n'invalide pas nécessairement tout le fichier."
  - "Chargement natif et optimisé via pandas (read_json avec lines=True)."
  - "Supporte bien les schémas complexes ou imbriqués au sein de chaque ligne."
cons:
  - "La consommation mémoire peut être élevée si les objets JSON sont très volumineux."
  - "L'inférence automatique du schéma (colonnes) par Pandas peut être lente sur de très gros fichiers."
category: "2. Load"
tags: ["load", "jsonl", "streaming", "pandas"]
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.jsonl"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier JSONL : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier JSONL introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      df = pd.read_json(FILE_PATH, lines=True)
      duration = time.time() - start_time
      print(f"[LOAD] Succès JSONL. {df.shape[0]} lignes chargées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur de lecture JSONL : {str(e)}")
      raise e

  target_name = ""
  task_type = "unknown"
  meta = {"format": "jsonl", "shape": df.shape}
