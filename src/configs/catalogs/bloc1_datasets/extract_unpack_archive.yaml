id: "extract_unpack_archive"
name: "Extract: Décompresser Archive"
description: "Dézippe ou dé-tar un fichier d'archive téléchargé."
category: "1. Extract"
tags: ["extract", "unzip", "tar", "archive"]
code_template: |
  import os
  import tarfile
  import zipfile
  import time

  # [PARAM: ARCHIVE_PATH | file]
  ARCHIVE_PATH = "./data/raw/dataset.zip"
  # [/PARAM]
  
  # [PARAM: EXTRACT_DIR | dir]
  EXTRACT_DIR = "./data/extracted"
  # [/PARAM]

  print(f"[EXTRACT] Décompression de {ARCHIVE_PATH} vers {EXTRACT_DIR}...")
  os.makedirs(EXTRACT_DIR, exist_ok=True)

  try:
      start_time = time.time()
      if ARCHIVE_PATH.endswith(".zip"):
          with zipfile.ZipFile(ARCHIVE_PATH, 'r') as zip_ref:
              zip_ref.extractall(EXTRACT_DIR)
      elif ARCHIVE_PATH.endswith((".tar", ".tar.gz", ".tgz")):
          with tarfile.open(ARCHIVE_PATH, "r:*") as tar_ref:
              tar_ref.extractall(path=EXTRACT_DIR)
      else:
          raise ValueError("Format d'archive non supporté (.zip, .tar, .tgz uniquement)")
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès. Contenu extrait en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Impossible de décompresser l'archive : {str(e)}")
      raise e

  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "archive_extract", "path": EXTRACT_DIR}
_metadata:
  bloc: 1
  section: "1_extract"
