id: extract_unpack_archive
name: 'Extract: Décompresser Archive'
description: Dézippe ou dé-tar un fichier d'archive téléchargé.
category: 1. Extract
tags:
- extract
- unzip
- tar
- archive
code_template: "import os\nimport tarfile\nimport zipfile\nimport time\n\n# [PARAM:\
  \ ARCHIVE_PATH | file]\nARCHIVE_PATH = \"./data/raw/dataset.zip\"\n# [/PARAM]\n\n\
  # [PARAM: EXTRACT_DIR | dir]\nEXTRACT_DIR = \"./data/extracted\"\n# [/PARAM]\n\n\
  print(f\"[EXTRACT] Décompression de {ARCHIVE_PATH} vers {EXTRACT_DIR}...\")\nos.makedirs(EXTRACT_DIR,\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    if ARCHIVE_PATH.endswith(\"\
  .zip\"):\n        with zipfile.ZipFile(ARCHIVE_PATH, 'r') as zip_ref:\n        \
  \    zip_ref.extractall(EXTRACT_DIR)\n    elif ARCHIVE_PATH.endswith((\".tar\",\
  \ \".tar.gz\", \".tgz\")):\n        with tarfile.open(ARCHIVE_PATH, \"r:*\") as\
  \ tar_ref:\n            tar_ref.extractall(path=EXTRACT_DIR)\n    else:\n      \
  \  raise ValueError(\"Format d'archive non supporté (.zip, .tar, .tgz uniquement)\"\
  )\n        \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès.\
  \ Contenu extrait en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"\
  [ERREUR EXTRACT] Impossible de décompresser l'archive : {str(e)}\")\n    raise e\n\
  \ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"\
  archive_extract\", \"path\": EXTRACT_DIR}\n"
