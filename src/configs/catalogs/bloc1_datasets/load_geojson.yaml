id: load_geojson
name: 'Load: GeoJSON (Spatial)'
description: |
  Permet d'importer des fichiers contenant des entités géographiques complexes et leurs attributs tabulaires associés depuis le format standard ouvert GeoJSON. En utilisant GeoPandas sous le capot, ce bloc convertit le texte structuré en un objet GeoDataFrame, intégrant nativement la géométrie (points, lignes, polygones) et le système de coordonnées de référence (CRS), rendant les données spatiales prêtes pour le géotraitement et le Machine Learning spatial.
when_to_use: 'Idéal lorsque vos sources de données proviennent de systèmes d''information géographique (SIG), d''API cartographiques ou d''OpenStreetMap, et que la dimension spatiale (distances, inclusions, intersections) est une composante clé pour vos modèles d''apprentissage.'
use_cases:
  - 'Création de cartes choroplèthes et visualisation de clusters spatiaux dans des projets de Data Science urbaine.'
  - 'Extraction de variables explicatives géographiques (ex: proximité des transports, appartenance à une zone inondable) pour enrichir un modèle tabulaire classique.'
  - 'Modélisation et prédiction de phénomènes localisés (ex: prix de l''immobilier, propagation de maladies) en exploitant les topologies.'
pros:
  - 'L''utilisation de GeoPandas permet de manipuler les données géospatiales avec la même simplicité et syntaxe que Pandas, abaissant considérablement la barrière à l''entrée.'
  - 'Conserve nativement les méta-informations spatiales essentielles, en particulier le CRS (Coordinate Reference System), évitant les erreurs fréquentes de projection.'
  - 'Le format GeoJSON est lisible par l''homme et constitue un standard universellement reconnu pour l''échange de données web cartographiques.'
cons:
  - 'Le format GeoJSON est extrêmement verbeux (car basé sur du texte pur), entraînant des fichiers très volumineux et des temps de lecture/parsing parfois lents par rapport à des formats binaires comme FlatGeobuf ou GeoParquet.'
  - 'L''écosystème GeoPandas introduit des dépendances relativement lourdes et parfois complexes à installer (Fiona, GDAL, Shapely, pyproj).'
category: 2. Load
tags:
- load
- geojson
- spatial
- geopandas
code_template: |
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/map.geojson"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Chargement du fichier GeoJSON : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier GeoJSON introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      import geopandas as gpd
      
      df = gpd.read_file(FILE_PATH)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès GeoJSON. {df.shape[0]} géométries chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'geopandas' est requis.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de lire le fichier GeoJSON : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "spatial_analysis"
  meta = {"format": "geojson", "shape": df.shape, "crs": str(df.crs)}
