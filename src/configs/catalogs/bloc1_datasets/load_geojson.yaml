id: load_geojson
name: 'Load: GeoJSON (Spatial)'
description: Charge un fichier de données géospatiales GeoJSON dans un GeoDataFrame.
category: 2. Load
tags:
- load
- geojson
- spatial
- geopandas
code_template: "import time\nimport os\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/map.geojson\"\n# [/PARAM]\n\n# [PARAM: TARGET_COL | string]\nTARGET_COL\
  \ = \"target\"\n# [/PARAM]\n\nprint(f\"[LOAD] Chargement du fichier GeoJSON : {FILE_PATH}...\"\
  )\nif not os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD]\
  \ Fichier GeoJSON introuvable : {FILE_PATH}\")\n\ntry:\n    start_time = time.time()\n\
  \    import geopandas as gpd\n    \n    df = gpd.read_file(FILE_PATH)\n    \n  \
  \  duration = time.time() - start_time\n    print(f\"[LOAD] Succès GeoJSON. {df.shape[0]}\
  \ géométries chargées en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"\
  [ERREUR LOAD] Le module 'geopandas' est requis.\")\n    raise\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR LOAD] Impossible de lire le fichier GeoJSON : {str(e)}\"\
  )\n    raise e\n\ntarget_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns\
  \ else None\ntask_type = \"spatial_analysis\"\nmeta = {\"format\": \"geojson\",\
  \ \"shape\": df.shape, \"crs\": str(df.crs)}\n"
