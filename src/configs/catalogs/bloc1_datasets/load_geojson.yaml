id: load_geojson
name: 'Load: GeoJSON (Spatial)'
description: Charge un fichier de données géospatiales GeoJSON dans un GeoDataFrame.
category: 2. Load
tags:
- load
- geojson
- spatial
- geopandas
code_template: |
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/map.geojson"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Chargement du fichier GeoJSON : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier GeoJSON introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      import geopandas as gpd
      
      df = gpd.read_file(FILE_PATH)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès GeoJSON. {df.shape[0]} géométries chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'geopandas' est requis.")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de lire le fichier GeoJSON : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "spatial_analysis"
  meta = {"format": "geojson", "shape": df.shape, "crs": str(df.crs)}
