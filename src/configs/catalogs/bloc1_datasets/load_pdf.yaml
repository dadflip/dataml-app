id: "load_pdf"
name: "Load: Texte PDF"
description: "Extrait le texte brut d'un document PDF pour des tâches NLP."
when_to_use: "À utiliser lorsque vos données d'entrée sont contenues dans des documents PDF et que vous souhaitez effectuer des tâches d'analyse de texte, de classification ou d'extraction d'informations."
use_cases:
  - "Analyse de rapports financiers, documents juridiques ou articles scientifiques."
  - "Création de jeux de données pour l'entraînement ou le fine-tuning de modèles de langage (LLM)."
  - "Recherche d'informations et indexation de corpus documentaires."
pros:
  - "Extrait facilement le texte page par page pour conserver la structure globale."
  - "Idéal pour introduire des données textuelles non structurées dans un pipeline NLP."
cons:
  - "Peut perdre le formatage riche, les tableaux et les images contenus dans le PDF d'origine."
  - "L'extraction de texte peut être de mauvaise qualité pour les PDF scannés sans OCR préalable."
category: "2. Load"
tags: ["load", "pdf", "nlp", "text"]
code_template: |
  import pandas as pd
  import os
  import pypdf

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.pdf"
  # [/PARAM]

  meta = {"source": "PDF", "path": FILE_PATH}

  if os.path.exists(FILE_PATH):
      try:
          with open(FILE_PATH, 'rb') as f:
              reader = pypdf.PdfReader(f)
              meta["num_pages"] = len(reader.pages)
              
              pages_data = []
              for i, page in enumerate(reader.pages):
                  text = page.extract_text()
                  if text:
                      pages_data.append({"page_number": i + 1, "text": text.strip()})
                      
              df = pd.DataFrame(pages_data)
      except Exception as e:
          print(f"Error loading PDF file {FILE_PATH}: {e}")
          df = pd.DataFrame()
  else:
      print(f"File not found: {FILE_PATH}")
      df = pd.DataFrame()

  target_name = "text"
  task_type = "nlp"
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
        A[/"📄 FILE_PATH (data.pdf)"/] --> B{"pypdf Extract Text()"}
        C[/"🎯 TARGET_COL"/] --> D{"Check TARGET_COL"}
        B --> E(["📊 df (Pages Data)"])
        E --> D
        D --> F(["🎯 target_name"])
