id: extract_redis
name: 'Extract: Redis Key/Values'
description: Scanne une DB Redis en mémoire et exporte les clés/valeurs.
category: 1. Extract
tags:
- extract
- redis
- cache
- kv
code_template: "import redis\nimport json\nimport os\nimport time\n\n# [PARAM: REDIS_HOST\
  \ | string]\nREDIS_HOST = \"localhost\"\n# [/PARAM]\n\n# [PARAM: MATCH_PATTERN |\
  \ string]\nMATCH_PATTERN = \"user:*\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\n\
  DEST_PATH = \"./data/raw/redis_dump.json\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Scan\
  \ Redis ({REDIS_HOST}) avec pattern '{MATCH_PATTERN}'...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    r = redis.Redis(host=REDIS_HOST,\
  \ port=6379, db=0, decode_responses=True)\n    \n    data = {}\n    for key in r.scan_iter(match=MATCH_PATTERN):\n\
  \        data[key] = r.get(key)\n        \n    with open(DEST_PATH, \"w\", encoding=\"\
  utf-8\") as f:\n        json.dump(data, f, indent=2)\n        \n    duration = time.time()\
  \ - start_time\n    print(f\"[EXTRACT] Succès Redis. {len(data)} clés exportées\
  \ en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT]\
  \ Serveur Redis inaccessible : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name\
  \ = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"redis\", \"path\": DEST_PATH}\n"
