id: "extract_redis"
name: "Extract: Redis Key/Values"
description: "Scanne une DB Redis en mémoire et exporte les clés/valeurs."
category: "1. Extract"
tags: ["extract", "redis", "cache", "kv"]
code_template: |
  import redis
  import json
  import os
  import time

  # [PARAM: REDIS_HOST | string]
  REDIS_HOST = "localhost"
  # [/PARAM]
  
  # [PARAM: MATCH_PATTERN | string]
  MATCH_PATTERN = "user:*"
  # [/PARAM]
  
  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/redis_dump.json"
  # [/PARAM]

  print(f"[EXTRACT] Scan Redis ({REDIS_HOST}) avec pattern '{MATCH_PATTERN}'...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      r = redis.Redis(host=REDIS_HOST, port=6379, db=0, decode_responses=True)
      
      data = {}
      for key in r.scan_iter(match=MATCH_PATTERN):
          data[key] = r.get(key)
          
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2)
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Redis. {len(data)} clés exportées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Serveur Redis inaccessible : {str(e)}")
      raise e

  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "redis", "path": DEST_PATH}
_metadata:
  bloc: 1
  section: "1_extract"
