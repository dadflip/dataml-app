id: extract_redis
name: 'Extract: Redis Key/Values'
description: Scanne une DB Redis en mémoire et exporte les clés/valeurs.
category: 1. Extract
tags:
- extract
- redis
- cache
- kv
code_template: |
  import redis
  import json
  import os
  import time

  # [PARAM: REDIS_HOST | string]
  REDIS_HOST = "localhost"
  # [/PARAM]

  # [PARAM: MATCH_PATTERN | string]
  MATCH_PATTERN = "user:*"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/redis_dump.json"
  # [/PARAM]

  print(f"[EXTRACT] Scan Redis ({REDIS_HOST}) avec pattern '{MATCH_PATTERN}'...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      r = redis.Redis(host=REDIS_HOST, port=6379, db=0, decode_responses=True)
      
      data = {}
      for key in r.scan_iter(match=MATCH_PATTERN):
          data[key] = r.get(key)
          
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2)
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Redis. {len(data)} clés exportées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Serveur Redis inaccessible : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "redis", "path": DEST_PATH}
illustration_mermaid: |
    flowchart TD
    A([FILE_PATH]) --> B[Load EXTRACT_REDIS]
    B --> df([df])
    
    style A fill:#3b82f6,color:#fff
    style B fill:#10b981,color:#fff
    style df fill:#f59e0b,color:#fff


        subgraph Operations [Redis Scan & Extract]
            RedisClient[(redis.Redis)]
            Scan([r.scan_iter])
            Dict[[data: dict]]
            Save([json.dump])
            OutFile[(JSON File)]
        end

        subgraph Outputs [Contract Variables]
            df((df = None))
            target((target_name = None))
            task((task_type = 'unknown'))
            meta((meta: dict))
        end

        HOST --> RedisClient
        RedisClient --> Scan
        PATTERN --> Scan
        Scan -->|r.get| Dict
        Dict --> Save
        DEST --> OutFile
        Save --> OutFile
        OutFile -.-> meta

        style Config fill:#f8fafc,stroke:#cbd5e1,stroke-width:2px
        style RedisClient fill:#dc2626,stroke:#991b1b,stroke-width:2px,color:#fff
        style Scan fill:#f59e0b,stroke:#b45309,stroke-width:2px,color:#fff
        style Dict fill:#8b5cf6,stroke:#6d28d9,stroke-width:2px,color:#fff
        style Save fill:#3b82f6,stroke:#1d4ed8,stroke-width:2px,color:#fff
        style OutFile fill:#10b981,stroke:#047857,stroke-width:2px,color:#fff
        style Outputs fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px

