id: extract_redis
name: 'Extract: Redis Key/Values'
description: 'Scanne une base de données Redis en mémoire en utilisant un pattern de clés et exporte les paires clé/valeur au format JSON.'
when_to_use: 'Pratique pour faire un dump de données de cache, d''états de session ou de variables rapides stockées en mémoire.'
use_cases:
  - 'Extraction de logs ou de métriques en temps réel stockés temporairement.'
  - 'Sauvegarde de la base de cache pour analyse de l''utilisation.'
pros:
  - 'Lecture très rapide grâce au stockage en mémoire de Redis.'
  - 'Utilisation de scan_iter pour éviter de bloquer le serveur.'
cons:
  - 'Les données sont par nature volatiles ou non structurées.'
  - 'Peut générer un fichier JSON volumineux si beaucoup de clés correspondent.'
category: 1. Extract
tags:
- extract
- redis
- cache
- kv
code_template: |
  import redis
  import json
  import os
  import time

  # [PARAM: REDIS_HOST | string]
  REDIS_HOST = "localhost"
  # [/PARAM]

  # [PARAM: MATCH_PATTERN | string]
  MATCH_PATTERN = "user:*"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/redis_dump.json"
  # [/PARAM]

  print(f"[EXTRACT] Scan Redis ({REDIS_HOST}) avec pattern '{MATCH_PATTERN}'...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      r = redis.Redis(host=REDIS_HOST, port=6379, db=0, decode_responses=True)
      
      data = {}
      for key in r.scan_iter(match=MATCH_PATTERN):
          data[key] = r.get(key)
          
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          json.dump(data, f, indent=2)
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Redis. {len(data)} clés exportées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Serveur Redis inaccessible : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "redis", "path": DEST_PATH}
