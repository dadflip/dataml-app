id: load_fastq
name: 'Load: Séquençage FASTQ'
description: Charge un fichier FASTQ (Séquences ADN + Qualité) via Biopython.
category: 2. Load
tags:
- load
- fastq
- bioinformatics
- dna
code_template: "import time\nimport os\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/reads.fastq\"\n# [/PARAM]\n\nprint(f\"[LOAD] Parsing FASTQ : {FILE_PATH}...\"\
  )\nif not os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD]\
  \ Fichier FASTQ introuvable : {FILE_PATH}\")\n\ntry:\n    start_time = time.time()\n\
  \    from Bio import SeqIO\n    \n    # Lecture sous forme de générateur pour éviter\
  \ l'OOM sur les très gros fichiers\n    # Ici on charge en mémoire pour l'exemple\n\
  \    records = list(SeqIO.parse(FILE_PATH, \"fastq\"))\n    count = len(records)\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[LOAD] Succès FASTQ.\
  \ {count} reads chargés en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"\
  [ERREUR LOAD] Le module 'biopython' est requis.\")\n    raise\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR LOAD] Erreur de parsing FASTQ : {str(e)}\")\n    raise\
  \ e\n\ndf = None\ntarget_name = None\ntask_type = \"nlp_sequence\"\nmeta = {\"format\"\
  : \"fastq\", \"num_reads\": count}\n"
