id: "load_webdataset"
name: "Load: WebDataset (.tar streaming)"
description: "Charge de très gros datasets encapsulés dans des fichiers .tar de manière distribuée, selon le standard WebDataset de PyTorch."
when_to_use: "À utiliser pour la lecture en streaming de jeux de données massifs (images, textes, etc.) où le chargement en mémoire globale est impossible."
use_cases:
  - "Entraînement de modèles de Deep Learning sur des ensembles de données de plusieurs téraoctets."
  - "Traitement de grands corpus d'images (comme LAION-5B) ou de textes."
  - "Pipelines de données distribués et parallèles sous PyTorch."
pros:
  - "Extrêmement performant pour le streaming séquentiel de grandes quantités de données."
  - "Gère de multiples types de données (texte, image, binaire) de manière robuste."
  - "Évite de surcharger la RAM du système."
cons:
  - "Nécessite que les données soient préalablement formatées en archives tar WebDataset."
  - "La représentation sous forme de DataFrame n'est qu'un aperçu tronqué."
category: "2. Load"
tags: ["load", "webdataset", "pytorch", "streaming"]
code_template: |
  import pandas as pd
  import os
  import webdataset as wds

  # [PARAM: URL_OR_PATH | string]
  URL_OR_PATH = "./data/extracted/shards/{00000..00001}.tar"
  # [/PARAM]

  meta = {"source": "WEBDATASET", "path": URL_OR_PATH}
  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"

  try:
      # Initialize WebDataset stream
      dataset = wds.WebDataset(URL_OR_PATH)
      
      samples = []
      # Extract up to 1000 samples for the DataFrame representation
      max_samples = 1000
      
      for i, sample in enumerate(dataset):
          if i >= max_samples:
              break
              
          row = {}
          for key, value in sample.items():
              if key == '__key__':
                  row['key'] = value
              elif isinstance(value, (int, float, str, bytes)):
                  # Store scalar values and small strings
                  if isinstance(value, bytes) and len(value) < 1000:
                      try:
                          row[key] = value.decode('utf-8')
                      except:
                          row[key] = "<binary>"
                  elif not isinstance(value, bytes):
                      row[key] = value
              else:
                  # For complex types like tensors, arrays, or large images
                  # Store their type/shape summary instead of full data
                  if hasattr(value, 'shape'):
                      row[key] = f"{type(value).__name__}{value.shape}"
                  else:
                      row[key] = f"<{type(value).__name__}>"
                      
          samples.append(row)
          
      df = pd.DataFrame(samples)
      meta["num_samples_previewed"] = len(df)
      
      # Try to infer target and task
      if 'cls' in df.columns or 'label' in df.columns or 'class' in df.columns:
          target_candidates = [c for c in ['cls', 'label', 'class'] if c in df.columns]
          target_name = target_candidates[0]
          task_type = "classification"
          
  except ImportError:
      print("webdataset library is required but not installed.")
  except Exception as e:
      print(f"Error loading WebDataset from {URL_OR_PATH}: {e}")
output_variables:
  - df
  - target_name
  - task_type
  - meta
