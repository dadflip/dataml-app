id: "load_torchvision"
name: "Load: Torchvision Dataset"
description: "Charge un dataset canonique d'imagerie (ex: CIFAR10, MNIST, ImageNet) directement via le module torchvision."
when_to_use: "Pour démarrer rapidement un projet de vision par ordinateur en PyTorch ou évaluer un modèle sur des benchmarks académiques."
use_cases:
  - "Recherche et évaluation d'architectures de réseaux de neurones (CNN, Vision Transformers)."
  - "Transfer learning à partir de poids pré-entraînés sur des ensembles canoniques."
  - "Création de baselines pour des problèmes de classification d'images."
pros:
  - "Téléchargement, extraction et formatage automatiques."
  - "Parfaitement intégré avec l'écosystème PyTorch (DataLoader, transforms)."
  - "Accès immédiat à des datasets de référence très connus."
cons:
  - "Rigide : conçu pour des datasets très spécifiques et non pour des données personnalisées."
  - "La transformation vers un DataFrame Pandas (pour compatibilité) peut être lente ou inappropriée si le volume d'images est massif."
category: "2. Load"
tags: ["load", "torchvision", "pytorch", "images"]
code_template: |
  import pandas as pd
  import os
  import torchvision.datasets as datasets

  # [PARAM: DATASET_NAME | string]
  DATASET_NAME = "CIFAR10"
  # [/PARAM]

  meta = {"source": "TORCHVISION", "dataset": DATASET_NAME}

  df = pd.DataFrame()
  target_name = "target"
  task_type = "classification"

  try:
      # Dynamically get dataset class
      dataset_class = getattr(datasets, DATASET_NAME)
      
      # Initialize dataset (download=True)
      dataset = dataset_class(root='./data/torchvision', train=True, download=True)
      
      meta["num_samples"] = len(dataset)
      meta["classes"] = getattr(dataset, "classes", [])
      
      # Extract targets
      if hasattr(dataset, 'targets'):
          targets = dataset.targets
      else:
          # Fallback: iterate up to 1000 items if targets attribute is missing
          targets = [dataset[i][1] for i in range(min(1000, len(dataset)))]
          
      # Ensure targets are scalar values
      targets = [int(t) if hasattr(t, 'item') else t for t in targets]
          
      df = pd.DataFrame({
          "sample_index": range(len(targets)), 
          "target": targets
      })
      
  except AttributeError:
      print(f"Dataset {DATASET_NAME} not found in torchvision.datasets")
  except Exception as e:
      print(f"Error loading Torchvision dataset {DATASET_NAME}: {e}")
output_variables:
  - df
  - target_name
  - task_type
  - meta
