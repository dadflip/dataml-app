id: extract_rest
name: 'Extract: API REST (JSON)'
description: 'Effectue un appel HTTP GET vers une API REST publique ou privée et sauvegarde la réponse JSON localement.'
when_to_use: 'Recommandé pour récupérer des données fraîches, des métriques dynamiques ou des catalogues depuis des services web tiers.'
use_cases:
  - 'Récupération de données météorologiques ou financières en temps réel.'
  - 'Synchronisation avec des données d''un autre microservice.'
pros:
  - 'Extrêmement flexible et standard (support du format JSON et des requêtes HTTP).'
  - 'Facile à configurer pour la majorité des API modernes.'
cons:
  - 'Ne gère pas la pagination nativement dans ce template de base.'
  - 'Peut échouer à cause des limites de taux (rate limiting) de l''API.'
category: 1. Extract
tags:
- extract
- rest
- api
- json
code_template: |
  import requests
  import json
  import os
  import time

  # [PARAM: API_URL | string]
  API_URL = "https://jsonplaceholder.typicode.com/posts"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/rest_api.json"
  # [/PARAM]

  print(f"[EXTRACT] Appel GET vers {API_URL}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      response = requests.get(API_URL, timeout=30)
      response.raise_for_status()
      
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          json.dump(response.json(), f, indent=2)
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès API REST. Dump JSON sauvegardé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Erreur HTTP : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "rest", "path": DEST_PATH}
illustration_mermaid: |
    flowchart LR
        A[/"📄 API URL"/] --> B{"requests.get()"}
        C[/"🎯 TARGET_COL"/] --> D{"Check TARGET_COL"}
        B --> E(["📊 df (Dump JSON)"])
        E --> D
        D --> F(["🎯 target_name"])
        D --> G(["⚙️ task_type"])
        D --> H(["ℹ️ meta (source: rest)"])
        style A fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
        style C fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
        style B fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style D fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style E fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
        style F fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
        style G fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
