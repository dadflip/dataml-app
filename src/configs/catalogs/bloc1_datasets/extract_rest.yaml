id: extract_rest
name: 'Extract: API REST (JSON)'
description: Fait un appel GET à une API REST publique.
category: 1. Extract
tags:
- extract
- rest
- api
- json
code_template: "import requests\nimport json\nimport os\nimport time\n\n# [PARAM:\
  \ API_URL | string]\nAPI_URL = \"https://jsonplaceholder.typicode.com/posts\"\n\
  # [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/rest_api.json\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Appel GET vers {API_URL}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    response = requests.get(API_URL,\
  \ timeout=30)\n    response.raise_for_status()\n    \n    with open(DEST_PATH, \"\
  w\", encoding=\"utf-8\") as f:\n        json.dump(response.json(), f, indent=2)\n\
  \        \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès\
  \ API REST. Dump JSON sauvegardé en {duration:.2f}s.\")\nexcept Exception as e:\n\
  \    print(f\"[ERREUR EXTRACT] Erreur HTTP : {str(e)}\")\n    raise e\n\ndf = None\n\
  target_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"rest\", \"path\"\
  : DEST_PATH}\n"
