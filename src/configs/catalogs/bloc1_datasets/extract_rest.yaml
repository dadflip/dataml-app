id: extract_rest
name: 'Extract: API REST (JSON)'
description: Fait un appel GET à une API REST publique.
category: 1. Extract
tags:
- extract
- rest
- api
- json
code_template: |
  import requests
  import json
  import os
  import time

  # [PARAM: API_URL | string]
  API_URL = "https://jsonplaceholder.typicode.com/posts"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/rest_api.json"
  # [/PARAM]

  print(f"[EXTRACT] Appel GET vers {API_URL}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      response = requests.get(API_URL, timeout=30)
      response.raise_for_status()
      
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          json.dump(response.json(), f, indent=2)
          
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès API REST. Dump JSON sauvegardé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Erreur HTTP : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "rest", "path": DEST_PATH}
illustration_mermaid: |
    flowchart TD
    A([FILE_PATH]) --> B[Load EXTRACT_REST]
    B --> df([df])
    
    style A fill:#3b82f6,color:#fff
    style B fill:#10b981,color:#fff
    style df fill:#f59e0b,color:#fff


        subgraph Operations [REST API Extract]
            Req([requests.get])
            Check([response.raise_for_status])
            Json([response.json])
            Save([json.dump])
            OutFile[(JSON File)]
        end

        subgraph Outputs [Contract Variables]
            df((df = None))
            target((target_name = None))
            task((task_type = 'unknown'))
            meta((meta: dict))
        end

        URL --> Req
        Req --> Check
        Check --> Json
        Json --> Save
        DEST --> OutFile
        Save --> OutFile
        OutFile -.-> meta

        style Config fill:#f8fafc,stroke:#cbd5e1,stroke-width:2px
        style Req fill:#3b82f6,stroke:#1d4ed8,stroke-width:2px,color:#fff
        style Check fill:#10b981,stroke:#047857,stroke-width:2px,color:#fff
        style Json fill:#f59e0b,stroke:#b45309,stroke-width:2px,color:#fff
        style Save fill:#8b5cf6,stroke:#6d28d9,stroke-width:2px,color:#fff
        style OutFile fill:#14b8a6,stroke:#0f766e,stroke-width:2px,color:#fff
        style Outputs fill:#f1f5f9,stroke:#94a3b8,stroke-width:2px

