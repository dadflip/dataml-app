id: load_csv
name: 'Load: Fichier CSV'
description: "Charge un fichier de données tabulaires au format CSV (Comma-Separated Values) pour l'importer dans un DataFrame Pandas. Il s'agit du format de données le plus répandu en data science. Ce composant est conçu pour être robuste : il gère intelligemment les fichiers volumineux (en désactivant les alertes de typage mixte) et intègre un mécanisme de secours (fallback) pour tenter une lecture en encodage ISO-8859-1 si l'encodage standard UTF-8 échoue. Il déduit automatiquement la nature de la tâche (classification ou régression) selon le nombre de valeurs uniques de la cible."
when_to_use: "C'est le bloc d'ingestion de données par défaut. À utiliser pour la grande majorité des jeux de données tabulaires classiques, exports de tableurs, ou résultats de requêtes SQL fournis sous forme de texte plat délimité."
use_cases:
  - "Entraînement de modèles de Machine Learning classiques (Régression, Random Forest, XGBoost) sur des données d'entreprise."
  - "Analyse exploratoire de données (EDA) sur des exports Excel, bases de données relationnelles ou données publiques (Open Data)."
  - "Tâches de classification (ex: churn, score de crédit) ou de prédiction de séries temporelles."
pros:
  - "Universel et extrêmement facile à utiliser (lisible par un humain et compatible avec tous les outils)."
  - "Gestion d'erreur intelligente (bascule automatique sur un autre encodage en cas d'erreur UTF-8)."
  - "Déduction automatique et intelligente du type de tâche (classification vs régression) en fonction de la colonne cible."
cons:
  - "Lecture plus lente et fichiers plus lourds par rapport à des formats binaires comme Parquet ou Avro."
  - "Aucune garantie sur les types de données (risque de variables numériques lues comme des chaînes de caractères)."
  - "Peut saturer la mémoire vive (RAM) si le fichier CSV est plus volumineux que la mémoire disponible."
category: 2. Load
tags:
- load
- csv
- tabular
- pandas
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.csv"
  # [/PARAM]

  # [PARAM: SEP | string]
  SEP = ","
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Chargement du CSV depuis {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Le fichier {FILE_PATH} est introuvable.")

  try:
      start_time = time.time()
      # low_memory=False est robuste pour les gros CSV avec types mixtes
      df = pd.read_csv(FILE_PATH, sep=SEP, low_memory=False)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès CSV. {df.shape[0]} lignes, {df.shape[1]} colonnes chargées en {duration:.2f}s.")
  except UnicodeDecodeError:
      print("[LOAD] Erreur UTF-8. Tentative avec encodage ISO-8859-1...")
      df = pd.read_csv(FILE_PATH, sep=SEP, encoding='ISO-8859-1', low_memory=False)
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de lire le CSV : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "classification" if target_name and df[target_name].nunique() < 20 else "regression"
  meta = {"format": "csv", "separator": SEP, "shape": df.shape}

