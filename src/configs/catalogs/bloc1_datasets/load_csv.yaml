id: load_csv
name: 'Load: Fichier CSV'
description: Charge un fichier CSV plat dans un DataFrame Pandas avec détection d'encodage.
category: 2. Load
tags:
- load
- csv
- tabular
- pandas
code_template: "import pandas as pd\nimport time\nimport os\n\n# [PARAM: FILE_PATH\
  \ | file]\nFILE_PATH = \"./data/raw/data.csv\"\n# [/PARAM]\n\n# [PARAM: SEP | string]\n\
  SEP = \",\"\n# [/PARAM]\n\n# [PARAM: TARGET_COL | string]\nTARGET_COL = \"target\"\
  \n# [/PARAM]\n\nprint(f\"[LOAD] Chargement du CSV depuis {FILE_PATH}...\")\nif not\
  \ os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"[ERREUR LOAD] Le fichier\
  \ {FILE_PATH} est introuvable.\")\n\ntry:\n    start_time = time.time()\n    # low_memory=False\
  \ est robuste pour les gros CSV avec types mixtes\n    df = pd.read_csv(FILE_PATH,\
  \ sep=SEP, low_memory=False)\n    \n    duration = time.time() - start_time\n  \
  \  print(f\"[LOAD] Succès CSV. {df.shape[0]} lignes, {df.shape[1]} colonnes chargées\
  \ en {duration:.2f}s.\")\nexcept UnicodeDecodeError:\n    print(\"[LOAD] Erreur\
  \ UTF-8. Tentative avec encodage ISO-8859-1...\")\n    df = pd.read_csv(FILE_PATH,\
  \ sep=SEP, encoding='ISO-8859-1', low_memory=False)\nexcept Exception as e:\n  \
  \  print(f\"[ERREUR LOAD] Impossible de lire le CSV : {str(e)}\")\n    raise e\n\
  \ntarget_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else None\n\
  task_type = \"classification\" if target_name and df[target_name].nunique() < 20\
  \ else \"regression\"\nmeta = {\"format\": \"csv\", \"separator\": SEP, \"shape\"\
  : df.shape}\n"
