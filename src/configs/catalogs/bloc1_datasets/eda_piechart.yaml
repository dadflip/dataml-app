id: eda_piechart
name: 'EDA: Diagramme Circulaire'
description: Affiche les proportions en camembert pour une variable catégorielle.
category: 3. Exploratory Data Analysis
tags:
- eda
- piechart
- tabular
- matplotlib
code_template: "import matplotlib.pyplot as plt\n\nif 'target_name' in locals() and\
  \ target_name and target_name in df.columns:\n    counts = df[target_name].value_counts()\n\
  \    if len(counts) <= 10:\n        plt.figure(figsize=(8, 8))\n        plt.pie(counts,\
  \ labels=counts.index, autopct='%1.1f%%', startangle=140)\n        plt.title(f\"\
  Proportions de {target_name}\")\n        plt.show()\n    else:\n        print(\"\
  [EDA] Trop de catégories pour un camembert lisible.\")\nelse:\n    print(\"[EDA]\
  \ Cible introuvable.\")\n"
