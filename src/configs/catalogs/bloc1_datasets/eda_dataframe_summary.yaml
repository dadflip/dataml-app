id: eda_dataframe_summary
name: 'EDA: Résumé DataFrame'
description: Affiche les infos générales, statistiques descriptives et un aperçu du
  jeu de données.
category: 3. Exploratory Data Analysis
tags:
- eda
- summary
- tabular
- pandas
code_template: |
  import pandas as pd

  # [PARAM: HEAD_N | number]
  HEAD_N = 5
  # [/PARAM]

  print("[EDA] === INFORMATIONS GÉNÉRALES ===")
  df.info()

  print("\n[EDA] === STATISTIQUES DESCRIPTIVES ===")
  display(df.describe(include='all'))

  print("\n[EDA] === APERÇU (HEAD) ===")
  display(df.head(HEAD_N))
illustration_mermaid: |
    graph TD
      A([DataFrame df]) --> B{{Print df.info}}
      A --> C{{Display df.describe}}
      A --> D{{Display df.head}}
      B --> E([General Info])
      C --> F([Descriptive Statistics])
      D --> G([First HEAD_N rows])
      style A fill:#4F46E5,color:#fff
      style B fill:#10B981,color:#fff
      style C fill:#10B981,color:#fff
      style D fill:#10B981,color:#fff

