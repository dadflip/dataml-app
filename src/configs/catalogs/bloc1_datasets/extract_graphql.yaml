id: extract_graphql
name: 'Extract: API GraphQL'
description: Exécute une requête GraphQL et sauvegarde le résultat JSON.
category: 1. Extract
tags:
- extract
- graphql
- api
code_template: "import requests\nimport json\nimport os\nimport time\n\n# [PARAM:\
  \ ENDPOINT | string]\nENDPOINT = \"https://api.github.com/graphql\"\n# [/PARAM]\n\
  \n# [PARAM: QUERY | string]\nQUERY = '{\"query\": \"query { viewer { login } }\"\
  }'\n# [/PARAM]\n\n# [PARAM: TOKEN | string]\nTOKEN = \"YOUR_BEARER_TOKEN\"\n# [/PARAM]\n\
  \n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/graphql_resp.json\"\n\
  # [/PARAM]\n\nprint(f\"[EXTRACT] Exécution de la requête GraphQL vers {ENDPOINT}...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    headers = {\"Authorization\": f\"Bearer {TOKEN}\", \"Content-Type\"\
  : \"application/json\"}\n    \n    response = requests.post(ENDPOINT, headers=headers,\
  \ data=QUERY)\n    response.raise_for_status()\n    \n    with open(DEST_PATH, \"\
  w\", encoding=\"utf-8\") as f:\n        json.dump(response.json(), f, indent=2)\n\
  \        \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès\
  \ GraphQL. Fichier dumpé en {duration:.2f}s.\")\nexcept Exception as e:\n    print(f\"\
  [ERREUR EXTRACT] Erreur GraphQL : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name\
  \ = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"graphql\", \"path\": DEST_PATH}\n"
