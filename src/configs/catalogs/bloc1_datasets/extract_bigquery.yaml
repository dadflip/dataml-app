id: extract_bigquery
name: 'Extract: Google BigQuery'
description: Exécute une requête SQL massive sur GCP BigQuery.
category: 1. Extract
tags:
- extract
- gcp
- bigquery
- sql
code_template: "from google.cloud import bigquery\nimport os\nimport time\n\n# [PARAM:\
  \ PROJECT_ID | string]\nPROJECT_ID = \"my-gcp-project\"\n# [/PARAM]\n\n# [PARAM:\
  \ QUERY | string]\nQUERY = \"SELECT * FROM `bigquery-public-data.samples.github_timeline`\
  \ LIMIT 1000\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/bigquery_export.csv\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Requête BigQuery sur le projet {PROJECT_ID}...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    client = bigquery.Client(project=PROJECT_ID)\n    query_job\
  \ = client.query(QUERY)\n    df_temp = query_job.to_dataframe()\n    \n    df_temp.to_csv(DEST_PATH,\
  \ index=False)\n    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT]\
  \ Succès BigQuery. {df_temp.shape[0]} lignes extraites en {duration:.2f}s.\")\n\
  except Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec de la requête BigQuery\
  \ : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\
  \nmeta = {\"source\": \"bigquery\", \"path\": DEST_PATH}\n"
