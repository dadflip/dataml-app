id: eda_heatmap_features
name: 'EDA: Top Corrélations Target'
description: Affiche une heatmap ciblée sur les variables les plus corrélées à la variable cible continue, permettant d'identifier rapidement les prédicteurs potentiels les plus forts.
when_to_use: "Pour des tâches de régression, lorsqu'il est nécessaire de filtrer visuellement les variables numériques ayant la plus forte relation linéaire avec la cible."
use_cases:
  - "Sélection de caractéristiques (feature selection) par corrélation de Pearson."
  - "Détection précoce de multicolinéarité entre les variables explicatives sélectionnées."
pros:
  - "Met en évidence de manière très lisible le top K des variables les plus importantes."
  - "Évite l'encombrement visuel d'une heatmap classique contenant toutes les variables."
cons:
  - "Ne capture que les relations linéaires."
  - "Ne fonctionne pas pour les cibles catégorielles (classification) ou les variables non numériques."
category: 3. Exploratory Data Analysis
tags:
- eda
- correlation
- tabular
- regression
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns

  if 'target_name' in locals() and target_name and target_name in df.columns and pd.api.types.is_numeric_dtype(df[target_name]):
      num_df = df.select_dtypes(include=[np.number])
      corr = num_df.corr()
      
      # [PARAM: TOP_K | number]
      TOP_K = 10
      # [/PARAM]
      
      k = min(TOP_K, len(corr.columns))
      cols = corr.nlargest(k, target_name)[target_name].index
      cm = np.corrcoef(df[cols].dropna().values.T)
      
      plt.figure(figsize=(10, 8))
      sns.heatmap(cm, annot=True, square=True, fmt='.2f', annot_kws={'size': 10}, 
                  yticklabels=cols.values, xticklabels=cols.values, cmap='coolwarm')
      plt.title(f"Top {k} Variables corrélées à {target_name}")
      plt.show()
  else:
      print("[EDA] Requiert une cible (target_name) numérique.")
illustration_mermaid: |
    graph TD
      A[/DataFrame df/] --> B{Check numeric target}
      A2[/target_name/] --> B
      B --> C{Select numerical columns}
      C --> D{Compute Correlation Matrix}
      A3[/TOP_K/] --> E
      D --> E{Find TOP_K correlated features}
      E --> F{Compute sub-correlation matrix}
      F --> G{Plot sns.heatmap}
      G --> H([Display Heatmap fig])
      
      classDef input fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000;
      classDef process fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff;
      classDef outputPrimary fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff;
      classDef outputSecondary fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff;
      
      class A,A2,A3 input;
      class B,C,D,E,F,G process;
      class H outputPrimary;

