id: eda_heatmap_features
name: 'EDA: Top Corrélations Target'
description: Affiche une heatmap ciblée sur les variables les plus corrélées à la
  target continue.
category: 3. Exploratory Data Analysis
tags:
- eda
- correlation
- tabular
- regression
code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\n\nif 'target_name' in locals() and target_name\
  \ and target_name in df.columns and pd.api.types.is_numeric_dtype(df[target_name]):\n\
  \    num_df = df.select_dtypes(include=[np.number])\n    corr = num_df.corr()\n\
  \    \n    # [PARAM: TOP_K | number]\n    TOP_K = 10\n    # [/PARAM]\n    \n   \
  \ k = min(TOP_K, len(corr.columns))\n    cols = corr.nlargest(k, target_name)[target_name].index\n\
  \    cm = np.corrcoef(df[cols].dropna().values.T)\n    \n    plt.figure(figsize=(10,\
  \ 8))\n    sns.heatmap(cm, annot=True, square=True, fmt='.2f', annot_kws={'size':\
  \ 10}, \n                yticklabels=cols.values, xticklabels=cols.values, cmap='coolwarm')\n\
  \    plt.title(f\"Top {k} Variables corrélées à {target_name}\")\n    plt.show()\n\
  else:\n    print(\"[EDA] Requiert une cible (target_name) numérique.\")\n"
illustration_svg: <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg"><rect
