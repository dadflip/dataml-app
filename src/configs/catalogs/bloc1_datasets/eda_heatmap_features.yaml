  y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1"
  /><stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" /><stop offset="100%"
  style="stop-color:#991b1b;stop-opacity:1" /></linearGradient></defs><rect x="80"
  y="50" width="240" height="100" fill="url(#heat)" rx="4"/></svg>
