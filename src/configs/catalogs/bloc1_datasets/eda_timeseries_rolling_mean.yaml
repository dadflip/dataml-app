id: eda_timeseries_rolling_mean
name: 'EDA: Moyenne Mobile'
description: Lisse une série temporelle en superposant la moyenne et l'écart-type glissants pour mieux visualiser les tendances sous-jacentes.
when_to_use: À utiliser lorsque les données temporelles sont très bruitées et que vous souhaitez extraire la tendance de fond ou évaluer la volatilité locale.
use_cases:
  - Lissage des cours de bourse journaliers avec une moyenne mobile sur 30 jours (Moyenne Mobile Simple).
  - Évaluation de la volatilité d'une série via l'écart-type glissant.
  - Suppression des variations intra-hebdomadaires (ex: fenêtre de 7 jours) pour voir l'évolution mensuelle d'un trafic.
pros:
  - Réduit considérablement le bruit visuel dans les séries très volatiles.
  - Superpose la série brute et lissée pour une comparaison directe.
  - L'écart-type glissant offre un bon aperçu de la stabilité de la variance dans le temps (utile pour vérifier la stationnarité).
cons:
  - Induit un retard (lag) artificiel dans la courbe lissée, masquant la date exacte des retournements.
  - Les premières valeurs de la série lissée sont manquantes à cause de la fenêtre.
  - Le choix de la taille de la fenêtre (WINDOW) est arbitraire et change radicalement l'interprétation.
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- rolling
- pandas
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  
  # [PARAM: TIME_COL | string]
  TIME_COL = "date"
  # [/PARAM]
  
  # [PARAM: WINDOW | number]
  WINDOW = 12
  # [/PARAM]
  
  if TIME_COL in df.columns and 'target_name' in locals() and target_name:
      temp_df = df.dropna(subset=[TIME_COL, target_name]).sort_values(TIME_COL).set_index(TIME_COL)
      ts = temp_df[target_name]
      
      roll_mean = ts.rolling(window=WINDOW).mean()
      roll_std = ts.rolling(window=WINDOW).std()
      
      plt.figure(figsize=(14, 6))
      plt.plot(ts, color='blue', label='Original', alpha=0.5)
      plt.plot(roll_mean, color='red', label=f'Rolling Mean ({WINDOW})')
      plt.plot(roll_std, color='black', label=f'Rolling Std ({WINDOW})')
      plt.legend(loc='best')
      plt.title(f"Moyenne et Écart-type Glissants de {target_name}")
      plt.show()
  else:
      print("[EDA] Colonnes temporelles manquantes.")
