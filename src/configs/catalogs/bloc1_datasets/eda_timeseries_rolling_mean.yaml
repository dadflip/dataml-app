id: eda_timeseries_rolling_mean
name: 'EDA: Moyenne Mobile'
description: Lisse une série temporelle avec une moyenne et écart-type glissants.
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- rolling
- pandas
code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\n\n# [PARAM:\
  \ TIME_COL | string]\nTIME_COL = \"date\"\n# [/PARAM]\n\n# [PARAM: WINDOW | number]\n\
  WINDOW = 12\n# [/PARAM]\n\nif TIME_COL in df.columns and 'target_name' in locals()\
  \ and target_name:\n    temp_df = df.dropna(subset=[TIME_COL, target_name]).sort_values(TIME_COL).set_index(TIME_COL)\n\
  \    ts = temp_df[target_name]\n    \n    roll_mean = ts.rolling(window=WINDOW).mean()\n\
  \    roll_std = ts.rolling(window=WINDOW).std()\n    \n    plt.figure(figsize=(14,\
  \ 6))\n    plt.plot(ts, color='blue', label='Original', alpha=0.5)\n    plt.plot(roll_mean,\
  \ color='red', label=f'Rolling Mean ({WINDOW})')\n    plt.plot(roll_std, color='black',\
  \ label=f'Rolling Std ({WINDOW})')\n    plt.legend(loc='best')\n    plt.title(f\"\
  Moyenne et Écart-type Glissants de {target_name}\")\n    plt.show()\nelse:\n   \
  \ print(\"[EDA] Colonnes temporelles manquantes.\")\n"
