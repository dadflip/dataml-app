id: eda_missing_values
name: 'EDA: Valeurs Manquantes'
description: Calcule le pourcentage de valeurs manquantes par colonne et affiche une
  heatmap si possible.
category: 3. Exploratory Data Analysis
tags:
- eda
- missing
- tabular
- seaborn
code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\n\nmissing = df.isnull().sum()\nmissing_pct = (missing / len(df)) * 100\n\
  missing_df = pd.DataFrame({'Manquants': missing, 'Pourcentage': missing_pct}).sort_values('Pourcentage',\
  \ ascending=False)\nmissing_df = missing_df[missing_df['Manquants'] > 0]\n\nprint(\"\
  [EDA] === VALEURS MANQUANTES ===\")\nif len(missing_df) == 0:\n    print(\"Aucune\
  \ valeur manquante détectée ! \U0001F389\")\nelse:\n    display(missing_df)\n  \
  \  \n    # Heatmap\n    plt.figure(figsize=(10, 6))\n    sns.heatmap(df.isnull(),\
  \ cbar=False, cmap='viridis')\n    plt.title(\"Heatmap des Valeurs Manquantes\"\
  )\n    plt.show()\n"
