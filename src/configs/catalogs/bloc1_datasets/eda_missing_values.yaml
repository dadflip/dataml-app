id: eda_missing_values
name: 'EDA: Valeurs Manquantes'
description: Calcule le pourcentage de valeurs manquantes par colonne et génère une heatmap pour visualiser leur répartition temporelle ou structurelle.
when_to_use: À utiliser lors des premières étapes de nettoyage et d'exploration de données pour décider des stratégies d'imputation ou de suppression.
use_cases:
- "Évaluation globale de la qualité d'un jeu de données tabulaire"
- "Identification de variables à supprimer en raison d'un trop grand nombre de NaNs"
- "Détection de schémas de valeurs manquantes (ex: liées au temps ou à d'autres variables)"
pros:
- "Donne un résumé quantitatif (tableau) et qualitatif (heatmap)"
- "Visualisation claire des blocs de données manquantes (missingness patterns)"
- "Facilite la prise de décision pour l'imputation"
cons:
- "La heatmap peut être illisible sur des datasets contenant des centaines de milliers de lignes"
- "Ne détecte pas les valeurs aberrantes ou les valeurs par défaut (comme -999)"
category: 3. Exploratory Data Analysis
tags:
- eda
- missing
- tabular
- seaborn
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns

  missing = df.isnull().sum()
  missing_pct = (missing / len(df)) * 100
  missing_df = pd.DataFrame({'Manquants': missing, 'Pourcentage': missing_pct}).sort_values('Pourcentage', ascending=False)
  missing_df = missing_df[missing_df['Manquants'] > 0]

  print("[EDA] === VALEURS MANQUANTES ===")
  if len(missing_df) == 0:
      print("Aucune valeur manquante détectée ! 🎉")
  else:
      display(missing_df)
      
      # Heatmap
      plt.figure(figsize=(10, 6))
      sns.heatmap(df.isnull(), cbar=False, cmap='viridis')
      plt.title("Heatmap des Valeurs Manquantes")
      plt.show()
