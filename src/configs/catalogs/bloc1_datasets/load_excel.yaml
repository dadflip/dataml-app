id: load_excel
name: 'Load: Fichier Excel'
description: Charge une feuille de calcul spécifique depuis un fichier Excel (.xls,
  .xlsx).
category: 2. Load
tags:
- load
- excel
- spreadsheet
- pandas
code_template: "import pandas as pd\nimport time\nimport os\n\n# [PARAM: FILE_PATH\
  \ | file]\nFILE_PATH = \"./data/raw/data.xlsx\"\n# [/PARAM]\n\n# [PARAM: SHEET_NAME\
  \ | string]\nSHEET_NAME = \"Sheet1\"\n# [/PARAM]\n\n# [PARAM: TARGET_COL | string]\n\
  TARGET_COL = \"target\"\n# [/PARAM]\n\nprint(f\"[LOAD] Lecture de la feuille '{SHEET_NAME}'\
  \ depuis {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"\
  [ERREUR LOAD] Fichier Excel introuvable : {FILE_PATH}\")\n\ntry:\n    start_time\
  \ = time.time()\n    # openpyxl ou xlrd doit être installé selon l'extension\n \
  \   df = pd.read_excel(FILE_PATH, sheet_name=SHEET_NAME)\n    \n    duration = time.time()\
  \ - start_time\n    print(f\"[LOAD] Succès Excel. {df.shape[0]} lignes chargées\
  \ en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"[ERREUR LOAD] Modules\
  \ manquants. Essayez : pip install openpyxl xlrd\")\n    raise\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR LOAD] Erreur de lecture Excel : {str(e)}\")\n    raise\
  \ e\n\ntarget_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else\
  \ None\ntask_type = \"unknown\"\nmeta = {\"format\": \"excel\", \"sheet\": SHEET_NAME,\
  \ \"shape\": df.shape}\n"
