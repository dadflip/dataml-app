id: load_excel
name: 'Load: Fichier Excel'
description: >
  Charge les données tabulaires contenues dans une feuille de calcul spécifique d'un classeur Excel (.xls ou .xlsx) directement dans un DataFrame Pandas. 
  Ce bloc permet de cibler la feuille de données d'intérêt, et offre également la possibilité de définir une colonne cible (target) explicite. 
  Il gère l'extraction native du format propriétaire de Microsoft, rendant l'exploitation de jeux de données d'entreprise particulièrement rapide et intégrée.
when_to_use: >
  Indispensable lorsque vos sources de données proviennent d'échanges métier classiques, de rapports financiers ou d'extractions de logiciels de gestion où le tableur Excel demeure le format de distribution prédominant.
use_cases:
  - "Importation de bases de données clients consolidées manuellement par des équipes commerciales."
  - "Ingestion de rapports financiers mensuels pour des modèles de prédiction de revenus."
  - "Lecture de données de paramètres expérimentaux stockées dans différents onglets par des chercheurs."
pros:
  - "Prise en charge native du format d'échange de données le plus commun en entreprise."
  - "Possibilité de sélectionner précisément la feuille (sheet) pertinente parmi de multiples onglets."
  - "S'appuie sur la robustesse de 'pandas' et 'openpyxl'/'xlrd' pour gérer les complexités du format Excel."
cons:
  - "Le traitement des fichiers Excel est intrinsèquement beaucoup plus lent que celui de fichiers CSV."
  - "Peut échouer silencieusement ou de manière inattendue sur des fichiers très formatés (cellules fusionnées, macros, tableaux croisés dynamiques)."
category: 2. Load
tags:
- load
- excel
- spreadsheet
- pandas
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.xlsx"
  # [/PARAM]

  # [PARAM: SHEET_NAME | string]
  SHEET_NAME = "Sheet1"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "target"
  # [/PARAM]

  print(f"[LOAD] Lecture de la feuille '{SHEET_NAME}' depuis {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier Excel introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      # openpyxl ou xlrd doit être installé selon l'extension
      df = pd.read_excel(FILE_PATH, sheet_name=SHEET_NAME)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Excel. {df.shape[0]} lignes chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Modules manquants. Essayez : pip install openpyxl xlrd")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur de lecture Excel : {str(e)}")
      raise e

  target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
  task_type = "unknown"
  meta = {"format": "excel", "sheet": SHEET_NAME, "shape": df.shape}
