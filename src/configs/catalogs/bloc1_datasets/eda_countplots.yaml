id: eda_countplots
name: 'EDA: Fréquences Catégorielles'
description: Trace des diagrammes en barres pour la fréquence des modalités des variables
  qualitatives.
category: 3. Exploratory Data Analysis
tags:
- eda
- countplot
- tabular
- seaborn
code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\n\n# [PARAM: TOP_N | number]\nTOP_N = 10\n# [/PARAM]\n\ncols = df.select_dtypes(exclude=['number',\
  \ 'datetime']).columns.tolist()\nprint(f\"[EDA] === COUNTPLOTS ({len(cols)} variables)\
  \ ===\")\n\nif len(cols) > 20:\n    cols = cols[:20]\n    \nplt.figure(figsize=(15,\
  \ 4 * ((len(cols) + 1) // 2)))\nfor i, col in enumerate(cols):\n    plt.subplot(((len(cols)\
  \ + 1) // 2), 2, i + 1)\n    order = df[col].value_counts().iloc[:TOP_N].index\n\
  \    sns.countplot(data=df, y=col, order=order)\n    plt.title(f\"Fréquence de {col}\"\
  )\nplt.tight_layout()\nplt.show()\n"
