id: eda_countplots
name: 'EDA: Fréquences Catégorielles'
description: Trace des diagrammes en barres pour la fréquence des modalités des variables qualitatives. Permet de visualiser rapidement la distribution des classes.
when_to_use: "À utiliser lors de la phase d'exploration initiale pour analyser les distributions des variables catégorielles (ex: object, category, bool)."
use_cases:
  - "Détection de classes déséquilibrées (imbalanced data) dans les jeux de données tabulaires."
  - "Vérification des modalités rares ou inattendues."
pros:
  - "Très visuel et facile à interpréter."
  - "Gère automatiquement les variables avec de nombreuses modalités en limitant aux N plus fréquentes."
cons:
  - "Ne donne pas d'information sur la relation entre les variables."
  - "Peut être illisible si la variable contient trop de modalités uniques."
category: 3. Exploratory Data Analysis
tags:
- eda
- countplot
- tabular
- seaborn
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns

  # [PARAM: TOP_N | number]
  TOP_N = 10
  # [/PARAM]

  cols = df.select_dtypes(exclude=['number', 'datetime']).columns.tolist()
  print(f"[EDA] === COUNTPLOTS ({len(cols)} variables) ===")

  if len(cols) > 20:
      cols = cols[:20]
      
  plt.figure(figsize=(15, 4 * ((len(cols) + 1) // 2)))
  for i, col in enumerate(cols):
      plt.subplot(((len(cols) + 1) // 2), 2, i + 1)
      order = df[col].value_counts().iloc[:TOP_N].index
      sns.countplot(data=df, y=col, order=order)
      plt.title(f"Fréquence de {col}")
  plt.tight_layout()
  plt.show()
illustration_mermaid: |
    graph TD
      A[/DataFrame df/] --> B{Select categorical columns}
      A2[/TOP_N/] --> E
      B --> C{Truncate if > 20 columns}
      C --> D{Create Grid Subplots}
      D --> E{For each column}
      E --> F{Compute Top_N value_counts}
      F --> G{Plot sns.countplot}
      G --> E
      G --> H([Display All Countplots fig])
      
      classDef input fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000;
      classDef process fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff;
      classDef outputPrimary fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff;
      classDef outputSecondary fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff;
      
      class A,A2 input;
      class B,C,D,E,F,G process;
      class H outputPrimary;

