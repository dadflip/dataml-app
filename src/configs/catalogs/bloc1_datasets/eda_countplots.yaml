id: eda_countplots
name: 'EDA: Fréquences Catégorielles'
description: Trace des diagrammes en barres pour la fréquence des modalités des variables
  qualitatives.
category: 3. Exploratory Data Analysis
tags:
- eda
- countplot
- tabular
- seaborn
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  import seaborn as sns

  # [PARAM: TOP_N | number]
  TOP_N = 10
  # [/PARAM]

  cols = df.select_dtypes(exclude=['number', 'datetime']).columns.tolist()
  print(f"[EDA] === COUNTPLOTS ({len(cols)} variables) ===")

  if len(cols) > 20:
      cols = cols[:20]
      
  plt.figure(figsize=(15, 4 * ((len(cols) + 1) // 2)))
  for i, col in enumerate(cols):
      plt.subplot(((len(cols) + 1) // 2), 2, i + 1)
      order = df[col].value_counts().iloc[:TOP_N].index
      sns.countplot(data=df, y=col, order=order)
      plt.title(f"Fréquence de {col}")
  plt.tight_layout()
  plt.show()
illustration_mermaid: |
    graph TD
      A([DataFrame df]) --> B[Select categorical columns<br>exclude num/datetime]
      B --> C{Columns > 20?}
      C -- Yes --> D[Truncate to 20 columns]
      C -- No --> E[Keep all selected]
      D --> F[Create Grid Subplots]
      E --> F
      F --> G{For each column}
      G --> H[Compute Top_N value_counts]
      H --> I{{Plot sns.countplot}}
      I --> G
      G -- Done --> J([Display All Countplots])
      style A fill:#4F46E5,color:#fff
      style C fill:#F59E0B,color:#fff
      style I fill:#10B981,color:#fff

