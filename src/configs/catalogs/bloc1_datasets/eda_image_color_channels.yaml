code_template: "import matplotlib.pyplot as plt\nimport torch\nimport torchvision.transforms\
  \ as T\n\nif 'dataset' in locals() and len(dataset) > 0:\n    sample = dataset[0][0]\n\
  \    img = sample if isinstance(sample, torch.Tensor) else T.ToTensor()(sample)\n\
  \        \n    if img.shape[0] == 3:\n        fig, axes = plt.subplots(1, 4, figsize=(16,\
  \ 4))\n        \n        axes[0].imshow(img.permute(1,2,0).numpy())\n        axes[0].set_title(\"\
  Originale\")\n        axes[0].axis('off')\n        \n        cmaps = ['Reds', 'Greens',\
  \ 'Blues']\n        titles = ['Canal Rouge', 'Canal Vert', 'Canal Bleu']\n     \
  \   \n        for i in range(3):\n            axes[i+1].imshow(img[i].numpy(), cmap=cmaps[i])\n\
  \            axes[i+1].set_title(titles[i])\n            axes[i+1].axis('off')\n\
  \            \n        plt.tight_layout()\n        plt.show()\n    else:\n     \
  \   print(\"[EDA] L'image n'est pas RGB (3 canaux).\")\nelse:\n    print(\"[EDA]\
  \ Dataset non trouvé ou vide.\")\n"
