id: eda_image_color_channels
name: 'EDA: Canaux RGB Séparés'
description: Affiche séparément les canaux de couleurs (Rouge, Vert, Bleu) pour une image RGB donnée issue du jeu de données.
when_to_use: "Pour l'analyse de données visuelles (Computer Vision) afin de vérifier l'intensité de chaque canal et repérer d'éventuels biais de couleur."
use_cases:
  - "Vérification de la séparation correcte des couleurs lors du prétraitement (ex: ordre des canaux RGB vs BGR)."
  - "Détection de motifs spécifiques apparaissant dans un canal particulier."
pros:
  - "Fournit une compréhension approfondie de la composition des images."
  - "Convertit automatiquement les tenseurs PyTorch en formats affichables."
cons:
  - "Inutile pour des images en niveaux de gris (1 canal)."
  - "Se focalise uniquement sur le premier échantillon du dataset s'il n'est pas modifié."
category: 3. Exploratory Data Analysis
tags:
- eda
- images
- multimedia
- rgb
code_template: |
  import matplotlib.pyplot as plt
  import torch
  import torchvision.transforms as T

  if 'dataset' in locals() and len(dataset) > 0:
      sample = dataset[0][0]
      img = sample if isinstance(sample, torch.Tensor) else T.ToTensor()(sample)
          
      if img.shape[0] == 3:
          fig, axes = plt.subplots(1, 4, figsize=(16, 4))
          
          axes[0].imshow(img.permute(1,2,0).numpy())
          axes[0].set_title("Originale")
          axes[0].axis('off')
          
          cmaps = ['Reds', 'Greens', 'Blues']
          titles = ['Canal Rouge', 'Canal Vert', 'Canal Bleu']
          
          for i in range(3):
              axes[i+1].imshow(img[i].numpy(), cmap=cmaps[i])
              axes[i+1].set_title(titles[i])
              axes[i+1].axis('off')
              
          plt.tight_layout()
          plt.show()
      else:
          print("[EDA] L'image n'est pas RGB (3 canaux).")
  else:
      print("[EDA] Dataset non trouvé ou vide.")
