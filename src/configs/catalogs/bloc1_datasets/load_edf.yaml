id: load_edf
name: 'Load: Signaux EDF/EEG'
description: >
  Charge des données de signaux biomédicaux continus encodés dans le format standard EDF (European Data Format). 
  Il s'appuie sur la bibliothèque spécialisée 'mne' pour importer efficacement les signaux physiologiques multicanaux (comme les EEG, ECG, ou EMG) ainsi que leurs métadonnées temporelles. 
  Les données brutes sont ensuite converties en DataFrame tabulaire pour faciliter les opérations de traitement du signal classique ou d'apprentissage automatique.
when_to_use: >
  À privilégier absolument dès que vous traitez des séries temporelles biomédicales issues d'équipements médicaux (électroencéphalogrammes, polysomnographies, etc.) utilisant le standard ouvert EDF.
use_cases:
  - "Détection de crises d'épilepsie à partir de tracés EEG multicanaux."
  - "Classification de stades de sommeil à partir d'enregistrements polysomnographiques nocturnes."
  - "Filtrage, extraction de caractéristiques fréquentielles et analyse de signaux physiologiques (ECG, EMG)."
pros:
  - "Gère de manière transparente les spécificités du format biomédical standard EDF."
  - "S'intègre parfaitement avec l'écosystème 'mne-python' pour un traitement avancé en aval."
  - "Permet de manipuler des signaux complexes sous la forme simplifiée et familière d'un DataFrame pandas."
cons:
  - "Le chargement d'enregistrements longue durée à haute fréquence d'échantillonnage peut nécessiter beaucoup de mémoire."
  - "Oblige l'installation d'une dépendance lourde (mne) dédiée aux neurosciences."
category: 2. Load
tags:
- load
- edf
- eeg
- signal
code_template: |
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/patient_eeg.edf"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier EDF : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier EDF introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      import mne
      
      # Chargement en mémoire sans préchargement immédiat des données
      raw = mne.io.read_raw_edf(FILE_PATH, preload=True, verbose='ERROR')
      
      n_channels = len(raw.ch_names)
      n_times = raw.n_times
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès EDF. {n_channels} canaux, {n_times} points temporels chargés en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'mne' est requis (pip install mne).")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de parser l'EDF : {str(e)}")
      raise e

  df = raw.to_data_frame()
  target_name = ""
  task_type = "signal_processing"
  meta = {"format": "edf", "channels": n_channels, "time_points": n_times}
