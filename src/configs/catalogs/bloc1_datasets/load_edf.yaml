id: load_edf
name: 'Load: Signaux EDF/EEG'
description: 'Charge des données biomédicales temporelles (ex: Électroencéphalogramme)
  au format European Data Format.'
category: 2. Load
tags:
- load
- edf
- eeg
- signal
code_template: "import time\nimport os\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/patient_eeg.edf\"\n# [/PARAM]\n\nprint(f\"[LOAD] Lecture du fichier\
  \ EDF : {FILE_PATH}...\")\nif not os.path.exists(FILE_PATH):\n    raise FileNotFoundError(f\"\
  [ERREUR LOAD] Fichier EDF introuvable : {FILE_PATH}\")\n\ntry:\n    start_time =\
  \ time.time()\n    import mne\n    \n    # Chargement en mémoire sans préchargement\
  \ immédiat des données\n    raw = mne.io.read_raw_edf(FILE_PATH, preload=True, verbose='ERROR')\n\
  \    \n    n_channels = len(raw.ch_names)\n    n_times = raw.n_times\n    \n   \
  \ duration = time.time() - start_time\n    print(f\"[LOAD] Succès EDF. {n_channels}\
  \ canaux, {n_times} points temporels chargés en {duration:.2f}s.\")\nexcept ImportError:\n\
  \    print(\"[ERREUR LOAD] Le module 'mne' est requis (pip install mne).\")\n  \
  \  raise\nexcept Exception as e:\n    print(f\"[ERREUR LOAD] Impossible de parser\
  \ l'EDF : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type =\
  \ \"signal_processing\"\nmeta = {\"format\": \"edf\", \"channels\": n_channels,\
  \ \"time_points\": n_times}\n"
