id: "load_edf"
name: "Load: Signaux EDF/EEG"
description: "Charge des données biomédicales temporelles (ex: Électroencéphalogramme) au format European Data Format."
category: "2. Load"
tags: ["load", "edf", "eeg", "signal"]
code_template: |
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/patient_eeg.edf"
  # [/PARAM]

  print(f"[LOAD] Lecture du fichier EDF : {FILE_PATH}...")
  if not os.path.exists(FILE_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Fichier EDF introuvable : {FILE_PATH}")

  try:
      start_time = time.time()
      import mne
      
      # Chargement en mémoire sans préchargement immédiat des données
      raw = mne.io.read_raw_edf(FILE_PATH, preload=True, verbose='ERROR')
      
      n_channels = len(raw.ch_names)
      n_times = raw.n_times
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès EDF. {n_channels} canaux, {n_times} points temporels chargés en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'mne' est requis (pip install mne).")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Impossible de parser l'EDF : {str(e)}")
      raise e

  df = None
  target_name = None
  task_type = "signal_processing"
  meta = {"format": "edf", "channels": n_channels, "time_points": n_times}
_metadata:
  bloc: 1
  section: "2_load"
