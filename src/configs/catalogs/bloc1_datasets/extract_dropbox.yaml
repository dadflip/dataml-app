id: extract_dropbox
name: 'Extract: Dropbox API'
description: Télécharge un fichier depuis Dropbox via token OAuth.
category: 1. Extract
tags:
- extract
- dropbox
- api
code_template: "import dropbox\nimport os\nimport time\n\n# [PARAM: ACCESS_TOKEN |\
  \ string]\nACCESS_TOKEN = \"votre_token_dropbox\"\n# [/PARAM]\n\n# [PARAM: DBX_PATH\
  \ | string]\nDBX_PATH = \"/MonDossier/data.csv\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH\
  \ | string]\nDEST_PATH = \"./data/raw/dropbox_data.csv\"\n# [/PARAM]\n\nprint(f\"\
  [EXTRACT] Connexion à l'API Dropbox...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    dbx = dropbox.Dropbox(ACCESS_TOKEN)\n\
  \    metadata, res = dbx.files_download(DBX_PATH)\n    \n    with open(DEST_PATH,\
  \ 'wb') as f:\n        f.write(res.content)\n        \n    duration = time.time()\
  \ - start_time\n    print(f\"[EXTRACT] Succès Dropbox. Fichier téléchargé en {duration:.2f}s.\"\
  )\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT] Erreur d'API Dropbox :\
  \ {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\
  \nmeta = {\"source\": \"dropbox\", \"path\": DEST_PATH}\n"
