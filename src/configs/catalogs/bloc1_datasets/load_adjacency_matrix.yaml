id: load_adjacency_matrix
name: 'Load: Matrice d''Adjacence (CSV)'
description: "Charge un graphe défini par une matrice d'adjacence carrée stockée dans un fichier CSV, en s'appuyant sur la bibliothèque NetworkX. Ce bloc permet de transformer directement des données tabulaires décrivant des relations (une matrice N x N) en une structure de graphe exploitable par les modèles d'apprentissage automatique. Il construit automatiquement un DataFrame pour les caractéristiques des nœuds et extrait la liste des arêtes (edge_index) pour les intégrer dans les métadonnées (meta), rendant les données prêtes pour des algorithmes de Graph Neural Networks (GNN) ou des analyses topologiques."
when_to_use: "À utiliser lorsque vous disposez de données relationnelles ou de réseaux (réseaux sociaux, réseaux de transport, molécules) représentées sous la forme d'une matrice carrée où les lignes et colonnes correspondent aux nœuds, et les valeurs aux poids des arêtes."
use_cases:
  - "Modélisation de réseaux sociaux (connexions entre utilisateurs)."
  - "Optimisation de flux ou de logistique (distances entre villes ou hubs)."
  - "Analyse de graphes de connaissances et détection de communautés."
  - "Prédiction de liens manquants ou classification de nœuds (via GNN)."
pros:
  - "Intégration native avec NetworkX pour une manipulation aisée du graphe."
  - "Construction automatique des structures edge_index essentielles au Deep Learning sur graphes."
  - "Flexibilité pour attacher des caractéristiques (features) supplémentaires aux nœuds si un fichier annexe est fourni."
cons:
  - "Peu efficace en mémoire pour les très grands graphes clairsemés (sparse), car une matrice carrée pleine (dense) est chargée."
  - "Nécessite que la matrice soit parfaitement carrée et correctement formatée."
  - "Dépendance forte à NetworkX, qui peut être lent sur de très larges volumes de données."
category: 2. Load
tags:
- load
- graph
- adjacency
- matrix
- csv
- networkx
code_template: |
  import pandas as pd
  import numpy as np
  import time
  try:
      import networkx as nx
  except ImportError:
      nx = None
      print("[ERREUR LOAD] 'networkx' n'est pas installé.")

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/adjacency_matrix.csv"
  # [/PARAM]

  # [PARAM: NODE_FEATURES_PATH | string]
  NODE_FEATURES_PATH = ""
  # [/PARAM]

  print(f"[LOAD] Chargement de la matrice d'adjacence depuis {FILE_PATH}...")

  try:
      if nx is not None:
          start_time = time.time()
          
          adj_df = pd.read_csv(FILE_PATH, index_col=0)
          adj_matrix = adj_df.values
          
          G = nx.from_numpy_array(adj_matrix)
          
          if NODE_FEATURES_PATH and NODE_FEATURES_PATH.strip():
              df = pd.read_csv(NODE_FEATURES_PATH)
          else:
              df = pd.DataFrame({"node_id": list(range(G.number_of_nodes()))})
          
          node_list = list(G.nodes())
          node2idx = {n: i for i, n in enumerate(node_list)}
          src = [node2idx[u] for u, v in G.edges()]
          dst = [node2idx[v] for u, v in G.edges()]
          edge_index = np.array([src, dst], dtype=np.int64)
          
          duration = time.time() - start_time
          print(f"[LOAD] Succès Adjacence. {G.number_of_nodes()} noeuds, {G.number_of_edges()} arêtes en {duration:.2f}s.")
          
          target_name = ""
          task_type = "graph_unsupervised"
          meta = {"format": "adjacency_matrix", "shape": df.shape, "edge_index": edge_index, "node_list": node_list}
      else:
          df = pd.DataFrame()
          target_name = ""
          task_type = "unknown"
          meta = {}
  except Exception as e:
      print(f"[ERREUR LOAD] Échec du chargement de la matrice d'adjacence : {str(e)}")
      raise e

