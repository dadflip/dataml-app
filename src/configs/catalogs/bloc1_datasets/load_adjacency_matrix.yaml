id: load_adjacency_matrix
name: 'Load: Matrice d''Adjacence (CSV)'
description: Charge un graphe défini par une matrice d'adjacence carrée dans un fichier
  CSV. Construit le df des noeuds et l'edge_index dans meta.
category: 2. Load
tags:
- load
- graph
- adjacency
- matrix
- csv
- networkx
code_template: "import pandas as pd\nimport numpy as np\nimport time\ntry:\n    import\
  \ networkx as nx\nexcept ImportError:\n    nx = None\n    print(\"[ERREUR LOAD]\
  \ 'networkx' n'est pas installé.\")\n\n# [PARAM: FILE_PATH | file]\nFILE_PATH =\
  \ \"./data/raw/adjacency_matrix.csv\"\n# [/PARAM]\n\n# [PARAM: NODE_FEATURES_PATH\
  \ | string]\nNODE_FEATURES_PATH = \"\"\n# [/PARAM]\n\nprint(f\"[LOAD] Chargement\
  \ de la matrice d'adjacence depuis {FILE_PATH}...\")\n\ntry:\n    if nx is not None:\n\
  \        start_time = time.time()\n        \n        adj_df = pd.read_csv(FILE_PATH,\
  \ index_col=0)\n        adj_matrix = adj_df.values\n        \n        G = nx.from_numpy_array(adj_matrix)\n\
  \        \n        if NODE_FEATURES_PATH and NODE_FEATURES_PATH.strip():\n     \
  \       df = pd.read_csv(NODE_FEATURES_PATH)\n        else:\n            df = pd.DataFrame({\"\
  node_id\": list(range(G.number_of_nodes()))})\n        \n        node_list = list(G.nodes())\n\
  \        node2idx = {n: i for i, n in enumerate(node_list)}\n        src = [node2idx[u]\
  \ for u, v in G.edges()]\n        dst = [node2idx[v] for u, v in G.edges()]\n  \
  \      edge_index = np.array([src, dst], dtype=np.int64)\n        \n        duration\
  \ = time.time() - start_time\n        print(f\"[LOAD] Succès Adjacence. {G.number_of_nodes()}\
  \ noeuds, {G.number_of_edges()} arêtes en {duration:.2f}s.\")\n        \n      \
  \  target_name = None\n        task_type = \"graph_unsupervised\"\n        meta\
  \ = {\"format\": \"adjacency_matrix\", \"shape\": df.shape, \"edge_index\": edge_index,\
  \ \"node_list\": node_list}\n    else:\n        df = None\n        target_name =\
  \ None\n        task_type = \"unknown\"\n        meta = {}\nexcept Exception as\
  \ e:\n    print(f\"[ERREUR LOAD] Échec du chargement de la matrice d'adjacence :\
  \ {str(e)}\")\n    raise e\n"
