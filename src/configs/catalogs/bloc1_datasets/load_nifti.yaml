id: "load_nifti"
name: "Load: IRM 3D NIfTI (.nii)"
description: "Ce composant charge des images médicales volumétriques (3D ou 4D) stockées au format NIfTI (.nii). Il extrait les valeurs des voxels et affine les métadonnées associées à la matrice de transformation spatiale."
when_to_use: "Idéal pour les projets de computer vision appliqués au domaine médical, notamment l'imagerie par résonance magnétique (IRM) ou la tomographie."
use_cases:
  - "Segmentation automatique des tumeurs cérébrales sur des IRM."
  - "Classification des maladies neurodégénératives via l'imagerie 3D."
  - "Recalage d'images médicales entre plusieurs modalités ou patients."
pros:
  - "Permet de traiter facilement des données médicales standards grâce à `nibabel`."
  - "Préserve la matrice affine indispensable aux alignements spatiaux."
cons:
  - "L'aplatissement du volume d'une image 3D peut créer des DataFrames d'une taille colossale en mémoire."
  - "Perte des dépendances spatiales naturelles en convertissant en DataFrame plat (souvent mieux adapté aux tenseurs)."
category: "2. Load"
tags: ["load", "nifti", "medical", "3d"]
code_template: |
  import pandas as pd
  import numpy as np
  import os
  import nibabel as nib

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.nii"
  # [/PARAM]

  meta = {"source": "NIFTI", "path": FILE_PATH}

  if os.path.exists(FILE_PATH):
      try:
          # Load the NIfTI image
          img = nib.load(FILE_PATH)
          data = img.get_fdata()
          meta["shape"] = data.shape
          meta["affine"] = img.affine.tolist()
          
          # Flatten the volume into a DataFrame
          # Caution: Large NIfTI files might require large memory
          df = pd.DataFrame({"voxel_value": data.flatten()})
      except Exception as e:
          print(f"Error loading NIfTI file {FILE_PATH}: {e}")
          df = pd.DataFrame()
  else:
      print(f"File not found: {FILE_PATH}")
      df = pd.DataFrame()

  target_name = "voxel_value"
  task_type = "segmentation"
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
  flowchart LR
      A[/"📄 FILE_PATH"/] --> B{"nibabel.load & Flatten"}
      C[/"🎯 TARGET_COL"/] --> D{"Check TARGET_COL"}
      B --> E(["📊 df (DataFrame)"])
      E --> D
      D --> F(["🎯 target_name"])
      D --> G(["⚙️ task_type"])
      D --> H(["ℹ️ meta (...)"])
      style A fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
