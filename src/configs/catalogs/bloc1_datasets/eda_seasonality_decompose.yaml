id: eda_seasonality_decompose
name: 'EDA: Décomposition Saisonnière'
description: Décomposition Trend/Season/Resid d'une time series.
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- statsmodels
code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nfrom statsmodels.tsa.seasonal\
  \ import seasonal_decompose\n\n# [PARAM: TIME_COL | string]\nTIME_COL = \"date\"\
  \n# [/PARAM]\n\n# [PARAM: PERIOD | number]\nPERIOD = 12\n# [/PARAM]\n\nif TIME_COL\
  \ in df.columns and 'target_name' in locals() and target_name:\n    temp_df = df.copy()\n\
  \    temp_df[TIME_COL] = pd.to_datetime(temp_df[TIME_COL], errors='coerce')\n  \
  \  temp_df = temp_df.dropna(subset=[TIME_COL, target_name]).sort_values(TIME_COL).set_index(TIME_COL)\n\
  \    \n    print(f\"[EDA] Décomposition (période={PERIOD}) de {target_name}\")\n\
  \    result = seasonal_decompose(temp_df[target_name], model='additive', period=PERIOD)\n\
  \    result.plot()\n    plt.gcf().set_size_inches(12, 8)\n    plt.show()\nelse:\n\
  \    print(\"[EDA] Colonnes temporelles manquantes.\")\n"
