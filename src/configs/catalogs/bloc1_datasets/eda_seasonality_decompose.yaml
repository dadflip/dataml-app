id: eda_seasonality_decompose
name: 'EDA: Décomposition Saisonnière'
description: "Décomposition d'une série temporelle en tendance (trend), saisonnalité (season) et résidus (resid) via statsmodels."
when_to_use: "À utiliser lorsque vous travaillez avec des données temporelles (Time Series) et que vous souhaitez identifier des motifs saisonniers ou une tendance de fond."
use_cases:
  - "Analyse des ventes de produits au fil de l'année (pics saisonniers)."
  - "Détection de tendance de fond sur des relevés temporels."
pros:
  - "Visualisation claire des différentes composantes."
  - "Implémentation standard via statsmodels."
cons:
  - "Nécessite des données ordonnées temporellement et la définition d'une période."
category: 3. Exploratory Data Analysis
tags:
- eda
- timeseries
- statsmodels
code_template: |
  import pandas as pd
  import matplotlib.pyplot as plt
  from statsmodels.tsa.seasonal import seasonal_decompose
  
  # [PARAM: TIME_COL | string]
  TIME_COL = "date"
  # [/PARAM]
  
  # [PARAM: PERIOD | number]
  PERIOD = 12
  # [/PARAM]
  
  if TIME_COL in df.columns and 'target_name' in locals() and target_name:
      temp_df = df.copy()
      temp_df[TIME_COL] = pd.to_datetime(temp_df[TIME_COL], errors='coerce')
      temp_df = temp_df.dropna(subset=[TIME_COL, target_name]).sort_values(TIME_COL).set_index(TIME_COL)
      
      print(f"[EDA] Décomposition (période={PERIOD}) de {target_name}")
      result = seasonal_decompose(temp_df[target_name], model='additive', period=PERIOD)
      result.plot()
      plt.gcf().set_size_inches(12, 8)
      plt.show()
  else:
      print("[EDA] Colonnes temporelles manquantes.")
illustration_mermaid: |
    graph TD
      In1[/df/] --> P1{Check variables}
      In2[/TIME_COL/] --> P1
      In3[/target_name/] --> P1
      In4[/PERIOD/] --> P3
      P1 -- Valide --> P2{pd.to_datetime & sort}
      P2 --> P3{seasonal_decompose}
      P3 --> P4{plot}
      P4 --> Out1([Fig: Décomposition])
      P1 -- Invalide --> Out2([Print Erreur])
      
      style In1 fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
