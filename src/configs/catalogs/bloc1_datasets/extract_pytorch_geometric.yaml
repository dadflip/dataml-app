id: extract_pytorch_geometric
name: 'Extract: PyTorch Geometric (Graphs)'
description: 'Télécharge un dataset de graphes de référence (ex: Cora, CiteSeer, PubMed)
  vers le dossier local.'
category: 1. Extract
tags:
- extract
- graph
- pytorch-geometric
- gnn
code_template: "import os\nimport time\ntry:\n    from torch_geometric.datasets import\
  \ Planetoid\nexcept ImportError:\n    Planetoid = None\n    print(\"[ERREUR EXTRACT]\
  \ 'torch_geometric' n'est pas installé. Lancez : !pip install torch_geometric\"\
  )\n\n# [PARAM: DATASET_NAME | string]\nDATASET_NAME = \"Cora\"\n# [/PARAM]\n\n#\
  \ [PARAM: DEST_DIR | string]\nDEST_DIR = \"./data/raw/graphs\"\n# [/PARAM]\n\nprint(f\"\
  [EXTRACT] Téléchargement du Graphe '{DATASET_NAME}'...\")\nos.makedirs(DEST_DIR,\
  \ exist_ok=True)\n\ntry:\n    if Planetoid is not None:\n        start_time = time.time()\n\
  \        \n        # Planetoid télécharge automatiquement et met en cache dans le\
  \ dossier fourni\n        dataset = Planetoid(root=DEST_DIR, name=DATASET_NAME)\n\
  \        \n        duration = time.time() - start_time\n        print(f\"[EXTRACT]\
  \ Succès Graphe. {dataset.num_classes} classes trouvées. Sauvegardé dans {DEST_DIR}\
  \ en {duration:.2f}s.\")\n        \n        df = None\n        target_name = None\n\
  \        task_type = \"node_classification\"\n        meta = {\"source\": \"pytorch_geometric\"\
  , \"dataset_name\": DATASET_NAME, \"path\": DEST_DIR}\nexcept Exception as e:\n\
  \    print(f\"[ERREUR EXTRACT] Échec de l'extraction du graphe : {str(e)}\")\n \
  \   raise e\n"
illustration_mermaid: |
    graph LR
      Source[(Source)] -->|Load| Node([Extract Data])
      style Source fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style Node fill:#eff6ff,stroke:#3b82f6,stroke-width:2px

