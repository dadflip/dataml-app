id: load_dir_images_flat
name: 'Load: Dossier d''Images (Plat)'
description: 'Ce module implémente un "crawler" de répertoire conçu pour indexer rapidement des images stockées "à plat" (en vrac) dans un seul et unique dossier, sans notion de sous-dossiers par classe. Le script scanne le répertoire selon un modèle d''extension spécifié (par exemple *.jpg), extrait les chemins absolus et isole l''identifiant unique de chaque fichier (généralement son nom sans extension). Le DataFrame qui en résulte sert de base d''indexation robuste, prête à être fusionnée (join) avec un fichier de métadonnées séparé (comme un fichier CSV contenant des bounding boxes, des labels multiples ou d''autres annotations complexes).'
when_to_use: 'À privilégier lorsque vos images ne sont pas séparées en sous-dossiers de classes, mais plutôt regroupées dans un gros dossier, et que les informations d''annotation (étiquettes, coordonnées, masques) sont fournies dans un fichier de métadonnées (CSV ou JSON) externe.'
use_cases:
- 'Chargement de jeux de données pour la détection d''objets (Object Detection) où une image peut contenir plusieurs objets.'
- 'Segmentation d''images médicales ou satellitaires.'
- 'Classification multi-labels où une image appartient à plusieurs catégories simultanément.'
- 'Projets nécessitant de croiser des images avec des informations contextuelles riches (âge, genre, localisation).'
pros:
- 'Idéal pour les workflows avancés en Computer Vision dépassant la simple classification.'
- 'L''extraction intelligente de "file_id" facilite énormément la jointure (merge) avec les fichiers CSV de labels.'
- 'Flexibilité sur le filtrage des extensions via le paramètre de recherche.'
cons:
- 'Ne fournit pas de labels "out-of-the-box" : une étape de merge avec des données externes est obligatoire.'
- 'Peut devenir lent si le dossier contient des centaines de milliers de fichiers (limites des systèmes de fichiers).'
category: 2. Load
tags:
- load
- directory
- images
- crawler
code_template: |
  import os
  import glob
  import pandas as pd
  import time

  # [PARAM: DIRECTORY_PATH | dir]
  DIRECTORY_PATH = "./data/extracted/images"
  # [/PARAM]

  # [PARAM: EXTENSION | string]
  EXTENSION = "*.jpg"
  # [/PARAM]

  print(f"[LOAD] Parcours du dossier {DIRECTORY_PATH} à la recherche de {EXTENSION}...")
  if not os.path.exists(DIRECTORY_PATH):
      raise FileNotFoundError(f"[ERREUR LOAD] Le dossier n'existe pas : {DIRECTORY_PATH}")

  try:
      start_time = time.time()
      
      search_pattern = os.path.join(DIRECTORY_PATH, EXTENSION)
      # On cherche tous les fichiers qui matchent
      image_files = glob.glob(search_pattern)
      
      if not image_files:
          print(f"[ATTENTION] Aucune image trouvée avec le pattern {search_pattern}")
          
      # On extrait l'ID (ex: "image_0001") pour faciliter la jointure avec des labels
      data = []
      for filepath in image_files:
          filename = os.path.basename(filepath)
          file_id, ext = os.path.splitext(filename)
          data.append({
              "file_id": file_id,
              "filename": filename,
              "absolute_path": os.path.abspath(filepath)
          })
          
      df = pd.DataFrame(data)
      # Tri par ID pour assurer la consistance
      if not df.empty:
          df = df.sort_values(by="file_id").reset_index(drop=True)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Crawler. {len(df)} chemins d'images indexés en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur lors du parcours du dossier : {str(e)}")
      raise e

  target_name = ""
  task_type = "computer_vision"
  meta = {"format": "directory_flat", "images_found": len(df)}

