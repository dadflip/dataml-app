          Page([browser.new_page])
          Goto([page.goto networkidle])
          Content([page.content])
          Write([Write HTML])
          OutFile[(SPA HTML File)]
      end

      subgraph Outputs [Contract Variables]
          df((df = pd.DataFrame))
