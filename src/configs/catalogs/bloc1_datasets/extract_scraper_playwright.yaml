id: extract_scraper_playwright
name: 'Extract: Web Scraping (Playwright)'
description: Pilote Chromium via Playwright pour scrapper une SPA (React, Vue, Angular).
category: 1. Extract
tags:
- extract
- scraping
- playwright
- spa
code_template: "import asyncio\nfrom playwright.async_api import async_playwright\n\
  import os\nimport time\n\n# [PARAM: TARGET_URL | string]\nTARGET_URL = \"https://example.com/spa\"\
  \n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/scraped_spa.html\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Lancement de Playwright pour {TARGET_URL}...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\nasync def run_playwright():\n\
  \    async with async_playwright() as p:\n        browser = await p.chromium.launch(headless=True)\n\
  \        page = await browser.new_page()\n        # Attend que le reseau soit inactif\
  \ (fin des fetch() de la SPA)\n        await page.goto(TARGET_URL, wait_until='networkidle')\n\
  \        html = await page.content()\n        await browser.close()\n        return\
  \ html\n\ntry:\n    start_time = time.time()\n    html_content = asyncio.run(run_playwright())\n\
  \    \n    with open(DEST_PATH, \"w\", encoding=\"utf-8\") as f:\n        f.write(html_content)\n\
  \        \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès\
  \ Playwright. DOM SPA sauvegardé en {duration:.2f}s.\")\nexcept Exception as e:\n\
  \    print(f\"[ERREUR EXTRACT] Échec du scraping Playwright : {str(e)}\")\n    raise\
  \ e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\"\
  : \"scraping_playwright\", \"path\": DEST_PATH}\n"
