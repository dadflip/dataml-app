id: extract_mysql
name: 'Extract: Base MySQL/MariaDB'
description: Exécute une requête SQL via mysql-connector et exporte en CSV.
category: 1. Extract
tags:
- extract
- mysql
- sql
- db
code_template: "import mysql.connector\nimport pandas as pd\nimport os\nimport time\n\
  \n# [PARAM: DB_HOST | string]\nDB_HOST = \"localhost\"\n# [/PARAM]\n\n# [PARAM:\
  \ DB_USER | string]\nDB_USER = \"root\"\n# [/PARAM]\n\n# [PARAM: DB_PASS | string]\n\
  DB_PASS = \"password\"\n# [/PARAM]\n\n# [PARAM: DB_NAME | string]\nDB_NAME = \"\
  my_database\"\n# [/PARAM]\n\n# [PARAM: QUERY | string]\nQUERY = \"SELECT * FROM\
  \ users\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/mysql_export.csv\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Exécution de la requête sur MySQL ({DB_HOST})...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    conn = mysql.connector.connect(\n        host=DB_HOST,\n  \
  \      user=DB_USER,\n        password=DB_PASS,\n        database=DB_NAME\n    )\n\
  \    \n    df_temp = pd.read_sql_query(QUERY, conn)\n    df_temp.to_csv(DEST_PATH,\
  \ index=False)\n    conn.close()\n    \n    duration = time.time() - start_time\n\
  \    print(f\"[EXTRACT] Succès MySQL. Dump de {df_temp.shape[0]} lignes en {duration:.2f}s.\"\
  )\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec de la connexion ou\
  \ requête MySQL : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type\
  \ = \"unknown\"\nmeta = {\"source\": \"mysql\", \"path\": DEST_PATH}\n"
