code_template: "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn\
  \ as sns\n\n# [PARAM: TEXT_COL | string]\nTEXT_COL = \"text\"\n# [/PARAM]\n\nif\
  \ TEXT_COL in df.columns:\n    lengths = df[TEXT_COL].apply(lambda x: len(str(x).split()))\n\
  \    plt.figure(figsize=(10, 5))\n    sns.histplot(lengths, bins=50, kde=True)\n\
  \    plt.title(f\"Distribution de la longueur (mots) - {TEXT_COL}\")\n    plt.xlabel(\"\
  Nombre de mots\")\n    plt.show()\n    print(f\"[EDA] Longueur max : {lengths.max()},\
  \ Moyenne : {lengths.mean():.1f}\")\nelse:\n    print(f\"[EDA] Colonne {TEXT_COL}\
  \ introuvable.\")\n"
