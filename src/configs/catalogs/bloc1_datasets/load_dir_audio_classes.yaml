id: load_dir_audio_classes
name: 'Load: Dossier d''Audios par Classes'
description: 'Ce bloc de code permet de parcourir de manière automatisée et structurée un répertoire racine contenant des fichiers audios (.wav, .mp3, .flac, .ogg). Il est spécialement conçu pour les jeux de données audio organisés de façon hiérarchique, où chaque sous-dossier représente une classe ou une étiquette spécifique. Le script liste les répertoires, extrait les noms des classes correspondantes, scanne les fichiers audios valides et génère un DataFrame Pandas consolidant le chemin absolu de chaque fichier et sa classe associée, préparant ainsi directement les données pour des tâches d''apprentissage supervisé en traitement du signal.'
when_to_use: 'À utiliser lorsque vous disposez d''un ensemble de données audio brut organisé en dossiers par classe (par exemple, un dossier "chat" avec des miaulements, un dossier "chien" avec des aboiements) et que vous souhaitez charger ces chemins et labels dynamiquement sans créer de fichier d''annotation manuel.'
use_cases:
- 'Classification de sons environnementaux (ex: bruits de la rue, sons de la nature).'
- 'Reconnaissance de commandes vocales ou de mots-clés.'
- 'Détection d''anomalies sonores industrielles (machines défectueuses vs normales).'
- 'Classification de genres musicaux.'
pros:
- 'Extrêmement simple à mettre en place : la structure des dossiers fait office de labels.'
- 'Support natif des formats audios les plus courants (.wav, .mp3, .flac, .ogg).'
- 'Génère un format tabulaire (DataFrame) standardisé et directement exploitable par les modèles.'
cons:
- 'Ne charge pas le signal audio lui-même en mémoire (nécessite une étape de feature extraction ultérieure).'
- 'Rigide : une image ou un son ne peut appartenir qu''à une seule classe (pas de multi-label direct via les dossiers).'
category: 2. Load
tags:
- load
- directory
- audio
- classification
code_template: |
  import os
  import glob
  import pandas as pd
  import time

  # [PARAM: ROOT_DIRECTORY | dir]
  ROOT_DIRECTORY = "./data/extracted/audio_dataset"
  # [/PARAM]

  print(f"[LOAD] Parcours de la hiérarchie audio dans {ROOT_DIRECTORY}...")
  if not os.path.exists(ROOT_DIRECTORY):
      raise FileNotFoundError(f"[ERREUR LOAD] Le dossier racine n'existe pas : {ROOT_DIRECTORY}")

  try:
      start_time = time.time()
      
      data = []
      classes = [d for d in os.listdir(ROOT_DIRECTORY) if os.path.isdir(os.path.join(ROOT_DIRECTORY, d))]
      
      for class_name in classes:
          class_dir = os.path.join(ROOT_DIRECTORY, class_name)
          files = glob.glob(os.path.join(class_dir, "*.*"))
          valid_files = [f for f in files if f.lower().endswith(('.wav', '.mp3', '.flac', '.ogg'))]
          
          for filepath in valid_files:
              data.append({
                  "class_name": class_name,
                  "absolute_path": os.path.abspath(filepath)
              })
              
      df = pd.DataFrame(data)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès Audio. {len(df)} fichiers audios (dans {len(classes)} classes) indexés en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur lors du parcours du dossier audio : {str(e)}")
      raise e

  target_name = "class_name"
  task_type = "audio_classification"
  meta = {"format": "directory_audio_classes", "classes_found": len(classes), "audio_files_found": len(df)}

