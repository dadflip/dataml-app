id: "load_tfrecords"
name: "Load: TensorFlow Records"
description: "Charge un dataset stocké sous forme de fichiers .tfrecord (format sérialisé standard de TensorFlow)."
when_to_use: "Indispensable pour travailler efficacement avec l'écosystème TensorFlow, surtout sur des pipelines complexes, des données massives (images, audio) ou des TPU."
use_cases:
  - "Entraînement de réseaux de neurones profonds (Deep Learning) via TensorFlow/Keras."
  - "Chargement de grands ensembles de données qui ne tiennent pas entièrement en mémoire (streaming)."
  - "Utilisation de données fortement structurées (protobuffers) nécessitant une lecture rapide."
pros:
  - "Extrêmement rapide pour l'apprentissage grâce à l'intégration tf.data."
  - "Stockage sérialisé compact et efficace (Protobuf)."
  - "Permet le chargement en parallèle et le prefetching de manière native."
cons:
  - "Format difficile à inspecter ou à modifier manuellement sans outils spécifiques."
  - "Nécessite du code de parsing (tf.io.parse_single_example) souvent complexe."
category: "2. Load"
tags: ["load", "tfrecords", "tensorflow", "bigdata"]
code_template: |
  import pandas as pd
  import os
  import glob
  import tensorflow as tf

  # [PARAM: DIRECTORY_PATH | directory]
  DIRECTORY_PATH = "./data/extracted/tfrecords"
  # [/PARAM]

  meta = {"source": "TFRECORDS", "path": DIRECTORY_PATH}
  
  df = pd.DataFrame()
  target_name = "target"
  task_type = "unknown"

  if os.path.exists(DIRECTORY_PATH):
      # Gather all tfrecord files in the directory
      tfrecord_files = glob.glob(os.path.join(DIRECTORY_PATH, "*.tfrecord"))
      meta["num_files"] = len(tfrecord_files)
      
      try:
          if tfrecord_files:
              dataset = tf.data.TFRecordDataset(tfrecord_files)
              
              records = []
              # Parse a limited number of records (e.g. 1000) for DataFrame construction
              for raw_record in dataset.take(1000):
                  example = tf.train.Example()
                  example.ParseFromString(raw_record.numpy())
                  
                  feature_dict = {}
                  for key, feature in example.features.feature.items():
                      if feature.HasField('int64_list'):
                          feature_dict[key] = list(feature.int64_list.value)
                      elif feature.HasField('float_list'):
                          feature_dict[key] = list(feature.float_list.value)
                      elif feature.HasField('bytes_list'):
                          feature_dict[key] = [b.decode('utf-8', errors='ignore') for b in feature.bytes_list.value]
                          
                      if len(feature_dict[key]) == 1:
                          feature_dict[key] = feature_dict[key][0]
                  
                  records.append(feature_dict)
              
              df = pd.DataFrame(records)
              
              if not df.empty and 'label' in df.columns:
                  target_name = 'label'
                  task_type = 'classification'
      except Exception as e:
          print(f"Error parsing TFRecords in {DIRECTORY_PATH}: {e}")
  else:
      print(f"Directory not found: {DIRECTORY_PATH}")
output_variables:
  - df
  - target_name
  - task_type
  - meta
