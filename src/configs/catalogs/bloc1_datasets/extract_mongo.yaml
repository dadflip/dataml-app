id: extract_mongo
name: 'Extract: MongoDB'
description: Exporte le contenu d'une collection NoSQL MongoDB sous la forme d'un fichier JSON Lines.
when_to_use: À utiliser pour récupérer des données issues de bases orientées documents, fréquentes dans le web ou les microservices.
use_cases:
  - Analyse d'un catalogue de produits e-commerce.
  - Extraction de logs applicatifs stockés en NoSQL.
pros:
  - Simple à paramétrer et robuste.
  - Le format JSON Lines préserve la structure hiérarchique des documents.
cons:
  - Le dump complet peut être lent sur de très grosses collections.
  - Nécessite potentiellement de l'aplatissement (flattening) par la suite.
category: 1. Extract
tags:
- extract
- mongo
- nosql
- db
code_template: |
  from pymongo import MongoClient
  import json
  import os
  from bson import json_util
  import time

  # [PARAM: MONGO_URI | string]
  MONGO_URI = "mongodb://localhost:27017/"
  # [/PARAM]

  # [PARAM: DB_NAME | string]
  DB_NAME = "ml_database"
  # [/PARAM]

  # [PARAM: COLLECTION | string]
  COLLECTION = "logs"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/mongo_dump.jsonlines"
  # [/PARAM]

  print(f"[EXTRACT] Export de la collection MongoDB {DB_NAME}.{COLLECTION}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      client = MongoClient(MONGO_URI, serverSelectionTimeoutMS=5000)
      db = client[DB_NAME]
      col = db[COLLECTION]
      
      cursor = col.find({})
      count = 0
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          for doc in cursor:
              f.write(json_util.dumps(doc) + "\n")
              count += 1
              
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès MongoDB. {count} documents exportés en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec de la connexion MongoDB : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "mongodb", "path": DEST_PATH}
