id: extract_mongo
name: 'Extract: MongoDB'
description: Exporte une collection NoSQL MongoDB au format JSON Lines.
category: 1. Extract
tags:
- extract
- mongo
- nosql
- db
code_template: "from pymongo import MongoClient\nimport json\nimport os\nfrom bson\
  \ import json_util\nimport time\n\n# [PARAM: MONGO_URI | string]\nMONGO_URI = \"\
  mongodb://localhost:27017/\"\n# [/PARAM]\n\n# [PARAM: DB_NAME | string]\nDB_NAME\
  \ = \"ml_database\"\n# [/PARAM]\n\n# [PARAM: COLLECTION | string]\nCOLLECTION =\
  \ \"logs\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/mongo_dump.jsonlines\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Export de la collection MongoDB {DB_NAME}.{COLLECTION}...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    client = MongoClient(MONGO_URI, serverSelectionTimeoutMS=5000)\n\
  \    db = client[DB_NAME]\n    col = db[COLLECTION]\n    \n    cursor = col.find({})\n\
  \    count = 0\n    with open(DEST_PATH, \"w\", encoding=\"utf-8\") as f:\n    \
  \    for doc in cursor:\n            f.write(json_util.dumps(doc) + \"\\\\n\")\n\
  \            count += 1\n            \n    duration = time.time() - start_time\n\
  \    print(f\"[EXTRACT] Succès MongoDB. {count} documents exportés en {duration:.2f}s.\"\
  )\nexcept Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec de la connexion MongoDB\
  \ : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\
  \nmeta = {\"source\": \"mongodb\", \"path\": DEST_PATH}\n"
