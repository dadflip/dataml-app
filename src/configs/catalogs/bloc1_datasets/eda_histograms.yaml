id: eda_histograms
name: 'EDA: Histogrammes Numériques'
description: Trace la distribution (Histogramme + KDE) des variables numériques du
  dataset.
category: 3. Exploratory Data Analysis
tags:
- eda
- histogram
- tabular
- seaborn
code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\n\n# [PARAM: NUM_BINS | number]\nNUM_BINS = 30\n\
  # [/PARAM]\n\ncols = df.select_dtypes(include=[np.number]).columns.tolist()\nprint(f\"\
  [EDA] === HISTOGRAMMES ({len(cols)} variables) ===\")\n\n# Limiter à 20 pour éviter\
  \ de bloquer l'affichage\nif len(cols) > 20:\n    print(\"Trop de colonnes, affichage\
  \ limité aux 20 premières.\")\n    cols = cols[:20]\n    \nplt.figure(figsize=(15,\
  \ 4 * ((len(cols) + 2) // 3)))\nfor i, col in enumerate(cols):\n    plt.subplot(((len(cols)\
  \ + 2) // 3), 3, i + 1)\n    sns.histplot(df[col].dropna(), bins=NUM_BINS, kde=True)\n\
  \    plt.title(f\"Distribution de {col}\")\nplt.tight_layout()\nplt.show()\n"
