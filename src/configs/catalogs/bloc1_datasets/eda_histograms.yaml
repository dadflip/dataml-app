id: eda_histograms
name: 'EDA: Histogrammes Numériques'
description: Trace la distribution empirique (histogramme avec KDE) pour les variables numériques du dataset, afin d'observer la dispersion et la normalité.
when_to_use: "Lors de l'exploration initiale des données pour analyser la forme des distributions numériques."
use_cases:
  - "Vérification de la normalité des distributions (par ex. pour les modèles linéaires)."
  - "Détection de l'asymétrie (skewness) pour appliquer d'éventuelles transformations (log, box-cox)."
pros:
  - "Très parlant visuellement grâce à la superposition de l'histogramme et de la densité estimée (KDE)."
  - "Gestion automatique d'une grille pour visualiser de multiples variables simultanément."
cons:
  - "Peut être lent sur de gros jeux de données à cause du calcul de la densité KDE."
  - "L'estimation du nombre de bins idéal n'est pas toujours parfaite."
category: 3. Exploratory Data Analysis
tags:
- eda
- histogram
- tabular
- seaborn
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns

  # [PARAM: NUM_BINS | number]
  NUM_BINS = 30
  # [/PARAM]

  cols = df.select_dtypes(include=[np.number]).columns.tolist()
  print(f"[EDA] === HISTOGRAMMES ({len(cols)} variables) ===")

  # Limiter à 20 pour éviter de bloquer l'affichage
  if len(cols) > 20:
      print("Trop de colonnes, affichage limité aux 20 premières.")
      cols = cols[:20]
      
  plt.figure(figsize=(15, 4 * ((len(cols) + 2) // 3)))
  for i, col in enumerate(cols):
      plt.subplot(((len(cols) + 2) // 3), 3, i + 1)
      sns.histplot(df[col].dropna(), bins=NUM_BINS, kde=True)
      plt.title(f"Distribution de {col}")
  plt.tight_layout()
  plt.show()
illustration_mermaid: |
    graph TD
      A[/DataFrame df/] --> B{Select numerical columns}
      A2[/NUM_BINS/] --> G
      B --> C{Truncate if > 20 columns}
      C --> D{Create Grid Subplots}
      D --> E{For each column}
      E --> F{Drop NAs}
      F --> G{Plot sns.histplot with KDE}
      G --> E
      G --> H([Display Histograms fig])
      
