id: extract_github
name: 'Extract: GitHub Raw'
description: Télécharge un fichier brut depuis un dépôt GitHub public.
category: 1. Extract
tags:
- extract
- github
- raw
code_template: "import urllib.request\nimport os\nimport time\n\n# [PARAM: REPO |\
  \ string]\nREPO = \"mwaskom/seaborn-data\"\n# [/PARAM]\n\n# [PARAM: FILE_PATH_IN_REPO\
  \ | string]\nFILE_PATH_IN_REPO = \"iris.csv\"\n# [/PARAM]\n\n# [PARAM: BRANCH |\
  \ string]\nBRANCH = \"master\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH\
  \ = \"./data/raw/github_data.csv\"\n# [/PARAM]\n\nRAW_URL = f\"https://raw.githubusercontent.com/{REPO}/{BRANCH}/{FILE_PATH_IN_REPO}\"\
  \nprint(f\"[EXTRACT] Requête GitHub Raw : {RAW_URL}\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    urllib.request.urlretrieve(RAW_URL,\
  \ DEST_PATH)\n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès\
  \ GitHub. Fichier sauvegardé en {duration:.2f}s.\")\nexcept Exception as e:\n  \
  \  print(f\"[ERREUR EXTRACT] Echec du téléchargement (Dépôt privé ou lien invalide)\
  \ : {str(e)}\")\n    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\
  \nmeta = {\"source\": \"github\", \"path\": DEST_PATH}\n"
illustration_mermaid: |
    graph LR
      Source[(Source)] -->|Load| Node([Extract Data])
      style Source fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style Node fill:#eff6ff,stroke:#3b82f6,stroke-width:2px

