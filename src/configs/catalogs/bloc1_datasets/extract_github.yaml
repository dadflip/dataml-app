id: extract_github
name: 'Extract: GitHub Raw'
description: Télécharge un fichier brut depuis un dépôt GitHub public.
when_to_use: Idéal pour extraire des fichiers CSV, JSON ou TXT qui sont stockés directement dans un dépôt public GitHub sans nécessiter un clone complet.
use_cases:
  - Récupération de datasets de référence comme seaborn-data ou scikit-learn datasets.
  - Chargement de configurations ou dictionnaires depuis un dépôt distant.
pros:
  - Rapide et direct, évite de cloner tout un dépôt.
  - Très fiable pour les petits et moyens fichiers.
cons:
  - Restreint aux dépôts publics (sauf utilisation d'un token d'accès).
  - Limité par la taille des fichiers autorisée sur GitHub Raw et les quotas de l'API.
category: 1. Extract
tags:
- extract
- github
- raw
code_template: |
  import urllib.request
  import os
  import time

  # [PARAM: REPO | string]
  REPO = "mwaskom/seaborn-data"
  # [/PARAM]

  # [PARAM: FILE_PATH_IN_REPO | string]
  FILE_PATH_IN_REPO = "iris.csv"
  # [/PARAM]

  # [PARAM: BRANCH | string]
  BRANCH = "master"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/github_data.csv"
  # [/PARAM]

  RAW_URL = f"https://raw.githubusercontent.com/{REPO}/{BRANCH}/{FILE_PATH_IN_REPO}"
  print(f"[EXTRACT] Requête GitHub Raw : {RAW_URL}")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      urllib.request.urlretrieve(RAW_URL, DEST_PATH)
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès GitHub. Fichier sauvegardé en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Echec du téléchargement (Dépôt privé ou lien invalide) : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "github", "path": DEST_PATH}
