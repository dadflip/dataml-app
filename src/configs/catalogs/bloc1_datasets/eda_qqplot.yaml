id: eda_qqplot
name: 'EDA: QQ-Plot Normalité'
description: Vérifie graphiquement si les features numériques suivent une loi normale.
category: 3. Exploratory Data Analysis
tags:
- eda
- qqplot
- tabular
- scipy
code_template: "import numpy as np\nimport matplotlib.pyplot as plt\nimport scipy.stats\
  \ as stats\n\nnum_cols = df.select_dtypes(include=[np.number]).columns.tolist()[:4]\n\
  print(\"[EDA] === QQ-PLOTS (Test de normalité) ===\")\n\nplt.figure(figsize=(12,\
  \ 10))\nfor i, col in enumerate(num_cols):\n    plt.subplot(2, 2, i + 1)\n    stats.probplot(df[col].dropna(),\
  \ dist=\"norm\", plot=plt)\n    plt.title(f\"QQ-Plot : {col}\")\nplt.tight_layout()\n\
  plt.show()\n"
