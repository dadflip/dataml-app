id: eda_qqplot
name: 'EDA: QQ-Plot Normalité'
description: Vérifie graphiquement si les features numériques suivent une loi normale.
when_to_use: "Pour diagnostiquer la normalité des résidus ou des variables continues avant d'utiliser des modèles paramétriques."
use_cases:
  - "Validation de l'hypothèse de normalité pour la régression linéaire."
  - "Évaluation du besoin d'appliquer une transformation (ex: Box-Cox ou log)."
pros:
  - "Meilleur outil visuel pour repérer des queues de distribution épaisses."
  - "Simple à interpréter avec la droite de référence."
cons:
  - "Demande une interprétation humaine, contrairement à un test de Shapiro-Wilk."
  - "Sensible aux valeurs aberrantes (outliers)."
category: 3. Exploratory Data Analysis
tags:
- eda
- qqplot
- tabular
- scipy
code_template: |
  import numpy as np
  import matplotlib.pyplot as plt
  import scipy.stats as stats

  num_cols = df.select_dtypes(include=[np.number]).columns.tolist()[:4]
  print("[EDA] === QQ-PLOTS (Test de normalité) ===")

  plt.figure(figsize=(12, 10))
  for i, col in enumerate(num_cols):
      plt.subplot(2, 2, i + 1)
      stats.probplot(df[col].dropna(), dist="norm", plot=plt)
      plt.title(f"QQ-Plot : {col}")
  plt.tight_layout()
  plt.show()
