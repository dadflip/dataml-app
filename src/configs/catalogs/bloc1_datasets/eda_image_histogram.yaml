code_template: "import matplotlib.pyplot as plt\nimport numpy as np\nimport torch\n\
  import torchvision.transforms as T\n\nif 'dataset' in locals() and len(dataset)\
  \ > 0:\n    sample = dataset[0][0]\n    img = sample if isinstance(sample, torch.Tensor)\
  \ else T.ToTensor()(sample)\n        \n    colors = ('r', 'g', 'b') if img.shape[0]\
  \ == 3 else ('k',)\n    \n    plt.figure(figsize=(8, 5))\n    for i, color in enumerate(colors):\n\
  \        histogram, bin_edges = np.histogram(img[i].numpy(), bins=256, range=(0,\
  \ 1))\n        plt.plot(bin_edges[0:-1], histogram, color=color)\n        \n   \
  \ plt.title(\"Histogramme des intensités des pixels (RGB/Gray) - Première image\"\
  )\n    plt.xlabel(\"Intensité [0..1]\")\n    plt.ylabel(\"Nombre de pixels\")\n\
  \    plt.show()\nelse:\n    print(\"[EDA] Dataset non trouvé ou vide.\")\n"
