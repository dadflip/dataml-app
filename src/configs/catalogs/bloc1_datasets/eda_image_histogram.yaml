id: eda_image_histogram
name: 'EDA: Histogramme des Pixels'
description: Trace la distribution des intensités de pixels par canal (RGB).
category: 3. Exploratory Data Analysis
tags:
- eda
- images
- multimedia
- histogram
code_template: |
  import matplotlib.pyplot as plt
  import numpy as np
  import torch
  import torchvision.transforms as T

  if 'dataset' in locals() and len(dataset) > 0:
      sample = dataset[0][0]
      img = sample if isinstance(sample, torch.Tensor) else T.ToTensor()(sample)
          
      colors = ('r', 'g', 'b') if img.shape[0] == 3 else ('k',)
      
      plt.figure(figsize=(8, 5))
      for i, color in enumerate(colors):
          histogram, bin_edges = np.histogram(img[i].numpy(), bins=256, range=(0, 1))
          plt.plot(bin_edges[0:-1], histogram, color=color)
          
      plt.title("Histogramme des intensités des pixels (RGB/Gray) - Première image")
      plt.xlabel("Intensité [0..1]")
      plt.ylabel("Nombre de pixels")
      plt.show()
  else:
      print("[EDA] Dataset non trouvé ou vide.")
illustration_mermaid: |
    flowchart TD
        Dataset([Dataset]) --> Check{Dataset Valid?}
        Check -- Yes --> GetSample[Get First Image]
        GetSample --> EnsureTensor[Ensure Tensor Format]
        EnsureTensor --> CheckColor{RGB or Grayscale?}
        CheckColor -- RGB --> R[Red Channel] & G[Green Channel] & B[Blue Channel]
        CheckColor -- Gray --> K[Grayscale Channel]
        R & G & B & K --> CalcHist[Calculate np.histogram\n256 bins]
        CalcHist --> PlotHist{{Plot Histogram Lines}}
        Check -- No --> Error[/Print Error/]
    
        style Dataset fill:#0284c7,stroke:#0369a1,color:#fff
        style CheckColor fill:#eab308,stroke:#ca8a04,color:#fff
        style CalcHist fill:#8b5cf6,stroke:#7c3aed,color:#fff
        style PlotHist fill:#ec4899,stroke:#db2777,color:#fff

