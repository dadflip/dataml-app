id: eda_image_histogram
name: 'EDA: Histogramme des Pixels'
description: Trace la distribution des intensités de pixels par canal (RGB) ou en niveaux de gris.
when_to_use: À utiliser pour comprendre la distribution de la luminosité et des couleurs d'une image, et pour identifier des problèmes comme la sous-exposition, la surexposition ou le manque de contraste.
use_cases:
- "Analyse du contraste et de la luminosité des images"
- "Vérification de la normalisation des valeurs de pixels (ex: [0, 1] ou [0, 255])"
- "Détection de problèmes d'exposition (images trop sombres ou brûlées)"
pros:
- "Offre une vue statistique de la répartition des couleurs"
- "Aide à décider des techniques de prétraitement (ex: égalisation d'histogramme)"
- "Permet de vérifier rapidement la plage de valeurs des tenseurs d'image"
cons:
- "Analyse limitée à une seule image à la fois dans cette implémentation"
- "Ne donne pas d'information sur la structure spatiale de l'image"
category: 3. Exploratory Data Analysis
tags:
- eda
- images
- multimedia
- histogram
code_template: |
  import matplotlib.pyplot as plt
  import numpy as np
  import torch
  import torchvision.transforms as T

  if 'dataset' in locals() and len(dataset) > 0:
      sample = dataset[0][0]
      img = sample if isinstance(sample, torch.Tensor) else T.ToTensor()(sample)
          
      colors = ('r', 'g', 'b') if img.shape[0] == 3 else ('k',)
      
      plt.figure(figsize=(8, 5))
      for i, color in enumerate(colors):
          histogram, bin_edges = np.histogram(img[i].numpy(), bins=256, range=(0, 1))
          plt.plot(bin_edges[0:-1], histogram, color=color)
          
      plt.title("Histogramme des intensités des pixels (RGB/Gray) - Première image")
      plt.xlabel("Intensité [0..1]")
      plt.ylabel("Nombre de pixels")
      plt.show()
  else:
      print("[EDA] Dataset non trouvé ou vide.")
