id: extract_mqtt
name: 'Extract: Serveur MQTT (IoT)'
description: 'S''abonne à un topic MQTT (ex: capteurs IoT) et enregistre les trames
  localement.'
category: 1. Extract
tags:
- extract
- mqtt
- iot
code_template: "import paho.mqtt.client as mqtt\nimport os\nimport time\n\n# [PARAM:\
  \ BROKER | string]\nBROKER = \"test.mosquitto.org\"\n# [/PARAM]\n\n# [PARAM: TOPIC\
  \ | string]\nTOPIC = \"temperature/sensor1\"\n# [/PARAM]\n\n# [PARAM: DURATION_SEC\
  \ | string]\nDURATION_SEC = \"3\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\n\
  DEST_PATH = \"./data/raw/mqtt_dump.txt\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Abonnement\
  \ MQTT à {BROKER} sur {TOPIC}...\")\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\
  \nmessages = []\ndef on_message(client, userdata, msg):\n    messages.append(msg.payload.decode('utf-8'))\n\
  \ntry:\n    client = mqtt.Client()\n    client.on_message = on_message\n    client.connect(BROKER)\n\
  \    client.subscribe(TOPIC)\n    \n    client.loop_start()\n    time.sleep(int(DURATION_SEC))\n\
  \    client.loop_stop()\n    \n    with open(DEST_PATH, \"w\", encoding=\"utf-8\"\
  ) as f:\n        for m in messages:\n            f.write(m + \"\\\\n\")\n      \
  \      \n    print(f\"[EXTRACT] Succès MQTT. {len(messages)} trames captées.\")\n\
  except Exception as e:\n    print(f\"[ERREUR EXTRACT] Échec MQTT : {str(e)}\")\n\
  \    raise e\n\ndf = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"\
  source\": \"mqtt\", \"path\": DEST_PATH}\n"
