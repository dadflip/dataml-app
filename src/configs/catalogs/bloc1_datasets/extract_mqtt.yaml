id: "extract_mqtt"
name: "Extract: Serveur MQTT (IoT)"
description: "S'abonne à un topic MQTT (ex: capteurs IoT) et enregistre les trames localement."
category: "1. Extract"
tags: ["extract", "mqtt", "iot"]
code_template: |
  import paho.mqtt.client as mqtt
  import os
  import time

  # [PARAM: BROKER | string]
  BROKER = "test.mosquitto.org"
  # [/PARAM]
  
  # [PARAM: TOPIC | string]
  TOPIC = "temperature/sensor1"
  # [/PARAM]
  
  # [PARAM: DURATION_SEC | string]
  DURATION_SEC = "3"
  # [/PARAM]
  
  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/mqtt_dump.txt"
  # [/PARAM]

  print(f"[EXTRACT] Abonnement MQTT à {BROKER} sur {TOPIC}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  messages = []
  def on_message(client, userdata, msg):
      messages.append(msg.payload.decode('utf-8'))

  try:
      client = mqtt.Client()
      client.on_message = on_message
      client.connect(BROKER)
      client.subscribe(TOPIC)
      
      client.loop_start()
      time.sleep(int(DURATION_SEC))
      client.loop_stop()
      
      with open(DEST_PATH, "w", encoding="utf-8") as f:
          for m in messages:
              f.write(m + "\\n")
              
      print(f"[EXTRACT] Succès MQTT. {len(messages)} trames captées.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec MQTT : {str(e)}")
      raise e

  df = None
  target_name = None
  task_type = "unknown"
  meta = {"source": "mqtt", "path": DEST_PATH}
_metadata:
  bloc: 1
  section: "1_extract"
