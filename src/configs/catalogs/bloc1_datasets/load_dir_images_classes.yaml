id: load_dir_images_classes
name: 'Load: Dossier d''Images par Classes'
description: 'Ce bloc de code effectue le parcours automatisé d''une hiérarchie de dossiers d''images, structurée selon le format standard de classification (type ImageNet). Dans ce paradigme, le répertoire racine contient des sous-dossiers dont les noms définissent les étiquettes (labels) des classes. Le script inspecte ces dossiers, identifie les images valides (aux formats courants tels que PNG, JPG, JPEG) et construit un DataFrame indexant le chemin absolu de chaque image et sa classe correspondante. Ce format tabulaire intermédiaire constitue le point d''entrée idéal pour les flux de Deep Learning en vision par ordinateur.'
when_to_use: 'À utiliser pour charger des datasets d''images organisés physiquement sur le disque par catégories (comme le dataset Dogs vs Cats ou ImageNet) pour des projets de classification d''images supervisée.'
use_cases:
- 'Classification d''images médicales (ex: dossiers "sain" et "pathologique").'
- 'Reconnaissance de défauts de fabrication (ex: dossiers "conforme" et "rebus").'
- 'Reconnaissance faciale ou identification d''individus structurée par nom de personne.'
- 'Entraînement de réseaux de neurones convolutifs (CNN) pour le tri automatique de photos.'
pros:
- 'Adopte le format de stockage le plus universel et intuitif pour la classification d''images.'
- 'S''intègre parfaitement avec les générateurs d''images des bibliothèques Deep Learning (comme flow_from_dataframe de Keras ou Datasets de PyTorch).'
- 'Traitement très rapide car seules les métadonnées (chemins et labels) sont chargées, pas les pixels des images.'
cons:
- 'Limité aux problèmes de classification mutuellement exclusive (une image = un label).'
- 'Nécessite que les images soient extraites sur le disque dur local.'
category: 2. Load
tags:
- load
- directory
- images
- classification
code_template: |
  import os
  import glob
  import pandas as pd
  import time

  # [PARAM: ROOT_DIRECTORY | dir]
  ROOT_DIRECTORY = "./data/extracted/dataset"
  # [/PARAM]

  print(f"[LOAD] Parcours de la hiérarchie de classes dans {ROOT_DIRECTORY}...")
  if not os.path.exists(ROOT_DIRECTORY):
      raise FileNotFoundError(f"[ERREUR LOAD] Le dossier racine n'existe pas : {ROOT_DIRECTORY}")

  try:
      start_time = time.time()
      
      data = []
      classes = [d for d in os.listdir(ROOT_DIRECTORY) if os.path.isdir(os.path.join(ROOT_DIRECTORY, d))]
      
      for class_name in classes:
          class_dir = os.path.join(ROOT_DIRECTORY, class_name)
          # Récupère tous les fichiers classiques (png, jpg, jpeg)
          files = glob.glob(os.path.join(class_dir, "*.*"))
          valid_files = [f for f in files if f.lower().endswith(('.png', '.jpg', '.jpeg'))]
          
          for filepath in valid_files:
              data.append({
                  "class_name": class_name,
                  "absolute_path": os.path.abspath(filepath)
              })
              
      df = pd.DataFrame(data)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès. {len(df)} images réparties dans {len(classes)} classes indexées en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur lors du parcours du dataset : {str(e)}")
      raise e

  target_name = "class_name"
  task_type = "computer_vision_classification"
  meta = {"format": "directory_classes", "classes_found": len(classes), "images_found": len(df)}

