code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\n\ncols = df.select_dtypes(include=[np.number]).columns.tolist()[:5]\n\
  hue_col = target_name if 'target_name' in locals() and target_name in df.columns\
  \ else None\n\nif hue_col and hue_col not in cols:\n    cols.append(hue_col)\n \
  \   \nprint(f\"[EDA] === PAIRPLOT sur {len(cols)} variables ===\")\nsns.pairplot(df[cols].dropna(),\
  \ hue=hue_col, corner=True)\nplt.show()\n"
