id: eda_pairplot
name: 'EDA: Pairplot'
description: Trace les relations bivariées entre les premières variables numériques.
when_to_use: "À utiliser pour identifier visuellement les corrélations et séparations de classes entre plusieurs variables continues."
use_cases:
  - "Recherche de variables redondantes (fortement corrélées)."
  - "Détection de clusters naturels et de séparabilité des données."
pros:
  - "Vision matricielle très dense et riche en informations."
  - "Affiche à la fois les distributions (diagonale) et les relations croisées."
cons:
  - "Extrêmement lent et illisible s'il y a trop de colonnes ou de lignes."
  - "Ignorera les variables catégorielles non encodées."
category: 3. Exploratory Data Analysis
tags:
- eda
- pairplot
- tabular
- seaborn
code_template: |
  import pandas as pd
  import numpy as np
  import matplotlib.pyplot as plt
  import seaborn as sns

  cols = df.select_dtypes(include=[np.number]).columns.tolist()[:5]
  hue_col = target_name if 'target_name' in locals() and target_name in df.columns else None

  if hue_col and hue_col not in cols:
      cols.append(hue_col)
      
  print(f"[EDA] === PAIRPLOT sur {len(cols)} variables ===")
  sns.pairplot(df[cols].dropna(), hue=hue_col, corner=True)
  plt.show()
illustration_mermaid: |
    flowchart TD
        InDF[/df/]
        InParams[/target_name, cols/]
        ProcSelect{select_dtypes}
        ProcDrop{dropna}
        ProcPlot{sns.pairplot}
        OutFig([fig])
        OutGrid([PairGrid])

        InDF --> ProcSelect
        ProcSelect --> ProcDrop
        ProcDrop --> ProcPlot
        InParams --> ProcPlot
        ProcPlot --> OutFig
        ProcPlot --> OutGrid

        style InDF fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
        style InParams fill:#fbbf24,stroke:#d97706,stroke-width:2px,color:#000
        style ProcSelect fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style ProcDrop fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style ProcPlot fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
        style OutFig fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
        style OutGrid fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

