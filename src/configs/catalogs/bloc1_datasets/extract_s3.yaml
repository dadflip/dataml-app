id: extract_s3
name: 'Extract: AWS S3'
description: Télécharge un fichier ou objet depuis un bucket Amazon S3 de manière sécurisée (requiert boto3).
when_to_use: Lorsque vos données sources sont hébergées sur le service de stockage objet Amazon S3.
use_cases:
  - Récupération d'un fichier Parquet ou CSV depuis un Data Lake AWS.
  - Automatisation de l'ingestion de données cloud vers un environnement local.
pros:
  - Intégration robuste et standard avec l'écosystème AWS.
  - Gestion efficace des fichiers de grande taille.
cons:
  - Nécessite la configuration préalable des accès AWS (credentials).
  - Dépendance externe à la bibliothèque boto3.
category: 1. Extract
tags:
- extract
- s3
- aws
- cloud
code_template: |
  import boto3
  from botocore.exceptions import NoCredentialsError, ClientError
  import os
  import time

  # [PARAM: BUCKET_NAME | string]
  BUCKET_NAME = "my-aws-bucket"
  # [/PARAM]

  # [PARAM: FILE_KEY | string]
  FILE_KEY = "datasets/data.parquet"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/data.parquet"
  # [/PARAM]

  print(f"[EXTRACT] Téléchargement depuis s3://{BUCKET_NAME}/{FILE_KEY}...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      s3 = boto3.client('s3')
      s3.download_file(BUCKET_NAME, FILE_KEY, DEST_PATH)
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès AWS S3. Fichier rapatrié en {duration:.2f}s.")
  except NoCredentialsError:
      print("[ERREUR EXTRACT] Credentials AWS introuvables (~/.aws/credentials).")
      raise
  except ClientError as e:
      print(f"[ERREUR EXTRACT] Erreur de client S3 : {e}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "s3", "path": DEST_PATH}
