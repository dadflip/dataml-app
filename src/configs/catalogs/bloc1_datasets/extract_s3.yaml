id: extract_s3
name: 'Extract: AWS S3'
description: Télécharge un objet depuis un bucket Amazon S3 (requiert boto3).
category: 1. Extract
tags:
- extract
- s3
- aws
- cloud
code_template: "import boto3\nfrom botocore.exceptions import NoCredentialsError,\
  \ ClientError\nimport os\nimport time\n\n# [PARAM: BUCKET_NAME | string]\nBUCKET_NAME\
  \ = \"my-aws-bucket\"\n# [/PARAM]\n\n# [PARAM: FILE_KEY | string]\nFILE_KEY = \"\
  datasets/data.parquet\"\n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH\
  \ = \"./data/raw/data.parquet\"\n# [/PARAM]\n\nprint(f\"[EXTRACT] Téléchargement\
  \ depuis s3://{BUCKET_NAME}/{FILE_KEY}...\")\nos.makedirs(os.path.dirname(DEST_PATH),\
  \ exist_ok=True)\n\ntry:\n    start_time = time.time()\n    s3 = boto3.client('s3')\n\
  \    s3.download_file(BUCKET_NAME, FILE_KEY, DEST_PATH)\n    \n    duration = time.time()\
  \ - start_time\n    print(f\"[EXTRACT] Succès AWS S3. Fichier rapatrié en {duration:.2f}s.\"\
  )\nexcept NoCredentialsError:\n    print(\"[ERREUR EXTRACT] Credentials AWS introuvables\
  \ (~/.aws/credentials).\")\n    raise\nexcept ClientError as e:\n    print(f\"[ERREUR\
  \ EXTRACT] Erreur de client S3 : {e}\")\n    raise e\n\ndf = None\ntarget_name =\
  \ None\ntask_type = \"unknown\"\nmeta = {\"source\": \"s3\", \"path\": DEST_PATH}\n"
