id: "load_pickle"
name: "Load: Python Pickle (.pkl)"
description: "Désérialise un objet Python binaire natif (ex: DataFrame, Modèle, Dictionnaire)."
category: "2. Load"
tags: ["load", "pickle", "python", "binary"]
code_template: |
  import pandas as pd
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.pickle"
  # [/PARAM]

  df = pd.read_pickle(FILE_PATH) if os.path.exists(FILE_PATH) else pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "PICKLE", "path": FILE_PATH}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
    A([FILE_PATH]) --> B[Load PICKLE]
    B --> df([df])
    
    style A fill:#3b82f6,color:#fff
    style B fill:#10b981,color:#fff
    style df fill:#f59e0b,color:#fff


_metadata:
  bloc: 1
  section: "2_load"
