id: load_huggingface_local
name: 'Load: HuggingFace (from Disk)'
description: "Charge un dataset HuggingFace précédemment extrait sur le disque local en DataFrame Pandas."
when_to_use: "Lorsque vous avez téléchargé un jeu de données via la librairie 'datasets' d'HuggingFace et que vous l'avez sauvegardé localement (par exemple pour travailler hors ligne ou accélérer les chargements répétés)."
use_cases:
  - "Chargement de corpus NLP textuels (classification de textes, analyse de sentiment)."
  - "Traitement de grands volumes de données fragmentés stockés au format Arrow."
  - "Création de pipelines de Machine Learning hybrides nécessitant le passage vers Pandas."
pros:
  - "Extrêmement rapide grâce au backend Apache Arrow."
  - "Maintient les types de données complexes et les métadonnées d'HuggingFace."
  - "Fonctionne sans connexion Internet après le premier téléchargement."
cons:
  - "Requiert l'installation de la librairie 'datasets' qui peut être lourde."
  - "La conversion vers Pandas peut consommer beaucoup de mémoire (RAM) pour les très gros jeux de données."
category: 2. Load
tags:
- load
- huggingface
- nlp
- pandas
code_template: |
  import pandas as pd
  import time
  try:
      from datasets import load_from_disk
  except ImportError:
      load_from_disk = None
      print("[ERREUR LOAD] La librairie 'datasets' n'est pas installée.")

  # [PARAM: LOCAL_PATH | string]
  LOCAL_PATH = "./data/raw/huggingface_cache/imdb_train"
  # [/PARAM]

  # [PARAM: TARGET_COL | string]
  TARGET_COL = "label"
  # [/PARAM]

  print(f"[LOAD] Chargement du dataset HuggingFace depuis {LOCAL_PATH}...")

  df = pd.DataFrame()
  target_name = ""
  task_type = "unknown"
  meta = {}

  try:
      start_time = time.time()
      if load_from_disk is not None:
          hf_dataset = load_from_disk(LOCAL_PATH)
          df = hf_dataset.to_pandas()
          
          duration = time.time() - start_time
          print(f"[LOAD] Succès HuggingFace Load. {df.shape[0]} lignes chargées en {duration:.2f}s.")
          
          target_name = TARGET_COL if TARGET_COL and TARGET_COL in df.columns else ""
          task_type = "classification" if target_name and df[target_name].nunique() < 20 else "unknown"
          meta = {"format": "huggingface", "shape": df.shape}
  except Exception as e:
      print(f"[ERREUR LOAD] Échec du chargement HuggingFace : {str(e)}")
      raise e
