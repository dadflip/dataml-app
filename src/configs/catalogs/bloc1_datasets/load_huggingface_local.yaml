id: load_huggingface_local
name: 'Load: HuggingFace (from Disk)'
description: Charge un dataset HuggingFace précédemment extrait sur le disque local
  en DataFrame Pandas.
category: 2. Load
tags:
- load
- huggingface
- nlp
- pandas
code_template: "import pandas as pd\nimport time\ntry:\n    from datasets import load_from_disk\n\
  except ImportError:\n    load_from_disk = None\n    print(\"[ERREUR LOAD] La librairie\
  \ 'datasets' n'est pas installée.\")\n\n# [PARAM: LOCAL_PATH | string]\nLOCAL_PATH\
  \ = \"./data/raw/huggingface_cache/imdb_train\"\n# [/PARAM]\n\n# [PARAM: TARGET_COL\
  \ | string]\nTARGET_COL = \"label\"\n# [/PARAM]\n\nprint(f\"[LOAD] Chargement du\
  \ dataset HuggingFace depuis {LOCAL_PATH}...\")\n\ntry:\n    start_time = time.time()\n\
  \    if load_from_disk is not None:\n        hf_dataset = load_from_disk(LOCAL_PATH)\n\
  \        df = hf_dataset.to_pandas()\n        \n        duration = time.time() -\
  \ start_time\n        print(f\"[LOAD] Succès HuggingFace Load. {df.shape[0]} lignes\
  \ chargées en {duration:.2f}s.\")\n        \n        target_name = TARGET_COL if\
  \ TARGET_COL and TARGET_COL in df.columns else None\n        task_type = \"classification\"\
  \ if target_name and df[target_name].nunique() < 20 else \"unknown\"\n        meta\
  \ = {\"format\": \"huggingface\", \"shape\": df.shape}\n    else:\n        df =\
  \ None\n        target_name = None\n        task_type = \"unknown\"\n        meta\
  \ = {}\nexcept Exception as e:\n    print(f\"[ERREUR LOAD] Échec du chargement HuggingFace\
  \ : {str(e)}\")\n    raise e\n"
