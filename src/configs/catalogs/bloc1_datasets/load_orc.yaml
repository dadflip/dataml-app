id: "load_orc"
name: "Load: Fichier ORC"
description: "Charge un fichier Apache ORC (Optimized Row Columnar), standard Hadoop."
category: "2. Load"
tags: ["load", "orc", "bigdata", "pandas"]
code_template: |
  import pandas as pd
  import time
  import os

  # [PARAM: FILE_PATH | file]
  FILE_PATH = "./data/raw/data.orc"
  # [/PARAM]

  df = pd.read_orc(FILE_PATH) if os.path.exists(FILE_PATH) else pd.DataFrame()
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "orc", "path": FILE_PATH}
output_variables:
  - df
  - target_name
  - task_type
  - meta
illustration_mermaid: |
    flowchart LR
      A[fa:fa-file-alt FILE_PATH<br/>data.orc] -->|pandas read_orc| B(fa:fa-cogs Parse ORC)
      B --> C[(df<br/>Data Table)]
      B --> D{{meta<br/>path}}
      B --> E([target_name, task_type])
      
      style A fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
      style B fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
      style C fill:#eff6ff,stroke:#3b82f6,stroke-width:2px
      style D fill:#fef3c7,stroke:#d97706,stroke-width:2px
      style E fill:#f3f4f6,stroke:#6b7280,stroke-width:2px

_metadata:
  bloc: 1
  section: "2_load"
