id: load_huggingface
name: 'Load: HuggingFace Dataset'
description: Charge directement un dataset depuis le hub HuggingFace (datasets).
when_to_use: À utiliser pour accéder facilement aux milliers de jeux de données open-source spécialisés, notamment en NLP (Traitement du Langage Naturel) ou vision par ordinateur, hébergés sur le Hub HuggingFace.
use_cases:
  - "Entraînement de modèles de NLP (classification de textes, traduction)."
  - "Évaluation de LLMs sur des benchmarks standards (ex: SQuAD, IMDB)."
  - "Accès rapide à des datasets d'images ou d'audio prêts à l'emploi."
pros:
  - "Accès direct et standardisé à une immense bibliothèque de datasets."
  - "Gestion automatique du téléchargement, du cache et des splits (train/test)."
cons:
  - "Dépendance à la bibliothèque `datasets` et à une connexion internet."
  - "Parfois complexe pour filtrer ou extraire des sous-ensembles très spécifiques sans tout télécharger."
category: 2. Load
tags:
- load
- huggingface
- hub
- nlp
code_template: |
  import time

  # [PARAM: DATASET_NAME | string]
  DATASET_NAME = "imdb"
  # [/PARAM]

  # [PARAM: SPLIT | string]
  SPLIT = "train"
  # [/PARAM]

  print(f"[LOAD] Chargement du dataset HuggingFace '{DATASET_NAME}' (split: {SPLIT})...")

  try:
      start_time = time.time()
      from datasets import load_dataset
      
      dataset = load_dataset(DATASET_NAME, split=SPLIT)
      # Conversion directe en DataFrame Pandas
      df = dataset.to_pandas()
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès HuggingFace. {df.shape[0]} lignes chargées en {duration:.2f}s.")
  except ImportError:
      print("[ERREUR LOAD] Le module 'datasets' est requis (pip install datasets).")
      raise
  except Exception as e:
      print(f"[ERREUR LOAD] Erreur HuggingFace : {str(e)}")
      raise e

  target_name = "label" if "label" in df.columns else ""
  task_type = "nlp_classification" if target_name else "unknown"
  meta = {"format": "huggingface", "dataset": DATASET_NAME, "shape": df.shape}
