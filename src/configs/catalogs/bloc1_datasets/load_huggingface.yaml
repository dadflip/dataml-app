id: load_huggingface
name: 'Load: HuggingFace Dataset'
description: Charge directement un dataset depuis le hub HuggingFace (datasets).
category: 2. Load
tags:
- load
- huggingface
- hub
- nlp
code_template: "import time\n\n# [PARAM: DATASET_NAME | string]\nDATASET_NAME = \"\
  imdb\"\n# [/PARAM]\n\n# [PARAM: SPLIT | string]\nSPLIT = \"train\"\n# [/PARAM]\n\
  \nprint(f\"[LOAD] Chargement du dataset HuggingFace '{DATASET_NAME}' (split: {SPLIT})...\"\
  )\n\ntry:\n    start_time = time.time()\n    from datasets import load_dataset\n\
  \    \n    dataset = load_dataset(DATASET_NAME, split=SPLIT)\n    # Conversion directe\
  \ en DataFrame Pandas\n    df = dataset.to_pandas()\n    \n    duration = time.time()\
  \ - start_time\n    print(f\"[LOAD] Succès HuggingFace. {df.shape[0]} lignes chargées\
  \ en {duration:.2f}s.\")\nexcept ImportError:\n    print(\"[ERREUR LOAD] Le module\
  \ 'datasets' est requis (pip install datasets).\")\n    raise\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR LOAD] Erreur HuggingFace : {str(e)}\")\n    raise\
  \ e\n\ntarget_name = \"label\" if \"label\" in df.columns else None\ntask_type =\
  \ \"nlp_classification\" if target_name else \"unknown\"\nmeta = {\"format\": \"\
  huggingface\", \"dataset\": DATASET_NAME, \"shape\": df.shape}\n"
