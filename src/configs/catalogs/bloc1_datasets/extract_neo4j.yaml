id: extract_neo4j
name: 'Extract: Graphe Neo4j'
description: Exécute une requête Cypher sur Neo4j et exporte le résultat en CSV.
category: 1. Extract
tags:
- extract
- neo4j
- graph
- cypher
code_template: "from neo4j import GraphDatabase\nimport pandas as pd\nimport os\n\
  import time\n\n# [PARAM: URI | string]\nURI = \"bolt://localhost:7687\"\n# [/PARAM]\n\
  \n# [PARAM: USER | string]\nUSER = \"neo4j\"\n# [/PARAM]\n\n# [PARAM: PASSWORD |\
  \ string]\nPASSWORD = \"password\"\n# [/PARAM]\n\n# [PARAM: CYPHER_QUERY | string]\n\
  CYPHER_QUERY = \"MATCH (n:Person) RETURN n.name AS name, n.age AS age LIMIT 100\"\
  \n# [/PARAM]\n\n# [PARAM: DEST_PATH | string]\nDEST_PATH = \"./data/raw/neo4j_export.csv\"\
  \n# [/PARAM]\n\nprint(f\"[EXTRACT] Exécution de la requête Cypher sur Neo4j ({URI})...\"\
  )\nos.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)\n\ntry:\n    start_time\
  \ = time.time()\n    driver = GraphDatabase.driver(URI, auth=(USER, PASSWORD))\n\
  \    \n    with driver.session() as session:\n        result = session.run(CYPHER_QUERY)\n\
  \        data = [record.data() for record in result]\n        \n    driver.close()\n\
  \    \n    df_temp = pd.DataFrame(data)\n    df_temp.to_csv(DEST_PATH, index=False)\n\
  \    \n    duration = time.time() - start_time\n    print(f\"[EXTRACT] Succès Neo4j.\
  \ {len(data)} noeuds/relations exportés en {duration:.2f}s.\")\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR EXTRACT] Échec Neo4j : {str(e)}\")\n    raise e\n\n\
  df = None\ntarget_name = None\ntask_type = \"unknown\"\nmeta = {\"source\": \"neo4j\"\
  , \"path\": DEST_PATH}\n"
