id: extract_neo4j
name: 'Extract: Graphe Neo4j'
description: 'Exécute une requête Cypher sur une base de données orientée graphe Neo4j et exporte les nœuds et relations résultants au format CSV.'
when_to_use: 'Idéal lorsque les données sources sont stockées sous forme de graphe dans Neo4j et que vous avez besoin d''extraire un sous-graphe spécifique ou des propriétés tabulaires.'
use_cases:
  - 'Extraction de réseaux sociaux ou de graphes de connaissances.'
  - 'Préparation de données tabulaires à partir de relations complexes (ex: détection de fraude).'
pros:
  - 'Exploite la puissance de Cypher pour filtrer directement dans la base de données.'
  - 'Convertit facilement les résultats complexes en format tabulaire standard (CSV).'
cons:
  - 'Nécessite une connexion active au serveur Neo4j.'
  - 'Les grands graphes peuvent consommer beaucoup de mémoire lors de la conversion.'
category: 1. Extract
tags:
- extract
- neo4j
- graph
- cypher
code_template: |
  from neo4j import GraphDatabase
  import pandas as pd
  import os
  import time

  # [PARAM: URI | string]
  URI = "bolt://localhost:7687"
  # [/PARAM]

  # [PARAM: USER | string]
  USER = "neo4j"
  # [/PARAM]

  # [PARAM: PASSWORD | string]
  PASSWORD = "password"
  # [/PARAM]

  # [PARAM: CYPHER_QUERY | string]
  CYPHER_QUERY = "MATCH (n:Person) RETURN n.name AS name, n.age AS age LIMIT 100"
  # [/PARAM]

  # [PARAM: DEST_PATH | string]
  DEST_PATH = "./data/raw/neo4j_export.csv"
  # [/PARAM]

  print(f"[EXTRACT] Exécution de la requête Cypher sur Neo4j ({URI})...")
  os.makedirs(os.path.dirname(DEST_PATH), exist_ok=True)

  try:
      start_time = time.time()
      driver = GraphDatabase.driver(URI, auth=(USER, PASSWORD))
      
      with driver.session() as session:
          result = session.run(CYPHER_QUERY)
          data = [record.data() for record in result]
          
      driver.close()
      
      df_temp = pd.DataFrame(data)
      df_temp.to_csv(DEST_PATH, index=False)
      
      duration = time.time() - start_time
      print(f"[EXTRACT] Succès Neo4j. {len(data)} noeuds/relations exportés en {duration:.2f}s.")
  except Exception as e:
      print(f"[ERREUR EXTRACT] Échec Neo4j : {str(e)}")
      raise e

  df = DEST_PATH
  target_name = "target"
  task_type = "unknown"
  meta = {"source": "neo4j", "path": DEST_PATH}
