id: eda_kmeans_clustering_2d
name: 'EDA: Clustering Rapide (K-Means 2D)'
description: Applique une PCA à 2D suivie d'un K-Means pour voir des structures non
  supervisées.
category: 3. Exploratory Data Analysis
tags:
- eda
- clustering
- tabular
- pca
code_template: "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport seaborn as sns\nfrom sklearn.decomposition import PCA\nfrom sklearn.cluster\
  \ import KMeans\nfrom sklearn.preprocessing import StandardScaler\n\n# [PARAM: N_CLUSTERS\
  \ | number]\nN_CLUSTERS = 3\n# [/PARAM]\n\nnum_df = df.select_dtypes(include=[np.number]).dropna()\n\
  if len(num_df) > 50 and len(num_df.columns) >= 2:\n    scaler = StandardScaler()\n\
  \    scaled = scaler.fit_transform(num_df)\n    \n    pca = PCA(n_components=2)\n\
  \    coords = pca.fit_transform(scaled)\n    \n    kmeans = KMeans(n_clusters=N_CLUSTERS,\
  \ random_state=42)\n    clusters = kmeans.fit_predict(scaled)\n    \n    plt.figure(figsize=(8,\
  \ 6))\n    sns.scatterplot(x=coords[:,0], y=coords[:,1], hue=clusters, palette='Set1',\
  \ legend='full')\n    plt.title(f\"K-Means Clustering ({N_CLUSTERS} clusters) sur\
  \ PCA 2D\")\n    plt.xlabel(\"PCA 1\")\n    plt.ylabel(\"PCA 2\")\n    plt.show()\n\
  else:\n    print(\"[EDA] Dataset inadapté pour le clustering (trop petit ou NaNs).\"\
  )\n"
