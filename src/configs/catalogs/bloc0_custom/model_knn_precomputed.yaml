id: "model_knn_precomputed"
name: "Model: KNN (Precomputed Distance)"
description: "K-Nearest Neighbors utilisant une matrice de distance pré-calculée. Spécialement adapté pour Oxford 102 Flowers."
category: "Custom"
tags: ["model", "classification", "knn", "precomputed", "custom"]
applies_to: ["Tabulaire", "Images"]
when_to_use: "Quand vous disposez déjà des distances entre vos échantillons d'entraînement et de test."
pros:
  - "Évite de recalculer des distances coûteuses."
cons:
  - "Nécessite la matrice NxN complète en mémoire."
hyperparameters:
  n_neighbors: "Nombre de voisins (K)."
  distance_key: "Clé de la matrice de distance (ex: D_hsv, D_hog)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.neighbors import KNeighborsClassifier

  # [PARAM: N_NEIGHBORS | number]
  N_NEIGHBORS = 5
  # [/PARAM]

  # [PARAM: DISTANCE_KEY | string]
  DISTANCE_KEY = "D_hsv"
  # [/PARAM]

  print(f"[MODEL] Entraînement KNN (K={N_NEIGHBORS}, Matrice={DISTANCE_KEY})...")
  
  if 'X_train' in locals() and 'X_test' in locals() and 'y_train' in locals():
      # Vérification de la disponibilité des distances
      if 'OXFORD_DISTANCES' not in globals() or DISTANCE_KEY not in globals()['OXFORD_DISTANCES']:
          print(f"[ERREUR] Matrice '{DISTANCE_KEY}' non trouvée dans OXFORD_DISTANCES. Exécutez le bloc Load 102Flowers d'abord.")
      else:
          full_dist_mat = globals()['OXFORD_DISTANCES'][DISTANCE_KEY]
          
          # Les index de X_train et X_test correspondent aux index d'origine de la base de données 102flowers
          # Pour le KNN precomputed de Scikit-Learn:
          # X_train doit être la matrice des distances entre les échantillons de train: shape (N_train, N_train)
          # X_test doit être la matrice des distances entre test et train: shape (N_test, N_train)
          
          train_idx = X_train.index.to_numpy()
          test_idx = X_test.index.to_numpy()
          
          # On extrait les sous-matrices
          # Lignes : train, Colonnes : train
          X_train_precomputed = full_dist_mat[train_idx][:, train_idx]
          
          # Lignes : test, Colonnes : train
          X_test_precomputed = full_dist_mat[test_idx][:, train_idx]
          
          model = KNeighborsClassifier(n_neighbors=int(N_NEIGHBORS), metric='precomputed')
          
          # Entraînement
          model.fit(X_train_precomputed, y_train)
          
          # Prédiction
          y_pred = model.predict(X_test_precomputed)
          try:
              y_proba = model.predict_proba(X_test_precomputed)
          except Exception:
              y_proba = None
              
          feature_importances = None
          full_pipeline = model
          
          training_history = {"status": "success", "metric": "precomputed"}
          task_type = "classification"
          print("[MODEL] KNN pré-calculé entraîné et évalué avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables. Avez-vous oublié le train_test_split ?")

