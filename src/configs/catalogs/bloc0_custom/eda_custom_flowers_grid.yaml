id: eda_custom_flowers_grid
name: 'EDA: Aperçu des Fleurs'
description: Affiche quelques images de fleurs en lisant les chemins depuis le dataframe.
category: Custom
tags:
- eda
- images
- 102flowers
- custom
code_template: "import matplotlib.pyplot as plt\nfrom PIL import Image\nimport os\n\
  \n# [PARAM: NUM_IMAGES | number]\nNUM_IMAGES = 16\n# [/PARAM]\n\nprint(\"[EDA] Aperçu\
  \ des images...\")\nif 'df' in locals() and 'image_path' in df.columns:\n    # S'assure\
  \ que c'est bien des chaînes de caractères (avant transformation tensor)\n    paths\
  \ = df['image_path'].dropna().head(int(NUM_IMAGES)).tolist()\n    \n    if len(paths)\
  \ > 0 and isinstance(paths[0], str):\n        cols = int(len(paths)**0.5)\n    \
  \    rows = (len(paths) + cols - 1) // cols\n        \n        plt.figure(figsize=(10,\
  \ 10))\n        for i, path in enumerate(paths):\n            if os.path.exists(path):\n\
  \                img = Image.open(path).convert('RGB')\n                plt.subplot(rows,\
  \ cols, i + 1)\n                plt.imshow(img)\n                plt.axis('off')\n\
  \        \n        plt.suptitle(f\"Aperçu de {len(paths)} fleurs\")\n        plt.tight_layout()\n\
  \        plt.show()\n    else:\n        print(\"[EDA] Impossible d'afficher les\
  \ images (déjà converties en tenseurs ?)\")\nelse:\n    print(\"[ERREUR] 'df' ou\
  \ colonne 'image_path' introuvable.\")\n"
illustration_mermaid: |
    graph LR
      A([Input]) --> B([Operation])
      B --> C([Output])
      style B fill:#64748b,stroke:#475569,stroke-width:2px,color:#fff

