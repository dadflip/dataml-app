code_template: |
  import matplotlib.pyplot as plt
  from PIL import Image
  import os

  # [PARAM: NUM_IMAGES | number]
  NUM_IMAGES = 16
  # [/PARAM]

  print("[EDA] Aperçu des images...")
  if 'df' in locals() and 'image_path' in df.columns:
      # S'assure que c'est bien des chaînes de caractères (avant transformation tensor)
      paths = df['image_path'].dropna().head(int(NUM_IMAGES)).tolist()
      
      if len(paths) > 0 and isinstance(paths[0], str):
          cols = int(len(paths)**0.5)
          rows = (len(paths) + cols - 1) // cols
          
          plt.figure(figsize=(10, 10))
          for i, path in enumerate(paths):
              if os.path.exists(path):
                  img = Image.open(path).convert('RGB')
                  plt.subplot(rows, cols, i + 1)
                  plt.imshow(img)
                  plt.axis('off')
          
          plt.suptitle(f"Aperçu de {len(paths)} fleurs")
          plt.tight_layout()
          plt.show()
      else:
          print("[EDA] Impossible d'afficher les images (déjà converties en tenseurs ?)")
  else:
      print("[ERREUR] 'df' ou colonne 'image_path' introuvable.")
