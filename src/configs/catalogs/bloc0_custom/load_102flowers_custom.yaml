id: "load_102flowers_custom"
name: "Load: 102 Flowers (Custom + Distances)"
description: "Associe images, labels, et met en cache les matrices de distances précalculées (Oxford 102 Flowers)."
category: "Custom"
tags: ["load", "image", "102flowers", "matlab", "custom"]
code_template: |
  import pandas as pd
  import os
  import glob
  import time
  import scipy.io

  # [PARAM: IMAGES_DIR | string]
  IMAGES_DIR = "./data/extracted/102flowers/jpg"
  # [/PARAM]
  
  # [PARAM: LABELS_MAT | string]
  LABELS_MAT = "./data/raw/102flowers/imagelabels.mat"
  # [/PARAM]

  # [PARAM: DISTANCES_MAT | string]
  DISTANCES_MAT = "./data/raw/102flowers/distancematrices102.mat"
  # [/PARAM]

  print(f"[LOAD] Chargement 102flowers (Images, Labels, et Matrices de distance)...")

  try:
      start_time = time.time()
      
      # Chargement des labels
      mat = scipy.io.loadmat(LABELS_MAT)
      labels = mat['labels'][0]
      
      # Chargement des matrices de distance si disponible
      if os.path.exists(DISTANCES_MAT):
          dist_mat = scipy.io.loadmat(DISTANCES_MAT)
          # dist_mat contient typiquement D_hsv, D_hog, D_siftint, D_siftbdy
          # on les stocke en mémoire locale pour que le bloc KNN precomputed puisse les récupérer
          # Attention: globals() pour qu'il survive d'une cellule à l'autre dans le notebook !
          globals()['OXFORD_DISTANCES'] = {k: v for k, v in dist_mat.items() if not k.startswith('_')}
          print(f"[LOAD] Matrices de distance chargées : {list(globals()['OXFORD_DISTANCES'].keys())}")
      else:
          print(f"[AVERTISSEMENT] {DISTANCES_MAT} introuvable. Le KNN precomputed ne fonctionnera pas.")

      # Les images sont nommées image_0001.jpg, image_0002.jpg etc. 
      image_paths = sorted(glob.glob(os.path.join(IMAGES_DIR, "*.jpg")))
      
      if len(image_paths) != len(labels):
          print(f"[AVERTISSEMENT] Nombre d'images ({len(image_paths)}) différent du nombre de labels ({len(labels)})!")
          
      df = pd.DataFrame({
          'image_path': image_paths[:len(labels)],
          'target_class': labels[:len(image_paths)]
      })
      
      # L'index du DataFrame (0  N-1) correspond exactement aux indices des lignes/colonnes de la matrice de distance.
      # C'est crucial car train_test_split conservera les index d'origine dans X_train.index et X_test.index !
      
      df['target_class'] = df['target_class'].astype(str)
      
      duration = time.time() - start_time
      print(f"[LOAD] Succès. {len(df)} images associées à leurs labels en {duration:.2f}s.")
      
      target_name = "target_class"
      task_type = "image_classification"
      meta = {"format": "102flowers_custom", "shape": df.shape, "classes": df['target_class'].nunique()}
  except Exception as e:
      print(f"[ERREUR LOAD] Échec du chargement 102flowers : {str(e)}")
      raise e

