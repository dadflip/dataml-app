id: load_102flowers_custom
name: 'Load: 102 Flowers (Custom + Distances)'
description: Associe images, labels, et met en cache les matrices de distances précalculées
  (Oxford 102 Flowers).
category: Custom
tags:
- load
- image
- 102flowers
- matlab
- custom
code_template: "import pandas as pd\nimport os\nimport glob\nimport time\nimport scipy.io\n\
  \n# [PARAM: IMAGES_DIR | string]\nIMAGES_DIR = \"./data/extracted/102flowers/jpg\"\
  \n# [/PARAM]\n\n# [PARAM: LABELS_MAT | string]\nLABELS_MAT = \"./data/raw/102flowers/imagelabels.mat\"\
  \n# [/PARAM]\n\n# [PARAM: DISTANCES_MAT | string]\nDISTANCES_MAT = \"./data/raw/102flowers/distancematrices102.mat\"\
  \n# [/PARAM]\n\nprint(f\"[LOAD] Chargement 102flowers (Images, Labels, et Matrices\
  \ de distance)...\")\n\ntry:\n    start_time = time.time()\n    \n    # Chargement\
  \ des labels\n    mat = scipy.io.loadmat(LABELS_MAT)\n    labels = mat['labels'][0]\n\
  \    \n    # Chargement des matrices de distance si disponible\n    if os.path.exists(DISTANCES_MAT):\n\
  \        dist_mat = scipy.io.loadmat(DISTANCES_MAT)\n        # dist_mat contient\
  \ typiquement D_hsv, D_hog, D_siftint, D_siftbdy\n        # on les stocke en mémoire\
  \ locale pour que le bloc KNN precomputed puisse les récupérer\n        # Attention:\
  \ globals() pour qu'il survive d'une cellule à l'autre dans le notebook !\n    \
  \    globals()['OXFORD_DISTANCES'] = {k: v for k, v in dist_mat.items() if not k.startswith('_')}\n\
  \        print(f\"[LOAD] Matrices de distance chargées : {list(globals()['OXFORD_DISTANCES'].keys())}\"\
  )\n    else:\n        print(f\"[AVERTISSEMENT] {DISTANCES_MAT} introuvable. Le KNN\
  \ precomputed ne fonctionnera pas.\")\n\n    # Les images sont nommées image_0001.jpg,\
  \ image_0002.jpg etc. \n    image_paths = sorted(glob.glob(os.path.join(IMAGES_DIR,\
  \ \"*.jpg\")))\n    \n    if len(image_paths) != len(labels):\n        print(f\"\
  [AVERTISSEMENT] Nombre d'images ({len(image_paths)}) différent du nombre de labels\
  \ ({len(labels)})!\")\n        \n    df = pd.DataFrame({\n        'image_path':\
  \ image_paths[:len(labels)],\n        'target_class': labels[:len(image_paths)]\n\
  \    })\n    \n    # L'index du DataFrame (0  N-1) correspond exactement aux indices\
  \ des lignes/colonnes de la matrice de distance.\n    # C'est crucial car train_test_split\
  \ conservera les index d'origine dans X_train.index et X_test.index !\n    \n  \
  \  df['target_class'] = df['target_class'].astype(str)\n    \n    duration = time.time()\
  \ - start_time\n    print(f\"[LOAD] Succès. {len(df)} images associées à leurs labels\
  \ en {duration:.2f}s.\")\n    \n    target_name = \"target_class\"\n    task_type\
  \ = \"image_classification\"\n    meta = {\"format\": \"102flowers_custom\", \"\
  shape\": df.shape, \"classes\": df['target_class'].nunique()}\nexcept Exception\
  \ as e:\n    print(f\"[ERREUR LOAD] Échec du chargement 102flowers : {str(e)}\"\
  )\n    raise e\n"
