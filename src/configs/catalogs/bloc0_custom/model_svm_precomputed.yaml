id: model_svm_precomputed
name: 'Model: SVM (Precomputed Kernel / MKL)'
description: "Machine à Vecteurs de Support (SVM) utilisant une combinaison de matrices de distances pré-calculées converties en noyaux (Kernel). L'approche historique State-of-the-Art pour 102 Flowers."
category: Custom
tags:
- model
- classification
- svm
- mkl
- precomputed
- custom
applies_to:
- Tabulaire
- Images
when_to_use: "Quand vous disposez des matrices de distance (ex: 102 Flowers) et voulez une très haute précision sans utiliser le Deep Learning."
pros:
- "Extrêmement rapide à entraîner (quelques secondes)."
- "Précision redoutable en combinant couleurs, formes et textures."
cons:
- "Gourmand en RAM si le dataset dépasse 50,000 images."
hyperparameters:
  c_param: "Paramètre de régularisation C (ex: 10.0)."
  gamma: "Paramètre Gamma pour convertir la distance en similarité (laisser 'auto' pour un calcul dynamique)."
  distance_keys: "Matrices à utiliser (ex: 'Dsiftint', 'Dhsv', 'Dsiftbdy', 'Dhog')."
code_template: "import pandas as pd\nimport numpy as np\nfrom sklearn.svm import SVC\n\n# [PARAM: C_PARAM | number]\nC_PARAM = 10.0\n# [/PARAM]\n\n# [PARAM: GAMMA | string]\nGAMMA = 'auto'\n# [/PARAM]\n\n# [PARAM: DISTANCE_KEYS | expr]\nDISTANCE_KEYS = ['Dsiftint', 'Dhsv', 'Dsiftbdy', 'Dhog']\n# [/PARAM]\n\nprint(f\"[MODEL] Entraînement SVM Precomputed Kernel (C={C_PARAM}, Matrices={DISTANCE_KEYS})...\")\n\nif 'X_train' in locals() and 'X_test' in locals() and 'y_train' in locals():\n    if 'OXFORD_DISTANCES' not in globals():\n        print(\"[ERREUR] OXFORD_DISTANCES introuvable. Exécutez le bloc Load 102Flowers d'abord.\")\n    else:\n        keys = [k.strip() for k in DISTANCE_KEYS]\n        missing = [k for k in keys if k not in globals()['OXFORD_DISTANCES']]\n        if missing:\n            print(f\"[ERREUR] Matrices {missing} non trouvées dans OXFORD_DISTANCES.\")\n        else:\n            # 1. Moyenne des matrices de distance\n            mats = [globals()['OXFORD_DISTANCES'][k] for k in keys]\n            full_dist_mat = np.mean(mats, axis=0)\n            \n            # 2. Conversion Distance -> Similarité (Kernel RBF)\n            # K(x,y) = exp(-gamma * D(x,y))\n            if GAMMA == 'auto':\n                # Heuristique classique : gamma = 1 / moyenne des distances\n                gamma_val = 1.0 / np.mean(full_dist_mat)\n            else:\n                gamma_val = float(GAMMA)\n                \n            full_kernel_mat = np.exp(-gamma_val * full_dist_mat)\n            print(f\"[MODEL] Distance convertie en Kernel RBF (gamma={gamma_val:.6f})\")\n        \n            # 3. Extraction des sous-matrices Train/Test\n            train_idx = X_train.index.to_numpy()\n            test_idx = X_test.index.to_numpy()\n            \n            # Lignes : train, Colonnes : train\n            K_train = full_kernel_mat[train_idx][:, train_idx]\n            \n            # Lignes : test, Colonnes : train\n            K_test = full_kernel_mat[test_idx][:, train_idx]\n        \n            # 4. Entraînement du SVM\n            model = SVC(C=float(C_PARAM), kernel='precomputed', probability=True)\n            model.fit(K_train, y_train)\n            \n            # 5. Prédictions\n            y_pred = model.predict(K_test)\n            try:\n                y_proba = model.predict_proba(K_test)\n            except Exception:\n                y_proba = None\n                \n            feature_importances = None\n            full_pipeline = model\n            \n            training_history = {\"status\": \"success\", \"metric\": \"precomputed_kernel\"}\n            task_type = \"classification\"\n            print(\"[MODEL] SVM avec Kernel pré-calculé entraîné et évalué avec succès.\")\nelse:\n    print(\"[ERREUR] Données d'entraînement introuvables. Avez-vous oublié le train_test_split ?\")\n"
