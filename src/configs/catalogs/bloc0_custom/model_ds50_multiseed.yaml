id: model_ds50_multiseed
name: DS50 Multi-Seed Models (GNN, MLP, RF, XGB, LR)
description: Définit les réseaux de neurones (GCN, GraphSAGE, MLP) et entraîne 6 modèles
  sur plusieurs seeds.
category: Custom
tags:
- model
- multiseed
- gnn
- pytorch
- xgboost
applies_to:
- Graphes
when_to_use: Après le preprocessing DS50.
pros:
- Très complet, compare de multiples modèles sur plusieurs seeds.
cons:
- L'exécution peut prendre plusieurs minutes, surtout sur CPU.
hyperparameters:
  SEEDS: 'Liste des seeds (ex: [42, 43, 44, 45, 46])'
input_variables:
  required:
  - dataset
  - X_nodes
  - adj_norm
  - node_to_idx
  - all_candidate_pairs
  - positive_set
  - build_heuristic_features
  - build_pair_features
  - dataframe_to_link_tensors
  - nodes
  - DEVICE
output_variables:
  all_seed_results: Liste des dictionnaires de résultats (métriques)
  all_recommendations: Liste des DataFrames de prédictions sur les candidats
  SEEDS: Liste des seeds utilisées
code_template: "import json, random\nimport numpy as np\nimport pandas as pd\nimport\
  \ torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nfrom sklearn.model_selection\
  \ import train_test_split, StratifiedKFold, cross_val_score\nfrom sklearn.metrics\
  \ import roc_auc_score, average_precision_score, accuracy_score, f1_score, classification_report\n\
  from sklearn.linear_model import LogisticRegression\nfrom sklearn.ensemble import\
  \ RandomForestClassifier\nfrom xgboost import XGBClassifier\n\n# [PARAM: SEEDS |\
  \ expr]\nSEEDS = [42, 43, 44, 45, 46]\n# [/PARAM]\n\n# 7. Modèles PyTorch\nclass\
  \ GCNLayer(nn.Module):\n    def __init__(self, in_dim, out_dim):\n        super().__init__()\n\
  \        self.linear = nn.Linear(in_dim, out_dim)\n    def forward(self, x, adj_norm):\n\
  \        return F.relu(self.linear(torch.matmul(adj_norm, x)))\n\nclass GCNEncoder(nn.Module):\n\
  \    def __init__(self, in_dim, hidden_dim=32, embedding_dim=16, dropout=0.5):\n\
  \        super().__init__()\n        self.layer1  = GCNLayer(in_dim, hidden_dim)\n\
  \        self.layer2  = GCNLayer(hidden_dim, embedding_dim)\n        self.dropout\
  \ = nn.Dropout(dropout)\n    def forward(self, x, adj_norm):\n        return self.layer2(self.dropout(self.layer1(x,\
  \ adj_norm)), adj_norm)\n\nclass GCNLinkPredictionModel(nn.Module):\n    def __init__(self,\
  \ in_dim, hidden_dim=32, embedding_dim=16):\n        super().__init__()\n      \
  \  self.encoder = GCNEncoder(in_dim, hidden_dim, embedding_dim)\n        self.decoder\
  \ = LinkDecoder(embedding_dim, heuristic_dim=10)\n    def forward(self, x, adj_norm,\
  \ src_idx, dst_idx, heuristics):\n        z = self.encoder(x, adj_norm)\n      \
  \  return self.decoder(z[src_idx], z[dst_idx], heuristics)\n\nclass GraphSAGELayer(nn.Module):\n\
  \    def __init__(self, in_dim, out_dim):\n        super().__init__()\n        self.self_linear\
  \  = nn.Linear(in_dim, out_dim)\n        self.neigh_linear = nn.Linear(in_dim, out_dim)\n\
  \    def forward(self, x, adj_norm):\n        return F.relu(self.self_linear(x)\
  \ + self.neigh_linear(torch.matmul(adj_norm, x)))\n\nclass GraphSAGEEncoder(nn.Module):\n\
  \    def __init__(self, in_dim, hidden_dim=32, embedding_dim=16, dropout=0.5):\n\
  \        super().__init__()\n        self.layer1  = GraphSAGELayer(in_dim, hidden_dim)\n\
  \        self.layer2  = GraphSAGELayer(hidden_dim, embedding_dim)\n        self.dropout\
  \ = nn.Dropout(dropout)\n    def forward(self, x, adj_norm):\n        return self.layer2(self.dropout(self.layer1(x,\
  \ adj_norm)), adj_norm)\n\nclass GraphSAGELinkPredictionModel(nn.Module):\n    def\
  \ __init__(self, in_dim, hidden_dim=32, embedding_dim=16):\n        super().__init__()\n\
  \        self.encoder = GraphSAGEEncoder(in_dim, hidden_dim, embedding_dim)\n  \
  \      self.decoder = LinkDecoder(embedding_dim, heuristic_dim=10)\n    def forward(self,\
  \ x, adj_norm, src_idx, dst_idx, heuristics):\n        z = self.encoder(x, adj_norm)\n\
  \        return self.decoder(z[src_idx], z[dst_idx], heuristics)\n\nclass LinkDecoder(nn.Module):\n\
  \    def __init__(self, embedding_dim=32, heuristic_dim=10, hidden_dim=64):\n  \
  \      super().__init__()\n        self.mlp = nn.Sequential(\n            nn.Linear(embedding_dim\
  \ * 4 + heuristic_dim, hidden_dim),\n            nn.ReLU(), nn.Dropout(0.25),\n\
  \            nn.Linear(hidden_dim, 1),\n        )\n    def forward(self, z_src,\
  \ z_dst, heuristics):\n        pair = torch.cat([z_src, z_dst, torch.abs(z_src-z_dst),\
  \ z_src*z_dst, heuristics], dim=1)\n        return self.mlp(pair).squeeze(-1)\n\n\
  class PairMLP(nn.Module):\n    def __init__(self, input_dim, hidden_dim=128):\n\
  \        super().__init__()\n        self.network = nn.Sequential(\n           \
  \ nn.Linear(input_dim, hidden_dim), nn.ReLU(), nn.Dropout(0.25),\n            nn.Linear(hidden_dim,\
  \ hidden_dim // 2), nn.ReLU(), nn.Dropout(0.25),\n            nn.Linear(hidden_dim\
  \ // 2, 1),\n        )\n    def forward(self, x):\n        return self.network(x).squeeze(-1)\n\
  \ndef set_seed(seed):\n    random.seed(seed); np.random.seed(seed); torch.manual_seed(seed)\n\
  \    if torch.cuda.is_available(): torch.cuda.manual_seed_all(seed)\n\ndef evaluate_predictions(model_name,\
  \ y_true, y_prob, threshold=0.5, verbose=False):\n    y_pred = (y_prob >= threshold).astype(int)\n\
  \    metrics = {\n        \"model\":             model_name,\n        \"roc_auc\"\
  :           float(roc_auc_score(y_true, y_prob)),\n        \"average_precision\"\
  : float(average_precision_score(y_true, y_prob)),\n        \"accuracy\":       \
  \   float(accuracy_score(y_true, y_pred)),\n        \"f1\":                float(f1_score(y_true,\
  \ y_pred)),\n    }\n    return metrics\n\ndef train_gnn(model, model_name,\n   \
  \           train_src, train_dst, train_y_t,\n              val_src, val_dst, val_y,\n\
  \              test_src, test_dst,\n              H_train, H_val, H_test,\n    \
  \          epochs=250, patience=30, lr=0.005):\n    optimizer = torch.optim.Adam(model.parameters(),\
  \ lr=lr, weight_decay=1e-3)\n    criterion = nn.BCEWithLogitsLoss()\n    best_val_auc,\
  \ best_state, counter = -1, None, 0\n\n    for epoch in range(1, epochs + 1):\n\
  \        model.train(); optimizer.zero_grad()\n        loss = criterion(model(X_nodes,\
  \ adj_norm, train_src, train_dst, H_train), train_y_t)\n        loss.backward();\
  \ optimizer.step()\n\n        model.eval()\n        with torch.no_grad():\n    \
  \        vp = torch.sigmoid(model(X_nodes, adj_norm, val_src, val_dst, H_val)).cpu().numpy()\n\
  \        val_auc = roc_auc_score(val_y, vp)\n\n        if val_auc > best_val_auc:\n\
  \            best_val_auc = val_auc\n            best_state   = {k: v.clone() for\
  \ k, v in model.state_dict().items()}\n            counter = 0\n        else:\n\
  \            counter += 1\n\n        if counter >= patience:\n            break\n\
  \n    model.load_state_dict(best_state); model.eval()\n    with torch.no_grad():\n\
  \        test_probs = torch.sigmoid(model(X_nodes, adj_norm, test_src, test_dst,\
  \ H_test)).cpu().numpy()\n    return test_probs\n\ndef predict_candidates(model_name,\
  \ models_dict, candidate_df, H_cand):\n    model = models_dict[model_name]\n   \
  \ if model_name in (\"Logistic Regression\", \"Random Forest\", \"XGBoost\"):\n\
  \        X_cand = build_pair_features(candidate_df)\n        return model.predict_proba(X_cand)[:,\
  \ 1]\n    elif model_name == \"MLP Link Predictor\":\n        X_cand   = build_pair_features(candidate_df)\n\
  \        X_cand_t = torch.tensor(X_cand, dtype=torch.float32).to(DEVICE)\n     \
  \   model.eval()\n        with torch.no_grad():\n            return torch.sigmoid(model(X_cand_t)).cpu().numpy()\n\
  \    else:\n        cand_src = torch.tensor([node_to_idx[n] for n in candidate_df[\"\
  source\"]], dtype=torch.long, device=DEVICE)\n        cand_dst = torch.tensor([node_to_idx[n]\
  \ for n in candidate_df[\"target\"]], dtype=torch.long, device=DEVICE)\n       \
  \ model.eval()\n        with torch.no_grad():\n            return torch.sigmoid(model(X_nodes,\
  \ adj_norm, cand_src, cand_dst, H_cand)).cpu().numpy()\n\ndef run_one_seed(SEED):\n\
  \    print(f\"\\\\n{'='*55}\\\\n  SEED = {SEED}\\\\n{'='*55}\")\n    set_seed(SEED)\n\
  \n    train_df, temp_df = train_test_split(dataset, test_size=0.30, random_state=SEED)\n\
  \    val_df,   test_df = train_test_split(temp_df,  test_size=0.50, random_state=SEED)\n\
  \n    y_train, y_val, y_test = train_df[\"label\"].values, val_df[\"label\"].values,\
  \ test_df[\"label\"].values\n\n    print(\"  Building pair features…\")\n    X_train_pair\
  \ = build_pair_features(train_df)\n    X_val_pair   = build_pair_features(val_df)\n\
  \    X_test_pair  = build_pair_features(test_df)\n\n    H_train = torch.tensor(build_heuristic_features(train_df),\
  \ dtype=torch.float32, device=DEVICE)\n    H_val   = torch.tensor(build_heuristic_features(val_df),\
  \   dtype=torch.float32, device=DEVICE)\n    H_test  = torch.tensor(build_heuristic_features(test_df),\
  \  dtype=torch.float32, device=DEVICE)\n\n    train_src, train_dst, train_y_t =\
  \ dataframe_to_link_tensors(train_df)\n    val_src,   val_dst,   _         = dataframe_to_link_tensors(val_df)\n\
  \    test_src,  test_dst,  _         = dataframe_to_link_tensors(test_df)\n\n  \
  \  X_train_t = torch.tensor(X_train_pair, dtype=torch.float32).to(DEVICE)\n    X_val_t\
  \   = torch.tensor(X_val_pair,   dtype=torch.float32).to(DEVICE)\n    X_test_t \
  \ = torch.tensor(X_test_pair,  dtype=torch.float32).to(DEVICE)\n    y_train_t =\
  \ torch.tensor(y_train,      dtype=torch.float32).to(DEVICE)\n\n    seed_results\
  \ = []\n    models_dict  = {}\n\n    print(\"  Training Logistic Regression…\")\n\
  \    lr_model = LogisticRegression(max_iter=1000, class_weight=\"balanced\", random_state=SEED)\n\
  \    lr_model.fit(X_train_pair, y_train)\n    lr_probs = lr_model.predict_proba(X_test_pair)[:,\
  \ 1]\n    m = evaluate_predictions(\"Logistic Regression\", y_test, lr_probs)\n\
  \    m[\"seed\"] = SEED; seed_results.append(m); models_dict[\"Logistic Regression\"\
  ] = lr_model\n\n    print(\"  Training Random Forest…\")\n    rf = RandomForestClassifier(n_estimators=100,\
  \ max_depth=8, min_samples_split=4, class_weight=\"balanced\", random_state=SEED)\n\
  \    rf.fit(X_train_pair, y_train)\n    rf_probs = rf.predict_proba(X_test_pair)[:,\
  \ 1]\n    m = evaluate_predictions(\"Random Forest\", y_test, rf_probs)\n    m[\"\
  seed\"] = SEED; seed_results.append(m); models_dict[\"Random Forest\"] = rf\n\n\
  \    print(\"  Training MLP…\")\n    mlp = PairMLP(input_dim=X_train_pair.shape[1]).to(DEVICE)\n\
  \    opt = torch.optim.Adam(mlp.parameters(), lr=0.001, weight_decay=1e-4)\n   \
  \ crit = nn.BCEWithLogitsLoss()\n    best_auc, best_state, pat_counter = -1, None,\
  \ 0\n    for epoch in range(1, 151):\n        mlp.train(); opt.zero_grad()\n   \
  \     loss = crit(mlp(X_train_t), y_train_t)\n        loss.backward(); opt.step()\n\
  \        mlp.eval()\n        with torch.no_grad(): vp = torch.sigmoid(mlp(X_val_t)).cpu().numpy()\n\
  \        va = roc_auc_score(y_val, vp)\n        if va > best_auc: best_auc, best_state,\
  \ pat_counter = va, {k: v.clone() for k,v in mlp.state_dict().items()}, 0\n    \
  \    else: pat_counter += 1\n        if pat_counter >= 30: break\n    mlp.load_state_dict(best_state);\
  \ mlp.eval()\n    with torch.no_grad(): mlp_probs = torch.sigmoid(mlp(X_test_t)).cpu().numpy()\n\
  \    m = evaluate_predictions(\"MLP Link Predictor\", y_test, mlp_probs)\n    m[\"\
  seed\"] = SEED; seed_results.append(m); models_dict[\"MLP Link Predictor\"] = mlp\n\
  \n    print(\"  Training XGBoost…\")\n    xgb_model = XGBClassifier(n_estimators=100,\
  \ max_depth=4, learning_rate=0.05,\n                              scale_pos_weight=len(y_train[y_train==0])\
  \ / max(len(y_train[y_train==1]), 1),\n                              random_state=SEED,\
  \ eval_metric=\"auc\", verbosity=0)\n    xgb_model.fit(X_train_pair, y_train, eval_set=[(X_val_pair,\
  \ y_val)], verbose=False)\n    xgb_probs = xgb_model.predict_proba(X_test_pair)[:,\
  \ 1]\n    m = evaluate_predictions(\"XGBoost\", y_test, xgb_probs)\n    m[\"seed\"\
  ] = SEED; seed_results.append(m); models_dict[\"XGBoost\"] = xgb_model\n\n    print(\"\
  \  Training GCN…\")\n    gcn = GCNLinkPredictionModel(in_dim=X_nodes.shape[1]).to(DEVICE)\n\
  \    gcn_probs = train_gnn(gcn, \"GCN\", train_src, train_dst, train_y_t, val_src,\
  \ val_dst, y_val, test_src, test_dst, H_train, H_val, H_test, epochs=150)\n    m\
  \ = evaluate_predictions(\"GCN Link Prediction\", y_test, gcn_probs)\n    m[\"seed\"\
  ] = SEED; seed_results.append(m); models_dict[\"GCN Link Prediction\"] = gcn\n\n\
  \    print(\"  Training GraphSAGE…\")\n    sage = GraphSAGELinkPredictionModel(in_dim=X_nodes.shape[1]).to(DEVICE)\n\
  \    sage_probs = train_gnn(sage, \"GraphSAGE\", train_src, train_dst, train_y_t,\
  \ val_src, val_dst, y_val, test_src, test_dst, H_train, H_val, H_test, epochs=150)\n\
  \    m = evaluate_predictions(\"GraphSAGE Link Prediction\", y_test, sage_probs)\n\
  \    m[\"seed\"] = SEED; seed_results.append(m); models_dict[\"GraphSAGE Link Prediction\"\
  ] = sage\n\n    best_model_name = max(seed_results, key=lambda x: x[\"roc_auc\"\
  ])[\"model\"]\n    print(f\"  Best model (seed={SEED}): {best_model_name}\")\n\n\
  \    candidate_df = pd.DataFrame(all_candidate_pairs, columns=[\"source\",\"target\"\
  ])\n    H_cand = torch.tensor(build_heuristic_features(candidate_df), dtype=torch.float32,\
  \ device=DEVICE)\n    candidate_df[\"probability\"]    = predict_candidates(best_model_name,\
  \ models_dict, candidate_df, H_cand)\n    candidate_df[\"known_positive\"] = candidate_df.apply(lambda\
  \ r: (r[\"source\"],r[\"target\"]) in positive_set, axis=1)\n    candidate_df[\"\
  source_type\"]    = candidate_df[\"source\"].map(dict(zip(nodes[\"label\"], nodes[\"\
  primary_type\"])))\n    candidate_df[\"target_type\"]    = candidate_df[\"target\"\
  ].map(dict(zip(nodes[\"label\"], nodes[\"primary_type\"])))\n    candidate_df[\"\
  seed\"]           = SEED\n    candidate_df[\"best_model\"]     = best_model_name\n\
  \    \n    # On stocke aussi le meilleur modèle dans l'environnement global (pour\
  \ le bloc API)\n    global best_pipeline_model\n    best_pipeline_model = models_dict[best_model_name]\n\
  \n    return seed_results, candidate_df.sort_values(\"probability\", ascending=False)\n\
  \n# Lancement boucle multi-seeds\nall_seed_results   = []\nall_recommendations =\
  \ []\n\nfor seed_val in SEEDS:\n    seed_results, candidate_df = run_one_seed(seed_val)\n\
  \    all_seed_results.extend(seed_results)\n    all_recommendations.append(candidate_df)\n\
  \nprint(\"\\n[MODELS] Toutes les seeds terminées ✓\")\n\n# Export the best model\
  \ to standard variable names for the API block\nif 'best_pipeline_model' in globals():\n\
  \    model = best_pipeline_model\n"
