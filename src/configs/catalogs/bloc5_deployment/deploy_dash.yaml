id: "deploy_dash"
name: "Deploy: Plotly Dash Web App"
description: "Génère une UI d'entreprise analytique complexe avec Plotly Dash."
category: "UI Generation"
tags: ["deploy", "ui", "dash", "plotly", "dashboard"]
applies_to: ["Classification", "Regression"]
when_to_use: "Pour des dashboards professionnels où un contrôle très fin sur le HTML/CSS est requis (contrairement à Streamlit)."
pros:
  - "Robuste, basé sur Flask, personnalisable à l'infini."
cons:
  - "Beaucoup plus verbeux que Streamlit."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Génération de l'application Dash...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "3_ui"
