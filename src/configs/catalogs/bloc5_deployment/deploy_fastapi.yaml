id: "deploy_fastapi"
name: "Deploy: FastAPI Server Generation"
description: "Génère un script serveur FastAPI complet (server.py) pour servir le modèle via une API REST."
category: "API Generation"
tags: ["deploy", "api", "fastapi", "rest", "python"]
applies_to: ["Classification", "Regression"]
when_to_use: "Quand vous voulez déployer le modèle en tant que micro-service interrogeable par requêtes HTTP (Swagger UI inclus)."
pros:
  - "Très rapide, moderne, asynchrone, génère la documentation automatiquement."
cons:
  - "Génère le code, mais ne lance pas le serveur (l'utilisateur doit lancer `uvicorn`)."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Génération de l'API FastAPI...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          # D'abord, on sauvegarde le modèle
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "2_api"
