id: "deploy_huggingface_hub"
name: "Deploy: Hugging Face Hub"
description: "Pousse le modèle directement sur un repository (Model Hub) d'Hugging Face."
category: "Cloud Services"
tags: ["deploy", "huggingface", "hub", "cloud", "model-sharing"]
applies_to: ["Classification", "Regression", "NLP", "Computer Vision"]
when_to_use: "Pour partager un modèle avec la communauté ou l'héberger gratuitement pour l'API Hugging Face Inference."
pros:
  - "Hébergement gratuit, versioning natif (Git LFS), écosystème très dynamique."
cons:
  - "Nécessite la librairie huggingface_hub et un token API."
code_template: |
  import os
  import joblib
  try:
      from huggingface_hub import HfApi, login
  except ImportError:
      HfApi = None

  deployment_artifacts = {}

  if 'full_pipeline' in locals() and HfApi is not None:
      print("[DEPLOY] Upload du modèle vers Hugging Face Hub...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          # Sauvegarde locale
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

_metadata:
  bloc: 5
  section: "5_cloud"
