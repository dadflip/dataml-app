id: "deploy_joblib"
name: "Deploy: Scikit-Learn Joblib"
description: "Sauvegarde le pipeline complet au format .joblib (le format recommandé par Scikit-Learn)."
category: "Serialization"
tags: ["deploy", "export", "joblib", "sklearn"]
applies_to: ["Classification", "Regression", "Clustering"]
when_to_use: "Pour sauvegarder n'importe quel pipeline basé sur Scikit-Learn."
pros:
  - "Plus performant que Pickle pour les gros tableaux NumPy."
cons:
  - "Lié à la version de Python et Scikit-Learn utilisée lors de l'entraînement."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Sauvegarde du modèle via Joblib...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "1_serialization"
