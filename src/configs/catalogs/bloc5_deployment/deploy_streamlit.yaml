id: "deploy_streamlit"
name: "Deploy: Streamlit Web UI"
description: "Génère une interface Web interactive complète en Streamlit pour tester le modèle en direct."
category: "UI Generation"
tags: ["deploy", "ui", "streamlit", "python", "dashboard"]
applies_to: ["Classification", "Regression"]
when_to_use: "Pour présenter le modèle à des parties prenantes non techniques via une jolie interface Web."
pros:
  - "UI moderne, composants riches, parfait pour la démonstration."
cons:
  - "Pas fait pour le traitement de masse (batch processing)."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Génération de l'application Streamlit...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.joblib"
          joblib.dump(full_pipeline, model_path)
          deployment_artifacts["model_path"] = model_path
          
          streamlit_code = """import streamlit as st
  import joblib
  import pandas as pd
  import numpy as np
  import json
  
  st.set_page_config(page_title="DataML App - Model Explorer", layout="wide")
  
  st.title("🚀 DataML App - Interface du Modèle")
  st.markdown("Interface générée automatiquement pour tester votre modèle.")
  
  @st.cache_resource
  def load_model():
      return joblib.load('model.joblib')
      
  model = load_model()
  
  st.sidebar.header("Saisie des Données")
  st.sidebar.markdown("Entrez un dictionnaire JSON valide représentant vos features :")
  
  default_json = '{\\n  "feature_1": 0.0,\\n  "feature_2": 1.0\\n}'
  user_input = st.sidebar.text_area("Données (JSON)", default_json, height=200)
  
  if st.sidebar.button("Prédire"):
      try:
          data_dict = json.loads(user_input)
          df = pd.DataFrame([data_dict])
          
          st.subheader("Données d'entrée")
          st.dataframe(df)
          
          with st.spinner('Inférence en cours...'):
              prediction = model.predict(df)
              
          st.success("Prédiction Réussie !")
          st.metric(label="Résultat Prédit", value=str(prediction[0]))
          
          if hasattr(model, 'predict_proba'):
              proba = model.predict_proba(df)[0]
              st.subheader("Probabilités")
              
              prob_df = pd.DataFrame({
                  "Classe": [str(c) for c in getattr(model, "classes_", range(len(proba)))],
                  "Probabilité": proba
              })
              st.bar_chart(prob_df.set_index("Classe"))
              
      except Exception as e:
          st.error(f"Erreur lors de la prédiction : {str(e)}")
  """
          
          ui_script_path = "outputs/deployment/app.py"
          with open(ui_script_path, "w", encoding="utf-8") as f:
              f.write(streamlit_code)
              
          deployment_artifacts["streamlit_script"] = ui_script_path
          print(f"[DEPLOY] Application Streamlit générée sous {ui_script_path}")
          print(f"[DEPLOY] Pour lancer : cd outputs/deployment && streamlit run app.py")
      except Exception as e:
          print(f"[DEPLOY ERREUR] Streamlit : {str(e)}")
