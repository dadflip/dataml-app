id: "deploy_streamlit"
name: "Deploy: Streamlit Web UI"
description: "Génère une interface Web interactive complète en Streamlit pour tester le modèle en direct."
category: "UI Generation"
tags: ["deploy", "ui", "streamlit", "python", "dashboard"]
applies_to: ["Classification", "Regression"]
when_to_use: "Pour présenter le modèle à des parties prenantes non techniques via une jolie interface Web."
pros:
  - "UI moderne, composants riches, parfait pour la démonstration."
cons:
  - "Pas fait pour le traitement de masse (batch processing)."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Génération de l'application Streamlit...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "3_ui"
