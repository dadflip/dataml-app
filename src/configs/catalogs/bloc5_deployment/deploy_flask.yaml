id: "deploy_flask"
name: "Deploy: Flask Server Generation"
description: "Génère un serveur API REST basique avec Flask."
category: "API Generation"
tags: ["deploy", "api", "flask", "rest", "python"]
applies_to: ["Classification", "Regression"]
when_to_use: "Pour des déploiements legacy ou des équipes familières avec Flask plutôt que FastAPI."
pros:
  - "Très mature, immense écosystème."
cons:
  - "Pas asynchrone par défaut, pas de documentation automatique (Swagger)."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Génération de l'API Flask...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "2_api"
