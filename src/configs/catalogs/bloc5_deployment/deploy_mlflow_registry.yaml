id: "deploy_mlflow_registry"
name: "Deploy: MLflow Model Registry"
description: "Enregistre le modèle, ses paramètres et ses métriques dans un serveur MLflow local."
category: "Model Registry"
tags: ["deploy", "mlops", "mlflow", "tracking"]
applies_to: ["Classification", "Regression", "Clustering"]
when_to_use: "Au cœur d'une stratégie MLOps pour versionner les modèles au fil du temps et suivre leurs performances."
pros:
  - "Indispensable pour la gouvernance et la reproductibilité des modèles (MLOps)."
cons:
  - "Nécessite qu'un serveur MLflow tourne."
code_template: |
  import os
  try:
      import mlflow
      import mlflow.sklearn
  except ImportError:
      mlflow = None

  deployment_artifacts = {}

  if 'full_pipeline' in locals() and mlflow is not None:
      print("[DEPLOY] Logging du modèle vers MLflow...")
      try:
          # Configuration du dossier local de tracking
          os.makedirs("outputs/mlruns", exist_ok=True)
          mlflow.set_tracking_uri("file://" + os.path.abspath("outputs/mlruns"))
          
          # Nom de l'expérience basé sur le type de tâche
          exp_name = task_type if 'task_type' in locals() else "DataML_Experiment"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

_metadata:
  bloc: 5
  section: "5_mlops"
