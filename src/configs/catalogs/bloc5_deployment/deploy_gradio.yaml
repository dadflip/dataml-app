id: "deploy_gradio"
name: "Deploy: Gradio Web UI"
description: "Génère une interface Gradio pour tester le modèle rapidement dans le navigateur."
category: "UI Generation"
tags: ["deploy", "ui", "gradio", "python", "dashboard"]
applies_to: ["Classification", "Regression", "NLP Generation", "Computer Vision"]
when_to_use: "Excellent pour les modèles de Deep Learning (images, textes) grâce aux inputs natifs drag-and-drop."
pros:
  - "Moins de code que Streamlit pour des inputs complexes (image, audio)."
cons:
  - "Moins personnalisable visuellement que Streamlit."
code_template: |
  import os
  import joblib

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Génération de l'application Gradio...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.joblib"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "3_ui"
