id: "deploy_dockerfile"
name: "Deploy: FastAPI Dockerfile"
description: "Génère un Dockerfile et un requirements.txt pour conteneuriser l'API FastAPI du modèle."
category: "Containerization"
tags: ["deploy", "docker", "fastapi", "container"]
applies_to: ["Classification", "Regression"]
when_to_use: "Pour déployer le modèle sur n'importe quel cloud provider (AWS ECS, Google Cloud Run, Azure Container Apps)."
pros:
  - "Standard de l'industrie pour le déploiement de micro-services."
cons:
  - "Nécessite que Docker soit installé pour builder."
code_template: |
  import os

  deployment_artifacts = {}

  print("[DEPLOY] Génération des fichiers Docker...")
  try:
      os.makedirs("outputs/deployment", exist_ok=True)
      
      # 1. requirements.txt
      reqs = """fastapi==0.103.1
  uvicorn==0.23.2
  scikit-learn
  pandas
  numpy
  pydantic
  joblib
  """
      req_path = "outputs/deployment/requirements.txt"
      with open(req_path, "w") as f:
          f.write(reqs)
          
      # 2. Dockerfile
      dockerfile = """FROM python:3.9-slim
  
  WORKDIR /app
  
  # Installation des dépendances
  COPY requirements.txt .
  RUN pip install --no-cache-dir -r requirements.txt
  
  # Copie des fichiers locaux (modèle + serveur API)
  # Assurez-vous d'avoir généré server.py et model.joblib d'abord
  COPY . .
  
  # Exposition du port
  EXPOSE 8000
  
  # Commande de lancement
  CMD ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
  """
      docker_path = "outputs/deployment/Dockerfile"
      with open(docker_path, "w") as f:
          f.write(dockerfile)
          
      deployment_artifacts["dockerfile"] = docker_path
      deployment_artifacts["requirements"] = req_path
      
      print(f"[DEPLOY] Fichiers Docker générés.")
      print(f"[DEPLOY] Pour builder : cd outputs/deployment && docker build -t dataml_model_api .")
      print(f"[DEPLOY] Pour run : docker run -p 8000:8000 dataml_model_api")
  except Exception as e:
      print(f"[DEPLOY ERREUR] Docker : {str(e)}")
_metadata:
  bloc: 5
  section: "4_container"
