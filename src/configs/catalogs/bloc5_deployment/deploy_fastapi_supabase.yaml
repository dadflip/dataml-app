id: "deploy_fastapi_supabase"
name: "Deploy: FastAPI + Supabase Logging"
description: "Déploie le modèle avec FastAPI et utilise Supabase pour stocker l'historique des prédictions (MLOps tracking)."
category: "Deployment"
tags: ["deployment", "fastapi", "supabase", "mlops", "api"]
applies_to: ["Tabulaire", "Images", "Texte"]
when_to_use: "Pour exposer votre modèle via API et sauvegarder automatiquement chaque requête/prédiction dans une base de données Supabase."
pros:
  - "Intégration MLOps facile (stockage des logs)."
  - "FastAPI est asynchrone et performant."
cons:
  - "Nécessite un projet Supabase actif."
hyperparameters:
  supabase_url: "L'URL de votre projet Supabase."
  supabase_key: "Votre clé API (service_role ou anon)."
  table_name: "Nom de la table pour les logs (ex: 'predictions_log')."
code_template: |
  import os
  import joblib
  
  # [PARAM: SUPABASE_URL | string]
  SUPABASE_URL = "https://xyzcompany.supabase.co"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "5_cloud"
