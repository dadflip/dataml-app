id: "deploy_pickle"
name: "Deploy: Standard Pickle"
description: "Sauvegarde le modèle en utilisant le standard Pickle de Python."
category: "Serialization"
tags: ["deploy", "export", "pickle", "python"]
applies_to: ["Classification", "Regression", "Clustering"]
when_to_use: "Pour des modèles non Scikit-Learn ou quand joblib n'est pas disponible."
pros:
  - "Standard natif Python, pas de dépendance externe requise."
cons:
  - "Problèmes potentiels de sécurité (exécution de code arbitraire au chargement) et de compatibilité de version."
code_template: |
  import os
  import pickle

  deployment_artifacts = {}

  if 'full_pipeline' in locals():
      print("[DEPLOY] Sauvegarde du modèle via Pickle...")
      try:
          os.makedirs("outputs/deployment", exist_ok=True)
          
          model_path = "outputs/deployment/model.pkl"
illustration_mermaid: |
    graph LR
      Model((Model)) --> API{{API Endpoint}}
      API --> Client([Client App])
      style API fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 5
  section: "1_serialization"
