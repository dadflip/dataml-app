code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.neighbors import LocalOutlierFactor
  from sklearn.base import BaseEstimator, OutlierMixin
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: N_NEIGHBORS | number]
  N_NEIGHBORS = 20
  # [/PARAM]

  # [PARAM: CONTAMINATION | number]
  CONTAMINATION = 0.05
  # [/PARAM]

  print(f"[MODEL] Initialisation Local Outlier Factor (k={N_NEIGHBORS}, cont={CONTAMINATION})...")

  class LOFAnomalyWrapper(BaseEstimator, OutlierMixin):
      def __init__(self, n_neighbors=20, contamination=0.1):
          self.n_neighbors = n_neighbors
          self.contamination = contamination
          self.model = LocalOutlierFactor(
              n_neighbors=self.n_neighbors, 
              contamination=self.contamination, 
              novelty=True
          )
          
      def fit(self, X, y=None):
          self.model.fit(X)
          return self
          
      def predict(self, X):
          preds = self.model.predict(X)
          return np.where(preds == -1, 1, 0)
          
      def decision_function(self, X):
          return self.model.decision_function(X)
          
      def predict_proba(self, X):
          scores = -self.model.decision_function(X) 
          scores = np.clip(scores, 0, None)
          proba = 1 / (1 + np.exp(-scores)) # Pseudo-probability of anomaly
          return np.column_stack([1 - proba, proba])

  model = LOFAnomalyWrapper(n_neighbors=int(N_NEIGHBORS), contamination=float(CONTAMINATION))

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "anomaly_detection"
  meta = {}

  if 'X_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline avec LOF...")
      full_pipeline.fit(X_train)
      y_pred = full_pipeline.predict(X_test)
      y_proba = full_pipeline.predict_proba(X_test)
      
      training_history = {"status": "success", "anomalies_found": int(np.sum(y_pred))}
