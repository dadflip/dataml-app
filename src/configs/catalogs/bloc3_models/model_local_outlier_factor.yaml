id: "model_local_outlier_factor"
name: "Model: Local Outlier Factor (LOF)"
description: |
  Algorithme de détection d'anomalies basé sur la densité locale (Local Outlier Factor). Il évalue à quel point la densité autour d'un point est faible comparée à celle de ses voisins, permettant ainsi de repérer des "anomalies locales" dans des jeux de données complexes.
category: "Détection d'Anomalies (Non-Supervisé)"
tags: ["model", "anomaly-detection", "tabular", "sklearn", "lof"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour identifier des anomalies contextuelles, c'est-à-dire des points qui ne sont pas nécessairement des valeurs extrêmes à l'échelle globale, mais qui sont isolés par rapport à la distribution de leur voisinage direct.
use_cases:
  - "Détection de fraude où les comportements frauduleux tentent de se fondre dans la masse mais créent de légères déviations locales."
  - "Surveillance de serveurs réseau pour déceler des comportements anormaux dans des sous-clusters spécifiques de trafic."
  - "Contrôle qualité dans la fabrication industrielle pour des composants hétérogènes."
pros:
  - "Excellent pour détecter les anomalies locales qui échappent aux méthodes globales (comme Isolation Forest)."
  - "S'adapte très bien aux ensembles de données contenant des groupes (clusters) de densités différentes."
  - "Approche non supervisée qui ne nécessite pas d'étiquettes d'entraînement."
cons:
  - "Très gourmand en ressources et lent sur les grands jeux de données (calcul de distances croisées)."
  - "Sensible au choix du nombre de voisins (k) et au paramètre de contamination."
  - "Moins performant si les anomalies forment elles-mêmes des clusters denses."
hyperparameters:
  n_neighbors: "Nombre de voisins K (ex: 20)."
  contamination: "Proportion d'anomalies attendue (ex: 0.05)."
math_theory: |
  L'algorithme Local Outlier Factor (LOF) compare la densité d'un point $\textcolor{#10b981}{x}$ à celle de ses $k$ plus proches voisins. Il est basé sur la densité d'accessibilité locale $\textcolor{#fbbf24}{lrd_k(x)}$. Le score d'anomalie $\textcolor{#ef4444}{LOF_k(x)}$ est le ratio moyen du $\textcolor{#fbbf24}{lrd}$ des voisins sur le $\textcolor{#fbbf24}{lrd}$ de $\textcolor{#10b981}{x}$ :
  
  $$
  \textcolor{#ef4444}{LOF_k(x)} = \frac{\sum_{o \in \textcolor{#3b82f6}{N_k(x)}} \frac{\textcolor{#fbbf24}{lrd_k(o)}}{\textcolor{#fbbf24}{lrd_k(x)}}}{|\textcolor{#3b82f6}{N_k(x)}|}
  $$
  
  Un $\textcolor{#ef4444}{LOF} \approx 1$ indique une densité comparable à celle de son voisinage (point normal). Un $\textcolor{#ef4444}{LOF} > 1$ indique une densité plus faible, qualifiant le point d'anomalie locale.
