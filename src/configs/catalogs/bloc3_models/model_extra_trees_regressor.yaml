id: "model_extra_trees_regressor"
name: "Model: Extra Trees Regressor"
description: |
  Algorithme d'ensemble basé sur les arbres de décision (Extremely Randomized Trees) adapté à la régression. À l'image de la version pour la classification, il utilise des points de coupure aléatoires au lieu de rechercher le seuil optimal. Cette approche permet de créer une surface de prédiction plus lisse et réduit la variance du modèle.
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: |
  Utilisez ce modèle en remplacement du Random Forest classique lorsque vous observez un sur-apprentissage (overfitting), ou pour réduire le temps d'entraînement sur des jeux de données de grande taille.
use_cases:
  - "Régression sur de gros volumes de données où le Random Forest devient trop lent."
  - "Modélisation de cibles continues bruitées avec nécessité de réduire fortement la variance."
  - "Approche de référence (baseline) robuste pour presque tous les problèmes tabulaires de régression."
pros:
  - "Extrêmement rapide à entraîner, même avec un grand nombre d'arbres et de variables."
  - "Crée des prédictions plus 'lissées' que Random Forest grâce au moyennage de coupures aléatoires."
  - "Performances très honorables par défaut sans réglages complexes."
cons:
  - "Incapable d'extrapoler des valeurs au-delà des bornes observées dans l'ensemble d'entraînement."
  - "Biais théorique potentiellement plus important que pour un Random Forest classique."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
math_theory: |
  Pour la régression, Extra Trees (Extremely Randomized Trees) applique le même principe de coupures aléatoires.
  
  Pour chaque variable $\textcolor{#fbbf24}{X_j}$ testée à un nœud, un seuil $\textcolor{#8b5cf6}{s_j}$ est tiré uniformément entre ses bornes locales :
  $$ \textcolor{#8b5cf6}{s_j} \sim Uniform(\min(\textcolor{#fbbf24}{X_j}), \max(\textcolor{#fbbf24}{X_j})) $$
  
  Le meilleur seuil parmi ces coupures aléatoires est choisi pour minimiser l'Erreur Quadratique Moyenne (MSE) des nœuds enfants :
  $$ \textcolor{#3b82f6}{MSE(D)} = \frac{1}{|D|} \sum_{i \in D} (y_i - \bar{y})^2 $$
  
  En introduisant cet aléa fort sur les seuils, la surface de régression finale devient beaucoup plus lisse que celle d'une Forêt Aléatoire classique, réduisant la variance du modèle.
  
  La prédiction finale $\textcolor{#ef4444}{\hat{y}}$ est la moyenne des prédictions des $T$ arbres :
  $$ \textcolor{#ef4444}{\hat{y}} = \frac{1}{T} \sum_{t=1}^T \textcolor{#10b981}{h_t}(x) $$
