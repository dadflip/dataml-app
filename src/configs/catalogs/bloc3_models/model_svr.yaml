id: "model_svr"
name: "Model: Support Vector Regressor (SVR)"
description: |
  Régression à vecteurs de support. Utilise l'astuce du noyau (Kernel Trick) pour modéliser des relations non linéaires complexes. L'objectif est de trouver une fonction qui dévie au maximum d'une valeur $\epsilon$ (epsilon) des cibles réelles pour l'ensemble d'entraînement.
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "regression", "tabular", "sklearn", "svm"]
applies_to: ["Tabulaire"]
when_to_use: |
  Jeux de données de petite à moyenne taille (généralement < 10 000 échantillons) présentant des relations non linéaires complexes. Très utile lorsque l'on souhaite contrôler la tolérance à l'erreur via le paramètre epsilon.
use_cases:
  - "Prévision de séries temporelles avec des composantes non linéaires (ex: prévision de charge électrique)."
  - "Modélisation de propriétés physico-chimiques en sciences des matériaux ou chimie."
  - "Prévision de la demande ou des prix sur des marchés de niche avec des données de taille modérée."
pros:
  - "Très performant dans les espaces de dimension modérée à grande."
  - "Robuste face aux valeurs aberrantes grâce à la marge de tolérance $\epsilon$ (tube epsilon-insensible)."
  - "Grande flexibilité de modélisation offerte par les différents noyaux disponibles."
cons:
  - "Temps d'entraînement prohibitif sur les grands ensembles de données (> 10 000 échantillons)."
  - "Exige un prétraitement rigoureux des données, notamment une standardisation stricte."
  - "Sensibilité élevée aux choix des hyperparamètres (C, $\epsilon$ et paramètres du noyau)."
hyperparameters:
  kernel: "Noyau ('rbf', 'poly', 'linear', 'sigmoid')."
  C: "Pénalité."
  epsilon: "Marge de tolérance d'erreur (ex: 0.1)."
math_theory: |
  Le SVR cherche une fonction d'approximation qui tolère une erreur de prédiction jusqu'à un certain seuil (le tube $\textcolor{#10b981}{\epsilon}$) et pénalise les erreurs au-delà en utilisant des variables d'écart $\textcolor{#ef4444}{\xi_i}, \textcolor{#ef4444}{\xi_i^*}$.
  
  L'objectif primal est :

  $$
  \min_{\textcolor{#3b82f6}{w}, b, \textcolor{#ef4444}{\xi}, \textcolor{#ef4444}{\xi^*}} \frac{1}{2} \|\textcolor{#3b82f6}{w}\|^2 + \textcolor{#fbbf24}{C} \sum_{i=1}^{n} (\textcolor{#ef4444}{\xi_i} + \textcolor{#ef4444}{\xi_i^*})
  $$
  
  Sous les contraintes (pour chaque point $\textcolor{#fbbf24}{x_i}$) :

  $$
  \textcolor{#8b5cf6}{y_i} - (\textcolor{#3b82f6}{w}^T \phi(\textcolor{#fbbf24}{x_i}) + b) \leq \textcolor{#10b981}{\epsilon} + \textcolor{#ef4444}{\xi_i}
  $$

  $$
  (\textcolor{#3b82f6}{w}^T \phi(\textcolor{#fbbf24}{x_i}) + b) - \textcolor{#8b5cf6}{y_i} \leq \textcolor{#10b981}{\epsilon} + \textcolor{#ef4444}{\xi_i^*}
  $$

  $$
  \textcolor{#ef4444}{\xi_i}, \textcolor{#ef4444}{\xi_i^*} \geq 0
  $$
  
  - $\textcolor{#3b82f6}{w}$ : Vecteur de poids (détermine la régularité de la fonction).
  - $\textcolor{#10b981}{\epsilon}$ : Marge du tube de tolérance où l'erreur n'est pas pénalisée.
  - $\textcolor{#ef4444}{\xi_i}, \textcolor{#ef4444}{\xi_i^*}$ : Variables d'écart mesurant l'erreur au-dessus et en dessous du tube.
  - $\textcolor{#fbbf24}{C}$ : Paramètre de régularisation pénalisant les erreurs en dehors du tube.
  - $\textcolor{#8b5cf6}{y_i}$ : Cible continue.
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import SVR

  # [PARAM: KERNEL | string]
  KERNEL = "rbf"
