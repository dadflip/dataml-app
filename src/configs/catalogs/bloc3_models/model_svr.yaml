math_illustration_svg: |
  <svg viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="250" fill="#f8fafc" rx="10" />
    
    <!-- Axes limit-->
    <rect x="50" y="30" width="400" height="190" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="5" />
    
    <!-- Epsilon Tube Area -->
    <polygon points="60,180 360,40 440,80 140,220" fill="#10b981" opacity="0.1" />
    
    <!-- Regression Function f(x) = w^T x + b -->
    <line x1="100" y1="200" x2="400" y2="60" stroke="#3b82f6" stroke-width="3" />
    <text x="410" y="65" font-family="Arial" font-size="12" fill="#3b82f6" font-weight="bold">f(x)</text>
    
    <!-- Epsilon Boundaries f(x) + e and f(x) - e -->
    <line x1="60" y1="180" x2="360" y2="40" stroke="#10b981" stroke-width="2" stroke-dasharray="5" />
    <line x1="140" y1="220" x2="440" y2="80" stroke="#10b981" stroke-width="2" stroke-dasharray="5" />
    <text x="370" y="45" font-family="Arial" font-size="12" fill="#10b981">+ ε</text>
    <text x="450" y="85" font-family="Arial" font-size="12" fill="#10b981">- ε</text>
    <text x="210" y="210" font-family="Arial" font-size="12" fill="#10b981" font-style="italic">Tube Epsilon-Insensible</text>
    
    <!-- Points inside tube (Error = 0) -->
    <circle cx="150" cy="150" r="5" fill="#94a3b8" />
    <circle cx="200" cy="140" r="5" fill="#94a3b8" />
    <circle cx="250" cy="130" r="5" fill="#94a3b8" />
    <circle cx="300" cy="110" r="5" fill="#94a3b8" />
    <circle cx="350" cy="80" r="5" fill="#94a3b8" />
    
    <!-- Points outside tube (Support Vectors) -->
    <!-- Point above tube -> xi -->
    <circle cx="220" cy="70" r="6" fill="#8b5cf6" />
    <circle cx="220" cy="70" r="10" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="2" />
    <line x1="220" y1="70" x2="220" y2="105" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="225" y="85" font-family="Arial" font-size="14" fill="#ef4444" font-weight="bold">ξ_i</text>
    
    <!-- Point below tube -> xi* -->
    <circle cx="300" cy="180" r="6" fill="#8b5cf6" />
    <circle cx="300" cy="180" r="10" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="2" />
    <line x1="300" y1="180" x2="300" y2="145" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
    <text x="310" y="170" font-family="Arial" font-size="14" fill="#ef4444" font-weight="bold">ξ_i*</text>
    
    <defs>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
      </marker>
    </defs>
  </svg>
