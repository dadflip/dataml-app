  flowchart LR
    Data(["Données Tabulaires d'Entrée"])
    Params[/"Hyperparamètres (C, epsilon, kernel)"/]
    Model{"Support Vector Regressor (SVR)"}
    Pred(["Prédictions Continues"])
    
    Data --> Model
    Params --> Model
    Model --> Pred

