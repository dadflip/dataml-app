id: "model_catboost_regressor"
name: "Model: CatBoost Regressor"
description: "CatBoost pour la régression. Performant avec de nombreuses variables catégorielles."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "catboost", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "Gros datasets avec beaucoup de features textuelles/catégorielles."
pros:
  - "Très robuste."
cons:
  - "Inférence potentiellement plus lente."
hyperparameters:
  iterations: "Nombre d'itérations (ex: 500)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  depth: "Profondeur des arbres (ex: 6)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from catboost import CatBoostRegressor
  except ImportError:
      CatBoostRegressor = None
      print("[ERREUR] catboost n'est pas installé. Lancez : !pip install catboost")

  # [PARAM: ITERATIONS | number]
  ITERATIONS = 500
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: DEPTH | number]
  DEPTH = 6
  # [/PARAM]

  print(f"[MODEL] Entraînement CatBoost Regressor (iter={ITERATIONS}, lr={LEARNING_RATE}, depth={DEPTH})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {"model_name": "CatBoost Regressor"}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and CatBoostRegressor is not None:
      cat_features = []
      
      # Determine cat features without mutating the external reference
      if isinstance(X_train, pd.DataFrame):
          cat_features_idx = list(np.where(X_train.dtypes == 'object')[0]) + list(np.where(X_train.dtypes == 'category')[0])
          cat_features_idx = list(set(cat_features_idx))
          
          if len(cat_features_idx) > 0:
              X_train_cb = X_train.copy()
              X_test_cb = X_test.copy()
              cat_cols = X_train.columns[cat_features_idx]
              for c in cat_cols:
                  X_train_cb[c] = X_train_cb[c].fillna("MISSING").astype(str)
                  X_test_cb[c] = X_test_cb[c].fillna("MISSING").astype(str)
              X_train = X_train_cb
              X_test = X_test_cb
              cat_features = cat_features_idx
              
      model = CatBoostRegressor(
          iterations=int(ITERATIONS), 
          learning_rate=float(LEARNING_RATE), 
          depth=int(DEPTH),
          cat_features=cat_features if len(cat_features) > 0 else None,
          verbose=0,
          random_seed=42
      )
      
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          
          steps = list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)]
          steps.append(('model', model))
          full_pipeline = Pipeline(steps=steps)
      else:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      full_pipeline.fit(X_train, y_train)
      model = full_pipeline.named_steps['model']
      
      y_pred = full_pipeline.predict(X_test)
      
      if hasattr(model, 'feature_importances_'):
          if 'feature_names_out' in locals() and feature_names_out is not None:
              if len(model.feature_importances_) == len(feature_names_out):
                  feature_importances = pd.Series(model.feature_importances_, index=feature_names_out).sort_values(ascending=False)
              else:
                  feature_importances = pd.Series(model.feature_importances_).sort_values(ascending=False)
          else:
              feature_importances = pd.Series(model.feature_importances_).sort_values(ascending=False)
              
      training_history = {
          "status": "success", 
          "fitted_on": len(X_train), 
          "best_iteration": model.get_best_iteration()
      }

illustration_mermaid: |
    graph TD
      subgraph Features Handling
        Data([X_train]) --> CatSplit{Categorical\nColumns?}
        CatSplit -- Yes --> TargetEnc[Target Statistics\nEncoding on the fly]
        CatSplit -- No --> NumSplit[Numeric features]
      end
      
      subgraph CatBoost Oblivious Trees
        TargetEnc --> Tree1[Oblivious Tree 1\nSymmetric Splits]
        NumSplit --> Tree1
        Tree1 -- Residuals --> Tree2[Oblivious Tree 2]
        Tree2 -- Residuals --> TreeN[Oblivious Tree N]
      end
      
      subgraph Aggregation
        TreeN --> Sum((Sum of leaves))
        Sum --> Pred([Predictions])
      end
      
      style TargetEnc fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Tree1 fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style Tree2 fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style TreeN fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style Sum fill:#a78bfa,stroke:#7c3aed,stroke-width:1px,color:#fff
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

