id: "model_catboost_regressor"
name: "Model: CatBoost Regressor"
description: |
  Version régression de l'algorithme CatBoost, reconnu pour sa robustesse et sa gestion
  native des variables catégorielles. Utilise des arbres de décision symétriques (oblivious trees).
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "catboost", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Recommandé pour la prédiction de valeurs continues sur des datasets tabulaires volumineux,
  en particulier lorsque les variables explicatives sont majoritairement catégorielles ou textuelles.
use_cases:
  - "Prévision de prix immobiliers avec de nombreuses caractéristiques géographiques ou textuelles."
  - "Estimation de la valeur à vie d'un client (LTV)."
  - "Modélisation de risques ou prévision de demande."
pros:
  - "Extrêmement robuste face au surapprentissage."
  - "Gestion native et optimale des données catégorielles (Target Statistics)."
cons:
  - "Inférence potentiellement plus lente que certains concurrents."
  - "Le poids du modèle en mémoire peut être conséquent."
hyperparameters:
  iterations: "Nombre d'itérations (ex: 500)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  depth: "Profondeur des arbres (ex: 6)."
math_theory: |
  Pour la régression, CatBoost conserve son architecture d'arbres symétriques (Oblivious Trees) et son **Ordered Target Encoding** pour les variables catégorielles.
  
  L'encodage cible sur données continues (régression) remplace les classes par la valeur cible continue $\textcolor{#3b82f6}{y_j}$ :
  $$ \textcolor{#10b981}{\hat{x}_{i,k}} = \frac{\sum_{j=1}^{i-1} [x_{j,k} = x_{i,k}] \cdot \textcolor{#3b82f6}{y_j} + \textcolor{#fbbf24}{a} \cdot \textcolor{#ef4444}{P}}{\sum_{j=1}^{i-1} [x_{j,k} = x_{i,k}] + \textcolor{#fbbf24}{a}} $$
  
  Où :
  - La somme se fait sur une permutation aléatoire ($j < i$).
  - $\textcolor{#fbbf24}{a}$ est le lissage (prior weight).
  - $\textcolor{#ef4444}{P}$ est la valeur a priori pour la régression, typiquement la moyenne globale de la variable cible continue.
  
  Les gradients sont optimisés selon une fonction de perte de régression (ex: RMSE). Le modèle additif final $\textcolor{#8b5cf6}{F(x)}$ minimise les résidus :
  $$ \textcolor{#ef4444}{L}(y, F(x)) = \frac{1}{2} \left(y - \sum_{t=1}^T \eta \cdot \textcolor{#10b981}{h_t}(x) \right)^2 $$
