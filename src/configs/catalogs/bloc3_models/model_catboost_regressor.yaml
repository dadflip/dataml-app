id: "model_catboost_regressor"
name: "Model: CatBoost Regressor"
description: "CatBoost pour la régression. Performant avec de nombreuses variables catégorielles."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "catboost", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "Gros datasets avec beaucoup de features textuelles/catégorielles."
pros:
  - "Très robuste."
cons:
  - "Inférence potentiellement plus lente."
hyperparameters:
  iterations: "Nombre d'itérations (ex: 500)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  depth: "Profondeur des arbres (ex: 6)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from catboost import CatBoostRegressor
  except ImportError:
      CatBoostRegressor = None
      print("[ERREUR] catboost n'est pas installé. Lancez : !pip install catboost")

  # [PARAM: ITERATIONS | number]
  ITERATIONS = 500
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: DEPTH | number]
  DEPTH = 6
  # [/PARAM]

  print(f"[MODEL] Entraînement CatBoost Regressor (iter={ITERATIONS}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and CatBoostRegressor is not None:
      cat_features = []
      if isinstance(X_train, pd.DataFrame):
          cat_features = list(X_train.select_dtypes(include=['object', 'category']).columns)
          for c in cat_features:
              X_train[c] = X_train[c].fillna("MISSING").astype(str)
              X_test[c] = X_test[c].fillna("MISSING").astype(str)
              
      model = CatBoostRegressor(
          iterations=int(ITERATIONS), 
          learning_rate=float(LEARNING_RATE), 
          depth=int(DEPTH),
          cat_features=cat_features if cat_features else None,
          verbose=0,
          random_seed=42
      )
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
      print("[MODEL] Modèle entraîné et Full Pipeline compilé avec succès.")
  else:
      print("[ERREUR] Données d'entraînement ou module catboost introuvables.")
