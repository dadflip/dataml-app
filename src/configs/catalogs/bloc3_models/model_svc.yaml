id: "model_svc"
name: "Model: Support Vector Classifier (SVC)"
description: "Séparateur à Vaste Marge avec noyau (Kernel Trick) pour séparer des classes non-linéairement séparables."
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "classification", "tabular", "sklearn", "svm"]
applies_to: ["Tabulaire"]
when_to_use: "Jeux de données de petite taille (< 10 000 échantillons) mais très complexes."
pros:
  - "Très puissant en haute dimension."
  - "Versatile grâce au choix du noyau."
cons:
  - "Temps d'entraînement O(n^2) ou pire."
  - "Sensible au non-scaling des données."
hyperparameters:
  kernel: "Noyau ('rbf', 'poly', 'linear', 'sigmoid')."
  C: "Paramètre de pénalité."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import SVC

  # [PARAM: KERNEL | string]
  KERNEL = "rbf"
  # [/PARAM]

  # [PARAM: C_PARAM | number]
  C_PARAM = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement SVC (kernel={KERNEL}, C={C_PARAM})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = SVC(kernel=KERNEL, C=float(C_PARAM), probability=True, random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
      if 'feature_names_out' in locals() and KERNEL == "linear":
          coefs = np.abs(model.coef_).mean(axis=0) if model.coef_.ndim > 1 else np.abs(model.coef_[0])
          if len(coefs) == len(feature_names_out):
              feature_importances = pd.Series(coefs, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      print("[MODEL] Modèle entraîné et Full Pipeline compilé avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables.")
