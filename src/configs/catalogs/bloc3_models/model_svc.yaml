id: "model_svc"
name: "Model: Support Vector Classifier (SVC)"
description: "Séparateur à Vaste Marge avec noyau (Kernel Trick) pour séparer des classes non-linéairement séparables."
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "classification", "tabular", "sklearn", "svm"]
applies_to: ["Tabulaire"]
when_to_use: "Jeux de données de petite taille (< 10 000 échantillons) mais très complexes."
pros:
  - "Très puissant en haute dimension."
  - "Versatile grâce au choix du noyau."
cons:
  - "Temps d'entraînement O(n^2) ou pire."
  - "Sensible au non-scaling des données."
hyperparameters:
  kernel: "Noyau ('rbf', 'poly', 'linear', 'sigmoid')."
  C: "Paramètre de pénalité."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import SVC

  # [PARAM: KERNEL | string]
  KERNEL = "rbf"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

