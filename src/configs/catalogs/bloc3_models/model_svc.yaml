id: "model_svc"
name: "Model: Support Vector Classifier (SVC)"
description: |
  Séparateur à Vaste Marge avec noyau (Kernel Trick) pour séparer des classes non-linéairement séparables. L'algorithme cherche à trouver l'hyperplan optimal maximisant la marge entre les classes dans un espace de grande dimension.
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "classification", "tabular", "sklearn", "svm"]
applies_to: ["Tabulaire"]
when_to_use: |
  Jeux de données de petite à moyenne taille (généralement < 10 000 échantillons) mais très complexes ou de grande dimension. Idéal lorsque le nombre de variables est supérieur au nombre d'observations, ou quand la frontière de décision est hautement non linéaire.
use_cases:
  - "Classification de textes, analyse de sentiments et filtrage anti-spam."
  - "Reconnaissance d'images, classification de caractères manuscrits."
  - "Problèmes de bio-informatique (ex: classification de séquences génétiques)."
pros:
  - "Très puissant et robuste en haute dimension, même si le nombre de features dépasse le nombre d'échantillons."
  - "Extrêmement versatile grâce au choix de la fonction noyau (RBF, polynomial, linéaire)."
  - "Efficace en mémoire car il ne s'appuie que sur les vecteurs de support pour prendre des décisions."
cons:
  - "Complexité algorithmique d'entraînement en $\\mathcal{O}(n^2)$ ou $\\mathcal{O}(n^3)$, limitant son usage aux petits jeux de données."
  - "Très sensible aux variations d'échelle des données (une normalisation stricte est requise)."
  - "Difficile d'interpréter le modèle final, effet de 'boîte noire' avec les noyaux complexes."
  - "Le calcul direct des probabilités (via la méthode de Platt) augmente le temps d'entraînement."
hyperparameters:
  kernel: "Noyau ('rbf', 'poly', 'linear', 'sigmoid')."
  C: "Paramètre de pénalité."
math_theory: |
  Le SVM cherche à trouver l'hyperplan optimal qui sépare les classes en maximisant la marge, tout en permettant quelques erreurs grâce aux variables d'écart $\textcolor{#ef4444}{\xi_i}$.
  
  L'objectif primal est de minimiser :
  $$\min_{\textcolor{#3b82f6}{w}, \textcolor{#10b981}{b}, \textcolor{#ef4444}{\xi}} \frac{1}{2} \|\textcolor{#3b82f6}{w}\|^2 + \textcolor{#fbbf24}{C} \sum_{i=1}^{n} \textcolor{#ef4444}{\xi_i}$$
  
  Sous les contraintes (pour chaque point $\textcolor{#fbbf24}{x_i}$) :
  $$\textcolor{#8b5cf6}{y_i} (\textcolor{#3b82f6}{w}^T \phi(\textcolor{#fbbf24}{x_i}) + \textcolor{#10b981}{b}) \geq 1 - \textcolor{#ef4444}{\xi_i} \quad \text{et} \quad \textcolor{#ef4444}{\xi_i} \geq 0$$
  
  - $\textcolor{#3b82f6}{w}$ : Vecteur de poids (définit l'orientation de l'hyperplan).
  - $\textcolor{#10b981}{b}$ : Biais (définit le décalage de l'hyperplan).
  - $\textcolor{#ef4444}{\xi_i}$ : Variable d'écart (slack), mesure l'erreur pour une observation mal classée ou dans la marge.
  - $\textcolor{#fbbf24}{C}$ : Hyperparamètre de régularisation contrôlant le compromis entre marge large et erreurs.
  - $\phi(\textcolor{#fbbf24}{x})$ : Transformation implicite vers un espace de plus grande dimension via le "Kernel Trick" (ex: $K(x_i, x_j) = \phi(x_i)^T \phi(x_j)$).
  - $\textcolor{#8b5cf6}{y_i} \in \{-1, 1\}$ : La classe réelle.
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import SVC

  # [PARAM: KERNEL | string]
  KERNEL = "rbf"
