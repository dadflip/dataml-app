id: "model_tensorflow_dnn_regressor"
name: "Model: TensorFlow/Keras DNN (Regression)"
description: "Réseau de neurones profond (TensorFlow/Keras) pour la régression."
category: "Réseaux de Neurones"
tags: ["model", "regression", "tabular", "tensorflow", "keras", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Pour des tâches de régression tabulaire massives."
pros:
  - "Très scalable sur de gros volumes."
cons:
  - "Sensible au scaling des features."
hyperparameters:
  hidden_layers: "Tailles de couches (ex: '256, 128')."
  epochs: "Nombre d'époques (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import tensorflow as tf
      from tensorflow import keras
      from tensorflow.keras import layers
  except ImportError:
      tf = None
      print("[ERREUR] tensorflow n'est pas installé. Lancez : !pip install tensorflow")

  # [PARAM: HIDDEN_LAYERS | string]
  HIDDEN_LAYERS = "256, 128"
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  print(f"[MODEL] Entraînement TensorFlow DNN Regressor (layers={HIDDEN_LAYERS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and tf is not None:
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      y_tr_np = np.array(y_train)
      
      h_sizes = [int(x.strip()) for x in HIDDEN_LAYERS.split(',') if x.strip()]
      
      model = keras.Sequential()
      model.add(keras.Input(shape=(X_tr_np.shape[1],)))
      
      for h in h_sizes:
          model.add(layers.Dense(h, activation='relu'))
          model.add(layers.BatchNormalization())
          model.add(layers.Dropout(0.2))
          
      model.add(layers.Dense(1, activation='linear'))
      
      model.compile(optimizer='adam', loss='mse', metrics=['mae'])
      
      history = model.fit(X_tr_np, y_tr_np, epochs=int(EPOCHS), batch_size=64, verbose=0, validation_split=0.1)
      
      preds = model.predict(X_te_np)
      y_pred = preds.flatten()
      y_proba = None
      
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "final_val_loss": float(history.history['val_loss'][-1]) if 'val_loss' in history.history else None}
      task_type = "regression"
      print("[MODEL] TensorFlow DNN Regressor entraîné avec succès.")
  else:
      print("[ERREUR] Données ou module tensorflow introuvables.")
