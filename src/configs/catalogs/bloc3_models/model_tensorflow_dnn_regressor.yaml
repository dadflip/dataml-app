id: "model_tensorflow_dnn_regressor"
name: "Model: TensorFlow/Keras DNN (Regression)"
description: |
  Réseau de neurones profond (Deep Neural Network) pour les tâches de régression, implémenté avec l'API Keras de TensorFlow. Il génère une prédiction continue au travers de couches denses (Multi-Layer Perceptron).
category: "Réseaux de Neurones"
tags: ["model", "regression", "tabular", "tensorflow", "keras", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  Pour des tâches de régression tabulaire massives (des centaines de milliers de lignes ou plus), nécessitant un modèle hautement scalable capable d'apprendre des relations non linéaires complexes.
use_cases:
  - "Prévision de la demande ou modélisation de séries temporelles avec de nombreuses covariables."
  - "Évaluation immobilière ou tarification d'assurance sur de très vastes jeux de données."
  - "Modélisation de processus physiques ou industriels (création de jumeaux numériques)."
pros:
  - "Très scalable : gestion aisée des gros volumes de données via l'entraînement par batch."
  - "Intégration directe avec l'écosystème de production TensorFlow (Serving, TFX)."
  - "Modulable : la fonction de perte (MSE, MAE, Huber) s'adapte facilement aux valeurs aberrantes."
cons:
  - "Extrêmement sensible à l'échelle (scaling) des variables d'entrée (nécessite une normalisation stricte)."
  - "Performances souvent inférieures aux arbres boostés (XGBoost) sur les petits/moyens datasets."
  - "Effet 'boîte noire' limitant l'interprétabilité globale et locale du modèle."
hyperparameters:
  hidden_layers: "Tailles de couches séparées par des virgules (ex: '256, 128')."
  epochs: "Nombre d'époques d'entraînement (ex: 20)."
math_theory: |
  Le réseau de neurones profond calcule la prédiction continue $\textcolor{#10b981}{\hat{y}}$ en propageant l'entrée $\textcolor{#fbbf24}{x}$ à travers plusieurs couches :
  $$ \textcolor{#10b981}{\hat{y}} = \textcolor{#8b5cf6}{W^{(L)}} \textcolor{#3b82f6}{\sigma}(\dots \textcolor{#3b82f6}{\sigma}(\textcolor{#8b5cf6}{W^{(1)}} \textcolor{#fbbf24}{x} + \textcolor{#8b5cf6}{b^{(1)}}) \dots ) + \textcolor{#8b5cf6}{b^{(L)}} $$
  L'entraînement s'effectue en minimisant une fonction de perte $\textcolor{#ef4444}{\mathcal{L}}$ comme la MSE :
  $$ \textcolor{#ef4444}{\mathcal{L}} = \frac{1}{N} \sum_{i=1}^{N} (\textcolor{#fbbf24}{y_i} - \textcolor{#10b981}{\hat{y}_i})^2 $$
