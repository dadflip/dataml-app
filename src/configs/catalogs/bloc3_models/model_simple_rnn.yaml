id: "model_simple_rnn"
name: "Model: Simple RNN (PyTorch)"
description: "Réseau de Neurones Récurrents de base traitant les données de façon séquentielle en conservant un état caché pour mémoriser les informations passées."
category: "Réseaux Séquentiels (RNN)"
tags: ["model", "classification", "timeseries", "pytorch", "rnn", "deep-learning"]
applies_to: ["Séquences", "Séries Temporelles"]
when_to_use: "Adapté pour des séquences courtes, des séries temporelles simples, ou comme baselines avant de tester des architectures plus complexes (LSTM, GRU, Transformers)."
use_cases:
  - "Prévision de la demande ou analyse de séries temporelles financières (à court terme)."
  - "Classification de séquences de capteurs industriels simples."
  - "Analyse de sentiments sur des phrases courtes ou des tweets."
pros:
  - "Architecture légère, rapide à entraîner et peu coûteuse en paramètres."
  - "Gère naturellement des séquences de longueur variable."
  - "Bonne intuition pédagogique pour comprendre les mécanismes récurrents."
cons:
  - "Souffre fortement du problème du gradient qui disparaît (Vanishing Gradient)."
  - "Incapable de retenir des informations pertinentes sur de longues séquences."
  - "Calcul intrinsèquement séquentiel, limitant la parallélisation GPU (comparé aux Transformers)."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 64)."
  epochs: "Nombre d'époques (ex: 10)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
math_theory: |
  Le RNN simple met à jour son état caché $\textcolor{#3b82f6}{h_t}$ à chaque pas de temps $t$ en combinant l'entrée courante $\textcolor{#ef4444}{x_t}$ et l'état précédent $\textcolor{#fbbf24}{h_{t-1}}$ :

  $$
  \textcolor{#3b82f6}{h_t} = \tanh(\textcolor{#8b5cf6}{W_{hx}} \textcolor{#ef4444}{x_t} + \textcolor{#8b5cf6}{W_{hh}} \textcolor{#fbbf24}{h_{t-1}} + \textcolor{#8b5cf6}{b_h}) 
  $$

  La prédiction finale $\textcolor{#10b981}{\hat{y}}$ est basée sur le dernier état caché (ou chaque état) via une transformation linéaire :

  $$
  \textcolor{#10b981}{\hat{y}} = \text{Softmax}(\textcolor{#8b5cf6}{W_{yh}} \textcolor{#3b82f6}{h_T} + \textcolor{#8b5cf6}{b_y}) 
  $$
