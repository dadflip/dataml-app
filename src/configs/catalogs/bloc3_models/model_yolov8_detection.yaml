math_theory: |
  YOLO (You Only Look Once) frames object detection as a single regression problem. YOLOv8 uses an anchor-free detection head, directly predicting bounding box coordinates and class probabilities per spatial location.
  
  For each grid cell, the network predicts class probabilities $\textcolor{#3b82f6}{\mathbf{p}} = (p_1, \dots, p_C)$ and bounding box offsets $\textcolor{#10b981}{\mathbf{b}} = (t_x, t_y, t_w, t_h)$ relative to the cell center $(c_x, c_y)$.
  
  The bounding box coordinates $(\textcolor{#fbbf24}{x}, \textcolor{#fbbf24}{y}, \textcolor{#fbbf24}{w}, \textcolor{#fbbf24}{h})$ are decoded as:
  $$ \textcolor{#fbbf24}{x} = (2 \cdot \sigma(\textcolor{#10b981}{t_x}) - 0.5) + c_x $$
  $$ \textcolor{#fbbf24}{y} = (2 \cdot \sigma(\textcolor{#10b981}{t_y}) - 0.5) + c_y $$
  $$ \textcolor{#fbbf24}{w} = \textcolor{#10b981}{t_w}^2 \cdot s_w $$
  $$ \textcolor{#fbbf24}{h} = \textcolor{#10b981}{t_h}^2 \cdot s_h $$
  where $\sigma$ is the sigmoid function, and $s_w, s_h$ are stride factors.
  
  To remove redundant overlapping boxes, Non-Maximum Suppression (NMS) is applied. A box is discarded if its Intersection over Union (IoU) with a higher-confidence box exceeds a threshold:
  $$ \textcolor{#ef4444}{\text{IoU}} = \frac{\text{Area}(\text{Box}_A \cap \text{Box}_B)}{\text{Area}(\text{Box}_A \cup \text{Box}_B)} > \text{NMS\_Threshold} $$

