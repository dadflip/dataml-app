id: "model_pca"
name: "Model: Principal Component Analysis (PCA)"
description: |
  L'Analyse en Composantes Principales (PCA) est une technique d'apprentissage non-supervisée linéaire de réduction de dimension. Elle projette les données d'origine dans un nouvel espace orthogonal de moindre dimension, en maximisant la variance (l'information) conservée sur chaque nouvel axe (composante principale).
category: "Réduction de Dimension"
tags: ["model", "dimensionality-reduction", "tabular", "sklearn", "pca"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser pour réduire le nombre de descripteurs (features) lorsque vous êtes confronté à la malédiction de la dimensionnalité, pour visualiser des données complexes en 2D ou 3D, ou pour éliminer la colinéarité (variables fortement corrélées) avant d'appliquer un modèle linéaire ou un réseau de neurones.
use_cases:
  - "Visualisation exploratoire (EDA) de jeux de données à haute dimensionnalité (ex: expression génomique, images aplaties)."
  - "Prétraitement d'images ou de signaux pour en extraire l'essence (ex: Eigenfaces pour la reconnaissance faciale)."
  - "Réduction du bruit et de la taille en mémoire d'un jeu de données avant l'entraînement d'algorithmes coûteux."
pros:
  - "Très rapide et computationnellement efficace grâce aux méthodes d'algèbre linéaire optimisées (SVD)."
  - "Supprime mathématiquement la multicolinéarité : toutes les composantes principales sont orthogonales entre elles."
  - "Fournit une mesure interprétable de l'information conservée via le ratio de variance expliquée."
cons:
  - "Transforme les données de manière linéaire uniquement, incapable de capturer des variétés non linéaires complexes (contrairement à t-SNE, UMAP ou Kernel PCA)."
  - "Sensible aux valeurs extrêmes (outliers) et nécessite impérativement de standardiser les données (moyenne nulle, variance unitaire) au préalable."
  - "Perte d'interprétabilité des features individuelles, les nouvelles composantes étant des combinaisons linéaires des variables initiales."
hyperparameters:
  n_components: "Nombre de composantes à garder (ex: 2)."
math_theory: |
  L'Analyse en Composantes Principales (PCA) cherche la projection linéaire des données centrées $\textcolor{#10b981}{X}$ qui maximise la variance conservée. Mathématiquement, cela revient à calculer la matrice de covariance $\textcolor{#fbbf24}{C}$ :
  $$ \textcolor{#fbbf24}{C} = \frac{1}{n} \textcolor{#10b981}{X}^T \textcolor{#10b981}{X} $$
  Ensuite, on résout le problème aux valeurs propres pour extraire les composantes principales (vecteurs propres) $\textcolor{#3b82f6}{v_k}$ et leurs variances associées (valeurs propres) $\textcolor{#ef4444}{\lambda_k}$ :
  $$ \textcolor{#fbbf24}{C} \textcolor{#3b82f6}{v_k} = \textcolor{#ef4444}{\lambda_k} \textcolor{#3b82f6}{v_k} $$
  Les données sont finalement projetées sur les top-K vecteurs propres ayant les plus grandes valeurs propres.
