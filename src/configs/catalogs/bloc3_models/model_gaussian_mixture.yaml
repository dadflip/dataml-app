id: "model_gaussian_mixture"
name: "Model: Gaussian Mixture Model (GMM)"
description: |
  Modèle probabiliste supposant que toutes les données sont générées à partir d'un mélange d'un nombre fini de distributions gaussiennes, permettant un partitionnement souple (soft clustering).
category: "Clustering (Non-Supervisé)"
tags: ["model", "clustering", "tabular", "sklearn", "gmm"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser lorsque vous souhaitez obtenir des probabilités d'appartenance douces (soft clustering) ou que la structure sous-jacente des clusters peut être de forme elliptique plutôt que sphérique (comme pour K-Means).
use_cases:
  - "Segmentation de clientèle avec des profils qui se chevauchent."
  - "Détection d'anomalies en identifiant les points avec une faible probabilité sous le modèle."
  - "Traitement de l'image (par exemple, la segmentation des couleurs)."
pros:
  - "Fournit des probabilités d'appartenance pour chaque cluster (soft clustering)."
  - "Très flexible sur la forme et la taille des clusters grâce aux différentes matrices de covariance."
  - "Peut être utilisé pour la détection d'anomalies de manière naturelle."
cons:
  - "Peut converger vers des optima locaux, nécessitant souvent plusieurs initialisations."
  - "Sensible au choix du nombre de composantes."
  - "Peut être instable avec des ensembles de données de haute dimension."
hyperparameters:
  n_components: "Nombre de gaussiennes / clusters (ex: 3)."
math_theory: |
  Un Gaussian Mixture Model (GMM) suppose que la distribution des données $\textcolor{#10b981}{x}$ est une combinaison linéaire de $K$ composantes gaussiennes. La probabilité globale d'un point est donnée par :
  $$ P(\textcolor{#10b981}{x}) = \sum_{k=1}^{K} \textcolor{#3b82f6}{\pi_k} \mathcal{N}(\textcolor{#10b981}{x} | \textcolor{#ef4444}{\mu_k}, \textcolor{#fbbf24}{\Sigma_k}) $$
  Où $\textcolor{#3b82f6}{\pi_k}$ sont les coefficients de mélange (avec $\sum \textcolor{#3b82f6}{\pi_k} = 1$), et $\mathcal{N}$ représente la distribution normale multivariée caractérisée par sa moyenne $\textcolor{#ef4444}{\mu_k}$ et sa matrice de covariance $\textcolor{#fbbf24}{\Sigma_k}$. Le modèle est ajusté itérativement via l'algorithme Espérance-Maximisation (EM).
