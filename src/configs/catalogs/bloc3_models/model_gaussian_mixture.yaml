code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.mixture import GaussianMixture

  # [PARAM: N_COMPONENTS | number]
  N_COMPONENTS = 3
  # [/PARAM]

  print(f"[MODEL] Entraînement Gaussian Mixture (components={N_COMPONENTS})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "clustering"
  meta = {"framework": "sklearn", "type": "gaussian_mixture"}
  full_pipeline = None

  if 'X_train' in locals() and 'X_test' in locals():
      model = GaussianMixture(n_components=int(N_COMPONENTS), random_state=42)
      model.fit(X_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test)
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "converged": model.converged_}

