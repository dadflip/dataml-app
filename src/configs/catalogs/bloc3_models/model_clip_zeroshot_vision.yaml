id: "model_clip_zeroshot_vision"
name: "Model: CLIP Zero-Shot Vision (OpenAI)"
description: "Contrastive Language-Image Pre-Training. Classifie des images dans n'importe quelles catégories textuelles définies par l'utilisateur."
category: "Vision par Ordinateur (Pré-entraînés)"
tags: ["model", "vision", "classification", "transformers", "clip", "zero-shot"]
applies_to: ["Images"]
when_to_use: "Pour classifier des images (ex: 'chat', 'chien', 'voiture') sans AUCUN entraînement."
pros:
  - "Magique : trouve ce que vous cherchez avec des mots clés."
cons:
  - "Moins précis qu'un ResNet fine-tuné spécifiquement."
hyperparameters:
  candidate_labels: "Classes cibles séparées par des virgules (ex: 'un chat, un chien, une voiture')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
      from PIL import Image
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers ou pillow n'est pas installé.")

  # [PARAM: CANDIDATE_LABELS | string]
  CANDIDATE_LABELS = "a photo of a cat, a photo of a dog"
  # [/PARAM]

  print(f"[MODEL] Inférence CLIP Zero-Shot (labels: {CANDIDATE_LABELS})...")
  if 'X_test' in locals() and pipeline is not None:
      labels = [x.strip() for x in CANDIDATE_LABELS.split(',')]
      images = list(X_test)
      
      print("Chargement du modèle openai/clip-vit-base-patch32...")
      classifier = pipeline("zero-shot-image-classification", model="openai/clip-vit-base-patch32")
      
      print("Inférence en cours...")
      results = []
      for img in images:
          # Assurer un format PIL
          if isinstance(img, str): pil_img = Image.open(img)
          elif isinstance(img, np.ndarray): pil_img = Image.fromarray(img.astype('uint8'))
          else: pil_img = img
          
          res = classifier(pil_img, candidate_labels=labels)
          results.append(res[0]['label']) # Le meilleur score
          
      y_pred = np.array(results)
      y_proba = None
      feature_importances = None
      model = classifier
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "type": "zero_shot_vision"}
      task_type = "classification"
      print("[MODEL] Inférence CLIP terminée.")
  else:
      print("[ERREUR] Données introuvables ou transformers manquant.")
