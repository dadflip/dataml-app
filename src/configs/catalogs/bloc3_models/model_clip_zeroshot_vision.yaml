id: "model_clip_zeroshot_vision"
name: "Model: CLIP Zero-Shot Vision (OpenAI)"
description: |
  Modèle de fondation vision-langage (Contrastive Language-Image Pre-Training) par OpenAI.
  Associe des images à n'importe quelles étiquettes textuelles (Zero-Shot) en projetant
  textes et images dans un même espace latent.
category: "Vision par Ordinateur (Pré-entraînés)"
tags: ["model", "vision", "classification", "transformers", "clip", "zero-shot"]
applies_to: ["Images"]
when_to_use: |
  Pour classer des images selon des catégories arbitraires non connues à l'avance,
  sans avoir besoin d'entraîner ou de fine-tuner un réseau de neurones.
use_cases:
  - "Classification d'images à la volée basée sur des prompts textuels."
  - "Filtrage et modération de contenu visuel."
  - "Moteur de recherche sémantique d'images."
pros:
  - "Magique : fonctionne sans aucun entraînement avec des mots clés libres."
  - "Extrêmement flexible et généraliste."
cons:
  - "Moins précis qu'un modèle CNN/ViT fine-tuné spécifiquement pour une tâche restreinte."
  - "Peut manquer de granularité sur des classifications très spécialisées (ex: médicales)."
hyperparameters:
  candidate_labels: "Classes cibles séparées par des virgules (ex: 'un chat, un chien, une voiture')."
code_template: |
  import pandas as pd
  import numpy as np

  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "CLIP Zero-Shot Vision"}

  try:
      import torch
      from transformers import pipeline
      from PIL import Image
      import io
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers, torch ou pillow n'est pas installé.")

  # [PARAM: CANDIDATE_LABELS | string]
  CANDIDATE_LABELS = "a photo of a cat, a photo of a dog"
  # [/PARAM]

  print(f"[MODEL] Initialisation CLIP Zero-Shot (labels={CANDIDATE_LABELS})...")

  if 'X_test' in locals() and pipeline is not None:
      # Zero-shot model doesn't need X_train/y_train
      
      print("Chargement de openai/clip-vit-base-patch32...")
      device = 0 if torch.cuda.is_available() else -1
      classifier = pipeline("zero-shot-image-classification", model="openai/clip-vit-base-patch32", device=device)
      
      labels_list = [lbl.strip() for lbl in CANDIDATE_LABELS.split(",") if lbl.strip() != ""]
      
      # Process images in X_test
      # We assume X_test contains file paths, URLs, or PIL Images or raw bytes
      preds = []
      probs_list = []
      
      print("Inférence sur le set de test...")
      for item in X_test:
          try:
              # Conversion to PIL Image if necessary
              if isinstance(item, str):
                  img = Image.open(item)
              elif isinstance(item, bytes):
                  img = Image.open(io.BytesIO(item))
              elif isinstance(item, np.ndarray):
                  img = Image.fromarray(item.astype('uint8'), 'RGB')
              else:
                  img = item # Assume it's already a PIL Image
                  
              res = classifier(img, candidate_labels=labels_list)
              # res is a list of dicts: [{'score': 0.9, 'label': 'cat'}, ...]
              best_label = res[0]['label']
              preds.append(best_label)
              
              # Extract all probs ordered by labels_list (optional but good for y_proba)
              label_to_score = {r['label']: r['score'] for r in res}
              probs = [label_to_score.get(l, 0.0) for l in labels_list]
              probs_list.append(probs)
              
          except Exception as e:
              print(f"[WARNING] Erreur sur une image: {e}")
              preds.append("ERROR")
              probs_list.append([0.0]*len(labels_list))
              
      y_pred = np.array(preds)
      y_proba = np.array(probs_list)
      
      full_pipeline = classifier
      model = classifier.model
      
      training_history = {"status": "success", "type": "zero_shot_vision"}

