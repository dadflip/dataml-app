math_theory: |
  CLIP (Contrastive Language-Image Pre-Training) learns a joint embedding space for images and texts. It consists of an Image Encoder $f_{vis}$ and a Text Encoder $f_{text}$.
  
  Given an image $\textcolor{#10b981}{\mathbf{x}}$ and a set of candidate text labels $\{\textcolor{#3b82f6}{\mathbf{t}_1}, \textcolor{#3b82f6}{\mathbf{t}_2}, \dots, \textcolor{#3b82f6}{\mathbf{t}_K}\}$, they are encoded into normalized vectors:
  $$ \textcolor{#10b981}{\mathbf{v}} = \frac{f_{vis}(\textcolor{#10b981}{\mathbf{x}})}{||f_{vis}(\textcolor{#10b981}{\mathbf{x}})||_2}, \quad \textcolor{#3b82f6}{\mathbf{w}_i} = \frac{f_{text}(\textcolor{#3b82f6}{\mathbf{t}_i})}{||f_{text}(\textcolor{#3b82f6}{\mathbf{t}_i})||_2} $$
  
  The similarity score for each label is computed as the scaled cosine similarity:
  $$ \textcolor{#fbbf24}{s_i} = \exp(\textcolor{#ef4444}{\tau} \cdot \langle \textcolor{#10b981}{\mathbf{v}}, \textcolor{#3b82f6}{\mathbf{w}_i} \rangle) $$
  where $\textcolor{#ef4444}{\tau}$ is a learned temperature parameter.
  
  The final zero-shot prediction probability for class $i$ is obtained via a softmax over all candidate labels:
  $$ \textcolor{#8b5cf6}{P(y=i | \mathbf{x})} = \frac{\exp(\textcolor{#fbbf24}{s_i})}{\sum_{j=1}^K \exp(\textcolor{#fbbf24}{s_j})} $$

