id: "model_gru"
name: "Model: GRU (Gated Recurrent Unit)"
description: "Architecture de réseau de neurones récurrents (RNN) dotée de portes (Gated Recurrent Unit), conçue pour capturer les dépendances temporelles de manière plus efficiente qu'un LSTM."
category: "Réseaux Séquentiels (RNN)"
tags: ["model", "classification", "timeseries", "pytorch", "gru", "deep-learning"]
applies_to: ["Séquences", "Séries Temporelles"]
when_to_use: "À utiliser pour traiter des séquences temporelles, du texte ou des données ordonnées, particulièrement lorsque la rapidité d'entraînement est prioritaire ou que les ressources sont limitées par rapport à un LSTM complet."
use_cases:
  - "Classification de séries temporelles (détection d'anomalies de capteurs)."
  - "Traitement du langage naturel (analyse de sentiment)."
  - "Prévision d'évolution (séries financières, météo)."
  - "Reconnaissance vocale de base."
pros:
  - "Plus rapide et moins gourmand en mémoire qu'un LSTM (moins de portes à calculer)."
  - "Souvent aussi performant que le LSTM sur de nombreuses tâches."
  - "Atténue efficacement le problème de disparition du gradient des RNN classiques."
cons:
  - "Légèrement moins performant sur de très longues séquences complexes comparé au LSTM."
  - "Architecture intrinsèquement séquentielle, difficilement parallélisable par rapport aux Transformers."
  - "Nécessite un formatage spécifique des données en 3D (batch, temps, features)."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 64)."
  num_layers: "Nombre de couches (ex: 2)."
  epochs: "Nombre d'époques (ex: 10)."
math_theory: |
  Le GRU simplifie le LSTM en combinant l'état de cellule et l'état caché, et en utilisant deux portes : la porte de mise à jour $\textcolor{#3b82f6}{z_t}$ et la porte de réinitialisation $\textcolor{#ef4444}{r_t}$.
  L'état caché $\textcolor{#10b981}{h_t}$ est une interpolation linéaire entre le précédent état $\textcolor{#fbbf24}{h_{t-1}}$ et un nouvel état candidat $\textcolor{#8b5cf6}{\tilde{h}_t}$ :
  $$ \textcolor{#10b981}{h_t} = (1 - \textcolor{#3b82f6}{z_t}) \odot \textcolor{#fbbf24}{h_{t-1}} + \textcolor{#3b82f6}{z_t} \odot \textcolor{#8b5cf6}{\tilde{h}_t} $$
  Où l'état candidat dépend de la porte de réinitialisation :
  $$ \textcolor{#8b5cf6}{\tilde{h}_t} = \tanh(W x_t + U (\textcolor{#ef4444}{r_t} \odot \textcolor{#fbbf24}{h_{t-1}})) $$
