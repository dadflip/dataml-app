id: "model_linear_svc"
name: "Model: Linear SVC"
description: |
  Support Vector Classifier (Séparateur à Vaste Marge) à noyau strictement linéaire. Implémenté via liblinear, il est extrêmement rapide et adapté aux jeux de données massifs par rapport au SVC classique.
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "classification", "tabular", "sklearn", "svm", "linear"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour les problèmes de classification linéaire sur de grands volumes de données (plusieurs dizaines de milliers de lignes) avec un nombre très élevé de caractéristiques, typiquement en traitement du langage naturel (NLP).
use_cases:
  - "Classification de textes (analyse de sentiment) avec des vecteurs TF-IDF."
  - "Catégorisation de documents à grande échelle."
  - "Filtrage anti-spam basé sur un grand nombre de mots-clés."
pros:
  - "Mise à l'échelle quasi linéaire (O(n)), capable de traiter des millions d'enregistrements."
  - "Extrêmement robuste face aux espaces de grande dimension (beaucoup plus de colonnes que de lignes)."
  - "Offre des coefficients interprétables pour évaluer l'importance de chaque caractéristique."
cons:
  - "Incapable de modéliser des relations non linéaires (noyau linéaire uniquement)."
  - "Ne produit pas de probabilités calibrées nativement (absence de predict_proba)."
  - "Sensible à l'échelle des données, la standardisation est indispensable."
hyperparameters:
  C: "Paramètre de pénalité."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import LinearSVC

  # [PARAM: C_PARAM | number]
  C_PARAM = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement LinearSVC (C={C_PARAM})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = LinearSVC(C=float(C_PARAM), random_state=42, dual=False) # dual=False recommandé quand n_samples > n_features
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals():
          coefs = np.abs(model.coef_).mean(axis=0) if model.coef_.ndim > 1 else np.abs(model.coef_[0])
          if len(coefs) == len(feature_names_out):
              feature_importances = pd.Series(coefs, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      meta = {}
