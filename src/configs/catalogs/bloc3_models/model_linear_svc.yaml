math_theory: |
  Linear Support Vector Classification (SVC) seeks to find the best linear separating hyperplane that maximizes the margin between two classes. It minimizes the squared hinge loss subject to an L2 penalty on the weights:
  
  $$ \min_{w, b} \left( \frac{1}{2} ||\textcolor{#ef4444}{w}||_2^2 + \textcolor{#fbbf24}{C} \sum_{i=1}^{N} \max(0, 1 - \textcolor{#3b82f6}{y}^{(i)} (\textcolor{#10b981}{X}^{(i)} \textcolor{#ef4444}{w} + b)) \right) $$
  
  Where $\textcolor{#ef4444}{w}$ and $b$ define the hyperplane, $\textcolor{#3b82f6}{y} \in \{-1, 1\}$ are the target labels, $\textcolor{#10b981}{X}$ is the feature matrix, and $\textcolor{#fbbf24}{C}$ is the penalty parameter controlling the trade-off between margin width and classification errors.

