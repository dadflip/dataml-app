id: "model_denoising_autoencoder"
name: "Model: Denoising Autoencoder (DAE)"
description: "Architecture de réseau de neurones non-supervisé, conçue pour apprendre des représentations robustes en reconstruisant un signal d'entrée à partir d'une version corrompue (bruitée)."
category: "Génératif & Non-Supervisé"
tags: ["model", "unsupervised", "denoising", "pytorch", "autoencoder", "deep-learning"]
applies_to: ["Tabulaire", "Images"]
when_to_use: "Indiqué pour le nettoyage de données capteurs bruitées, l'imputation de valeurs manquantes, ou la création d'embeddings (features latentes) résilients aux petites variations."
use_cases:
  - "Restauration et débruitage d'images ou signaux (ex: imagerie médicale, audio)."
  - "Nettoyage de signaux de capteurs IoT (filtrage de bruit de fond)."
  - "Extraction de caractéristiques latentes très robustes pour l'entraînement de modèles aval."
pros:
  - "Force le réseau à capturer la structure fondamentale des données plutôt qu'à mémoriser l'entrée."
  - "Résiste intrinsèquement au sur-apprentissage grâce au processus stochastique de corruption."
cons:
  - "Dimensionnement délicat de l'espace latent et réglage critique du facteur de bruit (`noise_factor`)."
  - "La fonction de perte quadratique (MSE) tend à produire des reconstructions lissées, perdant les détails fins."
hyperparameters:
  noise_factor: "Quantité de bruit ajoutée (ex: 0.2)."
  epochs: "Nombre d'époques (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: NOISE_FACTOR | number]
  NOISE_FACTOR = 0.2
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  print(f"[MODEL] Entraînement Denoising Autoencoder (noise={NOISE_FACTOR})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "data_reconstruction"
  meta = {"framework": "pytorch", "type": "denoising_autoencoder"}
  full_pipeline = None

  if 'X_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train, dtype=np.float32)
      X_te_np = np.array(X_test, dtype=np.float32)
      noise_tr = float(NOISE_FACTOR) * np.random.normal(0, 1, X_tr_np.shape).astype(np.float32)
      X_tr_noisy = np.clip(X_tr_np + noise_tr, 0., 1.)
      dataset = TensorDataset(torch.tensor(X_tr_noisy), torch.tensor(X_tr_np))
      loader = DataLoader(dataset, batch_size=64, shuffle=True)
      in_features = X_tr_np.shape[1]

      class DAE(nn.Module):
          def __init__(self, dim):
              super().__init__()
              self.enc = nn.Sequential(nn.Linear(dim, 64), nn.ReLU(), nn.Linear(64, 32))
              self.dec = nn.Sequential(nn.Linear(32, 64), nn.ReLU(), nn.Linear(64, dim), nn.Sigmoid())
          def forward(self, x):
              return self.dec(self.enc(x))

      model = DAE(in_features)
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      criterion = nn.MSELoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      model.train()
      
      final_loss = 0.0
      for epoch in range(int(EPOCHS)):
          epoch_loss = 0.0
          for bx, by in loader:
              bx, by = bx.to(device), by.to(device)
              optimizer.zero_grad()
              loss = criterion(model(bx), by)
              loss.backward()
              optimizer.step()
              epoch_loss += loss.item()
          final_loss = epoch_loss / len(loader)
          
      model.eval()
      with torch.no_grad():
          # Apply to clean test data, usually autoencoders denoise, so we can test it by denoising test data.
          # Here we just pass clean test data as a forward pass or noisy if preferred. Let's pass clean.
          X_te_t = torch.tensor(X_te_np).to(device)
          y_pred = model(X_te_t).cpu().numpy()
          
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "loss": final_loss}

math_theory: |
  L'autoencodeur débruiteur (DAE) apprend à reconstruire une entrée propre $\textcolor{#10b981}{x}$ à partir d'une version intentionnellement corrompue $\textcolor{#fbbf24}{\tilde{x}}$.
  La corruption est souvent un bruit additif gaussien ou un dropout :
  
  $$ \textcolor{#fbbf24}{\tilde{x}} \sim q(\textcolor{#fbbf24}{\tilde{x}} | \textcolor{#10b981}{x}) $$
  
  L'encodeur extrait une représentation latente $\textcolor{#8b5cf6}{h}$, et le décodeur produit la reconstruction $\textcolor{#3b82f6}{\hat{x}}$ :
  
  $$ \textcolor{#8b5cf6}{h} = f_{\theta}(\textcolor{#fbbf24}{\tilde{x}}) \quad \text{et} \quad \textcolor{#3b82f6}{\hat{x}} = g_{\phi}(\textcolor{#8b5cf6}{h}) $$
  
  Le réseau est entraîné pour minimiser l'erreur de reconstruction entre la sortie $\textcolor{#3b82f6}{\hat{x}}$ et l'entrée originale propre $\textcolor{#10b981}{x}$, forçant l'extraction de caractéristiques robustes :
  
  $$ \mathcal{L}(\theta, \phi) = || \textcolor{#10b981}{x} - \textcolor{#3b82f6}{\hat{x}} ||^2 $$
