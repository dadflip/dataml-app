  # [/PARAM]

  print(f"[MODEL] Entraînement AdaBoost Regressor (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
