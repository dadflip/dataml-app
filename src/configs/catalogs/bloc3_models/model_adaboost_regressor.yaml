  <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="800" height="400" fill="#1e1e2f" rx="15" />
    
    <g transform="translate(50, 40)">
      <text x="150" y="0" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Arbre t : Prédiction h_t(x)</text>
      
      <!-- Chart -->
      <rect x="0" y="20" width="300" height="200" fill="#2d2d44" rx="8" stroke="#3b82f6" stroke-width="2"/>
      <!-- Axes -->
      <line x1="20" y1="200" x2="280" y2="200" stroke="#ffffff" stroke-width="2"/>
      <line x1="20" y1="200" x2="20" y2="40" stroke="#ffffff" stroke-width="2"/>
      
      <!-- True data points (increasing sizes for larger weights) -->
      <circle cx="60" cy="150" r="4" fill="#fbbf24"/>
      <circle cx="100" cy="110" r="7" fill="#fbbf24"/>
      <circle cx="150" cy="130" r="4" fill="#fbbf24"/>
      <circle cx="200" cy="60" r="9" fill="#fbbf24"/>
      <circle cx="250" cy="90" r="5" fill="#fbbf24"/>
      
      <!-- Model prediction (Step function since it's a small tree) -->
      <path d="M 20 140 L 125 140 L 125 100 L 225 100 L 225 75 L 280 75" fill="none" stroke="#10b981" stroke-width="3"/>
      
      <!-- Error bars -->
      <line x1="60" y1="150" x2="60" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="100" y1="110" x2="100" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="150" y1="130" x2="150" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="200" y1="60" x2="200" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
      <line x1="250" y1="90" x2="250" y2="75" stroke="#ef4444" stroke-width="2" stroke-dasharray="2,2"/>
      
      <!-- Labels -->
      <text x="100" y="160" fill="#ef4444" font-family="sans-serif" font-size="12">L_i large</text>
      <text x="210" y="55" fill="#ef4444" font-family="sans-serif" font-size="12">D_max</text>
    </g>

    <!-- Formula Section -->
    <g transform="translate(420, 80)">
      <rect x="0" y="0" width="330" height="200" fill="#2d2d44" rx="8" stroke="#ffffff" stroke-width="1"/>
      
      <text x="165" y="30" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Calcul des Erreurs et Poids</text>
      
      <!-- Max Error -->
      <text x="20" y="65" fill="#ef4444" font-family="sans-serif" font-size="14">D_max = max |y_i - h_t(x_i)|</text>
      
      <!-- Normalized Error -->
      <text x="20" y="95" fill="#ef4444" font-family="sans-serif" font-size="14">L_i = |y_i - h_t(x_i)| / D_max</text>
      
      <!-- Beta confidence -->
      <text x="20" y="130" fill="#3b82f6" font-family="sans-serif" font-size="14">β_t = L_bar / (1 - L_bar)</text>
      
      <!-- Weight update -->
      <text x="20" y="170" fill="#fbbf24" font-family="sans-serif" font-size="14">w_i(t+1) = w_i(t) * β_t^(1 - L_i)</text>
    </g>
    
    <!-- Ensembling -->
    <g transform="translate(50, 300)">
      <rect x="0" y="0" width="700" height="70" fill="#2d2d44" rx="8" stroke="#8b5cf6" stroke-width="2"/>
      <text x="350" y="25" fill="#8b5cf6" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Prédiction Finale H(x)</text>
      <text x="350" y="50" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">Médiane pondérée des h_t(x) selon log(1/β_t)</text>
    </g>

    <!-- Arrows connecting sections -->
    <path d="M 360 140 L 410 140" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 400 280 L 400 290" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
    
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#ffffff" />
      </marker>
    </defs>
  </svg>
