id: "model_adaboost_regressor"
name: "Model: AdaBoost Regressor"
description: "Adaptive Boosting appliqué à la régression."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "Pour corriger itérativement de petits arbres (stumps) sans optimiser de fonction de perte complexe."
pros:
  - "Très robuste à l'overfitting."
cons:
  - "Souvent surpassé par Gradient Boosting ou XGBoost sur des gros datasets."
hyperparameters:
  n_estimators: "Nombre d'estimateurs (ex: 50)."
  learning_rate: "Poids appliqué à chaque estimateur (ex: 1.0)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import AdaBoostRegressor

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 50
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement AdaBoost Regressor (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = AdaBoostRegressor(n_estimators=int(N_ESTIMATORS), learning_rate=float(LEARNING_RATE), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
      print("[MODEL] Modèle entraîné et Full Pipeline compilé avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables.")
