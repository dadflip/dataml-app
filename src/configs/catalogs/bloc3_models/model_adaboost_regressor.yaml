id: "model_adaboost_regressor"
name: "Model: AdaBoost Regressor"
description: |
  Algorithme Adaptive Boosting (AdaBoost) appliqué à la régression. Il construit une séquence de petits arbres (par défaut de profondeur 3) où chaque nouvel arbre tente de corriger les erreurs résiduelles des arbres précédents en ajustant les poids des observations.
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour créer un modèle robuste avec peu de réglages d'hyperparamètres sur des données tabulaires de taille petite à moyenne, sans avoir besoin d'optimiser une fonction de perte complexe.
use_cases:
  - "Prédiction de valeurs continues sur des datasets avec des relations non linéaires modérées."
  - "Établissement d'une baseline solide avant de passer à des méthodes de boosting plus sophistiquées."
pros:
  - "Moins sujet au surapprentissage que d'autres méthodes d'ensemble."
  - "Ne nécessite que très peu de réglages d'hyperparamètres."
cons:
  - "Souvent surpassé en termes de performances par le Gradient Boosting (XGBoost, LightGBM) sur de grands jeux de données."
  - "Sensible au bruit et aux valeurs aberrantes dans la variable cible."
hyperparameters:
  n_estimators: "Nombre d'estimateurs (ex: 50)."
  learning_rate: "Poids appliqué à chaque estimateur (ex: 1.0)."
math_theory: |
  AdaBoost pour la régression (AdaBoost.R2) calcule une perte maximale à chaque itération pour normaliser les erreurs. La prédiction de l'ensemble $\textcolor{#8b5cf6}{H(x)}$ est la médiane pondérée des prédictions individuelles $\textcolor{#10b981}{h_t}(x)$.
  
  L'erreur d'une prédiction individuelle est donnée par :
  
  $$
  \textcolor{#ef4444}{L_i} = \frac{|y_i - \textcolor{#10b981}{h_t}(x_i)|}{D_{max}} 
  $$
  
  où $D_{max}$ est l'erreur absolue maximale sur le jeu de données pour l'arbre $t$.
  
  L'erreur moyenne pondérée $\textcolor{#ef4444}{\bar{L}}$ est :
  
  $$
  \textcolor{#ef4444}{\bar{L}} = \sum_{i} \textcolor{#fbbf24}{w_i} \textcolor{#ef4444}{L_i} 
  $$
  
  Le poids du modèle $t$ est calculé par le facteur de confiance $\textcolor{#3b82f6}{\beta_t}$ :
  
  $$
  \textcolor{#3b82f6}{\beta_t} = \frac{\textcolor{#ef4444}{\bar{L}}}{1 - \textcolor{#ef4444}{\bar{L}}} 
  $$
  
  (Un $\textcolor{#3b82f6}{\beta_t}$ faible signifie une confiance élevée).
  
  La mise à jour des poids favorise les points avec de grandes erreurs ($L_i \approx 1$) :
  
  $$
  \textcolor{#fbbf24}{w_i}^{(t+1)} = \textcolor{#fbbf24}{w_i}^{(t)} \textcolor{#3b82f6}{\beta_t}^{1 - \textcolor{#ef4444}{L_i}} 
  $$
