id: "model_multinomial_nb"
name: "Model: Multinomial Naive Bayes"
description: "Classificateur probabiliste reposant sur le théorème de Bayes avec hypothèse naïve d'indépendance, spécifiquement adapté aux caractéristiques distribuées de façon multinomiale."
category: "Modèles Probabilistes"
tags: ["model", "classification", "tabular", "nlp", "sklearn", "bayes"]
applies_to: ["Tabulaire", "Texte"]
when_to_use: "À appliquer préférentiellement pour des tâches de classification de textes ou lorsque les caractéristiques représentent des comptages entiers ou des fréquences fractionnaires (ex. TF-IDF)."
use_cases:
  - "Détection de spam ou classification d'emails à partir des mots contenus."
  - "Analyse de sentiment basique sur des critiques ou des flux de réseaux sociaux."
  - "Catégorisation automatique de documents ou articles d'actualité."
pros:
  - "Exécution extrêmement rapide avec une complexité d'entraînement très faible, idéal pour le temps réel."
  - "Très performant avec de larges matrices creuses typiques du traitement du langage naturel (NLP)."
  - "Intègre un lissage (Laplace) permettant de traiter nativement les termes non vus."
cons:
  - "L'hypothèse d'indépendance conditionnelle entre les variables est souvent irréaliste."
  - "Totalement incompatible avec des valeurs négatives dans les caractéristiques."
hyperparameters:
  alpha: "Paramètre de lissage de Laplace (ex: 1.0)."
math_theory: |
  Le classificateur Naïf Bayes Multinomial repose sur le théorème de Bayes et sur une hypothèse d'indépendance conditionnelle. Il calcule la probabilité qu'un document (ou observation) $\textcolor{#10b981}{x}$ appartienne à la classe $\textcolor{#ef4444}{y}$ :
  
  $$
  P(\textcolor{#ef4444}{y} | \textcolor{#10b981}{x}) \propto \textcolor{#3b82f6}{P(y)} \prod_{i=1}^{n} \textcolor{#fbbf24}{P(x_i | y)}
  $$
  
  Pour gérer les fréquences nulles, un lissage de Laplace $\textcolor{#8b5cf6}{\alpha}$ est appliqué lors de l'estimation de la vraisemblance $\textcolor{#fbbf24}{P(x_i | y)}$ :
  
  $$
  \textcolor{#fbbf24}{P(x_i | y)} = \frac{N_{yi} + \textcolor{#8b5cf6}{\alpha}}{N_y + \textcolor{#8b5cf6}{\alpha} n}
  $$
