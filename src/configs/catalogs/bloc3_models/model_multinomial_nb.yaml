code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.naive_bayes import MultinomialNB
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]

  print(f"[MODEL] Initialisation Multinomial Naive Bayes (alpha={ALPHA})...")
  
  model = MultinomialNB(alpha=float(ALPHA))

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline avec Multinomial NB...")
      full_pipeline.fit(X_train, y_train)
      y_pred = full_pipeline.predict(X_test)
      if hasattr(full_pipeline, "predict_proba"):
          y_proba = full_pipeline.predict_proba(X_test)
          
      if hasattr(model, 'feature_log_prob_'):
          # On peut approximer l'importance par la probabilité log des features
          if 'feature_names_out' in locals() and feature_names_out is not None and model.feature_log_prob_.shape[1] == len(feature_names_out):
              feature_importances = pd.Series(np.exp(model.feature_log_prob_[0]), index=feature_names_out)
              
      training_history = {"status": "success", "fitted_on": len(X_train)}
