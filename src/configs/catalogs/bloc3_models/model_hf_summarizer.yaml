math_theory: |
  Le résumé de texte repose sur une architecture Transformer de type Encodeur-Décodeur (par ex. BART ou T5). La tâche est formulée comme une génération conditionnelle de texte.
  
  Le modèle maximise la vraisemblance de la séquence de résumé $\textcolor{#10b981}{Y}$ étant donné le texte d'entrée $\textcolor{#3b82f6}{X}$, en factorisant la probabilité avec la règle de dérivation en chaîne (chain rule) sur $T$ étapes :
  
  $$
  P(\textcolor{#10b981}{Y} \mid \textcolor{#3b82f6}{X}) = \prod_{t=1}^{T} P(\textcolor{#10b981}{y_t} \mid \textcolor{#10b981}{y_{<t}}, \textcolor{#fbbf24}{H})
  $$
  
  où :
  *   $\textcolor{#3b82f6}{X}$ est le long document d'entrée.
  *   $\textcolor{#fbbf24}{H} = \text{Encoder}(\textcolor{#3b82f6}{X})$ représente les états cachés contextualisés de l'entrée.
  *   $\textcolor{#10b981}{y_t}$ est le token du résumé généré à l'étape $t$.
  *   $\textcolor{#10b981}{y_{<t}}$ sont les tokens du résumé générés précédemment (décodage autorégressif).

