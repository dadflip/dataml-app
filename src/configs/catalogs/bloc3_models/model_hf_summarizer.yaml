id: "model_hf_summarizer"
name: "Model: HuggingFace Text Summarizer"
description: "Modèle de traitement du langage naturel (NLP) basé sur l'architecture Transformer (BART ou T5) permettant de générer automatiquement un résumé d'un texte long sans ré-entraînement (Zero-Shot)."
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "summarization", "transformers", "huggingface", "zero-shot", "generative"]
applies_to: ["Texte"]
when_to_use: "À utiliser pour extraire l'essence d'un grand bloc de texte, condenser des articles, rapports ou transcriptions en un paragraphe concis, en l'absence de données d'entraînement pour créer un modèle sur-mesure."
use_cases:
  - "Résumé automatique d'articles de presse."
  - "Condensation de transcriptions de réunions ou d'appels."
  - "Génération de descriptions courtes à partir de fiches produits détaillées."
pros:
  - "Génération de texte extrêmement fluide et naturelle (abstractive summarization)."
  - "Aucun entraînement requis (modèle pré-entraîné prêt à l'emploi)."
  - "Capacité à comprendre le contexte global du document."
cons:
  - "Modèle lourd nécessitant beaucoup de ressources de calcul (très lent sur CPU)."
  - "Limité par la taille du contexte d'entrée (souvent 512 ou 1024 tokens maximum)."
  - "Risque de génération de faits incorrects (hallucinations)."
hyperparameters:
  max_length: "Longueur max du résumé (ex: 130)."
  min_length: "Longueur min du résumé (ex: 30)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  # [PARAM: MAX_LENGTH | number]
  MAX_LENGTH = 130
  # [/PARAM]

  # [PARAM: MIN_LENGTH | number]
  MIN_LENGTH = 30
  # [/PARAM]

  print(f"[MODEL] HuggingFace Summarizer (min={MIN_LENGTH}, max={MAX_LENGTH})...")
  if 'X_test' in locals() and pipeline is not None:
      texts = []
      if isinstance(X_test, pd.DataFrame) and 'text' in X_test.columns:
          texts = X_test['text'].astype(str).tolist()
      elif isinstance(X_test, (pd.Series, np.ndarray, list)):
          texts = [str(x) for x in X_test]
          
      if texts:
          print("Chargement du modèle de résumé (distilbart-cnn-12-6)...")
          summarizer = pipeline("summarization", model="sshleifer/distilbart-cnn-12-6")
          
          print("Génération des résumés (peut être très long)...")
          # Tronquer si trop long pour BART (max 1024 tokens environ)
          texts_trunc = [t[:3000] for t in texts] 
          results = summarizer(texts_trunc, max_length=int(MAX_LENGTH), min_length=int(MIN_LENGTH), do_sample=False)
          
          y_pred = np.array([res['summary_text'] for res in results])
          y_proba = None
          feature_importances = None
          model = summarizer
          
          if 'preprocessor' in locals() and preprocessor is not None:
              try: from imblearn.pipeline import Pipeline
              except: from sklearn.pipeline import Pipeline
              full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
          else:
              full_pipeline = model
              
          training_history = {"status": "success", "type": "zero_shot_generative"}
          task_type = "text_generation"
          meta = {}
