id: "model_catboost_classifier"
name: "Model: CatBoost Classifier"
description: |
  Algorithme de Gradient Boosting développé par Yandex, spécialement optimisé pour la gestion
  automatique et ultra-performante des variables catégorielles sans nécessiter d'encodage préalable (One-Hot).
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "catboost", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour les jeux de données tabulaires complexes contenant une forte proportion
  de caractéristiques catégorielles, ou lorsque vous recherchez une performance de pointe "out-of-the-box".
use_cases:
  - "Scoring de crédit avec de nombreuses variables textuelles ou factorielles."
  - "Prédiction de churn client à partir de profils hétérogènes."
  - "Compétitions Kaggle sur des données tabulaires mixtes."
pros:
  - "Performances exceptionnelles sans réglages complexes (out-of-the-box)."
  - "Élimine le besoin d'un encodage manuel fastidieux des variables catégorielles."
  - "Gère très bien le surapprentissage grâce à son architecture symétrique."
cons:
  - "L'inférence (prédiction) peut s'avérer légèrement plus lente que LightGBM."
  - "Empreinte mémoire importante et dépendance à un package lourd."
hyperparameters:
  iterations: "Nombre d'itérations (ex: 500)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  depth: "Profondeur des arbres (ex: 6)."
math_theory: |
  CatBoost innove de deux manières principales : l'encodage cible (Target Encoding) avec des statistiques ordonnées, et l'utilisation d'arbres symétriques (Oblivious Trees).
  
  Pour éviter la fuite de données cible (target leakage), CatBoost utilise un **Encodage Cible Ordonné**. La valeur catégorielle d'une observation $i$ pour la variable $k$ est encodée comme suit :
  
  $$
  \textcolor{#10b981}{\hat{x}_{i,k}} = \frac{\sum_{j=1}^{i-1} [x_{j,k} = x_{i,k}] \cdot \textcolor{#3b82f6}{y_j} + \textcolor{#fbbf24}{a} \cdot \textcolor{#ef4444}{P}}{\sum_{j=1}^{i-1} [x_{j,k} = x_{i,k}] + \textcolor{#fbbf24}{a}} 
  $$
  
  Où :
  - La somme est calculée uniquement sur les observations précédentes ($j < i$) en utilisant une permutation aléatoire.
  - $\textcolor{#3b82f6}{y_j}$ est la valeur cible (0 ou 1).
  - $\textcolor{#fbbf24}{a}$ est un paramètre de lissage (poids de l'a priori).
  - $\textcolor{#ef4444}{P}$ est la valeur a priori (par ex., la moyenne de la cible).
  
  Le modèle final $\textcolor{#8b5cf6}{F(x)}$ utilise des "arbres symétriques" (oblivious trees) où le même critère de séparation est appliqué à tous les nœuds de la même profondeur :
  
  $$
  \textcolor{#8b5cf6}{F(x)} = \sum_{t=1}^T \eta \cdot \textcolor{#10b981}{h_t}(x) 
  $$
