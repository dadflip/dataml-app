code_template: |
  import pandas as pd
  import numpy as np
  try:
      from catboost import CatBoostClassifier
  except ImportError:
      CatBoostClassifier = None
      print("[ERREUR] catboost n'est pas installé. Lancez : !pip install catboost")

  # [PARAM: ITERATIONS | number]
  ITERATIONS = 500
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: DEPTH | number]
  DEPTH = 6
  # [/PARAM]

  print(f"[MODEL] Entraînement CatBoost (iter={ITERATIONS}, lr={LEARNING_RATE}, depth={DEPTH})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "CatBoost Classifier"}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and CatBoostClassifier is not None:
      # Identification automatique des catégorielles (si elles n'ont pas été encodées par le preprocessor)
      cat_features = []
      
      # We must avoid modifying the original data passed if it is used elsewhere, but for CatBoost
      # it requires strings/categories for cat_features.
      # If preprocessor exists, categorical might already be numeric (OHE/Ordinal).
      # If so, cat_features will be empty, which is fine.
      if isinstance(X_train, pd.DataFrame):
          cat_features_idx = list(np.where(X_train.dtypes == 'object')[0]) + list(np.where(X_train.dtypes == 'category')[0])
          cat_features_idx = list(set(cat_features_idx))
          
          if len(cat_features_idx) > 0:
              X_train_cb = X_train.copy()
              X_test_cb = X_test.copy()
              cat_cols = X_train.columns[cat_features_idx]
              for c in cat_cols:
                  X_train_cb[c] = X_train_cb[c].fillna("MISSING").astype(str)
                  X_test_cb[c] = X_test_cb[c].fillna("MISSING").astype(str)
              X_train = X_train_cb
              X_test = X_test_cb
              cat_features = cat_features_idx
              
      model = CatBoostClassifier(
          iterations=int(ITERATIONS), 
          learning_rate=float(LEARNING_RATE), 
          depth=int(DEPTH),
          cat_features=cat_features if len(cat_features) > 0 else None,
          verbose=0,
          random_seed=42
      )
      
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          
          steps = list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)]
          steps.append(('model', model))
          full_pipeline = Pipeline(steps=steps)
      else:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      full_pipeline.fit(X_train, y_train)
      model = full_pipeline.named_steps['model']
      
      y_pred = full_pipeline.predict(X_test)
      if hasattr(full_pipeline, 'predict_proba'):
          y_proba = full_pipeline.predict_proba(X_test)
      
      if hasattr(model, 'feature_importances_'):
          if 'feature_names_out' in locals() and feature_names_out is not None:
              if len(model.feature_importances_) == len(feature_names_out):
                  feature_importances = pd.Series(model.feature_importances_, index=feature_names_out).sort_values(ascending=False)
              else:
                  feature_importances = pd.Series(model.feature_importances_).sort_values(ascending=False)
          else:
              feature_importances = pd.Series(model.feature_importances_).sort_values(ascending=False)
              
      training_history = {
          "status": "success", 
          "fitted_on": len(X_train), 
          "best_iteration": model.get_best_iteration()
      }

