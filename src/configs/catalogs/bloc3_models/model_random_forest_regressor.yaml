math_theory: |
  Le Random Forest Regressor fonctionne en entraînant $\textcolor{#8b5cf6}{B}$ arbres de régression indépendants sur des sous-ensembles aléatoires des données (échantillons bootstrap) et des sous-ensembles aléatoires de variables à chaque nœud de séparation.
  
  Contrairement à la classification où un vote majoritaire est utilisé, la prédiction finale en régression est calculée comme la moyenne non pondérée des prédictions continues de tous les arbres individuels $\textcolor{#fbbf24}{h_b}$.
  
  $$
  \textcolor{#3b82f6}{\hat{y}} = \frac{1}{\textcolor{#8b5cf6}{B}} \sum_{b=1}^{\textcolor{#8b5cf6}{B}} \textcolor{#fbbf24}{h_b}(\textcolor{#ef4444}{x}) 
  $$
  
  Où :
  - $\textcolor{#3b82f6}{\hat{y}}$ est la prédiction continue finale.
  - $\textcolor{#8b5cf6}{B}$ est le nombre total d'arbres (`n_estimators`).
  - $\textcolor{#fbbf24}{h_b}(\textcolor{#ef4444}{x})$ est la prédiction individuelle du $b$-ième arbre de régression pour l'entrée $\textcolor{#ef4444}{x}$.
  
  Ce processus de moyenne atténue fortement la forte variance (surapprentissage) typiquement associée aux arbres de décision non élagués et développés au maximum, produisant un modèle prédictif beaucoup plus robuste.

