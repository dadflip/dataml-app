id: "model_random_forest_regressor"
name: "Model: Random Forest Regressor"
description: "Forêt Aléatoire pour la régression. Moyenne les prédictions d'un grand nombre d'arbres de décision."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: "Excellent modèle de base par défaut pour n'importe quel problème de régression tabulaire."
pros:
  - "Généralise très bien sans trop de réglages."
  - "Fournit les importances des variables."
cons:
  - "Ne peut pas extrapoler en dehors des valeurs vues à l'entraînement."
hyperparameters:
  n_estimators: "Nombre d'arbres dans la forêt (ex: 100)."
  max_depth: "Profondeur maximale."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import RandomForestRegressor
  from sklearn.pipeline import Pipeline

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: MAX_DEPTH | number]
  MAX_DEPTH = 10
  # [/PARAM]

  task_type = "regression"
  meta = {
      "model_name": "Random Forest Regressor",
      "framework": "scikit-learn",
      "task_type": task_type
  }

  depth = None if int(MAX_DEPTH) <= 0 else int(MAX_DEPTH)
  model = RandomForestRegressor(n_estimators=int(N_ESTIMATORS), max_depth=depth, n_jobs=-1, random_state=42)

  if 'preprocessor' in globals() and preprocessor is not None:
      full_pipeline = Pipeline([
          ('preprocessor', preprocessor),
          ('model', model)
      ])
  else:
      full_pipeline = Pipeline([
          ('model', model)
      ])

  full_pipeline.fit(X_train, y_train)

  y_pred = full_pipeline.predict(X_test)
  y_proba = None

  feature_importances = None
  if hasattr(model, 'feature_importances_'):
      if 'preprocessor' in globals() and hasattr(preprocessor, 'get_feature_names_out'):
          try:
              feature_names = preprocessor.get_feature_names_out()
              if len(feature_names) == len(model.feature_importances_):
                  feature_importances = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False).head(20).to_dict()
          except Exception:
              pass
      else:
          if hasattr(X_train, 'columns'):
              feature_importances = pd.Series(model.feature_importances_, index=X_train.columns).sort_values(ascending=False).head(20).to_dict()

  training_history = []
illustration_mermaid: |
  graph TD
    subgraph Data Flow
      Input([Raw Features]) --> Preprocessor[[Data Preprocessing]]
      Preprocessor --> Bootstrap[Bootstrap Sampling]
    end
    subgraph Random Forest Ensemble
      Bootstrap --> Tree1[Regression Tree 1]
      Bootstrap --> Tree2[Regression Tree 2]
      Bootstrap --> TreeN[Regression Tree N]
      Tree1 --> Split1{Random Feature Split}
      Tree2 --> Split2{Random Feature Split}
      TreeN --> SplitN{Random Feature Split}
    end
    subgraph Output
      Split1 --> Pred1(Leaf Node Output)
      Split2 --> Pred2(Leaf Node Output)
      SplitN --> PredN(Leaf Node Output)
      Pred1 --> Mean((Average))
      Pred2 --> Mean
      PredN --> Mean
      Mean --> Pred([Final Prediction])
    end
    style Input fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
    style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

