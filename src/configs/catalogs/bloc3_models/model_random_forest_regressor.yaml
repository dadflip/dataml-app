id: "model_random_forest_regressor"
name: "Model: Random Forest Regressor"
description: |
  Modèle d'ensemble pour la régression continue s'appuyant sur l'algorithme des forêts aléatoires (Random Forest). Il construit une multitude d'arbres de régression lors de l'entraînement et retourne la moyenne de leurs prédictions.
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: |
  Constitue une excellente ligne de base (baseline) par défaut pour pratiquement n'importe quel problème de régression tabulaire, particulièrement lorsque la relation entre les variables est non-linéaire et que le jeu de données contient du bruit.
use_cases:
  - "Prédiction de prix de l'immobilier ou de véhicules d'occasion avec de multiples caractéristiques."
  - "Estimation des ventes futures (séries temporelles transformées en données tabulaires)."
  - "Prédiction de rendement agricole basée sur un mix de variables catégorielles et continues."
pros:
  - "Capacité de généralisation exceptionnelle avec très peu de réglages nécessaires."
  - "Fournit naturellement une mesure de l'importance des variables (feature importances)."
  - "Extrêmement robuste face aux valeurs aberrantes (outliers) et aux variables non pertinentes."
cons:
  - "Incapacité fondamentale à extrapoler en dehors des plages de valeurs cibles observées à l'entraînement."
  - "Peut consommer beaucoup d'espace mémoire et devenir lent à l'inférence pour de très grandes forêts."
  - "La prédiction n'est pas continue ni lisse, ce qui peut poser problème pour certaines applications."
hyperparameters:
  n_estimators: "Nombre d'arbres dans la forêt (ex: 100)."
  max_depth: "Profondeur maximale."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import RandomForestRegressor
  from sklearn.pipeline import Pipeline

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: MAX_DEPTH | number]
  MAX_DEPTH = 10
  # [/PARAM]

  task_type = "regression"
  meta = {
      "model_name": "Random Forest Regressor",
      "framework": "scikit-learn",
      "task_type": task_type
  }

  depth = None if int(MAX_DEPTH) <= 0 else int(MAX_DEPTH)
  model = RandomForestRegressor(n_estimators=int(N_ESTIMATORS), max_depth=depth, n_jobs=-1, random_state=42)

  if 'preprocessor' in globals() and preprocessor is not None:
      full_pipeline = Pipeline([
          ('preprocessor', preprocessor),
          ('model', model)
      ])
  else:
      full_pipeline = Pipeline([
          ('model', model)
      ])

  full_pipeline.fit(X_train, y_train)

  y_pred = full_pipeline.predict(X_test)
  y_proba = None

  feature_importances = None
  if hasattr(model, 'feature_importances_'):
      if 'preprocessor' in globals() and hasattr(preprocessor, 'get_feature_names_out'):
          try:
              feature_names = preprocessor.get_feature_names_out()
              if len(feature_names) == len(model.feature_importances_):
                  feature_importances = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False).head(20).to_dict()
          except Exception:
              pass
      else:
          if hasattr(X_train, 'columns'):
              feature_importances = pd.Series(model.feature_importances_, index=X_train.columns).sort_values(ascending=False).head(20).to_dict()

  training_history = []
