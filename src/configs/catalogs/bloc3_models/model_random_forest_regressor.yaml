id: "model_random_forest_regressor"
name: "Model: Random Forest Regressor"
description: "Forêt Aléatoire pour la régression. Moyenne les prédictions d'un grand nombre d'arbres de décision."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: "Excellent modèle de base par défaut pour n'importe quel problème de régression tabulaire."
pros:
  - "Généralise très bien sans trop de réglages."
  - "Fournit les importances des variables."
cons:
  - "Ne peut pas extrapoler en dehors des valeurs vues à l'entraînement."
hyperparameters:
  n_estimators: "Nombre d'arbres dans la forêt (ex: 100)."
  max_depth: "Profondeur maximale."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import RandomForestRegressor

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: MAX_DEPTH | number]
  MAX_DEPTH = 10
  # [/PARAM]

  print(f"[MODEL] Entraînement Random Forest Regressor (n_estimators={N_ESTIMATORS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      depth = None if MAX_DEPTH <= 0 else int(MAX_DEPTH)
      
      model = RandomForestRegressor(n_estimators=int(N_ESTIMATORS), max_depth=depth, n_jobs=-1, random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
