code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import LinearRegression

  print(f"[MODEL] Entraînement Linear Regression...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = LinearRegression()
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None # Invalide en régression
      
      feature_importances = None
      if 'feature_names_out' in locals():
          if len(model.coef_) == len(feature_names_out):
              feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
      meta = {}
illustration_mermaid: |
  graph TD
    subgraph Data
      X[Features X] --> Model
      Y[Target Y] --> Model
    end
    subgraph OLS Regression
      Model[Ordinary Least Squares] --> Loss[Minimize MSE Loss]
      Loss --> Weights[Fit Coefficients W]
      Weights --> Bias[Fit Intercept b]
    end
    subgraph Output
      Weights --> Equation[y = XW + b]
      Bias --> Equation
      Equation --> Pred[Continuous Predictions]
    end
    style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
    style Loss fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff
    style Pred fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

