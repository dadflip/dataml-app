id: "model_linear_regression"
name: "Model: Linear Regression"
description: |
  Régression linéaire classique par les moindres carrés ordinaires (OLS). Elle cherche la combinaison linéaire des variables explicatives qui minimise la somme des carrés des résidus (erreur quadratique moyenne).
category: "Modèles Linéaires"
tags: ["model", "regression", "tabular", "sklearn", "linear"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser comme modèle de référence (baseline) pour prédire une valeur continue. Idéal lorsque la relation entre les variables explicatives et la cible est supposée linéaire.
use_cases:
  - "Évaluation de l'impact direct d'une dépense publicitaire sur les ventes."
  - "Modélisation de la relation entre la surface d'un bien immobilier et son prix."
  - "Prédiction de variables biométriques continues simples."
pros:
  - "Extrêmement rapide à entraîner, même sur de grands jeux de données."
  - "Modèle parfaitement interprétable grâce aux coefficients associés à chaque variable."
  - "Fournit une excellente ligne de base (baseline) avant de tester des modèles plus complexes."
cons:
  - "Sensibilité extrême aux valeurs aberrantes (outliers) qui peuvent fausser complètement la droite de régression."
  - "Souffre fortement de la multicollinéarité (variables explicatives corrélées entre elles)."
  - "Incapable de capturer des relations non linéaires sans ingénierie de caractéristiques complexe."
hyperparameters: {}
