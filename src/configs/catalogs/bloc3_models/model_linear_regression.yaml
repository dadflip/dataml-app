math_theory: |
  Ordinary Least Squares (OLS) Linear Regression finds the set of weights that minimizes the Residual Sum of Squares (RSS) between the true target and the predicted target. The prediction is a simple linear combination of the input features:
  
  $$ \textcolor{#3b82f6}{\hat{y}} = \textcolor{#10b981}{X} \textcolor{#ef4444}{w} $$
  
  The optimization problem can be solved in closed form or via gradient descent, minimizing the loss function:
  
  $$ \min_{w} \left( || \textcolor{#10b981}{X} \textcolor{#ef4444}{w} - \textcolor{#3b82f6}{y} ||_2^2 \right) $$
  
  Where $\textcolor{#10b981}{X}$ is the feature matrix, $\textcolor{#ef4444}{w}$ are the learned coefficients (including the intercept), and $\textcolor{#3b82f6}{y}$ is the ground truth continuous target.

