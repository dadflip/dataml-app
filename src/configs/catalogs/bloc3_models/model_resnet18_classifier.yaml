id: "model_resnet18_classifier"
name: "Model: ResNet-18 (Fine-Tuning)"
description: |
  Modèle de réseau de neurones résiduel léger (18 couches) conçu initialement pour la vision par ordinateur, pré-entraîné sur la vaste base de données ImageNet. Ce modèle est ici configuré pour être adapté (fine-tuned) sur vos propres images.
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "resnet", "deep-learning"]
applies_to: ["Images"]
when_to_use: |
  Idéal comme point de départ robuste et rapide (baseline avancée) pour des tâches de classification d'images, particulièrement lorsque les ressources matérielles (GPU) sont limitées ou que le temps d'entraînement doit être court.
use_cases:
  - "Classification rapide de défauts manufacturiers sur des lignes de production."
  - "Catégorisation d'images documentaires ou de reçus."
  - "Reconnaissance basique d'objets ou d'animaux sur des photographies standard."
pros:
  - "Bénéficie d'un excellent extracteur de caractéristiques visuelles grâce à l'apprentissage par transfert (poids ImageNet)."
  - "Architecture légère offrant un très bon compromis entre précision et rapidité d'exécution."
  - "Entraînement nettement plus rapide comparé à des architectures plus profondes (ex: ResNet-50)."
cons:
  - "Exige un prétraitement spécifique (redimensionnement souvent en 224x224, normalisation ImageNet)."
  - "Moins performant que des modèles plus profonds pour distinguer des détails visuels très subtils (fine-grained classification)."
hyperparameters:
  epochs: "Nombre d'époques de fine-tuning (ex: 3)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
math_theory: |
  L'innovation majeure des architectures ResNet réside dans l'utilisation de blocs résiduels (Skip Connections ou connexions de saut).
  Au lieu d'apprendre directement une transformation sous-jacente complexe $\textcolor{#fbbf24}{H(x)}$, un bloc résiduel apprend une fonction résiduelle $\textcolor{#10b981}{F(x)} = \textcolor{#fbbf24}{H(x)} - \textcolor{#3b82f6}{x}$.
  La sortie $\textcolor{#fbbf24}{y}$ du bloc est définie en ajoutant l'entrée $\textcolor{#3b82f6}{x}$ (qui a contourné les couches) à la transformation $\textcolor{#10b981}{F(x)}$ :
  
  $$
  \textcolor{#fbbf24}{y} = \sigma(\textcolor{#10b981}{F(\textcolor{#3b82f6}{x}, W_i)} + \textcolor{#3b82f6}{x})
  $$
  
  où $\sigma$ est la fonction d'activation ReLU. Cette approche prévient le problème de la disparition du gradient dans les réseaux très profonds (comme ResNet-18 ou ResNet-50) et facilite l'apprentissage de la transformation d'identité $\textcolor{#10b981}{F(x)} \approx 0$ si les couches ne sont pas nécessaires.
