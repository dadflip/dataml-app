    subgraph ResNet18 Architecture
      Tensors --> Conv1[Conv1 7x7 + MaxPool]
      Conv1 --> Layer1[Residual Block 1]
      Layer1 --> Layer2[Residual Block 2]
      Layer2 --> Layer3[Residual Block 3]
      Layer3 --> Layer4[Residual Block 4]
      Layer4 --> AvgPool[AdaptiveAvgPool2D]
      AvgPool --> Flatten[Flatten]
      Flatten --> FC[Replaced Fully Connected Layer]
    end
    subgraph Output
      FC --> Softmax(Softmax)
      Softmax --> Probs([Class Probabilities])
      Probs --> Pred([Predictions])
    end
