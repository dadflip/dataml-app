id: "model_resnet18_classifier"
name: "Model: ResNet-18 (Fine-Tuning)"
description: "Réseau Résiduel léger (18 couches) pré-entraîné sur ImageNet, fine-tuné sur vos données."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "resnet", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Modèle de vision standard très puissant, idéal comme baseline avancée."
pros:
