id: "model_ridge_regression"
name: "Model: Ridge Regression"
description: "Régression linéaire pénalisée (L2) visant à réduire le sur-apprentissage en limitant l'amplitude des coefficients, tout en gérant efficacement la multicolinéarité."
category: "Modèles Linéaires"
tags: ["model", "regression", "tabular", "sklearn", "linear"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal lors de la présence de nombreuses variables fortement corrélées, ou pour des jeux de données avec un ratio variables/observations élevé."
use_cases:
  - "Prévision des ventes avec des facteurs économiques interdépendants."
  - "Modélisation des prix immobiliers utilisant de nombreuses caractéristiques corrélées (ex: surface et nombre de pièces)."
  - "Analyse d'impact en présence de colinéarité spatiale ou temporelle."
pros:
  - "Maintient une forte interprétabilité grâce à sa nature linéaire."
  - "Gère la multicolinéarité mieux que la régression linéaire classique (MCO)."
  - "Moins sensible aux valeurs aberrantes grâce à la pénalisation de la variance."
cons:
  - "Ne réalise pas de sélection de variables (aucun coefficient n'est ramené exactement à zéro, contrairement à Lasso)."
  - "Sensible à l'échelle des données, nécessitant souvent une standardisation préalable."
  - "Performances limitées sur des relations hautement non-linéaires."
hyperparameters:
  alpha: "Force de régularisation (ex: 1.0)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import Ridge

  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement Ridge Regression (alpha={ALPHA})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = Ridge(alpha=float(ALPHA), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals():
          if len(model.coef_) == len(feature_names_out):
              feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
math_theory: |
  La régression Ridge minimise la somme des carrés des résidus (MCO) tout en appliquant une pénalité $L_2$ à la norme des coefficients pour prévenir le surapprentissage et gérer la multicolinéarité.

  $$
  L(\textcolor{#3b82f6}{w}) = ||\textcolor{#10b981}{X}\textcolor{#3b82f6}{w} - \textcolor{#10b981}{y}||_2^2 + \textcolor{#fbbf24}{\alpha} ||\textcolor{#3b82f6}{w}||_2^2 
  $$

  - $\textcolor{#10b981}{X}$ : Matrice des variables (features)
  - $\textcolor{#10b981}{y}$ : Vecteur cible
  - $\textcolor{#3b82f6}{w}$ : Vecteur des coefficients du modèle (poids)
  - $\textcolor{#fbbf24}{\alpha}$ : Hyperparamètre de régularisation contrôlant la force de la pénalité
