id: "model_ridge_regression"
name: "Model: Ridge Regression"
description: "Régression linéaire avec pénalisation L2 pour éviter le sur-apprentissage et gérer la collinéarité."
category: "Modèles Linéaires"
tags: ["model", "regression", "tabular", "sklearn", "linear"]
applies_to: ["Tabulaire"]
when_to_use: "Quand il y a beaucoup de features très corrélées entre elles."
pros:
  - "Plus robuste que la régression linéaire simple."
cons:
  - "Ne met jamais les coefficients exactement à zéro (pas de feature selection)."
hyperparameters:
  alpha: "Force de régularisation (ex: 1.0)."
