id: "model_knn_regressor"
name: "Model: K-Nearest Neighbors Regressor"
description: "Algorithme de régression non paramétrique et fondé sur la mémorisation (lazy learning). Il estime la valeur continue d'une nouvelle observation en calculant la moyenne (ou la médiane) des valeurs cibles de ses K plus proches voisins."
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "regression", "tabular", "sklearn", "distance", "knn", "lazy-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal pour établir une baseline rapide (modèle repère) en régression ou pour capturer des comportements locaux très non-linéaires sur des jeux de données comportant peu d'observations."
use_cases:
  - "Évaluation immobilière : Estimation du prix d'un bien en fonction des biens similaires vendus aux alentours."
  - "Imputation de données manquantes : Remplacement de valeurs continues absentes (KNN Imputer)."
  - "Modélisation spatiale : Interpolation de mesures environnementales (température, pollution) entre des capteurs."
pros:
  - "Architecture extrêmement simple à appréhender et très intuitive (aucun apprentissage mathématique profond)."
  - "Entraînement quasi-immédiat (stockage direct en mémoire)."
cons:
  - "Inférence (prédiction) très lente lors du passage à l'échelle (gros datasets)."
  - "Performances fortement dégradées par la malédiction de la dimensionnalité (espaces de grande dimension)."
  - "Les variables doivent impérativement être ramenées à une même échelle de mesure (standardisation/normalisation)."
hyperparameters:
  n_neighbors: "Nombre de voisins K (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.neighbors import KNeighborsRegressor

  # [PARAM: N_NEIGHBORS | number]
  N_NEIGHBORS = 5
  # [/PARAM]

  print(f"[MODEL] Entraînement KNN Regressor (k={N_NEIGHBORS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = KNeighborsRegressor(n_neighbors=int(N_NEIGHBORS), n_jobs=-1)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
      meta = {}
