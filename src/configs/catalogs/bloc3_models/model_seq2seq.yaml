id: "model_seq2seq"
name: "Model: Sequence-to-Sequence (Seq2Seq)"
description: "Architecture Encodeur-Décodeur LSTM pour la traduction, le résumé ou la génération de texte."
category: "Attention & Transformers"
tags: ["model", "nlp", "generative", "pytorch", "seq2seq", "deep-learning"]
applies_to: ["Séquences", "Texte"]
when_to_use: "Pour traduire, résumer, ou répondre à des questions."
pros:
  - "Très flexible (taille d'entrée != taille de sortie)."
cons:
  - "Lent. Souffre sans mécanisme d'attention sur les longues phrases."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 256)."
  epochs: "Nombre d'époques (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.pipeline import Pipeline
  from sklearn.base import BaseEstimator, RegressorMixin
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: HIDDEN_SIZE | number]
  HIDDEN_SIZE = 256
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 10
  # [/PARAM]

  task_type = "generative"
  meta = {
      "model_name": "Seq2Seq (LSTM)",
      "framework": "pytorch",
      "task_type": task_type
  }

  full_pipeline = None
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = []

  if torch is not None:
      # Prepare data
      if 'preprocessor' in globals() and preprocessor is not None:
          X_train_processed = preprocessor.fit_transform(X_train)
          X_test_processed = preprocessor.transform(X_test)
      else:
          X_train_processed = X_train.values if isinstance(X_train, pd.DataFrame) else X_train
          X_test_processed = X_test.values if isinstance(X_test, pd.DataFrame) else X_test
          
      if hasattr(X_train_processed, "toarray"):
          X_train_processed = X_train_processed.toarray()
      if hasattr(X_test_processed, "toarray"):
          X_test_processed = X_test_processed.toarray()

      X_tr_np = np.array(X_train_processed, dtype=np.float32)
      X_te_np = np.array(X_test_processed, dtype=np.float32)

      if len(X_tr_np.shape) == 2:
          X_tr_np = X_tr_np.reshape((X_tr_np.shape[0], 1, X_tr_np.shape[1]))
          X_te_np = X_te_np.reshape((X_te_np.shape[0], 1, X_te_np.shape[1]))

      in_feat = X_tr_np.shape[2]
      hs = int(HIDDEN_SIZE)

      class Encoder(nn.Module):
          def __init__(self, input_dim, hidden_dim):
              super().__init__()
              self.lstm = nn.LSTM(input_dim, hidden_dim, batch_first=True)
          def forward(self, x):
              _, (h, c) = self.lstm(x)
              return h, c

      class Decoder(nn.Module):
          def __init__(self, output_dim, hidden_dim):
              super().__init__()
              self.lstm = nn.LSTM(output_dim, hidden_dim, batch_first=True)
              self.fc = nn.Linear(hidden_dim, output_dim)
          def forward(self, x, h, c):
              out, (h, c) = self.lstm(x, (h, c))
              return self.fc(out), h, c

      class Seq2Seq(nn.Module):
          def __init__(self, encoder, decoder):
              super().__init__()
              self.encoder = encoder
              self.decoder = decoder
          def forward(self, src, trg):
              h, c = self.encoder(src)
              out, _, _ = self.decoder(trg, h, c)
              return out

      encoder = Encoder(in_feat, hs)
      decoder = Decoder(in_feat, hs)
      model = Seq2Seq(encoder, decoder)
      device = torch.device("cuda" if torch.cuda.is_available() else "mps" if torch.backends.mps.is_available() else "cpu")
      model = model.to(device)

      optimizer = optim.Adam(model.parameters(), lr=0.001)
      criterion = nn.MSELoss()

      # Auto-encoding : on reconstruit l'entrée
      dataset = TensorDataset(torch.tensor(X_tr_np), torch.tensor(X_tr_np))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)

      model.train()
      for epoch in range(int(EPOCHS)):
          epoch_loss = 0.0
          for bx, by in loader:
              bx, by = bx.to(device), by.to(device)
              optimizer.zero_grad()
              outputs = model(bx, by)
              loss = criterion(outputs, by)
              loss.backward()
              optimizer.step()
              epoch_loss += loss.item()
          training_history.append({"epoch": epoch+1, "loss": epoch_loss/len(loader)})

      model.eval()
      with torch.no_grad():
          xt = torch.tensor(X_te_np).to(device)
          y_pred = model(xt, xt).cpu().numpy()
          
          # Flatten to match test set
          y_pred = y_pred.reshape(y_pred.shape[0], -1)

      class Seq2SeqWrapper(BaseEstimator, RegressorMixin):
          def __init__(self, model, device):
              self.model = model
              self.device = device
          def predict(self, X):
              self.model.eval()
              if hasattr(X, "toarray"): X = X.toarray()
              X_np = np.array(X, dtype=np.float32)
              if len(X_np.shape) == 2:
                  X_np = X_np.reshape((X_np.shape[0], 1, X_np.shape[1]))
              X_tensor = torch.tensor(X_np).to(self.device)
              with torch.no_grad():
                  preds = self.model(X_tensor, X_tensor).cpu().numpy()
              return preds.reshape(preds.shape[0], -1)

      wrapped_model = Seq2SeqWrapper(model, device)

      if 'preprocessor' in globals() and preprocessor is not None:
          full_pipeline = Pipeline([
              ('preprocessor', preprocessor),
              ('model', wrapped_model)
          ])
      else:
          full_pipeline = Pipeline([
              ('model', wrapped_model)
          ])
