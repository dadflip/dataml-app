id: "model_bidirectional_lstm"
name: "Model: Bi-Directional LSTM"
description: "LSTM qui lit la séquence dans les deux sens (avant et arrière) pour mieux capturer le contexte global."
category: "Réseaux Séquentiels (RNN)"
tags: ["model", "classification", "timeseries", "nlp", "pytorch", "bi-lstm", "deep-learning"]
applies_to: ["Séquences", "Texte"]
when_to_use: "Classification de texte ou analyse de sentiment avec des ressources limitées."
pros:
  - "Contexte riche (passé et futur)."
cons:
  - "Plus lourd en mémoire qu'un LSTM classique."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 64)."
  num_layers: "Nombre de couches (ex: 2)."
  epochs: "Nombre d'époques (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np

  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "Bi-Directional LSTM"}

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: HIDDEN_SIZE | number]
  HIDDEN_SIZE = 64
  # [/PARAM]

  # [PARAM: NUM_LAYERS | number]
  NUM_LAYERS = 2
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 10
  # [/PARAM]

  print(f"[MODEL] Entraînement Bi-LSTM PyTorch (epochs={EPOCHS}, hidden={HIDDEN_SIZE})...")

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      # Use preprocessor if available
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          X_train_proc = preprocessor.fit_transform(X_train)
          X_test_proc = preprocessor.transform(X_test)
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)])
      else:
          X_train_proc = X_train
          X_test_proc = X_test
          full_pipeline = None

      X_tr_np = np.array(X_train_proc, dtype=np.float32)
      X_te_np = np.array(X_test_proc, dtype=np.float32)
      
      # For LSTM we need 3D input: (batch, seq_len, features)
      # If 2D (batch, features), we treat it as seq_len=1
      if len(X_tr_np.shape) == 2:
          X_tr_np = X_tr_np.reshape((X_tr_np.shape[0], 1, X_tr_np.shape[1]))
          X_te_np = X_te_np.reshape((X_te_np.shape[0], 1, X_te_np.shape[1]))
          
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      dataset = TensorDataset(torch.tensor(X_tr_np), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)

      class BiLSTMClassifier(nn.Module):
          def __init__(self, input_dim, hidden_dim, num_layers, num_classes):
              super().__init__()
              self.lstm = nn.LSTM(
                  input_dim, 
                  hidden_dim, 
                  num_layers, 
                  batch_first=True, 
                  bidirectional=True, 
                  dropout=0.2 if num_layers>1 else 0
              )
              # * 2 because bidirectional
              self.fc = nn.Linear(hidden_dim * 2, num_classes)
              
          def forward(self, x):
              # out shape: (batch, seq_len, num_directions * hidden_dim)
              out, _ = self.lstm(x)
              # We take the output of the last time step
              return self.fc(out[:, -1, :])

      model = BiLSTMClassifier(X_tr_np.shape[2], int(HIDDEN_SIZE), int(NUM_LAYERS), num_classes)
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      
      model.train()
      final_loss = 0.0
      for epoch in range(int(EPOCHS)):
          running_loss = 0.0
          for batch_X, batch_y in loader:
              batch_X, batch_y = batch_X.to(device), batch_y.to(device)
              optimizer.zero_grad()
              loss = criterion(model(batch_X), batch_y)
              loss.backward()
              optimizer.step()
              running_loss += loss.item()
          final_loss = running_loss / len(loader)
              
      model.eval()
      with torch.no_grad():
          logits = model(torch.tensor(X_te_np).to(device))
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
          
      if not has_preprocessor:
          full_pipeline = model
          
      training_history = {"status": "success", "final_loss": float(final_loss), "epochs": int(EPOCHS)}

illustration_mermaid: |
    graph TD
      subgraph Inputs
        X([X_train 3D Tensor\nBatch, Seq, Feat])
      end
      
      subgraph Bi-LSTM Architecture
        X --> LSTM[Bi-Directional LSTM\nHidden Size, N Layers]
        
        %% Forward and Backward representations
        LSTM -- Forward Pass --> H_fwd[Forward Hidden State]
        LSTM -- Backward Pass --> H_bwd[Backward Hidden State]
        
        H_fwd --> Concat[Concatenation\nH_fwd : H_bwd]
        H_bwd --> Concat
      end
      
      subgraph Classification Head
        Concat -- Last Timestep --> FC[Fully Connected Layer\nHidden*2 -> Classes]
        FC --> SM[Softmax]
      end
      
      SM --> Pred([Predicted Label])
      
