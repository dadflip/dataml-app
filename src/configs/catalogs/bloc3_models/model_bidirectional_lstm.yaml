id: "model_bidirectional_lstm"
name: "Model: Bi-Directional LSTM"
description: |
  Réseau LSTM qui traite la séquence d'entrée dans les deux sens (vers l'avant et vers l'arrière).
  Cette architecture bidirectionnelle permet au modèle de capturer un contexte global riche,
  intégrant à la fois les informations passées et futures pour chaque élément de la séquence.
category: "Réseaux Séquentiels (RNN)"
tags: ["model", "classification", "timeseries", "nlp", "pytorch", "bi-lstm", "deep-learning"]
applies_to: ["Séquences", "Texte"]
when_to_use: |
  Privilégiez ce modèle pour des tâches complexes sur des séquences, comme la classification de textes avancée,
  l'analyse de sentiments nuancée, ou la prédiction de séries temporelles où le contexte environnant est crucial.
use_cases:
  - "Analyse de sentiments sur des textes longs ou complexes."
  - "Reconnaissance d'entités nommées (NER) nécessitant un contexte global."
  - "Traitement de séquences chronologiques où des motifs bidirectionnels peuvent émerger."
pros:
  - "Capture un contexte extrêmement riche (passé et futur simultanément)."
  - "Performances supérieures aux LSTM classiques sur de nombreuses tâches NLP."
cons:
  - "Consommation mémoire et temps de calcul doublés par rapport à un LSTM unilatéral."
  - "Plus complexe à paramétrer et risque accru de surapprentissage."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 64)."
  num_layers: "Nombre de couches (ex: 2)."
  epochs: "Nombre d'époques (ex: 10)."
math_theory: |
  Le Bi-LSTM calcule les représentations d'une séquence en effectuant deux passages : un dans le sens avant et un dans le sens arrière.
  Soit $\textcolor{#3b82f6}{x_t}$ l'entrée au temps $t$.
  Le passage avant calcule l'état caché $\textcolor{#10b981}{\overrightarrow{h}_t}$ :

  $$
  \textcolor{#10b981}{\overrightarrow{h}_t} = \text{LSTM}_{fwd}(\textcolor{#3b82f6}{x_t}, \textcolor{#10b981}{\overrightarrow{h}_{t-1}})
  $$

  Le passage arrière calcule l'état caché $\textcolor{#fbbf24}{\overleftarrow{h}_t}$ en lisant la séquence à l'envers :

  $$
  \textcolor{#fbbf24}{\overleftarrow{h}_t} = \text{LSTM}_{bwd}(\textcolor{#3b82f6}{x_t}, \textcolor{#fbbf24}{\overleftarrow{h}_{t+1}})
  $$

  La représentation finale au temps $t$, $\textcolor{#8b5cf6}{h_t}$, est la concaténation des deux états :

  $$
  \textcolor{#8b5cf6}{h_t} = [\textcolor{#10b981}{\overrightarrow{h}_t} ; \textcolor{#fbbf24}{\overleftarrow{h}_t}]
  $$

  La sortie $\textcolor{#ef4444}{y}$ pour la classification repose souvent sur la dernière combinaison : $\textcolor{#ef4444}{y} = \text{Softmax}(W \cdot \textcolor{#8b5cf6}{h_T} + b)$.
