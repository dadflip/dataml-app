id: "model_lda_topic"
name: "Model: Latent Dirichlet Allocation (LDA)"
description: "Modèle probabiliste génératif non-supervisé utilisé pour l'extraction de thématiques (Topic Modeling). Il postule que chaque document est un mélange de sujets et que chaque sujet est une distribution de mots."
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "unsupervised", "topic-modeling", "sklearn", "lda", "text-mining"]
applies_to: ["Texte"]
when_to_use: "À privilégier pour explorer de larges corpus documentaires non structurés et non labellisés, afin d'en extraire automatiquement les grands thèmes sous-jacents."
use_cases:
  - "Veille documentaire : Catégorisation automatique d'articles de presse ou de publications scientifiques."
  - "Analyse des retours clients : Identification des sujets de plainte ou d'insatisfaction dans les avis en ligne (reviews)."
  - "Moteurs de recommandation : Proposition de contenus partageant la même distribution thématique que ce que l'utilisateur lit."
pros:
  - "Méthode non supervisée très robuste (pas besoin de données préalablement annotées)."
  - "Résultats hautement interprétables (chaque sujet est décrit par ses mots les plus fréquents/exclusifs)."
  - "Approche probabiliste 'douce' (soft clustering) : un document peut appartenir à plusieurs thèmes."
cons:
  - "Nécessite la définition du nombre de sujets (topics) en amont, souvent délicat à optimiser."
  - "Gourmand en ressources et lent sur de très gros corpus (optimisation variationnelle)."
  - "Sensible au prétraitement : nécessite impérativement une vectorisation par comptage (CountVectorizer) et l'exclusion des mots vides (stopwords)."
hyperparameters:
  n_components: "Nombre de topics à découvrir (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.decomposition import LatentDirichletAllocation

  # [PARAM: N_COMPONENTS | number]
  N_COMPONENTS = 10
  # [/PARAM]

  print(f"[MODEL] Entraînement LDA Topic Modeling (n_topics={N_COMPONENTS})...")
  if 'X_train' in locals() and 'X_test' in locals():
      # LDA s'attend à une matrice document-terme (idéalement CountVectorizer, venant du bloc Preprocessing)
      # On va utiliser le preprocessor s'il a transformé les données, sinon on fait un vecteur local
      
      model = LatentDirichletAllocation(n_components=int(N_COMPONENTS), random_state=42)
      
      # Si on a du texte brut qui n'a pas été vectorisé, on le fait à la volée
      X_tr_proc = X_train
      X_te_proc = X_test
      
      if isinstance(X_train, pd.DataFrame) and 'text' in X_train.columns:
          from sklearn.feature_extraction.text import CountVectorizer
          cv = CountVectorizer(max_features=5000)
          X_tr_proc = cv.fit_transform(X_train['text'].astype(str))
          X_te_proc = cv.transform(X_test['text'].astype(str))
          
      model.fit(X_tr_proc)
      
      # En topic modeling, "predict" donne la distribution des topics pour chaque doc
      topic_dist = model.transform(X_te_proc)
      y_pred = np.argmax(topic_dist, axis=1) # Le topic dominant
      y_proba = topic_dist # Probabilités d'appartenir à chaque topic
      
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "perplexity": model.perplexity(X_te_proc)}
      task_type = "clustering" # Topic modeling vu comme clustering doux
      meta = {}
      print("[MODEL] LDA entraîné avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables.")
math_theory: |
  L'allocation de Dirichlet latente (LDA) est un modèle génératif probabiliste. Il suppose que chaque document est un mélange de sujets et que chaque sujet est une distribution sur un vocabulaire de mots.
  
  Le processus génératif pour un document $d$ est le suivant :
  1. Tirer une distribution de sujets $\theta_d \sim \text{Dirichlet}(\textcolor{#fbbf24}{\alpha})$
  2. Pour chaque sujet $k$, tirer une distribution de mots $\phi_k \sim \text{Dirichlet}(\textcolor{#10b981}{\beta})$
  3. Pour chaque mot $\textcolor{#ef4444}{w_{d,n}}$ dans le document $d$ :
     - Choisir un sujet $\textcolor{#3b82f6}{z_{d,n}} \sim \text{Multinomial}(\theta_d)$
     - Générer le mot $\textcolor{#ef4444}{w_{d,n}} \sim \text{Multinomial}(\phi_{\textcolor{#3b82f6}{z_{d,n}}})$
  
  Probabilité conjointe du modèle :
  
  $$
  P(\textcolor{#ef4444}{W}, \textcolor{#3b82f6}{Z}, \Theta, \Phi | \textcolor{#fbbf24}{\alpha}, \textcolor{#10b981}{\beta}) = \prod_{k=1}^{\textcolor{#8b5cf6}{K}} P(\phi_k | \textcolor{#10b981}{\beta}) \prod_{d=1}^{D} P(\theta_d | \textcolor{#fbbf24}{\alpha}) \prod_{n=1}^{N_d} P(\textcolor{#3b82f6}{z_{d,n}} | \theta_d) P(\textcolor{#ef4444}{w_{d,n}} | \phi_{\textcolor{#3b82f6}{z_{d,n}}}) 
  $$
  
  - $\textcolor{#fbbf24}{\alpha}, \textcolor{#10b981}{\beta}$ : Hyperparamètres de concentration des distributions a priori de Dirichlet
  - $\theta_d$ : Distribution des sujets pour le document $d$
  - $\phi_k$ : Distribution des mots pour le sujet $k$
  - $\textcolor{#3b82f6}{z_{d,n}}$ : Assignation de sujet latent pour le $n$-ième mot
  - $\textcolor{#ef4444}{w_{d,n}}$ : Mot observé
  - $\textcolor{#8b5cf6}{K}$ : Nombre total de sujets
