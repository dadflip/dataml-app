id: "model_lstm_forecaster"
name: "Model: LSTM Regressor (Deep Learning)"
description: "Modèle de réseau de neurones récurrent (RNN) de type Long Short-Term Memory (LSTM) codé en PyTorch, spécialement conçu pour la régression et la prévision de séries temporelles."
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "pytorch", "lstm", "deep-learning"]
applies_to: ["Séries Temporelles", "Tabulaire"]
when_to_use: "Privilégier ce modèle lorsque la dimension séquentielle ou temporelle des données est critique, nécessitant la mémorisation de dépendances à court et long terme pour une prévision précise."
use_cases:
  - "Prévision de ventes ou de la demande sur plusieurs horizons temporels."
  - "Analyse prédictive des marchés financiers et cours boursiers."
  - "Surveillance de capteurs industriels pour la maintenance prédictive et la détection d'anomalies."
pros:
  - "Capacité exceptionnelle à capturer les dépendances temporelles à long terme grâce à sa cellule de mémoire intégrée."
  - "Flexible et adaptable aux problèmes de prévision complexes impliquant de multiples variables explicatives (multivarié)."
  - "Moins vulnérable au problème du gradient évanouissant que les réseaux récurrents traditionnels (RNN)."
cons:
  - "Processus d'optimisation et d'ajustement des hyperparamètres complexe et potentiellement chronophage."
  - "Nécessite souvent de grandes quantités de données et d'importantes ressources de calcul (GPU) pour un entraînement optimal."
hyperparameters:
  hidden_size: "Nombre de neurones cachés (ex: 50)."
  num_layers: "Nombre de couches LSTM (ex: 2)."
  epochs: "Nombre d'époques d'entraînement (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.base import BaseEstimator, RegressorMixin
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
      TORCH_AVAILABLE = True
  except ImportError:
      TORCH_AVAILABLE = False
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: HIDDEN_SIZE | number]
  HIDDEN_SIZE = 50
  # [/PARAM]

  # [PARAM: NUM_LAYERS | number]
  NUM_LAYERS = 2
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {}

  if TORCH_AVAILABLE:
      class LSTMForecasterTorch(nn.Module):
          def __init__(self, input_dim, hidden_dim, num_layers):
              super().__init__()
              self.lstm = nn.LSTM(input_dim, hidden_dim, num_layers, batch_first=True, dropout=0.2 if num_layers>1 else 0)
              self.fc = nn.Linear(hidden_dim, 1)
              
          def forward(self, x):
              out, _ = self.lstm(x)
              out = self.fc(out[:, -1, :])
              return out
              
      class SklearnLSTMRegressor(BaseEstimator, RegressorMixin):
          def __init__(self, hidden_size=50, num_layers=2, epochs=20):
              self.hidden_size = hidden_size
              self.num_layers = num_layers
              self.epochs = epochs
              self.model = None
              self.device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
              self.final_loss = None
              
          def fit(self, X, y):
              X_np = np.array(X)
              y_np = np.array(y)
              
              if len(X_np.shape) == 2:
                  X_np = X_np.reshape((X_np.shape[0], 1, X_np.shape[1]))
                  
              input_size = X_np.shape[2]
              
              X_t = torch.tensor(X_np, dtype=torch.float32)
              y_t = torch.tensor(y_np, dtype=torch.float32).unsqueeze(1)
              
              dataset = TensorDataset(X_t, y_t)
              loader = DataLoader(dataset, batch_size=32, shuffle=False)
              
              self.model = LSTMForecasterTorch(input_size, self.hidden_size, self.num_layers).to(self.device)
              criterion = nn.MSELoss()
              optimizer = optim.Adam(self.model.parameters(), lr=0.01)
              
              self.model.train()
              for epoch in range(self.epochs):
                  for batch_X, batch_y in loader:
                      batch_X, batch_y = batch_X.to(self.device), batch_y.to(self.device)
                      optimizer.zero_grad()
                      outputs = self.model(batch_X)
                      loss = criterion(outputs, batch_y)
                      loss.backward()
                      optimizer.step()
                      self.final_loss = loss.item()
              return self
              
          def predict(self, X):
              self.model.eval()
              X_np = np.array(X)
              if len(X_np.shape) == 2:
                  X_np = X_np.reshape((X_np.shape[0], 1, X_np.shape[1]))
                  
              with torch.no_grad():
                  X_t = torch.tensor(X_np, dtype=torch.float32).to(self.device)
                  preds = self.model(X_t).cpu().numpy()
                  
              return preds.flatten()

      model = SklearnLSTMRegressor(hidden_size=int(HIDDEN_SIZE), num_layers=int(NUM_LAYERS), epochs=int(EPOCHS))

      if 'preprocessor' in locals() and preprocessor is not None:
          if hasattr(preprocessor, 'steps'):
              full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
          else:
              full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('model', model)])

      if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
          print(f"[MODEL] Entraînement LSTM Regressor ({EPOCHS} epochs, dim={HIDDEN_SIZE}, layers={NUM_LAYERS})...")
          full_pipeline.fit(X_train, y_train)
          y_pred = full_pipeline.predict(X_test)
          training_history = {"status": "success", "final_loss": model.final_loss, "epochs": EPOCHS}
  else:
      print("[MODEL] PyTorch non disponible, impossible d'entraîner le modèle LSTM Forecaster.")
      model = None
      full_pipeline = None

