math_theory: |
  Opérations au sein d'une cellule Long Short-Term Memory (LSTM) au temps $t$ :
  
  **Portes (Gates) :**
  - Porte d'oubli : $\textcolor{#ef4444}{f_t} = \sigma(W_f \cdot [\textcolor{#3b82f6}{h_{t-1}}, x_t] + b_f)$
  - Porte d'entrée : $\textcolor{#10b981}{i_t} = \sigma(W_i \cdot [\textcolor{#3b82f6}{h_{t-1}}, x_t] + b_i)$
  - Porte de sortie : $\textcolor{#8b5cf6}{o_t} = \sigma(W_o \cdot [\textcolor{#3b82f6}{h_{t-1}}, x_t] + b_o)$
  
  **États de mémoire :**
  - Candidat : $\tilde{C}_t = \tanh(W_C \cdot [\textcolor{#3b82f6}{h_{t-1}}, x_t] + b_C)$
  - État de la cellule (Mémoire Long-Terme) : $\textcolor{#fbbf24}{C_t} = \textcolor{#ef4444}{f_t} \odot \textcolor{#fbbf24}{C_{t-1}} + \textcolor{#10b981}{i_t} \odot \tilde{C}_t$
  - État caché (Mémoire Court-Terme) : $\textcolor{#3b82f6}{h_t} = \textcolor{#8b5cf6}{o_t} \odot \tanh(\textcolor{#fbbf24}{C_t})$
  
  Grâce à la porte d'oubli et l'état de cellule $\textcolor{#fbbf24}{C_t}$, le modèle empêche la disparition du gradient et conserve l'historique lointain.
