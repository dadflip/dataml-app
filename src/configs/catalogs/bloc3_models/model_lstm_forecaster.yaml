id: "model_lstm_forecaster"
name: "Model: LSTM Regressor (Deep Learning)"
description: "Long Short-Term Memory. Réseau de neurones récurrent (RNN) codé en PyTorch pour la régression / forecasting."
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "pytorch", "lstm", "deep-learning"]
applies_to: ["Séries Temporelles", "Tabulaire"]
when_to_use: "Quand la séquence temporelle ou l'ordre des lignes est crucial pour la prédiction."
pros:
  - "Capture les dépendances à long terme (mémoire)."
cons:
  - "Difficile à tuner, long à entraîner."
hyperparameters:
  hidden_size: "Nombre de neurones cachés (ex: 50)."
  num_layers: "Nombre de couches LSTM (ex: 2)."
  epochs: "Nombre d'époques d'entraînement (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch")

  # [PARAM: HIDDEN_SIZE | number]
  HIDDEN_SIZE = 50
  # [/PARAM]

  # [PARAM: NUM_LAYERS | number]
  NUM_LAYERS = 2
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  print(f"[MODEL] Entraînement PyTorch LSTM (hidden={HIDDEN_SIZE}, layers={NUM_LAYERS}, epochs={EPOCHS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      # Conversion pour PyTorch (on suppose un shape (N, Features)) -> (N, 1, Features)
      X_tr_np = X_train.values if isinstance(X_train, pd.DataFrame) else np.array(X_train)
      X_te_np = X_test.values if isinstance(X_test, pd.DataFrame) else np.array(X_test)
      y_tr_np = y_train.values if hasattr(y_train, 'values') else np.array(y_train)
      
      X_tr_t = torch.tensor(X_tr_np, dtype=torch.float32).unsqueeze(1)
      X_te_t = torch.tensor(X_te_np, dtype=torch.float32).unsqueeze(1)
      y_tr_t = torch.tensor(y_tr_np, dtype=torch.float32).unsqueeze(1)
      
      dataset = TensorDataset(X_tr_t, y_tr_t)
      loader = DataLoader(dataset, batch_size=32, shuffle=False) # Important: shuffle=False pour Time Series
      
      class LSTMModel(nn.Module):
          def __init__(self, input_size, hidden_size, num_layers):
              super().__init__()
              self.lstm = nn.LSTM(input_size, hidden_size, num_layers, batch_first=True)
              self.fc = nn.Linear(hidden_size, 1)
              
          def forward(self, x):
              out, _ = self.lstm(x)
              out = self.fc(out[:, -1, :])
              return out
              
      input_size = X_tr_np.shape[1] if len(X_tr_np.shape) > 1 else 1
      model = LSTMModel(input_size, int(HIDDEN_SIZE), int(NUM_LAYERS))
      
      criterion = nn.MSELoss()
      optimizer = optim.Adam(model.parameters(), lr=0.01)
      
      model.train()
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              
      model.eval()
      with torch.no_grad():
          y_pred = model(X_te_t).numpy().flatten()
          
      y_proba = None
      feature_importances = None
      
      # Wrapper Pipeline sklearn si besoin
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "fitted_on": len(X_train), "final_loss": float(loss)}
      task_type = "regression" # Utilisé en régression / forecasting
      print("[MODEL] Modèle LSTM entraîné avec succès.")
  else:
      print("[ERREUR] Données ou torch introuvables.")
