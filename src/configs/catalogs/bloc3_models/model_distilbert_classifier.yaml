math_theory: |
  DistilBERT est une version distillée de BERT qui traite le texte pour produire une séquence d'états cachés contextualisés. Pour les tâches de classification de séquences, l'état caché correspondant au jeton (token) spécial `[CLS]`, noté $\textcolor{#ef4444}{h_{\text{CLS}}}$, est extrait. Ce vecteur agit comme une représentation sémantique agrégée de l'ensemble de la séquence d'entrée $\textcolor{#10b981}{X}$.
  
  La distribution de probabilité prédite sur les classes possibles, où chaque classe est notée $\textcolor{#3b82f6}{y}$, est calculée en passant la représentation du jeton `[CLS]` à travers une tête de classification linéaire suivie d'une fonction d'activation softmax :
  
  $$
  P(\textcolor{#3b82f6}{y} \mid \textcolor{#10b981}{X}) = \text{Softmax}(\textcolor{#fbbf24}{W} \cdot \textcolor{#ef4444}{h_{\text{CLS}}} + \textcolor{#8b5cf6}{b})
  $$
  
  où :
  *   $\textcolor{#10b981}{X}$ représente la séquence de jetons d'entrée.
  *   $\textcolor{#ef4444}{h_{\text{CLS}}}$ est la représentation vectorielle contextualisée continue pour le jeton `[CLS]`.
  *   $\textcolor{#fbbf24}{W}$ est la matrice de poids apprise de la couche de classification linéaire.
  *   $\textcolor{#8b5cf6}{b}$ est le vecteur de biais appliqué à la transformation linéaire.
  *   $\textcolor{#3b82f6}{y}$ est la classe catégorique cible.

