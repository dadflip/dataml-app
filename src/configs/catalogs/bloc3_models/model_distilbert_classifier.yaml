math_theory: |
  DistilBERT processes text to output a sequence of hidden states. For sequence classification, the hidden state of the `[CLS]` token, denoted as $\textcolor{#ef4444}{h_{\text{CLS}}}$, is extracted as the aggregate representation of the input $\textcolor{#10b981}{X}$.
  
  The predicted probability for a class $\textcolor{#3b82f6}{y}$ is given by applying a linear transformation followed by a softmax function:
  
  $$ P(\textcolor{#3b82f6}{y} \mid \textcolor{#10b981}{X}) = \text{Softmax}(\textcolor{#fbbf24}{W} \cdot \textcolor{#ef4444}{h_{\text{CLS}}} + \textcolor{#8b5cf6}{b}) $$
  
  where:
  *   $\textcolor{#10b981}{X}$ is the input token sequence.
  *   $\textcolor{#ef4444}{h_{\text{CLS}}}$ is the contextualized vector for the `[CLS]` token.
  *   $\textcolor{#fbbf24}{W}$ is the weight matrix of the classification head.
  *   $\textcolor{#8b5cf6}{b}$ is the bias vector.
  *   $\textcolor{#3b82f6}{y}$ is the target class.

