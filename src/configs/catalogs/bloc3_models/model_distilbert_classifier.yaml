id: "model_distilbert_classifier"
name: "Model: DistilBERT Classifier (Fine-Tuning)"
description: "Version allégée de BERT. 40% plus petit, 60% plus rapide, conserve 97% de la performance."
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "classification", "transformers", "huggingface", "distilbert", "deep-learning"]
applies_to: ["Texte"]
when_to_use: "Quand vous voulez les performances de BERT mais que l'entraînement/inférence est trop lent."
pros:
  - "Bon compromis vitesse/précision."
cons:
  - "Toujours très lourd comparé au TF-IDF."
hyperparameters:
  epochs: "Nombre d'époques (ex: 3)."
code_template: |
  import pandas as pd
  import numpy as np
  import torch
  try:
      from transformers import AutoTokenizer, AutoModelForSequenceClassification, Trainer, TrainingArguments
      from datasets import Dataset
  except ImportError:
      AutoTokenizer = None
      print("[ERREUR] transformers ou datasets n'est pas installé. Lancez : !pip install transformers datasets")

  # [PARAM: EPOCHS | number]
  EPOCHS = 3
  # [/PARAM]

  print(f"[MODEL] Fine-tuning DistilBERT (epochs={EPOCHS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and AutoTokenizer is not None:
      classes = np.unique(y_train)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      X_tr_text = X_train['text'].astype(str).tolist() if isinstance(X_train, pd.DataFrame) and 'text' in X_train.columns else [str(x) for x in X_train]
      X_te_text = X_test['text'].astype(str).tolist() if isinstance(X_test, pd.DataFrame) and 'text' in X_test.columns else [str(x) for x in X_test]

      model_name = "distilbert-base-uncased"
      tokenizer = AutoTokenizer.from_pretrained(model_name)
      model_hf = AutoModelForSequenceClassification.from_pretrained(model_name, num_labels=len(classes), id2label=id2label, label2id=label2id)
      
      train_ds = Dataset.from_dict({'text': X_tr_text, 'label': y_tr_enc})
      test_ds = Dataset.from_dict({'text': X_te_text})
      
      def tokenize_func(examples):
          return tokenizer(examples['text'], padding="max_length", truncation=True, max_length=128)
          
      train_ds = train_ds.map(tokenize_func, batched=True)
      test_ds = test_ds.map(tokenize_func, batched=True)
      
      training_args = TrainingArguments(
          output_dir="./results_distil",
          num_train_epochs=int(EPOCHS),
          learning_rate=3e-5,
          per_device_train_batch_size=16,
          evaluation_strategy="no",
          save_strategy="no",
          disable_tqdm=False
      )
      
      trainer = Trainer(
          model=model_hf,
          args=training_args,
          train_dataset=train_ds
      )
      
      print("Début du Fine-Tuning DistilBERT...")
      trainer.train()
      
      predictions = trainer.predict(test_ds)
      y_pred_idx = np.argmax(predictions.predictions, axis=1)
      y_pred = np.array([id2label[i] for i in y_pred_idx])
      
      y_proba = torch.nn.functional.softmax(torch.tensor(predictions.predictions), dim=-1).numpy()
      feature_importances = None
      model = trainer
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success"}
      task_type = "classification"
      print("[MODEL] DistilBERT entraîné et Pipeline exporté.")
  else:
      print("[ERREUR] Données introuvables ou packages manquants.")
