id: "model_tpot_automl_classifier"
name: "Model: TPOT AutoML (Genetic Algorithm)"
description: |
  Tree-based Pipeline Optimization Tool (TPOT). Ce modèle AutoML utilise des algorithmes génétiques pour explorer et optimiser de manière autonome des milliers de combinaisons de pipelines d'apprentissage automatique (incluant la sélection de caractéristiques, le prétraitement et le choix de l'estimateur).
category: "AutoML"
tags: ["model", "automl", "classification", "tabular", "tpot", "genetic"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser lorsque vous disposez de ressources de calcul importantes et de beaucoup de temps, et que votre objectif absolu est de découvrir l'architecture de pipeline optimale de bout en bout avec un minimum d'intervention humaine.
use_cases:
  - "Découverte automatisée de pipelines de Machine Learning complexes pour des données tabulaires."
  - "Compétitions de Data Science (ex: Kaggle) pour trouver des combinaisons de modèles performantes et non intuitives."
  - "Recherche exhaustive de la meilleure solution de classification possible pour un problème métier critique."
  - "Génération de code de base : TPOT peut exporter le code Python du meilleur pipeline trouvé pour une utilisation future."
pros:
  - "Approche hautement innovante basée sur la programmation génétique (mutations et croisements de modèles/transformations)."
  - "Optimise simultanément le prétraitement, l'ingénierie des variables (features) et les hyperparamètres du modèle final."
  - "Permet d'exporter le code Python complet du pipeline gagnant, facilitant la mise en production."
cons:
  - "Extrêmement lent et gourmand en calculs ; les exécutions peuvent prendre des heures, voire des jours sur de gros jeux de données."
  - "Peut produire des pipelines inutilement complexes et difficiles à interpréter ou à justifier."
  - "Risque de surapprentissage (overfitting) sur l'ensemble de validation si l'algorithme tourne sur un trop grand nombre de générations."
hyperparameters:
  generations: "Nombre d'itérations génétiques (ex: 5)."
  population_size: "Taille de la population par génération (ex: 20)."
math_theory: |
  TPOT utilise la programmation génétique pour faire évoluer des pipelines d'apprentissage automatique.
  Une population de pipelines $\textcolor{#8b5cf6}{\mathcal{P}_{gen}}$ évolue au fil des générations.
  Chaque pipeline $\textcolor{#3b82f6}{P}$ est évalué sur sa capacité de classification pour obtenir un score de fitness $\textcolor{#ef4444}{F(P)}$.
  La nouvelle génération est créée via des opérations de mutation $\textcolor{#10b981}{\mu(P)}$ et de croisement $\textcolor{#fbbf24}{\chi(P_1, P_2)}$. L'objectif est de trouver le pipeline optimal $\textcolor{#3b82f6}{P^*}$ :
  
  $$
  \textcolor{#3b82f6}{P^*} = \arg\max_{P \in \mathcal{P}} \textcolor{#ef4444}{F(P)}
  $$

