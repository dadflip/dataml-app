id: "model_tpot_automl_classifier"
name: "Model: TPOT AutoML (Genetic Algorithm)"
description: "Tree-based Pipeline Optimization Tool. Utilise la programmation génétique pour trouver le meilleur pipeline (modèle + feature engineering)."
category: "AutoML"
tags: ["model", "automl", "classification", "tabular", "tpot", "genetic"]
applies_to: ["Tabulaire"]
when_to_use: "Si vous avez du temps (plusieurs heures) pour trouver LE meilleur modèle avec le preprocessing intégré."
pros:
  - "Très innovant (génétique)."
  - "Exporte le code Python du meilleur pipeline généré."
cons:
  - "Extrêmement lent."
hyperparameters:
  generations: "Nombre d'itérations génétiques (ex: 5)."
  population_size: "Taille de la population par génération (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from tpot import TPOTClassifier
  except ImportError:
      TPOTClassifier = None
      print("[ERREUR] tpot n'est pas installé. Lancez : !pip install tpot")

  # [PARAM: GENERATIONS | number]
  GENERATIONS = 5
  # [/PARAM]

  # [PARAM: POPULATION_SIZE | number]
  POPULATION_SIZE = 20
  # [/PARAM]

  print(f"[MODEL] AutoML TPOT Classifier (gens={GENERATIONS}, pop={POPULATION_SIZE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and TPOTClassifier is not None:
      # Attention : TPOT est très lent ! On limite les paramètres pour la démo
      model = TPOTClassifier(
          generations=int(GENERATIONS), 
          population_size=int(POPULATION_SIZE), 
          verbosity=2, 
          random_state=42, 
          n_jobs=-1
      )
      
      print("Optimisation génétique en cours (ceci peut être TRÈS long)...")
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model.fitted_pipeline_, 'predict_proba') else None
      feature_importances = None
      
      # TPOT expose son meilleur pipeline dans `fitted_pipeline_`
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model.fitted_pipeline_)])
      else:
          full_pipeline = model.fitted_pipeline_
          
      training_history = {"status": "success", "pipeline_score": model.score(X_test, y_test) if 'y_test' in locals() else None}
      task_type = "classification"
      print("[MODEL] TPOT AutoML terminé avec succès.")
  else:
      print("[ERREUR] Données d'entraînement ou module tpot introuvables.")
