math_theory: |
  Vision Transformers (ViT) process images by dividing them into a grid of fixed-size patches, flattening them, and applying a standard Transformer Encoder.
  
  The input image $\textcolor{#ef4444}{\mathbf{X}} \in \mathbb{R}^{H \times W \times C}$ is reshaped into a sequence of patches $\textcolor{#fbbf24}{\mathbf{X}_p} \in \mathbb{R}^{N \times (P^2 \cdot C)}$, where $(P, P)$ is the patch resolution and $N = \frac{H \cdot W}{P^2}$.
  
  These patches are linearly projected into embeddings, prepended with a learnable class token $\textcolor{#10b981}{\mathbf{x}_{\text{class}}}$, and position embeddings $\textcolor{#3b82f6}{\mathbf{E}_{pos}}$ are added:
  $$ \textcolor{#8b5cf6}{\mathbf{Z}_0} = [\textcolor{#10b981}{\mathbf{x}_{\text{class}}}; \textcolor{#fbbf24}{\mathbf{X}_p^1}\mathbf{E}; \dots; \textcolor{#fbbf24}{\mathbf{X}_p^N}\mathbf{E}] + \textcolor{#3b82f6}{\mathbf{E}_{pos}} $$
  
  This sequence $\textcolor{#8b5cf6}{\mathbf{Z}_0}$ is then passed through $L$ Transformer Encoder layers, using Multi-Head Self-Attention (MSA) and Multi-Layer Perceptrons (MLP):
  $$ \mathbf{Z}'_{\ell} = \text{MSA}(\text{LN}(\mathbf{Z}_{\ell-1})) + \mathbf{Z}_{\ell-1} $$
  $$ \mathbf{Z}_{\ell} = \text{MLP}(\text{LN}(\mathbf{Z}'_{\ell})) + \mathbf{Z}'_{\ell} $$

  Finally, the classification head uses the state of the class token at the last layer, $\mathbf{Z}_L^0$.

