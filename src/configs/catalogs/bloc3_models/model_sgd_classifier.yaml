id: "model_sgd_classifier"
name: "Model: SGD Classifier"
description: "Modèle de classification linéaire optimisé via descente de gradient stochastique, permettant un apprentissage en ligne (out-of-core) et un entraînement extrêmement rapide sur d'énormes jeux de données."
category: "Modèles Linéaires"
tags: ["model", "classification", "tabular", "sklearn", "linear", "online-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Privilégié face à une Régression Logistique ou un SVM classique dès lors que les données dépassent les capacités de la mémoire (n_samples > 100k) ou comportent de très nombreuses variables creuses."
use_cases:
  - "Classification de textes sur des millions de documents (ex: analyse de sentiments avec TF-IDF)."
  - "Détection de spams en temps réel avec un apprentissage continu (online learning)."
  - "Prédiction d'attributs clients sur des logs web massifs et hautement dimensionnels."
pros:
  - "Efficacité redoutable sur les très grandes volumétries et les matrices creuses (sparse data)."
  - "Capacité de mise à jour incrémentale (partial_fit) sans recharger toutes les données."
  - "Permet d'émuler divers algorithmes (Régression logistique, SVM) en changeant simplement la fonction de perte."
cons:
  - "Extrêmement sensible à l'échelle des données, exigeant une standardisation stricte."
  - "Nécessite souvent une recherche délicate de paramètres (taux d'apprentissage, pénalité)."
  - "Peut osciller autour du minimum sans jamais converger parfaitement (bruit du gradient stochastique)."
hyperparameters:
  loss: "Fonction de perte ('hinge' donne un Linear SVM, 'log_loss' donne une Logistic Regression)."
  penalty: "Pénalité ('l2', 'l1', 'elasticnet')."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import SGDClassifier

  # [PARAM: LOSS | string]
  LOSS = "hinge"
math_theory: |
  Le classifieur SGD (Descente de Gradient Stochastique) minimise une fonction de perte empirique (par ex., Hinge ou Log-Loss) de manière itérative en mettant à jour les poids pour chaque échantillon (ou mini-lot).

  Règle de mise à jour stochastique à l'itération $t$ :

  $$
  \textcolor{#3b82f6}{w}_{t+1} = \textcolor{#3b82f6}{w}_t - \textcolor{#8b5cf6}{\eta_t} \nabla_{\textcolor{#3b82f6}{w}} \left( \textcolor{#ef4444}{L}(\textcolor{#10b981}{y_t}, \textcolor{#3b82f6}{w}^T \textcolor{#10b981}{x_t}) + \frac{\textcolor{#fbbf24}{\alpha}}{N} R(\textcolor{#3b82f6}{w}_t) \right) 
  $$

  - $\textcolor{#3b82f6}{w}$ : Poids du modèle (coefficients)
  - $\textcolor{#8b5cf6}{\eta_t}$ : Taux d'apprentissage
  - $\textcolor{#ef4444}{L}$ : Fonction de perte pour une seule instance
  - $(\textcolor{#10b981}{x_t}, \textcolor{#10b981}{y_t})$ : Caractéristiques et étiquette de l'instance stochastique
  - $\textcolor{#fbbf24}{\alpha} R(\textcolor{#3b82f6}{w})$ : Terme de régularisation (par ex., pénalité $L_2$)
