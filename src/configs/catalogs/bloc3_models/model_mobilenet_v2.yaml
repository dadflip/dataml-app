math_theory: |
  L'innovation centrale de MobileNetV2 est le **Bloc Résiduel Inversé** (Inverted Residual Block) avec goulots d'étranglement linéaires, qui utilise des **Convolutions Séparables en Profondeur** (Depthwise Separable Convolutions) pour réduire considérablement les calculs. Une convolution standard est divisée en deux étapes : une convolution spatiale en profondeur et une convolution par point (pointwise) par canal.

  L'opération d'un bloc résiduel inversé peut être définie par :
  $$
  \textcolor{#8b5cf6}{\mathbf{Y}} = \textcolor{#3b82f6}{\mathbf{W}_{pw2}} * \text{ReLU6}(\textcolor{#10b981}{\mathbf{W}_{dw}} * \text{ReLU6}(\textcolor{#fbbf24}{\mathbf{W}_{pw1}} * \textcolor{#ef4444}{\mathbf{X}})) + \textcolor{#ef4444}{\mathbf{X}} 
  $$
  
  Où :
  - $\textcolor{#ef4444}{\mathbf{X}}$ est le tenseur d'entrée de forme $(h, w, c)$.
  - $\textcolor{#fbbf24}{\mathbf{W}_{pw1}}$ est une convolution par point de $1\times 1$ qui *étend* les canaux à $tk$ (où $t$ est le facteur d'expansion).
  - $\textcolor{#10b981}{\mathbf{W}_{dw}}$ est une convolution en profondeur de $3\times 3$ appliquée par canal.
  - $\textcolor{#3b82f6}{\mathbf{W}_{pw2}}$ est une convolution par point de $1\times 1$ qui projette les canaux de retour à $c$, sans activation non linéaire (goulot d'étranglement linéaire).
  - La connexion résiduelle $+\textcolor{#ef4444}{\mathbf{X}}$ est appliquée uniquement si le pas (stride) est de 1 et que les dimensions d'entrée/sortie correspondent.

