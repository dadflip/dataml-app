id: "model_mobilenet_v2"
name: "Model: MobileNet V2 (Fine-Tuning)"
description: "Réseau de neurones convolutifs (CNN) pré-entraîné de pointe conçu par Google, extrêmement léger et optimisé pour le déploiement sur appareils mobiles ou à faibles ressources (edge computing)."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "mobilenet", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Privilégier pour des tâches de classification d'images où la rapidité d'inférence, la consommation de mémoire réduite et le déploiement sur des dispositifs embarqués sont des critères prépondérants."
use_cases:
  - "Classification visuelle en temps réel sur des applications mobiles (Android/iOS)."
  - "Déploiement sur des microcontrôleurs ou nano-ordinateurs (ex. Raspberry Pi, Jetson Nano)."
  - "Détection d'objets embarquée pour des systèmes IoT industriels autonomes."
pros:
  - "Taille de modèle drastiquement réduite, assurant des temps d'inférence fulgurants."
  - "Utilise des convolutions séparables en profondeur (depthwise separable convolutions) économes en calcul."
  - "Modèle pré-entraîné sur ImageNet permettant un transfert d'apprentissage très efficace."
cons:
  - "Compromis sur la précision de prédiction en comparaison d'architectures plus imposantes comme EfficientNet ou ResNet."
  - "Peut rencontrer des difficultés à capter des détails à très haute résolution."
hyperparameters:
  epochs: "Nombre d'époques (ex: 3)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      import torchvision.models as models
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch torchvision")

  # [PARAM: EPOCHS | number]
  EPOCHS = 3
  # [/PARAM]

  print(f"[MODEL] Fine-Tuning MobileNet V2 (epochs={EPOCHS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      dataset = TensorDataset(torch.tensor(X_tr_np, dtype=torch.float32), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=16, shuffle=True)
      
      model = models.mobilenet_v2(pretrained=True)
      # Remplacement de la tête de classification
      num_ftrs = model.classifier[1].in_features
      model.classifier[1] = nn.Linear(num_ftrs, num_classes)
      
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.classifier[1].parameters(), lr=0.001)
      
      model.train()
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              batch_X, batch_y = batch_X.to(device), batch_y.to(device)
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np, dtype=torch.float32).to(device)
          logits = model(X_te_t)
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
          
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "device": str(device)}
      task_type = "classification"
