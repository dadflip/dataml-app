math_theory: |
  Le classifieur Naïf de Bayes Bernoulli est adapté aux variables prédictives binaires (0 ou 1).
  
  La vraisemblance de chaque variable $j$ pour la classe $\textcolor{#8b5cf6}{c}$ est modélisée par une distribution de Bernoulli :
  
  $$
  P(\textcolor{#fbbf24}{x}^{(j)} | y=\textcolor{#8b5cf6}{c}) = \textcolor{#3b82f6}{p}_{jc}^{\textcolor{#fbbf24}{x}^{(j)}} (1 - \textcolor{#3b82f6}{p}_{jc})^{(1 - \textcolor{#fbbf24}{x}^{(j)})}
  $$
  
  Où $\textcolor{#3b82f6}{p}_{jc}$ est la probabilité que la variable $j$ soit présente (1) étant donné la classe $c$.
  
  La probabilité a posteriori est proportionnelle au produit des probabilités individuelles (hypothèse naïve) :
  
  $$
  P(y=\textcolor{#8b5cf6}{c} | \textcolor{#fbbf24}{x}) \propto P(y=\textcolor{#8b5cf6}{c}) \prod_{j=1}^{d} P(\textcolor{#fbbf24}{x}^{(j)} | y=\textcolor{#8b5cf6}{c})
  $$
  
  Le lissage de Laplace (paramètre $\textcolor{#10b981}{\alpha}$) est souvent appliqué pour éviter les probabilités nulles si une variable n'a jamais été observée pour une classe pendant l'entraînement.
  
  - $\textcolor{#fbbf24}{x}^{(j)} \in \{0, 1\}$ : Valeur binaire de la $j$-ème caractéristique.
  - $\textcolor{#8b5cf6}{c}$ : Classe cible.
  - $\textcolor{#3b82f6}{p}_{jc}$ : Probabilité d'occurrence de la caractéristique $j$ dans la classe $c$.
  - $\textcolor{#10b981}{\alpha}$ : Hyperparamètre de lissage.
