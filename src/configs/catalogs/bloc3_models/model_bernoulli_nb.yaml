id: "model_bernoulli_nb"
name: "Model: Bernoulli Naive Bayes"
description: |
  Algorithme Naive Bayes conçu spécifiquement pour les données distribuées selon une loi de Bernoulli, c'est-à-dire avec des variables explicatives booléennes (binaires).
category: "Modèles Probabilistes"
tags: ["model", "classification", "tabular", "sklearn", "bayes"]
applies_to: ["Tabulaire"]
when_to_use: |
  Très efficace lorsque vos variables caractéristiques (features) sont strictement binaires (0/1) ou peuvent être binarisées de manière logique (ex. présence/absence d'un mot dans un texte).
use_cases:
  - "Classification de textes courts avec l'approche Bag of Words en binaire (présence/absence de mots)."
  - "Détection de spam basée sur la présence de certains mots-clés."
  - "Modélisation de données cliniques (ex: présence ou absence de symptômes)."
pros:
  - "Extrêmement rapide à entraîner et à évaluer, idéal pour les grands volumes de données."
  - "Pénalise explicitement la non-occurrence d'une caractéristique (contrairement au Naive Bayes Multinomial qui l'ignore)."
  - "Très performant avec peu de données si l'hypothèse d'indépendance est approximativement respectée."
cons:
  - "Repose sur l'hypothèse forte (souvent fausse) de l'indépendance conditionnelle des caractéristiques."
  - "Binarise implicitement toutes les variables continues ou discrètes passées en entrée, perdant ainsi l'information de fréquence ou de magnitude."
hyperparameters:
  alpha: "Paramètre de lissage de Laplace (ex: 1.0)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.naive_bayes import BernoulliNB

  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement Bernoulli Naive Bayes (alpha={ALPHA})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "Bernoulli Naive Bayes"}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = BernoulliNB(alpha=float(ALPHA))
      
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          
          steps = list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)]
          steps.append(('model', model))
          full_pipeline = Pipeline(steps=steps)
      else:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      full_pipeline.fit(X_train, y_train)
      model = full_pipeline.named_steps['model']
      
      y_pred = full_pipeline.predict(X_test)
      if hasattr(full_pipeline, 'predict_proba'):
          y_proba = full_pipeline.predict_proba(X_test)
      
      # For Naive Bayes, feature_log_prob_ can serve as pseudo-importances for positive class
      if hasattr(model, 'feature_log_prob_'):
          # Typically feature_log_prob_ has shape (n_classes, n_features)
          # We can use the exponentiated difference between the classes (if binary) or just the variance
          probs = np.exp(model.feature_log_prob_)
          diff = np.var(probs, axis=0) # Measure how much the feature helps distinguish classes
          if 'feature_names_out' in locals() and feature_names_out is not None:
              if len(diff) == len(feature_names_out):
                  feature_importances = pd.Series(diff, index=feature_names_out).sort_values(ascending=False)
              else:
                  feature_importances = pd.Series(diff).sort_values(ascending=False)
          else:
              feature_importances = pd.Series(diff).sort_values(ascending=False)
              
      training_history = {"status": "success", "fitted_on": len(X_train)}

