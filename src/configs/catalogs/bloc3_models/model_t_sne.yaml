id: "model_t_sne"
name: "Model: t-SNE"
description: |
  T-distributed Stochastic Neighbor Embedding. Technique de réduction de dimension non linéaire particulièrement performante pour intégrer des données de haute dimension dans un espace à deux ou trois dimensions. Conçue principalement pour la visualisation.
category: "Réduction de Dimension"
tags: ["model", "dimensionality-reduction", "tabular", "sklearn", "tsne", "visualization"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour explorer et visualiser la structure locale des données complexes, repérer des amas (clusters) ou évaluer qualitativement la séparabilité des classes sur des données d'entraînement.
use_cases:
  - "Visualisation exploratoire de données omiques en biologie (ex: séquençage ARN unicellulaire)."
  - "Analyse d'images ou traitement du langage naturel (ex: embeddings de mots)."
  - "Détection de fraude ou d'anomalies en projetant les profils comportementaux en 2D."
pros:
  - "Visualisations magnifiques et très intuitives montrant la structure locale."
  - "Capture bien les relations non linéaires, ce que l'ACP (PCA) ne fait pas."
  - "Capable de séparer distinctement des clusters qui se chevauchent en haute dimension."
cons:
  - "Très lent et coûteux en mémoire (complexité computationnelle élevée pour de grands jeux de données)."
  - "Algorithme transductif : il ne permet pas d'appliquer la même transformation sur de nouvelles données (pas de méthode transform isolée)."
  - "Les distances entre clusters ne sont pas toujours représentatives de la structure globale."
  - "Peut nécessiter un ajustement minutieux de la perplexité pour obtenir des résultats pertinents."
hyperparameters:
  n_components: "Nombre de dimensions (ex: 2)."
  perplexity: "Densité locale vs globale (ex: 30)."
math_theory: |
  t-SNE modélise d'abord les similarités comme des probabilités $\textcolor{#10b981}{p_{ij}}$ dans l'espace d'origine (distribution gaussienne), puis comme des probabilités $\textcolor{#3b82f6}{q_{ij}}$ dans l'espace réduit (distribution t de Student à 1 degré de liberté). Il minimise la divergence de Kullback-Leibler $\textcolor{#ef4444}{KL(P || Q)}$ pour ajuster l'espace réduit :
  
  $$
  \textcolor{#ef4444}{KL(P || Q)} = \sum_{i \neq j} \textcolor{#10b981}{p_{ij}} \log \frac{\textcolor{#10b981}{p_{ij}}}{\textcolor{#3b82f6}{q_{ij}}} 
  $$
  
  L'utilisation de la distribution t de Student à queue lourde dans l'espace réduit empêche le problème d'encombrement (crowding problem) en repoussant les points dissimilaires plus loin les uns des autres.
