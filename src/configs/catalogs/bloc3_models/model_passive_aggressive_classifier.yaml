id: "model_passive_aggressive_classifier"
name: "Model: Passive Aggressive Classifier"
description: |
  Le Passive Aggressive Classifier est un algorithme d'apprentissage en ligne (online learning) pour la classification. Son nom provient de son fonctionnement : il reste "passif" si la prédiction est correcte, mais devient "agressif" en forçant une mise à jour significative des poids s'il se trompe.
category: "Modèles Linéaires"
tags: ["model", "classification", "tabular", "sklearn", "online-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour les scénarios impliquant des flux de données continus ou des jeux de données tellement volumineux (Big Data) qu'ils ne tiennent pas en mémoire vive, nécessitant un apprentissage par lots (batch) ou incrémental (`partial_fit()`).
use_cases:
  - "Classification de flux de textes en continu, comme la détection de spam ou l'analyse de sentiments sur des réseaux sociaux."
  - "Apprentissage incrémental sur des logs serveurs massifs où le modèle doit s'adapter en temps réel sans ré-entraînement complet."
  - "Modélisation de données transactionnelles à très haute fréquence (ex: publicité programmatique, e-commerce)."
pros:
  - "Extrêmement rapide et économe en mémoire grâce à son approche d'apprentissage incrémental (online learning)."
  - "Maintient de bonnes performances même en apprenant observation par observation ou mini-lot par mini-lot."
  - "S'adapte dynamiquement et rapidement aux changements de distribution dans les flux de données (concept drift)."
cons:
  - "Ne fournit pas de probabilités par défaut (pas de méthode `predict_proba()`), ce qui complique l'évaluation des niveaux de confiance."
  - "Peut être sensible au bruit : une mise à jour 'agressive' sur une donnée erronée ou aberrante peut dégrader le modèle."
  - "Performances globales souvent inférieures aux modèles d'ensemble (Random Forest, Gradient Boosting) sur des jeux de données de taille moyenne."
hyperparameters:
  C: "Pénalité maximale."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import PassiveAggressiveClassifier

  # [PARAM: C_PARAM | number]
  C_PARAM = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement Passive Aggressive Classifier (C={C_PARAM})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = PassiveAggressiveClassifier(C=float(C_PARAM), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals():
          coefs = np.abs(model.coef_).mean(axis=0) if model.coef_.ndim > 1 else np.abs(model.coef_[0])
          if len(coefs) == len(feature_names_out):
              feature_importances = pd.Series(coefs, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
math_theory: |
  L'algorithme Passive-Aggressive met à jour ses poids uniquement lorsque la prédiction est incorrecte ou que la marge de confiance (Hinge Loss) est insuffisante.

  Perte (Hinge Loss) pour l'instance $t$ :
  $$ \textcolor{#ef4444}{L}(\textcolor{#3b82f6}{w}_t, \textcolor{#10b981}{x_t}, \textcolor{#10b981}{y_t}) = \max(0, 1 - \textcolor{#10b981}{y_t}(\textcolor{#3b82f6}{w}_t^T \textcolor{#10b981}{x_t})) $$

  Règle de mise à jour (variante PA-I) :
  $$ \textcolor{#3b82f6}{w}_{t+1} = \textcolor{#3b82f6}{w}_t + \tau_t \textcolor{#10b981}{y_t} \textcolor{#10b981}{x_t} $$
  $$ \text{avec } \tau_t = \min\left(\textcolor{#fbbf24}{C}, \frac{\textcolor{#ef4444}{L}(\textcolor{#3b82f6}{w}_t, \textcolor{#10b981}{x_t}, \textcolor{#10b981}{y_t})}{||\textcolor{#10b981}{x_t}||^2}\right) $$

  - $\textcolor{#3b82f6}{w}$ : Vecteur de poids du modèle
  - $(\textcolor{#10b981}{x_t}, \textcolor{#10b981}{y_t})$ : Instance d'entrée et sa véritable étiquette ($\in \{-1, 1\}$)
  - $\textcolor{#ef4444}{L}$ : Erreur calculée (Hinge loss)
  - $\textcolor{#fbbf24}{C}$ : Hyperparamètre qui limite l'agressivité de la mise à jour (pénalité maximale)
