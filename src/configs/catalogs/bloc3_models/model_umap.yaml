id: "model_umap"
name: "Model: UMAP"
description: |
  Uniform Manifold Approximation and Projection (UMAP). Technique moderne de réduction de dimension non linéaire. Elle est reconnue pour sa capacité à préserver non seulement la structure locale des données, mais aussi leur structure globale, offrant des visualisations de très haute qualité.
category: "Réduction de Dimension"
tags: ["model", "dimensionality-reduction", "tabular", "umap", "visualization"]
applies_to: ["Tabulaire"]
when_to_use: |
  C'est la méthode de référence actuelle pour réduire la dimensionnalité à des fins de visualisation (2D ou 3D) ou comme étape de prétraitement avancée avant un algorithme de clustering ou de classification. Elle supplante largement t-SNE dans la plupart des cas d'usage.
use_cases:
  - "Visualisation interactive de clusters complexes en 2D ou 3D (ex: transcriptomique, NLP embeddings)."
  - "Réduction de dimension préalable pour améliorer l'efficacité d'un algorithme de clustering (ex: UMAP + HDBSCAN)."
  - "Extraction de caractéristiques non linéaires denses (feature extraction) pour alimenter un modèle prédictif."
  - "Analyse exploratoire de jeux de données massifs pour identifier des anomalies ou des sous-groupes (cohortes)."
pros:
  - "Significativement plus rapide à s'exécuter que t-SNE, même sur des millions de points de données."
  - "Préserve la topologie globale des données bien mieux que t-SNE (les distances entre clusters ont un sens)."
  - "Permet de projeter de nouvelles données non vues (méthode `transform`), ce qui manque cruellement à t-SNE."
cons:
  - "Nécessite l'installation d'une bibliothèque tierce spécifique (umap-learn) non incluse dans scikit-learn."
  - "Comporte des hyperparamètres sensibles (comme n_neighbors et min_dist) qui modifient drastiquement la projection."
  - "Fondations mathématiques (géométrie riemannienne, topologie algébrique) complexes à appréhender."
hyperparameters:
  n_components: "Nombre de dimensions (ex: 2)."
  n_neighbors: "Taille du voisinage (ex: 15)."
math_theory: |
  UMAP construit une représentation topologique floue du jeu de données en calculant la probabilité d'arête $\textcolor{#3b82f6}{w_e}$ entre deux points $\textcolor{#10b981}{x_i}$ et $\textcolor{#10b981}{x_j}$ :
  
  $$
  \textcolor{#3b82f6}{w_e}(\textcolor{#10b981}{x_i}, \textcolor{#10b981}{x_j}) = \exp\left(-\frac{\textcolor{#ef4444}{d(x_i, x_j)} - \textcolor{#fbbf24}{\rho_i}}{\textcolor{#8b5cf6}{\sigma_i}}\right) 
  $$
  
  Où $\textcolor{#ef4444}{d}$ est la métrique de distance, $\textcolor{#fbbf24}{\rho_i}$ est la distance au plus proche voisin (assurant une connectivité locale globale), et $\textcolor{#8b5cf6}{\sigma_i}$ est un facteur de lissage normalisant la densité locale autour de $\textcolor{#10b981}{x_i}$. UMAP optimise ensuite la projection en basse dimension en minimisant l'entropie croisée (Cross-Entropy) entre ce graphe en haute dimension et son équivalent en basse dimension.
