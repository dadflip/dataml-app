id: "model_image_autoencoder"
name: "Model: Convolutional Autoencoder"
description: "Réseau de neurones artificiels non-supervisé conçu pour apprendre une représentation compressée (espace latent) d'une image via un encodeur, puis la reconstruire de manière fidèle à l'aide d'un décodeur."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "unsupervised", "pytorch", "autoencoder", "deep-learning", "compression", "anomaly-detection"]
applies_to: ["Images"]
when_to_use: "Privilégiez ce modèle pour la réduction de dimension d'images (génération d'embeddings), le débruitage d'images (denoising), ou la détection d'anomalies visuelles complexes (telles que des défauts de fabrication en milieu industriel)."
use_cases:
  - "Contrôle qualité industriel : Détection de rayures ou malformations par analyse de l'erreur de reconstruction."
  - "Débruitage d'images médicales ou satellitaires (apprentissage sur paires bruitées/nettes)."
  - "Extraction de caractéristiques latentes (embeddings) pour une recherche d'images similaires ou un clustering."
pros:
  - "Apprentissage non supervisé autonome (ne nécessite pas de labels coûteux à produire)."
  - "Capacité à capturer des caractéristiques non linéaires complexes, surpassant les méthodes classiques comme l'ACP."
  - "Architecture flexible et adaptable (variation du bottleneck, utilisation de couches convolutives profondes)."
cons:
  - "Reconstruction souvent floue sur des images très complexes ou avec de faibles résolutions."
  - "Entraînement gourmand en ressources computationnelles (GPU généralement requis) et sensible au choix des hyperparamètres (learning rate, dimension latente)."
hyperparameters:
  epochs: "Nombre d'époques (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch torchvision")

  # [PARAM: EPOCHS | number]
  EPOCHS = 5
  # [/PARAM]

  print(f"[MODEL] Entraînement Conv Autoencoder (epochs={EPOCHS})...")
  if 'X_train' in locals() and 'X_test' in locals() and torch is not None:
      # On attend X_train (N, C, H, W). Pour l'exemple, on force un reshape carré si plat
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      
      if len(X_tr_np.shape) == 2:
          side = int(np.sqrt(X_tr_np.shape[1]))
          X_tr_np = X_tr_np.reshape(-1, 1, side, side)
          X_te_np = X_te_np.reshape(-1, 1, side, side)
          
      dataset = TensorDataset(torch.tensor(X_tr_np, dtype=torch.float32), torch.tensor(X_tr_np, dtype=torch.float32)) # target = input
      loader = DataLoader(dataset, batch_size=32, shuffle=True)
      
      class Autoencoder(nn.Module):
          def __init__(self, in_channels):
              super().__init__()
              # Encoder
              self.enc = nn.Sequential(
                  nn.Conv2d(in_channels, 16, 3, stride=2, padding=1),
                  nn.ReLU(),
                  nn.Conv2d(16, 32, 3, stride=2, padding=1),
                  nn.ReLU()
              )
              # Decoder
              self.dec = nn.Sequential(
                  nn.ConvTranspose2d(32, 16, 3, stride=2, padding=1, output_padding=1),
                  nn.ReLU(),
                  nn.ConvTranspose2d(16, in_channels, 3, stride=2, padding=1, output_padding=1),
                  nn.Sigmoid() # Si images normalisées 0-1
              )
          def forward(self, x):
              return self.dec(self.enc(x))
              
      in_channels = X_tr_np.shape[1]
      model = Autoencoder(in_channels)
      
      criterion = nn.MSELoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      
      model.train()
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np, dtype=torch.float32)
          # Reconstruction (y_pred est l'image reconstruite)
          reconstructed = model(X_te_t).numpy()
          # On peut aussi calculer l'erreur de reconstruction par image (utile pour détection anomalie)
          mse_per_image = np.mean((X_te_np - reconstructed)**2, axis=(1,2,3))
          
      y_pred = reconstructed
      y_proba = mse_per_image # On stocke l'erreur ici pour référence
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "final_loss": float(loss)}
      task_type = "image_reconstruction"
      meta = {}
math_theory: |
  Un auto-encodeur convolutif applique des filtres spatiaux pour compresser l'image originale $\textcolor{#10b981}{X}$.
  L'encodeur enchaîne des convolutions et du pooling pour obtenir le tenseur latent $\textcolor{#3b82f6}{Z}$ (le goulot d'étranglement) :
  
  $$
  \textcolor{#3b82f6}{Z} = \sigma(\textcolor{#8b5cf6}{W_{enc}} * \textcolor{#10b981}{X} + \textcolor{#fbbf24}{b_{enc}}) 
  $$
  
  Le décodeur utilise des convolutions transposées (ou upsampling) pour revenir à la dimension originale et former la reconstruction $\textcolor{#ef4444}{\hat{X}}$ :
  
  $$
  \textcolor{#ef4444}{\hat{X}} = \sigma(\textcolor{#8b5cf6}{W_{dec}} * \textcolor{#3b82f6}{Z} + \textcolor{#fbbf24}{b_{dec}}) 
  $$
  
  L'entraînement s'effectue en minimisant l'erreur quadratique moyenne (MSE) pixel par pixel :
  
  $$
  \mathcal{L} = \frac{1}{N} \sum || \textcolor{#10b981}{X} - \textcolor{#ef4444}{\hat{X}} ||^2 
  $$
