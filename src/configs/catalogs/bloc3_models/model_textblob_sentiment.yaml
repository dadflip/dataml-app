code_template: |
  import pandas as pd
  import numpy as np
  try:
      from textblob import TextBlob
  except ImportError:
      TextBlob = None
      print("[ERREUR] textblob n'est pas installé. Lancez : !pip install textblob")

  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]

  print(f"[MODEL] Analyse de sentiment Zero-Shot via TextBlob (col={TEXT_COL})...")
  model = "TextBlob-Sentiment"
  full_pipeline = None
  y_pred = []
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "sentiment_analysis"
  meta = {"model_name": "TextBlob Sentiment"}

  if 'X_test' in locals() and TextBlob is not None:
      if isinstance(X_test, pd.DataFrame):
          if TEXT_COL in X_test.columns:
              texts = X_test[TEXT_COL].astype(str).tolist()
          else:
              texts = X_test.iloc[:, 0].astype(str).tolist()
      else:
          texts = [str(x) for x in X_test]
          
      for text in texts:
          blob = TextBlob(text)
          polarity = blob.sentiment.polarity
          if polarity > 0.1:
              y_pred.append("Positive")
          elif polarity < -0.1:
              y_pred.append("Negative")
          else:
              y_pred.append("Neutral")
              
      y_pred = np.array(y_pred)
      full_pipeline = model
      training_history = {"status": "success", "processed_texts": len(y_pred)}
