id: "model_textblob_sentiment"
name: "Model: TextBlob Sentiment Analyzer"
description: |
  Modèle de Traitement du Langage Naturel (NLP) pré-entraîné basé sur TextBlob, conçu pour extraire la polarité (sentiment) et la subjectivité d'un texte. Il s'appuie sur une approche par lexique (lexicon-based) pour évaluer rapidement les sentiments sans nécessiter d'entraînement spécifique.
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "sentiment", "textblob", "pretrained"]
applies_to: ["Texte"]
when_to_use: |
  Privilégiez TextBlob lorsque vous avez besoin d'une évaluation rapide et sans configuration du sentiment (Zero-Shot) sur des textes en anglais, ou lors du prototypage initial d'un pipeline d'analyse de texte où la simplicité prime sur la précision de l'état de l'art.
use_cases:
  - "Analyse rapide du sentiment des commentaires clients ou des avis sur des produits."
  - "Extraction de la polarité dans les flux de médias sociaux pour la détection de tendances."
  - "Création de variables (features) basées sur le sentiment pour enrichir un autre modèle prédictif."
  - "Filtrage de documents pour identifier des contenus fortement subjectifs ou polarisés."
pros:
  - "Aucun entraînement requis (Zero-Shot), utilisable immédiatement (out-of-the-box)."
  - "Extrêmement simple et léger, adapté au traitement rapide de grandes quantités de texte."
  - "Fournit non seulement un score de polarité, mais également une mesure de la subjectivité."
cons:
  - "Sensiblement moins précis que les grands modèles de langage (Transformers comme BERT)."
  - "Approche lexicale ayant des difficultés avec l'ironie, le sarcasme ou le contexte complexe."
  - "Fonctionne nativement mieux en anglais ; nécessite des solutions de contournement pour d'autres langues."
hyperparameters:
  text_col: "Colonne de texte cible."
math_theory: |
  TextBlob utilise une approche lexicale (basée sur des règles et des dictionnaires) pour calculer la polarité (sentiment).
  Chaque mot $w_i$ d'un texte $\textcolor{#10b981}{X}$ est recherché dans un lexique pré-annoté qui lui associe une polarité $\textcolor{#3b82f6}{p}(w_i) \in [-1, 1]$ et une intensité (ou subjectivité) $\textcolor{#fbbf24}{s}(w_i)$.
  Le modèle prend en compte les modificateurs (comme "très" ou "pas") qui appliquent un coefficient multiplicatif $\textcolor{#8b5cf6}{m}_i$.
  La polarité globale $\textcolor{#ef4444}{P}$ du texte est la moyenne pondérée des mots connus :
  $$ \textcolor{#ef4444}{P} = \frac{\sum_{i=1}^{N} \textcolor{#8b5cf6}{m}_i \cdot \textcolor{#3b82f6}{p}(w_i)}{\text{nombre de mots évalués}} $$
