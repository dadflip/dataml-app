math_theory: |
  Exemple utilisant le critère de liaison de Ward (Ward's linkage), qui fusionne les clusters $\textcolor{#3b82f6}{A}$ et $\textcolor{#10b981}{B}$ de manière à minimiser l'augmentation de la variance intra-cluster totale :
  
  $$
  \Delta(\textcolor{#3b82f6}{A}, \textcolor{#10b981}{B}) = \frac{|\textcolor{#3b82f6}{A}| |\textcolor{#10b981}{B}|}{|\textcolor{#3b82f6}{A}| + |\textcolor{#10b981}{B}|} || \textcolor{#fbbf24}{\mu_A} - \textcolor{#fbbf24}{\mu_B} ||^2 
  $$
  
  Où :
  - $|\textcolor{#3b82f6}{A}|$ et $|\textcolor{#10b981}{B}|$ sont les nombres de points dans les clusters respectifs.
  - $\textcolor{#fbbf24}{\mu_A}$ et $\textcolor{#fbbf24}{\mu_B}$ sont les centroïdes des clusters $\textcolor{#3b82f6}{A}$ et $\textcolor{#10b981}{B}$.
