id: "model_hierarchical_clustering"
name: "Model: Agglomerative Hierarchical Clustering"
description: "Algorithme de clustering non supervisé (ascendant hiérarchique) qui construit progressivement un arbre (dendrogramme) en fusionnant itérativement les points ou clusters les plus proches."
category: "Clustering (Non-Supervisé)"
tags: ["model", "clustering", "tabular", "sklearn", "hierarchical"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal pour identifier des sous-groupes naturels avec une structure hiérarchique explicite, particulièrement lorsque le nombre de clusters n'est pas connu à l'avance et que l'interprétabilité visuelle est clé."
use_cases:
  - "Segmentation de clients basée sur des comportements d'achat."
  - "Classification phylogénétique ou taxonomique en biologie."
  - "Analyse de regroupement de gènes avec expressions similaires."
pros:
  - "Ne nécessite pas de fixer le nombre de clusters a priori (grâce à l'analyse du dendrogramme)."
  - "Très interprétable grâce à la visualisation de l'arbre."
  - "Peut capturer des formes de clusters complexes selon le critère de liaison (linkage)."
cons:
  - "Complexité temporelle en O(N³), totalement inadapté aux grands ensembles de données."
  - "Sensible au bruit et aux valeurs aberrantes."
  - "Une fois qu'une fusion est effectuée, elle ne peut pas être annulée (pas d'optimisation globale)."
hyperparameters:
  n_clusters: "Nombre de clusters finaux (ex: 3)."
  linkage: "Critère de liaison ('ward', 'complete', 'average', 'single')."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.cluster import AgglomerativeClustering

  # [PARAM: N_CLUSTERS | number]
  N_CLUSTERS = 3
  # [/PARAM]

  # [PARAM: LINKAGE | string]
  LINKAGE = "ward"
  # [/PARAM]

  print(f"[MODEL] Hierarchical Clustering (n_clusters={N_CLUSTERS}, linkage='{LINKAGE}')...")
  model = AgglomerativeClustering(n_clusters=int(N_CLUSTERS), linkage=LINKAGE)
  
  if 'preprocessor' in locals() and preprocessor is not None:
      try: from imblearn.pipeline import Pipeline
      except: from sklearn.pipeline import Pipeline
      full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
  else:
      full_pipeline = model
  
  if 'X_train' in locals():
      # Hierarchical clustering does not have a predict method for new data
      # It only fits and predicts on the given data
      X_train_transformed = preprocessor.transform(X_train) if 'preprocessor' in locals() and preprocessor is not None else X_train
      y_pred = model.fit_predict(X_train_transformed)
      y_proba = None
      feature_importances = None
      training_history = {"status": "success"}
      task_type = "clustering"
      meta = {}
