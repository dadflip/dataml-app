id: "model_hierarchical_clustering"
name: "Model: Agglomerative Hierarchical Clustering"
description: "Clustering hiérarchique ascendant. Construit un arbre (dendrogramme) de clusters."
category: "Clustering (Non-Supervisé)"
tags: ["model", "clustering", "tabular", "sklearn", "hierarchical"]
applies_to: ["Tabulaire"]
when_to_use: "Pour visualiser la hiérarchie des groupes (Dendrogramme) sur des datasets petits à moyens."
pros:
  - "Très interprétable."
cons:
  - "Très lent en O(N^3), inadapté au Big Data."
hyperparameters:
  n_clusters: "Nombre de clusters finaux (ex: 3)."
  linkage: "Critère de liaison ('ward', 'complete', 'average', 'single')."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.cluster import AgglomerativeClustering

  # [PARAM: N_CLUSTERS | number]
  N_CLUSTERS = 3
  # [/PARAM]

  # [PARAM: LINKAGE | string]
  LINKAGE = "ward"
  # [/PARAM]

  print(f"[MODEL] Hierarchical Clustering (n_clusters={N_CLUSTERS}, linkage='{LINKAGE}')...")
  model = AgglomerativeClustering(n_clusters=int(N_CLUSTERS), linkage=LINKAGE)
  
  if 'preprocessor' in locals() and preprocessor is not None:
      try: from imblearn.pipeline import Pipeline
      except: from sklearn.pipeline import Pipeline
      full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
  else:
      full_pipeline = model
  
  if 'X_train' in locals():
      # Hierarchical clustering does not have a predict method for new data
      # It only fits and predicts on the given data
      X_train_transformed = preprocessor.transform(X_train) if 'preprocessor' in locals() and preprocessor is not None else X_train
      y_pred = model.fit_predict(X_train_transformed)
      y_proba = None
      feature_importances = None
      training_history = {"status": "success"}
      task_type = "clustering"
      meta = {}
illustration_mermaid: |
  graph TD
    subgraph Data
      Points[N Data Points]
    end
    subgraph Agglomerative Process
      Points --> Dist[Compute Distance Matrix]
      Dist --> Linkage[Merge Closest Points - Linkage]
      Linkage --> Tree[Build Dendrogram]
      Tree --> Cut[Cut Tree at N_CLUSTERS]
    end
    subgraph Output
      Cut --> Labels[Cluster Labels]
    end
    style Dist fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
    style Linkage fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
    style Tree fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

