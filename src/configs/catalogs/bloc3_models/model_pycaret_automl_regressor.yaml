id: "model_pycaret_automl_regressor"
name: "Model: PyCaret AutoML (Regression)"
description: "Recherche automatique du meilleur modèle de régression (XGBoost, CatBoost, RandomForest...)."
category: "AutoML"
tags: ["model", "automl", "regression", "tabular", "pycaret"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous voulez la meilleure prédiction continue sans chercher manuellement les paramètres."
pros:
  - "Très complet et robuste."
cons:
  - "Lent sur gros volumes."
hyperparameters:
  sort: "Métrique à optimiser ('R2', 'RMSE', 'MAE', 'MAPE')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from pycaret.regression import setup, compare_models, pull, predict_model
  except ImportError:
      setup = None
      print("[ERREUR] pycaret n'est pas installé. Lancez : !pip install pycaret")

  # [PARAM: SORT_METRIC | string]
  SORT_METRIC = "R2"
  # [/PARAM]

  print(f"[MODEL] AutoML PyCaret Regression (optimisant {SORT_METRIC})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and setup is not None:
      train_data = pd.DataFrame(X_train) if not isinstance(X_train, pd.DataFrame) else X_train.copy()
      train_data['target_col'] = y_train
      
      setup(data=train_data, target='target_col', html=False, verbose=False, session_id=42)
      
      print("Comparaison des modèles en cours...")
      best_model = compare_models(sort=SORT_METRIC, n_select=1, verbose=False)
      
      leaderboard = pull()
      print("Meilleur modèle trouvé :", leaderboard.index[0])
      
      X_te_df = pd.DataFrame(X_test) if not isinstance(X_test, pd.DataFrame) else X_test.copy()
      predictions = predict_model(best_model, data=X_te_df)
      
      y_pred = predictions['prediction_label'].values if 'prediction_label' in predictions.columns else predictions['Label'].values
      y_proba = None
      
      feature_importances = None
      if hasattr(best_model, 'feature_importances_'):
          feature_importances = best_model.feature_importances_
          
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', best_model)])
      else:
          full_pipeline = best_model
          
      training_history = {"status": "success", "best_model": str(type(best_model).__name__)}
      task_type = "regression"
      print("[MODEL] PyCaret AutoML terminé avec succès.")
  else:
      print("[ERREUR] Données d'entraînement ou module pycaret introuvables.")
