code_template: |
  import pandas as pd
  import numpy as np
  try:
      from pycaret.regression import setup, compare_models, pull, predict_model
  except ImportError:
      setup = None
      print("[ERREUR] pycaret n'est pas installé. Lancez : !pip install pycaret")

  # [PARAM: SORT_METRIC | string]
  SORT_METRIC = "R2"
