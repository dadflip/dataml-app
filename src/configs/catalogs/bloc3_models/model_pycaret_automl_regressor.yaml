id: "model_pycaret_automl_regressor"
name: "Model: PyCaret AutoML (Regression)"
description: |
  PyCaret est une bibliothèque d'AutoML (Automated Machine Learning) orientée "low-code". Ce modèle orchestre automatiquement l'entraînement et la comparaison de dizaines d'algorithmes de régression (XGBoost, CatBoost, Random Forest, Régression Linéaire, etc.), tout en gérant le prétraitement et la validation croisée, afin de retourner le meilleur modèle selon la métrique choisie.
category: "AutoML"
tags: ["model", "automl", "regression", "tabular", "pycaret"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour obtenir rapidement une modélisation de référence (baseline) performante sur un problème de prédiction de valeur continue, sans avoir à coder manuellement chaque algorithme et chaque étape de prétraitement.
use_cases:
  - "Prédiction de prix immobiliers, d'actions ou de produits en fonction de multiples caractéristiques."
  - "Estimation de la durée d'un processus ou du temps restant avant maintenance (predictive maintenance)."
  - "Génération de benchmarks pour évaluer la pertinence de modèles plus complexes développés sur mesure."
pros:
  - "Gain de temps massif : un pipeline complet (imputation, encodage, entraînement, évaluation) en quelques lignes."
  - "Inclut nativement les modèles à l'état de l'art (SOTA) comme LightGBM et CatBoost sans configuration supplémentaire."
  - "Offre de puissantes fonctions d'analyse post-entraînement (SHAP, courbes d'apprentissage, analyse des résidus)."
cons:
  - "Peut s'avérer extrêmement chronophage (lent) si exécuté sur des ensembles de données de très grande taille."
  - "Le modèle final encapsulé dans l'objet PyCaret est parfois difficile à extraire pour un déploiement hors du framework."
  - "Les choix de prétraitement par défaut ne sont pas toujours optimaux pour des jeux de données avec des spécificités métiers pointues."
hyperparameters:
  sort: "Métrique à optimiser ('R2', 'RMSE', 'MAE', 'MAPE')."
math_theory: |
  PyCaret AutoML pour la régression évalue plusieurs algorithmes $\textcolor{#3b82f6}{\mathcal{M}} = \{\textcolor{#3b82f6}{M_1}, \dots, \textcolor{#3b82f6}{M_K}\}$.
  Chaque modèle $\textcolor{#3b82f6}{M_k}$ apprend à partir des données $\textcolor{#fbbf24}{D_{train}}$ pour produire une fonction de prédiction continue $\textcolor{#10b981}{\hat{f}_k(x)}$.
  Le système minimise une métrique d'erreur $\textcolor{#ef4444}{E_k}$ (ex. RMSE, MAE) calculée via validation croisée. Le modèle final $\textcolor{#8b5cf6}{M^*}$ est sélectionné tel que :
  
  $$
  \textcolor{#8b5cf6}{M^*} = \arg\min_{k \in \{1 \dots K\}} \textcolor{#ef4444}{E_k}(\textcolor{#10b981}{\hat{f}_k}, \textcolor{#fbbf24}{D_{val}})
  $$
