id: "model_one_class_svm"
name: "Model: One-Class SVM"
description: "Support Vector Machine adapté à la détection d'anomalies (délimite la région des données normales)."
category: "Détection d'Anomalies (Non-Supervisé)"
tags: ["model", "anomaly-detection", "tabular", "sklearn", "svm", "one-class"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous n'avez que des données 'normales' en apprentissage et voulez détecter toute déviation par la suite."
pros:
  - "Très robuste mathématiquement (Kernel Trick)."
cons:
  - "Lent sur grands jeux de données."
hyperparameters:
  nu: "Borne supérieure de la fraction d'erreurs d'entraînement (similaire à contamination, ex: 0.05)."
  kernel: "Noyau ('rbf', 'linear')."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import OneClassSVM
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: NU | number]
  NU = 0.05
  # [/PARAM]

  # [PARAM: KERNEL | string]
  KERNEL = "rbf"
  # [/PARAM]

  print(f"[MODEL] Initialisation One-Class SVM (nu={NU}, kernel={KERNEL})...")
  
  model = OneClassSVM(nu=float(NU), kernel=KERNEL, gamma='scale')

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "anomaly_detection"
  meta = {}

  if 'X_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline avec One-Class SVM...")
      full_pipeline.fit(X_train)
      
      preds = full_pipeline.predict(X_test)
      y_pred = np.where(preds == -1, 1, 0) # 1 for anomaly, 0 for normal
      
      scores = full_pipeline.decision_function(X_test)
      proba = 1 / (1 + np.exp(scores)) # pseudo-probability mapping
      y_proba = np.column_stack([1 - proba, proba])
      
      training_history = {"status": "success", "anomalies_found": int(np.sum(y_pred))}
illustration_mermaid: |
  graph TD
    A[Input Data: X_train] --> B(Preprocessing Pipeline)
    B --> C[One-Class SVM]
    
    subgraph Support Vector Density Estimation
        C --> D[Kernel Mapping: RBF / Linear]
        D --> E[Map features to High-Dimensional Space]
        E --> F[Find Maximum Margin Hyperplane from Origin]
        F --> G[Enclose normal points inside boundary]
    end
    
    G --> H[Fitted SVM Boundary]
    
    X_test[Input Data: X_test] --> I(Preprocessing Pipeline)
    I --> J[Map to Kernel Space]
    H -.-> J
    J --> K{Inside boundary?}
    K -- Yes --> L[Normal Class 0]
    K -- No --> M[Anomaly Class 1]
    
    style C fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
    style H fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style L fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff
    style M fill:#ef4444,stroke:#dc2626,stroke-width:2px,color:#fff

