id: "model_one_class_svm"
name: "Model: One-Class SVM"
description: "Support Vector Machine adapté à la détection d'anomalies (délimite la région des données normales)."
category: "Détection d'Anomalies (Non-Supervisé)"
tags: ["model", "anomaly-detection", "tabular", "sklearn", "svm", "one-class"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous n'avez que des données 'normales' en apprentissage et voulez détecter toute déviation par la suite."
pros:
  - "Très robuste mathématiquement (Kernel Trick)."
cons:
  - "Lent sur grands jeux de données."
hyperparameters:
  nu: "Borne supérieure de la fraction d'erreurs d'entraînement (similaire à contamination, ex: 0.05)."
  kernel: "Noyau ('rbf', 'linear')."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import OneClassSVM

  # [PARAM: NU | number]
  NU = 0.05
  # [/PARAM]

  # [PARAM: KERNEL | string]
  KERNEL = "rbf"
  # [/PARAM]

  print(f"[MODEL] Entraînement One-Class SVM (nu={NU}, kernel={KERNEL})...")
  if 'X_train' in locals() and 'X_test' in locals():
      model = OneClassSVM(nu=float(NU), kernel=KERNEL, gamma='scale')
      model.fit(X_train)
      
      preds = model.predict(X_test)
      y_pred = np.where(preds == -1, 1, 0) # 1 = Anomalie
      
      y_proba = model.decision_function(X_test)
      feature_importances = None
      
      from sklearn.base import BaseEstimator, ClassifierMixin
      class OCSVMWrapper(BaseEstimator, ClassifierMixin):
          def __init__(self, model): self.model = model
          def fit(self, X, y=None): return self
          def predict(self, X): 
              return np.where(self.model.predict(X) == -1, 1, 0)
          def predict_proba(self, X):
              return self.model.decision_function(X)
              
      wrapped_model = OCSVMWrapper(model)
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', wrapped_model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', wrapped_model)])
          
      training_history = {"status": "success", "anomalies_found": int(np.sum(y_pred))}
      task_type = "anomaly_detection"
      print("[MODEL] One-Class SVM entraîné avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables.")
