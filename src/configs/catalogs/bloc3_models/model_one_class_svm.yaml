id: "model_one_class_svm"
name: "Model: One-Class SVM"
description: |
  Le One-Class SVM est une variante non-supervisée des Machines à Vecteurs de Support conçue pour la détection d'anomalies (ou la détection de nouveautés). Il apprend une frontière de décision sphérique ou un hyperplan qui sépare les données normales de l'origine dans un espace de grande dimension induit par un noyau (kernel trick), isolant ainsi les données atypiques.
category: "Détection d'Anomalies (Non-Supervisé)"
tags: ["model", "anomaly-detection", "tabular", "sklearn", "svm", "one-class"]
applies_to: ["Tabulaire"]
when_to_use: |
  Particulièrement indiqué lorsque le jeu de données d'entraînement ne contient que des observations normales (détection de nouveautés) ou lorsque les anomalies sont très rares ou indéfinies. Il est efficace pour des jeux de données avec un nombre de dimensions modéré à élevé.
use_cases:
  - "Surveillance de serveurs et d'infrastructures informatiques pour identifier des comportements inhabituels."
  - "Contrôle qualité dans le milieu manufacturier pour détecter des défauts de fabrication inédits."
  - "Détection de fraudes dans des transactions financières lorsque les exemples de fraude sont rares ou inexistants lors de l'entraînement."
pros:
  - "Bénéficie de la puissance mathématique du 'kernel trick', permettant de modéliser des frontières non linéaires complexes."
  - "Fonctionne efficacement même lorsque la distribution sous-jacente des données n'est pas gaussienne."
  - "Idéal pour l'apprentissage semi-supervisé où l'on dispose uniquement d'exemples de la classe positive (normale)."
cons:
  - "Sensible à la présence de valeurs aberrantes importantes dans le jeu d'entraînement (moins robuste si non utilisé comme pur détecteur de nouveautés)."
  - "Gourmand en ressources de calcul et en mémoire (complexité quadratique ou cubique) sur les très grands jeux de données."
  - "Le réglage des hyperparamètres, notamment 'nu' et 'gamma', peut être délicat en l'absence de données d'évaluation."
hyperparameters:
  nu: "Borne supérieure de la fraction d'erreurs d'entraînement (similaire à contamination, ex: 0.05)."
  kernel: "Noyau ('rbf', 'linear')."
math_theory: |
  Le One-Class SVM projette les données $\textcolor{#10b981}{x_i}$ dans un espace de caractéristiques de plus grande dimension via un noyau $\phi(x)$, et tente de les séparer de l'origine avec une marge maximale. Le problème d'optimisation est le suivant :

  $$
  \min_{w, \rho, \xi} \frac{1}{2} ||\textcolor{#3b82f6}{w}||^2 - \textcolor{#fbbf24}{\rho} + \frac{1}{\textcolor{#8b5cf6}{\nu} N} \sum_{i=1}^N \textcolor{#ef4444}{\xi_i} 
  $$
  
  Sous la contrainte $\textcolor{#3b82f6}{w} \cdot \phi(\textcolor{#10b981}{x_i}) \geq \textcolor{#fbbf24}{\rho} - \textcolor{#ef4444}{\xi_i}$ avec $\textcolor{#ef4444}{\xi_i} \geq 0$.
  Ici, $\textcolor{#3b82f6}{w}$ définit l'hyperplan, $\textcolor{#fbbf24}{\rho}$ est la distance de l'hyperplan à l'origine, $\textcolor{#8b5cf6}{\nu}$ contrôle la proportion maximale d'anomalies (erreurs), et $\textcolor{#ef4444}{\xi_i}$ sont les variables d'écart (slack variables).
