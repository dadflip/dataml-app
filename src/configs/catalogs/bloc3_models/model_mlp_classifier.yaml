id: "model_mlp_classifier"
name: "Model: Multi-Layer Perceptron (Classifier)"
description: "Modèle de réseau de neurones artificiels (Multi-Layer Perceptron) entièrement connecté implémenté via Scikit-Learn, dédié aux tâches de classification multiclasse ou binaire."
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "sklearn", "mlp", "neural-network"]
applies_to: ["Tabulaire"]
when_to_use: "À utiliser comme référence (baseline) pour modéliser des relations non linéaires complexes dans des données tabulaires, avant de recourir à des architectures d'apprentissage profond plus lourdes."
use_cases:
  - "Classification de profils clients ou détection d'anomalies sur des volumes de données tabulaires moyens."
  - "Catégorisation de diagnostics ou résultats d'analyses médicales sur la base de caractéristiques non linéaires."
  - "Évaluation et scoring des risques de crédit avec de multiples interactions implicites entre les variables."
pros:
  - "Intégration native dans l'écosystème Scikit-Learn, ce qui facilite son utilisation sans ajouter de dépendances supplémentaires (comme PyTorch ou TensorFlow)."
  - "Modélisation efficace des fonctions et des frontières de décision hautement non linéaires."
cons:
  - "Ne bénéficie pas de l'accélération matérielle (GPU), ce qui entraîne des temps d'apprentissage significativement plus longs sur des grands jeux de données."
  - "Fonction de perte non convexe avec un risque de blocage dans des minima locaux, et sensibilité au dimensionnement des hyperparamètres."
hyperparameters:
  hidden_layer_sizes: "Tailles des couches séparées par des virgules (ex: '100, 50')."
  activation: "Fonction d'activation ('relu', 'tanh', 'logistic')."
  max_iter: "Nombre max d'époques (ex: 200)."
math_theory: |
  Le Multi-Layer Perceptron (MLP) propage les caractéristiques d'entrée $\textcolor{#fbbf24}{x}$ à travers des couches cachées. Pour la couche $l$ :
  $$ \textcolor{#10b981}{h^{(l)}} = \textcolor{#3b82f6}{\sigma}\left( \textcolor{#8b5cf6}{W^{(l)}} \textcolor{#10b981}{h^{(l-1)}} + \textcolor{#8b5cf6}{b^{(l)}} \right) $$
  Où $\textcolor{#8b5cf6}{W^{(l)}}$ sont les matrices de poids, $\textcolor{#8b5cf6}{b^{(l)}}$ les biais, et $\textcolor{#3b82f6}{\sigma}$ la fonction d'activation (ex: ReLU).
  Pour la classification, la couche de sortie utilise Softmax pour produire des probabilités $\textcolor{#10b981}{\hat{y}_c}$. L'apprentissage minimise la fonction de perte Entropie Croisée (Cross-Entropy) $\textcolor{#ef4444}{\mathcal{L}}$ :
  $$ \textcolor{#ef4444}{\mathcal{L}} = -\sum_{c} \textcolor{#fbbf24}{y_c} \log(\textcolor{#10b981}{\hat{y}_c}) $$
