code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.neural_network import MLPClassifier
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: HIDDEN_LAYER_SIZES | string]
  HIDDEN_LAYER_SIZES = "100, 50"
  # [/PARAM]

  # [PARAM: ACTIVATION | string]
  ACTIVATION = "relu"
  # [/PARAM]

  # [PARAM: MAX_ITER | number]
  MAX_ITER = 200
  # [/PARAM]

  print(f"[MODEL] Initialisation MLP Classifier (layers={HIDDEN_LAYER_SIZES}, act={ACTIVATION})...")
  
  # Parse hidden layer sizes
  try:
      layer_sizes = tuple([int(x.strip()) for x in str(HIDDEN_LAYER_SIZES).split(",") if x.strip()])
  except ValueError:
      layer_sizes = (100, 50)
      
  model = MLPClassifier(hidden_layer_sizes=layer_sizes, activation=ACTIVATION, max_iter=int(MAX_ITER), random_state=42)

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline avec MLP Classifier...")
      full_pipeline.fit(X_train, y_train)
      y_pred = full_pipeline.predict(X_test)
      if hasattr(full_pipeline, "predict_proba"):
          y_proba = full_pipeline.predict_proba(X_test)
      
      training_history = {"status": "success", "fitted_on": len(X_train)}
