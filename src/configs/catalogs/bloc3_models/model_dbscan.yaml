id: "model_dbscan"
name: "Model: DBSCAN Clustering"
description: "Clustering spatial basé sur la densité. Trouve des formes complexes et détecte le bruit."
category: "Clustering (Non-Supervisé)"
tags: ["model", "clustering", "tabular", "sklearn", "dbscan"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous ne connaissez pas le nombre de clusters K, et que les groupes peuvent avoir des formes non-sphériques."
pros:
  - "N'a pas besoin de K. Sépare bien le bruit (outliers) des vrais clusters."
cons:
  - "Impossible de faire un 'predict' sur de nouvelles données facilement (transductif)."
hyperparameters:
  eps: "Rayon de voisinage (ex: 0.5). À calibrer très finement !"
  min_samples: "Nombre minimum de points pour former un cluster (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.cluster import DBSCAN

  # [PARAM: EPS | number]
  EPS = 0.5
  # [/PARAM]

  # [PARAM: MIN_SAMPLES | number]
  MIN_SAMPLES = 5
  # [/PARAM]

  print(f"[MODEL] Entraînement DBSCAN (eps={EPS}, min_samples={MIN_SAMPLES})...")
  if 'X_train' in locals() and 'X_test' in locals():
      # DBSCAN n'a pas de méthode predict pour de nouvelles données !
      # Nous allons l'entraîner sur X_test directement pour assigner des labels (mode inférence transductive)
      
      model = DBSCAN(eps=float(EPS), min_samples=int(MIN_SAMPLES))
      
      # labels_ contient les clusters assignés (-1 = bruit/outlier)
      y_pred = model.fit_predict(X_test)
      y_proba = None
      feature_importances = None
      
      # Le full_pipeline est délicat avec DBSCAN car il ne supporte pas predict()
      # On wrap le modèle pour lever une erreur propre si on essaie de réutiliser le pipeline plus tard
      from sklearn.preprocessing import FunctionTransformer
      def dummy_predict(X):
          return model.fit_predict(X)
      wrapped_model = FunctionTransformer(dummy_predict)
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', wrapped_model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', wrapped_model)])
          
      n_clusters_ = len(set(y_pred)) - (1 if -1 in y_pred else 0)
      n_noise_ = list(y_pred).count(-1)
      
      training_history = {"status": "success", "estimated_clusters": n_clusters_, "noise_points": n_noise_}
      task_type = "clustering"
      print("[MODEL] DBSCAN exécuté avec succès sur les données de test.")
  else:
      print("[ERREUR] Données de test introuvables.")
