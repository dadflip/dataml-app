math_theory: |
  $$
  N_{\textcolor{#3b82f6}{\epsilon}}(p) = \{ q \in D \mid dist(p, q) \le \textcolor{#3b82f6}{\epsilon} \} 
  $$

  $$
  |N_{\textcolor{#3b82f6}{\epsilon}}(p)| \ge \textcolor{#10b981}{min\_samples} 
  $$
  
  Où :
  - $\textcolor{#3b82f6}{\epsilon}$ est le rayon maximal du voisinage.
  - $\textcolor{#10b981}{min\_samples}$ est le nombre minimum de points requis dans le voisinage pour former une région dense.
  - Un point satisfaisant cette condition est un point "Cœur" (Core). S'il est dans le voisinage d'un point cœur mais n'a pas assez de voisins, c'est un point "Bord" (Border). Sinon, c'est un point de bruit ($\textcolor{#ef4444}{Noise}$).
