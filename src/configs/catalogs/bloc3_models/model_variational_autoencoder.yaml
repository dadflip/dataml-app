      In([Input Data]) --> Enc1(Encoder: Dense Layers)
      Enc1 --> Mu([Latent Mean])
      Enc1 --> LogVar([Latent Log-Var])
      Mu --> Reparam(Reparameterization Trick)
      LogVar --> Reparam
      Reparam --> Dec1(Decoder: Dense Layers)
      Dec1 --> Out([Reconstructed Data])
      
