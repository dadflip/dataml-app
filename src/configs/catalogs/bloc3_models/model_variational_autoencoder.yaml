id: "model_variational_autoencoder"
name: "Model: Variational Autoencoder (VAE)"
description: |
  Autoencodeur Variationnel (VAE). Architecture de réseau de neurones profond (Deep Learning) non supervisée, utilisée pour apprendre une représentation continue et structurée (espace latent) des données. Contrairement à un autoencodeur classique, l'espace latent d'un VAE suit une distribution de probabilité (souvent gaussienne), ce qui permet de générer de nouvelles données cohérentes.
category: "Génératif & Non-Supervisé"
tags: ["model", "generative", "unsupervised", "pytorch", "vae", "deep-learning"]
applies_to: ["Tabulaire", "Images"]
when_to_use: |
  À privilégier lorsque vous souhaitez non seulement réduire la dimension de vos données, mais surtout construire un modèle génératif capable de créer de nouvelles données synthétiques réalistes ou d'interpoler fluidement entre deux points de données existants.
use_cases:
  - "Génération de nouvelles données synthétiques (ex: création de visages, génération de molécules)."
  - "Interpolation lisse et structurée dans l'espace latent pour simuler la transition entre différents états."
  - "Réduction de dimensionnalité probabiliste pour extraire des caractéristiques robustes au bruit."
  - "Détection d'anomalies non supervisée basée sur l'erreur de reconstruction."
pros:
  - "Apprend un espace latent continu et bien structuré, empêchant la formation de 'trous' dans la représentation."
  - "Fournit un cadre probabiliste rigoureux (divergence de Kullback-Leibler) pour modéliser l'incertitude."
  - "Globalement plus facile et plus stable à entraîner que les architectures purement antagonistes (GANs)."
cons:
  - "A tendance à générer des résultats légèrement 'flous' (surtout pour les images) à cause de la perte Mean Squared Error (MSE)."
  - "L'équilibrage de la fonction de perte (reconstruction vs divergence KL) requiert souvent un ajustement minutieux (β-VAE)."
  - "L'astuce mathématique (reparameterization trick) complexifie l'implémentation par rapport à un autoencodeur basique."
hyperparameters:
  latent_dim: "Taille de l'espace latent (ex: 2)."
  epochs: "Nombre d'époques (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.nn.functional as F
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: LATENT_DIM | number]
  LATENT_DIM = 2
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  print(f"[MODEL] Entraînement VAE (latent={LATENT_DIM})...")
  if 'X_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train, dtype=np.float32)
      X_te_np = np.array(X_test, dtype=np.float32)
      dataset = TensorDataset(torch.tensor(X_tr_np))
      loader = DataLoader(dataset, batch_size=64, shuffle=True)
      dim = X_tr_np.shape[1]
      ld = int(LATENT_DIM)

      class VAE(nn.Module):
          def __init__(self):
              super().__init__()
              self.fc1 = nn.Linear(dim, 64)
              self.fc_mu = nn.Linear(64, ld)
              self.fc_lv = nn.Linear(64, ld)
              self.fc3 = nn.Linear(ld, 64)
              self.fc4 = nn.Linear(64, dim)
          def encode(self, x):
              h = F.relu(self.fc1(x))
              return self.fc_mu(h), self.fc_lv(h)
          def reparameterize(self, mu, lv):
              return mu + torch.exp(0.5*lv) * torch.randn_like(lv)
          def decode(self, z):
              return torch.sigmoid(self.fc4(F.relu(self.fc3(z))))
          def forward(self, x):
              mu, lv = self.encode(x)
              return self.decode(self.reparameterize(mu, lv)), mu, lv

      def vae_loss(rx, x, mu, lv):
          return F.mse_loss(rx, x, reduction='sum') - 0.5 * torch.sum(1 + lv - mu.pow(2) - lv.exp())

      model = VAE()
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      model.train()
      for epoch in range(int(EPOCHS)):
          for (bx,) in loader:
              bx = bx.to(device)
              optimizer.zero_grad()
              rx, mu, lv = model(bx)
              loss = vae_loss(rx, bx, mu, lv)
              loss.backward()
              optimizer.step()
      model.eval()
      with torch.no_grad():
          y_pred, _, _ = model(torch.tensor(X_te_np).to(device))
          y_pred = y_pred.cpu().numpy()
      y_proba = None
      feature_importances = None
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
      training_history = {"status": "success", "loss": float(loss)}
      task_type = "generative"
math_theory: |
  Dans un VAE, l'encodeur ne produit pas un point déterministe, mais les paramètres (moyenne $\textcolor{#3b82f6}{\mu}$ et variance $\textcolor{#fbbf24}{\sigma^2}$) d'une distribution latente.
  Pour permettre la rétropropagation, on utilise l'astuce de reparamétrisation en échantillonnant un bruit $\textcolor{#8b5cf6}{\epsilon \sim \mathcal{N}(0, I)}$ :
  
  $$ \textcolor{#10b981}{z} = \textcolor{#3b82f6}{\mu} + \textcolor{#fbbf24}{\sigma} \odot \textcolor{#8b5cf6}{\epsilon} $$
  
  Le décodeur génère ensuite la reconstruction $\textcolor{#ef4444}{\hat{x}}$ à partir de $\textcolor{#10b981}{z}$. La fonction de coût combine l'erreur de reconstruction et la divergence de Kullback-Leibler (KL) qui régularise l'espace latent pour le rapprocher d'une distribution normale centrée réduite :
  
  $$ \mathcal{L} = || \textcolor{#10b981}{x} - \textcolor{#ef4444}{\hat{x}} ||^2 + D_{KL} \left( \mathcal{N}(\textcolor{#3b82f6}{\mu}, \textcolor{#fbbf24}{\sigma^2}) || \mathcal{N}(0, I) \right) $$
