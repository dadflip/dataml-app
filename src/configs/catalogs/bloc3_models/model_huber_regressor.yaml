id: "model_huber_regressor"
name: "Model: Huber Regressor"
description: "Modèle de régression linéaire robuste qui optimise la perte de Huber, une fonction de coût hybride moins pénalisante pour les valeurs extrêmes (outliers) que l'erreur quadratique standard."
category: "Modèles Linéaires"
tags: ["model", "regression", "tabular", "sklearn", "linear", "robust"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal lorsque la variable cible contient des valeurs aberrantes importantes qui fausseraient fortement une régression linéaire classique (Moindres Carrés Ordinaires)."
use_cases:
  - "Prédiction de prix (ex: immobilier) avec quelques biens au prix exorbitant."
  - "Modélisation de données de capteurs présentant des pics d'erreurs ponctuels."
  - "Analyse financière avec des événements extrêmes rares."
pros:
  - "Très résistant à l'influence des valeurs aberrantes massives."
  - "Produit un modèle linéaire interprétable (coefficients directement exploitables)."
  - "Optimise une fonction continûment dérivable (contrairement à l'erreur absolue pure L1)."
cons:
  - "Le réglage du paramètre 'epsilon' (seuil séparant inliers et outliers) peut s'avérer délicat et nécessite une validation croisée."
  - "Ne capture pas les relations non linéaires."
  - "Sensible aux fortes colinéarités entre les variables prédictives, bien qu'il inclue une régularisation Ridge par défaut."
hyperparameters:
  epsilon: "Seuil à partir duquel un résidu est traité comme un outlier (ex: 1.35)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import HuberRegressor

  # [PARAM: EPSILON | number]
  EPSILON = 1.35
  # [/PARAM]

  print(f"[MODEL] Entraînement Huber Regressor (epsilon={EPSILON})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = HuberRegressor(epsilon=float(EPSILON), max_iter=1000)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals():
          if len(model.coef_) == len(feature_names_out):
              feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train), "outliers_detected": int(np.sum(model.outliers_))}
      task_type = "regression"
      meta = {}
math_theory: |
  The Huber Regressor optimizes a robust loss function that combines the advantages of squared error (L2) and absolute error (L1). It is less sensitive to outliers than ordinary least squares.
  
  1. **Residuals**: For a linear model $\hat{y} = \textcolor{#3b82f6}{X \beta}$, the residual is $r_i = \textcolor{#10b981}{y_i} - \textcolor{#3b82f6}{X_i \beta}$.
  
  2. **Huber Loss**: The loss function behaves quadratically for small residuals and linearly for large residuals, controlled by a threshold parameter $\textcolor{#fbbf24}{\epsilon}$:
  $$ \mathcal{L}_\epsilon(r) = \begin{cases} 
  \frac{1}{2} r^2 & \text{if } |r| \le \textcolor{#fbbf24}{\epsilon} \quad \text{(L2 behavior)} \\
  \textcolor{#fbbf24}{\epsilon} |r| - \frac{1}{2} \textcolor{#fbbf24}{\epsilon}^2 & \text{if } |r| > \textcolor{#fbbf24}{\epsilon} \quad \text{(L1 behavior)}
  \end{cases} $$
  
  3. **Objective**: The model minimizes the Huber loss over all samples plus an L2 penalty (Ridge regularization) on the coefficients:
  $$ \min_{\textcolor{#3b82f6}{\beta}} \sum_{i=1}^n \mathcal{L}_\epsilon(\textcolor{#10b981}{y_i} - \textcolor{#3b82f6}{X_i \beta}) + \textcolor{#8b5cf6}{\alpha} \|\textcolor{#3b82f6}{\beta}\|_2^2 $$
  This ensures smooth differentiability everywhere while severely limiting the influence of large outliers (where the gradient is capped at $\pm \textcolor{#fbbf24}{\epsilon}$).
