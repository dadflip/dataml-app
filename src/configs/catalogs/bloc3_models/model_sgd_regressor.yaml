id: "model_sgd_regressor"
name: "Model: SGD Regressor"
description: "Régression linéaire où l'optimisation est effectuée par descente de gradient stochastique (SGD). Solution hautement évolutive pour des données tabulaires massives."
category: "Modèles Linéaires"
tags: ["model", "regression", "tabular", "sklearn", "linear", "online-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal lorsque le jeu de données est trop vaste pour tenir en mémoire RAM ou quand une approche d'apprentissage continu (online learning) est requise."
use_cases:
  - "Prédiction de revenus continus sur des millions de transactions e-commerce."
  - "Évaluation immobilière à très grande échelle intégrant des flux de données en continu."
  - "Modélisation de performances sur des capteurs IoT générant d'immenses historiques."
pros:
  - "Scalabilité extrême (out-of-core learning via `partial_fit`)."
  - "Flexibilité des fonctions de perte (Huber pour résister aux outliers, Squared Error pour standard)."
  - "Calcul très rapide comparé aux méthodes de résolution exactes."
cons:
  - "Extrêmement sensible à l'échelle des données, exigeant une standardisation stricte."
  - "Nécessite souvent le réglage fin du taux d'apprentissage (learning rate) pour converger."
  - "Moins stable que la régression classique (Outils MCO) sur de petits jeux de données."
hyperparameters:
  loss: "Fonction de perte ('squared_error', 'huber', 'epsilon_insensitive')."
  penalty: "Régularisation ('l2', 'l1', 'elasticnet')."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import SGDRegressor

  # [PARAM: LOSS | string]
  LOSS = "squared_error"
math_theory: |
  Le régresseur SGD optimise les coefficients d'un modèle linéaire en mettant à jour les poids pour chaque observation (ou mini-lot), ce qui le rend idéal pour l'apprentissage en ligne.

  La règle de mise à jour utilisant la perte de l'Erreur Quadratique ($L_{SE}$) est :

  $$
  \textcolor{#ef4444}{L}_{SE}(\textcolor{#10b981}{y_t}, \hat{y}_t) = \frac{1}{2} (\textcolor{#10b981}{y_t} - \textcolor{#3b82f6}{w}_t^T \textcolor{#10b981}{x_t})^2 
  $$

  $$
  \textcolor{#3b82f6}{w}_{t+1} = \textcolor{#3b82f6}{w}_t + \textcolor{#8b5cf6}{\eta_t} \left( (\textcolor{#10b981}{y_t} - \textcolor{#3b82f6}{w}_t^T \textcolor{#10b981}{x_t})\textcolor{#10b981}{x_t} - \frac{\textcolor{#fbbf24}{\alpha}}{N} \nabla R(\textcolor{#3b82f6}{w}_t) \right) 
  $$

  - $\textcolor{#3b82f6}{w}$ : Poids du modèle de régression
  - $\textcolor{#8b5cf6}{\eta_t}$ : Taux d'apprentissage à l'étape $t$
  - $\textcolor{#ef4444}{L}_{SE}$ : Erreur quadratique pour l'observation courante
  - $(\textcolor{#10b981}{x_t}, \textcolor{#10b981}{y_t})$ : Instance stochastique
  - $\textcolor{#fbbf24}{\alpha}$ : Paramètre de régularisation
