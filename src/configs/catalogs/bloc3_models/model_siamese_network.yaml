id: "model_siamese_network"
name: "Model: Siamese Network (Few-Shot)"
description: "Architecture de Deep Learning composée de deux réseaux jumeaux (partageant les mêmes poids) conçue pour comparer deux entrées et évaluer leur similarité via une distance dans un espace latent."
category: "Réseaux Spécialisés"
tags: ["model", "few-shot", "similarity", "pytorch", "siamese", "deep-learning"]
applies_to: ["Images", "Tabulaire"]
when_to_use: "Idéal pour les problèmes où le nombre d'exemples par classe est très faible (Few-Shot Learning) ou pour des tâches de vérification (s'agit-il de la même entité ?)."
use_cases:
  - "Vérification faciale ou biométrique (comparaison d'une photo d'identité avec un badge)."
  - "Détection de doublons ou quasi-doublons dans une base de données de produits ou d'annonces."
  - "Recherche de similarité sémantique entre deux textes (Sentence-BERT)."
pros:
  - "Performant même avec très peu d'exemples étiquetés par classe."
  - "Généralise bien aux nouvelles classes non vues durant l'entraînement (Zero-Shot potentiel)."
  - "Apprend un espace de représentation sémantiquement très riche (embeddings)."
cons:
  - "La préparation des données (génération de paires positives et négatives) est complexe."
  - "Entraînement gourmand en calcul et dépendant de la fonction de perte (Contrastive, Triplet Margin)."
  - "Le choix des paires (hard negative mining) influence drastiquement les performances."
hyperparameters:
  embedding_dim: "Dimension de l'espace d'embedding (ex: 32)."
  epochs: "Nombre d'époques (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: EMBEDDING_DIM | number]
  EMBEDDING_DIM = 32
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 10
  # [/PARAM]

  print(f"[MODEL] Entraînement Siamese Network...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train, dtype=np.float32)
      X_te_np = np.array(X_test, dtype=np.float32)
      in_feat = X_tr_np.shape[1]
      ed = int(EMBEDDING_DIM)

      class SiameseEmbedder(nn.Module):
          def __init__(self, in_f, emb_d):
              super().__init__()
              self.net = nn.Sequential(nn.Linear(in_f, 64), nn.ReLU(), nn.Linear(64, emb_d))
          def forward(self, x):
              return self.net(x)

      # Construction de paires
      y_tr = np.array(y_train)
      pairs_x1, pairs_x2, pairs_label = [], [], []
      n = min(len(X_tr_np), 2000) # Limiter pour la démo
      for i in range(n):
          # Positive pair
          same_class = np.where(y_tr == y_tr[i])[0]
          if len(same_class) > 1:
              j = np.random.choice(same_class[same_class != i])
              pairs_x1.append(X_tr_np[i]); pairs_x2.append(X_tr_np[j]); pairs_label.append(1.0)
          # Negative pair
          diff_class = np.where(y_tr != y_tr[i])[0]
          if len(diff_class) > 0:
              j = np.random.choice(diff_class)
              pairs_x1.append(X_tr_np[i]); pairs_x2.append(X_tr_np[j]); pairs_label.append(0.0)

      dataset = TensorDataset(torch.tensor(np.array(pairs_x1)), torch.tensor(np.array(pairs_x2)), torch.tensor(np.array(pairs_label, dtype=np.float32)))
      loader = DataLoader(dataset, batch_size=64, shuffle=True)

      model = SiameseEmbedder(in_feat, ed)
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      optimizer = optim.Adam(model.parameters(), lr=0.001)

      # Contrastive Loss
      def contrastive_loss(out1, out2, label, margin=1.0):
          dist = torch.nn.functional.pairwise_distance(out1, out2)
          return torch.mean(label * dist.pow(2) + (1 - label) * torch.clamp(margin - dist, min=0).pow(2))

      model.train()
      for epoch in range(int(EPOCHS)):
          for bx1, bx2, bl in loader:
              bx1, bx2, bl = bx1.to(device), bx2.to(device), bl.to(device)
              optimizer.zero_grad()
              loss = contrastive_loss(model(bx1), model(bx2), bl)
              loss.backward()
              optimizer.step()

      model.eval()
      with torch.no_grad():
          embeddings = model(torch.tensor(X_te_np).to(device)).cpu().numpy()
      y_pred = embeddings # Les embeddings sont la sortie principale
      y_proba = None
      feature_importances = None
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
      training_history = {"status": "success", "loss": float(loss)}
      task_type = "similarity"
math_theory: |
  Un réseau siamois calcule une métrique de similarité entre deux entrées à l'aide de réseaux jumeaux partageant les mêmes poids.
  
  1. **Embeddings (Plongements)** : Deux entrées, $\textcolor{#10b981}{x_1}$ et $\textcolor{#10b981}{x_2}$, sont passées à travers le même réseau $f_\theta$ pour produire des plongements latents :
  $$
  e_1 = \textcolor{#3b82f6}{f_\theta}(\textcolor{#10b981}{x_1}), \quad e_2 = \textcolor{#3b82f6}{f_\theta}(\textcolor{#10b981}{x_2}) 
  $$
  
  2. **Métrique de Distance** : La distance euclidienne $D$ entre les plongements est calculée :
  $$
  D_w(\textcolor{#10b981}{x_1}, \textcolor{#10b981}{x_2}) = \| e_1 - e_2 \|_2 
  $$
  
  3. **Perte Contrastive** : Le réseau est entraîné à l'aide d'une fonction de perte contrastive. Soit $\textcolor{#8b5cf6}{Y} = 1$ si les entrées proviennent de la même classe (paire positive) et $\textcolor{#8b5cf6}{Y} = 0$ si elles proviennent de classes différentes (paire négative). Avec une marge $\textcolor{#fbbf24}{m}$ :
  $$
  \mathcal{L} = \textcolor{#8b5cf6}{Y} \cdot \frac{1}{2} D_w^2 + (1 - \textcolor{#8b5cf6}{Y}) \cdot \frac{1}{2} \max(0, \textcolor{#fbbf24}{m} - D_w)^2 
  $$
  Cela rapproche les paires positives et éloigne les paires négatives jusqu'à une distance $\textcolor{#fbbf24}{m}$.
