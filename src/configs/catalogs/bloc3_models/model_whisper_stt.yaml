id: "model_whisper_stt"
name: "Model: OpenAI Whisper (Speech-to-Text)"
description: |
  Modèle de reconnaissance vocale automatique (Speech-to-Text) universel et robuste développé par OpenAI. Effectue des transcriptions multilingues de haute qualité.
category: "Multimédia & Audio"
tags: ["model", "audio", "speech-to-text", "transformers", "huggingface", "whisper", "zero-shot"]
applies_to: ["Audio"]
when_to_use: |
  Pour transcrire fidèlement un fichier audio (ex. .mp3, .wav) en texte pur, peu importe la langue, l'accent ou le niveau de bruit de fond modéré.
use_cases:
  - "Sous-titrage automatique de vidéos ou de podcasts."
  - "Transcription d'entretiens, de réunions ou de mémos vocaux."
  - "Indexation de bases de données audio pour la recherche textuelle."
pros:
  - "État de l'art (SOTA) absolu en matière de transcription vocale multilingue."
  - "Gère remarquablement bien les accents, les jargons et les bruits de fond."
cons:
  - "Lent lors de l'exécution sur processeur (CPU), nécessite idéalement un GPU."
  - "Les modèles de grande taille consomment beaucoup de mémoire."
hyperparameters:
  model_size: "Taille du modèle ('tiny', 'base', 'small')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  # [PARAM: MODEL_SIZE | string]
  MODEL_SIZE = "tiny"
  # [/PARAM]

  print(f"[MODEL] Reconnaissance vocale via Whisper (size={MODEL_SIZE})...")
  model = "Whisper-STT"
  full_pipeline = None
  y_pred = []
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "speech_to_text"
  meta = {"model_name": f"Whisper {MODEL_SIZE}"}

  if 'X_test' in locals() and pipeline is not None:
      audios = list(X_test)
      
      print("Chargement du modèle Whisper...")
      model_id = f"openai/whisper-{MODEL_SIZE}"
      transcriber = pipeline("automatic-speech-recognition", model=model_id)
      
      print("Transcription en cours...")
      for a in audios:
          try:
              res = transcriber(a)
              y_pred.append(res["text"])
          except Exception as e:
              y_pred.append(f"Erreur: {str(e)}")
              
      y_pred = np.array(y_pred)
      full_pipeline = model
      training_history = {"status": "success", "processed": len(y_pred)}
math_theory: |
  Whisper processes audio using a classic Transformer encoder-decoder sequence-to-sequence architecture.
  
  1. **Audio Encoding**: The raw audio is converted to a Log-Mel Spectrogram $\textcolor{#10b981}{X_{mel}}$. The Transformer Encoder processes this into continuous hidden representations $\textcolor{#3b82f6}{H_{enc}}$:
  $$ \textcolor{#3b82f6}{H_{enc}} = \text{Encoder}(\textcolor{#10b981}{X_{mel}}) $$
  
  2. **Autoregressive Decoding**: The Transformer Decoder predicts the probability of the next text token $\textcolor{#fbbf24}{y_i}$ conditioned on the encoder output and previous tokens $\textcolor{#fbbf24}{y_{<i}}$:
  $$ P(\textcolor{#fbbf24}{y_i} \mid \textcolor{#fbbf24}{y_{<i}}, \textcolor{#10b981}{X_{mel}}) = \text{Softmax}(\text{Decoder}(\textcolor{#fbbf24}{y_{<i}}, \textcolor{#3b82f6}{H_{enc}})) $$
  
  3. **Multitask Format**: Whisper frames all tasks (STT, translation, VAD) as text sequence prediction, controlled by special prefix tokens (e.g., `<|transcribe|>` vs `<|translate|>`). The model is trained using standard sequence cross-entropy loss:
  $$ \mathcal{L} = - \sum_{i} \log P(\textcolor{#fbbf24}{y_i} \mid \textcolor{#fbbf24}{y_{<i}}, \textcolor{#10b981}{X_{mel}}; \textcolor{#8b5cf6}{\Theta}) $$
