code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  # [PARAM: MODEL_SIZE | string]
  MODEL_SIZE = "tiny"
  # [/PARAM]

  print(f"[MODEL] Transcription audio Whisper (size={MODEL_SIZE})...")
  if 'X_test' in locals() and pipeline is not None:
      audios = list(X_test) # Liste de paths vers des fichiers audio
      
      print(f"Chargement de Whisper ({MODEL_SIZE})...")
      transcriber = pipeline("automatic-speech-recognition", model=f"openai/whisper-{MODEL_SIZE}")
      
      print("Transcription en cours...")
      results = []
      for a in audios:
          try:
              res = transcriber(a)
              results.append(res["text"])
          except Exception as e:
              results.append(f"[ERREUR: {e}]")
              
      y_pred = np.array(results)
      y_proba = None
      feature_importances = None
      model = transcriber
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "type": "speech_to_text"}
      task_type = "information_extraction"
      print("[MODEL] Transcription terminée.")
  else:
      print("[ERREUR] Données introuvables ou transformers non installé.")
