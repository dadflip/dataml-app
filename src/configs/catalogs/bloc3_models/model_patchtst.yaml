id: "model_patchtst"
name: "Model: PatchTST (Transformers Time Series)"
description: |
  PatchTST (Patch Time Series Transformer) est une architecture d'apprentissage profond de pointe pour la prévision de séries temporelles, disponible via HuggingFace. Elle divise les séquences temporelles en "patchs" (segments courts), ce qui permet aux Transformers de traiter très efficacement de longues dépendances temporelles tout en préservant le contexte sémantique local.
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "transformers", "huggingface", "deep-learning"]
applies_to: ["Séries Temporelles"]
when_to_use: |
  Privilégier PatchTST pour des tâches de prévisions à long terme sur des séries temporelles multivariées complexes, volumineuses et hautement saisonnières. Idéal lorsque vous disposez d'un GPU et d'un grand historique de données.
use_cases:
  - "Prévision de la demande énergétique (électricité, gaz) sur de longs horizons temporels avec de multiples variables exogènes (météo, jours fériés)."
  - "Anticipation des marchés financiers à haute fréquence en exploitant simultanément plusieurs signaux corrélés."
  - "Prédiction de la charge du trafic réseau ou des serveurs cloud pour de l'allocation dynamique de ressources."
pros:
  - "Performances à l'état de l'art (SOTA) surpassant souvent les LSTMs et modèles statistiques (ARIMA, Prophet) sur le long terme."
  - "L'approche par patchs réduit drastiquement la complexité quadratique de l'attention des Transformers."
  - "Excellente indépendance des canaux (channel independence) permettant une modélisation multivariée robuste."
cons:
  - "Requiert une expertise technique poussée pour configurer les DataLoaders et formater les tenseurs PyTorch."
  - "Très coûteux en ressources de calcul (nécessite typiquement un GPU pour l'entraînement)."
  - "Peut sur-apprendre (overfitting) ou s'avérer inefficace sur de petites séries temporelles limitées."
