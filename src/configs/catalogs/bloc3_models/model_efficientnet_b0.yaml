id: "model_efficientnet_b0"
name: "Model: EfficientNet-B0 (Fine-Tuning)"
description: |
  Réseau de neurones convolutif développé par Google. Il repose sur la méthode du "Compound Scaling" qui équilibre la profondeur, la largeur et la résolution de l'image. Cela permet de proposer un ratio exceptionnel entre précision des prédictions et taille du modèle, garantissant des performances à l'état de l'art tout en maintenant l'efficacité computationnelle.
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "efficientnet", "deep-learning"]
applies_to: ["Images"]
when_to_use: |
  Privilégiez ce modèle lorsque vous recherchez le meilleur compromis possible entre la précision de la classification et l'empreinte mémoire, notamment pour les applications où les ressources matérielles (GPU ou processeurs embarqués) sont limitées.
use_cases:
  - "Classification d'images sur des dispositifs mobiles ou IoT."
  - "Analyse visuelle où un haut débit d'inférence est critique."
  - "Fine-tuning rapide sur des jeux de données d'images spécifiques (médicales, industrielles)."
pros:
  - "Efficacité computationnelle (Compound Scaling) et légèreté (idéal pour l'embarqué)."
  - "Précision souvent supérieure aux modèles de la famille ResNet de taille comparable."
  - "Architecture pré-entraînée permettant un transfert d'apprentissage rapide (Transfer Learning)."
cons:
  - "L'architecture plus complexe peut occasionnellement ralentir le fine-tuning sur des GPUs d'entrée de gamme par rapport à un ResNet standard."
  - "Sensibilité aux hyperparamètres de scaling, rendant les ajustements d'architecture délicats."
hyperparameters:
  epochs: "Nombre d'époques de fine-tuning (ex: 3)."
math_theory: |
  EfficientNet utilise le \textit{Compound Scaling} (mise à l'échelle composée) pour mettre à l'échelle uniformément les trois dimensions du réseau (largeur, profondeur, résolution).
  Au lieu de modifier arbitrairement une seule dimension, la mise à l'échelle est contrôlée par un coefficient global $\textcolor{#8b5cf6}{\phi}$.
  Les facteurs de mise à l'échelle pour la profondeur $\textcolor{#10b981}{d}$, la largeur $\textcolor{#3b82f6}{w}$ et la résolution $\textcolor{#fbbf24}{r}$ sont déterminés par :
  
  $$
  \textcolor{#10b981}{d} = \alpha^{\textcolor{#8b5cf6}{\phi}} \quad \textcolor{#3b82f6}{w} = \beta^{\textcolor{#8b5cf6}{\phi}} \quad \textcolor{#fbbf24}{r} = \gamma^{\textcolor{#8b5cf6}{\phi}}
  $$
  
  Sous la contrainte que $\alpha \cdot \beta^2 \cdot \gamma^2 \approx 2$, ce qui garantit que l'augmentation des FLOPS est d'environ $2^{\textcolor{#8b5cf6}{\phi}}$.
  EfficientNet-B0 est l'architecture de base ($\textcolor{#8b5cf6}{\phi}=0$), trouvée via une recherche d'architecture neuronale (NAS) optimisant la précision et les FLOPS.
