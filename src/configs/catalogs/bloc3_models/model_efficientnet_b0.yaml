code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      import torchvision.models as models
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch torchvision")

  # [PARAM: EPOCHS | number]
  EPOCHS = 3
  # [/PARAM]

  print(f"[MODEL] Fine-Tuning EfficientNet-B0 (epochs={EPOCHS})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"framework": "pytorch", "type": "efficientnet_b0"}
  full_pipeline = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      dataset = TensorDataset(torch.tensor(X_tr_np, dtype=torch.float32), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=8, shuffle=True)
      
      model = models.efficientnet_b0(pretrained=True)
      # Remplacement de la tête de classification
      num_ftrs = model.classifier[1].in_features
      model.classifier[1] = nn.Linear(num_ftrs, num_classes)
      
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.classifier[1].parameters(), lr=0.001)
      
      model.train()
      final_loss = 0.0
      for epoch in range(int(EPOCHS)):
          epoch_loss = 0.0
          for batch_X, batch_y in loader:
              batch_X, batch_y = batch_X.to(device), batch_y.to(device)
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              epoch_loss += loss.item()
          final_loss = epoch_loss / len(loader)
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np, dtype=torch.float32).to(device)
          logits = model(X_te_t)
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
          
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "loss": final_loss, "device": str(device)}

