math_theory: |
  MediaPipe Pose utilise un pipeline d'apprentissage automatique en deux étapes pour une estimation robuste de la posture humaine.
  
  D'abord, un **Détecteur** localise la personne / la région d'intérêt (ROI) et prédit une boîte englobante initiale.
  Ensuite, un **Traqueur (Modèle de repères de posture)** prédit les 33 points clés 3D à partir de la ROI recadrée. Pour une image recadrée $\color{#ef4444}{\mathbf{X}_{crop}}$, le modèle génère des coordonnées et des probabilités de visibilité :
  $$
  (\color{#3b82f6}{\mathbf{x}}, \color{#3b82f6}{\mathbf{y}}, \color{#10b981}{\mathbf{z}}, \color{#fbbf24}{\mathbf{v}}) = f_{tracker}(\color{#ef4444}{\mathbf{X}_{crop}}) 
  $$
  
  Où :
  - $\color{#3b82f6}{\mathbf{x}, \mathbf{y}}$ sont les coordonnées de pixels 2D normalisées dans $[0, 1]$.
  - $\color{#10b981}{\mathbf{z}}$ représente la profondeur relative aux hanches, à la même échelle que $\mathbf{x}$.
  - $\color{#fbbf24}{\mathbf{v}} \in [0, 1]$ est le score de visibilité (probabilité que le point clé soit visible et non masqué).
  
  La perte du traqueur est une combinaison de perte de régression pour les coordonnées (ex. Smooth L1) et d'entropie croisée binaire pour la visibilité :
  $$
  \mathcal{L} = \lambda_{reg} \sum_{i=1}^{33} ||\textcolor{#3b82f6}{\mathbf{p}_i} - \textcolor{#3b82f6}{\mathbf{\hat{p}}_i}||_{smooth\_L1} + \lambda_{vis} \sum_{i=1}^{33} \text{BCE}(\textcolor{#fbbf24}{v_i}, \textcolor{#fbbf24}{\hat{v}_i}) 
  $$

