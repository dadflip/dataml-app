id: "model_mediapipe_pose"
name: "Model: MediaPipe Pose Estimation"
description: "Modèle de détection de posture (pose estimation) basé sur Google MediaPipe, capable d'identifier et de suivre les points d'articulation clés du corps humain en temps réel."
category: "Vision par Ordinateur (Pré-entraînés)"
tags: ["model", "vision", "pose-estimation", "mediapipe", "google"]
applies_to: ["Images", "Vidéo"]
when_to_use: "Recommandé pour extraire la posture squelettique d'individus à partir de flux vidéo ou d'images statiques, notamment dans les analyses biomécaniques ou d'interactions homme-machine."
use_cases:
  - "Analyse posturale dans les applications de fitness, de rééducation physique ou de sport professionnel."
  - "Détection de gestes ou d'actions spécifiques pour le contrôle d'interfaces (ex. levée de bras, position assise)."
  - "Suivi des mouvements pour l'animation de personnages virtuels et la réalité augmentée."
pros:
  - "Exécution en temps réel hautement optimisée, performante même sur CPU sans nécessiter d'accélération matérielle lourde."
  - "Détection robuste et précise offrant des coordonnées squelettiques avec des métriques de visibilité associées."
cons:
  - "Le modèle standard de MediaPipe limite la détection à une seule personne simultanément dans l'image."
  - "Sensibilité aux conditions d'éclairage extrêmes ou aux occlusions corporelles majeures."
hyperparameters:
  min_detection_confidence: "Confiance minimale (ex: 0.5)."
code_template: |
  import pandas as pd
  import numpy as np
  import json
  try:
      import cv2
      import mediapipe as mp
  except ImportError:
      mp = None
      print("[ERREUR] mediapipe ou cv2 n'est pas installé. Lancez : !pip install mediapipe opencv-python")

  # [PARAM: MIN_DETECTION_CONFIDENCE | number]
  MIN_DETECTION_CONFIDENCE = 0.5
  # [/PARAM]

  print(f"[MODEL] Extraction de posture MediaPipe (conf>={MIN_DETECTION_CONFIDENCE})...")
  if 'X_test' in locals() and mp is not None:
      images = list(X_test)
      
      mp_pose = mp.solutions.pose
      pose = mp_pose.Pose(static_image_mode=True, min_detection_confidence=float(MIN_DETECTION_CONFIDENCE))
      
      all_preds = []
      for img in images:
          # On suppose img est un numpy array BGR ou RGB
          if isinstance(img, str):
              img_arr = cv2.imread(img)
              img_rgb = cv2.cvtColor(img_arr, cv2.COLOR_BGR2RGB) if img_arr is not None else None
          else:
              # S'assurer que c'est RGB pour mediapipe
              img_rgb = img.astype('uint8')
              
          if img_rgb is not None:
              results = pose.process(img_rgb)
              if results.pose_landmarks:
                  landmarks = [{"x": l.x, "y": l.y, "z": l.z, "visibility": l.visibility} for l in results.pose_landmarks.landmark]
                  all_preds.append(json.dumps(landmarks))
              else:
                  all_preds.append("[]")
          else:
              all_preds.append("[]")
              
      y_pred = np.array(all_preds)
      y_proba = None
      feature_importances = None
      
      from sklearn.preprocessing import FunctionTransformer
      model = FunctionTransformer(lambda X: y_pred)
      full_pipeline = model
          
      training_history = {"status": "success", "type": "mediapipe_pose"}
      task_type = "keypoint_detection"
