id: "model_resnet50_classifier"
name: "Model: ResNet-50 (Fine-Tuning)"
description: |
  Réseau de neurones convolutif résiduel profond (50 couches), célèbre pour avoir révolutionné la classification d'images. Pré-entraîné sur ImageNet, il est prêt pour un apprentissage par transfert (fine-tuning) sur vos données spécifiques.
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "resnet", "deep-learning"]
applies_to: ["Images"]
when_to_use: |
  À utiliser lorsque ResNet-18 ou d'autres modèles légers n'atteignent pas les performances souhaitées, et que la tâche requiert de capter des motifs très complexes ou de fines variations de texture dans les images.
use_cases:
  - "Imagerie médicale nécessitant une grande précision pour classer des tissus ou détecter des anomalies subtiles."
  - "Classification d'espèces biologiques très similaires (fine-grained visual categorization)."
  - "Analyse d'images satellites à haute résolution."
pros:
  - "Précision redoutable grâce à sa profondeur et son architecture bottleneck."
  - "Excellentes capacités d'apprentissage par transfert sur des domaines visuels complexes."
  - "Modèle standard de l'industrie, très bien documenté et supporté."
cons:
  - "Temps d'inférence lent sur CPU et consommation importante de mémoire VRAM sur GPU."
  - "Risque de surapprentissage (overfitting) sur de très petits jeux de données malgré les poids pré-entraînés."
  - "Nécessite des images d'entrée d'assez haute qualité (224x224 RGB minimum conseillé)."
hyperparameters:
  epochs: "Nombre d'époques de fine-tuning (ex: 3)."
math_theory: |
  L'innovation majeure des architectures ResNet réside dans l'utilisation de blocs résiduels (Skip Connections ou connexions de saut).
  Au lieu d'apprendre directement une transformation sous-jacente complexe $\textcolor{#fbbf24}{H(x)}$, un bloc résiduel apprend une fonction résiduelle $\textcolor{#10b981}{F(x)} = \textcolor{#fbbf24}{H(x)} - \textcolor{#3b82f6}{x}$.
  La sortie $\textcolor{#fbbf24}{y}$ du bloc est définie en ajoutant l'entrée $\textcolor{#3b82f6}{x}$ (qui a contourné les couches) à la transformation $\textcolor{#10b981}{F(x)}$ :
  
  $$
  \textcolor{#fbbf24}{y} = \sigma(\textcolor{#10b981}{F(\textcolor{#3b82f6}{x}, W_i)} + \textcolor{#3b82f6}{x})
  $$
  
  où $\sigma$ est la fonction d'activation ReLU. Cette approche prévient le problème de la disparition du gradient dans les réseaux très profonds (comme ResNet-18 ou ResNet-50) et facilite l'apprentissage de la transformation d'identité $\textcolor{#10b981}{F(x)} \approx 0$ si les couches ne sont pas nécessaires.
