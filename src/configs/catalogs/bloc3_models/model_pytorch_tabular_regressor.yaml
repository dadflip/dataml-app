id: "model_pytorch_tabular_regressor"
name: "Model: PyTorch Deep Neural Network (Regression)"
description: |
  Réseau de neurones artificiels (DNN) profond sur mesure développé en PyTorch, conçu spécifiquement pour adresser les défis de la régression continue avec des données tabulaires.
category: "Réseaux de Neurones"
tags: ["model", "regression", "tabular", "pytorch", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  Recommandé pour des tâches de régression extrêmement complexes nécessitant l'exploitation du calcul sur GPU et impliquant des relations fortement non-linéaires que les algorithmes traditionnels peinent à modéliser.
use_cases:
  - "Prévision de la demande énergétique avec une grande quantité de facteurs exogènes interactifs."
  - "Estimation précise de prix immobiliers à partir de bases de données hétérogènes massives."
  - "Régression sur des données financières à haute dimensionnalité."
pros:
  - "Excellente expressivité et capacité d'adaptation pour modéliser des signaux complexes."
  - "Profite nativement de l'accélération matérielle (GPU/MPS) pour un entraînement rapide sur de vastes jeux de données."
  - "Entièrement personnalisable de l'architecture réseau jusqu'à l'optimiseur."
cons:
  - "Sensibilité exacerbée au scaling (mise à l'échelle des variables explicatives et cibles obligatoire)."
  - "Risque important de surapprentissage en l'absence de régularisation stricte (Dropout, Weight Decay)."
  - "Longue durée de recherche pour trouver la topologie optimale du réseau."
hyperparameters:
  hidden_layers: "Tailles de couches cachées (ex: '256, 128, 64')."
  epochs: "Nombre d'époques (ex: 20)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
math_theory: |
  Le réseau de neurones régresseur calcule ses activations à chaque couche cachée $l$ selon :

  $$
  \textcolor{#3b82f6}{h^{\textcolor{#3b82f6}{(l)}}} = \text{ReLU}(\textcolor{#8b5cf6}{W^{\textcolor{#8b5cf6}{(l)}}} \textcolor{#fbbf24}{h^{\textcolor{#fbbf24}{(l-1)}}} + \textcolor{#8b5cf6}{b^{\textcolor{#8b5cf6}{(l)}}}) 
  $$

  avec $\textcolor{#fbbf24}{h^{\textcolor{#fbbf24}{(0)}}} = \textcolor{#ef4444}{x}$. 
  La dernière couche produit une seule valeur continue :

  $$
  \textcolor{#10b981}{\hat{y}} = \textcolor{#8b5cf6}{W^{\textcolor{#8b5cf6}{(L)}}} \textcolor{#3b82f6}{h^{\textcolor{#3b82f6}{(L-1)}}} + \textcolor{#8b5cf6}{b^{\textcolor{#8b5cf6}{(L)}}} 
  $$

  L'entraînement est réalisé en minimisant l'Erreur Quadratique Moyenne (MSE) entre les prédictions et les valeurs réelles.
