id: "model_pytorch_tabular_regressor"
name: "Model: PyTorch Deep Neural Network (Regression)"
description: "Réseau de neurones artificiels (DNN) profond customisé écrit en PyTorch pour la régression continue."
category: "Réseaux de Neurones"
tags: ["model", "regression", "tabular", "pytorch", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Pour des tâches de régression extrêmement complexes nécessitant l'utilisation du GPU et une forte non-linéarité."
pros:
  - "Très flexible, contrôle absolu."
  - "Profite de l'accélération matérielle."
cons:
  - "Sensible au scaling (StandardScaler quasi obligatoire pour X et y)."
hyperparameters:
  hidden_layers: "Tailles de couches cachées (ex: '256, 128, 64')."
  epochs: "Nombre d'époques (ex: 20)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch")

  # [PARAM: HIDDEN_LAYERS | string]
  HIDDEN_LAYERS = "256, 128, 64"
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.001
  # [/PARAM]

  print(f"[MODEL] PyTorch DNN Regressor (layers={HIDDEN_LAYERS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      y_tr_np = np.array(y_train).reshape(-1, 1) # Obligatoire pour la loss MSE en PyTorch
      
      dataset = TensorDataset(torch.tensor(X_tr_np, dtype=torch.float32), torch.tensor(y_tr_np, dtype=torch.float32))
      loader = DataLoader(dataset, batch_size=64, shuffle=True)
      
      layers = []
      in_features = X_tr_np.shape[1]
      h_sizes = [int(x.strip()) for x in HIDDEN_LAYERS.split(',') if x.strip()]
      
      for h in h_sizes:
          layers.append(nn.Linear(in_features, h))
          layers.append(nn.ReLU())
          layers.append(nn.BatchNorm1d(h))
          layers.append(nn.Dropout(0.2))
          in_features = h
          
      layers.append(nn.Linear(in_features, 1)) # Output régression: 1 neurone linéaire
      model = nn.Sequential(*layers)
      
      device = torch.device("cuda" if torch.cuda.is_available() else "mps" if torch.backends.mps.is_available() else "cpu")
      model = model.to(device)
      
      criterion = nn.MSELoss() # Loss fonction pour la régression
      optimizer = optim.Adam(model.parameters(), lr=float(LEARNING_RATE))
      
      model.train()
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              batch_X, batch_y = batch_X.to(device), batch_y.to(device)
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np, dtype=torch.float32).to(device)
          preds = model(X_te_t).cpu().numpy().flatten()
          
      y_pred = preds
      y_proba = None
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "device": str(device), "final_loss": float(loss)}
      task_type = "regression"
      print("[MODEL] PyTorch DNN Regressor entraîné avec succès.")
  else:
      print("[ERREUR] Données ou module torch introuvables.")
