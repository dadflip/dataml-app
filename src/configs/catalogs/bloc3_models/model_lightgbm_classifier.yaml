math_theory: |
  LightGBM is a highly optimized gradient boosting framework that uses histogram-based algorithms and leaf-wise (best-first) tree growth. Instead of growing trees level by level, it splits the leaf with the maximum loss reduction.
  
  The learning process follows the standard boosting formulation:
  $$ \textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x}) = \sum_{m=1}^{\textcolor{#8b5cf6}{M}} \textcolor{#10b981}{\eta} \cdot \textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x}) $$
  
  Where:
  - $\textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x})$ is the aggregated log-odds output.
  - $\textcolor{#8b5cf6}{M}$ is the number of trees (`n_estimators`).
  - $\textcolor{#10b981}{\eta}$ is the learning rate (`learning_rate`).
  - $\textcolor{#fbbf24}{h_m}$ is the leaf-wise grown tree at iteration $m$.
  
  LightGBM applies GOSS (Gradient-based One-Side Sampling) and EFB (Exclusive Feature Bundling) internally to speed up training while preserving accuracy. The final probability is given by $P(y=1|\textcolor{#ef4444}{x}) = \sigma(\textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x}))$.

