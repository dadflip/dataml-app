id: "model_lightgbm_classifier"
name: "Model: LightGBM Classifier"
description: |
  LightGBM (Light Gradient Boosting Machine) est un algorithme de gradient boosting développé par Microsoft. Il se distingue par sa croissance des arbres par les feuilles (leaf-wise) plutôt que par niveau, et son utilisation d'histogrammes pour une efficacité maximale.
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "lightgbm", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Privilégiez ce modèle pour les ensembles de données volumineux (plus de 10 000 lignes) où XGBoost ou d'autres algorithmes se révèlent trop lents, et où les performances prédictives priment.
use_cases:
  - "Détection de fraude sur de grands volumes de transactions."
  - "Scoring de crédit et évaluation du risque client."
  - "Prédiction de l'attrition (churn) sur des bases de données massives."
pros:
  - "Extrêmement rapide et faible consommation de mémoire grâce à la méthode par histogrammes."
  - "Gère nativement et efficacement les variables catégorielles sans encodage one-hot préalable."
  - "Précision souvent à l'état de l'art sur les données tabulaires volumineuses."
cons:
  - "Sensible au surapprentissage (overfitting) sur les petits ensembles de données (< 10 000 lignes) en raison de la croissance par feuilles."
  - "Nécessite un réglage minutieux des hyperparamètres (comme num_leaves)."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  num_leaves: "Nombre max de feuilles par arbre (ex: 31)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from lightgbm import LGBMClassifier
  except ImportError:
      LGBMClassifier = None
      print("[ERREUR] lightgbm n'est pas installé. Lancez : !pip install lightgbm")

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: NUM_LEAVES | number]
  NUM_LEAVES = 31
  # [/PARAM]

  print(f"[MODEL] Entraînement LightGBM (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and LGBMClassifier is not None:
      # Conversion des noms de colonnes potentiellement problématiques pour LGBM (Json/Special chars)
      import re
      X_train_lgb = X_train.rename(columns=lambda x: re.sub('[^A-Za-z0-9_]+', '', x)) if isinstance(X_train, pd.DataFrame) else X_train
      X_test_lgb = X_test.rename(columns=lambda x: re.sub('[^A-Za-z0-9_]+', '', x)) if isinstance(X_test, pd.DataFrame) else X_test
      
      model = LGBMClassifier(
          n_estimators=int(N_ESTIMATORS), 
          learning_rate=float(LEARNING_RATE), 
          num_leaves=int(NUM_LEAVES),
          random_state=42
      )
      model.fit(X_train_lgb, y_train)
      
      y_pred = model.predict(X_test_lgb)
      y_proba = model.predict_proba(X_test_lgb) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      meta = {}
