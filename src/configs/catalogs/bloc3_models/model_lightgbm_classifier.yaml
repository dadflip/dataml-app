id: "model_lightgbm_classifier"
name: "Model: LightGBM Classifier"
description: "Light Gradient Boosting Machine. Framework Microsoft, construit les arbres feuille par feuille (leaf-wise)."
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "lightgbm", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "Sur de gros datasets où XGBoost est trop lent."
pros:
  - "Extrêmement rapide, faible usage mémoire."
  - "Gère nativement les variables catégorielles."
cons:
  - "Sujet à l'overfitting sur les très petits datasets (< 10000 lignes)."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  num_leaves: "Nombre max de feuilles par arbre (ex: 31)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from lightgbm import LGBMClassifier
  except ImportError:
      LGBMClassifier = None
      print("[ERREUR] lightgbm n'est pas installé. Lancez : !pip install lightgbm")

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: NUM_LEAVES | number]
  NUM_LEAVES = 31
  # [/PARAM]

  print(f"[MODEL] Entraînement LightGBM (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and LGBMClassifier is not None:
      # Conversion des noms de colonnes potentiellement problématiques pour LGBM (Json/Special chars)
      import re
      X_train_lgb = X_train.rename(columns=lambda x: re.sub('[^A-Za-z0-9_]+', '', x)) if isinstance(X_train, pd.DataFrame) else X_train
      X_test_lgb = X_test.rename(columns=lambda x: re.sub('[^A-Za-z0-9_]+', '', x)) if isinstance(X_test, pd.DataFrame) else X_test
      
      model = LGBMClassifier(
          n_estimators=int(N_ESTIMATORS), 
          learning_rate=float(LEARNING_RATE), 
          num_leaves=int(NUM_LEAVES),
          random_state=42
      )
      model.fit(X_train_lgb, y_train)
      
      y_pred = model.predict(X_test_lgb)
      y_proba = model.predict_proba(X_test_lgb) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      meta = {}
illustration_mermaid: |
  graph TD
    subgraph Data
      X[Input Features] --> Bin[Histogram Binning]
    end
    subgraph Leaf-wise Tree Growth
      Bin --> Tree1[Tree 1: Split Node with Max Loss Reduction]
      Tree1 --> Res1[Compute Residuals]
      Res1 --> Tree2[Tree 2: Leaf-wise growth]
      Tree2 --> ResN[...]
      ResN --> TreeN[Tree N: Deep and Asymmetric]
    end
    subgraph Ensemble
      Tree1 -.-> Sum[Sum Trees Outputs]
      Tree2 -.-> Sum
      TreeN -.-> Sum
      Sum --> Sigmoid[Sigmoid/Softmax]
      Sigmoid --> Pred[Predicted Class]
    end
    style Bin fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff
    style Tree1 fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style Tree2 fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style TreeN fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style Pred fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff

