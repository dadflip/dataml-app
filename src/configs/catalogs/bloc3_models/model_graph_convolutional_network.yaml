id: "model_graph_convolutional_network"
name: "Model: Graph Convolutional Network (GCN)"
description: "Réseau de neurones sur graphes utilisant des convolutions via la matrice d'adjacence pour agréger et extraire des caractéristiques topologiques des nœuds."
category: "Graphes & Réseaux"
tags: ["model", "graph", "pytorch-geometric", "gcn", "deep-learning"]
applies_to: ["Graphes"]
when_to_use: "Idéal pour les tâches de classification ou de régression sur des structures de graphes (ex: réseaux sociaux, molécules, maillages 3D) où les relations entre entités sont aussi importantes que leurs attributs individuels."
use_cases:
  - "Classification de nœuds (détection de fraudeurs dans un réseau transactionnel)."
  - "Prédiction de liens (systèmes de recommandation)."
  - "Analyse de structures moléculaires (cheminformatique)."
  - "Segmentation de maillages 3D."
pros:
  - "Exploite nativement la topologie relationnelle des données."
  - "Généralise bien à des graphes de tailles variables."
  - "Souvent très performant par rapport aux modèles tabulaires classiques sur des données liées."
cons:
  - "Nécessite PyTorch Geometric et des données sous forme de graphe explicite (matrice d'adjacence)."
  - "Coûteux en mémoire pour les très grands graphes."
  - "Sensible à la qualité du graphe sous-jacent (ex: graphes trop denses ou trop sparses)."
hyperparameters:
  hidden_channels: "Taille de la couche cachée (ex: 16)."
  epochs: "Nombre d'époques (ex: 100)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn.functional as F
      from torch_geometric.nn import GCNConv
  except ImportError:
      GCNConv = None
      print("[ERREUR] torch_geometric n'est pas installé.")

  # [PARAM: HIDDEN_CHANNELS | number]
  HIDDEN_CHANNELS = 16
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 100
  # [/PARAM]

  print(f"[MODEL] Entraînement GCN PyTorch Geometric...")
  if 'X_train' in locals() and 'y_train' in locals() and 'global_edge_index' in dir() and GCNConv is not None:
      X_t = torch.tensor(np.array(X_train, dtype=np.float32))
      y_t = torch.tensor(np.array(y_train, dtype=np.int64))
      edge_index = torch.tensor(global_edge_index, dtype=torch.long)
      num_classes = len(np.unique(y_train))

      class GCN(torch.nn.Module):
          def __init__(self, in_ch, hid, out):
              super().__init__()
              self.conv1 = GCNConv(in_ch, hid)
              self.conv2 = GCNConv(hid, out)
          def forward(self, x, ei):
              x = F.dropout(F.relu(self.conv1(x, ei)), p=0.5, training=self.training)
              return self.conv2(x, ei)

      model = GCN(X_t.shape[1], int(HIDDEN_CHANNELS), num_classes)
      optimizer = torch.optim.Adam(model.parameters(), lr=0.01, weight_decay=5e-4)
      criterion = torch.nn.CrossEntropyLoss()
      model.train()
      for epoch in range(int(EPOCHS)):
          optimizer.zero_grad()
          loss = criterion(model(X_t, edge_index), y_t)
          loss.backward()
          optimizer.step()
      model.eval()
      with torch.no_grad():
          out = model(X_t, edge_index)
          y_pred = out.argmax(dim=1).cpu().numpy()
          y_proba = F.softmax(out, dim=1).cpu().numpy()
      feature_importances = None
      full_pipeline = model
      training_history = {"status": "success"}
      task_type = "node_classification"
      meta = {}
