math_theory: |
  Un Graph Convolutional Network (GCN) généralise l'opération de convolution aux données structurées en graphe en agrégeant les caractéristiques du voisinage local d'un nœud.
  
  Soit $\textcolor{#f59e0b}{A}$ la matrice d'adjacence du graphe et $D$ la matrice diagonale des degrés. Pour inclure les propres caractéristiques d'un nœud, on ajoute la matrice identité pour obtenir $\textcolor{#f59e0b}{\tilde{A}} = \textcolor{#f59e0b}{A} + I$. La matrice d'adjacence symétrique normalisée est calculée ainsi : $\textcolor{#f59e0b}{\hat{A}} = \tilde{D}^{-\frac{1}{2}}\textcolor{#f59e0b}{\tilde{A}}\tilde{D}^{-\frac{1}{2}}$.
  
  Une seule couche GCN effectue l'opération suivante :
  
  $$
  \textcolor{#8b5cf6}{H^{(l+1)}} = \sigma\left(\textcolor{#f59e0b}{\hat{A}} \textcolor{#10b981}{H^{(l)}} \textcolor{#3b82f6}{W^{(l)}}\right)
  $$
  
  où :
  * $\textcolor{#10b981}{H^{(l)}}$ est la matrice des caractéristiques des nœuds à la couche $l$.
  * $\textcolor{#3b82f6}{W^{(l)}}$ est la matrice de poids apprenable pour la couche $l$.
  * $\sigma$ est une fonction d'activation non linéaire (comme ReLU).
  * $\textcolor{#8b5cf6}{H^{(l+1)}}$ est la matrice de caractéristiques résultante pour la couche suivante.
  
  Cette opération propage efficacement l'information de sorte que la nouvelle représentation de chaque nœud est une moyenne pondérée des caractéristiques de ses voisins, transformée par les poids de la couche.

