id: "model_prophet"
name: "Model: Meta Prophet (Time Series Forecaster)"
description: |
  Prophet est une procédure de prévision de séries temporelles open-source développée par Meta (Facebook Core Data Science). Basée sur un modèle additif où des tendances non linéaires s'ajustent à des composantes de saisonnalité (annuelle, hebdomadaire, quotidienne), elle excelle sur des données présentant de forts effets saisonniers et l'impact de jours fériés.
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "prophet"]
applies_to: ["Séries Temporelles"]
when_to_use: |
  Privilégier Prophet pour la prévision à l'échelle de l'entreprise sur des données ayant des caractéristiques "humaines" typiques : saisonnalité forte et prévisible, historique d'au moins un an, jours fériés connus, et présence potentielle de points de rupture de tendance ou de données manquantes.
use_cases:
  - "Prévision de la fréquentation d'un site web ou des ventes e-commerce (effets week-end et soldes)."
  - "Anticipation des volumes d'appels dans un centre de support client."
  - "Suivi et prévision d'indicateurs économiques ou de performance métier sur le long terme."
pros:
  - "Extrêmement robuste face aux données manquantes, aux changements de tendance abrupts et aux valeurs aberrantes (outliers)."
  - "Permet l'intégration facile de jours fériés ou d'événements personnalisés (ex: Super Bowl, Black Friday)."
  - "Produit des prévisions accompagnées d'intervalles d'incertitude et permet d'inspecter les composantes de saisonnalité."
cons:
  - "Nécessite impérativement le formatage des données d'entraînement avec des colonnes nommées spécifiquement 'ds' (dates) et 'y' (valeurs)."
  - "L'installation de la bibliothèque Python peut parfois s'avérer complexe en raison de ses dépendances (pystan ou cmdstanpy)."
  - "Conçu principalement pour des séries univariées (bien qu'il accepte des régresseurs exogènes), il ne capture pas l'auto-corrélation avec la même finesse qu'un modèle ARIMA."
hyperparameters:
  seasonality_mode: "Mode de saisonnalité ('additive' ou 'multiplicative')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from prophet import Prophet
  except ImportError:
      Prophet = None
      print("[ERREUR] prophet n'est pas installé. Lancez : !pip install prophet")

  # [PARAM: SEASONALITY_MODE | string]
  SEASONALITY_MODE = "additive"
