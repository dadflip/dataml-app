id: "model_prophet"
name: "Model: Meta Prophet (Time Series Forecaster)"
description: "Modèle de prévision de séries temporelles développé par Meta (Facebook), robuste aux données manquantes et variations saisonnières."
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "prophet"]
applies_to: ["Séries Temporelles"]
when_to_use: "Pour des prédictions (forecasting) temporelles avec de fortes composantes saisonnières."
pros:
  - "Très robuste, s'ajuste tout seul."
  - "Gère les jours fériés."
cons:
  - "Nécessite la bibliothèque fbprophet / prophet."
  - "Attends impérativement un DataFrame avec des colonnes 'ds' (dates) et 'y' (valeurs)."
hyperparameters:
  seasonality_mode: "Mode de saisonnalité ('additive' ou 'multiplicative')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from prophet import Prophet
  except ImportError:
      Prophet = None
      print("[ERREUR] prophet n'est pas installé. Lancez : !pip install prophet")

  # [PARAM: SEASONALITY_MODE | string]
  SEASONALITY_MODE = "additive"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

