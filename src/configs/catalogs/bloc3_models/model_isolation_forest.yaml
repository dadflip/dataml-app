id: "model_isolation_forest"
name: "Model: Isolation Forest"
description: "Algorithme de détection d'anomalies (Outliers) non-supervisé, basé sur un ensemble d'arbres aléatoires. Il identifie les anomalies en isolant les observations qui nécessitent peu de scissions pour être séparées du reste des données."
category: "Détection d'Anomalies (Non-Supervisé)"
tags: ["model", "anomaly-detection", "tabular", "sklearn", "isolation-forest", "ensemble", "outliers"]
applies_to: ["Tabulaire"]
when_to_use: "À privilégier pour détecter des comportements frauduleux, identifier des pannes matérielles, ou nettoyer un jeu de données fortement bruité avant l'entraînement d'autres modèles."
use_cases:
  - "Détection de fraudes bancaires : Repérage de transactions atypiques au sein d'un grand volume de paiements."
  - "Maintenance prédictive : Identification de signaux anormaux émis par des capteurs industriels."
  - "Nettoyage de données (Data Cleansing) : Élimination automatique des valeurs aberrantes massives d'un dataset."
pros:
  - "Algorithme extrêmement rapide et très performant, y compris sur des espaces de grande dimension."
  - "Très robuste, avec peu d'hypothèses sur la distribution sous-jacente des données."
  - "Génère un score d'anomalie continu permettant d'ajuster finement le seuil d'alerte."
cons:
  - "Nécessite la définition d'un taux de contamination en amont (la proportion estimée d'anomalies dans les données)."
  - "Interprétabilité locale difficile (comprendre exactement pourquoi un point est anormal au travers des multiples arbres)."
hyperparameters:
  contamination: "Proportion d'anomalies attendue (ex: 0.05 pour 5%)."
math_theory: |
  L'Isolation Forest calcule un score d'anomalie $\textcolor{#3b82f6}{s(x, n)}$ basé sur la profondeur nécessaire pour isoler une observation $\textcolor{#10b981}{x}$ dans un ensemble d'arbres aléatoires. L'anomalie est déduite par l'espérance de la longueur du chemin $\textcolor{#ef4444}{E(h(x))}$ par rapport à la moyenne théorique $\textcolor{#fbbf24}{c(n)}$ :
  
  $$
  \textcolor{#3b82f6}{s(x, n)} = 2^{-\frac{\textcolor{#ef4444}{E(h(x))}}{\textcolor{#fbbf24}{c(n)}}} 
  $$
  
  Si le score s'approche de 1, la longueur du chemin est très courte, ce qui indique que l'observation est très facilement "isolable" et constitue donc une anomalie. Si le score s'approche de 0.5, l'observation est normale.
