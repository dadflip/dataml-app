math_theory: |
  La régression Lasso applique une pénalité L1 à la fonction de perte classique des moindres carrés ordinaires (OLS). Cela force certains coefficients de régression à devenir exactement zéro, réalisant ainsi une sélection de variables intrinsèque. L'objectif est de minimiser :
  
  $$
  \min_{w} \left( \frac{1}{2n} ||\textcolor{#10b981}{X}\textcolor{#ef4444}{w} - \textcolor{#3b82f6}{y}||_2^2 + \textcolor{#fbbf24}{\alpha} ||\textcolor{#ef4444}{w}||_1 \right) 
  $$
  
  Où $\textcolor{#10b981}{X}$ est la matrice des caractéristiques, $\textcolor{#3b82f6}{y}$ est le vecteur cible, $\textcolor{#ef4444}{w}$ sont les poids appris, et $\textcolor{#fbbf24}{\alpha}$ définit l'intensité de la pénalité.

