id: "model_lasso_regression"
name: "Model: Lasso Regression"
description: "Modèle de régression linéaire incluant une pénalisation de norme L1 (valeur absolue des coefficients). Cette régularisation agit de facto comme un mécanisme de sélection de variables (Feature Selection)."
category: "Modèles Linéaires"
tags: ["model", "regression", "tabular", "sklearn", "linear", "lasso", "l1-penalty"]
applies_to: ["Tabulaire"]
when_to_use: "À privilégier lorsque vous disposez d'un très grand nombre de variables explicatives, mais que vous suspectez que seule une poignée d'entre elles ont un réel pouvoir prédictif (modèles dits parcimonieux / sparse)."
use_cases:
  - "Génomique : Identification des quelques gènes réellement responsables d'un phénotype continu parmi des milliers."
  - "Économétrie : Modélisation macroéconomique où l'on souhaite exclure automatiquement les indicateurs redondants."
  - "Compression de modèle : Création d'une équation linéaire très simple et hautement interprétable pour un système embarqué."
pros:
  - "Force littéralement les coefficients des variables inutiles à valoir exactement zéro."
  - "Produit des modèles extrêmement faciles à interpréter."
cons:
  - "En présence d'un groupe de variables fortement corrélées (multicolinéarité), Lasso en sélectionne souvent une au hasard et annule toutes les autres."
  - "Peut sous-performer par rapport à Ridge si la majorité des variables apportent un peu de signal (modèles denses)."
hyperparameters:
  alpha: "Force de régularisation (ex: 1.0)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import Lasso

  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]

  print(f"[MODEL] Entraînement Lasso Regression (alpha={ALPHA})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = Lasso(alpha=float(ALPHA), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals():
          if len(model.coef_) == len(feature_names_out):
              feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train), "non_zero_coefs": int(np.sum(model.coef_ != 0))}
      task_type = "regression"
      meta = {}
