id: "model_tensorflow_dnn_classifier"
name: "Model: TensorFlow/Keras DNN (Classification)"
description: |
  Réseau de neurones profond (Deep Neural Network) standard ("Multi-Layer Perceptron") implémenté avec l'API Keras de TensorFlow. Il enchaîne des couches denses, de normalisation par lot (Batch Normalization) et de régularisation (Dropout).
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "tensorflow", "keras", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  Jeux de données tabulaires volumineux, lorsque des relations fortement non linéaires et complexes doivent être apprises, et que vous privilégiez l'écosystème TensorFlow pour le passage en production (TF Serving, TFLite).
use_cases:
  - "Classification binaire ou multiclasse sur de très grands ensembles de données structurées."
  - "Développement de modèles tabulaires destinés à être embarqués sur mobile (TFLite)."
  - "Modélisation hybride combinant des données tabulaires avec d'autres modalités (texte, image) via l'API Fonctionnelle Keras."
pros:
  - "Construction et prototypage extrêmement rapides grâce à l'API de haut niveau Keras."
  - "Déploiement en production industriel éprouvé via TensorFlow Extended (TFX) et TF Serving."
  - "Hautement paramétrable (nombre de couches, fonctions d'activation, régularisations)."
cons:
  - "Nécessite souvent beaucoup plus de données que XGBoost ou LightGBM pour être compétitif."
  - "Exige un prétraitement des données rigoureux (standardisation absolue, imputation des valeurs manquantes)."
  - "Lourdeur de l'écosystème et conflits fréquents de versions (CUDA/cuDNN)."
hyperparameters:
  hidden_layers: "Tailles de couches séparées par des virgules (ex: '128, 64')."
  epochs: "Nombre d'époques d'entraînement (ex: 20)."
math_theory: |
  Un réseau DNN propage les entrées $\textcolor{#fbbf24}{x}$ via une succession de transformations. Pour la couche $l$ :
  $$ \textcolor{#3b82f6}{z^{(l)}} = \textcolor{#8b5cf6}{W^{(l)}} \textcolor{#10b981}{a^{(l-1)}} + \textcolor{#8b5cf6}{b^{(l)}} $$
  $$ \textcolor{#10b981}{a^{(l)}} = \text{ReLU}(\textcolor{#3b82f6}{z^{(l)}}) $$
  Pour la classification, la dernière couche utilise l'activation Softmax pour prédire les probabilités $\textcolor{#10b981}{\hat{y}_k}$ :
  $$ \textcolor{#10b981}{\hat{y}_k} = \frac{e^{\textcolor{#3b82f6}{z_k}}}{\sum_{j} e^{\textcolor{#3b82f6}{z_j}}} $$
  Les poids $\textcolor{#8b5cf6}{W}$ sont optimisés en minimisant l'entropie croisée $\textcolor{#ef4444}{\mathcal{L}}$.
