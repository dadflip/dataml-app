code_template: |
  import pandas as pd
  import numpy as np
  try:
      import tensorflow as tf
      from tensorflow import keras
      from tensorflow.keras import layers
  except ImportError:
      tf = None
      print("[ERREUR] tensorflow n'est pas installé. Lancez : !pip install tensorflow")

  # [PARAM: HIDDEN_LAYERS | string]
  HIDDEN_LAYERS = "128, 64"
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  print(f"[MODEL] Entraînement TensorFlow/Keras DNN (Classification)...")
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "TensorFlow DNN Classifier"}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and tf is not None:
      X_tr = np.array(X_train, dtype=np.float32)
      X_te = np.array(X_test, dtype=np.float32)
      
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      layer_sizes = [int(s.strip()) for s in HIDDEN_LAYERS.split(',') if s.strip().isdigit()]
      if not layer_sizes:
          layer_sizes = [128, 64]
      
      inputs = keras.Input(shape=(X_tr.shape[1],))
      x = inputs
      for size in layer_sizes:
          x = layers.Dense(size, activation='relu')(x)
          x = layers.BatchNormalization()(x)
          x = layers.Dropout(0.2)(x)
          
      if num_classes > 2:
          outputs = layers.Dense(num_classes, activation='softmax')(x)
          loss_fn = 'sparse_categorical_crossentropy'
      else:
          outputs = layers.Dense(1, activation='sigmoid')(x)
          loss_fn = 'binary_crossentropy'
          y_tr_enc = y_tr_enc.astype(np.float32)
          
      model = keras.Model(inputs=inputs, outputs=outputs)
      model.compile(optimizer='adam', loss=loss_fn, metrics=['accuracy'])
      
      history = model.fit(X_tr, y_tr_enc, epochs=int(EPOCHS), batch_size=32, validation_split=0.1, verbose=0)
      
      if num_classes > 2:
          y_proba = model.predict(X_te, verbose=0)
          preds_idx = np.argmax(y_proba, axis=1)
          y_pred = np.array([id2label[i] for i in preds_idx])
      else:
          y_proba_1 = model.predict(X_te, verbose=0).flatten()
          y_proba = np.vstack([1 - y_proba_1, y_proba_1]).T
          preds_idx = (y_proba_1 > 0.5).astype(int)
          y_pred = np.array([id2label[i] for i in preds_idx])
          
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {
          "status": "success",
          "loss": float(history.history['loss'][-1]),
          "val_loss": float(history.history.get('val_loss', [0.0])[-1])
      }
