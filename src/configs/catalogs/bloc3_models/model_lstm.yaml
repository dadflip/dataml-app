id: "model_lstm"
name: "Model: LSTM (Long Short-Term Memory)"
description: |
  Réseau de neurones récurrents de type Long Short-Term Memory (LSTM) implémenté en PyTorch. Il surmonte le problème de la disparition du gradient grâce à un système de "portes" (gates) permettant de mémoriser et d'oublier sélectivement l'information sur de longues séquences.
category: "Réseaux Séquentiels (RNN)"
tags: ["model", "classification", "timeseries", "pytorch", "lstm", "deep-learning"]
applies_to: ["Séquences", "Séries Temporelles"]
when_to_use: |
  Privilégiez ce modèle pour le traitement de données séquentiellement ordonnées, telles que les séries temporelles, l'analyse de signaux continus, ou l'analyse de texte, où le contexte temporel passé est fondamental pour prédire le futur.
use_cases:
  - "Prédiction de pannes de capteurs basées sur l'historique de signaux continus de télémétrie."
  - "Analyse de sentiment sur de longs documents textuels (séquences de mots)."
  - "Classification de séries temporelles financières (ex: prédiction de la tendance d'un actif)."
pros:
  - "Excellente gestion des dépendances à long terme dans les séquences complexes."
  - "Très robuste face au problème de disparition du gradient (vanishing gradient) commun aux RNN standards."
  - "Possibilité d'empiler plusieurs couches (num_layers) pour extraire des représentations hiérarchiques profondes."
cons:
  - "Processus d'entraînement lent et gourmand en ressources matérielles (GPU souvent indispensable)."
  - "Moins performant et moins scalable que les architectures Transformers sur les tâches NLP modernes."
  - "Difficile à interpréter et comporte de nombreux hyperparamètres à régler."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 64)."
  num_layers: "Nombre de couches empilées (ex: 2)."
  epochs: "Nombre d'époques (ex: 10)."
math_theory: |
  Le LSTM utilise des portes pour contrôler le flux d'informations. La porte d'oubli $\textcolor{#ef4444}{f_t}$ et la porte d'entrée $\textcolor{#3b82f6}{i_t}$ régulent la mise à jour de l'état de la cellule $\textcolor{#fbbf24}{C_t}$ :
  
  $$
  \textcolor{#fbbf24}{C_t} = \textcolor{#ef4444}{f_t} \odot \textcolor{#fbbf24}{C_{t-1}} + \textcolor{#3b82f6}{i_t} \odot \tilde{C}_t
  $$
  
  L'état caché $\textcolor{#10b981}{h_t}$ est calculé à l'aide de la porte de sortie $\textcolor{#8b5cf6}{o_t}$ :
  
  $$
  \textcolor{#10b981}{h_t} = \textcolor{#8b5cf6}{o_t} \odot \tanh(\textcolor{#fbbf24}{C_t})
  $$
  
  Ces portes sont des fonctions sigmoïdes des entrées $x_t$ et $h_{t-1}$, permettant au modèle d'apprendre des dépendances à long terme.
