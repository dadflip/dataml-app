id: "model_lstm"
name: "Model: LSTM (Long Short-Term Memory)"
description: "Le standard de l'industrie pour les réseaux récurrents. Mémorise les longues dépendances dans les séquences."
category: "Réseaux Séquentiels (RNN)"
tags: ["model", "classification", "timeseries", "pytorch", "lstm", "deep-learning"]
applies_to: ["Séquences", "Séries Temporelles"]
when_to_use: "Dès que vous manipulez des séries temporelles longues ou des séquences de texte où le contexte lointain est important."
pros:
  - "Très robuste face au Vanishing Gradient."
cons:
  - "Lent à entraîner."
hyperparameters:
  hidden_size: "Taille de l'état caché (ex: 64)."
  num_layers: "Nombre de couches empilées (ex: 2)."
  epochs: "Nombre d'époques (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.base import BaseEstimator, ClassifierMixin
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
      TORCH_AVAILABLE = True
  except ImportError:
      TORCH_AVAILABLE = False
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: HIDDEN_SIZE | number]
  HIDDEN_SIZE = 64
  # [/PARAM]
  
  # [PARAM: NUM_LAYERS | number]
  NUM_LAYERS = 2
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 10
  # [/PARAM]

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {}

  if TORCH_AVAILABLE:
      class LSTMClassifierTorch(nn.Module):
          def __init__(self, input_dim, hidden_dim, num_layers, num_classes):
              super().__init__()
              self.lstm = nn.LSTM(input_dim, hidden_dim, num_layers, batch_first=True, dropout=0.2 if num_layers>1 else 0)
              self.fc = nn.Linear(hidden_dim, num_classes)
              
          def forward(self, x):
              out, (h_n, c_n) = self.lstm(x)
              out = out[:, -1, :] # Dernier pas de temps
              return self.fc(out)
              
      class SklearnLSTMClassifier(BaseEstimator, ClassifierMixin):
          def __init__(self, hidden_size=64, num_layers=2, epochs=10):
              self.hidden_size = hidden_size
              self.num_layers = num_layers
              self.epochs = epochs
              self.model = None
              self.device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
              self.final_loss = None
              
          def fit(self, X, y):
              X_np = np.array(X)
              if len(X_np.shape) == 2:
                  X_np = X_np.reshape((X_np.shape[0], 1, X_np.shape[1]))
              
              self.classes_ = np.unique(y)
              num_classes = len(self.classes_)
              self.label2id = {c: i for i, c in enumerate(self.classes_)}
              
              y_enc = np.array([self.label2id[val] for val in y])
              
              dataset = TensorDataset(torch.tensor(X_np, dtype=torch.float32), torch.tensor(y_enc, dtype=torch.long))
              loader = DataLoader(dataset, batch_size=32, shuffle=True)
              
              self.model = LSTMClassifierTorch(X_np.shape[2], self.hidden_size, self.num_layers, num_classes).to(self.device)
              criterion = nn.CrossEntropyLoss()
              optimizer = optim.Adam(self.model.parameters(), lr=0.001)
              
              self.model.train()
              for epoch in range(self.epochs):
                  for batch_X, batch_y in loader:
                      batch_X, batch_y = batch_X.to(self.device), batch_y.to(self.device)
                      optimizer.zero_grad()
                      outputs = self.model(batch_X)
                      loss = criterion(outputs, batch_y)
                      loss.backward()
                      optimizer.step()
                      self.final_loss = loss.item()
              return self
              
          def predict_proba(self, X):
              self.model.eval()
              X_np = np.array(X)
              if len(X_np.shape) == 2:
                  X_np = X_np.reshape((X_np.shape[0], 1, X_np.shape[1]))
              with torch.no_grad():
                  X_t = torch.tensor(X_np, dtype=torch.float32).to(self.device)
                  logits = self.model(X_t)
                  proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
              return proba
              
          def predict(self, X):
              proba = self.predict_proba(X)
              preds_idx = np.argmax(proba, axis=1)
              return np.array([self.classes_[i] for i in preds_idx])

      model = SklearnLSTMClassifier(hidden_size=int(HIDDEN_SIZE), num_layers=int(NUM_LAYERS), epochs=int(EPOCHS))

      if 'preprocessor' in locals() and preprocessor is not None:
          if hasattr(preprocessor, 'steps'):
              full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
          else:
              full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('model', model)])

      if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
          print(f"[MODEL] Entraînement LSTM PyTorch ({EPOCHS} epochs, dim={HIDDEN_SIZE}, layers={NUM_LAYERS})...")
          full_pipeline.fit(X_train, y_train)
          y_pred = full_pipeline.predict(X_test)
          y_proba = full_pipeline.predict_proba(X_test)
          training_history = {"status": "success", "final_loss": model.final_loss, "epochs": EPOCHS}
  else:
      print("[MODEL] PyTorch non disponible, impossible d'entraîner le modèle LSTM.")
      model = None
      full_pipeline = None

illustration_mermaid: |
  graph TD
    A[Input Features: T Timesteps] --> B(Preprocessing Pipeline)
    B --> C[PyTorch LSTM Component]
    
    subgraph LSTM Cell
      C --> D[Forget Gate: f_t = σ(W_f*x_t + U_f*h_t-1 + b_f)]
      D --> E[Input Gate: i_t = σ(W_i*x_t + U_i*h_t-1 + b_i)]
      E --> F[Cell Update: c_t = f_t*c_t-1 + i_t*tanh(...)]
      F --> G[Output Gate: o_t = σ(...)]
      G --> H[Hidden State: h_t = o_t * tanh(c_t)]
    end
    
    H --> I[Final Hidden State h_T]
    I --> J[Fully Connected Linear Layer]
    J --> K[Softmax CrossEntropy]
    K --> L([y_pred: Class])
    
    style C fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
    style H fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff
    style J fill:#ec4899,stroke:#db2777,stroke-width:2px,color:#fff
    style L fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff

