id: "model_cnn_3d"
name: "Model: 3D CNN (Video/Volume)"
description: |
  Réseau Convolutif 3D conçu pour traiter des données volumétriques, captant simultanément
  les dimensions spatiales et la profondeur (ou la dimension temporelle pour des séquences d'images).
category: "Réseaux Convolutifs (CNN)"
tags: ["model", "vision", "video", "classification", "pytorch", "cnn-3d", "deep-learning"]
applies_to: ["Vidéo", "Volumes"]
when_to_use: |
  Essentiel pour l'analyse de données comportant une troisième dimension physique ou temporelle,
  telles que la vidéo, l'imagerie médicale (IRM, Scanner), ou des modélisations 3D.
use_cases:
  - "Classification d'actions ou de mouvements dans des séquences vidéo."
  - "Détection de tumeurs ou d'anomalies dans des IRM/Scanners 3D."
  - "Analyse de flux d'images satellites temporelles (évolution de terrain)."
pros:
  - "Capture avec précision la dynamique spatio-temporelle ou volumétrique."
  - "Maintient l'intégrité de la corrélation entre les couches profondes du tenseur."
cons:
  - "Extrêmement lourd en calcul et gourmand en mémoire (VRAM)."
  - "Nécessite souvent de grandes quantités de données et d'augmentations de données complexes."
hyperparameters:
  epochs: "Nombre d'époques (ex: 5)."
math_theory: |
  La convolution 3D étend le principe de la 2D à un volume spatial ou à une séquence d'images (vidéo).
  Le noyau $\textcolor{#10b981}{K}$ possède désormais trois dimensions : profondeur, hauteur, largeur ($d \times m \times n$).
  La valeur du tenseur de sortie $\textcolor{#fbbf24}{O}$ à la position $(x, y, z)$ est :
  $$\textcolor{#fbbf24}{O_{x, y, z}} = \sum_{w=0}^{d-1} \sum_{u=0}^{m-1} \sum_{v=0}^{n-1} \textcolor{#3b82f6}{V_{x+w, y+u, z+v}} \cdot \textcolor{#10b981}{K_{w, u, v}} + \textcolor{#8b5cf6}{b}$$
  Cette opération permet d'extraire non seulement les caractéristiques spatiales dans chaque plan 2D, mais aussi l'évolution temporelle ou la continuité structurelle le long de l'axe de profondeur $z$.
