math_theory: |
  BERT utilizes a multi-layer Bidirectional Transformer encoder. The core mechanism is scaled dot-product attention, allowing the model to weigh the importance of each token relative to others in the sequence:
  
  $$ \text{Attention}(\textcolor{#3b82f6}{Q}, \textcolor{#10b981}{K}, \textcolor{#fbbf24}{V}) = \text{Softmax}\left(\frac{\textcolor{#3b82f6}{Q} \cdot \textcolor{#10b981}{K}^T}{\sqrt{\textcolor{#ef4444}{d_k}}}\right) \textcolor{#fbbf24}{V} $$
  
  For sequence classification, the final hidden state of the special `[CLS]` token, $\textcolor{#8b5cf6}{h_{\text{CLS}}}$, is extracted. This vector summarizes the entire sequence's context. A classification head (linear layer + softmax) is applied on top:
  
  $$ P(y \mid X) = \text{Softmax}(\textcolor{#3b82f6}{W} \cdot \textcolor{#8b5cf6}{h_{\text{CLS}}} + \textcolor{#10b981}{b}) $$
  
  where:
  *   $\textcolor{#3b82f6}{Q}, \textcolor{#10b981}{K}, \textcolor{#fbbf24}{V}$ are Queries, Keys, and Values matrices.
  *   $\textcolor{#ef4444}{d_k}$ is the dimension of the keys.
  *   $\textcolor{#8b5cf6}{h_{\text{CLS}}}$ is the pooled contextual representation.

