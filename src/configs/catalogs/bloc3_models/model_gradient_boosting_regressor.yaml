math_theory: |
  La Régression par Gradient Boosting minimise une fonction de perte $L(y, F(x))$, généralement l'Erreur Quadratique Moyenne (MSE), d'une manière séquentielle (forward stage-wise). À chaque itération $m$, un arbre de régression $\textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x})$ est ajusté aux pseudo-résidus (gradient négatif) de la fonction de perte.
  
  Le modèle met à jour sa prédiction de la manière suivante :
  $$
  \textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x}) = F_0(\textcolor{#ef4444}{x}) + \sum_{m=1}^{\textcolor{#8b5cf6}{M}} \textcolor{#10b981}{\nu} \cdot \textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x}) 
  $$
  
  Où :
  - $\textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x})$ est la prédiction continue finale.
  - $\textcolor{#8b5cf6}{M}$ est le nombre total d'arbres (`n_estimators`).
  - $\textcolor{#10b981}{\nu}$ est le taux d'apprentissage, qui contrôle la contribution de chaque arbre.
  - $\textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x})$ est l'arbre de régression entraîné à l'étape $m$ pour prédire les résidus.
  - $\textcolor{#ef4444}{x}$ représente les caractéristiques d'entrée.
  
  Pour la MSE, le pseudo-résidu à l'étape $m$ se simplifie en : $r_{im} = y_i - F_{m-1}(\textcolor{#ef4444}{x}_i)$.

