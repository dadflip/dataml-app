id: "model_gradient_boosting_regressor"
name: "Model: Gradient Boosting Regressor"
description: |
  Modèle d'ensemble puissant construisant séquentiellement une série d'arbres de décision, où chaque nouvel arbre s'efforce de prédire et corriger les erreurs (résidus continus) de l'ensemble précédent.
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Excellent choix par défaut pour la majorité des problèmes de régression sur des données tabulaires de taille moyenne à grande. Particulièrement performant sur des données hétérogènes et lorsque la précision prime sur le temps d'entraînement.
use_cases:
  - "Prédiction de prix de l'immobilier ou de véhicules."
  - "Prévisions de ventes ou de demande."
  - "Estimation de la durée de vie ou du temps avant défaillance (Time to Event)."
pros:
  - "Précision prédictive très élevée, souvent parmi les meilleurs algorithmes de régression tabulaire."
  - "Gère nativement les interactions complexes et non linéaires entre les caractéristiques."
  - "Permet l'optimisation de différentes fonctions de perte (Huber, Quantile, etc.) le rendant robuste aux valeurs aberrantes."
cons:
  - "Entraînement séquentiel lent, difficile à paralléliser (contrairement aux Random Forests)."
  - "Sensible au surapprentissage (overfitting) si le taux d'apprentissage ou la profondeur des arbres ne sont pas bien réglés."
  - "L'interprétation reste complexe bien qu'aidée par l'importance des variables."
hyperparameters:
  n_estimators: "Nombre d'étapes de boosting (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import GradientBoostingRegressor

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  print(f"[MODEL] Entraînement Gradient Boosting Regressor (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {"framework": "sklearn", "type": "gradient_boosting_regressor"}
  full_pipeline = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = GradientBoostingRegressor(n_estimators=int(N_ESTIMATORS), learning_rate=float(LEARNING_RATE), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}

