id: "model_kmeans_image_quantization"
name: "Model: Image Color Quantization (K-Means)"
description: "Algorithme de vision par ordinateur non-supervisé appliquant l'algorithme K-Means dans l'espace colorimétrique (RGB) pour réduire drastiquement la palette de couleurs d'une image."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "unsupervised", "sklearn", "kmeans", "quantization", "compression"]
applies_to: ["Images"]
when_to_use: "À privilégier pour créer des effets stylistiques (pixel art, posterisation), pour réduire l'empreinte mémoire d'une image en vue de sa transmission, ou pour simplifier les données avant une segmentation d'image."
use_cases:
  - "Création artistique : Génération d'effets visuels rétro ou de postérisation (réduction des nuances)."
  - "Compression d'images : Diminution drastique de la taille des fichiers en limitant le dictionnaire de couleurs (ex: format GIF)."
  - "Pré-traitement pour segmentation : Simplification des textures d'une image pour faciliter l'extraction d'objets (background subtraction)."
pros:
  - "Processus très rapide et facile à implémenter grâce à Sklearn."
  - "Résultats visuels immédiats et paramétrage intuitif (nombre de couleurs souhaitées)."
cons:
  - "Perte irréversible des détails fins et des dégradés fluides (banding effect)."
  - "Le traitement image par image peut être lent si les images sont de très haute résolution."
hyperparameters:
  n_colors: "Nombre de couleurs dans la palette finale (ex: 8)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.cluster import KMeans

  # [PARAM: N_COLORS | number]
  N_COLORS = 8
  # [/PARAM]

  print(f"[MODEL] Quantisation d'image (K={N_COLORS})...")
  # Ce modèle est particulier, il traite généralement UNE image à la fois, ou un lot.
  # On va simuler le traitement sur X_test.
  if 'X_test' in locals():
      X_te_np = np.array(X_test)
      
      y_pred_list = []
      # On va quantifier chaque image de test
      for img in X_te_np:
          # On suppose img de taille (H, W, 3)
          if len(img.shape) == 3 and img.shape[-1] == 3:
              w, h, d = tuple(img.shape)
              image_array = np.reshape(img, (w * h, d))
              
              kmeans = KMeans(n_clusters=int(N_COLORS), random_state=42, n_init="auto").fit(image_array)
              labels = kmeans.predict(image_array)
              
              # Reconstruire l'image avec les centres de cluster
              quantized = kmeans.cluster_centers_[labels]
              quantized = np.reshape(quantized, (w, h, d)).astype('uint8')
              y_pred_list.append(quantized)
          else:
              y_pred_list.append(img) # fallback
              
      y_pred = np.array(y_pred_list)
      y_proba = None
      feature_importances = None
      
      from sklearn.preprocessing import FunctionTransformer
      model = FunctionTransformer(lambda X: y_pred)
      full_pipeline = model
          
      training_history = {"status": "success", "colors": N_COLORS}
      task_type = "image_transformation"
      meta = {}
math_theory: |
  La quantification d'image par K-Means traite chaque pixel de l'image comme un point dans un espace de couleurs à 3 dimensions (ex: RVB). L'algorithme cherche à regrouper ces pixels en $\textcolor{#8b5cf6}{K}$ clusters de couleurs distinctes.

  L'objectif est de minimiser l'inertie intra-cluster (la somme des distances au carré entre la couleur de chaque pixel et la couleur du centroïde qui lui est assigné) :
  $$ \textcolor{#ef4444}{J} = \sum_{j=1}^{\textcolor{#8b5cf6}{K}} \sum_{\textcolor{#10b981}{p_i} \in \textcolor{#fbbf24}{S_j}} ||\textcolor{#10b981}{p_i} - \textcolor{#3b82f6}{c_j}||^2 $$

  - $\textcolor{#10b981}{p_i}$ : Le vecteur couleur (R,V,B) du $i$-ème pixel
  - $\textcolor{#3b82f6}{c_j}$ : Le vecteur couleur du $j$-ème centroïde (qui deviendra une couleur de la nouvelle palette)
  - $\textcolor{#fbbf24}{S_j}$ : L'ensemble des pixels assignés au cluster $j$
  - $\textcolor{#8b5cf6}{K}$ : Le nombre total de couleurs de la palette réduite
