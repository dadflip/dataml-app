math_theory: |
  GPT-2 emploie une architecture Transformer autorégressive uniquement composée de décodeurs (Decoder-only). La génération de texte est formulée comme la factorisation de la probabilité jointe sur une séquence de tokens $\textcolor{#10b981}{X}$.
  
  Le modèle calcule la probabilité conditionnelle du prochain token $\textcolor{#10b981}{x_t}$ étant donné la séquence de tous les tokens précédents $\textcolor{#3b82f6}{x_{<t}}$ :
  
  $$
  P(\textcolor{#10b981}{X}) = \prod_{t=1}^{T} P(\textcolor{#10b981}{x_t} \mid \textcolor{#3b82f6}{x_{<t}})
  $$
  
  À chaque étape de génération $t$ :
  1. Le contexte $\textcolor{#3b82f6}{x_{<t}}$ passe à travers des couches d'auto-attention masquées (masked self-attention) empilées pour produire une représentation cachée $\textcolor{#fbbf24}{h_t}$.
  2. La distribution de probabilité pour le token suivant est calculée en utilisant la matrice de poids du vocabulaire $\textcolor{#ef4444}{W_{\text{vocab}}}$ :
  
  $$
  P(\textcolor{#10b981}{x_t}) = \text{Softmax}(\textcolor{#ef4444}{W_{\text{vocab}}} \cdot \textcolor{#fbbf24}{h_t})
  $$
  
  Les tokens sont échantillonnés à partir de cette distribution et ajoutés au contexte pour l'étape suivante.

