id: "model_gpt2_text_gen"
name: "Model: GPT-2 Text Generation"
description: |
  Modèle de langage génératif basé sur l'architecture Transformer (GPT-2) d'OpenAI, utilisé via la bibliothèque HuggingFace Transformers.
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "text-generation", "transformers", "huggingface", "gpt2", "generative"]
applies_to: ["Texte"]
when_to_use: |
  Idéal pour la génération de texte libre à partir d'une amorce (prompt), la complétion automatique de phrases, ou l'augmentation de données textuelles.
use_cases:
  - "Création de contenu automatique ou aide à la rédaction."
  - "Augmentation de données en générant des exemples synthétiques d'entraînement."
  - "Génération de descriptions, de scénarios ou de dialogues créatifs."
pros:
  - "Génère du texte très fluide, créatif et avec une bonne grammaire."
  - "Facile à utiliser avec l'API pipeline de HuggingFace."
  - "Pré-entraîné sur un immense corpus de texte."
cons:
  - "A tendance à perdre le fil conducteur (incohérence) sur de longs textes."
  - "Ne permet pas de faire du chat interactif ou de suivre des instructions complexes."
  - "Peut générer des informations factuellement fausses (hallucinations)."
hyperparameters:
  max_length: "Nombre total de tokens désirés (ex: 50)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  # [PARAM: MAX_LENGTH | number]
  MAX_LENGTH = 50
  # [/PARAM]

  print(f"[MODEL] HuggingFace GPT-2 Text Generation (max_length={MAX_LENGTH})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "text_generation"
  meta = {"framework": "transformers", "type": "gpt2"}
  full_pipeline = None

  if 'X_test' in locals() and pipeline is not None:
      texts = []
      if isinstance(X_test, pd.DataFrame) and 'text' in X_test.columns:
          texts = X_test['text'].astype(str).tolist()
      elif isinstance(X_test, (pd.Series, np.ndarray, list)):
          texts = [str(x) for x in X_test]
          
      if texts:
          print("Chargement de GPT-2...")
          generator = pipeline("text-generation", model="gpt2")
          
          print("Génération en cours...")
          results = generator(texts, max_new_tokens=int(MAX_LENGTH), num_return_sequences=1)
          
          y_pred = np.array([res[0]['generated_text'] for res in results])
          model = generator
          
          if 'preprocessor' in locals() and preprocessor is not None:
              try: from imblearn.pipeline import Pipeline
              except: from sklearn.pipeline import Pipeline
              full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
          else:
              full_pipeline = model
              
          training_history = {"status": "success", "type": "zero_shot_generative"}

