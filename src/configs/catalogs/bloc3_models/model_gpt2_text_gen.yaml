math_theory: |
  GPT-2 uses an autoregressive Decoder-only Transformer architecture. Text generation is framed as the factorization of the joint probability over a sequence of tokens $\textcolor{#10b981}{X}$.
  
  The model computes the conditional probability of the next token $\textcolor{#10b981}{x_t}$ given the sequence of all preceding tokens $\textcolor{#3b82f6}{x_{<t}}$:
  
  $$ P(\textcolor{#10b981}{X}) = \prod_{t=1}^{T} P(\textcolor{#10b981}{x_t} \mid \textcolor{#3b82f6}{x_1, \dots, x_{t-1}}) $$
  
  At each generation step $t$:
  1. $\textcolor{#3b82f6}{x_{<t}}$ is passed through stacked masked self-attention layers to produce a hidden representation $\textcolor{#fbbf24}{h_t}$.
  2. The probability distribution for the next token is computed: $P(\textcolor{#10b981}{x_t}) = \text{Softmax}(\textcolor{#ef4444}{W_{\text{vocab}}} \cdot \textcolor{#fbbf24}{h_t})$.
  
  Tokens are sampled from this distribution and appended to the context for the next step.

