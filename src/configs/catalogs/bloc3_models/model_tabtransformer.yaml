id: "model_tabtransformer"
name: "Model: TabTransformer (Tabulaire)"
description: |
  Architecture de type Transformer spécifiquement adaptée aux données tabulaires, développée par Amazon (AWS). Elle applique un mécanisme d'attention multi-têtes (Self-Attention) pour apprendre des représentations contextuelles robustes des variables catégorielles.
category: "Attention & Transformers"
tags: ["model", "classification", "tabular", "pytorch", "transformer", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  Jeux de données tabulaires contenant une très forte proportion de variables catégorielles avec beaucoup de modalités. Constitue une bonne alternative au gradient boosting, particulièrement si vous disposez de très gros volumes de données ou souhaitez pré-entraîner un modèle.
use_cases:
  - "Prédiction de clics publicitaires (CTR) sur des données à forte cardinalité (ID utilisateur, contexte)."
  - "Systèmes de recommandation d'articles ou de produits e-commerce basés sur des profils."
  - "Évaluation de risques impliquant des variables catégorielles complexes inter-dépendantes."
pros:
  - "Capture efficacement les interactions d'ordre supérieur entre les variables catégorielles via l'attention multi-têtes."
  - "Produit des embeddings de haute qualité réutilisables pour d'autres tâches en aval (transfer learning)."
  - "Potentiellement plus robuste face au bruit et aux données manquantes sur les variables catégorielles."
cons:
  - "Souvent surpassé par les modèles d'arbres (XGBoost, LightGBM) sur les petits et moyens jeux de données."
  - "Le traitement des variables continues n'exploite généralement pas l'attention (elles sont souvent juste concaténées à la fin)."
  - "Exige beaucoup de ressources computationnelles et de données pour justifier sa complexité par rapport aux baselines."
hyperparameters:
  d_model: "Dimension d'embedding par colonne (ex: 32)."
  nhead: "Nombre de têtes d'attention (ex: 4)."
  epochs: "Nombre d'époques d'entraînement (ex: 10)."
math_theory: |
  TabTransformer plonge (embeds) chaque modalité catégorielle $\textcolor{#ef4444}{x_i}$ dans un vecteur $\textcolor{#3b82f6}{e_i}$. Ces plongements passent par un encodeur Transformer :

  $$
  \textcolor{#10b981}{E_{out}} = \text{Transformer}(\textcolor{#3b82f6}{E_{in}}) 
  $$

  Le mécanisme d'attention (Scaled Dot-Product) est défini par :

  $$
  \text{Attention}(\textcolor{#fbbf24}{Q}, \textcolor{#fbbf24}{K}, \textcolor{#fbbf24}{V}) = \text{softmax}\left(\frac{\textcolor{#fbbf24}{Q}\textcolor{#fbbf24}{K}^T}{\sqrt{\textcolor{#8b5cf6}{d_k}}}\right)\textcolor{#fbbf24}{V} 
  $$

  Les variables continues sont concaténées avec $\textcolor{#10b981}{E_{out}}$ puis transmises à un perceptron multicouche final (MLP).
