id: "model_cnn_2d"
name: "Model: 2D CNN Custom (Vision)"
description: |
  Réseau Convolutif 2D implémenté "from scratch". Conçu pour extraire hiérarchiquement des motifs
  visuels complexes (bords, textures, formes) en deux dimensions, de manière similaire aux architectures classiques comme LeNet ou VGG.
category: "Réseaux Convolutifs (CNN)"
tags: ["model", "vision", "classification", "pytorch", "cnn", "deep-learning"]
applies_to: ["Images"]
when_to_use: |
  Pour classifier des images simples ou de petite taille (comme MNIST ou CIFAR) lorsque vous 
  souhaitez comprendre ou expérimenter une architecture de bout en bout sans modèles pré-entraînés.
use_cases:
  - "Classification de chiffres manuscrits (ex: MNIST) ou de petites icônes."
  - "Détection de défauts visuels simples sur des chaînes de production (contrôle qualité)."
  - "Objectifs pédagogiques pour maîtriser le fonctionnement d'un réseau convolutif complet."
pros:
  - "Léger, transparent et rapide à s'entraîner sur des données simples."
  - "Architecture facilement personnalisable de A à Z."
cons:
  - "Sujet au surapprentissage (overfitting) sur des jeux de données de taille moyenne/grande."
  - "Moins performant que des architectures modernes (ResNet, EfficientNet) pré-entraînées."
hyperparameters:
  epochs: "Nombre d'époques (ex: 5)."
math_theory: |
  La convolution 2D extrait des caractéristiques spatiales (bords, textures) en faisant glisser un noyau sur une image.
  Pour une image d'entrée $\textcolor{#3b82f6}{I}$ et un noyau (filtre) $\textcolor{#10b981}{K}$ de taille $m \times n$, la carte de caractéristiques résultante $\textcolor{#fbbf24}{S}$ aux coordonnées $(i, j)$ est :
  
  $$
  \textcolor{#fbbf24}{S_{i, j}} = \sigma \left( \sum_{u=0}^{m-1} \sum_{v=0}^{n-1} \textcolor{#3b82f6}{I_{i+u, j+v}} \cdot \textcolor{#10b981}{K_{u, v}} + \textcolor{#8b5cf6}{b} \right)
  $$
  
  où $\textcolor{#8b5cf6}{b}$ est un biais et $\sigma$ est la fonction d'activation (souvent ReLU : $\max(0, x)$).
  Le Max Pooling réduit ensuite la résolution spatiale en sélectionnant la valeur maximale dans une fenêtre $p \times p$, fournissant une invariance aux petites translations.
