name: "Model: 2D CNN Custom (Vision)"
description: "Réseau Convolutif 2D from scratch pour classifier des images (façon LeNet/VGG)."
category: "Réseaux Convolutifs (CNN)"
tags: ["model", "vision", "classification", "pytorch", "cnn", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Pour classifier de petites images (MNIST, CIFAR) sans ResNet pré-entraîné."
pros:
  - "Léger et transparent."
cons:
  - "Surchauffe (overfit) rapidement sur des datasets complexes."
