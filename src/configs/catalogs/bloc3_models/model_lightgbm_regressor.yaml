math_theory: |
  Le LightGBM Regressor applique le framework LightGBM aux cibles continues en minimisant une fonction de perte de régression (telle que MSE ou MAE).
  
  Le modèle utilise la discrétisation par histogrammes (EFB) pour les caractéristiques et construit des arbres de manière séquentielle via une croissance par les feuilles (en choisissant la feuille qui maximise la réduction de la perte).
  
  $$
  \textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x}) = F_0(\textcolor{#ef4444}{x}) + \sum_{m=1}^{\textcolor{#8b5cf6}{M}} \textcolor{#10b981}{\eta} \cdot \textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x}) 
  $$
  
  Où :
  - $\textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x})$ est la prédiction continue agrégée.
  - $\textcolor{#8b5cf6}{M}$ est le nombre d'arbres (`n_estimators`).
  - $\textcolor{#10b981}{\eta}$ est le taux d'apprentissage.
  - $\textcolor{#fbbf24}{h_m}$ est l'arbre de régression construit par les feuilles à l'itération $m$.

