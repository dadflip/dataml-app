id: "model_lightgbm_regressor"
name: "Model: LightGBM Regressor"
description: |
  LightGBM (Light Gradient Boosting Machine) adapté à la régression. Cet algorithme basé sur les arbres de décision utilise la croissance "leaf-wise" pour minimiser l'erreur quadratique ou absolue, tout en gérant très efficacement les données massives grâce aux histogrammes.
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "lightgbm", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Privilégiez ce modèle pour la prédiction de valeurs continues sur des datasets de grande taille (au moins quelques dizaines de milliers d'enregistrements) lorsque la vitesse d'entraînement est essentielle.
use_cases:
  - "Prédiction des prix de l'immobilier sur des bases nationales."
  - "Estimation de la valeur à vie du client (CLV - Customer Lifetime Value)."
  - "Prévision de la demande ou des ventes sur de gros volumes d'historique."
pros:
  - "Temps d'entraînement ultra-rapide et faible empreinte mémoire."
  - "Prend en charge nativement les variables catégorielles."
  - "Excellente précision prédictive sur de grands ensembles de données."
cons:
  - "Fort risque de surapprentissage sur les petits jeux de données (< 10 000 lignes)."
  - "Le réglage des nombreux hyperparamètres (num_leaves, max_depth, min_data_in_leaf) peut être chronophage."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  num_leaves: "Nombre max de feuilles par arbre (ex: 31)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from lightgbm import LGBMRegressor
  except ImportError:
      LGBMRegressor = None
      print("[ERREUR] lightgbm n'est pas installé. Lancez : !pip install lightgbm")

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: NUM_LEAVES | number]
  NUM_LEAVES = 31
  # [/PARAM]

  print(f"[MODEL] Entraînement LightGBM Regressor (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and LGBMRegressor is not None:
      import re
      X_train_lgb = X_train.rename(columns=lambda x: re.sub('[^A-Za-z0-9_]+', '', x)) if isinstance(X_train, pd.DataFrame) else X_train
      X_test_lgb = X_test.rename(columns=lambda x: re.sub('[^A-Za-z0-9_]+', '', x)) if isinstance(X_test, pd.DataFrame) else X_test
      
      model = LGBMRegressor(
          n_estimators=int(N_ESTIMATORS), 
          learning_rate=float(LEARNING_RATE), 
          num_leaves=int(NUM_LEAVES),
          random_state=42
      )
      model.fit(X_train_lgb, y_train)
      
      y_pred = model.predict(X_test_lgb)
      y_proba = None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
      meta = {}
