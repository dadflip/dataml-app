id: "model_pycaret_automl_classifier"
name: "Model: PyCaret AutoML (Classification)"
description: "Recherche automatique du meilleur modèle de classification parmi des dizaines d'algorithmes (RandomForest, LightGBM, SVM...)."
category: "AutoML"
tags: ["model", "automl", "classification", "tabular", "pycaret"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous voulez une baseline solide très rapidement sans écrire une ligne de code."
pros:
  - "Teste plusieurs modèles automatiquement."
  - "Très simple à utiliser."
cons:
  - "Peut être très lent si le dataset est gros."
  - "PyCaret réécrit son propre pipeline en interne."
hyperparameters:
  sort: "Métrique à optimiser ('Accuracy', 'AUC', 'F1', 'Precision', 'Recall')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from pycaret.classification import setup, compare_models, pull, predict_model
  except ImportError:
      setup = None
      print("[ERREUR] pycaret n'est pas installé. Lancez : !pip install pycaret")

  # [PARAM: SORT_METRIC | string]
  SORT_METRIC = "Accuracy"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

_metadata:
  bloc: 3
  section: "5_clustering_automl_and_nn"
