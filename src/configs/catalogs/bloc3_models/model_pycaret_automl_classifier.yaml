id: "model_pycaret_automl_classifier"
name: "Model: PyCaret AutoML (Classification)"
description: |
  PyCaret est une bibliothèque d'AutoML (Automated Machine Learning) à bas code. Ce modèle compare automatiquement des dizaines d'algorithmes de classification (tels que Random Forest, LightGBM, XGBoost, SVM, etc.) en gérant en interne la validation croisée, l'optimisation des hyperparamètres et la création du pipeline de prétraitement, pour restituer le meilleur modèle selon une métrique choisie.
category: "AutoML"
tags: ["model", "automl", "classification", "tabular", "pycaret"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal lors des phases initiales d'un projet pour établir rapidement une baseline solide (modèle de référence), ou lorsque vous disposez de peu de temps pour modéliser et optimiser manuellement chaque algorithme.
use_cases:
  - "Évaluation rapide de la faisabilité (PoC) d'un projet de Machine Learning de classification (ex: churn, fraude, diagnostic)."
  - "Génération de benchmarks pour comparer les performances de modèles spécifiques personnalisés."
  - "Automatisation complète du cycle d'entraînement pour des applications déployées rapidement."
pros:
  - "Extrêmement productif : teste, valide et compare plusieurs modèles en quelques lignes de code."
  - "Gère automatiquement les étapes fastidieuses comme la validation croisée, le traitement des valeurs manquantes et l'encodage catégoriel."
  - "Fournit une API unifiée facilitant l'assemblage (ensembling), l'optimisation et l'analyse (SHAP) du modèle final."
cons:
  - "Peut être très lent et coûteux en ressources informatiques sur des datasets massifs du fait de l'entraînement exhaustif."
  - "Moins de granularité et de contrôle sur les détails spécifiques du pipeline par rapport à un code sklearn natif."
  - "L'environnement PyCaret a de nombreuses dépendances qui peuvent causer des conflits de versions dans un environnement Python restreint."
hyperparameters:
  sort: "Métrique à optimiser ('Accuracy', 'AUC', 'F1', 'Precision', 'Recall')."
math_theory: |
  PyCaret AutoML compare un ensemble de modèles candidats $\textcolor{#3b82f6}{\mathcal{M}} = \{\textcolor{#3b82f6}{M_1}, \textcolor{#3b82f6}{M_2}, \dots, \textcolor{#3b82f6}{M_K}\}$.
  Chaque modèle $\textcolor{#3b82f6}{M_k}$ est entraîné sur le jeu de données $\textcolor{#fbbf24}{D_{train}}$ pour générer un modèle ajusté $\textcolor{#10b981}{\hat{f}_k(x)}$.
  La sélection repose sur la validation croisée pour calculer un score de performance $\textcolor{#ef4444}{S_k}$. Le meilleur modèle $\textcolor{#8b5cf6}{M^*}$ est celui qui maximise ce score :
  
  $$
  \textcolor{#8b5cf6}{M^*} = \arg\max_{k \in \{1 \dots K\}} \textcolor{#ef4444}{S_k}(\textcolor{#10b981}{\hat{f}_k}, \textcolor{#fbbf24}{D_{val}})
  $$
