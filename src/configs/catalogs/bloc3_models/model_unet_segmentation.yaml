id: "model_unet_segmentation"
name: "Model: U-Net Semantic Segmentation"
description: |
  Architecture de réseau de neurones convolutifs (CNN) en forme de "U" développée initialement pour la segmentation sémantique d'images biomédicales. Le U-Net capture à la fois le contexte global (via un chemin de contraction/downsampling) et permet une localisation précise (via un chemin d'expansion/upsampling symétrique avec des skip-connections).
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "segmentation", "pytorch", "unet", "deep-learning"]
applies_to: ["Images"]
when_to_use: |
  À utiliser pour toute tâche nécessitant une classification pixel par pixel, c'est-à-dire lorsqu'il faut isoler et délimiter précisément la forme d'un objet (ou de plusieurs classes) par rapport au fond de l'image.
use_cases:
  - "Segmentation d'images médicales (ex: détection de tumeurs sur des IRM, segmentation de cellules en microscopie)."
  - "Traitement d'images satellitaires (ex: identification de bâtiments, de routes ou de zones forestières)."
  - "Vision par ordinateur pour véhicules autonomes (ex: segmentation de la route, des piétons, des panneaux)."
  - "Inspection visuelle industrielle (ex: détection et délimitation de défauts complexes sur des pièces manufacturées)."
pros:
  - "Architecture extrêmement performante, même entraînée avec un nombre relativement restreint d'images annotées."
  - "Les 'skip-connections' préservent les détails spatiaux fins qui sont souvent perdus dans les CNN profonds classiques."
  - "Modèle très flexible, largement adaptable et déclinable (ex: V-Net pour la 3D, U-Net++)."
cons:
  - "Nécessite la création de masques de segmentation annotés pixel par pixel (ground truth), ce qui est très coûteux et chronophage."
  - "Gourmand en mémoire VRAM lors de l'entraînement à cause du stockage des matrices (feature maps) pour les skip-connections."
  - "Peut devenir lent à l'inférence sur des images de très haute résolution."
hyperparameters: {}
