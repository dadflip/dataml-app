code_template: |
  import pandas as pd
  import numpy as np

  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "Basic CNN Classifier"}

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch torchvision")

  # [PARAM: EPOCHS | number]
  EPOCHS = 5
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.001
  # [/PARAM]

  print(f"[MODEL] Entraînement Basic CNN PyTorch (epochs={EPOCHS}, lr={LEARNING_RATE})...")
  
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      # Use preprocessor if available
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          X_train_proc = preprocessor.fit_transform(X_train)
          X_test_proc = preprocessor.transform(X_test)
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)])
      else:
          X_train_proc = X_train
          X_test_proc = X_test
          full_pipeline = None

      # Convert X to float32 NumPy arrays
      if isinstance(X_train_proc, pd.DataFrame):
          col = X_train_proc.columns[0]
          if isinstance(X_train_proc[col].iloc[0], np.ndarray):
              X_tr_np = np.stack(X_train_proc[col].values).astype(np.float32)
              X_te_np = np.stack(X_test_proc[col].values).astype(np.float32)
          else:
              X_tr_np = X_train_proc.values.astype(np.float32)
              X_te_np = X_test_proc.values.astype(np.float32)
      else:
          X_tr_np = np.array(X_train_proc, dtype=np.float32)
          X_te_np = np.array(X_test_proc, dtype=np.float32)
      
      if len(X_tr_np.shape) == 2:
          # tentative de reshape carré (ex: 784 -> 28x28)
          side = int(np.sqrt(X_tr_np.shape[1]))
          X_tr_np = X_tr_np.reshape(-1, 1, side, side)
          X_te_np = X_te_np.reshape(-1, 1, side, side)
          
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      dataset = TensorDataset(torch.tensor(X_tr_np), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)
      
      class SimpleCNN(nn.Module):
          def __init__(self, in_channels, num_classes):
              super().__init__()
              self.conv1 = nn.Conv2d(in_channels, 16, kernel_size=3, padding=1)
              self.pool = nn.MaxPool2d(2, 2)
              self.conv2 = nn.Conv2d(16, 32, kernel_size=3, padding=1)
              self.flatten = nn.Flatten()
              self.fc = nn.LazyLinear(num_classes) # LazyLinear s'adapte à la taille
              
          def forward(self, x):
              x = self.pool(torch.relu(self.conv1(x)))
              x = self.pool(torch.relu(self.conv2(x)))
              x = self.flatten(x)
              x = self.fc(x)
              return x
              
      in_channels = X_tr_np.shape[1]
      model = SimpleCNN(in_channels, num_classes)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=float(LEARNING_RATE))
      
      model.train()
      loss_val = 0.0
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              loss_val = float(loss.item())
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np)
          logits = model(X_te_t)
          preds_idx = torch.argmax(logits, dim=1).numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).numpy()
          
      if not has_preprocessor:
          full_pipeline = model
          
      training_history = {"status": "success", "fitted_on": len(X_train), "final_loss": loss_val}

