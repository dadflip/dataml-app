id: "model_cnn_classifier"
name: "Model: Basic CNN Classifier (PyTorch)"
description: "Réseau de Neurones Convolutif (CNN) fondamental implémenté via PyTorch, conçu pour extraire hiérarchiquement des caractéristiques visuelles et effectuer la classification d'images."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "cnn", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Privilégier ce modèle pour des tâches de classification sur des jeux de données d'images de petite à moyenne taille (ex: MNIST, CIFAR) ou lorsque des contraintes de ressources interdisent l'utilisation d'architectures lourdes."
use_cases:
  - "Reconnaissance de caractères manuscrits ou de chiffres (OCR basique)."
  - "Classification d'images en niveaux de gris de faible résolution."
  - "Prototypage rapide d'applications de vision par ordinateur."
pros:
  - "Architecture légère offrant des temps d'inférence et d'entraînement très courts, même sur CPU."
  - "Facilité d'interprétation des premières couches convolutives et flexibilité structurelle."
cons:
  - "Capacité d'abstraction insuffisante pour des images réelles à haute résolution ou des scènes complexes."
  - "Risque élevé de sous-apprentissage sur des jeux de données visuelles hétérogènes."
hyperparameters:
  epochs: "Nombre d'époques (ex: 5)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
math_theory: |
  La convolution 2D extrait des caractéristiques spatiales (contours, textures) en faisant glisser un noyau sur une image.
  Pour une image d'entrée $\textcolor{#3b82f6}{I}$ et un noyau (filtre) $\textcolor{#10b981}{K}$ de taille $m \times n$, la carte de caractéristiques résultante $\textcolor{#fbbf24}{S}$ aux coordonnées $(i, j)$ est :
  
  $$
  \textcolor{#fbbf24}{S_{i, j}} = \sigma \left( \sum_{u=0}^{m-1} \sum_{v=0}^{n-1} \textcolor{#3b82f6}{I_{i+u, j+v}} \cdot \textcolor{#10b981}{K_{u, v}} + \textcolor{#8b5cf6}{b} \right)
  $$
  
  où $\textcolor{#8b5cf6}{b}$ est un biais et $\sigma$ est la fonction d'activation (souvent ReLU : $\max(0, x)$).
  Le Max Pooling réduit ensuite la résolution spatiale en sélectionnant la valeur maximale dans une fenêtre $p \times p$, offrant ainsi une invariance aux petites translations.
