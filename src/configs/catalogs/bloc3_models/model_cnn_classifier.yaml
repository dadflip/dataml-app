id: "model_cnn_classifier"
name: "Model: Basic CNN Classifier (PyTorch)"
description: "Réseau de Neurones Convolutif (CNN) basique construit de zéro (from scratch) pour la classification d'images."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "pytorch", "cnn", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Pour des tâches simples sur de petites images (ex: MNIST, CIFAR) sans s'encombrer d'un modèle lourd."
pros:
  - "Très léger, rapide à entraîner sur CPU."
cons:
  - "Performances très limitées sur des images réelles ou complexes."
hyperparameters:
  epochs: "Nombre d'époques (ex: 5)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch torchvision")

  # [PARAM: EPOCHS | number]
  EPOCHS = 5
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.001
  # [/PARAM]

  print(f"[MODEL] Entraînement Basic CNN PyTorch (epochs={EPOCHS}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      # On suppose que le bloc 2 a transformé les images en tenseurs plats ou (N, C, H, W)
      # Pour simplifier, on force un reshape (N, 1, 28, 28) si c'est du 1D (ex: MNIST flatten)
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      
      if len(X_tr_np.shape) == 2:
          # tentative de reshape carré (ex: 784 -> 28x28)
          side = int(np.sqrt(X_tr_np.shape[1]))
          X_tr_np = X_tr_np.reshape(-1, 1, side, side)
          X_te_np = X_te_np.reshape(-1, 1, side, side)
          
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      dataset = TensorDataset(torch.tensor(X_tr_np, dtype=torch.float32), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)
      
      class SimpleCNN(nn.Module):
          def __init__(self, in_channels, num_classes):
              super().__init__()
              self.conv1 = nn.Conv2d(in_channels, 16, kernel_size=3, padding=1)
              self.pool = nn.MaxPool2d(2, 2)
              self.conv2 = nn.Conv2d(16, 32, kernel_size=3, padding=1)
              self.flatten = nn.Flatten()
              self.fc = nn.LazyLinear(num_classes) # LazyLinear s'adapte à la taille
              
          def forward(self, x):
              x = self.pool(torch.relu(self.conv1(x)))
              x = self.pool(torch.relu(self.conv2(x)))
              x = self.flatten(x)
              x = self.fc(x)
              return x
              
      in_channels = X_tr_np.shape[1]
      model = SimpleCNN(in_channels, num_classes)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=float(LEARNING_RATE))
      
      model.train()
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np, dtype=torch.float32)
          logits = model(X_te_t)
          preds_idx = torch.argmax(logits, dim=1).numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).numpy()
          
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "fitted_on": len(X_train), "final_loss": float(loss)}
      task_type = "classification"
      print("[MODEL] CNN entraîné avec succès.")
  else:
      print("[ERREUR] Données ou torch introuvables. Vérifiez le bloc Preprocessing (Tensors).")
