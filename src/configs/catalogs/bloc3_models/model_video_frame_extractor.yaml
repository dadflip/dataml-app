id: "model_video_frame_extractor"
name: "Model: Video Frame Extractor (OpenCV)"
description: |
  Pipeline de prétraitement extrayant N trames réparties équitablement depuis une séquence vidéo. Convertit la dimension temporelle de la vidéo en un ensemble fini d'images statiques pour une analyse ultérieure.
category: "Multimédia & Audio"
tags: ["model", "video", "preprocessing", "opencv", "extraction"]
applies_to: ["Vidéo"]
when_to_use: |
  Étape préliminaire essentielle avant de soumettre une séquence vidéo à un modèle de classification d'images (comme ResNet ou ViT) ne supportant pas nativement les dimensions temporelles.
use_cases:
  - "Analyse de vidéos de sécurité par extraction de trames clés."
  - "Classification d'actions par analyse d'échantillons temporels."
  - "Détection d'objets dans un flux vidéo échantillonné."
pros:
  - "Permet l'utilisation de modèles d'images 2D standard (CNN, ViT) sur des vidéos."
  - "Réduit drastiquement le volume de données à traiter par rapport à l'analyse de chaque frame."
cons:
  - "Perte des informations de mouvement (flux optique) et de la dynamique temporelle continue (pas de convolutions 3D)."
  - "Risque de manquer des événements brefs si le taux d'échantillonnage est trop faible."
hyperparameters:
  n_frames: "Nombre de frames à extraire (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import cv2
  except ImportError:
      cv2 = None
      print("[ERREUR] opencv n'est pas installé. Lancez : !pip install opencv-python")

  # [PARAM: N_FRAMES | number]
  N_FRAMES = 10
  # [/PARAM]

  print(f"[MODEL] Extraction de frames vidéo (N={N_FRAMES})...")
  if 'X_test' in locals() and cv2 is not None:
      videos = list(X_test) # Liste de chemins vidéo
      
      all_preds = []
      for vid in videos:
          cap = cv2.VideoCapture(vid)
          total_frames = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          if total_frames > 0:
              step = max(1, total_frames // int(N_FRAMES))
              extracted = []
              for i in range(int(N_FRAMES)):
                  cap.set(cv2.CAP_PROP_POS_FRAMES, i * step)
                  ret, frame = cap.read()
                  if ret: extracted.append(cv2.cvtColor(frame, cv2.COLOR_BGR2RGB))
              all_preds.append(extracted) # Liste d'images pour cette vidéo
          else:
              all_preds.append([])
          cap.release()
              
      y_pred = np.array(all_preds, dtype=object)
      y_proba = None
      feature_importances = None
      
      from sklearn.preprocessing import FunctionTransformer
      model = FunctionTransformer(lambda X: y_pred)
      full_pipeline = model
          
      training_history = {"status": "success"}
      task_type = "video_processing"
math_theory: |
  L'extraction de trames (frames) repose sur un sous-échantillonnage temporel uniforme. Pour une vidéo contenant un total de $\textcolor{#10b981}{T}$ trames, nous souhaitons extraire $\textcolor{#8b5cf6}{N}$ trames réparties uniformément.
  
  Le pas d'échantillonnage (intervalle entre chaque trame extraite) est :
  
  $$
  \textcolor{#fbbf24}{S} = \lfloor \frac{\textcolor{#10b981}{T}}{\textcolor{#8b5cf6}{N}} \rfloor 
  $$
  
  L'indice temporel (numéro de trame) pour la $i$-ème image extraite (où $i \in \{0, 1, \dots, \textcolor{#8b5cf6}{N}-1\}$) est donné par :
  
  $$
  \textcolor{#3b82f6}{f_i} = i \times \textcolor{#fbbf24}{S} 
  $$
  
  - $\textcolor{#10b981}{T}$ : Nombre total de trames dans la séquence vidéo originale
  - $\textcolor{#8b5cf6}{N}$ : Nombre cible de trames à extraire (hyperparamètre)
  - $\textcolor{#fbbf24}{S}$ : Pas d'échantillonnage ou intervalle
  - $\textcolor{#3b82f6}{f_i}$ : Indice exact de la trame extraite dans la vidéo
