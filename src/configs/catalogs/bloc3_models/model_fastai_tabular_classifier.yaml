id: "model_fastai_tabular_classifier"
name: "Model: FastAI Tabular Classifier"
description: |
  Réseau de neurones profond (Deep Learning) spécialisé pour les données tabulaires, construit via la bibliothèque FastAI au-dessus de PyTorch. Sa grande force réside dans la gestion automatique et optimisée des variables catégorielles via la technique des "Entity Embeddings" (plongements), couplée à un entraînement utilisant des pratiques de pointe (ex: "1-cycle policy").
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "fastai", "pytorch", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser lorsque vous travaillez sur des données tabulaires riches contenant de nombreuses variables catégorielles à forte cardinalité (beaucoup de modalités). C'est la méthode de référence pour introduire le Deep Learning sur du tabulaire sans avoir à construire l'architecture PyTorch de A à Z.
use_cases:
  - "Prédiction de churn client avec de multiples identifiants de catégories (produits, villes)."
  - "Scoring de crédit incluant des codes de classification complexes."
  - "Extraction de représentations denses (embeddings) utilisables ensuite dans d'autres algorithmes."
pros:
  - "Création native et transparente des 'Entity Embeddings' pour capturer la sémantique des catégories."
  - "Convergence accélérée grâce à l'optimisation 'Fit One Cycle'."
  - "Pipelines de prétraitement intégrés à la bibliothèque (Categorify, FillMissing, Normalize)."
cons:
  - "L'API de FastAI est très spécifique et diffère structurellement des standards scikit-learn, compliquant l'intégration dans des pipelines existants."
  - "Souvent surpassé par les algorithmes de Gradient Boosting (XGBoost, LightGBM) sur les jeux de données tabulaires classiques."
hyperparameters:
  epochs: "Nombre d'époques (ex: 5)."
math_theory: |
  FastAI remplace chaque variable catégorielle discrète $\textcolor{#ef4444}{c_i}$ par un vecteur dense (Entity Embedding) $\textcolor{#3b82f6}{e_i}$ dérivé d'une matrice $\textcolor{#8b5cf6}{E}$ :
  
  $$
  \textcolor{#3b82f6}{e_i} = \textcolor{#8b5cf6}{E} \cdot \text{one\_hot}(\textcolor{#ef4444}{c_i}) 
  $$
  
  Les plongements (embeddings) sont concaténés avec les variables continues $\textcolor{#fbbf24}{x_{cont}}$ qui ont été préalablement normalisées :
  
  $$
  \textcolor{#10b981}{z} = [\textcolor{#3b82f6}{e_1}, \dots, \textcolor{#3b82f6}{e_k}, \textcolor{#fbbf24}{x_{cont}}] 
  $$
  
  Ce vecteur est ensuite traité par un Perceptron Multicouche (MLP) pour la classification.
