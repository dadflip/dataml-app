math_theory: |
  Bayesian Ridge Regression formulates linear regression using probability distributions. Instead of finding a single set of optimal weights, it estimates a posterior distribution over the weights. The target $\textcolor{#3b82f6}{y}$ is assumed to be drawn from a Gaussian distribution:
  
  $$p(\textcolor{#3b82f6}{y}|\textcolor{#10b981}{X}, \textcolor{#ef4444}{w}, \textcolor{#fbbf24}{\alpha}) = \mathcal{N}(\textcolor{#3b82f6}{y}|\textcolor{#10b981}{X} \textcolor{#ef4444}{w}, \textcolor{#fbbf24}{\alpha}^{-1})$$
  
  The weights $\textcolor{#ef4444}{w}$ are given a spherical Gaussian prior with precision $\textcolor{#8b5cf6}{\lambda}$ (acting as an automatic $L_2$ penalty):
  
  $$p(\textcolor{#ef4444}{w}|\textcolor{#8b5cf6}{\lambda}) = \mathcal{N}(\textcolor{#ef4444}{w}|0, \textcolor{#8b5cf6}{\lambda}^{-1} I)$$
  
  The hyperparameters $\textcolor{#fbbf24}{\alpha}$ and $\textcolor{#8b5cf6}{\lambda}$ are themselves treated as random variables with Gamma priors and are optimized during training. This provides both predictions and their associated uncertainty (variance).

