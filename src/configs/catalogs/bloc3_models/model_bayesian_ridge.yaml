id: "model_bayesian_ridge"
name: "Model: Bayesian Ridge Regression"
description: "Régression Ridge bayésienne. Estime un modèle probabiliste."
category: "Modèles Probabilistes"
tags: ["model", "regression", "tabular", "sklearn", "linear", "bayes"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous voulez inclure des probabilités a priori (priors) ou avoir un modèle très robuste sans chercher les hyperparamètres (les alphas sont estimés automatiquement)."
pros:
  - "Estime les paramètres de régularisation automatiquement."
cons:
  - "Lent sur de très gros datasets."
hyperparameters:
  n_iter: "Nombre maximum d'itérations."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import BayesianRidge

  # [PARAM: N_ITER | number]
  N_ITER = 300
  # [/PARAM]

  print(f"[MODEL] Entraînement Bayesian Ridge (iter={N_ITER})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {"model_name": "Bayesian Ridge"}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = BayesianRidge(n_iter=int(N_ITER))
      
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          
          steps = list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)]
          steps.append(('model', model))
          full_pipeline = Pipeline(steps=steps)
      else:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      full_pipeline.fit(X_train, y_train)
      model = full_pipeline.named_steps['model']
      
      # We can ask for std (standard deviation) from BayesianRidge predictions
      y_pred, y_std = full_pipeline.predict(X_test, return_std=True)
      
      # Feature importances defined as absolute coefficients
      if hasattr(model, 'coef_'):
          if 'feature_names_out' in locals() and feature_names_out is not None:
              if len(model.coef_) == len(feature_names_out):
                  feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out).sort_values(ascending=False)
              else:
                  feature_importances = pd.Series(np.abs(model.coef_)).sort_values(ascending=False)
          else:
              feature_importances = pd.Series(np.abs(model.coef_)).sort_values(ascending=False)
              
      training_history = {
          "status": "success", 
          "fitted_on": len(X_train), 
          "alpha_": float(model.alpha_), 
          "lambda_": float(model.lambda_)
      }

illustration_mermaid: |
    graph TD
      subgraph Prior Distributions
        Alpha[Alpha Prior\nGamma Distribution]
        Lambda[Lambda Prior\nGamma Distribution]
      end
      
      subgraph Bayesian Ridge Logic
        Data([X_train, y_train]) --> BR[BayesianRidge]
        Alpha --> BR
        Lambda --> BR
        BR -- Update Posteriors --> Params[Weights & Precision]
      end
      
      subgraph Prediction Phase
        Params --> Infer[Inference]
        Test([X_test]) --> Infer
        Infer --> Pred([y_pred])
        Infer --> Std([y_std\nUncertainty])
      end
      
      style BR fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Alpha fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style Lambda fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style Infer fill:#a78bfa,stroke:#7c3aed,stroke-width:1px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Test fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Std fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

