id: "model_bayesian_ridge"
name: "Model: Bayesian Ridge Regression"
description: |
  Régression Ridge Bayésienne. Modèle linéaire probabiliste qui estime non seulement les poids de la régression, mais aussi les hyperparamètres de régularisation (alpha et lambda) directement à partir des données via des distributions a priori (priors).
category: "Modèles Probabilistes"
tags: ["model", "regression", "tabular", "sklearn", "linear", "bayes"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal lorsque vous souhaitez une régression linéaire robuste où la force de régularisation est ajustée automatiquement, et lorsque vous avez besoin d'estimer l'incertitude (écart-type) autour de chaque prédiction.
use_cases:
  - "Problèmes de régression où l'évaluation du risque ou de l'incertitude est critique."
  - "Modélisation de données bruitées où la régularisation automatique empêche le surapprentissage."
  - "Baselines solides ne nécessitant pas de recherche sur grille (grid search) coûteuse."
pros:
  - "Estime automatiquement les paramètres de régularisation (alpha, lambda) sans validation croisée externe."
  - "Fournit des intervalles de confiance (incertitude) sur les prédictions."
  - "Très robuste au surapprentissage grâce à l'approche bayésienne intégrée."
cons:
  - "Généralement plus lent à entraîner qu'une simple régression Ridge ou Lasso classique."
  - "Suppose que les erreurs et les poids suivent des distributions gaussiennes."
  - "Peut rencontrer des problèmes de convergence sur des jeux de données avec un très grand nombre de caractéristiques colinéaires."
hyperparameters:
  n_iter: "Nombre maximum d'itérations."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import BayesianRidge

  # [PARAM: N_ITER | number]
  N_ITER = 300
  # [/PARAM]

  print(f"[MODEL] Entraînement Bayesian Ridge (iter={N_ITER})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {"model_name": "Bayesian Ridge"}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = BayesianRidge(n_iter=int(N_ITER))
      
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          
          steps = list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)]
          steps.append(('model', model))
          full_pipeline = Pipeline(steps=steps)
      else:
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      full_pipeline.fit(X_train, y_train)
      model = full_pipeline.named_steps['model']
      
      # We can ask for std (standard deviation) from BayesianRidge predictions
      y_pred, y_std = full_pipeline.predict(X_test, return_std=True)
      
      # Feature importances defined as absolute coefficients
      if hasattr(model, 'coef_'):
          if 'feature_names_out' in locals() and feature_names_out is not None:
              if len(model.coef_) == len(feature_names_out):
                  feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out).sort_values(ascending=False)
              else:
                  feature_importances = pd.Series(np.abs(model.coef_)).sort_values(ascending=False)
          else:
              feature_importances = pd.Series(np.abs(model.coef_)).sort_values(ascending=False)
              
      training_history = {
          "status": "success", 
          "fitted_on": len(X_train), 
          "alpha_": float(model.alpha_), 
          "lambda_": float(model.lambda_)
      }

