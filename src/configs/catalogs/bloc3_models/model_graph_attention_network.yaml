math_theory: |
  Un Graph Attention Network (GAT) introduit un mécanisme d'attention pour attribuer différents poids d'importance aux nœuds dans un voisinage.
  
  Pour un nœud $i$ et son voisin $j$, une transformation linéaire partagée, paramétrée par une matrice de poids $\textcolor{#3b82f6}{W}$, est appliquée à leurs caractéristiques $\textcolor{#10b981}{h_i}$ et $\textcolor{#10b981}{h_j}$. Un mécanisme d'attention paramétré par un vecteur de poids $\textcolor{#ef4444}{\mathbf{a}}$ calcule le score brut $e_{ij}$ :
  
  $$
  e_{ij} = \text{LeakyReLU}\Big(\textcolor{#ef4444}{\mathbf{a}}^T \big[\textcolor{#3b82f6}{W}\textcolor{#10b981}{h_i} \parallel \textcolor{#3b82f6}{W}\textcolor{#10b981}{h_j}\big]\Big)
  $$
  
  Ces scores sont normalisés sur l'ensemble des voisins $k \in \mathcal{N}(i)$ en utilisant la fonction softmax pour obtenir les coefficients d'attention $\textcolor{#fbbf24}{\alpha_{ij}}$ :
  
  $$
  \textcolor{#fbbf24}{\alpha_{ij}} = \frac{\exp(e_{ij})}{\sum_{k \in \mathcal{N}(i)} \exp(e_{ik})}
  $$
  
  Enfin, la nouvelle représentation des caractéristiques pour le nœud $i$ est obtenue en agrégeant les caractéristiques de ses voisins pondérées par les coefficients d'attention :
  
  $$
  \textcolor{#8b5cf6}{h'_i} = \sigma\left( \sum_{j \in \mathcal{N}(i)} \textcolor{#fbbf24}{\alpha_{ij}} \textcolor{#3b82f6}{W}\textcolor{#10b981}{h_j} \right)
  $$

