math_theory: |
  A Graph Attention Network (GAT) introduces an attention mechanism to assign different importance weights to nodes in a neighborhood.
  
  For a node $i$ and its neighbor $j$, a shared linear transformation parameterized by a weight matrix $\textcolor{#3b82f6}{W}$ is applied to their features $\textcolor{#10b981}{h_i}$ and $\textcolor{#10b981}{h_j}$. An attention mechanism $\textcolor{#ef4444}{a}$ computes the raw score $e_{ij}$:
  
  $$ e_{ij} = \text{LeakyReLU}\Big(\textcolor{#ef4444}{a}^T \big[\textcolor{#3b82f6}{W}\textcolor{#10b981}{h_i} \parallel \textcolor{#3b82f6}{W}\textcolor{#10b981}{h_j}\big]\Big) $$
  
  These scores are normalized across all neighbors $k \in \mathcal{N}(i)$ using the softmax function to get the attention coefficients $\textcolor{#fbbf24}{\alpha_{ij}}$:
  
  $$ \textcolor{#fbbf24}{\alpha_{ij}} = \frac{\exp(e_{ij})}{\sum_{k \in \mathcal{N}(i)} \exp(e_{ik})} $$
  
  Finally, the new feature representation for node $i$ is obtained by aggregating its neighbors' features weighted by the attention coefficients:
  
  $$ \textcolor{#8b5cf6}{h'_i} = \sigma\left( \sum_{j \in \mathcal{N}(i)} \textcolor{#fbbf24}{\alpha_{ij}} \textcolor{#3b82f6}{W}\textcolor{#10b981}{h_j} \right) $$

