id: "model_knn_classifier"
name: "Model: K-Nearest Neighbors Classifier"
description: "Algorithme de classification supervisé non paramétrique (lazy learning). Il prédit la classe d'une nouvelle observation en se basant sur le vote majoritaire de ses K voisins les plus proches dans l'espace des descripteurs."
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "classification", "tabular", "sklearn", "distance", "knn", "lazy-learning"]
applies_to: ["Tabulaire"]
when_to_use: "À privilégier lors des phases d'exploration initiale, sur des jeux de données de taille modérée, ou lorsque les frontières de décision entre les classes sont fortement irrégulières et non linéaires."
use_cases:
  - "Systèmes de recommandation basiques : Identification de produits ou de contenus similaires."
  - "Reconnaissance de formes simples : Classification de chiffres manuscrits ou de symboles."
  - "Génétique et Biologie : Classification de profils d'expression génétique ou de sous-types cellulaires."
pros:
  - "Aucune hypothèse forte sur la distribution mathématique sous-jacente des données."
  - "Entraînement quasi-instantané puisqu'il consiste simplement à mémoriser le jeu d'apprentissage (lazy learning)."
  - "Capacité à s'adapter naturellement à des frontières de classification très complexes."
cons:
  - "Temps d'inférence (prédiction) extrêmement lent sur de très gros volumes de données (nécessite de calculer la distance avec tous les points)."
  - "Très sensible à la 'malédiction de la dimensionnalité' (perd de son sens en très haute dimension)."
  - "Nécessite obligatoirement une standardisation des variables (MinMax, StandardScaler) pour ne pas fausser le calcul des distances."
hyperparameters:
  n_neighbors: "Nombre de voisins K (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.neighbors import KNeighborsClassifier

  # [PARAM: N_NEIGHBORS | number]
  N_NEIGHBORS = 5
  # [/PARAM]

  print(f"[MODEL] Entraînement KNN Classifier (k={N_NEIGHBORS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = KNeighborsClassifier(n_neighbors=int(N_NEIGHBORS), n_jobs=-1)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      meta = {}
