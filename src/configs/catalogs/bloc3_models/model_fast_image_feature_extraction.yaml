id: "model_fast_image_feature_extraction"
name: "Model: Fast Image Feature Extraction (Transfer Learning)"
description: |
  Pipeline hybride d'apprentissage automatique conçu pour la classification d'images ultra-rapide. Il utilise un réseau profond pré-entraîné (MobileNetV2) uniquement comme extracteur de caractéristiques (sans rétropropagation), et applique ensuite un classifieur linéaire classique (Régression Logistique) sur ces représentations denses. Cela permet d'obtenir d'excellentes performances en une fraction du temps requis pour un fine-tuning complet.
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "transfer-learning", "mobilenet", "fast"]
applies_to: ["Images"]
when_to_use: |
  Privilégiez cette approche lorsque vous avez besoin de construire rapidement un classifieur d'images très performant (comme pour des prototypes), sans disposer de la puissance de calcul nécessaire (gros GPUs) pour faire du fine-tuning de bout en bout.
use_cases:
  - "Prototypage rapide d'applications de vision par ordinateur."
  - "Classification d'images en milieu contraint ou sur CPU."
  - "Évaluation rapide de la séparabilité des classes d'un nouveau jeu de données visuel (ex: 102 flowers)."
pros:
  - "Extrêmement rapide à entraîner (seulement une passe d'inférence pour le CNN)."
  - "Tire parti des excellentes représentations d'ImageNet."
  - "Pas de risque de sur-apprentissage catastrophique du réseau profond."
cons:
  - "La phase d'extraction peut prendre un peu de temps sur de très gros volumes de données."
  - "Ne permet pas aux couches convolutives de s'adapter spécifiquement à votre domaine métier (si très différent d'ImageNet)."
hyperparameters:
  batch_size: "Taille du batch pour l'extraction (ex: 32)."
math_theory: |
  Ce pipeline de Transfer Learning (extraction de caractéristiques) fige les poids d'un réseau de neurones convolutif (CNN) pré-entraîné $\textcolor{#3b82f6}{f_{CNN}}$.
  L'image d'entrée $\textcolor{#10b981}{X}$ est transformée en un vecteur de caractéristiques dense $\textcolor{#fbbf24}{h}$ de dimension $d$ (ex: 1280 pour MobileNetV2) :
  $$ \textcolor{#fbbf24}{h} = \textcolor{#3b82f6}{f_{CNN}}(\textcolor{#10b981}{X}) $$
  Ensuite, une régression logistique standard est appliquée sur $\textcolor{#fbbf24}{h}$ pour prédire la probabilité de chaque classe $k$ :
  $$ P(\textcolor{#ef4444}{y}=k | \textcolor{#fbbf24}{h}) = \frac{\exp(\textcolor{#8b5cf6}{W}_k \cdot \textcolor{#fbbf24}{h} + \textcolor{#8b5cf6}{b}_k)}{\sum_{j} \exp(\textcolor{#8b5cf6}{W}_j \cdot \textcolor{#fbbf24}{h} + \textcolor{#8b5cf6}{b}_j)} $$
  où $\textcolor{#8b5cf6}{W}$ et $\textcolor{#8b5cf6}{b}$ sont les seuls paramètres appris lors de l'entraînement.
