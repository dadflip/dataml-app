id: "model_fast_image_feature_extraction"
name: "Model: Fast Image Feature Extraction (Transfer Learning)"
description: "Classification d'images ultra-rapide utilisant un modèle pré-entraîné (MobileNet V2) en extraction de caractéristiques, suivi d'une Régression Logistique."
category: "Vision par Ordinateur (Modèles Entraînés)"
tags: ["model", "vision", "classification", "transfer-learning", "mobilenet", "fast"]
applies_to: ["Images"]
when_to_use: "Quand vous voulez d'excellentes performances de classification d'images (comme 102 flowers) sans passer des heures à entraîner un modèle profond."
pros:
  - "Ultra rapide (pas de backpropagation pour le réseau profond)."
  - "Performances très élevées grâce au transfert d'apprentissage."
cons:
  - "L'extraction des features prend quelques secondes selon le nombre d'images."
hyperparameters:
  batch_size: "Taille du batch pour l'extraction (ex: 32)."
code_template: |
  import pandas as pd
  import numpy as np
  import time
  from PIL import Image
  try:
      import torch
      import torch.nn as nn
      import torchvision.models as models
      import torchvision.transforms as transforms
      from torch.utils.data import Dataset, DataLoader
      from sklearn.linear_model import LogisticRegression
  except ImportError:
      torch = None
      print("[ERREUR] torch, torchvision ou scikit-learn ne sont pas installés.")

  # [PARAM: BATCH_SIZE | number]
  BATCH_SIZE = 32
  # [/PARAM]

  print(f"[MODEL] Démarrage de la classification ultra-rapide (Feature Extraction)...")

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      start_time = time.time()
      
      # Transform standard pour les modèles pré-entraînés ImageNet
      preprocess = transforms.Compose([
          transforms.Resize(256),
          transforms.CenterCrop(224),
          transforms.ToTensor(),
          transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225]),
      ])
      
      class ImagePathDataset(Dataset):
          def __init__(self, paths):
              self.paths = list(paths)
          def __len__(self):
              return len(self.paths)
          def __getitem__(self, idx):
              path = self.paths[idx]
              try:
                  img = Image.open(path).convert('RGB')
                  return preprocess(img)
              except:
                  # Retourne une image noire en cas d'erreur
                  return torch.zeros((3, 224, 224))
      
      # Préparation des chemins
      if isinstance(X_train, pd.DataFrame):
          train_paths = X_train[X_train.columns[0]].values
          test_paths = X_test[X_test.columns[0]].values
      elif isinstance(X_train, pd.Series):
          train_paths = X_train.values
          test_paths = X_test.values
      else:
          train_paths = list(X_train)
          test_paths = list(X_test)
          
      train_dataset = ImagePathDataset(train_paths)
      test_dataset = ImagePathDataset(test_paths)
      
      train_loader = DataLoader(train_dataset, batch_size=int(BATCH_SIZE), shuffle=False)
      test_loader = DataLoader(test_dataset, batch_size=int(BATCH_SIZE), shuffle=False)
      
      # Chargement du modèle MobileNetV2 pré-entraîné
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      print(f"[MODEL] Chargement de MobileNetV2 sur {device}...")
      weights = models.MobileNet_V2_Weights.IMAGENET1K_V1
      model = models.mobilenet_v2(weights=weights)
      
      # Remplacer la tête de classification par une couche Identity pour juste récupérer les features (1280 dimensions)
      model.classifier = nn.Identity()
      model = model.to(device)
      model.eval()
      
      def extract_features(loader):
          features = []
          with torch.no_grad():
              for i, batch in enumerate(loader):
                  batch = batch.to(device)
                  out = model(batch)
                  features.append(out.cpu().numpy())
                  if (i+1) % 10 == 0:
                      print(f"        Extraction en cours... {i+1}/{len(loader)} batches")
          return np.vstack(features)
      
      print(f"[MODEL] Extraction des features pour le train set ({len(train_paths)} images)...")
      X_train_features = extract_features(train_loader)
      
      print(f"[MODEL] Extraction des features pour le test set ({len(test_paths)} images)...")
      X_test_features = extract_features(test_loader)
      
      print(f"[MODEL] Entraînement de la Régression Logistique sur les caractéristiques extraites...")
      classifier = LogisticRegression(max_iter=1000, n_jobs=-1, solver='lbfgs')
      classifier.fit(X_train_features, y_train)
      
      print(f"[MODEL] Prédiction sur le test set...")
      y_pred = classifier.predict(X_test_features)
      
      model_instance = classifier
      duration = time.time() - start_time
      print(f"[MODEL] Processus terminé en {duration:.2f}s !")
  else:
      print("[AVERTISSEMENT] X_train, y_train, ou X_test manquants, ou torch non disponible.")

