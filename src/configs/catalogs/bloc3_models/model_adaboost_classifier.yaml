id: "model_adaboost_classifier"
name: "Model: AdaBoost Classifier"
description: |
  Algorithme Adaptive Boosting (AdaBoost). Il construit une séquence d'arbres très courts (souvent des "stumps" de profondeur 1) où chaque nouvel arbre tente de corriger les erreurs des arbres précédents en augmentant le poids des observations mal classifiées.
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Privilégié pour construire un modèle fort à partir d'estimateurs très faibles, particulièrement efficace sur des jeux de données relativement propres sans trop de bruit, pour des tâches de classification binaire ou multiclasse.
use_cases:
  - "Détection de visages ou d'objets dans des images (ex: algorithme de Viola-Jones)."
  - "Classification de données tabulaires générales avec des frontières de décision complexes."
  - "Création de baselines robustes avant d'explorer des modèles de boosting plus lourds."
pros:
  - "Moins sujet au surapprentissage (overfitting) que d'autres méthodes de boosting sur de nombreux jeux de données."
  - "Très peu de paramètres à ajuster par rapport à d'autres algorithmes d'ensemble."
  - "Approche élégante combinant des modèles simples pour obtenir une haute précision."
cons:
  - "Très sensible aux valeurs aberrantes (outliers) et au bruit, car il va se focaliser excessivement sur ces points."
  - "Souvent surpassé en performance pure par les algorithmes de gradient boosting modernes (XGBoost, LightGBM)."
  - "Entraînement purement séquentiel difficilement parallélisable."
hyperparameters:
  n_estimators: "Nombre d'estimateurs (ex: 50)."
  learning_rate: "Poids appliqué à chaque estimateur (ex: 1.0)."
math_theory: |
  L'algorithme AdaBoost construit séquentiellement un ensemble pondéré de classifieurs faibles (souvent des arbres de décision de profondeur 1). À chaque itération, le poids des observations mal classées est augmenté pour forcer l'arbre suivant à se concentrer sur elles. La prédiction finale $\textcolor{#8b5cf6}{H(x)}$ est un vote pondéré :
  
  $$
  \textcolor{#8b5cf6}{H(x)} = \text{sign}\left( \sum_{t=1}^{T} \textcolor{#3b82f6}{\alpha_t} \textcolor{#10b981}{h_t}(x) \right) 
  $$
  
  Où $\textcolor{#10b981}{h_t}(x)$ est la prédiction de l'arbre $t$ (-1 ou 1), et $\textcolor{#3b82f6}{\alpha_t}$ est son "poids de vote", inversement proportionnel à son taux d'erreur pondéré $\textcolor{#ef4444}{\epsilon_t}$ :
  
  $$
  \textcolor{#3b82f6}{\alpha_t} = \frac{1}{2} \ln \left( \frac{1 - \textcolor{#ef4444}{\epsilon_t}}{\textcolor{#ef4444}{\epsilon_t}} \right) 
  $$
  
  Après chaque arbre, les poids des échantillons $\textcolor{#fbbf24}{w_i}$ sont mis à jour (augmentés si l'observation est mal classée) :
  
  $$
  \textcolor{#fbbf24}{w_i}^{(t+1)} = \textcolor{#fbbf24}{w_i}^{(t)} \exp \left( -\textcolor{#3b82f6}{\alpha_t} y_i \textcolor{#10b981}{h_t}(x_i) \right) 
  $$
