id: "model_vader_sentiment"
name: "Model: VADER Sentiment Analyzer"
description: |
  Valence Aware Dictionary and sEntiment Reasoner (VADER). Modèle NLP basé sur un lexique et des règles (heuristiques), spécifiquement optimisé pour analyser l'intensité et la polarité des sentiments exprimés dans des textes informels (comme ceux des réseaux sociaux).
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "sentiment", "nltk", "pretrained"]
applies_to: ["Texte"]
when_to_use: |
  À utiliser pour analyser rapidement (Zero-Shot) le sentiment de textes courts et informels (tweets, avis clients, commentaires) contenant potentiellement des émojis, de l'argot, des majuscules ou une ponctuation expressive, sans avoir besoin d'entraîner un modèle.
use_cases:
  - "Analyse de sentiment sur les réseaux sociaux (ex: X/Twitter, Reddit, Facebook)."
  - "Évaluation instantanée de la satisfaction client via des avis produits ou des retours d'utilisateurs."
  - "Génération d'un score de polarité ('compound score') à utiliser comme nouvelle variable dans un autre modèle prédictif."
  - "Surveillance en temps réel (monitoring) pour déclencher des alertes sur des pics de sentiments négatifs."
pros:
  - "Utilisable immédiatement sans aucun entraînement préalable (Zero-Shot) et extrêmement rapide en inférence."
  - "Gère nativement les spécificités du web : émojis, abréviations, majuscules, répétitions de ponctuation (!!!)."
  - "Fournit un score global normalisé ('compound') très pratique allant de -1 (extrêmement négatif) à +1 (extrêmement positif)."
cons:
  - "Nativement conçu et optimisé uniquement pour l'anglais ; nécessite une traduction préalable pour les autres langues."
  - "Performance inférieure aux modèles de langage (LLM/Transformers) sur des textes complexes, longs ou très sarcastiques."
  - "Étant basé sur des lexiques et des règles fixes, il manque de compréhension sémantique contextuelle profonde."
hyperparameters:
  text_col: "Nom de la colonne contenant le texte brut (si DataFrame en entrée)."
math_theory: |
  VADER (Valence Aware Dictionary and sEntiment Reasoner) combine un lexique riche avec des règles heuristiques spécifiques (majuscules, ponctuation, modificateurs de degré).
  Pour chaque mot évalué, un score de valence empirique $\textcolor{#3b82f6}{v}_i$ est ajusté par des amplificateurs/réducteurs $\textcolor{#fbbf24}{h}_i$ (ex: MAJUSCULES, "!!!").
  La somme totale des valences ajustées est $x = \sum (\textcolor{#3b82f6}{v}_i + \textcolor{#fbbf24}{h}_i)$.
  Le score final composé $\textcolor{#ef4444}{C}$ est normalisé entre -1 et +1 en utilisant une constante de normalisation $\textcolor{#8b5cf6}{\alpha}$ (typ. $\textcolor{#8b5cf6}{\alpha} = 15$) :
  $$ \textcolor{#ef4444}{C} = \frac{x}{\sqrt{x^2 + \textcolor{#8b5cf6}{\alpha}}} $$
