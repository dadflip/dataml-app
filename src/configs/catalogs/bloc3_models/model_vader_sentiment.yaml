id: "model_vader_sentiment"
name: "Model: VADER Sentiment Analyzer"
description: "Modèle NLP pré-entraîné basé sur des règles lexicographiques, optimisé pour les sentiments sur les réseaux sociaux."
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "sentiment", "nltk", "pretrained"]
applies_to: ["Texte"]
when_to_use: "Pour obtenir un score de sentiment (-1 à 1) instantané sans aucune donnée d'entraînement."
pros:
  - "Aucun entraînement requis (Zero-Shot)."
  - "Très rapide et gère les émojis, majuscules et ponctuations."
cons:
  - "Principalement conçu pour l'anglais."
hyperparameters:
  text_col: "Nom de la colonne contenant le texte brut (si DataFrame en entrée)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import nltk
      from nltk.sentiment.vader import SentimentIntensityAnalyzer
  except ImportError:
      nltk = None
      print("[ERREUR] nltk n'est pas installé. Lancez : !pip install nltk")

  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
illustration_mermaid: |
    graph TD
      In([Raw Text]) --> Token(VADER Tokenization)
      Token --> Lexicon(VADER Lexicon lookup)
      Lexicon --> Rule(Heuristics: Caps, Punctuation, Modifiers)
      Rule --> Score(Compute Compound Score)
      Score --> Out([Sentiment Score -1 to 1])
      
      style In fill:#f8fafc,stroke:#94a3b8,stroke-width:2px
      style Token fill:#38bdf8,stroke:#0284c7,stroke-width:2px,color:#fff
      style Lexicon fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Rule fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff
      style Out fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

_metadata:
  bloc: 3
  section: "3_nlp_and_timeseries"
