id: "model_tesseract_ocr"
name: "Model: Tesseract OCR (Pytesseract)"
description: |
  Moteur de reconnaissance optique de caractères (OCR) open-source classique initialement développé par HP et maintenant maintenu par Google. Conçu pour extraire du texte imprimé à partir d'images propres.
category: "Vision par Ordinateur (OCR)"
tags: ["model", "vision", "ocr", "tesseract", "pytesseract"]
applies_to: ["Images"]
when_to_use: |
  Pour numériser massivement des documents scannés très propres, des factures, des formulaires ou des PDF avec un fond clair et un contraste élevé (noir sur blanc).
use_cases:
  - "Numérisation et archivage d'anciens documents administratifs imprimés."
  - "Extraction de données textuelles depuis des factures, reçus ou tickets de caisse standardisés."
  - "Indexation automatique du contenu textuel de bibliothèques d'images ou de PDF."
pros:
  - "Très rapide, ne nécessite pas de GPU et fonctionne très bien sur processeur (CPU)."
  - "Totalement open-source, sans coûts d'API, avec une multitude de langues supportées."
  - "Excellente précision sur des documents scannés avec une bonne résolution (typique: 300 DPI)."
cons:
  - "Mauvaises performances sur des images naturelles (photos en situation), floues ou à faible contraste."
  - "Nécessite souvent de lourds prétraitements d'images (binarisation, redressement) en amont."
  - "L'installation peut être complexe car elle exige le binaire système Tesseract en plus du package Python."
hyperparameters:
  lang: "Langue principale (ex: 'fra' pour français, 'eng' pour anglais)."
math_theory: |
  Tesseract v4+ repose sur des réseaux LSTM et la fonction de perte CTC (Connectionist Temporal Classification) pour l'alignement sans segmentation explicite.
  Soit $\textcolor{#3b82f6}{Y}$ la matrice des probabilités de sortie du LSTM sur $\textcolor{#fbbf24}{T}$ pas de temps.
  La probabilité d'un alignement spécifique $\textcolor{#10b981}{\pi}$ de caractères (avec des caractères blancs) est :
  $$ P(\textcolor{#10b981}{\pi} | \textcolor{#3b82f6}{Y}) = \prod_{t=1}^{\textcolor{#fbbf24}{T}} \textcolor{#3b82f6}{y}_{\textcolor{#10b981}{\pi}_t}^t $$
  La probabilité globale pour la séquence cible finale $\textcolor{#ef4444}{L}$ correspond à la somme des probabilités de tous les chemins $\textcolor{#10b981}{\pi}$ valides qui se réduisent à $\textcolor{#ef4444}{L}$ (via une fonction $\Phi$) :
  $$ P(\textcolor{#ef4444}{L} | \textcolor{#3b82f6}{Y}) = \sum_{\textcolor{#10b981}{\pi} \in \Phi(\textcolor{#ef4444}{L})} P(\textcolor{#10b981}{\pi} | \textcolor{#3b82f6}{Y}) $$
  Le modèle est entraîné en minimisant la perte de log-vraisemblance négative :
  $$ \textcolor{#8b5cf6}{\mathcal{L}_{CTC}} = -\log P(\textcolor{#ef4444}{L} | \textcolor{#3b82f6}{Y}) $$
