id: "model_tesseract_ocr"
name: "Model: Tesseract OCR (Pytesseract)"
description: "Moteur OCR open-source classique de Google. Extrait le texte d'images propres."
category: "Vision par Ordinateur (OCR)"
tags: ["model", "vision", "ocr", "tesseract", "pytesseract"]
applies_to: ["Images"]
when_to_use: "Pour numériser des documents scannés très propres, des factures ou des PDF avec fond blanc."
pros:
  - "Très rapide sur CPU."
  - "Excellent sur documents scannés propres."
cons:
  - "Mauvais sur images naturelles ou floues."
  - "Nécessite d'installer le binaire système Tesseract-OCR."
hyperparameters:
  lang: "Langue principale (ex: 'fra' pour français, 'eng' pour anglais)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import pytesseract
      from PIL import Image
  except ImportError:
      pytesseract = None
      print("[ERREUR] pytesseract n'est pas installé. Lancez : !pip install pytesseract pillow")

  # [PARAM: LANG | string]
  LANG = "fra"
