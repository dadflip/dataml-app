id: "model_tesseract_ocr"
name: "Model: Tesseract OCR (Pytesseract)"
description: "Moteur OCR open-source classique de Google. Extrait le texte d'images propres."
category: "Vision par Ordinateur (OCR)"
tags: ["model", "vision", "ocr", "tesseract", "pytesseract"]
applies_to: ["Images"]
when_to_use: "Pour numériser des documents scannés très propres, des factures ou des PDF avec fond blanc."
pros:
  - "Très rapide sur CPU."
  - "Excellent sur documents scannés propres."
cons:
  - "Mauvais sur images naturelles ou floues."
  - "Nécessite d'installer le binaire système Tesseract-OCR."
hyperparameters:
  lang: "Langue principale (ex: 'fra' pour français, 'eng' pour anglais)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import pytesseract
      from PIL import Image
  except ImportError:
      pytesseract = None
      print("[ERREUR] pytesseract n'est pas installé. Lancez : !pip install pytesseract pillow")

  # [PARAM: LANG | string]
  LANG = "fra"
  # [/PARAM]

  print(f"[MODEL] Extraction de texte via Tesseract OCR (lang={LANG})...")
  model = "Tesseract-OCR"
  full_pipeline = None
  y_pred = []
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "ocr"
  meta = {"model_name": "Tesseract OCR"}

  if 'X_test' in locals() and pytesseract is not None:
      # Assume X_test is a list of image paths or PIL Image objects
      for img_input in X_test:
          try:
              if isinstance(img_input, str):
                  img = Image.open(img_input)
              else:
                  img = img_input # Assuming it's already a PIL image
                  
              text = pytesseract.image_to_string(img, lang=LANG)
              y_pred.append(text)
          except Exception as e:
              print(f"Erreur sur l'image {img_input}: {e}")
              y_pred.append("")
              
      y_pred = np.array(y_pred)
      full_pipeline = model
      training_history = {"status": "success", "processed_images": len(y_pred)}
illustration_mermaid: |
    graph TD
      In([Input Images]) --> Pre(Image Preprocessing: Binarization / Deskew)
      Pre --> Engine(Tesseract OCR Engine)
      Engine --> Extract(Text Extraction & Layout Analysis)
      Extract --> Out([Raw Text Output])
      
      style In fill:#f8fafc,stroke:#94a3b8,stroke-width:2px
      style Pre fill:#38bdf8,stroke:#0284c7,stroke-width:2px,color:#fff
      style Engine fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Out fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff

