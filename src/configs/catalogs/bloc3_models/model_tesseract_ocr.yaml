code_template: |
  import pandas as pd
  import numpy as np
  try:
      import pytesseract
      from PIL import Image
  except ImportError:
      pytesseract = None
      print("[ERREUR] pytesseract n'est pas installé. Lancez : !pip install pytesseract pillow")

  # [PARAM: LANG | string]
  LANG = "fra"
  # [/PARAM]

  print(f"[MODEL] Extraction de texte via Tesseract OCR (lang={LANG})...")
  model = "Tesseract-OCR"
  full_pipeline = None
  y_pred = []
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "ocr"
  meta = {"model_name": "Tesseract OCR"}

  if 'X_test' in locals() and pytesseract is not None:
      # Assume X_test is a list of image paths or PIL Image objects
      for img_input in X_test:
          try:
              if isinstance(img_input, str):
                  img = Image.open(img_input)
              else:
                  img = img_input # Assuming it's already a PIL image
                  
              text = pytesseract.image_to_string(img, lang=LANG)
              y_pred.append(text)
          except Exception as e:
              print(f"Erreur sur l'image {img_input}: {e}")
              y_pred.append("")
              
      y_pred = np.array(y_pred)
      full_pipeline = model
      training_history = {"status": "success", "processed_images": len(y_pred)}
