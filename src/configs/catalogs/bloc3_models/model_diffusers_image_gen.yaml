id: "model_diffusers_image_gen"
name: "Model: Stable Diffusion Image Gen"
description: "Modèle génératif (Text-to-Image) via HuggingFace Diffusers."
category: "Vision par Ordinateur (Pré-entraînés)"
tags: ["model", "vision", "generative", "diffusers", "stable-diffusion"]
applies_to: ["Texte"]
when_to_use: "Pour générer des images à partir d'un prompt texte. Utile pour la data augmentation."
pros:
  - "Très puissant."
cons:
  - "Extrêmement lourd. Nécessite obligatoirement un bon GPU et beaucoup de VRAM."
hyperparameters:
  num_inference_steps: "Nombre d'étapes de diffusion (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np

  # [PARAM: NUM_INFERENCE_STEPS | number]
  NUM_INFERENCE_STEPS = 20
  # [/PARAM]

  print("[MODEL] Dummy export pour Stable Diffusion.")
  # Le téléchargement des poids de SD1.5/2.0 fait plusieurs Gigaoctets et fera crasher un CPU instantanément.
  # Placeholder structurel fourni pour intégration sur machines adaptées.

  model = "StableDiffusionPipeline_Placeholder"
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "text_to_image"
  meta = {"framework": "diffusers", "type": "stable_diffusion"}
  full_pipeline = model

  if 'X_test' in locals():
      # X_test contient des prompts textes
      y_pred = np.array([f"Image Gen for: {str(p)[:30]}..." for p in X_test])
      
illustration_mermaid: |
  graph TD
    subgraph Stable Diffusion Pipeline
      Prompt([Text Prompt]) --> TextEnc[CLIP Text Encoder]
      TextEnc --> TextEmb[Text Embeddings]
      
      Noise([Random Latent Noise]) --> UNet[U-Net Denoising]
      TextEmb -.-> UNet
      
      UNet --> Denoised[Denoised Latent]
      Denoised --> VAE[VAE Decoder]
      VAE --> Image([Generated Image RGB])
    end
    style Prompt fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
    style Noise fill:#e2e8f0,stroke:#64748b,stroke-width:1px
    style Image fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style UNet fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

_metadata:
  bloc: 3
  section: "4_vision_and_audio"
