id: "model_xgboost_classifier"
name: "Model: XGBoost Classifier"
description: |
  eXtreme Gradient Boosting. Implémentation ultra-optimisée de l'algorithme Gradient Boosted Trees, concevant un ensemble d'arbres de décision séquentiels où chaque arbre tente de corriger les erreurs résiduelles du précédent.
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "xgboost", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Le modèle de référence par défaut et le plus compétitif pour traiter des problèmes de classification sur des données tabulaires (hétérogènes) structurées.
use_cases:
  - "Prédiction du taux de désabonnement (Churn) d'utilisateurs."
  - "Détection de fraude sur des transactions financières."
  - "Diagnostic médical à partir de données cliniques tabulaires."
pros:
  - "Performances prédictives exceptionnelles, domine fréquemment les compétitions Kaggle."
  - "Très rapide à l'entraînement, prend en charge l'exécution sur GPU, et gère implicitement les valeurs manquantes (NaNs)."
cons:
  - "Requiert une installation tierce (package xgboost) en dehors de scikit-learn."
  - "Modèle boîte noire, moins facilement interprétable qu'un arbre de décision simple ou une régression logistique."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
  max_depth: "Profondeur maximale (ex: 6)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from xgboost import XGBClassifier
  except ImportError:
      XGBClassifier = None
      print("[ERREUR] xgboost n'est pas installé. Lancez : !pip install xgboost")

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  # [PARAM: MAX_DEPTH | number]
  MAX_DEPTH = 6
  # [/PARAM]

  print(f"[MODEL] Entraînement XGBoost (n={N_ESTIMATORS}, lr={LEARNING_RATE}, depth={MAX_DEPTH})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and XGBClassifier is not None:
      model = XGBClassifier(
          n_estimators=int(N_ESTIMATORS), 
          learning_rate=float(LEARNING_RATE), 
          max_depth=int(MAX_DEPTH),
          use_label_encoder=False,
          eval_metric='logloss',
          random_state=42
      )
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
