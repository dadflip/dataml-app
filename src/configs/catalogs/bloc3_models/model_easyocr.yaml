math_theory: |
  EasyOCR exploite une approche d'apprentissage profond en deux étapes : la détection de texte suivie de la reconnaissance de texte.
  
  1. **Détection (CRAFT)** : Character Region Awareness for Text Detection prédit des scores de région de caractère $\textcolor{#3b82f6}{S_r(p)}$ et des scores d'affinité de caractère $\textcolor{#fbbf24}{S_a(p)}$ pour chaque pixel $p$. 
  Les boîtes englobantes de texte $\textcolor{#10b981}{\mathbf{B}}$ sont dérivées en seuillant ces cartes de probabilité, ce qui permet la détection de texte non linéaire et incurvé.
  
  2. **Reconnaissance (CRNN)** : Un réseau de neurones récurrent et convolutif prend les régions de texte recadrées $\textcolor{#10b981}{\mathbf{X}_{crop}}$ en entrée. 
  Un squelette (backbone) CNN extrait des séquences de caractéristiques, qui sont ensuite passées à travers un LSTM bidirectionnel pour modéliser le contexte temporel/séquentiel :
  
  $$
  \textcolor{#8b5cf6}{\mathbf{h}_t} = \text{BiLSTM}(\text{CNN}(\textcolor{#10b981}{\mathbf{X}_{crop}}))_t 
  $$
  
  Enfin, la perte Connectionist Temporal Classification (CTC) mappe la séquence récurrente non segmentée $\textcolor{#8b5cf6}{\mathbf{h}_t}$ à la séquence de caractères cible $\textcolor{#ef4444}{\mathbf{y}}$ en maximisant la somme des probabilités sur tous les chemins d'alignement valides $\pi$ :
  
  $$
  P(\textcolor{#ef4444}{\mathbf{y}} | \mathbf{X}) = \sum_{\pi \in \mathcal{A}(\textcolor{#ef4444}{\mathbf{y}})} \prod_{t=1}^T y_{\pi_t}^t 
  $$

