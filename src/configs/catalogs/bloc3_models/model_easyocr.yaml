id: "model_easyocr"
name: "Model: EasyOCR (Optical Character Recognition)"
description: "Modèle de reconnaissance optique de caractères (OCR) basé sur le Deep Learning. Combine CRAFT pour la détection spatiale et un CRNN pour la transcription, supportant plus de 80 langues."
category: "Vision par Ordinateur (OCR)"
tags: ["model", "vision", "ocr", "easyocr", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Idéal pour l'extraction de texte dans des environnements visuellement complexes, communément appelé 'texte in-the-wild' (éclairage variable, polices variées, inclinaisons)."
use_cases:
  - "Lecture automatisée de plaques d'immatriculation ou signalisation."
  - "Extraction d'informations textuelles sur des pièces d'identité ou des passeports."
  - "Numérisation et extraction sémantique de factures et tickets de caisse."
pros:
  - "Extrêmement robuste face au bruit visuel, aux arrière-plans complexes et aux textes non alignés, surpassant souvent les OCR traditionnels."
  - "Support natif du multilinguisme au sein d'une même étape d'inférence."
cons:
  - "Empreinte mémoire et coût de calcul élevés, nécessitant quasi-obligatoirement une accélération matérielle (GPU) pour de gros volumes."
  - "Sensible à la résolution native de l'image (les images trop compressées ou floues échouent fréquemment)."
hyperparameters:
  lang_list: "Liste des langues séparées par des virgules (ex: 'fr, en')."
code_template: |
  import pandas as pd
  import numpy as np
  import json
  try:
      import easyocr
  except ImportError:
      easyocr = None
      print("[ERREUR] easyocr n'est pas installé. Lancez : !pip install easyocr")

  # [PARAM: LANG_LIST | string]
  LANG_LIST = "fr,en"
  # [/PARAM]

  print(f"[MODEL] Initialisation de EasyOCR pour les langues : {LANG_LIST}...")

  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "ocr"
  meta = {"framework": "easyocr", "type": "ocr_reader"}
  full_pipeline = None

  if 'X_test' in locals() and easyocr is not None:
      langs = [l.strip() for l in LANG_LIST.split(',')]
      reader = easyocr.Reader(langs, gpu=True)
      model = reader
      
      preds = []
      # X_test is expected to contain paths to images or arrays
      for img in X_test:
          try:
              results = reader.readtext(img)
              # results format: [(bbox, text, prob), ...]
              texts = [res[1] for res in results]
              preds.append(" ".join(texts))
          except Exception as e:
              preds.append("")
              print(f"Erreur OCR sur l'image: {e}")
              
      y_pred = np.array(preds)
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model

