id: "model_easyocr"
name: "Model: EasyOCR (Optical Character Recognition)"
description: "Reconnaissance de texte dans des images via Deep Learning. Supporte +80 langues."
category: "Vision par Ordinateur (OCR)"
tags: ["model", "vision", "ocr", "easyocr", "deep-learning"]
applies_to: ["Images"]
when_to_use: "Pour extraire le texte d'images naturelles (photos de panneaux, cartes d'identité, documents scannés)."
pros:
  - "Très robuste sur du texte en conditions réelles (contrairement à Tesseract)."
  - "Gère plusieurs langues en même temps."
cons:
  - "Assez lourd, GPU recommandé."
hyperparameters:
  lang_list: "Liste des langues séparées par des virgules (ex: 'fr, en')."
code_template: |
  import pandas as pd
  import numpy as np
  import json
  try:
      import easyocr
  except ImportError:
      easyocr = None
      print("[ERREUR] easyocr n'est pas installé. Lancez : !pip install easyocr")

  # [PARAM: LANG_LIST | string]
  LANG_LIST = "fr,en"
  # [/PARAM]

  print(f"[MODEL] Initialisation de EasyOCR pour les langues : {LANG_LIST}...")

  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "ocr"
  meta = {"framework": "easyocr", "type": "ocr_reader"}
  full_pipeline = None

  if 'X_test' in locals() and easyocr is not None:
      langs = [l.strip() for l in LANG_LIST.split(',')]
      reader = easyocr.Reader(langs, gpu=True)
      model = reader
      
      preds = []
      # X_test is expected to contain paths to images or arrays
      for img in X_test:
          try:
              results = reader.readtext(img)
              # results format: [(bbox, text, prob), ...]
              texts = [res[1] for res in results]
              preds.append(" ".join(texts))
          except Exception as e:
              preds.append("")
              print(f"Erreur OCR sur l'image: {e}")
              
      y_pred = np.array(preds)
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model

illustration_mermaid: |
  graph TD
    subgraph EasyOCR Pipeline
      In([Image File / Array]) --> Reader[EasyOCR Reader]
      Reader --> Detect[CRAFT Text Detection]
      Detect --> BBox[Bounding Boxes]
      BBox --> Recog[CRNN Text Recognition]
      Recog --> Out([Extracted Text])
    end
    style In fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
    style Out fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style Reader fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

