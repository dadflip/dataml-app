id: "model_tfidf_logreg_pipeline"
name: "Model: TF-IDF + Logistic Regression"
description: "Pipeline NLP classique : vectorisation TF-IDF suivie d'une régression logistique."
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "classification", "sklearn", "tfidf"]
applies_to: ["Texte"]
when_to_use: "Le meilleur modèle baseline pour la classification de texte avant d'utiliser du Deep Learning."
pros:
  - "Extrêmement rapide, très efficace sur des textes longs."
  - "Très robuste à l'overfitting."
cons:
  - "Ne capture pas le contexte local des mots (Bag of Words)."
hyperparameters:
  max_features: "Nombre maximum de mots dans le vocabulaire TF-IDF."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.feature_extraction.text import TfidfVectorizer
  from sklearn.linear_model import LogisticRegression
  from sklearn.pipeline import Pipeline as SklearnPipeline

  # [PARAM: MAX_FEATURES | number]
  MAX_FEATURES = 10000
  # [/PARAM]

  print(f"[MODEL] Entraînement Pipeline TF-IDF + LogReg (max_features={MAX_FEATURES})...")
  # Note: Ce modèle s'attend à recevoir une matrice 1D (Série) de texte brut, pas un df encodé.
  # Si X_train est un DataFrame, on essaie de trouver une colonne 'text'
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      X_tr_text = X_train['text'] if (isinstance(X_train, pd.DataFrame) and 'text' in X_train.columns) else X_train
      X_te_text = X_test['text'] if (isinstance(X_test, pd.DataFrame) and 'text' in X_test.columns) else X_test
      
      # Si on a plusieurs colonnes, on les concatène
      if isinstance(X_tr_text, pd.DataFrame):
          X_tr_text = X_tr_text.apply(lambda row: ' '.join(row.values.astype(str)), axis=1)
          X_te_text = X_te_text.apply(lambda row: ' '.join(row.values.astype(str)), axis=1)
          
      model = SklearnPipeline([
          ('tfidf', TfidfVectorizer(max_features=int(MAX_FEATURES))),
          ('clf', LogisticRegression(max_iter=1000, random_state=42))
      ])
      
      model.fit(X_tr_text, y_train)
      
      y_pred = model.predict(X_te_text)
      y_proba = model.predict_proba(X_te_text) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
      
      # Export
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline as ImbPipeline
          except: ImbPipeline = SklearnPipeline
          full_pipeline = ImbPipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      print("[MODEL] Modèle entraîné avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables.")
