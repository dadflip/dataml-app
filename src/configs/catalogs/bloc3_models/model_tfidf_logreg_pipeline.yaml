id: "model_tfidf_logreg_pipeline"
name: "Model: TF-IDF + Logistic Regression"
description: |
  Pipeline de Traitement du Langage Naturel (NLP) classique combinant une vectorisation TF-IDF (Term Frequency-Inverse Document Frequency) avec un modèle de classification par Régression Logistique. Ce modèle transforme d'abord les textes en vecteurs numériques basés sur la fréquence pondérée des mots, puis applique un modèle linéaire pour prédire la classe.
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "classification", "sklearn", "tfidf"]
applies_to: ["Texte"]
when_to_use: |
  Ce pipeline est la référence (baseline) incontournable pour toute tâche de classification de texte. À utiliser systématiquement en premier pour établir un niveau de performance de base avant de s'engager dans le développement de modèles Deep Learning plus coûteux et complexes (comme les Transformers).
use_cases:
  - "Classification de documents (ex: tri d'emails en spam/non-spam, catégorisation d'articles de presse)."
  - "Analyse de sentiment supervisée sur des données textuelles avec un ensemble de données annotées."
  - "Détection d'intention dans des requêtes d'utilisateurs ou des chatbots simples."
  - "Établissement d'une baseline (référence) solide et rapide avant l'exploration de méthodes NLP avancées."
pros:
  - "Extrêmement rapide à entraîner et à exécuter, même sur de très grands corpus de textes longs."
  - "Très robuste face au surapprentissage (overfitting) dans les espaces de grande dimension."
  - "Hautement interprétable : les coefficients de la régression indiquent directement le poids de chaque mot."
cons:
  - "Approche 'Bag-of-Words' (sac de mots) qui ignore l'ordre des mots et la syntaxe."
  - "Ne capture pas la sémantique profonde ni le contexte local (contrairement aux embeddings de mots)."
  - "Matrice de caractéristiques clairsemée (sparse) qui peut devenir gigantesque sur des corpus non filtrés."
hyperparameters:
  max_features: "Nombre maximum de mots dans le vocabulaire TF-IDF."
math_theory: |
  Le modèle transforme chaque texte en un vecteur $\textcolor{#3b82f6}{x}$ basé sur le score TF-IDF de ses mots.
  Pour un terme $t$ dans un document $d$, le score $\textcolor{#3b82f6}{x}_{t,d}$ est :

  $$
  \textcolor{#3b82f6}{x}_{t,d} = \text{TF}(t, d) \times \log\left(\frac{\textcolor{#fbbf24}{N}}{\text{DF}(t)}\right) 
  $$

  Où $\text{TF}$ est la fréquence du terme et $\text{DF}$ est le nombre de documents contenant $t$ parmi $\textcolor{#fbbf24}{N}$ documents.
  Ensuite, la Régression Logistique modélise la probabilité d'une classe $\textcolor{#ef4444}{y}$ via une fonction sigmoïde (ou softmax) appliquée à une combinaison linéaire des caractéristiques :

  $$
  P(\textcolor{#ef4444}{y}=1 | \textcolor{#3b82f6}{x}) = \frac{1}{1 + \exp(-(\textcolor{#8b5cf6}{w} \cdot \textcolor{#3b82f6}{x} + b))} 
  $$
