code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.neural_network import MLPRegressor

  # [PARAM: HIDDEN_LAYER_SIZES | string]
  HIDDEN_LAYER_SIZES = "100, 50"
  # [/PARAM]

  # [PARAM: ACTIVATION | string]
  ACTIVATION = "relu"
  # [/PARAM]

  # [PARAM: MAX_ITER | number]
  MAX_ITER = 200
  # [/PARAM]

  print(f"[MODEL] Entraînement MLP Regressor (layers={HIDDEN_LAYER_SIZES})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      layers = tuple(int(x.strip()) for x in HIDDEN_LAYER_SIZES.split(','))
      model = MLPRegressor(hidden_layer_sizes=layers, activation=ACTIVATION, max_iter=int(MAX_ITER), random_state=42)
      
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "n_iter": model.n_iter_, "loss": float(model.loss_)}
      task_type = "regression"
      print("[MODEL] MLP Regressor entraîné avec succès.")
  else:
      print("[ERREUR] Données d'entraînement introuvables.")
