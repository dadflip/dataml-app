id: "model_mlp_regressor"
name: "Model: Multi-Layer Perceptron (Regressor)"
description: "Modèle de réseau de neurones artificiels (Multi-Layer Perceptron) entièrement connecté implémenté via Scikit-Learn, conçu spécifiquement pour les tâches de régression."
category: "Réseaux de Neurones"
tags: ["model", "regression", "tabular", "sklearn", "mlp", "neural-network"]
applies_to: ["Tabulaire"]
when_to_use: "Indiqué comme solution de base (baseline) robuste pour modéliser des relations continues complexes et non linéaires, avant d'envisager des architectures PyTorch plus complexes."
use_cases:
  - "Prévision de variables continues telles que des prix de l'immobilier, ou des volumes de ventes."
  - "Modélisation de processus physiques ou industriels complexes capturés par des capteurs."
  - "Estimation de durées ou de coûts avec de nombreuses variables d'entrée interdépendantes."
pros:
  - "Ne requiert pas de bibliothèques externes lourdes, s'intègre parfaitement aux pipelines Scikit-Learn."
  - "Flexible et capable d'approximer n'importe quelle fonction continue (théorème d'approximation universelle)."
cons:
  - "L'absence d'accélération GPU rend l'entraînement prohibitif sur de très grands jeux de données."
  - "Hyperparamètres nécessitant un réglage fin sous peine de tomber dans des minima locaux ou de surapprendre (overfitting)."
hyperparameters:
  hidden_layer_sizes: "Tailles des couches (ex: '100, 50')."
  activation: "Fonction d'activation ('relu', 'tanh', 'logistic')."
  max_iter: "Nombre max d'époques (ex: 200)."
math_theory: |
  Pour la régression, le Perceptron Multicouche (MLP) propage les caractéristiques d'entrée $\textcolor{#fbbf24}{x}$ à travers des couches cachées :
  $$
  \textcolor{#10b981}{h}^{\textcolor{#10b981}{(l)}} = \textcolor{#3b82f6}{\sigma}\left( \textcolor{#8b5cf6}{W}^{\textcolor{#8b5cf6}{(l)}} \textcolor{#10b981}{h}^{\textcolor{#10b981}{(l-1)}} + \textcolor{#8b5cf6}{b}^{\textcolor{#8b5cf6}{(l)}} \right)
  $$
  Où $\textcolor{#8b5cf6}{W}^{\textcolor{#8b5cf6}{(l)}}$ et $\textcolor{#8b5cf6}{b}^{\textcolor{#8b5cf6}{(l)}}$ sont les poids et les biais, et $\textcolor{#3b82f6}{\sigma}$ est l'activation non linéaire.
  La couche finale applique une fonction identité pour produire une prédiction continue $\textcolor{#10b981}{\hat{y}}$.
  Le processus d'entraînement minimise la perte de l'erreur quadratique moyenne (MSE) $\textcolor{#ef4444}{\mathcal{L}}$ :
  $$
  \textcolor{#ef4444}{\mathcal{L}} = \frac{1}{N} \sum_{i=1}^{N} \left( \textcolor{#fbbf24}{y}_{\textcolor{#fbbf24}{i}} - \textcolor{#10b981}{\hat{y}}_{\textcolor{#10b981}{i}} \right)^2
  $$
