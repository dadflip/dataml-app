id: "model_arima"
name: "Model: ARIMA Forecaster"
description: |
  Modèle Auto-Regressive Integrated Moving Average (ARIMA). Modèle statistique classique de référence pour la modélisation et la prévision de séries temporelles univariées, combinant autorégression, différenciation pour la stationnarité, et moyenne mobile sur les erreurs passées.
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "statsmodels", "arima"]
applies_to: ["Séries Temporelles"]
when_to_use: |
  À privilégier pour des séries temporelles univariées présentant une dépendance linéaire forte dans le temps, lorsque les données ne sont pas trop volumineuses et que l'explicabilité du modèle est primordiale.
use_cases:
  - "Prévision des ventes ou de la demande à court terme basée sur des historiques."
  - "Modélisation financière classique (ex: cours d'actions, taux de change) comme baseline."
  - "Prévision de la consommation électrique ou de métriques d'infrastructure informatique."
pros:
  - "Modèle très interprétable, reposant sur des fondations statistiques solides."
  - "Excellent pour les séries courtes où les modèles de deep learning manqueraient de données."
  - "Fournit naturellement des intervalles de confiance pour les prévisions."
cons:
  - "Nécessite que la série soit stationnaire (ou rendue stationnaire via la différenciation 'd')."
  - "Difficulté à modéliser des relations non linéaires complexes ou des dépendances à long terme."
  - "L'identification des bons paramètres (p, d, q) peut nécessiter une analyse exploratoire manuelle approfondie ou une recherche sur grille (grid search) coûteuse."
hyperparameters:
  p: "Ordre Auto-Régressif (AR)."
  d: "Ordre de Différenciation (I)."
  q: "Ordre Moyenne Mobile (MA)."
code_template: |
  import pandas as pd
  import numpy as np
  import warnings

  try:
      from statsmodels.tsa.arima.model import ARIMA
  except ImportError:
      ARIMA = None
      print("[ERREUR] statsmodels n'est pas installé. Lancez : !pip install statsmodels")

  # [PARAM: ORDER_P | number]
  ORDER_P = 1
  # [/PARAM]

  # [PARAM: ORDER_D | number]
  ORDER_D = 1
  # [/PARAM]

  # [PARAM: ORDER_Q | number]
  ORDER_Q = 1
  # [/PARAM]

  print(f"[MODEL] Entraînement ARIMA (p={ORDER_P}, d={ORDER_D}, q={ORDER_Q})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "forecasting"
  meta = {"model_name": "ARIMA"}

  if 'y_train' in locals() and 'X_test' in locals() and ARIMA is not None:
      # ARIMA typically trains on y_train natively (univariate)
      # We will use X_train as exogenous variables if available and applicable
      y_tr = np.array(y_train)
      exog_train = None
      exog_test = None
      
      if 'X_train' in locals() and hasattr(X_train, 'shape') and len(X_train.shape) == 2 and X_train.shape[1] > 0:
          exog_train = np.array(X_train)
      
      if hasattr(X_test, 'shape') and len(X_test.shape) == 2 and X_test.shape[1] > 0:
          exog_test = np.array(X_test)
      
      try:
          with warnings.catch_warnings():
              warnings.simplefilter("ignore")
              model = ARIMA(endog=y_tr, exog=exog_train, order=(int(ORDER_P), int(ORDER_D), int(ORDER_Q)))
              full_pipeline = model.fit()
              
          # Inference
          steps = len(X_test) if hasattr(X_test, '__len__') else 10
          y_pred = full_pipeline.forecast(steps=steps, exog=exog_test)
          
          training_history = {
              "status": "success", 
              "aic": float(full_pipeline.aic),
              "bic": float(full_pipeline.bic)
          }
      except Exception as e:
          print(f"[ERREUR] Erreur lors de l'entraînement ARIMA: {e}")
          training_history = {"status": "error", "error_message": str(e)}

