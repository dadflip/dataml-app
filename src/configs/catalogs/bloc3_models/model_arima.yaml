id: "model_arima"
name: "Model: ARIMA Forecaster"
description: "Autoregressive Integrated Moving Average. Modèle statistique classique pour les séries temporelles."
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "statsmodels", "arima"]
applies_to: ["Séries Temporelles"]
when_to_use: "Pour des séries temporelles univariées avec une dépendance linéaire forte dans le temps."
pros:
  - "Très interprétable."
cons:
  - "Nécessite que la série soit stationnaire."
hyperparameters:
  p: "Ordre Auto-Régressif (AR)."
  d: "Ordre de Différenciation (I)."
  q: "Ordre Moyenne Mobile (MA)."
code_template: |
  import pandas as pd
  import numpy as np
  import warnings

  try:
      from statsmodels.tsa.arima.model import ARIMA
  except ImportError:
      ARIMA = None
      print("[ERREUR] statsmodels n'est pas installé. Lancez : !pip install statsmodels")

  # [PARAM: ORDER_P | number]
  ORDER_P = 1
  # [/PARAM]

  # [PARAM: ORDER_D | number]
  ORDER_D = 1
  # [/PARAM]

  # [PARAM: ORDER_Q | number]
  ORDER_Q = 1
  # [/PARAM]

  print(f"[MODEL] Entraînement ARIMA (p={ORDER_P}, d={ORDER_D}, q={ORDER_Q})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "forecasting"
  meta = {"model_name": "ARIMA"}

  if 'y_train' in locals() and 'X_test' in locals() and ARIMA is not None:
      # ARIMA typically trains on y_train natively (univariate)
      # We will use X_train as exogenous variables if available and applicable
      y_tr = np.array(y_train)
      exog_train = None
      exog_test = None
      
      if 'X_train' in locals() and hasattr(X_train, 'shape') and len(X_train.shape) == 2 and X_train.shape[1] > 0:
          exog_train = np.array(X_train)
      
      if hasattr(X_test, 'shape') and len(X_test.shape) == 2 and X_test.shape[1] > 0:
          exog_test = np.array(X_test)
      
      try:
          with warnings.catch_warnings():
              warnings.simplefilter("ignore")
              model = ARIMA(endog=y_tr, exog=exog_train, order=(int(ORDER_P), int(ORDER_D), int(ORDER_Q)))
              full_pipeline = model.fit()
              
          # Inference
          steps = len(X_test) if hasattr(X_test, '__len__') else 10
          y_pred = full_pipeline.forecast(steps=steps, exog=exog_test)
          
          training_history = {
              "status": "success", 
              "aic": float(full_pipeline.aic),
              "bic": float(full_pipeline.bic)
          }
      except Exception as e:
          print(f"[ERREUR] Erreur lors de l'entraînement ARIMA: {e}")
          training_history = {"status": "error", "error_message": str(e)}

illustration_mermaid: |
    graph TD
      subgraph Time Series Input
        Y([y_train - Endogenous])
        X([X_train - Exogenous Optional])
      end
      
      subgraph ARIMA Process
        Y --> Diff[Differencing 'd'\nMake Stationary]
        Diff --> AR[Auto-Regressive 'p'\nPast Values]
        Diff --> MA[Moving Average 'q'\nPast Errors]
        X --> Exog[Exogenous\nVariables]
        
        AR --> Merge((Sum))
        MA --> Merge
        Exog --> Merge
      end
      
      subgraph Output
        Merge --> Fit[Fitted Model]
        Fit --> Forecast([Forecast 'steps'])
      end
      
      style AR fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style MA fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Diff fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style Exog fill:#c4b5fd,stroke:#8b5cf6,stroke-width:1px,color:#000
      style Fit fill:#a78bfa,stroke:#7c3aed,stroke-width:1px,color:#fff
      style Y fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style X fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Forecast fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

_metadata:
  bloc: 3
  section: "3_nlp_and_timeseries"
