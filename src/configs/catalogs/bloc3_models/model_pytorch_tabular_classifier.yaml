id: "model_pytorch_tabular_classifier"
name: "Model: PyTorch Deep Neural Network (Classification)"
description: |
  Réseau de neurones artificiels (DNN) profond 100% sur mesure implémenté via PyTorch pour traiter des données tabulaires complexes. Il offre une grande souplesse pour adapter l'architecture neuronale aux spécificités des problèmes de classification multidimensionnelle.
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "pytorch", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  À privilégier pour des données tabulaires volumineuses et complexes où un MLPRegressor de scikit-learn se révèle insuffisant, particulièrement lorsque vous avez besoin d'une forte capacité d'adaptation architecturale et d'une accélération matérielle (GPU/MPS).
use_cases:
  - "Détection de fraude sophistiquée nécessitant de capturer de subtiles interactions non-linéaires."
  - "Catégorisation complexe de vastes bases de données clients."
  - "Diagnostic médical automatisé reposant sur un grand volume de variables cliniques."
pros:
  - "Flexibilité architecturale totale et contrôle granulaire sur la boucle d'entraînement."
  - "Tire pleinement parti de l'accélération matérielle via GPU (CUDA, MPS)."
  - "Meilleure intégration dans un écosystème de deep learning complexe."
cons:
  - "Nécessite d'écrire et de maintenir plus de code boilerplate."
  - "Sensibilité accrue aux hyperparamètres requérant un ajustement minutieux (learning rate, architecture)."
  - "Prétraitement strict requis (mise à l'échelle indispensable)."
hyperparameters:
  hidden_layers: "Liste des tailles de couches cachées séparées par virgules (ex: '128, 64, 32')."
  epochs: "Nombre d'époques (ex: 20)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
math_theory: |
  Un réseau de neurones profond (DNN) applique une séquence de transformations affines suivies de fonctions d'activation non linéaires. Pour une couche $l$ :

  $$
  \textcolor{#3b82f6}{h^{\textcolor{#3b82f6}{(l)}}} = \sigma(\textcolor{#8b5cf6}{W^{\textcolor{#8b5cf6}{(l)}}} \textcolor{#fbbf24}{h^{\textcolor{#fbbf24}{(l-1)}}} + \textcolor{#8b5cf6}{b^{\textcolor{#8b5cf6}{(l)}}}) 
  $$

  où $\textcolor{#fbbf24}{h^{\textcolor{#fbbf24}{(0)}}} = \textcolor{#ef4444}{x}$ est l'entrée tabulaire.
  La sortie passe par une fonction Softmax pour obtenir les probabilités de classe :

  $$
  \textcolor{#10b981}{\hat{y}_c} = \frac{\exp(\textcolor{#3b82f6}{h_c^{\textcolor{#3b82f6}{(L)}}})}{\sum_{j} \exp(\textcolor{#3b82f6}{h_j^{\textcolor{#3b82f6}{(L)}}})} 
  $$

  La perte est optimisée via l'Entropie Croisée (Cross-Entropy).
