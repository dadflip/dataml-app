id: "model_pytorch_tabular_classifier"
name: "Model: PyTorch Deep Neural Network (Classification)"
description: "Réseau de neurones artificiels (DNN) profond 100% customisé écrit en PyTorch."
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "pytorch", "dnn", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Pour des données tabulaires complexes lorsque le MLPRegressor (Sklearn) ne suffit plus et que vous avez besoin de flexibilité (GPU, architectures custom)."
pros:
  - "Contrôle total sur l'architecture et la boucle d'entraînement."
  - "Exploite le GPU (CUDA/MPS)."
cons:
  - "Beaucoup de code, difficile de trouver les bons hyperparamètres."
hyperparameters:
  hidden_layers: "Liste des tailles de couches cachées séparées par virgules (ex: '128, 64, 32')."
  epochs: "Nombre d'époques (ex: 20)."
  learning_rate: "Taux d'apprentissage (ex: 0.001)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch")

  # [PARAM: HIDDEN_LAYERS | string]
  HIDDEN_LAYERS = "128, 64, 32"
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.001
  # [/PARAM]

  print(f"[MODEL] Entraînement PyTorch DNN Classifier (layers={HIDDEN_LAYERS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      # Création des DataLoaders
      dataset = TensorDataset(torch.tensor(X_tr_np, dtype=torch.float32), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=64, shuffle=True)
      
      # Construction dynamique de l'architecture
      layers = []
      in_features = X_tr_np.shape[1]
      h_sizes = [int(x.strip()) for x in HIDDEN_LAYERS.split(',') if x.strip()]
      
      for h in h_sizes:
          layers.append(nn.Linear(in_features, h))
          layers.append(nn.ReLU())
          layers.append(nn.BatchNorm1d(h)) # Optionnel mais aide beaucoup
          layers.append(nn.Dropout(0.2))
          in_features = h
          
      layers.append(nn.Linear(in_features, num_classes))
      model = nn.Sequential(*layers)
      
      device = torch.device("cuda" if torch.cuda.is_available() else "mps" if torch.backends.mps.is_available() else "cpu")
      model = model.to(device)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=float(LEARNING_RATE))
      
      model.train()
      for epoch in range(int(EPOCHS)):
          for batch_X, batch_y in loader:
              batch_X, batch_y = batch_X.to(device), batch_y.to(device)
              optimizer.zero_grad()
              outputs = model(batch_X)
              loss = criterion(outputs, batch_y)
              loss.backward()
              optimizer.step()
              
      model.eval()
      with torch.no_grad():
          X_te_t = torch.tensor(X_te_np, dtype=torch.float32).to(device)
          logits = model(X_te_t)
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
          
      feature_importances = None
      
      # Wrapper pour Pipeline
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "device": str(device), "final_loss": float(loss)}
      task_type = "classification"
      print("[MODEL] PyTorch DNN entraîné avec succès.")
  else:
      print("[ERREUR] Données ou module torch introuvables.")
