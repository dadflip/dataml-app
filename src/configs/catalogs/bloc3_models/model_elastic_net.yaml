id: "model_elastic_net"
name: "Model: ElasticNet"
description: |
  Modèle de régression linéaire qui combine les pénalités L1 (Lasso) et L2 (Ridge). Cette approche hybride permet de bénéficier à la fois de la sélection de variables (via L1 qui force certains coefficients à zéro) et de la stabilité face aux variables fortement corrélées (via L2). Elle est particulièrement efficace lorsque le nombre de variables dépasse le nombre d'observations ou en présence de multicolinéarité.
category: "Modèle"
tags: ["model", "regression", "elasticnet"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser lorsque vous travaillez avec des données contenant un grand nombre de variables explicatives, dont plusieurs peuvent être fortement corrélées. C'est un excellent choix de référence pour des modèles linéaires plus robustes que la régression simple ou la méthode Ridge seule.
use_cases:
  - "Régression sur des jeux de données à très grande dimension (par exemple, la génomique)."
  - "Modélisation financière avec des indicateurs économiques interdépendants."
  - "Sélection de caractéristiques avec maintien de groupes de variables corrélées (au lieu de n'en retenir qu'une seule comme le ferait Lasso)."
pros:
  - "Combine les forces de Ridge (stabilité) et Lasso (parcimonie)."
  - "Gère très bien la multicolinéarité en sélectionnant un groupe de variables corrélées ensemble."
  - "Performances robustes avec un grand nombre de prédicteurs (p > n)."
cons:
  - "Nécessite le réglage de deux hyperparamètres (alpha et l1_ratio) souvent coûteux en validation croisée."
  - "Repose fondamentalement sur l'hypothèse de linéarité entre les variables et la cible."
hyperparameters:
  alpha: "Force de régularisation globale."
  l1_ratio: "Ratio L1 vs L2 (0 = Ridge, 1 = Lasso)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import ElasticNet
  
  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]
  
  # [PARAM: L1_RATIO | number]
  L1_RATIO = 0.5
  # [/PARAM]
  
  print(f"[MODEL] Entraînement ElasticNet (Alpha={ALPHA}, L1_ratio={L1_RATIO})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {"framework": "sklearn", "type": "elastic_net"}
  full_pipeline = None

  if 'X_train' in locals() and 'X_test' in locals() and 'y_train' in locals():
      model = ElasticNet(alpha=float(ALPHA), l1_ratio=float(L1_RATIO), random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      try:
          y_proba = model.predict_proba(X_test)
      except Exception:
          y_proba = None
      
      if hasattr(model, "coef_"):
          if 'feature_names_out' in locals() and len(model.coef_) == len(feature_names_out):
              feature_importances = pd.Series(np.abs(model.coef_), index=feature_names_out)
          else:
              # Fallback if X_train is a dataframe
              if isinstance(X_train, pd.DataFrame):
                  feature_importances = dict(zip(X_train.columns, model.coef_))
          
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}

