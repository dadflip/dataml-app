id: "model_extra_trees_classifier"
name: "Model: Extra Trees Classifier"
description: |
  Algorithme d'ensemble basé sur les arbres de décision (Extremely Randomized Trees). Contrairement aux Forêts Aléatoires (Random Forest) qui cherchent le meilleur seuil de coupure pour chaque variable, Extra Trees choisit les seuils de manière purement aléatoire. Cette approche introduit davantage de diversité et réduit significativement la variance du modèle tout en accélérant l'entraînement.
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser lorsque le modèle Random Forest a tendance à sur-apprendre (overfitting) sur vos données d'entraînement. C'est également un excellent choix lorsque vous souhaitez un temps d'entraînement plus rapide sans sacrifier significativement la qualité prédictive.
use_cases:
  - "Classification de données de grande dimension où la recherche de seuils optimaux est trop coûteuse."
  - "Extraction rapide d'importance des variables (Feature Importance)."
  - "Modélisation de données bruitées nécessitant des modèles robustes avec une très faible variance."
pros:
  - "Temps d'entraînement plus rapide que Random Forest (pas d'optimisation locale des seuils)."
  - "Plus robuste au sur-apprentissage grâce à une variance réduite par l'aléa extrême."
  - "Performances très compétitives en sortie de boîte, sans ajustement profond."
cons:
  - "L'augmentation de l'aléa peut entraîner un biais légèrement plus élevé."
  - "Le modèle final reste difficilement interprétable (boîte noire) par rapport à un arbre unique."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
math_theory: |
  L'algorithme Extra Trees (Extremely Randomized Trees) repose sur le même principe que Random Forest (agrégation via Bootstrap ou Bagging d'arbres de décision), mais introduit une dose supplémentaire de hasard.
  
  À chaque nœud, au lieu de chercher le seuil de coupure optimal qui maximise le gain d'information pour chaque variable, Extra Trees tire un seuil $\textcolor{#8b5cf6}{s_j}$ au hasard dans l'intervalle empirique de chaque variable sélectionnée $\textcolor{#fbbf24}{X_j}$ :
  
  $$
  \textcolor{#8b5cf6}{s_j} \sim Uniforme(\min(\textcolor{#fbbf24}{X_j}), \max(\textcolor{#fbbf24}{X_j})) 
  $$
  
  Parmi ces coupures aléatoires (une par variable testée), l'algorithme sélectionne celle qui fournit la meilleure réduction d'impureté $\textcolor{#10b981}{\Delta I}$ (ex: Gini) :
  
  $$
  \textcolor{#10b981}{\Delta I} = \textcolor{#3b82f6}{I(D)} - \left( \frac{|D_{gauche}|}{|D|} \textcolor{#3b82f6}{I(D_{gauche})} + \frac{|D_{droite}|}{|D|} \textcolor{#3b82f6}{I(D_{droite})} \right) 
  $$
  
  La prédiction finale $\textcolor{#ef4444}{\hat{y}}$ est la classe majoritaire résultant du vote des $T$ arbres :
  
  $$
  \textcolor{#ef4444}{\hat{y}} = \text{mode}(\{h_1(x), h_2(x), \dots, h_T(x)\}) 
  $$
