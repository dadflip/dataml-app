id: "model_extra_trees_classifier"
name: "Model: Extra Trees Classifier"
description: "Extremely Randomized Trees. Variante du Random Forest qui choisit les points de coupure aléatoirement."
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: "Quand le Random Forest sur-apprend (overfit) ou pour une exécution plus rapide."
pros:
  - "Plus rapide à entraîner que Random Forest (ne cherche pas le seuil optimal)."
  - "Variance généralement plus faible."
cons:
  - "Biais potentiellement plus élevé que RF."
hyperparameters:
  n_estimators: "Nombre d'arbres (ex: 100)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import ExtraTreesClassifier

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  print(f"[MODEL] Entraînement Extra Trees (n_estimators={N_ESTIMATORS})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"framework": "sklearn", "type": "extra_trees_classifier"}
  full_pipeline = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = ExtraTreesClassifier(n_estimators=int(N_ESTIMATORS), n_jobs=-1, random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}

illustration_mermaid: |
  graph TD
    subgraph Extra Trees Classifier
      In([Input Features]) --> T1[Random Tree 1]
      In --> T2[Random Tree 2]
      In --> TN[Random Tree N]
      T1 --> V[Majority Vote]
      T2 --> V
      TN --> V
      V --> Out([Class Prediction])
    end
    style In fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
    style Out fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style T1 fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
    style T2 fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
    style TN fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

