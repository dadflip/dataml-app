      Preprocessor --> TreeN[Decision Tree N]
    end
    subgraph Aggregation
      Tree1 --> Vote{Majority Vote}
      Tree2 --> Vote
      TreeN --> Vote
    end
    subgraph Output
      Vote --> Pred([Predictions])
    end
    style Input fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
