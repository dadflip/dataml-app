math_theory: |
  Random Forest is a bagging (Bootstrap Aggregation) ensemble algorithm that constructs an extensive collection of deep decision trees independently. 
  
  For each tree $\textcolor{#fbbf24}{h_b}$, a bootstrap sample of the data is drawn, and at each split, a random subset of features is evaluated. This decorrelates the trees and significantly reduces the variance.
  
  The final prediction for a given input $\textcolor{#ef4444}{x}$ is determined by a majority vote across all $\textcolor{#8b5cf6}{B}$ trees in the forest:
  $$ \textcolor{#3b82f6}{\hat{y}} = \text{mode} \left\{ \textcolor{#fbbf24}{h_1}(\textcolor{#ef4444}{x}), \textcolor{#fbbf24}{h_2}(\textcolor{#ef4444}{x}), \dots, \textcolor{#fbbf24}{h_B}(\textcolor{#ef4444}{x}) \right\} $$
  
  Alternatively, for probabilistic predictions, the forest averages the class probabilities predicted by each individual tree:
  $$ P(y=c|\textcolor{#ef4444}{x}) = \frac{1}{\textcolor{#8b5cf6}{B}} \sum_{b=1}^{\textcolor{#8b5cf6}{B}} \textcolor{#10b981}{P_b}(y=c|\textcolor{#ef4444}{x}) $$
  
  Where:
  - $\textcolor{#3b82f6}{\hat{y}}$ is the final predicted class.
  - $\textcolor{#8b5cf6}{B}$ is the number of trees (`n_estimators`).
  - $\textcolor{#fbbf24}{h_b}(\textcolor{#ef4444}{x})$ is the prediction of the $b$-th decision tree.
  - $\textcolor{#10b981}{P_b}$ is the probability distribution estimated by tree $b$.

