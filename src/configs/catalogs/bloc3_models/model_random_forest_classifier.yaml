id: "model_random_forest_classifier"
name: "Model: Random Forest Classifier"
description: |
  Modèle d'ensemble fondé sur la technique des forêts aléatoires (Random Forest). Il agrège (bagging) un grand nombre d'arbres de décision construits sur des sous-échantillons de données et de variables pour stabiliser et améliorer la classification.
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble"]
applies_to: ["Tabulaire"]
when_to_use: |
  Constitue presque toujours le meilleur point de départ (baseline) incontournable lors de l'exploration initiale de tout problème de classification tabulaire, avant d'envisager des modèles plus complexes (comme les modèles de boosting ou réseaux de neurones).
use_cases:
  - "Prédiction de churn (attrition) client sur des bases de données hétérogènes."
  - "Classification de défauts industriels tolérante aux valeurs aberrantes (outliers)."
  - "Filtrage initial de variables d'importance (Feature Selection) pour des modèles en aval."
pros:
  - "Très grande robustesse au surapprentissage par rapport à un arbre de décision isolé."
  - "D'excellentes performances par défaut sans nécessiter un réglage fin et laborieux des hyperparamètres."
  - "Tolérance native aux données non linéaires, sans exiger de mise à l'échelle (scaling)."
cons:
  - "Consommation mémoire importante et temps d'inférence parfois élevé pour de très grandes forêts."
  - "Difficile à interpréter de bout en bout en raison du très grand nombre d'arbres constitutifs."
  - "Moins performant que le Gradient Boosting sur certains jeux de données complexes et asymétriques."
hyperparameters:
  n_estimators: "Nombre d'arbres dans la forêt (ex: 100)."
  max_depth: "Profondeur maximale."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import RandomForestClassifier
  from sklearn.pipeline import Pipeline

  # [PARAM: N_ESTIMATORS | int]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: MAX_DEPTH | int]
  MAX_DEPTH = 10
  # [/PARAM]

  task_type = "classification"
  meta = {
      "model_name": "Random Forest Classifier",
      "framework": "scikit-learn",
      "task_type": task_type
  }

  depth = None if int(MAX_DEPTH) <= 0 else int(MAX_DEPTH)
  model = RandomForestClassifier(n_estimators=int(N_ESTIMATORS), max_depth=depth, n_jobs=-1, random_state=42)

  if 'preprocessor' in globals() and preprocessor is not None:
      full_pipeline = Pipeline([
          ('preprocessor', preprocessor),
          ('model', model)
      ])
  else:
      full_pipeline = Pipeline([
          ('model', model)
      ])

  full_pipeline.fit(X_train, y_train)

  y_pred = full_pipeline.predict(X_test)
  y_proba = full_pipeline.predict_proba(X_test) if hasattr(full_pipeline, 'predict_proba') else None

  feature_importances = None
  if hasattr(model, 'feature_importances_'):
      if 'preprocessor' in globals() and hasattr(preprocessor, 'get_feature_names_out'):
          try:
              feature_names = preprocessor.get_feature_names_out()
              if len(feature_names) == len(model.feature_importances_):
                  feature_importances = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False).head(20).to_dict()
          except Exception:
              pass

  training_history = []
