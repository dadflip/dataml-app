id: "model_decision_tree_regressor"
name: "Model: Decision Tree Regressor"
description: "Modèle d'arbre de décision pour la régression. Segmente l'espace des descripteurs via des règles logiques et prédit en moyennant les valeurs cibles au sein de chaque feuille."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "tree"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal lorsqu'on a besoin d'un modèle non-linéaire simple et parfaitement interprétable, ou pour capturer des interactions complexes entre variables sans prétraitement complexe."
use_cases:
  - "Estimation des prix de l'immobilier basée sur des règles facilement auditables."
  - "Prédiction de la demande ou des ventes avec justification des facteurs clés."
  - "Modélisation de processus physiques avec des seuils d'activation stricts."
pros:
  - "Excellente interprétabilité grâce à une structure arborescente visuelle."
  - "Capture naturellement les effets non-linéaires et les interactions entre variables sans nécessiter de normalisation."
cons:
  - "Forte tendance au sur-apprentissage si l'arbre n'est pas élagué."
  - "Génère des prédictions en 'escalier' (constantes par morceaux), incapables d'extrapoler de manière fluide au-delà des bornes d'entraînement."
hyperparameters:
  max_depth: "Profondeur maximale de l'arbre."
  min_samples_split: "Nombre minimum d'exemples requis pour diviser un nœud."
math_theory: |
  Pour la régression, l'arbre de décision (CART) cherche à minimiser la variance (ou l'Erreur Quadratique Moyenne - MSE) au sein de chaque nœud $\textcolor{#fbbf24}{D}$.
  
  La $\textcolor{#3b82f6}{MSE}$ d'un nœud est :
  
  $$
  \textcolor{#3b82f6}{MSE}(\textcolor{#fbbf24}{D}) = \frac{1}{|\textcolor{#fbbf24}{D}|} \sum_{i \in \textcolor{#fbbf24}{D}} (y_i - \textcolor{#ef4444}{\bar{y}})^2 
  $$
  
  où $\textcolor{#ef4444}{\bar{y}} = \frac{1}{|\textcolor{#fbbf24}{D}|} \sum_{i \in \textcolor{#fbbf24}{D}} y_i$ est la moyenne des cibles dans le nœud.
  
  Le modèle choisit la variable $\textcolor{#8b5cf6}{A}$ et le seuil de coupure qui maximisent la Réduction de Variance :
  
  $$
  \textcolor{#10b981}{VarReduction} = \textcolor{#3b82f6}{MSE}(\textcolor{#fbbf24}{D}) - \left( \frac{|\textcolor{#fbbf24}{D}_{gauche}|}{|\textcolor{#fbbf24}{D}|} \textcolor{#3b82f6}{MSE}(\textcolor{#fbbf24}{D}_{gauche}) + \frac{|\textcolor{#fbbf24}{D}_{droite}|}{|\textcolor{#fbbf24}{D}|} \textcolor{#3b82f6}{MSE}(\textcolor{#fbbf24}{D}_{droite}) \right) 
  $$
  
  La prédiction finale $\hat{y}$ pour une nouvelle observation est la valeur $\textcolor{#ef4444}{\bar{y}}$ de la feuille dans laquelle elle tombe.
