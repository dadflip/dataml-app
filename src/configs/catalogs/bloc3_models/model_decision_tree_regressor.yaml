id: "model_decision_tree_regressor"
name: "Model: Decision Tree Regressor"
description: "Arbre de décision pour la régression. Prédit en segmentant l'espace et en moyennant les valeurs dans chaque feuille."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "tree"]
applies_to: ["Tabulaire"]
when_to_use: "Besoin d'un modèle non-linéaire extrêmement simple et interprétable."
pros:
  - "Capture les effets non-linéaires très facilement."
cons:
  - "Très sujet au sur-apprentissage. Prédit en 'escalier' (non continu)."
hyperparameters:
