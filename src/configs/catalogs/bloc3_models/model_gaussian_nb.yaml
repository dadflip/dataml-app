code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.naive_bayes import GaussianNB

  print(f"[MODEL] Entraînement Gaussian Naive Bayes...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"framework": "sklearn", "type": "gaussian_nb"}
  full_pipeline = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = GaussianNB()
      # NB nécessite du dense matrix
      X_train_dense = X_train.toarray() if hasattr(X_train, 'toarray') else X_train
      X_test_dense = X_test.toarray() if hasattr(X_test, 'toarray') else X_test
      
      model.fit(X_train_dense, y_train)
      
      y_pred = model.predict(X_test_dense)
      y_proba = model.predict_proba(X_test_dense) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}

illustration_mermaid: |
  graph TD
    subgraph Gaussian Naive Bayes
      In([Input Features]) --> Prior[Calculate Prior Probabilities]
      In --> Likelihood[Calculate Gaussian Likelihoods]
      Prior --> Bayes[Bayes Theorem]
      Likelihood --> Bayes
      Bayes --> Max[ArgMax Posterior]
      Max --> Out([Class Prediction])
    end
    style In fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
    style Out fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style Bayes fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff

