id: "model_gaussian_nb"
name: "Model: Gaussian Naive Bayes"
description: |
  Algorithme de classification probabiliste reposant sur le théorème de Bayes avec une forte hypothèse d'indépendance (naïve) entre les caractéristiques, et supposant que les caractéristiques continues suivent une distribution gaussienne (normale).
category: "Modèles Probabilistes"
tags: ["model", "classification", "tabular", "sklearn", "bayes"]
applies_to: ["Tabulaire"]
when_to_use: |
  Privilégiez ce modèle pour des ensembles de données ayant des caractéristiques continues où l'on peut supposer qu'elles sont indépendantes et qu'elles suivent approximativement une loi normale. Très utile pour établir une ligne de base (baseline) rapide.
use_cases:
  - "Classification de textes ou de documents (en conjonction avec des représentations continues)."
  - "Systèmes de recommandation simples."
  - "Diagnostic médical de base avec des caractéristiques continues indépendantes."
pros:
  - "Extrêmement rapide à entraîner et à évaluer."
  - "Très simple, ne nécessite pas ou peu de réglage d'hyperparamètres."
  - "Gère relativement bien de grandes dimensions avec un faible volume de données."
cons:
  - "L'hypothèse stricte d'indépendance des caractéristiques est rarement vérifiée en pratique (d'où le terme naïf)."
  - "Produit des probabilités souvent mal calibrées."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.naive_bayes import GaussianNB

  print(f"[MODEL] Entraînement Gaussian Naive Bayes...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"framework": "sklearn", "type": "gaussian_nb"}
  full_pipeline = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = GaussianNB()
      # NB nécessite du dense matrix
      X_train_dense = X_train.toarray() if hasattr(X_train, 'toarray') else X_train
      X_test_dense = X_test.toarray() if hasattr(X_test, 'toarray') else X_test
      
      model.fit(X_train_dense, y_train)
      
      y_pred = model.predict(X_test_dense)
      y_proba = model.predict_proba(X_test_dense) if hasattr(model, 'predict_proba') else None
      
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}

