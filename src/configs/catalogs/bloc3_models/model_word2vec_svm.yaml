id: "model_word2vec_svm"
name: "Model: Word2Vec + SVM (Spacy)"
description: |
  Pipeline hybride de Traitement du Langage Naturel (NLP) qui utilise les plongements lexicaux denses (Word Embeddings) pré-entraînés via spaCy, suivis d'un algorithme de classification Support Vector Machine (SVM) linéaire pour prédire des classes.
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "classification", "spacy", "word2vec", "embeddings", "svm"]
applies_to: ["Texte"]
when_to_use: |
  À privilégier lorsque la sémantique et le contexte global du texte sont plus informatifs que la simple occurrence ou fréquence des mots (comme le ferait TF-IDF ou Bag-of-Words).
use_cases:
  - "Analyse de sentiment sur des avis clients nuancés."
  - "Catégorisation d'articles d'actualité basés sur le sens profond."
  - "Détection de spam ou de messages toxiques."
pros:
  - "Capture avec succès le contexte et la proximité sémantique des mots (via l'embedding Word2Vec)."
  - "Souvent plus robuste face aux synonymes et aux mots rares par rapport aux approches symboliques."
cons:
  - "Nécessite le téléchargement d'un modèle lourd spaCy (ex: 'en_core_web_md' ou 'fr_core_news_md')."
  - "Les performances plafonnent face aux architectures Transformers (BERT, RoBERTa)."
hyperparameters:
  spacy_model: "Nom du modèle spaCy (ex: 'en_core_web_md')."
math_theory: |
  Le modèle représente chaque mot par un vecteur d'embedding dense $\textcolor{#3b82f6}{v}_i$ (Word2Vec) de dimension $d$.
  Pour une phrase d'entrée $\textcolor{#10b981}{X}$ contenant $\textcolor{#fbbf24}{T}$ mots, la représentation globale du document $\textcolor{#8b5cf6}{h}$ est la moyenne des embeddings :
  $$ \textcolor{#8b5cf6}{h} = \frac{1}{\textcolor{#fbbf24}{T}} \sum_{i=1}^{\textcolor{#fbbf24}{T}} \textcolor{#3b82f6}{v}_i $$
  Un classifieur SVM linéaire recherche ensuite l'hyperplan optimal défini par un vecteur normal $\textcolor{#ef4444}{w}$ et un biais $b$ qui sépare les classes avec la plus grande marge.
  La décision de classe $\hat{y} \in \{-1, 1\}$ est donnée par le signe de la fonction de décision :
  $$ \hat{y} = \text{sign}(\textcolor{#ef4444}{w} \cdot \textcolor{#8b5cf6}{h} + b) $$
