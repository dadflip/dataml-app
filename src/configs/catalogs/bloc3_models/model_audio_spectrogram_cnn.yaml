id: "model_audio_spectrogram_cnn"
name: "Model: Audio Spectrogram CNN"
description: "Convertit l'audio en image (spectrogramme Mel) puis le classifie avec un CNN 2D PyTorch."
category: "Multimédia & Audio"
tags: ["model", "audio", "classification", "pytorch", "cnn", "spectrogram"]
applies_to: ["Audio"]
when_to_use: "Quand vous voulez créer un modèle audio custom depuis zéro (ex: détection d'aboiements)."
pros:
  - "Plus léger que Wav2Vec2."
cons:
  - "Nécessite le package librosa."
hyperparameters:
  epochs: "Nombre d'époques d'entraînement (ex: 5)."
code_template: |
  import numpy as np
  import pandas as pd
  import sys
  
  # [PARAM: EPOCHS | number]
  EPOCHS = 5
  # [/PARAM]
  
  print(f"[MODEL] Entraînement Audio Spectrogram CNN (epochs={EPOCHS})...")
  
  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "Audio Spectrogram CNN"}

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import TensorDataset, DataLoader
      import librosa
  except ImportError as e:
      print(f"[ERREUR] Packages manquants pour Audio CNN: {e}. Installez torch, torchvision, librosa.")
      torch = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      # Assume X_train is a list of 1D numpy arrays (audio signals) or a 2D numpy array (samples, time)
      # We convert them to Mel spectrograms
      def audio_to_mel(audio_data, sr=22050, n_mels=128):
          mels = []
          for sig in audio_data:
              # if sig is already 2D or 3D, we might just reshape
              if isinstance(sig, np.ndarray) and sig.ndim >= 2:
                  # Force resize/pad or assume already spectrogram
                  pass
              else:
                  # Convert to mel spectrogram
                  S = librosa.feature.melspectrogram(y=np.array(sig, dtype=float), sr=sr, n_mels=n_mels)
                  S_dB = librosa.power_to_db(S, ref=np.max)
                  mels.append(S_dB)
          
          if len(mels) == 0:
              return np.array([])
              
          # Pad or truncate to max length for batching
          max_len = max(m.shape[1] for m in mels)
          mels_padded = np.array([np.pad(m, ((0, 0), (0, max_len - m.shape[1]))) for m in mels])
          # Shape: (batch, n_mels, time) -> add channel dim for CNN -> (batch, 1, n_mels, time)
          return np.expand_dims(mels_padded, axis=1)

      print("[MODEL] Conversion de l'audio en spectrogrammes Mel...")
      X_tr_mel = audio_to_mel(X_train)
      X_te_mel = audio_to_mel(X_test)
      
      # Determine num_classes
      labels_tr = np.array(y_train)
      unique_classes = np.unique(labels_tr)
      num_classes = len(unique_classes)
      
      # Map labels to 0..C-1
      label_map = {lbl: i for i, lbl in enumerate(unique_classes)}
      y_tr_mapped = np.array([label_map[l] for l in labels_tr])
      
      X_tensor = torch.tensor(X_tr_mel, dtype=torch.float32)
      y_tensor = torch.tensor(y_tr_mapped, dtype=torch.long)
      
      dataset = TensorDataset(X_tensor, y_tensor)
      loader = DataLoader(dataset, batch_size=32, shuffle=True)
      
      class AudioCNN(nn.Module):
          def __init__(self, num_classes):
              super(AudioCNN, self).__init__()
              self.conv1 = nn.Conv2d(1, 16, kernel_size=3, padding=1)
              self.pool = nn.MaxPool2d(2, 2)
              self.conv2 = nn.Conv2d(16, 32, kernel_size=3, padding=1)
              self.fc1 = nn.Linear(32 * (X_tr_mel.shape[2] // 4) * (X_tr_mel.shape[3] // 4), 128)
              self.fc2 = nn.Linear(128, num_classes)
              self.relu = nn.ReLU()
              self.dropout = nn.Dropout(0.3)
              
          def forward(self, x):
              x = self.pool(self.relu(self.conv1(x)))
              x = self.pool(self.relu(self.conv2(x)))
              x = x.view(x.size(0), -1)
              x = self.relu(self.fc1(x))
              x = self.dropout(x)
              x = self.fc2(x)
              return x

      device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
      try:
          model = AudioCNN(num_classes).to(device)
      except Exception as e:
          # If dimension calculation fails due to variable length, fallback to adaptive pooling
          class AdaptiveAudioCNN(nn.Module):
              def __init__(self, num_classes):
                  super(AdaptiveAudioCNN, self).__init__()
                  self.conv1 = nn.Conv2d(1, 16, kernel_size=3, padding=1)
                  self.pool = nn.MaxPool2d(2, 2)
                  self.conv2 = nn.Conv2d(16, 32, kernel_size=3, padding=1)
                  self.adapt_pool = nn.AdaptiveAvgPool2d((4, 4))
                  self.fc1 = nn.Linear(32 * 4 * 4, 128)
                  self.fc2 = nn.Linear(128, num_classes)
                  self.relu = nn.ReLU()
                  
              def forward(self, x):
                  x = self.pool(self.relu(self.conv1(x)))
                  x = self.pool(self.relu(self.conv2(x)))
                  x = self.adapt_pool(x)
                  x = x.view(x.size(0), -1)
                  x = self.relu(self.fc1(x))
                  x = self.fc2(x)
                  return x
          model = AdaptiveAudioCNN(num_classes).to(device)
          
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      
      print("[MODEL] Entraînement du modèle PyTorch...")
      model.train()
      for epoch in range(int(EPOCHS)):
          running_loss = 0.0
          for inputs, labels in loader:
              inputs, labels = inputs.to(device), labels.to(device)
              optimizer.zero_grad()
              outputs = model(inputs)
              loss = criterion(outputs, labels)
              loss.backward()
              optimizer.step()
              running_loss += loss.item()
              
      # Inference
      model.eval()
      X_te_tensor = torch.tensor(X_te_mel, dtype=torch.float32)
      test_dataset = TensorDataset(X_te_tensor)
      test_loader = DataLoader(test_dataset, batch_size=32, shuffle=False)
      
      all_preds = []
      all_probs = []
      with torch.no_grad():
          for (inputs,) in test_loader:
              inputs = inputs.to(device)
              outputs = model(inputs)
              probs = torch.softmax(outputs, dim=1)
              _, preds = torch.max(outputs, 1)
              all_preds.extend(preds.cpu().numpy())
              all_probs.extend(probs.cpu().numpy())
              
      # Reverse mapping
      inv_label_map = {v: k for k, v in label_map.items()}
      y_pred = np.array([inv_label_map[p] for p in all_preds])
      y_proba = np.array(all_probs)
      
      full_pipeline = model
      training_history = {"status": "success", "epochs_trained": int(EPOCHS)}

