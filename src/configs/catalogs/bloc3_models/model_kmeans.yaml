id: "model_kmeans"
name: "Model: K-Means Clustering"
description: "Algorithme d'apprentissage non-supervisé de partitionnement de données. Il regroupe les observations en K clusters homogènes en minimisant la variance intra-cluster (inertie)."
category: "Clustering (Non-Supervisé)"
tags: ["model", "clustering", "tabular", "sklearn", "kmeans", "unsupervised"]
applies_to: ["Tabulaire"]
when_to_use: "À utiliser pour segmenter une population, identifier des profils types ou réduire la complexité d'un grand ensemble de données lorsque aucune variable cible (y) n'est disponible."
use_cases:
  - "Segmentation marketing : Regroupement de clients ayant des comportements d'achat similaires."
  - "Compression d'image (Quantification) : Réduction du nombre de couleurs dans une image."
  - "Détection de signaux faibles : Identification de groupes minoritaires au sein d'une large population."
pros:
  - "Implémentation extrêmement rapide et passage à l'échelle très efficace sur de grands volumes de données."
  - "Résultats très intuitifs et faciles à interpréter visuellement en 2D ou 3D."
cons:
  - "Nécessite la définition préalable du nombre de clusters (K), souvent via la méthode du coude ou le score de silhouette."
  - "Très sensible à l'échelle des variables (standardisation requise) et à la présence de valeurs aberrantes (outliers)."
  - "Ne gère que des clusters de forme sphérique (convexe), peinant sur des structures géométriques complexes."
hyperparameters:
  n_clusters: "Nombre de clusters K à former (ex: 3)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.cluster import KMeans

  # [PARAM: N_CLUSTERS | number]
  N_CLUSTERS = 3
  # [/PARAM]

  print(f"[MODEL] Entraînement K-Means (k={N_CLUSTERS})...")
  # K-Means est non-supervisé, il n'a pas besoin de y_train
  if 'X_train' in locals() and 'X_test' in locals():
      model = KMeans(n_clusters=int(N_CLUSTERS), random_state=42, n_init="auto")
      model.fit(X_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      feature_importances = None
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "inertia": float(model.inertia_)}
      task_type = "clustering"
      meta = {}
