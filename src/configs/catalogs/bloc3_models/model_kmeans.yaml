math_theory: |
  $$
  J = \sum_{\textcolor{#3b82f6}{k}=1}^{\textcolor{#10b981}{K}} \sum_{x \in C_{\textcolor{#3b82f6}{k}}} || x - \textcolor{#fbbf24}{\mu}_{\textcolor{#3b82f6}{k}} ||^2 
  $$
  
  Où :
  - $\textcolor{#10b981}{K}$ est le nombre total de clusters.
  - $C_{\textcolor{#3b82f6}{k}}$ représente l'ensemble des points assignés au cluster $\textcolor{#3b82f6}{k}$.
  - $\textcolor{#fbbf24}{\mu}_{\textcolor{#3b82f6}{k}}$ est le centroïde (la moyenne) du cluster $\textcolor{#3b82f6}{k}$.
  - L'objectif est de minimiser l'inertie $J$, qui est la somme des distances au carré entre chaque point $x$ et le centroïde de son cluster.
