id: "model_opencv_face_cascade"
name: "Model: OpenCV Face Detection (Haar Cascade)"
description: |
  Ce modèle utilise la méthode de Viola-Jones implémentée via les classifieurs en cascade de Haar d'OpenCV. Il s'agit d'une approche classique de détection d'objets, particulièrement optimisée pour la détection de visages frontaux, utilisant des caractéristiques rectangulaires simples et une structure en cascade pour un rejet rapide des régions négatives.
category: "Vision par Ordinateur (Pré-entraînés)"
tags: ["model", "vision", "object-detection", "opencv", "face", "cascade"]
applies_to: ["Images"]
when_to_use: |
  Idéal pour des applications temps-réel sur des environnements avec de fortes contraintes matérielles (comme l'IoT, les microcontrôleurs avancés ou les vieux CPU) où l'utilisation de réseaux de neurones profonds est impossible. Fonctionne mieux lorsque les visages sont face à la caméra, bien éclairés et sans occlusions majeures.
use_cases:
  - "Détection de présence basique pour l'activation d'interfaces interactives (ex: miroirs intelligents)."
  - "Cadrage automatique et suivi du visage dans des applications de visioconférence légères."
  - "Comptage d'audience rudimentaire dans des conditions d'éclairage contrôlées."
pros:
  - "Extrêmement rapide, capable de traiter la vidéo en temps réel même sur des processeurs peu performants."
  - "Très léger en termes de dépendances, ne nécessitant que la bibliothèque OpenCV (pas de PyTorch ou TensorFlow)."
  - "Simple à configurer et les fichiers XML pré-entraînés sont immédiatement disponibles dans OpenCV."
cons:
  - "Performances médiocres sur les visages de profil, de trois-quarts, ou inclinés."
  - "Très sensible aux variations d'éclairage, aux ombres dures et aux occlusions (lunettes de soleil, masques, barbe épaisse)."
  - "Génère davantage de faux positifs que les modèles modernes basés sur le Deep Learning (ex: MTCNN, YOLO, RetinaFace)."
hyperparameters:
  scale_factor: "Paramètre de mise à l'échelle (ex: 1.1)."
  min_neighbors: "Nombre minimum de voisins (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  import json
  from sklearn.base import BaseEstimator, TransformerMixin
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  try:
      import cv2
  except ImportError:
      cv2 = None
      print("[ERREUR] opencv n'est pas installé. Lancez : !pip install opencv-python")

  # [PARAM: SCALE_FACTOR | number]
  SCALE_FACTOR = 1.1
  # [/PARAM]

  # [PARAM: MIN_NEIGHBORS | number]
  MIN_NEIGHBORS = 5
  # [/PARAM]

  print(f"[MODEL] Initialisation Détection de visages OpenCV Haar Cascades (scale={SCALE_FACTOR}, min_neighbors={MIN_NEIGHBORS})...")
  
  class HaarCascadeDetector(BaseEstimator, TransformerMixin):
      def __init__(self, scale_factor=1.1, min_neighbors=5):
          self.scale_factor = scale_factor
          self.min_neighbors = min_neighbors
          self.face_cascade = None
          
      def fit(self, X, y=None):
          if cv2 is not None:
              self.face_cascade = cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml')
          return self
          
      def predict(self, X):
          if cv2 is None or self.face_cascade is None:
              return np.array([])
          
          all_preds = []
          for img in X:
              if isinstance(img, str):
                  img_arr = cv2.imread(img)
              else:
                  img_arr = img
                  
              if img_arr is not None:
                  gray = cv2.cvtColor(img_arr.astype('uint8'), cv2.COLOR_BGR2GRAY) if len(img_arr.shape) == 3 else img_arr
                  faces = self.face_cascade.detectMultiScale(gray, scaleFactor=float(self.scale_factor), minNeighbors=int(self.min_neighbors))
                  
                  faces_list = [{"box": [int(x), int(y), int(x+w), int(y+h)], "class": "face"} for (x, y, w, h) in faces]
                  all_preds.append(json.dumps(faces_list))
              else:
                  all_preds.append("[]")
          return np.array(all_preds)

  model = HaarCascadeDetector(scale_factor=float(SCALE_FACTOR), min_neighbors=int(MIN_NEIGHBORS))

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "object_detection"
  meta = {}

  if 'X_test' in locals():
      print("[MODEL] Exécution de la détection de visages...")
      # Pseudo-fit since it's pre-trained
