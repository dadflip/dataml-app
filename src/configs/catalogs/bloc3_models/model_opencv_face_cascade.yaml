  graph TD
    A[Input Images] --> B(Preprocessing Pipeline)
    B --> C[OpenCV Haar Cascade Model]
    
    subgraph Viola-Jones Framework
        C --> D[Convert Image to Grayscale]
        D --> E[Compute Integral Image]
        E --> F[Scan Multi-Scale Windows]
        F --> G[Apply Cascaded Weak Classifiers: Haar Features]
        G --> H{Pass All Stages?}
        H -- No --> I[Discard Window]
        H -- Yes --> J[Accept as Face Region]
