id: "model_opencv_face_cascade"
name: "Model: OpenCV Face Detection (Haar Cascade)"
description: "Méthode de détection de visages classique basée sur Haar Cascades via OpenCV."
category: "Vision par Ordinateur (Pré-entraînés)"
tags: ["model", "vision", "object-detection", "opencv", "face", "cascade"]
applies_to: ["Images"]
when_to_use: "Pour détecter la présence de visages rapidement sur CPU sans réseaux de neurones complexes."
pros:
  - "Extrêmement rapide."
  - "Ne demande aucun framework lourd (juste cv2)."
cons:
  - "Mauvais sur les visages de profil ou partiellement cachés."
hyperparameters:
  scale_factor: "Paramètre de mise à l'échelle (ex: 1.1)."
  min_neighbors: "Nombre minimum de voisins (ex: 5)."
code_template: |
  import pandas as pd
  import numpy as np
  import json
  from sklearn.base import BaseEstimator, TransformerMixin
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  try:
      import cv2
  except ImportError:
      cv2 = None
      print("[ERREUR] opencv n'est pas installé. Lancez : !pip install opencv-python")

  # [PARAM: SCALE_FACTOR | number]
  SCALE_FACTOR = 1.1
  # [/PARAM]

  # [PARAM: MIN_NEIGHBORS | number]
  MIN_NEIGHBORS = 5
  # [/PARAM]

  print(f"[MODEL] Initialisation Détection de visages OpenCV Haar Cascades (scale={SCALE_FACTOR}, min_neighbors={MIN_NEIGHBORS})...")
  
  class HaarCascadeDetector(BaseEstimator, TransformerMixin):
      def __init__(self, scale_factor=1.1, min_neighbors=5):
          self.scale_factor = scale_factor
          self.min_neighbors = min_neighbors
          self.face_cascade = None
          
      def fit(self, X, y=None):
          if cv2 is not None:
              self.face_cascade = cv2.CascadeClassifier(cv2.data.haarcascades + 'haarcascade_frontalface_default.xml')
          return self
          
      def predict(self, X):
          if cv2 is None or self.face_cascade is None:
              return np.array([])
          
          all_preds = []
          for img in X:
              if isinstance(img, str):
                  img_arr = cv2.imread(img)
              else:
                  img_arr = img
                  
              if img_arr is not None:
                  gray = cv2.cvtColor(img_arr.astype('uint8'), cv2.COLOR_BGR2GRAY) if len(img_arr.shape) == 3 else img_arr
                  faces = self.face_cascade.detectMultiScale(gray, scaleFactor=float(self.scale_factor), minNeighbors=int(self.min_neighbors))
                  
                  faces_list = [{"box": [int(x), int(y), int(x+w), int(y+h)], "class": "face"} for (x, y, w, h) in faces]
                  all_preds.append(json.dumps(faces_list))
              else:
                  all_preds.append("[]")
          return np.array(all_preds)

  model = HaarCascadeDetector(scale_factor=float(SCALE_FACTOR), min_neighbors=int(MIN_NEIGHBORS))

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "object_detection"
  meta = {}

  if 'X_test' in locals():
      print("[MODEL] Exécution de la détection de visages...")
      # Pseudo-fit since it's pre-trained
