math_theory: |
  Haar Cascades detect objects using simple Haar-like rectangular features combined in a cascade structure.
  
  A Haar feature evaluates the difference between the sums of pixels within adjacent rectangular regions of an image $\textcolor{#ef4444}{\mathbf{X}}$:
  $$ \textcolor{#3b82f6}{f(x)} = \sum_{\text{black\_rect}} \text{pixels} - \sum_{\text{white\_rect}} \text{pixels} $$
  This is computed instantaneously using an **Integral Image** representation, where any rectangular sum takes only four array references.
  
  The **AdaBoost** algorithm is used to select the most discriminative features out of thousands, forming strong classifiers $H(x)$ from weak decision stumps $h_i(x)$:
  $$ \textcolor{#8b5cf6}{H(x)} = \text{sign}\left( \sum_{i=1}^T \textcolor{#fbbf24}{\alpha_i} h_i(x) \right) $$
  
  These classifiers are arranged in an **Attentional Cascade**. An image sub-window must pass every stage in the cascade to be considered a face. If any stage $\textcolor{#10b981}{S_k}$ rejects the sub-window, computation immediately stops for that window, making the approach extremely computationally efficient:
  $$ \text{Face Detected} \iff \forall k, \textcolor{#10b981}{S_k(x)} > \text{threshold}_k $$

