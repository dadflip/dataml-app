id: "model_tabnet_classifier"
name: "Model: TabNet Classifier (Google)"
description: |
  Réseau de neurones basé sur un mécanisme d'attention séquentiel (Self-Attention) développé par Google Research, spécifiquement conçu pour surpasser les arbres de décision sur des données tabulaires.
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "pytorch", "tabnet", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: |
  Lorsqu'on cherche les performances d'un modèle d'apprentissage profond tout en conservant une forte explicabilité (importance des variables au niveau global et local). Excellent sur les données tabulaires de grande dimension.
use_cases:
  - "Scoring de crédit et prédiction de risque (nécessite une forte explicabilité réglementaire)."
  - "Recommandation de produits basée sur des profils utilisateurs tabulaires."
  - "Prédiction d'attrition (churn) avec identification précise des facteurs décisionnels."
pros:
  - "Interprétabilité native (masques d'attention) rivalisant avec les modèles à base d'arbres."
  - "Sélection de variables ('feature selection') intégrée au sein même de l'architecture du réseau."
  - "Capable d'apprentissage auto-supervisé (Self-Supervised Learning) sur des données non étiquetées."
cons:
  - "Entraînement généralement plus lent et plus coûteux en ressources que XGBoost ou LightGBM."
  - "Dépendance à une librairie externe spécifique (`pytorch-tabnet`)."
  - "Sensible au réglage des hyperparamètres complexes (nombre de steps, relaxation, taille du batch)."
hyperparameters:
  max_epochs: "Nombre max d'époques (ex: 50)."
math_theory: |
  TabNet utilise un processus de décision séquentiel où chaque étape sélectionne des variables à l'aide d'un masque :
  $$ \textcolor{#3b82f6}{M[i]} = \text{sparsemax}(\textcolor{#fbbf24}{a_{i-1}}) $$
  La décision finale est l'agrégation des sorties activées (ReLU) de chaque étape de décision :
  $$ \textcolor{#10b981}{d_{out}} = \sum_{i=1}^{N_{steps}} \text{ReLU}(\textcolor{#8b5cf6}{W_i} \cdot \textcolor{#ef4444}{x} \odot \textcolor{#3b82f6}{M[i]}) $$
  L'importance de chaque feature s'obtient directement via l'agrégation des masques $\textcolor{#3b82f6}{M[i]}$.
