id: "model_tabnet_classifier"
name: "Model: TabNet Classifier (Google)"
description: "Réseau de neurones basé sur l'attention spécifiquement conçu par Google pour les données tabulaires."
category: "Réseaux de Neurones"
tags: ["model", "classification", "tabular", "pytorch", "tabnet", "deep-learning"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous voulez un réseau de neurones aussi interprétable qu'un arbre (feature importances explicites)."
pros:
  - "Excellente précision."
  - "Très interprétable (Self-Attention pour sélectionner les features)."
cons:
  - "Nécessite le package 'pytorch-tabnet'."
hyperparameters:
  max_epochs: "Nombre max d'époques (ex: 50)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from pytorch_tabnet.tab_model import TabNetClassifier
  except ImportError:
      TabNetClassifier = None
      print("[ERREUR] pytorch-tabnet n'est pas installé. Lancez : !pip install pytorch-tabnet")

  # [PARAM: MAX_EPOCHS | number]
  MAX_EPOCHS = 50
  # [/PARAM]

  print(f"[MODEL] Entraînement TabNet Classifier (max_epochs={MAX_EPOCHS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and TabNetClassifier is not None:
      X_tr_np = np.array(X_train)
      X_te_np = np.array(X_test)
      
      classes = np.unique(y_train)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      model = TabNetClassifier(verbose=1, seed=42)
      
      # TabNet gère lui-même un early stopping si on fournit un eval_set, sinon on force l'arrêt
      model.fit(
        X_train=X_tr_np, y_train=y_tr_enc,
        eval_set=[(X_tr_np, y_tr_enc)],
        max_epochs=int(MAX_EPOCHS),
        patience=10,
        batch_size=256
      )
      
      preds_idx = model.predict(X_te_np)
      y_pred = np.array([id2label[i] for i in preds_idx])
      y_proba = model.predict_proba(X_te_np)
      
      feature_importances = None
      if hasattr(model, 'feature_importances_'):
          if 'feature_names_out' in locals() and len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success", "best_cost": float(model.best_cost)}
      task_type = "classification"
