id: "model_logistic_regression"
name: "Model: Logistic Regression"
description: |
  Modèle de classification linéaire de référence. Il utilise la fonction logistique (sigmoïde) pour estimer la probabilité d'appartenance à une classe en se basant sur une combinaison linéaire des variables explicatives.
category: "Modèles Linéaires"
tags: ["model", "classification", "tabular", "sklearn", "linear"]
applies_to: ["Tabulaire"]
when_to_use: |
  À utiliser systématiquement comme première approche (baseline) pour les problèmes de classification binaire ou multiclasse, notamment lorsque l'interprétabilité des coefficients est prioritaire ou que les données sont linéairement séparables.
use_cases:
  - "Scoring médical (ex: prédiction de la probabilité de développer une maladie en fonction de facteurs de risque)."
  - "Détection de spam basique avec des caractéristiques textuelles simples."
  - "Prédiction d'attrition client (churn) avec besoin d'expliquer l'impact de chaque variable métier."
pros:
  - "Très rapide à entraîner et nécessite peu de ressources de calcul."
  - "Hautement interprétable : chaque poids donne l'importance et le sens d'une variable."
  - "Produit d'excellentes estimations de probabilités bien calibrées nativement."
cons:
  - "Incapable de modéliser par défaut des interactions complexes entre variables ou des relations non linéaires."
  - "Performances souvent inférieures aux algorithmes basés sur les arbres (RF, XGBoost) sur des données complexes."
  - "Sensible aux valeurs aberrantes (outliers) et à la multicollinéarité."
hyperparameters:
  penalty: "Type de régularisation ('l2', 'l1', 'elasticnet', 'none')."
  C: "Inverse de la force de régularisation (ex: 1.0). Plus C est petit, plus la régularisation est forte."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import LogisticRegression
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: PENALTY | string]
  PENALTY = "l2"
  # [/PARAM]

  # [PARAM: C_PARAM | number]
  C_PARAM = 1.0
  # [/PARAM]

  print(f"[MODEL] Initialisation Logistic Regression (penalty={PENALTY}, C={C_PARAM})...")

  # Use liblinear or saga depending on penalty
  solver_choice = 'liblinear' if PENALTY == 'l1' else 'lbfgs'
  model = LogisticRegression(penalty=PENALTY, C=float(C_PARAM), random_state=42, max_iter=1000, solver=solver_choice)

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline avec Logistic Regression...")
      full_pipeline.fit(X_train, y_train)
      y_pred = full_pipeline.predict(X_test)
      if hasattr(full_pipeline, "predict_proba"):
          y_proba = full_pipeline.predict_proba(X_test)
      
      if hasattr(model, 'coef_'):
          coefs = np.mean(np.abs(model.coef_), axis=0) if len(model.coef_.shape) > 1 and model.coef_.shape[0] > 1 else np.abs(model.coef_[0])
          if 'feature_names_out' in locals() and feature_names_out is not None and len(coefs) == len(feature_names_out):
              feature_importances = pd.Series(coefs, index=feature_names_out)
          else:
              feature_importances = pd.Series(coefs)
              
      training_history = {"status": "success", "fitted_on": len(X_train)}
