id: "model_wav2vec2_audio_clf"
name: "Model: Wav2Vec2 Audio Classifier"
description: |
  Modèle de traitement audio développé par Facebook/Meta, capable d'effectuer une classification Zero-Shot ou une extraction de caractéristiques (Feature Extraction) via l'API HuggingFace.
category: "Multimédia & Audio"
tags: ["model", "audio", "classification", "transformers", "huggingface", "wav2vec2"]
applies_to: ["Audio"]
when_to_use: |
  Idéal pour classifier des émotions vocales, interpréter des commandes vocales ou extraire des embeddings profonds d'un signal audio brut.
use_cases:
  - "Détection de l'émotion dans les appels au service client."
  - "Classification de commandes vocales pour la domotique."
  - "Identification du locuteur ou de la langue."
pros:
  - "Extrêmement performant sur les tâches liées à la voix humaine (Speech Recognition)."
  - "Approche Zero-Shot utilisable directement via pipeline HuggingFace."
cons:
  - "Traitement gourmand : les tableaux de fréquences (ex. 16kHz) génèrent des entrées très lourdes."
  - "Sensible au bruit de fond excessif et à la qualité d'échantillonnage."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers librosa")

  print(f"[MODEL] HuggingFace Audio Classification...")
  if 'X_test' in locals() and pipeline is not None:
      # X_test contient des chemins vers des fichiers .wav ou des arrays numpy (rate 16000)
      audios = list(X_test)
      
      print("Chargement du classifieur audio...")
      # Modèle générique de classification d'émotions
      classifier = pipeline("audio-classification", model="ehcalabres/wav2vec2-lg-xlsr-en-speech-emotion-recognition")
      
      print("Inférence en cours...")
      results = []
      for a in audios:
          try:
              res = classifier(a)
              results.append(res[0]['label'])
          except Exception as e:
              results.append("Erreur")
              
      y_pred = np.array(results)
      y_proba = None
      feature_importances = None
      model = classifier
      
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
          
      training_history = {"status": "success"}
      task_type = "classification"
math_theory: |
  Wav2Vec 2.0 apprend des représentations puissantes à partir de l'audio brut de manière auto-supervisée, qui sont ensuite affinées (fine-tuned) pour la classification.
  
  1. **Feature Encoding (Encodage des caractéristiques)** : Un CNN multicouche associe la séquence audio brute $\textcolor{#10b981}{X}$ à des représentations de parole latentes $\textcolor{#fbbf24}{Z} = \{z_1, z_2, \dots, z_T\}$.
  
  2. **Contextualization (Contextualisation)** : Un réseau Transformer traite $\textcolor{#fbbf24}{Z}$ (avec un masquage appliqué) pour construire des représentations contextuelles $\textcolor{#3b82f6}{C} = \{c_1, c_2, \dots, c_T\}$.
  
  3. **Contrastive Loss (Perte contrastive en pré-entraînement)** : Pour les pas de temps masqués $t$, le modèle doit identifier le véritable espace latent quantifié $\textcolor{#8b5cf6}{q_t}$ parmi un ensemble de distracteurs $\textcolor{#ef4444}{K}$, en utilisant la similarité cosinus $\text{sim}$ :
  
  $$
  \mathcal{L}_m = -\log \frac{\exp(\text{sim}(\textcolor{#3b82f6}{c_t}, \textcolor{#8b5cf6}{q_t}) / \kappa)}{\sum_{\tilde{q} \in \textcolor{#ef4444}{K}} \exp(\text{sim}(\textcolor{#3b82f6}{c_t}, \tilde{q}) / \kappa)} 
  $$
  
  4. **Fine-Tuning (Classification)** : Les représentations sont agrégées (par exemple, par un average pooling) en $\textcolor{#3b82f6}{\bar{c}}$, et un classifieur linéaire attribue les probabilités :
  
  $$
  \textcolor{#10b981}{\hat{y}} = \text{Softmax}(W \cdot \textcolor{#3b82f6}{\bar{c}} + b) 
  $$
