math_theory: |
  HistGradientBoosting is a highly efficient implementation of gradient boosting that discretizes continuous features into integer-valued bins (histograms). This dramatically reduces the number of split points evaluated.
  
  First, input features $\textcolor{#ef4444}{x}$ are mapped to bins:
  $$ \tilde{x} = \text{Bin}(\textcolor{#ef4444}{x}, \text{max\_bins}) $$
  
  The model then sequentially minimizes a loss function using trees trained on the binned data:
  $$ \textcolor{#3b82f6}{F_M}(\tilde{x}) = F_0(\tilde{x}) + \sum_{m=1}^{\textcolor{#8b5cf6}{M}} \textcolor{#10b981}{\nu} \cdot \textcolor{#fbbf24}{h_m}(\tilde{x}) $$
  
  Where:
  - $\textcolor{#3b82f6}{F_M}(\tilde{x})$ is the final log-odds prediction.
  - $\textcolor{#8b5cf6}{M}$ is the maximum number of iterations (`max_iter`).
  - $\textcolor{#10b981}{\nu}$ is the learning rate.
  - $\textcolor{#fbbf24}{h_m}$ is the decision tree grown at step $m$ using histogram-based splits.
  - $\textcolor{#ef4444}{x}$ represents the raw input features.

