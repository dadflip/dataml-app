id: "model_hist_gradient_boosting_classifier"
name: "Model: HistGradientBoosting Classifier"
description: "Implémentation native très rapide de LightGBM directement dans Scikit-Learn."
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "Quand LightGBM n'est pas installé, pour des datasets volumineux (> 10000 échantillons)."
pros:
  - "Beaucoup plus rapide que GradientBoostingClassifier."
  - "Gère nativement les NaNs."
cons:
  - "Support natif des variables catégorielles nécessite sklearn >= 0.24."
hyperparameters:
  max_iter: "Nombre maximum d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import HistGradientBoostingClassifier

  # [PARAM: MAX_ITER | number]
  MAX_ITER = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  print(f"[MODEL] Entraînement HistGradientBoosting (iter={MAX_ITER}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = HistGradientBoostingClassifier(max_iter=int(MAX_ITER), learning_rate=float(LEARNING_RATE), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      # HGB n'a pas de feature_importances_ natif (il faut faire de la permutation importance)
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      meta = {}
illustration_mermaid: |
  graph TD
    subgraph Data Input
      X[Raw Features] --> Bin[Histogram Binning]
    end
    subgraph Gradient Boosting Process
      Bin --> Tree1[Decision Tree 1]
      Tree1 --> Res1[Compute Residuals]
      Res1 --> Tree2[Decision Tree 2]
      Tree2 --> ResN[...]
      ResN --> TreeN[Decision Tree N]
    end
    subgraph Aggregation
      Tree1 -.-> Sum[Sum Output * Learning Rate]
      Tree2 -.-> Sum
      TreeN -.-> Sum
      Sum --> Sigmoid[Sigmoid/Softmax]
      Sigmoid --> Pred[Class Predictions]
    end
    style Bin fill:#f59e0b,stroke:#d97706,stroke-width:2px,color:#fff
    style Tree1 fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style Tree2 fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style TreeN fill:#10b981,stroke:#059669,stroke-width:2px,color:#fff
    style Sum fill:#3b82f6,stroke:#2563eb,stroke-width:2px,color:#fff

