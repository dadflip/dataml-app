id: "model_hist_gradient_boosting_classifier"
name: "Model: HistGradientBoosting Classifier"
description: "Algorithme d'ensemble (Boosting) natif de Scikit-Learn optimisé par binning (histogrammes), très similaire et inspiré de LightGBM pour des performances et une vitesse maximales."
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "À privilégier par défaut pour des tâches de classification sur données tabulaires de taille moyenne à grande (plus de 10 000 échantillons), offrant un excellent compromis entre vitesse et précision sans nécessiter l'installation de bibliothèques externes."
use_cases:
  - "Détection de fraude sur des volumes massifs de transactions."
  - "Prédiction du churn (attrition) client."
  - "Classification de risque de crédit avec de nombreuses variables."
pros:
  - "Extrêmement rapide par rapport au GradientBoostingClassifier standard (grâce au binning)."
  - "Gère nativement les valeurs manquantes (NaNs) sans imputation préalable."
  - "Inclus en natif dans Scikit-Learn (pas de dépendances lourdes supplémentaires)."
cons:
  - "Ne propose pas d'attribut feature_importances_ natif (nécessite d'utiliser la permutation importance)."
  - "Moins personnalisable que les bibliothèques dédiées comme XGBoost ou LightGBM."
  - "Le support natif complet des variables catégorielles peut nécessiter une version récente de scikit-learn."
hyperparameters:
  max_iter: "Nombre maximum d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import HistGradientBoostingClassifier

  # [PARAM: MAX_ITER | number]
  MAX_ITER = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  print(f"[MODEL] Entraînement HistGradientBoosting (iter={MAX_ITER}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = HistGradientBoostingClassifier(max_iter=int(MAX_ITER), learning_rate=float(LEARNING_RATE), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      # HGB n'a pas de feature_importances_ natif (il faut faire de la permutation importance)
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "classification"
      meta = {}
