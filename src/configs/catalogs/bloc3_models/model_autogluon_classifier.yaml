id: "model_autogluon_classifier"
name: "Model: AutoGluon (Amazon AutoML)"
description: |
  Cadre d'AutoML d'Amazon extrêmement performant pour les données tabulaires. Il entraîne de multiples modèles (LightGBM, XGBoost, CatBoost, Réseaux de Neurones) et les combine automatiquement via un processus d'empilement (stacking) avancé.
category: "AutoML"
tags: ["model", "automl", "classification", "tabular", "autogluon"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour obtenir rapidement des performances à l'état de l'art sur des données tabulaires sans expertise en réglage d'hyperparamètres, ou pour établir une base de référence très compétitive (souvent du niveau d'une compétition Kaggle).
use_cases:
  - "Compétitions de machine learning et prototypage très rapide avec un temps de développement minimal."
  - "Automatisation complète de bout en bout de la chaîne d'entraînement pour des modèles tabulaires."
  - "Comparaison et étalonnage (benchmarking) de nouveaux jeux de données."
pros:
  - "Performances très souvent à l'état de l'art (State of the Art) sur les données tabulaires sans intervention humaine."
  - "Gère automatiquement le nettoyage, l'ingénierie des caractéristiques, et la sélection de modèles."
  - "Très robuste avec des mécanismes de stacking d'ensembles qui maximisent la précision."
cons:
  - "Modèle résultant souvent très lourd en mémoire (sauvegarde d'une dizaine de sous-modèles)."
  - "Temps d'inférence (prédiction) plus lent à cause du calcul de l'ensemble des modèles."
  - "Difficile à intégrer dans des pipelines de déploiement stricts comme `sklearn.pipeline.Pipeline`."
  - "Installation parfois complexe due à de nombreux conflits de dépendances."
hyperparameters:
  time_limit: "Temps maximum alloué en secondes (ex: 60)."
math_theory: |
  AutoGluon utilise un processus avancé d'ensemble par empilement (stacking). Les modèles de base $\{\textcolor{#3b82f6}{M_1}, \dots, \textcolor{#3b82f6}{M_K}\}$ sont entraînés sur les caractéristiques $\textcolor{#fbbf24}{x}$ pour générer des probabilités prédictives $\textcolor{#10b981}{P_k(x)}$.
  Ensuite, un modèle méta-apprenant (stacker) $\textcolor{#8b5cf6}{S}$ prend en entrée la concaténation ($\oplus$) des variables originales $\textcolor{#fbbf24}{x}$ et des prédictions de base $\textcolor{#10b981}{P_k}$ pour calculer la probabilité finale $\textcolor{#ef4444}{\hat{y}}$ :
  
  $$
  \textcolor{#ef4444}{\hat{y}} = \textcolor{#8b5cf6}{S}\left( \textcolor{#fbbf24}{x} \oplus [\textcolor{#10b981}{P_1(x)}, \textcolor{#10b981}{P_2(x)}, \dots, \textcolor{#10b981}{P_K(x)}] \right)
  $$
