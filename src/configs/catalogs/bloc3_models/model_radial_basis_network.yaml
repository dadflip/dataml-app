id: "model_radial_basis_network"
name: "Model: Radial Basis Function Network (RBFNN)"
description: "Réseau de neurones dont la couche cachée utilise des fonctions à base radiale (Gaussiennes) au lieu de ReLU."
category: "Réseaux Spécialisés"
tags: ["model", "classification", "tabular", "pytorch", "rbf", "neural-network"]
applies_to: ["Tabulaire"]
when_to_use: "Pour des problèmes de classification où les frontières de décision sont locales (non-linéaires)."
pros:
  - "Apprentissage rapide, bonne interpolation locale."
cons:
  - "Scale mal avec la dimensionnalité."
hyperparameters:
  n_centers: "Nombre de centres RBF (ex: 20)."
  epochs: "Nombre d'époques (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: N_CENTERS | number]
  N_CENTERS = 20
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 20
  # [/PARAM]

  print(f"[MODEL] Entraînement RBFNN (centres={N_CENTERS})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      X_tr_np = np.array(X_train, dtype=np.float32)
      X_te_np = np.array(X_test, dtype=np.float32)
      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      nc = int(N_CENTERS)
      in_feat = X_tr_np.shape[1]

      class RBFLayer(nn.Module):
          def __init__(self, in_features, n_centers):
              super().__init__()
              self.centers = nn.Parameter(torch.randn(n_centers, in_features))
              self.betas = nn.Parameter(torch.ones(n_centers))
          def forward(self, x):
              # x: (batch, in_features)  centers: (n_centers, in_features)
              diffs = x.unsqueeze(1) - self.centers.unsqueeze(0) # (batch, n_centers, in_features)
              dists = (diffs ** 2).sum(dim=2) # (batch, n_centers)
              return torch.exp(-self.betas.unsqueeze(0) * dists)

      class RBFNN(nn.Module):
          def __init__(self, in_f, nc, out):
              super().__init__()
              self.rbf = RBFLayer(in_f, nc)
              self.fc = nn.Linear(nc, out)
          def forward(self, x):
              return self.fc(self.rbf(x))

      dataset = TensorDataset(torch.tensor(X_tr_np), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)
      model = RBFNN(in_feat, nc, num_classes)
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      model.train()
      for epoch in range(int(EPOCHS)):
          for bx, by in loader:
              bx, by = bx.to(device), by.to(device)
              optimizer.zero_grad()
              loss = criterion(model(bx), by)
              loss.backward()
              optimizer.step()
      model.eval()
      with torch.no_grad():
          logits = model(torch.tensor(X_te_np).to(device))
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
      feature_importances = None
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = model
      training_history = {"status": "success", "loss": float(loss)}
      task_type = "classification"
      print("[MODEL] RBFNN entraîné avec succès.")
  else:
      print("[ERREUR] Données ou torch manquants.")
