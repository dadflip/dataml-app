id: "model_radial_basis_network"
name: "Model: Radial Basis Function Network (RBFNN)"
description: |
  Réseau de neurones à base radiale (RBFNN) implémenté en PyTorch, dont la couche cachée utilise des fonctions d'activation gaussiennes centrées sur des prototypes plutôt que des combinaisons linéaires classiques.
category: "Réseaux Spécialisés"
tags: ["model", "classification", "tabular", "pytorch", "rbf", "neural-network"]
applies_to: ["Tabulaire"]
when_to_use: |
  Idéal pour les problèmes de classification où l'on soupçonne des frontières de décision hautement locales, non-linéaires, en îlots, et lorsque l'interpolation entre points de données proches est cruciale.
use_cases:
  - "Classification spatiale de données géographiques où les variables ont des centres d'influence locaux."
  - "Diagnostic d'anomalies où les états normaux sont confinés à des régions spécifiques de l'espace des descripteurs."
  - "Modélisation de processus physiques présentant des zones de comportement distinctes."
pros:
  - "Apprentissage potentiellement très rapide (en deux étapes : centres puis poids linéaires)."
  - "Excellentes capacités d'interpolation locale, offrant une bonne robustesse sur des clusters bien séparés."
  - "Interprétabilité partielle via l'analyse des centres (prototypes)."
cons:
  - "Passe difficilement à l'échelle sur des espaces de très haute dimension (le fléau de la dimension affecte les distances euclidiennes)."
  - "Le choix du nombre et de la position des centres RBF est critique et fastidieux."
  - "Peut souffrir face à de grandes quantités de variables non pertinentes."
hyperparameters:
  n_centers: "Nombre de centres RBF (ex: 20)."
  epochs: "Nombre d'époques (ex: 20)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.pipeline import Pipeline

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé. Lancez : !pip install torch")

  # [PARAM: N_CENTERS | int]
  N_CENTERS = 20
  # [/PARAM]

  # [PARAM: EPOCHS | int]
  EPOCHS = 20
  # [/PARAM]

  meta = {
      "model_name": "Radial Basis Function Network",
      "framework": "pytorch",
      "task_type": "classification"
  }
  task_type = "classification"
  
  full_pipeline = None
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = []

  if torch is not None:
      device = torch.device("cuda" if torch.cuda.is_available() else "mps" if torch.backends.mps.is_available() else "cpu")

      if 'preprocessor' in globals() and preprocessor is not None:
          X_train_processed = preprocessor.fit_transform(X_train)
          X_test_processed = preprocessor.transform(X_test)
      else:
          X_train_processed = X_train.values if isinstance(X_train, pd.DataFrame) else X_train
          X_test_processed = X_test.values if isinstance(X_test, pd.DataFrame) else X_test
          
      if hasattr(X_train_processed, "toarray"):
          X_train_processed = X_train_processed.toarray()
      if hasattr(X_test_processed, "toarray"):
          X_test_processed = X_test_processed.toarray()
          
      X_tr_np = np.array(X_train_processed, dtype=np.float32)
      X_te_np = np.array(X_test_processed, dtype=np.float32)

      y_train_arr = y_train.values if isinstance(y_train, pd.Series) else y_train
      y_test_arr = y_test.values if isinstance(y_test, pd.Series) else y_test
      
      classes = np.unique(y_train_arr)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      
      y_tr_enc = np.array([label2id[y] for y in y_train_arr])
      y_te_enc = np.array([label2id.get(y, 0) for y in y_test_arr])

      in_feat = X_tr_np.shape[1]

      class RBFLayer(nn.Module):
          def __init__(self, in_features, n_centers):
              super().__init__()
              self.centers = nn.Parameter(torch.randn(n_centers, in_features))
              self.betas = nn.Parameter(torch.ones(n_centers))
          def forward(self, x):
              diffs = x.unsqueeze(1) - self.centers.unsqueeze(0)
              dists = (diffs ** 2).sum(dim=2)
              return torch.exp(-self.betas.unsqueeze(0) * dists)

      class RBFNN(nn.Module):
          def __init__(self, in_f, nc, out):
              super().__init__()
              self.rbf = RBFLayer(in_f, nc)
              self.fc = nn.Linear(nc, out)
          def forward(self, x):
              return self.fc(self.rbf(x))

      model = RBFNN(in_feat, int(N_CENTERS), num_classes).to(device)
      dataset = TensorDataset(torch.tensor(X_tr_np), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)
      
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      
      model.train()
      for epoch in range(int(EPOCHS)):
          epoch_loss = 0.0
          for bx, by in loader:
              bx, by = bx.to(device), by.to(device)
              optimizer.zero_grad()
              outputs = model(bx)
              loss = criterion(outputs, by)
              loss.backward()
              optimizer.step()
              epoch_loss += loss.item()
          training_history.append({"epoch": epoch+1, "loss": epoch_loss/len(loader)})

      model.eval()
      with torch.no_grad():
          X_te_tensor = torch.tensor(X_te_np).to(device)
          logits = model(X_te_tensor)
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()

      class PyTorchWrapper:
          def __init__(self, model, device, id2label):
              self.model = model
              self.device = device
              self.id2label = id2label
          def predict(self, X):
              self.model.eval()
              if hasattr(X, "toarray"): X = X.toarray()
              X_tensor = torch.tensor(X.astype(np.float32), dtype=torch.float32).to(self.device)
              with torch.no_grad():
                  logits = self.model(X_tensor)
                  preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
              return np.array([self.id2label[idx] for idx in preds_idx])
          def predict_proba(self, X):
              self.model.eval()
              if hasattr(X, "toarray"): X = X.toarray()
              X_tensor = torch.tensor(X.astype(np.float32), dtype=torch.float32).to(self.device)
              with torch.no_grad():
                  logits = self.model(X_tensor)
                  probs = torch.nn.functional.softmax(logits, dim=1).cpu().numpy()
              return probs

      wrapped_model = PyTorchWrapper(model, device, id2label)

      if 'preprocessor' in globals() and preprocessor is not None:
          full_pipeline = Pipeline([
              ('preprocessor', preprocessor),
              ('model', wrapped_model)
          ])
      else:
          full_pipeline = Pipeline([
              ('model', wrapped_model)
          ])
math_theory: |
  Un réseau RBF est composé d'une couche cachée dont les neurones calculent une distance entre l'entrée $\textcolor{#10b981}{x}$ et des centres appris $\textcolor{#ef4444}{c_i}$.
  L'activation radiale est souvent modélisée par une Gaussienne, contrôlée par un facteur d'étalement $\textcolor{#fbbf24}{\beta_i}$ :
  
  $$
  \textcolor{#3b82f6}{h_i}(\textcolor{#10b981}{x}) = \exp \left( -\textcolor{#fbbf24}{\beta_i} ||\textcolor{#10b981}{x} - \textcolor{#ef4444}{c_i}||^2 \right) 
  $$
  
  La sortie $\textcolor{#8b5cf6}{y}$ du réseau est ensuite une simple combinaison linéaire pondérée par $\textcolor{#3b82f6}{w_i}$ de ces activations radiales :
  
  $$
  \textcolor{#8b5cf6}{y} = \sum_{i=1}^{N} \textcolor{#3b82f6}{w_i} \textcolor{#3b82f6}{h_i}(\textcolor{#10b981}{x}) + b 
  $$
