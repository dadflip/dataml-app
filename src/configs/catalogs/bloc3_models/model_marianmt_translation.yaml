id: "model_marianmt_translation"
name: "Model: MarianMT Translation (EN -> FR)"
description: "Modèle de traduction automatique performant open-source (Helsinki-NLP)."
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "translation", "transformers", "huggingface", "zero-shot", "generative"]
applies_to: ["Texte"]
when_to_use: "Pour traduire massivement des textes (par défaut Anglais vers Français)."
pros:
  - "Aussi performant que Google Translate sur de nombreuses paires de langues."
cons:
  - "Modèle spécifique requis pour chaque paire de langues."
hyperparameters: {}
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  print(f"[MODEL] HuggingFace MarianMT Translation (EN -> FR)...")
  if 'X_test' in locals() and pipeline is not None:
      texts = []
      if isinstance(X_test, pd.DataFrame) and 'text' in X_test.columns:
          texts = X_test['text'].astype(str).tolist()
      elif isinstance(X_test, (pd.Series, np.ndarray, list)):
          texts = [str(x) for x in X_test]
          
      if texts:
          print("Chargement du modèle de traduction Helsinki-NLP/opus-mt-en-fr...")
          translator = pipeline("translation_en_to_fr", model="Helsinki-NLP/opus-mt-en-fr")
          
          print("Traduction en cours...")
          results = translator(texts)
          
          y_pred = np.array([res['translation_text'] for res in results])
          y_proba = None
          feature_importances = None
          model = translator
          
          if 'preprocessor' in locals() and preprocessor is not None:
              try: from imblearn.pipeline import Pipeline
              except: from sklearn.pipeline import Pipeline
              full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
          else:
              full_pipeline = model
              
          training_history = {"status": "success", "type": "zero_shot_generative"}
          task_type = "text_generation"
          print("[MODEL] Traduction terminée avec succès.")
  else:
      print("[ERREUR] Données introuvables ou transformers non installé.")
