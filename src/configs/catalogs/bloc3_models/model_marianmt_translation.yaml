code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.base import BaseEstimator, TransformerMixin
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  print("[MODEL] Initialisation HuggingFace MarianMT Translation (EN -> FR)...")

  class MarianMTPipelineWrapper(BaseEstimator, TransformerMixin):
      def __init__(self):
          self.model = None
          
      def fit(self, X, y=None):
          if pipeline is not None:
              print("[MODEL] Chargement du modèle de traduction Helsinki-NLP/opus-mt-en-fr...")
              # En production, on utiliserait le paramètre device=0 pour le GPU
              self.model = pipeline("translation_en_to_fr", model="Helsinki-NLP/opus-mt-en-fr")
          return self
          
      def predict(self, X):
          if self.model is None:
              return np.array([])
          
          texts = []
          if isinstance(X, pd.DataFrame) and len(X.columns) > 0:
              texts = X.iloc[:, 0].astype(str).tolist()
          elif hasattr(X, 'name') and hasattr(X, 'values'):
              texts = X.astype(str).tolist()
          elif isinstance(X, (np.ndarray, list)):
              texts = [str(x) for x in X]
              
          print("[MODEL] Traduction en cours...")
          results = self.model(texts)
          return np.array([res['translation_text'] for res in results])

  model = MarianMTPipelineWrapper()

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "text_generation"
  meta = {}

  if 'X_test' in locals() and pipeline is not None:
      # L'étape .fit() du wrapper ne fait que charger le modèle
