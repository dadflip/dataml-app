math_theory: |
  MarianMT utilise une architecture standard de Transformer Encodeur-Décodeur conçue pour la traduction automatique neuronale. Il apprend à mapper une séquence de la langue source $\textcolor{#3b82f6}{X}$ (ex. anglais) vers une séquence cible $\textcolor{#10b981}{Y}$ (ex. français).
  
  Le cœur de l'interaction entre les deux langues se produit dans les couches d'**Attention Croisée** (Cross-Attention) du décodeur :
  
  $$
  \text{CrossAttention}(\textcolor{#ef4444}{Q_{\text{dec}}}, \textcolor{#fbbf24}{K_{\text{enc}}}, \textcolor{#fbbf24}{V_{\text{enc}}}) = \text{Softmax}\left(\frac{\textcolor{#ef4444}{Q_{\text{dec}}} \cdot \textcolor{#fbbf24}{K_{\text{enc}}}^T}{\sqrt{d_k}}\right) \textcolor{#fbbf24}{V_{\text{enc}}}
  $$
  
  où :
  * $\textcolor{#fbbf24}{K_{\text{enc}}}$ et $\textcolor{#fbbf24}{V_{\text{enc}}}$ sont les Clés (Keys) et les Valeurs (Values) dérivées des états cachés de l'encodeur (la représentation du texte source).
  * $\textcolor{#ef4444}{Q_{\text{dec}}}$ sont les Requêtes (Queries) générées à partir de l'état actuel du décodeur (le texte cible généré jusqu'à présent).
  
  Cela permet au décodeur de prêter dynamiquement attention aux parties pertinentes de la phrase source lors de la génération de chaque mot traduit.

