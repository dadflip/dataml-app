math_theory: |
  MarianMT employs a standard Encoder-Decoder Transformer architecture designed for neural machine translation. It learns to map a source language sequence $\textcolor{#3b82f6}{X}$ (e.g., English) to a target sequence $\textcolor{#10b981}{Y}$ (e.g., French).
  
  The core of the interaction between the two languages happens in the **Cross-Attention** layers of the decoder:
  
  $$ \text{CrossAttention}(\textcolor{#ef4444}{Q_{\text{dec}}}, \textcolor{#fbbf24}{K_{\text{enc}}}, \textcolor{#fbbf24}{V_{\text{enc}}}) = \text{Softmax}\left(\frac{\textcolor{#ef4444}{Q_{\text{dec}}} \cdot \textcolor{#fbbf24}{K_{\text{enc}}}^T}{\sqrt{d_k}}\right) \textcolor{#fbbf24}{V_{\text{enc}}} $$
  
  where:
  *   $\textcolor{#fbbf24}{K_{\text{enc}}}, \textcolor{#fbbf24}{V_{\text{enc}}}$ are the Keys and Values derived from the encoder's hidden states (the English text representation).
  *   $\textcolor{#ef4444}{Q_{\text{dec}}}$ are the Queries generated from the decoder's current state (the French text generated so far).
  
  This allows the decoder to "look back" at relevant parts of the English sentence when generating each French word.

