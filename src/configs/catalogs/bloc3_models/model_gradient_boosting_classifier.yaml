math_theory: |
  Le Gradient Boosting minimise séquentiellement une fonction de perte $L(y, F(x))$. Pour la classification, la perte est typiquement la Log-Loss. À chaque étape $m$, un nouvel arbre $\textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x})$ est ajusté aux gradients négatifs (pseudo-résidus) de la perte par rapport aux prédictions précédentes.
  
  Le modèle final est une expansion additive :
  $$
  \textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x}) = F_0(\textcolor{#ef4444}{x}) + \sum_{m=1}^{\textcolor{#8b5cf6}{M}} \textcolor{#10b981}{\nu} \cdot \textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x}) 
  $$
  
  Où :
  - $\textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x})$ est la prédiction finale du log-odds.
  - $\textcolor{#8b5cf6}{M}$ est le nombre d'arbres (`n_estimators`).
  - $\textcolor{#10b981}{\nu}$ est le taux d'apprentissage (`learning_rate`), qui met à l'échelle la contribution de chaque arbre.
  - $\textcolor{#fbbf24}{h_m}(\textcolor{#ef4444}{x})$ est l'apprenant faible (arbre de décision) à l'étape $m$.
  - $\textcolor{#ef4444}{x}$ représente les caractéristiques d'entrée.
  
  La probabilité finale est obtenue via la fonction logistique :
  $$
  P(y=1|\textcolor{#ef4444}{x}) = \frac{1}{1 + e^{-\textcolor{#3b82f6}{F_M}(\textcolor{#ef4444}{x})}} 
  $$

