id: "model_gradient_boosting_classifier"
name: "Model: Gradient Boosting Classifier"
description: |
  Modèle d'ensemble puissant construisant séquentiellement une série d'arbres de décision, où chaque nouvel arbre s'efforce de corriger les erreurs (résidus) de l'ensemble précédent.
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: |
  Excellent choix par défaut pour la majorité des problèmes de classification sur des données tabulaires de taille moyenne à grande. Particulièrement performant sur des données hétérogènes.
use_cases:
  - "Prédiction d'attrition (churn) des clients."
  - "Évaluation du risque de crédit ou détection de fraude."
  - "Classification de problèmes métiers complexes avec de multiples variables de nature différente."
pros:
  - "Précision prédictive très élevée, souvent parmi les meilleurs algorithmes tabulaires."
  - "Gère nativement les interactions complexes entre les caractéristiques."
  - "Fournit des importances de variables (Feature Importances) pour l'interprétabilité."
cons:
  - "Entraînement séquentiel lent, difficile à paralléliser contrairement aux Random Forests."
  - "Plus sensible au surapprentissage (overfitting) si les hyperparamètres sont mal réglés."
  - "Consommation mémoire plus importante lors de l'entraînement."
hyperparameters:
  n_estimators: "Nombre de boosting stages (ex: 100)."
  learning_rate: "Taux d'apprentissage (réduit la contribution de chaque arbre)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import GradientBoostingClassifier

  # [PARAM: N_ESTIMATORS | number]
  N_ESTIMATORS = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  print(f"[MODEL] Entraînement Gradient Boosting (n={N_ESTIMATORS}, lr={LEARNING_RATE})...")
  
  model = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"framework": "sklearn", "type": "gradient_boosting_classifier"}
  full_pipeline = None

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = GradientBoostingClassifier(n_estimators=int(N_ESTIMATORS), learning_rate=float(LEARNING_RATE), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, 'predict_proba') else None
      
      if 'feature_names_out' in locals() and hasattr(model, 'feature_importances_'):
          if len(model.feature_importances_) == len(feature_names_out):
              feature_importances = pd.Series(model.feature_importances_, index=feature_names_out)
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}

