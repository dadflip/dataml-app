id: "model_cnn_1d"
name: "Model: 1D CNN"
description: "Réseau Convolutif 1D, efficace pour extraire des motifs locaux sur des séries temporelles ou du texte."
category: "Réseaux Convolutifs (CNN)"
tags: ["model", "classification", "timeseries", "pytorch", "cnn", "cnn-1d", "deep-learning"]
applies_to: ["Séquences", "Séries Temporelles", "Texte"]
when_to_use: "Alternative plus rapide aux RNN quand l'ordre absolu compte moins que la présence de motifs locaux."
pros:
  - "Très rapide, parallélisable."
cons:
  - "Moins bon que le LSTM pour comprendre un contexte très éloigné."
hyperparameters:
  num_filters: "Nombre de filtres convolutifs (ex: 64)."
  kernel_size: "Taille de la fenêtre (ex: 3)."
  epochs: "Nombre d'époques (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np

  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "classification"
  meta = {"model_name": "CNN 1D"}

  try:
      import torch
      import torch.nn as nn
      import torch.optim as optim
      from torch.utils.data import DataLoader, TensorDataset
  except ImportError:
      torch = None
      print("[ERREUR] torch n'est pas installé.")

  # [PARAM: NUM_FILTERS | number]
  NUM_FILTERS = 64
  # [/PARAM]

  # [PARAM: KERNEL_SIZE | number]
  KERNEL_SIZE = 3
  # [/PARAM]

  # [PARAM: EPOCHS | number]
  EPOCHS = 10
  # [/PARAM]

  print(f"[MODEL] Entraînement CNN 1D PyTorch (filters={NUM_FILTERS}, kernel={KERNEL_SIZE}, epochs={EPOCHS})...")

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals() and torch is not None:
      # Use preprocessor if available
      has_preprocessor = 'preprocessor' in locals() and preprocessor is not None
      
      if has_preprocessor:
          X_train_proc = preprocessor.fit_transform(X_train)
          X_test_proc = preprocessor.transform(X_test)
          try:
              from imblearn.pipeline import Pipeline
          except ImportError:
              from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=list(preprocessor.steps) if hasattr(preprocessor, 'steps') else [('preprocessor', preprocessor)])
      else:
          X_train_proc = X_train
          X_test_proc = X_test
          full_pipeline = None

      X_tr_np = np.array(X_train_proc, dtype=np.float32)
      X_te_np = np.array(X_test_proc, dtype=np.float32)

      # Conv1D PyTorch attend (N, C, L) -- (Batch, Features/Channels, Time)
      if len(X_tr_np.shape) == 2:
          # Si données tabulaires, on ajoute une dimension spatiale/temporelle
          X_tr_np = X_tr_np.reshape((X_tr_np.shape[0], 1, X_tr_np.shape[1]))
          X_te_np = X_te_np.reshape((X_te_np.shape[0], 1, X_te_np.shape[1]))
      elif len(X_tr_np.shape) == 3:
          X_tr_np = np.swapaxes(X_tr_np, 1, 2)
          X_te_np = np.swapaxes(X_te_np, 1, 2)

      classes = np.unique(y_train)
      num_classes = len(classes)
      label2id = {c: i for i, c in enumerate(classes)}
      id2label = {i: c for i, c in enumerate(classes)}
      y_tr_enc = np.array([label2id[y] for y in y_train])
      
      dataset = TensorDataset(torch.tensor(X_tr_np), torch.tensor(y_tr_enc, dtype=torch.long))
      loader = DataLoader(dataset, batch_size=32, shuffle=True)

      class CNN1DClassifier(nn.Module):
          def __init__(self, in_channels, out_channels, kernel_size, num_classes):
              super().__init__()
              self.conv = nn.Conv1d(in_channels, out_channels, kernel_size, padding=kernel_size//2)
              self.relu = nn.ReLU()
              self.pool = nn.AdaptiveMaxPool1d(1)
              self.fc = nn.Linear(out_channels, num_classes)
              
          def forward(self, x):
              x = self.conv(x)
              x = self.relu(x)
              x = self.pool(x)
              x = x.squeeze(2)
              return self.fc(x)

      model = CNN1DClassifier(X_tr_np.shape[1], int(NUM_FILTERS), int(KERNEL_SIZE), num_classes)
      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      model = model.to(device)
      criterion = nn.CrossEntropyLoss()
      optimizer = optim.Adam(model.parameters(), lr=0.001)
      
      model.train()
      for epoch in range(int(EPOCHS)):
          epoch_loss = 0.0
          for batch_X, batch_y in loader:
              batch_X, batch_y = batch_X.to(device), batch_y.to(device)
              optimizer.zero_grad()
              loss = criterion(model(batch_X), batch_y)
              loss.backward()
              optimizer.step()
              epoch_loss += loss.item()
              
      model.eval()
      with torch.no_grad():
          logits = model(torch.tensor(X_te_np).to(device))
          preds_idx = torch.argmax(logits, dim=1).cpu().numpy()
          y_pred = np.array([id2label[i] for i in preds_idx])
          y_proba = torch.nn.functional.softmax(logits, dim=-1).cpu().numpy()
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      
      # Since we can't cleanly place a PyTorch model in an sklearn pipeline without wrapper (e.g. skorch),
      # we just keep the preprocessor in full_pipeline and set model separately.
      if not has_preprocessor:
          full_pipeline = model

