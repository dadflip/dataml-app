id: "model_cnn_1d"
name: "Model: 1D CNN"
description: |
  Réseau Convolutif 1D, adapté pour extraire des motifs locaux sur des données séquentielles.
  Très efficace pour identifier des patterns récurrents indépendants de leur position absolue.
category: "Réseaux Convolutifs (CNN)"
tags: ["model", "classification", "timeseries", "pytorch", "cnn", "cnn-1d", "deep-learning"]
applies_to: ["Séquences", "Séries Temporelles", "Texte"]
when_to_use: |
  Idéal pour les séries temporelles, les signaux (audio, capteurs) ou le traitement de texte (NLP)
  lorsqu'une exécution rapide est primordiale par rapport aux réseaux récurrents (RNN/LSTM).
use_cases:
  - "Classification de signaux biomédicaux (ECG, EEG)."
  - "Détection d'anomalies sur des séries temporelles industrielles."
  - "Classification rapide de textes basés sur des n-grammes lexicaux."
pros:
  - "Très rapide à entraîner grâce à la parallélisation des calculs."
  - "Efficace pour extraire des caractéristiques locales (motifs de forme)."
cons:
  - "Peine à capturer les dépendances temporelles à très long terme comparé à un LSTM."
hyperparameters:
  num_filters: "Nombre de filtres convolutifs (ex: 64)."
  kernel_size: "Taille de la fenêtre (ex: 3)."
  epochs: "Nombre d'époques (ex: 10)."
math_theory: |
  Un réseau CNN 1D applique une opération de convolution croisée discrète sur une séquence d'entrée pour extraire des motifs locaux.
  Soit une séquence d'entrée $\textcolor{#3b82f6}{x}$ et un filtre (ou noyau) $\textcolor{#10b981}{w}$ de taille $K$.
  La sortie $\textcolor{#fbbf24}{y_i}$ (feature map) à la position $i$ est calculée par :
  $$\textcolor{#fbbf24}{y_i} = \sigma \left( \sum_{k=0}^{K-1} \textcolor{#3b82f6}{x_{i+k}} \cdot \textcolor{#10b981}{w_k} + \textcolor{#8b5cf6}{b} \right)$$
  où $\textcolor{#8b5cf6}{b}$ est le biais et $\sigma$ une fonction d'activation non linéaire (comme ReLU).
  Le pooling réduit ensuite la dimension spatiale, et l'opération est répétée pour $F$ filtres afin de créer de multiples représentations (canaux) de la séquence temporelle.
