math_theory: |
  La classification zero-shot avec des modèles MNLI formule le problème comme une inférence en langage naturel (NLI). 
  Le texte d'entrée est traité comme la **Prémisse** ($\textcolor{#3b82f6}{P}$), et l'étiquette candidate est injectée dans un modèle (template) pour former l'**Hypothèse** ($\textcolor{#10b981}{H}$), telle que "Ce texte parle de $\textcolor{#10b981}{\text{label}}$".
  
  Le modèle produit des logits pour l'Implication (Entailment), la Contradiction et le Neutre. La probabilité que l'étiquette soit vraie est calculée en appliquant la fonction softmax sur les logits d'implication et de contradiction (en ignorant le neutre) :
  
  $$
  P(\textcolor{#10b981}{y} \mid \textcolor{#3b82f6}{X}) = \frac{\exp(\textcolor{#fbbf24}{s_{\text{entail}}})}{\exp(\textcolor{#fbbf24}{s_{\text{entail}}}) + \exp(\textcolor{#ef4444}{s_{\text{contra}}})}
  $$
  
  où :
  *   $\textcolor{#3b82f6}{X}$ est le texte d'entrée.
  *   $\textcolor{#10b981}{y}$ est l'étiquette candidate.
  *   $\textcolor{#fbbf24}{s_{\text{entail}}}$ est le logit pour l'implication (entailment).
  *   $\textcolor{#ef4444}{s_{\text{contra}}}$ est le logit pour la contradiction.

