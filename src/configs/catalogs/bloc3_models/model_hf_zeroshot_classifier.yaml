id: "model_hf_zeroshot_classifier"
name: "Model: HuggingFace Zero-Shot Classifier"
description: "Modèle de classification de texte (BART/RoBERTa) capable d'assigner des catégories arbitraires à des documents en utilisant l'inférence en langage naturel (NLI), sans aucun besoin de données d'entraînement préalables."
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "classification", "transformers", "huggingface", "zero-shot"]
applies_to: ["Texte"]
when_to_use: "Idéal lors de l'exploration initiale de données textuelles ou lorsqu'il faut classer des textes selon des catégories spécifiques (ex: thématiques métier) mais qu'absolument aucune donnée labellisée n'est disponible pour entraîner un modèle classique."
use_cases:
  - "Classification de tickets de support client selon de nouvelles thématiques."
  - "Catégorisation d'articles de blog ou d'actualités à la volée."
  - "Filtrage rapide de commentaires ou d'avis (ex: 'positif', 'constructif', 'spam')."
pros:
  - "Flexibilité totale: les classes sont définies par de simples chaînes de caractères lors de l'inférence."
  - "Déploiement immédiat sans étape d'entraînement chronophage."
  - "Performances souvent surprenantes pour des concepts génériques."
cons:
  - "Temps d'inférence très élevé (nécessite de tester chaque classe potentielle)."
  - "Moins précis qu'un modèle fine-tuné sur un jeu de données métier spécifique."
  - "Très gourmand en ressources matérielles (idéalement sur GPU)."
hyperparameters:
  text_col: "Colonne texte (si dataframe)."
  candidate_labels: "Classes cibles séparées par des virgules (ex: 'sport, cuisine, politique')."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from transformers import pipeline
  except ImportError:
      pipeline = None
      print("[ERREUR] transformers n'est pas installé. Lancez : !pip install transformers")

  # [PARAM: TEXT_COL | string]
  TEXT_COL = "text"
  # [/PARAM]

  # [PARAM: CANDIDATE_LABELS | string]
  CANDIDATE_LABELS = "sport, cuisine, politique"
  # [/PARAM]

  print(f"[MODEL] HuggingFace Zero-Shot Classifier...")
  if 'X_test' in locals() and pipeline is not None:
      texts = []
      if isinstance(X_test, pd.DataFrame) and TEXT_COL in X_test.columns:
          texts = X_test[TEXT_COL].astype(str).tolist()
      elif isinstance(X_test, (pd.Series, np.ndarray, list)):
          texts = [str(x) for x in X_test]
          
      if texts:
          labels = [l.strip() for l in CANDIDATE_LABELS.split(",") if l.strip()]
          print("Chargement du modèle zero-shot (facebook/bart-large-mnli)...")
          classifier = pipeline("zero-shot-classification", model="facebook/bart-large-mnli")
          
          print("Classification en cours (peut être très long sur CPU)...")
          results = classifier(texts, candidate_labels=labels)
          
          y_pred = np.array([res['labels'][0] for res in results])
          y_proba = np.array([res['scores'][0] for res in results])
          feature_importances = None
          model = classifier
          
          if 'preprocessor' in locals() and preprocessor is not None:
              try: from imblearn.pipeline import Pipeline
              except: from sklearn.pipeline import Pipeline
              full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
          else:
              full_pipeline = model
              
          training_history = {"status": "success", "type": "zero_shot_classification"}
          task_type = "classification"
          meta = {"classes": labels}
