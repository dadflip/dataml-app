id: "model_decision_tree_classifier"
name: "Model: Decision Tree Classifier"
description: "Modèle d'arbre de décision pour la classification. Construit une hiérarchie de règles logiques (if/else) pour segmenter récursivement l'espace des données."
category: "Modèles Basés sur les Arbres"
tags: ["model", "classification", "tabular", "sklearn", "tree"]
applies_to: ["Tabulaire"]
when_to_use: "Indispensable lorsque l'explicabilité du modèle est une exigence absolue et que les décisions doivent être comprises et validées par des experts métiers."
use_cases:
  - "Scoring de crédit avec justification réglementaire des refus."
  - "Aide au diagnostic médical interprétable."
  - "Segmentation de clients selon des règles métier claires."
pros:
  - "Extrêmement transparent et facile à interpréter graphiquement."
  - "Insensible aux variations d'échelle (pas de normalisation requise) et gère bien les relations non linéaires."
cons:
  - "Très forte propension au sur-apprentissage (overfitting) si la profondeur n'est pas régulée."
  - "Instabilité structurelle : de petites variations dans les données d'entraînement peuvent générer un arbre complètement différent."
hyperparameters:
  max_depth: "Profondeur maximale de l'arbre."
  min_samples_split: "Nombre minimum d'exemples requis pour diviser un nœud."
math_theory: |
  L'arbre de décision (algorithme CART) divise récursivement l'espace des données pour maximiser la pureté des nœuds enfants.
  
  L'impureté d'un nœud $\textcolor{#fbbf24}{D}$ est souvent mesurée par l'indice de $\textcolor{#3b82f6}{Gini}$ :
  
  $$
  \textcolor{#3b82f6}{Gini}(\textcolor{#fbbf24}{D}) = 1 - \sum_{i=1}^C \textcolor{#ef4444}{p_i}^2 
  $$
  
  où $\textcolor{#ef4444}{p_i}$ est la proportion d'observations de la classe $i$ dans le nœud $\textcolor{#fbbf24}{D}$.
  
  La meilleure division sur une variable $\textcolor{#8b5cf6}{A}$ est celle qui maximise le gain d'information (ou la réduction d'impureté) :
  
  $$
  \textcolor{#10b981}{IG}(\textcolor{#fbbf24}{D}, \textcolor{#8b5cf6}{A}) = \textcolor{#3b82f6}{Gini}(\textcolor{#fbbf24}{D}) - \frac{|\textcolor{#fbbf24}{D}_{gauche}|}{|\textcolor{#fbbf24}{D}|} \textcolor{#3b82f6}{Gini}(\textcolor{#fbbf24}{D}_{gauche}) - \frac{|\textcolor{#fbbf24}{D}_{droite}|}{|\textcolor{#fbbf24}{D}|} \textcolor{#3b82f6}{Gini}(\textcolor{#fbbf24}{D}_{droite}) 
  $$
  
  La prédiction finale dans une feuille est la classe majoritaire (celle ayant le plus grand $\textcolor{#ef4444}{p_i}$).
