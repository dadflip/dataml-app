id: "model_self_organizing_map"
name: "Model: Self-Organizing Map (SOM / Kohonen)"
description: "Réseau de neurones non-supervisé (Kohonen) qui réduit la dimensionnalité tout en préservant la topologie originelle, projetant des données complexes sur une carte 2D (ou 3D) organisée."
category: "Génératif & Non-Supervisé"
tags: ["model", "unsupervised", "clustering", "som", "neural-network"]
applies_to: ["Tabulaire"]
when_to_use: "Idéal pour visualiser des structures complexes de données en grande dimension, repérer des anomalies ou segmenter des profils (clustering topologique)."
use_cases:
  - "Segmentation de la clientèle selon de nombreux attributs comportementaux."
  - "Visualisation et cartographie de profils de gènes ou d'expressions cellulaires."
  - "Détection de fraudes par l'identification de profils déviant de la carte standard."
pros:
  - "Préserve la structure topologique et la proximité spatiale des données."
  - "Excellente visualisation 2D intuitive des relations multidimensionnelles."
  - "Robuste au bruit grâce à sa méthode d'apprentissage compétitif."
cons:
  - "Coûteux en calcul et lent à entraîner, particulièrement sur de grands volumes."
  - "Délicat à configurer (taille de grille, taux d'apprentissage, rayon de voisinage)."
  - "Ne gère pas intrinsèquement les données catégorielles sans encodage spécifique."
hyperparameters:
  x_size: "Largeur de la carte (ex: 10)."
  y_size: "Hauteur de la carte (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  try:
      from minisom import MiniSom
  except ImportError:
      MiniSom = None
      print("[ERREUR] minisom n'est pas installé. Lancez : !pip install MiniSom")

  # [PARAM: X_SIZE | number]
  X_SIZE = 10
  # [/PARAM]

  # [PARAM: Y_SIZE | number]
  Y_SIZE = 10
  # [/PARAM]

  print(f"[MODEL] Entraînement SOM ({X_SIZE}x{Y_SIZE})...")
  if 'X_train' in locals() and 'X_test' in locals() and MiniSom is not None:
      X_tr_np = np.array(X_train, dtype=np.float32)
      X_te_np = np.array(X_test, dtype=np.float32)
      som = MiniSom(x=int(X_SIZE), y=int(Y_SIZE), input_len=X_tr_np.shape[1], sigma=1.0, learning_rate=0.5)
      som.random_weights_init(X_tr_np)
      som.train_random(data=X_tr_np, num_iteration=100)
      preds = []
      for x in X_te_np:
          w = som.winner(x)
          preds.append(f"{w[0]}_{w[1]}")
      y_pred = np.array(preds)
      y_proba = None
      feature_importances = None
      full_pipeline = som
      training_history = {"status": "success"}
      task_type = "clustering"
math_theory: |
  Une carte auto-organisatrice (SOM) est un type de réseau de neurones artificiels compétitif qui produit une représentation en basse dimension (typiquement 2D) de l'espace d'entrée.
  
  1. **Phase compétitive** : Pour un vecteur d'entrée donné $\textcolor{#10b981}{x}$, l'unité la mieux correspondante (Best Matching Unit, BMU) est le nœud $c$ de la grille dont le vecteur de poids $\textcolor{#3b82f6}{W_i}$ est le plus proche de $\textcolor{#10b981}{x}$ :
  $$
  c = \arg\min_i \| \textcolor{#10b981}{x} - \textcolor{#3b82f6}{W_i} \| 
  $$
  
  2. **Phase coopérative** : Une fonction de voisinage $\textcolor{#fbbf24}{h_{c, i}(t)}$ (souvent gaussienne) détermine à quel point les nœuds environnants sont affectés. Elle diminue avec la distance par rapport au BMU dans la topologie de la grille et rétrécit au fil du temps $t$ :
  $$
  \textcolor{#fbbf24}{h_{c, i}(t)} = \exp\left(-\frac{\|r_c - r_i\|^2}{2\sigma^2(t)}\right) 
  $$
  
  3. **Phase adaptative** : Les poids du BMU et de ses voisins sont mis à jour pour se rapprocher du vecteur d'entrée, contrôlés par le taux d'apprentissage $\textcolor{#ef4444}{\alpha(t)}$ :
  $$
  \textcolor{#3b82f6}{W_i}(t+1) = \textcolor{#3b82f6}{W_i}(t) + \textcolor{#ef4444}{\alpha(t)} \cdot \textcolor{#fbbf24}{h_{c, i}(t)} \cdot (\textcolor{#10b981}{x} - \textcolor{#3b82f6}{W_i}(t)) 
  $$
