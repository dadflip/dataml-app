id: "model_ridge_classifier"
name: "Model: Ridge Classifier"
description: |
  Classifieur linéaire reposant sur la régression Ridge. Il convertit le problème de classification binaire ou multiclasse en transformant la cible en valeurs {-1, 1} et en résolvant un problème de régression sous pénalité L2 (régularisation de Tikhonov).
category: "Modèles Linéaires"
tags: ["model", "classification", "tabular", "sklearn", "linear"]
applies_to: ["Tabulaire"]
when_to_use: |
  Particulièrement indiqué lorsque votre jeu de données tabulaire présente un grand nombre de variables explicatives fortement corrélées entre elles (multicolinéarité) ou lorsque le nombre de variables dépasse le nombre d'observations.
use_cases:
  - "Analyse de données génomiques (microarrays) où les gènes (variables) sont très nombreux et corrélés."
  - "Classification de textes sous forme de vecteurs TF-IDF denses (bag-of-words)."
  - "Tâches de classification nécessitant une interprétabilité maximale (via les coefficients) et une très faible latence."
pros:
  - "Extrêmement rapide à entraîner grâce à l'existence d'une solution analytique fermée (Cholesky, SVD)."
  - "Bien plus robuste au surapprentissage que la régression logistique standard grâce à la pénalité L2."
  - "Gère élégamment les problèmes de multicolinéarité sans exclure de variables."
cons:
  - "Ne produit pas de probabilités natives d'appartenance aux classes (predict_proba indisponible)."
  - "Ne réalise pas de sélection de variables stricte (contrairement à Lasso), tous les coefficients restent non nuls."
  - "Performance limitée sur des problèmes présentant des frontières de décision hautement non-linéaires."
hyperparameters:
  alpha: "Force de régularisation (ex: 1.0). Plus c'est grand, plus c'est robuste au bruit."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import RidgeClassifier
  from sklearn.pipeline import Pipeline

  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]

  task_type = "classification"
  meta = {
      "model_name": "Ridge Classifier",
      "framework": "scikit-learn",
      "task_type": task_type
  }

  model = RidgeClassifier(alpha=float(ALPHA), random_state=42)

  if 'preprocessor' in globals() and preprocessor is not None:
      full_pipeline = Pipeline([
          ('preprocessor', preprocessor),
          ('model', model)
      ])
  else:
      full_pipeline = Pipeline([
          ('model', model)
      ])

  full_pipeline.fit(X_train, y_train)

  y_pred = full_pipeline.predict(X_test)
  y_proba = None # RidgeClassifier ne supporte pas predict_proba nativement

  feature_importances = None
  if hasattr(model, 'coef_'):
      coefs = np.abs(model.coef_).mean(axis=0) if model.coef_.ndim > 1 else np.abs(model.coef_[0])
      if 'preprocessor' in globals() and hasattr(preprocessor, 'get_feature_names_out'):
          try:
              feature_names = preprocessor.get_feature_names_out()
              if len(feature_names) == len(coefs):
                  feature_importances = pd.Series(coefs, index=feature_names).sort_values(ascending=False).head(20).to_dict()
          except Exception:
              pass
      else:
          if hasattr(X_train, 'columns'):
              feature_importances = pd.Series(coefs, index=X_train.columns).sort_values(ascending=False).head(20).to_dict()

  training_history = []
math_theory: |
  The Ridge Classifier transforms classification into a linear regression problem with L2 regularization (Tikhonov regularization), providing a fast, closed-form analytic solution.
  
  1. **Label Conversion**: Binary class labels $\textcolor{#10b981}{y_{bin}} \in \{0, 1\}$ are converted to $\textcolor{#8b5cf6}{y} \in \{-1, 1\}$.
  
  2. **Ridge Regression Objective**: The weights $\textcolor{#3b82f6}{w}$ are optimized to minimize the squared difference between the linear projection and the target values, penalized by the L2 norm of the weights controlled by $\textcolor{#fbbf24}{\alpha}$:
  $$ \min_{\textcolor{#3b82f6}{w}} \| \textcolor{#10b981}{X} \textcolor{#3b82f6}{w} - \textcolor{#8b5cf6}{y} \|_2^2 + \textcolor{#fbbf24}{\alpha} \| \textcolor{#3b82f6}{w} \|_2^2 $$
  
  3. **Analytic Solution**: Because the objective is convex and smooth, the exact global minimum can be found via the normal equation:
  $$ \textcolor{#3b82f6}{\hat{w}} = (\textcolor{#10b981}{X}^T \textcolor{#10b981}{X} + \textcolor{#fbbf24}{\alpha} I)^{-1} \textcolor{#10b981}{X}^T \textcolor{#8b5cf6}{y} $$
  
  4. **Decision Rule**: Predictions are made by taking the sign of the linear projection:
  $$ \hat{y}_{pred} = \text{sign}(\textcolor{#10b981}{X}_{test} \textcolor{#3b82f6}{\hat{w}}) $$
