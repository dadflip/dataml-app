id: "model_ridge_classifier"
name: "Model: Ridge Classifier"
description: "Classifieur basé sur la régression Ridge. Convertit la cible en {-1, 1} et applique une régression avec pénalité L2."
category: "Modèles Linéaires"
tags: ["model", "classification", "tabular", "sklearn", "linear"]
applies_to: ["Tabulaire"]
when_to_use: "Quand vous avez beaucoup de variables colinéaires (multicolinéarité)."
pros:
  - "Très rapide (résolution analytique possible)."
  - "Moins sensible au sur-apprentissage que la régression logistique sans pénalité."
cons:
  - "Ne fournit pas de probabilités natives (predict_proba indisponible)."
hyperparameters:
  alpha: "Force de régularisation (ex: 1.0). Plus c'est grand, plus c'est robuste au bruit."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.linear_model import RidgeClassifier
  from sklearn.pipeline import Pipeline

  # [PARAM: ALPHA | number]
  ALPHA = 1.0
  # [/PARAM]

  task_type = "classification"
  meta = {
      "model_name": "Ridge Classifier",
      "framework": "scikit-learn",
      "task_type": task_type
  }

  model = RidgeClassifier(alpha=float(ALPHA), random_state=42)

  if 'preprocessor' in globals() and preprocessor is not None:
      full_pipeline = Pipeline([
          ('preprocessor', preprocessor),
          ('model', model)
      ])
  else:
      full_pipeline = Pipeline([
          ('model', model)
      ])

  full_pipeline.fit(X_train, y_train)

  y_pred = full_pipeline.predict(X_test)
  y_proba = None # RidgeClassifier ne supporte pas predict_proba nativement

  feature_importances = None
  if hasattr(model, 'coef_'):
      coefs = np.abs(model.coef_).mean(axis=0) if model.coef_.ndim > 1 else np.abs(model.coef_[0])
      if 'preprocessor' in globals() and hasattr(preprocessor, 'get_feature_names_out'):
          try:
              feature_names = preprocessor.get_feature_names_out()
              if len(feature_names) == len(coefs):
                  feature_importances = pd.Series(coefs, index=feature_names).sort_values(ascending=False).head(20).to_dict()
          except Exception:
              pass
      else:
          if hasattr(X_train, 'columns'):
              feature_importances = pd.Series(coefs, index=X_train.columns).sort_values(ascending=False).head(20).to_dict()

  training_history = []
illustration_mermaid: |
  graph TD
    subgraph Data Pipeline
      Input([Raw Features]) --> Preprocessor[[Data Preprocessing]]
      Preprocessor --> Features[Scaled Features]
    end
    subgraph Ridge Optimization
      Features --> LinearCombo[Linear Combination: W*X + b]
      Target[(Labels: -1, 1)] --> Loss{Squared Error Loss}
      LinearCombo --> Loss
      Loss --> L2[+ L2 Penalty: alpha * ||W||^2]
      L2 --> Opt((Analytical Solver))
    end
    subgraph Output
      Opt --> Weights[Optimized Weights W]
      Weights --> Predict[Sign(W*X + b)]
      Predict --> Pred([Class Predictions])
    end
    style Input fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
    style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

