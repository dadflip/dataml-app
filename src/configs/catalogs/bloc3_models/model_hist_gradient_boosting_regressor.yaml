id: "model_hist_gradient_boosting_regressor"
name: "Model: HistGradientBoosting Regressor"
description: "Algorithme d'ensemble (Boosting) natif de Scikit-Learn pour la régression, optimisé par binning (histogrammes) pour traiter efficacement de grands volumes de données."
category: "Modèles Basés sur les Arbres"
tags: ["model", "regression", "tabular", "sklearn", "ensemble", "boosting"]
applies_to: ["Tabulaire"]
when_to_use: "À utiliser pour des tâches de régression sur des jeux de données volumineux (plus de 10 000 échantillons) où la rapidité d'entraînement est cruciale, en tant qu'alternative native à LightGBM ou XGBoost."
use_cases:
  - "Prévision de la demande (ventes, stocks) sur de longs historiques."
  - "Estimation de la valeur immobilière sur des données nationales."
  - "Prédiction de séries temporelles avec de très nombreuses variables exogènes."
pros:
  - "Vitesse d'exécution remarquable grâce à la discrétisation des caractéristiques continues en histogrammes."
  - "Prise en charge native des valeurs manquantes (NaNs)."
  - "Inclus directement dans Scikit-Learn, facilitant le déploiement."
cons:
  - "Absence de la propriété 'feature_importances_' native (nécessite des méthodes alternatives comme la permutation)."
  - "Réglage fin des hyperparamètres parfois moins riche que dans des bibliothèques externes dédiées."
  - "Les très petits jeux de données ne bénéficient pas de son architecture et risquent le surapprentissage."
hyperparameters:
  max_iter: "Nombre maximum d'arbres (ex: 100)."
  learning_rate: "Taux d'apprentissage (ex: 0.1)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import HistGradientBoostingRegressor

  # [PARAM: MAX_ITER | number]
  MAX_ITER = 100
  # [/PARAM]

  # [PARAM: LEARNING_RATE | number]
  LEARNING_RATE = 0.1
  # [/PARAM]

  print(f"[MODEL] Entraînement HistGradientBoosting Regressor (iter={MAX_ITER}, lr={LEARNING_RATE})...")
  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      model = HistGradientBoostingRegressor(max_iter=int(MAX_ITER), learning_rate=float(LEARNING_RATE), random_state=42)
      model.fit(X_train, y_train)
      
      y_pred = model.predict(X_test)
      y_proba = None
      
      feature_importances = None
              
      if 'preprocessor' in locals() and preprocessor is not None:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          try: from imblearn.pipeline import Pipeline
          except: from sklearn.pipeline import Pipeline
          full_pipeline = Pipeline(steps=[('model', model)])
          
      training_history = {"status": "success", "fitted_on": len(X_train)}
      task_type = "regression"
      meta = {}
