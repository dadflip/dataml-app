id: "model_chronos_forecaster"
name: "Model: Chronos Zero-Shot Forecaster (Amazon)"
description: |
  Modèle Zero-Shot pour séries temporelles basé sur l'architecture LLM T5 (Amazon).
  Il tokenise les valeurs continues des séries temporelles en symboles discrets
  et génère des trajectoires futures de manière autorégressive, sans nécessiter d'entraînement local.
category: "Modèles Séries Temporelles"
tags: ["model", "time-series", "forecasting", "transformers", "huggingface", "zero-shot"]
applies_to: ["Séries Temporelles"]
when_to_use: |
  Pour générer des prévisions robustes rapidement sur des données uni-variées
  lorsque vous ne disposez pas de données suffisantes pour entraîner un modèle de A à Z.
use_cases:
  - "Prévisions rapides de ventes sur de nouveaux produits (Cold-start forecasting)."
  - "Génération de trajectoires d'évolution pour des séries peu fournies."
  - "Baseline universelle pour comparer d'autres modèles de prévision."
pros:
  - "Approche Zero-Shot : prédictions immédiates sans phase d'entraînement."
  - "S'appuie sur la généralisation puissante des LLMs pré-entraînés."
cons:
  - "Lent (il s'agit d'un Large Language Model)."
  - "Nécessite PyTorch et une infrastructure avec GPU pour des performances acceptables."
hyperparameters:
  prediction_length: "Horizon de prédiction (ex: 12)."
code_template: |
  import pandas as pd
  import numpy as np

  # Default fallback
  model = None
  full_pipeline = None
  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "forecasting"
  meta = {"model_name": "Chronos Zero-Shot Forecaster"}

  try:
      import torch
      from chronos import ChronosPipeline # Nécessite pip install git+https://github.com/amazon-science/chronos-forecasting.git
  except ImportError:
      ChronosPipeline = None
      print("[ERREUR] chronos n'est pas installé. Lancez : !pip install git+https://github.com/amazon-science/chronos-forecasting.git")

  # [PARAM: PREDICTION_LENGTH | number]
  PREDICTION_LENGTH = 12
  # [/PARAM]

  print(f"[MODEL] Inférence Chronos Forecaster (horizon={PREDICTION_LENGTH})...")
  if 'y_train' in locals() and ChronosPipeline is not None:
      # y_train sert de contexte historique (context_length)
      context = torch.tensor(np.array(y_train), dtype=torch.float32)
      
      print("Chargement de amazon/chronos-t5-tiny...")
      pipeline = ChronosPipeline.from_pretrained(
          "amazon/chronos-t5-tiny",
          device_map="auto",
          torch_dtype=torch.bfloat16 if torch.cuda.is_available() else torch.float32,
      )
      
      print("Inférence (génération des trajectoires)...")
      # forecast shape: [1, num_samples, prediction_length]
      # Predict without gradients
      with torch.no_grad():
          forecast = pipeline.predict(context.unsqueeze(0), int(PREDICTION_LENGTH))
      
      # On prend la médiane des trajectoires
      median_forecast = np.quantile(forecast[0].float().numpy(), 0.5, axis=0)
      
      y_pred = median_forecast
      
      full_pipeline = pipeline
      model = pipeline
          
      training_history = {"status": "success", "type": "zero_shot_llm_timeseries"}

