math_theory: |
  Chronos modélise la prévision temporelle comme une tâche de génération de langage.
  La série continue $Y = \{y_1, \dots, y_t\}$ est quantifiée en une séquence de tokens discrets $T = \{\textcolor{#3b82f6}{t_1}, \dots, \textcolor{#3b82f6}{t_t}\}$ issus d'un vocabulaire fini $\textcolor{#10b981}{V}$.
  Un modèle de langage pré-entraîné (architecture T5) apprend la distribution du prochain token de manière autorégressive :
  $$ P(\textcolor{#3b82f6}{t_{t+1}} | \textcolor{#3b82f6}{t_1}, \dots, \textcolor{#3b82f6}{t_t}) = \text{Transformer}(\textcolor{#3b82f6}{t_{1:t}} ; \textcolor{#fbbf24}{\theta}) $$
  
  Où :
  - $\textcolor{#3b82f6}{t_i}$ représente le signal temporel discrétisé.
  - $\textcolor{#10b981}{V}$ est l'espace du vocabulaire, permettant au modèle de traiter la série comme du texte.
  - $\textcolor{#fbbf24}{\theta}$ rassemble les poids du Transformer encodeur-décodeur.
