id: "model_spacy_ner"
name: "Model: SpaCy Named Entity Recognition (NER)"
description: "Pipeline NLP pour l'extraction d'entités nommées (Personnes, Lieux, Organisations) à partir de texte libre."
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "ner", "spacy", "pretrained"]
applies_to: ["Texte"]
when_to_use: "Pour extraire dynamiquement de l'information (ex: extraire les noms de villes d'un corpus de tweets)."
pros:
  - "Extrêmement robuste et rapide (Zero-Shot inference)."
cons:
  - "Nécessite le modèle linguistique adéquat (en, fr, etc.)."
hyperparameters:
  spacy_model: "Nom du modèle spaCy (ex: 'en_core_web_md')."
code_template: |
  import pandas as pd
  import numpy as np
  import json
  try:
      import spacy
  except ImportError:
      spacy = None
      print("[ERREUR] spacy n'est pas installé. Lancez : !pip install spacy")

  # [PARAM: SPACY_MODEL | string]
  SPACY_MODEL = "en_core_web_md"
illustration_mermaid: |
    graph LR
      Data([Features]) --> Model((Machine Learning))
      Model --> Pred([Predictions])
      style Model fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
      style Data fill:#f8fafc,stroke:#94a3b8,stroke-width:1px
      style Pred fill:#f8fafc,stroke:#94a3b8,stroke-width:1px

