id: "model_spacy_ner"
name: "Model: SpaCy Named Entity Recognition (NER)"
description: "Pipeline NLP pré-entraîné basé sur spaCy pour l'Extraction d'Entités Nommées (NER), permettant d'identifier et catégoriser des entités spécifiques (personnes, lieux, organisations, dates) dans des textes libres."
category: "Modèles NLP (Pré-entraînés)"
tags: ["model", "nlp", "ner", "spacy", "pretrained"]
applies_to: ["Texte"]
when_to_use: "Utile lorsque vous avez besoin d'extraire rapidement des informations structurées à partir de gros corpus textuels sans avoir de données annotées pour entraîner un modèle de zéro."
use_cases:
  - "Extraction automatique de noms de villes et de personnes à partir de flux d'actualités."
  - "Anonymisation de documents en détectant et masquant les informations personnelles."
  - "Structuration de CVs (extraction d'écoles, entreprises et compétences)."
pros:
  - "Prêt à l'emploi (Zero-Shot) avec d'excellentes performances de base."
  - "Très rapide, optimisé pour des pipelines de production intensifs."
  - "Supporte un grand nombre de langues via différents modèles téléchargeables."
cons:
  - "Nécessite le téléchargement préalable des modèles linguistiques lourds (ex: `fr_core_news_md`)."
  - "Difficile à fine-tuner sur un domaine très spécifique (médical, juridique) comparé aux Transformers."
  - "Les performances dépendent exclusivement de la qualité des données d'entraînement d'origine du modèle spaCy."
hyperparameters:
  spacy_model: "Nom du modèle spaCy (ex: 'en_core_web_md')."
math_theory: |
  Le modèle de Reconnaissance d'Entités Nommées (NER) de SpaCy utilise une architecture basée sur les transitions (Transition-Based) avec un réseau de neurones convolutif (CNN) ou un Transformer pour encoder le contexte.
  Étant donné une séquence de tokens en entrée $\textcolor{#10b981}{X} = (x_1, \dots, x_{\textcolor{#fbbf24}{T}})$, le modèle produit des représentations contextuelles $\textcolor{#3b82f6}{h}_t$.
  Les décisions de transition (par ex., Shift, Reduce, Label) sont prédites itérativement pour construire les entités $\textcolor{#ef4444}{E}$.
  Le score pour une transition $\textcolor{#8b5cf6}{a}$ à l'état $s$ est modélisé par :

  $$
  P(\textcolor{#8b5cf6}{a} | s, \textcolor{#10b981}{X}) = \text{Softmax}(\textcolor{#3b82f6}{W} \cdot \textcolor{#3b82f6}{h}_{s} + \textcolor{#3b82f6}{b}) 
  $$

  Le modèle recherche la séquence d'actions qui maximise la vraisemblance conjointe pour identifier les entités cibles.
