id: "model_linear_svr"
name: "Model: Linear SVR"
description: |
  Support Vector Regressor (SVR) à noyau strictement linéaire. Implémentation basée sur liblinear offrant une approche efficace pour les problèmes de régression linéaire à grande échelle avec tolérance d'erreur intégrée.
category: "Modèles Basés sur la Distance / Marges"
tags: ["model", "regression", "tabular", "sklearn", "svm", "linear"]
applies_to: ["Tabulaire"]
when_to_use: |
  Très utile pour la régression sur des ensembles de données massifs ou possédant un très grand nombre de colonnes (dimensions), notamment lorsque l'on souhaite ignorer de petites erreurs grâce à la marge epsilon.
use_cases:
  - "Prédiction de temps d'exécution ou de durée à partir d'un grand nombre d'indicateurs système."
  - "Évaluation quantitative à partir de caractéristiques textuelles (ex: notation à partir de reviews)."
  - "Régression robuste dans des espaces de haute dimension où les relations sont principalement linéaires."
pros:
  - "Extrêmement rapide à l'entraînement, passe à l'échelle pour des millions d'exemples."
  - "Tolérance paramétrable (epsilon) permettant de ne pas pénaliser les petites erreurs de prédiction."
  - "Fournit les poids des caractéristiques (coef_) pour une bonne interprétabilité."
cons:
  - "Restriction stricte aux relations linéaires."
  - "Hyperparamètres (C et epsilon) qui nécessitent souvent un réglage minutieux."
  - "Très sensible à l'échelle des variables (standardisation obligatoire)."
hyperparameters:
  C: "Paramètre de régularisation (ex: 1.0)."
  epsilon: "Marge de tolérance d'erreur (ex: 0.0)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.svm import LinearSVR
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: C_PARAM | number]
  C_PARAM = 1.0
  # [/PARAM]

  # [PARAM: EPSILON | number]
  EPSILON = 0.0
  # [/PARAM]

  print(f"[MODEL] Initialisation Linear SVR (C={C_PARAM}, epsilon={EPSILON})...")

  model = LinearSVR(C=float(C_PARAM), epsilon=float(EPSILON), random_state=42, dual="auto")

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "regression"
  meta = {}

  if 'X_train' in locals() and 'y_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline avec Linear SVR...")
      full_pipeline.fit(X_train, y_train)
      y_pred = full_pipeline.predict(X_test)
      
      if hasattr(model, 'coef_'):
          coefs = np.abs(model.coef_)
          if 'feature_names_out' in locals() and feature_names_out is not None and len(coefs) == len(feature_names_out):
              feature_importances = pd.Series(coefs, index=feature_names_out)
          else:
              feature_importances = pd.Series(coefs)
              
      training_history = {"status": "success", "fitted_on": len(X_train)}
