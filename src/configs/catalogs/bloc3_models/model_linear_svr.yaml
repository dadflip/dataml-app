math_theory: |
  Linear Support Vector Regression (SVR) tries to find a linear function that fits the data while tolerating errors within a specified margin $\textcolor{#8b5cf6}{\epsilon}$ (epsilon-tube). It minimizes the L2 norm of the weights along with a penalty for predictions that fall outside the $\epsilon$-tube:
  
  $$ \min_{w, b} \left( \frac{1}{2} ||\textcolor{#ef4444}{w}||_2^2 + \textcolor{#fbbf24}{C} \sum_{i=1}^{N} \max(0, |\textcolor{#3b82f6}{y}^{(i)} - (\textcolor{#10b981}{X}^{(i)} \textcolor{#ef4444}{w} + b)| - \textcolor{#8b5cf6}{\epsilon}) \right) $$
  
  Where $\textcolor{#ef4444}{w}$ and $b$ parameterize the regression line, $\textcolor{#3b82f6}{y}$ is the continuous target, $\textcolor{#10b981}{X}$ is the feature matrix, $\textcolor{#fbbf24}{C}$ controls the penalty, and $\textcolor{#8b5cf6}{\epsilon}$ defines the width of the insensitive zone.

