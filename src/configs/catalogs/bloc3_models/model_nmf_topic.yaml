    subgraph Non-Negative Matrix Factorization
        D --> E[Matrix Factorization: V ≈ W * H]
        E --> F[Matrix W: Document-Topic Weights]
        E --> G[Matrix H: Topic-Term Weights]
        F --> H[Optimize Frobenius Norm or Kullback-Leibler]
    end
    
    X_test[Input Data: X_test] --> I(Preprocessing Pipeline)
    I --> J[Map to Topic Space via Matrix W]
    H -.-> J
    J --> K[Argmax of W matrix]
    K --> L([y_pred: Dominant Topic])
    J --> M([y_proba: Topic Distribution])
    
    style D fill:#8b5cf6,stroke:#7c3aed,stroke-width:2px,color:#fff
