id: "model_nmf_topic"
name: "Model: Non-Negative Matrix Factorization (NMF)"
description: "Algorithme d'algèbre linéaire de Factorisation de Matrices Non-Négatives (NMF), largement utilisé en extraction de caractéristiques et en modélisation thématique (Topic Modeling) pour des documents textuels."
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "unsupervised", "topic-modeling", "sklearn", "nmf"]
applies_to: ["Texte"]
when_to_use: "Excellente option pour dégager des thématiques latentes à partir de vastes corpus textuels encodés avec TF-IDF, souvent plus rapide et fournissant des thèmes plus cohérents que le LDA sur ce type de matrice."
use_cases:
  - "Découverte de sujets majeurs (Topic Modeling) dans une base de documents non labellisés."
  - "Extraction de composantes sémantiques ou de mots-clés prédominants."
  - "Réduction de dimensionnalité pour des matrices creuses contenant uniquement des valeurs positives."
pros:
  - "Convergence rapide et très efficace lorsqu'il est combiné à un pré-traitement TF-IDF."
  - "Produit des composantes souvent plus interprétables que la PCA, car sans contributions négatives."
cons:
  - "Ne fournit pas de véritables probabilités d'appartenance comme le LDA, seulement des intensités relatives."
  - "Exige que les données d'entrée soient strictement non-négatives."
hyperparameters:
  n_components: "Nombre de topics (ex: 10)."
code_template: |
  import pandas as pd
  import numpy as np
  from sklearn.decomposition import NMF
  try:
      from imblearn.pipeline import Pipeline
  except ImportError:
      from sklearn.pipeline import Pipeline

  # [PARAM: N_COMPONENTS | number]
  N_COMPONENTS = 10
  # [/PARAM]

  print(f"[MODEL] Initialisation NMF Topic Modeling (n_topics={N_COMPONENTS})...")
  
  model = NMF(n_components=int(N_COMPONENTS), init='nndsvda', random_state=42)

  if 'preprocessor' in locals() and preprocessor is not None:
      if hasattr(preprocessor, 'steps'):
          full_pipeline = Pipeline(steps=preprocessor.steps + [('model', model)])
      else:
          full_pipeline = Pipeline(steps=[('preprocessor', preprocessor), ('model', model)])
  else:
      full_pipeline = Pipeline(steps=[('model', model)])

  y_pred = None
  y_proba = None
  feature_importances = None
  training_history = {}
  task_type = "clustering"
  meta = {}

  if 'X_train' in locals() and 'X_test' in locals():
      print("[MODEL] Entraînement du pipeline NMF...")
      
      # NMF doesn't take y_train. 
      # Because full_pipeline.fit in sklearn doesn't strictly need y if steps are unsupervised,
      # but we provide it safely
      if 'y_train' in locals() and y_train is not None:
          full_pipeline.fit(X_train, y_train)
      else:
          full_pipeline.fit(X_train)
          
      # Predictions: Topic dominant
      topic_dist = full_pipeline.transform(X_test)
      y_pred = np.argmax(topic_dist, axis=1)
      y_proba = topic_dist / np.sum(topic_dist, axis=1, keepdims=True) # Pseudo-proba
      
      # For feature importances, we can export the topic-word matrix W if we have feature_names
      if hasattr(model, 'components_'):
          if 'feature_names_out' in locals() and feature_names_out is not None and model.components_.shape[1] == len(feature_names_out):
              # Importance of words globally across topics
              feature_importances = pd.Series(np.sum(model.components_, axis=0), index=feature_names_out)
              
      training_history = {"status": "success", "reconstruction_err": model.reconstruction_err_}
math_theory: |
  La Factorisation de Matrices Non-Négatives (NMF) décompose une matrice de données $\textcolor{#10b981}{V}$ en un produit de deux matrices de rang inférieur $\textcolor{#3b82f6}{W}$ et $\textcolor{#fbbf24}{H}$, avec la contrainte stricte que toutes les valeurs doivent être positives ou nulles.

  $$ \textcolor{#10b981}{V} \approx \textcolor{#3b82f6}{W} \times \textcolor{#fbbf24}{H} $$
  
  L'objectif est de minimiser l'erreur de reconstruction (norme de Frobenius) :
  $$ \textcolor{#ef4444}{L} = \frac{1}{2} ||\textcolor{#10b981}{V} - \textcolor{#3b82f6}{W}\textcolor{#fbbf24}{H}||_F^2 $$
  Sous contrainte : $\textcolor{#3b82f6}{W} \ge 0, \textcolor{#fbbf24}{H} \ge 0$

  - $\textcolor{#10b981}{V}$ : Matrice Document-Terme initiale (taille $N \times M$)
  - $\textcolor{#3b82f6}{W}$ : Matrice Document-Topic (taille $N \times \textcolor{#8b5cf6}{K}$) indiquant le poids de chaque topic dans chaque document
  - $\textcolor{#fbbf24}{H}$ : Matrice Topic-Terme (taille $\textcolor{#8b5cf6}{K} \times M$) indiquant l'importance de chaque mot dans chaque topic
  - $\textcolor{#8b5cf6}{K}$ : Nombre de topics (composantes latentes)
