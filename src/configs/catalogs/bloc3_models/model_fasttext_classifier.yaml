id: "model_fasttext_classifier"
name: "Model: FastText Classifier (Facebook)"
description: |
  Modèle de classification de texte ultra-rapide développé par Facebook Research. Gère efficacement l'OOV (Out Of Vocabulary) grâce à l'utilisation de n-grammes de caractères.
category: "Modèles NLP (Entraînés)"
tags: ["model", "nlp", "classification", "fasttext"]
applies_to: ["Texte"]
when_to_use: |
  Privilégiez ce modèle lorsque vous avez besoin de performances de type Word2Vec, mais avec un entraînement nettement plus rapide (particulièrement adapté pour un entraînement sur CPU) et la capacité de gérer des mots hors vocabulaire.
use_cases:
  - "Classification de sentiments sur de grands corpus de textes courts."
  - "Détection de spam ou de langage abusif."
  - "Catégorisation de documents thématiques."
pros:
  - "Rapidité d'entraînement et d'inférence exceptionnelle."
  - "Gestion robuste des mots inconnus (OOV) grâce aux n-grammes de caractères."
  - "Très peu gourmand en ressources, fonctionne très bien sur CPU."
cons:
  - "Nécessite l'installation du package C++ FastText, parfois difficile sur certains environnements."
  - "Moins performant que les modèles de type Transformer (BERT) sur des tâches nécessitant un contexte complexe."
  - "Représentations statiques des mots, sans prise en compte du contexte global de la phrase."
hyperparameters:
  epoch: "Nombre d'époques (ex: 25)."
  lr: "Taux d'apprentissage (ex: 0.1)."
math_theory: |
  FastText modélise un document comme la somme des représentations de ses mots et de ses n-grammes de caractères.
  Soit $\textcolor{#10b981}{X} = \{x_1, \dots, x_{\textcolor{#fbbf24}{N}}\}$ l'ensemble des n-grammes (mots et sous-mots) d'un texte.
  La représentation du document $\textcolor{#3b82f6}{h}$ est la moyenne de leurs embeddings $\textcolor{#8b5cf6}{v}_{x_n}$ :
  $$ \textcolor{#3b82f6}{h} = \frac{1}{\textcolor{#fbbf24}{N}} \sum_{n=1}^{\textcolor{#fbbf24}{N}} \textcolor{#8b5cf6}{v}_{x_n} $$
  Cette représentation est ensuite multipliée par une matrice de poids $\textcolor{#ef4444}{W}$ et passée dans une fonction Softmax (ou Softmax hiérarchique pour accélérer le calcul) afin de prédire la classe $y$ :
  $$ P(y | \textcolor{#10b981}{X}) = \text{Softmax}(\textcolor{#ef4444}{W} \cdot \textcolor{#3b82f6}{h}) $$
