# ══════════════════════════════════════════════════════════════════════════
# CONTRAT I/O GLOBAL DU PIPELINE ML
# ══════════════════════════════════════════════════════════════════════════
#
#  BLOC 2 — eda_config.yaml
#    INPUT  : df, X, y, feature_names, target_name, task_type, meta
#             + texts_train / texts_test  (NLP)
#             + y_train / y_test / dates_train / dates_future  (timeseries)
#    OUTPUT : X_train, X_test, y_train, y_test
#             preprocessor  (sklearn Pipeline/ColumnTransformer — fitted)
#             feature_names_out  (list[str] — après OHE/poly/selection)
#             task_type  (confirmé / inchangé)
#             + dates_train / dates_future  (timeseries, pass-through)
#             + texts_train / texts_test    (NLP, pass-through ou splitté)
#
#  RÈGLE D'OR : ne jamais renommer ces variables entre les blocs.
#  Seuls les paramètres en MAJUSCULES sont à adapter — tout le reste est câblé.
#
#  ORGANISATION BLOC 2 :
#    1. EDA (visualisations — ne modifient pas les variables)
#    2. Split train/test (OBLIGATOIRE sauf timeseries qui arrivent pré-splittées)
#    3. Preprocessing (imputation, encoding, scaling, feature engineering)
#    4. Feature selection (optionnel)
#    5. Gestion du déséquilibre de classes (optionnel)
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
# CONTRAT I/O — BLOC 2 : eda_config.yaml
# ──────────────────────────────────────────────────────────────────────────

pipeline_contract:
  bloc: 2
  role: "EDA · Split · Preprocessing · Feature Engineering"

  input_variables:
    # ── Câblées depuis Bloc 1 ─────────────────────────────────────────
    df:               "pd.DataFrame — données brutes"
    X:                "pd.DataFrame — features brutes"
    y:                "pd.Series | None — target"
    feature_names:    "list[str]"
    target_name:      "str | None"
    task_type:        "str"
    meta:             "dict"
    texts_train:      "list[str] — NLP (corpus entier si pas de split natif)"
    texts_test:       "list[str] — NLP ([] si pas de split natif)"
    y_train:          "pd.Series | None — timeseries pré-splitté"
    y_test:           "pd.Series | None — timeseries pré-splitté"
    dates_train:      "pd.DatetimeIndex | None"
    dates_future:     "pd.DatetimeIndex | None"

    # ── Paramètres utilisateur à définir localement ────────────────────
    TARGET_COL:        "str — colonne cible (répéter localement)"
    TEXT_COL:          "str | None — colonne texte"
    DATE_COL:          "str | None — colonne datetime"
    GROUP_COL:         "str | None — identifiant de groupe"
    TEST_SIZE:         "float — ratio test (défaut : 0.2)"
    RANDOM_STATE:      "int — graine aléatoire (défaut : 42)"
    HIGH_NA_THRESHOLD: "float — seuil % NaN pour suppression (défaut : 60)"
    ALPHA:             "float — lissage target encoding (défaut : 10)"
    K:                 "int — nombre de features à conserver"
    THRESHOLD:         "float — seuil importance (défaut : 0.005)"

  output_variables:
    # ── Variables TOUJOURS produites ──────────────────────────────────
    X_train:           "np.ndarray | pd.DataFrame — features preprocessées train"
    X_test:            "np.ndarray | pd.DataFrame — features preprocessées test"
    y_train:           "pd.Series | np.ndarray — target train"
    y_test:            "pd.Series | np.ndarray — target test"
    preprocessor:      "sklearn ColumnTransformer | Pipeline — fitted sur X_train"
    feature_names_out: "list[str] — noms après OHE / poly / sélection"
    task_type:         "str — confirmé / inchangé"

    # ── Pass-through timeseries ────────────────────────────────────────
    dates_train:       "pd.DatetimeIndex | None"
    dates_future:      "pd.DatetimeIndex | None"

    # ── Pass-through NLP (ou splitté ici si texts_test était []) ──────
    texts_train:       "list[str]"
    texts_test:        "list[str]"


# ══════════════════════════════════════════════════════════════════════════
# CONVENTION DE SORTIE UNIVERSELLE
#
# Chaque snippet de preprocessing DOIT produire :
#   X_train, X_test, y_train, y_test,
#   preprocessor, feature_names_out, task_type,
#   dates_train, dates_future, texts_train, texts_test
#
# Template de clôture à ajouter en fin de chaque snippet :
#
#   # Pass-through variables non modifiées
#   # dates_train / dates_future : déjà présentes (timeseries) ou None
#   # texts_train / texts_test   : déjà présentes (nlp) ou []
#   # task_type                  : inchangé
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
# SECTION A — SPLIT TRAIN / TEST
# Doit être exécuté EN PREMIER dans le Bloc 2 (avant EDA sur les splits
# pour éviter tout data leakage, ou après EDA globale sur df entier).
# Les timeseries arrivent déjà splittées depuis Bloc 1 (pass-through).
# ──────────────────────────────────────────────────────────────────────────

split:

  - id: split_standard
    name: "Split Train / Test Standard"
    enabled: true
    category: "Split"
    description: "Split stratifié pour classification, simple pour régression/clustering."
    applies_to: ["classification", "regression", "clustering", "anomaly"]
    when_to_use: "Premier bloc à exécuter dans Bloc 2 pour tous les task_type sauf timeseries."
    code_template: |
      from sklearn.model_selection import train_test_split

      # ── Paramètres ────────────────────────────────────────────────────
      TEST_SIZE    = 0.2
      RANDOM_STATE = 42

      # ── Split ─────────────────────────────────────────────────────────
      stratify = y if task_type == "classification" else None

      X_train, X_test, y_train, y_test = train_test_split(
          X, y,
          test_size=TEST_SIZE,
          stratify=stratify,
          random_state=RANDOM_STATE,
      )

      print(f"Train : {X_train.shape} | Test : {X_test.shape}")
      if task_type == "classification":
          print(f"Distribution train : {y_train.value_counts(normalize=True).round(3).to_dict()}")
          print(f"Distribution test  : {y_test.value_counts(normalize=True).round(3).to_dict()}")

      # Pass-through (inchangées depuis Bloc 1 pour task_type non-TS)
      # dates_train / dates_future : None (non timeseries)
      # texts_train / texts_test   : [] (non NLP)

  - id: split_nlp
    name: "Split Train / Test NLP"
    enabled: true
    category: "Split"
    description: "Split stratifié du corpus et des labels NLP. Gère le cas où texts_test est déjà fourni."
    applies_to: ["nlp"]
    when_to_use: "Pour NLP quand texts_test == [] (pas de split natif depuis Bloc 1)."
    code_template: |
      from sklearn.model_selection import train_test_split
      import numpy as np

      # ── Paramètres ────────────────────────────────────────────────────
      TEST_SIZE    = 0.2
      RANDOM_STATE = 42

      if texts_test:
          # Split natif fourni par Bloc 1 (ex: HuggingFace) — pass-through
          print(f"Split natif détecté : train={len(texts_train)} | test={len(texts_test)}")
          # y_train / y_test à reconstituer depuis y si absent
          if y is not None and y_train is None:
              n_train = len(texts_train)
              y_train_nlp = y.iloc[:n_train]
              y_test_nlp  = y.iloc[n_train:]
          else:
              y_train_nlp = y_train
              y_test_nlp  = y_test
      else:
          # Pas de split natif — on le fait ici
          labels = y.values if y is not None else np.zeros(len(texts_train))
          stratify = labels if y is not None and len(np.unique(labels)) > 1 else None

          texts_train, texts_test, y_train_nlp, y_test_nlp = train_test_split(
              texts_train, labels,
              test_size=TEST_SIZE,
              stratify=stratify,
              random_state=RANDOM_STATE,
          )
          print(f"Split NLP : train={len(texts_train)} | test={len(texts_test)}")

      # Aliaser pour cohérence contrat
      y_train = y_train_nlp
      y_test  = y_test_nlp

      # Placeholder preprocessor (sera fitté par le bloc preprocessing NLP)
      X_train = texts_train
      X_test  = texts_test

      # dates inchangées (None pour NLP)
      # task_type inchangé

  - id: split_timeseries_passthrough
    name: "Split Timeseries (Pass-Through)"
    enabled: true
    category: "Split"
    description: "Les timeseries arrivent pré-splittées de Bloc 1. Ce bloc valide et passe les variables."
    applies_to: ["timeseries"]
    when_to_use: "Toujours pour les timeseries. Le split temporel est déjà fait dans Bloc 1."
    code_template: |
      # Les variables y_train, y_test, dates_train, dates_future
      # sont déjà produites par le Bloc 1 (split temporel inhérent).
      # Ce bloc valide simplement leur présence.

      assert y_train is not None,      "y_train manquant — vérifier Bloc 1 timeseries"
      assert y_test  is not None,      "y_test manquant  — vérifier Bloc 1 timeseries"
      assert dates_train  is not None, "dates_train manquant"
      assert dates_future is not None, "dates_future manquant"

      print(f"Timeseries — train : {len(y_train)} obs | test : {len(y_test)} obs")
      print(f"Horizon prévision  : {len(dates_future)} pas")
      print(f"Fréquence          : {meta.get('freq', 'N/A')}")

      # X_train / X_test pour les features exogènes (si présentes)
      if X is not None and X.shape[1] > 0:
          split_idx = len(y_train)
          X_train = X.iloc[:split_idx]
          X_test  = X.iloc[split_idx:split_idx + len(y_test)]
      else:
          X_train = None
          X_test  = None

      # Pass-through
      # texts_train / texts_test : []
      # task_type : "timeseries"


# ──────────────────────────────────────────────────────────────────────────
# SECTION B — EDA (ANALYSES EXPLORATOIRES)
# S'exécutent sur df entier (avant split) ou sur X_train uniquement.
# Ne modifient PAS les variables du contrat.
# ──────────────────────────────────────────────────────────────────────────

eda:

  - id: eda_overview
    name: "Vue d'Ensemble du Dataset"
    enabled: true
    category: "EDA — Structure"
    description: "Shape, types, mémoire, valeurs manquantes, cardinalités, doublons."
    applies_to: ["classification", "regression", "clustering", "timeseries", "nlp", "anomaly", "survival"]
    when_to_use: "Toujours en premier. Diagnostic global avant tout traitement."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns

      print("=" * 70)
      print(f"SHAPE        : {df.shape[0]:,} lignes × {df.shape[1]} colonnes")
      print(f"MÉMOIRE      : {df.memory_usage(deep=True).sum() / 1024**2:.1f} MB")
      print(f"DOUBLONS     : {df.duplicated().sum():,} ({df.duplicated().mean()*100:.2f}%)")
      print(f"TASK TYPE    : {task_type}")

      # Synthèse par colonne
      summary = pd.DataFrame({
          "dtype"      : df.dtypes,
          "n_unique"   : df.nunique(),
          "n_missing"  : df.isnull().sum(),
          "pct_missing": (df.isnull().mean() * 100).round(2),
          "sample_val" : [df[c].dropna().iloc[0] if df[c].notna().any() else None for c in df.columns],
      })
      print("\n── Résumé colonnes ──")
      print(summary.to_string())

      # Colonnes par type
      num_cols  = df.select_dtypes(include="number").columns.tolist()
      cat_cols  = df.select_dtypes(include=["object", "category"]).columns.tolist()
      date_cols = df.select_dtypes(include="datetime").columns.tolist()
      bool_cols = df.select_dtypes(include="bool").columns.tolist()

      print(f"\nNumériques    ({len(num_cols)}) : {num_cols}")
      print(f"Catégorielles ({len(cat_cols)}) : {cat_cols}")
      print(f"Dates         ({len(date_cols)}): {date_cols}")
      print(f"Booléens      ({len(bool_cols)}): {bool_cols}")

      # Statistiques numériques
      if num_cols:
          print("\n── Stats numériques ──")
          print(df[num_cols].describe(percentiles=[.01, .05, .25, .5, .75, .95, .99]).T.to_string())

      # Stats catégorielles
      if cat_cols:
          print("\n── Stats catégorielles ──")
          for col in cat_cols[:10]:
              print(f"  {col}: {df[col].value_counts().head(5).to_dict()}")

      # ── Plot : heatmap valeurs manquantes ─────────────────────────────
      miss_cols = [c for c in df.columns if df[c].isnull().any()]
      if miss_cols:
          plt.figure(figsize=(max(8, len(miss_cols)), 4))
          sns.heatmap(df[miss_cols].isnull().T, cbar=False, cmap="viridis",
                      yticklabels=True, xticklabels=False)
          plt.title("Heatmap valeurs manquantes (features × observations)")
          plt.tight_layout(); plt.show()

      # ── Plot : % manquants par colonne ────────────────────────────────
      miss_pct = df.isnull().mean().sort_values(ascending=False)
      miss_pct = miss_pct[miss_pct > 0]
      if not miss_pct.empty:
          fig, ax = plt.subplots(figsize=(10, max(3, len(miss_pct) * 0.3)))
          miss_pct.plot.barh(ax=ax, color="tomato")
          ax.axvline(0.6, color="red", linestyle="--", label="seuil 60%")
          ax.axvline(0.2, color="orange", linestyle="--", label="seuil 20%")
          ax.set_xlabel("% manquants"); ax.legend()
          plt.title("Taux de valeurs manquantes par feature")
          plt.tight_layout(); plt.show()

      # ── Plot : types de données ───────────────────────────────────────
      type_counts = df.dtypes.astype(str).value_counts()
      type_counts.plot.pie(autopct="%1.0f%%", figsize=(5, 5))
      plt.title("Répartition des types de colonnes")
      plt.tight_layout(); plt.show()

  - id: eda_distributions
    name: "Distributions & Outliers"
    enabled: true
    category: "EDA — Univarié"
    description: "Histogrammes, KDE, boxplots, violin plots, tests de normalité, détection outliers IQR/Z-score."
    applies_to: ["classification", "regression", "clustering", "anomaly"]
    when_to_use: "Comprendre la distribution de chaque feature avant scaling/transformation."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy import stats

      TARGET_COL = target_name
      num_cols   = df.select_dtypes(include="number").columns.tolist()
      feats      = [c for c in num_cols if c != TARGET_COL]

      n_cols = 4
      n_rows = max(1, int(np.ceil(len(feats) / n_cols)))

      # ── Histogrammes + KDE ────────────────────────────────────────────
      fig, axes = plt.subplots(n_rows, n_cols, figsize=(5 * n_cols, 3 * n_rows))
      axes = np.array(axes).flatten()
      for i, col in enumerate(feats):
          s = df[col].dropna()
          axes[i].hist(s, bins=40, alpha=0.6, color="steelblue", density=True, label="hist")
          try:
              kde = stats.gaussian_kde(s)
              xs  = np.linspace(s.min(), s.max(), 200)
              axes[i].plot(xs, kde(xs), color="navy", linewidth=1.5, label="KDE")
          except Exception:
              pass
          axes[i].axvline(s.mean(),   color="red",   linestyle="--", linewidth=1, label="mean")
          axes[i].axvline(s.median(), color="green", linestyle="--", linewidth=1, label="median")
          axes[i].set_title(f"{col}\nskew={stats.skew(s):.2f}", fontsize=8)
          axes[i].legend(fontsize=6)
      for j in range(i + 1, len(axes)):
          axes[j].set_visible(False)
      plt.suptitle("Distributions (histogramme + KDE)", fontsize=12)
      plt.tight_layout(); plt.show()

      # ── Boxplots ──────────────────────────────────────────────────────
      fig, axes = plt.subplots(n_rows, n_cols, figsize=(5 * n_cols, 3 * n_rows))
      axes = np.array(axes).flatten()
      for i, col in enumerate(feats):
          axes[i].boxplot(df[col].dropna(), vert=True, patch_artist=True,
                          boxprops=dict(facecolor="lightblue"))
          axes[i].set_title(col, fontsize=8)
      for j in range(i + 1, len(axes)):
          axes[j].set_visible(False)
      plt.suptitle("Boxplots (outliers visibles)", fontsize=12)
      plt.tight_layout(); plt.show()

      # ── Violin plots ──────────────────────────────────────────────────
      if len(feats) <= 20:
          fig, ax = plt.subplots(figsize=(max(10, len(feats) * 0.8), 5))
          data_for_violin = [df[c].dropna().values for c in feats]
          ax.violinplot(data_for_violin, showmedians=True)
          ax.set_xticks(range(1, len(feats) + 1))
          ax.set_xticklabels(feats, rotation=45, ha="right", fontsize=8)
          plt.title("Violin plots des features numériques")
          plt.tight_layout(); plt.show()

      # ── Q-Q Plots (normalité) ─────────────────────────────────────────
      n_qq = min(8, len(feats))
      fig, axes = plt.subplots(2, n_qq // 2, figsize=(4 * (n_qq // 2), 8))
      axes = np.array(axes).flatten()
      for i, col in enumerate(feats[:n_qq]):
          stats.probplot(df[col].dropna(), dist="norm", plot=axes[i])
          axes[i].set_title(f"Q-Q {col}", fontsize=8)
      plt.suptitle("Q-Q Plots (normalité)")
      plt.tight_layout(); plt.show()

      # ── ECDF ──────────────────────────────────────────────────────────
      n_ecdf = min(6, len(feats))
      fig, axes = plt.subplots(1, n_ecdf, figsize=(4 * n_ecdf, 4))
      if n_ecdf == 1:
          axes = [axes]
      for i, col in enumerate(feats[:n_ecdf]):
          s = df[col].dropna().sort_values()
          axes[i].plot(s.values, np.arange(1, len(s) + 1) / len(s))
          axes[i].set_title(f"ECDF {col}", fontsize=8)
          axes[i].set_xlabel(col); axes[i].set_ylabel("P(X ≤ x)")
      plt.suptitle("Fonctions de répartition empiriques (ECDF)")
      plt.tight_layout(); plt.show()

      # ── Tableau d'outliers ────────────────────────────────────────────
      outlier_report = {}
      for col in feats:
          s      = df[col].dropna()
          Q1, Q3 = s.quantile(0.25), s.quantile(0.75)
          IQR    = Q3 - Q1
          n_iqr  = ((s < Q1 - 1.5 * IQR) | (s > Q3 + 1.5 * IQR)).sum()
          z      = np.abs(stats.zscore(s))
          n_z3   = (z > 3).sum()
          sk     = stats.skew(s)
          sample = s.sample(min(len(s), 5000), random_state=42)
          _, p   = stats.shapiro(sample)
          outlier_report[col] = {
              "IQR_outliers": n_iqr,
              "Z3_outliers":  n_z3,
              "skewness":     round(sk, 3),
              "shapiro_p":    round(p, 4),
              "normal?":      p > 0.05,
          }
      print(pd.DataFrame(outlier_report).T.to_string())

  - id: eda_target
    name: "Analyse de la Target"
    enabled: true
    category: "EDA — Target"
    description: "Distribution de la target, déséquilibre de classes, outliers pour régression, treemap de classes."
    applies_to: ["classification", "regression"]
    when_to_use: "Comprendre la cible avant tout modèle."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy import stats

      TARGET_COL = target_name
      y_plot     = df[TARGET_COL]
      IS_CLASSIF = task_type == "classification"

      if IS_CLASSIF:
          counts = y_plot.value_counts()
          pcts   = y_plot.value_counts(normalize=True) * 100
          ratio  = counts.max() / counts.min()

          print("Distribution des classes :")
          for cls, cnt in counts.items():
              print(f"  {str(cls):>20} : {cnt:>8,}  ({pcts[cls]:.2f}%)")
          print(f"\nRatio déséquilibre (max/min) : {ratio:.1f}x")
          if ratio > 5:
              print("⚠ Déséquilibre sévère → SMOTE, class_weight ou seuil ajusté")

          # ── Barplot + Pie ──────────────────────────────────────────────
          fig, axes = plt.subplots(1, 3, figsize=(16, 5))
          counts.plot.bar(ax=axes[0], color=sns.color_palette("tab10", len(counts)))
          axes[0].set_title("Comptage par classe")
          axes[0].set_xlabel("Classe"); axes[0].set_ylabel("Count")
          for p in axes[0].patches:
              axes[0].annotate(f"{int(p.get_height()):,}", (p.get_x() + p.get_width() / 2,
                               p.get_height()), ha="center", va="bottom", fontsize=8)

          counts.plot.pie(ax=axes[1], autopct="%1.1f%%", startangle=90,
                          colors=sns.color_palette("tab10", len(counts)))
          axes[1].set_title("Répartition (%)"); axes[1].set_ylabel("")

          pcts.plot.barh(ax=axes[2], color="steelblue")
          axes[2].set_title("% par classe"); axes[2].set_xlabel("%")
          axes[2].axvline(100 / len(counts), color="red", linestyle="--",
                          label="équilibre parfait")
          axes[2].legend()
          plt.suptitle(f"Distribution de la target : {TARGET_COL}")
          plt.tight_layout(); plt.show()

      else:
          # ── Régression : distribution + Q-Q + log + boxplot ───────────
          fig, axes = plt.subplots(2, 3, figsize=(18, 10))

          y_plot.hist(bins=60, ax=axes[0, 0], color="steelblue", alpha=0.8, edgecolor="white")
          axes[0, 0].axvline(y_plot.mean(),   color="red",   linestyle="--", label="mean")
          axes[0, 0].axvline(y_plot.median(), color="green", linestyle="--", label="median")
          axes[0, 0].set_title("Distribution de la target")
          axes[0, 0].legend()

          stats.probplot(y_plot.dropna(), dist="norm", plot=axes[0, 1])
          axes[0, 1].set_title("Q-Q Plot (normalité)")

          np.log1p(y_plot.clip(lower=0)).hist(bins=60, ax=axes[0, 2], color="tomato", alpha=0.8)
          axes[0, 2].set_title("Distribution log1p(target)")

          axes[1, 0].boxplot(y_plot.dropna(), vert=False, patch_artist=True,
                             boxprops=dict(facecolor="lightblue"))
          axes[1, 0].set_title("Boxplot")

          # ECDF
          s = y_plot.dropna().sort_values()
          axes[1, 1].plot(s.values, np.arange(1, len(s) + 1) / len(s), color="navy")
          axes[1, 1].set_title("ECDF")
          axes[1, 1].set_xlabel(TARGET_COL)

          # Violin
          axes[1, 2].violinplot(y_plot.dropna(), showmedians=True)
          axes[1, 2].set_title("Violin plot")

          plt.suptitle(f"Analyse complète de la target : {TARGET_COL}")
          plt.tight_layout(); plt.show()

          print(f"Skewness  : {stats.skew(y_plot.dropna()):.3f}")
          print(f"Kurtosis  : {stats.kurtosis(y_plot.dropna()):.3f}")
          print(y_plot.describe(percentiles=[.01, .05, .25, .5, .75, .95, .99]))

  - id: eda_correlations
    name: "Corrélations & Relations"
    enabled: true
    category: "EDA — Multivarié"
    description: "Heatmap Pearson/Spearman, pairplot, scatter matrix, corrélation target, VIF, clustered heatmap."
    applies_to: ["classification", "regression", "clustering"]
    when_to_use: "Avant feature selection pour détecter redondance et features prédictives."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy.stats import spearmanr
      from scipy.cluster import hierarchy

      TARGET_COL = target_name
      num_cols   = df.select_dtypes(include="number").columns.tolist()
      feats      = [c for c in num_cols if c != TARGET_COL]

      # ── Heatmap Pearson ───────────────────────────────────────────────
      corr_p = df[num_cols].corr(method="pearson")
      mask   = np.triu(np.ones_like(corr_p, dtype=bool))
      size   = max(8, min(20, len(num_cols)))
      fig, axes = plt.subplots(1, 2, figsize=(size * 2, size))
      sns.heatmap(corr_p, mask=mask, cmap="RdBu_r", center=0, vmin=-1, vmax=1,
                  annot=len(num_cols) <= 15, fmt=".2f", linewidths=0.5, ax=axes[0])
      axes[0].set_title("Corrélation de Pearson")

      # ── Heatmap Spearman ──────────────────────────────────────────────
      corr_s = df[num_cols].corr(method="spearman")
      sns.heatmap(corr_s, mask=mask, cmap="RdBu_r", center=0, vmin=-1, vmax=1,
                  annot=len(num_cols) <= 15, fmt=".2f", linewidths=0.5, ax=axes[1])
      axes[1].set_title("Corrélation de Spearman")
      plt.suptitle("Matrices de corrélation")
      plt.tight_layout(); plt.show()

      # ── Heatmap clusterisée (dendrogramme) ───────────────────────────
      corr_clust = df[feats].corr().fillna(0)
      g = sns.clustermap(corr_clust, cmap="RdBu_r", center=0, figsize=(size, size),
                         method="ward", metric="euclidean",
                         annot=len(feats) <= 15, fmt=".2f")
      g.fig.suptitle("Heatmap clusterisée (Ward)", y=1.02)
      plt.show()

      # ── Corrélation avec la target ────────────────────────────────────
      if TARGET_COL in df.columns:
          target_corr_p = (df[num_cols].corr()[TARGET_COL]
                           .drop(TARGET_COL, errors="ignore").abs()
                           .sort_values(ascending=True))
          target_corr_s = df[feats].apply(lambda c: spearmanr(c.dropna(), df.loc[c.dropna().index, TARGET_COL]).correlation)
          target_corr_s = target_corr_s.abs().sort_values(ascending=True)

          fig, axes = plt.subplots(1, 2, figsize=(16, max(4, len(feats) * 0.35)))
          target_corr_p.plot.barh(ax=axes[0], color="steelblue")
          axes[0].set_title(f"|Pearson| avec {TARGET_COL}")
          axes[0].axvline(0.1, color="red", linestyle="--", label="seuil 0.1")
          axes[0].legend()
          target_corr_s.plot.barh(ax=axes[1], color="tomato")
          axes[1].set_title(f"|Spearman| avec {TARGET_COL}")
          plt.suptitle("Corrélation features → target")
          plt.tight_layout(); plt.show()

      # ── Pairplot (sur un sous-ensemble) ──────────────────────────────
      top_feats = feats[:min(5, len(feats))]
      if TARGET_COL in df.columns:
          top_feats_with_target = top_feats + [TARGET_COL]
          hue_col = TARGET_COL if task_type == "classification" else None
          g = sns.pairplot(df[top_feats_with_target].dropna(),
                           hue=hue_col, plot_kws=dict(alpha=0.4, s=15),
                           diag_kind="kde")
          g.fig.suptitle("Pairplot (top 5 features + target)", y=1.02)
          plt.show()

      # ── Paires très corrélées (multicolinéarité) ──────────────────────
      corr_abs = corr_p.abs()
      np.fill_diagonal(corr_abs.values, 0)
      high_corr = [(i, j, corr_abs.loc[i, j])
                   for i in corr_abs.index for j in corr_abs.columns
                   if corr_abs.loc[i, j] > 0.85 and list(corr_abs.index).index(i) < list(corr_abs.columns).index(j)]
      high_corr.sort(key=lambda x: -x[2])
      if high_corr:
          print(f"\n⚠ Paires fortement corrélées (>0.85) : {len(high_corr)}")
          for fi, fj, v in high_corr[:10]:
              print(f"  {fi} ↔ {fj} : {v:.3f}")

      # ── VIF ───────────────────────────────────────────────────────────
      try:
          from statsmodels.stats.outliers_influence import variance_inflation_factor
          X_num = df[feats].dropna()
          if X_num.shape[0] > X_num.shape[1]:
              vif_data = pd.DataFrame({
                  "feature": feats,
                  "VIF": [variance_inflation_factor(X_num.values, i) for i in range(len(feats))],
              }).sort_values("VIF", ascending=False)
              print("\nVIF (>10 = multicolinéarité problématique) :")
              print(vif_data.head(20).to_string(index=False))
      except ImportError:
          print("pip install statsmodels pour le VIF")

  - id: eda_bivariate_target
    name: "Relations Bivariées Features × Target"
    enabled: true
    category: "EDA — Bivarié"
    description: "Scatter plots, box-by-class, violin-by-class, strip plots, point-biserial pour chaque feature."
    applies_to: ["classification", "regression"]
    when_to_use: "Visualiser l'impact de chaque feature sur la cible. Avant feature engineering."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy.stats import pointbiserialr, f_oneway

      TARGET_COL = target_name
      num_cols   = [c for c in df.select_dtypes(include="number").columns if c != TARGET_COL]
      cat_cols   = df.select_dtypes(include=["object", "category"]).columns.tolist()
      IS_CLASSIF = task_type == "classification"

      if IS_CLASSIF:
          # ── Boxplots numériques par classe ─────────────────────────────
          n_cols = 3
          n_rows = max(1, int(np.ceil(len(num_cols) / n_cols)))
          fig, axes = plt.subplots(n_rows, n_cols, figsize=(6 * n_cols, 4 * n_rows))
          axes = np.array(axes).flatten()
          for i, col in enumerate(num_cols):
              sns.boxplot(data=df, x=TARGET_COL, y=col, ax=axes[i],
                          palette="tab10")
              axes[i].set_title(col, fontsize=9)
          for j in range(i + 1, len(axes)):
              axes[j].set_visible(False)
          plt.suptitle("Distribution features numériques par classe")
          plt.tight_layout(); plt.show()

          # ── Violin plots par classe ────────────────────────────────────
          fig, axes = plt.subplots(n_rows, n_cols, figsize=(6 * n_cols, 4 * n_rows))
          axes = np.array(axes).flatten()
          for i, col in enumerate(num_cols):
              sns.violinplot(data=df, x=TARGET_COL, y=col, ax=axes[i],
                             palette="tab10", inner="quartile")
              axes[i].set_title(col, fontsize=9)
          for j in range(i + 1, len(axes)):
              axes[j].set_visible(False)
          plt.suptitle("Violin plots par classe")
          plt.tight_layout(); plt.show()

          # ── Strip plots ────────────────────────────────────────────────
          n_strip = min(6, len(num_cols))
          fig, axes = plt.subplots(1, n_strip, figsize=(4 * n_strip, 5))
          if n_strip == 1:
              axes = [axes]
          for i, col in enumerate(num_cols[:n_strip]):
              sns.stripplot(data=df, x=TARGET_COL, y=col, ax=axes[i],
                            alpha=0.3, jitter=True, palette="tab10", size=3)
              axes[i].set_title(col, fontsize=9)
          plt.suptitle("Strip plots (distribution individuelle par classe)")
          plt.tight_layout(); plt.show()

          # ── F-statistic (ANOVA) ───────────────────────────────────────
          f_results = {}
          classes = df[TARGET_COL].unique()
          for col in num_cols:
              groups = [df.loc[df[TARGET_COL] == c, col].dropna() for c in classes]
              groups = [g for g in groups if len(g) > 1]
              if len(groups) >= 2:
                  f, p = f_oneway(*groups)
                  f_results[col] = {"F-stat": round(f, 3), "p-value": round(p, 4)}
          print("\nANOVA F-test (discriminance features) :")
          print(pd.DataFrame(f_results).T.sort_values("F-stat", ascending=False).to_string())

          # ── Catégorielles × target : barplots taux ────────────────────
          for cat in cat_cols[:6]:
              ct = pd.crosstab(df[cat], df[TARGET_COL], normalize="index") * 100
              ct.plot.bar(stacked=True, figsize=(10, 4), colormap="tab10")
              plt.title(f"{cat} × {TARGET_COL} (% par modalité)")
              plt.ylabel("%"); plt.tight_layout(); plt.show()

      else:
          # ── Scatter numériques vs target ──────────────────────────────
          n_cols = 3
          n_rows = max(1, int(np.ceil(len(num_cols) / n_cols)))
          fig, axes = plt.subplots(n_rows, n_cols, figsize=(6 * n_cols, 4 * n_rows))
          axes = np.array(axes).flatten()
          for i, col in enumerate(num_cols):
              axes[i].scatter(df[col], df[TARGET_COL], alpha=0.2, s=5)
              # Droite de tendance
              mask = df[[col, TARGET_COL]].dropna()
              if len(mask) > 2:
                  z = np.polyfit(mask[col], mask[TARGET_COL], 1)
                  p = np.poly1d(z)
                  xs = np.linspace(mask[col].min(), mask[col].max(), 100)
                  axes[i].plot(xs, p(xs), "r--", linewidth=1.5)
              axes[i].set_xlabel(col); axes[i].set_ylabel(TARGET_COL)
              axes[i].set_title(col, fontsize=9)
          for j in range(i + 1, len(axes)):
              axes[j].set_visible(False)
          plt.suptitle("Scatter plots features vs target (+ tendance linéaire)")
          plt.tight_layout(); plt.show()

          # ── Scatter avec densité (hexbin) ─────────────────────────────
          n_hex = min(4, len(num_cols))
          fig, axes = plt.subplots(1, n_hex, figsize=(5 * n_hex, 4))
          if n_hex == 1:
              axes = [axes]
          for i, col in enumerate(num_cols[:n_hex]):
              mask = df[[col, TARGET_COL]].dropna()
              hb = axes[i].hexbin(mask[col], mask[TARGET_COL],
                                  gridsize=30, cmap="YlOrRd", mincnt=1)
              plt.colorbar(hb, ax=axes[i])
              axes[i].set_xlabel(col); axes[i].set_ylabel(TARGET_COL)
              axes[i].set_title(f"Hexbin : {col} vs {TARGET_COL}", fontsize=9)
          plt.suptitle("Densité hexagonale features vs target")
          plt.tight_layout(); plt.show()

  - id: eda_missing_analysis
    name: "Analyse des Valeurs Manquantes"
    enabled: true
    category: "EDA — Valeurs Manquantes"
    description: "Heatmap NaN, patterns, corrélation entre NaN, test MCAR, recommandations."
    applies_to: ["classification", "regression", "clustering", "anomaly", "survival"]
    when_to_use: "Avant toute imputation. Révèle si les NaN sont aléatoires (MCAR) ou structurels (MNAR)."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns

      miss = pd.DataFrame({
          "n_missing":  df.isnull().sum(),
          "pct_missing": df.isnull().mean() * 100,
      }).sort_values("pct_missing", ascending=False)
      miss = miss[miss["n_missing"] > 0]

      print(f"Colonnes avec NaN : {len(miss)} / {df.shape[1]}")
      print(miss.to_string())

      if miss.empty:
          print("✓ Aucune valeur manquante.")
      else:
          cols_na = miss.index.tolist()

          # ── Heatmap patterns ──────────────────────────────────────────
          fig, axes = plt.subplots(1, 2, figsize=(max(10, len(cols_na)), 5))
          sns.heatmap(df[cols_na].isnull().T, cbar=False, cmap="viridis",
                      yticklabels=True, xticklabels=False, ax=axes[0])
          axes[0].set_title("Heatmap NaN (features × observations)")

          # Corrélation entre patterns de NaN
          if len(cols_na) > 1:
              na_corr = df[cols_na].isnull().corr()
              sns.heatmap(na_corr, annot=True, fmt=".2f", cmap="coolwarm",
                          center=0, ax=axes[1])
              axes[1].set_title("Corrélation patterns NaN")
          plt.tight_layout(); plt.show()

          # ── Barplot taux manquants ────────────────────────────────────
          fig, ax = plt.subplots(figsize=(10, max(3, len(cols_na) * 0.4)))
          miss["pct_missing"].sort_values().plot.barh(ax=ax, color="tomato")
          ax.axvline(60, color="darkred",  linestyle="--", label="60% (suppression)")
          ax.axvline(20, color="orange",   linestyle="--", label="20% (imputation avancée)")
          ax.axvline(5,  color="green",    linestyle="--", label="5%  (imputation simple)")
          ax.set_xlabel("% manquants"); ax.legend()
          plt.title("Taux de NaN par colonne")
          plt.tight_layout(); plt.show()

          # ── Matrice de co-occurrence NaN ──────────────────────────────
          if len(cols_na) > 1:
              na_matrix = df[cols_na].isnull().astype(int)
              cooccurrence = na_matrix.T.dot(na_matrix)
              plt.figure(figsize=(max(6, len(cols_na)), max(6, len(cols_na))))
              sns.heatmap(cooccurrence, annot=True, fmt="d", cmap="Blues")
              plt.title("Co-occurrence NaN (nb lignes manquantes en commun)")
              plt.tight_layout(); plt.show()

          # ── Recommandations ───────────────────────────────────────────
          HIGH_NA_THRESHOLD = 60
          cols_to_drop = miss[miss["pct_missing"] > HIGH_NA_THRESHOLD].index.tolist()
          print(f"\n❌ Colonnes à supprimer (>{HIGH_NA_THRESHOLD}% NaN) : {cols_to_drop}")
          for col, row in miss.iterrows():
              p = row["pct_missing"]
              if p > 60:
                  print(f"  ❌ {col} ({p:.1f}%) → envisager suppression")
              elif p > 20:
                  print(f"  ⚠  {col} ({p:.1f}%) → imputation KNN/MICE ou flag binaire")
              else:
                  print(f"  ✓  {col} ({p:.1f}%) → imputation médiane/mode")

  - id: eda_timeseries_analysis
    name: "Analyse EDA Séries Temporelles"
    enabled: true
    category: "EDA — Séries Temporelles"
    description: "Série brute, décomposition STL, stationnarité (ADF/KPSS), ACF/PACF, saisonnalité, rolling stats, lag scatter."
    applies_to: ["timeseries"]
    when_to_use: "Avant ARIMA/Prophet/XGBoost TS. Révèle tendance, saisonnalité et ordre des modèles."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from statsmodels.tsa.seasonal import STL
      from statsmodels.tsa.stattools import adfuller, kpss
      from statsmodels.graphics.tsaplots import plot_acf, plot_pacf

      TARGET_COL = target_name
      series     = y_train.dropna()
      PERIOD     = meta.get("horizon", 12)   # adapter si nécessaire

      # ── 1. Série brute ────────────────────────────────────────────────
      fig, axes = plt.subplots(2, 1, figsize=(16, 8), sharex=True)
      axes[0].plot(dates_train, series.values, linewidth=1, color="steelblue")
      axes[0].set_title(f"Série temporelle : {TARGET_COL}")
      axes[0].set_ylabel(TARGET_COL)
      # Rolling moyenne + std
      roll_mean = series.rolling(PERIOD, center=True).mean()
      roll_std  = series.rolling(PERIOD, center=True).std()
      axes[1].plot(dates_train, roll_mean.values, color="orange", label=f"Rolling mean ({PERIOD})")
      axes[1].fill_between(dates_train,
                            (roll_mean - roll_std).values,
                            (roll_mean + roll_std).values,
                            alpha=0.3, color="orange", label="±1 std")
      axes[1].set_title("Rolling mean ± std")
      axes[1].legend()
      plt.tight_layout(); plt.show()

      # ── 2. Décomposition STL ──────────────────────────────────────────
      try:
          stl    = STL(series, period=PERIOD, robust=True)
          result = stl.fit()
          result.plot()
          plt.suptitle("Décomposition STL (Tendance / Saisonnalité / Résidus)")
          plt.tight_layout(); plt.show()
          print(f"Tendance     — range: [{result.trend.min():.2f}, {result.trend.max():.2f}]")
          print(f"Saisonnalité — amplitude: {result.seasonal.max() - result.seasonal.min():.2f}")
          print(f"Résidus      — std: {result.resid.std():.4f}")
      except Exception as e:
          print(f"STL non disponible : {e}")

      # ── 3. Tests de stationnarité ─────────────────────────────────────
      adf_stat, adf_p, _, _, adf_cv, _ = adfuller(series, autolag="AIC")
      print(f"\nADF  stat={adf_stat:.4f}  p={adf_p:.4f}  "
            f"{'✓ Stationnaire' if adf_p < 0.05 else '✗ Non-stationnaire'}")
      print(f"  Valeurs critiques : { {k: round(v, 3) for k, v in adf_cv.items()} }")

      try:
          kp_stat, kp_p, _, _ = kpss(series, regression="c", nlags="auto")
          print(f"KPSS stat={kp_stat:.4f}  p={kp_p:.4f}  "
                f"{'✓ Stationnaire' if kp_p > 0.05 else '✗ Non-stationnaire'}")
      except Exception as e:
          print(f"KPSS: {e}")

      # ── 4. ACF / PACF ─────────────────────────────────────────────────
      max_lags = min(60, len(series) // 2 - 1)
      fig, axes = plt.subplots(1, 2, figsize=(16, 5))
      plot_acf(series,  lags=max_lags, ax=axes[0], alpha=0.05)
      axes[0].set_title("ACF — lecture de l'ordre q (MA)")
      plot_pacf(series, lags=max_lags, ax=axes[1], alpha=0.05)
      axes[1].set_title("PACF — lecture de l'ordre p (AR)")
      plt.tight_layout(); plt.show()

      # ── 5. Saisonnalité par composante temporelle ─────────────────────
      df_ts = pd.DataFrame({TARGET_COL: series.values}, index=dates_train)
      fig, axes = plt.subplots(2, 2, figsize=(14, 10))

      if hasattr(dates_train, "month"):
          df_ts["month"] = dates_train.month
          df_ts.groupby("month")[TARGET_COL].mean().plot.bar(ax=axes[0, 0], color="steelblue")
          axes[0, 0].set_title("Moyenne par mois")

      if hasattr(dates_train, "dayofweek"):
          df_ts["dow"] = dates_train.dayofweek
          df_ts.groupby("dow")[TARGET_COL].mean().plot.bar(ax=axes[0, 1], color="tomato")
          axes[0, 1].set_title("Moyenne par jour de semaine (0=lundi)")

      if hasattr(dates_train, "hour"):
          df_ts["hour"] = dates_train.hour
          df_ts.groupby("hour")[TARGET_COL].mean().plot.bar(ax=axes[1, 0], color="forestgreen")
          axes[1, 0].set_title("Moyenne par heure")

      if hasattr(dates_train, "year"):
          df_ts["year"] = dates_train.year
          df_ts.groupby("year")[TARGET_COL].mean().plot.bar(ax=axes[1, 1], color="mediumpurple")
          axes[1, 1].set_title("Moyenne par année")

      plt.suptitle("Saisonnalité par composante temporelle")
      plt.tight_layout(); plt.show()

      # ── 6. Lag scatter plots ──────────────────────────────────────────
      n_lags_scatter = min(9, PERIOD)
      fig, axes = plt.subplots(3, 3, figsize=(12, 12))
      axes = axes.flatten()
      for i, lag in enumerate(range(1, n_lags_scatter + 1)):
          lagged = series.shift(lag).dropna()
          orig   = series.iloc[lag:]
          axes[i].scatter(lagged, orig, alpha=0.3, s=5)
          corr   = orig.corr(lagged)
          axes[i].set_title(f"Lag {lag} (r={corr:.2f})", fontsize=9)
          axes[i].set_xlabel(f"t-{lag}"); axes[i].set_ylabel("t")
      plt.suptitle("Scatter plots lag")
      plt.tight_layout(); plt.show()

      # ── 7. Boxplot par période ────────────────────────────────────────
      if hasattr(dates_train, "month"):
          df_box = pd.DataFrame({TARGET_COL: series.values,
                                 "month": dates_train.month}, index=dates_train)
          fig, ax = plt.subplots(figsize=(14, 5))
          df_box.boxplot(column=TARGET_COL, by="month", ax=ax)
          ax.set_title(f"Boxplot {TARGET_COL} par mois")
          plt.suptitle("")
          plt.tight_layout(); plt.show()

  - id: eda_nlp_corpus
    name: "Analyse EDA Corpus NLP"
    enabled: true
    category: "EDA — NLP"
    description: "Stats corpus, distribution longueurs, fréquences tokens, nuage de mots, bigrams, analyse par classe."
    applies_to: ["nlp"]
    when_to_use: "Avant vectorisation TF-IDF ou embeddings. Révèle le vocabulaire et les patterns."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from collections import Counter
      import re

      TARGET_COL  = target_name
      TEXT_COL    = feature_names[0] if feature_names else "text"
      texts_all   = texts_train + texts_test  # corpus complet pour l'EDA

      # ── 1. Statistiques de base ───────────────────────────────────────
      lens_char = [len(t) for t in texts_all]
      lens_word = [len(t.split()) for t in texts_all]
      print(f"Corpus : {len(texts_all):,} documents")
      print(f"Longueur chars — min={min(lens_char)} moy={np.mean(lens_char):.0f} max={max(lens_char)}")
      print(f"Longueur mots  — min={min(lens_word)} moy={np.mean(lens_word):.0f} max={max(lens_word)}")

      # ── 2. Distributions de longueur ─────────────────────────────────
      fig, axes = plt.subplots(1, 3, figsize=(18, 4))
      pd.Series(lens_char).hist(bins=60, ax=axes[0], color="steelblue", edgecolor="white")
      axes[0].set_title("Longueur (caractères)")
      pd.Series(lens_word).hist(bins=60, ax=axes[1], color="tomato", edgecolor="white")
      axes[1].set_title("Longueur (mots)")
      axes[2].boxplot([lens_char, lens_word], labels=["chars", "mots"])
      axes[2].set_title("Boxplot longueurs")
      plt.suptitle("Distribution des longueurs de texte")
      plt.tight_layout(); plt.show()

      # ── 3. Fréquences unigrammes ──────────────────────────────────────
      all_tokens = [t for text in texts_all
                    for t in re.findall(r"\b[a-zA-ZÀ-ÿ]{3,}\b", text.lower())]
      freq_uni   = Counter(all_tokens)
      vocab_size = len(freq_uni)
      print(f"\nVocabulaire : {vocab_size:,} tokens uniques")

      top_n = 30
      top_words = dict(freq_uni.most_common(top_n))
      fig, axes = plt.subplots(1, 2, figsize=(18, 6))
      pd.Series(top_words).sort_values().plot.barh(ax=axes[0], color="steelblue")
      axes[0].set_title(f"Top {top_n} tokens (fréquence brute)")

      # Zipf law
      freqs_sorted = sorted(freq_uni.values(), reverse=True)
      axes[1].loglog(range(1, len(freqs_sorted) + 1), freqs_sorted, color="navy")
      axes[1].set_title("Loi de Zipf (rang vs fréquence)")
      axes[1].set_xlabel("Rang"); axes[1].set_ylabel("Fréquence")
      plt.suptitle("Analyse des fréquences de tokens")
      plt.tight_layout(); plt.show()

      # ── 4. Nuage de mots ──────────────────────────────────────────────
      try:
          from wordcloud import WordCloud
          wc = WordCloud(width=800, height=400, background_color="white",
                         max_words=200).generate_from_frequencies(freq_uni)
          plt.figure(figsize=(14, 6))
          plt.imshow(wc, interpolation="bilinear")
          plt.axis("off"); plt.title("Nuage de mots — corpus entier")
          plt.tight_layout(); plt.show()
      except ImportError:
          print("pip install wordcloud")

      # ── 5. Bigrammes ──────────────────────────────────────────────────
      bigrams = []
      for text in texts_all:
          tokens = re.findall(r"\b[a-zA-ZÀ-ÿ]{3,}\b", text.lower())
          bigrams.extend(zip(tokens[:-1], tokens[1:]))
      freq_bi = Counter(bigrams)
      top_bi  = {f"{a} {b}": c for (a, b), c in freq_bi.most_common(20)}
      pd.Series(top_bi).sort_values().plot.barh(figsize=(10, 6), color="tomato")
      plt.title("Top 20 bigrammes")
      plt.tight_layout(); plt.show()

      # ── 6. Analyse par classe ─────────────────────────────────────────
      if TARGET_COL in df.columns and task_type == "nlp":
          labels_all = (list(y_train) + list(y_test)) if y_test is not None else list(y_train)
          pairs = list(zip(texts_all[:len(labels_all)], labels_all))

          classes = list(set(labels_all))
          n_cls   = len(classes)
          fig, axes = plt.subplots(2, n_cls, figsize=(6 * n_cls, 10))
          if n_cls == 1:
              axes = [[axes[0]], [axes[1]]]
          axes = np.array(axes)

          for ci, cls in enumerate(classes):
              cls_texts = [t for t, l in pairs if str(l) == str(cls)]
              cls_lens  = [len(t.split()) for t in cls_texts]
              axes[0, ci].hist(cls_lens, bins=40, color=f"C{ci}", edgecolor="white")
              axes[0, ci].set_title(f"Classe '{cls}' — longueur (mots)")

              cls_tokens = [t for text in cls_texts
                            for t in re.findall(r"\b[a-zA-ZÀ-ÿ]{3,}\b", text.lower())]
              top_cls = dict(Counter(cls_tokens).most_common(15))
              pd.Series(top_cls).sort_values().plot.barh(ax=axes[1, ci], color=f"C{ci}")
              axes[1, ci].set_title(f"Top tokens — classe '{cls}'")

          plt.suptitle("Analyse corpus par classe")
          plt.tight_layout(); plt.show()

      # ── 7. Heatmap TF-IDF (aperçu) ───────────────────────────────────
      from sklearn.feature_extraction.text import TfidfVectorizer
      tfidf = TfidfVectorizer(max_features=20, stop_words=None)
      try:
          tfidf_matrix = tfidf.fit_transform(texts_all[:500]).toarray()
          plt.figure(figsize=(14, 5))
          sns.heatmap(tfidf_matrix[:50].T, cmap="YlOrRd", yticklabels=tfidf.get_feature_names_out())
          plt.title("Heatmap TF-IDF (50 premiers docs × top 20 tokens)")
          plt.xlabel("Documents"); plt.ylabel("Tokens")
          plt.tight_layout(); plt.show()
      except Exception:
          pass

  - id: eda_clustering_overview
    name: "EDA Clustering / Anomalie"
    enabled: true
    category: "EDA — Clustering / Anomalie"
    description: "PCA 2D/3D, UMAP, t-SNE, distribution des distances, détection d'outliers Isolation Forest."
    applies_to: ["clustering", "anomaly"]
    when_to_use: "Visualiser la structure latente des données non supervisées."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns
      from sklearn.preprocessing import StandardScaler
      from sklearn.decomposition import PCA
      from sklearn.ensemble import IsolationForest

      num_cols = df.select_dtypes(include="number").columns.tolist()
      X_num    = df[num_cols].dropna()
      scaler   = StandardScaler()
      X_scaled = scaler.fit_transform(X_num)

      # ── 1. PCA 2D ─────────────────────────────────────────────────────
      pca2 = PCA(n_components=2, random_state=42)
      X_2d = pca2.fit_transform(X_scaled)

      fig, axes = plt.subplots(1, 2, figsize=(14, 6))
      axes[0].scatter(X_2d[:, 0], X_2d[:, 1], alpha=0.3, s=5, c="steelblue")
      axes[0].set_title(f"PCA 2D — variance expliquée : {pca2.explained_variance_ratio_.sum()*100:.1f}%")
      axes[0].set_xlabel("PC1"); axes[0].set_ylabel("PC2")

      # Explained variance
      pca_full = PCA(random_state=42)
      pca_full.fit(X_scaled)
      cumvar = np.cumsum(pca_full.explained_variance_ratio_)
      axes[1].plot(range(1, len(cumvar) + 1), cumvar, marker="o", markersize=3)
      axes[1].axhline(0.9, color="red", linestyle="--", label="90%")
      axes[1].axhline(0.95, color="orange", linestyle="--", label="95%")
      axes[1].set_title("Variance expliquée cumulée (PCA)")
      axes[1].set_xlabel("Nombre de composantes"); axes[1].legend()
      plt.suptitle("Analyse en Composantes Principales")
      plt.tight_layout(); plt.show()

      # ── 2. PCA 3D ─────────────────────────────────────────────────────
      if X_scaled.shape[1] >= 3:
          pca3 = PCA(n_components=3, random_state=42)
          X_3d = pca3.fit_transform(X_scaled)
          fig  = plt.figure(figsize=(10, 8))
          ax   = fig.add_subplot(111, projection="3d")
          ax.scatter(X_3d[:, 0], X_3d[:, 1], X_3d[:, 2], alpha=0.3, s=5, c="steelblue")
          ax.set_title("PCA 3D")
          plt.tight_layout(); plt.show()

      # ── 3. t-SNE 2D ───────────────────────────────────────────────────
      try:
          from sklearn.manifold import TSNE
          n_tsne = min(5000, len(X_scaled))
          idx    = np.random.choice(len(X_scaled), n_tsne, replace=False)
          tsne   = TSNE(n_components=2, perplexity=30, random_state=42, n_jobs=-1)
          X_tsne = tsne.fit_transform(X_scaled[idx])
          plt.figure(figsize=(10, 8))
          plt.scatter(X_tsne[:, 0], X_tsne[:, 1], alpha=0.3, s=5, c="tomato")
          plt.title(f"t-SNE 2D ({n_tsne} points)")
          plt.tight_layout(); plt.show()
      except Exception as e:
          print(f"t-SNE: {e}")

      # ── 4. UMAP ───────────────────────────────────────────────────────
      try:
          import umap
          reducer  = umap.UMAP(n_components=2, random_state=42)
          X_umap   = reducer.fit_transform(X_scaled[:5000])
          plt.figure(figsize=(10, 8))
          plt.scatter(X_umap[:, 0], X_umap[:, 1], alpha=0.3, s=5, c="forestgreen")
          plt.title("UMAP 2D")
          plt.tight_layout(); plt.show()
      except ImportError:
          print("pip install umap-learn pour UMAP")

      # ── 5. Distribution des distances (Isolation Forest score) ────────
      iso = IsolationForest(n_estimators=100, contamination=0.05, random_state=42)
      anomaly_scores = iso.fit_predict(X_scaled)
      anomaly_scores_raw = iso.score_samples(X_scaled)

      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      pd.Series(anomaly_scores_raw).hist(bins=60, ax=axes[0], color="purple", alpha=0.7)
      axes[0].axvline(np.percentile(anomaly_scores_raw, 5),
                      color="red", linestyle="--", label="seuil 5%")
      axes[0].set_title("Score anomalie (Isolation Forest)")
      axes[0].legend()

      axes[1].scatter(X_2d[:, 0], X_2d[:, 1],
                      c=anomaly_scores, cmap="RdYlGn", alpha=0.5, s=5)
      axes[1].set_title("PCA 2D colorée par score anomalie (-1=anomalie)")
      plt.suptitle("Détection d'anomalies")
      plt.tight_layout(); plt.show()

      n_anomalies = (anomaly_scores == -1).sum()
      print(f"Anomalies détectées : {n_anomalies} ({n_anomalies/len(anomaly_scores)*100:.1f}%)")

  - id: eda_survival_analysis
    name: "EDA Analyse de Survie"
    enabled: true
    category: "EDA — Survie"
    description: "Courbes Kaplan-Meier, log-rank test, distribution durées, taux de censure, Nelson-Aalen."
    applies_to: ["survival"]
    when_to_use: "Avant Cox PH / modèles de survie. Visualise les courbes et teste les groupes."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      from lifelines import KaplanMeierFitter, NelsonAalenFitter
      from lifelines.statistics import logrank_test, multivariate_logrank_test

      # Variables survival du Bloc 1
      T  = durations
      E  = events
      df_s = df_survival

      print(f"Durée    — min={T.min():.1f} | médiane={T.median():.1f} | max={T.max():.1f}")
      print(f"Événements observés : {E.sum():,} ({E.mean()*100:.1f}%)")
      print(f"Taux de censure     : {(1 - E.mean())*100:.1f}%")

      # ── 1. Kaplan-Meier global ────────────────────────────────────────
      fig, axes = plt.subplots(1, 2, figsize=(14, 6))
      kmf = KaplanMeierFitter()
      kmf.fit(T, E, label="Population entière")
      kmf.plot_survival_function(ax=axes[0], ci_show=True)
      axes[0].set_title("Courbe de survie Kaplan-Meier")
      axes[0].set_xlabel("Temps"); axes[0].set_ylabel("P(survie)")

      # Nelson-Aalen (taux de risque cumulé)
      naf = NelsonAalenFitter()
      naf.fit(T, E)
      naf.plot_cumulative_hazard(ax=axes[1], label="Risque cumulé")
      axes[1].set_title("Risque cumulé (Nelson-Aalen)")
      plt.suptitle("Analyse de survie — vue globale")
      plt.tight_layout(); plt.show()

      # ── 2. Distribution des durées ────────────────────────────────────
      fig, axes = plt.subplots(1, 3, figsize=(18, 5))
      T.hist(bins=50, ax=axes[0], color="steelblue", edgecolor="white")
      axes[0].set_title("Distribution des durées")

      # Durées séparées par événement/censure
      T[E == 1].hist(bins=40, ax=axes[1], alpha=0.7, color="tomato",   label="Événement")
      T[E == 0].hist(bins=40, ax=axes[1], alpha=0.7, color="steelblue", label="Censuré")
      axes[1].legend(); axes[1].set_title("Durées : événement vs censuré")

      axes[2].scatter(T[E == 0], np.zeros(E[E == 0].sum()) + 0.1,
                      alpha=0.3, s=5, color="steelblue", label="Censuré")
      axes[2].scatter(T[E == 1], np.ones(E[E == 1].sum()) * 0.9,
                      alpha=0.3, s=5, color="tomato", label="Événement")
      axes[2].set_title("Beeswarm durées")
      axes[2].legend(); axes[2].set_yticks([])
      plt.suptitle("Distribution des durées de survie")
      plt.tight_layout(); plt.show()

      # ── 3. KM par groupes (variable catégorielle) ─────────────────────
      cat_cols_surv = df_s.select_dtypes(include=["object", "category"]).columns.tolist()
      for col in cat_cols_surv[:3]:
          groups = df_s[col].dropna().unique()
          if len(groups) < 2 or len(groups) > 6:
              continue
          plt.figure(figsize=(10, 6))
          ax = plt.gca()
          for grp in groups:
              mask = df_s[col] == grp
              kmf  = KaplanMeierFitter()
              kmf.fit(T[mask], E[mask], label=str(grp))
              kmf.plot_survival_function(ax=ax, ci_show=True)

          # Log-rank test
          if len(groups) == 2:
              g0, g1 = df_s[col] == groups[0], df_s[col] == groups[1]
              res = logrank_test(T[g0], T[g1], E[g0], E[g1])
              ax.set_title(f"KM par {col} — log-rank p={res.p_value:.4f}")
          else:
              ax.set_title(f"KM par {col}")
          ax.set_xlabel("Temps"); ax.set_ylabel("P(survie)")
          plt.tight_layout(); plt.show()

  - id: eda_feature_importance_quick
    name: "EDA — Importance Features Rapide"
    enabled: true
    category: "EDA — Feature Importance"
    description: "Importance via Random Forest, Mutual Information et corrélation — aperçu rapide avant feature selection."
    applies_to: ["classification", "regression"]
    when_to_use: "Aperçu rapide de l'importance des features. Guide le feature engineering."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor
      from sklearn.feature_selection import mutual_info_classif, mutual_info_regression
      from sklearn.preprocessing import LabelEncoder

      TARGET_COL  = target_name
      IS_CLASSIF  = task_type == "classification"

      # Préparer X numérique pour l'analyse
      X_eda = df.drop(columns=[TARGET_COL], errors="ignore").select_dtypes(include="number")
      y_eda = df[TARGET_COL].dropna()
      idx   = X_eda.index.intersection(y_eda.index)
      X_eda = X_eda.loc[idx].fillna(X_eda.median())
      y_eda = y_eda.loc[idx]

      if IS_CLASSIF and y_eda.dtype == object:
          le    = LabelEncoder()
          y_eda = le.fit_transform(y_eda)

      # ── 1. Random Forest importance ───────────────────────────────────
      rf = (RandomForestClassifier(n_estimators=100, max_depth=8, n_jobs=-1, random_state=42)
            if IS_CLASSIF else
            RandomForestRegressor(n_estimators=100, max_depth=8, n_jobs=-1, random_state=42))
      rf.fit(X_eda, y_eda)
      fi_rf = pd.Series(rf.feature_importances_, index=X_eda.columns).sort_values(ascending=True)

      # ── 2. Mutual Information ─────────────────────────────────────────
      mi_func = mutual_info_classif if IS_CLASSIF else mutual_info_regression
      mi_vals = mi_func(X_eda, y_eda, random_state=42)
      fi_mi   = pd.Series(mi_vals, index=X_eda.columns).sort_values(ascending=True)

      # ── 3. Corrélation absolue avec target ────────────────────────────
      fi_corr = X_eda.corrwith(pd.Series(y_eda, index=X_eda.index)).abs().sort_values(ascending=True)

      # ── Plots côte à côte ─────────────────────────────────────────────
      top_n = min(25, len(X_eda.columns))
      fig, axes = plt.subplots(1, 3, figsize=(22, max(6, top_n * 0.4)))

      fi_rf.tail(top_n).plot.barh(ax=axes[0], color="steelblue")
      axes[0].set_title("RF Feature Importance (MDI)")

      fi_mi.tail(top_n).plot.barh(ax=axes[1], color="tomato")
      axes[1].set_title("Mutual Information")

      fi_corr.tail(top_n).plot.barh(ax=axes[2], color="forestgreen")
      axes[2].set_title("|Corrélation Pearson| avec target")

      plt.suptitle(f"Importance des features — {TARGET_COL} ({task_type})")
      plt.tight_layout(); plt.show()

      # Synthèse : rang moyen
      rank_rf   = fi_rf.rank().rename("rank_rf")
      rank_mi   = fi_mi.rank().rename("rank_mi")
      rank_corr = fi_corr.rank().rename("rank_corr")
      rank_df   = pd.concat([rank_rf, rank_mi, rank_corr], axis=1)
      rank_df["mean_rank"] = rank_df.mean(axis=1)
      print("\nRang moyen (plus haut = plus important) :")
      print(rank_df.sort_values("mean_rank", ascending=False).head(20).to_string())


# ──────────────────────────────────────────────────────────────────────────
# SECTION C — PREPROCESSING
# Toujours appliqué après le split (fit sur X_train uniquement).
# Chaque snippet produit : X_train, X_test, preprocessor, feature_names_out
# + passe y_train, y_test, dates_*, texts_* sans modification.
# ──────────────────────────────────────────────────────────────────────────

preprocessing:

  - id: preprocessing_standard
    name: "Preprocessing Standard (Imputation + Encoding + Scaling)"
    enabled: true
    category: "Preprocessing — Complet"
    description: "Pipeline sklearn complet : imputation médiane/mode + OHE + StandardScaler. Prêt pour tout modèle."
    applies_to: ["classification", "regression", "clustering", "anomaly"]
    when_to_use: "Template de référence pour données tabulaires mixtes (numériques + catégorielles)."
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.impute import SimpleImputer
      from sklearn.preprocessing import StandardScaler, OneHotEncoder, LabelEncoder
      from sklearn.compose import ColumnTransformer
      from sklearn.pipeline import Pipeline

      # Encodage de la target si catégorielle
      if y_train is not None and hasattr(y_train, "dtype") and y_train.dtype == object:
          le      = LabelEncoder()
          y_train = le.fit_transform(y_train)
          y_test  = le.transform(y_test)
          meta["label_encoder"] = le

      # Identification des types
      num_cols  = X_train.select_dtypes(include="number").columns.tolist()
      cat_cols  = X_train.select_dtypes(include=["object", "category"]).columns.tolist()
      bool_cols = X_train.select_dtypes(include="bool").columns.tolist()
      # Convertir bool en int
      for ds in [X_train, X_test]:
          ds[bool_cols] = ds[bool_cols].astype(int)
      num_cols = num_cols + bool_cols

      # Suppression colonnes trop lacunaires (> seuil)
      HIGH_NA_THRESHOLD = 60
      cols_to_drop = [c for c in X_train.columns
                      if X_train[c].isnull().mean() * 100 > HIGH_NA_THRESHOLD]
      if cols_to_drop:
          print(f"Suppression colonnes (>{HIGH_NA_THRESHOLD}% NaN) : {cols_to_drop}")
          X_train = X_train.drop(columns=cols_to_drop)
          X_test  = X_test.drop(columns=cols_to_drop)
          num_cols = [c for c in num_cols if c not in cols_to_drop]
          cat_cols = [c for c in cat_cols if c not in cols_to_drop]

      # Pipelines
      num_pipeline = Pipeline([
          ("imputer", SimpleImputer(strategy="median")),
          ("scaler",  StandardScaler()),
      ])
      cat_pipeline = Pipeline([
          ("imputer", SimpleImputer(strategy="most_frequent")),
          ("encoder", OneHotEncoder(handle_unknown="ignore", sparse_output=False, drop="first")),
      ])

      preprocessor = ColumnTransformer([
          ("num", num_pipeline, num_cols),
          ("cat", cat_pipeline, cat_cols),
      ], remainder="drop", verbose_feature_names_out=True)

      X_train = preprocessor.fit_transform(X_train)
      X_test  = preprocessor.transform(X_test)

      ohe_feats = (preprocessor.named_transformers_["cat"]["encoder"]
                   .get_feature_names_out(cat_cols).tolist()) if cat_cols else []
      feature_names_out = num_cols + ohe_feats

      print(f"Shape train : {X_train.shape} | test : {X_test.shape}")
      print(f"Features out : {len(feature_names_out)}")

      # Pass-through contrat
      # y_train, y_test : déjà définis (split ou TS)
      # dates_train, dates_future : pass-through
      # texts_train, texts_test   : pass-through
      # task_type                 : inchangé

  - id: preprocessing_imputation_advanced
    name: "Imputation Avancée (KNN / MICE)"
    enabled: true
    category: "Preprocessing — Imputation"
    description: "KNN Imputer ou IterativeImputer (MICE). Pour NaN > 20% ou structure MAR."
    applies_to: ["classification", "regression"]
    when_to_use: "Quand l'imputation médiane est insuffisante (NaN structurels ou MAR)."
    code_template: |
      import numpy as np
      from sklearn.impute import KNNImputer
      from sklearn.experimental import enable_iterative_imputer  # noqa
      from sklearn.impute import IterativeImputer
      from sklearn.preprocessing import StandardScaler
      from sklearn.compose import ColumnTransformer
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import OneHotEncoder
      from sklearn.impute import SimpleImputer

      num_cols = X_train.select_dtypes(include="number").columns.tolist()
      cat_cols = X_train.select_dtypes(include=["object", "category"]).columns.tolist()

      # Choisir l'imputer numérique
      # Option A : KNN
      num_imputer = KNNImputer(n_neighbors=5, weights="uniform")
      # Option B : MICE (décommenter)
      # num_imputer = IterativeImputer(max_iter=10, random_state=42)

      num_pipeline = Pipeline([
          ("imputer", num_imputer),
          ("scaler",  StandardScaler()),
      ])
      cat_pipeline = Pipeline([
          ("imputer", SimpleImputer(strategy="most_frequent")),
          ("encoder", OneHotEncoder(handle_unknown="ignore", sparse_output=False, drop="first")),
      ])

      preprocessor = ColumnTransformer([
          ("num", num_pipeline, num_cols),
          ("cat", cat_pipeline, cat_cols),
      ], remainder="drop")

      X_train = preprocessor.fit_transform(X_train)
      X_test  = preprocessor.transform(X_test)

      ohe_feats = (preprocessor.named_transformers_["cat"]["encoder"]
                   .get_feature_names_out(cat_cols).tolist()) if cat_cols else []
      feature_names_out = num_cols + ohe_feats

      print(f"NaN restants train : {np.isnan(X_train).sum()}")
      print(f"Shape : {X_train.shape}")

      # Pass-through : y_train, y_test, dates_*, texts_*, task_type

  - id: preprocessing_encoding_target
    name: "Target Encoding (Haute Cardinalité)"
    enabled: true
    category: "Preprocessing — Encodage"
    description: "Remplace chaque modalité par la moyenne de la target. Lissage bayésien anti-leakage via K-Fold."
    applies_to: ["classification", "regression"]
    when_to_use: "Cardinalité > 15 modalités. Très efficace pour XGBoost/LightGBM/CatBoost."
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.model_selection import KFold
      from sklearn.impute import SimpleImputer
      from sklearn.preprocessing import StandardScaler, OneHotEncoder
      from sklearn.compose import ColumnTransformer
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import FunctionTransformer

      ALPHA = 10   # lissage bayésien

      cat_cols     = X_train.select_dtypes(include=["object", "category"]).columns.tolist()
      num_cols     = X_train.select_dtypes(include="number").columns.tolist()
      HIGH_CARD    = [c for c in cat_cols if X_train[c].nunique() > 15]
      LOW_CARD     = [c for c in cat_cols if c not in HIGH_CARD]
      global_mean  = float(np.mean(y_train))

      def _te_encode(X_tr, y_tr, X_val, cols, alpha=ALPHA):
          X_tr  = X_tr.copy()
          X_val = X_val.copy()
          for col in cols:
              stats = y_tr.groupby(X_tr[col]).agg(["mean", "count"])
              stats["smoothed"] = ((stats["mean"] * stats["count"] + global_mean * alpha)
                                   / (stats["count"] + alpha))
              X_tr[col  + "_te"] = X_tr[col].map(stats["smoothed"]).fillna(global_mean)
              X_val[col + "_te"] = X_val[col].map(stats["smoothed"]).fillna(global_mean)
          return X_tr.drop(columns=cols), X_val.drop(columns=cols)

      # Cross-validation pour éviter le leakage sur X_train
      kf  = KFold(n_splits=5, shuffle=True, random_state=42)
      X_train_te = X_train.copy()
      for col in HIGH_CARD:
          X_train_te[col + "_te"] = global_mean
          for tr_idx, val_idx in kf.split(X_train):
              Xk_tr = X_train.iloc[tr_idx]
              Xk_val = X_train.iloc[val_idx]
              yk_tr  = pd.Series(y_train).iloc[tr_idx]
              stats  = yk_tr.groupby(Xk_tr[col]).agg(["mean", "count"])
              stats["smoothed"] = ((stats["mean"] * stats["count"] + global_mean * ALPHA)
                                   / (stats["count"] + ALPHA))
              X_train_te.loc[X_train.index[val_idx], col + "_te"] = \
                  Xk_val[col].map(stats["smoothed"]).values
      X_train_te = X_train_te.drop(columns=HIGH_CARD)

      # Test : simple mapping (pas de leakage car pas de target)
      X_test_te = X_test.copy()
      for col in HIGH_CARD:
          stats  = pd.Series(y_train).groupby(X_train[col]).agg(["mean", "count"])
          stats["smoothed"] = ((stats["mean"] * stats["count"] + global_mean * ALPHA)
                               / (stats["count"] + ALPHA))
          X_test_te[col + "_te"] = X_test_te[col].map(stats["smoothed"]).fillna(global_mean)
      X_test_te = X_test_te.drop(columns=HIGH_CARD)

      # Pipeline standard sur le reste
      te_num_cols = X_train_te.select_dtypes(include="number").columns.tolist()
      te_cat_cols = X_train_te.select_dtypes(include=["object", "category"]).columns.tolist()

      num_pl = Pipeline([("imp", SimpleImputer(strategy="median")), ("sc", StandardScaler())])
      cat_pl = Pipeline([("imp", SimpleImputer(strategy="most_frequent")),
                         ("enc", OneHotEncoder(handle_unknown="ignore", sparse_output=False, drop="first"))])

      preprocessor = ColumnTransformer([
          ("num", num_pl, te_num_cols),
          ("cat", cat_pl, te_cat_cols),
      ], remainder="drop")

      X_train = preprocessor.fit_transform(X_train_te)
      X_test  = preprocessor.transform(X_test_te)

      ohe_f = (preprocessor.named_transformers_["cat"]["enc"]
               .get_feature_names_out(te_cat_cols).tolist()) if te_cat_cols else []
      feature_names_out = te_num_cols + ohe_f
      print(f"Shape : {X_train.shape}")

      # Pass-through : y_train, y_test, dates_*, texts_*, task_type

  - id: preprocessing_nlp_tfidf
    name: "Preprocessing NLP — TF-IDF"
    enabled: true
    category: "Preprocessing — NLP"
    description: "Nettoyage texte + vectorisation TF-IDF. Produit X_train/X_test scipy sparse + preprocessor fitté."
    applies_to: ["nlp"]
    when_to_use: "Pipeline NLP classique pour classification de texte avec modèles ML traditionnels."
    code_template: |
      import re
      import numpy as np
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import FunctionTransformer

      def clean_text(texts):
          cleaned = []
          for t in texts:
              t = str(t).lower()
              t = re.sub(r"<[^>]+>", " ", t)         # HTML
              t = re.sub(r"http\S+", " ", t)          # URLs
              t = re.sub(r"[^a-zA-ZÀ-ÿ\s]", " ", t) # non-alpha
              t = re.sub(r"\s+", " ", t).strip()
              cleaned.append(t)
          return cleaned

      # Nettoyage
      texts_train_clean = clean_text(texts_train)
      texts_test_clean  = clean_text(texts_test)

      # Pipeline : nettoyage + TF-IDF
      preprocessor = Pipeline([
          ("cleaner", FunctionTransformer(clean_text, validate=False)),
          ("tfidf",   TfidfVectorizer(
              max_features=20000,
              ngram_range=(1, 2),
              min_df=2,
              max_df=0.95,
              sublinear_tf=True,
              strip_accents="unicode",
          )),
      ])

      X_train = preprocessor.fit_transform(texts_train)
      X_test  = preprocessor.transform(texts_test)

      feature_names_out = preprocessor.named_steps["tfidf"].get_feature_names_out().tolist()
      print(f"Shape train : {X_train.shape} | test : {X_test.shape}")
      print(f"Vocabulaire TF-IDF : {len(feature_names_out)}")

      # Pass-through
      # texts_train / texts_test : conservés intacts pour embeddings éventuels
      # y_train, y_test, dates_*, task_type : inchangés

  - id: preprocessing_timeseries_features
    name: "Preprocessing Timeseries — Features Exogènes"
    enabled: true
    category: "Preprocessing — Timeseries"
    description: "Création de features temporelles (lag, rolling, sin/cos) pour modèles ML sur séries temporelles."
    applies_to: ["timeseries"]
    when_to_use: "Pour XGBoost/LightGBM sur séries temporelles. Complète les features exogènes du Bloc 1."
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.preprocessing import StandardScaler
      from sklearn.impute import SimpleImputer
      from sklearn.pipeline import Pipeline
      from sklearn.compose import ColumnTransformer

      LAGS    = [1, 7, 14, 30]
      WINDOWS = [7, 14, 30]
      FREQ    = meta.get("freq", "D")

      # Reconstruire un DataFrame TS complet
      series_all = pd.concat([y_train, y_test])

      def make_ts_features(series, lags, windows):
          df_feat = pd.DataFrame({"y": series})
          for lag in lags:
              df_feat[f"lag_{lag}"]         = series.shift(lag)
          for w in windows:
              df_feat[f"roll_mean_{w}"]     = series.shift(1).rolling(w).mean()
              df_feat[f"roll_std_{w}"]      = series.shift(1).rolling(w).std()
              df_feat[f"roll_min_{w}"]      = series.shift(1).rolling(w).min()
              df_feat[f"roll_max_{w}"]      = series.shift(1).rolling(w).max()
          # Features temporelles
          idx = series.index
          if hasattr(idx, "dayofweek"):
              df_feat["dow_sin"]   = np.sin(2 * np.pi * idx.dayofweek / 7)
              df_feat["dow_cos"]   = np.cos(2 * np.pi * idx.dayofweek / 7)
          if hasattr(idx, "month"):
              df_feat["month_sin"] = np.sin(2 * np.pi * idx.month / 12)
              df_feat["month_cos"] = np.cos(2 * np.pi * idx.month / 12)
          if hasattr(idx, "dayofyear"):
              df_feat["doy_sin"]   = np.sin(2 * np.pi * idx.dayofyear / 365)
              df_feat["doy_cos"]   = np.cos(2 * np.pi * idx.dayofyear / 365)
          if hasattr(idx, "hour"):
              df_feat["hour_sin"]  = np.sin(2 * np.pi * idx.hour / 24)
              df_feat["hour_cos"]  = np.cos(2 * np.pi * idx.hour / 24)
          return df_feat

      df_feat = make_ts_features(series_all, LAGS, WINDOWS)
      n_train = len(y_train)
      df_train_feat = df_feat.iloc[:n_train].dropna()
      df_test_feat  = df_feat.iloc[n_train:].dropna()

      # Aligner y
      y_train = series_all.loc[df_train_feat.index]
      y_test  = series_all.loc[df_test_feat.index]

      feat_cols = [c for c in df_feat.columns if c != "y"]

      # Pipeline scaler (optionnel pour tree-based)
      preprocessor = Pipeline([
          ("imputer", SimpleImputer(strategy="median")),
          ("scaler",  StandardScaler()),
      ])
      X_train = preprocessor.fit_transform(df_train_feat[feat_cols])
      X_test  = preprocessor.transform(df_test_feat[feat_cols])

      feature_names_out = feat_cols
      print(f"Features TS : {len(feat_cols)}")
      print(f"Shape train : {X_train.shape} | test : {X_test.shape}")

      # Pass-through
      # dates_train / dates_future : inchangées
      # texts_train / texts_test   : []
      # task_type                  : "timeseries"


# ──────────────────────────────────────────────────────────────────────────
# SECTION D — FEATURE ENGINEERING (optionnel, avant ou après preprocessing)
# ──────────────────────────────────────────────────────────────────────────

feature_engineering:

  - id: fe_datetime
    name: "Feature Engineering — Dates & Temps"
    enabled: true
    category: "Feature Engineering — Temporel"
    description: "Extraction de composantes temporelles, encodage cyclique (sin/cos), jours fériés, délais."
    applies_to: ["classification", "regression", "timeseries"]
    when_to_use: "Dès qu'une colonne datetime est présente dans X_train. Exécuter avant le preprocessing."
    code_template: |
      import pandas as pd
      import numpy as np

      DATE_COL = "created_at"   # adapter

      for ds in [X_train, X_test]:
          ds[DATE_COL] = pd.to_datetime(ds[DATE_COL])
          ds["hour"]        = ds[DATE_COL].dt.hour
          ds["dayofweek"]   = ds[DATE_COL].dt.dayofweek
          ds["dayofmonth"]  = ds[DATE_COL].dt.day
          ds["dayofyear"]   = ds[DATE_COL].dt.dayofyear
          ds["weekofyear"]  = ds[DATE_COL].dt.isocalendar().week.astype(int)
          ds["month"]       = ds[DATE_COL].dt.month
          ds["quarter"]     = ds[DATE_COL].dt.quarter
          ds["year"]        = ds[DATE_COL].dt.year
          ds["is_weekend"]  = ds["dayofweek"].isin([5, 6]).astype(int)
          ds["is_monthend"] = ds[DATE_COL].dt.is_month_end.astype(int)
          # Encodage cyclique
          ds["hour_sin"]    = np.sin(2 * np.pi * ds["hour"]      / 24)
          ds["hour_cos"]    = np.cos(2 * np.pi * ds["hour"]      / 24)
          ds["dow_sin"]     = np.sin(2 * np.pi * ds["dayofweek"] / 7)
          ds["dow_cos"]     = np.cos(2 * np.pi * ds["dayofweek"] / 7)
          ds["month_sin"]   = np.sin(2 * np.pi * ds["month"]     / 12)
          ds["month_cos"]   = np.cos(2 * np.pi * ds["month"]     / 12)
          # Jours fériés
          try:
              import holidays
              fr_hol = holidays.France()
              ds["is_holiday"] = ds[DATE_COL].dt.date.map(lambda d: int(d in fr_hol))
          except ImportError:
              pass
          ds.drop(columns=[DATE_COL], inplace=True)

      print(f"Shape après FE date : train={X_train.shape} | test={X_test.shape}")
      # feature_names_out sera mis à jour après le preprocessing
      # Pass-through : y_train, y_test, dates_*, texts_*, task_type, preprocessor

  - id: fe_interactions
    name: "Feature Engineering — Interactions & Polynomiales"
    enabled: true
    category: "Feature Engineering — Numérique"
    description: "Ratios, produits, polynômes degré 2. Capture les interactions non-linéaires."
    applies_to: ["classification", "regression"]
    when_to_use: "Quand les features numériques ont des interactions suspectées. Exécuter avant preprocessing."
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.preprocessing import PolynomialFeatures

      num_cols = X_train.select_dtypes(include="number").columns.tolist()

      # Ratios métier (exemples — adapter au domaine)
      for ds in [X_train, X_test]:
          if "revenue" in ds.columns and "n_orders" in ds.columns:
              ds["avg_order_value"] = ds["revenue"] / (ds["n_orders"] + 1)
          if "clicks" in ds.columns and "impressions" in ds.columns:
              ds["ctr"] = ds["clicks"] / (ds["impressions"] + 1)
          # Transformations mathématiques
          for col in num_cols:
              if ds[col].min() >= 0:
                  ds[f"{col}_log1p"] = np.log1p(ds[col])
                  ds[f"{col}_sqrt"]  = np.sqrt(ds[col].clip(lower=0))

      # Interactions polynomiales (sur sous-ensemble)
      TOP_FEATS = num_cols[:6]
      poly = PolynomialFeatures(degree=2, interaction_only=True, include_bias=False)
      poly_train = pd.DataFrame(poly.fit_transform(X_train[TOP_FEATS]),
                                columns=poly.get_feature_names_out(TOP_FEATS),
                                index=X_train.index)
      poly_test  = pd.DataFrame(poly.transform(X_test[TOP_FEATS]),
                                columns=poly.get_feature_names_out(TOP_FEATS),
                                index=X_test.index)
      # Ajouter seulement les termes d'interaction (pas les termes simples déjà présents)
      new_cols = [c for c in poly_train.columns if " " in c]
      X_train = pd.concat([X_train, poly_train[new_cols]], axis=1)
      X_test  = pd.concat([X_test,  poly_test[new_cols]],  axis=1)

      print(f"Shape après FE interactions : train={X_train.shape} | test={X_test.shape}")
      # Pass-through : y_train, y_test, dates_*, texts_*, task_type

  - id: fe_aggregations
    name: "Feature Engineering — Agrégations par Groupe"
    enabled: true
    category: "Feature Engineering — Agrégation"
    description: "Features statistiques agrégées par groupe (client, produit, région). Lag features anti-leakage."
    applies_to: ["classification", "regression"]
    when_to_use: "Quand il existe un identifiant de groupe avec historique. Exécuter avant preprocessing."
    code_template: |
      import pandas as pd
      import numpy as np

      GROUP_COL  = "customer_id"   # adapter
      NUM_COLS   = ["amount", "duration"]
      DATE_COL   = "created_at"

      # Calculer les stats UNIQUEMENT sur X_train (pas de leakage)
      df_train_full = X_train.copy()
      df_train_full["__y__"] = y_train.values

      group_stats = df_train_full.groupby(GROUP_COL)[NUM_COLS].agg(
          ["mean", "std", "min", "max", "median", "count"]
      )
      group_stats.columns = ["_".join(c) for c in group_stats.columns]

      # Joindre sur train et test (uniquement les stats fitées sur train)
      X_train = X_train.join(group_stats, on=GROUP_COL, rsuffix="_grp")
      X_test  = X_test.join(group_stats,  on=GROUP_COL, rsuffix="_grp")

      # Lag features (anti-leakage : shift d'au moins 1)
      if DATE_COL in X_train.columns:
          X_train = X_train.sort_values(DATE_COL)
          X_test  = X_test.sort_values(DATE_COL)
          for lag in [1, 7, 30]:
              for col in NUM_COLS:
                  X_train[f"{col}_lag_{lag}"] = (
                      X_train.groupby(GROUP_COL)[col].shift(lag)
                  )

      print(f"Shape après agrégations : train={X_train.shape} | test={X_test.shape}")
      # Pass-through : y_train, y_test, dates_*, texts_*, task_type

  - id: fe_text_meta_features
    name: "Feature Engineering — Méta-features Texte"
    enabled: true
    category: "Feature Engineering — NLP"
    description: "Longueur, ponctuation, sentiments, présence de mots-clés. Enrichit un pipeline tabulaire."
    applies_to: ["classification", "regression", "nlp"]
    when_to_use: "Pour enrichir un modèle tabulaire avec des colonnes texte. Exécuter avant preprocessing."
    code_template: |
      import pandas as pd
      import numpy as np
      import re

      TEXT_COL = "description"   # adapter

      def add_text_features(ds, col):
          ds[f"{col}_len_char"]    = ds[col].str.len()
          ds[f"{col}_len_words"]   = ds[col].str.split().str.len()
          ds[f"{col}_n_sentences"] = ds[col].str.count(r"[.!?]+")
          ds[f"{col}_n_caps"]      = ds[col].str.count(r"[A-Z]")
          ds[f"{col}_n_digits"]    = ds[col].str.count(r"\d")
          ds[f"{col}_n_punct"]     = ds[col].str.count(r"[!?,;:]")
          ds[f"{col}_avg_wordlen"] = ds[col].apply(
              lambda t: np.mean([len(w) for w in str(t).split()]) if str(t).strip() else 0
          )
          try:
              from textblob import TextBlob
              ds[f"{col}_polarity"]     = ds[col].apply(lambda t: TextBlob(str(t)).sentiment.polarity)
              ds[f"{col}_subjectivity"] = ds[col].apply(lambda t: TextBlob(str(t)).sentiment.subjectivity)
          except ImportError:
              pass
          KEYWORDS = ["urgent", "gratuit", "promo", "officiel", "erreur"]
          for kw in KEYWORDS:
              ds[f"has_{kw}"] = ds[col].str.lower().str.contains(kw, regex=False, na=False).astype(int)
          ds.drop(columns=[col], inplace=True)
          return ds

      X_train = add_text_features(X_train.copy(), TEXT_COL)
      X_test  = add_text_features(X_test.copy(),  TEXT_COL)

      print(f"Shape après FE texte : train={X_train.shape} | test={X_test.shape}")
      # Pass-through : y_train, y_test, dates_*, texts_*, task_type


# ──────────────────────────────────────────────────────────────────────────
# SECTION E — FEATURE SELECTION (optionnel, après preprocessing)
# Reçoit X_train/X_test en numpy arrays fitté par preprocessor.
# Met à jour feature_names_out.
# ──────────────────────────────────────────────────────────────────────────

feature_selection:

  - id: fs_filter_methods
    name: "Sélection par Filtre (Statistique)"
    enabled: true
    category: "Feature Selection — Filtre"
    description: "SelectKBest, ANOVA F-test, Mutual Information. Rapide, indépendant du modèle."
    applies_to: ["classification", "regression"]
    when_to_use: "Premier filtre rapide. Appliquer sur X_train preprocessé."
    code_template: |
      from sklearn.feature_selection import (
          SelectKBest, f_classif, f_regression,
          mutual_info_classif, mutual_info_regression,
      )
      import pandas as pd
      import numpy as np

      IS_CLASSIF = task_type == "classification"
      K = 20   # adapter

      mi_func = mutual_info_classif if IS_CLASSIF else mutual_info_regression
      mi_vals = mi_func(X_train, y_train, random_state=42)
      mi_series = pd.Series(mi_vals, index=feature_names_out).sort_values(ascending=False)
      print("Top 20 (Mutual Information) :")
      print(mi_series.head(20).to_string())

      # Sélection top-K par MI
      selected_names = mi_series.head(K).index.tolist()
      selected_idx   = [list(feature_names_out).index(f) for f in selected_names]

      X_train = X_train[:, selected_idx]
      X_test  = X_test[:,  selected_idx]
      feature_names_out = selected_names

      print(f"\nFeatures sélectionnées : {len(feature_names_out)} / {len(mi_series)}")

      mi_series.head(20).sort_values().plot.barh(figsize=(10, 7))
      import matplotlib.pyplot as plt
      plt.title("Top 20 features — Mutual Information")
      plt.tight_layout(); plt.show()

      # Pass-through : y_train, y_test, dates_*, texts_*, task_type, preprocessor

  - id: fs_embedded_importance
    name: "Sélection Embedded (Feature Importance RF + SHAP)"
    enabled: true
    category: "Feature Selection — Embedded"
    description: "Importance RF (MDI), permutation importance, SHAP values. Sélection par seuil."
    applies_to: ["classification", "regression"]
    when_to_use: "Méthode la plus fiable pour données tabulaires. Après preprocessing."
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor
      from sklearn.inspection import permutation_importance

      IS_CLASSIF = task_type == "classification"
      THRESHOLD  = 0.005

      rf = (RandomForestClassifier(n_estimators=200, max_depth=10, n_jobs=-1, random_state=42)
            if IS_CLASSIF else
            RandomForestRegressor(n_estimators=200, max_depth=10, n_jobs=-1, random_state=42))
      rf.fit(X_train, y_train)

      fi = pd.Series(rf.feature_importances_, index=feature_names_out).sort_values(ascending=False)

      # Permutation importance
      perm = permutation_importance(rf, X_test, y_test, n_repeats=10, random_state=42, n_jobs=-1)
      fi_perm = pd.Series(perm.importances_mean, index=feature_names_out).sort_values(ascending=False)

      top_n = min(25, len(feature_names_out))
      fig, axes = plt.subplots(1, 2, figsize=(18, max(6, top_n * 0.4)))
      fi.head(top_n).sort_values().plot.barh(ax=axes[0], color="steelblue")
      axes[0].set_title("RF MDI Feature Importance")
      fi_perm.head(top_n).sort_values().plot.barh(ax=axes[1], color="tomato")
      axes[1].set_title("Permutation Importance")
      plt.suptitle("Feature Importance")
      plt.tight_layout(); plt.show()

      # SHAP
      try:
          import shap
          explainer   = shap.TreeExplainer(rf)
          shap_values = explainer.shap_values(X_test[:500])
          if isinstance(shap_values, list):
              shap_values = shap_values[1]
          shap.summary_plot(shap_values, X_test[:500], feature_names=feature_names_out,
                            plot_type="bar", show=True)
      except ImportError:
          print("pip install shap")

      # Sélection par seuil
      selected = fi[fi >= THRESHOLD].index.tolist()
      selected_idx = [list(feature_names_out).index(f) for f in selected]
      X_train = X_train[:, selected_idx]
      X_test  = X_test[:,  selected_idx]
      feature_names_out = selected
      print(f"\nFeatures retenues : {len(feature_names_out)} / {len(fi)}")

      # Pass-through : y_train, y_test, dates_*, texts_*, task_type, preprocessor

  - id: fs_wrapper_rfe
    name: "Sélection Wrapper — RFE / RFECV"
    enabled: true
    category: "Feature Selection — Wrapper"
    description: >
      Recursive Feature Elimination avec et sans cross-validation.
      Identifie le nombre optimal de features par validation croisée.
      Plus lent que les méthodes filtre/embedded mais plus rigoureux.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Quand le nombre optimal de features est inconnu et que le temps de calcul
      le permet (< 500 features). Préférer RFECV pour la sélection automatique du K optimal.
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.feature_selection import RFE, RFECV
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor
      from sklearn.linear_model import LogisticRegression, Ridge
      from sklearn.model_selection import StratifiedKFold, KFold

      IS_CLASSIF = task_type == "classification"
      N_FEATURES = 20    # pour RFE simple ; ignoré par RFECV

      # ── Estimateur de base ────────────────────────────────────────────
      # Option A : RF (robuste, non-linéaire)
      estimator = (RandomForestClassifier(n_estimators=50, max_depth=6,
                                          n_jobs=-1, random_state=42)
                   if IS_CLASSIF else
                   RandomForestRegressor(n_estimators=50, max_depth=6,
                                         n_jobs=-1, random_state=42))
      # Option B : Régression linéaire (plus rapide)
      # estimator = LogisticRegression(max_iter=500) if IS_CLASSIF else Ridge()

      # ── RFECV — sélection automatique du nombre optimal ───────────────
      cv = (StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
            if IS_CLASSIF else
            KFold(n_splits=5, shuffle=True, random_state=42))

      rfecv = RFECV(
          estimator=estimator,
          step=1,
          cv=cv,
          scoring="roc_auc" if IS_CLASSIF else "neg_root_mean_squared_error",
          min_features_to_select=5,
          n_jobs=-1,
      )
      rfecv.fit(X_train, y_train)

      # Courbe score vs nb features
      fig, ax = plt.subplots(figsize=(10, 5))
      ax.plot(range(1, len(rfecv.cv_results_["mean_test_score"]) + 1),
              rfecv.cv_results_["mean_test_score"], marker="o", markersize=4)
      ax.fill_between(
          range(1, len(rfecv.cv_results_["mean_test_score"]) + 1),
          rfecv.cv_results_["mean_test_score"] - rfecv.cv_results_["std_test_score"],
          rfecv.cv_results_["mean_test_score"] + rfecv.cv_results_["std_test_score"],
          alpha=0.2,
      )
      ax.axvline(rfecv.n_features_, color="red", linestyle="--",
                 label=f"Optimal : {rfecv.n_features_} features")
      ax.set_xlabel("Nombre de features"); ax.set_ylabel("Score CV")
      ax.set_title("RFECV — Score vs Nombre de features")
      ax.legend()
      plt.tight_layout(); plt.show()

      print(f"Nombre optimal de features : {rfecv.n_features_}")
      selected_mask  = rfecv.support_
      selected_names = [f for f, s in zip(feature_names_out, selected_mask) if s]
      print(f"Features retenues : {selected_names}")

      X_train = rfecv.transform(X_train)
      X_test  = rfecv.transform(X_test)
      feature_names_out = selected_names

      print(f"Shape : train={X_train.shape} | test={X_test.shape}")
      # Pass-through : y_train, y_test, dates_*, texts_*, task_type, preprocessor


# ──────────────────────────────────────────────────────────────────────────
# SECTION F — DÉSÉQUILIBRE DE CLASSES (optionnel, après preprocessing)
# Appliquer UNIQUEMENT sur X_train / y_train. X_test inchangé.
# ──────────────────────────────────────────────────────────────────────────

class_imbalance:

  - id: imbalance_resampling
    name: "Rééchantillonnage (SMOTE / UnderSampling)"
    enabled: true
    category: "Déséquilibre de Classes"
    description: "SMOTE, Random UnderSampling, SMOTETomek. Appliquer UNIQUEMENT sur X_train."
    applies_to: ["classification"]
    when_to_use: "Ratio déséquilibre > 5:1. Jamais sur X_test."
    code_template: |
      from imblearn.over_sampling import SMOTE, ADASYN
      from imblearn.under_sampling import RandomUnderSampler
      from imblearn.combine import SMOTETomek
      from collections import Counter
      import numpy as np

      print(f"Distribution avant  : {Counter(y_train)}")

      # Option A : SMOTE (sur-échantillonnage synthétique)
      sampler = SMOTE(sampling_strategy="auto", k_neighbors=5, random_state=42)

      # Option B : Under-sampling (décommenter)
      # sampler = RandomUnderSampler(sampling_strategy=0.5, random_state=42)

      # Option C : SMOTETomek combiné (décommenter)
      # sampler = SMOTETomek(random_state=42)

      X_train, y_train = sampler.fit_resample(X_train, y_train)

      print(f"Distribution après  : {Counter(y_train)}")
      print(f"Shape : {X_train.shape}")

      # X_test, y_test : INCHANGÉS
      # feature_names_out, preprocessor, dates_*, texts_*, task_type : pass-through

  - id: imbalance_class_weight
    name: "Pondération des Classes (class_weight)"
    enabled: true
    category: "Déséquilibre de Classes"
    description: >
      Calcule les poids de classes inversement proportionnels à leur fréquence.
      Injecte ces poids dans meta pour que le Bloc 3 les transmette aux modèles
      qui supportent class_weight (sklearn, XGBoost, LightGBM).
      Ne modifie PAS X_train / y_train : zéro risque de data leakage.
    applies_to: ["classification"]
    when_to_use: >
      Alternative légère au rééchantillonnage. Préférer quand :
        • Le modèle supporte nativement class_weight (LogReg, SVM, RF, XGB, LGBM)
        • Les données sont déjà volumineuses (SMOTE serait lent)
        • On veut éviter tout biais introduit par des exemples synthétiques.
      Compatible avec le rééchantillonnage si les deux sont utilisés ensemble.
    code_template: |
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt
      from sklearn.utils.class_weight import compute_class_weight
      from collections import Counter

      # ── Calcul des poids ──────────────────────────────────────────────
      classes      = np.unique(y_train)
      weights      = compute_class_weight(
          class_weight="balanced",
          classes=classes,
          y=y_train,
      )
      class_weight_dict = dict(zip(classes, weights))

      # Vecteur de poids par observation (pour XGBoost sample_weight)
      sample_weight_train = np.array([class_weight_dict[c] for c in y_train])

      # Injecter dans meta pour le Bloc 3
      meta["class_weight"]         = class_weight_dict
      meta["sample_weight_train"]  = sample_weight_train

      # ── Rapport ───────────────────────────────────────────────────────
      counts = Counter(y_train)
      print("Poids de classes calculés :")
      for cls, w in class_weight_dict.items():
          print(f"  Classe {cls:>10} : count={counts[cls]:>6,}  weight={w:.4f}")

      ratio_before = max(counts.values()) / min(counts.values())
      print(f"\nRatio déséquilibre avant pondération : {ratio_before:.1f}x")
      print(f"Somme des poids train               : {sample_weight_train.sum():.2f}")

      # ── Visualisation ─────────────────────────────────────────────────
      fig, axes = plt.subplots(1, 2, figsize=(12, 4))

      pd.Series(counts).sort_index().plot.bar(ax=axes[0], color="steelblue")
      axes[0].set_title("Comptage classes (avant pondération)")
      axes[0].set_xlabel("Classe"); axes[0].set_ylabel("Count")

      pd.Series(class_weight_dict).sort_index().plot.bar(ax=axes[1], color="tomato")
      axes[1].set_title("Poids affectés par classe")
      axes[1].set_xlabel("Classe"); axes[1].set_ylabel("Weight")
      axes[1].axhline(1.0, color="navy", linestyle="--", label="poids neutre (1.0)")
      axes[1].legend()

      plt.suptitle("Stratégie class_weight — aperçu")
      plt.tight_layout(); plt.show()

      # ── Usage en Bloc 3 ───────────────────────────────────────────────
      # sklearn   : model.fit(X_train, y_train, sample_weight=meta["sample_weight_train"])
      #             ou instancier avec class_weight=meta["class_weight"]
      # XGBoost   : model.fit(X_train, y_train, sample_weight=meta["sample_weight_train"])
      # LightGBM  : model.fit(X_train, y_train, sample_weight=meta["sample_weight_train"])
      # CatBoost  : CatBoostClassifier(class_weights=meta["class_weight"])

      # X_train, X_test, y_train, y_test : INCHANGÉS
      # feature_names_out, preprocessor, dates_*, texts_*, task_type : pass-through

  - id: imbalance_threshold_tuning
    name: "Optimisation du Seuil de Décision"
    enabled: true
    category: "Déséquilibre de Classes"
    description: >
      Cherche le seuil de probabilité qui optimise F1, F-beta ou G-mean
      sur le set de validation. Alternatif ou complémentaire au rééchantillonnage.
      À exécuter APRÈS l'entraînement du modèle (post-Bloc 3) ou en fin de Bloc 2
      si un modèle rapide sert de proxy.
    applies_to: ["classification"]
    when_to_use: >
      Déséquilibre modéré à sévère (ratio > 3:1) et modèle produisant des probabilités.
      Particulièrement utile quand FP et FN ont des coûts asymétriques
      (ex. détection fraude, diagnostics médicaux).
      Exécuter après avoir obtenu y_prob depuis le Bloc 3.
    code_template: |
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt
      from sklearn.metrics import (
          f1_score, fbeta_score, precision_score, recall_score,
          roc_curve, precision_recall_curve, auc,
      )

      # ── Prérequis : y_prob issu du Bloc 3 ─────────────────────────────
      # y_prob = model.predict_proba(X_test)[:, 1]  # ← produit en Bloc 3
      # Ici on suppose y_prob disponible dans meta ou en variable locale.
      y_prob = meta.get("y_prob_test")   # à définir après le Bloc 3
      if y_prob is None:
          print("⚠ y_prob non disponible — exécuter après le Bloc 3.")
      else:
          BETA = 1.0   # beta=1 → F1 ; beta=2 → recall x2 ; beta=0.5 → precision x2

          # ── Sweep des seuils ──────────────────────────────────────────
          thresholds = np.linspace(0.01, 0.99, 199)
          f1s, fbetas, precisions, recalls, gmeams = [], [], [], [], []

          for t in thresholds:
              preds = (y_prob >= t).astype(int)
              f1s.append(f1_score(y_test, preds, zero_division=0))
              fbetas.append(fbeta_score(y_test, preds, beta=BETA, zero_division=0))
              p = precision_score(y_test, preds, zero_division=0)
              r = recall_score(y_test, preds, zero_division=0)
              precisions.append(p)
              recalls.append(r)
              gmeams.append(np.sqrt(p * r) if (p + r) > 0 else 0)

          best_f1_thresh    = thresholds[np.argmax(f1s)]
          best_fbeta_thresh = thresholds[np.argmax(fbetas)]
          best_gmean_thresh = thresholds[np.argmax(gmeams)]

          print(f"Seuil optimal F1      : {best_f1_thresh:.3f}  (F1={max(f1s):.4f})")
          print(f"Seuil optimal F-beta  : {best_fbeta_thresh:.3f}  (beta={BETA}, "
                f"Fbeta={max(fbetas):.4f})")
          print(f"Seuil optimal G-mean  : {best_gmean_thresh:.3f}  (G-mean={max(gmeams):.4f})")

          # ── Courbes ───────────────────────────────────────────────────
          fig, axes = plt.subplots(1, 3, figsize=(18, 5))

          axes[0].plot(thresholds, f1s,       label="F1",     color="steelblue")
          axes[0].plot(thresholds, fbetas,    label=f"F-{BETA}", color="tomato",    linestyle="--")
          axes[0].plot(thresholds, gmeams,    label="G-mean", color="forestgreen", linestyle=":")
          axes[0].axvline(best_f1_thresh, color="steelblue", linestyle="--", alpha=0.5)
          axes[0].set_title("Métriques vs Seuil")
          axes[0].set_xlabel("Seuil"); axes[0].legend()

          axes[1].plot(thresholds, precisions, label="Précision", color="darkorange")
          axes[1].plot(thresholds, recalls,    label="Rappel",    color="navy")
          axes[1].axvline(best_f1_thresh, color="red", linestyle="--",
                          label=f"seuil F1 ({best_f1_thresh:.2f})")
          axes[1].set_title("Précision & Rappel vs Seuil")
          axes[1].set_xlabel("Seuil"); axes[1].legend()

          # Courbe Precision-Recall
          prec_c, rec_c, _ = precision_recall_curve(y_test, y_prob)
          pr_auc = auc(rec_c, prec_c)
          axes[2].plot(rec_c, prec_c, color="purple")
          axes[2].set_title(f"Courbe Precision-Recall (AUC={pr_auc:.3f})")
          axes[2].set_xlabel("Rappel"); axes[2].set_ylabel("Précision")
          axes[2].fill_between(rec_c, prec_c, alpha=0.1, color="purple")

          plt.suptitle("Optimisation du seuil de décision")
          plt.tight_layout(); plt.show()

          # ── Injecter le seuil optimal dans meta ───────────────────────
          meta["decision_threshold"] = best_f1_thresh
          print(f"\n✓ meta['decision_threshold'] = {best_f1_thresh:.3f}")
          print("  Usage Bloc 4 : y_pred = (y_prob >= meta['decision_threshold']).astype(int)")

          # X_train, X_test, y_train, y_test : INCHANGÉS
          # feature_names_out, preprocessor, dates_*, texts_*, task_type : pass-through


# ──────────────────────────────────────────────────────────────────────────
# SECTION G — VALIDATION DU CONTRAT DE SORTIE
# À exécuter OBLIGATOIREMENT en fin de Bloc 2, avant de passer au Bloc 3.
# Vérifie que toutes les variables du contrat sont correctement définies.
# ──────────────────────────────────────────────────────────────────────────

contract_validation:

  - id: validate_bloc2_outputs
    name: "Validation Contrat de Sortie — Bloc 2"
    enabled: true
    category: "Validation — Contrat"
    description: >
      Assertions complètes sur toutes les variables de sortie du Bloc 2.
      Détecte les incohérences de shape, les NaN résiduels, les fuites de données
      et les variables manquantes avant de passer au Bloc 3.
    applies_to: ["classification", "regression", "clustering", "timeseries", "nlp", "anomaly", "survival"]
    when_to_use: "TOUJOURS. Dernier snippet du Bloc 2, quel que soit le task_type."
    code_template: |
      import numpy as np
      import pandas as pd

      print("=" * 70)
      print("VALIDATION CONTRAT DE SORTIE — BLOC 2")
      print("=" * 70)

      errors   = []
      warnings = []

      # ── 1. Variables obligatoires définies ────────────────────────────
      required_vars = {
          "X_train":           X_train,
          "X_test":            X_test,
          "y_train":           y_train,
          "y_test":            y_test,
          "preprocessor":      preprocessor,
          "feature_names_out": feature_names_out,
          "task_type":         task_type,
      }
      for name, var in required_vars.items():
          if var is None:
              errors.append(f"❌ {name} est None")
          else:
              print(f"  ✓ {name} défini")

      # ── 2. Cohérence des shapes ───────────────────────────────────────
      if X_train is not None and y_train is not None:
          n_train = X_train.shape[0] if hasattr(X_train, "shape") else len(X_train)
          n_y     = len(y_train)
          if n_train != n_y:
              errors.append(f"❌ X_train ({n_train}) ≠ y_train ({n_y})")
          else:
              print(f"  ✓ Shapes train cohérentes : {n_train} observations")

      if X_test is not None and y_test is not None:
          n_test  = X_test.shape[0] if hasattr(X_test, "shape") else len(X_test)
          n_y_t   = len(y_test)
          if n_test != n_y_t:
              errors.append(f"❌ X_test ({n_test}) ≠ y_test ({n_y_t})")
          else:
              print(f"  ✓ Shapes test cohérentes  : {n_test} observations")

      # ── 3. Cohérence feature_names_out ────────────────────────────────
      if X_train is not None and feature_names_out is not None:
          n_feat_arr  = X_train.shape[1] if hasattr(X_train, "shape") else -1
          n_feat_list = len(feature_names_out)
          if n_feat_arr != n_feat_list:
              errors.append(
                  f"❌ feature_names_out ({n_feat_list}) ≠ X_train.shape[1] ({n_feat_arr})"
              )
          else:
              print(f"  ✓ feature_names_out cohérent : {n_feat_list} features")

      # ── 4. Vérification NaN résiduels ─────────────────────────────────
      def count_nan(arr):
          if arr is None:
              return 0
          if hasattr(arr, "toarray"):  # sparse
              return np.isnan(arr.toarray()).sum()
          return np.isnan(np.array(arr, dtype=float)).sum()

      nan_train = count_nan(X_train)
      nan_test  = count_nan(X_test)
      if nan_train > 0:
          warnings.append(f"⚠ X_train contient {nan_train:,} NaN résiduels")
      else:
          print(f"  ✓ X_train : 0 NaN résiduel")
      if nan_test > 0:
          warnings.append(f"⚠ X_test contient {nan_test:,} NaN résiduels")
      else:
          print(f"  ✓ X_test  : 0 NaN résiduel")

      # ── 5. Leakage check : taille train > taille test ─────────────────
      if X_train is not None and X_test is not None:
          n_tr = X_train.shape[0]
          n_te = X_test.shape[0]
          if n_tr <= n_te:
              warnings.append(
                  f"⚠ X_train ({n_tr}) ≤ X_test ({n_te}) — split inhabituel, vérifier"
              )

      # ── 6. Vérification task_type ─────────────────────────────────────
      VALID_TASKS = ["classification", "regression", "clustering",
                     "timeseries", "nlp", "anomaly", "survival"]
      if task_type not in VALID_TASKS:
          errors.append(f"❌ task_type inconnu : '{task_type}' — doit être parmi {VALID_TASKS}")
      else:
          print(f"  ✓ task_type : '{task_type}'")

      # ── 7. Vérifications spécifiques par task_type ────────────────────
      if task_type == "timeseries":
          if dates_train is None:
              errors.append("❌ dates_train manquant pour timeseries")
          if dates_future is None:
              errors.append("❌ dates_future manquant pour timeseries")
          if dates_train is not None and dates_future is not None:
              if dates_future.min() <= dates_train.max():
                  errors.append("❌ dates_future chevauche dates_train — leakage temporel !")
              else:
                  print(f"  ✓ Pas de chevauchement temporel train/future")

      if task_type == "nlp":
          if not isinstance(texts_train, list):
              errors.append("❌ texts_train doit être une list[str]")
          if not isinstance(texts_test, list):
              errors.append("❌ texts_test doit être une list[str]")
          if isinstance(texts_train, list) and isinstance(texts_test, list):
              print(f"  ✓ Corpus NLP : train={len(texts_train):,} | test={len(texts_test):,}")

      # ── 8. Vérification preprocessor fitté ───────────────────────────
      if preprocessor is not None:
          has_transform = hasattr(preprocessor, "transform")
          has_fit = any([
              hasattr(preprocessor, "n_features_in_"),        # sklearn fitted
              hasattr(preprocessor, "named_transformers_"),   # ColumnTransformer
              hasattr(preprocessor, "named_steps"),           # Pipeline
          ])
          if not has_transform:
              errors.append("❌ preprocessor n'a pas de méthode transform()")
          else:
              print(f"  ✓ preprocessor possède transform()")

      # ── 9. Doublons entre train et test (sur indices si DataFrame) ────
      if isinstance(X_train, pd.DataFrame) and isinstance(X_test, pd.DataFrame):
          overlap = X_train.index.intersection(X_test.index)
          if len(overlap) > 0:
              errors.append(
                  f"❌ {len(overlap)} indices communs entre X_train et X_test — leakage !"
              )
          else:
              print(f"  ✓ Aucun indice commun train/test")

      # ── Rapport final ─────────────────────────────────────────────────
      print("\n" + "─" * 70)
      if warnings:
          print("AVERTISSEMENTS :")
          for w in warnings:
              print(f"  {w}")
      if errors:
          print("\nERREURS BLOQUANTES :")
          for e in errors:
              print(f"  {e}")
          raise RuntimeError(
              f"Bloc 2 — {len(errors)} erreur(s) de contrat détectée(s). "
              "Corriger avant de passer au Bloc 3."
          )
      else:
          print(f"\n✅ Contrat Bloc 2 VALIDÉ — {len(warnings)} avertissement(s)")
          print(f"   Prêt pour le Bloc 3 (Entraînement des modèles)")

      print("=" * 70)


# ──────────────────────────────────────────────────────────────────────────
# SECTION H — PERSISTANCE & EXPORT
# Sauvegarde les artefacts du Bloc 2 pour reproductibilité et déploiement.
# ──────────────────────────────────────────────────────────────────────────

persistence:

  - id: save_preprocessor
    name: "Sauvegarde du Preprocessor et des Artefacts Bloc 2"
    enabled: true
    category: "Persistance — Artefacts"
    description: >
      Sérialise le preprocessor sklearn fitté, les arrays train/test,
      feature_names_out et les métadonnées dans des fichiers reproductibles.
      Utilise joblib (rapide pour numpy arrays) et JSON pour les métadonnées.
    applies_to: ["classification", "regression", "clustering", "timeseries", "nlp", "anomaly", "survival"]
    when_to_use: >
      En fin de Bloc 2, après la validation du contrat (Section G).
      Obligatoire pour la reproductibilité et le déploiement du pipeline.
    code_template: |
      import os
      import json
      import numpy as np
      import joblib
      from datetime import datetime

      # ── Répertoire de sortie ──────────────────────────────────────────
      OUTPUT_DIR = "artefacts/bloc2"
      os.makedirs(OUTPUT_DIR, exist_ok=True)

      RUN_ID = datetime.now().strftime("%Y%m%d_%H%M%S")

      # ── 1. Preprocessor sklearn ───────────────────────────────────────
      preprocessor_path = os.path.join(OUTPUT_DIR, f"preprocessor_{RUN_ID}.joblib")
      joblib.dump(preprocessor, preprocessor_path)
      print(f"✓ Preprocessor sauvegardé : {preprocessor_path}")

      # ── 2. Arrays numpy (X_train, X_test, y_train, y_test) ───────────
      # Convertir sparse en dense si nécessaire
      def to_dense(arr):
          if arr is None:
              return None
          if hasattr(arr, "toarray"):
              return arr.toarray()
          return np.array(arr)

      arrays = {
          "X_train": to_dense(X_train),
          "X_test":  to_dense(X_test),
          "y_train": np.array(y_train) if y_train is not None else None,
          "y_test":  np.array(y_test)  if y_test  is not None else None,
      }
      arrays_path = os.path.join(OUTPUT_DIR, f"arrays_{RUN_ID}.npz")
      np.savez_compressed(arrays_path, **{k: v for k, v in arrays.items() if v is not None})
      print(f"✓ Arrays sauvegardés      : {arrays_path}")

      # ── 3. Métadonnées JSON ───────────────────────────────────────────
      def _serializable(obj):
          """Convertit les types non-JSON en types natifs Python."""
          if isinstance(obj, (np.integer, np.int64)):
              return int(obj)
          if isinstance(obj, (np.floating, np.float64)):
              return float(obj)
          if isinstance(obj, np.ndarray):
              return obj.tolist()
          if isinstance(obj, dict):
              return {k: _serializable(v) for k, v in obj.items()
                      if not callable(v) and k != "sample_weight_train"}
          return str(obj)

      meta_export = {
          "run_id":            RUN_ID,
          "task_type":         task_type,
          "feature_names_out": feature_names_out,
          "n_features":        len(feature_names_out),
          "n_train":           int(X_train.shape[0]) if X_train is not None else None,
          "n_test":            int(X_test.shape[0])  if X_test  is not None else None,
          "preprocessor_path": preprocessor_path,
          "arrays_path":       arrays_path,
          "meta_pipeline":     _serializable({k: v for k, v in meta.items()
                                              if not callable(v)}),
      }
      # Timeseries
      if task_type == "timeseries" and dates_train is not None:
          meta_export["dates_train_min"]  = str(dates_train.min())
          meta_export["dates_train_max"]  = str(dates_train.max())
          meta_export["dates_future_min"] = str(dates_future.min())
          meta_export["dates_future_max"] = str(dates_future.max())

      meta_path = os.path.join(OUTPUT_DIR, f"meta_{RUN_ID}.json")
      with open(meta_path, "w", encoding="utf-8") as f:
          json.dump(meta_export, f, indent=2, ensure_ascii=False)
      print(f"✓ Métadonnées sauvegardées : {meta_path}")

      # ── 4. feature_names_out en texte ────────────────────────────────
      feat_path = os.path.join(OUTPUT_DIR, f"feature_names_out_{RUN_ID}.txt")
      with open(feat_path, "w", encoding="utf-8") as f:
          f.write("\n".join(feature_names_out))
      print(f"✓ feature_names_out       : {feat_path}")

      # ── 5. Résumé ─────────────────────────────────────────────────────
      print(f"\n── Résumé Bloc 2 sauvegardé (run_id={RUN_ID}) ──")
      print(f"   task_type       : {task_type}")
      print(f"   n_features_out  : {len(feature_names_out)}")
      print(f"   X_train shape   : {X_train.shape if X_train is not None else 'None'}")
      print(f"   X_test  shape   : {X_test.shape  if X_test  is not None else 'None'}")
      print(f"   Répertoire      : {os.path.abspath(OUTPUT_DIR)}/")

      # Stocker le run_id dans meta pour traçabilité Bloc 3
      meta["bloc2_run_id"]            = RUN_ID
      meta["bloc2_preprocessor_path"] = preprocessor_path
      meta["bloc2_arrays_path"]       = arrays_path

      # Pass-through : toutes variables contrat inchangées

  - id: load_preprocessor
    name: "Chargement du Preprocessor (Reprise / Inférence)"
    enabled: true
    category: "Persistance — Chargement"
    description: >
      Recharge un preprocessor sauvegardé en Bloc 2 et reconstitue
      les variables du contrat pour la reprise d'entraînement ou l'inférence.
      Utile pour scorer de nouvelles données sans ré-exécuter tout le pipeline.
    applies_to: ["classification", "regression", "clustering", "timeseries", "nlp", "anomaly", "survival"]
    when_to_use: >
      Reprise après interruption, déploiement, ou scoring de nouvelles données
      sans ré-entraîner le preprocessor. Remplace l'ensemble du Bloc 2 dans ce cas.
    code_template: |
      import os
      import json
      import numpy as np
      import joblib

      # ── Paramètres à adapter ──────────────────────────────────────────
      OUTPUT_DIR = "artefacts/bloc2"
      RUN_ID     = "YYYYMMDD_HHMMSS"   # ← remplacer par le run_id cible
      # ou lire depuis meta si déjà disponible :
      # RUN_ID = meta.get("bloc2_run_id")

      # ── Chemins ───────────────────────────────────────────────────────
      preprocessor_path = os.path.join(OUTPUT_DIR, f"preprocessor_{RUN_ID}.joblib")
