    code_template: |
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from collections import Counter

      print(f"images_train : {images_train.shape}")
      print(f"images_test  : {images_test.shape}")
      print(f"img_shape    : {img_shape}")
      print(f"n_classes    : {n_classes}")
      print(f"class_names  : {class_names}")

      # Distribution des classes
      if labels_train is not None:
          counts = Counter(labels_train)
          sorted_classes = sorted(counts.keys())
          names = (class_names if class_names else [str(c) for c in sorted_classes])
          fig, ax = plt.subplots(figsize=(max(8, len(counts) * 0.6), 5))
          ax.bar(range(len(sorted_classes)),
                 [counts[c] for c in sorted_classes],
                 color="steelblue")
          ax.set_xticks(range(len(sorted_classes)))
          ax.set_xticklabels(names, rotation=45, ha="right")
          ax.set_title("Distribution des classes (train)")
          plt.tight_layout()
          plt.savefig("eda_vision_classes.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

          ratio = max(counts.values()) / max(min(counts.values()), 1)
          print(f"Ratio desequilibre : {ratio:.1f}x")

      # Exemples par classe (grille)
      if labels_train is not None and class_names is not None:
          n_show = min(n_classes, 8)
          fig, axes = plt.subplots(1, n_show, figsize=(3 * n_show, 3))
          if n_show == 1:
              axes = [axes]
          for i in range(n_show):
              idx = np.where(labels_train == i)[0]
              if len(idx) == 0:
                  continue
              img = images_train[idx[0]]
              # Denormaliser si necessaire (valeurs hors [0,1])
              if img.min() < 0 or img.max() > 1:
                  img = (img - img.min()) / (img.max() - img.min() + 1e-8)
              if img.shape[2] == 1:
                  axes[i].imshow(img.squeeze(), cmap="gray")
              else:
                  axes[i].imshow(img)
              axes[i].set_title(
                  class_names[i] if i < len(class_names) else str(i), fontsize=8)
              axes[i].axis("off")
          plt.suptitle("Exemples par classe")
          plt.tight_layout()
          plt.savefig("eda_vision_examples.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

      # Statistiques pixel par canal
      if images_train.shape[-1] in (1, 3):
          n_chan = images_train.shape[-1]
          mean_per_channel = images_train.mean(axis=(0, 1, 2))
          std_per_channel  = images_train.std(axis=(0, 1, 2))
          chan_labels = ["R", "G", "B"][:n_chan] if n_chan == 3 else ["Gray"]
          print("\nStatistiques pixel par canal :")
          for i, label in enumerate(chan_labels):
              print(f"  {label} : mean={mean_per_channel[i]:.4f}  "
                    f"std={std_per_channel[i]:.4f}")

      # Histogramme de luminance global
      flat = images_train.ravel()
      plt.figure(figsize=(10, 4))
      plt.hist(flat, bins=256, color="steelblue", alpha=0.7)
      plt.title("Distribution globale des valeurs de pixels")
      plt.xlabel("Valeur pixel")
      plt.ylabel("Frequence")
      plt.tight_layout()
      plt.savefig("eda_vision_pixel_hist.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

  - id: eda_vision_embedding
    name: "EDA Vision — Embeddings 2D (features CNN)"
    enabled: true
    category: "EDA — Vision"
    description: >
      Extraction de features via ResNet18 ou VGG16 pre-entraine (derniere
      couche avant classification), puis visualisation t-SNE / UMAP coloriee
      par classe. Revele la separabilite des classes dans l'espace feature.
    applies_to: ["image_classification", "image_clustering"]
    when_to_use: >
      Avant de choisir une strategie de transfer learning. Revele si les features
      ImageNet separent deja les classes ou si un fine-tuning profond est necessaire.
    pros:
      - "t-SNE et UMAP sur features CNN bien plus informatifs que sur pixels bruts"
      - "Revele les confusions inter-classes"
    cons:
      - "Necessite PyTorch et torchvision"
      - "Lent sur CPU pour grandes collections"
    code_template: |
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      MODEL_NAME  = "resnet18"   # "resnet18" | "vgg16"
      MAX_IMAGES  = 2000
      BATCH_SIZE  = 64
      PERPLEXITY  = 30

      try:
          import torch
          import torchvision.models as models
          from torch.utils.data import TensorDataset, DataLoader

          n_show = min(MAX_IMAGES, len(images_train))
          idx    = np.random.choice(len(images_train), n_show, replace=False)
          imgs   = images_train[idx]
          lbls   = labels_train[idx] if labels_train is not None else None

          # Modele pre-entraine
          device = "cuda" if torch.cuda.is_available() else "cpu"
          if MODEL_NAME == "resnet18":
              model = models.resnet18(weights="IMAGENET1K_V1")
              model.fc = torch.nn.Identity()
          else:
              model = models.vgg16(weights="IMAGENET1K_V1")
              model.classifier[-1] = torch.nn.Identity()
          model = model.eval().to(device)

          # Extraction features
          t_imgs = torch.from_numpy(imgs).permute(0, 3, 1, 2).float().to(device)
          ds     = TensorDataset(t_imgs)
          dl     = DataLoader(ds, batch_size=BATCH_SIZE, shuffle=False)
          features = []
          with torch.no_grad():
              for (batch,) in dl:
                  features.append(model(batch).cpu().numpy())
          features = np.concatenate(features, axis=0)
          print(f"Features CNN : {features.shape}")

          # t-SNE
          from sklearn.manifold import TSNE
          X_tsne = TSNE(n_components=2, perplexity=PERPLEXITY,
                        random_state=42, n_jobs=-1).fit_transform(features)

          plt.figure(figsize=(12, 8))
          if lbls is not None and class_names is not None:
              for i in range(n_classes):
                  mask = lbls == i
                  plt.scatter(X_tsne[mask, 0], X_tsne[mask, 1],
                              alpha=0.5, s=10, label=class_names[i])
              plt.legend(markerscale=2, fontsize=8)
          else:
              plt.scatter(X_tsne[:, 0], X_tsne[:, 1], alpha=0.3, s=5)
          plt.title(f"t-SNE features {MODEL_NAME} ({n_show} images)")
          plt.tight_layout()
          plt.savefig("eda_vision_tsne.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

      except ImportError as e:
          print(f"PyTorch / torchvision requis : {e}")


