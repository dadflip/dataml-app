# SECTION G — REDUCTION ET AUGMENTATION VISION
# ══════════════════════════════════════════════════════════════════════════

vision_transforms:

  - id: vt_data_augmentation
    name: "Vision — Data Augmentation (train)"
    enabled: true
    category: "Vision — Augmentation"
    description: >
      Augmentation du jeu d'entrainement par transformations geometriques
      (flip, rotation, crop) et photometriques (jitter, grayscale, erase).
      Applique UNIQUEMENT sur images_train.
    applies_to: ["image_classification", "image_segmentation"]
    when_to_use: >
      Quand le dataset d'entrainement est petit (<5000 images) ou pour
      ameliorer la generalisation. N'augmenter que les images d'entrainement.
    pros:
      - "Ameliore la generalisation significativement"
      - "Transformations torchvision robustes"
    cons:
      - "Necessite PyTorch"
      - "Augmentation excessive peut degrader la performance"
    code_template: |
      import numpy as np

      FLIP_PROB      = 0.5
      ROTATION_MAX   = 15
      BRIGHTNESS     = 0.2
      CONTRAST       = 0.2
      CROP_SCALE_MIN = 0.8

      try:
          import torch
          import torchvision.transforms as T
          from torch.utils.data import DataLoader, TensorDataset

          _MEAN = [0.485, 0.456, 0.406]
          _STD  = [0.229, 0.224, 0.225]

          augment_transform = T.Compose([
              T.RandomHorizontalFlip(p=FLIP_PROB),
              T.RandomRotation(degrees=ROTATION_MAX),
              T.RandomResizedCrop(size=img_shape[:2],
                                  scale=(CROP_SCALE_MIN, 1.0)),
              T.ColorJitter(brightness=BRIGHTNESS, contrast=CONTRAST,
                            saturation=0.1, hue=0.05),
              T.RandomGrayscale(p=0.05),
              T.RandomErasing(p=0.1),
          ])

          # Reconstruction des DataLoaders avec augmentation
          BATCH_SIZE  = 32
          NUM_WORKERS = 4

          t_train_imgs = torch.from_numpy(images_train).permute(0, 3, 1, 2).float()
          t_train_lbls = (torch.from_numpy(labels_train).long()
                          if labels_train is not None
                          else torch.zeros(len(images_train), dtype=torch.long))

          class AugDataset(torch.utils.data.Dataset):
              def __init__(self, imgs, lbls, transform):
                  self.imgs      = imgs
                  self.lbls      = lbls
                  self.transform = transform
              def __len__(self):
                  return len(self.imgs)
              def __getitem__(self, idx):
                  img = self.imgs[idx]
                  img = self.transform(img)
                  return img, self.lbls[idx]

          aug_ds   = AugDataset(t_train_imgs, t_train_lbls, augment_transform)
          dl_train = DataLoader(aug_ds, batch_size=BATCH_SIZE,
                                shuffle=True, num_workers=NUM_WORKERS)

          print(f"DataLoader train avec augmentation : {len(aug_ds)} images")
          print(f"Transformations : flip={FLIP_PROB}, rotation={ROTATION_MAX}deg, "
                f"jitter={BRIGHTNESS}/{CONTRAST}")
      except ImportError:
          print("PyTorch requis : pip install torch torchvision")

  - id: vt_resize_normalize
    name: "Vision — Redimensionnement et Renormalisation"
    enabled: true
    category: "Vision — Preprocessing"
    description: >
      Redimensionnement vers une nouvelle taille cible, conversion en float32,
      renormalisation (ImageNet ou z-score par dataset, ou [0,1] brut).
      Applique sur images_train et images_test.
    applies_to: ["image_classification", "image_clustering", "image_anomaly",
                 "image_regression"]
    when_to_use: >
      Quand img_shape ne correspond pas au modele cible (ex: ResNet attend 224x224
      mais les images sont 64x64). Aussi pour changer la normalisation.
    pros:
      - "Aucune dependance PyTorch - utilise PIL et NumPy"
      - "Applique train et test de facon coherente"
    cons:
      - "Lent sur tres grands datasets (preferer torchvision.transforms en DL)"
    code_template: |
      import numpy as np
      from PIL import Image

      NEW_SIZE    = 224   # taille cible (pixels)
      NORMALIZE   = "imagenet"   # "imagenet" | "zscore" | "minmax" | "none"

      _IMAGENET_MEAN = np.array([0.485, 0.456, 0.406], dtype=np.float32)
      _IMAGENET_STD  = np.array([0.229, 0.224, 0.225], dtype=np.float32)

      def resize_images(imgs, size):
          resized = np.zeros((len(imgs), size, size, imgs.shape[3]), dtype=np.float32)
          for i, img in enumerate(imgs):
              # Denormaliser si necessaire avant resize
              arr = img
              if arr.min() < 0 or arr.max() > 1:
                  arr = (arr - arr.min()) / (arr.max() - arr.min() + 1e-8)
              pil = Image.fromarray((arr * 255).astype(np.uint8))
              if pil.mode == "RGBA":
                  pil = pil.convert("RGB")
              pil = pil.resize((size, size), Image.BILINEAR)
              resized[i] = np.array(pil, dtype=np.float32) / 255.0
          return resized

      if images_train.shape[1] != NEW_SIZE:
          print(f"Redimensionnement {images_train.shape[1]} -> {NEW_SIZE}")
          images_train = resize_images(images_train, NEW_SIZE)
          images_test  = resize_images(images_test,  NEW_SIZE)

      # Normalisation
      if NORMALIZE == "imagenet":
          images_train = (images_train - _IMAGENET_MEAN) / _IMAGENET_STD
          images_test  = (images_test  - _IMAGENET_MEAN) / _IMAGENET_STD
      elif NORMALIZE == "zscore":
          mu  = images_train.mean(axis=(0, 1, 2), keepdims=True)
          std = images_train.std(axis=(0, 1, 2),  keepdims=True) + 1e-8
          images_train = (images_train - mu) / std
          images_test  = (images_test  - mu) / std
          meta["vision_norm_mu"]  = mu
          meta["vision_norm_std"] = std
      elif NORMALIZE == "minmax":
          mn = images_train.min()
          mx = images_train.max()
          images_train = (images_train - mn) / (mx - mn + 1e-8)
          images_test  = (images_test  - mn) / (mx - mn + 1e-8)

      img_shape = tuple(images_train.shape[1:])
      print(f"img_shape apres : {img_shape}")
      print(f"pixels train — mean={images_train.mean():.4f} std={images_train.std():.4f}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION H — TRANSFORMATIONS SEQUENCES
# ══════════════════════════════════════════════════════════════════════════

sequence_transforms:

  - id: st_padding_truncation
    name: "Sequences — Padding et Troncature"
    enabled: true
    category: "Sequence — Preprocessing"
    description: >
      Homogeneisation des longueurs par padding a droite (ou gauche) et
      troncature. Calcule et met a jour seq_lengths.
    applies_to: ["text_classification", "audio_classification",
                 "timeseries_classification"]
    when_to_use: >
      Quand sequences_train est une liste de tableaux de longueurs variables.
      Obligatoire avant tout modele DL exigeant des batches de forme fixe.
    pros:
      - "Padding configurable (gauche/droite, valeur)"
      - "Met a jour seq_lengths pour les modeles avec masquage"
    cons:
      - "Padding excessif degrade les performances — ajuster MAX_LEN"
    code_template: |
      import numpy as np

      MAX_LEN   = None   # None = max observee
      int = valeur fixee
      PAD_SIDE  = "right"   # "right" | "left"
      PAD_VALUE = 0

      if isinstance(sequences_train, list):
          lengths_tr = np.array([len(s) for s in sequences_train])
          lengths_te = np.array([len(s) for s in sequences_test])
          L = MAX_LEN or int(lengths_tr.max())
          F = sequences_train[0].shape[-1] if sequences_train[0].ndim > 1 else 1

          def pad_list(seqs, L, F, pad_val, side):
              out = np.full((len(seqs), L, F), pad_val, dtype=np.float32)
              for i, s in enumerate(seqs):
                  t = min(len(s), L)
                  arr = s[:t].reshape(t, F)
                  if side == "right":
                      out[i, :t, :] = arr
                  else:
                      out[i, L-t:, :] = arr
              return out

          sequences_train = pad_list(sequences_train, L, F, PAD_VALUE, PAD_SIDE)
          sequences_test  = pad_list(sequences_test,  L, F, PAD_VALUE, PAD_SIDE)
          seq_lengths     = np.minimum(lengths_tr, L)
      else:
          L = MAX_LEN or sequences_train.shape[1]
          if sequences_train.shape[1] > L:
              sequences_train = sequences_train[:, :L, :]
              sequences_test  = sequences_test[:,  :L, :]
              seq_lengths     = np.full(len(sequences_train), L, dtype=np.int64)
          else:
              seq_lengths = np.minimum(seq_lengths, L) if seq_lengths is not None \
                            else np.full(len(sequences_train),
                                         sequences_train.shape[1], dtype=np.int64)

      print(f"sequences_train : {sequences_train.shape}")
      print(f"sequences_test  : {sequences_test.shape}")
      print(f"MAX_LEN effectif : {L} | pad_side={PAD_SIDE}")

  - id: st_normalization
    name: "Sequences — Normalisation (Z-score par Feature)"
    enabled: true
    category: "Sequence — Preprocessing"
    description: >
      Normalisation z-score par feature temporelle, calculee sur
      sequences_train uniquement et appliquee a sequences_test.
      Specifique aux sequences numeriques (TS, audio).
    applies_to: ["timeseries_classification", "timeseries_forecasting",
                 "audio_classification"]
    when_to_use: >
      Pour sequences numeriques avant RNN/TCN/Transformer.
      Ne pas appliquer sur des sequences de tokens NLP (IDs).
    pros:
      - "Normalisation sans leakage (fit sur train uniquement)"
      - "Par feature : preserve les differences d'echelle inter-features"
    cons:
      - "Ne convient pas aux tokens NLP"
    code_template: |
      import numpy as np

      AXIS = (0, 1)   # (N, T) — moyenne et std sur observations et timesteps

      mu  = sequences_train.mean(axis=AXIS, keepdims=True)
      std = sequences_train.std( axis=AXIS, keepdims=True) + 1e-8

      sequences_train = (sequences_train - mu) / std
      sequences_test  = (sequences_test  - mu) / std

      meta["seq_norm_mu"]  = mu
      meta["seq_norm_std"] = std

      print(f"Normalisation sequences — mu shape : {mu.shape}")
      print(f"mean apres norm (train) : {sequences_train.mean():.4f}")
      print(f"std  apres norm (train) : {sequences_train.std():.4f}")

  - id: st_mfcc_extraction
    name: "Sequences — Extraction MFCC"
    enabled: true
    category: "Sequence — Audio"
    description: >
      Transforme des waveforms bruts (N, T, 1) en features MFCC (N, T', N_MFCC)
      via librosa. Produit une representation compacte et discriminante pour
      les modeles de classification audio.
    applies_to: ["audio_classification", "audio_regression"]
    when_to_use: >
      Quand sequences_train contient des waveforms bruts (contract_sequence,
      snippet audio_raw_sequence). Alternative aux waveforms pour CNN1D/LSTM.
    pros:
      - "MFCC beaucoup plus compact et discriminant que le waveform brut"
      - "Standard de facto en reconnaissance vocale et sonore"
    cons:
      - "Necessite librosa"
      - "Perte de l'information de phase"
    code_template: |
      import numpy as np

      N_MFCC    = 40
      HOP_LEN   = 512
      N_FFT     = 2048
      SR_USE    = sr if sr is not None else 22050

      try:
          import librosa

          def extract_mfcc_batch(seqs, sr_val, n_mfcc, hop, n_fft):
              out = []
              for i, seq in enumerate(seqs):
                  y = seq.ravel().astype(np.float32)
                  mfcc = librosa.feature.mfcc(y=y, sr=sr_val,
                                              n_mfcc=n_mfcc,
                                              hop_length=hop,
                                              n_fft=n_fft)
                  out.append(mfcc.T)   # (T', N_MFCC)
              return out

          print("Extraction MFCC train...")
          mfcc_tr = extract_mfcc_batch(sequences_train, SR_USE, N_MFCC, HOP_LEN, N_FFT)
          print("Extraction MFCC test...")
          mfcc_te = extract_mfcc_batch(sequences_test,  SR_USE, N_MFCC, HOP_LEN, N_FFT)

          # Padding vers la longueur maximale
          L_tr = max(m.shape[0] for m in mfcc_tr)
          L_te = max(m.shape[0] for m in mfcc_te)
          L    = max(L_tr, L_te)

          def pad_mfcc(mfccs, L):
              out = np.zeros((len(mfccs), L, N_MFCC), dtype=np.float32)
              for i, m in enumerate(mfccs):
                  t = min(m.shape[0], L)
                  out[i, :t, :] = m[:t, :]
              return out

          sequences_train = pad_mfcc(mfcc_tr, L)
          sequences_test  = pad_mfcc(mfcc_te, L)
          n_features      = N_MFCC
          seq_lengths     = np.array([min(m.shape[0], L) for m in mfcc_tr],
                                     dtype=np.int64)

          print(f"MFCC : {sequences_train.shape}  (N, T', N_MFCC={N_MFCC})")
      except ImportError:
          print("pip install librosa")


# ══════════════════════════════════════════════════════════════════════════
# SECTION I — VALIDATION DU CONTRAT DE SORTIE
# ══════════════════════════════════════════════════════════════════════════

contract_validation:

  - id: validate_bloc2_outputs
    name: "Validation Contrat de Sortie — Bloc 2"
    enabled: true
    category: "Validation — Contrat"
    description: >
      Assertions sur toutes les variables de sortie du Bloc 2 selon le
      contrat actif (tabular, vision ou sequence). Detecte les incohérences
      de shape, les NaN résiduels et les variables manquantes avant le Bloc 3.
    applies_to: ["classification", "regression", "clustering", "timeseries",
                 "nlp", "anomaly", "survival", "image_classification",
                 "image_clustering", "text_classification", "audio_classification",
                 "timeseries_classification", "timeseries_forecasting"]
    when_to_use: "Toujours. Dernier snippet du Bloc 2."
    code_template: |
      import numpy as np
      import pandas as pd

      print("=" * 70)
      print("VALIDATION CONTRAT DE SORTIE — BLOC 2")
      print("=" * 70)

      errors   = []
      warnings = []
      contract = meta.get("contract", "tabular")

      print(f"Contract actif : {contract}")

      def _shape(arr):
          if arr is None:
              return None
          return arr.shape if hasattr(arr, "shape") else (len(arr),)

      def _count_nan(arr):
          if arr is None:
              return 0
          if hasattr(arr, "toarray"):
              return int(np.isnan(arr.toarray()).sum())
          try:
              return int(np.isnan(np.array(arr, dtype=float)).sum())
          except Exception:
              return 0

      if contract == "vision":
          required = {
              "images_train" : images_train,
              "images_test"  : images_test,
              "labels_train" : labels_train,
              "img_shape"    : img_shape,
              "n_classes"    : n_classes,
          }
          for name, var in required.items():
              if var is None:
                  warnings.append(f"Variable vision manquante : {name}")
              else:
                  print(f"  {name} : {_shape(var)}")
          if images_train is not None and images_test is not None:
              if images_train.shape[1:] != images_test.shape[1:]:
                  errors.append(
                      f"Shape images_train {images_train.shape[1:]} "
                      f"!= images_test {images_test.shape[1:]}")

      elif contract == "sequence":
          required = {
              "sequences_train" : sequences_train,
              "sequences_test"  : sequences_test,
              "seq_lengths"     : seq_lengths,
              "n_features"      : n_features,
          }
          for name, var in required.items():
              if var is None:
                  warnings.append(f"Variable sequence manquante : {name}")
              else:
                  print(f"  {name} : {_shape(var)}")
          if (sequences_train is not None and sequences_test is not None
                  and sequences_train.shape[1:] != sequences_test.shape[1:]):
              errors.append(
                  f"Shape sequences train {sequences_train.shape[1:]} "
                  f"!= test {sequences_test.shape[1:]}")

      else:
          # Tabular
          for name, var in [("X_train", X_train), ("X_test", X_test),
                             ("y_train", y_train), ("y_test", y_test),
                             ("feature_names_out", feature_names_out)]:
              if var is None:
                  errors.append(f"Variable tabular manquante : {name}")
              else:
                  print(f"  {name} : {_shape(var)}")

          if X_train is not None and y_train is not None:
              n_tr = _shape(X_train)[0]
              n_y  = len(y_train)
              if n_tr != n_y:
                  errors.append(f"X_train ({n_tr}) != y_train ({n_y})")

          if X_train is not None and feature_names_out is not None:
              n_feat_arr  = _shape(X_train)[-1] if len(_shape(X_train)) > 1 else -1
              n_feat_list = len(feature_names_out)
              if n_feat_arr != n_feat_list:
                  errors.append(
                      f"feature_names_out ({n_feat_list}) != X_train.shape[1] ({n_feat_arr})")

          nan_tr = _count_nan(X_train)
          nan_te = _count_nan(X_test)
          if nan_tr > 0:
              warnings.append(f"X_train contient {nan_tr:,} NaN")
          if nan_te > 0:
              warnings.append(f"X_test contient {nan_te:,} NaN")

          if task_type == "timeseries":
              if dates_train is None:
                  errors.append("dates_train manquant pour timeseries")
              if dates_future is None:
                  errors.append("dates_future manquant pour timeseries")
              if (dates_train is not None and dates_future is not None
                      and dates_future.min() <= dates_train.max()):
                  errors.append("dates_future chevauche dates_train — leakage temporel")

      # Rapport final
      print("\n" + "-" * 70)
      for w in warnings:
          print(f"  AVERTISSEMENT : {w}")
      if errors:
          print("\nERREURS BLOQUANTES :")
          for e in errors:
              print(f"  {e}")
          raise RuntimeError(
              f"Bloc 2 — {len(errors)} erreur(s) detectee(s). "
              "Corriger avant le Bloc 3.")
      else:
          print(f"\nContrat Bloc 2 VALIDE — {len(warnings)} avertissement(s)")
          print("Pret pour le Bloc 3.")
      print("=" * 70)
