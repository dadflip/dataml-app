# SECTION D — FEATURE ENGINEERING TABULAR
# Modifient X et feature_names. Executent AVANT tout split.
# Chaque snippet MET A JOUR : X, feature_names, meta
# ══════════════════════════════════════════════════════════════════════════

feature_engineering_tabular:

  - id: fe_datetime
    name: "Feature Engineering — Dates et Temps"
    enabled: true
    category: "Feature Engineering — Temporel"
    description: >
      Extraction de composantes temporelles (heure, jour, mois, annee, trimestre),
      encodage cyclique sin/cos, indicateurs is_weekend et is_monthend, jours feries.
    applies_to: ["classification", "regression", "timeseries"]
    when_to_use: >
      Des qu'une colonne datetime est presente dans X. Executer avant le split
      pour que les features soient disponibles dans X_train et X_test.
    pros:
      - "Encodage cyclique preserve la continuite (dec->jan, ven->sam)"
      - "Jours feries via la librairie holidays"
    cons:
      - "Necessite holidays pour les jours feries"
      - "Fuseaux horaires a gerer en amont"
    code_template: |
      import pandas as pd
      import numpy as np

      DATE_COL = "created_at"   # adapter

      X[DATE_COL] = pd.to_datetime(X[DATE_COL])
      X["hour"]        = X[DATE_COL].dt.hour
      X["dayofweek"]   = X[DATE_COL].dt.dayofweek
      X["dayofmonth"]  = X[DATE_COL].dt.day
      X["dayofyear"]   = X[DATE_COL].dt.dayofyear
      X["weekofyear"]  = X[DATE_COL].dt.isocalendar().week.astype(int)
      X["month"]       = X[DATE_COL].dt.month
      X["quarter"]     = X[DATE_COL].dt.quarter
      X["year"]        = X[DATE_COL].dt.year
      X["is_weekend"]  = X["dayofweek"].isin([5, 6]).astype(int)
      X["is_monthend"] = X[DATE_COL].dt.is_month_end.astype(int)
      # Encodage cyclique
      X["hour_sin"]    = np.sin(2 * np.pi * X["hour"]      / 24)
      X["hour_cos"]    = np.cos(2 * np.pi * X["hour"]      / 24)
      X["dow_sin"]     = np.sin(2 * np.pi * X["dayofweek"] / 7)
      X["dow_cos"]     = np.cos(2 * np.pi * X["dayofweek"] / 7)
      X["month_sin"]   = np.sin(2 * np.pi * X["month"]     / 12)
      X["month_cos"]   = np.cos(2 * np.pi * X["month"]     / 12)
      try:
          import holidays
          fr_hol = holidays.France()
          X["is_holiday"] = X[DATE_COL].dt.date.map(lambda d: int(d in fr_hol))
      except ImportError:
          print("pip install holidays pour les jours feries")
      X.drop(columns=[DATE_COL], inplace=True)

      feature_names = X.columns.tolist()
      meta["fe_datetime_col"] = DATE_COL
      print(f"Shape apres FE date : {X.shape}")

  - id: fe_interactions
    name: "Feature Engineering — Interactions et Polynomiales"
    enabled: true
    category: "Feature Engineering — Numerique"
    description: >
      Ratios, produits, transformations log/sqrt/reciproque, polynomes degre 2.
      Capture les interactions non-lineaires entre features numeriques.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Quand les features numeriques ont des interactions suspectees.
      Executer avant le split pour coherence train/test.
    pros:
      - "Ratios domaine-specifiques souvent tres predictifs"
      - "Transformations log/sqrt corrigent la skewness"
    cons:
      - "Explosion du nombre de features avec les polynomes"
      - "PolynomialFeatures sur N features produit N*(N+1)/2 termes d'interaction"
    code_template: |
      import pandas as pd
      import numpy as np

      num_cols = X.select_dtypes(include="number").columns.tolist()

      # Transformations mathematiques sur les features a skewness elevee
      for col in num_cols:
          if X[col].min() >= 0:
              X[f"{col}_log1p"] = np.log1p(X[col])
              X[f"{col}_sqrt"]  = np.sqrt(X[col].clip(lower=0))
          if X[col].min() > 0:
              X[f"{col}_recip"] = 1.0 / X[col].replace(0, np.nan)

      # Ratios domaine-specifiques (exemples a adapter)
      if "revenue" in X.columns and "n_orders" in X.columns:
          X["avg_order_value"] = X["revenue"] / (X["n_orders"] + 1)
      if "clicks" in X.columns and "impressions" in X.columns:
          X["ctr"] = X["clicks"] / (X["impressions"] + 1)

      # Interactions polynomiales (sur sous-ensemble pour limiter l'explosion)
      TOP_FEATS = num_cols[:6]
      from sklearn.preprocessing import PolynomialFeatures
      poly = PolynomialFeatures(degree=2, interaction_only=True, include_bias=False)
      poly_arr = poly.fit_transform(X[TOP_FEATS])
      poly_names = poly.get_feature_names_out(TOP_FEATS).tolist()
      new_cols = [n for n in poly_names if " " in n]   # termes d'interaction uniquement
      new_idx  = [poly_names.index(n) for n in new_cols]
      poly_df  = pd.DataFrame(poly_arr[:, new_idx],
                              columns=new_cols, index=X.index)
      X = pd.concat([X, poly_df], axis=1)

      feature_names = X.columns.tolist()
      print(f"Shape apres FE interactions : {X.shape}")

  - id: fe_aggregations
    name: "Feature Engineering — Agregations par Groupe"
    enabled: true
    category: "Feature Engineering — Agregation"
    description: >
      Features statistiques agregees par groupe (client, produit, region) :
      mean, std, min, max, median, count, skewness. Anti-leakage par calcul
      uniquement sur les donnees disponibles avant chaque observation.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Quand il existe un identifiant de groupe avec plusieurs observations.
      Executer avant le split.
    pros:
      - "Tres efficace pour donnees transactionnelles"
      - "Anti-leakage : stats calculees sur X entier avant split"
    cons:
      - "Fuite potentielle si y influence les stats — verifier le domaine"
    code_template: |
      import pandas as pd
      import numpy as np
      from scipy import stats as sp_stats

      GROUP_COL = "customer_id"   # adapter
      NUM_COLS  = [c for c in X.select_dtypes(include="number").columns.tolist()
                   if c != GROUP_COL][:5]   # limiter aux 5 premieres pour la demo

      group_stats = X.groupby(GROUP_COL)[NUM_COLS].agg(
          ["mean", "std", "min", "max", "median", "count"])
      group_stats.columns = [f"grp_{c}_{s}" for c, s in group_stats.columns]

      # Skewness par groupe
      for col in NUM_COLS:
          group_stats[f"grp_{col}_skew"] = (
              X.groupby(GROUP_COL)[col].apply(
                  lambda s: sp_stats.skew(s.dropna()) if len(s.dropna()) > 2 else 0))

      X = X.join(group_stats, on=GROUP_COL)

      feature_names = X.columns.tolist()
      print(f"Shape apres agregations : {X.shape}")
      print(f"Nouvelles features groupe : {list(group_stats.columns)[:10]}")

  - id: fe_text_meta
    name: "Feature Engineering — Meta-features Texte"
    enabled: true
    category: "Feature Engineering — NLP"
    description: >
      Longueur, comptage de ponctuation et chiffres, ratio majuscules,
      longueur moyenne des mots, polarite et subjectivite TextBlob,
      presence de mots-cles domaine-specifiques.
    applies_to: ["classification", "regression", "nlp"]
    when_to_use: >
      Pour enrichir un modele tabulaire avec des colonnes texte brut.
      Executer avant le split et avant la vectorisation NLP.
    pros:
      - "Features simples souvent tres discriminantes"
      - "Ne necessite pas de tokenizer avance"
    cons:
      - "TextBlob necessite une installation separee"
      - "Sensible a la langue — adapter les keywords"
    code_template: |
      import pandas as pd
      import numpy as np
      import re

      TEXT_COL  = "description"   # adapter
      KEYWORDS  = ["urgent", "gratuit", "promo", "officiel", "erreur"]

      def add_text_features(ds, col):
          ds = ds.copy()
          text = ds[col].astype(str)
          ds[f"{col}_len_char"]    = text.str.len()
          ds[f"{col}_len_words"]   = text.str.split().str.len()
          ds[f"{col}_n_sentences"] = text.str.count(r"[.!?]+")
          ds[f"{col}_n_caps"]      = text.str.count(r"[A-Z]")
          ds[f"{col}_n_digits"]    = text.str.count(r"\d")
          ds[f"{col}_n_punct"]     = text.str.count(r"[!?,;:]")
          ds[f"{col}_caps_ratio"]  = ds[f"{col}_n_caps"] / (ds[f"{col}_len_char"] + 1)
          ds[f"{col}_avg_wordlen"] = text.apply(
              lambda t: np.mean([len(w) for w in str(t).split()]) if str(t).strip() else 0)
          try:
              from textblob import TextBlob
              ds[f"{col}_polarity"]     = text.apply(
                  lambda t: TextBlob(str(t)).sentiment.polarity)
              ds[f"{col}_subjectivity"] = text.apply(
                  lambda t: TextBlob(str(t)).sentiment.subjectivity)
          except ImportError:
              pass
          for kw in KEYWORDS:
              ds[f"has_{kw}"] = text.str.lower().str.contains(
                  kw, regex=False, na=False).astype(int)
          ds.drop(columns=[col], inplace=True)
          return ds

      X = add_text_features(X, TEXT_COL)
      feature_names = X.columns.tolist()
      print(f"Shape apres FE texte : {X.shape}")

  - id: fe_geospatial
    name: "Feature Engineering — Geospatial"
    enabled: true
    category: "Feature Engineering — Geospatial"
    description: >
      Distance a des points de reference, codage polaire (angle + distance),
      extraction H3 (resolution 7), features de densite spatiale via KDE,
      clustering spatial DBSCAN comme feature.
    applies_to: ["geospatial", "classification", "regression"]
    when_to_use: >
      Quand X contient des colonnes latitude/longitude. Executer avant le split.
    pros:
      - "Distance aux POI souvent tres predictive"
      - "DBSCAN spatial detecte les clusters geographiques"
    cons:
      - "H3 necessite h3-py"
      - "KDE lent sur >100 000 points"
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.cluster import DBSCAN

      LAT_COL   = "latitude"
      LON_COL   = "longitude"
      REF_POINTS = {
          "centre_ville": (48.8566, 2.3522),
          "aeroport"    : (49.0097, 2.5479),
      }
      EARTH_R = 6371.0   # km

      def haversine(lat1, lon1, lat2, lon2):
          lat1, lon1, lat2, lon2 = map(np.radians, [lat1, lon1, lat2, lon2])
          dlat = lat2 - lat1
          dlon = lon2 - lon1
          a    = np.sin(dlat / 2)**2 + np.cos(lat1) * np.cos(lat2) * np.sin(dlon / 2)**2
          return 2 * EARTH_R * np.arcsin(np.sqrt(a))

      for name, (ref_lat, ref_lon) in REF_POINTS.items():
          X[f"dist_{name}_km"] = haversine(
              X[LAT_COL].values, X[LON_COL].values, ref_lat, ref_lon)

      # Codage polaire par rapport au premier point de reference
      first_lat, first_lon = list(REF_POINTS.values())[0]
      X["geo_angle"]   = np.arctan2(
          X[LAT_COL] - first_lat, X[LON_COL] - first_lon)
      X["geo_dist_0"]  = haversine(X[LAT_COL].values, X[LON_COL].values,
                                    first_lat, first_lon)

      # DBSCAN spatial (cluster comme feature categorielle)
      coords = np.radians(X[[LAT_COL, LON_COL]].values)
      db     = DBSCAN(eps=0.01, min_samples=5, algorithm="ball_tree",
                      metric="haversine")
      X["geo_cluster"] = db.fit_predict(coords)

      # H3 (optionnel)
      try:
          import h3
          H3_RESOLUTION = 7
          X["h3_cell"] = X.apply(
              lambda row: h3.geo_to_h3(row[LAT_COL], row[LON_COL], H3_RESOLUTION),
              axis=1)
      except ImportError:
          print("pip install h3-py pour les cellules H3")

      feature_names = X.columns.tolist()
      print(f"Shape apres FE geospatial : {X.shape}")

  - id: fe_graph_features
    name: "Feature Engineering — Features de Graphe"
    enabled: true
    category: "Feature Engineering — Graphe"
    description: >
      Extraction de features structurelles par noeud depuis le graphe NetworkX
      stocke dans meta : degre normalise, betweenness, PageRank, clustering,
      coreness, hub/authority HITS, 2nd voisinage.
    applies_to: ["graph", "node_classification", "knowledge_graph"]
    when_to_use: >
      Quand meta['graph_obj'] contient un graphe NetworkX (depuis les snippets
      networkx_graph ou synthetic_graph du Bloc 1).
    pros:
      - "Features structurelles souvent tres discriminantes pour la classification de noeuds"
      - "Coreness et HITS captent des structures non detectees par betweenness"
    cons:
      - "Betweenness O(VE) : lent sur grands graphes - utiliser k approximatif"
    code_template: |
      import networkx as nx
      import pandas as pd
      import numpy as np

      G = meta.get("graph_obj")
      if G is None:
          raise ValueError(
              "meta['graph_obj'] absent. "
              "Executer d'abord un snippet graphe du Bloc 1.")

      nodes = list(G.nodes())
      print(f"Graphe : {G.number_of_nodes()} noeuds | {G.number_of_edges()} aretes")

      degree_dict    = dict(G.degree())
      betweenness    = nx.betweenness_centrality(G, normalized=True, k=min(500, len(nodes)))
      closeness      = nx.closeness_centrality(G)
      clustering     = nx.clustering(G)
      pagerank       = nx.pagerank(G, alpha=0.85)
      coreness       = nx.core_number(G)

      rows = [{
          "node_id"          : n,
          "degree"           : degree_dict[n],
          "degree_norm"      : degree_dict[n] / max(len(nodes) - 1, 1),
          "betweenness"      : betweenness[n],
          "closeness"        : closeness[n],
          "clustering_coeff" : clustering[n],
          "pagerank"         : pagerank[n],
          "coreness"         : coreness[n],
      } for n in nodes]

      # HITS
      try:
          hubs, authorities = nx.hits(G, max_iter=100)
          for i, row in enumerate(rows):
              row["hub"]       = hubs[row["node_id"]]
              row["authority"] = authorities[row["node_id"]]
      except Exception:
          pass

      df_graph = pd.DataFrame(rows).set_index("node_id")

      # Fusionner avec X si meme index
      new_cols = df_graph.columns.tolist()
      for col in new_cols:
          if col not in X.columns:
              X[col] = df_graph[col]

      feature_names = X.columns.tolist()
      print(f"Shape apres FE graphe : {X.shape}")
      print(f"Nouvelles features : {new_cols}")

  - id: fe_target_encoding
    name: "Feature Engineering — Target Encoding"
    enabled: true
    category: "Feature Engineering — Encodage"
    description: >
      Remplace chaque modalite par la moyenne de la target lissee bayesiennement.
      Anti-leakage via K-Fold cross-encoding sur les donnees d'entrainement.
      Stocke les stats dans meta pour application coherente sur le test.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Cardinalite > 15 modalites. Tres efficace pour XGBoost/LightGBM/CatBoost.
      Executer apres le split (sur X_train uniquement pour eviter le leakage).
    pros:
      - "Lissage bayesien (alpha) protege contre le leakage sur modalites rares"
      - "K-Fold cross-encoding elimine le leakage intra-train"
    cons:
      - "Necessite y_train — executer apres split_standard"
      - "Sensible aux outliers de target sur petits groupes"
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.model_selection import KFold

      ALPHA    = 10   # lissage bayesien (plus grand = plus conservateur)
      N_SPLITS = 5

      cat_cols  = X_train.select_dtypes(include=["object", "category"]).columns.tolist()
      HIGH_CARD = [c for c in cat_cols if X_train[c].nunique() > 15]

      if not HIGH_CARD:
          print("Aucune colonne haute cardinalite detectee.")
      else:
          global_mean = float(np.mean(y_train))
          te_maps     = {}

          kf = KFold(n_splits=N_SPLITS, shuffle=True, random_state=42)

          for col in HIGH_CARD:
              X_train[col + "_te"] = global_mean
              for tr_idx, val_idx in kf.split(X_train):
                  Xk_tr  = X_train.iloc[tr_idx]
                  Xk_val = X_train.iloc[val_idx]
                  yk_tr  = pd.Series(y_train).iloc[tr_idx]
                  st = yk_tr.groupby(Xk_tr[col].values).agg(["mean", "count"])
                  st["smoothed"] = ((st["mean"] * st["count"] + global_mean * ALPHA)
                                    / (st["count"] + ALPHA))
                  X_train.loc[X_train.index[val_idx], col + "_te"] = (
                      Xk_val[col].map(st["smoothed"]).fillna(global_mean).values)

              # Stats finales sur tout X_train pour le test
              full_st = pd.Series(y_train).groupby(X_train[col].values).agg(["mean", "count"])
              full_st["smoothed"] = ((full_st["mean"] * full_st["count"] + global_mean * ALPHA)
                                     / (full_st["count"] + ALPHA))
              te_maps[col] = {"stats": full_st["smoothed"].to_dict(),
                              "global_mean": global_mean}
              X_test[col + "_te"] = (X_test[col].map(full_st["smoothed"])
                                     .fillna(global_mean))

          # Supprimer colonnes originales haute cardinalite
          X_train.drop(columns=HIGH_CARD, inplace=True)
          X_test.drop(columns=HIGH_CARD,  inplace=True)
          meta["target_encoding_maps"] = te_maps

          feature_names_out = X_train.columns.tolist()
          print(f"Shape apres target encoding : train={X_train.shape} | test={X_test.shape}")

  - id: fe_lag_rolling_ts
    name: "Feature Engineering — Lag et Rolling TS"
    enabled: true
    category: "Feature Engineering — Timeseries"
    description: >
      Creation de features de retard (lag) et de statistiques glissantes
      (rolling mean, std, min, max, quantiles) pour modeles ML classiques
      sur series temporelles (XGBoost, LightGBM, Random Forest).
    applies_to: ["timeseries"]
    when_to_use: >
      Pour XGBoost/LightGBM sur series temporelles apres split temporel.
      Alternative a ts_windowed (SEQUENCE) pour modeles non-DL.
    pros:
      - "Compatible avec tous les modeles sklearn/XGBoost"
      - "Split temporel strict preservé"
    cons:
      - "NaN dans les premieres lignes dus aux lags — a imputer apres"
    code_template: |
      import pandas as pd
      import numpy as np

      LAGS    = [1, 7, 14, 30]
      WINDOWS = [7, 14, 30]
      FREQ    = meta.get("freq", "D")

      series_all = pd.concat([y_train, y_test])

      def make_ts_features(series):
          df_feat = pd.DataFrame({"y": series})
          for lag in LAGS:
              df_feat[f"lag_{lag}"]      = series.shift(lag)
          for w in WINDOWS:
              df_feat[f"rmean_{w}"]  = series.shift(1).rolling(w).mean()
              df_feat[f"rstd_{w}"]   = series.shift(1).rolling(w).std()
              df_feat[f"rmin_{w}"]   = series.shift(1).rolling(w).min()
              df_feat[f"rmax_{w}"]   = series.shift(1).rolling(w).max()
              df_feat[f"rq25_{w}"]   = series.shift(1).rolling(w).quantile(0.25)
              df_feat[f"rq75_{w}"]   = series.shift(1).rolling(w).quantile(0.75)
          # Features temporelles
          idx = series.index
          if hasattr(idx, "dayofweek"):
              df_feat["dow_sin"]   = np.sin(2 * np.pi * idx.dayofweek / 7)
              df_feat["dow_cos"]   = np.cos(2 * np.pi * idx.dayofweek / 7)
          if hasattr(idx, "month"):
              df_feat["month_sin"] = np.sin(2 * np.pi * idx.month / 12)
              df_feat["month_cos"] = np.cos(2 * np.pi * idx.month / 12)
          if hasattr(idx, "dayofyear"):
              df_feat["doy_sin"]   = np.sin(2 * np.pi * idx.dayofyear / 365)
              df_feat["doy_cos"]   = np.cos(2 * np.pi * idx.dayofyear / 365)
          return df_feat

      df_feat = make_ts_features(series_all)
      n_train = len(y_train)
      df_tr   = df_feat.iloc[:n_train].dropna()
      df_te   = df_feat.iloc[n_train:].dropna()

      y_train = series_all.loc[df_tr.index]
      y_test  = series_all.loc[df_te.index]

      feat_cols = [c for c in df_feat.columns if c != "y"]
      X_train   = df_tr[feat_cols]
      X_test    = df_te[feat_cols]

      feature_names_out = feat_cols
      preprocessor = None   # pas de preprocessor ici — tree-based ne necessitent pas de scaling
      print(f"Features TS : {len(feat_cols)}")
      print(f"Shape : train={X_train.shape} | test={X_test.shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION E — FEATURE SELECTION
# Apres preprocessing. Met a jour X_train, X_test, feature_names_out.
# ══════════════════════════════════════════════════════════════════════════

feature_selection:

  - id: fs_mutual_information
    name: "Selection Filtre — Mutual Information"
    enabled: true
    category: "Feature Selection — Filtre"
    description: >
      SelectKBest par Mutual Information (classification ou regression).
      Mesure la dependance non-lineaire entre chaque feature et la target.
      Rapide et independant du modele.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Premier filtre rapide sur X_train preprocesse. K peut etre fixe
      ou determine par seuil sur la distribution des scores MI.
    pros:
      - "Non-parametrique : capture les relations non-lineaires"
      - "Tres rapide"
    cons:
      - "Ne capture pas les interactions entre features"
      - "Sensible au bruit sur petits datasets"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.feature_selection import mutual_info_classif, mutual_info_regression

      IS_CLASSIF = task_type == "classification"
      K          = 30   # nombre de features a conserver (adapter)

      mi_func = mutual_info_classif if IS_CLASSIF else mutual_info_regression
      mi_vals = mi_func(X_train, y_train, random_state=42)
      mi_series = pd.Series(mi_vals, index=feature_names_out).sort_values(ascending=False)

      print(f"Top 20 features (Mutual Information) :")
      print(mi_series.head(20).to_string())

      # Courbe des scores pour choisir K
      plt.figure(figsize=(12, 4))
      plt.plot(range(len(mi_series)), mi_series.values, marker="o", markersize=2)
      plt.axvline(K, color="red", linestyle="--", label=f"K={K}")
      plt.title("Scores Mutual Information par feature (rang decroissant)")
      plt.xlabel("Rang")
      plt.ylabel("Score MI")
      plt.legend()
      plt.tight_layout()
      plt.savefig("fs_mutual_information.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      selected_names = mi_series.head(K).index.tolist()
      selected_idx   = [list(feature_names_out).index(f) for f in selected_names]

      X_train = X_train[:, selected_idx] if hasattr(X_train, "__array__") \
                else X_train[selected_names]
      X_test  = X_test[:, selected_idx]  if hasattr(X_test,  "__array__") \
                else X_test[selected_names]
      feature_names_out = selected_names

      print(f"\nFeatures selectionnees : {len(feature_names_out)} / {len(mi_series)}")

  - id: fs_variance_threshold
    name: "Selection Filtre — Seuil de Variance"
    enabled: true
    category: "Feature Selection — Filtre"
    description: >
      Suppression des features quasi-constantes (variance < seuil) et des
      features quasi-identiques (correlation > seuil). Nettoyage rapide
      applicable en tout premier.
    applies_to: ["classification", "regression", "clustering"]
    when_to_use: >
      Toujours en premier avant tout autre filtre. Elimine les features
      informatiquement inutiles sans necessiter la target.
    pros:
      - "Pas besoin de la target"
      - "Tres rapide meme sur grands datasets"
    cons:
      - "Seuil de variance a calibrer selon l'echelle des features"
    code_template: |
      import numpy as np
      import pandas as pd
      from sklearn.feature_selection import VarianceThreshold

      VARIANCE_THRESHOLD    = 0.01
      CORRELATION_THRESHOLD = 0.95

      # VarianceThreshold
      selector = VarianceThreshold(threshold=VARIANCE_THRESHOLD)
      X_arr    = X_train if not hasattr(X_train, "toarray") else X_train.toarray()
      X_train_var = selector.fit_transform(X_arr)
      X_test_var  = selector.transform(X_test if not hasattr(X_test, "toarray")
                                       else X_test.toarray())

      kept_mask  = selector.get_support()
      kept_names = [f for f, k in zip(feature_names_out, kept_mask) if k]
      removed_var = [f for f, k in zip(feature_names_out, kept_mask) if not k]
      print(f"Supprimees (variance < {VARIANCE_THRESHOLD}) : {len(removed_var)}")
      print(f"  {removed_var[:10]}")

      # Suppression par correlation elevee (sur X_train_var)
      if len(kept_names) > 1:
          corr_mat = np.corrcoef(X_train_var.T)
          to_remove = set()
          for i in range(len(kept_names)):
              for j in range(i + 1, len(kept_names)):
                  if abs(corr_mat[i, j]) > CORRELATION_THRESHOLD and j not in to_remove:
                      to_remove.add(j)
          keep_idx = [i for i in range(len(kept_names)) if i not in to_remove]
          X_train = X_train_var[:, keep_idx]
          X_test  = X_test_var[:,  keep_idx]
          feature_names_out = [kept_names[i] for i in keep_idx]
          removed_corr = [kept_names[i] for i in to_remove]
          print(f"Supprimees (correlation > {CORRELATION_THRESHOLD}) : {len(removed_corr)}")
      else:
          X_train = X_train_var
          X_test  = X_test_var
          feature_names_out = kept_names

      print(f"\nFeatures restantes : {len(feature_names_out)}")

  - id: fs_rf_importance
    name: "Selection Embedded — Random Forest + SHAP"
    enabled: true
    category: "Feature Selection — Embedded"
    description: >
      Importance MDI (Mean Decrease Impurity) via Random Forest, permutation
      importance sur le test, SHAP values (TreeExplainer). Selection par seuil
      sur l'importance MDI.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Methode la plus fiable pour donnees tabulaires. Apres preprocessing.
      SHAP donne l'importance globale et les contributions individuelles.
    pros:
      - "SHAP est modelisation-agnostique et plus fiable que MDI"
      - "Permutation importance sur test evite le biais intra-train"
    cons:
      - "SHAP lent sur grands datasets (limiter a 500-1000 observations)"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor
      from sklearn.inspection import permutation_importance

      IS_CLASSIF = task_type == "classification"
      THRESHOLD  = 0.005

      rf = (RandomForestClassifier(n_estimators=200, max_depth=10,
                                   n_jobs=-1, random_state=42)
            if IS_CLASSIF else
            RandomForestRegressor(n_estimators=200, max_depth=10,
                                  n_jobs=-1, random_state=42))
      rf.fit(X_train, y_train)

      fi      = pd.Series(rf.feature_importances_,
                          index=feature_names_out).sort_values(ascending=False)
      perm    = permutation_importance(rf, X_test, y_test,
                                       n_repeats=10, random_state=42, n_jobs=-1)
      fi_perm = pd.Series(perm.importances_mean,
                          index=feature_names_out).sort_values(ascending=False)

      top_n = min(25, len(feature_names_out))
      fig, axes = plt.subplots(1, 2, figsize=(18, max(6, top_n * 0.4)))
      fi.head(top_n).sort_values().plot.barh(ax=axes[0], color="steelblue")
      axes[0].axvline(THRESHOLD, color="red", linestyle="--",
                      label=f"seuil {THRESHOLD}")
      axes[0].set_title("RF MDI Feature Importance")
      axes[0].legend()
      fi_perm.head(top_n).sort_values().plot.barh(ax=axes[1], color="tomato")
      axes[1].set_title("Permutation Importance (test)")
      plt.tight_layout()
      plt.savefig("fs_rf_importance.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      # SHAP
      try:
          import shap
          explainer   = shap.TreeExplainer(rf)
          n_shap      = min(500, len(X_train))
          X_shap      = X_train[:n_shap] if not isinstance(X_train, pd.DataFrame) \
                        else X_train.iloc[:n_shap]
          shap_values = explainer.shap_values(X_shap)
          if isinstance(shap_values, list):
              shap_values = shap_values[1]
          shap.summary_plot(shap_values, X_shap,
                            feature_names=feature_names_out,
                            plot_type="bar", show=True)
          plt.savefig("fs_shap.png", dpi=120, bbox_inches="tight")
      except ImportError:
          print("pip install shap")

      # Selection
      selected = fi[fi >= THRESHOLD].index.tolist()
      sel_idx  = [list(feature_names_out).index(f) for f in selected]
      X_train  = X_train[:, sel_idx] if not isinstance(X_train, pd.DataFrame) \
                 else X_train[selected]
      X_test   = X_test[:,  sel_idx] if not isinstance(X_test,  pd.DataFrame) \
                 else X_test[selected]
      feature_names_out = selected
      print(f"Features retenues : {len(feature_names_out)} / {len(fi)}")

  - id: fs_rfe_cv
    name: "Selection Wrapper — RFECV"
    enabled: true
    category: "Feature Selection — Wrapper"
    description: >
      Recursive Feature Elimination avec cross-validation.
      Identifie automatiquement le nombre optimal de features en
      maximisant le score de validation croisee.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Quand le nombre optimal de features est inconnu et que le temps
      de calcul le permet (< 200 features recommande). Preferer RFECV
      a RFE simple pour la selection automatique du K optimal.
    pros:
      - "Selectionne automatiquement le K optimal"
      - "Courbe score vs K features tres informative"
    cons:
      - "O(n_features^2 * n_splits * n_estimators) — lent sur datasets larges"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.feature_selection import RFECV
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor
      from sklearn.model_selection import StratifiedKFold, KFold

      IS_CLASSIF = task_type == "classification"

      estimator = (RandomForestClassifier(n_estimators=50, max_depth=6,
                                          n_jobs=-1, random_state=42)
                   if IS_CLASSIF else
                   RandomForestRegressor(n_estimators=50, max_depth=6,
                                         n_jobs=-1, random_state=42))

      cv = (StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
            if IS_CLASSIF else
            KFold(n_splits=5, shuffle=True, random_state=42))

      rfecv = RFECV(
          estimator=estimator,
          step=1,
          cv=cv,
          scoring="roc_auc" if IS_CLASSIF else "neg_root_mean_squared_error",
          min_features_to_select=5,
          n_jobs=-1,
      )
      rfecv.fit(X_train, y_train)

      # Courbe score vs nb features
      fig, ax = plt.subplots(figsize=(10, 5))
      scores = rfecv.cv_results_["mean_test_score"]
      stds   = rfecv.cv_results_["std_test_score"]
      ax.plot(range(1, len(scores) + 1), scores, marker="o", markersize=4)
      ax.fill_between(range(1, len(scores) + 1),
                      scores - stds, scores + stds, alpha=0.2)
      ax.axvline(rfecv.n_features_, color="red", linestyle="--",
                 label=f"Optimal : {rfecv.n_features_} features")
      ax.set_xlabel("Nombre de features")
      ax.set_ylabel("Score CV")
      ax.set_title("RFECV — Score vs Nombre de features")
      ax.legend()
      plt.tight_layout()
      plt.savefig("fs_rfecv.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      print(f"Nombre optimal de features : {rfecv.n_features_}")
      selected_mask  = rfecv.support_
      selected_names = [f for f, s in zip(feature_names_out, selected_mask) if s]
      X_train = rfecv.transform(X_train)
      X_test  = rfecv.transform(X_test)
      feature_names_out = selected_names
      print(f"Shape : train={X_train.shape} | test={X_test.shape}")

  - id: fs_boruta
    name: "Selection Wrapper — Boruta"
    enabled: true
    category: "Feature Selection — Wrapper"
    description: >
      Algorithme Boruta : compare l'importance de chaque feature a ses
      versions aleatoires (shadow features). Selectionne toutes les features
      statistiquement meilleures que le hasard (test binomial + Bonferroni).
    applies_to: ["classification", "regression"]
    when_to_use: >
      Alternative a RFECV, moins sensible au K. Utile quand on veut
      conserver toutes les features vraiment utiles sans fixer K a priori.
      Necessite boruta.
    pros:
      - "Selectionne toutes les features significatives (pas de K a fixer)"
      - "Test statistique rigoureux contre des features aleatoires"
    cons:
      - "pip install boruta"
      - "Lent sur grands datasets"
    code_template: |
      import numpy as np
      from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor

      IS_CLASSIF = task_type == "classification"

      try:
          from boruta import BorutaPy

          rf = (RandomForestClassifier(n_estimators=100, max_depth=7,
                                       n_jobs=-1, random_state=42)
                if IS_CLASSIF else
                RandomForestRegressor(n_estimators=100, max_depth=7,
                                      n_jobs=-1, random_state=42))

          boruta = BorutaPy(rf, n_estimators="auto", verbose=2, random_state=42,
                            max_iter=100, perc=100, alpha=0.05)
          boruta.fit(np.array(X_train), np.array(y_train))

          selected_mask  = boruta.support_
          tentative_mask = boruta.support_weak_

          selected_names  = [f for f, s in zip(feature_names_out, selected_mask)  if s]
          tentative_names = [f for f, s in zip(feature_names_out, tentative_mask) if s]

          print(f"Features confirmees  : {len(selected_names)}")
          print(f"Features tentatives  : {len(tentative_names)}")
          print(f"Features rejetees    : "
                f"{len(feature_names_out) - len(selected_names) - len(tentative_names)}")

          # Conserver confirmees + tentatives
          all_selected = list(dict.fromkeys(selected_names + tentative_names))
          sel_idx      = [list(feature_names_out).index(f) for f in all_selected]
          X_train = X_train[:, sel_idx] if not hasattr(X_train, "columns") \
                    else X_train[all_selected]
          X_test  = X_test[:,  sel_idx] if not hasattr(X_test,  "columns") \
                    else X_test[all_selected]
          feature_names_out = all_selected
          print(f"\nShape : train={X_train.shape} | test={X_test.shape}")
      except ImportError:
          print("pip install boruta")


# ══════════════════════════════════════════════════════════════════════════
# SECTION F — REDUCTION DIMENSIONNELLE
# Met a jour X_train, X_test, feature_names_out.
# ══════════════════════════════════════════════════════════════════════════

dimensionality_reduction:

  - id: dr_pca
    name: "Reduction Dimensionnelle — PCA"
    enabled: true
    category: "Reduction — Lineaire"
    description: >
      Analyse en Composantes Principales. Reduction lineaire par maximisation
      de la variance expliquee. Supporte la selection automatique du nombre
      de composantes par seuil de variance cumulee.
    applies_to: ["classification", "regression", "clustering", "anomaly"]
    when_to_use: >
      Features numeriques tres nombreuses et correlees (>100).
      Avant clustering ou apres preprocessing dans un pipeline.
      Ne convient pas si l'interpretabilite des features originales est necessaire.
    pros:
      - "Rapide et deterministe"
      - "Decoirelation complete des composantes"
    cons:
      - "Perd l'interpretabilite des features originales"
      - "Lineaire uniquement"
    code_template: |
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.decomposition import PCA

      N_COMPONENTS    = 0.95   # float [0,1] = variance a conserver
      int = nb composantes
      WHITEN          = False

      pca = PCA(n_components=N_COMPONENTS, whiten=WHITEN, random_state=42)
      X_train = pca.fit_transform(X_train)
      X_test  = pca.transform(X_test)

      n_comp = pca.n_components_
      feature_names_out = [f"PC{i+1}" for i in range(n_comp)]

      # Courbe variance expliquee
      cumvar = np.cumsum(pca.explained_variance_ratio_)
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      axes[0].bar(range(1, n_comp + 1), pca.explained_variance_ratio_,
                  color="steelblue", alpha=0.8)
      axes[0].set_title("Variance expliquee par composante")
      axes[0].set_xlabel("Composante")
      axes[1].plot(range(1, n_comp + 1), cumvar, marker="o", markersize=3)
      if isinstance(N_COMPONENTS, float):
          axes[1].axhline(N_COMPONENTS, color="red", linestyle="--",
                          label=f"Seuil {N_COMPONENTS*100:.0f}%")
      axes[1].set_title("Variance expliquee cumulee")
      axes[1].legend()
      plt.tight_layout()
      plt.savefig("dr_pca.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      print(f"PCA : {n_comp} composantes | variance conservee : {cumvar[-1]*100:.1f}%")
      print(f"Shape : train={X_train.shape} | test={X_test.shape}")

      meta["pca"] = pca

  - id: dr_umap
    name: "Reduction Dimensionnelle — UMAP"
    enabled: true
    category: "Reduction — Non-Lineaire"
    description: >
      Uniform Manifold Approximation and Projection. Reduction non-lineaire
      preservant la structure locale et globale. Utilise pour visualisation 2D
      ou comme preprocessing avant clustering.
    applies_to: ["classification", "clustering", "anomaly"]
    when_to_use: >
      Visualisation 2D ou reduction vers un espace compact (4-20 dimensions)
      avant clustering. Plus lent que PCA mais preserve mieux la structure.
      Necessite umap-learn.
    pros:
      - "Preserve la structure locale et les clusters"
      - "Supporte la reduction vers N dimensions (pas seulement 2)"
    cons:
      - "pip install umap-learn"
      - "Non deterministe (random_state fixe partiellement)"
      - "Lent sur >100 000 points"
    code_template: |
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      N_COMPONENTS = 2
      N_NEIGHBORS  = 15
      MIN_DIST     = 0.1
      METRIC       = "euclidean"

      try:
          import umap
          reducer = umap.UMAP(
              n_components=N_COMPONENTS,
              n_neighbors=N_NEIGHBORS,
              min_dist=MIN_DIST,
              metric=METRIC,
              random_state=42,
          )
          X_train = reducer.fit_transform(X_train)
          X_test  = reducer.transform(X_test)

          feature_names_out = [f"UMAP{i+1}" for i in range(N_COMPONENTS)]
          meta["umap_reducer"] = reducer

          if N_COMPONENTS == 2:
              plt.figure(figsize=(10, 8))
              if y_train is not None and task_type == "classification":
                  scatter = plt.scatter(X_train[:, 0], X_train[:, 1],
                                        c=y_train, cmap="tab10", alpha=0.5, s=5)
                  plt.colorbar(scatter)
              else:
                  plt.scatter(X_train[:, 0], X_train[:, 1],
                              alpha=0.3, s=5, color="steelblue")
              plt.title(f"UMAP 2D (n_neighbors={N_NEIGHBORS}, min_dist={MIN_DIST})")
              plt.tight_layout()
              plt.savefig("dr_umap.png", dpi=120, bbox_inches="tight")
              import warnings
              warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
              try:
                  from IPython.display import display
                  display(plt.gcf())
                  plt.close()
              except:
                  pass

          print(f"UMAP : {N_COMPONENTS} composantes")
          print(f"Shape : train={X_train.shape} | test={X_test.shape}")
      except ImportError:
          print("pip install umap-learn")

  - id: dr_kernel_pca
    name: "Reduction Dimensionnelle — Kernel PCA"
    enabled: true
    category: "Reduction — Non-Lineaire"
    description: >
      PCA dans un espace de Hilbert via noyaux (rbf, poly, sigmoid, cosine).
      Capture les structures non-lineaires que PCA lineaire rate.
    applies_to: ["classification", "clustering"]
    when_to_use: >
      Quand PCA est insuffisante et UMAP trop lent. Structures non-lineaires
      moderement complexes. Necessite le choix du noyau.
    pros:
      - "Capture les non-linearites via le kernel trick"
      - "Supporte plusieurs noyaux (rbf, poly, sigmoid)"
    cons:
      - "Complexite O(n^3) en memoire — lent sur n > 10 000"
      - "Choix du noyau et de gamma non trivial"
    code_template: |
      import numpy as np
      from sklearn.decomposition import KernelPCA

      N_COMPONENTS = 10
      KERNEL       = "rbf"   # "rbf" | "poly" | "sigmoid" | "cosine"
      GAMMA        = None    # None = 1/n_features
      float sinon

      kpca = KernelPCA(
          n_components=N_COMPONENTS,
          kernel=KERNEL,
          gamma=GAMMA,
          fit_inverse_transform=False,
          n_jobs=-1,
          random_state=42,
      )
      X_train = kpca.fit_transform(X_train)
      X_test  = kpca.transform(X_test)

      feature_names_out = [f"KPC{i+1}" for i in range(N_COMPONENTS)]
      meta["kernel_pca"] = kpca

      print(f"Kernel PCA ({KERNEL}) : {N_COMPONENTS} composantes")
      print(f"Shape : train={X_train.shape} | test={X_test.shape}")

  - id: dr_autoencoder
    name: "Reduction Dimensionnelle — Autoencodeur"
    enabled: true
    category: "Reduction — Deep Learning"
    description: >
      Autoencodeur dense (ou variationnel) pour reduction non-lineaire profonde.
      L'espace latent est utilise comme representation comprimee.
      Architecture configurable (couches, dropout, batch norm).
    applies_to: ["classification", "clustering", "anomaly"]
    when_to_use: >
      Tres grands datasets avec structures tres non-lineaires.
      Necessite PyTorch. Utile egalement pour la detection d'anomalies
      via l'erreur de reconstruction.
    pros:
      - "Capture les representations profondes non-lineaires"
      - "Erreur de reconstruction comme score d'anomalie"
    cons:
      - "Necessite PyTorch et GPU pour etre rapide"
      - "Hyperparametres nombreux a regler"
    code_template: |
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt

      LATENT_DIM   = 16
      HIDDEN_DIMS  = [256, 128, 64]   # couches de l'encodeur (decoder = inverse)
      EPOCHS       = 50
      BATCH_SIZE   = 256
      LR           = 1e-3
      DROPOUT      = 0.1

      try:
          import torch
          import torch.nn as nn
          from torch.utils.data import DataLoader, TensorDataset

          device = "cuda" if torch.cuda.is_available() else "cpu"
          n_feat = X_train.shape[1]

          # Architecture
          def build_layers(dims, dropout):
              layers = []
              for i in range(len(dims) - 1):
                  layers += [nn.Linear(dims[i], dims[i+1]),
                             nn.BatchNorm1d(dims[i+1]),
                             nn.ReLU(),
                             nn.Dropout(dropout)]
              return layers

          enc_dims = [n_feat] + HIDDEN_DIMS + [LATENT_DIM]
          dec_dims = [LATENT_DIM] + list(reversed(HIDDEN_DIMS)) + [n_feat]

          class Autoencoder(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.encoder = nn.Sequential(*build_layers(enc_dims, DROPOUT))
                  self.decoder = nn.Sequential(*build_layers(dec_dims, DROPOUT),
                                               nn.Linear(dec_dims[-1], n_feat))
              def forward(self, x):
                  z = self.encoder(x)
                  return self.decoder(z), z

          model     = Autoencoder().to(device)
          optimizer = torch.optim.Adam(model.parameters(), lr=LR)
          criterion = nn.MSELoss()

          X_t   = torch.from_numpy(np.array(X_train, dtype=np.float32)).to(device)
          ds    = TensorDataset(X_t)
          dl    = DataLoader(ds, batch_size=BATCH_SIZE, shuffle=True)
          losses = []

          model.train()
          for epoch in range(EPOCHS):
              epoch_loss = 0.0
              for (batch,) in dl:
                  optimizer.zero_grad()
                  recon, _ = model(batch)
                  loss = criterion(recon, batch)
                  loss.backward()
                  optimizer.step()
                  epoch_loss += loss.item() * len(batch)
              losses.append(epoch_loss / len(X_train))
              if (epoch + 1) % 10 == 0:
                  print(f"Epoch {epoch+1}/{EPOCHS} — loss={losses[-1]:.6f}")

          plt.figure(figsize=(8, 4))
          plt.plot(losses)
          plt.title("Courbe de perte (autoencodeur)")
          plt.xlabel("Epoch"); plt.ylabel("MSE")
          plt.tight_layout()
          plt.savefig("dr_autoencoder_loss.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

          # Extraction de la representation latente
          model.eval()
          with torch.no_grad():
              X_tr_t = torch.from_numpy(np.array(X_train, dtype=np.float32)).to(device)
              X_te_t = torch.from_numpy(np.array(X_test,  dtype=np.float32)).to(device)
              _, X_train_latent = model(X_tr_t)
              _, X_test_latent  = model(X_te_t)
              X_train = X_train_latent.cpu().numpy()
              X_test  = X_test_latent.cpu().numpy()

              # Score d'anomalie = erreur de reconstruction
              recon_tr, _ = model(X_tr_t)
              recon_errors = ((recon_tr - X_tr_t)**2).mean(dim=1).cpu().numpy()
              meta["autoencoder_recon_errors_train"] = recon_errors

          feature_names_out = [f"AE{i+1}" for i in range(LATENT_DIM)]
          meta["autoencoder"] = model

          print(f"Autoencodeur : {LATENT_DIM} dimensions latentes")
          print(f"Shape : train={X_train.shape} | test={X_test.shape}")
      except ImportError:
          print("PyTorch requis : pip install torch")

  - id: dr_nmf
    name: "Reduction Dimensionnelle — NMF"
    enabled: true
    category: "Reduction — Lineaire Contraint"
    description: >
      Non-negative Matrix Factorization. Factorisation en composantes additives
      non-negatives. Interpretable : chaque composante est une combinaison
      additive de features. Adapte aux donnees textuelles TF-IDF ou aux
      spectres positifs.
    applies_to: ["clustering", "nlp"]
    when_to_use: >
      Donnees non-negatives (TF-IDF, comptages, spectres, images normalisees).
      Quand l'interpretabilite des composantes est importante.
    pros:
      - "Composantes interpretables (somme de parties)"
      - "Adapte aux donnees sparses (TF-IDF)"
    cons:
      - "Necessite des donnees non-negatives"
      - "Non deterministe selon l'initialisation"
    code_template: |
      import numpy as np
      from sklearn.decomposition import NMF

      N_COMPONENTS = 20
      INIT         = "nndsvda"   # "random" | "nndsvda" | "nndsvd"
      MAX_ITER     = 500

      # S'assurer que les donnees sont non-negatives
      X_min = X_train.min() if not hasattr(X_train, "toarray") \
              else X_train.toarray().min()
      if X_min < 0:
          shift = abs(X_min) + 1e-8
          X_train = X_train + shift
          X_test  = X_test  + shift
          print(f"Decalage applique : +{shift:.4f} pour assurer la non-negativite")

      nmf = NMF(n_components=N_COMPONENTS, init=INIT, max_iter=MAX_ITER,
                random_state=42)
      X_train = nmf.fit_transform(X_train)
      X_test  = nmf.transform(X_test)

      feature_names_out = [f"NMF{i+1}" for i in range(N_COMPONENTS)]
      meta["nmf"] = nmf

      print(f"NMF : {N_COMPONENTS} composantes")
      print(f"Erreur reconstruction : {nmf.reconstruction_err_:.4f}")
      print(f"Shape : train={X_train.shape} | test={X_test.shape}")

  - id: dr_truncated_svd
    name: "Reduction Dimensionnelle — SVD Tronquee (LSA)"
    enabled: true
    category: "Reduction — Lineaire"
    description: >
      Singular Value Decomposition tronquee. Equivalent a PCA pour les matrices
      sparses. Standard pour la reduction TF-IDF (Latent Semantic Analysis).
      Fonctionne directement sur les matrices creuses scipy sans conversion dense.
    applies_to: ["nlp", "clustering"]
    when_to_use: >
      Apres vectorisation TF-IDF (matrice sparse). Alternativement a PCA
      quand la conversion dense n'est pas possible en memoire.
    pros:
      - "Fonctionne directement sur matrices sparses"
      - "Standard pour LSA (NLP)"
    cons:
      - "Lineaire uniquement"
      - "Composantes moins interpretables que NMF"
    code_template: |
      import numpy as np
      from sklearn.decomposition import TruncatedSVD
      from sklearn.preprocessing import Normalizer
      from sklearn.pipeline import make_pipeline

      N_COMPONENTS = 100
      N_ITER       = 7

      svd = TruncatedSVD(n_components=N_COMPONENTS, n_iter=N_ITER, random_state=42)
      normalizer = Normalizer(copy=False)
      lsa = make_pipeline(svd, normalizer)

      X_train = lsa.fit_transform(X_train)
      X_test  = lsa.transform(X_test)

      feature_names_out = [f"SVD{i+1}" for i in range(N_COMPONENTS)]
      meta["lsa_pipeline"] = lsa

      explained_var = svd.explained_variance_ratio_.sum()
      print(f"SVD tronquee : {N_COMPONENTS} composantes")
      print(f"Variance expliquee : {explained_var*100:.1f}%")
      print(f"Shape : train={X_train.shape} | test={X_test.shape}")


