#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y_train</text>    <path d="M 370 148 C 400 148, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y_test</text>    <path d="M 370 148 C 400 148, 420 194, 440 194" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="180" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="198" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names_out</text></g></svg>'
    code_template: |
      import pandas as pd
      import numpy as np
      from sklearn.model_selection import train_test_split, StratifiedKFold, cross_val_score
      from sklearn.pipeline import Pipeline
      from sklearn.compose import ColumnTransformer
      from sklearn.impute import SimpleImputer
      from sklearn.preprocessing import StandardScaler, OneHotEncoder, LabelEncoder
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.metrics import classification_report, ConfusionMatrixDisplay
      import matplotlib.pyplot as plt

      TARGET_COL = "target"

      # ── 1. Séparation features / target ──────────────────────────────
      X = df.drop(columns=[TARGET_COL])
      y = df[TARGET_COL]

      # Encodage de la target si catégorielle
      if y.dtype == object:
          le = LabelEncoder()
          y  = pd.Series(le.fit_transform(y), index=y.index, name=TARGET_COL)

      # ── 2. Identification des types de colonnes ───────────────────────
      num_cols  = X.select_dtypes(include="number").columns.tolist()
      cat_cols  = X.select_dtypes(include=["object", "category"]).columns.tolist()
      bool_cols = X.select_dtypes(include="bool").columns.tolist()
      # Convertir bool en int
      X[bool_cols] = X[bool_cols].astype(int)
      num_cols += bool_cols

      # ── 3. Split stratifié ────────────────────────────────────────────
      X_train, X_test, y_train, y_test = train_test_split(
          X, y, test_size=0.2, stratify=y, random_state=42
      )
      print(f"Train : {X_train.shape} | Test : {X_test.shape}")

      # ── 4. Preprocessor ───────────────────────────────────────────────
      num_pipeline = Pipeline([
          ("imputer", SimpleImputer(strategy="median")),
          ("scaler",  StandardScaler()),
      ])
      cat_pipeline = Pipeline([
          ("imputer", SimpleImputer(strategy="most_frequent")),
          ("encoder", OneHotEncoder(handle_unknown="ignore", sparse_output=False, drop="first")),
      ])
      preprocessor = ColumnTransformer([
          ("num", num_pipeline, num_cols),
          ("cat", cat_pipeline, cat_cols),
      ], remainder="drop", verbose_feature_names_out=True)

      # ── 5. Pipeline complet ───────────────────────────────────────────
      full_pipeline = Pipeline([
          ("preprocessor", preprocessor),
          ("classifier",   RandomForestClassifier(n_estimators=200, class_weight="balanced",
                                                   n_jobs=-1, random_state=42)),
      ])

      # ── 6. Cross-validation ───────────────────────────────────────────
      cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
      cv_scores = cross_val_score(full_pipeline, X_train, y_train,
                                  cv=cv, scoring="f1_weighted", n_jobs=-1)
      print(f"CV F1 : {cv_scores.mean():.4f} ± {cv_scores.std():.4f}")

      # ── 7. Entraînement final + évaluation ────────────────────────────
      full_pipeline.fit(X_train, y_train)
      y_pred = full_pipeline.predict(X_test)
      print(classification_report(y_test, y_pred))

      ConfusionMatrixDisplay.from_predictions(y_test, y_pred)
      plt.show()

      # ── 8. Export des variables standards pour catalog_models ─────────
      preprocessor_fitted = full_pipeline.named_steps["preprocessor"]
      X_train_prep = preprocessor_fitted.transform(X_train)
      X_test_prep  = preprocessor_fitted.transform(X_test)

      ohe_feats = (preprocessor_fitted.named_transformers_["cat"]["encoder"]
                                      .get_feature_names_out(cat_cols).tolist())
      feature_names_out = num_cols + ohe_feats

