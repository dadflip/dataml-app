# ══════════════════════════════════════════════════════════════════════════
# EDA_CONFIG.YAML — Bloc 2 : Analyse Exploratoire & Feature Engineering
# ══════════════════════════════════════════════════════════════════════════
#
#  CONTRAT D'ENTREE (depuis Bloc 1 - datasets_config.yaml) :
#
#   CONTRACT_TABULAR  → df, X, y, feature_names, target_name, task_type, meta
#                       + texts_train/texts_test  (nlp)
#                       + y_train/y_test/dates_train/dates_future (timeseries)
#                       + durations/events/df_survival (survival)
#
#   CONTRACT_VISION   → images_train, images_test, labels_train, labels_test
#                       class_names, img_shape, n_classes, dl_train, dl_test
#
#   CONTRACT_SEQUENCE → sequences_train, sequences_test, labels_train, labels_test
#                       seq_lengths, n_features, n_classes, dl_train, dl_test
#                       + vocab/tokenizer (nlp), sr (audio), seq_dates/horizon (ts)
#
#  CONTRAT DE SORTIE (vers Bloc 3 - model_config.yaml) :
#
#   Commun a tous les contrats :
#     X_train, X_test, y_train, y_test
#     feature_names_out  list[str]
#     task_type          str (confirme / inchange)
#     meta               dict (enrichi)
#
#   Tabular specifique :
#     preprocessor       sklearn Pipeline/ColumnTransformer | None
#     dates_train        pd.DatetimeIndex | None
#     dates_future       pd.DatetimeIndex | None
#     texts_train        list[str]
#     texts_test         list[str]
#
#   Vision specifique :
#     images_train, images_test  np.ndarray (N,H,W,C)
#     labels_train, labels_test  np.ndarray
#     dl_train, dl_test          DataLoader | None
#     img_shape, n_classes, class_names
#
#   Sequence specifique :
#     sequences_train, sequences_test  np.ndarray (N,T,F)
#     labels_train, labels_test
#     seq_lengths, n_features, n_classes
#     dl_train, dl_test
#
#  PERIMETRE DE CE BLOC :
#    1. EDA (visualisations et diagnostics - ne modifient pas les variables)
#    2. Feature Engineering (creation de features, transformations)
#    3. Feature Selection (filtres, embedded, wrapper)
#    4. Reduction Dimensionnelle (PCA, UMAP, autoencodeurs)
#    5. Transformations speciales (representations, encodages avances)
#
#  HORS PERIMETRE (autres blocs) :
#    - Split train/test             -> Bloc 3 (model_config)
#    - Imputation / Scaling         -> Bloc 3 (preprocessing dans le pipeline modele)
#    - Encodage categoriel de base  -> Bloc 3
#    - Gestion desequilibre classes -> Bloc 3
#    - Evaluation / metriques       -> Bloc 4 (evaluation_config)
#
#  REGLE D'OR : ne jamais renommer les variables du contrat entre les blocs.
#  Seuls les parametres en MAJUSCULES sont a adapter.
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
# CONTRAT I/O
# ──────────────────────────────────────────────────────────────────────────

pipeline_contract:
  bloc: 2
  role: "EDA · Feature Engineering · Feature Selection · Reduction Dimensionnelle"

  input_variables:
    # Tabular (depuis Bloc 1 contract_tabular)
    df:               "pd.DataFrame | None"
    X:                "pd.DataFrame | None"
    y:                "pd.Series | None"
    feature_names:    "list[str]"
    target_name:      "str | None"
    task_type:        "str"
    meta:             "dict"
    texts_train:      "list[str]"
    texts_test:       "list[str]"
    y_train:          "pd.Series | None"
    y_test:           "pd.Series | None"
    dates_train:      "pd.DatetimeIndex | None"
    dates_future:     "pd.DatetimeIndex | None"
    durations:        "pd.Series | None"
    events:           "pd.Series | None"
    df_survival:      "pd.DataFrame | None"
    # Vision (depuis Bloc 1 contract_vision)
    images_train:     "np.ndarray | None"
    images_test:      "np.ndarray | None"
    labels_train:     "np.ndarray | None"
    labels_test:      "np.ndarray | None"
    class_names:      "list[str] | None"
    img_shape:        "tuple | None"
    n_classes:        "int | None"
    dl_train:         "DataLoader | None"
    dl_test:          "DataLoader | None"
    # Sequence (depuis Bloc 1 contract_sequence)
    sequences_train:  "np.ndarray | None"
    sequences_test:   "np.ndarray | None"
    seq_lengths:      "np.ndarray | None"
    n_features:       "int | None"
    vocab:            "dict | None"
    tokenizer:        "callable | None"
    sr:               "int | None"
    seq_dates:        "pd.DatetimeIndex | None"
    horizon:          "int | None"

  output_variables:
    # Toujours produits
    X_train:           "np.ndarray | pd.DataFrame | None"
    X_test:            "np.ndarray | pd.DataFrame | None"
    y_train:           "pd.Series | np.ndarray | None"
    y_test:            "pd.Series | np.ndarray | None"
    feature_names_out: "list[str]"
    task_type:         "str"
    meta:              "dict"
    # Tabular pass-through
    preprocessor:      "sklearn Pipeline | ColumnTransformer | None"
    dates_train:       "pd.DatetimeIndex | None"
    dates_future:      "pd.DatetimeIndex | None"
    texts_train:       "list[str]"
    texts_test:        "list[str]"
    # Vision pass-through ou transforme
    images_train:      "np.ndarray | None"
    images_test:       "np.ndarray | None"
    labels_train:      "np.ndarray | None"
    labels_test:       "np.ndarray | None"
    img_shape:         "tuple | None"
    n_classes:         "int | None"
    class_names:       "list[str] | None"
    dl_train:          "DataLoader | None"
    dl_test:           "DataLoader | None"
    # Sequence pass-through ou transforme
    sequences_train:   "np.ndarray | None"
    sequences_test:    "np.ndarray | None"
    seq_lengths:       "np.ndarray | None"
    n_features:        "int | None"


# ══════════════════════════════════════════════════════════════════════════
# SECTION A — EDA TABULAR
# S'executent sur df entier ou sur X/y. Ne modifient PAS les variables
# du contrat. Produisent uniquement des visualisations et diagnostics.
# ══════════════════════════════════════════════════════════════════════════

eda_tabular:

  - id: eda_overview
    name: "Vue d'Ensemble du Dataset"
    enabled: true
    category: "EDA — Structure"
    description: >
      Shape, types, memoire, valeurs manquantes, cardinalites, doublons.
      Premier diagnostic global avant tout traitement.
    applies_to: ["classification", "regression", "clustering", "timeseries",
                 "nlp", "anomaly", "survival", "graph", "geospatial"]
    when_to_use: "Toujours en premier sur tout dataset tabulaire."
    pros:
      - "Diagnostic complet en un seul appel"
      - "Detecte immediatement les problemes structurels"
      - "Aucune modification des donnees"
    cons:
      - "Lent sur dataframes de plusieurs millions de lignes"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns

      print("=" * 70)
      print(f"SHAPE        : {df.shape[0]:,} lignes x {df.shape[1]} colonnes")
      print(f"MEMOIRE      : {df.memory_usage(deep=True).sum() / 1024**2:.1f} MB")
      print(f"DOUBLONS     : {df.duplicated().sum():,} ({df.duplicated().mean()*100:.2f}%)")
      print(f"TASK TYPE    : {task_type}")
      print(f"CONTRACT     : {meta.get('contract', 'tabular')}")

      summary = pd.DataFrame({
          "dtype"      : df.dtypes,
          "n_unique"   : df.nunique(),
          "n_missing"  : df.isnull().sum(),
          "pct_missing": (df.isnull().mean() * 100).round(2),
          "sample_val" : [df[c].dropna().iloc[0] if df[c].notna().any() else None
                          for c in df.columns],
      })
      print("\n-- Resume colonnes --")
      print(summary.to_string())

      num_cols  = df.select_dtypes(include="number").columns.tolist()
      cat_cols  = df.select_dtypes(include=["object", "category"]).columns.tolist()
      date_cols = df.select_dtypes(include="datetime").columns.tolist()
      bool_cols = df.select_dtypes(include="bool").columns.tolist()

      print(f"\nNumeriques    ({len(num_cols)}) : {num_cols[:10]}")
      print(f"Categorielles ({len(cat_cols)}) : {cat_cols[:10]}")
      print(f"Dates         ({len(date_cols)}) : {date_cols}")

      if num_cols:
          print("\n-- Stats numeriques --")
          print(df[num_cols].describe(
              percentiles=[.01, .05, .25, .5, .75, .95, .99]).T.to_string())

      miss_cols = [c for c in df.columns if df[c].isnull().any()]
      if miss_cols:
          fig, axes = plt.subplots(1, 2, figsize=(max(10, len(miss_cols)), 5))
          sns.heatmap(df[miss_cols].isnull().T, cbar=False, cmap="viridis",
                      yticklabels=True, xticklabels=False, ax=axes[0])
          axes[0].set_title("Heatmap valeurs manquantes")
          miss_pct = df[miss_cols].isnull().mean().sort_values(ascending=False)
          miss_pct.plot.barh(ax=axes[1], color="tomato")
          axes[1].axvline(0.6, color="red", linestyle="--", label="seuil 60%")
          axes[1].legend()
          axes[1].set_title("Taux de NaN par colonne")
          plt.tight_layout()
          plt.savefig("eda_overview_missing.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass
          print("Figure sauvegardee : eda_overview_missing.png")

      # Variables contrat inchangees
      # X, y, feature_names, target_name, task_type, meta : pass-through

  - id: eda_distributions
    name: "Distributions et Outliers"
    enabled: true
    category: "EDA — Univarie"
    description: >
      Histogrammes, KDE, boxplots, violin plots, ECDF, tests de normalite
      Shapiro-Wilk et Kolmogorov-Smirnov, detection outliers IQR et Z-score.
    applies_to: ["classification", "regression", "clustering", "anomaly"]
    when_to_use: "Comprendre la distribution de chaque feature avant toute transformation."
    pros:
      - "Revele la forme des distributions et les outliers"
      - "Tests de normalite automatiques"
      - "Rapport outliers structure par colonne"
    cons:
      - "Graphiques nombreux sur datasets larges (>50 features)"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy import stats

      TARGET_COL = target_name
      num_cols   = df.select_dtypes(include="number").columns.tolist()
      feats      = [c for c in num_cols if c != TARGET_COL]

      n_cols = 4
      n_rows = max(1, int(np.ceil(len(feats) / n_cols)))

      fig, axes = plt.subplots(n_rows, n_cols, figsize=(5 * n_cols, 3 * n_rows))
      axes = np.array(axes).flatten()
      for i, col in enumerate(feats):
          s = df[col].dropna()
          axes[i].hist(s, bins=40, alpha=0.6, color="steelblue", density=True)
          try:
              kde = stats.gaussian_kde(s)
              xs  = np.linspace(s.min(), s.max(), 200)
              axes[i].plot(xs, kde(xs), color="navy", linewidth=1.5)
          except Exception:
              pass
          axes[i].axvline(s.mean(),   color="red",   linestyle="--", linewidth=1)
          axes[i].axvline(s.median(), color="green", linestyle="--", linewidth=1)
          sk = stats.skew(s)
          axes[i].set_title(f"{col}\nskew={sk:.2f}", fontsize=8)
      for j in range(i + 1, len(axes)):
          axes[j].set_visible(False)
      plt.suptitle("Distributions (histogramme + KDE)")
      plt.tight_layout()
      plt.savefig("eda_distributions.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      # Tableau d'outliers
      outlier_report = {}
      for col in feats:
          s      = df[col].dropna()
          Q1, Q3 = s.quantile(0.25), s.quantile(0.75)
          IQR    = Q3 - Q1
          n_iqr  = ((s < Q1 - 1.5 * IQR) | (s > Q3 + 1.5 * IQR)).sum()
          z      = np.abs(stats.zscore(s))
          n_z3   = (z > 3).sum()
          sk     = stats.skew(s)
          sample = s.sample(min(len(s), 5000), random_state=42)
          _, p_sw = stats.shapiro(sample)
          _, p_ks = stats.kstest((s - s.mean()) / s.std(), "norm")
          outlier_report[col] = {
              "IQR_outliers" : n_iqr,
              "Z3_outliers"  : n_z3,
              "skewness"     : round(sk, 3),
              "shapiro_p"    : round(p_sw, 4),
              "ks_p"         : round(p_ks, 4),
              "normal_sw"    : p_sw > 0.05,
              "normal_ks"    : p_ks > 0.05,
          }
      print(pd.DataFrame(outlier_report).T.to_string())

  - id: eda_target
    name: "Analyse de la Target"
    enabled: true
    category: "EDA — Target"
    description: >
      Distribution de la target, desequilibre de classes (classification),
      outliers et transformations pour regression, rapport complet.
    applies_to: ["classification", "regression"]
    when_to_use: "Comprendre la cible avant tout modelisation."
    pros:
      - "Detecte immediatement le desequilibre de classes"
      - "Revele le besoin de transformation (log, Box-Cox) pour la regression"
    cons:
      - "Necessite target_name defini"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy import stats

      TARGET_COL = target_name
      y_plot     = df[TARGET_COL].dropna()
      IS_CLASSIF = task_type == "classification"

      if IS_CLASSIF:
          counts = y_plot.value_counts()
          pcts   = y_plot.value_counts(normalize=True) * 100
          ratio  = counts.max() / max(counts.min(), 1)

          print("Distribution des classes :")
          for cls, cnt in counts.items():
              print(f"  {str(cls):>20} : {cnt:>8,}  ({pcts[cls]:.2f}%)")
          print(f"\nRatio desequilibre (max/min) : {ratio:.1f}x")
          if ratio > 5:
              print("Desequilibre severe -> envisager SMOTE, class_weight ou seuil ajuste")

          fig, axes = plt.subplots(1, 3, figsize=(16, 5))
          counts.plot.bar(ax=axes[0], color=sns.color_palette("tab10", len(counts)))
          axes[0].set_title("Comptage par classe")

          counts.plot.pie(ax=axes[1], autopct="%1.1f%%", startangle=90,
                          colors=sns.color_palette("tab10", len(counts)))
          axes[1].set_title("Repartition (%)")
          axes[1].set_ylabel("")

          pcts.plot.barh(ax=axes[2], color="steelblue")
          axes[2].axvline(100 / len(counts), color="red", linestyle="--",
                          label="equilibre parfait")
          axes[2].set_title("% par classe")
          axes[2].legend()
          plt.suptitle(f"Distribution target : {TARGET_COL}")
          plt.tight_layout()
          plt.savefig("eda_target.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass
      else:
          fig, axes = plt.subplots(2, 3, figsize=(18, 10))
          y_plot.hist(bins=60, ax=axes[0, 0], color="steelblue", alpha=0.8, edgecolor="white")
          axes[0, 0].axvline(y_plot.mean(),   color="red",   linestyle="--", label="mean")
          axes[0, 0].axvline(y_plot.median(), color="green", linestyle="--", label="median")
          axes[0, 0].set_title("Distribution de la target")
          axes[0, 0].legend()

          stats.probplot(y_plot, dist="norm", plot=axes[0, 1])
          axes[0, 1].set_title("Q-Q Plot (normalite)")

          np.log1p(y_plot.clip(lower=0)).hist(bins=60, ax=axes[0, 2],
                                               color="tomato", alpha=0.8)
          axes[0, 2].set_title("Distribution log1p(target)")

          axes[1, 0].boxplot(y_plot.values, vert=False, patch_artist=True,
                              boxprops=dict(facecolor="lightblue"))
          axes[1, 0].set_title("Boxplot")

          s = y_plot.sort_values()
          axes[1, 1].plot(s.values, np.arange(1, len(s) + 1) / len(s), color="navy")
          axes[1, 1].set_title("ECDF")

          axes[1, 2].violinplot(y_plot.values, showmedians=True)
          axes[1, 2].set_title("Violin plot")

          plt.suptitle(f"Analyse target : {TARGET_COL}")
          plt.tight_layout()
          plt.savefig("eda_target.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

          print(f"Skewness : {stats.skew(y_plot):.3f}")
          print(f"Kurtosis : {stats.kurtosis(y_plot):.3f}")
          print(y_plot.describe(percentiles=[.01, .05, .25, .5, .75, .95, .99]))

          # Test Box-Cox optimal
          if y_plot.min() > 0:
              _, lam = stats.boxcox(y_plot)
              print(f"Lambda Box-Cox optimal : {lam:.4f}")
              if abs(lam) < 0.1:
                  print("  -> transformation log recommandee (lambda ~ 0)")
              elif abs(lam - 0.5) < 0.1:
                  print("  -> transformation sqrt recommandee (lambda ~ 0.5)")

  - id: eda_correlations
    name: "Correlations et Relations"
    enabled: true
    category: "EDA — Multivariate"
    description: >
      Heatmap Pearson et Spearman, heatmap clusterisee (Ward), correlation
      avec la target, pairplot, detection multicolinearite, VIF.
    applies_to: ["classification", "regression", "clustering"]
    when_to_use: "Avant feature selection pour detecter redondance et features predictives."
    pros:
      - "Detecte la multicolinearite via VIF"
      - "Heatmap clusterisee revele les groupes de features liees"
      - "Corrélation target guide la selection"
    cons:
      - "Pearson suppose linearite - completer avec Spearman ou MI"
      - "VIF lent sur >100 features"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy.stats import spearmanr

      TARGET_COL = target_name
      num_cols   = df.select_dtypes(include="number").columns.tolist()
      feats      = [c for c in num_cols if c != TARGET_COL]

      # Heatmap Pearson / Spearman cote a cote
      corr_p = df[num_cols].corr(method="pearson")
      corr_s = df[num_cols].corr(method="spearman")
      mask   = np.triu(np.ones_like(corr_p, dtype=bool))
      size   = max(8, min(20, len(num_cols)))
      fig, axes = plt.subplots(1, 2, figsize=(size * 2, size))
      sns.heatmap(corr_p, mask=mask, cmap="RdBu_r", center=0, vmin=-1, vmax=1,
                  annot=len(num_cols) <= 15, fmt=".2f", linewidths=0.5, ax=axes[0])
      axes[0].set_title("Correlation de Pearson")
      sns.heatmap(corr_s, mask=mask, cmap="RdBu_r", center=0, vmin=-1, vmax=1,
                  annot=len(num_cols) <= 15, fmt=".2f", linewidths=0.5, ax=axes[1])
      axes[1].set_title("Correlation de Spearman")
      plt.tight_layout()
      plt.savefig("eda_correlations.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      # Heatmap clusterisee
      if len(feats) > 1:
          g = sns.clustermap(df[feats].corr().fillna(0), cmap="RdBu_r", center=0,
                             figsize=(size, size), method="ward",
                             annot=len(feats) <= 15, fmt=".2f")
          g.fig.suptitle("Heatmap clusterisee (Ward)", y=1.02)
          g.fig.savefig("eda_clustermap.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

      # Correlation avec la target
      if TARGET_COL and TARGET_COL in df.columns and len(feats) > 0:
          target_corr_p = (df[num_cols].corr()[TARGET_COL]
                           .drop(TARGET_COL, errors="ignore").abs()
                           .sort_values(ascending=True))
          fig, ax = plt.subplots(figsize=(10, max(4, len(feats) * 0.35)))
          target_corr_p.plot.barh(ax=ax, color="steelblue")
          ax.axvline(0.1, color="red", linestyle="--", label="seuil 0.1")
          ax.set_title(f"|Pearson| avec {TARGET_COL}")
          ax.legend()
          plt.tight_layout()
          plt.savefig("eda_target_correlation.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

      # Paires fortement correlees
      corr_abs = corr_p.abs()
      np.fill_diagonal(corr_abs.values, 0)
      high_corr = [(i, j, corr_abs.loc[i, j])
                   for i in corr_abs.index for j in corr_abs.columns
                   if corr_abs.loc[i, j] > 0.85
                   and list(corr_abs.index).index(i)
                   < list(corr_abs.columns).index(j)]
      high_corr.sort(key=lambda x: -x[2])
      if high_corr:
          print(f"\nPaires fortement correlees (>0.85) : {len(high_corr)}")
          for fi, fj, v in high_corr[:10]:
              print(f"  {fi} <-> {fj} : {v:.3f}")

      # VIF
      try:
          from statsmodels.stats.outliers_influence import variance_inflation_factor
          X_num = df[feats].dropna()
          if X_num.shape[0] > X_num.shape[1] and len(feats) > 1:
              vif_data = pd.DataFrame({
                  "feature": feats,
                  "VIF": [variance_inflation_factor(X_num.values, i)
                          for i in range(len(feats))],
              }).sort_values("VIF", ascending=False)
              print("\nVIF (>10 = multicolinearite problematique) :")
              print(vif_data.head(20).to_string(index=False))
      except ImportError:
          print("pip install statsmodels pour le VIF")

  - id: eda_missing_analysis
    name: "Analyse des Valeurs Manquantes"
    enabled: true
    category: "EDA — Valeurs Manquantes"
    description: >
      Heatmap NaN, patterns co-occurrence, correlation entre NaN,
      test Little MCAR, recommandations de strategie d'imputation.
    applies_to: ["classification", "regression", "clustering", "anomaly", "survival"]
    when_to_use: "Avant toute imputation. Revele si les NaN sont aleatoires (MCAR) ou structurels (MNAR)."
    pros:
      - "Distingue MCAR / MAR / MNAR visuellement"
      - "Matrice de co-occurrence oriente la strategie d'imputation"
    cons:
      - "Test Little MCAR necessite statsmodels"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns

      miss = pd.DataFrame({
          "n_missing"  : df.isnull().sum(),
          "pct_missing": df.isnull().mean() * 100,
      }).sort_values("pct_missing", ascending=False)
      miss = miss[miss["n_missing"] > 0]

      print(f"Colonnes avec NaN : {len(miss)} / {df.shape[1]}")
      print(miss.to_string())

      if miss.empty:
          print("Aucune valeur manquante.")
      else:
          cols_na = miss.index.tolist()

          fig, axes = plt.subplots(1, 2, figsize=(max(10, len(cols_na)), 5))
          sns.heatmap(df[cols_na].isnull().T, cbar=False, cmap="viridis",
                      yticklabels=True, xticklabels=False, ax=axes[0])
          axes[0].set_title("Heatmap NaN")

          if len(cols_na) > 1:
              na_corr = df[cols_na].isnull().corr()
              sns.heatmap(na_corr, annot=True, fmt=".2f", cmap="coolwarm",
                          center=0, ax=axes[1])
              axes[1].set_title("Correlation patterns NaN")
          plt.tight_layout()
          plt.savefig("eda_missing.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

          # Co-occurrence NaN
          if len(cols_na) > 1:
              na_matrix = df[cols_na].isnull().astype(int)
              cooccurrence = na_matrix.T.dot(na_matrix)
              plt.figure(figsize=(max(6, len(cols_na)), max(6, len(cols_na))))
              sns.heatmap(cooccurrence, annot=True, fmt="d", cmap="Blues")
              plt.title("Co-occurrence NaN")
              plt.tight_layout()
              plt.savefig("eda_missing_cooccurrence.png", dpi=120, bbox_inches="tight")
              import warnings
              warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
              try:
                  from IPython.display import display
                  display(plt.gcf())
                  plt.close()
              except:
                  pass

          # Recommandations
          HIGH_NA_THRESHOLD = 60
          print("\nRecommandations :")
          for col, row in miss.iterrows():
              p = row["pct_missing"]
              if p > 60:
                  print(f"  {col} ({p:.1f}%) -> suppression recommandee")
              elif p > 20:
                  print(f"  {col} ({p:.1f}%) -> imputation KNN/MICE ou flag binaire")
              else:
                  print(f"  {col} ({p:.1f}%) -> imputation mediane/mode")

  - id: eda_bivariate_target
    name: "Relations Bivariees Features x Target"
    enabled: true
    category: "EDA — Bivariate"
    description: >
      Scatter plots avec tendance, boxplots et violin plots par classe,
      strip plots, ANOVA F-test, test chi2 pour categoriel x target.
    applies_to: ["classification", "regression"]
    when_to_use: "Visualiser l'impact de chaque feature sur la cible. Avant feature engineering."
    pros:
      - "ANOVA F-test chiffre la discriminance de chaque feature"
      - "Detecte les features inutiles visuellement"
    cons:
      - "Nombreux graphiques sur datasets larges"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns
      from scipy.stats import f_oneway, chi2_contingency

      TARGET_COL = target_name
      num_cols   = [c for c in df.select_dtypes(include="number").columns
                    if c != TARGET_COL]
      cat_cols   = df.select_dtypes(include=["object", "category"]).columns.tolist()
      IS_CLASSIF = task_type == "classification"

      if IS_CLASSIF:
          n_cols = 3
          n_rows = max(1, int(np.ceil(len(num_cols) / n_cols)))
          fig, axes = plt.subplots(n_rows, n_cols, figsize=(6 * n_cols, 4 * n_rows))
          axes = np.array(axes).flatten()
          for i, col in enumerate(num_cols):
              sns.boxplot(data=df, x=TARGET_COL, y=col, ax=axes[i], palette="tab10")
              axes[i].set_title(col, fontsize=9)
          for j in range(i + 1, len(axes)):
              axes[j].set_visible(False)
          plt.suptitle("Distribution features numeriques par classe")
          plt.tight_layout()
          plt.savefig("eda_bivariate.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

          # ANOVA F-test
          f_results = {}
          classes = df[TARGET_COL].unique()
          for col in num_cols:
              groups = [df.loc[df[TARGET_COL] == c, col].dropna() for c in classes]
              groups = [g for g in groups if len(g) > 1]
              if len(groups) >= 2:
                  f, p = f_oneway(*groups)
                  f_results[col] = {"F_stat": round(f, 3), "p_value": round(p, 4)}
          print("\nANOVA F-test (discriminance features) :")
          print(pd.DataFrame(f_results).T.sort_values("F_stat", ascending=False)
                .head(20).to_string())

          # Chi2 categoriel x target
          for cat in cat_cols[:6]:
              ct = pd.crosstab(df[cat], df[TARGET_COL])
              chi2, p, dof, _ = chi2_contingency(ct)
              print(f"  Chi2 {cat} x {TARGET_COL} : chi2={chi2:.2f}  p={p:.4f}  dof={dof}")

      else:
          n_cols = 3
          n_rows = max(1, int(np.ceil(len(num_cols) / n_cols)))
          fig, axes = plt.subplots(n_rows, n_cols, figsize=(6 * n_cols, 4 * n_rows))
          axes = np.array(axes).flatten()
          for i, col in enumerate(num_cols):
              axes[i].scatter(df[col], df[TARGET_COL], alpha=0.2, s=5)
              mask = df[[col, TARGET_COL]].dropna()
              if len(mask) > 2:
                  z  = np.polyfit(mask[col], mask[TARGET_COL], 1)
                  p  = np.poly1d(z)
                  xs = np.linspace(mask[col].min(), mask[col].max(), 100)
                  axes[i].plot(xs, p(xs), "r--", linewidth=1.5)
              axes[i].set_title(col, fontsize=9)
          for j in range(i + 1, len(axes)):
              axes[j].set_visible(False)
          plt.suptitle("Scatter plots features vs target")
          plt.tight_layout()
          plt.savefig("eda_bivariate.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

  - id: eda_timeseries
    name: "EDA Series Temporelles"
    enabled: true
    category: "EDA — Timeseries"
    description: >
      Serie brute, decomposition STL, stationnarite ADF et KPSS,
      ACF/PACF, saisonnalite par composante temporelle, lag scatter plots.
    applies_to: ["timeseries"]
    when_to_use: "Avant ARIMA/Prophet/XGBoost TS. Revele tendance, saisonnalite et ordre des modeles."
    pros:
      - "Decomposition STL separe tendance / saisonnalite / residus"
      - "ACF/PACF donnent les ordres p et q de depart pour ARIMA"
      - "Tests ADF et KPSS combinés pour stationnarite robuste"
    cons:
      - "Necessite statsmodels"
      - "STL necessite une frequence reguliere"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from statsmodels.tsa.seasonal import STL
      from statsmodels.tsa.stattools import adfuller, kpss
      from statsmodels.graphics.tsaplots import plot_acf, plot_pacf

      TARGET_COL = target_name
      series     = y_train.dropna()
      PERIOD     = meta.get("horizon", 12)

      # Serie brute + rolling stats
      fig, axes = plt.subplots(2, 1, figsize=(16, 8), sharex=True)
      axes[0].plot(dates_train, series.values, linewidth=1, color="steelblue")
      axes[0].set_title(f"Serie temporelle : {TARGET_COL}")

      roll_mean = series.rolling(PERIOD, center=True).mean()
      roll_std  = series.rolling(PERIOD, center=True).std()
      axes[1].plot(dates_train, roll_mean.values, color="orange",
                   label=f"Rolling mean ({PERIOD})")
      axes[1].fill_between(dates_train,
                            (roll_mean - roll_std).values,
                            (roll_mean + roll_std).values,
                            alpha=0.3, color="orange")
      axes[1].set_title("Rolling mean +/- std")
      axes[1].legend()
      plt.tight_layout()
      plt.savefig("eda_ts_raw.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      # Decomposition STL
      try:
          stl    = STL(series, period=PERIOD, robust=True)
          result = stl.fit()
          result.plot()
          plt.suptitle("Decomposition STL")
          plt.tight_layout()
          plt.savefig("eda_ts_stl.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass
      except Exception as e:
          print(f"STL: {e}")

      # Tests de stationnarite
      adf_stat, adf_p, _, _, adf_cv, _ = adfuller(series, autolag="AIC")
      print(f"ADF  stat={adf_stat:.4f}  p={adf_p:.4f}  "
            f"{'Stationnaire' if adf_p < 0.05 else 'Non-stationnaire'}")
      print(f"  Valeurs critiques : {dict(adf_cv)}")
      try:
          kp_stat, kp_p, _, _ = kpss(series, regression="c", nlags="auto")
          print(f"KPSS stat={kp_stat:.4f}  p={kp_p:.4f}  "
                f"{'Stationnaire' if kp_p > 0.05 else 'Non-stationnaire'}")
      except Exception as e:
          print(f"KPSS: {e}")

      # ACF / PACF
      max_lags = min(60, len(series) // 2 - 1)
      fig, axes = plt.subplots(1, 2, figsize=(16, 5))
      plot_acf(series,  lags=max_lags, ax=axes[0], alpha=0.05)
      axes[0].set_title("ACF — ordre q (MA)")
      plot_pacf(series, lags=max_lags, ax=axes[1], alpha=0.05)
      axes[1].set_title("PACF — ordre p (AR)")
      plt.tight_layout()
      plt.savefig("eda_ts_acf_pacf.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

  - id: eda_survival
    name: "EDA Analyse de Survie"
    enabled: true
    category: "EDA — Survie"
    description: >
      Courbes Kaplan-Meier globale et par groupe, Nelson-Aalen,
      log-rank test, distribution des durees, taux de censure.
    applies_to: ["survival"]
    when_to_use: "Avant Cox PH ou modeles de survie. Visualise les courbes et teste les groupes."
    pros:
      - "Kaplan-Meier est non-parametrique et robuste"
      - "Log-rank test chiffre la difference entre groupes"
    cons:
      - "Necessite lifelines"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from lifelines import KaplanMeierFitter, NelsonAalenFitter
      from lifelines.statistics import logrank_test

      T  = durations
      E  = events
      df_s = df_survival

      print(f"Duree    — min={T.min():.1f} | mediane={T.median():.1f} | max={T.max():.1f}")
      print(f"Evenements : {E.sum():,} ({E.mean()*100:.1f}%)")
      print(f"Taux de censure : {(1 - E.mean())*100:.1f}%")

      fig, axes = plt.subplots(1, 2, figsize=(14, 6))
      kmf = KaplanMeierFitter()
      kmf.fit(T, E, label="Population entiere")
      kmf.plot_survival_function(ax=axes[0], ci_show=True)
      axes[0].set_title("Kaplan-Meier")

      naf = NelsonAalenFitter()
      naf.fit(T, E)
      naf.plot_cumulative_hazard(ax=axes[1])
      axes[1].set_title("Risque cumule (Nelson-Aalen)")
      plt.tight_layout()
      plt.savefig("eda_survival.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      # KM par groupes
      cat_cols_surv = df_s.select_dtypes(include=["object", "category"]).columns.tolist()
      for col in cat_cols_surv[:3]:
          groups = df_s[col].dropna().unique()
          if len(groups) < 2 or len(groups) > 6:
              continue
          plt.figure(figsize=(10, 6))
          ax = plt.gca()
          for grp in groups:
              mask = df_s[col] == grp
              kmf  = KaplanMeierFitter()
              kmf.fit(T[mask], E[mask], label=str(grp))
              kmf.plot_survival_function(ax=ax, ci_show=True)
          if len(groups) == 2:
              g0, g1 = df_s[col] == groups[0], df_s[col] == groups[1]
              res = logrank_test(T[g0], T[g1], E[g0], E[g1])
              ax.set_title(f"KM par {col} — log-rank p={res.p_value:.4f}")
          else:
              ax.set_title(f"KM par {col}")
          plt.tight_layout()
          plt.savefig(f"eda_survival_km_{col}.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass

  - id: eda_nlp_corpus
    name: "EDA Corpus NLP"
    enabled: true
    category: "EDA — NLP"
    description: >
      Stats corpus, distribution longueurs, frequences unigrammes et bigrammes,
      loi de Zipf, nuage de mots, analyse par classe, heatmap TF-IDF.
    applies_to: ["nlp"]
    when_to_use: "Avant vectorisation TF-IDF ou embeddings. Revele le vocabulaire et les patterns."
    pros:
      - "Loi de Zipf revele la queue longue du vocabulaire"
      - "Analyse par classe guide le feature engineering NLP"
    cons:
      - "Nuage de mots necessite wordcloud"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import seaborn as sns
      from collections import Counter
      import re

      texts_all = texts_train + texts_test

      lens_char = [len(t) for t in texts_all]
      lens_word = [len(t.split()) for t in texts_all]
      print(f"Corpus : {len(texts_all):,} documents")
      print(f"Longueur chars — min={min(lens_char)} moy={np.mean(lens_char):.0f} max={max(lens_char)}")
      print(f"Longueur mots  — min={min(lens_word)} moy={np.mean(lens_word):.0f} max={max(lens_word)}")

      fig, axes = plt.subplots(1, 2, figsize=(14, 4))
      pd.Series(lens_char).hist(bins=60, ax=axes[0], color="steelblue", edgecolor="white")
      axes[0].set_title("Longueur (caracteres)")
      pd.Series(lens_word).hist(bins=60, ax=axes[1], color="tomato", edgecolor="white")
      axes[1].set_title("Longueur (mots)")
      plt.tight_layout()
      plt.savefig("eda_nlp_lengths.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      all_tokens = [t for text in texts_all
                    for t in re.findall(r"\b[a-zA-Z\u00C0-\u00FF]{3,}\b", text.lower())]
      freq_uni   = Counter(all_tokens)
      print(f"\nVocabulaire : {len(freq_uni):,} tokens uniques")

      # Loi de Zipf
      freqs_sorted = sorted(freq_uni.values(), reverse=True)
      plt.figure(figsize=(10, 5))
      plt.loglog(range(1, len(freqs_sorted) + 1), freqs_sorted, color="navy")
      plt.title("Loi de Zipf (rang vs frequence)")
      plt.xlabel("Rang"); plt.ylabel("Frequence")
      plt.tight_layout()
      plt.savefig("eda_nlp_zipf.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      # Nuage de mots
      try:
          from wordcloud import WordCloud
          wc = WordCloud(width=800, height=400, background_color="white",
                         max_words=200).generate_from_frequencies(freq_uni)
          plt.figure(figsize=(14, 6))
          plt.imshow(wc, interpolation="bilinear")
          plt.axis("off")
          plt.title("Nuage de mots")
          plt.tight_layout()
          plt.savefig("eda_nlp_wordcloud.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass
      except ImportError:
          print("pip install wordcloud")

  - id: eda_clustering_unsupervised
    name: "EDA Clustering et Anomalie"
    enabled: true
    category: "EDA — Clustering"
    description: >
      PCA 2D/3D, t-SNE, UMAP, variance expliquee cumulee,
      score d'anomalie Isolation Forest, scatter colorie par score.
    applies_to: ["clustering", "anomaly"]
    when_to_use: "Visualiser la structure latente des donnees non supervisees."
    pros:
      - "PCA + t-SNE + UMAP : trois vues complementaires"
      - "Isolation Forest donne un score d'anomalie sans labels"
    cons:
      - "t-SNE et UMAP lents sur >10 000 points"
      - "UMAP necessite umap-learn"
    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.preprocessing import StandardScaler
      from sklearn.decomposition import PCA
      from sklearn.ensemble import IsolationForest

      num_cols = df.select_dtypes(include="number").columns.tolist()
      X_num    = df[num_cols].dropna()
      scaler   = StandardScaler()
      X_scaled = scaler.fit_transform(X_num)

      pca2 = PCA(n_components=2, random_state=42)
      X_2d = pca2.fit_transform(X_scaled)

      fig, axes = plt.subplots(1, 2, figsize=(14, 6))
      axes[0].scatter(X_2d[:, 0], X_2d[:, 1], alpha=0.3, s=5, c="steelblue")
      axes[0].set_title(
          f"PCA 2D — variance expliquee : {pca2.explained_variance_ratio_.sum()*100:.1f}%")

      pca_full = PCA(random_state=42)
      pca_full.fit(X_scaled)
      cumvar = np.cumsum(pca_full.explained_variance_ratio_)
      axes[1].plot(range(1, len(cumvar) + 1), cumvar, marker="o", markersize=3)
      axes[1].axhline(0.9,  color="red",    linestyle="--", label="90%")
      axes[1].axhline(0.95, color="orange", linestyle="--", label="95%")
      axes[1].set_title("Variance expliquee cumulee (PCA)")
      axes[1].legend()
      plt.tight_layout()
      plt.savefig("eda_clustering_pca.png", dpi=120, bbox_inches="tight")
      import warnings
      warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
      try:
          from IPython.display import display
          display(plt.gcf())
          plt.close()
      except:
          pass

      try:
          from sklearn.manifold import TSNE
          n_tsne = min(5000, len(X_scaled))
          idx    = np.random.choice(len(X_scaled), n_tsne, replace=False)
          tsne   = TSNE(n_components=2, perplexity=30, random_state=42, n_jobs=-1)
          X_tsne = tsne.fit_transform(X_scaled[idx])
          plt.figure(figsize=(10, 8))
          plt.scatter(X_tsne[:, 0], X_tsne[:, 1], alpha=0.3, s=5, c="tomato")
          plt.title(f"t-SNE 2D ({n_tsne} points)")
          plt.tight_layout()
          plt.savefig("eda_clustering_tsne.png", dpi=120, bbox_inches="tight")
          import warnings
          warnings.filterwarnings("ignore", message=".*FigureCanvasAgg.*")
          try:
              from IPython.display import display
              display(plt.gcf())
              plt.close()
          except:
              pass
      except Exception as e:
          print(f"t-SNE: {e}")

      iso = IsolationForest(n_estimators=100, contamination=0.05, random_state=42)
      anomaly_scores = iso.fit_predict(X_scaled)
      n_anomalies = (anomaly_scores == -1).sum()
      print(f"Anomalies detectees : {n_anomalies} ({n_anomalies/len(anomaly_scores)*100:.1f}%)")


