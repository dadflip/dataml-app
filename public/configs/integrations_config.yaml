# DataML — Integrations catalog
# Each integration declares its UI fields and a Python code_template injected
# as a notebook cell when enabled. Use {{field_id}} for raw substitution and
# {{field_id|repr}} for a Python-escaped string literal (auto-quoted, supports
# multiline via triple quotes).

integrations:
  - id: gdrive
    name: Google Drive
    description: Télécharger un dataset ou dossier depuis Google Drive.
    icon: HardDrive
    docs_url: https://github.com/wkentaro/gdown
    fields:
      - id: mode
        label: Mode d'authentification
        type: select
        default: gdown
        options:
          - { value: gdown, label: "Lien public (gdown)" }
          - { value: service_account, label: "Compte de service" }
      - id: target_id
        label: File ID / Folder ID à télécharger (requis)
        type: text
        placeholder: "1AbCdEf..."
      - id: dest_path
        label: Dossier de destination
        type: text
        default: "./data"
      - id: is_folder
        label: Est-ce un dossier ?
        type: select
        default: "false"
        options:
          - { value: "false", label: "Non (Fichier unique)" }
          - { value: "true", label: "Oui (Dossier complet)" }
      - id: service_account_json
        label: Service Account JSON
        type: textarea
        placeholder: '{"type": "service_account", ...}'
        when: { mode: service_account }
        hint: Collez le contenu complet du fichier .json téléchargé depuis GCP.
    code_template: |
      # ── Intégration : Google Drive ───────────────────────────────
      import os, sys, subprocess
      MODE = {{mode|repr}}
      TARGET_ID = {{target_id|repr}}
      DEST_PATH = {{dest_path|repr}}
      IS_FOLDER = {{is_folder|repr}} == "true"

      if not TARGET_ID:
          print("[DataML] ⚠️ Veuillez renseigner le File/Folder ID dans l'intégration Google Drive.")
      else:
          os.makedirs(DEST_PATH, exist_ok=True)
          
          if MODE == "gdown":
              try:
                  import gdown  # noqa
              except ImportError:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "gdown"])
                  import gdown  # noqa
              
              print(f"[DataML] Téléchargement public via gdown de {TARGET_ID}...")
              if IS_FOLDER:
                  gdown.download_folder(id=TARGET_ID, output=DEST_PATH, quiet=False, use_cookies=False)
              else:
                  gdown.download(id=TARGET_ID, output=os.path.join(DEST_PATH, "dataset_gdrive"), quiet=False)
          else:
              _SA_PATH = "/tmp/dataml/gdrive_sa.json"
              os.makedirs("/tmp/dataml", exist_ok=True)
              with open(_SA_PATH, "w") as _f:
                  _f.write({{service_account_json|repr}})
              os.environ["GOOGLE_APPLICATION_CREDENTIALS"] = _SA_PATH
              
              try:
                  from googleapiclient.discovery import build
              except ImportError:
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "google-api-python-client", "google-auth"])
                  from googleapiclient.discovery import build
                  
              print("[DataML] Service Account configuré. (Téléchargement de dossier non implémenté automatiquement, utilisez gdrive_download)")

              def gdrive_download(file_id: str, dest: str) -> str:
                  from googleapiclient.discovery import build
                  from googleapiclient.http import MediaIoBaseDownload
                  from google.oauth2 import service_account
                  import io
                  creds = service_account.Credentials.from_service_account_file(
                      _SA_PATH, scopes=["https://www.googleapis.com/auth/drive.readonly"]
                  )
                  svc = build("drive", "v3", credentials=creds)
                  req = svc.files().get_media(fileId=file_id)
                  with io.FileIO(dest, "wb") as fh:
                      dl = MediaIoBaseDownload(fh, req)
                      done = False
                      while not done:
                          _, done = dl.next_chunk()
                  return dest
              
              if not IS_FOLDER:
                  print(f"[DataML] Téléchargement privé de {TARGET_ID}...")
                  gdrive_download(TARGET_ID, os.path.join(DEST_PATH, "dataset_gdrive"))

          print("[DataML] Opération Google Drive terminée.")

  - id: kaggle
    name: Kaggle Datasets
    description: Télécharger n'importe quel dataset Kaggle via l'API officielle.
    icon: Trophy
    docs_url: https://www.kaggle.com/docs/api
    fields:
      - id: username
        label: Username
        type: text
        placeholder: jdoe
      - id: key
        label: API Key
        type: password
        placeholder: "xxxxxxxxxxxxxxxx"
        hint: Account → Create New API Token (kaggle.json).
      - id: dataset
        label: Dataset à télécharger (ex: owner/dataset)
        type: text
        placeholder: mlg-ulb/creditcardfraud
      - id: dest_path
        label: Dossier de destination
        type: text
        default: "./data"
    code_template: |
      # ── Intégration : Kaggle ─────────────────────────────────────
      import os, sys, subprocess
      os.environ["KAGGLE_USERNAME"] = {{username|repr}}
      os.environ["KAGGLE_KEY"]      = {{key|repr}}
      DATASET = {{dataset|repr}}
      DEST_PATH = {{dest_path|repr}}

      try:
          import kaggle  # noqa
      except Exception:
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "kaggle"])
          import kaggle  # noqa

      if DATASET:
          print(f"[DataML] Téléchargement du dataset Kaggle '{DATASET}'...")
          os.makedirs(DEST_PATH, exist_ok=True)
          subprocess.check_call(
              ["kaggle", "datasets", "download", "-d", DATASET, "-p", DEST_PATH, "--unzip"]
          )
          print(f"[DataML] Kaggle: {DATASET} téléchargé dans {DEST_PATH}")
      else:
          print("[DataML] Kaggle: Aucun dataset spécifié.")

  - id: hf
    name: Hugging Face Hub
    description: Authentification HF pour datasets, transformers et diffusers.
    icon: Boxes
    docs_url: https://huggingface.co/docs/hub
    fields:
      - id: token
        label: Token HF
        type: password
        placeholder: hf_xxxxxxxxxxxxxxx
        hint: Settings → Access Tokens (read minimum).
    code_template: |
      # ── Intégration : Hugging Face Hub ───────────────────────────
      import os
      os.environ["HF_TOKEN"]                 = {{token|repr}}
      os.environ["HUGGING_FACE_HUB_TOKEN"]  = {{token|repr}}
      try:
          from huggingface_hub import login
          login(token=os.environ["HF_TOKEN"], add_to_git_credential=False)
          print("[DataML] HF Hub authentifié")
      except ImportError:
          print("[DataML] HF token exporté (HF_TOKEN). pip install huggingface_hub pour login().")

  - id: wandb
    name: Weights & Biases
    description: Tracking d'expériences, métriques, artefacts modèles.
    icon: LineChart
    docs_url: https://docs.wandb.ai
    fields:
      - id: api_key
        label: API Key
        type: password
        placeholder: "xxxxxxxxxxxxxxxx"
      - id: entity
        label: Entity (team / user)
        type: text
        placeholder: my-team
      - id: project
        label: Project
        type: text
        placeholder: my-project
    code_template: |
      # ── Intégration : Weights & Biases ───────────────────────────
      import os, sys, subprocess
      os.environ["WANDB_API_KEY"] = {{api_key|repr}}
      os.environ["WANDB_ENTITY"]  = {{entity|repr}}
      os.environ["WANDB_PROJECT"] = {{project|repr}}

      try:
          import wandb  # noqa
      except ImportError:
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "wandb"])
          import wandb  # noqa

      wandb.login()
      if os.environ.get("WANDB_PROJECT"):
          wandb.init(project=os.environ["WANDB_PROJECT"], entity=os.environ.get("WANDB_ENTITY") or None)
          print(f"[DataML] W&B initialisé sur le projet: {os.environ['WANDB_PROJECT']}")
      else:
          print("[DataML] W&B authentifié. Utilisez wandb.init(project='...') pour démarrer.")

  - id: mlflow
    name: MLflow
    description: Tracking alternatif self-hosted ou Databricks.
    icon: Activity
    docs_url: https://mlflow.org/docs/latest/index.html
    fields:
      - id: tracking_uri
        label: Tracking URI
        type: text
        placeholder: https://mlflow.example.com
      - id: experiment
        label: Experiment name
        type: text
        placeholder: default
      - id: token
        label: Token (optionnel)
        type: password
    code_template: |
      # ── Intégration : MLflow ─────────────────────────────────────
      import os, sys, subprocess
      os.environ["MLFLOW_TRACKING_URI"]    = {{tracking_uri|repr}}
      os.environ["MLFLOW_TRACKING_TOKEN"]  = {{token|repr}}
      os.environ["MLFLOW_EXPERIMENT_NAME"] = {{experiment|repr}}

      try:
          import mlflow  # noqa
      except ImportError:
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "mlflow"])
          import mlflow  # noqa

      mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
      if os.environ.get("MLFLOW_EXPERIMENT_NAME"):
          mlflow.set_experiment(os.environ["MLFLOW_EXPERIMENT_NAME"])
      print("[DataML] MLflow prêt →", mlflow.get_tracking_uri())

  - id: s3
    name: AWS S3 / compatible
    description: Bucket S3, R2, MinIO, Backblaze pour datasets & artefacts.
    icon: Database
    fields:
      - id: access_key_id
        label: Access Key ID
        type: text
      - id: secret_access_key
        label: Secret Access Key
        type: password
      - id: region
        label: Région
        type: text
        default: us-east-1
      - id: bucket
        label: Bucket par défaut
        type: text
      - id: endpoint_url
        label: Endpoint URL (R2 / MinIO, optionnel)
        type: text
        placeholder: https://xxxx.r2.cloudflarestorage.com
    code_template: |
      # ── Intégration : AWS S3 / compatible ────────────────────────
      import os, sys, subprocess
      os.environ["AWS_ACCESS_KEY_ID"]     = {{access_key_id|repr}}
      os.environ["AWS_SECRET_ACCESS_KEY"] = {{secret_access_key|repr}}
      os.environ["AWS_DEFAULT_REGION"]    = {{region|repr}}
      _ENDPOINT = {{endpoint_url|repr}}
      if _ENDPOINT:
          os.environ["AWS_ENDPOINT_URL"] = _ENDPOINT
      S3_BUCKET = {{bucket|repr}}

      try:
          import boto3  # noqa
      except ImportError:
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "boto3"])
          import boto3  # noqa

      def _s3_client():
          return boto3.client("s3", endpoint_url=os.environ.get("AWS_ENDPOINT_URL") or None)

      def s3_download(key: str, dest: str, bucket: str | None = None) -> str:
          _s3_client().download_file(bucket or S3_BUCKET, key, dest)
          return dest

      def s3_upload(src: str, key: str, bucket: str | None = None) -> str:
          _s3_client().upload_file(src, bucket or S3_BUCKET, key)
          return key

      print(f"[DataML] S3 prêt — bucket par défaut: {S3_BUCKET!r}")

  - id: openai
    name: OpenAI / compatible
    description: LLM pour features text, augmentation, evaluation (Ollama / vLLM / OpenRouter aussi).
    icon: Sparkles
    fields:
      - id: api_key
        label: API Key
        type: password
        placeholder: sk-...
      - id: base_url
        label: Base URL (optionnel)
        type: text
        placeholder: https://api.openai.com/v1
    code_template: |
      # ── Intégration : OpenAI / compatible ────────────────────────
      import os
      os.environ["OPENAI_API_KEY"] = {{api_key|repr}}
      _BASE = {{base_url|repr}}
      if _BASE:
          os.environ["OPENAI_BASE_URL"] = _BASE
      print("[DataML] OpenAI prêt →", os.environ.get("OPENAI_BASE_URL", "default"))
