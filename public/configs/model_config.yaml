  - id: tfidf_logreg
    name: "TF-IDF + Logistic Regression"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.LogisticRegression
    category: "NLP — Classique"
    description: "Pipeline TF-IDF vectorisation + régression logistique. Baseline NLP très solide."
    use_cases: ["classification de texte", "analyse de sentiment", "détection de spam"]
    pros: ["rapide", "interprétable", "très compétitif en baseline", "peu de données nécessaires"]
    cons: ["ignore la sémantique et l'ordre des mots", "vocabulaire fixe"]
    hyperparameters:
      max_features: [10000, 50000, null]
      ngram_range: ["(1,1)", "(1,2)", "(1,3)"]
      C: [0.1, 1, 10]
      analyzer: ["word", "char_wb"]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.feature_extraction.text import TfidfVectorizer
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import Pipeline
      from sklearn.metrics import classification_report

      model = Pipeline([
          ("tfidf", TfidfVectorizer(max_features=50000, ngram_range=(1, 2),
                                    sublinear_tf=True, strip_accents="unicode",
                                    analyzer="word", min_df=2)),
          ("clf", LogisticRegression(C=1.0, max_iter=1000, solver="saga", n_jobs=-1))
      ])
      model.fit(texts_train, y_train)
      y_pred = model.predict(texts_test)
      print(classification_report(y_test, y_pred))

      # Mots les plus discriminants par classe
      import numpy as np
      feature_names = model["tfidf"].get_feature_names_out()
      coef = model["clf"].coef_
      for i, class_name in enumerate(model["clf"].classes_):
          top_idx = np.argsort(coef[i])[-10:]
          print(f"\nClasse '{class_name}' :", feature_names[top_idx].tolist())

  - id: sentence_transformers_clf
    name: "Sentence Transformers + Classifier"
    enabled: true
    library: sentence_transformers
    class: sentence_transformers.SentenceTransformer
    category: "NLP — Transformers"
    description: "Embeddings de phrases denses via modèles pré-entraînés (SBERT) + classificateur downstream."
    use_cases: ["classification sémantique", "similarité de texte", "peu de données (few-shot)"]
    pros: ["capture la sémantique", "peu de données nécessaires", "multilingue", "état de l'art"]
    cons: ["plus lent que TF-IDF", "GPU recommandé", "taille des modèles"]
    hyperparameters:
      model_name: ["all-MiniLM-L6-v2", "all-mpnet-base-v2", "paraphrase-multilingual-MiniLM-L12-v2"]
      batch_size: [32, 64, 128]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sentence_transformers import SentenceTransformer
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import classification_report
      import numpy as np

      # Modèle multilingue recommandé pour le français
      encoder = SentenceTransformer("paraphrase-multilingual-MiniLM-L12-v2")

      print("Encoding train...")
      X_train_emb = encoder.encode(texts_train, batch_size=64,
                                    show_progress_bar=True, normalize_embeddings=True)
      print("Encoding test...")
      X_test_emb  = encoder.encode(texts_test,  batch_size=64,
                                    show_progress_bar=True, normalize_embeddings=True)

      clf = LogisticRegression(C=1.0, max_iter=1000)
      clf.fit(X_train_emb, y_train)
      y_pred = clf.predict(X_test_emb)
      print(classification_report(y_test, y_pred))

      # Similarité cosinus entre deux phrases
      from sentence_transformers.util import cos_sim
      sim = cos_sim(X_train_emb[0], X_train_emb[1])
      print(f"Similarité : {sim.item():.3f}")

