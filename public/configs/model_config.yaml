conformal_prediction:
# ──────────────────────────────────────────────────────────────────────────

  - id: mapie_conformal
    name: "MAPIE — Conformal Prediction (intervalles garantis)"
    enabled: true
    library: mapie
    class: mapie.classification.MapieClassifier
    category: "Incertitude Quantification"
    description: >
      Wraps n'importe quel modèle sklearn pour produire des intervalles de
      prédiction avec couverture marginale garantie sans hypothèse
      distributionnelle. Basé sur la théorie conformal prediction.
    use_cases:
      - "garanties formelles de couverture (médical, légal)"
      - "quantifier l'incertitude sur n'importe quel modèle"
      - "détection de l'ambiguïté"
    pros:
      - "couverture marginale garantie"
      - "agnostique au modèle"
      - "léger — juste un calibration set"
    cons:
      - "nécessite un calibration set dédié"
      - "couverture marginale ≠ conditionnelle"
    hyperparameters:
      method: { type: str, choices: ["score","cumulated_score","raps"], default: "score" }
      cv:     { type: str|int, choices: ["prefit","split",5,10], default: "prefit" }
      alpha:  { type: float, range: [0.01, 0.2], default: 0.1 }
    eval_metrics: ["coverage", "mean_set_size", "accuracy"]
    io_contract:
      inputs:  [model_pretrained, X_calib, y_calib, X_test, y_test, feature_names]
      outputs: [model, y_pred, y_pred_sets, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      from mapie.classification import MapieClassifier
      from mapie.metrics import classification_coverage_score, classification_mean_width_score
      from sklearn.metrics import accuracy_score

      _ALPHA = 0.1
      _t0 = time.perf_counter()
      model = MapieClassifier(estimator=model_pretrained, method="score",
                              cv="prefit", random_state=42)
      model.fit(X_calib, y_calib)
      fit_time_s = time.perf_counter() - _t0

      y_pred, y_pred_sets = model.predict(X_test, alpha=_ALPHA, include_last_label=True)
      _sets_1d = y_pred_sets[:, :, 0]
      feature_importances = None
      y_proba = model_pretrained.predict_proba(X_test)
      metrics = {
          "accuracy"     : float(accuracy_score(y_test, y_pred)),
          "coverage"     : float(classification_coverage_score(y_test, _sets_1d)),
          "mean_set_size": float(classification_mean_width_score(_sets_1d)),
          "alpha_target" : _ALPHA,
          "fit_time_s"   : fit_time_s,
      }
      print(f"Couverture : {metrics['coverage']:.3f} | Taille moy : {metrics['mean_set_size']:.2f}")


