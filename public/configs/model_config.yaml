free_code:
# ──────────────────────────────────────────────────────────────────────────

  - id: free_code
    name: "Nœud Code Libre"
    enabled: true
    library: any
    class: null
    category: "Générique"
    description: >
      Nœud d'échappement : code Python arbitraire hors catalogue.
      Permet d'intégrer n'importe quelle logique custom, wrapper de modèle
      exotique, appel d'API externe, ou traitement ad-hoc.
    use_cases:
      - "modèle non répertorié dans le catalogue"
      - "pipeline hybride (sklearn + torch + HuggingFace)"
      - "wrapper autour d'un modèle propriétaire ou API"
      - "prototypage rapide"
    pros:
      - "liberté totale"
      - "compatible avec le contrat I/O si les variables de sortie sont produites"
    cons:
      - "aucune validation automatique"
      - "maintenabilité réduite"
    hyperparameters: {}
    eval_metrics: []
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test, feature_names]
      outputs: [model, y_pred, y_proba, metrics, feature_importances, fit_time_s]
      notes:   "Produire au minimum model, y_pred, metrics (dict), fit_time_s."
    code_template: |
      import time
      import numpy as np
      from sklearn.metrics import accuracy_score, f1_score

      class MyCustomModel:
          def fit(self, X, y): self._classes = np.unique(y); return self
          def predict(self, X): return np.full(len(X), self._classes[0])
          def predict_proba(self, X): return np.full((len(X), len(self._classes)), 1/len(self._classes))

      _t0 = time.perf_counter()
      model = MyCustomModel()
      model.fit(X_train, y_train)
      fit_time_s = time.perf_counter() - _t0

      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test)
      feature_importances = None
      metrics = {
          "accuracy"   : float(accuracy_score(y_test, y_pred)),
          "f1_weighted": float(f1_score(y_test, y_pred, average="weighted", zero_division=0)),
          "fit_time_s" : fit_time_s,
      }
      print(f"Accuracy: {metrics['accuracy']:.4f}")
