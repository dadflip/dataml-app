# ══════════════════════════════════════════════════════════════════════════
# ML MODEL CATALOG — Classification · Regression · Clustering
#                    Timeseries · Anomaly Detection · Dimensionality Reduction
#                    Neural Networks · NLP · Survival · Bayesian
#                    Tabular DL · Conformal · Advanced Anomaly
# ══════════════════════════════════════════════════════════════════════════
#
# Structure de chaque entrée :
#   id, name, enabled, library, class, category,
#   description, use_cases, pros, cons,
#   hyperparameters, eval_metrics,
#   code_template          ← snippet générique prêt à l'emploi
#
# Convention code_template :
#   - X_train / X_test / y_train / y_test  : données déjà splittées
#   - preprocessor                          : pipeline de prétraitement (optionnel)
#   - Les imports sont inclus dans chaque template
# ══════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────
classification:
# ──────────────────────────────────────────────────────────────────────────

  - id: logistic_regression
    name: "Régression Logistique"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.LogisticRegression
    category: "Linéaire"
    description: "Modèle probabiliste linéaire. Idéal comme baseline. Très interprétable via les coefficients."
    use_cases: ["classification binaire", "multi-classe (OvR)", "features nombreuses et sparses"]
    pros: ["très rapide", "interprétable", "régularisation intégrée", "probabilités calibrées"]
    cons: ["frontière de décision linéaire uniquement", "sensible aux outliers"]
    hyperparameters:
      C: [0.001, 0.01, 0.1, 1, 10, 100]
      penalty: ["l2", "l1", "elasticnet"]
      solver: ["lbfgs", "saga", "liblinear"]
      max_iter: [100, 500, 1000]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "precision", "recall"]
    code_template: |
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("clf", LogisticRegression(C=1.0, penalty="l2", solver="lbfgs",
                                     max_iter=1000, random_state=42))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      from sklearn.model_selection import GridSearchCV
      param_grid = {"clf__C": [0.01, 0.1, 1, 10], "clf__penalty": ["l1", "l2"]}
      gs = GridSearchCV(model, param_grid, cv=5, scoring="f1_weighted", n_jobs=-1)
      gs.fit(X_train, y_train)
      print("Best params:", gs.best_params_)

  - id: random_forest_clf
    name: "Random Forest"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.RandomForestClassifier
    category: "Ensemble — Bagging"
    description: "Ensemble d'arbres de décision entraînés sur sous-échantillons bootstrap. Robuste et puissant."
    use_cases: ["tabular data généraliste", "feature importance", "résistance aux outliers"]
    pros: ["robuste au sur-apprentissage", "feature importance native", "parallélisable", "pas besoin de scaling"]
    cons: ["boîte noire", "lent sur très grands datasets", "moins bon que boosting en général"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      max_depth: [5, 10, 20, null]
      min_samples_split: [2, 5, 10]
      max_features: ["sqrt", "log2", 0.5]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.metrics import classification_report
      from sklearn.model_selection import RandomizedSearchCV
      import pandas as pd

      model = RandomForestClassifier(n_estimators=200, max_depth=None,
                                      max_features="sqrt", n_jobs=-1, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      fi = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False)
      print(fi.head(15))

  - id: xgboost_clf
    name: "XGBoost"
    enabled: true
    library: xgboost
    class: xgboost.XGBClassifier
    category: "Ensemble — Boosting"
    description: "Implémentation optimisée et régularisée du gradient boosting. Standard de l'industrie pour tabular data."
    use_cases: ["compétitions ML", "tabular data haute performance", "features sparses"]
    pros: ["très performant", "régularisation L1/L2", "gère les valeurs manquantes nativement", "rapide"]
    cons: ["nombreux hyperparamètres", "peut nécessiter du tuning"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7, 9]
      subsample: [0.7, 0.8, 1.0]
      colsample_bytree: [0.7, 0.8, 1.0]
      reg_alpha: [0, 0.1, 1]
      reg_lambda: [1, 5, 10]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      import xgboost as xgb
      from sklearn.metrics import classification_report

      model = xgb.XGBClassifier(n_estimators=300, learning_rate=0.05, max_depth=5,
                                  subsample=0.8, colsample_bytree=0.8,
                                  eval_metric="logloss", random_state=42, n_jobs=-1)
      model.fit(X_train, y_train,
                eval_set=[(X_test, y_test)],
                early_stopping_rounds=30, verbose=50)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

  - id: lightgbm_clf
    name: "LightGBM"
    enabled: true
    library: lightgbm
    class: lightgbm.LGBMClassifier
    category: "Ensemble — Boosting"
    description: "Boosting basé sur histogrammes. Très rapide, faible mémoire. Excellent sur grands datasets."
    use_cases: ["grands datasets (>100k lignes)", "haute dimensionnalité", "production rapide"]
    pros: ["le plus rapide des boosting", "faible consommation mémoire", "gère les catégorielles nativement"]
    cons: ["peut sur-apprendre sur petits datasets", "sensible aux outliers"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      learning_rate: [0.01, 0.05, 0.1]
      num_leaves: [31, 63, 127]
      max_depth: [-1, 5, 10]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      import lightgbm as lgb
      from sklearn.metrics import classification_report

      model = lgb.LGBMClassifier(n_estimators=500, learning_rate=0.05,
                                   num_leaves=63, subsample=0.8,
                                   colsample_bytree=0.8, random_state=42, n_jobs=-1)
      model.fit(X_train, y_train,
                eval_set=[(X_test, y_test)],
                callbacks=[lgb.early_stopping(50), lgb.log_evaluation(100)])
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

  - id: svm_clf
    name: "Support Vector Machine (SVC)"
    enabled: true
    library: sklearn
    class: sklearn.svm.SVC
    category: "Kernel"
    description: "Trouve l'hyperplan de séparation à marge maximale. Très puissant avec kernel RBF."
    use_cases: ["données de haute dimension", "petits datasets", "marges claires entre classes"]
    pros: ["efficace en haute dimension", "polyvalent (kernels)", "robuste aux outliers"]
    cons: ["lent sur grands datasets", "scalabilité limitée", "sensible au scaling"]
    hyperparameters:
      C: [0.1, 1, 10, 100]
      kernel: ["rbf", "linear", "poly", "sigmoid"]
      gamma: ["scale", "auto", 0.001, 0.01, 0.1]
    eval_metrics: ["accuracy", "f1_weighted"]
    code_template: |
      from sklearn.svm import SVC
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("svc", SVC(C=1.0, kernel="rbf", gamma="scale",
                      probability=True, random_state=42))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

# ──────────────────────────────────────────────────────────────────────────
regression:
# ──────────────────────────────────────────────────────────────────────────

  - id: linear_regression
    name: "Régression Linéaire (OLS)"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.LinearRegression
    category: "Linéaire"
    description: "Régression par moindres carrés ordinaires. Baseline incontournable."
    use_cases: ["relation linéaire entre features et target", "interprétation des coefficients"]
    pros: ["très interprétable", "rapide", "coefficients significatifs via statsmodels"]
    cons: ["linéaire uniquement", "sensible aux outliers et à la multicolinéarité"]
    hyperparameters: {}
    eval_metrics: ["rmse", "mae", "r2", "mape"]
    code_template: |
      from sklearn.linear_model import LinearRegression
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import mean_squared_error, mean_absolute_error, r2_score
      import numpy as np

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("reg", LinearRegression())
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      rmse = np.sqrt(mean_squared_error(y_test, y_pred))
      print(f"RMSE: {rmse:.4f} | MAE: {mean_absolute_error(y_test, y_pred):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

  - id: xgboost_reg
    name: "XGBoost Regressor"
    enabled: true
    library: xgboost
    class: xgboost.XGBRegressor
    category: "Ensemble — Boosting"
    description: "Gradient boosting pour régression. Standard pour tabular regression en compétition."
    use_cases: ["régression tabular haute performance"]
    pros: ["très performant", "régularisation", "gère les NaN"]
    cons: ["tuning nécessaire", "extrapolation limitée"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7]
    eval_metrics: ["rmse", "mae", "r2", "mape"]
    code_template: |
      import xgboost as xgb
      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np

      model = xgb.XGBRegressor(n_estimators=500, learning_rate=0.05, max_depth=5,
                                 subsample=0.8, colsample_bytree=0.8,
                                 eval_metric="rmse", random_state=42, n_jobs=-1)
      model.fit(X_train, y_train,
                eval_set=[(X_test, y_test)],
                early_stopping_rounds=50, verbose=100)
      y_pred = model.predict(X_test)
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

# ──────────────────────────────────────────────────────────────────────────
clustering:
# ──────────────────────────────────────────────────────────────────────────

  - id: kmeans
    name: "K-Means"
    enabled: true
    library: sklearn
    class: sklearn.cluster.KMeans
    category: "Centroïde"
    description: "Partitionne les données en K clusters en minimisant la variance intra-cluster."
    use_cases: ["segmentation client", "quantification", "données sphériques"]
    pros: ["simple", "rapide", "scalable", "interprétable"]
    cons: ["K à fixer a priori", "sensible aux outliers", "hypothèse de clusters sphériques"]
    hyperparameters:
      n_clusters: [2, 3, 4, 5, 6, 7, 8, 9, 10]
      init: ["k-means++", "random"]
    eval_metrics: ["silhouette", "davies_bouldin", "calinski_harabasz", "inertia"]
    code_template: |
      from sklearn.cluster import KMeans
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      inertias, sil_scores = [], []
      K_range = range(2, 11)
      for k in K_range:
          km = KMeans(n_clusters=k, init="k-means++", random_state=42, n_init=10)
          labels = km.fit_predict(X_scaled)
          inertias.append(km.inertia_)
          sil_scores.append(silhouette_score(X_scaled, labels))

      best_k = list(K_range)[np.argmax(sil_scores)]
      final_model = KMeans(n_clusters=best_k, random_state=42, n_init=10)
      labels = final_model.fit_predict(X_scaled)
      print(f"K optimal : {best_k} | Silhouette : {silhouette_score(X_scaled, labels):.3f}")

# ──────────────────────────────────────────────────────────────────────────
timeseries:
# ──────────────────────────────────────────────────────────────────────────

  - id: prophet
    name: "Prophet (Meta)"
    enabled: true
    library: prophet
    class: prophet.Prophet
    category: "Décomposition"
    description: "Modèle additif de décomposition tendance + saisonnalité + évènements."
    use_cases: ["séries avec saisonnalité forte", "effets de vacances/jours fériés"]
    pros: ["robuste aux données manquantes", "gère plusieurs saisonnalités", "simple"]
    cons: ["pas optimal pour séries très courtes ou sans saisonnalité"]
    hyperparameters:
      seasonality_mode: ["additive", "multiplicative"]
      changepoint_prior_scale: [0.001, 0.01, 0.1, 0.5]
    eval_metrics: ["mae", "rmse", "mape"]
    code_template: |
      from prophet import Prophet
      import pandas as pd

      df_train = pd.DataFrame({"ds": dates_train, "y": y_train})
      df_future = pd.DataFrame({"ds": dates_future})

      model = Prophet(seasonality_mode="multiplicative",
                      changepoint_prior_scale=0.05,
                      yearly_seasonality="auto", weekly_seasonality=True)
      model.fit(df_train)
      forecast = model.predict(df_future)
      model.plot(forecast)
      model.plot_components(forecast)

# ──────────────────────────────────────────────────────────────────────────
anomaly_detection:
# ──────────────────────────────────────────────────────────────────────────

  - id: isolation_forest
    name: "Isolation Forest"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.IsolationForest
    category: "Ensemble"
    description: "Isole les anomalies par partitionnement aléatoire. Efficace et rapide."
    use_cases: ["détection d'anomalies multivariée", "fraude", "monitoring"]
    pros: ["rapide", "scalable", "pas besoin de labeled anomalies"]
    cons: ["paramètre contamination à estimer"]
    hyperparameters:
      n_estimators: [100, 200]
      contamination: [0.01, 0.05, 0.1, 0.2]
    eval_metrics: ["precision", "recall", "f1", "roc_auc"]
    code_template: |
      from sklearn.ensemble import IsolationForest
      from sklearn.preprocessing import StandardScaler
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      model = IsolationForest(n_estimators=200, contamination=0.05, random_state=42)
      model.fit(X_scaled)
      labels = model.predict(X_scaled)
      anomalies = np.where(labels == -1)[0]
      print(f"Anomalies détectées : {len(anomalies)} ({len(anomalies)/len(X)*100:.1f}%)")

# ──────────────────────────────────────────────────────────────────────────
dimensionality_reduction:
# ──────────────────────────────────────────────────────────────────────────

  - id: pca
    name: "PCA"
    enabled: true
    library: sklearn
    class: sklearn.decomposition.PCA
    category: "Linéaire"
    description: "Réduit la dimensionnalité en maximisant la variance expliquée."
    use_cases: ["réduction de bruit", "visualisation", "preprocessing avant ML"]
    pros: ["interprétable", "rapide", "déterministe"]
    cons: ["linéaire uniquement"]
    hyperparameters:
      n_components: [2, 3, 5, 10, 0.95]
    eval_metrics: ["explained_variance_ratio", "reconstruction_error"]
    code_template: |
      from sklearn.decomposition import PCA
      from sklearn.preprocessing import StandardScaler
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)
      pca = PCA(n_components=0.95)
      X_pca = pca.fit_transform(X_scaled)
      print(f"Dimensions : {X.shape[1]} → {X_pca.shape[1]}")

  - id: umap_reduction
    name: "UMAP"
    enabled: true
    library: umap-learn
    class: umap.UMAP
    category: "Non-linéaire"
    description: "Réduction topologique. Plus rapide que t-SNE, préserve structure locale et globale."
    use_cases: ["visualisation", "preprocessing", "réduction pour clustering"]
    pros: ["rapide", "projectable sur nouveaux points"]
    cons: ["stochastique", "hyperparamètres subtils"]
    hyperparameters:
      n_components: [2, 3, 5, 10]
      n_neighbors: [5, 10, 15, 30]
      min_dist: [0.0, 0.1, 0.25, 0.5]
    eval_metrics: ["trustworthiness"]
    code_template: |
      import umap
      from sklearn.preprocessing import StandardScaler
      import matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)
      reducer = umap.UMAP(n_components=2, n_neighbors=15, min_dist=0.1, random_state=42)
      X_2d = reducer.fit_transform(X_scaled)
      plt.scatter(X_2d[:, 0], X_2d[:, 1], c=y if y is not None else "steelblue",
                  cmap="tab10", alpha=0.6, s=10)
      plt.title("UMAP"); plt.show()

# ══════════════════════════════════════════════════════════════════════════
# NEURAL NETWORKS — Section étendue
# Couvre : MLP, CNN, RNN/LSTM/GRU, Transformers, Autoencoders,
#          VAE, GAN, Diffusion, Graph Neural Networks, Self-supervised,
#          Meta-learning, Reinforcement Learning, Multimodal
# ══════════════════════════════════════════════════════════════════════════

neural_networks:

  # ── 1. FEEDFORWARD / MLP ────────────────────────────────────────────────

  - id: mlp_sklearn
    name: "MLP Classifier/Regressor (sklearn)"
    enabled: true
    library: sklearn
    class: sklearn.neural_network.MLPClassifier
    category: "Feedforward — MLP"
    description: >
      Perceptron multi-couches sklearn. Pas de GPU, interface standard sklearn.
      Idéal pour expérimenter rapidement sans setup PyTorch. Supporte
      classification et régression. Converge via Adam ou SGD avec backprop.
      Limité en flexibilité (pas de BatchNorm, pas de Dropout structuré) mais
      parfait comme baseline deep learning sur données tabulaires.
    use_cases:
      - "baseline deep learning sur tabular data sans GPU"
      - "expérimentation rapide dans un pipeline sklearn"
      - "classification et régression non-linéaire"
      - "données de taille moyenne (<100k lignes)"
    pros:
      - "zéro configuration GPU"
      - "intégration sklearn native (GridSearchCV, Pipeline)"
      - "early stopping intégré"
      - "rapide à mettre en place"
    cons:
      - "pas de BatchNorm ni Dropout structuré"
      - "convergence capricieuse (sensible au lr)"
      - "moins puissant que PyTorch sur gros datasets"
      - "pas de GPU"
    hyperparameters:
      hidden_layer_sizes:
        type: list
        choices: ["(100,)", "(100,50)", "(200,100,50)", "(512,256,128,64)"]
        default: "(200,100)"
        description: "Architecture en tuples. (a,b) = 2 couches cachées de taille a et b."
      activation:
        type: str
        choices: ["relu", "tanh", "logistic"]
        default: "relu"
      alpha:
        type: float
        range: [1e-5, 1e-1]
        default: 1e-4
        description: "Régularisation L2."
      learning_rate_init:
        type: float
        range: [1e-5, 1e-2]
        default: 1e-3
      solver:
        type: str
        choices: ["adam", "sgd", "lbfgs"]
        default: "adam"
      batch_size:
        type: int
        choices: [32, 64, 128, 256, "auto"]
        default: "auto"
      max_iter:
        type: int
        range: [100, 2000]
        default: 500
      early_stopping:
        type: bool
        default: true
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test, feature_names]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      from sklearn.neural_network import MLPClassifier
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report, f1_score, accuracy_score, roc_auc_score
      import matplotlib.pyplot as plt

      _t0 = time.perf_counter()
      model = Pipeline([
          ("scaler", StandardScaler()),
          ("mlp", MLPClassifier(
              hidden_layer_sizes=(200, 100),
              activation="relu",
              solver="adam",
              alpha=1e-4,
              learning_rate_init=1e-3,
              batch_size="auto",
              max_iter=500,
              early_stopping=True,
              validation_fraction=0.1,
              n_iter_no_change=20,
              random_state=42,
              verbose=False
          ))
      ])
      model.fit(X_train, y_train)
      fit_time_s = time.perf_counter() - _t0

      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test)
      print(classification_report(y_test, y_pred))

      # Courbe de perte
      plt.figure(figsize=(8, 4))
      plt.plot(model["mlp"].loss_curve_, label="Train Loss")
      if model["mlp"].validation_scores_:
          plt.plot(model["mlp"].validation_scores_, label="Val Score")
      plt.xlabel("Epochs"); plt.ylabel("Loss"); plt.legend(); plt.tight_layout(); plt.show()

      _is_binary = len(np.unique(y_train)) == 2
      metrics = {
          "accuracy"   : accuracy_score(y_test, y_pred),
          "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
          "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_binary else y_proba,
                                        multi_class="ovr", average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      print(metrics)
      feature_importances = None


  - id: pytorch_mlp_tabular
    name: "PyTorch MLP — Tabulaire (classification & régression)"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "Feedforward — MLP"
    description: >
      MLP généraliste en PyTorch pour données tabulaires. Architecture
      entièrement configurable : nombre de couches, BatchNorm, Dropout,
      activation. Supporte classification (cross-entropy) et régression (MSE).
      GPU natif, early stopping manuel, visualisation de la courbe de perte.
      Point d'entrée recommandé avant de passer à des architectures plus
      spécialisées (TabNet, FT-Transformer).
    use_cases:
      - "classification binaire ou multi-classe sur données tabulaires"
      - "régression scalaire ou multi-output"
      - "datasets > 50k lignes avec GPU disponible"
      - "baseline PyTorch avant exploration d'architectures avancées"
    pros:
      - "contrôle total sur l'architecture"
      - "BatchNorm + Dropout → meilleure régularisation qu'sklearn"
      - "GPU natif"
      - "extensible : ajouter residual connections, attention, etc."
    cons:
      - "setup plus verbeux que sklearn"
      - "gestion manuelle du DataLoader et de la boucle d'entraînement"
    hyperparameters:
      hidden_dims:
        type: list
        default: "[256, 128, 64]"
        description: "Tailles des couches cachées successives."
      dropout:
        type: float
        range: [0.0, 0.5]
        default: 0.2
        description: "Taux de dropout appliqué après chaque couche cachée."
      use_batchnorm:
        type: bool
        default: true
        description: "BatchNorm1d après chaque couche linéaire (avant activation)."
      activation:
        type: str
        choices: ["relu", "gelu", "selu", "leaky_relu"]
        default: "relu"
      lr:
        type: float
        range: [1e-5, 1e-2]
        default: 3e-4
      weight_decay:
        type: float
        range: [0, 1e-2]
        default: 1e-5
        description: "Régularisation L2 dans l'optimiseur Adam."
      batch_size:
        type: int
        choices: [64, 128, 256, 512, 1024]
        default: 256
      epochs:
        type: int
        range: [10, 500]
        default: 100
      patience:
        type: int
        range: [5, 50]
        default: 20
        description: "Patience pour early stopping sur la val loss."
      task:
        type: str
        choices: ["classification", "regression"]
        default: "classification"
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "rmse", "r2"]
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test, feature_names]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import StandardScaler, LabelEncoder
      from sklearn.metrics import (classification_report, f1_score,
                                   accuracy_score, roc_auc_score,
                                   mean_squared_error, r2_score)

      # ── Config ─────────────────────────────────────────────────────────
      TASK        = "classification"   # "classification" ou "regression"
      HIDDEN_DIMS = [256, 128, 64]
      DROPOUT     = 0.2
      BATCHNORM   = True
      ACTIVATION  = nn.ReLU
      LR          = 3e-4
      WEIGHT_DECAY= 1e-5
      BATCH_SIZE  = 256
      EPOCHS      = 100
      PATIENCE    = 20
      DEVICE      = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # ── Préparation ────────────────────────────────────────────────────
      _scaler = StandardScaler()
      _X_tr = torch.tensor(_scaler.fit_transform(X_train), dtype=torch.float32)
      _X_te = torch.tensor(_scaler.transform(X_test),      dtype=torch.float32)

      if TASK == "classification":
          _le   = LabelEncoder()
          _y_tr = torch.tensor(_le.fit_transform(y_train), dtype=torch.long)
          _y_te = _le.transform(y_test)
          N_OUT = len(_le.classes_)
          _criterion = nn.CrossEntropyLoss()
      else:
          _y_tr = torch.tensor(np.array(y_train, dtype=np.float32)).unsqueeze(1)
          _y_te = np.array(y_test, dtype=np.float32)
          N_OUT = 1
          _criterion = nn.MSELoss()

      _loader = DataLoader(TensorDataset(_X_tr, _y_tr),
                           batch_size=BATCH_SIZE, shuffle=True)

      # ── Architecture ───────────────────────────────────────────────────
      class MLP(nn.Module):
          def __init__(self, in_dim, hidden_dims, out_dim, dropout, batchnorm, act):
              super().__init__()
              _layers, _prev = [], in_dim
              for h in hidden_dims:
                  _layers.append(nn.Linear(_prev, h))
                  if batchnorm: _layers.append(nn.BatchNorm1d(h))
                  _layers.append(act())
                  if dropout > 0: _layers.append(nn.Dropout(dropout))
                  _prev = h
              _layers.append(nn.Linear(_prev, out_dim))
              self.net = nn.Sequential(*_layers)
          def forward(self, x): return self.net(x)

      model = MLP(X_train.shape[1], HIDDEN_DIMS, N_OUT,
                  DROPOUT, BATCHNORM, ACTIVATION).to(DEVICE)
      _opt = torch.optim.Adam(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)
      _sched = torch.optim.lr_scheduler.ReduceLROnPlateau(_opt, patience=5, factor=0.5)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_loss, _no_improve, _train_losses = float("inf"), 0, []
      for _epoch in range(EPOCHS):
          model.train()
          _ep_loss = 0.0
          for _Xb, _yb in _loader:
              _Xb, _yb = _Xb.to(DEVICE), _yb.to(DEVICE)
              _opt.zero_grad()
              _loss = _criterion(model(_Xb), _yb)
              _loss.backward(); _opt.step()
              _ep_loss += _loss.item()
          _ep_loss /= len(_loader)
          _train_losses.append(_ep_loss)
          _sched.step(_ep_loss)
          if _ep_loss < _best_loss - 1e-6:
              _best_loss = _ep_loss; _no_improve = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_improve += 1
          if _no_improve >= PATIENCE:
              print(f"Early stop à l'epoch {_epoch+1}"); break
          if (_epoch + 1) % 20 == 0:
              print(f"Epoch {_epoch+1:4d} | loss: {_ep_loss:.5f}")

      model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0

      # ── Inférence ──────────────────────────────────────────────────────
      model.eval()
      with torch.no_grad():
          _logits = model(_X_te.to(DEVICE)).cpu()

      if TASK == "classification":
          y_proba = torch.softmax(_logits, dim=1).numpy()
          y_pred  = _le.inverse_transform(y_proba.argmax(axis=1))
          _is_bin = N_OUT == 2
          metrics = {
              "accuracy"   : accuracy_score(y_test, y_pred),
              "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
              "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_bin else y_proba,
                                            multi_class="ovr", average="weighted"),
              "fit_time_s" : fit_time_s,
          }
          print(classification_report(y_test, y_pred))
      else:
          y_pred  = _logits.squeeze(1).numpy()
          y_proba = None
          metrics = {
              "rmse"      : float(np.sqrt(mean_squared_error(y_test, y_pred))),
              "r2"        : float(r2_score(y_test, y_pred)),
              "fit_time_s": fit_time_s,
          }
          print(metrics)

      feature_importances = None


  # ── 2. CONVOLUTIONAL NEURAL NETWORKS ────────────────────────────────────

  - id: cnn_image_clf
    name: "CNN — Classification d'images (PyTorch)"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "CNN — Vision"
    description: >
      Réseau de neurones convolutif pour la classification d'images.
      Architecture typique : blocs Conv2d → BatchNorm → ReLU → MaxPool,
      suivi d'un MLP tête de classification. Conçu pour des images RGB
      ou grayscale de taille arbitraire. Inclut augmentation de données
      (torchvision.transforms), scheduler cosine et visualisation des
      feature maps. Point d'entrée avant le transfer learning.
    use_cases:
      - "classification d'images custom (n classes)"
      - "détection de défauts industriels"
      - "reconnaissance de chiffres, symboles, documents"
      - "analyse d'images médicales simples"
      - "baseline avant transfer learning sur ResNet/EfficientNet"
    pros:
      - "invariance par translation grâce aux convolutions"
      - "partage de paramètres → peu de poids"
      - "visualisable : Grad-CAM, feature maps"
      - "très bien compris et documenté"
    cons:
      - "nécessite GPU pour datasets > 10k images"
      - "sensitive au volume de données"
      - "architecture manuelle moins efficace que transfer learning"
    hyperparameters:
      n_channels:
        type: list
        default: "[32, 64, 128, 256]"
        description: "Nombre de filtres par bloc convolutif."
      kernel_size:
        type: int
        choices: [3, 5, 7]
        default: 3
      pool_size:
        type: int
        default: 2
      dropout_conv:
        type: float
        range: [0.0, 0.5]
        default: 0.25
        description: "Dropout après les blocs convolutifs."
      dropout_fc:
        type: float
        range: [0.0, 0.5]
        default: 0.5
        description: "Dropout dans la tête fully-connected."
      fc_hidden:
        type: int
        default: 512
      lr:
        type: float
        default: 1e-3
      weight_decay:
        type: float
        default: 1e-4
      batch_size:
        type: int
        choices: [32, 64, 128]
        default: 64
      epochs:
        type: int
        default: 50
      image_size:
        type: int
        default: 224
        description: "Redimensionnement à (image_size × image_size)."
      augment:
        type: bool
        default: true
        description: "Activer RandomCrop, HorizontalFlip, ColorJitter."
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "top5_accuracy"]
    io_contract:
      inputs:  [train_dir, val_dir, n_classes]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
      notes:   "train_dir/val_dir = ImageFolder layout (un sous-dossier par classe)."
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      import torchvision.transforms as T
      from torchvision.datasets import ImageFolder
      from torch.utils.data import DataLoader
      from sklearn.metrics import classification_report, accuracy_score, f1_score

      # ── Config ─────────────────────────────────────────────────────────
      IMG_SIZE   = 224
      N_CHANNELS = [32, 64, 128, 256]
      KERNEL     = 3
      FC_HIDDEN  = 512
      DROPOUT_C  = 0.25
      DROPOUT_FC = 0.5
      LR         = 1e-3
      WEIGHT_DECAY = 1e-4
      BATCH_SIZE = 64
      EPOCHS     = 50
      DEVICE     = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # ── Transforms ─────────────────────────────────────────────────────
      _train_tf = T.Compose([
          T.RandomResizedCrop(IMG_SIZE, scale=(0.7, 1.0)),
          T.RandomHorizontalFlip(),
          T.ColorJitter(brightness=0.3, contrast=0.3, saturation=0.2),
          T.ToTensor(),
          T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),
      ])
      _val_tf = T.Compose([
          T.Resize(IMG_SIZE + 32),
          T.CenterCrop(IMG_SIZE),
          T.ToTensor(),
          T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),
      ])

      _train_ds = ImageFolder(train_dir, transform=_train_tf)
      _val_ds   = ImageFolder(val_dir,   transform=_val_tf)
      _train_dl = DataLoader(_train_ds, batch_size=BATCH_SIZE, shuffle=True,  num_workers=4, pin_memory=True)
      _val_dl   = DataLoader(_val_ds,   batch_size=BATCH_SIZE, shuffle=False, num_workers=4, pin_memory=True)
      N_CLASSES  = len(_train_ds.classes)

      # ── Architecture ───────────────────────────────────────────────────
      class ConvBlock(nn.Module):
          def __init__(self, in_c, out_c, k=3):
              super().__init__()
              self.block = nn.Sequential(
                  nn.Conv2d(in_c, out_c, k, padding=k//2, bias=False),
                  nn.BatchNorm2d(out_c), nn.ReLU(inplace=True),
                  nn.Conv2d(out_c, out_c, k, padding=k//2, bias=False),
                  nn.BatchNorm2d(out_c), nn.ReLU(inplace=True),
                  nn.MaxPool2d(2), nn.Dropout2d(DROPOUT_C)
              )
          def forward(self, x): return self.block(x)

      class CNN(nn.Module):
          def __init__(self):
              super().__init__()
              _blocks, _in = [], 3
              for _out in N_CHANNELS:
                  _blocks.append(ConvBlock(_in, _out, KERNEL)); _in = _out
              self.features = nn.Sequential(*_blocks)
              self.pool = nn.AdaptiveAvgPool2d(1)
              self.head = nn.Sequential(
                  nn.Flatten(),
                  nn.Linear(_in, FC_HIDDEN), nn.ReLU(), nn.Dropout(DROPOUT_FC),
                  nn.Linear(FC_HIDDEN, N_CLASSES)
              )
          def forward(self, x): return self.head(self.pool(self.features(x)))

      model = CNN().to(DEVICE)
      _opt = torch.optim.AdamW(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)
      _sched = torch.optim.lr_scheduler.CosineAnnealingLR(_opt, T_max=EPOCHS)
      _criterion = nn.CrossEntropyLoss()

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_acc, _best_state = 0.0, None
      for _epoch in range(EPOCHS):
          model.train()
          _train_loss = 0.0
          for _imgs, _lbls in _train_dl:
              _imgs, _lbls = _imgs.to(DEVICE), _lbls.to(DEVICE)
              _opt.zero_grad()
              _loss = _criterion(model(_imgs), _lbls)
              _loss.backward(); _opt.step()
              _train_loss += _loss.item()
          _sched.step()

          # Validation
          model.eval()
          _all_pred, _all_true = [], []
          with torch.no_grad():
              for _imgs, _lbls in _val_dl:
                  _p = model(_imgs.to(DEVICE)).argmax(1).cpu().numpy()
                  _all_pred.extend(_p); _all_true.extend(_lbls.numpy())
          _acc = accuracy_score(_all_true, _all_pred)
          if _acc > _best_acc:
              _best_acc = _acc
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          if (_epoch + 1) % 10 == 0:
              print(f"Epoch {_epoch+1:3d} | train_loss: {_train_loss/len(_train_dl):.4f} | val_acc: {_acc:.4f}")

      model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0

      # ── Résultats finaux ───────────────────────────────────────────────
      model.eval()
      y_pred, y_true_all, y_proba_list = [], [], []
      with torch.no_grad():
          for _imgs, _lbls in _val_dl:
              _logits = model(_imgs.to(DEVICE)).cpu()
              y_proba_list.append(torch.softmax(_logits, 1).numpy())
              y_pred.extend(_logits.argmax(1).numpy())
              y_true_all.extend(_lbls.numpy())

      y_proba = np.concatenate(y_proba_list)
      y_pred  = np.array(y_pred)
      print(classification_report(y_true_all, y_pred, target_names=_train_ds.classes))
      metrics = {
          "accuracy"   : accuracy_score(y_true_all, y_pred),
          "f1_weighted": f1_score(y_true_all, y_pred, average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      feature_importances = None


  - id: transfer_learning_clf
    name: "Transfer Learning — ResNet/EfficientNet/ViT (PyTorch)"
    enabled: true
    library: torchvision
    class: torchvision.models
    category: "CNN — Transfer Learning"
    description: >
      Fine-tuning d'un modèle pré-entraîné sur ImageNet (ResNet50,
      EfficientNet-B4, Vision Transformer ViT-B/16). Deux stratégies :
      (1) Feature extraction : geler le backbone, entraîner la tête seulement.
      (2) Fine-tuning complet : débloquer progressivement le backbone avec
      un LR différentiel (tête 10× plus vite que le backbone).
      Approche recommandée en vision par ordinateur quand les données
      sont < 50k images.
    use_cases:
      - "classification d'images avec peu de données (1k–50k)"
      - "domaine proche d'ImageNet (photos naturelles)"
      - "médical, satellite, industriel — domaine shift modéré"
      - "production : meilleur rapport performance / coût"
    pros:
      - "converge beaucoup plus vite qu'un CNN from scratch"
      - "performances état de l'art avec peu de données"
      - "backbones éprouvés (ResNet, EfficientNet, ViT)"
      - "torchvision.models facilite le chargement des poids"
    cons:
      - "GPU quasi-obligatoire pour fine-tuning"
      - "taille des modèles importante (>20M paramètres)"
      - "domaine très différent d'ImageNet → fine-tuning complet requis"
    hyperparameters:
      backbone:
        type: str
        choices: ["resnet50", "efficientnet_b4", "vit_b_16", "convnext_base", "swin_b"]
        default: "resnet50"
        description: "Architecture backbone pré-entraînée."
      strategy:
        type: str
        choices: ["feature_extraction", "fine_tuning", "progressive_unfreeze"]
        default: "fine_tuning"
        description: >
          feature_extraction : backbone gelé, tête seule.
          fine_tuning : tout dégelé dès le départ.
          progressive_unfreeze : déblocage couche par couche.
      lr_head:
        type: float
        default: 1e-3
        description: "LR pour la tête de classification."
      lr_backbone:
        type: float
        default: 1e-4
        description: "LR pour le backbone (fine_tuning seulement)."
      weight_decay:
        type: float
        default: 1e-4
      dropout_head:
        type: float
        range: [0.0, 0.5]
        default: 0.3
      batch_size:
        type: int
        choices: [16, 32, 64]
        default: 32
      epochs:
        type: int
        default: 30
      label_smoothing:
        type: float
        range: [0.0, 0.2]
        default: 0.1
        description: "Régularisation via smoothing des labels cibles."
      mixup_alpha:
        type: float
        range: [0.0, 0.4]
        default: 0.2
        description: "Augmentation Mixup (0 = désactivé)."
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "top5_accuracy"]
    io_contract:
      inputs:  [train_dir, val_dir, n_classes]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      import torchvision.transforms as T
      import torchvision.models as tv_models
      from torchvision.datasets import ImageFolder
      from torch.utils.data import DataLoader
      from sklearn.metrics import accuracy_score, f1_score, classification_report

      # ── Config ─────────────────────────────────────────────────────────
      BACKBONE    = "resnet50"        # resnet50 | efficientnet_b4 | vit_b_16
      STRATEGY    = "fine_tuning"     # feature_extraction | fine_tuning
      LR_HEAD     = 1e-3
      LR_BACKBONE = 1e-4
      DROPOUT     = 0.3
      BATCH_SIZE  = 32
      EPOCHS      = 30
      LABEL_SMOOTH= 0.1
      DEVICE      = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # ── Transforms ─────────────────────────────────────────────────────
      _mean, _std = [0.485, 0.456, 0.406], [0.229, 0.224, 0.225]
      _train_tf = T.Compose([
          T.RandomResizedCrop(224), T.RandomHorizontalFlip(),
          T.TrivialAugmentWide(),   # forte augmentation standard
          T.ToTensor(), T.Normalize(_mean, _std),
      ])
      _val_tf = T.Compose([
          T.Resize(256), T.CenterCrop(224),
          T.ToTensor(), T.Normalize(_mean, _std),
      ])

      _train_ds = ImageFolder(train_dir, transform=_train_tf)
      _val_ds   = ImageFolder(val_dir,   transform=_val_tf)
      N_CLASSES = len(_train_ds.classes)
      _train_dl = DataLoader(_train_ds, batch_size=BATCH_SIZE, shuffle=True,  num_workers=4, pin_memory=True)
      _val_dl   = DataLoader(_val_ds,   batch_size=BATCH_SIZE, shuffle=False, num_workers=4, pin_memory=True)

      # ── Charger le backbone ────────────────────────────────────────────
      _weights_map = {
          "resnet50"       : tv_models.ResNet50_Weights.IMAGENET1K_V2,
          "efficientnet_b4": tv_models.EfficientNet_B4_Weights.IMAGENET1K_V1,
          "vit_b_16"       : tv_models.ViT_B_16_Weights.IMAGENET1K_V1,
      }
      model = getattr(tv_models, BACKBONE)(weights=_weights_map.get(BACKBONE))

      # ── Remplacer la tête ──────────────────────────────────────────────
      if "resnet" in BACKBONE:
          _in_feat = model.fc.in_features
          model.fc = nn.Sequential(nn.Dropout(DROPOUT), nn.Linear(_in_feat, N_CLASSES))
          _head_params    = model.fc.parameters()
          _backbone_params= [p for n, p in model.named_parameters() if "fc" not in n]
      elif "efficientnet" in BACKBONE:
          _in_feat = model.classifier[1].in_features
          model.classifier = nn.Sequential(nn.Dropout(DROPOUT), nn.Linear(_in_feat, N_CLASSES))
          _head_params    = model.classifier.parameters()
          _backbone_params= [p for n, p in model.named_parameters() if "classifier" not in n]
      elif "vit" in BACKBONE:
          _in_feat = model.heads.head.in_features
          model.heads.head = nn.Sequential(nn.Dropout(DROPOUT), nn.Linear(_in_feat, N_CLASSES))
          _head_params    = model.heads.parameters()
          _backbone_params= [p for n, p in model.named_parameters() if "heads" not in n]

      if STRATEGY == "feature_extraction":
          for p in _backbone_params: p.requires_grad = False
          _opt = torch.optim.AdamW(model.parameters(), lr=LR_HEAD)
      else:
          _opt = torch.optim.AdamW([
              {"params": _backbone_params, "lr": LR_BACKBONE},
              {"params": _head_params,     "lr": LR_HEAD},
          ], weight_decay=1e-4)

      model = model.to(DEVICE)
      _sched    = torch.optim.lr_scheduler.CosineAnnealingLR(_opt, T_max=EPOCHS)
      _criterion= nn.CrossEntropyLoss(label_smoothing=LABEL_SMOOTH)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_acc, _best_state = 0.0, None
      for _epoch in range(EPOCHS):
          model.train()
          _tl = 0.0
          for _x, _y in _train_dl:
              _x, _y = _x.to(DEVICE), _y.to(DEVICE)
              _opt.zero_grad()
              _loss = _criterion(model(_x), _y)
              _loss.backward(); _opt.step()
              _tl += _loss.item()
          _sched.step()

          model.eval()
          _preds, _trues = [], []
          with torch.no_grad():
              for _x, _y in _val_dl:
                  _preds.extend(model(_x.to(DEVICE)).argmax(1).cpu().tolist())
                  _trues.extend(_y.tolist())
          _acc = accuracy_score(_trues, _preds)
          if _acc > _best_acc:
              _best_acc = _acc
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          print(f"Epoch {_epoch+1:2d} | loss {_tl/len(_train_dl):.4f} | val_acc {_acc:.4f}")

      model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0

      # ── Résultats ──────────────────────────────────────────────────────
      model.eval()
      y_pred, y_proba_list, y_true_all = [], [], []
      with torch.no_grad():
          for _x, _y in _val_dl:
              _l = model(_x.to(DEVICE)).cpu()
              y_proba_list.append(torch.softmax(_l, 1).numpy())
              y_pred.extend(_l.argmax(1).tolist())
              y_true_all.extend(_y.tolist())

      y_proba = np.concatenate(y_proba_list)
      y_pred  = np.array(y_pred)
      print(classification_report(y_true_all, y_pred, target_names=_train_ds.classes))
      metrics = {
          "accuracy"   : accuracy_score(y_true_all, y_pred),
          "f1_weighted": f1_score(y_true_all, y_pred, average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      feature_importances = None


  # ── 3. RECURRENT NEURAL NETWORKS ────────────────────────────────────────

  - id: lstm_sequence_clf
    name: "LSTM / GRU — Classification & Régression de séquences"
    enabled: true
    library: torch
    class: torch.nn.LSTM
    category: "RNN — Séquentiel"
    description: >
      LSTM (Long Short-Term Memory) ou GRU (Gated Recurrent Unit) pour
      traiter des séquences de longueur variable. Capture les dépendances
      temporelles longues. Configurable : unidirectionnel ou bidirectionnel,
      nombre de couches, dropout. Applicable à la classification de séquences
      (sentiment, ECG, activité) et à la régression temporelle (prévision
      one-step ou multi-step). Inclut padding/masking pour séquences de
      longueur variable.
    use_cases:
      - "classification de séquences : sentiment, intention, ECG, HAR"
      - "prévision de séries temporelles multivariées (one-step ou multi-step)"
      - "détection d'anomalies dans des séquences"
      - "traduction, résumé (avant les Transformers)"
      - "séquences audio, EEG, capteurs IoT"
    pros:
      - "gestion native des dépendances temporelles longues (LSTM)"
      - "bidirectionnel : contexte futur + passé"
      - "plus rapide que les Transformers sur courtes séquences"
      - "well-understood : nombreux exemples et tutoriels"
    cons:
      - "difficile à paralléliser (séquentiel par nature)"
      - "sur-apprend sur très longues séquences vs Transformers"
      - "gradient vanishing/exploding sans clipping"
      - "remplacé par Transformers pour NLP en 2023+"
    hyperparameters:
      rnn_type:
        type: str
        choices: ["LSTM", "GRU"]
        default: "LSTM"
        description: "LSTM gère mieux les longues dépendances ; GRU est plus rapide."
      hidden_size:
        type: int
        range: [32, 512]
        default: 128
        description: "Taille de l'état caché à chaque timestep."
      num_layers:
        type: int
        range: [1, 4]
        default: 2
        description: "Nombre de couches RNN empilées."
      bidirectional:
        type: bool
        default: false
        description: "True → état caché final = concat des 2 directions (×2 paramètres)."
      dropout:
        type: float
        range: [0.0, 0.5]
        default: 0.3
        description: "Dropout entre les couches RNN (ignoré si num_layers=1)."
      fc_hidden:
        type: int
        default: 64
      lr:
        type: float
        default: 1e-3
      clip_grad_norm:
        type: float
        default: 1.0
        description: "Clipping du gradient pour éviter l'explosion."
      batch_size:
        type: int
        default: 128
      epochs:
        type: int
        default: 50
      task:
        type: str
        choices: ["classification", "regression_onestep", "regression_multistep"]
        default: "classification"
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "rmse"]
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
      notes:   "X_train shape : (n_samples, seq_len, n_features). y shape : (n_samples,) pour clf."
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import LabelEncoder
      from sklearn.metrics import (classification_report, accuracy_score,
                                   f1_score, roc_auc_score, mean_squared_error)

      # ── Config ─────────────────────────────────────────────────────────
      RNN_TYPE    = "LSTM"          # "LSTM" ou "GRU"
      HIDDEN_SIZE = 128
      NUM_LAYERS  = 2
      BIDIR       = False
      DROPOUT     = 0.3
      FC_HIDDEN   = 64
      LR          = 1e-3
      CLIP        = 1.0
      BATCH_SIZE  = 128
      EPOCHS      = 50
      TASK        = "classification"  # ou "regression_onestep"
      DEVICE      = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # ── Préparation ────────────────────────────────────────────────────
      # X_train : (n, seq_len, n_feat) ; y_train : (n,)
      _X_tr = torch.tensor(np.array(X_train, dtype=np.float32))
      _X_te = torch.tensor(np.array(X_test,  dtype=np.float32))

      if TASK == "classification":
          _le   = LabelEncoder()
          _y_tr = torch.tensor(_le.fit_transform(y_train), dtype=torch.long)
          N_OUT = len(_le.classes_)
          _criterion = nn.CrossEntropyLoss()
      else:
          _y_tr = torch.tensor(np.array(y_train, dtype=np.float32)).unsqueeze(1)
          N_OUT = 1
          _criterion = nn.MSELoss()

      _loader = DataLoader(TensorDataset(_X_tr, _y_tr),
                           batch_size=BATCH_SIZE, shuffle=True)

      # ── Architecture ───────────────────────────────────────────────────
      class RNNModel(nn.Module):
          def __init__(self, in_feat, hidden, layers, bidir, drop, fc_h, n_out, rnn_type):
              super().__init__()
              _RNN = nn.LSTM if rnn_type == "LSTM" else nn.GRU
              self.rnn = _RNN(in_feat, hidden, layers,
                              batch_first=True, bidirectional=bidir,
                              dropout=drop if layers > 1 else 0.0)
              _d = 2 if bidir else 1
              self.head = nn.Sequential(
                  nn.LayerNorm(hidden * _d),
                  nn.Dropout(drop),
                  nn.Linear(hidden * _d, fc_h), nn.ReLU(),
                  nn.Linear(fc_h, n_out)
              )
          def forward(self, x):
              _out, _ = self.rnn(x)
              return self.head(_out[:, -1, :])  # dernier timestep

      model = RNNModel(
          _X_tr.shape[2], HIDDEN_SIZE, NUM_LAYERS, BIDIR,
          DROPOUT, FC_HIDDEN, N_OUT, RNN_TYPE
      ).to(DEVICE)

      _opt = torch.optim.Adam(model.parameters(), lr=LR)
      _sched = torch.optim.lr_scheduler.ReduceLROnPlateau(_opt, patience=5, factor=0.5)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      for _epoch in range(EPOCHS):
          model.train()
          _tl = 0.0
          for _xb, _yb in _loader:
              _xb, _yb = _xb.to(DEVICE), _yb.to(DEVICE)
              _opt.zero_grad()
              _loss = _criterion(model(_xb), _yb)
              _loss.backward()
              nn.utils.clip_grad_norm_(model.parameters(), CLIP)
              _opt.step()
              _tl += _loss.item()
          _sched.step(_tl)
          if (_epoch + 1) % 10 == 0:
              print(f"Epoch {_epoch+1:3d} | loss: {_tl/len(_loader):.5f}")
      fit_time_s = time.perf_counter() - _t0

      # ── Inférence ──────────────────────────────────────────────────────
      model.eval()
      with torch.no_grad():
          _logits = model(_X_te.to(DEVICE)).cpu()

      if TASK == "classification":
          y_proba = torch.softmax(_logits, 1).numpy()
          y_pred  = _le.inverse_transform(y_proba.argmax(axis=1))
          _is_bin = N_OUT == 2
          metrics = {
              "accuracy"   : accuracy_score(y_test, y_pred),
              "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
              "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_bin else y_proba,
                                            multi_class="ovr", average="weighted"),
              "fit_time_s" : fit_time_s,
          }
          print(classification_report(y_test, y_pred))
      else:
          y_pred = _logits.squeeze(1).numpy(); y_proba = None
          metrics = {
              "rmse": float(np.sqrt(mean_squared_error(y_test, y_pred))),
              "fit_time_s": fit_time_s,
          }
      feature_importances = None


  # ── 4. TRANSFORMERS ─────────────────────────────────────────────────────

  - id: transformer_sequence_clf
    name: "Transformer Encoder — Classification de séquences"
    enabled: true
    library: torch
    class: torch.nn.TransformerEncoder
    category: "Transformer — Séquentiel"
    description: >
      Encoder Transformer from scratch pour la classification de séquences.
      Architecture : Embedding (ou projection linéaire) → Positional Encoding
      → N blocs Transformer (Multi-Head Self-Attention + FFN + LayerNorm)
      → pooling → tête de classification. Idéal pour des séquences de
      tokens (NLP, génomique, logs) ou de features continues (séries
      temporelles multivariées). Gère les masques de padding.
      Concurrent au LSTM mais meilleur pour longues dépendances.
    use_cases:
      - "classification de texte from scratch (tokens)"
      - "séries temporelles multivariées longues (>100 timesteps)"
      - "génomique : séquences ADN/protéines"
      - "logs et événements séquentiels"
      - "quand les LSTM saturent sur très longues séquences"
    pros:
      - "parallélisable (contrairement aux RNN)"
      - "capture des dépendances longue portée efficacement"
      - "attention interprétable : visualiser les poids"
      - "extensible : bert-style pretraining possible"
    cons:
      - "complexité O(n²) en longueur de séquence"
      - "nécessite plus de données que les LSTM"
      - "GPU fortement recommandé"
    hyperparameters:
      d_model:
        type: int
        choices: [64, 128, 256, 512]
        default: 128
        description: "Dimension interne du Transformer (embedding dim)."
      n_heads:
        type: int
        choices: [2, 4, 8, 16]
        default: 4
        description: "Nombre de têtes d'attention (d_model divisible par n_heads)."
      n_layers:
        type: int
        range: [1, 12]
        default: 4
        description: "Nombre de blocs Transformer encoder."
      d_ff:
        type: int
        default: 256
        description: "Dimension de la couche feed-forward (généralement 2×–4× d_model)."
      dropout:
        type: float
        range: [0.0, 0.5]
        default: 0.1
      max_seq_len:
        type: int
        default: 512
        description: "Longueur maximale de séquence pour le positional encoding."
      pooling:
        type: str
        choices: ["cls_token", "mean", "last"]
        default: "mean"
        description: "Stratégie d'agrégation des sorties pour la classification."
      lr:
        type: float
        default: 3e-4
      warmup_steps:
        type: int
        default: 500
        description: "Pas de warmup du scheduler (linear warmup → cosine decay)."
      batch_size:
        type: int
        default: 64
      epochs:
        type: int
        default: 50
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
      notes:   "X : (n_samples, seq_len, n_features) pour features continues."
    code_template: |
      import time
      import math
      import numpy as np
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import LabelEncoder
      from sklearn.metrics import (accuracy_score, f1_score,
                                   roc_auc_score, classification_report)

      # ── Config ─────────────────────────────────────────────────────────
      D_MODEL    = 128
      N_HEADS    = 4
      N_LAYERS   = 4
      D_FF       = 256
      DROPOUT    = 0.1
      POOLING    = "mean"         # "cls_token" | "mean" | "last"
      LR         = 3e-4
      WARMUP     = 500
      BATCH_SIZE = 64
      EPOCHS     = 50
      DEVICE     = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      _X_tr = torch.tensor(np.array(X_train, dtype=np.float32))
      _X_te = torch.tensor(np.array(X_test,  dtype=np.float32))
      _le   = LabelEncoder()
      _y_tr = torch.tensor(_le.fit_transform(y_train), dtype=torch.long)
      N_CLS = len(_le.classes_)
      N_FEAT= _X_tr.shape[2]

      _loader = DataLoader(TensorDataset(_X_tr, _y_tr), batch_size=BATCH_SIZE, shuffle=True)

      # ── Positional Encoding sinusoïdal ─────────────────────────────────
      class PositionalEncoding(nn.Module):
          def __init__(self, d_model, max_len=2048, dropout=0.1):
              super().__init__()
              self.drop = nn.Dropout(dropout)
              _pe  = torch.zeros(max_len, d_model)
              _pos = torch.arange(0, max_len, dtype=torch.float).unsqueeze(1)
              _div = torch.exp(torch.arange(0, d_model, 2).float() * (-math.log(10000.0) / d_model))
              _pe[:, 0::2] = torch.sin(_pos * _div)
              _pe[:, 1::2] = torch.cos(_pos * _div)
              self.register_buffer("pe", _pe.unsqueeze(0))
          def forward(self, x):
              return self.drop(x + self.pe[:, :x.size(1)])

      # ── Architecture ───────────────────────────────────────────────────
      class SeqTransformer(nn.Module):
          def __init__(self, n_feat, d_model, n_heads, n_layers, d_ff, dropout, n_cls, pooling):
              super().__init__()
              self.pooling = pooling
              self.proj = nn.Linear(n_feat, d_model)
              if pooling == "cls_token":
                  self.cls_token = nn.Parameter(torch.zeros(1, 1, d_model))
              self.pe  = PositionalEncoding(d_model, dropout=dropout)
              _enc_layer = nn.TransformerEncoderLayer(
                  d_model=d_model, nhead=n_heads, dim_feedforward=d_ff,
                  dropout=dropout, activation="gelu", batch_first=True, norm_first=True
              )
              self.encoder = nn.TransformerEncoder(_enc_layer, num_layers=n_layers,
                                                   norm=nn.LayerNorm(d_model))
              self.head = nn.Sequential(
                  nn.LayerNorm(d_model), nn.Dropout(dropout),
                  nn.Linear(d_model, n_cls)
              )
          def forward(self, x):
              x = self.pe(self.proj(x))
              if self.pooling == "cls_token":
                  _cls = self.cls_token.expand(x.size(0), -1, -1)
                  x = torch.cat([_cls, x], dim=1)
              x = self.encoder(x)
              if   self.pooling == "cls_token": x = x[:, 0]
              elif self.pooling == "mean":       x = x.mean(dim=1)
              else:                              x = x[:, -1]
              return self.head(x)

      model = SeqTransformer(N_FEAT, D_MODEL, N_HEADS, N_LAYERS,
                             D_FF, DROPOUT, N_CLS, POOLING).to(DEVICE)

      _opt = torch.optim.AdamW(model.parameters(), lr=LR, weight_decay=1e-2)
      # Scheduler : warmup linéaire → cosine decay
      def _lr_fn(step):
          if step < WARMUP: return step / max(1, WARMUP)
          _prog = (step - WARMUP) / max(1, EPOCHS * len(_loader) - WARMUP)
          return max(0.0, 0.5 * (1.0 + math.cos(math.pi * _prog)))
      _sched = torch.optim.lr_scheduler.LambdaLR(_opt, _lr_fn)
      _criterion = nn.CrossEntropyLoss()

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_loss, _no_improve, _step = float("inf"), 0, 0
      for _epoch in range(EPOCHS):
          model.train()
          _tl = 0.0
          for _xb, _yb in _loader:
              _xb, _yb = _xb.to(DEVICE), _yb.to(DEVICE)
              _opt.zero_grad()
              _loss = _criterion(model(_xb), _yb)
              _loss.backward()
              nn.utils.clip_grad_norm_(model.parameters(), 1.0)
              _opt.step(); _sched.step(); _step += 1
              _tl += _loss.item()
          if (_epoch+1) % 10 == 0:
              print(f"Epoch {_epoch+1:3d} | loss {_tl/len(_loader):.4f} | lr {_sched.get_last_lr()[0]:.2e}")
      fit_time_s = time.perf_counter() - _t0

      model.eval()
      with torch.no_grad():
          _logits = model(_X_te.to(DEVICE)).cpu()
      y_proba = torch.softmax(_logits, 1).numpy()
      y_pred  = _le.inverse_transform(y_proba.argmax(1))
      _is_bin = N_CLS == 2
      metrics = {
          "accuracy"   : accuracy_score(y_test, y_pred),
          "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
          "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_bin else y_proba,
                                        multi_class="ovr", average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      print(classification_report(y_test, y_pred))
      feature_importances = None


  - id: huggingface_text_clf
    name: "HuggingFace BERT/RoBERTa — Fine-tuning texte"
    enabled: true
    library: transformers
    class: transformers.AutoModelForSequenceClassification
    category: "Transformer — NLP Fine-tuning"
    description: >
      Fine-tuning d'un modèle pré-entraîné HuggingFace (BERT, RoBERTa,
      CamemBERT pour le français, DeBERTa, DistilBERT) sur une tâche de
      classification de texte. Utilise le Trainer API pour simplifier la
      boucle d'entraînement. Tokenizer inclus. Supporte classification
      binaire et multi-classe. État de l'art pour toutes les tâches NLP
      standard (sentiment, intent, topic, NLI, QA reformulée en clf).
    use_cases:
      - "analyse de sentiment (avis clients, réseaux sociaux)"
      - "classification d'intention (chatbots)"
      - "classification de documents (juridique, médical, financier)"
      - "NLI : Natural Language Inference"
      - "détection de haine, désinformation, spam"
      - "tout texte court (<512 tokens) → BERT standard"
    pros:
      - "état de l'art absolu en classification de texte"
      - "fine-tuning rapide avec peu de données (100–1000 exemples)"
      - "CamemBERT/XLM-R pour le français et le multilingue"
      - "HuggingFace Trainer : mixed precision, gradient accumulation"
    cons:
      - "GPU obligatoire pour fine-tuning en temps raisonnable"
      - "textes > 512 tokens → tronqués (utiliser Longformer sinon)"
      - "modèles lourds (110M–900M paramètres)"
      - "latence d'inférence élevée sans distillation"
    hyperparameters:
      model_name:
        type: str
        choices: ["bert-base-uncased", "roberta-base", "camembert-base",
                  "microsoft/deberta-v3-base", "distilbert-base-uncased",
                  "xlm-roberta-base"]
        default: "camembert-base"
        description: "Identifiant HuggingFace Hub du modèle pré-entraîné."
      max_length:
        type: int
        range: [64, 512]
        default: 256
        description: "Longueur maximale de tokenisation (tokens)."
      lr:
        type: float
        range: [1e-5, 5e-5]
        default: 2e-5
        description: "Learning rate pour AdamW. Généralement 1e-5 à 5e-5 pour BERT."
      weight_decay:
        type: float
        default: 0.01
      warmup_ratio:
        type: float
        range: [0.0, 0.2]
        default: 0.06
        description: "Fraction des steps totaux utilisés pour le warmup."
      batch_size:
        type: int
        choices: [8, 16, 32]
        default: 16
      epochs:
        type: int
        range: [2, 10]
        default: 4
        description: "3–5 epochs suffisent en général. Attention au sur-apprentissage."
      fp16:
        type: bool
        default: true
        description: "Mixed precision 16-bit (requiert GPU compatible)."
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "matthews_correlation"]
    io_contract:
      inputs:  [texts_train, texts_test, y_train, y_test]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      from datasets import Dataset
      from transformers import (AutoTokenizer, AutoModelForSequenceClassification,
                                Trainer, TrainingArguments, DataCollatorWithPadding)
      from sklearn.metrics import (accuracy_score, f1_score,
                                   classification_report, roc_auc_score)
      from sklearn.preprocessing import LabelEncoder
      import torch

      # ── Config ─────────────────────────────────────────────────────────
      MODEL_NAME  = "camembert-base"   # ou "bert-base-uncased", "distilbert-base-uncased"
      MAX_LENGTH  = 256
      LR          = 2e-5
      BATCH_SIZE  = 16
      EPOCHS      = 4
      FP16        = torch.cuda.is_available()

      # ── Tokenizer + dataset ────────────────────────────────────────────
      _le = LabelEncoder()
      _y_tr = _le.fit_transform(y_train).tolist()
      _y_te = _le.transform(y_test).tolist()
      N_CLS = len(_le.classes_)

      tokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)

      def _tokenize(batch):
          return tokenizer(batch["text"], truncation=True,
                           padding=False, max_length=MAX_LENGTH)

      _ds_train = Dataset.from_dict({"text": list(texts_train), "label": _y_tr})
      _ds_test  = Dataset.from_dict({"text": list(texts_test),  "label": _y_te})
      _ds_train = _ds_train.map(_tokenize, batched=True, remove_columns=["text"])
      _ds_test  = _ds_test.map(_tokenize,  batched=True, remove_columns=["text"])

      # ── Modèle ─────────────────────────────────────────────────────────
      model = AutoModelForSequenceClassification.from_pretrained(
          MODEL_NAME, num_labels=N_CLS,
          id2label={i: l for i, l in enumerate(_le.classes_)},
          label2id={l: i for i, l in enumerate(_le.classes_)},
      )

      # ── Métriques ──────────────────────────────────────────────────────
      def _compute_metrics(eval_pred):
          _logits, _labels = eval_pred
          _preds = _logits.argmax(-1)
          return {
              "accuracy"   : float(accuracy_score(_labels, _preds)),
              "f1_weighted": float(f1_score(_labels, _preds, average="weighted")),
          }

      # ── TrainingArguments ──────────────────────────────────────────────
      _args = TrainingArguments(
          output_dir      = "./hf_clf_output",
          num_train_epochs= EPOCHS,
          per_device_train_batch_size= BATCH_SIZE,
          per_device_eval_batch_size = BATCH_SIZE * 2,
          learning_rate   = LR,
          weight_decay    = 0.01,
          warmup_ratio    = 0.06,
          lr_scheduler_type= "cosine",
          fp16            = FP16,
          evaluation_strategy= "epoch",
          save_strategy   = "epoch",
          load_best_model_at_end= True,
          metric_for_best_model = "f1_weighted",
          logging_steps   = 50,
          report_to       = "none",
          seed            = 42,
      )

      _t0 = time.perf_counter()
      trainer = Trainer(
          model=model,
          args=_args,
          train_dataset=_ds_train,
          eval_dataset=_ds_test,
          tokenizer=tokenizer,
          data_collator=DataCollatorWithPadding(tokenizer),
          compute_metrics=_compute_metrics,
      )
      trainer.train()
      fit_time_s = time.perf_counter() - _t0

      # ── Inférence ──────────────────────────────────────────────────────
      _preds_out = trainer.predict(_ds_test)
      _logits    = _preds_out.predictions
      y_proba    = torch.softmax(torch.tensor(_logits), dim=-1).numpy()
      y_pred     = _le.inverse_transform(_logits.argmax(-1))

      print(classification_report(y_test, y_pred, target_names=_le.classes_))
      _is_bin = N_CLS == 2
      metrics = {
          "accuracy"   : accuracy_score(y_test, y_pred),
          "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
          "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_bin else y_proba,
                                        multi_class="ovr", average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      feature_importances = None


  # ── 5. AUTOENCODERS ─────────────────────────────────────────────────────

  - id: autoencoder_reconstruction
    name: "Autoencoder — Reconstruction & Compression (PyTorch)"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "Autoencoder — Non-supervisé"
    description: >
      Réseau encodeur-décodeur symétrique qui apprend à reconstruire
      l'entrée via un goulot d'étranglement (espace latent). Usages :
      (1) détection d'anomalies par erreur de reconstruction,
      (2) compression non-linéaire,
      (3) débruitage (denoising autoencoder),
      (4) pré-entraînement non-supervisé de représentations.
      L'espace latent peut être visualisé via PCA ou UMAP pour explorer
      la structure des données.
    use_cases:
      - "détection d'anomalies : erreur de reconstruction > seuil = anomalie"
      - "compression d'images ou de features"
      - "débruitage de données tabulaires ou d'images"
      - "initialisation de poids pour un réseau supervisé"
      - "exploration non-supervisée de la structure latente"
    pros:
      - "non-supervisé : pas de labels nécessaires"
      - "espace latent interprétable (réduction de dim non-linéaire)"
      - "flexible : architecture configurable"
      - "denoising variant très robuste"
    cons:
      - "pas de contrôle sur l'espace latent (→ VAE pour ça)"
      - "évaluation difficile sans labels"
      - "tendance à mémoriser sur petits datasets"
    hyperparameters:
      latent_dim:
        type: int
        range: [2, 256]
        default: 32
        description: "Dimension de l'espace latent. Petit → forte compression."
      encoder_dims:
        type: list
        default: "[256, 128, 64]"
        description: "Tailles des couches de l'encodeur (décodeur = symétrique)."
      activation:
        type: str
        choices: ["relu", "gelu", "leaky_relu"]
        default: "relu"
      dropout:
        type: float
        range: [0.0, 0.5]
        default: 0.1
      noise_factor:
        type: float
        range: [0.0, 0.5]
        default: 0.0
        description: "Bruit gaussien ajouté à l'entrée (denoising AE si > 0)."
      lr:
        type: float
        default: 1e-3
      batch_size:
        type: int
        default: 256
      epochs:
        type: int
        default: 100
      anomaly_percentile:
        type: float
        range: [90, 99]
        default: 95
        description: "Percentile des erreurs de reconstruction pour le seuil d'anomalie."
    eval_metrics: ["reconstruction_mse", "anomaly_roc_auc", "latent_quality"]
    io_contract:
      inputs:  [X_train, feature_names]
      inputs_optional: [X_test, y_true_anomaly]
      outputs: [model, anomaly_scores, anomaly_labels, metrics, fit_time_s, X_latent]
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import StandardScaler

      # ── Config ─────────────────────────────────────────────────────────
      LATENT_DIM   = 32
      ENCODER_DIMS = [256, 128, 64]
      DROPOUT      = 0.1
      NOISE_FACTOR = 0.0          # > 0 → Denoising AE
      LR           = 1e-3
      BATCH_SIZE   = 256
      EPOCHS       = 100
      ANOMALY_PCT  = 95
      DEVICE       = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # ── Préparation ────────────────────────────────────────────────────
      _scaler = StandardScaler()
      _X = torch.tensor(_scaler.fit_transform(X_train), dtype=torch.float32)
      _loader = DataLoader(TensorDataset(_X), batch_size=BATCH_SIZE, shuffle=True)
      IN_DIM = _X.shape[1]

      # ── Architecture ───────────────────────────────────────────────────
      class Autoencoder(nn.Module):
          def __init__(self, in_dim, enc_dims, latent_dim, drop):
              super().__init__()
              # Encodeur
              _layers, _prev = [], in_dim
              for d in enc_dims:
                  _layers += [nn.Linear(_prev, d), nn.BatchNorm1d(d),
                               nn.ReLU(), nn.Dropout(drop)]
                  _prev = d
              _layers.append(nn.Linear(_prev, latent_dim))
              self.encoder = nn.Sequential(*_layers)
              # Décodeur (symétrique)
              _layers, _prev = [], latent_dim
              for d in reversed(enc_dims):
                  _layers += [nn.Linear(_prev, d), nn.BatchNorm1d(d),
                               nn.ReLU(), nn.Dropout(drop)]
                  _prev = d
              _layers.append(nn.Linear(_prev, in_dim))
              self.decoder = nn.Sequential(*_layers)
          def forward(self, x):
              return self.decoder(self.encoder(x))
          def encode(self, x):
              return self.encoder(x)

      model = Autoencoder(IN_DIM, ENCODER_DIMS, LATENT_DIM, DROPOUT).to(DEVICE)
      _opt = torch.optim.Adam(model.parameters(), lr=LR)
      _sched = torch.optim.lr_scheduler.CosineAnnealingLR(_opt, T_max=EPOCHS)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      for _epoch in range(EPOCHS):
          model.train(); _tl = 0.0
          for (batch,) in _loader:
              batch = batch.to(DEVICE)
              if NOISE_FACTOR > 0:
                  _noisy = batch + NOISE_FACTOR * torch.randn_like(batch)
              else:
                  _noisy = batch
              _recon = model(_noisy)
              _loss  = nn.functional.mse_loss(_recon, batch)
              _opt.zero_grad(); _loss.backward(); _opt.step()
              _tl += _loss.item()
          _sched.step()
          if (_epoch + 1) % 20 == 0:
              print(f"Epoch {_epoch+1:3d} | MSE: {_tl/len(_loader):.6f}")
      fit_time_s = time.perf_counter() - _t0

      # ── Erreurs de reconstruction & anomalies ─────────────────────────
      model.eval()
      _X_all = torch.tensor(_scaler.transform(
          X_test if "X_test" in dir() and X_test is not None else X_train
      ), dtype=torch.float32)

      with torch.no_grad():
          _recon = model(_X_all.to(DEVICE)).cpu()
          X_latent = model.encode(_X_all.to(DEVICE)).cpu().numpy()

      anomaly_scores = (((_X_all - _recon) ** 2).mean(dim=1)).numpy()
      _thresh = np.percentile(anomaly_scores, ANOMALY_PCT)
      anomaly_labels = (anomaly_scores > _thresh).astype(int)

      metrics = {
          "reconstruction_mse": float(anomaly_scores.mean()),
          "n_anomalies"       : int(anomaly_labels.sum()),
          "threshold"         : float(_thresh),
          "fit_time_s"        : fit_time_s,
      }
      if "y_true_anomaly" in dir() and y_true_anomaly is not None:
          from sklearn.metrics import roc_auc_score
          metrics["roc_auc"] = float(roc_auc_score(y_true_anomaly, anomaly_scores))
          print(f"AUC anomalie : {metrics['roc_auc']:.4f}")
      print(f"Reconstruction MSE : {metrics['reconstruction_mse']:.6f}")
      print(f"Anomalies (>{ANOMALY_PCT}e pct) : {metrics['n_anomalies']}")
      feature_importances = None


  - id: vae
    name: "Variational Autoencoder (VAE) — Génération & espace latent structuré"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "Autoencoder — Génératif"
    description: >
      Le VAE est un autoencoder génératif qui contraint l'espace latent
      à suivre une distribution gaussienne N(0,I) via la reparametrization
      trick et une loss KL-divergence. Contrairement à l'AE classique,
      le VAE permet de (1) générer de nouveaux échantillons par sampling,
      (2) interpoler de manière lisse dans l'espace latent, (3) capturer
      des représentations continues et régulières. Applicable à des images
      (conv VAE) ou des données tabulaires.
    use_cases:
      - "génération de données synthétiques (augmentation de dataset)"
      - "espace latent structuré pour l'exploration de données"
      - "anomaly detection via ELBO score"
      - "interpolation entre exemples (morphing)"
      - "disentanglement de facteurs latents (β-VAE)"
    pros:
      - "génération de nouveaux échantillons cohérents"
      - "espace latent continu et interpolable"
      - "base théorique solide (ELBO = reconstruction + KL)"
      - "β-VAE pour le disentanglement"
    cons:
      - "images générées légèrement floues vs GAN"
      - "balance reconstruction/KL délicate (β)"
      - "espace latent difficile à interpréter sans supervision"
    hyperparameters:
      latent_dim:
        type: int
        range: [2, 128]
        default: 16
        description: "Dimension de l'espace latent Z ~ N(μ, σ²)."
      encoder_dims:
        type: list
        default: "[256, 128]"
      beta:
        type: float
        range: [0.1, 10.0]
        default: 1.0
        description: "Poids de la KL divergence (β=1 → VAE standard, β>1 → β-VAE disentangled)."
      lr:
        type: float
        default: 1e-3
      batch_size:
        type: int
        default: 256
      epochs:
        type: int
        default: 100
    eval_metrics: ["elbo", "reconstruction_loss", "kl_divergence", "fid_score"]
    io_contract:
      inputs:  [X_train, feature_names]
      outputs: [model, X_latent_mu, X_generated, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      import torch.nn.functional as F
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import StandardScaler

      # ── Config ─────────────────────────────────────────────────────────
      LATENT_DIM   = 16
      ENCODER_DIMS = [256, 128]
      BETA         = 1.0     # β-VAE : augmenter pour plus de disentanglement
      LR           = 1e-3
      BATCH_SIZE   = 256
      EPOCHS       = 100
      DEVICE       = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      _scaler = StandardScaler()
      _X = torch.tensor(_scaler.fit_transform(X_train), dtype=torch.float32)
      _loader = DataLoader(TensorDataset(_X), batch_size=BATCH_SIZE, shuffle=True)
      IN_DIM = _X.shape[1]

      # ── Architecture VAE ───────────────────────────────────────────────
      class VAE(nn.Module):
          def __init__(self, in_dim, enc_dims, latent_dim):
              super().__init__()
              _enc, _prev = [], in_dim
              for d in enc_dims:
                  _enc += [nn.Linear(_prev, d), nn.BatchNorm1d(d), nn.ReLU()]
                  _prev = d
              self.encoder_body = nn.Sequential(*_enc)
              self.fc_mu  = nn.Linear(_prev, latent_dim)
              self.fc_log_var = nn.Linear(_prev, latent_dim)
              # Décodeur
              _dec, _prev = [], latent_dim
              for d in reversed(enc_dims):
                  _dec += [nn.Linear(_prev, d), nn.BatchNorm1d(d), nn.ReLU()]
                  _prev = d
              _dec.append(nn.Linear(_prev, in_dim))
              self.decoder = nn.Sequential(*_dec)

          def encode(self, x):
              h = self.encoder_body(x)
              return self.fc_mu(h), self.fc_log_var(h)

          def reparameterize(self, mu, log_var):
              if self.training:
                  std = torch.exp(0.5 * log_var)
                  return mu + std * torch.randn_like(std)
              return mu

          def decode(self, z):
              return self.decoder(z)

          def forward(self, x):
              mu, log_var = self.encode(x)
              z = self.reparameterize(mu, log_var)
              return self.decode(z), mu, log_var

      def vae_loss(recon, x, mu, log_var, beta=1.0):
          _recon_loss = F.mse_loss(recon, x, reduction="sum") / x.size(0)
          _kl = -0.5 * torch.mean(1 + log_var - mu.pow(2) - log_var.exp())
          return _recon_loss + beta * _kl, _recon_loss.item(), _kl.item()

      model = VAE(IN_DIM, ENCODER_DIMS, LATENT_DIM).to(DEVICE)
      _opt  = torch.optim.Adam(model.parameters(), lr=LR)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _hist = {"elbo": [], "recon": [], "kl": []}
      for _epoch in range(EPOCHS):
          model.train(); _te, _tr, _tk = 0.0, 0.0, 0.0
          for (batch,) in _loader:
              batch = batch.to(DEVICE)
              _recon, _mu, _lv = model(batch)
              _loss, _r, _k = vae_loss(_recon, batch, _mu, _lv, BETA)
              _opt.zero_grad(); _loss.backward(); _opt.step()
              _te += _loss.item(); _tr += _r; _tk += _k
          _hist["elbo"].append(_te / len(_loader))
          _hist["recon"].append(_tr / len(_loader))
          _hist["kl"].append(_tk / len(_loader))
          if (_epoch + 1) % 20 == 0:
              print(f"Epoch {_epoch+1:3d} | ELBO: {_te/len(_loader):.4f} "
                    f"| Recon: {_tr/len(_loader):.4f} | KL: {_tk/len(_loader):.4f}")
      fit_time_s = time.perf_counter() - _t0

      # ── Espace latent & génération ─────────────────────────────────────
      model.eval()
      with torch.no_grad():
          _mu, _lv = model.encode(_X.to(DEVICE))
          X_latent_mu = _mu.cpu().numpy()
          # Générer de nouveaux échantillons
          _z = torch.randn(len(X_train), LATENT_DIM).to(DEVICE)
          X_generated = _scaler.inverse_transform(model.decode(_z).cpu().numpy())

      metrics = {
          "final_elbo"  : float(_hist["elbo"][-1]),
          "final_recon" : float(_hist["recon"][-1]),
          "final_kl"    : float(_hist["kl"][-1]),
          "fit_time_s"  : fit_time_s,
      }
      print(metrics)
      y_pred = y_proba = feature_importances = None


