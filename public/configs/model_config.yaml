  - id: kaplan_meier
    name: "Kaplan-Meier"
    enabled: true
    library: lifelines
    class: lifelines.KaplanMeierFitter
    category: "Survie — Non-Paramétrique"
    description: "Estimateur non-paramétrique de la fonction de survie. Standard pour la visualisation de survie."
    use_cases: ["analyse de churn", "durée de vie client", "études cliniques", "time-to-event"]
    pros: ["simple", "aucune hypothèse distributionnelle", "visualisation claire", "intervalles de confiance"]
    cons: ["univarié", "pas de covariables"]
    hyperparameters: {}
    eval_metrics: ["log_rank_test", "median_survival_time"]
    code_template: |
      from lifelines import KaplanMeierFitter
      from lifelines.statistics import logrank_test
      import matplotlib.pyplot as plt

      # durations : temps jusqu'à l'événement ou censure
      # events    : 1 si événement observé, 0 si censuré
      kmf = KaplanMeierFitter()
      kmf.fit(durations, event_observed=events, label="Global")
      kmf.plot_survival_function(ci_show=True)
      plt.title("Courbe de survie Kaplan-Meier")
      plt.xlabel("Temps"); plt.ylabel("P(survie)")
      plt.show()
      print(f"Médiane de survie : {kmf.median_survival_time_:.2f}")

      # Comparaison de 2 groupes
      mask_A = groups == "A"
      kmf_A = KaplanMeierFitter().fit(durations[mask_A], events[mask_A], label="Groupe A")
      kmf_B = KaplanMeierFitter().fit(durations[~mask_A], events[~mask_A], label="Groupe B")
      ax = kmf_A.plot_survival_function()
      kmf_B.plot_survival_function(ax=ax)
      plt.show()

      result = logrank_test(durations[mask_A], durations[~mask_A],
                             events[mask_A], events[~mask_A])
      print(f"Log-rank p-value : {result.p_value:.4f}")

  - id: cox_ph
    name: "Cox Proportional Hazards"
    enabled: true
    library: lifelines
    class: lifelines.CoxPHFitter
    category: "Survie — Semi-Paramétrique"
    description: "Modèle de régression de survie avec covariables. Standard en analyse de survie multivariée."
    use_cases: ["effet des covariables sur le risque", "prédiction de survie personnalisée"]
    pros: ["interprétable (hazard ratios)", "gère les censures", "standard médical et churn"]
    cons: ["hypothèse de risques proportionnels", "feature engineering nécessaire"]
    hyperparameters:
      penalizer: [0, 0.1, 0.5, 1.0]
      l1_ratio: [0, 0.5, 1.0]
    eval_metrics: ["concordance_index", "log_likelihood", "AIC"]
    code_template: |
      from lifelines import CoxPHFitter
      import pandas as pd

      # df doit contenir : durée (col_duration), événement (col_event) + covariables
      df_survival = df.copy()  # colonnes : duration, event, feature1, feature2, ...

      cph = CoxPHFitter(penalizer=0.1, l1_ratio=0.0)
      cph.fit(df_survival, duration_col="duration", event_col="event",
              show_progress=True)
      cph.print_summary()

      # Concordance index
      print(f"C-index : {cph.concordance_index_:.4f}")

      # Prédiction de survie pour un individu
      X_new = pd.DataFrame([{"feature1": 42, "feature2": 0.3}])
      survival_func = cph.predict_survival_function(X_new)
      survival_func.plot(title="Survie prédite")

