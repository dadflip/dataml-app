  - id: train_cnn_image_clf
    name: "Entraînement — CNN from scratch (classification d'images)"
    enabled: true
    library: torch
    category: "CNN — Vision"
    applies_to: ["image_classification"]
    description: >
      CNN PyTorch configurable avec blocs Conv2d→BN→ReLU→MaxPool.
      Early stopping sur val_acc. Courbes de perte et accuracy.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.metrics import accuracy_score

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_CHANNELS    = [32, 64, 128, 256]
      KERNEL        = 3
      FC_HIDDEN     = 512
      DROPOUT_C     = 0.25
      DROPOUT_FC    = 0.5
      LR            = 1e-3
      WEIGHT_DECAY  = 1e-4
      BATCH_SIZE    = 64
      EPOCHS        = 50
      PATIENCE      = 10
      DEVICE        = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      meta["model_id"] = "cnn_image_clf"
      print(f"Device : {DEVICE}")

      # ── Architecture ───────────────────────────────────────────────────
      class ConvBlock(nn.Module):
          def __init__(self, in_c, out_c, k=3):
              super().__init__()
              self.block = nn.Sequential(
                  nn.Conv2d(in_c, out_c, k, padding=k//2, bias=False),
                  nn.BatchNorm2d(out_c), nn.ReLU(inplace=True),
                  nn.Conv2d(out_c, out_c, k, padding=k//2, bias=False),
                  nn.BatchNorm2d(out_c), nn.ReLU(inplace=True),
                  nn.MaxPool2d(2), nn.Dropout2d(DROPOUT_C))
          def forward(self, x): return self.block(x)

      class CNN(nn.Module):
          def __init__(self, n_classes):
              super().__init__()
              _blocks, _in = [], images_train.shape[-1]
              for _out in N_CHANNELS:
                  _blocks.append(ConvBlock(_in, _out, KERNEL)); _in = _out
              self.features = nn.Sequential(*_blocks)
              self.pool = nn.AdaptiveAvgPool2d(1)
              self.head = nn.Sequential(
                  nn.Flatten(),
                  nn.Linear(_in, FC_HIDDEN), nn.ReLU(), nn.Dropout(DROPOUT_FC),
                  nn.Linear(FC_HIDDEN, n_classes))
          def forward(self, x): return self.head(self.pool(self.features(x)))

      model = CNN(n_classes).to(DEVICE)
      _opt  = torch.optim.AdamW(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)
      _sch  = torch.optim.lr_scheduler.CosineAnnealingLR(_opt, T_max=EPOCHS)
      _crit = nn.CrossEntropyLoss()

      # DataLoaders (depuis contrat vision)
      _tr_t = torch.from_numpy(images_train).permute(0, 3, 1, 2).float()
      _te_t = torch.from_numpy(images_test).permute(0, 3, 1, 2).float()
      _tr_l = torch.from_numpy(labels_train).long()
      _te_l = torch.from_numpy(labels_test).long()
      _dl_tr = (dl_train if dl_train else
                DataLoader(TensorDataset(_tr_t, _tr_l),
                           batch_size=BATCH_SIZE, shuffle=True,
                           num_workers=4, pin_memory=True))

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_acc, _best_state = 0.0, None
      _tr_losses, _va_losses, _accs = [], [], []
      _no_imp = 0

      for _ep in range(EPOCHS):
          model.train(); _tl = 0.0
          for _imgs, _lbls in _dl_tr:
              _imgs, _lbls = _imgs.to(DEVICE), _lbls.to(DEVICE)
              _opt.zero_grad()
              _loss = _crit(model(_imgs), _lbls)
              _loss.backward(); _opt.step()
              _tl += _loss.item()
          _tl /= len(_dl_tr)
          _tr_losses.append(_tl)
          _sch.step()

          # Validation
          model.eval()
          _preds = []
          with torch.no_grad():
              _va_t2 = _te_t if not dl_test else None
              if dl_test:
                  for _imgs, _ in dl_test:
                      _preds.extend(model(_imgs.to(DEVICE)).argmax(1).cpu().tolist())
              else:
                  _preds = model(_te_t.to(DEVICE)).argmax(1).cpu().tolist()
          _acc = accuracy_score(labels_test, _preds)
          _accs.append(_acc)
          if _acc > _best_acc:
              _best_acc = _acc; _no_imp = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_imp += 1
          if _no_imp >= PATIENCE:
              print(f"Early stop epoch {_ep+1}"); break
          if (_ep+1) % 10 == 0:
              print(f"Epoch {_ep+1:3d} | loss={_tl:.4f} | val_acc={_acc:.4f}")

      if _best_state: model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s | Best acc={_best_acc:.4f}")

      # Inférence
      model.eval()
      _all_logits = []
      with torch.no_grad():
          if dl_test:
              for _imgs, _ in dl_test:
                  _all_logits.append(model(_imgs.to(DEVICE)).cpu())
              _logits = torch.cat(_all_logits)
          else:
              _logits = model(_te_t.to(DEVICE)).cpu()
      y_proba = torch.softmax(_logits, 1).numpy()
      y_pred  = _logits.argmax(1).numpy()
      feature_importances = None

      # Visualisation
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      axes[0].plot(_tr_losses, color="#1D9E75", linewidth=1.5, label="Train loss")
      axes[0].set_xlabel("Époque"); axes[0].set_ylabel("CrossEntropy")
      axes[0].set_title("CNN — Courbe de perte"); axes[0].legend(); axes[0].grid(alpha=0.3)
      axes[1].plot(_accs, color="#D85A30", linewidth=1.5)
      best_ep = int(np.argmax(_accs))
      axes[1].axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                      label=f"Best ({best_ep+1}): {_best_acc:.4f}")
      axes[1].set_xlabel("Époque"); axes[1].set_ylabel("Val Accuracy")
      axes[1].set_title("CNN — Val Accuracy"); axes[1].legend(); axes[1].grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig("training_cnn_vision.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : [],
          "val_accuracy"    : _accs,
          "metrics_per_epoch": [{"val_acc": a} for a in _accs],
          "fit_time_s"      : fit_time_s,
          "best_epoch"      : best_ep + 1,
          "best_val_acc"    : _best_acc,
      }
      full_pipeline = {
          "preprocessor" : None,
          "model"        : model,
          "model_config" : {"n_channels": N_CHANNELS, "n_classes": n_classes,
                            "img_shape": img_shape},
          "class_names"  : class_names,
          "feature_names_in": [],
          "task_type"    : task_type,
          "training_history": training_history,
          "meta"         : meta,
      }
      print(f"CNN Vision | y_pred shape={y_pred.shape}")

  - id: train_transfer_learning
    name: "Entraînement — Transfer Learning ResNet/EfficientNet/ViT"
    enabled: true
    library: torchvision
    category: "CNN — Transfer Learning"
    applies_to: ["image_classification"]
    description: >
      Fine-tuning backbone pré-entraîné ImageNet.
      Feature extraction ou fine-tuning complet avec LR différentiel.
      Early stopping sur val_acc. Courbes de loss + accuracy.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      import torch.nn as nn
      import torchvision.models as tv_models
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.metrics import accuracy_score

      # ── Hyperparamètres ────────────────────────────────────────────────
      BACKBONE     = "resnet50"      # "resnet50"|"efficientnet_b4"|"vit_b_16"
      STRATEGY     = "fine_tuning"   # "feature_extraction"|"fine_tuning"
      LR_HEAD      = 1e-3
      LR_BACKBONE  = 1e-4
      DROPOUT      = 0.3
      WEIGHT_DECAY = 1e-4
      BATCH_SIZE   = 32
      EPOCHS       = 30
      PATIENCE     = 7
      LABEL_SMOOTH = 0.1
      DEVICE       = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      meta["model_id"] = f"transfer_{BACKBONE}"
      print(f"Backbone : {BACKBONE} | Device : {DEVICE}")

      # ── Chargement backbone ───────────────────────────────────────────
      _weights_map = {
          "resnet50"       : tv_models.ResNet50_Weights.IMAGENET1K_V2,
          "efficientnet_b4": tv_models.EfficientNet_B4_Weights.IMAGENET1K_V1,
          "vit_b_16"       : tv_models.ViT_B_16_Weights.IMAGENET1K_V1,
      }
      _backbone = getattr(tv_models, BACKBONE)(
          weights=_weights_map.get(BACKBONE))

      # Remplacement de la tête
      if "resnet" in BACKBONE:
          _in_feat = _backbone.fc.in_features
          _backbone.fc = nn.Sequential(nn.Dropout(DROPOUT),
                                        nn.Linear(_in_feat, n_classes))
          _head_params     = list(_backbone.fc.parameters())
          _backbone_params = [p for n, p in _backbone.named_parameters()
                               if "fc" not in n]
      elif "efficientnet" in BACKBONE:
          _in_feat = _backbone.classifier[1].in_features
          _backbone.classifier = nn.Sequential(nn.Dropout(DROPOUT),
                                                nn.Linear(_in_feat, n_classes))
          _head_params     = list(_backbone.classifier.parameters())
          _backbone_params = [p for n, p in _backbone.named_parameters()
                               if "classifier" not in n]
      elif "vit" in BACKBONE:
          _in_feat = _backbone.heads.head.in_features
          _backbone.heads.head = nn.Sequential(nn.Dropout(DROPOUT),
                                                nn.Linear(_in_feat, n_classes))
          _head_params     = list(_backbone.heads.parameters())
          _backbone_params = [p for n, p in _backbone.named_parameters()
                               if "heads" not in n]

      if STRATEGY == "feature_extraction":
          for p in _backbone_params: p.requires_grad = False
          _opt = torch.optim.AdamW(filter(lambda p: p.requires_grad,
                                           _backbone.parameters()),
                                   lr=LR_HEAD, weight_decay=WEIGHT_DECAY)
      else:
          _opt = torch.optim.AdamW([
              {"params": _backbone_params, "lr": LR_BACKBONE},
              {"params": _head_params,     "lr": LR_HEAD},
          ], weight_decay=WEIGHT_DECAY)

      model = _backbone.to(DEVICE)
      _sch  = torch.optim.lr_scheduler.CosineAnnealingLR(_opt, T_max=EPOCHS)
      _crit = nn.CrossEntropyLoss(label_smoothing=LABEL_SMOOTH)

      # DataLoaders
      _tr_t = torch.from_numpy(images_train).permute(0, 3, 1, 2).float()
      _te_t = torch.from_numpy(images_test).permute(0, 3, 1, 2).float()
      _dl_tr = (dl_train if dl_train else
                DataLoader(TensorDataset(_tr_t,
                                         torch.from_numpy(labels_train).long()),
                           batch_size=BATCH_SIZE, shuffle=True,
                           num_workers=4, pin_memory=True))

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_acc, _best_state = 0.0, None
      _tr_losses, _accs = [], []
      _no_imp = 0

      for _ep in range(EPOCHS):
          model.train(); _tl = 0.0
          for _imgs, _lbls in _dl_tr:
              _imgs, _lbls = _imgs.to(DEVICE), _lbls.to(DEVICE)
              _opt.zero_grad()
              _loss = _crit(model(_imgs), _lbls)
              _loss.backward(); _opt.step()
              _tl += _loss.item()
          _tl /= len(_dl_tr)
          _tr_losses.append(_tl)
          _sch.step()

          model.eval()
          _preds = []
          with torch.no_grad():
              if dl_test:
                  for _imgs, _ in dl_test:
                      _preds.extend(model(_imgs.to(DEVICE)).argmax(1).cpu().tolist())
              else:
                  _preds = model(_te_t.to(DEVICE)).argmax(1).cpu().tolist()
          _acc = accuracy_score(labels_test, _preds)
          _accs.append(_acc)
          if _acc > _best_acc:
              _best_acc = _acc; _no_imp = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_imp += 1
          if _no_imp >= PATIENCE:
              print(f"Early stop epoch {_ep+1}"); break
          print(f"Epoch {_ep+1:2d} | loss={_tl:.4f} | val_acc={_acc:.4f}")

      if _best_state: model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s | Best acc={_best_acc:.4f}")

      model.eval()
      _all_l = []
      with torch.no_grad():
          if dl_test:
              for _imgs, _ in dl_test:
                  _all_l.append(model(_imgs.to(DEVICE)).cpu())
              _logits = torch.cat(_all_l)
          else:
              _logits = model(_te_t.to(DEVICE)).cpu()
      y_proba = torch.softmax(_logits, 1).numpy()
      y_pred  = _logits.argmax(1).numpy()
      feature_importances = None

      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      axes[0].plot(_tr_losses, color="#1D9E75", linewidth=1.5)
      axes[0].set_title(f"{BACKBONE} — Train Loss"); axes[0].grid(alpha=0.3)
      axes[1].plot(_accs, color="#D85A30", linewidth=1.5)
      best_ep = int(np.argmax(_accs))
      axes[1].axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                      label=f"Best ({_best_acc:.4f})")
      axes[1].set_title(f"{BACKBONE} — Val Accuracy")
      axes[1].legend(); axes[1].grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig(f"training_{BACKBONE}.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : [],
          "val_accuracy"    : _accs,
          "metrics_per_epoch": [{"val_acc": a} for a in _accs],
          "fit_time_s"      : fit_time_s,
          "best_epoch"      : best_ep + 1,
          "best_val_acc"    : _best_acc,
      }
      full_pipeline = {
          "preprocessor" : None,
          "model"        : model,
          "backbone"     : BACKBONE,
          "strategy"     : STRATEGY,
          "class_names"  : class_names,
          "model_config" : {"backbone": BACKBONE, "n_classes": n_classes,
                            "img_shape": img_shape},
          "feature_names_in": [],
          "task_type"    : task_type,
          "training_history": training_history,
          "meta"         : meta,
      }
      print(f"Transfer Learning | y_pred shape={y_pred.shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION H — RÉSEAUX DE NEURONES SÉQUENTIELS
# ══════════════════════════════════════════════════════════════════════════

neural_networks_sequence:

  - id: train_lstm_gru
    name: "Entraînement — LSTM / GRU (classification & régression de séquences)"
    enabled: true
    library: torch
    category: "RNN — Séquentiel"
    applies_to: ["text_classification", "timeseries_classification",
                 "timeseries_forecasting", "audio_classification"]
    description: >
      LSTM ou GRU bidirectionnel configurable.
      Early stopping sur val_loss. Courbes de perte.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import LabelEncoder
      from sklearn.model_selection import train_test_split

      # ── Hyperparamètres ────────────────────────────────────────────────
      TASK        = "classification"    # "classification" | "regression"
      RNN_TYPE    = "LSTM"              # "LSTM" | "GRU"
      HIDDEN_SIZE = 128
      NUM_LAYERS  = 2
      BIDIR       = False
      DROPOUT_RNN = 0.3
      FC_HIDDEN   = 64
      LR          = 1e-3
      CLIP        = 1.0
      BATCH_SIZE  = 128
      EPOCHS      = 50
      PATIENCE    = 10
      VAL_FRACTION= 0.1
      DEVICE      = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      meta["model_id"] = f"{RNN_TYPE.lower()}_{TASK}"
      print(f"Device : {DEVICE}")

      _X_tr = torch.tensor(np.array(sequences_train, dtype=np.float32))
      _X_te = torch.tensor(np.array(sequences_test,  dtype=np.float32))

      if TASK == "classification":
          _le   = LabelEncoder()
          _y_tr = torch.tensor(_le.fit_transform(labels_train), dtype=torch.long)
          N_OUT = len(_le.classes_)
          _crit = nn.CrossEntropyLoss()
      else:
          _le   = None
          _y_tr = torch.tensor(np.array(labels_train, dtype=np.float32)).unsqueeze(1)
          N_OUT = 1
          _crit = nn.MSELoss()

      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr.numpy(), _y_tr.numpy(), test_size=VAL_FRACTION, random_state=42)
      _X_tr2, _X_val = torch.tensor(_X_tr2), torch.tensor(_X_val)
      _y_tr2, _y_val = torch.tensor(_y_tr2), torch.tensor(_y_val)
      _dl_tr = DataLoader(TensorDataset(_X_tr2, _y_tr2),
                          batch_size=BATCH_SIZE, shuffle=True)

      # ── Architecture ───────────────────────────────────────────────────
      class RNNModel(nn.Module):
          def __init__(self, in_feat, hidden, layers, bidir, drop, fc_h, n_out, rnn_t):
              super().__init__()
              _RNN = nn.LSTM if rnn_t == "LSTM" else nn.GRU
              self.rnn = _RNN(in_feat, hidden, layers, batch_first=True,
                              bidirectional=bidir,
                              dropout=drop if layers > 1 else 0.0)
              _d = 2 if bidir else 1
              self.head = nn.Sequential(
                  nn.LayerNorm(hidden * _d), nn.Dropout(drop),
                  nn.Linear(hidden * _d, fc_h), nn.ReLU(),
                  nn.Linear(fc_h, n_out))
          def forward(self, x):
              _out, _ = self.rnn(x)
              return self.head(_out[:, -1, :])

      N_FEAT = _X_tr.shape[2]
      model  = RNNModel(N_FEAT, HIDDEN_SIZE, NUM_LAYERS, BIDIR,
                         DROPOUT_RNN, FC_HIDDEN, N_OUT, RNN_TYPE).to(DEVICE)
      _opt  = torch.optim.Adam(model.parameters(), lr=LR)
      _sch  = torch.optim.lr_scheduler.ReduceLROnPlateau(_opt, patience=5, factor=0.5)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_val_loss, _no_imp = float("inf"), 0
      _best_state = None
      _tr_losses, _va_losses = [], []

      for _ep in range(EPOCHS):
          model.train(); _tl = 0.0
          for _xb, _yb in _dl_tr:
              _xb, _yb = _xb.to(DEVICE), _yb.to(DEVICE)
              _opt.zero_grad()
              _loss = _crit(model(_xb), _yb)
              _loss.backward()
              nn.utils.clip_grad_norm_(model.parameters(), CLIP)
              _opt.step(); _tl += _loss.item()
          _tl /= len(_dl_tr)
          _tr_losses.append(_tl)

          model.eval()
          with torch.no_grad():
              _va_out  = model(_X_val.to(DEVICE)).cpu()
              _va_loss = _crit(_va_out, _y_val).item()
          _va_losses.append(_va_loss)
          _sch.step(_va_loss)

          if _va_loss < _best_val_loss - 1e-6:
              _best_val_loss = _va_loss; _no_imp = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_imp += 1
          if _no_imp >= PATIENCE:
              print(f"Early stop epoch {_ep+1}"); break
          if (_ep+1) % 10 == 0:
              print(f"Epoch {_ep+1:3d} | train={_tl:.5f} | val={_va_loss:.5f}")

      if _best_state: model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      model.eval()
      with torch.no_grad():
          _logits = model(_X_te.to(DEVICE)).cpu()

      if TASK == "classification":
          y_proba = torch.softmax(_logits, 1).numpy()
          y_pred  = _le.inverse_transform(_logits.argmax(1).numpy())
      else:
          y_pred  = _logits.squeeze(1).numpy()
          y_proba = None
      feature_importances = None

      fig, ax = plt.subplots(figsize=(10, 5))
      ax.plot(_tr_losses, color="#1D9E75", linewidth=1.5, label="Train")
      ax.plot(_va_losses, color="#D85A30", linestyle="--", linewidth=1.5, label="Val")
      best_ep = int(np.argmin(_va_losses))
      ax.axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                 label=f"Best ({best_ep+1}): {_best_val_loss:.5f}")
      ax.set_xlabel("Époque"); ax.set_ylabel("Loss")
      ax.set_title(f"{RNN_TYPE} — Courbes de perte")
      ax.legend(); ax.grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig(f"training_{RNN_TYPE.lower()}.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : _va_losses,
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
          "best_epoch"      : best_ep + 1,
          "best_val_loss"   : _best_val_loss,
      }
      full_pipeline = {
          "preprocessor" : preprocessor,
          "model"        : model,
          "label_encoder": _le,
          "model_config" : {"rnn_type": RNN_TYPE, "hidden_size": HIDDEN_SIZE,
                            "num_layers": NUM_LAYERS, "n_out": N_OUT,
                            "n_feat": N_FEAT, "task": TASK},
          "feature_names_in": [],
          "task_type"    : task_type,
          "training_history": training_history,
          "meta"         : meta,
      }
      print(f"{RNN_TYPE} | y_pred shape={np.array(y_pred).shape}")

  - id: train_transformer_sequence
    name: "Entraînement — Transformer Encoder (classification de séquences)"
    enabled: true
    library: torch
    category: "Transformer — Séquentiel"
    applies_to: ["text_classification", "timeseries_classification",
                 "audio_classification"]
    description: >
      Transformer encoder from scratch avec positional encoding sinusoïdal,
      warmup scheduler et early stopping.
    code_template: |
      import time, math
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import LabelEncoder
      from sklearn.model_selection import train_test_split

      # ── Hyperparamètres ────────────────────────────────────────────────
      D_MODEL    = 128
      N_HEADS    = 4
      N_LAYERS   = 4
      D_FF       = 256
      DROPOUT    = 0.1
      POOLING    = "mean"       # "cls_token" | "mean" | "last"
      LR         = 3e-4
      WARMUP     = 500
      BATCH_SIZE = 64
      EPOCHS     = 50
      PATIENCE   = 10
      VAL_FRACTION = 0.1
      DEVICE     = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      meta["model_id"] = "transformer_sequence_clf"
      print(f"Device : {DEVICE}")

      _X_tr = torch.tensor(np.array(sequences_train, dtype=np.float32))
      _X_te = torch.tensor(np.array(sequences_test,  dtype=np.float32))
      _le   = LabelEncoder()
      _y_tr = torch.tensor(_le.fit_transform(labels_train), dtype=torch.long)
      N_CLS = len(_le.classes_)
      N_FEAT= _X_tr.shape[2]

      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr.numpy(), _y_tr.numpy(), test_size=VAL_FRACTION, random_state=42)
      _X_tr2, _X_val = torch.tensor(_X_tr2), torch.tensor(_X_val)
      _y_tr2, _y_val = torch.tensor(_y_tr2), torch.tensor(_y_val)
      _dl_tr = DataLoader(TensorDataset(_X_tr2, _y_tr2),
                          batch_size=BATCH_SIZE, shuffle=True)

      # ── Architecture ───────────────────────────────────────────────────
      class PositionalEncoding(nn.Module):
          def __init__(self, d_model, max_len=2048, dropout=0.1):
              super().__init__()
              self.drop = nn.Dropout(dropout)
              _pe  = torch.zeros(max_len, d_model)
              _pos = torch.arange(0, max_len, dtype=torch.float).unsqueeze(1)
              _div = torch.exp(torch.arange(0, d_model, 2).float()
                               * (-math.log(10000.0) / d_model))
              _pe[:, 0::2] = torch.sin(_pos * _div)
              _pe[:, 1::2] = torch.cos(_pos * _div)
              self.register_buffer("pe", _pe.unsqueeze(0))
          def forward(self, x):
              return self.drop(x + self.pe[:, :x.size(1)])

      class SeqTransformer(nn.Module):
          def __init__(self, n_feat, d_model, n_heads, n_layers,
                       d_ff, dropout, n_cls, pooling):
              super().__init__()
              self.pooling = pooling
              self.proj = nn.Linear(n_feat, d_model)
              if pooling == "cls_token":
                  self.cls_token = nn.Parameter(torch.zeros(1, 1, d_model))
              self.pe = PositionalEncoding(d_model, dropout=dropout)
              _enc_layer = nn.TransformerEncoderLayer(
                  d_model=d_model, nhead=n_heads, dim_feedforward=d_ff,
                  dropout=dropout, activation="gelu",
                  batch_first=True, norm_first=True)
              self.encoder = nn.TransformerEncoder(
                  _enc_layer, num_layers=n_layers,
                  norm=nn.LayerNorm(d_model))
              self.head = nn.Sequential(
                  nn.LayerNorm(d_model), nn.Dropout(dropout),
                  nn.Linear(d_model, n_cls))
          def forward(self, x):
              x = self.pe(self.proj(x))
              if self.pooling == "cls_token":
                  _cls = self.cls_token.expand(x.size(0), -1, -1)
                  x    = torch.cat([_cls, x], dim=1)
              x = self.encoder(x)
              if   self.pooling == "cls_token": x = x[:, 0]
              elif self.pooling == "mean":       x = x.mean(dim=1)
              else:                              x = x[:, -1]
              return self.head(x)

      model = SeqTransformer(N_FEAT, D_MODEL, N_HEADS, N_LAYERS,
                              D_FF, DROPOUT, N_CLS, POOLING).to(DEVICE)
      _opt  = torch.optim.AdamW(model.parameters(), lr=LR, weight_decay=1e-2)
      _total_steps = EPOCHS * len(_dl_tr)
      def _lr_fn(step):
          if step < WARMUP: return step / max(1, WARMUP)
          prog = (step - WARMUP) / max(1, _total_steps - WARMUP)
          return max(0.0, 0.5 * (1.0 + math.cos(math.pi * prog)))
      _sch  = torch.optim.lr_scheduler.LambdaLR(_opt, _lr_fn)
      _crit = nn.CrossEntropyLoss()

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_val, _no_imp = float("inf"), 0
      _best_state = None
      _tr_losses, _va_losses = [], []
      _step = 0

      for _ep in range(EPOCHS):
          model.train(); _tl = 0.0
          for _xb, _yb in _dl_tr:
              _xb, _yb = _xb.to(DEVICE), _yb.to(DEVICE)
              _opt.zero_grad()
              _loss = _crit(model(_xb), _yb)
              _loss.backward()
              nn.utils.clip_grad_norm_(model.parameters(), 1.0)
              _opt.step(); _sch.step(); _step += 1
              _tl += _loss.item()
          _tl /= len(_dl_tr)
          _tr_losses.append(_tl)

          model.eval()
          with torch.no_grad():
              _va_out  = model(_X_val.to(DEVICE)).cpu()
              _va_loss = _crit(_va_out, _y_val).item()
          _va_losses.append(_va_loss)

          if _va_loss < _best_val - 1e-6:
              _best_val = _va_loss; _no_imp = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_imp += 1
          if _no_imp >= PATIENCE:
              print(f"Early stop epoch {_ep+1}"); break
          if (_ep+1) % 10 == 0:
              print(f"Epoch {_ep+1:3d} | train={_tl:.5f} | val={_va_loss:.5f} "
                    f"| lr={_sch.get_last_lr()[0]:.2e}")

      if _best_state: model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      model.eval()
      with torch.no_grad():
          _logits = model(_X_te.to(DEVICE)).cpu()
      y_proba = torch.softmax(_logits, 1).numpy()
      y_pred  = _le.inverse_transform(_logits.argmax(1).numpy())
      feature_importances = None

      fig, ax = plt.subplots(figsize=(10, 5))
      ax.plot(_tr_losses, color="#1D9E75", linewidth=1.5, label="Train")
      ax.plot(_va_losses, color="#D85A30", linestyle="--", linewidth=1.5, label="Val")
      best_ep = int(np.argmin(_va_losses))
      ax.axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                 label=f"Best ({best_ep+1}): {_best_val:.5f}")
      ax.set_xlabel("Époque"); ax.set_ylabel("Loss")
      ax.set_title("Transformer — Courbes de perte")
      ax.legend(); ax.grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig("training_transformer_seq.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : _va_losses,
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
          "best_epoch"      : best_ep + 1,
          "best_val_loss"   : _best_val,
      }
      full_pipeline = {
          "preprocessor" : preprocessor,
          "model"        : model,
          "label_encoder": _le,
          "model_config" : {"d_model": D_MODEL, "n_heads": N_HEADS,
                            "n_layers": N_LAYERS, "n_cls": N_CLS,
                            "n_feat": N_FEAT, "pooling": POOLING},
          "feature_names_in": [],
          "task_type"    : task_type,
          "training_history": training_history,
          "meta"         : meta,
      }
      print(f"Transformer | y_pred shape={np.array(y_pred).shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION I — NLP (FINE-TUNING HUGGINGFACE)
# ══════════════════════════════════════════════════════════════════════════

nlp:

  - id: train_huggingface_text_clf
    name: "Entraînement — HuggingFace BERT/RoBERTa/CamemBERT (fine-tuning)"
    enabled: true
    library: transformers
    category: "Transformer — NLP Fine-tuning"
    applies_to: ["text_classification", "nlp"]
    description: >
      Fine-tuning via HuggingFace Trainer API.
      Visualisation des métriques par époque et de la loss.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      from datasets import Dataset
      from transformers import (AutoTokenizer, AutoModelForSequenceClassification,
                                Trainer, TrainingArguments, DataCollatorWithPadding)
      from sklearn.preprocessing import LabelEncoder
      from sklearn.metrics import accuracy_score, f1_score

      # ── Hyperparamètres ────────────────────────────────────────────────
      MODEL_NAME   = "camembert-base"    # "bert-base-uncased" | "roberta-base"
      MAX_LENGTH   = 256
      LR           = 2e-5
      BATCH_SIZE   = 16
      EPOCHS       = 4
      WARMUP_RATIO = 0.06
      FP16         = torch.cuda.is_available()
      meta["model_id"] = f"hf_{MODEL_NAME.replace('/', '_')}"

      # Séparation textes / labels
      if len(texts_train) == 0:
          # Fallback : X contient les textes
          _texts_tr = [str(t) for t in X_train.ravel()] if hasattr(X_train, "ravel") \
                      else [str(t) for t in X_train]
          _texts_te = [str(t) for t in X_test.ravel()] if hasattr(X_test, "ravel") \
                      else [str(t) for t in X_test]
      else:
          _texts_tr = list(texts_train)
          _texts_te = list(texts_test)

      _le = LabelEncoder()
      _y_tr = _le.fit_transform(y_train).tolist()
      _y_te = _le.transform(y_test).tolist()
      N_CLS = len(_le.classes_)

      tokenizer = AutoTokenizer.from_pretrained(MODEL_NAME)
      def _tokenize(batch):
          return tokenizer(batch["text"], truncation=True,
                           padding=False, max_length=MAX_LENGTH)

      _ds_tr = Dataset.from_dict({"text": _texts_tr, "label": _y_tr})
      _ds_te = Dataset.from_dict({"text": _texts_te, "label": _y_te})
      _ds_tr = _ds_tr.map(_tokenize, batched=True, remove_columns=["text"])
      _ds_te = _ds_te.map(_tokenize, batched=True, remove_columns=["text"])

      model = AutoModelForSequenceClassification.from_pretrained(
          MODEL_NAME, num_labels=N_CLS,
          id2label={i: l for i, l in enumerate(_le.classes_)},
          label2id={l: i for i, l in enumerate(_le.classes_)})

      _log_history = []
      def _compute_metrics(eval_pred):
          _logits, _labels = eval_pred
          _preds = _logits.argmax(-1)
          _acc   = float(accuracy_score(_labels, _preds))
          _f1    = float(f1_score(_labels, _preds, average="weighted"))
          _log_history.append({"accuracy": _acc, "f1_weighted": _f1})
          return {"accuracy": _acc, "f1_weighted": _f1}

      _args = TrainingArguments(
          output_dir="./hf_training_output",
          num_train_epochs=EPOCHS,
          per_device_train_batch_size=BATCH_SIZE,
          per_device_eval_batch_size=BATCH_SIZE * 2,
          learning_rate=LR,
          weight_decay=0.01,
          warmup_ratio=WARMUP_RATIO,
          lr_scheduler_type="cosine",
          fp16=FP16,
          evaluation_strategy="epoch",
          save_strategy="epoch",
          load_best_model_at_end=True,
          metric_for_best_model="f1_weighted",
          logging_steps=50,
          report_to="none",
          seed=42,
      )

      _t0 = time.perf_counter()
      trainer = Trainer(
          model=model,
          args=_args,
          train_dataset=_ds_tr,
          eval_dataset=_ds_te,
          tokenizer=tokenizer,
          data_collator=DataCollatorWithPadding(tokenizer),
          compute_metrics=_compute_metrics,
      )
      trainer.train()
      fit_time_s = time.perf_counter() - _t0
      print(f"Fine-tuning terminé en {fit_time_s:.2f}s")

      # Inférence
      _preds_out = trainer.predict(_ds_te)
      _logits    = _preds_out.predictions
      y_proba    = torch.softmax(torch.tensor(_logits), dim=-1).numpy()
      y_pred     = _le.inverse_transform(_logits.argmax(-1))
      feature_importances = None

      # Visualisation métriques
      _tr_log = [e for e in trainer.state.log_history if "loss" in e]
      _tr_loss = [e["loss"] for e in _tr_log if "loss" in e]
      _ev_log  = [e for e in trainer.state.log_history if "eval_loss" in e]
      _va_loss = [e["eval_loss"] for e in _ev_log]
      _ep_acc  = [e.get("eval_f1_weighted", e.get("eval_accuracy", None))
                  for e in _ev_log]

      if _tr_loss:
          fig, axes = plt.subplots(1, 2, figsize=(14, 5))
          axes[0].plot(_tr_loss, color="#1D9E75", linewidth=1.5, label="Train loss")
          if _va_loss:
              axes[0].plot(np.linspace(0, len(_tr_loss)-1, len(_va_loss)),
                           _va_loss, color="#D85A30", linestyle="--",
                           linewidth=2, label="Val loss")
          axes[0].set_title(f"HF {MODEL_NAME} — Loss")
          axes[0].legend(); axes[0].grid(alpha=0.3)
          if _ep_acc:
              axes[1].plot([x for x in _ep_acc if x is not None],
                           marker="o", color="#1D9E75", linewidth=2)
              axes[1].set_title("Val F1 / Accuracy par époque")
              axes[1].grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig(f"training_hf_{MODEL_NAME.replace('/', '_')}.png",
                      dpi=120, bbox_inches="tight")
          plt.show()

      training_history = {
          "loss_curve"      : _tr_loss,
          "val_loss_curve"  : _va_loss,
          "metrics_per_epoch": _log_history,
          "fit_time_s"      : fit_time_s,
      }
      full_pipeline = {
          "preprocessor" : None,
          "model"        : model,
          "tokenizer"    : tokenizer,
          "label_encoder": _le,
          "model_name"   : MODEL_NAME,
          "feature_names_in": [],
          "task_type"    : task_type,
          "training_history": training_history,
          "meta"         : meta,
      }
      meta["hf_model_name"] = MODEL_NAME
      print(f"HF Fine-tuning | y_pred shape={np.array(y_pred).shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION J — SURVIE
# ══════════════════════════════════════════════════════════════════════════

survival:

  - id: train_cox_ph
    name: "Entraînement — Cox Proportional Hazards (lifelines)"
    enabled: true
    library: lifelines
    category: "Analyse de Survie"
    applies_to: ["survival"]
    description: >
      Modèle de Cox PH avec vérification de l'hypothèse des risques
      proportionnels (log-log plots et test de Schoenfeld).
      Visualisation des coefficients et des courbes de survie par groupe.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from lifelines import CoxPHFitter

      # ── Hyperparamètres ────────────────────────────────────────────────
      PENALIZER    = 0.1   # régularisation ridge
      L1_RATIO     = 0.0   # 0=ridge, 1=lasso
      STEP_SIZE    = 0.95
      meta["model_id"] = "cox_ph"

      # df_survival doit contenir les colonnes durée + événement + covariables
      _dur_col = meta.get("duration_col", "duration")
      _evt_col = meta.get("event_col",    "event")

      _df_tr = df_survival.copy() if df_survival is not None else pd.concat(
          [pd.DataFrame(np.array(X_train), columns=feature_names_out),
           pd.DataFrame({_dur_col: durations.values[:len(X_train)],
                         _evt_col: events.values[:len(X_train)]})], axis=1)

      _t0 = time.perf_counter()
      model = CoxPHFitter(penalizer=PENALIZER, l1_ratio=L1_RATIO)
      model.fit(_df_tr, duration_col=_dur_col, event_col=_evt_col,
                step_size=STEP_SIZE)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      model.print_summary()

      # Prédictions
      _df_te = pd.DataFrame(np.array(X_test), columns=feature_names_out)
      y_pred  = model.predict_partial_hazard(_df_te).values
      y_proba = None

      # Visualisation coefficients
      fig, ax = plt.subplots(figsize=(10, max(5, len(feature_names_out) * 0.4)))
      model.plot(ax=ax)
      ax.set_title("Cox PH — Coefficients (hazard ratio)")
      plt.tight_layout()
      plt.savefig("training_cox_coefs.png", dpi=120, bbox_inches="tight")
      plt.show()

      # Vérification risques proportionnels
      try:
          model.check_assumptions(_df_tr, quiet=False)
      except Exception as e:
          print(f"check_assumptions : {e}")

      feature_importances = pd.Series(
          model.params_.values, index=model.params_.index
      ).abs().sort_values(ascending=False)

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "concordance_index": model.concordance_index_,
          "log_likelihood"   : model.log_likelihood_,
      }
      print(f"C-index : {model.concordance_index_:.4f}")
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"Cox PH | y_pred shape={y_pred.shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION K — GRAPH NEURAL NETWORKS
# ══════════════════════════════════════════════════════════════════════════

graph_neural_networks:

  - id: train_gnn_node_clf
    name: "Entraînement — GNN (GCN/GAT/GraphSAGE) classification de nœuds"
    enabled: true
    library: torch_geometric
    category: "GNN — Graph Learning"
    applies_to: ["node_classification", "graph"]
    description: >
      GAT/GCN/GraphSAGE sur PyTorch Geometric.
      Early stopping sur val_acc. Courbes de perte et accuracy par époque.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      import torch.nn.functional as F
      from torch_geometric.nn import GCNConv, GATConv, SAGEConv
      from sklearn.metrics import accuracy_score

      # ── Hyperparamètres ────────────────────────────────────────────────
      MODEL_TYPE   = "GAT"    # "GCN" | "GAT" | "GraphSAGE"
      HIDDEN       = 128
      N_LAYERS     = 3
      HEADS        = 4        # GAT uniquement
      DROPOUT      = 0.5
      LR           = 5e-3
      WEIGHT_DECAY = 5e-4
      EPOCHS       = 200
      PATIENCE     = 30
      DEVICE       = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      meta["model_id"] = f"gnn_{MODEL_TYPE.lower()}"

      # data = torch_geometric.data.Data (contrat Bloc 2)
      data = data.to(DEVICE)
      N_FEAT = data.x.shape[1]
      N_CLS  = int(data.y.max().item()) + 1

      # ── Architecture ───────────────────────────────────────────────────
      class GNN(torch.nn.Module):
          def __init__(self, in_f, hidden, n_cls, n_layers, heads, drop, mtype):
              super().__init__()
              self.drop = drop
              self.convs = torch.nn.ModuleList()
              _prev = in_f
              for i in range(n_layers):
                  _is_last = (i == n_layers - 1)
                  if mtype == "GCN":
                      _out = n_cls if _is_last else hidden
                      self.convs.append(GCNConv(_prev, _out)); _prev = _out
                  elif mtype == "GAT":
                      if _is_last:
                          self.convs.append(GATConv(
                              _prev * heads if i > 0 else _prev,
                              n_cls, heads=1, concat=False, dropout=drop))
                          _prev = n_cls
                      else:
                          self.convs.append(GATConv(_prev, hidden, heads=heads,
                                                     dropout=drop))
                          _prev = hidden * heads
                  elif mtype == "GraphSAGE":
                      _out = n_cls if _is_last else hidden
                      self.convs.append(SAGEConv(_prev, _out)); _prev = _out
              self.mtype = mtype; self.n_layers = n_layers

          def forward(self, x, edge_index):
              for i, conv in enumerate(self.convs):
                  x = conv(x, edge_index)
                  if i < self.n_layers - 1:
                      x = F.elu(x)
                      x = F.dropout(x, p=self.drop, training=self.training)
              return x

      model = GNN(N_FEAT, HIDDEN, N_CLS, N_LAYERS, HEADS, DROPOUT, MODEL_TYPE).to(DEVICE)
      _opt  = torch.optim.Adam(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_val_acc, _best_state = 0.0, None
      _tr_losses, _val_accs = [], []
      _no_imp = 0

      for _ep in range(EPOCHS):
          model.train()
          _opt.zero_grad()
          _out = model(data.x, data.edge_index)
          _loss = F.cross_entropy(_out[data.train_mask], data.y[data.train_mask])
          _loss.backward(); _opt.step()
          _tr_losses.append(_loss.item())

          model.eval()
          with torch.no_grad():
              _pred = model(data.x, data.edge_index).argmax(1)
          _vacc = accuracy_score(
              data.y[data.val_mask].cpu(), _pred[data.val_mask].cpu())
          _val_accs.append(_vacc)
          if _vacc > _best_val_acc:
              _best_val_acc = _vacc; _no_imp = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_imp += 1
          if _no_imp >= PATIENCE:
              print(f"Early stop epoch {_ep+1}"); break
          if (_ep+1) % 20 == 0:
              print(f"Epoch {_ep+1:3d} | loss={_loss:.4f} | val_acc={_vacc:.4f}")

      if _best_state: model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s | Best val_acc={_best_val_acc:.4f}")

      model.eval()
      with torch.no_grad():
          _logits = model(data.x, data.edge_index).cpu()
      y_proba = F.softmax(_logits, dim=1).numpy()
      y_pred  = _logits.argmax(1).numpy()
      feature_importances = None

      # Pour Bloc 4 : masque test
      _test_mask = data.test_mask.cpu().numpy()
      y_pred  = y_pred[_test_mask]
      y_proba = y_proba[_test_mask]

      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      axes[0].plot(_tr_losses, color="#1D9E75", linewidth=1.5)
      axes[0].set_title(f"{MODEL_TYPE} — Loss"); axes[0].grid(alpha=0.3)
      axes[1].plot(_val_accs, color="#D85A30", linewidth=1.5)
      best_ep = int(np.argmax(_val_accs))
      axes[1].axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                      label=f"Best ({_best_val_acc:.4f})")
      axes[1].set_title(f"{MODEL_TYPE} — Val Accuracy"); axes[1].legend()
      axes[1].grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig(f"training_gnn_{MODEL_TYPE.lower()}.png",
                  dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : [],
          "val_accuracy"    : _val_accs,
          "metrics_per_epoch": [{"val_acc": a} for a in _val_accs],
          "fit_time_s"      : fit_time_s,
          "best_epoch"      : best_ep + 1,
          "best_val_acc"    : _best_val_acc,
      }
      full_pipeline = {
          "preprocessor"    : None,
          "model"           : model,
          "model_config"    : {"model_type": MODEL_TYPE, "hidden": HIDDEN,
                               "n_layers": N_LAYERS, "n_cls": N_CLS,
                               "n_feat": N_FEAT},
          "feature_names_in": feature_names_out,
          "task_type"       : task_type,
          "training_history": training_history,
          "meta"            : meta,
      }
      print(f"GNN {MODEL_TYPE} | y_pred shape={y_pred.shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION L — PREDICTION CONFORME (INCERTITUDE GARANTIE)
# ══════════════════════════════════════════════════════════════════════════

conformal_prediction:

  - id: train_mapie_conformal
    name: "Entraînement — MAPIE Conformal Prediction (intervalles garantis)"
    enabled: true
    library: mapie
    category: "Incertitude — Conformal"
    applies_to: ["classification", "regression"]
    description: >
      Wraps un modèle pré-entraîné pour produire des intervalles de
      prédiction avec couverture marginale garantie (1 - alpha).
      Requiert un calibration set dédié.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from mapie.classification import MapieClassifier
      from mapie.regression import MapieRegressor
      from mapie.metrics import (classification_coverage_score,
                                  classification_mean_width_score)
      from sklearn.model_selection import train_test_split

      # ── Hyperparamètres ────────────────────────────────────────────────
      ALPHA         = 0.1     # niveau d'erreur (couverture cible = 1-alpha)
      METHOD        = "score" # "score" | "cumulated_score" | "raps"
      CALIB_FRACTION= 0.2     # fraction de X_train pour calibration
      meta["model_id"] = "mapie_conformal"

      # Un modèle de base doit déjà exister dans 'model' (depuis un snippet précédent)
      # Si pas encore entraîné, on utilise LightGBM par défaut
      if "model" not in dir() or model is None:
          import lightgbm as lgb
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          model = Pipeline([
              ("scaler", StandardScaler()),
              ("clf",    lgb.LGBMClassifier(n_estimators=100, random_state=42,
                                             n_jobs=-1))
          ])
          model.fit(X_train, y_train)
          print("Modèle de base LightGBM entraîné par défaut.")

      # Split calibration
      _X_tr2, _X_calib, _y_tr2, _y_calib = train_test_split(
          X_train, y_train, test_size=CALIB_FRACTION, random_state=42)

      IS_CLF = task_type == "classification"
      _t0 = time.perf_counter()
      if IS_CLF:
          _mapie = MapieClassifier(estimator=model, method=METHOD,
                                   cv="prefit", random_state=42)
      else:
          _mapie = MapieRegressor(estimator=model, method="plus",
                                  cv="prefit")

      _mapie.fit(_X_calib, _y_calib)
      fit_time_s = time.perf_counter() - _t0
      print(f"Calibration conforme terminée en {fit_time_s:.2f}s")

      if IS_CLF:
          y_pred, _pred_sets = _mapie.predict(
              X_test, alpha=ALPHA, include_last_label=True)
          _sets_1d = _pred_sets[:, :, 0]
          cov   = float(classification_coverage_score(y_test, _sets_1d))
          width = float(classification_mean_width_score(_sets_1d))
          print(f"Couverture empirique : {cov:.3f} (cible : {1-ALPHA:.2f})")
          print(f"Taille moy des ensembles : {width:.2f}")
          y_proba = model.predict_proba(X_test) if hasattr(model, "predict_proba") else None

          # Visualisation
          fig, ax = plt.subplots(figsize=(10, 4))
          pd.Series(np.sum(_sets_1d, axis=1)).value_counts().sort_index().plot.bar(
              ax=ax, color="#1D9E75")
          ax.set_xlabel("Taille de l'ensemble prédit"); ax.set_ylabel("Nb obs")
          ax.set_title(f"MAPIE — Distribution des tailles d'ensembles (alpha={ALPHA})")
          plt.tight_layout()
          plt.savefig("training_mapie_sets.png", dpi=120, bbox_inches="tight")
          plt.show()
      else:
          y_pred, _intervals = _mapie.predict(X_test, alpha=ALPHA)
          y_proba = None
          cov   = float(np.mean(
              (np.array(y_test) >= _intervals[:, 0, 0]) &
              (np.array(y_test) <= _intervals[:, 1, 0])))
          width = float(np.mean(_intervals[:, 1, 0] - _intervals[:, 0, 0]))
          print(f"Couverture empirique : {cov:.3f} | Largeur moy : {width:.3f}")

      feature_importances = None
      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "coverage": cov, "mean_set_size": width, "alpha": ALPHA,
      }
      full_pipeline = {
          "preprocessor"   : preprocessor,
          "model"          : _mapie,
          "base_model"     : model,
          "feature_names_in": feature_names_out,
          "task_type"      : task_type,
          "training_history": training_history,
          "alpha"          : ALPHA,
          "meta"           : meta,
      }
      model = _mapie   # override avec le modèle conforme
      print(f"MAPIE | couverture={cov:.3f} | largeur={width:.3f}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION M — CODE LIBRE (MODÈLE CUSTOM)
# ══════════════════════════════════════════════════════════════════════════

free_model:

  - id: train_free_model
    name: "Entraînement — Modèle Custom (Nœud Libre)"
    enabled: true
    library: any
    category: "Générique"
    applies_to: ["classification", "regression", "clustering"]
    description: >
      Nœud d'échappement pour tout modèle non répertorié dans le catalogue.
      Obligation : produire toutes les variables du contrat de sortie.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      from sklearn.metrics import accuracy_score, f1_score

      # ════════════════════════════════════════════════════════════════
      # REMPLACEZ PAR VOTRE MODÈLE
      # ════════════════════════════════════════════════════════════════
      meta["model_id"] = "custom_model"

      class MyCustomModel:
          def fit(self, X, y): self._classes = np.unique(y); return self
          def predict(self, X): return np.full(len(X), self._classes[0])
          def predict_proba(self, X):
              return np.full((len(X), len(self._classes)), 1/len(self._classes))

      _t0 = time.perf_counter()
      model = MyCustomModel()
      model.fit(X_train, y_train)
      fit_time_s = time.perf_counter() - _t0
      # ════════════════════════════════════════════════════════════════

      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test) if hasattr(model, "predict_proba") else None
      feature_importances = None
      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
      }
      full_pipeline = {
          "preprocessor"   : preprocessor,
          "model"          : model,
          "feature_names_in": feature_names_out,
          "task_type"      : task_type,
          "training_history": training_history,
          "meta"           : meta,
      }
      print(f"Custom model | y_pred shape={np.array(y_pred).shape} "
            f"| fit_time={fit_time_s:.2f}s")


# ══════════════════════════════════════════════════════════════════════════
# SECTION N — VALIDATION DU CONTRAT DE SORTIE BLOC 3
# ══════════════════════════════════════════════════════════════════════════

contract_validation:

  - id: validate_bloc3_outputs
    name: "Validation Contrat de Sortie — Bloc 3"
    enabled: true
    category: "Validation — Contrat"
    description: >
      Assertions sur toutes les variables de sortie du Bloc 3.
      Vérifie la cohérence model / y_pred / y_proba / training_history /
      full_pipeline / save_path avant passage au Bloc 4.
    code_template: |
      import numpy as np
      import pandas as pd

      print("=" * 70)
      print("VALIDATION CONTRAT DE SORTIE — BLOC 3")
      print("=" * 70)

      errors   = []
      warnings = []

      # ── Variables obligatoires ─────────────────────────────────────────
      required_vars = {
          "model"            : locals().get("model"),
          "y_pred"           : locals().get("y_pred"),
          "fit_time_s"       : locals().get("fit_time_s"),
          "training_history" : locals().get("training_history"),
          "full_pipeline"    : locals().get("full_pipeline"),
          "task_type"        : locals().get("task_type"),
          "meta"             : locals().get("meta"),
      }
      for name, val in required_vars.items():
          if val is None:
              errors.append(f"Variable manquante : {name}")
          else:
              _shape = (val.shape if hasattr(val, "shape")
                        else len(val) if hasattr(val, "__len__") else val)
              print(f"  {name:25s} : {type(val).__name__} | {_shape}")

      # ── Cohérence y_pred / X_test ──────────────────────────────────────
      _y_pred = locals().get("y_pred")
      _X_test = locals().get("X_test") or locals().get("images_test") or \
                locals().get("sequences_test")
      if _y_pred is not None and _X_test is not None:
          n_pred = len(_y_pred)
          n_test = len(_X_test)
          if n_pred != n_test:
              errors.append(f"len(y_pred)={n_pred} != len(X_test)={n_test}")

      # ── training_history ───────────────────────────────────────────────
      _th = locals().get("training_history", {})
      if isinstance(_th, dict):
          print(f"\n  training_history keys : {list(_th.keys())}")
          _lc = _th.get("loss_curve", [])
          _vc = _th.get("val_loss_curve", [])
          if _lc:
              print(f"    loss_curve    : {len(_lc)} points "
                    f"| first={_lc[0]:.5f} | last={_lc[-1]:.5f}")
          if _vc:
              print(f"    val_loss_curve: {len(_vc)} points "
                    f"| min={min(_vc):.5f} @ epoch {np.argmin(_vc)+1}")
          if not _lc:
              warnings.append("training_history.loss_curve vide "
                               "(normal pour certains modèles sklearn)")
      else:
          errors.append("training_history n'est pas un dict")

      # ── full_pipeline ──────────────────────────────────────────────────
      _fp = locals().get("full_pipeline", {})
      for key in ["model", "feature_names_in", "task_type"]:
          if key not in _fp:
              warnings.append(f"full_pipeline manque la clé '{key}'")

      # ── save_path ──────────────────────────────────────────────────────
      _sp = locals().get("save_path") or meta.get("save_path") if locals().get("meta") else None
      if _sp:
          import os
          if os.path.exists(_sp):
              _size = (os.path.getsize(_sp) / 1024**2
                       if os.path.isfile(_sp) else
                       sum(os.path.getsize(os.path.join(r, f))
                           for r, _, fs in os.walk(_sp)
                           for f in fs) / 1024**2)
              print(f"\n  save_path  : {_sp} ({_size:.2f} MB)")
          else:
              warnings.append(f"save_path '{_sp}' n'existe pas encore "
                               "(sauvegarde non effectuée)")
      else:
          warnings.append("save_path non défini — "
                          "exécuter le snippet save_load_pipeline")

      # ── Rapport final ──────────────────────────────────────────────────
      print("\n" + "-" * 70)
      for w in warnings:
          print(f"  AVERTISSEMENT : {w}")
      if errors:
          print("\nERREURS BLOQUANTES :")
          for e in errors:
              print(f"  {e}")
          raise RuntimeError(
              f"Bloc 3 — {len(errors)} erreur(s) détectée(s). "
              "Corriger avant le Bloc 4.")
      else:
          print(f"\nContrat Bloc 3 VALIDE — {len(warnings)} avertissement(s)")
          print("Prêt pour le Bloc 4 (Évaluation).")
      print("=" * 70)
