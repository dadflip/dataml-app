neural_networks:
# ──────────────────────────────────────────────────────────────────────────

  - id: mlp_clf
    name: "MLP Classifier (sklearn)"
    enabled: true
    library: sklearn
    class: sklearn.neural_network.MLPClassifier
    category: "Réseau de Neurones"
    description: "Perceptron multi-couches pour classification. Simple à utiliser, sans GPU."
    use_cases: ["classification non-linéaire", "données tabulaires", "baseline deep learning"]
    pros: ["non-linéaire", "intégration sklearn native", "rapide à expérimenter"]
    cons: ["sensible au scaling", "convergence capricieuse", "moins puissant que PyTorch/TF"]
    hyperparameters:
      hidden_layer_sizes: ["(100,)", "(100, 50)", "(200, 100, 50)"]
      activation: ["relu", "tanh"]
      alpha: [0.0001, 0.001, 0.01]
      learning_rate: ["constant", "adaptive"]
      max_iter: [300, 500]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.neural_network import MLPClassifier
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("mlp", MLPClassifier(hidden_layer_sizes=(200, 100),
                                activation="relu",
                                alpha=0.001,
                                learning_rate="adaptive",
                                max_iter=500,
                                early_stopping=True,
                                validation_fraction=0.1,
                                random_state=42))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Courbe de perte
      import matplotlib.pyplot as plt
      plt.plot(model["mlp"].loss_curve_)
      plt.title("Courbe de perte"); plt.xlabel("Epochs"); plt.show()

  - id: pytorch_tabular_clf
    name: "PyTorch MLP (Tabulaire)"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "Réseau de Neurones"
    description: "MLP flexible en PyTorch pour classification tabulaire. Contrôle total sur l'architecture."
    use_cases: ["classification tabulaire", "données mixtes", "architecture personnalisée"]
    pros: ["très flexible", "GPU natif", "batch norm / dropout", "extensible"]
    cons: ["verbeux", "GPU nécessaire pour gros datasets", "plus long à coder"]
    hyperparameters:
      hidden_dims: ["[256, 128, 64]", "[512, 256, 128]"]
      dropout: [0.1, 0.2, 0.3, 0.5]
      lr: [0.001, 0.0003, 0.0001]
      batch_size: [64, 128, 256]
      epochs: [50, 100, 200]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report
      import numpy as np

      class TabularMLP(nn.Module):
          def __init__(self, input_dim, hidden_dims, n_classes, dropout=0.2):
              super().__init__()
              layers = []
              prev_dim = input_dim
              for h in hidden_dims:
                  layers += [nn.Linear(prev_dim, h), nn.BatchNorm1d(h),
                              nn.ReLU(), nn.Dropout(dropout)]
                  prev_dim = h
              layers.append(nn.Linear(prev_dim, n_classes))
              self.net = nn.Sequential(*layers)
          def forward(self, x):
              return self.net(x)

      device = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      scaler = StandardScaler()
      X_tr = torch.tensor(scaler.fit_transform(X_train), dtype=torch.float32)
      X_te = torch.tensor(scaler.transform(X_test),      dtype=torch.float32)
      y_tr = torch.tensor(y_train, dtype=torch.long)

      loader = DataLoader(TensorDataset(X_tr, y_tr), batch_size=128, shuffle=True)

      n_classes = len(np.unique(y_train))
      model = TabularMLP(X_train.shape[1], [256, 128, 64], n_classes, dropout=0.2).to(device)
      optimizer = torch.optim.Adam(model.parameters(), lr=3e-4)
      criterion = nn.CrossEntropyLoss()

      for epoch in range(100):
          model.train()
          for Xb, yb in loader:
              Xb, yb = Xb.to(device), yb.to(device)
              loss = criterion(model(Xb), yb)
              optimizer.zero_grad(); loss.backward(); optimizer.step()
          if (epoch + 1) % 20 == 0:
              print(f"Epoch {epoch+1} | Loss: {loss.item():.4f}")

      model.eval()
      with torch.no_grad():
          y_pred = model(X_te.to(device)).argmax(dim=1).cpu().numpy()
      print(classification_report(y_test, y_pred))

