# ══════════════════════════════════════════════════════════════════════════
# ML MODEL CATALOG — Classification · Regression · Clustering
#                    Timeseries · Anomaly Detection · Dimensionality Reduction
#                    Neural Networks · NLP · Survival · Bayesian
# ══════════════════════════════════════════════════════════════════════════
#
# Structure de chaque entrée :
#   id, name, enabled, library, class, category,
#   description, use_cases, pros, cons,
#   hyperparameters, eval_metrics,
#   code_template          ← snippet générique prêt à l'emploi
#
# Convention code_template :
#   - X_train / X_test / y_train / y_test  : données déjà splittées
#   - preprocessor                          : pipeline de prétraitement (optionnel)
#   - Les imports sont inclus dans chaque template
# ══════════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────────────
classification:
# ──────────────────────────────────────────────────────────────────────────

  - id: logistic_regression
    name: "Régression Logistique"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.LogisticRegression
    category: "Linéaire"
    description: "Modèle probabiliste linéaire. Idéal comme baseline. Très interprétable via les coefficients."
    use_cases: ["classification binaire", "multi-classe (OvR)", "features nombreuses et sparses"]
    pros: ["très rapide", "interprétable", "régularisation intégrée", "probabilités calibrées"]
    cons: ["frontière de décision linéaire uniquement", "sensible aux outliers"]
    hyperparameters:
      C: [0.001, 0.01, 0.1, 1, 10, 100]
      penalty: ["l2", "l1", "elasticnet"]
      solver: ["lbfgs", "saga", "liblinear"]
      max_iter: [100, 500, 1000]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc", "precision", "recall"]
    code_template: |
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.model_selection import cross_val_score
      from sklearn.metrics import classification_report

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("clf", LogisticRegression(C=1.0, penalty="l2", solver="lbfgs",
                                     max_iter=1000, random_state=42))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # GridSearch
      from sklearn.model_selection import GridSearchCV
      param_grid = {"clf__C": [0.01, 0.1, 1, 10], "clf__penalty": ["l1", "l2"]}
      gs = GridSearchCV(model, param_grid, cv=5, scoring="f1_weighted", n_jobs=-1)
      gs.fit(X_train, y_train)
      print("Best params:", gs.best_params_)

  - id: knn_clf
    name: "K-Nearest Neighbors (KNN)"
    enabled: true
    library: sklearn
    class: sklearn.neighbors.KNeighborsClassifier
    category: "Instance-based"
    description: "Classifie selon les k voisins les plus proches. Pas d'entraînement, toute la charge est à la prédiction."
    use_cases: ["petits datasets", "géométrie locale importante", "recommandation simple"]
    pros: ["simple", "pas d'hypothèse sur la distribution", "naturellement multi-classe"]
    cons: ["lent à la prédiction sur grands datasets", "sensible à l'échelle", "malédiction de la dimensionnalité"]
    hyperparameters:
      n_neighbors: [3, 5, 7, 10, 15, 20]
      weights: ["uniform", "distance"]
      metric: ["euclidean", "manhattan", "minkowski"]
    eval_metrics: ["accuracy", "f1_weighted"]
    code_template: |
      from sklearn.neighbors import KNeighborsClassifier
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("clf", KNeighborsClassifier(n_neighbors=5, weights="uniform",
                                       metric="euclidean"))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Recherche du meilleur k
      import numpy as np
      from sklearn.model_selection import cross_val_score
      k_range = range(1, 31)
      scores = [cross_val_score(Pipeline([("s", StandardScaler()),
                    ("c", KNeighborsClassifier(n_neighbors=k))]),
                    X_train, y_train, cv=5, scoring="accuracy").mean()
                for k in k_range]
      best_k = k_range[np.argmax(scores)]
      print(f"Meilleur k : {best_k}")

  - id: naive_bayes_gaussian
    name: "Naive Bayes (Gaussien)"
    enabled: true
    library: sklearn
    class: sklearn.naive_bayes.GaussianNB
    category: "Probabiliste"
    description: "Classificateur probabiliste basé sur Bayes avec hypothèse d'indépendance des features. Très rapide."
    use_cases: ["texte (MultinomialNB)", "features continues (GaussianNB)", "baseline rapide", "spam detection"]
    pros: ["extrêmement rapide", "fonctionne bien avec peu de données", "interprétable"]
    cons: ["hypothèse d'indépendance souvent irréaliste", "mauvais calibrage des probabilités"]
    hyperparameters:
      var_smoothing: [1.0e-9, 1.0e-8, 1.0e-7, 1.0e-6]
    eval_metrics: ["accuracy", "f1_weighted"]
    code_template: |
      from sklearn.naive_bayes import GaussianNB
      from sklearn.metrics import classification_report
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("clf", GaussianNB(var_smoothing=1e-9))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Probabilités
      proba = model.predict_proba(X_test)
      print("Probabilités (5 premiers) :", proba[:5])

  - id: decision_tree_clf
    name: "Arbre de Décision (CART)"
    enabled: true
    library: sklearn
    class: sklearn.tree.DecisionTreeClassifier
    category: "Arbre"
    description: "Modèle hiérarchique de décisions basé sur des règles if/else. Très interprétable (visualisable)."
    use_cases: ["règles de décision lisibles", "features mixtes", "interactions non-linéaires simples"]
    pros: ["très interprétable", "gère les features mixtes", "pas besoin de scaling"]
    cons: ["sur-apprentissage facile", "instable (variance élevée)", "frontières en escalier"]
    hyperparameters:
      max_depth: [3, 5, 7, 10, null]
      min_samples_split: [2, 5, 10, 20]
      min_samples_leaf: [1, 2, 5, 10]
      criterion: ["gini", "entropy"]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.tree import DecisionTreeClassifier, plot_tree
      from sklearn.metrics import classification_report
      import matplotlib.pyplot as plt

      model = DecisionTreeClassifier(max_depth=5, criterion="gini",
                                      min_samples_split=10, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Visualisation
      fig, ax = plt.subplots(figsize=(20, 8))
      plot_tree(model, feature_names=feature_names, class_names=class_names,
                filled=True, ax=ax)
      plt.tight_layout()
      plt.savefig("decision_tree.png", dpi=150)

      # Feature importance
      import pandas as pd
      fi = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False)
      print(fi.head(10))

  - id: random_forest_clf
    name: "Random Forest"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.RandomForestClassifier
    category: "Ensemble — Bagging"
    description: "Ensemble d'arbres de décision entraînés sur sous-échantillons bootstrap. Robuste et puissant."
    use_cases: ["tabular data généraliste", "feature importance", "résistance aux outliers"]
    pros: ["robuste au sur-apprentissage", "feature importance native", "parallélisable", "pas besoin de scaling"]
    cons: ["boîte noire", "lent sur très grands datasets", "moins bon que boosting en général"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      max_depth: [5, 10, 20, null]
      min_samples_split: [2, 5, 10]
      max_features: ["sqrt", "log2", 0.5]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.metrics import classification_report, ConfusionMatrixDisplay
      from sklearn.model_selection import RandomizedSearchCV
      import pandas as pd

      model = RandomForestClassifier(n_estimators=200, max_depth=None,
                                      max_features="sqrt", n_jobs=-1, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Feature importance
      fi = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False)
      print(fi.head(15))

      # Tuning rapide
      param_dist = {"n_estimators": [100, 300, 500], "max_depth": [5, 10, 20, None],
                    "min_samples_split": [2, 5, 10], "max_features": ["sqrt", "log2"]}
      rs = RandomizedSearchCV(model, param_dist, n_iter=20, cv=5,
                               scoring="f1_weighted", n_jobs=-1, random_state=42)
      rs.fit(X_train, y_train)
      print("Best params:", rs.best_params_)

  - id: gradient_boosting_clf
    name: "Gradient Boosting (sklearn)"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.GradientBoostingClassifier
    category: "Ensemble — Boosting"
    description: "Boosting séquentiel qui corrige les erreurs du modèle précédent. Très performant."
    use_cases: ["tabular data compétitif", "quand la précision prime sur la vitesse"]
    pros: ["très performant", "gère les interactions complexes", "robuste"]
    cons: ["lent à entraîner", "nombreux hyperparamètres", "peut sur-apprendre"]
    hyperparameters:
      n_estimators: [100, 200, 300]
      learning_rate: [0.01, 0.05, 0.1, 0.2]
      max_depth: [3, 4, 5, 6]
      subsample: [0.7, 0.8, 1.0]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import GradientBoostingClassifier
      from sklearn.metrics import classification_report

      model = GradientBoostingClassifier(n_estimators=200, learning_rate=0.1,
                                          max_depth=4, subsample=0.8, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Suivi de la loss
      import matplotlib.pyplot as plt
      plt.plot(model.train_score_, label="Train")
      plt.xlabel("Iterations")
      plt.ylabel("Loss")
      plt.legend()
      plt.show()

  - id: xgboost_clf
    name: "XGBoost"
    enabled: true
    library: xgboost
    class: xgboost.XGBClassifier
    category: "Ensemble — Boosting"
    description: "Implémentation optimisée et régularisée du gradient boosting. Standard de l'industrie pour tabular data."
    use_cases: ["compétitions ML", "tabular data haute performance", "features sparses"]
    pros: ["très performant", "régularisation L1/L2", "gère les valeurs manquantes nativement", "rapide"]
    cons: ["nombreux hyperparamètres", "peut nécessiter du tuning"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7, 9]
      subsample: [0.7, 0.8, 1.0]
      colsample_bytree: [0.7, 0.8, 1.0]
      reg_alpha: [0, 0.1, 1]
      reg_lambda: [1, 5, 10]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      import xgboost as xgb
      from sklearn.metrics import classification_report
      from sklearn.model_selection import cross_val_score

      model = xgb.XGBClassifier(n_estimators=300, learning_rate=0.05, max_depth=5,
                                  subsample=0.8, colsample_bytree=0.8,
                                  reg_alpha=0, reg_lambda=1,
                                  use_label_encoder=False, eval_metric="logloss",
                                  random_state=42, n_jobs=-1)
      model.fit(X_train, y_train,
                eval_set=[(X_test, y_test)],
                early_stopping_rounds=30,
                verbose=50)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Feature importance SHAP
      import shap
      explainer = shap.TreeExplainer(model)
      shap_values = explainer.shap_values(X_test)
      shap.summary_plot(shap_values, X_test, feature_names=feature_names)

  - id: lightgbm_clf
    name: "LightGBM"
    enabled: true
    library: lightgbm
    class: lightgbm.LGBMClassifier
    category: "Ensemble — Boosting"
    description: "Boosting basé sur histogrammes. Très rapide, faible mémoire. Excellent sur grands datasets."
    use_cases: ["grands datasets (>100k lignes)", "haute dimensionnalité", "production rapide"]
    pros: ["le plus rapide des boosting", "faible consommation mémoire", "gère les catégorielles nativement"]
    cons: ["peut sur-apprendre sur petits datasets", "sensible aux outliers"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      learning_rate: [0.01, 0.05, 0.1]
      num_leaves: [31, 63, 127]
      max_depth: [-1, 5, 10]
      subsample: [0.7, 0.8, 1.0]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      import lightgbm as lgb
      from sklearn.metrics import classification_report

      model = lgb.LGBMClassifier(n_estimators=500, learning_rate=0.05,
                                   num_leaves=63, max_depth=-1,
                                   subsample=0.8, colsample_bytree=0.8,
                                   random_state=42, n_jobs=-1)
      model.fit(X_train, y_train,
                eval_set=[(X_test, y_test)],
                callbacks=[lgb.early_stopping(50), lgb.log_evaluation(100)])
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Importance
      lgb.plot_importance(model, max_num_features=20)

  - id: catboost_clf
    name: "CatBoost"
    enabled: true
    library: catboost
    class: catboost.CatBoostClassifier
    category: "Ensemble — Boosting"
    description: "Boosting optimisé pour les features catégorielles. Peu de tuning nécessaire."
    use_cases: ["datasets avec beaucoup de catégorielles", "peu de prétraitement voulu", "données hétérogènes"]
    pros: ["gère nativement les catégorielles", "peu de tuning", "robuste au sur-apprentissage"]
    cons: ["lent sur très grands datasets", "modèles lourds"]
    hyperparameters:
      iterations: [100, 300, 500]
      learning_rate: [0.01, 0.05, 0.1]
      depth: [4, 6, 8, 10]
      l2_leaf_reg: [1, 3, 5, 10]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from catboost import CatBoostClassifier, Pool
      from sklearn.metrics import classification_report

      # Spécifier les indices des colonnes catégorielles
      cat_features_idx = [0, 2, 5]  # à adapter

      train_pool = Pool(X_train, y_train, cat_features=cat_features_idx)
      test_pool  = Pool(X_test,  y_test,  cat_features=cat_features_idx)

      model = CatBoostClassifier(iterations=500, learning_rate=0.05,
                                  depth=6, l2_leaf_reg=3,
                                  random_state=42, verbose=100)
      model.fit(train_pool, eval_set=test_pool, early_stopping_rounds=50)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

  - id: svm_clf
    name: "Support Vector Machine (SVC)"
    enabled: true
    library: sklearn
    class: sklearn.svm.SVC
    category: "Kernel"
    description: "Trouve l'hyperplan de séparation à marge maximale. Très puissant avec kernel RBF."
    use_cases: ["données de haute dimension", "petits datasets", "marges claires entre classes"]
    pros: ["efficace en haute dimension", "polyvalent (kernels)", "robuste aux outliers"]
    cons: ["lent sur grands datasets", "scalabilité limitée", "sensible au scaling"]
    hyperparameters:
      C: [0.1, 1, 10, 100]
      kernel: ["rbf", "linear", "poly", "sigmoid"]
      gamma: ["scale", "auto", 0.001, 0.01, 0.1]
    eval_metrics: ["accuracy", "f1_weighted"]
    code_template: |
      from sklearn.svm import SVC
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report
      from sklearn.model_selection import GridSearchCV

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("svc", SVC(C=1.0, kernel="rbf", gamma="scale",
                      probability=True, random_state=42))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # Tuning
      param_grid = {"svc__C": [0.1, 1, 10], "svc__gamma": ["scale", "auto", 0.01, 0.1]}
      gs = GridSearchCV(model, param_grid, cv=5, scoring="f1_weighted", n_jobs=-1)
      gs.fit(X_train, y_train)
      print("Best:", gs.best_params_)

  - id: adaboost_clf
    name: "AdaBoost"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.AdaBoostClassifier
    category: "Ensemble — Boosting"
    description: "Premier algorithme de boosting. Combine des classifieurs faibles pondérés selon leurs erreurs."
    use_cases: ["baseline boosting", "données propres peu bruitées"]
    pros: ["simple", "peu de hyperparamètres", "interprétable"]
    cons: ["sensible aux outliers et au bruit", "moins performant que XGBoost/LGB"]
    hyperparameters:
      n_estimators: [50, 100, 200]
      learning_rate: [0.1, 0.5, 1.0]
    eval_metrics: ["accuracy", "f1_weighted"]
    code_template: |
      from sklearn.ensemble import AdaBoostClassifier
      from sklearn.tree import DecisionTreeClassifier
      from sklearn.metrics import classification_report

      base_clf = DecisionTreeClassifier(max_depth=1)
      model = AdaBoostClassifier(estimator=base_clf, n_estimators=100,
                                  learning_rate=0.5, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

  - id: lda_clf
    name: "Linear Discriminant Analysis (LDA)"
    enabled: true
    library: sklearn
    class: sklearn.discriminant_analysis.LinearDiscriminantAnalysis
    category: "Linéaire"
    description: "Trouve les axes qui maximisent la séparation entre classes. Aussi utilisable pour réduction de dim."
    use_cases: ["réduction de dimensionnalité supervisée", "baseline linéaire", "classes bien séparées"]
    pros: ["interprétable", "réduction de dim intégrée", "rapide"]
    cons: ["hypothèse gaussienne + covariance égale", "linéaire"]
    hyperparameters:
      solver: ["svd", "lsqr", "eigen"]
    eval_metrics: ["accuracy", "f1_weighted"]
    code_template: |
      from sklearn.discriminant_analysis import LinearDiscriminantAnalysis
      from sklearn.metrics import classification_report
      import matplotlib.pyplot as plt

      model = LinearDiscriminantAnalysis(solver="svd")
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      # LDA comme réducteur de dim (n_classes - 1 composantes)
      X_lda = model.transform(X_train)
      plt.scatter(X_lda[:, 0], X_lda[:, 1], c=y_train, cmap="tab10", alpha=0.6)
      plt.title("Projection LDA")
      plt.show()

  - id: extra_trees_clf
    name: "Extra Trees (Extremely Randomized Trees)"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.ExtraTreesClassifier
    category: "Ensemble — Bagging"
    description: "Variante du Random Forest avec des seuils de split complètement aléatoires. Plus rapide, souvent aussi précis."
    use_cases: ["alternative rapide au Random Forest", "feature importance", "grands datasets"]
    pros: ["plus rapide que RF", "moins de variance", "parallélisable"]
    cons: ["légèrement plus biaisé que RF", "boîte noire"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      max_depth: [5, 10, 20, null]
      min_samples_split: [2, 5, 10]
      max_features: ["sqrt", "log2", 0.5]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import ExtraTreesClassifier
      from sklearn.metrics import classification_report
      import pandas as pd

      model = ExtraTreesClassifier(n_estimators=200, max_depth=None,
                                    max_features="sqrt", n_jobs=-1, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

      fi = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False)
      print(fi.head(15))

  - id: hist_gradient_boosting_clf
    name: "HistGradientBoosting Classifier"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.HistGradientBoostingClassifier
    category: "Ensemble — Boosting"
    description: "Implémentation sklearn du boosting par histogrammes. Rapide comme LightGBM, natif sklearn."
    use_cases: ["alternative sklearn à XGBoost/LGB", "grands datasets", "gère les NaN nativement"]
    pros: ["très rapide", "gère les NaN nativement", "intégration sklearn parfaite"]
    cons: ["moins de fonctionnalités que XGBoost/LGB"]
    hyperparameters:
      max_iter: [100, 300, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7, null]
      max_leaf_nodes: [31, 63, 127]
      l2_regularization: [0, 0.1, 1]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import HistGradientBoostingClassifier
      from sklearn.metrics import classification_report

      model = HistGradientBoostingClassifier(max_iter=300, learning_rate=0.05,
                                              max_depth=None, max_leaf_nodes=63,
                                              l2_regularization=0.1,
                                              early_stopping=True, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(classification_report(y_test, y_pred))

  - id: voting_clf
    name: "Voting Classifier (Ensemble)"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.VotingClassifier
    category: "Ensemble — Stacking/Voting"
    description: "Combine plusieurs modèles hétérogènes par vote majoritaire ou pondéré."
    use_cases: ["combinaison de modèles complémentaires", "compétitions", "réduction de variance ensemble"]
    pros: ["réduit les erreurs individuelles", "flexible", "simple à mettre en place"]
    cons: ["interprétabilité nulle", "latence accrue"]
    hyperparameters:
      voting: ["hard", "soft"]
      weights: ["uniform", "custom"]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import VotingClassifier, RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline
      from sklearn.metrics import classification_report

      clf1 = Pipeline([("s", StandardScaler()), ("lr", LogisticRegression(max_iter=1000))])
      clf2 = RandomForestClassifier(n_estimators=200, random_state=42)
      clf3 = GradientBoostingClassifier(n_estimators=200, random_state=42)

      voting = VotingClassifier(
          estimators=[("lr", clf1), ("rf", clf2), ("gb", clf3)],
          voting="soft",
          weights=[1, 2, 2]  # pondération optionnelle
      )
      voting.fit(X_train, y_train)
      y_pred = voting.predict(X_test)
      print(classification_report(y_test, y_pred))

  - id: stacking_clf
    name: "Stacking Classifier"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.StackingClassifier
    category: "Ensemble — Stacking/Voting"
    description: "Méta-apprentissage : utilise les prédictions des modèles de base comme features pour un méta-modèle."
    use_cases: ["compétitions ML", "maximiser la performance", "combiner des modèles spécialisés"]
    pros: ["meilleure performance que voting en général", "flexible"]
    cons: ["lent", "risque de fuite de données si mal implémenté", "complexe"]
    hyperparameters:
      cv: [5, 10]
      passthrough: [true, false]
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    code_template: |
      from sklearn.ensemble import StackingClassifier, RandomForestClassifier, GradientBoostingClassifier
      from sklearn.linear_model import LogisticRegression
      from sklearn.svm import SVC
      from sklearn.metrics import classification_report

      estimators = [
          ("rf",  RandomForestClassifier(n_estimators=200, random_state=42)),
          ("gb",  GradientBoostingClassifier(n_estimators=200, random_state=42)),
          ("svm", SVC(kernel="rbf", probability=True, random_state=42)),
      ]
      stacking = StackingClassifier(
          estimators=estimators,
          final_estimator=LogisticRegression(max_iter=1000),
          cv=5,
          passthrough=False,
          n_jobs=-1
      )
      stacking.fit(X_train, y_train)
      y_pred = stacking.predict(X_test)
      print(classification_report(y_test, y_pred))

# ──────────────────────────────────────────────────────────────────────────
regression:
# ──────────────────────────────────────────────────────────────────────────

  - id: linear_regression
    name: "Régression Linéaire (OLS)"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.LinearRegression
    category: "Linéaire"
    description: "Régression par moindres carrés ordinaires. Baseline incontournable."
    use_cases: ["relation linéaire entre features et target", "interprétation des coefficients"]
    pros: ["très interprétable", "rapide", "coefficients significatifs via statsmodels"]
    cons: ["linéaire uniquement", "sensible aux outliers et à la multicolinéarité"]
    hyperparameters: {}
    eval_metrics: ["rmse", "mae", "r2", "mape"]
    code_template: |
      from sklearn.linear_model import LinearRegression
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import mean_squared_error, mean_absolute_error, r2_score
      import numpy as np

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("reg", LinearRegression())
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)

      rmse = np.sqrt(mean_squared_error(y_test, y_pred))
      print(f"RMSE: {rmse:.4f} | MAE: {mean_absolute_error(y_test, y_pred):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

      # Coefficients via statsmodels pour tests statistiques
      import statsmodels.api as sm
      X_sm = sm.add_constant(X_train)
      ols = sm.OLS(y_train, X_sm).fit()
      print(ols.summary())

  - id: ridge
    name: "Ridge (L2)"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.Ridge
    category: "Linéaire Régularisé"
    description: "Régression linéaire avec régularisation L2. Réduit les coefficients sans les annuler."
    use_cases: ["multicolinéarité élevée", "nombreuses features corrélées"]
    pros: ["stable avec multicolinéarité", "rapide", "interprétable"]
    cons: ["ne fait pas de sélection de features (tous coeff ≠ 0)"]
    hyperparameters:
      alpha: [0.001, 0.01, 0.1, 1, 10, 100, 1000]
    eval_metrics: ["rmse", "mae", "r2"]
    code_template: |
      from sklearn.linear_model import Ridge, RidgeCV
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline
      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np

      # RidgeCV sélectionne alpha automatiquement
      model = Pipeline([
          ("scaler", StandardScaler()),
          ("reg", RidgeCV(alphas=[0.001, 0.01, 0.1, 1, 10, 100, 1000], cv=5))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(f"Best alpha: {model['reg'].alpha_}")
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

  - id: lasso
    name: "Lasso (L1)"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.Lasso
    category: "Linéaire Régularisé"
    description: "Régression linéaire avec régularisation L1. Met à zéro les coefficients non pertinents."
    use_cases: ["sélection de features automatique", "données sparses", "interprétabilité maximale"]
    pros: ["sélection de features intégrée", "sparse solutions"]
    cons: ["instable si features corrélées (sélectionne une seule au hasard)"]
    hyperparameters:
      alpha: [0.001, 0.01, 0.1, 1, 10]
    eval_metrics: ["rmse", "mae", "r2"]
    code_template: |
      from sklearn.linear_model import LassoCV
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline
      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np, pandas as pd

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("reg", LassoCV(alphas=None, cv=5, max_iter=10000))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(f"Best alpha: {model['reg'].alpha_}")
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

      # Features sélectionnées (coeff != 0)
      coefs = pd.Series(model["reg"].coef_, index=feature_names)
      print("Features retenues :", coefs[coefs != 0].sort_values().to_string())

  - id: elasticnet
    name: "ElasticNet (L1 + L2)"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.ElasticNet
    category: "Linéaire Régularisé"
    description: "Combinaison Ridge + Lasso. Sélection de features + stabilité avec features corrélées."
    use_cases: ["features nombreuses et corrélées", "meilleur des deux mondes Lasso/Ridge"]
    pros: ["équilibre entre L1 et L2", "stable", "sélection de features"]
    cons: ["2 hyperparamètres à tuner"]
    hyperparameters:
      alpha: [0.001, 0.01, 0.1, 1]
      l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
    eval_metrics: ["rmse", "mae", "r2"]
    code_template: |
      from sklearn.linear_model import ElasticNetCV
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline
      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("reg", ElasticNetCV(l1_ratio=[0.1, 0.3, 0.5, 0.7, 0.9],
                               alphas=[0.001, 0.01, 0.1, 1], cv=5, max_iter=10000))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(f"Alpha: {model['reg'].alpha_} | l1_ratio: {model['reg'].l1_ratio_}")
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

  - id: random_forest_reg
    name: "Random Forest Regressor"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.RandomForestRegressor
    category: "Ensemble — Bagging"
    description: "Ensemble d'arbres pour la régression. Capture les non-linéarités."
    use_cases: ["régression non-linéaire", "feature importance", "résistance aux outliers"]
    pros: ["robuste", "feature importance", "pas de scaling requis"]
    cons: ["boîte noire", "extrapolation limitée"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      max_depth: [5, 10, 20, null]
      min_samples_split: [2, 5, 10]
    eval_metrics: ["rmse", "mae", "r2", "mape"]
    code_template: |
      from sklearn.ensemble import RandomForestRegressor
      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np, pandas as pd

      model = RandomForestRegressor(n_estimators=200, max_depth=None,
                                     min_samples_split=5, n_jobs=-1, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

      fi = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False)
      print(fi.head(15))

  - id: xgboost_reg
    name: "XGBoost Regressor"
    enabled: true
    library: xgboost
    class: xgboost.XGBRegressor
    category: "Ensemble — Boosting"
    description: "Gradient boosting pour régression. Standard pour tabular regression en compétition."
    use_cases: ["régression tabular haute performance"]
    pros: ["très performant", "régularisation", "gère les NaN"]
    cons: ["tuning nécessaire", "extrapolation limitée"]
    hyperparameters:
      n_estimators: [100, 200, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7]
