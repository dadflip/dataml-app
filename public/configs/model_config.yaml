dimensionality_reduction:
# ──────────────────────────────────────────────────────────────────────────

  - id: pca
    name: "PCA (Analyse en Composantes Principales)"
    enabled: true
    library: sklearn
    class: sklearn.decomposition.PCA
    category: "Linéaire"
    description: "Réduit la dimensionnalité en maximisant la variance expliquée. Décomposition orthogonale."
    use_cases: ["réduction de bruit", "visualisation", "preprocessing avant ML"]
    pros: ["interprétable (loadings)", "rapide", "déterministe"]
    cons: ["linéaire uniquement", "variance ≠ information discriminante"]
    hyperparameters:
      n_components: [2, 3, 5, 10, 0.95]
      whiten: [true, false]
    eval_metrics: ["explained_variance_ratio", "reconstruction_error"]
    code_template: |
      from sklearn.decomposition import PCA
      from sklearn.preprocessing import StandardScaler
      import matplotlib.pyplot as plt
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      # Variance expliquée par composante
      pca_full = PCA().fit(X_scaled)
      cum_var = np.cumsum(pca_full.explained_variance_ratio_)
      plt.plot(cum_var); plt.axhline(0.95, color="r", linestyle="--")
      plt.xlabel("Composantes"); plt.ylabel("Variance expliquée cumulée"); plt.show()

      # PCA à 95% de variance
      pca = PCA(n_components=0.95, whiten=False)
      X_pca = pca.fit_transform(X_scaled)
      print(f"Dimensions : {X.shape[1]} → {X_pca.shape[1]}")

      # Visualisation 2D
      pca2 = PCA(n_components=2)
      X_2d = pca2.fit_transform(X_scaled)
      plt.scatter(X_2d[:, 0], X_2d[:, 1], c=y if y is not None else "steelblue", alpha=0.5)
      plt.show()

  - id: tsne
    name: "t-SNE"
    enabled: true
    library: sklearn
    class: sklearn.manifold.TSNE
    category: "Non-linéaire"
    description: "Visualisation 2D/3D non-linéaire. Préserve la structure locale. Standard pour visualisation."
    use_cases: ["visualisation clusters", "exploration de données haute dim"]
    pros: ["excellent pour visualisation", "révèle structure locale"]
    cons: ["non déterministe", "lent O(n²)", "pas utilisable pour projection de nouveaux points"]
    hyperparameters:
      n_components: [2, 3]
      perplexity: [5, 15, 30, 50]
      learning_rate: [50, 100, 200, 500]
      n_iter: [1000]
    eval_metrics: ["trustworthiness"]
    code_template: |
      from sklearn.manifold import TSNE
      from sklearn.preprocessing import StandardScaler
      from sklearn.decomposition import PCA
      import matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      # PCA → 50 dims avant t-SNE pour accélérer
      if X_scaled.shape[1] > 50:
          X_scaled = PCA(n_components=50).fit_transform(X_scaled)

      tsne = TSNE(n_components=2, perplexity=30, learning_rate=200,
                  n_iter=1000, random_state=42, verbose=1)
      X_2d = tsne.fit_transform(X_scaled)

      plt.figure(figsize=(10, 7))
      scatter = plt.scatter(X_2d[:, 0], X_2d[:, 1],
                            c=y if y is not None else "steelblue",
                            cmap="tab10", alpha=0.6, s=10)
      if y is not None:
          plt.colorbar(scatter)
      plt.title("t-SNE"); plt.show()

  - id: umap_reduction
    name: "UMAP"
    enabled: true
    library: umap-learn
    class: umap.UMAP
    category: "Non-linéaire"
    description: "Réduction de dim basée sur la topologie. Plus rapide que t-SNE, préserve aussi la structure globale."
    use_cases: ["visualisation", "preprocessing", "réduction pour clustering"]
    pros: ["rapide", "préserve structure globale + locale", "projectable sur nouveaux points"]
    cons: ["stochastique", "hyperparamètres subtils"]
    hyperparameters:
      n_components: [2, 3, 5, 10]
      n_neighbors: [5, 10, 15, 30]
      min_dist: [0.0, 0.1, 0.25, 0.5]
    eval_metrics: ["trustworthiness"]
    code_template: |
      import umap
      from sklearn.preprocessing import StandardScaler
      import matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      reducer = umap.UMAP(n_components=2, n_neighbors=15,
                          min_dist=0.1, metric="euclidean", random_state=42)
      X_2d = reducer.fit_transform(X_scaled)

      plt.figure(figsize=(10, 7))
      plt.scatter(X_2d[:, 0], X_2d[:, 1],
                  c=y if y is not None else "steelblue",
                  cmap="tab10", alpha=0.6, s=10)
      plt.title("UMAP"); plt.show()

      # Projection de nouveaux points (contrairement à t-SNE)
      X_new_2d = reducer.transform(scaler.transform(X_new))

  - id: kernel_pca
    name: "Kernel PCA"
    enabled: true
    library: sklearn
    class: sklearn.decomposition.KernelPCA
    category: "Non-linéaire"
    description: "PCA dans un espace de features implicite via kernel trick. Capture des relations non-linéaires."
    use_cases: ["données non-linéaires", "preprocessing non-linéaire avant SVM"]
    pros: ["non-linéaire", "noyaux flexibles (rbf, poly, cosine)"]
    cons: ["lent sur grands datasets", "peu interprétable"]
    hyperparameters:
      n_components: [2, 5, 10, 20]
      kernel: ["rbf", "poly", "cosine", "sigmoid"]
      gamma: ["scale", 0.01, 0.1, 1]
    eval_metrics: ["reconstruction_error"]
    code_template: |
      from sklearn.decomposition import KernelPCA
      from sklearn.preprocessing import StandardScaler
      import matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      kpca = KernelPCA(n_components=2, kernel="rbf", gamma=0.1,
                       fit_inverse_transform=True, random_state=42)
      X_kpca = kpca.fit_transform(X_scaled)

      plt.scatter(X_kpca[:, 0], X_kpca[:, 1],
                  c=y if y is not None else "steelblue", cmap="tab10", alpha=0.5)
      plt.title("Kernel PCA (RBF)"); plt.show()

