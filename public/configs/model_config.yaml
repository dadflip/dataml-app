    description: >
      YOLOv8 (Ultralytics, 2023) est l'état de l'art en détection d'objets
      en temps réel. Architecture anchor-free, backbone CSPDarknet,
      head découpée (detection head découplée). Supporte la détection,
      la segmentation d'instance, le keypoint estimation et la
      classification. Fine-tuning en quelques lignes sur un dataset custom
      (format YOLO : .yaml + images + labels .txt). GPU fortement recommandé.
