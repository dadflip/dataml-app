# ══════════════════════════════════════════════════════════════════════════
# MODEL_CONFIG.YAML — Pipeline ML/DL : Bloc 3 — Entraînement des Modèles
# ══════════════════════════════════════════════════════════════════════════
#
#  RÔLE DE CE BLOC :
#    - Recevoir les données préparées du Bloc 2 (EDA / Feature Engineering)
#    - Entraîner le modèle sélectionné
#    - Visualiser l'entraînement (courbes de perte, historique)
#    - Sauvegarder le pipeline complet (preprocessor + modèle)
#    - Passer le modèle entraîné et les prédictions au Bloc 4 (Évaluation)
#
#  HORS PÉRIMÈTRE (autres blocs) :
#    - EDA / Feature Engineering         → Bloc 2
#    - Métriques d'évaluation détaillées  → Bloc 4
#    - Déploiement / serving              → Bloc 5
#
#  CONTRAT D'ENTRÉE (depuis Bloc 2) :
#    CONTRACT_TABULAR  → X_train, X_test, y_train, y_test,
#                        feature_names_out, preprocessor, task_type, meta
#    CONTRACT_VISION   → images_train, images_test, labels_train, labels_test,
#                        dl_train, dl_test, img_shape, n_classes, class_names
#    CONTRACT_SEQUENCE → sequences_train, sequences_test, labels_train, labels_test,
#                        seq_lengths, n_features, n_classes, dl_train, dl_test
#
#  CONTRAT DE SORTIE (vers Bloc 4) :
#    Commun à tous :
#      model              — objet modèle entraîné (sklearn, PyTorch, HF...)
#      y_pred             — prédictions sur X_test (classes ou valeurs)
#      y_proba            — probabilités (classification) | None (régression)
#      fit_time_s         — durée d'entraînement en secondes
#      training_history   — dict avec loss_curve, val_loss_curve, metrics_per_epoch
#      feature_importances — pd.Series | None
#      save_path          — chemin du fichier sauvegardé
#      full_pipeline      — dict {"preprocessor": ..., "model": ..., "meta": ...}
#      task_type          — str (inchangé)
#      meta               — dict (enrichi)
#
#  RÈGLE D'OR : ne jamais renommer les variables du contrat entre les blocs.
#  Seuls les paramètres en MAJUSCULES sont à adapter.
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
# CONTRAT I/O
# ──────────────────────────────────────────────────────────────────────────

pipeline_contract:
  bloc: 3
  role: "Entraînement · Visualisation · Sauvegarde · Inférence"

  input_variables:
    # Tabular
    X_train:           "np.ndarray | pd.DataFrame"
    X_test:            "np.ndarray | pd.DataFrame"
    y_train:           "pd.Series | np.ndarray"
    y_test:            "pd.Series | np.ndarray"
    feature_names_out: "list[str]"
    preprocessor:      "sklearn Pipeline | ColumnTransformer | None"
    task_type:         "str"
    meta:              "dict"
    # Vision
    images_train:      "np.ndarray (N,H,W,C) | None"
    images_test:       "np.ndarray (N,H,W,C) | None"
    labels_train:      "np.ndarray | None"
    labels_test:       "np.ndarray | None"
    dl_train:          "DataLoader | None"
    dl_test:           "DataLoader | None"
    img_shape:         "tuple | None"
    n_classes:         "int | None"
    class_names:       "list[str] | None"
    # Sequence
    sequences_train:   "np.ndarray (N,T,F) | None"
    sequences_test:    "np.ndarray (N,T,F) | None"
    seq_lengths:       "np.ndarray | None"
    n_features:        "int | None"

  output_variables:
    model:              "objet modèle entraîné"
    y_pred:             "np.ndarray — prédictions sur test"
    y_proba:            "np.ndarray | None — probabilités (clf) ou None (reg)"
    fit_time_s:         "float"
    training_history:   "dict — loss_curve, val_loss_curve, metrics_per_epoch"
    feature_importances: "pd.Series | None"
    save_path:          "str — chemin du fichier sauvegardé"
    full_pipeline:      "dict — preprocessor + model + meta + feature_names"
    task_type:          "str"
    meta:               "dict"


# ══════════════════════════════════════════════════════════════════════════
# SECTION 0 — UTILITAIRES TRANSVERSAUX
# Fonctions partagées par tous les snippets du Bloc 3
# ══════════════════════════════════════════════════════════════════════════

utilities:

  - id: save_load_pipeline
    name: "Sauvegarde & Chargement — Pipeline Complet (joblib / torch / HF)"
    enabled: true
    category: "Utilitaire — Persistance"
    description: >
      Sauvegarde l'intégralité du pipeline : preprocessor sklearn + modèle
      entraîné + feature_names + meta dans un fichier unique.
      Trois backends selon le type de modèle :
        - joblib  : sklearn / XGBoost / LightGBM / CatBoost / TabNet
        - torch   : PyTorch state_dict + architecture + config
        - hf      : HuggingFace save_pretrained()
      Inclut une fonction download() pour télécharger le fichier dans le
      navigateur via une URL data:// base64.
      Inclut une fonction load_pipeline() pour recharger et inférer.
    code_template: |
      import os, time, json, joblib, pickle
      import numpy as np
      import pandas as pd

      # ══════════════════════════════════════════════════════════════════
      # PARAMÈTRES
      # ══════════════════════════════════════════════════════════════════
      SAVE_DIR      = "./saved_models"
      MODEL_NAME    = meta.get("model_id", "model")
      BACKEND       = "joblib"   # "joblib" | "torch" | "hf"

      os.makedirs(SAVE_DIR, exist_ok=True)
      timestamp = time.strftime("%Y%m%d_%H%M%S")
      save_path = os.path.join(SAVE_DIR, f"{MODEL_NAME}_{timestamp}")

      # ══════════════════════════════════════════════════════════════════
      # CONSTRUCTION DU FULL_PIPELINE
      # ══════════════════════════════════════════════════════════════════
      full_pipeline = {
          "preprocessor"      : preprocessor,
          "model"             : model,
          "feature_names_in"  : feature_names_out,
          "task_type"         : task_type,
          "training_history"  : training_history,
          "meta"              : {k: v for k, v in meta.items()
                                 if not callable(v) and k != "graph_obj"},
      }

      # ══════════════════════════════════════════════════════════════════
      # SAUVEGARDE
      # ══════════════════════════════════════════════════════════════════
      if BACKEND == "joblib":
          save_path += ".pkl"
          joblib.dump(full_pipeline, save_path, compress=3)
          print(f"Pipeline sauvegardé (joblib) : {save_path}")
          print(f"Taille : {os.path.getsize(save_path) / 1024**2:.2f} MB")

      elif BACKEND == "torch":
          import torch
          save_path += "_torch"
          os.makedirs(save_path, exist_ok=True)
          # State dict du modèle PyTorch
          torch.save(model.state_dict(),
                     os.path.join(save_path, "model_state_dict.pt"))
          # Architecture / config du modèle (si disponible)
          if hasattr(model, "config"):
              with open(os.path.join(save_path, "model_config.json"), "w") as f:
                  json.dump(model.config.__dict__ if hasattr(model.config, "__dict__")
                            else model.config, f, indent=2, default=str)
          # Preprocessor sklearn
          if preprocessor is not None:
              joblib.dump(preprocessor,
                          os.path.join(save_path, "preprocessor.pkl"), compress=3)
          # Métadonnées
          with open(os.path.join(save_path, "meta.json"), "w") as f:
              json.dump({
                  "task_type"        : task_type,
                  "feature_names_in" : feature_names_out,
                  "training_history" : {k: [float(x) for x in v]
                                        for k, v in training_history.items()
                                        if isinstance(v, list)},
                  "meta"             : {k: str(v) for k, v in meta.items()
                                        if not callable(v) and k != "graph_obj"},
              }, f, indent=2)
          print(f"Pipeline sauvegardé (torch) : {save_path}/")

      elif BACKEND == "hf":
          save_path += "_hf"
          model.save_pretrained(save_path)
          if hasattr(full_pipeline.get("tokenizer"), "save_pretrained"):
              full_pipeline["tokenizer"].save_pretrained(save_path)
          if preprocessor is not None:
              joblib.dump(preprocessor,
                          os.path.join(save_path, "preprocessor.pkl"), compress=3)
          with open(os.path.join(save_path, "pipeline_meta.json"), "w") as f:
              json.dump({"task_type": task_type,
                         "feature_names_in": feature_names_out}, f, indent=2)
          print(f"Pipeline sauvegardé (HuggingFace) : {save_path}/")

      meta["save_path"]   = save_path
      meta["save_backend"]= BACKEND

      # ══════════════════════════════════════════════════════════════════
      # FONCTION DE CHARGEMENT & INFÉRENCE
      # ══════════════════════════════════════════════════════════════════
      def load_pipeline(path, backend="joblib"):
          """
          Charge un pipeline complet depuis le disque.

          Paramètres
          ----------
          path    : chemin du fichier/dossier sauvegardé
          backend : "joblib" | "torch" | "hf"

          Retourne
          --------
          full_pipeline dict ou modèle HF selon le backend
          """
          if backend == "joblib":
              pipe = joblib.load(path)
              print(f"Pipeline chargé : {path}")
              return pipe

          elif backend == "torch":
              import torch
              _meta = json.load(open(os.path.join(path, "meta.json")))
              _prep = (joblib.load(os.path.join(path, "preprocessor.pkl"))
                       if os.path.exists(os.path.join(path, "preprocessor.pkl"))
                       else None)
              # NB : l'architecture doit être réinstanciée avant load_state_dict
              print(f"Chargez l'architecture manuellement puis :")
              print(f"  model.load_state_dict(torch.load('{path}/model_state_dict.pt'))")
              return {"meta": _meta, "preprocessor": _prep,
                      "state_dict_path": os.path.join(path, "model_state_dict.pt")}

          elif backend == "hf":
              from transformers import AutoModelForSequenceClassification, AutoTokenizer
              _model     = AutoModelForSequenceClassification.from_pretrained(path)
              _tokenizer = AutoTokenizer.from_pretrained(path)
              _prep = (joblib.load(os.path.join(path, "preprocessor.pkl"))
                       if os.path.exists(os.path.join(path, "preprocessor.pkl"))
                       else None)
              return {"model": _model, "tokenizer": _tokenizer, "preprocessor": _prep}

      # ══════════════════════════════════════════════════════════════════
      # INFÉRENCE GÉNÉRIQUE (une fois rechargé)
      # ══════════════════════════════════════════════════════════════════
      def predict_from_pipeline(loaded_pipe, X_new, backend="joblib"):
          """
          Applique le pipeline complet (preprocessing + modèle) sur de
          nouvelles données.

          Paramètres
          ----------
          loaded_pipe : retour de load_pipeline()
          X_new       : pd.DataFrame ou np.ndarray — nouvelles observations
          backend     : "joblib" | "torch"

          Retourne
          --------
          y_pred_new  : np.ndarray — prédictions
          y_proba_new : np.ndarray | None
          """
          if backend == "joblib":
              _prep  = loaded_pipe["preprocessor"]
              _model = loaded_pipe["model"]
              X_proc = _prep.transform(X_new) if _prep is not None else X_new
              y_pred_new  = _model.predict(X_proc)
              y_proba_new = (_model.predict_proba(X_proc)
                             if hasattr(_model, "predict_proba") else None)
              return y_pred_new, y_proba_new
          elif backend == "torch":
              import torch
              _prep  = loaded_pipe.get("preprocessor")
              _state = loaded_pipe.get("state_dict_path")
              print(f"Chargez l'architecture, puis model.load_state_dict(torch.load('{_state}'))")
              return None, None

      print(f"\nUsage :")
      print(f"  pipe = load_pipeline('{save_path}', backend='{BACKEND}')")
      print(f"  y_new, p_new = predict_from_pipeline(pipe, X_new, backend='{BACKEND}')")

  - id: download_model
    name: "Téléchargement du modèle sauvegardé (navigateur)"
    enabled: true
    category: "Utilitaire — Download"
    description: >
      Génère un lien de téléchargement en base64 pour récupérer le modèle
      sauvegardé depuis l'interface web (claude.ai).
      Fonctionne pour les fichiers < 50 MB. Pour les fichiers plus lourds,
      utiliser save_path directement.
    code_template: |
      import os, base64, zipfile, io

      # ══════════════════════════════════════════════════════════════════
      # PARAMÈTRES
      # ══════════════════════════════════════════════════════════════════
      DOWNLOAD_PATH = save_path   # depuis le snippet save_load_pipeline
      MAX_SIZE_MB   = 50

      # ══════════════════════════════════════════════════════════════════
      # PACKAGING : dossier → zip, fichier → direct
      # ══════════════════════════════════════════════════════════════════
      if os.path.isdir(DOWNLOAD_PATH):
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(DOWNLOAD_PATH):
                  for fname in files:
                      fpath = os.path.join(root, fname)
                      arcname = os.path.relpath(fpath, os.path.dirname(DOWNLOAD_PATH))
                      zf.write(fpath, arcname)
          raw_bytes   = buf.getvalue()
          dl_filename = os.path.basename(DOWNLOAD_PATH) + ".zip"
          mime_type   = "application/zip"
      else:
          with open(DOWNLOAD_PATH, "rb") as f:
              raw_bytes = f.read()
          dl_filename = os.path.basename(DOWNLOAD_PATH)
          mime_type   = "application/octet-stream"

      size_mb = len(raw_bytes) / 1024**2
      print(f"Taille : {size_mb:.2f} MB")

      if size_mb > MAX_SIZE_MB:
          print(f"Fichier trop volumineux ({size_mb:.1f} MB > {MAX_SIZE_MB} MB).")
          print(f"Récupérez-le directement à : {DOWNLOAD_PATH}")
      else:
          b64 = base64.b64encode(raw_bytes).decode("utf-8")
          data_url = f"data:{mime_type};base64,{b64}"
          # Affichage du lien HTML (visible dans claude.ai)
          html_link = (
              f'<a href="{data_url}" download="{dl_filename}" '
              f'style="background:#1D9E75;color:white;padding:8px 16px;'
              f'border-radius:6px;text-decoration:none;font-family:sans-serif;">'
              f'⬇ Télécharger {dl_filename} ({size_mb:.1f} MB)</a>'
          )
          from IPython.display import HTML, display
          display(HTML(html_link))
          print(f"\nFichier : {dl_filename} ({size_mb:.1f} MB) — prêt au téléchargement.")

  - id: training_visualization
    name: "Visualisation de l'Entraînement — Courbes et Historique"
    enabled: true
    category: "Utilitaire — Visualisation"
    description: >
      Génère les courbes de perte (train / val), les métriques par époque,
      et un récapitulatif HTML de l'entraînement.
      Compatible avec sklearn (loss_curve_), PyTorch (liste de losses),
      HuggingFace (trainer.state.log_history).
      À appeler APRÈS l'entraînement et AVANT la sauvegarde.
    code_template: |
      import numpy as np
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import pandas as pd
      import os

      # ══════════════════════════════════════════════════════════════════
      # INIT training_history (si pas encore défini par le snippet modèle)
      # ══════════════════════════════════════════════════════════════════
      if "training_history" not in dir() or training_history is None:
          training_history = {
              "loss_curve"     : [],
              "val_loss_curve" : [],
              "metrics_per_epoch": [],
          }

      PLOT_DIR = "./training_plots"
      os.makedirs(PLOT_DIR, exist_ok=True)

      # ══════════════════════════════════════════════════════════════════
      # COURBE DE PERTE
      # ══════════════════════════════════════════════════════════════════
      loss_tr  = training_history.get("loss_curve",      [])
      loss_val = training_history.get("val_loss_curve",  [])
      metrics  = training_history.get("metrics_per_epoch", [])

      if loss_tr:
          fig, axes = plt.subplots(1, 2 if metrics else 1,
                                   figsize=(14 if metrics else 9, 5))
          if not isinstance(axes, np.ndarray):
              axes = [axes]

          # Perte
          axes[0].plot(loss_tr, linewidth=2, color="#1D9E75", label="Train loss")
          if loss_val:
              axes[0].plot(loss_val, linewidth=2, color="#D85A30",
                           linestyle="--", label="Val loss")
              best_ep = int(np.argmin(loss_val))
              axes[0].axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                              label=f"Best epoch ({best_ep+1})")
          axes[0].set_xlabel("Époque"); axes[0].set_ylabel("Loss")
          axes[0].set_title("Courbe de perte")
          axes[0].legend(); axes[0].grid(alpha=0.3)

          # Métriques par époque
          if metrics and len(axes) > 1:
              df_m = pd.DataFrame(metrics)
              for col in df_m.columns:
                  axes[1].plot(df_m[col], linewidth=1.5, label=col)
              axes[1].set_xlabel("Époque"); axes[1].set_ylabel("Score")
              axes[1].set_title("Métriques d'entraînement")
              axes[1].legend(); axes[1].grid(alpha=0.3)

          plt.suptitle(f"Entraînement — {meta.get('model_id', 'modèle')}")
          plt.tight_layout()
          plot_path = os.path.join(PLOT_DIR, "training_curves.png")
          plt.savefig(plot_path, dpi=130, bbox_inches="tight")
          plt.show()
          print(f"Courbes sauvegardées : {plot_path}")

          # Récapitulatif texte
          print("\n" + "=" * 60)
          print(f"RÉCAPITULATIF ENTRAÎNEMENT")
          print(f"  Époques       : {len(loss_tr)}")
          print(f"  Loss finale   : {loss_tr[-1]:.5f}")
          if loss_val:
              print(f"  Best val loss : {min(loss_val):.5f} (epoch {np.argmin(loss_val)+1})")
          print(f"  Durée         : {fit_time_s:.1f}s")
          print("=" * 60)
      else:
          print("Pas de courbe de perte disponible pour ce type de modèle.")
          print(f"Durée d'entraînement : {fit_time_s:.1f}s")


# ══════════════════════════════════════════════════════════════════════════
# SECTION A — CLASSIFICATION TABULAIRE
# ══════════════════════════════════════════════════════════════════════════

classification:

  - id: train_logistic_regression
    name: "Entraînement — Régression Logistique"
    enabled: true
    library: sklearn
    category: "Linéaire"
    applies_to: ["classification"]
    description: >
      Pipeline complet : StandardScaler → LogisticRegression.
      Recherche par GridSearchCV optionnelle. Visualisation des
      coefficients et courbe de convergence.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.linear_model import LogisticRegression
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.model_selection import GridSearchCV

      # ── Hyperparamètres ────────────────────────────────────────────────
      C            = 1.0
      PENALTY      = "l2"
      SOLVER       = "lbfgs"
      MAX_ITER     = 1000
      DO_GRIDSEARCH= False
      PARAM_GRID   = {"clf__C": [0.01, 0.1, 1, 10], "clf__penalty": ["l2"]}
      CV_FOLDS     = 5
      meta["model_id"] = "logistic_regression"

      # ── Pipeline ───────────────────────────────────────────────────────
      _pipe = Pipeline([
          ("scaler", StandardScaler()),
          ("clf",    LogisticRegression(C=C, penalty=PENALTY, solver=SOLVER,
                                        max_iter=MAX_ITER, random_state=42,
                                        n_jobs=-1))
      ])
      if preprocessor is not None:
          from sklearn.pipeline import make_pipeline
          _pipe = make_pipeline(preprocessor, _pipe)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      if DO_GRIDSEARCH:
          gs = GridSearchCV(_pipe, PARAM_GRID, cv=CV_FOLDS,
                            scoring="f1_weighted", n_jobs=-1, verbose=1)
          gs.fit(X_train, y_train)
          model = gs.best_estimator_
          print(f"Best params : {gs.best_params_}")
          print(f"Best CV score : {gs.best_score_:.4f}")
      else:
          _pipe.fit(X_train, y_train)
          model = _pipe

      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      # ── Prédictions ────────────────────────────────────────────────────
      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test)

      # ── Visualisation coefficients ─────────────────────────────────────
      try:
          _clf = model.named_steps.get("clf") or (
              model.best_estimator_.named_steps.get("clf")
              if DO_GRIDSEARCH else None)
          if _clf is not None and hasattr(_clf, "coef_"):
              n_cls = _clf.coef_.shape[0]
              fig, ax = plt.subplots(figsize=(max(10, len(feature_names_out) * 0.4), 5))
              coef_mean = np.abs(_clf.coef_).mean(axis=0)
              fi_series = pd.Series(coef_mean,
                                    index=feature_names_out).sort_values(ascending=True)
              fi_series.tail(25).plot.barh(ax=ax, color="steelblue")
              ax.set_title("Coefficients |β| moyennés par classe (Top 25)")
              plt.tight_layout()
              plt.savefig("training_lr_coefs.png", dpi=120, bbox_inches="tight")
              plt.show()
              feature_importances = pd.Series(coef_mean,
                                              index=feature_names_out).sort_values(ascending=False)
          else:
              feature_importances = None
      except Exception:
          feature_importances = None

      # ── Historique ─────────────────────────────────────────────────────
      training_history = {
          "loss_curve"      : [],   # LR sklearn n'expose pas la loss
          "val_loss_curve"  : [],
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
      }

      full_pipeline = {
          "preprocessor"    : preprocessor,
          "model"           : model,
          "feature_names_in": feature_names_out,
          "task_type"       : task_type,
          "training_history": training_history,
          "meta"            : meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_random_forest_clf
    name: "Entraînement — Random Forest Classifier"
    enabled: true
    library: sklearn
    category: "Ensemble — Bagging"
    applies_to: ["classification"]
    description: >
      RandomForestClassifier avec RandomizedSearchCV optionnel.
      Visualisation de l'importance MDI des features et OOB score.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.model_selection import RandomizedSearchCV
      from sklearn.pipeline import make_pipeline

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_ESTIMATORS    = 200
      MAX_DEPTH       = None
      MIN_SAMPLES_SPLIT = 2
      MAX_FEATURES    = "sqrt"
      OOB_SCORE       = True
      DO_SEARCH       = False
      N_ITER_SEARCH   = 20
      CV_FOLDS        = 5
      meta["model_id"] = "random_forest_clf"

      # ── Pipeline ───────────────────────────────────────────────────────
      _clf = RandomForestClassifier(
          n_estimators=N_ESTIMATORS, max_depth=MAX_DEPTH,
          min_samples_split=MIN_SAMPLES_SPLIT, max_features=MAX_FEATURES,
          oob_score=OOB_SCORE, n_jobs=-1, random_state=42)

      _pipe = make_pipeline(preprocessor, _clf) if preprocessor else _clf

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      if DO_SEARCH:
          _param_dist = {
              "n_estimators"     : [100, 200, 500],
              "max_depth"        : [5, 10, 20, None],
              "min_samples_split": [2, 5, 10],
              "max_features"     : ["sqrt", "log2", 0.5],
          }
          if preprocessor:
              _param_dist = {f"randomforestclassifier__{k}": v
                             for k, v in _param_dist.items()}
          search = RandomizedSearchCV(_pipe, _param_dist, n_iter=N_ITER_SEARCH,
                                      cv=CV_FOLDS, scoring="f1_weighted",
                                      n_jobs=-1, random_state=42, verbose=1)
          search.fit(X_train, y_train)
          model = search.best_estimator_
          print(f"Best params : {search.best_params_}")
      else:
          _pipe.fit(X_train, y_train)
          model = _pipe

      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      _rf = model[-1] if preprocessor else model
      if OOB_SCORE and hasattr(_rf, "oob_score_"):
          print(f"OOB Score : {_rf.oob_score_:.4f}")

      # ── Prédictions ────────────────────────────────────────────────────
      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test)

      # ── Feature Importance ─────────────────────────────────────────────
      _rf_final = model[-1] if hasattr(model, "__len__") else model
      if hasattr(_rf_final, "feature_importances_"):
          fi = pd.Series(_rf_final.feature_importances_,
                         index=feature_names_out).sort_values(ascending=False)
          feature_importances = fi
          top_n = min(30, len(fi))
          fig, ax = plt.subplots(figsize=(10, max(5, top_n * 0.35)))
          fi.head(top_n).sort_values().plot.barh(ax=ax, color="#1D9E75")
          ax.set_title(f"RF Feature Importance (MDI) — Top {top_n}")
          plt.tight_layout()
          plt.savefig("training_rf_importance.png", dpi=120, bbox_inches="tight")
          plt.show()
      else:
          feature_importances = None

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "oob_score": getattr(_rf_final, "oob_score_", None),
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_xgboost_clf
    name: "Entraînement — XGBoost Classifier"
    enabled: true
    library: xgboost
    category: "Ensemble — Boosting"
    applies_to: ["classification"]
    description: >
      XGBClassifier avec early stopping sur un validation set interne.
      Visualisation de l'importance des features (gain) et de la courbe
      d'entraînement/validation.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import xgboost as xgb
      from sklearn.model_selection import train_test_split
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import LabelEncoder

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_ESTIMATORS    = 500
      LEARNING_RATE   = 0.05
      MAX_DEPTH       = 5
      SUBSAMPLE       = 0.8
      COLSAMPLE_BYTREE= 0.8
      REG_ALPHA       = 0.0
      REG_LAMBDA      = 1.0
      EARLY_STOPPING  = 30
      VAL_FRACTION    = 0.1
      meta["model_id"] = "xgboost_clf"

      # ── Preprocessing labels ───────────────────────────────────────────
      _le = LabelEncoder()
      _y_tr = _le.fit_transform(y_train)
      _y_te = _le.transform(y_test)
      n_cls = len(_le.classes_)
      _obj  = "binary:logistic" if n_cls == 2 else "multi:softmax"
      _eval = "logloss" if n_cls == 2 else "mlogloss"

      # ── Preprocessing features ─────────────────────────────────────────
      _X_tr = preprocessor.fit_transform(X_train) if preprocessor else X_train
      _X_te = preprocessor.transform(X_test)       if preprocessor else X_test

      # ── Split validation interne ───────────────────────────────────────
      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr, _y_tr, test_size=VAL_FRACTION, random_state=42,
          stratify=_y_tr if n_cls < 20 else None)

      # ── Modèle ─────────────────────────────────────────────────────────
      _clf = xgb.XGBClassifier(
          n_estimators=N_ESTIMATORS, learning_rate=LEARNING_RATE,
          max_depth=MAX_DEPTH, subsample=SUBSAMPLE,
          colsample_bytree=COLSAMPLE_BYTREE, reg_alpha=REG_ALPHA,
          reg_lambda=REG_LAMBDA, objective=_obj,
          eval_metric=_eval, n_jobs=-1, random_state=42,
          num_class=n_cls if n_cls > 2 else None,
      )

      # ── Entraînement ───────────────────────────────────────────────────
      _evals_result = {}
      _t0 = time.perf_counter()
      _clf.fit(_X_tr2, _y_tr2,
               eval_set=[(_X_tr2, _y_tr2), (_X_val, _y_val)],
               early_stopping_rounds=EARLY_STOPPING,
               verbose=50,
               callbacks=[xgb.callback.EvaluationMonitor(period=50)])
      # Récupérer les résultats d'évaluation
      _evals = _clf.evals_result()
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      print(f"Meilleur nb d'arbres : {_clf.best_ntree_limit}")

      # ── Prédictions ────────────────────────────────────────────────────
      model   = _clf
      y_pred  = _le.inverse_transform(model.predict(_X_te))
      y_proba = model.predict_proba(_X_te)

      # ── Courbe de perte ────────────────────────────────────────────────
      _train_loss = list(_evals.get("validation_0", {}).get(_eval, []))
      _val_loss   = list(_evals.get("validation_1", {}).get(_eval, []))
      if _train_loss:
          fig, ax = plt.subplots(figsize=(10, 5))
          ax.plot(_train_loss, color="#1D9E75", linewidth=1.5, label="Train")
          if _val_loss:
              ax.plot(_val_loss, color="#D85A30", linestyle="--",
                      linewidth=1.5, label="Val")
              best = int(np.argmin(_val_loss))
              ax.axvline(best, color="gray", linestyle=":", alpha=0.7,
                         label=f"Best ({best+1})")
          ax.set_xlabel("Boost Round"); ax.set_ylabel(_eval)
          ax.set_title("XGBoost — Courbe de perte")
          ax.legend(); ax.grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_xgb_loss.png", dpi=120, bbox_inches="tight")
          plt.show()

      # ── Feature importance ─────────────────────────────────────────────
      _fi = pd.Series(model.feature_importances_,
                      index=feature_names_out).sort_values(ascending=False)
      feature_importances = _fi
      fig, ax = plt.subplots(figsize=(10, max(5, min(30, len(_fi)) * 0.35)))
      _fi.head(30).sort_values().plot.barh(ax=ax, color="#1D9E75")
      ax.set_title("XGBoost Feature Importance (gain) — Top 30")
      plt.tight_layout()
      plt.savefig("training_xgb_importance.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _train_loss,
          "val_loss_curve"  : _val_loss,
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
          "best_iteration"  : _clf.best_iteration,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "label_encoder": _le,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_lightgbm_clf
    name: "Entraînement — LightGBM Classifier"
    enabled: true
    library: lightgbm
    category: "Ensemble — Boosting"
    applies_to: ["classification"]
    description: >
      LGBMClassifier avec early stopping et callbacks de log.
      Très rapide sur grands datasets. Visualisation de la loss et
      des importances de features (split / gain).
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import lightgbm as lgb
      from sklearn.model_selection import train_test_split
      from sklearn.preprocessing import LabelEncoder

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_ESTIMATORS  = 500
      LEARNING_RATE = 0.05
      NUM_LEAVES    = 63
      MAX_DEPTH     = -1
      SUBSAMPLE     = 0.8
      COL_BYTREE    = 0.8
      REG_ALPHA     = 0.0
      REG_LAMBDA    = 1.0
      EARLY_STOPPING= 50
      VAL_FRACTION  = 0.1
      IMPORTANCE_TYPE = "gain"   # "split" | "gain"
      meta["model_id"] = "lightgbm_clf"

      _le = LabelEncoder()
      _y_tr = _le.fit_transform(y_train)
      _y_te = _le.transform(y_test)
      n_cls  = len(_le.classes_)
      _obj   = "binary" if n_cls == 2 else "multiclass"

      _X_tr = preprocessor.fit_transform(X_train) if preprocessor else np.array(X_train)
      _X_te = preprocessor.transform(X_test)       if preprocessor else np.array(X_test)
      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr, _y_tr, test_size=VAL_FRACTION, random_state=42)

      _clf = lgb.LGBMClassifier(
          n_estimators=N_ESTIMATORS, learning_rate=LEARNING_RATE,
          num_leaves=NUM_LEAVES, max_depth=MAX_DEPTH,
          subsample=SUBSAMPLE, colsample_bytree=COL_BYTREE,
          reg_alpha=REG_ALPHA, reg_lambda=REG_LAMBDA,
          objective=_obj, n_jobs=-1, random_state=42,
          num_class=n_cls if n_cls > 2 else None,
      )

      _train_losses = []; _val_losses = []
      class _LoggingCallback:
          def __call__(self, env):
              if env.evaluation_result_list:
                  _train_losses.append(env.evaluation_result_list[0][2])
                  if len(env.evaluation_result_list) > 1:
                      _val_losses.append(env.evaluation_result_list[1][2])

      _t0 = time.perf_counter()
      _clf.fit(
          _X_tr2, _y_tr2,
          eval_set=[(_X_tr2, _y_tr2), (_X_val, _y_val)],
          callbacks=[
              lgb.early_stopping(EARLY_STOPPING, verbose=True),
              lgb.log_evaluation(100),
              _LoggingCallback(),
          ],
      )
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      print(f"Meilleur nb d'itérations : {_clf.best_iteration_}")

      model   = _clf
      y_pred  = _le.inverse_transform(model.predict(_X_te))
      y_proba = model.predict_proba(_X_te)

      if _train_losses:
          fig, ax = plt.subplots(figsize=(10, 5))
          ax.plot(_train_losses, color="#1D9E75", linewidth=1.5, label="Train")
          if _val_losses:
              ax.plot(_val_losses, color="#D85A30", linestyle="--",
                      linewidth=1.5, label="Val")
              best = int(np.argmin(_val_losses))
              ax.axvline(best, color="gray", linestyle=":", alpha=0.7,
                         label=f"Best ({best+1})")
          ax.set_xlabel("Boost Round"); ax.set_ylabel("Loss")
          ax.set_title("LightGBM — Courbe de perte")
          ax.legend(); ax.grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_lgb_loss.png", dpi=120, bbox_inches="tight")
          plt.show()

      _fi = pd.Series(
          model.feature_importances_,
          index=feature_names_out).sort_values(ascending=False)
      feature_importances = _fi
      fig, ax = plt.subplots(figsize=(10, max(5, min(30, len(_fi)) * 0.35)))
      _fi.head(30).sort_values().plot.barh(ax=ax, color="#1D9E75")
      ax.set_title(f"LightGBM Feature Importance ({IMPORTANCE_TYPE}) — Top 30")
      plt.tight_layout()
      plt.savefig("training_lgb_importance.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"     : _train_losses,
          "val_loss_curve" : _val_losses,
          "metrics_per_epoch": [],
          "fit_time_s"     : fit_time_s,
          "best_iteration" : _clf.best_iteration_,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "label_encoder": _le,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_catboost_clf
    name: "Entraînement — CatBoost Classifier"
    enabled: true
    library: catboost
    category: "Ensemble — Boosting"
    applies_to: ["classification"]
    description: >
      CatBoostClassifier avec gestion native des catégorielles.
      Visualisation de la loss et des feature importances (PredictionValuesChange).
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from catboost import CatBoostClassifier, Pool

      # ── Hyperparamètres ────────────────────────────────────────────────
      ITERATIONS      = 500
      LEARNING_RATE   = 0.05
      DEPTH           = 6
      L2_LEAF_REG     = 3.0
      EARLY_STOPPING  = 50
      VAL_FRACTION    = 0.1
      VERBOSE         = 100
      meta["model_id"] = "catboost_clf"

      _X_tr = preprocessor.fit_transform(X_train) if preprocessor else X_train
      _X_te = preprocessor.transform(X_test)       if preprocessor else X_test

      # Détection des colonnes catégorielles
      _cat_features = []
      if hasattr(X_train, "dtypes"):
          _cat_features = [i for i, dtype in enumerate(X_train.dtypes)
                           if dtype == object or str(dtype) == "category"]

      from sklearn.model_selection import train_test_split
      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr, y_train, test_size=VAL_FRACTION, random_state=42)

      _pool_tr  = Pool(_X_tr2, _y_tr2, cat_features=_cat_features)
      _pool_val = Pool(_X_val, _y_val, cat_features=_cat_features)

      _clf = CatBoostClassifier(
          iterations=ITERATIONS, learning_rate=LEARNING_RATE,
          depth=DEPTH, l2_leaf_reg=L2_LEAF_REG,
          early_stopping_rounds=EARLY_STOPPING,
          eval_metric="Logloss",
          random_seed=42, verbose=VERBOSE,
      )

      _t0 = time.perf_counter()
      _clf.fit(_pool_tr, eval_set=_pool_val, plot=False)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      print(f"Meilleur nb d'itérations : {_clf.best_iteration_}")

      model   = _clf
      y_pred  = model.predict(_X_te).ravel()
      y_proba = model.predict_proba(_X_te)

      _evals = model.get_evals_result()
      _tr_loss = list(_evals.get("learn",   {}).get("Logloss", []))
      _va_loss = list(_evals.get("validation", {}).get("Logloss", []))
      if _tr_loss:
          fig, ax = plt.subplots(figsize=(10, 5))
          ax.plot(_tr_loss, color="#1D9E75", linewidth=1.5, label="Train")
          if _va_loss:
              ax.plot(_va_loss, color="#D85A30", linestyle="--",
                      linewidth=1.5, label="Val")
          ax.set_xlabel("Itération"); ax.set_ylabel("Logloss")
          ax.set_title("CatBoost — Courbe de perte")
          ax.legend(); ax.grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_cb_loss.png", dpi=120, bbox_inches="tight")
          plt.show()

      _fi = pd.Series(model.feature_importances_,
                      index=feature_names_out).sort_values(ascending=False)
      feature_importances = _fi
      fig, ax = plt.subplots(figsize=(10, max(5, min(30, len(_fi)) * 0.35)))
      _fi.head(30).sort_values().plot.barh(ax=ax, color="#1D9E75")
      ax.set_title("CatBoost Feature Importance — Top 30")
      plt.tight_layout()
      plt.savefig("training_cb_importance.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"     : _tr_loss,
          "val_loss_curve" : _va_loss,
          "metrics_per_epoch": [],
          "fit_time_s"     : fit_time_s,
          "best_iteration" : _clf.best_iteration_,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_svm_clf
    name: "Entraînement — SVM Classifier (RBF)"
    enabled: true
    library: sklearn
    category: "Kernel"
    applies_to: ["classification"]
    description: >
      Pipeline StandardScaler → SVC avec kernel RBF.
      GridSearchCV sur C et gamma optionnel.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      from sklearn.svm import SVC
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.model_selection import GridSearchCV

      # ── Hyperparamètres ────────────────────────────────────────────────
      C            = 1.0
      KERNEL       = "rbf"
      GAMMA        = "scale"
      DO_GRIDSEARCH= False
      PARAM_GRID   = {"svc__C": [0.1, 1, 10], "svc__gamma": ["scale", "auto", 0.01]}
      meta["model_id"] = "svm_clf"

      _pipe = Pipeline([
          ("scaler", StandardScaler()),
          ("svc",    SVC(C=C, kernel=KERNEL, gamma=GAMMA,
                         probability=True, random_state=42))
      ])
      if preprocessor:
          from sklearn.pipeline import make_pipeline
          _pipe = make_pipeline(preprocessor, _pipe)

      _t0 = time.perf_counter()
      if DO_GRIDSEARCH:
          gs = GridSearchCV(_pipe, PARAM_GRID, cv=5, scoring="f1_weighted",
                            n_jobs=-1, verbose=1)
          gs.fit(X_train, y_train)
          model = gs.best_estimator_
          print(f"Best params : {gs.best_params_}")
      else:
          _pipe.fit(X_train, y_train)
          model = _pipe

      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test)
      feature_importances = None

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_mlp_sklearn_clf
    name: "Entraînement — MLP Classifier (sklearn)"
    enabled: true
    library: sklearn
    category: "Feedforward — MLP"
    applies_to: ["classification"]
    description: >
      Pipeline StandardScaler → MLPClassifier avec early stopping.
      Visualisation de la loss_curve et validation_scores.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.neural_network import MLPClassifier
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler

      # ── Hyperparamètres ────────────────────────────────────────────────
      HIDDEN_LAYER_SIZES = (200, 100)
      ACTIVATION         = "relu"
      SOLVER             = "adam"
      ALPHA              = 1e-4
      LEARNING_RATE_INIT = 1e-3
      MAX_ITER           = 500
      EARLY_STOPPING     = True
      VAL_FRACTION       = 0.1
      N_ITER_NO_CHANGE   = 20
      meta["model_id"] = "mlp_sklearn_clf"

      _pipe = Pipeline([
          ("scaler", StandardScaler()),
          ("mlp",    MLPClassifier(
              hidden_layer_sizes=HIDDEN_LAYER_SIZES, activation=ACTIVATION,
              solver=SOLVER, alpha=ALPHA, learning_rate_init=LEARNING_RATE_INIT,
              max_iter=MAX_ITER, early_stopping=EARLY_STOPPING,
              validation_fraction=VAL_FRACTION,
              n_iter_no_change=N_ITER_NO_CHANGE,
              random_state=42, verbose=False))
      ])
      if preprocessor:
          from sklearn.pipeline import make_pipeline
          _pipe = make_pipeline(preprocessor, _pipe)

      _t0 = time.perf_counter()
      _pipe.fit(X_train, y_train)
      model = _pipe
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      y_pred  = model.predict(X_test)
      y_proba = model.predict_proba(X_test)
      feature_importances = None

      _mlp = model.named_steps.get("mlp") if hasattr(model, "named_steps") else model[-1]
      _loss_tr  = list(_mlp.loss_curve_) if hasattr(_mlp, "loss_curve_") else []
      _val_sc   = list(_mlp.validation_scores_) if hasattr(_mlp, "validation_scores_") else []

      if _loss_tr:
          fig, axes = plt.subplots(1, 2 if _val_sc else 1,
                                   figsize=(14 if _val_sc else 8, 5))
          if not isinstance(axes, np.ndarray): axes = [axes]
          axes[0].plot(_loss_tr, color="#1D9E75", linewidth=1.5)
          axes[0].set_xlabel("Époque"); axes[0].set_ylabel("Loss")
          axes[0].set_title("MLP — Loss d'entraînement")
          axes[0].grid(alpha=0.3)
          if _val_sc and len(axes) > 1:
              axes[1].plot(_val_sc, color="#D85A30", linewidth=1.5)
              axes[1].set_xlabel("Époque"); axes[1].set_ylabel("Val Score")
              axes[1].set_title("MLP — Score de validation")
              axes[1].grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_mlp_loss.png", dpi=120, bbox_inches="tight")
          plt.show()

      training_history = {
          "loss_curve"      : _loss_tr,
          "val_loss_curve"  : [],
          "val_scores"      : _val_sc,
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
          "n_iter"          : getattr(_mlp, "n_iter_", None),
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | n_iter={getattr(_mlp, 'n_iter_', '?')}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION B — RÉGRESSION TABULAIRE
# ══════════════════════════════════════════════════════════════════════════

regression:

  - id: train_linear_regression
    name: "Entraînement — Régression Linéaire / Ridge / Lasso / ElasticNet"
    enabled: true
    library: sklearn
    category: "Linéaire"
    applies_to: ["regression"]
    description: >
      Pipeline StandardScaler → régression linéaire.
      Choix entre OLS, Ridge, Lasso, ElasticNet.
      Visualisation des résidus et des coefficients.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.linear_model import (LinearRegression, Ridge,
                                         Lasso, ElasticNet)

      # ── Hyperparamètres ────────────────────────────────────────────────
      ESTIMATOR = "Ridge"    # "OLS" | "Ridge" | "Lasso" | "ElasticNet"
      ALPHA     = 1.0
      L1_RATIO  = 0.5        # ElasticNet uniquement
      meta["model_id"] = f"linear_{ESTIMATOR.lower()}"

      _reg_map = {
          "OLS"       : LinearRegression(),
          "Ridge"     : Ridge(alpha=ALPHA, random_state=42),
          "Lasso"     : Lasso(alpha=ALPHA, random_state=42, max_iter=5000),
          "ElasticNet": ElasticNet(alpha=ALPHA, l1_ratio=L1_RATIO,
                                   random_state=42, max_iter=5000),
      }
      _pipe = Pipeline([
          ("scaler", StandardScaler()),
          ("reg",    _reg_map[ESTIMATOR]),
      ])
      if preprocessor:
          from sklearn.pipeline import make_pipeline
          _pipe = make_pipeline(preprocessor, _pipe)

      _t0 = time.perf_counter()
      _pipe.fit(X_train, y_train)
      model = _pipe
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      y_pred  = model.predict(X_test)
      y_proba = None

      # Coefficients
      _reg = model.named_steps.get("reg") if hasattr(model, "named_steps") else model[-1]
      if hasattr(_reg, "coef_"):
          fi = pd.Series(np.abs(_reg.coef_).ravel(),
                         index=feature_names_out).sort_values(ascending=False)
          feature_importances = fi
          top_n = min(25, len(fi))
          fig, axes = plt.subplots(1, 2, figsize=(16, max(5, top_n * 0.35)))
          fi.head(top_n).sort_values().plot.barh(ax=axes[0], color="steelblue")
          axes[0].set_title(f"{ESTIMATOR} — |coefs| Top {top_n}")
          # Résidus
          residuals = np.array(y_test) - y_pred
          axes[1].scatter(y_pred, residuals, alpha=0.3, s=8, color="steelblue")
          axes[1].axhline(0, color="red", linestyle="--")
          axes[1].set_xlabel("Prédit"); axes[1].set_ylabel("Résidu")
          axes[1].set_title("Graphe des résidus")
          plt.tight_layout()
          plt.savefig("training_linreg_diag.png", dpi=120, bbox_inches="tight")
          plt.show()
      else:
          feature_importances = None

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_xgboost_reg
    name: "Entraînement — XGBoost Regressor"
    enabled: true
    library: xgboost
    category: "Ensemble — Boosting"
    applies_to: ["regression"]
    description: >
      XGBRegressor avec early stopping et visualisation de la RMSE
      train/val par itération.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import xgboost as xgb
      from sklearn.model_selection import train_test_split

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_ESTIMATORS    = 500
      LEARNING_RATE   = 0.05
      MAX_DEPTH       = 5
      SUBSAMPLE       = 0.8
      COLSAMPLE_BYTREE= 0.8
      EARLY_STOPPING  = 50
      VAL_FRACTION    = 0.1
      meta["model_id"] = "xgboost_reg"

      _X_tr = preprocessor.fit_transform(X_train) if preprocessor else np.array(X_train)
      _X_te = preprocessor.transform(X_test)       if preprocessor else np.array(X_test)
      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr, y_train, test_size=VAL_FRACTION, random_state=42)

      _reg = xgb.XGBRegressor(
          n_estimators=N_ESTIMATORS, learning_rate=LEARNING_RATE,
          max_depth=MAX_DEPTH, subsample=SUBSAMPLE,
          colsample_bytree=COLSAMPLE_BYTREE,
          eval_metric="rmse", n_jobs=-1, random_state=42)

      _t0 = time.perf_counter()
      _reg.fit(_X_tr2, _y_tr2,
               eval_set=[(_X_tr2, _y_tr2), (_X_val, _y_val)],
               early_stopping_rounds=EARLY_STOPPING,
               verbose=100)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      print(f"Meilleur nb d'arbres : {_reg.best_ntree_limit}")

      model   = _reg
      y_pred  = model.predict(_X_te)
      y_proba = None

      _evals    = _reg.evals_result()
      _tr_rmse  = list(_evals.get("validation_0", {}).get("rmse", []))
      _val_rmse = list(_evals.get("validation_1", {}).get("rmse", []))
      if _tr_rmse:
          fig, axes = plt.subplots(1, 2, figsize=(14, 5))
          axes[0].plot(_tr_rmse, color="#1D9E75", linewidth=1.5, label="Train")
          if _val_rmse:
              axes[0].plot(_val_rmse, color="#D85A30", linestyle="--",
                           linewidth=1.5, label="Val")
              best = int(np.argmin(_val_rmse))
              axes[0].axvline(best, color="gray", linestyle=":", alpha=0.7)
          axes[0].set_xlabel("Boost Round"); axes[0].set_ylabel("RMSE")
          axes[0].set_title("XGBoost Reg — Courbe RMSE"); axes[0].legend()
          # Scatter prédit vs réel
          axes[1].scatter(np.array(y_test), y_pred, alpha=0.3, s=8, color="steelblue")
          _mn = min(np.array(y_test).min(), y_pred.min())
          _mx = max(np.array(y_test).max(), y_pred.max())
          axes[1].plot([_mn, _mx], [_mn, _mx], "r--")
          axes[1].set_xlabel("Réel"); axes[1].set_ylabel("Prédit")
          axes[1].set_title("Réel vs Prédit")
          plt.tight_layout()
          plt.savefig("training_xgb_reg.png", dpi=120, bbox_inches="tight")
          plt.show()

      _fi = pd.Series(model.feature_importances_,
                      index=feature_names_out).sort_values(ascending=False)
      feature_importances = _fi

      training_history = {
          "loss_curve"     : _tr_rmse,
          "val_loss_curve" : _val_rmse,
          "metrics_per_epoch": [],
          "fit_time_s"     : fit_time_s,
          "best_iteration" : _reg.best_iteration,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")

  - id: train_lightgbm_reg
    name: "Entraînement — LightGBM Regressor"
    enabled: true
    library: lightgbm
    category: "Ensemble — Boosting"
    applies_to: ["regression"]
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import lightgbm as lgb
      from sklearn.model_selection import train_test_split

      N_ESTIMATORS   = 500
      LEARNING_RATE  = 0.05
      NUM_LEAVES     = 63
      MAX_DEPTH      = -1
      SUBSAMPLE      = 0.8
      COLSAMPLE      = 0.8
      EARLY_STOPPING = 50
      VAL_FRACTION   = 0.1
      meta["model_id"] = "lightgbm_reg"

      _X_tr = preprocessor.fit_transform(X_train) if preprocessor else np.array(X_train)
      _X_te = preprocessor.transform(X_test)       if preprocessor else np.array(X_test)
      _X_tr2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr, y_train, test_size=VAL_FRACTION, random_state=42)

      _reg = lgb.LGBMRegressor(
          n_estimators=N_ESTIMATORS, learning_rate=LEARNING_RATE,
          num_leaves=NUM_LEAVES, max_depth=MAX_DEPTH,
          subsample=SUBSAMPLE, colsample_bytree=COLSAMPLE,
          n_jobs=-1, random_state=42)

      _tr_losses = []; _val_losses = []
      class _CB:
          def __call__(self, env):
              if env.evaluation_result_list:
                  _tr_losses.append(env.evaluation_result_list[0][2])
                  if len(env.evaluation_result_list) > 1:
                      _val_losses.append(env.evaluation_result_list[1][2])

      _t0 = time.perf_counter()
      _reg.fit(
          _X_tr2, _y_tr2,
          eval_set=[(_X_tr2, _y_tr2), (_X_val, _y_val)],
          callbacks=[lgb.early_stopping(EARLY_STOPPING, verbose=True),
                     lgb.log_evaluation(100), _CB()])
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      model   = _reg
      y_pred  = model.predict(_X_te)
      y_proba = None

      if _tr_losses:
          fig, axes = plt.subplots(1, 2, figsize=(14, 5))
          axes[0].plot(_tr_losses, color="#1D9E75", linewidth=1.5, label="Train")
          if _val_losses:
              axes[0].plot(_val_losses, color="#D85A30", linestyle="--",
                           linewidth=1.5, label="Val")
          axes[0].set_title("LightGBM Reg — Loss"); axes[0].legend()
          axes[1].scatter(np.array(y_test), y_pred, alpha=0.3, s=8, color="steelblue")
          _mn = min(np.array(y_test).min(), y_pred.min())
          _mx = max(np.array(y_test).max(), y_pred.max())
          axes[1].plot([_mn, _mx], [_mn, _mx], "r--")
          axes[1].set_xlabel("Réel"); axes[1].set_ylabel("Prédit")
          axes[1].set_title("Réel vs Prédit")
          plt.tight_layout()
          plt.savefig("training_lgb_reg.png", dpi=120, bbox_inches="tight")
          plt.show()

      feature_importances = pd.Series(
          model.feature_importances_, index=feature_names_out
      ).sort_values(ascending=False)

      training_history = {
          "loss_curve": _tr_losses, "val_loss_curve": _val_losses,
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "best_iteration": _reg.best_iteration_,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"model={type(model).__name__} | y_pred shape={y_pred.shape}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION C — CLUSTERING
# ══════════════════════════════════════════════════════════════════════════

clustering:

  - id: train_kmeans
    name: "Entraînement — K-Means (avec recherche K optimal)"
    enabled: true
    library: sklearn
    category: "Centroïde"
    applies_to: ["clustering"]
    description: >
      K-Means avec recherche du K optimal via silhouette et elbow method.
      Visualisation de la courbe d'inertie, des scores de silhouette et
      de la distribution des clusters.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.cluster import KMeans
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score
      from sklearn.pipeline import Pipeline

      # ── Hyperparamètres ────────────────────────────────────────────────
      K_RANGE    = range(2, 11)
      N_INIT     = 10
      MAX_ITER   = 300
      AUTO_K     = True        # True = chercher K optimal
      K_FIXED    = 4           # ignoré si AUTO_K=True
      meta["model_id"] = "kmeans"

      _X = preprocessor.transform(X_train) if preprocessor else np.array(X_train)
      _scaler = StandardScaler()
      _X_sc   = _scaler.fit_transform(_X)

      inertias = []; sil_scores = []
      if AUTO_K:
          for k in K_RANGE:
              _km = KMeans(n_clusters=k, init="k-means++", n_init=N_INIT,
                           max_iter=MAX_ITER, random_state=42)
              _labels = _km.fit_predict(_X_sc)
              inertias.append(_km.inertia_)
              sil_scores.append(silhouette_score(_X_sc, _labels))

          best_k = list(K_RANGE)[int(np.argmax(sil_scores))]
          print(f"K optimal (silhouette) : {best_k}")

          fig, axes = plt.subplots(1, 2, figsize=(14, 5))
          axes[0].plot(list(K_RANGE), inertias, marker="o", color="#1D9E75", linewidth=2)
          axes[0].set_xlabel("K"); axes[0].set_ylabel("Inertie")
          axes[0].set_title("Elbow Method")
          axes[0].grid(alpha=0.3)
          axes[1].plot(list(K_RANGE), sil_scores, marker="o", color="#D85A30", linewidth=2)
          axes[1].axvline(best_k, color="gray", linestyle=":", alpha=0.7,
                          label=f"Best K={best_k}")
          axes[1].set_xlabel("K"); axes[1].set_ylabel("Silhouette score")
          axes[1].set_title("Silhouette Score par K")
          axes[1].legend(); axes[1].grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_kmeans_k_search.png", dpi=120, bbox_inches="tight")
          plt.show()
      else:
          best_k = K_FIXED

      # ── Modèle final ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _km_final = KMeans(n_clusters=best_k, init="k-means++",
                         n_init=N_INIT, max_iter=MAX_ITER, random_state=42)
      _labels_train = _km_final.fit_predict(_X_sc)
      fit_time_s = time.perf_counter() - _t0

      # Prédictions test
      _X_te = preprocessor.transform(X_test) if preprocessor else np.array(X_test)
      _X_te_sc = _scaler.transform(_X_te)
      y_pred  = _km_final.predict(_X_te_sc)
      y_proba = None   # clustering non supervisé
      model   = {"kmeans": _km_final, "scaler": _scaler,
                 "preprocessor": preprocessor}

      sil_final = silhouette_score(_X_sc, _labels_train)
      print(f"K={best_k} | Silhouette final : {sil_final:.4f}")
      print(f"Inertie : {_km_final.inertia_:.2f}")

      # Distribution des clusters
      fig, ax = plt.subplots(figsize=(8, 4))
      pd.Series(_labels_train).value_counts().sort_index().plot.bar(ax=ax, color="#1D9E75")
      ax.set_xlabel("Cluster"); ax.set_ylabel("Nombre d'observations")
      ax.set_title(f"Distribution des clusters (K={best_k})")
      plt.tight_layout()
      plt.savefig("training_kmeans_clusters.png", dpi=120, bbox_inches="tight")
      plt.show()

      feature_importances = None
      training_history = {
          "loss_curve"     : inertias,
          "sil_scores"     : sil_scores,
          "val_loss_curve" : [],
          "metrics_per_epoch": [],
          "fit_time_s"     : fit_time_s,
          "best_k"         : best_k,
          "silhouette"     : sil_final,
          "inertia"        : _km_final.inertia_,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      meta["n_clusters"] = best_k
      print(f"Clustering terminé en {fit_time_s:.2f}s")

  - id: train_dbscan
    name: "Entraînement — DBSCAN"
    enabled: true
    library: sklearn
    category: "Densité"
    applies_to: ["clustering", "anomaly"]
    description: >
      DBSCAN avec recherche automatique d'eps via le graphe des k-distances.
      Points de bruit (label=-1) utilisables comme anomalies.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.cluster import DBSCAN
      from sklearn.preprocessing import StandardScaler
      from sklearn.neighbors import NearestNeighbors

      # ── Hyperparamètres ────────────────────────────────────────────────
      EPS       = None    # None = auto via k-distance graph
      MIN_SAMPLES = 5
      K_NEIGHBORS = 5     # pour la recherche automatique d'eps
      METRIC    = "euclidean"
      meta["model_id"] = "dbscan"

      _X = preprocessor.transform(X_train) if preprocessor else np.array(X_train)
      _scaler = StandardScaler()
      _X_sc   = _scaler.fit_transform(_X)

      # Recherche automatique d'eps (knee du graphe k-distances)
      if EPS is None:
          _nbrs = NearestNeighbors(n_neighbors=K_NEIGHBORS).fit(_X_sc)
          _dists, _ = _nbrs.kneighbors(_X_sc)
          _k_dist = np.sort(_dists[:, -1])[::-1]
          fig, ax = plt.subplots(figsize=(10, 4))
          ax.plot(_k_dist, color="#1D9E75", linewidth=1.5)
          ax.set_xlabel("Points (triés)"); ax.set_ylabel(f"{K_NEIGHBORS}-distance")
          ax.set_title(f"Graphe {K_NEIGHBORS}-distance — chercher le coude pour eps")
          ax.grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_dbscan_kdist.png", dpi=120, bbox_inches="tight")
          plt.show()
          # Heuristique simple : inflexion
          _diff2 = np.diff(np.diff(_k_dist))
          _knee_idx = int(np.argmax(_diff2)) + 2
          EPS = float(_k_dist[_knee_idx])
          print(f"Eps auto (heuristique) : {EPS:.4f}")

      _t0 = time.perf_counter()
      _db = DBSCAN(eps=EPS, min_samples=MIN_SAMPLES, metric=METRIC, n_jobs=-1)
      _labels = _db.fit_predict(_X_sc)
      fit_time_s = time.perf_counter() - _t0

      n_clusters = len(set(_labels)) - (1 if -1 in _labels else 0)
      n_noise    = int((_labels == -1).sum())
      print(f"Clusters : {n_clusters} | Bruit : {n_noise} "
            f"({n_noise/len(_labels)*100:.1f}%)")

      model  = {"dbscan": _db, "scaler": _scaler, "preprocessor": preprocessor}
      y_pred = _labels
      y_proba = None
      feature_importances = None

      fig, ax = plt.subplots(figsize=(8, 4))
      pd.Series(_labels).value_counts().sort_index().plot.bar(ax=ax, color="#1D9E75")
      ax.set_xlabel("Cluster (-1 = bruit)"); ax.set_ylabel("Nb observations")
      ax.set_title(f"DBSCAN clusters (eps={EPS:.3f}, min_samples={MIN_SAMPLES})")
      plt.tight_layout()
      plt.savefig("training_dbscan_clusters.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "n_clusters": n_clusters, "n_noise": n_noise, "eps_used": EPS,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      meta["n_clusters"] = n_clusters
      print(f"DBSCAN terminé en {fit_time_s:.2f}s")

  - id: train_gaussian_mixture
    name: "Entraînement — Gaussian Mixture Model (GMM)"
    enabled: true
    library: sklearn
    category: "Probabiliste"
    applies_to: ["clustering"]
    description: >
      GaussianMixture avec sélection du nombre de composantes via BIC/AIC.
      Produit des probabilités d'appartenance par cluster.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.mixture import GaussianMixture
      from sklearn.preprocessing import StandardScaler

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_COMPONENTS_RANGE = range(2, 11)
      COVARIANCE_TYPE    = "full"   # "full"|"tied"|"diag"|"spherical"
      N_INIT             = 5
      AUTO_N             = True
      N_FIXED            = 4
      meta["model_id"] = "gmm"

      _X = preprocessor.transform(X_train) if preprocessor else np.array(X_train)
      _scaler = StandardScaler()
      _X_sc   = _scaler.fit_transform(_X)

      bic_scores = []; aic_scores = []
      if AUTO_N:
          for n in N_COMPONENTS_RANGE:
              _gm = GaussianMixture(n_components=n, covariance_type=COVARIANCE_TYPE,
                                    n_init=N_INIT, random_state=42)
              _gm.fit(_X_sc)
              bic_scores.append(_gm.bic(_X_sc))
              aic_scores.append(_gm.aic(_X_sc))

          best_n_bic = list(N_COMPONENTS_RANGE)[int(np.argmin(bic_scores))]
          best_n_aic = list(N_COMPONENTS_RANGE)[int(np.argmin(aic_scores))]
          best_n     = best_n_bic
          print(f"N optimal BIC : {best_n_bic} | AIC : {best_n_aic}")

          fig, ax = plt.subplots(figsize=(10, 5))
          ax.plot(list(N_COMPONENTS_RANGE), bic_scores, marker="o",
                  color="#1D9E75", linewidth=2, label="BIC")
          ax.plot(list(N_COMPONENTS_RANGE), aic_scores, marker="s",
                  color="#D85A30", linestyle="--", linewidth=2, label="AIC")
          ax.axvline(best_n_bic, color="gray", linestyle=":", alpha=0.7)
          ax.set_xlabel("Nb composantes"); ax.set_ylabel("Score")
          ax.set_title("GMM — Sélection N par BIC/AIC")
          ax.legend(); ax.grid(alpha=0.3)
          plt.tight_layout()
          plt.savefig("training_gmm_selection.png", dpi=120, bbox_inches="tight")
          plt.show()
      else:
          best_n = N_FIXED

      _t0 = time.perf_counter()
      _gm_final = GaussianMixture(n_components=best_n,
                                   covariance_type=COVARIANCE_TYPE,
                                   n_init=N_INIT, random_state=42)
      _gm_final.fit(_X_sc)
      fit_time_s = time.perf_counter() - _t0

      model   = {"gmm": _gm_final, "scaler": _scaler, "preprocessor": preprocessor}
      _X_te   = preprocessor.transform(X_test) if preprocessor else np.array(X_test)
      y_pred  = _gm_final.predict(_scaler.transform(_X_te))
      y_proba = _gm_final.predict_proba(_scaler.transform(_X_te))
      feature_importances = None

      print(f"BIC final : {_gm_final.bic(_X_sc):.2f}")
      training_history = {
          "bic_scores": bic_scores, "aic_scores": aic_scores,
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "best_n": best_n,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      meta["n_clusters"] = best_n
      print(f"GMM terminé en {fit_time_s:.2f}s")


# ══════════════════════════════════════════════════════════════════════════
# SECTION D — SÉRIES TEMPORELLES (MODÈLES CLASSIQUES)
# ══════════════════════════════════════════════════════════════════════════

timeseries:

  - id: train_prophet
    name: "Entraînement — Prophet (Meta)"
    enabled: true
    library: prophet
    category: "Décomposition"
    applies_to: ["timeseries"]
    description: >
      Prophet avec saisonnalités multiples et événements.
      Visualisation de la décomposition et de la forecast.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from prophet import Prophet

      # ── Hyperparamètres ────────────────────────────────────────────────
      SEASONALITY_MODE       = "multiplicative"
      CHANGEPOINT_PRIOR_SCALE= 0.05
      YEARLY_SEASONALITY     = "auto"
      WEEKLY_SEASONALITY     = True
      DAILY_SEASONALITY      = False
      INTERVALS_WIDTH        = 0.95
      meta["model_id"] = "prophet"

      _df_train = pd.DataFrame({"ds": dates_train, "y": y_train.values})
      _df_future = pd.DataFrame({"ds": dates_future})

      _t0 = time.perf_counter()
      model = Prophet(
          seasonality_mode=SEASONALITY_MODE,
          changepoint_prior_scale=CHANGEPOINT_PRIOR_SCALE,
          yearly_seasonality=YEARLY_SEASONALITY,
          weekly_seasonality=WEEKLY_SEASONALITY,
          daily_seasonality=DAILY_SEASONALITY,
          interval_width=INTERVALS_WIDTH,
      )
      model.fit(_df_train)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement Prophet terminé en {fit_time_s:.2f}s")

      forecast = model.predict(_df_future)
      y_pred   = forecast["yhat"].values
      y_proba  = None   # TS regression
      feature_importances = None

      # Visualisation
      fig1 = model.plot(forecast)
      fig1.suptitle("Prophet — Prévision")
      plt.tight_layout()
      plt.savefig("training_prophet_forecast.png", dpi=120, bbox_inches="tight")
      plt.show()
      fig2 = model.plot_components(forecast)
      plt.tight_layout()
      plt.savefig("training_prophet_components.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "changepoints": list(model.changepoints.dt.strftime("%Y-%m-%d")),
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "dates_future": dates_future, "forecast": forecast,
          "meta": meta,
      }
      print(f"Prophet | y_pred shape={y_pred.shape}")

  - id: train_arima_sarima
    name: "Entraînement — ARIMA / SARIMA (auto)"
    enabled: true
    library: statsmodels
    category: "ARIMA"
    applies_to: ["timeseries"]
    description: >
      ARIMA avec auto-sélection des ordres (p,d,q) via AIC,
      ou SARIMA manuellement configuré.
      Visualisation des diagnostics de résidus.
    code_template: |
      import time
      import warnings
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from statsmodels.tsa.statespace.sarimax import SARIMAX
      warnings.filterwarnings("ignore")

      # ── Hyperparamètres ────────────────────────────────────────────────
      AUTO_ORDER = True    # True = brute-force sur grille
      ORDER      = (1, 1, 1)          # (p, d, q)
      SEASONAL   = (1, 1, 1, 12)      # (P, D, Q, s) — None si non saisonnier
      SEARCH_GRID_P = range(0, 3)
      SEARCH_GRID_D = range(0, 2)
      SEARCH_GRID_Q = range(0, 3)
      meta["model_id"] = "arima_sarima"

      _series = y_train.values

      best_aic = np.inf
      best_order = ORDER

      _t0 = time.perf_counter()
      if AUTO_ORDER:
          for p in SEARCH_GRID_P:
            for d in SEARCH_GRID_D:
              for q in SEARCH_GRID_Q:
                try:
                    _m = SARIMAX(_series, order=(p, d, q),
                                 trend="n", enforce_stationarity=False).fit(disp=False)
                    if _m.aic < best_aic:
                        best_aic = _m.aic; best_order = (p, d, q)
                except Exception:
                    pass
          print(f"Meilleur ordre ARIMA : {best_order} | AIC : {best_aic:.2f}")

      _final_order    = best_order
      _seasonal_order = SEASONAL if SEASONAL else (0, 0, 0, 0)
      _mod = SARIMAX(_series, order=_final_order,
                     seasonal_order=_seasonal_order,
                     enforce_stationarity=False,
                     enforce_invertibility=False)
      _res = _mod.fit(disp=False)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")
      print(_res.summary())

      model = _res
      n_forecast = len(dates_future)
      _forecast = _res.get_forecast(steps=n_forecast)
      y_pred  = _forecast.predicted_mean.values
      y_proba = None
      feature_importances = None

      # Diagnostics
      _res.plot_diagnostics(figsize=(14, 8))
      plt.suptitle("ARIMA — Diagnostics des résidus")
      plt.tight_layout()
      plt.savefig("training_arima_diagnostics.png", dpi=120, bbox_inches="tight")
      plt.show()

      # Forecast
      _ci = _forecast.conf_int()
      fig, ax = plt.subplots(figsize=(14, 5))
      ax.plot(dates_train, y_train, color="steelblue", linewidth=1.5, label="Historique")
      ax.plot(dates_future, y_pred, color="#D85A30", linewidth=2, label="Prévision")
      ax.fill_between(dates_future, _ci.iloc[:, 0], _ci.iloc[:, 1],
                      alpha=0.2, color="#D85A30")
      ax.set_title(f"ARIMA{_final_order} — Prévision")
      ax.legend(); ax.grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig("training_arima_forecast.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "best_order": list(_final_order), "aic": best_aic,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "dates_future": dates_future, "meta": meta,
      }
      print(f"ARIMA | y_pred shape={y_pred.shape}")

  - id: train_ts_ml_xgb
    name: "Entraînement — XGBoost / LightGBM sur features TS (lag + rolling)"
    enabled: true
    library: xgboost
    category: "ML sur TS"
    applies_to: ["timeseries"]
    description: >
      Utilise les features lag/rolling du Bloc 2 (fe_lag_rolling_ts) comme
      entrées pour XGBoost ou LightGBM en régression temporelle.
      Visualisation prédit vs réel.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import xgboost as xgb

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_ESTIMATORS    = 300
      LEARNING_RATE   = 0.05
      MAX_DEPTH       = 5
      EARLY_STOPPING  = 30
      meta["model_id"] = "ts_xgb_features"

      # X_train / X_test contiennent déjà les features lag/rolling du Bloc 2
      _X_tr = np.array(X_train, dtype=np.float32)
      _X_te = np.array(X_test,  dtype=np.float32)
      _y_tr = np.array(y_train, dtype=np.float32)
      _y_te = np.array(y_test,  dtype=np.float32)

      _reg = xgb.XGBRegressor(
          n_estimators=N_ESTIMATORS, learning_rate=LEARNING_RATE,
          max_depth=MAX_DEPTH, subsample=0.8, colsample_bytree=0.8,
          eval_metric="rmse", n_jobs=-1, random_state=42)

      _t0 = time.perf_counter()
      _reg.fit(_X_tr, _y_tr,
               eval_set=[(_X_tr, _y_tr), (_X_te, _y_te)],
               early_stopping_rounds=EARLY_STOPPING,
               verbose=50)
      fit_time_s = time.perf_counter() - _t0

      model   = _reg
      y_pred  = model.predict(_X_te)
      y_proba = None

      _evals   = _reg.evals_result()
      _tr_rmse = list(_evals.get("validation_0", {}).get("rmse", []))
      _va_rmse = list(_evals.get("validation_1", {}).get("rmse", []))

      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      if _tr_rmse:
          axes[0].plot(_tr_rmse, color="#1D9E75", linewidth=1.5, label="Train")
          if _va_rmse:
              axes[0].plot(_va_rmse, color="#D85A30", linestyle="--",
                           linewidth=1.5, label="Val")
          axes[0].set_title("XGB TS — RMSE"); axes[0].legend()
      axes[1].plot(_y_te, color="steelblue", linewidth=1.5, label="Réel", alpha=0.8)
      axes[1].plot(y_pred, color="#D85A30", linewidth=1.5, label="Prédit", alpha=0.8)
      axes[1].set_title("Réel vs Prédit (test)"); axes[1].legend()
      plt.tight_layout()
      plt.savefig("training_ts_xgb.png", dpi=120, bbox_inches="tight")
      plt.show()

      feature_importances = pd.Series(
          model.feature_importances_, index=feature_names_out
      ).sort_values(ascending=False)

      training_history = {
          "loss_curve": _tr_rmse, "val_loss_curve": _va_rmse,
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"TS XGB | y_pred shape={y_pred.shape} | fit_time={fit_time_s:.2f}s")


# ══════════════════════════════════════════════════════════════════════════
# SECTION E — DÉTECTION D'ANOMALIES
# ══════════════════════════════════════════════════════════════════════════

anomaly_detection:

  - id: train_isolation_forest
    name: "Entraînement — Isolation Forest"
    enabled: true
    library: sklearn
    category: "Ensemble"
    applies_to: ["anomaly", "clustering"]
    description: >
      IsolationForest avec paramètre contamination ajustable.
      Visualisation de la distribution des scores d'anomalie et du seuil.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.ensemble import IsolationForest
      from sklearn.preprocessing import StandardScaler

      # ── Hyperparamètres ────────────────────────────────────────────────
      N_ESTIMATORS  = 200
      CONTAMINATION = 0.05
      MAX_SAMPLES   = "auto"
      meta["model_id"] = "isolation_forest"

      _X = preprocessor.transform(X_train) if preprocessor else np.array(X_train)
      _scaler = StandardScaler()
      _X_sc   = _scaler.fit_transform(_X)

      _t0 = time.perf_counter()
      _iso = IsolationForest(n_estimators=N_ESTIMATORS,
                              contamination=CONTAMINATION,
                              max_samples=MAX_SAMPLES,
                              n_jobs=-1, random_state=42)
      _iso.fit(_X_sc)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      model  = {"isolation_forest": _iso, "scaler": _scaler,
                "preprocessor": preprocessor}

      _X_te  = preprocessor.transform(X_test) if preprocessor else np.array(X_test)
      _X_te_sc = _scaler.transform(_X_te)
      y_pred  = _iso.predict(_X_te_sc)        # +1 normal / -1 anomalie
      _scores = _iso.decision_function(_X_te_sc)
      y_proba = None

      n_anomalies = int((y_pred == -1).sum())
      print(f"Anomalies détectées (test) : {n_anomalies} "
            f"({n_anomalies/len(y_pred)*100:.1f}%)")

      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      axes[0].hist(_scores, bins=50, color="steelblue", alpha=0.7, edgecolor="white")
      _thresh = _iso.offset_
      axes[0].axvline(_thresh, color="red", linestyle="--",
                      label=f"Seuil ({_thresh:.3f})")
      axes[0].set_xlabel("Anomaly Score"); axes[0].set_ylabel("Freq")
      axes[0].set_title("Distribution des scores d'anomalie")
      axes[0].legend()

      _tr_scores = _iso.decision_function(_X_sc)
      axes[1].hist(_tr_scores[_iso.predict(_X_sc) == 1],  bins=40,
                   color="#1D9E75", alpha=0.6, label="Normal", edgecolor="white")
      axes[1].hist(_tr_scores[_iso.predict(_X_sc) == -1], bins=40,
                   color="#D85A30", alpha=0.6, label="Anomalie", edgecolor="white")
      axes[1].set_title("Scores — Train (Normal vs Anomalie)")
      axes[1].legend()
      plt.tight_layout()
      plt.savefig("training_isoforest.png", dpi=120, bbox_inches="tight")
      plt.show()

      feature_importances = None
      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "n_anomalies_test": n_anomalies,
          "contamination": CONTAMINATION,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"Isolation Forest | y_pred shape={y_pred.shape}")

  - id: train_one_class_svm
    name: "Entraînement — One-Class SVM"
    enabled: true
    library: sklearn
    category: "Kernel"
    applies_to: ["anomaly"]
    description: >
      One-Class SVM avec kernel RBF. Entraîné uniquement sur les données
      normales. Visualisation de la frontière de décision en 2D (PCA).
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      from sklearn.svm import OneClassSVM
      from sklearn.preprocessing import StandardScaler
      from sklearn.decomposition import PCA

      # ── Hyperparamètres ────────────────────────────────────────────────
      NU    = 0.05   # fraction d'outliers attendue
      GAMMA = "scale"
      KERNEL= "rbf"
      meta["model_id"] = "one_class_svm"

      _X = preprocessor.transform(X_train) if preprocessor else np.array(X_train)
      _scaler = StandardScaler()
      _X_sc   = _scaler.fit_transform(_X)

      _t0 = time.perf_counter()
      _ocsvm = OneClassSVM(nu=NU, kernel=KERNEL, gamma=GAMMA)
      _ocsvm.fit(_X_sc)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      model = {"ocsvm": _ocsvm, "scaler": _scaler, "preprocessor": preprocessor}
      _X_te = preprocessor.transform(X_test) if preprocessor else np.array(X_test)
      _X_te_sc = _scaler.transform(_X_te)
      y_pred  = _ocsvm.predict(_X_te_sc)   # +1 / -1
      y_proba = None
      feature_importances = None

      n_anomalies = int((y_pred == -1).sum())
      print(f"Anomalies détectées : {n_anomalies} ({n_anomalies/len(y_pred)*100:.1f}%)")

      # Visualisation 2D via PCA
      _pca = PCA(n_components=2, random_state=42)
      _X_2d = _pca.fit_transform(_X_sc)
      fig, ax = plt.subplots(figsize=(10, 8))
      _pred_tr = _ocsvm.predict(_X_sc)
      ax.scatter(_X_2d[_pred_tr == 1,  0], _X_2d[_pred_tr == 1,  1],
                 c="#1D9E75", s=10, alpha=0.4, label="Normal")
      ax.scatter(_X_2d[_pred_tr == -1, 0], _X_2d[_pred_tr == -1, 1],
                 c="#D85A30", s=20, alpha=0.7, label="Anomalie")
      ax.set_title("One-Class SVM — PCA 2D")
      ax.legend(); ax.grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig("training_ocsvm_2d.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve": [], "val_loss_curve": [],
          "metrics_per_epoch": [], "fit_time_s": fit_time_s,
          "n_anomalies": n_anomalies, "nu": NU,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"One-Class SVM | fit_time={fit_time_s:.2f}s")


# ══════════════════════════════════════════════════════════════════════════
# SECTION F — RÉSEAUX DE NEURONES PYTORCH (TABULAIRE)
# ══════════════════════════════════════════════════════════════════════════

neural_networks_tabular:

  - id: train_pytorch_mlp_tabular
    name: "Entraînement — PyTorch MLP Tabulaire (classification & régression)"
    enabled: true
    library: torch
    category: "Feedforward — MLP"
    applies_to: ["classification", "regression"]
    description: >
      MLP PyTorch avec BatchNorm, Dropout, early stopping.
      Visualisation des courbes de loss train/val par époque.
      Sauvegarde state_dict + config.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      from sklearn.preprocessing import StandardScaler, LabelEncoder
      from sklearn.model_selection import train_test_split

      # ── Hyperparamètres ────────────────────────────────────────────────
      TASK         = "classification"   # "classification" | "regression"
      HIDDEN_DIMS  = [256, 128, 64]
      DROPOUT      = 0.2
      BATCHNORM    = True
      LR           = 3e-4
      WEIGHT_DECAY = 1e-5
      BATCH_SIZE   = 256
      EPOCHS       = 100
      PATIENCE     = 20
      VAL_FRACTION = 0.1
      ACTIVATION   = nn.ReLU
      DEVICE       = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      meta["model_id"] = "pytorch_mlp_tabular"
      print(f"Device : {DEVICE}")

      # ── Preprocessing ──────────────────────────────────────────────────
      _scaler = StandardScaler()
      _X_tr_raw = preprocessor.fit_transform(X_train) if preprocessor else np.array(X_train)
      _X_te_raw = preprocessor.transform(X_test)       if preprocessor else np.array(X_test)
      _X_tr_sc  = _scaler.fit_transform(_X_tr_raw)
      _X_te_sc  = _scaler.transform(_X_te_raw)

      if TASK == "classification":
          _le = LabelEncoder()
          _y_tr = _le.fit_transform(y_train)
          _y_te = _le.transform(y_test)
          N_OUT = len(_le.classes_)
          _crit = nn.CrossEntropyLoss()
          _y_tr_t = torch.tensor(_y_tr, dtype=torch.long)
      else:
          _le = None
          _y_tr = np.array(y_train, dtype=np.float32)
          _y_te = np.array(y_test,  dtype=np.float32)
          N_OUT = 1
          _crit = nn.MSELoss()
          _y_tr_t = torch.tensor(_y_tr).unsqueeze(1)

      _X_tr_sc2, _X_val, _y_tr2, _y_val = train_test_split(
          _X_tr_sc, _y_tr_t.numpy(), test_size=VAL_FRACTION, random_state=42)

      _tr_t = torch.tensor(_X_tr_sc2, dtype=torch.float32)
      _va_t = torch.tensor(_X_val,    dtype=torch.float32)
      _tr_y = (torch.tensor(_y_tr2, dtype=torch.long)
               if TASK == "classification"
               else torch.tensor(_y_tr2, dtype=torch.float32).unsqueeze(1)
               if _y_tr2.ndim == 1 else torch.tensor(_y_tr2, dtype=torch.float32))
      _va_y = (torch.tensor(_y_val, dtype=torch.long)
               if TASK == "classification"
               else torch.tensor(_y_val, dtype=torch.float32).unsqueeze(1)
               if np.array(_y_val).ndim == 1
               else torch.tensor(_y_val, dtype=torch.float32))
      _dl_tr = DataLoader(TensorDataset(_tr_t, _tr_y),
                          batch_size=BATCH_SIZE, shuffle=True)

      # ── Architecture ───────────────────────────────────────────────────
      class MLP(nn.Module):
          def __init__(self, in_dim, hidden_dims, out_dim, dropout, batchnorm, act):
              super().__init__()
              _layers, _prev = [], in_dim
              for h in hidden_dims:
                  _layers.append(nn.Linear(_prev, h))
                  if batchnorm: _layers.append(nn.BatchNorm1d(h))
                  _layers.append(act())
                  if dropout > 0: _layers.append(nn.Dropout(dropout))
                  _prev = h
              _layers.append(nn.Linear(_prev, out_dim))
              self.net = nn.Sequential(*_layers)
          def forward(self, x): return self.net(x)

      N_IN  = _X_tr_sc.shape[1]
      model = MLP(N_IN, HIDDEN_DIMS, N_OUT, DROPOUT, BATCHNORM, ACTIVATION).to(DEVICE)
      _opt  = torch.optim.Adam(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)
      _sch  = torch.optim.lr_scheduler.ReduceLROnPlateau(_opt, patience=5, factor=0.5)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_loss, _no_imp = float("inf"), 0
      _best_state = None
      _tr_losses  = []
      _va_losses  = []

      for _ep in range(EPOCHS):
          model.train(); _tl = 0.0
          for _xb, _yb in _dl_tr:
              _xb, _yb = _xb.to(DEVICE), _yb.to(DEVICE)
              _opt.zero_grad()
              _loss = _crit(model(_xb), _yb)
              _loss.backward(); _opt.step()
              _tl += _loss.item()
          _tl /= len(_dl_tr)
          _tr_losses.append(_tl)

          # Validation
          model.eval()
          with torch.no_grad():
              _va_out = model(_va_t.to(DEVICE)).cpu()
              _va_loss = _crit(_va_out, _va_y).item()
          _va_losses.append(_va_loss)
          _sch.step(_va_loss)

          if _va_loss < _best_loss - 1e-6:
              _best_loss = _va_loss; _no_imp = 0
              _best_state = {k: v.clone() for k, v in model.state_dict().items()}
          else:
              _no_imp += 1
          if _no_imp >= PATIENCE:
              print(f"Early stop epoch {_ep+1}"); break
          if (_ep+1) % 20 == 0:
              print(f"Epoch {_ep+1:4d} | train={_tl:.5f} | val={_va_loss:.5f}")

      if _best_state: model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      # ── Inférence ──────────────────────────────────────────────────────
      model.eval()
      _X_te_t = torch.tensor(_X_te_sc, dtype=torch.float32)
      with torch.no_grad():
          _logits = model(_X_te_t.to(DEVICE)).cpu()

      if TASK == "classification":
          y_proba = torch.softmax(_logits, 1).numpy()
          y_pred  = _le.inverse_transform(_logits.argmax(1).numpy())
      else:
          y_pred  = _logits.squeeze(1).numpy()
          y_proba = None

      feature_importances = None

      # ── Visualisation ──────────────────────────────────────────────────
      fig, ax = plt.subplots(figsize=(10, 5))
      ax.plot(_tr_losses, color="#1D9E75", linewidth=1.5, label="Train loss")
      ax.plot(_va_losses, color="#D85A30", linestyle="--",
              linewidth=1.5, label="Val loss")
      best_ep = int(np.argmin(_va_losses))
      ax.axvline(best_ep, color="gray", linestyle=":", alpha=0.7,
                 label=f"Best epoch ({best_ep+1})")
      ax.set_xlabel("Époque"); ax.set_ylabel("Loss")
      ax.set_title("PyTorch MLP — Courbes de perte")
      ax.legend(); ax.grid(alpha=0.3)
      plt.tight_layout()
      plt.savefig("training_pytorch_mlp.png", dpi=120, bbox_inches="tight")
      plt.show()

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : _va_losses,
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
          "best_epoch"      : best_ep + 1,
          "best_val_loss"   : _best_loss,
      }
      # Stocker scaler et le dans meta pour reload correct
      full_pipeline = {
          "preprocessor"    : preprocessor,
          "scaler"          : _scaler,
          "label_encoder"   : _le,
          "model_class"     : "MLP",
          "model_config"    : {
              "in_dim": N_IN, "hidden_dims": HIDDEN_DIMS, "out_dim": N_OUT,
              "dropout": DROPOUT, "batchnorm": BATCHNORM, "task": TASK,
          },
          "model"           : model,
          "feature_names_in": feature_names_out,
          "task_type"       : task_type,
          "training_history": training_history,
          "meta"            : meta,
      }
      print(f"MLP PyTorch | y_pred shape={np.array(y_pred).shape}")

  - id: train_tabnet
    name: "Entraînement — TabNet (Google Brain)"
    enabled: true
    library: pytorch_tabnet
    category: "Deep Learning — Tabular"
    applies_to: ["classification", "regression"]
    description: >
      TabNet avec sélection attentive de features par instance.
      Visualisation des masques d'attention et des importances globales.
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import matplotlib
      matplotlib.use("Agg")
      import matplotlib.pyplot as plt
      import torch
      from pytorch_tabnet.tab_model import TabNetClassifier, TabNetRegressor
      from sklearn.preprocessing import LabelEncoder

      # ── Hyperparamètres ────────────────────────────────────────────────
      TASK         = "classification"   # "classification" | "regression"
      N_D          = 32
      N_A          = 32
      N_STEPS      = 5
      GAMMA        = 1.5
      LAMBDA_SPARSE= 1e-3
      MAX_EPOCHS   = 200
      PATIENCE     = 30
      BATCH_SIZE   = 1024
      VIRTUAL_BATCH= 128
      meta["model_id"] = "tabnet"

      _X_tr = np.array(preprocessor.fit_transform(X_train)
                        if preprocessor else X_train, dtype=np.float32)
      _X_te = np.array(preprocessor.transform(X_test)
                        if preprocessor else X_test,  dtype=np.float32)

      if TASK == "classification":
          _le   = LabelEncoder()
          _y_tr = _le.fit_transform(y_train)
          _y_te = _le.transform(y_test)
          _clf  = TabNetClassifier(
              n_d=N_D, n_a=N_A, n_steps=N_STEPS, gamma=GAMMA,
              lambda_sparse=LAMBDA_SPARSE,
              optimizer_fn=torch.optim.Adam,
              optimizer_params=dict(lr=2e-2, weight_decay=1e-5),
              verbose=20, seed=42)
      else:
          _le   = None
          _y_tr = np.array(y_train, dtype=np.float32).reshape(-1, 1)
          _y_te = np.array(y_test,  dtype=np.float32).reshape(-1, 1)
          _clf  = TabNetRegressor(
              n_d=N_D, n_a=N_A, n_steps=N_STEPS, gamma=GAMMA,
              lambda_sparse=LAMBDA_SPARSE,
              optimizer_fn=torch.optim.Adam,
              optimizer_params=dict(lr=2e-2, weight_decay=1e-5),
              verbose=20, seed=42)

      _t0 = time.perf_counter()
      _clf.fit(_X_tr, _y_tr,
               eval_set=[(_X_te, _y_te)],
               eval_metric=["accuracy"] if TASK == "classification" else ["rmse"],
               max_epochs=MAX_EPOCHS, patience=PATIENCE,
               batch_size=BATCH_SIZE, virtual_batch_size=VIRTUAL_BATCH)
      fit_time_s = time.perf_counter() - _t0
      print(f"Entraînement terminé en {fit_time_s:.2f}s")

      model = _clf
      if TASK == "classification":
          y_pred  = _le.inverse_transform(model.predict(_X_te))
          y_proba = model.predict_proba(_X_te)
      else:
          y_pred  = model.predict(_X_te).ravel()
          y_proba = None

      # Feature importances
      _fi = pd.Series(model.feature_importances_,
                      index=feature_names_out).sort_values(ascending=False)
      feature_importances = _fi
      fig, ax = plt.subplots(figsize=(10, max(5, min(30, len(_fi)) * 0.35)))
      _fi.head(30).sort_values().plot.barh(ax=ax, color="#1D9E75")
      ax.set_title("TabNet Feature Importance (global) — Top 30")
      plt.tight_layout()
      plt.savefig("training_tabnet_importance.png", dpi=120, bbox_inches="tight")
      plt.show()

      _tr_losses = list(model.history.get("train_accuracy", []) or
                        model.history.get("train_rmse", []) or [])
      _va_losses = list(model.history.get("val_accuracy", []) or
                        model.history.get("val_rmse", []) or [])

      training_history = {
          "loss_curve"      : _tr_losses,
          "val_loss_curve"  : _va_losses,
          "metrics_per_epoch": [],
          "fit_time_s"      : fit_time_s,
      }
      full_pipeline = {
          "preprocessor": preprocessor, "model": model,
          "label_encoder": _le,
          "feature_names_in": feature_names_out,
          "task_type": task_type, "training_history": training_history,
          "meta": meta,
      }
      print(f"TabNet | y_pred shape={np.array(y_pred).shape}")


