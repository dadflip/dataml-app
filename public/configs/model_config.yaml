calibration_and_evaluation:  # utilitaires transverses
# ──────────────────────────────────────────────────────────────────────────

  - id: probability_calibration
    name: "Calibration des Probabilités"
    enabled: true
    library: sklearn
    class: sklearn.calibration.CalibratedClassifierCV
    category: "Post-traitement"
    description: "Corrige les probabilités mal calibrées via Platt Scaling (sigmoïde) ou isotonic regression."
    use_cases: ["quand les probabilités sont utilisées (pas seulement le label)", "après SVM, Boosting, RF"]
    pros: ["améliore la calibration sans changer le ranking", "simple à appliquer"]
    cons: ["peut légèrement dégrader l'AUC", "nécessite un jeu de calibration"]
    hyperparameters:
      method: ["sigmoid", "isotonic"]
      cv: [5, 10, "prefit"]
    eval_metrics: ["brier_score", "log_loss", "calibration_curve"]
    code_template: |
      from sklearn.calibration import CalibratedClassifierCV, calibration_curve
      from sklearn.ensemble import GradientBoostingClassifier
      from sklearn.metrics import brier_score_loss
      import matplotlib.pyplot as plt

      base_clf = GradientBoostingClassifier(n_estimators=200, random_state=42)

      # Calibration par cross-validation interne
      calibrated = CalibratedClassifierCV(base_clf, method="isotonic", cv=5)
      calibrated.fit(X_train, y_train)
      proba_cal = calibrated.predict_proba(X_test)[:, 1]

      # Courbe de calibration
      prob_true, prob_pred = calibration_curve(y_test, proba_cal, n_bins=10)
      plt.plot([0, 1], [0, 1], "k--", label="Parfait")
      plt.plot(prob_pred, prob_true, "s-", label="Calibré")
      plt.xlabel("Probabilité prédite"); plt.ylabel("Fraction de positifs")
      plt.legend(); plt.show()

      print(f"Brier Score : {brier_score_loss(y_test, proba_cal):.4f}")
