  - id: simclr_contrastive
    name: "SimCLR — Contrastive Self-Supervised Learning"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "Self-Supervised — Contrastive"
    description: >
      SimCLR (Simple Framework for Contrastive Learning of Visual Representations,
      Chen et al. 2020) apprend des représentations visuelles sans labels.
      Principe : deux augmentations différentes de la même image doivent
      être proches dans l'espace latent ; toutes les autres paires doivent
      être éloignées (NT-Xent loss). En pratique : (1) pré-entraîner le
      backbone + projection head sur des données non-labellisées,
      (2) fine-tuner uniquement la tête sur quelques exemples labellisés.
      Très efficace en régime few-shot ou quand les labels sont rares.
    use_cases:
      - "peu de labels disponibles (semi-supervisé)"
      - "pré-entraînement sur données de domaine spécifique"
      - "representation learning sans labels (clustering, retrieval)"
      - "transfer learning sur ImageNet non disponible (domaine très différent)"
      - "medical imaging, satellite imagery avec peu d'annotations"
    pros:
      - "pas de labels pour le pré-entraînement"
      - "robuste et généralisable"
      - "représentations de qualité proche du supervisé"
      - "extensible : SimCLRv2, MoCo, BYOL, DINO"
    cons:
      - "augmentations très importantes (choix critique)"
      - "gros batch size nécessaire (>256)"
      - "GPU et mémoire importants"
    hyperparameters:
      backbone:
        type: str
        choices: ["resnet18", "resnet50", "efficientnet_b0"]
        default: "resnet50"
      projection_dim:
        type: int
        default: 128
        description: "Dimension de la projection head (MLP 2 couches)."
      temperature:
        type: float
        range: [0.05, 0.5]
        default: 0.07
        description: "Température NT-Xent. Petit → contrastif fort."
      lr:
        type: float
        default: 3e-4
      batch_size:
        type: int
        choices: [256, 512, 1024, 2048]
        default: 512
        description: "Grand batch = plus de négatifs = meilleure qualité."
      pretrain_epochs:
        type: int
        default: 200
      finetune_epochs:
        type: int
        default: 30
        description: "Epochs de fine-tuning supervisé sur les données labellisées."
    eval_metrics: ["linear_probe_accuracy", "knn_accuracy", "finetune_accuracy"]
    io_contract:
      inputs:  [unlabeled_dir, labeled_dir, val_dir, n_classes]
      outputs: [model, backbone, y_pred, y_proba, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      import torch.nn.functional as F
      import torchvision.transforms as T
      import torchvision.models as tv_models
      from torchvision.datasets import ImageFolder
      from torch.utils.data import DataLoader, Dataset
      from sklearn.metrics import accuracy_score

      # ── Augmentations SimCLR ────────────────────────────────────────────
      class SimCLRAugment:
          def __init__(self, size=224):
              self.tf = T.Compose([
                  T.RandomResizedCrop(size, scale=(0.2, 1.0)),
                  T.RandomHorizontalFlip(),
                  T.RandomApply([T.ColorJitter(0.8, 0.8, 0.8, 0.2)], p=0.8),
                  T.RandomGrayscale(p=0.2),
                  T.GaussianBlur(kernel_size=int(0.1 * size) | 1),
                  T.ToTensor(),
                  T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225]),
              ])
          def __call__(self, x): return self.tf(x), self.tf(x)

      class ContrastiveDataset(Dataset):
          def __init__(self, ds, aug):
              self.ds  = ds; self.aug = aug
          def __len__(self): return len(self.ds)
          def __getitem__(self, i):
              img, _ = self.ds[i]
              v1, v2 = self.aug(img); return v1, v2

      # ── NT-Xent Loss ────────────────────────────────────────────────────
      def nt_xent_loss(z1, z2, temperature=0.07):
          z1 = F.normalize(z1, dim=1); z2 = F.normalize(z2, dim=1)
          z  = torch.cat([z1, z2], dim=0)  # (2N, D)
          sim = torch.mm(z, z.T) / temperature
          N   = z1.size(0)
          _labels = torch.arange(N, device=z.device)
          _labels = torch.cat([_labels + N, _labels])
          sim.fill_diagonal_(-1e9)  # masquer la diagonale
          return F.cross_entropy(sim, _labels)

      # ── Backbone + Projection Head ─────────────────────────────────────
      DEVICE = torch.device("cuda" if torch.cuda.is_available() else "cpu")
      BACKBONE_NAME = "resnet50"
      PROJ_DIM  = 128; TEMP = 0.07; LR = 3e-4; BATCH = 512; EPOCHS = 200

      backbone = getattr(tv_models, BACKBONE_NAME)(weights=None)
      _feat_dim = backbone.fc.in_features
      backbone.fc = nn.Identity()

      projection_head = nn.Sequential(
          nn.Linear(_feat_dim, 512), nn.BatchNorm1d(512), nn.ReLU(),
          nn.Linear(512, PROJ_DIM)
      )
      _simclr = nn.Sequential(backbone, projection_head).to(DEVICE)
      _opt = torch.optim.AdamW(_simclr.parameters(), lr=LR, weight_decay=1e-4)
      _sched = torch.optim.lr_scheduler.CosineAnnealingLR(_opt, T_max=EPOCHS)

      _raw_ds = ImageFolder(unlabeled_dir)
      _cont_ds = ContrastiveDataset(_raw_ds, SimCLRAugment())
      _loader  = DataLoader(_cont_ds, batch_size=BATCH, shuffle=True,
                            num_workers=8, pin_memory=True, drop_last=True)

      # ── Pré-entraînement ────────────────────────────────────────────────
      _t0 = time.perf_counter()
      for _epoch in range(EPOCHS):
          _simclr.train(); _tl = 0.0
          for _v1, _v2 in _loader:
              _v1, _v2 = _v1.to(DEVICE), _v2.to(DEVICE)
              _z1, _z2 = _simclr(_v1), _simclr(_v2)
              _loss = nt_xent_loss(_z1, _z2, TEMP)
              _opt.zero_grad(); _loss.backward(); _opt.step()
              _tl += _loss.item()
          _sched.step()
          if (_epoch + 1) % 50 == 0:
              print(f"Pretrain Epoch {_epoch+1} | NT-Xent: {_tl/len(_loader):.4f}")

      # ── Fine-tuning supervisé ────────────────────────────────────────────
      _val_tf = T.Compose([T.Resize(256), T.CenterCrop(224), T.ToTensor(),
                           T.Normalize([0.485, 0.456, 0.406], [0.229, 0.224, 0.225])])
      _labeled_ds = ImageFolder(labeled_dir,  transform=_val_tf)
      _val_ds     = ImageFolder(val_dir,       transform=_val_tf)
      N_CLASSES = len(_labeled_ds.classes)

      model = backbone  # backbone extrait, sans projection head
      _head = nn.Linear(_feat_dim, N_CLASSES).to(DEVICE)

      # Geler backbone, entraîner tête (linear probe)
      for p in model.parameters(): p.requires_grad = False
      _opt_ft = torch.optim.Adam(_head.parameters(), lr=1e-3)
      _dl_lab = DataLoader(_labeled_ds, batch_size=64, shuffle=True, num_workers=4)

      for _epoch in range(30):
          model.eval(); _head.train()
          for _x, _y in _dl_lab:
              _x, _y = _x.to(DEVICE), _y.to(DEVICE)
              with torch.no_grad(): _feat = model(_x)
              _loss = F.cross_entropy(_head(_feat), _y)
              _opt_ft.zero_grad(); _loss.backward(); _opt_ft.step()

      fit_time_s = time.perf_counter() - _t0

      # ── Évaluation ──────────────────────────────────────────────────────
      _val_dl = DataLoader(_val_ds, batch_size=128, shuffle=False, num_workers=4)
      model.eval(); _head.eval()
      y_pred, y_true_all, y_proba_list = [], [], []
      with torch.no_grad():
          for _x, _y in _val_dl:
              _l = _head(model(_x.to(DEVICE))).cpu()
              y_proba_list.append(F.softmax(_l, 1).numpy())
              y_pred.extend(_l.argmax(1).tolist()); y_true_all.extend(_y.tolist())

      y_proba = np.concatenate(y_proba_list)
      y_pred  = np.array(y_pred)
      metrics = {
          "linear_probe_accuracy": accuracy_score(y_true_all, y_pred),
          "fit_time_s": fit_time_s,
      }
      print(metrics)
      feature_importances = None


