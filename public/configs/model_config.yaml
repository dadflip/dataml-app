  # ── 9. GENERATIVE MODELS ────────────────────────────────────────────────

  - id: gan_tabular
    name: "CTGAN — GAN pour données tabulaires"
    enabled: true
    library: ctgan
    class: ctgan.CTGAN
    category: "GAN — Génératif Tabulaire"
    description: >
      CTGAN (Conditional Tabular GAN, Xu et al. 2019) génère des données
      tabulaires synthétiques en respectant les distributions marginales
      et corrélations des données réelles. Utilise un mode-specific
      normalization pour les features continues (mixture of Gaussians)
      et un conditional vector pour équilibrer les catégorielles.
      Usages principaux : augmentation de dataset, anonymisation des
      données sensibles, oversampling des classes minoritaires.
    use_cases:
      - "génération de données synthétiques pour la protection de la vie privée"
      - "augmentation de dataset (classes minoritaires)"
      - "partage de données anonymisées"
      - "simulation de scénarios (fraude, incidents)"
      - "test de robustesse des modèles"
    pros:
      - "gère les features mixtes (numériques + catégorielles)"
      - "mode-specific normalization → distributions réalistes"
      - "API simple (SDV library)"
    cons:
      - "qualité variable selon la complexité des données"
      - "entraînement long"
      - "évaluation de la qualité difficile sans ground truth"
    hyperparameters:
      epochs:
        type: int
        default: 300
      batch_size:
        type: int
        default: 500
      generator_dim:
        type: list
        default: "[256, 256]"
      discriminator_dim:
        type: list
        default: "[256, 256]"
      generator_lr:
        type: float
        default: 2e-4
      discriminator_lr:
        type: float
        default: 2e-4
      pac:
        type: int
        default: 10
        description: "PacGAN grouping. Améliore la diversité."
    eval_metrics: ["fidelity_score", "utility_score", "privacy_score", "ks_test"]
    io_contract:
      inputs:  [X_train_df, discrete_columns]
      outputs: [model, X_synthetic, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      from ctgan import CTGAN
      from scipy.stats import ks_2samp

      # ── Config ─────────────────────────────────────────────────────────
      EPOCHS          = 300
      BATCH_SIZE      = 500
      N_GENERATE      = len(X_train_df)  # générer autant que le train

      # X_train_df   : pd.DataFrame
      # discrete_columns : liste des colonnes catégorielles (str)
      # Ex: discrete_columns = ["gender", "product_category", "label"]

      _t0 = time.perf_counter()
      model = CTGAN(
          epochs=EPOCHS,
          batch_size=BATCH_SIZE,
          generator_dim=(256, 256),
          discriminator_dim=(256, 256),
          generator_lr=2e-4,
          discriminator_lr=2e-4,
          pac=10,
          verbose=True
      )
      model.fit(X_train_df, discrete_columns=discrete_columns)
      fit_time_s = time.perf_counter() - _t0

      # ── Génération ─────────────────────────────────────────────────────
      X_synthetic = model.sample(N_GENERATE)
      print(f"Données synthétiques générées : {X_synthetic.shape}")

      # ── Évaluation de la fidelité (KS test par colonne) ───────────────
      _ks_stats = {}
      for col in X_train_df.select_dtypes(include=np.number).columns:
          _stat, _p = ks_2samp(X_train_df[col].dropna(), X_synthetic[col].dropna())
          _ks_stats[col] = {"ks_stat": _stat, "p_value": _p}

      metrics = {
          "mean_ks_stat"  : float(np.mean([v["ks_stat"] for v in _ks_stats.values()])),
          "n_cols_ok_p05" : int(sum(v["p_value"] > 0.05 for v in _ks_stats.values())),
          "fit_time_s"    : fit_time_s,
      }
      print(f"KS moyen : {metrics['mean_ks_stat']:.4f} (plus bas = plus fidèle)")
      print(f"Colonnes p>0.05 : {metrics['n_cols_ok_p05']}/{len(_ks_stats)}")

      y_pred = y_proba = feature_importances = None


  # ── 10. REINFORCEMENT LEARNING ──────────────────────────────────────────

  - id: dqn_rl
    name: "Deep Q-Network (DQN) — Reinforcement Learning"
    enabled: true
    library: stable_baselines3
    class: stable_baselines3.DQN
    category: "Reinforcement Learning"
    description: >
      DQN (Mnih et al. 2015) est l'algorithme RL fondateur basé sur les
      réseaux de neurones. Il apprend une Q-function Q(s,a) via experience
      replay et target network. Stable-Baselines3 (SB3) fournit des
      implémentations robustes de DQN, PPO, SAC, TD3 avec une API sklearn-like.
      Applicable à n'importe quel environnement Gymnasium (jeux, trading,
      robotique simulée, optimisation combinatoire).
      PPO (Proximal Policy Optimization) est recommandé pour la plupart
      des cas ; DQN pour les espaces d'action discrets.
    use_cases:
      - "jeux (Atari, board games, jeux custom)"
      - "trading algorithmique (environnement simulé)"
      - "routage, scheduling, optimisation combinatoire"
      - "robotique simulée (MuJoCo, PyBullet)"
      - "optimisation de hyperparamètres"
    pros:
      - "SB3 : implémentation robuste, bien testée"
      - "API simple (pas besoin d'implémenter les algorithmes)"
      - "tensorboard intégré"
      - "callbacks pour évaluation, sauvegarde, early stopping"
    cons:
      - "récompenses et environnements à designer"
      - "instabilité d'entraînement (sensible aux hyperparamètres)"
      - "sample inefficiency (millions de steps requis)"
    hyperparameters:
      algorithm:
        type: str
        choices: ["DQN", "PPO", "SAC", "TD3", "A2C"]
        default: "PPO"
        description: >
          DQN = discret, simple. PPO = général, stable.
          SAC/TD3 = continu. A2C = simple, rapide.
      total_timesteps:
        type: int
        range: [10000, 10000000]
        default: 500000
      learning_rate:
        type: float
        default: 3e-4
      n_steps:
        type: int
        default: 2048
        description: "Steps par mise à jour (PPO). Augmenter pour environnements longs."
      batch_size:
        type: int
        default: 64
      gamma:
        type: float
        range: [0.9, 0.9999]
        default: 0.99
        description: "Facteur de dépréciation. Proche de 1 → horizon long."
      n_epochs:
        type: int
        default: 10
        description: "Epochs de mise à jour par rollout (PPO)."
      policy:
        type: str
        choices: ["MlpPolicy", "CnnPolicy", "MultiInputPolicy"]
        default: "MlpPolicy"
    eval_metrics: ["mean_reward", "std_reward", "success_rate", "ep_length_mean"]
    io_contract:
      inputs:  [env_id]
      outputs: [model, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import gymnasium as gym
      from stable_baselines3 import PPO, DQN, SAC
      from stable_baselines3.common.evaluation import evaluate_policy
      from stable_baselines3.common.callbacks import (EvalCallback,
                                                       StopTrainingOnRewardThreshold)
      from stable_baselines3.common.vec_env import DummyVecEnv, VecNormalize
      from stable_baselines3.common.monitor import Monitor

      # ── Config ─────────────────────────────────────────────────────────
      ALGO           = "PPO"           # PPO | DQN | SAC | TD3 | A2C
      ENV_ID         = "CartPole-v1"   # ou votre env custom
      TOTAL_STEPS    = 500_000
      POLICY         = "MlpPolicy"
      LR             = 3e-4
      GAMMA          = 0.99
      N_STEPS        = 2048            # PPO seulement
      N_EPOCHS       = 10              # PPO seulement
      BATCH_SIZE     = 64
      N_EVAL_EPISODES= 20
      DEVICE         = "cuda" if __import__("torch").cuda.is_available() else "cpu"

      # ── Environnements ─────────────────────────────────────────────────
      def _make_env(env_id, seed=0):
          def _init():
              _e = gym.make(env_id)
              _e = Monitor(_e)
              _e.reset(seed=seed)
              return _e
          return _init

      _train_env = DummyVecEnv([_make_env(ENV_ID, seed=i) for i in range(4)])
      _eval_env  = DummyVecEnv([_make_env(ENV_ID, seed=100)])

      # ── Modèle ─────────────────────────────────────────────────────────
      _algo_cls = {"PPO": PPO, "DQN": DQN, "SAC": SAC}[ALGO]
      _kwargs = dict(
          policy=POLICY, env=_train_env, learning_rate=LR,
          gamma=GAMMA, batch_size=BATCH_SIZE,
          verbose=1, device=DEVICE, seed=42
      )
      if ALGO == "PPO":
          _kwargs.update(n_steps=N_STEPS, n_epochs=N_EPOCHS, gae_lambda=0.95, clip_range=0.2)
      elif ALGO == "DQN":
          _kwargs.update(buffer_size=100_000, exploration_fraction=0.1,
                         exploration_final_eps=0.05, train_freq=4, target_update_interval=1000)
      elif ALGO == "SAC":
          _kwargs.update(buffer_size=1_000_000, learning_starts=100, ent_coef="auto")

      model = _algo_cls(**_kwargs)

      # ── Callbacks ──────────────────────────────────────────────────────
      _stop_cb = StopTrainingOnRewardThreshold(reward_threshold=475, verbose=1)
      _eval_cb = EvalCallback(_eval_env, eval_freq=5000, n_eval_episodes=N_EVAL_EPISODES,
                              best_model_save_path="./rl_best_model",
                              callback_on_new_best=_stop_cb, verbose=1)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      model.learn(total_timesteps=TOTAL_STEPS, callback=_eval_cb, progress_bar=True)
      fit_time_s = time.perf_counter() - _t0

      # ── Évaluation ─────────────────────────────────────────────────────
      _mean_reward, _std_reward = evaluate_policy(
          model, _eval_env, n_eval_episodes=N_EVAL_EPISODES, deterministic=True
      )
      metrics = {
          "mean_reward": float(_mean_reward),
          "std_reward" : float(_std_reward),
          "fit_time_s" : fit_time_s,
      }
      print(f"Reward moyen : {_mean_reward:.2f} ± {_std_reward:.2f}")

      # ── Sauvegarde & rechargement ──────────────────────────────────────
      model.save("rl_model_final")
      # model = PPO.load("rl_model_final", env=_eval_env)

      y_pred = y_proba = feature_importances = None


  # ── 11. TEMPORAL FUSION TRANSFORMER (TS avancée) ────────────────────────

  - id: temporal_fusion_transformer
    name: "Temporal Fusion Transformer (TFT) — Prévision multivariée interprétable"
    enabled: true
    library: pytorch_forecasting
    class: pytorch_forecasting.TemporalFusionTransformer
    category: "Transformer — Séries Temporelles"
    description: >
      TFT (Lim et al. 2020, Google) est l'architecture état de l'art pour
      la prévision de séries temporelles avec covariables. Combine :
      (1) variable selection networks (VSN) pour sélectionner les features
      pertinentes à chaque horizon, (2) LSTM pour l'encodage local,
      (3) self-attention pour les dépendances longue portée,
      (4) interprétabilité : attention par variable et par horizon.
      Gère simultanément des covariables statiques, connues dans le futur
      (jours fériés, prix planifié) et inconnues (météo passée).
      Sortie : quantiles (P10, P50, P90) = intervalles de prédiction.
    use_cases:
      - "prévision de ventes avec promotions, jours fériés, météo"
      - "prévision de demande d'énergie, transport"
      - "prévision financière multivariée"
      - "datasets avec plusieurs groupes de séries (paneldata)"
      - "besoin d'interprétabilité : quelles features influencent quels horizons"
    pros:
      - "interprétable nativement (attention weights par variable)"
      - "gère statique + dynamique + futur connu"
      - "sorties probabilistes (quantiles)"
      - "pytorch-forecasting : intégration PyTorch Lightning"
    cons:
      - "setup plus complexe (TimeSeriesDataSet)"
      - "sensible aux hyperparamètres"
      - "GPU recommandé pour datasets > 50k timesteps"
    hyperparameters:
      hidden_size:
        type: int
        range: [16, 512]
        default: 128
      attention_head_size:
        type: int
        range: [1, 8]
        default: 4
      dropout:
        type: float
        range: [0.0, 0.4]
        default: 0.1
      hidden_continuous_size:
        type: int
        default: 8
      output_size:
        type: int
        default: 7
        description: "Nombre de quantiles (7 = [0.02, 0.1, 0.25, 0.5, 0.75, 0.9, 0.98])."
      max_encoder_length:
        type: int
        default: 60
        description: "Fenêtre de contexte historique (timesteps)."
      max_prediction_length:
        type: int
        default: 12
        description: "Horizon de prévision (timesteps)."
      lr:
        type: float
        default: 1e-3
      batch_size:
        type: int
        default: 128
      max_epochs:
        type: int
        default: 30
    eval_metrics: ["MAE", "RMSE", "MAPE", "SMAPE", "quantile_loss", "coverage_80pct"]
    io_contract:
      inputs:  [df_timeseries, time_idx, target, group_ids, static_reals,
                static_categoricals, time_varying_known_reals,
                time_varying_unknown_reals]
      outputs: [model, forecast_df, metrics, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import pandas as pd
      import lightning.pytorch as pl
      from pytorch_forecasting import TemporalFusionTransformer, TimeSeriesDataSet
      from pytorch_forecasting.data import GroupNormalizer
      from pytorch_forecasting.metrics import QuantileLoss, MAE
      from lightning.pytorch.callbacks import EarlyStopping, LearningRateMonitor
      from torch.utils.data import DataLoader

      # ── Config ─────────────────────────────────────────────────────────
      MAX_ENCODER = 60     # fenêtre de contexte
      MAX_PRED    = 12     # horizon
      HIDDEN      = 128
      ATT_HEADS   = 4
      DROPOUT     = 0.1
      LR          = 1e-3
      BATCH_SIZE  = 128
      MAX_EPOCHS  = 30

      # df_timeseries doit contenir :
      #   - time_idx (int, croissant par groupe)
      #   - target   (float)
      #   - group_ids (str ou int, identifiant de la série)
      #   + covariables (statiques, dynamiques connues, inconnues)

      _cutoff = df_timeseries["time_idx"].max() - MAX_PRED

      _train_ds = TimeSeriesDataSet(
          df_timeseries[df_timeseries["time_idx"] <= _cutoff],
          time_idx           = "time_idx",
          target             = target,
          group_ids          = group_ids,
          min_encoder_length = MAX_ENCODER // 2,
          max_encoder_length = MAX_ENCODER,
          min_prediction_length = 1,
          max_prediction_length = MAX_PRED,
          static_reals           = static_reals if static_reals else [],
          static_categoricals    = static_categoricals if static_categoricals else [],
          time_varying_known_reals   = time_varying_known_reals if time_varying_known_reals else ["time_idx"],
          time_varying_unknown_reals = time_varying_unknown_reals + [target],
          target_normalizer  = GroupNormalizer(groups=group_ids, transformation="softplus"),
          add_relative_time_idx   = True,
          add_target_scales       = True,
          add_encoder_length      = True,
      )
      _val_ds = TimeSeriesDataSet.from_dataset(
          _train_ds, df_timeseries, predict=True, stop_randomization=True
      )

      _train_dl = DataLoader(_train_ds, batch_size=BATCH_SIZE, shuffle=True,  num_workers=4)
      _val_dl   = DataLoader(_val_ds,   batch_size=BATCH_SIZE, shuffle=False, num_workers=4)

      # ── Modèle ─────────────────────────────────────────────────────────
      model = TemporalFusionTransformer.from_dataset(
          _train_ds,
          learning_rate        = LR,
          hidden_size          = HIDDEN,
          attention_head_size  = ATT_HEADS,
          dropout              = DROPOUT,
          hidden_continuous_size = 8,
          output_size          = 7,   # quantiles
          loss                 = QuantileLoss(),
          reduce_on_plateau_patience = 4,
          log_val_interval     = 1,
      )
      print(f"Paramètres du modèle : {model.size()/1e6:.1f}M")

      # ── Entraînement ───────────────────────────────────────────────────
      _callbacks = [
          EarlyStopping(monitor="val_loss", patience=7, mode="min"),
          LearningRateMonitor(logging_interval="epoch"),
      ]
      trainer = pl.Trainer(
          max_epochs   = MAX_EPOCHS,
          accelerator  = "auto",
          gradient_clip_val = 0.1,
          callbacks    = _callbacks,
          enable_model_summary = True,
      )

      _t0 = time.perf_counter()
      trainer.fit(model, train_dataloaders=_train_dl, val_dataloaders=_val_dl)
      fit_time_s = time.perf_counter() - _t0

      # ── Prévision & interprétabilité ────────────────────────────────────
      _best_model = TemporalFusionTransformer.load_from_checkpoint(
          trainer.checkpoint_callback.best_model_path
      )
      _raw_preds, _idx = _best_model.predict(_val_dl, mode="raw", return_index=True)
      forecast_df = _best_model.predict(_val_dl, mode="prediction", return_index=True)

      # Attention par variable
      _interp = _best_model.interpret_output(_raw_preds, reduction="sum")
      _best_model.plot_interpretation(_interp)

      metrics = {
          "val_loss_best": float(trainer.checkpoint_callback.best_model_score),
          "fit_time_s"   : fit_time_s,
      }
      print(metrics)
      y_pred = y_proba = feature_importances = None


  # ── 12. NEURAL ODE ──────────────────────────────────────────────────────

  - id: neural_ode
    name: "Neural ODE — Équations Différentielles Neuronales"
    enabled: true
    library: torchdiffeq
    class: torchdiffeq.odeint
    category: "Neural ODE — Continu"
    description: >
      Les Neural ODEs (Chen et al. NeurIPS 2018) remplacent les couches
      discrètes par la solution d'une ODE continue : dh/dt = f(h,t,θ).
      Avantages : (1) mémoire constante pendant la backpropagation
      (adjoint method), (2) modèles de dynamique continues naturels
      pour les séries temporelles irrégulières, (3) profondeur adaptative.
      La variante Latent ODE étend les VAE aux séries temporelles
      avec des observations irrégulières. Également utilisé pour la
      modélisation de systèmes physiques, biologiques et financiers.
    use_cases:
      - "séries temporelles avec échantillonnage irrégulier (médical, capteurs)"
      - "modélisation de dynamiques physiques (EDO identifiées par données)"
      - "modèles génératifs continus (Latent ODE-VAE)"
      - "contrôle optimal : apprendre la dynamique d'un système"
      - "recherche : architectures alternatives aux ResNets"
    pros:
      - "adapté aux données irrégulièrement échantillonnées"
      - "profondeur adaptative (solver adaptatif)"
      - "O(1) mémoire via adjoint method"
      - "interprétable : dynamique continue"
    cons:
      - "entraînement plus lent (solver ODE à chaque step)"
      - "instabilité numérique possible"
      - "librairie moins mature que PyTorch standard"
    hyperparameters:
      func_hidden:
        type: list
        default: "[64, 64]"
        description: "Couches du réseau f(h,t,θ) qui définit la dérivée."
      latent_dim:
        type: int
        default: 16
      solver:
        type: str
        choices: ["euler", "rk4", "dopri5", "dopri8"]
        default: "rk4"
        description: "rk4 = Runge-Kutta 4 (précis, rapide). dopri5 = adaptatif."
      rtol:
        type: float
        default: 1e-3
      atol:
        type: float
        default: 1e-4
      lr:
        type: float
        default: 1e-3
      epochs:
        type: int
        default: 100
    eval_metrics: ["reconstruction_mse", "extrapolation_mse", "nll"]
    io_contract:
      inputs:  [t_train, X_train]
      outputs: [model, X_pred, metrics, fit_time_s]
      notes:   "t_train : (T,) timestamps ; X_train : (N, T, D) observations."
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn as nn
      from torchdiffeq import odeint

      # ── Config ─────────────────────────────────────────────────────────
      LATENT_DIM = 16
      ODE_HIDDEN = [64, 64]
      SOLVER     = "rk4"
      LR         = 1e-3
      EPOCHS     = 100
      DEVICE     = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # ── Fonction ODE ────────────────────────────────────────────────────
      class ODEFunc(nn.Module):
          """f(h, t, θ) : définit dh/dt."""
          def __init__(self, dim, hidden):
              super().__init__()
              _layers, _prev = [], dim
              for h in hidden:
                  _layers += [nn.Linear(_prev, h), nn.Tanh()]
                  _prev = h
              _layers.append(nn.Linear(_prev, dim))
              self.net = nn.Sequential(*_layers)
              # Compteur de NFE (number of function evaluations)
              self.nfe = 0
          def forward(self, t, h):
              self.nfe += 1
              return self.net(h)

      # ── Modèle ODENet ────────────────────────────────────────────────────
      class ODENet(nn.Module):
          def __init__(self, in_dim, latent_dim, ode_hidden, solver="rk4"):
              super().__init__()
              self.encoder = nn.Linear(in_dim, latent_dim)
              self.ode_func = ODEFunc(latent_dim, ode_hidden)
              self.decoder  = nn.Linear(latent_dim, in_dim)
              self.solver   = solver

          def forward(self, x0, t):
              # x0 : état initial (B, D) ; t : timestamps (T,)
              _h0 = self.encoder(x0)
              _ht = odeint(self.ode_func, _h0, t, method=self.solver,
                           rtol=1e-3, atol=1e-4)  # (T, B, latent)
              return self.decoder(_ht.permute(1, 0, 2))  # (B, T, D)

      # ── Données ─────────────────────────────────────────────────────────
      # t_train : (T,) timestamps normalisés [0,1]
      # X_train : (N, T, D) float32
      _t = torch.tensor(t_train, dtype=torch.float32).to(DEVICE)
      _X = torch.tensor(X_train, dtype=torch.float32).to(DEVICE)

      model = ODENet(_X.shape[2], LATENT_DIM, ODE_HIDDEN, SOLVER).to(DEVICE)
      _opt  = torch.optim.Adam(model.parameters(), lr=LR)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      for _epoch in range(EPOCHS):
          model.train()
          model.ode_func.nfe = 0
          _opt.zero_grad()
          _X_pred = model(_X[:, 0, :], _t)        # partir de t=0
          _loss   = nn.functional.mse_loss(_X_pred, _X)
          _loss.backward(); _opt.step()
          if (_epoch + 1) % 20 == 0:
              print(f"Epoch {_epoch+1:3d} | MSE: {_loss.item():.6f} | NFE: {model.ode_func.nfe}")
      fit_time_s = time.perf_counter() - _t0

      # ── Prédiction ─────────────────────────────────────────────────────
      model.eval()
      with torch.no_grad():
          X_pred = model(_X[:, 0, :], _t).cpu().numpy()

      metrics = {
          "reconstruction_mse": float(((X_pred - X_train) ** 2).mean()),
          "fit_time_s"        : fit_time_s,
      }
      print(metrics)
      y_pred = y_proba = feature_importances = None


# ──────────────────────────────────────────────────────────────────────────
tabular_deep_learning:
# ──────────────────────────────────────────────────────────────────────────

  - id: tabnet_clf
    name: "TabNet (Google Brain)"
    enabled: true
    library: pytorch_tabnet
    class: pytorch_tabnet.tab_model.TabNetClassifier
    category: "Deep Learning — Tabular"
    description: >
      Architecture attention-based pour données tabulaires. Sélection
      séquentielle de features par masques d'attention sparses (Sparsemax).
      Interprétabilité native : importance des features par instance et
      globale. Concurrent aux boosting methods sur tabular data.
    use_cases:
      - "tabular data avec interactions complexes"
      - "besoin d'interprétabilité au niveau instance"
      - "self-supervised pretraining avec données non-labellisées"
    pros:
      - "interprétabilité native par step d'attention"
      - "self-supervised pretraining possible"
      - "GPU natif"
    cons:
      - "sensible aux hyperparamètres"
      - "généralement sous-performe vs LightGBM sans tuning long"
    hyperparameters:
      n_d: { type: int, range: [8, 64], default: 32 }
      n_a: { type: int, range: [8, 64], default: 32 }
      n_steps: { type: int, range: [3, 10], default: 5 }
      gamma: { type: float, range: [1.0, 2.0], default: 1.5 }
      lambda_sparse: { type: float, range: [1e-6, 1e-3], default: 1e-3 }
      max_epochs: { type: int, range: [50, 1000], default: 200 }
      batch_size: { type: int, choices: [256, 512, 1024], default: 1024 }
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test, feature_names]
      outputs: [model, y_pred, y_proba, metrics, feature_importances, fit_time_s]
    code_template: |
      import time
      import numpy as np
      import torch
      from pytorch_tabnet.tab_model import TabNetClassifier
      from sklearn.metrics import f1_score, accuracy_score, roc_auc_score, classification_report
      from sklearn.preprocessing import LabelEncoder

      _X_tr = np.array(X_train, dtype=np.float32)
      _X_te = np.array(X_test,  dtype=np.float32)
      _le   = LabelEncoder()
      _y_tr = _le.fit_transform(y_train)
      _y_te = _le.transform(y_test)

      _t0 = time.perf_counter()
      model = TabNetClassifier(n_d=32, n_a=32, n_steps=5, gamma=1.5,
                               lambda_sparse=1e-3, mask_type="sparsemax",
                               optimizer_fn=torch.optim.Adam,
                               optimizer_params=dict(lr=2e-2, weight_decay=1e-5),
                               verbose=10, seed=42)
      model.fit(_X_tr, _y_tr, eval_set=[(_X_te, _y_te)],
                eval_metric=["accuracy"], max_epochs=200, patience=30,
                batch_size=1024, virtual_batch_size=128)
      fit_time_s = time.perf_counter() - _t0

      y_pred  = _le.inverse_transform(model.predict(_X_te))
      y_proba = model.predict_proba(_X_te)
      import pandas as pd
      feature_importances = pd.Series(model.feature_importances_, index=feature_names).sort_values(ascending=False)
      _is_binary = len(np.unique(_y_tr)) == 2
      metrics = {
          "accuracy"   : accuracy_score(y_test, y_pred),
          "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
          "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_binary else y_proba,
                                        multi_class="ovr", average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      print(classification_report(y_test, y_pred))
      print("Feature importance global (top 10):")
      print(feature_importances.head(10).to_string())

  - id: ft_transformer_clf
    name: "FT-Transformer (Feature Tokenizer + Transformer)"
    enabled: true
    library: rtdl
    class: rtdl.FTTransformer
    category: "Deep Learning — Tabular"
    description: >
      Tokenise chaque feature numérique ou catégorielle en embedding,
      puis applique un Transformer standard (attention multi-head).
      Souvent meilleur que les GBDT sur datasets avec nombreuses
      catégorielles et interactions complexes.
    use_cases:
      - "tabular data avec nombreuses features catégorielles"
      - "interactions d'ordre supérieur importantes"
    pros:
      - "capture des interactions longue portée entre features"
      - "prétraining possible"
    cons:
      - "plus lent que GBDT sur CPU"
      - "nécessite GPU"
    hyperparameters:
      n_blocks: { type: int, range: [1, 6], default: 3 }
      d_token:  { type: int, range: [64, 512], default: 192 }
      attention_n_heads: { type: int, range: [4, 16], default: 8 }
      attention_dropout: { type: float, range: [0.0, 0.5], default: 0.2 }
      ffn_dropout: { type: float, range: [0.0, 0.5], default: 0.1 }
      learning_rate: { type: float, range: [1e-5, 1e-3], default: 1e-4 }
      max_epochs: { type: int, range: [50, 500], default: 200 }
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    io_contract:
      inputs:  [X_train, X_test, y_train, y_test, feature_names]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
    code_template: |
      import time, numpy as np, torch, rtdl
      from sklearn.metrics import f1_score, accuracy_score, roc_auc_score

      _num_idx = list(range(X_train.shape[1]))
      _X_num_tr = torch.tensor(X_train[:, _num_idx], dtype=torch.float32)
      _X_num_te = torch.tensor(X_test[:,  _num_idx], dtype=torch.float32)
      _n_classes = len(np.unique(y_train))

      _t0 = time.perf_counter()
      model = rtdl.FTTransformer.make_default(
          n_num_features=len(_num_idx), cat_cardinalities=[],
          d_out=_n_classes, n_blocks=3)
      _optimizer = model.make_default_optimizer()
      _loss_fn = torch.nn.CrossEntropyLoss()
      _y_tr_t = torch.tensor(np.array(y_train), dtype=torch.long)

      for _epoch in range(100):
          model.train(); _optimizer.zero_grad()
          _logits = model(_X_num_tr, None)
          _loss = _loss_fn(_logits, _y_tr_t)
          _loss.backward(); _optimizer.step()
          if _epoch % 20 == 0: print(f"Epoch {_epoch} | loss: {_loss.item():.4f}")
      fit_time_s = time.perf_counter() - _t0

      model.eval()
      with torch.no_grad():
          _logits_te = model(_X_num_te, None)
          y_proba = torch.softmax(_logits_te, dim=1).numpy()
      y_pred = y_proba.argmax(axis=1)
      feature_importances = None
      _is_binary = _n_classes == 2
      metrics = {
          "accuracy"   : accuracy_score(y_test, y_pred),
          "f1_weighted": f1_score(y_test, y_pred, average="weighted"),
          "roc_auc"    : roc_auc_score(y_test, y_proba[:,1] if _is_binary else y_proba,
                                        multi_class="ovr", average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      print(metrics)


