                eval_set=[(X_test, y_test)],
                early_stopping_rounds=50,
                verbose=100)
      y_pred = model.predict(X_test)
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

  - id: lightgbm_reg
    name: "LightGBM Regressor"
    enabled: true
    library: lightgbm
    class: lightgbm.LGBMRegressor
    category: "Ensemble — Boosting"
    description: "Boosting sur histogrammes pour régression. Très rapide sur grands datasets."
    use_cases: ["grands datasets en régression"]
    pros: ["très rapide", "faible mémoire"]
    cons: ["sur-apprentissage possible sur petits jeux"]
