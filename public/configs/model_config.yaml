      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np

      model = lgb.LGBMRegressor(n_estimators=500, learning_rate=0.05,
                                  num_leaves=63, subsample=0.8,
                                  colsample_bytree=0.8, random_state=42, n_jobs=-1)
      model.fit(X_train, y_train,
                eval_set=[(X_test, y_test)],
                callbacks=[lgb.early_stopping(50), lgb.log_evaluation(100)])
      y_pred = model.predict(X_test)
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

  - id: svr
    name: "Support Vector Regression (SVR)"
    enabled: true
    library: sklearn
    class: sklearn.svm.SVR
    category: "Kernel"
    description: "SVR avec tube epsilon. Robuste aux outliers si bien configuré."
    use_cases: ["petits datasets", "régression non-linéaire"]
    pros: ["robuste aux outliers", "polyvalent (kernels)"]
    cons: ["lent sur grands datasets", "scaling obligatoire"]
    hyperparameters:
      C: [0.1, 1, 10, 100]
      kernel: ["rbf", "linear", "poly"]
      epsilon: [0.01, 0.1, 0.5]
      gamma: ["scale", "auto"]
    eval_metrics: ["rmse", "mae", "r2"]
    code_template: |
      from sklearn.svm import SVR
      from sklearn.pipeline import Pipeline
      from sklearn.preprocessing import StandardScaler
      from sklearn.model_selection import GridSearchCV
      from sklearn.metrics import mean_squared_error, r2_score
      import numpy as np

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("svr", SVR(C=10, kernel="rbf", epsilon=0.1, gamma="scale"))
      ])
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      print(f"RMSE: {np.sqrt(mean_squared_error(y_test, y_pred)):.4f} | R²: {r2_score(y_test, y_pred):.4f}")

      # GridSearch
      param_grid = {"svr__C": [1, 10, 100], "svr__epsilon": [0.01, 0.1, 0.5]}
      gs = GridSearchCV(model, param_grid, cv=5, scoring="neg_root_mean_squared_error")
      gs.fit(X_train, y_train)
      print("Best:", gs.best_params_)

  - id: quantile_regression
    name: "Quantile Regression (GBM)"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.GradientBoostingRegressor
    category: "Régression Quantile"
    description: "Prédit des quantiles (médiane, intervalles de confiance). Robuste aux outliers, intervalles de prédiction."
    use_cases: ["intervalles de prédiction", "données asymétriques", "quand la médiane est meilleure que la moyenne"]
    pros: ["intervalles de prédiction natifs", "robuste aux outliers", "asymétrie possible"]
    cons: ["plusieurs modèles à entraîner (un par quantile)", "plus lent"]
    hyperparameters:
      alpha: [0.05, 0.25, 0.5, 0.75, 0.95]
      n_estimators: [100, 200, 300]
      learning_rate: [0.05, 0.1]
    eval_metrics: ["pinball_loss", "coverage", "interval_width"]
    code_template: |
      from sklearn.ensemble import GradientBoostingRegressor
      import numpy as np

      quantiles = [0.1, 0.5, 0.9]
      models = {}
      for q in quantiles:
          m = GradientBoostingRegressor(loss="quantile", alpha=q,
                                         n_estimators=200, learning_rate=0.1,
                                         max_depth=4, random_state=42)
          m.fit(X_train, y_train)
          models[q] = m

      preds = {q: m.predict(X_test) for q, m in models.items()}
      coverage = np.mean((y_test >= preds[0.1]) & (y_test <= preds[0.9]))
      print(f"Couverture 80% : {coverage:.2%}")  # doit être ~0.80

  - id: bayesian_ridge
    name: "Bayesian Ridge Regression"
    enabled: true
    library: sklearn
    class: sklearn.linear_model.BayesianRidge
    category: "Bayésien"
    description: "Régression linéaire bayésienne avec estimation de l'incertitude sur les coefficients et les prédictions."
    use_cases: ["données limitées", "intervalles de confiance nécessaires", "régularisation automatique"]
    pros: ["incertitude sur les prédictions", "régularisation automatique", "interprétable"]
    cons: ["plus lent qu'OLS", "hypothèse linéaire"]
    hyperparameters:
      n_iter: [300]
      alpha_1: [1.0e-6]
      alpha_2: [1.0e-6]
      lambda_1: [1.0e-6]
      lambda_2: [1.0e-6]
    eval_metrics: ["rmse", "mae", "r2"]
    code_template: |
      from sklearn.linear_model import BayesianRidge
      from sklearn.preprocessing import StandardScaler
      from sklearn.pipeline import Pipeline
      import numpy as np

      model = Pipeline([
          ("scaler", StandardScaler()),
          ("reg", BayesianRidge(n_iter=300))
      ])
      model.fit(X_train, y_train)

      # Prédiction avec incertitude (std)
      y_pred, y_std = model["reg"].predict(model["scaler"].transform(X_test), return_std=True)
      print("Prédictions (5 premiers) :", y_pred[:5])
      print("Incertitude (std)        :", y_std[:5])

# ──────────────────────────────────────────────────────────────────────────
clustering:
# ──────────────────────────────────────────────────────────────────────────

  - id: kmeans
    name: "K-Means"
    enabled: true
    library: sklearn
    class: sklearn.cluster.KMeans
    category: "Centroïde"
    description: "Partitionne les données en K clusters en minimisant la variance intra-cluster."
    use_cases: ["segmentation client", "quantification", "données sphériques"]
    pros: ["simple", "rapide", "scalable", "interprétable"]
    cons: ["K à fixer a priori", "sensible aux outliers", "hypothèse de clusters sphériques"]
    hyperparameters:
      n_clusters: [2, 3, 4, 5, 6, 7, 8, 9, 10]
      init: ["k-means++", "random"]
      max_iter: [300]
    eval_metrics: ["silhouette", "davies_bouldin", "calinski_harabasz", "inertia"]
    code_template: |
      from sklearn.cluster import KMeans
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score, davies_bouldin_score
      import matplotlib.pyplot as plt
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      # Méthode du coude + silhouette
      inertias, sil_scores = [], []
      K_range = range(2, 11)
      for k in K_range:
          km = KMeans(n_clusters=k, init="k-means++", random_state=42, n_init=10)
          labels = km.fit_predict(X_scaled)
          inertias.append(km.inertia_)
          sil_scores.append(silhouette_score(X_scaled, labels))

      fig, axes = plt.subplots(1, 2, figsize=(12, 4))
      axes[0].plot(list(K_range), inertias, "bo-"); axes[0].set_title("Elbow")
      axes[1].plot(list(K_range), sil_scores, "ro-"); axes[1].set_title("Silhouette")
      plt.tight_layout(); plt.show()

      best_k = list(K_range)[np.argmax(sil_scores)]
      final_model = KMeans(n_clusters=best_k, random_state=42, n_init=10)
      labels = final_model.fit_predict(X_scaled)
      print(f"K optimal : {best_k} | Silhouette : {silhouette_score(X_scaled, labels):.3f}")

  - id: dbscan
    name: "DBSCAN"
    enabled: true
    library: sklearn
    class: sklearn.cluster.DBSCAN
    category: "Densité"
    description: "Cluster basé sur la densité. Détecte automatiquement les outliers et n'exige pas K fixé."
    use_cases: ["clusters de forme arbitraire", "détection d'anomalies", "données géospatiales"]
    pros: ["K non fixé", "détecte outliers", "formes arbitraires"]
    cons: ["sensible aux paramètres eps et min_samples", "difficile en haute dimension"]
    hyperparameters:
      eps: [0.1, 0.3, 0.5, 0.7, 1.0]
      min_samples: [3, 5, 10]
      metric: ["euclidean", "manhattan"]
    eval_metrics: ["silhouette", "davies_bouldin"]
    code_template: |
      from sklearn.cluster import DBSCAN
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score
      from sklearn.neighbors import NearestNeighbors
      import numpy as np, matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      # Estimation de eps via courbe k-distance
      nbrs = NearestNeighbors(n_neighbors=5).fit(X_scaled)
      distances, _ = nbrs.kneighbors(X_scaled)
      distances = np.sort(distances[:, -1])
      plt.plot(distances); plt.title("k-distance graph (choisir le coude)"); plt.show()

      db = DBSCAN(eps=0.5, min_samples=5, metric="euclidean")
      labels = db.fit_predict(X_scaled)
      n_clusters = len(set(labels)) - (1 if -1 in labels else 0)
      n_noise = np.sum(labels == -1)
      print(f"Clusters : {n_clusters} | Outliers : {n_noise}")
      if n_clusters > 1:
          mask = labels != -1
          print(f"Silhouette (sans outliers) : {silhouette_score(X_scaled[mask], labels[mask]):.3f}")

  - id: hdbscan
    name: "HDBSCAN"
    enabled: true
    library: hdbscan
    class: hdbscan.HDBSCAN
    category: "Densité Hiérarchique"
    description: "Version hiérarchique de DBSCAN. Plus robuste, pas besoin de eps."
    use_cases: ["données de densité variable", "clusters de tailles très différentes"]
    pros: ["robuste", "pas de eps", "densité variable", "détecte outliers"]
    cons: ["lent sur très grands datasets"]
    hyperparameters:
      min_cluster_size: [5, 10, 20, 50]
      min_samples: [1, 5, 10]
    eval_metrics: ["silhouette", "davies_bouldin"]
    code_template: |
      import hdbscan
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      clusterer = hdbscan.HDBSCAN(min_cluster_size=10, min_samples=5,
                                   cluster_selection_method="eom")
      labels = clusterer.fit_predict(X_scaled)
      n_clusters = len(set(labels)) - (1 if -1 in labels else 0)
      print(f"Clusters : {n_clusters} | Outliers : {np.sum(labels == -1)}")

      # Probabilité d'appartenance
      soft_labels = hdbscan.all_points_membership_vectors(clusterer)
      print("Probabilités (5 premiers) :", soft_labels[:5])

  - id: gaussian_mixture
    name: "Gaussian Mixture Model (GMM)"
    enabled: true
    library: sklearn
    class: sklearn.mixture.GaussianMixture
    category: "Probabiliste"
    description: "Modèle de mélange gaussien. Assigne des probabilités d'appartenance soft."
    use_cases: ["clusters elliptiques", "probabilités d'appartenance", "génération de données"]
    pros: ["soft assignment", "clusters elliptiques", "fondement probabiliste solide"]
    cons: ["K fixé", "peut converger vers un minimum local"]
    hyperparameters:
      n_components: [2, 3, 4, 5, 6, 7, 8]
      covariance_type: ["full", "tied", "diag", "spherical"]
    eval_metrics: ["silhouette", "bic", "aic"]
    code_template: |
      from sklearn.mixture import GaussianMixture
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score
      import numpy as np, matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      # Sélection de n_components par BIC
      bic_scores = []
      n_range = range(2, 10)
      for n in n_range:
          gm = GaussianMixture(n_components=n, covariance_type="full",
                               random_state=42, n_init=3)
          gm.fit(X_scaled)
          bic_scores.append(gm.bic(X_scaled))

      plt.plot(list(n_range), bic_scores, "go-")
      plt.title("BIC (minimiser)"); plt.xlabel("n_components"); plt.show()

      best_n = list(n_range)[np.argmin(bic_scores)]
      gm = GaussianMixture(n_components=best_n, covariance_type="full",
                           random_state=42, n_init=5)
      labels = gm.fit_predict(X_scaled)
      probas = gm.predict_proba(X_scaled)
      print(f"n_components optimal : {best_n}")
      print(f"Silhouette : {silhouette_score(X_scaled, labels):.3f}")

  - id: agglomerative
    name: "Clustering Agglomératif"
    enabled: true
    library: sklearn
    class: sklearn.cluster.AgglomerativeClustering
    category: "Hiérarchique"
    description: "Fusionne itérativement les clusters les plus proches. Dendrogramme interprétable."
    use_cases: ["structure hiérarchique dans les données", "quand K est inconnu", "taxonomies"]
    pros: ["pas besoin de K a priori (dendrogramme)", "déterministe", "interprétable"]
    cons: ["lent O(n²)", "pas scalable"]
    hyperparameters:
      n_clusters: [2, 3, 4, 5, 6, 7, 8]
      linkage: ["ward", "complete", "average", "single"]
    eval_metrics: ["silhouette", "davies_bouldin"]
    code_template: |
      from sklearn.cluster import AgglomerativeClustering
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import silhouette_score
      from scipy.cluster.hierarchy import dendrogram, linkage
      import matplotlib.pyplot as plt

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      # Dendrogramme pour choisir K
      Z = linkage(X_scaled, method="ward")
      plt.figure(figsize=(14, 6))
      dendrogram(Z, truncate_mode="lastp", p=30)
      plt.title("Dendrogramme (Ward)"); plt.show()

      model = AgglomerativeClustering(n_clusters=4, linkage="ward")
      labels = model.fit_predict(X_scaled)
      print(f"Silhouette : {silhouette_score(X_scaled, labels):.3f}")

# ──────────────────────────────────────────────────────────────────────────
timeseries:
# ──────────────────────────────────────────────────────────────────────────

  - id: arima
    name: "ARIMA"
    enabled: true
    library: statsmodels
    class: statsmodels.tsa.arima.model.ARIMA
    category: "Classique"
    description: "AutoRégression Intégrée Moyenne Mobile. Modèle standard pour séries stationnaires."
    use_cases: ["prévision univariée", "séries stationnaires ou rendues stationnaires"]
    pros: ["interprétable", "fondement statistique solide", "bien documenté"]
    cons: ["univarié uniquement", "hypothèse de stationnarité", "ordre p,d,q à choisir"]
    hyperparameters:
      p: [0, 1, 2, 3]
      d: [0, 1, 2]
      q: [0, 1, 2, 3]
    eval_metrics: ["mae", "rmse", "mape", "smape"]
    code_template: |
      from statsmodels.tsa.arima.model import ARIMA
      from statsmodels.tsa.stattools import adfuller
      from sklearn.metrics import mean_absolute_error
      import numpy as np, matplotlib.pyplot as plt

      # Test de stationnarité
      adf_result = adfuller(y_train)
      print(f"ADF stat: {adf_result[0]:.4f} | p-value: {adf_result[1]:.4f}")
      # Si p > 0.05 → non stationnaire → augmenter d

      model = ARIMA(y_train, order=(2, 1, 2))
      result = model.fit()
      print(result.summary())

      # Prévision sur n_steps
      n_steps = len(y_test)
      forecast = result.forecast(steps=n_steps)
      mae = mean_absolute_error(y_test, forecast)
      mape = np.mean(np.abs((y_test - forecast) / y_test)) * 100
      print(f"MAE: {mae:.4f} | MAPE: {mape:.2f}%")

      plt.plot(y_test.values, label="Réel")
      plt.plot(forecast.values, label="Prévision")
      plt.legend(); plt.show()

  - id: auto_arima
    name: "Auto-ARIMA"
    enabled: true
    library: pmdarima
    class: pmdarima.auto_arima
    category: "Classique"
    description: "Sélection automatique des ordres ARIMA par critère AIC/BIC. Version automatisée de ARIMA."
    use_cases: ["prévision univariée sans expertise TS", "exploration rapide"]
    pros: ["automatique", "teste saisonnalité", "sélection des ordres"]
    cons: ["lent sur grandes séries"]
    hyperparameters:
      seasonal: [true, false]
      m: [1, 4, 7, 12]
    eval_metrics: ["mae", "rmse", "mape"]
    code_template: |
      import pmdarima as pm
      from sklearn.metrics import mean_absolute_error
      import numpy as np

      model = pm.auto_arima(y_train,
                            seasonal=True, m=12,        # m=7 pour données hebdo
                            stepwise=True,
                            information_criterion="aic",
                            error_action="ignore",
                            suppress_warnings=True,
                            trace=True)
      print(model.summary())

      forecast = model.predict(n_periods=len(y_test))
      mae = mean_absolute_error(y_test, forecast)
      mape = np.mean(np.abs((y_test - forecast) / y_test)) * 100
      print(f"MAE: {mae:.4f} | MAPE: {mape:.2f}%")

  - id: prophet
    name: "Prophet (Meta)"
    enabled: true
    library: prophet
    class: prophet.Prophet
    category: "Décomposition"
    description: "Modèle additif de décomposition tendance + saisonnalité + évènements. Très facile d'usage."
    use_cases: ["séries avec saisonnalité forte", "effets de vacances/jours fériés", "datasets business"]
    pros: ["robuste aux données manquantes", "gère plusieurs saisonnalités", "interprétable", "simple"]
    cons: ["pas optimal pour séries très courtes ou sans saisonnalité"]
    hyperparameters:
      seasonality_mode: ["additive", "multiplicative"]
      changepoint_prior_scale: [0.001, 0.01, 0.1, 0.5]
      yearly_seasonality: [true, false, "auto"]
    eval_metrics: ["mae", "rmse", "mape"]
    code_template: |
      from prophet import Prophet
      from prophet.diagnostics import cross_validation, performance_metrics
      import pandas as pd

      # Prophet attend les colonnes 'ds' (datetime) et 'y' (target)
      df_train = pd.DataFrame({"ds": dates_train, "y": y_train})
      df_future = pd.DataFrame({"ds": dates_future})

      model = Prophet(seasonality_mode="multiplicative",
                      changepoint_prior_scale=0.05,
                      yearly_seasonality="auto",
                      weekly_seasonality=True,
                      daily_seasonality=False)

      # Ajouter des jours fériés (optionnel)
      # model.add_country_holidays(country_name="FR")

      model.fit(df_train)
      forecast = model.predict(df_future)
      model.plot(forecast)
      model.plot_components(forecast)

      # Cross-validation intégrée
      df_cv = cross_validation(model, initial="365 days", period="90 days", horizon="30 days")
      print(performance_metrics(df_cv)[["mape", "rmse", "mae"]].mean())

  - id: xgboost_ts
    name: "XGBoost (Time Series)"
    enabled: true
    library: xgboost
    class: xgboost.XGBRegressor
    category: "ML avec features temporelles"
    description: "XGBoost avec features temporelles engineered (lags, rolling stats, encodage calendaire)."
    use_cases: ["séries multivariées", "features exogènes importantes", "non-linéarités complexes"]
    pros: ["capture non-linéarités", "features exogènes", "très performant"]
    cons: ["pas de gestion native du temps", "feature engineering manuel nécessaire"]
    hyperparameters:
      n_estimators: [100, 200, 300]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [3, 5, 7]
    eval_metrics: ["mae", "rmse", "mape"]
    code_template: |
      import pandas as pd
      import numpy as np
      import xgboost as xgb
      from sklearn.metrics import mean_absolute_error

      def create_ts_features(df, target_col, lags=[1, 7, 14, 28], rolling_windows=[7, 14, 28]):
          df = df.copy()
          for lag in lags:
              df[f"lag_{lag}"] = df[target_col].shift(lag)
          for w in rolling_windows:
              df[f"rolling_mean_{w}"] = df[target_col].shift(1).rolling(w).mean()
              df[f"rolling_std_{w}"]  = df[target_col].shift(1).rolling(w).std()
          df["dayofweek"]  = df.index.dayofweek
          df["month"]      = df.index.month
          df["quarter"]    = df.index.quarter
          df["dayofyear"]  = df.index.dayofyear
          return df.dropna()

      df_feat = create_ts_features(df, target_col="y")
      feature_cols = [c for c in df_feat.columns if c != "y"]

      split_idx = int(len(df_feat) * 0.8)
      X_train, y_train = df_feat.iloc[:split_idx][feature_cols], df_feat.iloc[:split_idx]["y"]
      X_test,  y_test  = df_feat.iloc[split_idx:][feature_cols], df_feat.iloc[split_idx:]["y"]

      model = xgb.XGBRegressor(n_estimators=300, learning_rate=0.05, max_depth=5,
                                 subsample=0.8, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)
      mape = np.mean(np.abs((y_test - y_pred) / y_test)) * 100
      print(f"MAE: {mean_absolute_error(y_test, y_pred):.4f} | MAPE: {mape:.2f}%")

  - id: exponential_smoothing
    name: "Exponential Smoothing (Holt-Winters)"
    enabled: true
    library: statsmodels
    class: statsmodels.tsa.holtwinters.ExponentialSmoothing
    category: "Classique"
    description: "Lissage exponentiel avec tendance et saisonnalité. Simple et souvent très compétitif."
    use_cases: ["prévision univariée", "tendance + saisonnalité claire", "données business"]
    pros: ["simple", "compétitif sur données de courte portée", "interprétable"]
    cons: ["univarié", "pas de covariables"]
    hyperparameters:
      trend: ["add", "mul", null]
      seasonal: ["add", "mul", null]
      seasonal_periods: [4, 7, 12, 52]
    eval_metrics: ["mae", "rmse", "mape"]
    code_template: |
      from statsmodels.tsa.holtwinters import ExponentialSmoothing
      from sklearn.metrics import mean_absolute_error
      import numpy as np

      model = ExponentialSmoothing(y_train,
                                   trend="add",
                                   seasonal="add",
                                   seasonal_periods=12,   # 12 pour données mensuelles
                                   initialization_method="estimated")
      result = model.fit(optimized=True)
      print(result.summary())

      forecast = result.forecast(len(y_test))
      mae = mean_absolute_error(y_test, forecast)
      mape = np.mean(np.abs((y_test - forecast) / y_test)) * 100
      print(f"MAE: {mae:.4f} | MAPE: {mape:.2f}%")

# ──────────────────────────────────────────────────────────────────────────
anomaly_detection:
# ──────────────────────────────────────────────────────────────────────────

  - id: isolation_forest
    name: "Isolation Forest"
    enabled: true
    library: sklearn
    class: sklearn.ensemble.IsolationForest
    category: "Ensemble"
    description: "Isole les anomalies par partitionnement aléatoire. Efficace et rapide."
    use_cases: ["détection d'anomalies multivariée", "fraude", "monitoring"]
    pros: ["rapide", "scalable", "pas besoin de labeled anomalies", "gère la haute dim"]
    cons: ["paramètre contamination à estimer"]
    hyperparameters:
      n_estimators: [100, 200]
      contamination: [0.01, 0.05, 0.1, 0.2]
      max_features: [0.5, 0.7, 1.0]
    eval_metrics: ["precision", "recall", "f1", "roc_auc"]
    code_template: |
      from sklearn.ensemble import IsolationForest
      from sklearn.preprocessing import StandardScaler
      from sklearn.metrics import classification_report
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      model = IsolationForest(n_estimators=200, contamination=0.05,
                              max_features=1.0, random_state=42, n_jobs=-1)
      model.fit(X_scaled)

      # Scores d'anomalie (plus bas = plus anormal)
      scores = model.decision_function(X_scaled)
      labels = model.predict(X_scaled)   # 1 = normal, -1 = anomalie
      anomalies = np.where(labels == -1)[0]
      print(f"Anomalies détectées : {len(anomalies)} ({len(anomalies)/len(X)*100:.1f}%)")

      # Si labels de vérité disponibles (y_true : 0=normal, 1=anomalie)
      # y_pred_bin = (labels == -1).astype(int)
      # print(classification_report(y_true, y_pred_bin))

  - id: local_outlier_factor
    name: "Local Outlier Factor (LOF)"
    enabled: true
    library: sklearn
    class: sklearn.neighbors.LocalOutlierFactor
    category: "Densité"
    description: "Détecte les anomalies par comparaison de densité locale. Bon pour les clusters de densité variable."
    use_cases: ["anomalies contextuelles", "données géographiques", "clusters de densité variable"]
    pros: ["sensible au contexte local", "intuitif"]
    cons: ["lent sur grands datasets", "choix de n_neighbors critique"]
    hyperparameters:
      n_neighbors: [5, 10, 20, 30]
      contamination: [0.05, 0.1, 0.15]
    eval_metrics: ["precision", "recall", "f1"]
    code_template: |
      from sklearn.neighbors import LocalOutlierFactor
      from sklearn.preprocessing import StandardScaler
      import numpy as np

      scaler = StandardScaler()
      X_scaled = scaler.fit_transform(X)

      lof = LocalOutlierFactor(n_neighbors=20, contamination=0.05,
                               novelty=False, metric="euclidean")
      labels = lof.fit_predict(X_scaled)   # 1 = normal, -1 = anomalie
      scores = -lof.negative_outlier_factor_  # plus élevé = plus anormal

      anomalies = np.where(labels == -1)[0]
      print(f"Anomalies : {len(anomalies)}")

      # Mode novelty=True pour prédire sur de nouvelles données
      # lof_nov = LocalOutlierFactor(novelty=True, ...) ; lof_nov.fit(X_train)
      # lof_nov.predict(X_new)

  - id: one_class_svm
    name: "One-Class SVM"
    enabled: true
    library: sklearn
    class: sklearn.svm.OneClassSVM
    category: "Kernel"
    description: "SVM entraîné uniquement sur données normales. Trouve la frontière de la distribution nominale."
    use_cases: ["quand les anomalies sont rares ou inconnues", "high dimensional data"]
    pros: ["efficace en haute dimension", "noyaux flexibles"]
    cons: ["scaling obligatoire", "très lent sur grands datasets"]
    hyperparameters:
      nu: [0.01, 0.05, 0.1, 0.2]
      kernel: ["rbf", "linear"]
      gamma: ["scale", "auto"]
    eval_metrics: ["precision", "recall", "f1"]
    code_template: |
      from sklearn.svm import OneClassSVM
      from sklearn.preprocessing import StandardScaler
      import numpy as np

      scaler = StandardScaler()
      X_normal_scaled = scaler.fit_transform(X_normal)  # entraîné sur données normales seulement
      X_test_scaled   = scaler.transform(X_test)

      model = OneClassSVM(nu=0.05, kernel="rbf", gamma="scale")
      model.fit(X_normal_scaled)

      labels = model.predict(X_test_scaled)  # 1 = normal, -1 = anomalie
      scores = model.decision_function(X_test_scaled)
      print(f"Anomalies : {np.sum(labels == -1)}")

  - id: autoencoder_anomaly
    name: "Autoencodeur (Anomalie)"
    enabled: true
    library: torch
    class: torch.nn.Module
    category: "Deep Learning"
    description: "Réseau encodeur-décodeur : détecte les anomalies par erreur de reconstruction élevée."
    use_cases: ["anomalies complexes / non-linéaires", "images", "séries temporelles", "logs"]
    pros: ["très puissant", "apprend des représentations latentes", "generalise bien"]
    cons: ["nécessite beaucoup de données normales", "entraînement plus long", "GPU recommandé"]
    hyperparameters:
      latent_dim: [8, 16, 32]
      epochs: [50, 100, 200]
      threshold_percentile: [90, 95, 99]
    eval_metrics: ["reconstruction_error", "roc_auc", "precision", "recall"]
    code_template: |
      import torch
      import torch.nn as nn
      from torch.utils.data import DataLoader, TensorDataset
      import numpy as np

      class Autoencoder(nn.Module):
          def __init__(self, input_dim, latent_dim=16):
              super().__init__()
              self.encoder = nn.Sequential(
                  nn.Linear(input_dim, 64), nn.ReLU(),
                  nn.Linear(64, 32), nn.ReLU(),
                  nn.Linear(32, latent_dim)
              )
              self.decoder = nn.Sequential(
                  nn.Linear(latent_dim, 32), nn.ReLU(),
                  nn.Linear(32, 64), nn.ReLU(),
                  nn.Linear(64, input_dim)
              )
          def forward(self, x):
              return self.decoder(self.encoder(x))

      from sklearn.preprocessing import StandardScaler
      scaler = StandardScaler()
      X_normal_scaled = scaler.fit_transform(X_normal).astype(np.float32)
      X_test_scaled   = scaler.transform(X_test).astype(np.float32)

      loader = DataLoader(TensorDataset(torch.tensor(X_normal_scaled)),
                          batch_size=64, shuffle=True)

      model = Autoencoder(input_dim=X_normal_scaled.shape[1], latent_dim=16)
      optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)
      criterion = nn.MSELoss()

      for epoch in range(100):
          for (batch,) in loader:
              loss = criterion(model(batch), batch)
              optimizer.zero_grad(); loss.backward(); optimizer.step()
          if (epoch + 1) % 20 == 0:
              print(f"Epoch {epoch+1} | Loss: {loss.item():.4f}")

      # Seuil sur erreurs de reconstruction
      with torch.no_grad():
          X_t = torch.tensor(X_test_scaled)
          recon_errors = ((model(X_t) - X_t) ** 2).mean(dim=1).numpy()

      threshold = np.percentile(recon_errors, 95)
      anomalies = recon_errors > threshold
      print(f"Anomalies détectées : {anomalies.sum()}")

