  - id: gcn_node_clf
    name: "Graph Neural Network (GCN/GAT) — Classification de nœuds"
    enabled: true
    library: torch_geometric
    class: torch_geometric.nn.GCNConv
    category: "GNN — Graph Learning"
    description: >
      Réseau de neurones sur graphe pour la classification de nœuds.
      Deux variantes : GCN (Graph Convolutional Network, Kipf & Welling 2017)
      et GAT (Graph Attention Network, Veličković 2018). GCN propage
      les features des voisins avec une normalisation spectrale. GAT
      ajoute des mécanismes d'attention pour pondérer les voisins.
      Applicable aux réseaux sociaux, graphes moléculaires, graphes
      de connaissance, et tout jeu de données avec structure de graphe.
    use_cases:
      - "classification de nœuds : catégoriser des entités dans un réseau"
      - "prédiction de liens : prédire les arêtes manquantes"
      - "recommandation : graphes user-item"
      - "chémoinformatique : prédire les propriétés moléculaires"
      - "détection de fraude dans les graphes de transactions"
      - "graphes de connaissance (Knowledge Graph Completion)"
    pros:
      - "exploite la structure de graphe inexploitable par les MLP"
      - "inductif (GAT) ou transductif (GCN)"
      - "attention interpretable (GAT)"
      - "PyG (PyTorch Geometric) : nombreux datasets, transforms, benchmarks"
    cons:
      - "requiert des données avec structure de graphe explicite"
      - "scalabilité limitée pour très grands graphes (>1M nœuds)"
      - "over-smoothing sur de nombreuses couches"
    hyperparameters:
      model_type:
        type: str
        choices: ["GCN", "GAT", "GraphSAGE", "GIN"]
        default: "GAT"
        description: "Architecture GNN. GAT = attention, GraphSAGE = inductive scalable."
      hidden_channels:
        type: int
        range: [32, 512]
        default: 128
      n_layers:
        type: int
        range: [2, 8]
        default: 3
      heads:
        type: int
        range: [1, 8]
        default: 4
        description: "Nombre de têtes d'attention (GAT seulement)."
      dropout:
        type: float
        range: [0.0, 0.7]
        default: 0.5
      lr:
        type: float
        default: 5e-3
      weight_decay:
        type: float
        default: 5e-4
      epochs:
        type: int
        default: 200
    eval_metrics: ["accuracy", "f1_weighted", "roc_auc"]
    io_contract:
      inputs:  [data]
      outputs: [model, y_pred, y_proba, metrics, fit_time_s]
      notes:   "data = torch_geometric.data.Data avec x, edge_index, y, train_mask, val_mask, test_mask."
    code_template: |
      import time
      import numpy as np
      import torch
      import torch.nn.functional as F
      from torch_geometric.nn import GCNConv, GATConv, SAGEConv
      from sklearn.metrics import accuracy_score, f1_score

      # ── Config ─────────────────────────────────────────────────────────
      MODEL_TYPE   = "GAT"
      HIDDEN       = 128
      N_LAYERS     = 3
      HEADS        = 4
      DROPOUT      = 0.5
      LR           = 5e-3
      WEIGHT_DECAY = 5e-4
      EPOCHS       = 200
      DEVICE       = torch.device("cuda" if torch.cuda.is_available() else "cpu")

      # data = torch_geometric.data.Data(x=..., edge_index=..., y=...,
      #                                  train_mask=..., val_mask=..., test_mask=...)
      data = data.to(DEVICE)
      N_FEAT = data.x.shape[1]
      N_CLS  = int(data.y.max().item()) + 1

      # ── Architecture ───────────────────────────────────────────────────
      class GNN(torch.nn.Module):
          def __init__(self, in_f, hidden, n_cls, n_layers, heads, drop, mtype):
              super().__init__()
              self.drop = drop
              self.convs = torch.nn.ModuleList()
              _prev = in_f
              for i in range(n_layers):
                  _is_last = (i == n_layers - 1)
                  if mtype == "GCN":
                      _out = n_cls if _is_last else hidden
                      self.convs.append(GCNConv(_prev, _out))
                      _prev = _out
                  elif mtype == "GAT":
                      if _is_last:
                          self.convs.append(GATConv(_prev * heads if i > 0 else _prev,
                                                    n_cls, heads=1, concat=False, dropout=drop))
                          _prev = n_cls
                      else:
                          self.convs.append(GATConv(_prev, hidden, heads=heads, dropout=drop))
                          _prev = hidden * heads
                  elif mtype == "GraphSAGE":
                      _out = n_cls if _is_last else hidden
                      self.convs.append(SAGEConv(_prev, _out))
                      _prev = _out
              self.mtype = mtype; self.n_layers = n_layers

          def forward(self, x, edge_index):
              for i, conv in enumerate(self.convs):
                  x = conv(x, edge_index)
                  if i < self.n_layers - 1:
                      x = F.elu(x)
                      x = F.dropout(x, p=self.drop, training=self.training)
              return x

      model = GNN(N_FEAT, HIDDEN, N_CLS, N_LAYERS, HEADS, DROPOUT, MODEL_TYPE).to(DEVICE)
      _opt = torch.optim.Adam(model.parameters(), lr=LR, weight_decay=WEIGHT_DECAY)

      # ── Entraînement ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      _best_val_acc, _best_state = 0.0, None
      for _epoch in range(EPOCHS):
          model.train()
          _opt.zero_grad()
          _out = model(data.x, data.edge_index)
          _loss = F.cross_entropy(_out[data.train_mask], data.y[data.train_mask])
          _loss.backward(); _opt.step()

          if (_epoch + 1) % 10 == 0:
              model.eval()
              with torch.no_grad():
                  _pred = model(data.x, data.edge_index).argmax(1)
              _vacc = accuracy_score(
                  data.y[data.val_mask].cpu(), _pred[data.val_mask].cpu()
              )
              if _vacc > _best_val_acc:
                  _best_val_acc = _vacc
                  _best_state = {k: v.clone() for k, v in model.state_dict().items()}
              print(f"Epoch {_epoch+1:3d} | loss {_loss:.4f} | val_acc {_vacc:.4f}")

      model.load_state_dict(_best_state)
      fit_time_s = time.perf_counter() - _t0

      model.eval()
      with torch.no_grad():
          _logits = model(data.x, data.edge_index).cpu()
      y_proba = F.softmax(_logits, dim=1).numpy()
      y_pred  = _logits.argmax(1).numpy()
      _mask   = data.test_mask.cpu().numpy()

      metrics = {
          "accuracy"   : accuracy_score(data.y.cpu()[_mask], y_pred[_mask]),
          "f1_weighted": f1_score(data.y.cpu()[_mask], y_pred[_mask], average="weighted"),
          "fit_time_s" : fit_time_s,
      }
      print(metrics)
      feature_importances = None


