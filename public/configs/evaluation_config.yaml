# ──────────────────────────────────────────────────────────────────────────

  - id: free_eval
    name: "Nœud Évaluation Libre"
    enabled: true
    category: "Générique"
    description: >
      Nœud d'échappement pour toute logique d'évaluation custom hors catalogue.
