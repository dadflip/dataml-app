# ──────────────────────────────────────────────────────────────────────────
quantile_evaluation:
# ──────────────────────────────────────────────────────────────────────────

  - id: eval_quantile_regression
    name: "Évaluation — Régression Quantile"
    enabled: true
    category: "Évaluation — Régression"
    description: >
      Évalue les prédictions par intervalle de quantiles : couverture empirique,
      Pinball Loss par quantile, Winkler Score pour les intervalles de prédiction.
      Indispensable pour les modèles produisant des distributions (QRF, GBM quantile,
      MAPIE, Prophet).
    applies_to: ["regression", "timeseries"]
    when_to_use: >
      Quand le modèle prédit plusieurs quantiles ou des intervalles (lower/upper).
      Complète eval_reg_full qui ne mesure que la tendance centrale.
    input_variables:
      required:
        y_test:       "np.ndarray | pd.Series — valeurs réelles"
        y_quantiles:  "dict[float, np.ndarray] — {0.1: preds_q10, 0.5: preds_q50, 0.9: preds_q90}"
      optional:
        QUANTILES:    "list[float] — quantiles à évaluer (défaut : [0.1, 0.5, 0.9])"
        dates_future: "pd.DatetimeIndex | None — pour visualisation temporelle"
    output_variables:
      eval_report:    "dict enrichi avec pinball_loss_{q}, coverage_{q}, winkler_score"
      figures:        "{'quantile_bands': Figure, 'pinball_by_quantile': Figure}"
    code_template: |
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt

      QUANTILES   = QUANTILES if "QUANTILES" in dir() else [0.1, 0.5, 0.9]
      y_arr       = np.array(y_test)

      def pinball_loss(y, q_pred, q):
          r = y - q_pred
          return np.mean(np.where(r >= 0, q * r, (q - 1) * r))

      def winkler_score(y, lower, upper, alpha):
          """Pénalise la largeur + les dépassements."""
          width    = upper - lower
          pen_low  = (2 / alpha) * np.maximum(lower - y, 0)
          pen_high = (2 / alpha) * np.maximum(y - upper, 0)
          return np.mean(width + pen_low + pen_high)

      pinball_scores = {}
      coverage       = {}
      for q in QUANTILES:
          if q not in y_quantiles:
              print(f"⚠ Quantile {q} absent de y_quantiles — ignoré")
              continue
          q_pred = np.array(y_quantiles[q])
          pinball_scores[q]  = pinball_loss(y_arr, q_pred, q)
          coverage[q]        = float(np.mean(y_arr <= q_pred))
          eval_report[f"pinball_{q}"] = round(pinball_scores[q], 5)
          eval_report[f"coverage_{q}"] = round(coverage[q], 4)

      # Winkler score pour l'intervalle [q_low, q_high] le plus extrême
      _q_low, _q_high = min(QUANTILES), max(QUANTILES)
      if _q_low in y_quantiles and _q_high in y_quantiles:
          _alpha = 1 - (_q_high - _q_low)
          eval_report["winkler_score"] = round(
              winkler_score(y_arr, np.array(y_quantiles[_q_low]),
                            np.array(y_quantiles[_q_high]), _alpha), 5)
          print(f"Winkler Score [{_q_low}-{_q_high}] : {eval_report['winkler_score']:.5f}")

      for q in QUANTILES:
          print(f"  q={q} | Pinball={pinball_scores.get(q, 'N/A'):.5f} "
                f"| Couverture empirique={coverage.get(q, 'N/A'):.3f} (cible={q:.2f})")

      # ── Visualisation bandes de quantiles ─────────────────────────────
      x_axis = np.array(dates_future) if "dates_future" in dir() and dates_future is not None \
               else np.arange(len(y_arr))

      fig, axes = plt.subplots(2, 1, figsize=(14, 7))
      axes[0].plot(x_axis, y_arr, label="Réel", color="steelblue", linewidth=1.5)
      if _q_low in y_quantiles and _q_high in y_quantiles:
          axes[0].fill_between(x_axis,
                               np.array(y_quantiles[_q_low]),
                               np.array(y_quantiles[_q_high]),
                               alpha=0.25, color="orange",
                               label=f"Intervalle [{_q_low}-{_q_high}]")
      if 0.5 in y_quantiles:
          axes[0].plot(x_axis, np.array(y_quantiles[0.5]),
                       label="Médiane (q0.5)", color="tomato", linestyle="--")
      axes[0].legend(); axes[0].set_title("Prédictions quantiles vs réel")

      axes[1].bar([str(q) for q in QUANTILES],
                  [pinball_scores.get(q, 0) for q in QUANTILES],
                  color="steelblue", alpha=0.8)
      axes[1].set_title("Pinball Loss par quantile (bas = meilleur)")
      axes[1].set_xlabel("Quantile")
      plt.tight_layout(); plt.show()
      figures["quantile_bands"]       = fig


# ──────────────────────────────────────────────────────────────────────────
anomaly_evaluation:
# ──────────────────────────────────────────────────────────────────────────

  - id: eval_anomaly_full
    name: "Évaluation complète — Détection d'anomalies"
    enabled: true
    category: "Évaluation — Anomaly Detection"
    description: >
      Évalue un détecteur d'anomalies avec et sans ground truth.
      Sans labels : statistiques descriptives des scores, seuil basé sur
      contamination. Avec labels : ROC-AUC, PR-AUC, F1, Average Precision.
      Visualise la distribution des scores et la courbe ROC.
    applies_to: ["anomaly_detection"]
    when_to_use: >
      Toujours après un modèle d'anomaly detection. Fonctionne en mode
      non-supervisé (pas de y_true) et supervisé (y_true binaire 0/1).
    input_variables:
      required:
        anomaly_scores: "np.ndarray — scores d'anomalie (bas = normal pour IF, haut = anormal pour PyOD)"
        labels:         "np.ndarray — labels prédits (+1/-1 pour sklearn, 0/1 pour PyOD)"
      optional:
        y_true:         "np.ndarray | None — ground truth binaire 0=normal, 1=anomalie"
        score_direction: "str — 'low_is_anomaly' | 'high_is_anomaly' (défaut: 'high_is_anomaly')"
    output_variables:
      eval_report:    "dict avec n_anomalies, pct_anomalies, score_threshold, roc_auc (si y_true)"
      figures:        "{'anomaly_score_dist': Figure, 'anomaly_roc': Figure}"
    code_template: |
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt
      from sklearn.metrics import (roc_auc_score, average_precision_score,
                                   f1_score, classification_report,
                                   roc_curve, precision_recall_curve)

      _direction = score_direction if "score_direction" in dir() else "high_is_anomaly"
      _scores    = np.array(anomaly_scores)

      # Normalisation de la direction : on veut haut = anormal pour toutes les métriques
      _scores_norm = _scores if _direction == "high_is_anomaly" else -_scores

      # Conversion labels → 0/1 (gère +1/-1 sklearn et 0/1 PyOD)
      _unique_labels = np.unique(labels)
      if set(_unique_labels).issubset({-1, 1}):
          labels_01 = (labels == -1).astype(int)
      else:
          labels_01 = np.array(labels).astype(int)

      _n_anom = int(np.sum(labels_01 == 1))
      eval_report["n_anomalies"]   = _n_anom
      eval_report["pct_anomalies"] = round(float(_n_anom / len(labels_01) * 100), 3)

      # ── Métriques supervisées si y_true disponible ─────────────────────
      if "y_true" in dir() and y_true is not None:
          _yt = np.array(y_true).astype(int)
          eval_report["roc_auc"]          = round(float(roc_auc_score(_yt, _scores_norm)), 4)
          eval_report["average_precision"] = round(float(average_precision_score(_yt, _scores_norm)), 4)
          eval_report["f1_anomaly"]        = round(float(f1_score(_yt, labels_01,
                                                                   zero_division=0)), 4)
          print(classification_report(_yt, labels_01,
                                      target_names=["Normal", "Anomalie"]))
          print(f"ROC-AUC: {eval_report['roc_auc']:.4f} "
                f"| AP: {eval_report['average_precision']:.4f}")

          # Courbe ROC
          fpr, tpr, _ = roc_curve(_yt, _scores_norm)
          fig_roc, ax = plt.subplots(figsize=(6, 5))
          ax.plot(fpr, tpr, label=f"AUC={eval_report['roc_auc']:.3f}", color="steelblue")
          ax.plot([0,1],[0,1],"k--"); ax.set_title("ROC — Anomaly Detector")
          ax.set_xlabel("FPR"); ax.set_ylabel("TPR"); ax.legend()
          plt.tight_layout(); plt.show()
          figures["anomaly_roc"] = fig_roc

      # ── Distribution des scores ────────────────────────────────────────
      _thresh = np.percentile(_scores_norm, 100 * (1 - _n_anom / len(_scores_norm)))
      eval_report["score_threshold"] = round(float(_thresh), 5)

      fig_dist, ax = plt.subplots(figsize=(9, 4))
      ax.hist(_scores_norm[labels_01 == 0], bins=60, alpha=0.6,
              color="steelblue", label="Normal", density=True)
      ax.hist(_scores_norm[labels_01 == 1], bins=60, alpha=0.6,
              color="tomato",    label="Anomalie", density=True)
      ax.axvline(_thresh, color="black", linestyle="--", label=f"Seuil={_thresh:.3f}")
      ax.set_title("Distribution des scores d'anomalie")
      ax.set_xlabel("Score"); ax.legend()
      plt.tight_layout(); plt.show()
      figures["anomaly_score_dist"] = fig_dist


# ──────────────────────────────────────────────────────────────────────────
deep_model_evaluation:
# ──────────────────────────────────────────────────────────────────────────

  - id: eval_learning_curves
    name: "Courbes d'apprentissage"
    enabled: true
    category: "Évaluation — Diagnostic"
    description: >
      Trace les courbes train/validation en fonction du nombre d'exemples
      d'entraînement. Diagnostique sous-apprentissage (biais élevé) vs
      sur-apprentissage (variance élevée). Détermine si plus de données
      serait bénéfique.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Quand les performances sont décevantes ou instables. Avant toute décision
      de collecte de données supplémentaires.
    input_variables:
      required:
        model:    "objet sklearn avec interface .fit() / .predict()"
        X_train:  "np.ndarray | pd.DataFrame"
        y_train:  "np.ndarray | pd.Series"
        task_type: "str — 'classification' | 'regression'"
      optional:
        cv:       "int — folds (défaut: 5)"
        scoring:  "str — métrique sklearn (défaut: 'f1_weighted' ou 'neg_rmse')"
        n_jobs:   "int — défaut -1"
    output_variables:
      eval_report: "dict enrichi avec 'learning_curve_gap' (train_score[-1] - val_score[-1])"
      figures:     "{'learning_curves': Figure}"
    code_template: |
      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.model_selection import learning_curve

      _cv      = cv      if "cv"      in dir() else 5
      _scoring = scoring if "scoring" in dir() else (
          "f1_weighted" if task_type == "classification" else "neg_root_mean_squared_error")
      _n_jobs  = n_jobs  if "n_jobs"  in dir() else -1

      train_sizes, train_scores, val_scores = learning_curve(
          model, X_train, y_train,
          cv=_cv, scoring=_scoring, n_jobs=_n_jobs,
          train_sizes=np.linspace(0.1, 1.0, 10),
          shuffle=True, random_state=42
      )

      _tr_mean = train_scores.mean(axis=1)
      _tr_std  = train_scores.std(axis=1)
      _va_mean = val_scores.mean(axis=1)
      _va_std  = val_scores.std(axis=1)

      gap = float(_tr_mean[-1] - _va_mean[-1])
      eval_report["learning_curve_gap"]       = round(gap, 4)
      eval_report["learning_curve_train_final"]= round(float(_tr_mean[-1]), 4)
      eval_report["learning_curve_val_final"]  = round(float(_va_mean[-1]), 4)

      _diag = ("sous-apprentissage" if _va_mean[-1] < 0.7 and gap < 0.05
               else "sur-apprentissage" if gap > 0.1
               else "bon équilibre biais/variance")
      print(f"Diagnostic : {_diag}  (gap={gap:.4f})")

      fig, ax = plt.subplots(figsize=(9, 5))
      ax.fill_between(train_sizes, _tr_mean - _tr_std, _tr_mean + _tr_std, alpha=0.15, color="steelblue")
      ax.fill_between(train_sizes, _va_mean - _va_std, _va_mean + _va_std, alpha=0.15, color="tomato")
      ax.plot(train_sizes, _tr_mean, "o-", color="steelblue", label="Train")
      ax.plot(train_sizes, _va_mean, "s-", color="tomato",    label="Validation")
      ax.set_title(f"Courbes d'apprentissage — {_diag}")
      ax.set_xlabel("Taille du train"); ax.set_ylabel(_scoring)
      ax.legend(); plt.tight_layout(); plt.show()
      figures["learning_curves"] = fig


  - id: eval_cross_val_deep
    name: "Cross-validation détaillée (stratifiée / temporelle)"
    enabled: true
    category: "Évaluation — Diagnostic"
    description: >
      Cross-validation complète avec rapport par fold, détection de variance
      inter-fold élevée et support des stratégies stratifiée, temporelle et
      groupe. Complète le score unique fourni par le bloc 3.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Toujours pour valider la robustesse du modèle. Remplace un simple
      train/test split. cv_strategy='time_series' pour les séries temporelles.
    input_variables:
      required:
        model:      "objet sklearn"
        X_train:    "np.ndarray | pd.DataFrame"
        y_train:    "np.ndarray | pd.Series"
        task_type:  "str"
      optional:
        cv_strategy: "str — 'stratified'|'kfold'|'time_series'|'group' (défaut: 'stratified')"
        cv:          "int — folds (défaut: 5)"
        groups:      "np.ndarray | None — pour GroupKFold"
        n_jobs:      "int — défaut -1"
        scoring:     "str | list[str]"
    output_variables:
      eval_report: "dict enrichi avec cv_mean, cv_std, cv_by_fold"
      figures:     "{'cv_fold_scores': Figure}"
    code_template: |
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt
      from sklearn.model_selection import (
          StratifiedKFold, KFold, TimeSeriesSplit, GroupKFold, cross_validate
      )

      _cv_strategy = cv_strategy if "cv_strategy" in dir() else "stratified"
      _cv_folds    = cv          if "cv"          in dir() else 5
      _n_jobs      = n_jobs      if "n_jobs"      in dir() else -1
      _groups      = groups      if "groups"      in dir() else None
      _scoring_map = {
          "classification": ["accuracy", "f1_weighted", "roc_auc"],
          "regression"    : ["neg_root_mean_squared_error", "neg_mean_absolute_error", "r2"]
      }
      _scoring = scoring if "scoring" in dir() else _scoring_map.get(task_type, ["accuracy"])

      if _cv_strategy == "stratified":
          _splitter = StratifiedKFold(n_splits=_cv_folds, shuffle=True, random_state=42)
      elif _cv_strategy == "time_series":
          _splitter = TimeSeriesSplit(n_splits=_cv_folds)
      elif _cv_strategy == "group":
          _splitter = GroupKFold(n_splits=_cv_folds)
      else:
          _splitter = KFold(n_splits=_cv_folds, shuffle=True, random_state=42)

      cv_results = cross_validate(
          model, X_train, y_train,
          cv=_splitter, scoring=_scoring,
          groups=_groups, n_jobs=_n_jobs,
          return_train_score=True
      )

      _primary = (f"test_{_scoring[0]}" if isinstance(_scoring, list)
                  else f"test_{_scoring}")
      _scores  = cv_results[_primary]

      eval_report["cv_mean"]    = round(float(_scores.mean()), 4)
      eval_report["cv_std"]     = round(float(_scores.std()), 4)
      eval_report["cv_by_fold"] = _scores.round(4).tolist()
      eval_report["cv_strategy"] = _cv_strategy

      _cv_var_warn = _scores.std() > 0.05
      print(f"CV {_cv_strategy} ({_cv_folds} folds) — {_primary}:")
      print(f"  mean={eval_report['cv_mean']:.4f}  std={eval_report['cv_std']:.4f}")
      if _cv_var_warn:
          print("  ⚠ Variance inter-fold élevée (std > 0.05) — vérifier la distribution des données")
      for fold_i, score in enumerate(_scores):
          print(f"  Fold {fold_i+1}: {score:.4f}")

      fig, ax = plt.subplots(figsize=(8, 4))
      ax.bar(range(1, len(_scores)+1), _scores, color="steelblue", alpha=0.8)
      ax.axhline(_scores.mean(), color="red", linestyle="--",
                 label=f"Moyenne={_scores.mean():.4f}")
      ax.fill_between([0.5, len(_scores)+0.5],
                      _scores.mean()-_scores.std(), _scores.mean()+_scores.std(),
                      alpha=0.1, color="red", label="±1 std")
      ax.set_xlabel("Fold"); ax.set_ylabel(_primary)
      ax.set_title(f"Scores par fold — {_cv_strategy}"); ax.legend()
      plt.tight_layout(); plt.show()
      figures["cv_fold_scores"] = fig


# ──────────────────────────────────────────────────────────────────────────
advanced_explainability:
# ──────────────────────────────────────────────────────────────────────────

  - id: eval_shap_interactions
    name: "SHAP — Interactions et waterfall plots"
    enabled: true
    category: "Explicabilité — SHAP avancé"
    description: >
      Calcule les valeurs d'interaction SHAP (SHAP Interaction Values) pour
      les modèles arbre. Génère des waterfall plots par instance et des
      heatmaps d'interaction entre features.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Après shap_tree_explainer, quand on veut comprendre les interactions
      entre features (pas seulement les effets marginaux).
      ⚠ Complexité O(n²) en features — éviter si > 50 features.
    input_variables:
      required:
        model:          "modèle arbre entraîné (XGB, LGB, RF, CatBoost)"
        X_test:         "np.ndarray | pd.DataFrame"
        feature_names:  "list[str]"
      optional:
        N_SHAP_SAMPLES: "int — défaut 100 (interactions = coûteux)"
        instance_idx:   "int — index de l'instance à expliquer (défaut: 0)"
    output_variables:
      shap_summary: "pd.DataFrame enrichi avec colonnes d'interaction top paires"
      figures:      "{'shap_waterfall': Figure, 'shap_interaction_heatmap': Figure}"
    code_template: |
      import shap
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt

      _N   = N_SHAP_SAMPLES if "N_SHAP_SAMPLES" in dir() else 100
      _idx = instance_idx   if "instance_idx"   in dir() else 0
      _N   = min(_N, len(X_test))

      X_shap = (X_test[:_N].values if hasattr(X_test, "values") else X_test[:_N])
      explainer    = shap.TreeExplainer(model)
      shap_values  = explainer(X_shap)  # Explanation object (API v2)

      # ── Waterfall pour une instance ────────────────────────────────────
      fig_wf = plt.figure()
      shap.plots.waterfall(shap_values[_idx], max_display=15, show=False)
      plt.title(f"Waterfall — instance {_idx}")
      plt.tight_layout()
      figures["shap_waterfall"] = fig_wf
      plt.show()

      # ── Beeswarm global ───────────────────────────────────────────────
      fig_bee = plt.figure()
      shap.plots.beeswarm(shap_values, max_display=20, show=False)
      plt.tight_layout()
      figures["shap_beeswarm"] = fig_bee
      plt.show()

      # ── Interaction values (si modèle arbre, N pas trop grand) ────────
      if _N <= 200 and hasattr(explainer, "shap_interaction_values"):
          _sv_inter = explainer.shap_interaction_values(X_shap)
          # shape (N, n_feat, n_feat) — prendre classe 1 si liste
          if isinstance(_sv_inter, list): _sv_inter = _sv_inter[1]
          _inter_mean = np.abs(_sv_inter).mean(axis=0)
          df_inter = pd.DataFrame(_inter_mean, index=feature_names, columns=feature_names)

          fig_hm, ax = plt.subplots(figsize=(max(8, len(feature_names)*0.5),
                                             max(6, len(feature_names)*0.4)))
          im = ax.imshow(df_inter.values, cmap="Blues", aspect="auto")
          ax.set_xticks(range(len(feature_names))); ax.set_xticklabels(feature_names, rotation=45, ha="right", fontsize=8)
          ax.set_yticks(range(len(feature_names))); ax.set_yticklabels(feature_names, fontsize=8)
          ax.set_title("SHAP Interaction Values (moyennés)")
          plt.colorbar(im, ax=ax)
          plt.tight_layout(); plt.show()
          figures["shap_interaction_heatmap"] = fig_hm

          # Top 5 paires d'interaction
          _np = len(feature_names)
          _pairs = [(feature_names[i], feature_names[j], _inter_mean[i,j])
                    for i in range(_np) for j in range(i+1, _np)]
          _pairs.sort(key=lambda x: -x[2])
          print("Top 5 interactions SHAP :")
          for a, b, v in _pairs[:5]:
              print(f"  {a} × {b} : {v:.5f}")


  - id: eval_partial_dependence
    name: "Partial Dependence Plots (PDP) & ICE"
    enabled: true
    category: "Explicabilité — PDP"
    description: >
      PDP (effet marginal moyen d'une feature), ICE (Individual Conditional
      Expectation, une courbe par instance), et PDP 2D pour les interactions
      entre deux features. Agnostique au modèle.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Pour comprendre l'effet d'une feature sur la prédiction en moyenne (PDP)
      et au niveau individuel (ICE). Complémentaire à SHAP dependence_plot.
    input_variables:
      required:
        model:          "modèle sklearn entraîné"
        X_train:        "np.ndarray | pd.DataFrame"
        feature_names:  "list[str]"
      optional:
        pdp_features:   "list[str|tuple] — features à analyser (défaut: top 5 par importance)"
        feature_importances: "pd.Series | None — pour choisir automatiquement les top features"
        n_jobs:         "int — défaut -1"
    output_variables:
      figures: "{'pdp_{feature}': Figure, 'pdp_2d_{feat1}_{feat2}': Figure}"
    code_template: |
      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.inspection import PartialDependenceDisplay

      _n_jobs = n_jobs if "n_jobs" in dir() else -1

      # Sélection automatique des features à analyser
      if "pdp_features" in dir() and pdp_features:
          _feats = pdp_features
      elif "feature_importances" in dir() and feature_importances is not None:
          _feats = feature_importances.head(5).index.tolist()
      else:
          _feats = feature_names[:5]

      # Résoudre indices (PartialDependenceDisplay accepte indices ou noms)
      _fn_list   = list(feature_names)
      _feat_idx  = [_fn_list.index(f) if isinstance(f, str) else f
                    for f in _feats if isinstance(f, str) and f in _fn_list][:5]

      # ── PDP + ICE par feature ─────────────────────────────────────────
      for fi in _feat_idx:
          fig, axes = plt.subplots(1, 2, figsize=(12, 4))
          PartialDependenceDisplay.from_estimator(
              model, X_train, [fi],
              kind="average", ax=axes[0], n_jobs=_n_jobs
          )
          axes[0].set_title(f"PDP — {feature_names[fi]}")
          PartialDependenceDisplay.from_estimator(
              model, X_train, [fi],
              kind="individual", ax=axes[1], n_jobs=_n_jobs,
              subsample=min(100, len(X_train)), alpha=0.1, line_kw={"linewidth": 0.5}
          )
          axes[1].set_title(f"ICE — {feature_names[fi]}")
          plt.tight_layout(); plt.show()
          figures[f"pdp_{feature_names[fi]}"] = fig

      # ── PDP 2D (interaction) pour les 2 meilleures features ──────────
      if len(_feat_idx) >= 2:
          _pair = (_feat_idx[0], _feat_idx[1])
          try:
              fig2d, ax2d = plt.subplots(figsize=(7, 6))
              PartialDependenceDisplay.from_estimator(
                  model, X_train, [_pair],
                  kind="average", ax=ax2d, n_jobs=_n_jobs
              )
              ax2d.set_title(f"PDP 2D — {feature_names[_feat_idx[0]]} × {feature_names[_feat_idx[1]]}")
              plt.tight_layout(); plt.show()
              figures[f"pdp_2d_{feature_names[_feat_idx[0]]}_{feature_names[_feat_idx[1]]}"] = fig2d
          except Exception as e:
              print(f"PDP 2D non disponible : {e}")


# ──────────────────────────────────────────────────────────────────────────
production_evaluation:
# ──────────────────────────────────────────────────────────────────────────

  - id: eval_latency_memory
    name: "Benchmark latence & mémoire"
    enabled: true
    category: "Évaluation — Production"
    description: >
      Mesure le temps d'inférence (p50, p95, p99) et la consommation mémoire
      du modèle. Essentiel avant déploiement pour valider les SLA de latence.
      Teste les modes batch et one-shot (requête unique).
    applies_to: ["classification", "regression", "anomaly_detection", "nlp"]
    when_to_use: >
      Avant tout déploiement en production. Comparer plusieurs modèles
      candidats sur les mêmes contraintes de latence.
    input_variables:
      required:
        model:    "objet entraîné avec .predict()"
        X_test:   "np.ndarray | pd.DataFrame"
      optional:
        n_warmup: "int — runs de chauffe (défaut: 5)"
        n_bench:  "int — runs de mesure (défaut: 100)"
    output_variables:
      eval_report: "dict enrichi avec latency_p50_ms, latency_p95_ms, latency_p99_ms,
                    throughput_rps, model_size_mb"
    code_template: |
      import time
      import numpy as np
      import sys

      _n_warmup = n_warmup if "n_warmup" in dir() else 5
      _n_bench  = n_bench  if "n_bench"  in dir() else 100

      _single   = X_test[:1]
      _batch    = X_test

      # ── Taille du modèle (approximation) ──────────────────────────────
      try:
          import pickle, io
          _buf = io.BytesIO()
          pickle.dump(model, _buf)
          _model_mb = round(_buf.tell() / 1024**2, 3)
      except Exception:
          _model_mb = None

      # ── Warmup ────────────────────────────────────────────────────────
      for _ in range(_n_warmup):
          model.predict(_single)

      # ── Latence one-shot ──────────────────────────────────────────────
      _latencies = []
      for _ in range(_n_bench):
          _t = time.perf_counter()
          model.predict(_single)
          _latencies.append((time.perf_counter() - _t) * 1000)

      _latencies = np.array(_latencies)
      eval_report["latency_p50_ms"]  = round(float(np.percentile(_latencies, 50)), 3)
      eval_report["latency_p95_ms"]  = round(float(np.percentile(_latencies, 95)), 3)
      eval_report["latency_p99_ms"]  = round(float(np.percentile(_latencies, 99)), 3)
      eval_report["latency_mean_ms"] = round(float(_latencies.mean()), 3)

      # ── Débit batch ───────────────────────────────────────────────────
      _t0 = time.perf_counter()
      model.predict(_batch)
      _batch_s = time.perf_counter() - _t0
      eval_report["throughput_rps"] = round(len(X_test) / _batch_s, 1)
      eval_report["model_size_mb"]  = _model_mb

      print(f"Latence one-shot — p50={eval_report['latency_p50_ms']}ms "
            f"| p95={eval_report['latency_p95_ms']}ms "
            f"| p99={eval_report['latency_p99_ms']}ms")
      print(f"Débit batch     — {eval_report['throughput_rps']} req/s")
      print(f"Taille modèle   — {_model_mb} MB")

      _SLA_P95_MS = 100  # à ajuster selon le contexte
      if eval_report["latency_p95_ms"] > _SLA_P95_MS:
          print(f"⚠ SLA non respecté : p95 > {_SLA_P95_MS}ms")


  - id: eval_prediction_stability
    name: "Stabilité des prédictions"
    enabled: true
    category: "Évaluation — Production"
    description: >
      Évalue la stabilité du modèle face à de légères perturbations des inputs
      (bruit gaussien). Mesure la variance des prédictions sur des inputs
      quasi-identiques — un modèle instable en production est risqué même avec
      une bonne accuracy.
    applies_to: ["classification", "regression"]
    when_to_use: >
      Avant déploiement sur des données bruitées (capteurs, saisie manuelle,
      OCR). Complète le benchmark latence.
    input_variables:
      required:
        model:    "objet entraîné"
        X_test:   "np.ndarray | pd.DataFrame"
        task_type: "str"
      optional:
        noise_levels: "list[float] — std du bruit gaussien (défaut: [0.01, 0.05, 0.1, 0.2])"
        n_repeats:    "int — répétitions par niveau (défaut: 10)"
    output_variables:
      eval_report: "dict enrichi avec stability_by_noise_level"
      figures:     "{'stability_curve': Figure}"
    code_template: |
      import numpy as np
      import matplotlib.pyplot as plt
      from sklearn.metrics import accuracy_score, r2_score

      _noise_levels = noise_levels if "noise_levels" in dir() else [0.01, 0.05, 0.1, 0.2]
      _n_repeats    = n_repeats    if "n_repeats"    in dir() else 10
      _X            = X_test.values if hasattr(X_test, "values") else np.array(X_test, dtype=float)
      _X_std        = _X.std(axis=0) + 1e-8  # normalisation du bruit par feature

      _y_ref = model.predict(_X)
      stability_results = []

      for sigma in _noise_levels:
          _scores = []
          for _ in range(_n_repeats):
              _X_noisy = _X + np.random.normal(0, sigma, _X.shape) * _X_std
              _y_noisy = model.predict(_X_noisy)
              if task_type == "classification":
                  _scores.append(float(np.mean(_y_noisy == _y_ref)))
              else:
                  _scores.append(float(r2_score(_y_ref, _y_noisy)))
          stability_results.append({
              "noise_std"    : sigma,
              "consistency_mean": round(np.mean(_scores), 4),
              "consistency_std" : round(np.std(_scores),  4),
          })
          print(f"  σ={sigma:.2f} | cohérence={np.mean(_scores):.4f} ± {np.std(_scores):.4f}")

      eval_report["stability_by_noise_level"] = stability_results

      fig, ax = plt.subplots(figsize=(8, 4))
      _x = [r["noise_std"]         for r in stability_results]
      _y = [r["consistency_mean"]  for r in stability_results]
      _e = [r["consistency_std"]   for r in stability_results]
      ax.errorbar(_x, _y, yerr=_e, marker="o", color="steelblue", capsize=4)
      ax.set_xlabel("Niveau de bruit (σ relatif)"); ax.set_ylabel("Cohérence des prédictions")
      ax.set_title("Stabilité du modèle face au bruit")
      ax.axhline(0.95, color="red", linestyle="--", label="Seuil 0.95")
      ax.legend(); plt.tight_layout(); plt.show()
      figures["stability_curve"] = fig


# ──────────────────────────────────────────────────────────────────────────
llm_judge:
# ──────────────────────────────────────────────────────────────────────────

  - id: eval_llm_judge
    name: "LLM-as-Judge — Évaluation par modèle de langage"
    enabled: true
    category: "Évaluation — LLM"
    description: >
      Utilise un LLM (Claude via API Anthropic) pour évaluer qualitativement
      les prédictions du modèle : justesse métier, cohérence sémantique,
      détection de prédictions aberrantes non capturées par les métriques
      quantitatives. Particulièrement utile pour NLP, génération de texte,
      et cas où les métriques classiques sont insuffisantes.
    applies_to: ["classification", "regression", "nlp"]
    when_to_use: >
      En complément des métriques quantitatives quand l'évaluation humaine
      serait idéale mais coûteuse. Pour NLP ou tout contexte où la métrique
      optimisée n'est pas parfaitement alignée avec la valeur métier.
    input_variables:
      required:
        X_test:      "np.ndarray | pd.DataFrame"
        y_test:      "np.ndarray | pd.Series"
        y_pred:      "np.ndarray"
        feature_names: "list[str]"
      optional:
        n_judge_samples:  "int — exemples soumis au LLM (défaut: 20)"
        judge_context:    "str — description du contexte métier pour le LLM"
        anthropic_model:  "str — défaut 'claude-sonnet-4-20250514'"
    output_variables:
      eval_report: "dict enrichi avec llm_judge_score, llm_judge_issues, llm_judge_summary"
    code_template: |
      import json
      import numpy as np
      import pandas as pd

      _n       = n_judge_samples if "n_judge_samples" in dir() else 20
      _context = judge_context   if "judge_context"   in dir() else "classification générale"
      _model_id = anthropic_model if "anthropic_model" in dir() else "claude-sonnet-4-20250514"
      _n       = min(_n, len(X_test))

      # ── Construction du prompt ─────────────────────────────────────────
      X_eval = X_test[:_n]
      if hasattr(X_eval, "values"):
          X_eval = X_eval.values
      _df_eval = pd.DataFrame(X_eval, columns=feature_names)
      _df_eval["y_true"] = np.array(y_test)[:_n]
      _df_eval["y_pred"] = np.array(y_pred)[:_n]
      _df_eval["correct"] = (_df_eval["y_true"] == _df_eval["y_pred"])

      _errors_df   = _df_eval[~_df_eval["correct"]].head(10)
      _correct_df  = _df_eval[ _df_eval["correct"]].head(5)

      _prompt = f"""Tu es un expert en évaluation de modèles ML. Contexte métier : {_context}

      Voici {len(_errors_df)} erreurs de prédiction du modèle :
      {_errors_df.to_json(orient='records', indent=2)}

      Et {len(_correct_df)} prédictions correctes :
      {_correct_df.to_json(orient='records', indent=2)}

      Réponds UNIQUEMENT en JSON valide avec ce format :
      {{
        "overall_score": <float 0-10>,
        "issues_detected": [<str>, ...],
        "error_patterns": [<str>, ...],
        "business_risk": "low|medium|high",
        "recommendations": [<str>, ...],
        "summary": "<2-3 phrases>"
      }}"""

      # ── Appel API Anthropic ────────────────────────────────────────────
      try:
          import anthropic
          _client  = anthropic.Anthropic()
          _resp    = _client.messages.create(
              model      = _model_id,
              max_tokens = 1024,
              messages   = [{"role": "user", "content": _prompt}]
          )
          _raw     = _resp.content[0].text.strip()
          _clean   = _raw.replace("```json","").replace("```","").strip()
          _judge   = json.loads(_clean)

          eval_report["llm_judge_score"]    = _judge.get("overall_score")
          eval_report["llm_judge_issues"]   = _judge.get("issues_detected", [])
          eval_report["llm_judge_patterns"] = _judge.get("error_patterns", [])
          eval_report["llm_judge_risk"]     = _judge.get("business_risk")
          eval_report["llm_judge_summary"]  = _judge.get("summary")

          print(f"\nLLM Judge Score : {eval_report['llm_judge_score']}/10")
          print(f"Risque métier   : {eval_report['llm_judge_risk']}")
          print(f"Résumé          : {eval_report['llm_judge_summary']}")
          print("Issues détectées :")
          for issue in eval_report["llm_judge_issues"]:
              print(f"  - {issue}")

      except ImportError:
          print("⚠ anthropic non installé — pip install anthropic")
          eval_report["llm_judge_score"] = None
      except json.JSONDecodeError as e:
          print(f"⚠ Réponse LLM non parsable : {e}\nRaw: {_raw}")
          eval_report["llm_judge_score"] = None
      except Exception as e:
          print(f"⚠ Erreur API LLM Judge : {e}")
          eval_report["llm_judge_score"] = None


