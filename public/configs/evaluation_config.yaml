      # suite_result.save_as_html("deepchecks_report.html")

      # ── Enrichissement obligatoire (format minimal) ───────────────────
      _custom_result = {}

      if "y_test" in dir() and "y_pred" in dir() and y_test is not None:
          _custom_result["business_cost"] = custom_business_metric(y_test, y_pred)

      # Ajout à eval_report — ne JAMAIS écraser
      eval_report.update({
          "free_eval_custom": _custom_result,
