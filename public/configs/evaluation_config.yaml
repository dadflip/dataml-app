      #   3. Toutes variables I/O bloc 4 sont disponibles
      # ══════════════════════════════════════════════════════════════════
      import numpy as np
      import pandas as pd
      import matplotlib.pyplot as plt

      # ── Exemple : métriques métier custom ─────────────────────────────
      def custom_business_metric(y_true, y_pred):
          """Remplacer par votre logique métier."""
          # Exemple : coût asymétrique FP/FN
          FP_COST = 10   # coût d'un faux positif
          FN_COST = 100  # coût d'un faux négatif (manquer un vrai positif)
          fp = int(np.sum((y_pred == 1) & (np.array(y_true) == 0)))
          fn = int(np.sum((y_pred == 0) & (np.array(y_true) == 1)))
          return fp * FP_COST + fn * FN_COST

      # ── Exemple : intégration deepchecks ──────────────────────────────
      # pip install deepchecks
