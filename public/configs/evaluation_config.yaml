    applies_to: ["classification", "regression", "clustering", "timeseries",
                 "anomaly_detection", "nlp", "survival"]
    when_to_use: >
      Métrique métier spécifique, comparaison non standard, intégration
      d'une librairie externe d'évaluation (evidently, whylogs, deepchecks…).
    input_variables:
      required:
        eval_report:   "dict — à enrichir (ne pas écraser)"
