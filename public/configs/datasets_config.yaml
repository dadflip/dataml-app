    code_template: |
      from datasets import load_dataset
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_dataset  = widgets.Combobox(
          value="imdb",
          options=["imdb", "ag_news", "yelp_review_full", "dbpedia_14",
                   "glue", "super_glue", "squad", "common_voice"],
          description="DATASET_NAME:", style={"description_width": "150px"},
          layout=widgets.Layout(width="400px"),
          ensure_option=False)
      w_subset   = widgets.Text(value="",
                                description="SUBSET:", style={"description_width": "150px"},
                                placeholder="ex: sst2 pour glue — vide si N/A")
      w_text_col = widgets.Text(value="text",
                                description="TEXT_COL:", style={"description_width": "150px"})
      w_label_col = widgets.Text(value="label",
                                 description="LABEL_COL:", style={"description_width": "150px"})
      w_streaming = widgets.Checkbox(value=False, description="Mode streaming (évite le téléchargement complet)",
                                     style={"description_width": "150px"})
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🤗 Hugging Face Datasets — Paramètres</b>"),
          w_dataset, w_subset, w_text_col, w_label_col, w_streaming, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              DATASET_NAME = w_dataset.value.strip()
              SUBSET       = w_subset.value.strip() or None
              TEXT_COL     = w_text_col.value.strip()
              LABEL_COL    = w_label_col.value.strip()
              STREAMING    = w_streaming.value

              dataset = load_dataset(DATASET_NAME, SUBSET, streaming=STREAMING)
              print(dataset)

              if STREAMING:
                  print("⚠ Mode streaming : conversion limitée aux 1000 premiers exemples")
                  df_train = pd.DataFrame(list(dataset["train"].take(1000)))
                  df_test  = pd.DataFrame(list(dataset.get("test", dataset["train"]).take(200)))
              else:
                  df_train = dataset["train"].to_pandas()
                  df_test  = dataset["test"].to_pandas() if "test" in dataset else pd.DataFrame()

              df = pd.concat([df_train, df_test], ignore_index=True)

              X = df.drop(columns=[LABEL_COL]) if LABEL_COL in df.columns else df.copy()
              y = df[LABEL_COL] if LABEL_COL in df.columns else None

              feature_names = [TEXT_COL]
