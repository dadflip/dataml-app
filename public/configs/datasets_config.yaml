geospatial:
# ──────────────────────────────────────────────────────────────────────────

  - id: geospatial_vector
    name: "Données Géospatiales Vectorielles (GeoJSON / Shapefile / GeoParquet)"
    enabled: true
    category: "Géospatial"
    format: "GeoJSON · Shapefile · GeoPackage · GeoParquet · WFS"
    description: >
      Chargement de données géospatiales vectorielles via GeoPandas.
      Extraction de features géométriques pour pipeline ML tabulaire.
    use_cases:
      - "prédiction de prix immobiliers (géolocalisation)"
      - "classification de parcelles agricoles (polygones)"
      - "détection d'anomalies géographiques"
      - "clustering spatial"
    pros:
      - "geopandas = pandas pour la géométrie"
      - "tous formats OGR supportés"
      - "projections et reprojections simples"
    cons:
      - "géométries complexes → features non triviales"
      - "CRS à harmoniser entre sources"
    code_template: |
      import geopandas as gpd
      import pandas as pd
      import numpy as np
      from shapely.geometry import Point

      # ── Paramètres ────────────────────────────────────────────────────
      GEO_FILE   = "data/parcels.geojson"   # .geojson, .shp, .gpkg, .parquet, WFS URL
      TARGET_COL = None          # None si clustering
      CRS_TARGET = "EPSG:4326"
      LAYER      = None          # GeoPackage multi-layer — None = premier layer
      USE_REF    = True          # calculer distance point de référence
      REF_LON    = 2.3522        # longitude point de référence (Paris)
      REF_LAT    = 48.8566       # latitude point de référence (Paris)

      # ── Chargement ────────────────────────────────────────────────────
      kwargs = {"layer": LAYER} if LAYER else {}
      if GEO_FILE.endswith(".parquet"):
          gdf = gpd.read_parquet(GEO_FILE)
      else:
          gdf = gpd.read_file(GEO_FILE, **kwargs)

      print(f"Shape : {gdf.shape} | CRS : {gdf.crs}")

      if gdf.crs and str(gdf.crs) != CRS_TARGET:
          gdf = gdf.to_crs(CRS_TARGET)

      gdf_proj = gdf.to_crs("EPSG:3857")
      gdf["area_m2"]      = gdf_proj.geometry.area
      gdf["perimeter_m"]  = gdf_proj.geometry.length
      gdf["compactness"]  = (4 * np.pi * gdf["area_m2"]
                             / (gdf["perimeter_m"] ** 2 + 1e-8))
      gdf["centroid_lon"] = gdf.geometry.centroid.x
      gdf["centroid_lat"] = gdf.geometry.centroid.y
      gdf["is_valid"]     = gdf.geometry.is_valid.astype(int)
      gdf["geom_type"]    = gdf.geometry.geom_type.astype("category").cat.codes

      if USE_REF:
          ref = gpd.GeoSeries([Point(REF_LON, REF_LAT)], crs="EPSG:4326").to_crs("EPSG:3857").iloc[0]
          gdf["dist_ref_m"] = gdf_proj.geometry.centroid.distance(ref)

      df = pd.DataFrame(gdf.drop(columns=["geometry"]))

      GEO_FEAT = ["area_m2", "perimeter_m", "compactness",
                  "centroid_lon", "centroid_lat", "is_valid", "geom_type"]
      if USE_REF:
          GEO_FEAT.append("dist_ref_m")

      if TARGET_COL and TARGET_COL in df.columns:
          X         = df[GEO_FEAT]
          y         = df[TARGET_COL]
          task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
      else:
          X         = df[GEO_FEAT]
          y         = None
          task_type = "geospatial"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {
          "crs":        str(gdf.crs),
          "geom_types": gdf.geometry.geom_type.value_counts().to_dict(),
          "bbox":       list(gdf.total_bounds),
          "shape":      gdf.shape,
          "gdf":        gdf,
      }

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | geo_features={len(GEO_FEAT)} | target='{target_name}'")
      print(df[GEO_FEAT + ([TARGET_COL] if TARGET_COL else [])].head(3))

  - id: geospatial_raster
    name: "Données Géospatiales Raster (GeoTIFF / NetCDF / Zarr)"
    enabled: true
    category: "Géospatial"
    format: "GeoTIFF · NetCDF · Zarr · HDF5"
    description: >
      Chargement de données raster (images satellite, MNT, météo, données
      climatiques) via rasterio / xarray.
    use_cases:
      - "classification de couverture du sol (satellite)"
      - "prévision météo (ERA5, CMIP6)"
      - "détection de changement (avant/après)"
      - "NDVI, indices spectraux"
    code_template: |
      import numpy as np
      import pandas as pd

      # ── Paramètres ────────────────────────────────────────────────────
      RASTER_FILE   = "data/satellite.tif"   # .tif, .nc, .zarr, .h5
      BAND_NAMES    = ["red", "green", "blue", "nir"]   # None = auto (band_1, band_2…)
      VARIABLE      = None       # variable NetCDF/Zarr — None = première variable
      COMPUTE_NDVI  = True       # calculer NDVI si bandes red et nir disponibles

      # ── Chargement ────────────────────────────────────────────────────
      if RASTER_FILE.endswith((".tif", ".tiff")):
          import rasterio
          with rasterio.open(RASTER_FILE) as src:
              print(f"Bandes : {src.count} | CRS : {src.crs} | Shape : {src.shape}")
              data    = src.read()
              profile = src.profile

          n_bands  = data.shape[0]
          _names   = BAND_NAMES[:n_bands] if BAND_NAMES else [f"band_{i+1}" for i in range(n_bands)]
          X_arr    = data.reshape(n_bands, -1).T
          df       = pd.DataFrame(X_arr, columns=_names)

          if COMPUTE_NDVI and "red" in df.columns and "nir" in df.columns:
              df["ndvi"] = ((df["nir"] - df["red"]) /
                            (df["nir"] + df["red"] + 1e-8))
              print("✅ NDVI calculé")
      else:
          import xarray as xr
          ds  = (xr.open_zarr(RASTER_FILE) if RASTER_FILE.endswith(".zarr")
                 else xr.open_dataset(RASTER_FILE))
          var = VARIABLE or list(ds.data_vars)[0]
          print(f"Variable sélectionnée : {var}")
          da  = ds[var]
          df  = da.to_dataframe().reset_index().dropna(subset=[var])

      feat_cols = [c for c in df.columns if c not in
                   ["x", "y", "lat", "lon", "latitude", "longitude", "time", "spatial_ref"]]
      df = df[feat_cols].replace([np.inf, -np.inf], np.nan).dropna()

      X             = df.copy()
      y             = None
      task_type     = "clustering"
      feature_names = X.columns.tolist()
      target_name   = None
      meta = {"file": RASTER_FILE, "shape": df.shape, "bands": feat_cols}

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"Shape : {df.shape}")
      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)}")
      print(df.head(3))


