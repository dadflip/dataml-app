dasharray="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 148 C 400 148, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 148 C 400 148, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">target_name</text>    <path d="M 370 148 C 400 148, 420 194, 440 194" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="180" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="198" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import pandas as pd

      FILE_PATH  = "data/dataset.xlsx"
      SHEET_NAME = 0          # 0 = première feuille, ou nom "Sheet1"
      TARGET_COL = "target"
      HEADER_ROW = 0          # ligne d'en-tête (0-indexed)
      SKIP_ROWS  = None       # ex: [0, 1] pour ignorer des lignes

      # Lister les feuilles disponibles
      xl = pd.ExcelFile(FILE_PATH)
      print("Feuilles disponibles :", xl.sheet_names)

      df = pd.read_excel(
          FILE_PATH,
          sheet_name=SHEET_NAME,
          header=HEADER_ROW,
          skiprows=SKIP_ROWS,
          engine="openpyxl",
      )

      # Nettoyage basique
      df.columns = df.columns.str.strip().str.lower().str.replace(" ", "_")
      df = df.dropna(how="all").dropna(axis=1, how="all")

      print(f"Shape : {df.shape}")

      if TARGET_COL and TARGET_COL in df.columns:
          X = df.drop(columns=[TARGET_COL])
          y = df[TARGET_COL]
          task_type = "classification" if y.dtype == object or y.nunique() < 20 else "regression"
      else:
          X = df.copy()
          y = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"file": FILE_PATH, "sheet": SHEET_NAME}

