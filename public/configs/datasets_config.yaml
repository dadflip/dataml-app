      code_template: |
        import requests, pandas as pd, numpy as np, time

        # ── Paramètres ──────────────────────────────────────────────────
        BASE_URL   = "https://api.example.com/v1"
        API_KEY    = ""
        ENDPOINT   = "/data"
        TARGET_COL = "label"
        PAGE_SIZE  = 100
        MAX_PAGES  = 100
        SLEEP      = 0.2
        AUTH_TYPE  = "Bearer"

        HEADERS = {"Content-Type": "application/json"}
        if AUTH_TYPE == "Bearer" and API_KEY:
            HEADERS["Authorization"] = f"Bearer {API_KEY}"

        records = []
        for page in range(1, MAX_PAGES + 1):
            try:
                r = requests.get(BASE_URL + ENDPOINT, headers=HEADERS,
                                 params={"limit": PAGE_SIZE, "page": page}, timeout=30)
                r.raise_for_status()
                items = r.json().get("results", r.json().get("data", []))
                if not items: break
                records.extend(items)
                print(f"Page {page} : {len(items)}")
                time.sleep(SLEEP)
            except requests.RequestException as e:
                print(f"Erreur page {page} : {e}"); break

        df = pd.json_normalize(records)
        print(f"Shape brut : {df.shape}")

        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL]); y = df[TARGET_COL]
