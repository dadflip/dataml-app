asharray="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 130 C 400 130, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 130 C 400 130, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import requests
      import pandas as pd
      from bs4 import BeautifulSoup
      import time

      URL        = "https://example.com/data-table"
      TARGET_COL = "price"
      HEADERS    = {"User-Agent": "Mozilla/5.0 (compatible; DataBot/1.0)"}

      # ── Option 1 : tableau HTML direct ───────────────────────────────
      response = requests.get(URL, headers=HEADERS, timeout=30)
      response.raise_for_status()
      tables = pd.read_html(response.text)  # retourne une liste de DataFrames
      df = tables[0]   # prendre le bon tableau

      # ── Option 2 : parsing custom avec BeautifulSoup ─────────────────
      soup = BeautifulSoup(response.text, "html.parser")
      rows = []
      for row in soup.select("table.data-table tbody tr"):
          cells = [td.get_text(strip=True) for td in row.find_all("td")]
          rows.append(cells)
      headers = [th.get_text(strip=True) for th in soup.select("table.data-table thead th")]
      df = pd.DataFrame(rows, columns=headers)

      # ── Option 3 : scraping multi-pages ──────────────────────────────
      all_dfs = []
      for page in range(1, 11):
          r = requests.get(f"{URL}?page={page}", headers=HEADERS, timeout=30)
          all_dfs.extend(pd.read_html(r.text))
          time.sleep(1.0)
      df = pd.concat(all_dfs, ignore_index=True)

      # Nettoyage basique
      df.columns = df.columns.str.strip().str.lower().str.replace(" ", "_")
      df = df.drop_duplicates()

      if TARGET_COL and TARGET_COL in df.columns:
          X = df.drop(columns=[TARGET_COL])
          y = pd.to_numeric(df[TARGET_COL].astype(str).str.replace("[^0-9.]", "", regex=True),
                            errors="coerce")
          task_type = "regression"
      else:
          X = df.copy()
          y = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"url": URL}


