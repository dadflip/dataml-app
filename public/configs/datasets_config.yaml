# ──────────────────────────────────────────────────────────────────────────

  - id: rdf_owl_ontology
    name: "Ontologie RDF / OWL / SPARQL"
    enabled: true
    category: "Graphe de Connaissances"
    format: "RDF/XML · Turtle · N-Triples · JSON-LD"
    description: >
      Chargement d'une ontologie ou d'un graphe de connaissances RDF/OWL.
      Requêtage SPARQL pour extraire des triplets (sujet, prédicat, objet).
    use_cases:
      - "DBpedia, Wikidata, YAGO, Freebase"
      - "ontologies médicales (SNOMED, MeSH, ICD)"
      - "graphes de connaissances d'entreprise"
      - "enrichissement de features par KG embedding"
    pros:
      - "standard W3C — interopérabilité maximale"
      - "raisonnement OWL natif (rdflib + owlrl)"
      - "SPARQL = SQL pour les triplets"
    cons:
      - "verbeux et complexe à modéliser"
      - "lent sur grands graphes (> 10M triplets)"
      - "requiert une compréhension des ontologies"
    code_template: |
      import rdflib
      from rdflib import Graph, Namespace, RDF, RDFS, OWL, URIRef, Literal
      import pandas as pd
      import numpy as np
      import networkx as nx
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_source    = widgets.ToggleButtons(
          options=["Fichier RDF local", "Endpoint SPARQL distant"],
          description="SOURCE:", style={"description_width": "130px"})
      w_rdf_file  = widgets.Text(value="data/ontology.ttl",
                                 description="RDF_FILE:", style={"description_width": "160px"},
                                 layout=widgets.Layout(width="450px"))
      w_rdf_format = widgets.Dropdown(
          options=["turtle", "xml", "n3", "nt", "json-ld"],
          value="turtle", description="RDF_FORMAT:", style={"description_width": "160px"})
      w_endpoint  = widgets.Text(value="http://dbpedia.org/sparql",
                                 description="SPARQL_ENDPOINT:", style={"description_width": "160px"},
                                 layout=widgets.Layout(width="450px"))
      w_endpoint.layout.visibility = "hidden"
      w_target_pred = widgets.Text(value="",
                                   description="TARGET_PREDICATE:", style={"description_width": "160px"},
                                   layout=widgets.Layout(width="500px"),
                                   placeholder="URI du prédicat cible — vide = non supervisé")
      w_limit     = widgets.IntText(value=100000, description="SPARQL_LIMIT:",
                                    style={"description_width": "160px"})
      w_query     = widgets.Textarea(
          value=(
              "PREFIX rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\n"
              "PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\n"
              "SELECT ?subject ?predicate ?object\n"
              "WHERE {\n"
              "    ?subject ?predicate ?object .\n"
              "    FILTER(isIRI(?subject) && isIRI(?object))\n"
              "}\n"
              "LIMIT 100000"
          ),
          description="SPARQL_QUERY:", style={"description_width": "160px"},
          layout=widgets.Layout(width="700px", height="150px"))
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      def on_source_change(change):
          is_remote = change["new"] == "Endpoint SPARQL distant"
          w_rdf_file.layout.visibility   = "hidden" if is_remote else "visible"
          w_rdf_format.layout.visibility = "hidden" if is_remote else "visible"
          w_endpoint.layout.visibility   = "visible" if is_remote else "hidden"

      w_source.observe(on_source_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🔮 Ontologie RDF / OWL — Paramètres</b>"),
          w_source, w_rdf_file, w_rdf_format, w_endpoint,
          w_target_pred, w_limit, w_query, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              SOURCE           = w_source.value
              RDF_FILE         = w_rdf_file.value.strip() if SOURCE == "Fichier RDF local" else None
              RDF_FORMAT       = w_rdf_format.value
              SPARQL_ENDPOINT  = w_endpoint.value.strip() if SOURCE != "Fichier RDF local" else None
              TARGET_PREDICATE = w_target_pred.value.strip() or None
              SPARQL_QUERY     = w_query.value.strip()

              g = Graph()
              if RDF_FILE:
                  g.parse(RDF_FILE, format=RDF_FORMAT)
                  print(f"Triplets chargés : {len(g)}")
                  results_q = g.query(SPARQL_QUERY)
                  df_triplets = pd.DataFrame(
                      [(str(r.subject), str(r.predicate), str(r.object))
                       for r in results_q],
                      columns=["subject", "predicate", "object"])
              else:
                  from SPARQLWrapper import SPARQLWrapper, JSON
                  sparql = SPARQLWrapper(SPARQL_ENDPOINT)
                  sparql.setQuery(SPARQL_QUERY)
                  sparql.setReturnFormat(JSON)
                  results = sparql.query().convert()
                  rows_raw = [{k: r[k]["value"] for k in r}
                              for r in results["results"]["bindings"]]
                  df_triplets = pd.DataFrame(rows_raw)
                  g = None

              print(f"Triplets extraits : {len(df_triplets)}")
              display(df_triplets.head())

              G_kg = nx.DiGraph()
              for _, row in df_triplets.iterrows():
                  G_kg.add_edge(row["subject"], row["object"], relation=row["predicate"])

              preds    = df_triplets["predicate"].value_counts().head(50).index.tolist()
              subjects = df_triplets["subject"].unique()
              feat_rows = []
              for s in subjects:
                  sub_df = df_triplets[df_triplets["subject"] == s]
                  row_d  = {"entity": s}
                  for p in preds:
                      row_d[f"pred_{p.split('/')[-1][:30]}"] = int(p in sub_df["predicate"].values)
                  row_d["out_degree"] = len(sub_df)
                  feat_rows.append(row_d)

              df = pd.DataFrame(feat_rows).set_index("entity").fillna(0)

              if TARGET_PREDICATE:
                  _target_col = f"pred_{TARGET_PREDICATE.split('/')[-1][:30]}"
                  y         = df[_target_col] if _target_col in df.columns else None
                  X         = df.drop(columns=[_target_col], errors="ignore")
                  task_type = "node_classification"
              else:
                  X         = df.copy()
                  y         = None
                  task_type = "knowledge_graph"

              feature_names = X.columns.tolist()
              target_name   = TARGET_PREDICATE
              meta = {
                  "n_triplets":  len(df_triplets),
                  "n_entities":  len(subjects),
                  "n_relations": df_triplets["predicate"].nunique(),
                  "graph_obj":   G_kg,
                  "rdf_graph":   g,
                  "triplets_df": df_triplets,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | entities={len(subjects)}")

      w_run.on_click(on_run)

  - id: wikidata_sparql
    name: "Wikidata (SPARQL Live)"
    enabled: true
    category: "Graphe de Connaissances"
    format: "SPARQL / JSON"
    description: >
      Requêtage direct du endpoint SPARQL public de Wikidata.
      Extraction de propriétés structurées sur des entités pour
      enrichissement de datasets ML.
    use_cases:
      - "enrichissement de features (pays, entreprises, personnes)"
      - "datasets ouverts structurés"
      - "alignement d'entités"
    pros:
      - "endpoint public gratuit"
      - "80M+ entités"
      - "données fraîches"
    cons:
      - "timeout à 60s — requêtes à optimiser"
      - "rate limiting"
    code_template: |
      import requests
      import pandas as pd
      import numpy as np
      import time
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_target    = widgets.Text(value="",
                                 description="TARGET_COL:", style={"description_width": "130px"},
                                 placeholder="Laisser vide = non supervisé")
      w_lang      = widgets.Dropdown(options=["fr", "en", "de", "es", "it", "zh"],
                                     value="fr", description="LANG:",
                                     style={"description_width": "130px"})
      w_retries   = widgets.IntText(value=3, description="MAX_RETRIES:",
                                    style={"description_width": "130px"})
      w_query     = widgets.Textarea(
          value=(
              "SELECT ?item ?itemLabel ?population ?area ?capital ?capitalLabel WHERE {\n"
              "  ?item wdt:P31 wd:Q6256 .              # instance de : pays\n"
              "  OPTIONAL { ?item wdt:P1082 ?population . }\n"
              "  OPTIONAL { ?item wdt:P2046 ?area . }\n"
              "  OPTIONAL { ?item wdt:P36 ?capital . }\n"
              "  SERVICE wikibase:label {\n"
              '    bd:serviceParam wikibase:language "fr,en" .\n'
              "  }\n"
              "}\n"
              "LIMIT 500"
          ),
          description="WIKIDATA_QUERY:", style={"description_width": "130px"},
          layout=widgets.Layout(width="700px", height="200px"))
      w_run       = widgets.Button(description="▶ Requêter", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🌍 Wikidata SPARQL — Paramètres</b>"),
          widgets.HBox([w_target, w_lang, w_retries]),
          w_query, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              TARGET_COL     = w_target.value.strip() or None
              LANG           = w_lang.value
              MAX_RETRIES    = w_retries.value
              WIKIDATA_QUERY = w_query.value.strip()

              ENDPOINT = "https://query.wikidata.org/sparql"
              headers  = {
                  "Accept":     "application/sparql-results+json",
                  "User-Agent": "ML-Pipeline/1.0 (research)",
              }
              r = None
              for attempt in range(MAX_RETRIES):
                  try:
                      r = requests.get(ENDPOINT,
                                       params={"query": WIKIDATA_QUERY, "format": "json"},
                                       headers=headers, timeout=55)
                      r.raise_for_status()
                      break
                  except requests.RequestException as e:
                      print(f"Tentative {attempt+1}/{MAX_RETRIES} : {e}")
                      time.sleep(5 * (attempt + 1))

              if r is None:
                  print("❌ Échec de la requête Wikidata")
                  return

              data    = r.json()
              cols    = data["results"]["head"]["vars"]
              records = [{c: row.get(c, {}).get("value", None) for c in cols}
                         for row in data["results"]["bindings"]]
              df      = pd.DataFrame(records)

              for col in ["population", "area"]:
                  if col in df.columns:
                      df[col] = pd.to_numeric(df[col], errors="coerce")

              if "item" in df.columns:
                  df["wikidata_id"] = df["item"].str.extract(r"(Q\d+)")

              print(f"Shape : {df.shape}")

              _exclude = ["item", "itemLabel", "capitalLabel", "wikidata_id"]
              if TARGET_COL and TARGET_COL in df.columns:
                  X         = df.drop(columns=[c for c in _exclude + [TARGET_COL] if c in df.columns])
                  y         = df[TARGET_COL]
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  X         = df.drop(columns=[c for c in _exclude if c in df.columns])
                  y         = None
                  task_type = "knowledge_graph"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta          = {"n_entities": len(df), "query_vars": cols, "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | entities={len(df)}")
              display(df.head(3))

      w_run.on_click(on_run)


