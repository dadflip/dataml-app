  - id: synthetic_tabular
    name: "Données Synthétiques Tabulaires"
    enabled: true
    category: "Synthétique"
    format: "numpy / DataFrame"
    description: "Génération de datasets synthétiques réalistes avec sklearn ou sdv."
    use_cases: ["test de pipelines", "augmentation de données", "données sensibles (privacy)", "démo"]
    pros: ["contrôle total", "privacy-safe", "reproductible"]
    cons: ["ne remplace pas les vraies données", "distribution artificielle"]
    code_template: |
      import numpy as np
      import pandas as pd
      from sklearn.datasets import make_classification, make_regression, make_blobs
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_mode         = widgets.ToggleButtons(
          options=["Classification", "Régression", "Clustering (blobs)"],
          description="MODE:", style={"description_width": "130px"})
      w_n_samples    = widgets.IntText(value=10000, description="N_SAMPLES:",
                                       style={"description_width": "160px"})
      w_n_features   = widgets.IntText(value=15, description="N_FEATURES (num):",
                                       style={"description_width": "160px"})
      w_n_informative = widgets.IntText(value=8, description="N_INFORMATIVE:",
                                        style={"description_width": "160px"})
      w_n_classes    = widgets.IntText(value=3, description="N_CLASSES/CENTERS:",
                                       style={"description_width": "160px"})
      w_noise        = widgets.FloatText(value=0.02, description="NOISE/FLIP_Y:",
                                         style={"description_width": "160px"})
      w_add_cat      = widgets.Checkbox(value=True, description="Ajouter colonnes catégorielles (cat_A, cat_B)",
                                        style={"description_width": "160px"})
      w_add_nan      = widgets.Checkbox(value=True, description="Simuler valeurs manquantes (8%)",
                                        style={"description_width": "160px"})
      w_seed         = widgets.IntText(value=42, description="RANDOM_SEED:",
                                       style={"description_width": "160px"})
      w_run          = widgets.Button(description="▶ Générer", button_style="success",
                                      layout=widgets.Layout(width="150px"))
      out            = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🔧 Données Synthétiques Tabulaires — Paramètres</b>"),
          w_mode,
          widgets.HBox([w_n_samples, w_n_features, w_n_informative]),
          widgets.HBox([w_n_classes, w_noise, w_seed]),
          w_add_cat, w_add_nan, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              MODE        = w_mode.value
              N           = w_n_samples.value
              N_FEAT      = w_n_features.value
              N_INF       = min(w_n_informative.value, N_FEAT)
              N_CLS       = w_n_classes.value
              NOISE       = w_noise.value
              SEED        = w_seed.value
              np.random.seed(SEED)

              if MODE == "Classification":
                  X_num, y_arr = make_classification(
                      n_samples=N, n_features=N_FEAT, n_informative=N_INF,
                      n_redundant=max(0, N_FEAT - N_INF - 2),
                      n_classes=N_CLS, flip_y=NOISE, random_state=SEED)
                  task_type = "classification"
              elif MODE == "Régression":
                  X_num, y_arr = make_regression(
                      n_samples=N, n_features=N_FEAT, n_informative=N_INF,
                      noise=NOISE * 100, random_state=SEED)
                  task_type = "regression"
              else:
                  X_num, y_arr = make_blobs(
                      n_samples=N, n_features=N_FEAT, centers=N_CLS, random_state=SEED)
                  task_type = "clustering"

              df = pd.DataFrame(X_num, columns=[f"num_{i}" for i in range(N_FEAT)])

              if w_add_cat.value:
                  df["cat_A"] = np.random.choice(["low", "medium", "high"], size=N, p=[0.3, 0.5, 0.2])
                  df["cat_B"] = np.random.choice(["X", "Y", "Z"], size=N)

              if w_add_nan.value:
                  nan_cols = ["num_0", "num_5"] + (["cat_A"] if w_add_cat.value else [])
                  for col in nan_cols:
                      if col in df.columns:
                          mask = np.random.rand(N) < 0.08
                          df.loc[mask, col] = np.nan

              df["target"] = y_arr

              X             = df.drop(columns=["target"])
              y             = df["target"]
              feature_names = X.columns.tolist()
              target_name   = "target"
              meta = {"n_samples": N, "synthetic": True, "shape": df.shape, "mode": MODE}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='target'")
              display(df.head(3))

      w_run.on_click(on_run)

