    cons: ["petits datasets", "peu représentatifs des données réelles"]
    code_template: |
      from sklearn import datasets
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      DATASET_OPTIONS = {
          "breast_cancer (classif, 569×30)":    ("load_breast_cancer",  "classification"),
          "iris (classif, 150×4)":              ("load_iris",           "classification"),
          "wine (classif, 178×13)":             ("load_wine",           "classification"),
          "digits (classif, 1797×64)":          ("load_digits",         "classification"),
          "diabetes (regr, 442×10)":            ("load_diabetes",       "regression"),
          "california_housing (regr, 20640×8)": ("load_california_housing", "regression"),
          "make_classification (synthétique)":  ("make_classification", "classification"),
          "make_regression (synthétique)":      ("make_regression",     "regression"),
          "make_blobs (clustering)":            ("make_blobs",          "clustering"),
      }

      w_dataset    = widgets.Dropdown(options=list(DATASET_OPTIONS.keys()),
                                      value=list(DATASET_OPTIONS.keys())[0],
                                      description="DATASET:", style={"description_width": "130px"},
                                      layout=widgets.Layout(width="450px"))
      w_n_samples  = widgets.IntText(value=1000, description="N_SAMPLES (synth):",
                                     style={"description_width": "160px"})
      w_n_features = widgets.IntText(value=20,   description="N_FEATURES (synth):",
                                     style={"description_width": "160px"})
      w_n_classes  = widgets.IntText(value=2,    description="N_CLASSES (synth):",
                                     style={"description_width": "160px"})
      w_synth_box  = widgets.HBox([w_n_samples, w_n_features, w_n_classes])
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      def on_change(change):
          is_synth = "synth" in change["new"] or "make_" in change["new"]
          w_synth_box.layout.visibility = "visible" if is_synth else "hidden"

      w_dataset.observe(on_change, names="value")
      w_synth_box.layout.visibility = "hidden"

      box = widgets.VBox([
          widgets.HTML("<b>🔬 sklearn Datasets — Paramètres</b>"),
          w_dataset, w_synth_box, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              loader_name, default_task = DATASET_OPTIONS[w_dataset.value]

              if loader_name == "make_classification":
                  X_arr, y_arr = datasets.make_classification(
                      n_samples=w_n_samples.value, n_features=w_n_features.value,
                      n_classes=w_n_classes.value, n_informative=max(2, w_n_features.value//2),
                      random_state=42)
                  feat_names = [f"feat_{i}" for i in range(X_arr.shape[1])]
                  bunch      = None
              elif loader_name == "make_regression":
                  X_arr, y_arr = datasets.make_regression(
                      n_samples=w_n_samples.value, n_features=w_n_features.value,
                      noise=0.1, random_state=42)
                  feat_names = [f"feat_{i}" for i in range(X_arr.shape[1])]
                  bunch      = None
              elif loader_name == "make_blobs":
                  X_arr, y_arr = datasets.make_blobs(
                      n_samples=w_n_samples.value, n_features=w_n_features.value,
                      centers=w_n_classes.value, random_state=42)
                  feat_names = [f"feat_{i}" for i in range(X_arr.shape[1])]
                  bunch      = None
              else:
                  loader = getattr(datasets, loader_name)
                  bunch  = loader(as_frame=True)
                  X_arr  = bunch.data.values
                  y_arr  = bunch.target.values
                  feat_names = list(bunch.feature_names)

              df = pd.DataFrame(X_arr, columns=feat_names)
              df["target"] = y_arr

              X             = bunch.data       if bunch else pd.DataFrame(X_arr, columns=feat_names)
              y             = bunch.target     if bunch else pd.Series(y_arr, name="target")
              feature_names = feat_names
              target_name   = "target"
              task_type     = default_task

              meta = {
                  "source":  "sklearn.datasets",
                  "dataset": loader_name,
                  "shape":   df.shape,
                  "classes": list(bunch.target_names) if bunch and hasattr(bunch, "target_names") else None,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

