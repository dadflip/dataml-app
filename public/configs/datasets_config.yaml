# ──────────────────────────────────────────────────────────────────────────
graph_sources:
# ──────────────────────────────────────────────────────────────────────────

  - id: networkx_graph
    name: "Graphe NetworkX (CSV edges / JSON)"
    enabled: true
    category: "Graphe"
    format: "edge list / adjacency / GraphML / GML / GEXF"
    description: >
      Chargement d'un graphe depuis une liste d'arêtes CSV ou un format
      natif NetworkX (GraphML, GML, GEXF). Extraction des features de
      noeuds (degré, centralité, clustering) pour pipeline ML tabulaire.
    use_cases:
      - "réseaux sociaux — détection de communautés"
      - "graphes de transactions — détection de fraude"
      - "réseaux biologiques — protéines, gènes"
      - "graphes de dépendances — supply chain"
    pros:
      - "bibliothèque Python native riche (300+ algorithmes)"
      - "export vers PyG / DGL facile"
      - "formats standards multiples"
    cons:
      - "non scalable > 10M arêtes (utiliser GraphX/Spark)"
      - "représentation en mémoire non optimisée"
    input_parameters:
      EDGE_FILE:     "str — fichier CSV avec colonnes source, target [, weight]"
      NODE_FILE:     "str | None — fichier CSV attributs noeuds (optionnel)"
      SOURCE_COL:    "str — nom colonne source (défaut: 'source')"
      TARGET_COL_G:  "str — nom colonne target arête (défaut: 'target')"
      WEIGHT_COL:    "str | None — colonne poids (None = non pondéré)"
      NODE_LABEL_COL: "str | None — colonne label noeuds pour classification"
      DIRECTED:      "bool — True = DiGraph"
      GRAPH_FILE:    "str | None — alternative : fichier GraphML/GML/GEXF"
    code_template: |
      import networkx as nx
      import pandas as pd
      import numpy as np

      # ── Paramètres ────────────────────────────────────────────────────
      EDGE_FILE      = "data/edges.csv"
      NODE_FILE      = None              # "data/nodes.csv" ou None
      SOURCE_COL     = "source"
      TARGET_COL_G   = "target"
      WEIGHT_COL     = "weight"          # None si non pondéré
      NODE_LABEL_COL = "label"           # None si non supervisé
      DIRECTED       = False
      GRAPH_FILE     = None              # alternative: "data/graph.graphml"

      # ── Chargement ────────────────────────────────────────────────────
      if GRAPH_FILE:
          ext = GRAPH_FILE.split(".")[-1].lower()
          G = {"graphml": nx.read_graphml,
               "gml"    : nx.read_gml,
               "gexf"   : nx.read_gexf,
               "json"   : lambda f: nx.node_link_graph(
                               __import__("json").load(open(f)))
               }.get(ext, nx.read_graphml)(GRAPH_FILE)
      else:
          df_edges = pd.read_csv(EDGE_FILE)
          G = nx.DiGraph() if DIRECTED else nx.Graph()
          for _, row in df_edges.iterrows():
              kwargs = {"weight": row[WEIGHT_COL]} if WEIGHT_COL and WEIGHT_COL in row else {}
              G.add_edge(row[SOURCE_COL], row[TARGET_COL_G], **kwargs)

      if NODE_FILE:
          df_nodes = pd.read_csv(NODE_FILE, index_col=0)
          for node_id, attrs in df_nodes.iterrows():
              if G.has_node(node_id):
                  G.nodes[node_id].update(attrs.to_dict())

      print(f"Noeuds : {G.number_of_nodes()} | Arêtes : {G.number_of_edges()}")
      print(f"Connexe : {nx.is_connected(G) if not DIRECTED else nx.is_weakly_connected(G)}")

      # ── Extraction features tabulaires par noeud ───────────────────────
      nodes      = list(G.nodes())
      degree     = dict(G.degree())
      betweenness = nx.betweenness_centrality(G, normalized=True)
      clustering  = nx.clustering(G)
      pagerank    = nx.pagerank(G, alpha=0.85) if not DIRECTED else nx.pagerank(G)

      rows = []
      for n in nodes:
          r = {
              "node_id"         : n,
              "degree"          : degree[n],
              "betweenness_centrality": betweenness[n],
              "clustering_coeff": clustering[n],
              "pagerank"        : pagerank[n],
          }
          # Attributs natifs du noeud
          r.update(G.nodes[n])
          rows.append(r)

      df = pd.DataFrame(rows).set_index("node_id")

      # ── Variables standards ───────────────────────────────────────────
      if NODE_LABEL_COL and NODE_LABEL_COL in df.columns:
          y             = df[NODE_LABEL_COL]
          X             = df.drop(columns=[NODE_LABEL_COL])
          task_type     = "node_classification"
      else:
          X             = df.copy()
          y             = None
          task_type     = "graph"

      feature_names = X.columns.tolist()
      target_name   = NODE_LABEL_COL
      meta = {
          "n_nodes"   : G.number_of_nodes(),
          "n_edges"   : G.number_of_edges(),
          "directed"  : DIRECTED,
          "density"   : nx.density(G),
          "graph_obj" : G,           # disponible pour PyG/DGL en bloc 2
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: pytorch_geometric
    name: "Graphe PyTorch Geometric (PyG)"
    enabled: true
    category: "Graphe — Deep Learning"
    format: "PyG Dataset / Data object"
    description: >
      Chargement de datasets de graphes natifs PyG (Cora, CiteSeer, OGB,
      PPI, TUDataset…) ou conversion d'un graphe NetworkX vers PyG Data.
      Produit les features tabulaires pour le pipeline sklearn ET expose
      l'objet PyG Data pour les GNN.
    use_cases:
      - "classification de noeuds (Cora, CiteSeer, ogbn-arxiv)"
      - "classification de graphes (TUDataset — molécules)"
      - "prédiction de liens"
      - "GNN : GCN, GAT, GraphSAGE, GIN"
    pros:
      - "accès direct à 100+ datasets benchmark"
      - "transformations et mini-batch natifs"
      - "compatible PyTorch"
    cons:
      - "CUDA requis pour l'entraînement rapide"
      - "peu adapté aux données non-graphe"
    input_parameters:
      PYG_DATASET_NAME: "str — 'Cora'|'CiteSeer'|'PubMed'|'ogbn-arxiv'|'PROTEINS'|…"
      PYG_ROOT:         "str — dossier de téléchargement"
      SPLIT:            "str — 'train'|'val'|'test'|'all'"
      NX_GRAPH:         "nx.Graph | None — alternative si graphe NetworkX existant"
    code_template: |
      import numpy as np
      import pandas as pd
      import torch

      # ── Paramètres ────────────────────────────────────────────────────
      PYG_DATASET_NAME = "Cora"
      PYG_ROOT         = "./data/pyg"
      SPLIT            = "all"
      NX_GRAPH         = None  # nx.Graph ou None

      # ── Option A : dataset PyG standard ───────────────────────────────
      if NX_GRAPH is None:
          from torch_geometric.datasets import Planetoid, TUDataset
          from torch_geometric.utils import to_networkx
          import torch_geometric

          if PYG_DATASET_NAME in ["Cora", "CiteSeer", "PubMed"]:
              dataset = Planetoid(root=PYG_ROOT, name=PYG_DATASET_NAME)
              data    = dataset[0]
          else:
              dataset = TUDataset(root=PYG_ROOT, name=PYG_DATASET_NAME)
              data    = dataset[0]

          # Features tabulaires depuis les attributs de noeuds
          X_arr = data.x.numpy() if data.x is not None else np.zeros((data.num_nodes, 1))
          y_arr = data.y.numpy() if data.y is not None else None

      # ── Option B : conversion depuis NetworkX ─────────────────────────
      else:
          from torch_geometric.utils import from_networkx
          data  = from_networkx(NX_GRAPH)
          X_arr = np.zeros((NX_GRAPH.number_of_nodes(), 1))
          y_arr = None

      # ── Variables standards ───────────────────────────────────────────
      n_feat = X_arr.shape[1]
      X      = pd.DataFrame(X_arr, columns=[f"feat_{i}" for i in range(n_feat)])
      y      = pd.Series(y_arr, name="label") if y_arr is not None else None

      feature_names = X.columns.tolist()
      target_name   = "label"
      task_type     = "node_classification" if y is not None else "graph"
      df            = X.copy()
      if y is not None:
          df["label"] = y.values

      meta = {
          "dataset"     : PYG_DATASET_NAME,
          "n_nodes"     : int(X_arr.shape[0]),
          "n_features"  : n_feat,
          "n_classes"   : int(y.nunique()) if y is not None else None,
          "pyg_data"    : data,           # objet PyG pour GNN en bloc 3
          "n_edges"     : int(data.num_edges) if hasattr(data, "num_edges") else None,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


# ──────────────────────────────────────────────────────────────────────────
ontology_knowledge:
# ──────────────────────────────────────────────────────────────────────────

  - id: rdf_owl_ontology
    name: "Ontologie RDF / OWL / SPARQL"
    enabled: true
    category: "Graphe de Connaissances"
    format: "RDF/XML · Turtle · N-Triples · JSON-LD"
    description: >
      Chargement d'une ontologie ou d'un graphe de connaissances RDF/OWL.
      Requêtage SPARQL pour extraire des triplets (sujet, prédicat, objet)
      et construction d'un DataFrame tabulaire ou d'un graphe NetworkX.
      Utile pour le raisonnement symbolique, l'enrichissement de features,
      et les pipelines Knowledge Graph Embedding (TransE, RotatE…).
    use_cases:
      - "DBpedia, Wikidata, YAGO, Freebase"
      - "ontologies médicales (SNOMED, MeSH, ICD)"
      - "graphes de connaissances d'entreprise"
      - "enrichissement de features par KG embedding"
    pros:
      - "standard W3C — interopérabilité maximale"
      - "raisonnement OWL natif (rdflib + owlrl)"
      - "SPARQL = SQL pour les triplets"
    cons:
      - "verbeux et complexe à modéliser"
      - "lent sur grands graphes (> 10M triplets)"
      - "requiert une compréhension des ontologies"
    input_parameters:
      RDF_FILE:     "str | None — fichier local (.ttl, .rdf, .owl, .nt, .jsonld)"
      SPARQL_ENDPOINT: "str | None — endpoint SPARQL distant (ex: DBpedia)"
      RDF_FORMAT:   "str — 'turtle'|'xml'|'n3'|'nt'|'json-ld' (défaut: 'turtle')"
      SPARQL_QUERY: "str — requête SPARQL SELECT"
      TARGET_PREDICATE: "str | None — prédicat à prédire (ex: 'rdf:type')"
    code_template: |
      import rdflib
      from rdflib import Graph, Namespace, RDF, RDFS, OWL, URIRef, Literal
      from rdflib.plugins.sparql import prepareQuery
      import pandas as pd
      import numpy as np
      import networkx as nx

      # ── Paramètres ────────────────────────────────────────────────────
      RDF_FILE          = "data/ontology.ttl"     # None si endpoint distant
      SPARQL_ENDPOINT   = None   # "http://dbpedia.org/sparql"
      RDF_FORMAT        = "turtle"
      TARGET_PREDICATE  = None   # ex: "http://www.w3.org/1999/02/22-rdf-syntax-ns#type"

      SPARQL_QUERY = """
          PREFIX rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          SELECT ?subject ?predicate ?object
          WHERE {
              ?subject ?predicate ?object .
              FILTER(isIRI(?subject) && isIRI(?object))
          }
          LIMIT 100000
      """

      # ── Chargement ────────────────────────────────────────────────────
      g = Graph()
      if RDF_FILE:
          g.parse(RDF_FILE, format=RDF_FORMAT)
          print(f"Triplets chargés : {len(g)}")
      elif SPARQL_ENDPOINT:
          from SPARQLWrapper import SPARQLWrapper, JSON
          sparql = SPARQLWrapper(SPARQL_ENDPOINT)
          sparql.setQuery(SPARQL_QUERY)
          sparql.setReturnFormat(JSON)
          results = sparql.query().convert()
          rows_raw = [
              {k: r[k]["value"] for k in r}
              for r in results["results"]["bindings"]
          ]
          df_triplets = pd.DataFrame(rows_raw)
          g = None  # pas d'objet rdflib dans ce cas
      else:
          raise ValueError("Fournir RDF_FILE ou SPARQL_ENDPOINT")

      # ── Extraction des triplets → DataFrame ───────────────────────────
      if g is not None:
          results_q = g.query(SPARQL_QUERY)
          df_triplets = pd.DataFrame(
              [(str(r.subject), str(r.predicate), str(r.object))
               for r in results_q],
              columns=["subject", "predicate", "object"]
          )

      print(f"Triplets extraits : {len(df_triplets)}")
      print(df_triplets.head())

      # ── Construction graphe NetworkX ──────────────────────────────────
      G_kg = nx.DiGraph()
      for _, row in df_triplets.iterrows():
          G_kg.add_edge(row["subject"], row["object"],
                        relation=row["predicate"])

      # ── Pivot : features tabulaires par sujet ─────────────────────────
      # One-hot des prédicats sortants de chaque sujet
      preds = df_triplets["predicate"].value_counts().head(50).index.tolist()
      subjects = df_triplets["subject"].unique()
      feat_rows = []
      for s in subjects:
          sub_df = df_triplets[df_triplets["subject"] == s]
          row_d  = {"entity": s}
          for p in preds:
              row_d[f"pred_{p.split('/')[-1][:30]}"] = int(p in sub_df["predicate"].values)
          row_d["out_degree"] = len(sub_df)
          feat_rows.append(row_d)

      df = pd.DataFrame(feat_rows).set_index("entity").fillna(0)

      # ── Variables standards ───────────────────────────────────────────
      if TARGET_PREDICATE:
          _target_col = f"pred_{TARGET_PREDICATE.split('/')[-1][:30]}"
          y         = df[_target_col] if _target_col in df.columns else None
          X         = df.drop(columns=[_target_col], errors="ignore")
          task_type = "node_classification"
      else:
          X         = df.copy()
          y         = None
          task_type = "knowledge_graph"

      feature_names = X.columns.tolist()
      target_name   = TARGET_PREDICATE
      meta = {
          "n_triplets": len(df_triplets),
          "n_entities": len(subjects),
          "n_relations": df_triplets["predicate"].nunique(),
          "graph_obj"  : G_kg,
          "rdf_graph"  : g,
          "triplets_df": df_triplets,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: wikidata_sparql
    name: "Wikidata (SPARQL Live)"
    enabled: true
    category: "Graphe de Connaissances"
    format: "SPARQL / JSON"
    description: >
      Requêtage direct du endpoint SPARQL public de Wikidata.
      Extraction de propriétés structurées sur des entités pour
      enrichissement de datasets ML.
    use_cases:
      - "enrichissement de features (pays, entreprises, personnes)"
      - "datasets ouverts structurés"
      - "alignement d'entités"
    pros:
      - "endpoint public gratuit"
      - "80M+ entités"
      - "données fraîches"
    cons:
      - "timeout à 60s — requêtes à optimiser"
      - "rate limiting"
    input_parameters:
      WIKIDATA_QUERY: "str — requête SPARQL Wikidata"
      TARGET_COL:     "str | None"
      LANG:           "str — langue des labels (défaut: 'fr')"
    code_template: |
      import requests
      import pandas as pd
      import numpy as np
      import time

      # ── Paramètres ────────────────────────────────────────────────────
      TARGET_COL  = None
      LANG        = "fr"

      WIKIDATA_QUERY = """
      SELECT ?item ?itemLabel ?population ?area ?capital ?capitalLabel WHERE {
        ?item wdt:P31 wd:Q6256 .              # instance de : pays
        OPTIONAL { ?item wdt:P1082 ?population . }
        OPTIONAL { ?item wdt:P2046 ?area . }
        OPTIONAL { ?item wdt:P36 ?capital . }
        SERVICE wikibase:label {
          bd:serviceParam wikibase:language "fr,en" .
        }
      }
      LIMIT 500
      """

      # ── Chargement ────────────────────────────────────────────────────
      ENDPOINT = "https://query.wikidata.org/sparql"
      headers  = {
          "Accept"    : "application/sparql-results+json",
          "User-Agent": "ML-Pipeline/1.0 (research)"
      }
      for attempt in range(3):
          try:
              r = requests.get(ENDPOINT,
                               params={"query": WIKIDATA_QUERY, "format": "json"},
                               headers=headers, timeout=55)
              r.raise_for_status()
              break
          except requests.RequestException as e:
              print(f"Tentative {attempt+1}/3 : {e}")
              time.sleep(5 * (attempt + 1))

      data    = r.json()
      cols    = data["results"]["head"]["vars"]
      records = [{c: row.get(c, {}).get("value", None) for c in cols}
                 for row in data["results"]["bindings"]]
      df      = pd.DataFrame(records)

      # ── Nettoyage types ───────────────────────────────────────────────
      for col in ["population", "area"]:
          if col in df.columns:
              df[col] = pd.to_numeric(df[col], errors="coerce")

      # Extraire l'ID Wikidata depuis l'URI
      if "item" in df.columns:
          df["wikidata_id"] = df["item"].str.extract(r"(Q\d+)")

      print(f"Shape : {df.shape}")

      # ── Variables standards ───────────────────────────────────────────
      _exclude = ["item", "itemLabel", "capitalLabel", "wikidata_id"]
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[c for c in _exclude + [TARGET_COL] if c in df.columns])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.drop(columns=[c for c in _exclude if c in df.columns])
          y         = None
          task_type = "knowledge_graph"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta          = {"n_entities": len(df), "query_vars": cols, "shape": df.shape}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


# ──────────────────────────────────────────────────────────────────────────
vector_databases:
# ──────────────────────────────────────────────────────────────────────────

  - id: chroma_vectordb
    name: "ChromaDB (Vector Store)"
    enabled: true
    category: "Base Vectorielle"
    format: "Embeddings / numpy"
    description: >
      Extraction de vecteurs d'embeddings et métadonnées depuis ChromaDB.
      Les embeddings deviennent les features X pour le pipeline ML
      (clustering, classification, anomaly detection, réduction dimensionnelle).
    use_cases:
      - "clustering sémantique de documents"
      - "anomaly detection dans l'espace sémantique"
      - "classification sur représentations latentes"
      - "visualisation t-SNE/UMAP d'embeddings"
    pros:
      - "embeddings pré-calculés — pas de recompute"
      - "métadonnées riches récupérables"
      - "local et cloud"
    cons:
      - "embeddings = boîte noire (moins interprétable)"
      - "dépendance au modèle d'embedding"
    input_parameters:
      CHROMA_PATH:        "str — dossier de persistance ou ':memory:'"
      COLLECTION_NAME:    "str — nom de la collection"
      CHROMA_HOST:        "str | None — host si mode serveur"
      CHROMA_PORT:        "int — port serveur (défaut: 8000)"
      TARGET_METADATA_KEY: "str | None — clé de métadonnée à utiliser comme target"
      N_MAX:              "int | None — nombre max de vecteurs à charger"
    code_template: |
      import chromadb
      import numpy as np
      import pandas as pd

      # ── Paramètres ────────────────────────────────────────────────────
      CHROMA_PATH         = "./chroma_db"
      COLLECTION_NAME     = "documents"
      CHROMA_HOST         = None      # None = mode local
      CHROMA_PORT         = 8000
      TARGET_METADATA_KEY = "label"   # None si non supervisé
      N_MAX               = None      # None = tout charger

      # ── Connexion ─────────────────────────────────────────────────────
      if CHROMA_HOST:
          client = chromadb.HttpClient(host=CHROMA_HOST, port=CHROMA_PORT)
      else:
          client = chromadb.PersistentClient(path=CHROMA_PATH)

      collection = client.get_collection(COLLECTION_NAME)
      print(f"Collection '{COLLECTION_NAME}' : {collection.count()} vecteurs")

      # ── Extraction ────────────────────────────────────────────────────
      query_kwargs = {"include": ["embeddings", "metadatas", "documents"]}
      if N_MAX:
          query_kwargs["limit"] = N_MAX

      results = collection.get(**query_kwargs)
      embeddings = np.array(results["embeddings"])
      metadatas  = results["metadatas"] or [{}] * len(embeddings)
      documents  = results.get("documents") or [""] * len(embeddings)

      df_meta = pd.DataFrame(metadatas)
      dim     = embeddings.shape[1]

      # ── Variables standards ───────────────────────────────────────────
      feat_cols = [f"emb_{i}" for i in range(dim)]
      X         = pd.DataFrame(embeddings, columns=feat_cols)
      df        = X.copy()

      if df_meta.shape[1] > 0:
          for col in df_meta.columns:
              df[col] = df_meta[col].values

      if TARGET_METADATA_KEY and TARGET_METADATA_KEY in df_meta.columns:
          y         = df_meta[TARGET_METADATA_KEY]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          y         = None
          task_type = "clustering"

      feature_names = feat_cols
      target_name   = TARGET_METADATA_KEY
      meta = {
          "collection"   : COLLECTION_NAME,
          "n_vectors"    : len(embeddings),
          "embedding_dim": dim,
          "documents"    : documents,
          "shape"        : embeddings.shape,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: pinecone_vectordb
    name: "Pinecone (Vector Store Cloud)"
    enabled: true
    category: "Base Vectorielle"
    format: "Embeddings / JSON"
    description: >
      Extraction d'embeddings et métadonnées depuis Pinecone.
      Même convention de sortie que ChromaDB — X = matrice d'embeddings.
    use_cases:
      - "clustering sémantique à grande échelle"
      - "classification sur embeddings LLM"
    pros:
      - "scalable à des milliards de vecteurs"
      - "filtrage par métadonnées natif"
    cons:
      - "payant", "nécessite API key"
    input_parameters:
      PINECONE_API_KEY: "str — clé API Pinecone"
      PINECONE_INDEX:   "str — nom de l'index"
      PINECONE_ENV:     "str — environnement (ex: 'us-east1-gcp')"
      TARGET_METADATA_KEY: "str | None"
      FETCH_N:          "int — vecteurs à récupérer par batch (défaut: 1000)"
    code_template: |
      import numpy as np
      import pandas as pd
      from pinecone import Pinecone

      # ── Paramètres ────────────────────────────────────────────────────
      PINECONE_API_KEY     = "YOUR_API_KEY"
      PINECONE_INDEX       = "my-index"
      TARGET_METADATA_KEY  = "category"
      FETCH_N              = 1000

      # ── Connexion ─────────────────────────────────────────────────────
      pc    = Pinecone(api_key=PINECONE_API_KEY)
      index = pc.Index(PINECONE_INDEX)
      stats = index.describe_index_stats()
      print(f"Index '{PINECONE_INDEX}' : {stats['total_vector_count']} vecteurs, "
            f"dim={stats['dimension']}")

      # ── Récupération par fetch sur IDs connus ou via query dummy ──────
      # Note : Pinecone n'a pas de "scan" — on utilise une requête nulle
      dim         = stats["dimension"]
      dummy_query = np.zeros(dim).tolist()
      result      = index.query(vector=dummy_query, top_k=FETCH_N,
                                include_metadata=True, include_values=True)

      vectors   = np.array([m["values"]            for m in result["matches"]])
      metadatas = [m.get("metadata", {})            for m in result["matches"]]
      ids_list  = [m["id"]                          for m in result["matches"]]

      df_meta   = pd.DataFrame(metadatas)
      feat_cols = [f"emb_{i}" for i in range(dim)]
      X         = pd.DataFrame(vectors, columns=feat_cols)
      df        = X.copy()
      df["vector_id"] = ids_list

      if TARGET_METADATA_KEY and TARGET_METADATA_KEY in df_meta.columns:
          y         = df_meta[TARGET_METADATA_KEY].reset_index(drop=True)
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          y         = None
          task_type = "clustering"

      feature_names = feat_cols
      target_name   = TARGET_METADATA_KEY
      meta = {
          "index"        : PINECONE_INDEX,
          "n_vectors"    : len(vectors),
          "embedding_dim": dim,
          "shape"        : vectors.shape,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


# ──────────────────────────────────────────────────────────────────────────
multi_table_db:
# ──────────────────────────────────────────────────────────────────────────

  - id: multi_table_relational
    name: "Base Relationnelle Multi-Tables (Feature Engineering Automatique)"
    enabled: true
    category: "Base Relationnelle Multi-Tables"
    format: "SQL — schéma complet"
    description: >
      Charge l'intégralité d'un schéma relationnel (toutes tables, toutes
      colonnes), détecte automatiquement les clés étrangères et effectue
      le feature engineering cross-table via Featuretools (Deep Feature
      Synthesis — DFS). Produit un DataFrame tabulaire unique utilisable
      par tout modèle sklearn.
    use_cases:
      - "CRM — clients, commandes, produits, interactions"
      - "ERP — transactions, stocks, fournisseurs"
      - "tout schéma relationnel complexe"
      - "AutoML sur données multi-tables"
    pros:
      - "zéro jointure manuelle"
      - "features agrégées automatiques (max, min, mean, count, last…)"
      - "DFS discover des features cachées dans les relations"
    cons:
      - "explosion du nombre de features (feature selection requise ensuite)"
      - "lent sur grands volumes"
      - "featuretools requis"
    input_parameters:
      DB_URL:        "str — chaîne SQLAlchemy"
      TARGET_TABLE:  "str — table principale (entité cible)"
      TARGET_COL:    "str — colonne cible dans TARGET_TABLE"
      ENTITY_ID_COL: "str — clé primaire de TARGET_TABLE"
      EXCLUDE_TABLES: "list[str] — tables à exclure (logs, audit…)"
      MAX_DEPTH:     "int — profondeur DFS (défaut: 2)"
      N_JOBS:        "int — parallélisme featuretools (défaut: -1)"
    code_template: |
      import pandas as pd
      import numpy as np
      from sqlalchemy import create_engine, inspect
      import featuretools as ft

      # ── Paramètres ────────────────────────────────────────────────────
      DB_URL         = "postgresql+psycopg2://user:pwd@localhost:5432/mydb"
      TARGET_TABLE   = "customers"
      TARGET_COL     = "churn"
      ENTITY_ID_COL  = "customer_id"
      EXCLUDE_TABLES = ["alembic_version", "django_migrations", "audit_log"]
      MAX_DEPTH      = 2
      N_JOBS         = -1

      # ── Introspection complète du schéma ──────────────────────────────
      engine    = create_engine(DB_URL, pool_pre_ping=True)
      inspector = inspect(engine)
      all_tables = [t for t in inspector.get_table_names()
                    if t not in EXCLUDE_TABLES]
      print(f"Tables détectées : {all_tables}")

      # ── Chargement de toutes les tables ───────────────────────────────
      dfs_dict = {}
      with engine.connect() as conn:
          for table in all_tables:
              try:
                  dfs_dict[table] = pd.read_sql_table(table, conn)
                  print(f"  {table} : {dfs_dict[table].shape}")
              except Exception as e:
                  print(f"  ⚠ {table} ignorée : {e}")

      # ── Détection automatique des relations (FK) ───────────────────────
      relationships = []
      for table in all_tables:
          for fk in inspector.get_foreign_keys(table):
              if fk["referred_table"] in dfs_dict:
                  relationships.append(
                      ft.Relationship(
                          parent_dataframe_name=fk["referred_table"],
                          parent_column_name=fk["referred_columns"][0],
                          child_dataframe_name=table,
                          child_column_name=fk["constrained_columns"][0],
                      )
                  )
                  print(f"  FK : {table}.{fk['constrained_columns'][0]} "
                        f"→ {fk['referred_table']}.{fk['referred_columns'][0]}")

      # ── EntitySet Featuretools ─────────────────────────────────────────
      es = ft.EntitySet(id="multi_table_db")
      for table, df_t in dfs_dict.items():
          pk_cols = [c["name"] for c in inspector.get_pk_constraint(table)["constrained_columns"]]
          idx_col = pk_cols[0] if pk_cols else None
          if idx_col and idx_col in df_t.columns:
              es.add_dataframe(dataframe_name=table,
                               dataframe=df_t,
                               index=idx_col)
          else:
              df_t = df_t.copy()
              df_t["_id"] = range(len(df_t))
              es.add_dataframe(dataframe_name=table,
                               dataframe=df_t,
                               index="_id")

      for rel in relationships:
          try:
              es.add_relationship(rel)
          except Exception as e:
              print(f"  ⚠ Relation ignorée : {e}")

      # ── Deep Feature Synthesis ────────────────────────────────────────
      feature_matrix, feature_defs = ft.dfs(
          entityset=es,
          target_dataframe_name=TARGET_TABLE,
          max_depth=MAX_DEPTH,
          n_jobs=N_JOBS,
          verbose=True,
      )
      print(f"\nFeatures DFS générées : {feature_matrix.shape[1]}")

      # ── Variables standards ───────────────────────────────────────────
      df = feature_matrix.copy()
      if TARGET_COL in dfs_dict[TARGET_TABLE].columns:
          _target_series = dfs_dict[TARGET_TABLE].set_index(ENTITY_ID_COL)[TARGET_COL]
          df[TARGET_COL] = df.index.map(_target_series)
          y         = df.pop(TARGET_COL)
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          y         = None
          task_type = "clustering"

      X             = df.select_dtypes(include=[np.number]).fillna(0)
      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {
          "tables_loaded" : list(dfs_dict.keys()),
          "n_relationships": len(relationships),
          "n_dfs_features" : len(feature_defs),
          "feature_defs"  : feature_defs,
          "shape"         : X.shape,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


# ──────────────────────────────────────────────────────────────────────────
cloud_platforms:
# ──────────────────────────────────────────────────────────────────────────

  - id: supabase
    name: "Supabase (PostgreSQL + API REST)"
    enabled: true
    category: "Cloud BaaS"
    format: "REST JSON / PostgREST / psycopg2"
    description: >
      Chargement depuis Supabase via le client Python officiel (PostgREST)
      ou via connexion directe PostgreSQL. Supabase = PostgreSQL managé +
      Auth + Storage + Realtime. Support des requêtes filtrées, joins et
      Row Level Security (RLS désactivé en service_role).
    use_cases:
      - "applications web/mobile avec backend Supabase"
      - "données utilisateur + transactions + events"
      - "prototypage rapide BaaS"
    pros:
      - "SDK Python officiel"
      - "accès direct PostgreSQL disponible"
      - "RLS configurable"
      - "gratuit tier généreux"
    cons:
      - "RLS peut masquer des données si mal configuré"
      - "latence réseau vs local"
    input_parameters:
      SUPABASE_URL:         "str — URL du projet (https://xxx.supabase.co)"
      SUPABASE_SERVICE_KEY: "str — service_role key (contourne RLS)"
      SUPABASE_TABLE:       "str — table principale"
      TARGET_COL:           "str | None"
      SELECT_COLS:          "str — colonnes à sélectionner (défaut: '*')"
      FILTERS:              "dict — {colonne: valeur} filtres simples"
      PG_DSN:               "str | None — DSN PostgreSQL direct (optionnel)"
    code_template: |
      import pandas as pd
      import numpy as np

      # ── Paramètres ────────────────────────────────────────────────────
      SUPABASE_URL         = "https://xxxxxxxxxxxx.supabase.co"
      SUPABASE_SERVICE_KEY = "eyJ..."   # service_role key
      SUPABASE_TABLE       = "users"
      TARGET_COL           = "churn"
      SELECT_COLS          = "*"
      FILTERS              = {}         # ex: {"status": "active"}
      PG_DSN               = None       # "postgresql://postgres:pwd@db.xxx.supabase.co:5432/postgres"

      # ── Option A : client Python Supabase (PostgREST) ─────────────────
      if PG_DSN is None:
          from supabase import create_client
          client = create_client(SUPABASE_URL, SUPABASE_SERVICE_KEY)

          query = client.table(SUPABASE_TABLE).select(SELECT_COLS)
          for col, val in FILTERS.items():
              query = query.eq(col, val)

          # Pagination automatique (max 1000 par page PostgREST)
          all_records = []
          page_size   = 1000
          offset      = 0
          while True:
              resp = query.range(offset, offset + page_size - 1).execute()
              if not resp.data:
                  break
              all_records.extend(resp.data)
              if len(resp.data) < page_size:
                  break
              offset += page_size
              print(f"Chargés : {len(all_records)}")

          df = pd.json_normalize(all_records)

      # ── Option B : connexion PostgreSQL directe (plus rapide) ─────────
      else:
          from sqlalchemy import create_engine
          engine = create_engine(PG_DSN)
          _where = " AND ".join(f"{k}='{v}'" for k, v in FILTERS.items())
          _query = (f"SELECT {SELECT_COLS} FROM {SUPABASE_TABLE}"
                    + (f" WHERE {_where}" if _where else ""))
          with engine.connect() as conn:
              df = pd.read_sql(_query, conn)

      print(f"Shape : {df.shape}")

      # ── Variables standards ───────────────────────────────────────────
      _id_cols = [c for c in ["id", "uuid", "created_at", "updated_at"] if c in df.columns]
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=_id_cols + [TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
      else:
          X         = df.drop(columns=_id_cols)
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {
          "supabase_url" : SUPABASE_URL,
          "table"        : SUPABASE_TABLE,
          "n_records"    : len(df),
          "filters"      : FILTERS,
          "shape"        : df.shape,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: aws_s3_athena
    name: "AWS S3 + Athena"
    enabled: true
    category: "Cloud Data Lake"
    format: "Parquet / CSV sur S3 + SQL Athena"
    description: >
      Requêtage de données stockées sur S3 via Athena (SQL serverless).
      Ou lecture directe de fichiers S3 via s3fs + pandas.
    use_cases:
      - "data lake AWS"
      - "logs CloudWatch, CloudTrail"
      - "données Kinesis Firehose archivées"
    pros:
      - "SQL sur fichiers S3 sans infrastructure"
      - "coût très bas (scan)"
      - "intégration AWS native"
    cons:
      - "latence 1-30s par requête"
      - "coût au scan (compresser en Parquet)"
    input_parameters:
      AWS_REGION:     "str — région AWS (ex: 'eu-west-1')"
      S3_BUCKET:      "str — nom du bucket"
      S3_KEY:         "str | None — clé objet ou préfixe"
      ATHENA_DATABASE: "str | None — database Athena"
      ATHENA_QUERY:   "str | None — requête SQL Athena"
      ATHENA_S3_OUTPUT: "str — s3://bucket/output/ pour résultats Athena"
      TARGET_COL:     "str | None"
    code_template: |
      import pandas as pd
      import numpy as np
      import boto3
      import io
      import time

      # ── Paramètres ────────────────────────────────────────────────────
      AWS_REGION       = "eu-west-1"
      S3_BUCKET        = "my-data-lake"
      S3_KEY           = "datasets/processed/data.parquet"  # None si Athena
      ATHENA_DATABASE  = None            # "my_glue_database"
      ATHENA_S3_OUTPUT = "s3://my-data-lake/athena-results/"
      TARGET_COL       = "label"

      ATHENA_QUERY = """
          SELECT *
          FROM my_table
          WHERE year = '2024' AND month = '12'
          LIMIT 500000
      """

      session = boto3.Session(region_name=AWS_REGION)

      # ── Option A : lecture directe S3 ─────────────────────────────────
      if S3_KEY and not ATHENA_DATABASE:
          s3  = session.client("s3")
          obj = s3.get_object(Bucket=S3_BUCKET, Key=S3_KEY)
          buf = io.BytesIO(obj["Body"].read())
          df  = (pd.read_parquet(buf) if S3_KEY.endswith(".parquet")
                 else pd.read_csv(buf))

      # ── Option B : requête Athena ──────────────────────────────────────
      elif ATHENA_DATABASE:
          athena   = session.client("athena", region_name=AWS_REGION)
          response = athena.start_query_execution(
              QueryString=ATHENA_QUERY,
              QueryExecutionContext={"Database": ATHENA_DATABASE},
              ResultConfiguration={"OutputLocation": ATHENA_S3_OUTPUT},
          )
          exec_id = response["QueryExecutionId"]
          # Attente completion
          for _ in range(60):
              status = athena.get_query_execution(QueryExecutionId=exec_id)
              state  = status["QueryExecution"]["Status"]["State"]
              if state in ["SUCCEEDED", "FAILED", "CANCELLED"]:
                  break
              time.sleep(2)
          if state != "SUCCEEDED":
              raise RuntimeError(f"Athena query {state}")
          # Lecture du résultat S3
          s3_path = (status["QueryExecution"]["ResultConfiguration"]
                     ["OutputLocation"].replace("s3://", ""))
          bucket, key = s3_path.split("/", 1)
          s3  = session.client("s3")
          obj = s3.get_object(Bucket=bucket, Key=key)
          df  = pd.read_csv(io.BytesIO(obj["Body"].read()))
      else:
          raise ValueError("Fournir S3_KEY ou ATHENA_DATABASE")

      print(f"Shape : {df.shape}")

      # ── Variables standards ───────────────────────────────────────────
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.copy()
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"bucket": S3_BUCKET, "shape": df.shape,
              "athena_exec_id": exec_id if ATHENA_DATABASE else None}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: azure_blob_synapse
    name: "Azure Blob Storage + Synapse Analytics"
    enabled: true
    category: "Cloud Data Lake"
    format: "Parquet / CSV / Delta sur ADLS Gen2 + SQL Synapse"
    description: >
      Lecture depuis Azure Blob / ADLS Gen2 et requêtage via Synapse
      Serverless SQL Pool. Alternative : Azure ML Datasets.
    use_cases:
      - "data lake Azure"
      - "pipelines Azure Data Factory"
      - "données Synapse Spark"
    input_parameters:
      AZURE_CONNECTION_STRING: "str — connection string compte de stockage"
      AZURE_CONTAINER:    "str — nom du container"
      AZURE_BLOB_PATH:    "str — chemin du blob"
      SYNAPSE_SERVER:     "str | None — serveur Synapse Serverless SQL"
      SYNAPSE_DATABASE:   "str | None"
      SYNAPSE_QUERY:      "str | None"
      TARGET_COL:         "str | None"
    code_template: |
      import pandas as pd
      import numpy as np
      import io

      # ── Paramètres ────────────────────────────────────────────────────
      AZURE_CONNECTION_STRING = "DefaultEndpointsProtocol=https;AccountName=..."
      AZURE_CONTAINER         = "raw-data"
      AZURE_BLOB_PATH         = "2024/12/dataset.parquet"
      SYNAPSE_SERVER          = None  # "xxx-ondemand.sql.azuresynapse.net"
      SYNAPSE_DATABASE        = None  # "my_serverless_db"
      SYNAPSE_QUERY           = None
      TARGET_COL              = "label"

      # ── Option A : Azure Blob Storage ─────────────────────────────────
      if SYNAPSE_SERVER is None:
          from azure.storage.blob import BlobServiceClient
          blob_client = BlobServiceClient.from_connection_string(
              AZURE_CONNECTION_STRING)
          downloader = (blob_client
                        .get_container_client(AZURE_CONTAINER)
                        .get_blob_client(AZURE_BLOB_PATH)
                        .download_blob())
          buf = io.BytesIO(downloader.readall())
          df  = (pd.read_parquet(buf) if AZURE_BLOB_PATH.endswith(".parquet")
                 else pd.read_csv(buf))

      # ── Option B : Synapse Serverless SQL ─────────────────────────────
      else:
          import pyodbc
          conn_str = (
              f"DRIVER={{ODBC Driver 18 for SQL Server}};"
              f"SERVER={SYNAPSE_SERVER};DATABASE={SYNAPSE_DATABASE};"
              f"Authentication=ActiveDirectoryInteractive"
          )
          with pyodbc.connect(conn_str) as conn:
              df = pd.read_sql(SYNAPSE_QUERY, conn)

      print(f"Shape : {df.shape}")

      # ── Variables standards ───────────────────────────────────────────
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.copy()
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"container": AZURE_CONTAINER, "blob": AZURE_BLOB_PATH, "shape": df.shape}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


# ──────────────────────────────────────────────────────────────────────────
lakehouse:
# ──────────────────────────────────────────────────────────────────────────

  - id: delta_lake
    name: "Delta Lake / Databricks"
    enabled: true
    category: "Lakehouse"
    format: "Delta Table (Parquet + transaction log)"
    description: >
      Lecture d'une Delta Table (local ou Databricks) via delta-rs ou
      PySpark. Support du time travel (lecture à une version passée),
      Change Data Feed et schema evolution.
    use_cases:
      - "pipelines Databricks / Apache Spark"
      - "data lakehouse sur S3, ADLS, GCS"
      - "time travel — audit et reproductibilité"
    pros:
      - "ACID transactions sur data lake"
      - "time travel natif"
      - "lecture sans Spark (delta-rs)"
    cons:
      - "delta-rs ne supporte pas toutes les fonctionnalités DML"
      - "Spark requis pour écriture haute perf"
    input_parameters:
      DELTA_TABLE_PATH: "str — chemin local ou s3://... ou abfss://..."
      DELTA_VERSION:    "int | None — version pour time travel (None = latest)"
      DELTA_TIMESTAMP:  "str | None — timestamp pour time travel"
      TARGET_COL:       "str | None"
      STORAGE_OPTIONS:  "dict — credentials S3/Azure/GCS"
    code_template: |
      import pandas as pd
      import numpy as np

      # ── Paramètres ────────────────────────────────────────────────────
      DELTA_TABLE_PATH = "./data/delta_table"   # ou "s3://bucket/path/"
      DELTA_VERSION    = None     # int ou None
      DELTA_TIMESTAMP  = None     # "2024-12-01T00:00:00" ou None
      TARGET_COL       = "label"
      STORAGE_OPTIONS  = {}       # {"AWS_ACCESS_KEY_ID": "...", ...}

      # ── Option A : delta-rs (sans Spark) ──────────────────────────────
      try:
          from deltalake import DeltaTable
          dt_kwargs = {"storage_options": STORAGE_OPTIONS} if STORAGE_OPTIONS else {}
          dt        = DeltaTable(DELTA_TABLE_PATH, **dt_kwargs)

          if DELTA_VERSION is not None:
              dt.load_as_version(DELTA_VERSION)
          elif DELTA_TIMESTAMP is not None:
              dt.load_as_version(DELTA_TIMESTAMP)

          df = dt.to_pandas()
          print(f"Delta version : {dt.version()} | Shape : {df.shape}")

      # ── Option B : PySpark (si disponible) ────────────────────────────
      except ImportError:
          from pyspark.sql import SparkSession
          spark = SparkSession.builder.appName("DeltaLoad").getOrCreate()
          _opts = {"versionAsOf": str(DELTA_VERSION)} if DELTA_VERSION is not None else {}
          if DELTA_TIMESTAMP:
              _opts = {"timestampAsOf": DELTA_TIMESTAMP}
          sdf = spark.read.format("delta").options(**_opts).load(DELTA_TABLE_PATH)
          df  = sdf.toPandas()
          print(f"Shape : {df.shape}")

      # ── Variables standards ───────────────────────────────────────────
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.copy()
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"path": DELTA_TABLE_PATH, "version": DELTA_VERSION,
              "timestamp": DELTA_TIMESTAMP, "shape": df.shape}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: apache_iceberg
    name: "Apache Iceberg"
    enabled: true
    category: "Lakehouse"
    format: "Iceberg Table (Parquet + metadata JSON)"
    description: >
      Lecture d'une table Iceberg via PyIceberg (sans Spark).
      Support des snapshots, schema evolution et hidden partitioning.
      Standard ouvert concurrent à Delta Lake (utilisé par Snowflake, AWS Glue).
    input_parameters:
      ICEBERG_CATALOG_TYPE: "str — 'rest'|'hive'|'glue'|'sql'|'hadoop'"
      ICEBERG_CATALOG_URI:  "str — URI du catalog"
      ICEBERG_NAMESPACE:    "str — namespace (ex: 'default')"
      ICEBERG_TABLE:        "str — nom de la table"
      SNAPSHOT_ID:          "int | None — snapshot pour time travel"
      TARGET_COL:           "str | None"
    code_template: |
      import pandas as pd
      import numpy as np
      from pyiceberg.catalog import load_catalog

      # ── Paramètres ────────────────────────────────────────────────────
      ICEBERG_CATALOG_TYPE = "rest"
      ICEBERG_CATALOG_URI  = "http://localhost:8181"
      ICEBERG_NAMESPACE    = "default"
      ICEBERG_TABLE        = "my_table"
      SNAPSHOT_ID          = None   # None = latest
      TARGET_COL           = "label"

      # ── Connexion ─────────────────────────────────────────────────────
      catalog = load_catalog(
          ICEBERG_CATALOG_TYPE,
          **{"uri": ICEBERG_CATALOG_URI}
      )
      table = catalog.load_table(f"{ICEBERG_NAMESPACE}.{ICEBERG_TABLE}")
      print(f"Schema : {table.schema()}")
      print(f"Snapshots : {len(table.history())}")

      # ── Lecture (avec time travel optionnel) ──────────────────────────
      scan = table.scan()
      if SNAPSHOT_ID is not None:
          scan = table.scan(snapshot_id=SNAPSHOT_ID)

      df = scan.to_arrow().to_pandas()
      print(f"Shape : {df.shape}")

      # ── Variables standards ───────────────────────────────────────────
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.copy()
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"namespace": ICEBERG_NAMESPACE, "table": ICEBERG_TABLE,
              "snapshot_id": SNAPSHOT_ID, "shape": df.shape}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
