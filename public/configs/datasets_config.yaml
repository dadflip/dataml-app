images_and_media:
# ──────────────────────────────────────────────────────────────────────────

  - id: image_folder
    name: "Images (Dossier Local)"
    enabled: true
    category: "Vision"
    format: "jpg / png / bmp"
    description: "Chargement d'images depuis un dossier structuré par classe."
    use_cases: ["classification d'images", "détection d'anomalies visuelles"]
    pros: ["flexibilité totale", "augmentation facile"]
    cons: ["gros volumes lents sans optimisation"]
    code_template: |
      import torch
      from torchvision import datasets, transforms
      from torch.utils.data import DataLoader
      import numpy as np
      import pandas as pd
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_data_dir    = widgets.Text(value="data/images/",
                                   description="DATA_DIR:", style={"description_width": "140px"},
                                   layout=widgets.Layout(width="500px"),
                                   placeholder="Dossier structuré : class_A/*.jpg, class_B/*.jpg …")
      w_img_size    = widgets.IntSlider(value=224, min=32, max=512, step=32,
                                        description="IMG_SIZE:", style={"description_width": "140px"})
      w_batch_size  = widgets.IntSlider(value=32, min=8, max=256, step=8,
                                        description="BATCH_SIZE:", style={"description_width": "140px"})
      w_num_workers = widgets.IntSlider(value=4, min=0, max=16, step=1,
                                        description="NUM_WORKERS:", style={"description_width": "140px"})
      w_normalize   = widgets.Checkbox(value=True, description="Normalisation ImageNet (mean/std)",
                                       style={"description_width": "140px"})
      w_flatten     = widgets.Checkbox(value=True, description="Aplatir vers X tabulaire (sklearn)",
                                       style={"description_width": "140px"})
      w_run         = widgets.Button(description="▶ Charger", button_style="success",
                                     layout=widgets.Layout(width="150px"))
      out           = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🖼 Images Dossier Local — Paramètres</b>"),
          w_data_dir,
          widgets.HBox([w_img_size, w_batch_size, w_num_workers]),
          w_normalize, w_flatten, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              DATA_DIR    = w_data_dir.value.strip()
              IMG_SIZE    = w_img_size.value
              BATCH_SIZE  = w_batch_size.value
              NUM_WORKERS = w_num_workers.value

              transform_list = [
                  transforms.Resize((IMG_SIZE, IMG_SIZE)),
                  transforms.ToTensor(),
              ]
              if w_normalize.value:
                  transform_list.append(
                      transforms.Normalize(mean=[0.485, 0.456, 0.406],
                                           std=[0.229, 0.224, 0.225]))
              img_transforms = transforms.Compose(transform_list)

              full_dataset = datasets.ImageFolder(DATA_DIR, transform=img_transforms)
              class_names  = full_dataset.classes
              print(f"Classes : {class_names} | Total : {len(full_dataset)}")

              loader = DataLoader(full_dataset, batch_size=BATCH_SIZE,
                                  shuffle=False, num_workers=NUM_WORKERS)

              X_np = np.concatenate([b[0].numpy() for b in loader], axis=0)
              y_np = np.concatenate([b[1].numpy() for b in loader], axis=0)

              if w_flatten.value:
                  X_flat = X_np.reshape(X_np.shape[0], -1)
                  X      = pd.DataFrame(X_flat)
                  feature_names = [f"pixel_{i}" for i in range(X_flat.shape[1])]
              else:
                  X      = pd.DataFrame({"image_idx": range(len(X_np))})
                  feature_names = ["image_idx"]

              df           = pd.DataFrame({"label": y_np})
              y            = pd.Series(y_np, name="label")
              target_name  = "label"
              task_type    = "classification"
              meta = {
                  "classes":  class_names,
                  "img_size": IMG_SIZE,
                  "shape":    X_np.shape,
                  "raw_array": X_np,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"X shape : {X.shape}")
              print(f"\n✅ task_type='{task_type}' | classes={class_names} | target='{target_name}'")

      w_run.on_click(on_run)


