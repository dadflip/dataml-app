    code_template: |
      import requests
      import pandas as pd
      import time
      from typing import Optional

      BASE_URL   = "https://api.example.com/v1"
      API_KEY    = "YOUR_API_KEY"
      ENDPOINT   = "/data"
      TARGET_COL = "label"

      HEADERS = {
          "Authorization": f"Bearer {API_KEY}",
          "Content-Type": "application/json"
      }

      def fetch_all_pages(endpoint: str, params: dict,
                          page_key: str = "page",
                          max_pages: int = 100) -> list:
          """Pagination automatique."""
          records = []
          for page in range(1, max_pages + 1):
              params[page_key] = page
              try:
                  response = requests.get(
                      BASE_URL + endpoint,
                      headers=HEADERS,
                      params=params,
                      timeout=30
                  )
                  response.raise_for_status()
                  data = response.json()
                  items = data.get("results", data.get("data", []))
                  if not items:
                      break
                  records.extend(items)
                  print(f"Page {page} : {len(items)} enregistrements")
                  time.sleep(0.2)   # respect du rate limit
              except requests.RequestException as e:
                  print(f"Erreur page {page} : {e}")
                  break
          return records

      params = {"limit": 100, "format": "json"}
      records = fetch_all_pages(ENDPOINT, params)
      df = pd.json_normalize(records)

      print(f"Shape : {df.shape}")

      if TARGET_COL and TARGET_COL in df.columns:
          X = df.drop(columns=[TARGET_COL])
          y = df[TARGET_COL]
          task_type = "classification" if y.dtype == object or y.nunique() < 20 else "regression"
      else:
          X = df.copy()
          y = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"base_url": BASE_URL, "n_records": len(records)}

