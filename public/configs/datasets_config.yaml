      code_template: |
        import pandas as pd, numpy as np, json

        # ── Paramètres ──────────────────────────────────────────────────
        DELTA_TABLE_PATH = "./data/delta_table"
        ENGINE           = "delta-rs (sans Spark)"
        DELTA_VERSION    = None    # int ou None = latest
        DELTA_TIMESTAMP  = None    # "2024-12-01T00:00:00" ou None
        TARGET_COL       = None
        STORAGE_OPTIONS  = {}

        if ENGINE == "delta-rs (sans Spark)":
            from deltalake import DeltaTable
            kw = {"storage_options": STORAGE_OPTIONS} if STORAGE_OPTIONS else {}
            dt = DeltaTable(DELTA_TABLE_PATH, **kw)
            if DELTA_VERSION is not None: dt.load_as_version(DELTA_VERSION)
            elif DELTA_TIMESTAMP is not None: dt.load_as_version(DELTA_TIMESTAMP)
            df = dt.to_pandas()
            print(f"Delta v{dt.version()} | Shape : {df.shape}")
        else:
            from pyspark.sql import SparkSession
            spark = SparkSession.builder.appName("DeltaLoad").getOrCreate()
            _opts = ({"versionAsOf": str(DELTA_VERSION)} if DELTA_VERSION is not None
                     else {"timestampAsOf": DELTA_TIMESTAMP} if DELTA_TIMESTAMP else {})
            df = spark.read.format("delta").options(**_opts).load(DELTA_TABLE_PATH).toPandas()

        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL]); y = df[TARGET_COL]
