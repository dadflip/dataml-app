timeseries_sources:
# ──────────────────────────────────────────────────────────────────────────
# NOTE : Pour les timeseries, le split temporel est effectué dans Bloc 1
#        car l'ordre temporel est inhérent à la source et ne peut pas
#        être mélangé. Le Bloc 2 reçoit y_train/y_test/dates_* en pass-through.
# ──────────────────────────────────────────────────────────────────────────

  - id: timeseries_csv
    name: "Séries Temporelles (CSV Indexé)"
    enabled: true
    category: "Séries Temporelles"
    format: "csv / parquet avec index datetime"
    description: "Chargement et split temporel d'une série temporelle."
    use_cases: ["prévision de ventes", "données financières", "capteurs IoT", "énergie"]
    pros: ["format universel", "pandas natif"]
    cons: ["fréquence irrégulière à gérer", "fuseaux horaires piégeux"]
    code_template: |
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file       = widgets.Text(value="data/timeseries.csv",
                                  description="FILE_PATH:", style={"description_width": "140px"},
                                  layout=widgets.Layout(width="500px"))
      w_date_col   = widgets.Text(value="date",
                                  description="DATE_COL:", style={"description_width": "140px"})
      w_target     = widgets.Text(value="value",
                                  description="TARGET_COL:", style={"description_width": "140px"})
      w_freq       = widgets.Dropdown(
          options=[("Journalière (D)", "D"), ("Hebdomadaire (W)", "W"),
                   ("Mensuelle (M)", "ME"), ("Horaire (H)", "h"),
                   ("15 min (15T)", "15min"), ("Annuelle (Y)", "YE")],
          value="D", description="FREQ:", style={"description_width": "140px"})
      w_test_ratio = widgets.FloatSlider(value=0.2, min=0.05, max=0.5, step=0.05,
                                         description="TEST_RATIO:", style={"description_width": "140px"},
                                         readout_format=".0%")
      w_horizon    = widgets.IntText(value=30, description="HORIZON:",
                                     style={"description_width": "140px"})
      w_agg        = widgets.Dropdown(options=["sum", "mean", "last", "first", "max", "min"],
                                      value="sum", description="RESAMPLE_AGG:",
                                      style={"description_width": "140px"})
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>📈 Séries Temporelles CSV — Paramètres</b>"),
          w_file, w_date_col, w_target, w_freq,
          widgets.HBox([w_test_ratio, w_horizon, w_agg]),
          w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              FILE_PATH  = w_file.value.strip()
              DATE_COL   = w_date_col.value.strip()
              TARGET_COL = w_target.value.strip()
              FREQ       = w_freq.value
              TEST_RATIO = w_test_ratio.value
              HORIZON    = w_horizon.value
              AGG        = w_agg.value

              df = pd.read_csv(FILE_PATH, parse_dates=[DATE_COL])
              df = df.set_index(DATE_COL).sort_index()
              df = df.resample(FREQ).agg({TARGET_COL: AGG}).ffill()
              print(f"Shape : {df.shape} | Plage : {df.index.min()} → {df.index.max()}")

              X = df.drop(columns=[TARGET_COL]) if df.shape[1] > 1 else pd.DataFrame(index=df.index)
              y = df[TARGET_COL]
              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              task_type     = "timeseries"

              n_test       = int(len(df) * TEST_RATIO)
              y_train      = df[TARGET_COL].iloc[:-n_test]
              y_test       = df[TARGET_COL].iloc[-n_test:]
              dates_train  = y_train.index
              dates_future = pd.date_range(start=y_test.index[0], periods=HORIZON, freq=FREQ)

              meta = {
                  "freq":    FREQ,
                  "horizon": HORIZON,
                  "n_train": len(y_train),
                  "n_test":  len(y_test),
                  "shape":   df.shape,
              }

              texts_train = []
              texts_test  = []
              durations   = None
              events      = None
              df_survival = None

              print(f"\n✅ task_type='{task_type}' | n_train={len(y_train)} | n_test={len(y_test)} | horizon={HORIZON}")
              display(df.tail(5))

      w_run.on_click(on_run)

  - id: financial_data
    name: "Données Financières (yfinance)"
    enabled: true
    category: "Séries Temporelles"
    format: "API / DataFrame OHLCV"
    description: "Téléchargement de cours boursiers via yfinance (Yahoo Finance)."
    use_cases: ["prévision de prix", "détection d'anomalies financières", "features finance"]
    pros: ["gratuit", "historique long", "données ajustées", "multi-actifs"]
    cons: ["qualité variable", "délai ~15min"]
    code_template: |
      import yfinance as yf
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_ticker     = widgets.Text(value="AAPL",
                                  description="TICKER:", style={"description_width": "140px"},
                                  placeholder="ex: AAPL, MSFT, BTC-USD, ^GSPC")
      w_multi      = widgets.Text(value="",
                                  description="MULTI_TICKERS:", style={"description_width": "140px"},
                                  placeholder="Optionnel : AAPL,MSFT,GOOG")
      w_start      = widgets.Text(value="2020-01-01",
                                  description="START_DATE:", style={"description_width": "140px"})
      w_end        = widgets.Text(value="2024-12-31",
                                  description="END_DATE:", style={"description_width": "140px"})
      w_interval   = widgets.Dropdown(
          options=[("1 jour (1d)", "1d"), ("1 semaine (1wk)", "1wk"),
                   ("1 mois (1mo)", "1mo"), ("1 heure (1h)", "1h"),
                   ("15 min (15m)", "15m")],
          value="1d", description="INTERVAL:", style={"description_width": "140px"})
      w_target     = widgets.Dropdown(
          options=["Close", "Open", "High", "Low", "Volume"],
          value="Close", description="TARGET_COL:", style={"description_width": "140px"})
      w_test_ratio = widgets.FloatSlider(value=0.2, min=0.05, max=0.5, step=0.05,
                                         description="TEST_RATIO:", style={"description_width": "140px"},
                                         readout_format=".0%")
      w_horizon    = widgets.IntText(value=30, description="HORIZON:",
                                     style={"description_width": "140px"})
      w_run        = widgets.Button(description="▶ Télécharger", button_style="success",
                                    layout=widgets.Layout(width="170px"))
      out          = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>💹 yfinance — Paramètres</b>"),
          w_ticker, w_multi, w_start, w_end, w_interval, w_target,
          widgets.HBox([w_test_ratio, w_horizon]),
          w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              TICKER     = w_ticker.value.strip().upper()
              MULTI      = [t.strip().upper() for t in w_multi.value.split(",") if t.strip()]
              START_DATE = w_start.value.strip()
              END_DATE   = w_end.value.strip()
              INTERVAL   = w_interval.value
              TARGET_COL = w_target.value
              TEST_RATIO = w_test_ratio.value
              HORIZON    = w_horizon.value

              if MULTI:
                  df = yf.download(MULTI, start=START_DATE, end=END_DATE, interval=INTERVAL)
                  df.columns = ["_".join(c).strip() for c in df.columns]
              else:
                  ticker = yf.Ticker(TICKER)
                  df = ticker.history(start=START_DATE, end=END_DATE, interval=INTERVAL)

              df["returns"]     = df["Close"].pct_change() if "Close" in df.columns else df.iloc[:, 3].pct_change()
              df["log_returns"] = np.log(df["Close"] / df["Close"].shift(1)) if "Close" in df.columns else 0
              df["MA_20"]       = df["Close"].rolling(20).mean() if "Close" in df.columns else 0
              df["MA_50"]       = df["Close"].rolling(50).mean() if "Close" in df.columns else 0
              df["volatility"]  = df["returns"].rolling(20).std()
              df["RSI"]         = 100 - (100 / (
                  1 + df["returns"].clip(lower=0).rolling(14).mean()
                  / (-df["returns"].clip(upper=0)).rolling(14).mean()))
              df = df.dropna()

              feature_cols  = [c for c in ["Open", "High", "Low", "Close", "Volume",
                                            "MA_20", "MA_50", "volatility", "RSI"] if c in df.columns]
              X             = df[feature_cols]
              y             = df[TARGET_COL] if TARGET_COL in df.columns else df["Close"]
              feature_names = feature_cols
              target_name   = TARGET_COL
              task_type     = "timeseries"

              n_test       = int(len(df) * TEST_RATIO)
              y_train      = y.iloc[:-n_test]
              y_test       = y.iloc[-n_test:]
              dates_train  = y_train.index
              dates_future = pd.date_range(start=y_test.index[-1], periods=HORIZON + 1,
                                           freq=INTERVAL)[1:]

              meta = {
                  "ticker":   TICKER,
                  "interval": INTERVAL,
                  "shape":    df.shape,
                  "horizon":  HORIZON,
              }

              texts_train = []
              texts_test  = []
              durations   = None
              events      = None
              df_survival = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | n_train={len(y_train)} | n_test={len(y_test)} | horizon={HORIZON}")
              display(df.tail(5))

      w_run.on_click(on_run)


