  - id: geospatial_vector
    name: "Données Géospatiales Vectorielles (GeoJSON / Shapefile / GeoParquet)"
    enabled: true
    category: "Géospatial"
    format: "GeoJSON · Shapefile · GeoPackage · GeoParquet · WFS"
    description: >
      Chargement de données géospatiales vectorielles via GeoPandas.
      Extraction de features géométriques pour pipeline ML tabulaire.
    use_cases:
      - "prédiction de prix immobiliers (géolocalisation)"
      - "classification de parcelles agricoles (polygones)"
      - "détection d'anomalies géographiques"
      - "clustering spatial"
    pros:
      - "geopandas = pandas pour la géométrie"
      - "tous formats OGR supportés"
      - "projections et reprojections simples"
    cons:
      - "géométries complexes → features non triviales"
      - "CRS à harmoniser entre sources"
    code_template: |
      import geopandas as gpd
      import pandas as pd
      import numpy as np
      from shapely.geometry import Point
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file      = widgets.Text(value="data/parcels.geojson",
                                 description="GEO_FILE:", style={"description_width": "160px"},
                                 layout=widgets.Layout(width="500px"),
                                 placeholder=".geojson, .shp, .gpkg, .parquet, WFS URL")
      w_target    = widgets.Text(value="land_use",
                                 description="TARGET_COL:", style={"description_width": "160px"},
                                 placeholder="Laisser vide = clustering")
      w_crs       = widgets.Combobox(
          value="EPSG:4326",
          options=["EPSG:4326", "EPSG:3857", "EPSG:2154", "EPSG:32630", "EPSG:32632"],
          description="CRS_TARGET:", style={"description_width": "160px"},
          ensure_option=False)
      w_layer     = widgets.Text(value="",
                                 description="LAYER:", style={"description_width": "160px"},
                                 placeholder="GeoPackage multi-layer — vide = premier layer")
      w_ref_point = widgets.Checkbox(value=True, description="Calculer distance point de référence",
                                     style={"description_width": "160px"})
      w_ref_lon   = widgets.FloatText(value=2.3522, description="REF_LON:",
                                      style={"description_width": "160px"})
      w_ref_lat   = widgets.FloatText(value=48.8566, description="REF_LAT (Paris):",
                                      style={"description_width": "160px"})
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      def on_ref_change(change):
          w_ref_lon.layout.visibility = "visible" if change["new"] else "hidden"
          w_ref_lat.layout.visibility = "visible" if change["new"] else "hidden"

      w_ref_point.observe(on_ref_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🗺 Données Géospatiales Vectorielles — Paramètres</b>"),
          w_file, w_target, w_crs, w_layer,
          w_ref_point, widgets.HBox([w_ref_lon, w_ref_lat]),
          w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              GEO_FILE   = w_file.value.strip()
              TARGET_COL = w_target.value.strip() or None
              CRS_TARGET = w_crs.value.strip()
              LAYER      = w_layer.value.strip() or None
              USE_REF    = w_ref_point.value
              REF_POINT  = (w_ref_lon.value, w_ref_lat.value) if USE_REF else None

              kwargs = {"layer": LAYER} if LAYER else {}
              if GEO_FILE.endswith(".parquet"):
                  gdf = gpd.read_parquet(GEO_FILE)
              else:
                  gdf = gpd.read_file(GEO_FILE, **kwargs)

              print(f"Shape : {gdf.shape} | CRS : {gdf.crs}")

              if gdf.crs and str(gdf.crs) != CRS_TARGET:
                  gdf = gdf.to_crs(CRS_TARGET)

              gdf_proj = gdf.to_crs("EPSG:3857")
              gdf["area_m2"]      = gdf_proj.geometry.area
              gdf["perimeter_m"]  = gdf_proj.geometry.length
              gdf["compactness"]  = (4 * np.pi * gdf["area_m2"]
                                     / (gdf["perimeter_m"] ** 2 + 1e-8))
              gdf["centroid_lon"] = gdf.geometry.centroid.x
              gdf["centroid_lat"] = gdf.geometry.centroid.y
              gdf["is_valid"]     = gdf.geometry.is_valid.astype(int)
              gdf["geom_type"]    = gdf.geometry.geom_type.astype("category").cat.codes

              if REF_POINT:
                  ref = gpd.GeoSeries([Point(REF_POINT)], crs="EPSG:4326").to_crs("EPSG:3857").iloc[0]
                  gdf["dist_ref_m"] = gdf_proj.geometry.centroid.distance(ref)

              df = pd.DataFrame(gdf.drop(columns=["geometry"]))

              GEO_FEAT = ["area_m2", "perimeter_m", "compactness",
                          "centroid_lon", "centroid_lat", "is_valid", "geom_type"]
              if REF_POINT:
                  GEO_FEAT.append("dist_ref_m")

              if TARGET_COL and TARGET_COL in df.columns:
                  X         = df[GEO_FEAT]
                  y         = df[TARGET_COL]
                  task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
              else:
                  X         = df[GEO_FEAT]
                  y         = None
                  task_type = "geospatial"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {
                  "crs":        str(gdf.crs),
                  "geom_types": gdf.geometry.geom_type.value_counts().to_dict(),
                  "bbox":       list(gdf.total_bounds),
                  "shape":      gdf.shape,
                  "gdf":        gdf,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | geo_features={len(GEO_FEAT)} | target='{target_name}'")
              display(df[GEO_FEAT + ([TARGET_COL] if TARGET_COL else [])].head(3))

      w_run.on_click(on_run)

  - id: geospatial_raster
    name: "Données Géospatiales Raster (GeoTIFF / NetCDF / Zarr)"
    enabled: true
    category: "Géospatial"
    format: "GeoTIFF · NetCDF · Zarr · HDF5"
    description: >
      Chargement de données raster (images satellite, MNT, météo, données
      climatiques) via rasterio / xarray.
    use_cases:
      - "classification de couverture du sol (satellite)"
      - "prévision météo (ERA5, CMIP6)"
      - "détection de changement (avant/après)"
      - "NDVI, indices spectraux"
    code_template: |
      import numpy as np
      import pandas as pd
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file      = widgets.Text(value="data/satellite.tif",
                                 description="RASTER_FILE:", style={"description_width": "150px"},
                                 layout=widgets.Layout(width="500px"),
                                 placeholder=".tif, .nc, .zarr, .h5")
      w_band_names = widgets.Text(value="red,green,blue,nir",
                                  description="BAND_NAMES:", style={"description_width": "150px"},
                                  layout=widgets.Layout(width="400px"),
                                  placeholder="Séparés par virgules — vide = auto (band_1, band_2…)")
      w_variable  = widgets.Text(value="",
                                 description="VARIABLE (NetCDF/Zarr):", style={"description_width": "150px"},
                                 placeholder="Vide = première variable")
      w_compute_ndvi = widgets.Checkbox(value=True,
                                        description="Calculer NDVI si bandes red et nir disponibles",
                                        style={"description_width": "150px"})
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🛰 Données Raster — Paramètres</b>"),
          w_file, w_band_names, w_variable, w_compute_ndvi, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              RASTER_FILE   = w_file.value.strip()
              _bands_raw    = w_band_names.value.strip()
              BAND_NAMES    = [b.strip() for b in _bands_raw.split(",") if b.strip()] or None
              VARIABLE      = w_variable.value.strip() or None
              COMPUTE_NDVI  = w_compute_ndvi.value

              if RASTER_FILE.endswith((".tif", ".tiff")):
                  import rasterio
                  with rasterio.open(RASTER_FILE) as src:
                      print(f"Bandes : {src.count} | CRS : {src.crs} | Shape : {src.shape}")
                      data    = src.read()
                      profile = src.profile

                  n_bands  = data.shape[0]
                  _names   = BAND_NAMES[:n_bands] if BAND_NAMES else [f"band_{i+1}" for i in range(n_bands)]
                  X_arr    = data.reshape(n_bands, -1).T
                  df       = pd.DataFrame(X_arr, columns=_names)

                  if COMPUTE_NDVI and "red" in df.columns and "nir" in df.columns:
                      df["ndvi"] = ((df["nir"] - df["red"]) /
                                    (df["nir"] + df["red"] + 1e-8))
                      print("✅ NDVI calculé")
              else:
                  import xarray as xr
                  ds  = (xr.open_zarr(RASTER_FILE) if RASTER_FILE.endswith(".zarr")
                         else xr.open_dataset(RASTER_FILE))
                  var = VARIABLE or list(ds.data_vars)[0]
                  print(f"Variable sélectionnée : {var}")
                  da  = ds[var]
                  df  = da.to_dataframe().reset_index().dropna(subset=[var])

              feat_cols = [c for c in df.columns if c not in
                           ["x", "y", "lat", "lon", "latitude", "longitude", "time", "spatial_ref"]]
              df = df[feat_cols].replace([np.inf, -np.inf], np.nan).dropna()

              X             = df.copy()
              y             = None
              task_type     = "clustering"
              feature_names = X.columns.tolist()
              target_name   = None
              meta = {"file": RASTER_FILE, "shape": df.shape, "bands": feat_cols}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)}")
              display(df.head(3))

      w_run.on_click(on_run)


