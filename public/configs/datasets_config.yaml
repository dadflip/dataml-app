    illustration_svg: '<svg viewBox="0 0 600 224" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto drop-shadow-xl rounded-xl"><rect width="600" height="224" fill="#0A0A0A" rx="12"/><!-- Grid pattern --><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.5"/></pattern><rect width="600" height="224" fill="url(#grid)" rx="12"/><!-- Inputs --><g transform="translate(20, 40)">    <rect y="0" width="140" height="28" fill="#1a1a1a" stroke="#333333" rx="6"/>    <text x="10" y="18" fill="#A0A0A0" font-family="monospace" font-size="11" alignment-baseline="middle">Config/Params</text>    <path d="M 140 14 C 180 14, 200 112, 230 112" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/></g><!-- Central Node --><rect x="230" y="72" width="140" height="80" fill="#1a1a1a" stroke="#444" rx="10" stroke-width="2"/><text x="300" y="102" fill="#EEEEEE" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Images (Dossier Lo</text><text x="300" y="122" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Dataset Loader</text><!-- Outputs --><g transform="translate(440, 40)">    <path d="M 370 112 C 400 112, 420 14, 440 14" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="0" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="18" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">X</text>    <path d="M 370 112 C 400 112, 420 50, 440 50" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="36" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="54" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 112 C 400 112, 420 86, 440 86" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 112 C 400 112, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import torch
      from torchvision import datasets, transforms
      from torch.utils.data import DataLoader, random_split
      import numpy as np

      # ── Structure attendue du dossier ─────────────────────────────────
      # data/
      #   ├── class_A/  *.jpg
      #   ├── class_B/  *.jpg
      #   └── class_C/  *.jpg

      DATA_DIR    = "data/images/"
      IMG_SIZE    = 224
      BATCH_SIZE  = 32
      VAL_RATIO   = 0.2
      NUM_WORKERS = 4

      train_transforms = transforms.Compose([
          transforms.Resize((IMG_SIZE, IMG_SIZE)),
          transforms.RandomHorizontalFlip(),
          transforms.RandomRotation(15),
          transforms.ColorJitter(brightness=0.2, contrast=0.2),
          transforms.ToTensor(),
          transforms.Normalize(mean=[0.485, 0.456, 0.406],
                               std=[0.229, 0.224, 0.225]),
      ])
      val_transforms = transforms.Compose([
          transforms.Resize((IMG_SIZE, IMG_SIZE)),
          transforms.ToTensor(),
          transforms.Normalize(mean=[0.485, 0.456, 0.406],
                               std=[0.229, 0.224, 0.225]),
      ])

      full_dataset = datasets.ImageFolder(DATA_DIR, transform=train_transforms)
      class_names  = full_dataset.classes
      print(f"Classes : {class_names} | Total images : {len(full_dataset)}")

      n_val   = int(len(full_dataset) * VAL_RATIO)
      n_train = len(full_dataset) - n_val
      train_dataset, val_dataset = random_split(full_dataset, [n_train, n_val])
      val_dataset.dataset.transform = val_transforms

      train_loader = DataLoader(train_dataset, batch_size=BATCH_SIZE,
                                shuffle=True, num_workers=NUM_WORKERS, pin_memory=True)
      val_loader   = DataLoader(val_dataset,   batch_size=BATCH_SIZE,
                                shuffle=False, num_workers=NUM_WORKERS, pin_memory=True)

      # Extraction numpy pour pipeline sklearn (petits datasets)
      X = np.concatenate([b[0].numpy() for b in train_loader], axis=0)
      y = np.concatenate([b[1].numpy() for b in train_loader], axis=0)
      X_flat = X.reshape(X.shape[0], -1)  # pour sklearn : (N, H*W*C)

      feature_names = ["pixels"]
      task_type     = "classification"
      meta = {"classes": class_names, "img_size": IMG_SIZE}


