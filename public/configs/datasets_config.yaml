synthetic_advanced:
# ──────────────────────────────────────────────────────────────────────────

  - id: synthetic_graph_data
    name: "Données de Graphe Synthétiques (Stochastic Block Model / Barabási-Albert)"
    enabled: true
    category: "Synthétique — Graphe"
    format: "NetworkX / numpy"
    description: >
      Génère des graphes synthétiques avec structure communautaire (SBM),
      scale-free (Barabási-Albert), small-world (Watts-Strogatz) ou
      aléatoire (Erdős-Rényi).
    code_template: |
      import networkx as nx
      import numpy as np
      import pandas as pd
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_model   = widgets.ToggleButtons(
          options=["SBM (Stochastic Block)", "BA (Barabási-Albert)",
                   "WS (Watts-Strogatz)", "ER (Erdős-Rényi)"],
          description="GRAPH_MODEL:", style={"description_width": "140px"})
      w_n_nodes = widgets.IntText(value=1000, description="N_NODES:",
                                  style={"description_width": "140px"})
      # SBM params
      w_n_comm  = widgets.IntSlider(value=4, min=2, max=20, step=1,
                                    description="N_COMMUNITIES:", style={"description_width": "140px"})
      w_p_intra = widgets.FloatSlider(value=0.3, min=0.0, max=1.0, step=0.01,
                                      description="P_INTRA:", style={"description_width": "140px"},
                                      readout_format=".2f")
      w_p_inter = widgets.FloatSlider(value=0.01, min=0.0, max=0.5, step=0.001,
                                      description="P_INTER:", style={"description_width": "140px"},
                                      readout_format=".3f")
      # BA params
      w_m_ba    = widgets.IntSlider(value=3, min=1, max=20, step=1,
                                    description="M_BA:", style={"description_width": "140px"})
      w_sbm_box = widgets.VBox([w_n_comm, w_p_intra, w_p_inter])
      w_ba_box  = widgets.VBox([w_m_ba])
      w_ba_box.layout.visibility = "hidden"
      w_run     = widgets.Button(description="▶ Générer", button_style="success",
                                 layout=widgets.Layout(width="150px"))
      out       = widgets.Output()

      def on_model_change(change):
          is_sbm = "SBM" in change["new"]
          is_ba  = "BA"  in change["new"]
          w_sbm_box.layout.visibility = "visible" if is_sbm else "hidden"
          w_ba_box.layout.visibility  = "visible" if is_ba  else "hidden"

      w_model.observe(on_model_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🔷 Graphe Synthétique — Paramètres</b>"),
          w_model, w_n_nodes, w_sbm_box, w_ba_box, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              MODEL   = w_model.value
              N_NODES = w_n_nodes.value

              if "SBM" in MODEL:
                  N_COMM  = w_n_comm.value
                  P_INTRA = w_p_intra.value
                  P_INTER = w_p_inter.value
                  sizes   = [N_NODES // N_COMM] * N_COMM
                  sizes[-1] += N_NODES - sum(sizes)
                  p_matrix = [[P_INTRA if i == j else P_INTER
                               for j in range(N_COMM)]
                              for i in range(N_COMM)]
                  G = nx.stochastic_block_model(sizes, p_matrix, seed=42)
                  labels_gt = np.array([G.nodes[n]["block"] for n in G.nodes()])
              elif "BA" in MODEL:
                  M_BA = w_m_ba.value
                  G = nx.barabasi_albert_graph(N_NODES, M_BA, seed=42)
                  labels_gt = None
              elif "WS" in MODEL:
                  k = max(4, N_NODES // 50)
                  G = nx.watts_strogatz_graph(N_NODES, k, 0.1, seed=42)
                  labels_gt = None
              else:
                  G = nx.erdos_renyi_graph(N_NODES, 0.05, seed=42)
                  labels_gt = None

              print(f"Graphe : {G.number_of_nodes()} noeuds, "
                    f"{G.number_of_edges()} arêtes | Densité : {nx.density(G):.4f}")

              pagerank    = nx.pagerank(G, alpha=0.85)
              betweenness = nx.betweenness_centrality(G, normalized=True)
              clustering  = nx.clustering(G)
              degree      = dict(G.degree())

              rows = [{
                  "node_id":          n,
                  "degree":           degree[n],
                  "pagerank":         pagerank[n],
                  "betweenness":      betweenness[n],
                  "clustering_coeff": clustering[n],
              } for n in G.nodes()]

              df = pd.DataFrame(rows).set_index("node_id")
              if labels_gt is not None:
                  df["community"] = labels_gt

              if labels_gt is not None:
                  y         = df.pop("community")
                  task_type = "node_classification"
              else:
                  y         = None
                  task_type = "graph"

              X             = df.copy()
              feature_names = X.columns.tolist()
              target_name   = "community" if labels_gt is not None else None
              meta = {
                  "model":    MODEL,
                  "n_nodes":  G.number_of_nodes(),
                  "n_edges":  G.number_of_edges(),
                  "density":  nx.density(G),
                  "graph_obj": G,
                  "shape":    df.shape,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | nodes={G.number_of_nodes()}")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: synthetic_time_series_advanced
    name: "Séries Temporelles Synthétiques (ARIMA / GBM / Navier-Stokes)"
    enabled: true
    category: "Synthétique — Timeseries"
    format: "numpy / pandas"
    description: >
      Génère des séries temporelles synthétiques réalistes avec différents
      processus stochastiques : ARIMA, GBM, Ornstein-Uhlenbeck, sinusoïdes + bruit.
    code_template: |
      import numpy as np
      import pandas as pd
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_model      = widgets.ToggleButtons(
          options=["GBM (Brownien géométrique)", "ARIMA", "OU (Ornstein-Uhlenbeck)",
                   "Régimes (Regime-Switch)", "Saisonnier + bruit"],
          description="TS_MODEL:", style={"description_width": "140px"})
      w_n_points   = widgets.IntText(value=1000, description="N_POINTS:",
                                     style={"description_width": "160px"})
      w_freq       = widgets.Dropdown(
          options=[("Journalière (D)", "D"), ("Hebdomadaire (W)", "W"),
                   ("Mensuelle (M)", "ME"), ("Horaire (H)", "h")],
          value="D", description="FREQ:", style={"description_width": "160px"})
      w_test_ratio = widgets.FloatSlider(value=0.2, min=0.05, max=0.5, step=0.05,
                                         description="TEST_RATIO:", style={"description_width": "160px"},
                                         readout_format=".0%")
      w_horizon    = widgets.IntText(value=30, description="HORIZON:",
                                     style={"description_width": "160px"})
      w_seed       = widgets.IntText(value=42, description="RANDOM_SEED:",
                                     style={"description_width": "160px"})
      # GBM params
      w_mu         = widgets.FloatText(value=0.0005, description="MU (drift):",
                                       style={"description_width": "160px"})
      w_sigma      = widgets.FloatText(value=0.02,   description="SIGMA (vol):",
                                       style={"description_width": "160px"})
      w_s0         = widgets.FloatText(value=100.0,  description="S0 (prix init):",
                                       style={"description_width": "160px"})
      w_gbm_box    = widgets.HBox([w_mu, w_sigma, w_s0])
      w_run        = widgets.Button(description="▶ Générer", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      def on_model_change(change):
          w_gbm_box.layout.visibility = "visible" if "GBM" in change["new"] else "hidden"

      w_model.observe(on_model_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>📉 Séries Temporelles Synthétiques — Paramètres</b>"),
          w_model, w_gbm_box,
          widgets.HBox([w_n_points, w_freq]),
          widgets.HBox([w_test_ratio, w_horizon, w_seed]),
          w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              MODEL      = w_model.value
              N_POINTS   = w_n_points.value
              FREQ       = w_freq.value
              TEST_RATIO = w_test_ratio.value
              HORIZON    = w_horizon.value
              SEED       = w_seed.value
              np.random.seed(SEED)

              dates = pd.date_range("2020-01-01", periods=N_POINTS, freq=FREQ)

              if "GBM" in MODEL:
                  mu, sigma, S0, dt = w_mu.value, w_sigma.value, w_s0.value, 1.0
                  log_r  = (mu - 0.5 * sigma**2) * dt + sigma * np.sqrt(dt) * np.random.randn(N_POINTS)
                  values = S0 * np.exp(np.cumsum(log_r))

              elif "ARIMA" in MODEL:
                  from statsmodels.tsa.arima_process import ArmaProcess
                  ar     = np.array([1, -0.75, 0.25])
                  ma     = np.array([1, 0.65])
                  values = ArmaProcess(ar, ma).generate_sample(nsample=N_POINTS, scale=1.0) + 100

              elif "OU" in MODEL:
                  theta, mu_ou, sigma_ou = 0.1, 50.0, 2.0
                  values = np.zeros(N_POINTS)
                  values[0] = mu_ou
                  for t in range(1, N_POINTS):
                      values[t] = (values[t-1]
                                   + theta * (mu_ou - values[t-1])
                                   + sigma_ou * np.random.randn())

              elif "Régimes" in MODEL:
                  values = np.zeros(N_POINTS)
                  regime = 0
                  for t in range(N_POINTS):
                      if np.random.rand() < 0.02:
                          regime = 1 - regime
                      values[t] = (100 + np.random.randn() * 2 if regime == 0
                                   else 120 + np.random.randn() * 5)

              else:
                  t_arr  = np.arange(N_POINTS)
                  values = (100 + 10 * np.sin(2 * np.pi * t_arr / 365)
                               + 5  * np.sin(2 * np.pi * t_arr / 7)
                               + np.random.randn(N_POINTS) * 2)

              series = pd.Series(values, index=dates, name="value")

              n_test       = int(N_POINTS * TEST_RATIO)
              y_train      = series.iloc[:-n_test]
              y_test       = series.iloc[-n_test:]
              dates_train  = y_train.index
              dates_future = pd.date_range(start=y_test.index[0],
                                           periods=HORIZON, freq=FREQ)

              X             = pd.DataFrame(index=series.index)
              y             = series
              df            = series.to_frame()
              feature_names = []
              target_name   = "value"
              task_type     = "timeseries"
              meta = {
                  "model":    MODEL,
                  "n_points": N_POINTS,
                  "freq":     FREQ,
                  "horizon":  HORIZON,
                  "shape":    df.shape,
                  "synthetic": True,
              }

              texts_train = []
              texts_test  = []
              durations   = None
              events      = None
              df_survival = None

              print(f"Série générée : {N_POINTS} points | Plage : {dates[0].date()} → {dates[-1].date()}")
              print(f"\n✅ task_type='{task_type}' | n_train={len(y_train)} | n_test={len(y_test)} | horizon={HORIZON}")
              display(series.tail(5).to_frame())

      w_run.on_click(on_run)


