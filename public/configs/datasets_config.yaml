      import numpy as np
      import pandas as pd
      from sklearn.datasets import make_classification, make_regression, make_blobs

      np.random.seed(42)
      N = 10000

      # ── Classification tabulaire réaliste ────────────────────────────
      X_num, y = make_classification(
          n_samples=N, n_features=15, n_informative=8,
          n_redundant=4, n_clusters_per_class=2, n_classes=3,
          weights=[0.6, 0.3, 0.1], flip_y=0.02, random_state=42
      )
      # Ajout de features catégorielles et manquantes
      df = pd.DataFrame(X_num, columns=[f"num_{i}" for i in range(15)])
      df["cat_A"] = np.random.choice(["low","medium","high"], size=N, p=[0.3,0.5,0.2])
      df["cat_B"] = np.random.choice(["X","Y","Z"], size=N)
      mask_nan = np.random.rand(N, 3) < 0.08
      for i, col in enumerate(["num_0","num_5","cat_A"]):
          df.loc[mask_nan[:, i], col] = np.nan
      df["target"] = y

      # ── Régression ───────────────────────────────────────────────────
