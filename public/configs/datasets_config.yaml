  - id: supabase
    name: "Supabase (PostgreSQL + API REST)"
    enabled: true
    category: "Cloud BaaS"
    format: "REST JSON / PostgREST / psycopg2"
    description: >
      Chargement depuis Supabase via le client Python officiel (PostgREST)
      ou via connexion directe PostgreSQL.
    use_cases:
      - "applications web/mobile avec backend Supabase"
      - "données utilisateur + transactions + events"
      - "prototypage rapide BaaS"
    pros:
      - "SDK Python officiel"
      - "accès direct PostgreSQL disponible"
      - "RLS configurable"
      - "gratuit tier généreux"
    cons:
      - "RLS peut masquer des données si mal configuré"
      - "latence réseau vs local"
    code_template: |
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_mode       = widgets.ToggleButtons(
          options=["Client Python (PostgREST)", "PostgreSQL direct (DSN)"],
          description="MODE:", style={"description_width": "130px"})
      w_url        = widgets.Text(value="https://xxxxxxxxxxxx.supabase.co",
                                  description="SUPABASE_URL:", style={"description_width": "170px"},
                                  layout=widgets.Layout(width="500px"))
      w_key        = widgets.Password(value="",
                                      description="SERVICE_KEY:", style={"description_width": "170px"},
                                      layout=widgets.Layout(width="450px"))
      w_dsn        = widgets.Text(value="postgresql://postgres:pwd@db.xxx.supabase.co:5432/postgres",
                                  description="PG_DSN:", style={"description_width": "170px"},
                                  layout=widgets.Layout(width="600px"))
      w_dsn.layout.visibility = "hidden"
      w_table      = widgets.Text(value="users",
                                  description="TABLE:", style={"description_width": "170px"})
      w_target     = widgets.Text(value="churn",
                                  description="TARGET_COL:", style={"description_width": "170px"},
                                  placeholder="Laisser vide = non supervisé")
      w_select     = widgets.Text(value="*",
                                  description="SELECT_COLS:", style={"description_width": "170px"})
      w_filters    = widgets.Text(value="{}",
                                  description="FILTERS (JSON):", style={"description_width": "170px"},
                                  layout=widgets.Layout(width="400px"),
                                  placeholder='ex: {"status": "active"}')
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      def on_mode_change(change):
          is_direct = change["new"] == "PostgreSQL direct (DSN)"
          w_url.layout.visibility = "hidden" if is_direct else "visible"
          w_key.layout.visibility = "hidden" if is_direct else "visible"
          w_dsn.layout.visibility = "visible" if is_direct else "hidden"

      w_mode.observe(on_mode_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>⚡ Supabase — Paramètres</b>"),
          w_mode, w_url, w_key, w_dsn, w_table, w_target, w_select, w_filters, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              import json as _json
              MODE       = w_mode.value
              SUPABASE_URL         = w_url.value.strip()
              SUPABASE_SERVICE_KEY = w_key.value.strip()
              PG_DSN               = w_dsn.value.strip() or None
              SUPABASE_TABLE       = w_table.value.strip()
              TARGET_COL           = w_target.value.strip() or None
              SELECT_COLS          = w_select.value.strip()
              FILTERS              = _json.loads(w_filters.value.strip() or "{}")

              if MODE == "Client Python (PostgREST)":
                  from supabase import create_client
                  client = create_client(SUPABASE_URL, SUPABASE_SERVICE_KEY)
                  query  = client.table(SUPABASE_TABLE).select(SELECT_COLS)
                  for col, val in FILTERS.items():
                      query = query.eq(col, val)
                  all_records = []
                  page_size   = 1000
                  offset      = 0
                  while True:
                      resp = query.range(offset, offset + page_size - 1).execute()
                      if not resp.data:
                          break
                      all_records.extend(resp.data)
                      if len(resp.data) < page_size:
                          break
                      offset += page_size
                      print(f"Chargés : {len(all_records)}")
                  df = pd.json_normalize(all_records)
              else:
                  from sqlalchemy import create_engine
                  engine = create_engine(PG_DSN)
                  _where = " AND ".join(f"{k}='{v}'" for k, v in FILTERS.items())
                  _query = (f"SELECT {SELECT_COLS} FROM {SUPABASE_TABLE}"
                            + (f" WHERE {_where}" if _where else ""))
                  with engine.connect() as conn:
                      df = pd.read_sql(_query, conn)

              print(f"Shape : {df.shape}")

              _id_cols = [c for c in ["id", "uuid", "created_at", "updated_at"] if c in df.columns]
              if TARGET_COL and TARGET_COL in df.columns:
                  X         = df.drop(columns=_id_cols + [TARGET_COL])
                  y         = df[TARGET_COL]
                  task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
              else:
                  X         = df.drop(columns=_id_cols)
                  y         = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {
                  "supabase_url": SUPABASE_URL,
                  "table":        SUPABASE_TABLE,
                  "n_records":    len(df),
                  "filters":      FILTERS,
                  "shape":        df.shape,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: aws_s3_athena
    name: "AWS S3 + Athena"
    enabled: true
    category: "Cloud Data Lake"
    format: "Parquet / CSV sur S3 + SQL Athena"
    description: >
      Requêtage de données stockées sur S3 via Athena (SQL serverless).
      Ou lecture directe de fichiers S3 via boto3 + pandas.
    use_cases:
      - "data lake AWS"
      - "logs CloudWatch, CloudTrail"
      - "données Kinesis Firehose archivées"
    pros:
      - "SQL sur fichiers S3 sans infrastructure"
      - "coût très bas (scan)"
      - "intégration AWS native"
    cons:
      - "latence 1-30s par requête"
      - "coût au scan (compresser en Parquet)"
    code_template: |
      import pandas as pd
      import numpy as np
      import boto3
      import io
      import time
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_mode      = widgets.ToggleButtons(
          options=["Lecture directe S3", "Requête Athena"],
          description="MODE:", style={"description_width": "130px"})
      w_region    = widgets.Dropdown(
          options=["eu-west-1", "eu-west-3", "us-east-1", "us-west-2",
                   "ap-southeast-1", "ap-northeast-1"],
          value="eu-west-1", description="AWS_REGION:", style={"description_width": "160px"})
      w_bucket    = widgets.Text(value="my-data-lake",
                                 description="S3_BUCKET:", style={"description_width": "160px"})
      w_key       = widgets.Text(value="datasets/processed/data.parquet",
                                 description="S3_KEY:", style={"description_width": "160px"},
                                 layout=widgets.Layout(width="500px"))
      w_db        = widgets.Text(value="my_glue_database",
                                 description="ATHENA_DATABASE:", style={"description_width": "160px"})
      w_output    = widgets.Text(value="s3://my-data-lake/athena-results/",
                                 description="ATHENA_S3_OUTPUT:", style={"description_width": "160px"},
                                 layout=widgets.Layout(width="500px"))
      w_db.layout.visibility     = "hidden"
      w_output.layout.visibility = "hidden"
      w_target    = widgets.Text(value="label",
                                 description="TARGET_COL:", style={"description_width": "160px"},
                                 placeholder="Laisser vide = non supervisé")
      w_query     = widgets.Textarea(
          value="SELECT *\nFROM my_table\nWHERE year = '2024' AND month = '12'\nLIMIT 500000",
          description="ATHENA_QUERY:", style={"description_width": "160px"},
          layout=widgets.Layout(width="700px", height="100px"))
      w_query.layout.visibility = "hidden"
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      def on_mode_change(change):
          is_athena = change["new"] == "Requête Athena"
          w_key.layout.visibility    = "hidden" if is_athena else "visible"
          w_db.layout.visibility     = "visible" if is_athena else "hidden"
          w_output.layout.visibility = "visible" if is_athena else "hidden"
          w_query.layout.visibility  = "visible" if is_athena else "hidden"

      w_mode.observe(on_mode_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>☁ AWS S3 + Athena — Paramètres</b>"),
          w_mode, w_region, w_bucket, w_key, w_db, w_output, w_target, w_query, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              MODE         = w_mode.value
              AWS_REGION   = w_region.value
              S3_BUCKET    = w_bucket.value.strip()
              S3_KEY       = w_key.value.strip()
              ATHENA_DB    = w_db.value.strip()
              ATHENA_OUT   = w_output.value.strip()
              TARGET_COL   = w_target.value.strip() or None
              ATHENA_QUERY = w_query.value.strip()

              session = boto3.Session(region_name=AWS_REGION)
              exec_id = None

              if MODE == "Lecture directe S3":
                  s3  = session.client("s3")
                  obj = s3.get_object(Bucket=S3_BUCKET, Key=S3_KEY)
                  buf = io.BytesIO(obj["Body"].read())
                  df  = (pd.read_parquet(buf) if S3_KEY.endswith(".parquet")
                         else pd.read_csv(buf))
              else:
                  athena   = session.client("athena", region_name=AWS_REGION)
                  response = athena.start_query_execution(
                      QueryString=ATHENA_QUERY,
                      QueryExecutionContext={"Database": ATHENA_DB},
                      ResultConfiguration={"OutputLocation": ATHENA_OUT},
                  )
                  exec_id = response["QueryExecutionId"]
                  for _ in range(60):
                      status = athena.get_query_execution(QueryExecutionId=exec_id)
                      state  = status["QueryExecution"]["Status"]["State"]
                      if state in ["SUCCEEDED", "FAILED", "CANCELLED"]:
                          break
                      time.sleep(2)
                  if state != "SUCCEEDED":
                      print(f"❌ Athena query {state}")
                      return
                  s3_path = (status["QueryExecution"]["ResultConfiguration"]
                             ["OutputLocation"].replace("s3://", ""))
                  bucket, key = s3_path.split("/", 1)
                  s3  = session.client("s3")
                  obj = s3.get_object(Bucket=bucket, Key=key)
                  df  = pd.read_csv(io.BytesIO(obj["Body"].read()))

              print(f"Shape : {df.shape}")

              if TARGET_COL and TARGET_COL in df.columns:
                  X         = df.drop(columns=[TARGET_COL])
                  y         = df[TARGET_COL]
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  X         = df.copy()
                  y         = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"bucket": S3_BUCKET, "shape": df.shape,
                      "athena_exec_id": exec_id}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

