    - id: kafka_stream
      contract: tabular
      name: "Kafka (Streaming → mini-batch tabulaire)"
      category: "Streaming"
      format: "Kafka Messages / JSON"
      description: "Consommation d'un flux Kafka en mini-batches et conversion en DataFrame."
      use_cases: ["détection fraude temps réel", "monitoring capteurs", "scoring faible latence"]
      pros: ["temps réel", "scalable", "durable"]
      cons: ["infrastructure lourde", "complexité opérationnelle"]
      code_template: |
        from kafka import KafkaConsumer
        import pandas as pd, numpy as np, json
        from collections import deque

        # ── Paramètres ──────────────────────────────────────────────────
        BOOTSTRAP_SERVERS = ["localhost:9092"]
        TOPIC       = "ml-events"; GROUP_ID = "ml-consumer-group"
        BATCH_SIZE  = 1000; TIMEOUT_MS = 1000; OFFSET_RESET = "latest"

        consumer = KafkaConsumer(TOPIC, bootstrap_servers=BOOTSTRAP_SERVERS,
                                 group_id=GROUP_ID, auto_offset_reset=OFFSET_RESET,
                                 enable_auto_commit=True,
                                 value_deserializer=lambda m: json.loads(m.decode("utf-8")),
                                 consumer_timeout_ms=TIMEOUT_MS)
        buffer = deque(maxlen=BATCH_SIZE); records = []
        try:
            for message in consumer:
                buffer.append(message.value)
                if len(buffer) >= BATCH_SIZE:
                    records.extend(list(buffer)); buffer.clear(); break
        finally:
            consumer.close()

        df = pd.json_normalize(records)
        X  = df.drop(columns=["event_id","timestamp"], errors="ignore")
        y  = None; task_type = "anomaly"
        feature_names = X.columns.tolist(); target_name = None
        meta = {"topic": TOPIC, "batch_size": BATCH_SIZE, "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | records={len(records)}")
        print(df.head(3))

