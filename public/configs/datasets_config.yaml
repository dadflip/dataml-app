    - id: timeseries_csv
      contract: tabular
      name: "Séries Temporelles (CSV Indexé)"
      category: "Séries Temporelles"
      format: "csv avec index datetime"
      description: "Chargement et split temporel d'une série temporelle pour modèles classiques."
