                                    description="CATALOG_URI:", style={"description_width": "180px"},
                                    layout=widgets.Layout(width="450px"))
      w_namespace    = widgets.Text(value="default",
                                    description="NAMESPACE:", style={"description_width": "180px"})
      w_table        = widgets.Text(value="my_table",
                                    description="TABLE:", style={"description_width": "180px"})
      w_snapshot     = widgets.Text(value="",
                                    description="SNAPSHOT_ID:", style={"description_width": "180px"},
                                    placeholder="Laisser vide = latest")
      w_target       = widgets.Text(value="label",
                                    description="TARGET_COL:", style={"description_width": "180px"},
                                    placeholder="Laisser vide = non supervisé")
      w_run          = widgets.Button(description="▶ Charger", button_style="success",
                                      layout=widgets.Layout(width="150px"))
      out            = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🧊 Apache Iceberg — Paramètres</b>"),
          w_catalog_type, w_catalog_uri, w_namespace, w_table,
          w_snapshot, w_target, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              CATALOG_TYPE = w_catalog_type.value
              CATALOG_URI  = w_catalog_uri.value.strip()
              NAMESPACE    = w_namespace.value.strip()
              TABLE        = w_table.value.strip()
              _snap_raw    = w_snapshot.value.strip()
              SNAPSHOT_ID  = int(_snap_raw) if _snap_raw.isdigit() else None
              TARGET_COL   = w_target.value.strip() or None

              catalog = load_catalog(CATALOG_TYPE, **{"uri": CATALOG_URI})
              table   = catalog.load_table(f"{NAMESPACE}.{TABLE}")
              print(f"Schema : {table.schema()}")
              print(f"Snapshots : {len(table.history())}")

              scan = table.scan()
              if SNAPSHOT_ID is not None:
                  scan = table.scan(snapshot_id=SNAPSHOT_ID)

              df = scan.to_arrow().to_pandas()
              print(f"Shape : {df.shape}")

              if TARGET_COL and TARGET_COL in df.columns:
                  X         = df.drop(columns=[TARGET_COL])
                  y         = df[TARGET_COL]
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  X         = df.copy()
                  y         = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"namespace": NAMESPACE, "table": TABLE,
                      "snapshot_id": SNAPSHOT_ID, "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)


