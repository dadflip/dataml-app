federated_and_privacy:
# ──────────────────────────────────────────────────────────────────────────

  - id: federated_flower
    name: "Apprentissage Fédéré (Flower / Flwr)"
    enabled: true
    category: "Federated Learning"
    format: "Partitions distribuées NumPy"
    description: >
      Simule un apprentissage fédéré local avec Flower (flwr) :
      partitionnement des données entre N clients simulés, entraînement
      local, agrégation FedAvg.
    use_cases:
      - "données sensibles non centralisables (médical, banque)"
      - "simulation de scénarios fédérés"
      - "recherche privacy-preserving ML"
    code_template: |
      import numpy as np
      import pandas as pd
      from sklearn.datasets import make_classification
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import accuracy_score
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_n_clients  = widgets.IntSlider(value=5, min=2, max=20, step=1,
                                       description="NUM_CLIENTS:", style={"description_width": "160px"})
      w_n_rounds   = widgets.IntSlider(value=3, min=1, max=20, step=1,
                                       description="NUM_ROUNDS:", style={"description_width": "160px"})
      w_alpha      = widgets.FloatSlider(value=0.5, min=0.01, max=5.0, step=0.05,
                                         description="ALPHA_DIR:", style={"description_width": "160px"},
                                         readout_format=".2f")
      w_n_samples  = widgets.IntText(value=5000, description="N_SAMPLES:",
                                     style={"description_width": "160px"})
      w_n_features = widgets.IntText(value=20, description="N_FEATURES:",
                                     style={"description_width": "160px"})
      w_seed       = widgets.IntText(value=42, description="RANDOM_SEED:",
                                     style={"description_width": "160px"})
      w_client_id  = widgets.IntText(value=0, description="CLIENT_ID (export):",
                                     style={"description_width": "160px"})
      w_run        = widgets.Button(description="▶ Simuler FedAvg", button_style="success",
                                    layout=widgets.Layout(width="180px"))
      out          = widgets.Output()

      alpha_info = widgets.HTML(
          "<i>ALPHA_DIR : faible = forte hétérogénéité entre clients (Dirichlet)</i>")

      box = widgets.VBox([
          widgets.HTML("<b>🌐 Apprentissage Fédéré FedAvg — Paramètres</b>"),
          widgets.HBox([w_n_clients, w_n_rounds]),
          w_alpha, alpha_info,
          widgets.HBox([w_n_samples, w_n_features, w_seed]),
          w_client_id, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              NUM_CLIENTS = w_n_clients.value
              NUM_ROUNDS  = w_n_rounds.value
              ALPHA_DIR   = w_alpha.value
              N_SAMPLES   = w_n_samples.value
              N_FEATURES  = w_n_features.value
              SEED        = w_seed.value
              CLIENT_ID   = min(w_client_id.value, NUM_CLIENTS - 1)
              TARGET_COL  = "target"
              np.random.seed(SEED)

              X_all, y_all = make_classification(
                  n_samples=N_SAMPLES, n_features=N_FEATURES,
                  n_informative=N_FEATURES // 2, random_state=SEED)

              n_classes  = len(np.unique(y_all))
              client_data = [[] for _ in range(NUM_CLIENTS)]
              for c in range(n_classes):
                  idx_c       = np.where(y_all == c)[0]
                  np.random.shuffle(idx_c)
                  proportions = np.random.dirichlet([ALPHA_DIR] * NUM_CLIENTS)
                  splits      = (proportions * len(idx_c)).astype(int)
                  splits[-1] += len(idx_c) - splits.sum()
                  cum = 0
                  for k, s in enumerate(splits):
                      client_data[k].append(idx_c[cum:cum + s])
                      cum += s

              clients = []
              for k in range(NUM_CLIENTS):
                  idx_k = np.concatenate(client_data[k])
                  X_k, y_k = X_all[idx_k], y_all[idx_k]
                  X_tr, X_te, y_tr, y_te = train_test_split(
                      X_k, y_k, test_size=0.2, random_state=SEED)
                  clients.append({"X_train": X_tr, "X_test": X_te,
                                  "y_train": y_tr, "y_test": y_te})
                  print(f"Client {k} : train={len(X_tr)}, classes={np.bincount(y_tr)}")

              global_coef      = None
              global_intercept = None

              for rnd in range(NUM_ROUNDS):
                  local_coefs = []
                  local_ints  = []
                  for k, client in enumerate(clients):
                      clf = LogisticRegression(max_iter=200, random_state=SEED, warm_start=True)
                      if global_coef is not None:
                          clf.coef_      = global_coef.copy()
                          clf.intercept_ = global_intercept.copy()
                          clf.classes_   = np.unique(client["y_train"])
                      clf.fit(client["X_train"], client["y_train"])
                      local_coefs.append(clf.coef_)
                      local_ints.append(clf.intercept_)

                  weights          = [len(c["X_train"]) for c in clients]
                  total_w          = sum(weights)
                  global_coef      = sum(w * c / total_w for w, c in zip(weights, local_coefs))
                  global_intercept = sum(w * i / total_w for w, i in zip(weights, local_ints))
                  print(f"Round {rnd+1}/{NUM_ROUNDS} — FedAvg agrégé")

              df = pd.DataFrame(clients[CLIENT_ID]["X_train"],
                                columns=[f"feat_{i}" for i in range(X_all.shape[1])])
              df[TARGET_COL] = clients[CLIENT_ID]["y_train"]

              X             = df.drop(columns=[TARGET_COL])
              y             = df[TARGET_COL]
              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              task_type     = "classification"
              meta = {
                  "num_clients":      NUM_CLIENTS,
                  "num_rounds":       NUM_ROUNDS,
                  "alpha_dir":        ALPHA_DIR,
                  "global_coef":      global_coef,
                  "global_intercept": global_intercept,
                  "clients":          clients,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | client_id={CLIENT_ID}")
              display(df.head(3))

      w_run.on_click(on_run)


