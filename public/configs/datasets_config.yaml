    - id: synthetic_tabular
      contract: tabular
      name: "Données Synthétiques Tabulaires"
      category: "Synthétique"
      format: "numpy / DataFrame"
      description: "Génération de datasets synthétiques réalistes avec sklearn."
      use_cases: ["test de pipelines", "augmentation données", "données sensibles (privacy)", "démo"]
      pros: ["contrôle total", "privacy-safe", "reproductible"]
      cons: ["distribution artificielle", "ne remplace pas les vraies données"]
      code_template: |
        import numpy as np, pandas as pd
        from sklearn.datasets import make_classification, make_regression, make_blobs

        # ── Paramètres ──────────────────────────────────────────────────
        MODE    = "Classification"   # "Classification","Régression","Clustering (blobs)"
        N       = 10000; N_FEAT = 15; N_INF = 8; N_CLS = 3
        NOISE   = 0.02;  SEED   = 42
        ADD_CAT = True; ADD_NAN = True

        np.random.seed(SEED); N_INF = min(N_INF, N_FEAT)
        if MODE == "Classification":
            X_num, y_arr = make_classification(
                n_samples=N, n_features=N_FEAT, n_informative=N_INF,
                n_redundant=max(0,N_FEAT-N_INF-2), n_classes=N_CLS,
                flip_y=NOISE, random_state=SEED)
            task_type = "classification"
        elif MODE == "Régression":
            X_num, y_arr = make_regression(
                n_samples=N, n_features=N_FEAT, n_informative=N_INF,
                noise=NOISE*100, random_state=SEED)
            task_type = "regression"
        else:
            X_num, y_arr = make_blobs(
                n_samples=N, n_features=N_FEAT, centers=N_CLS, random_state=SEED)
            task_type = "clustering"

        df = pd.DataFrame(X_num, columns=[f"num_{i}" for i in range(N_FEAT)])
        if ADD_CAT:
            df["cat_A"] = np.random.choice(["low","medium","high"], N, p=[0.3,0.5,0.2])
            df["cat_B"] = np.random.choice(["X","Y","Z"], N)
        if ADD_NAN:
            for col in [c for c in ["num_0","num_5","cat_A"] if c in df.columns]:
                df.loc[np.random.rand(N)<0.08, col] = np.nan
        df["target"] = y_arr

        X = df.drop(columns=["target"]); y = df["target"]
        feature_names = X.columns.tolist(); target_name = "target"
        meta = {"n_samples": N, "synthetic": True, "shape": df.shape, "mode": MODE}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: synthetic_timeseries
      contract: tabular
      name: "Séries Temporelles Synthétiques (GBM / ARIMA / OU / Régimes / Saisonnier)"
      category: "Synthétique — Timeseries"
      format: "numpy / pandas"
      description: "Génération de TS réalistes via processus stochastiques."
      use_cases: ["test pipelines TS", "démo prévision", "benchmark modèles TS"]
      # GBM   : S_t = S_{t-1}·exp((μ-σ²/2)dt + σ√dt·Z_t)
      # ARMA  : X_t = Σφ_i·X_{t-i} + ε_t + Σθ_j·ε_{t-j}
      # OU    : X_t = X_{t-1} + θ(μ-X_{t-1}) + σZ_t
      # Régimes : chaîne de Markov 2 états p=0.02
      code_template: |
        import numpy as np, pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        MODEL      = "GBM (Brownien géométrique)"
        # "GBM","ARIMA","OU (Ornstein-Uhlenbeck)","Régimes","Saisonnier + bruit"
        N_POINTS   = 1000; FREQ = "D"; TEST_RATIO = 0.2; HORIZON = 30; SEED = 42
        MU = 0.0005; SIGMA = 0.02; S0 = 100.0

        np.random.seed(SEED)
        dates = pd.date_range("2020-01-01", periods=N_POINTS, freq=FREQ)

        if "GBM" in MODEL:
            log_r  = (MU-0.5*SIGMA**2) + SIGMA*np.random.randn(N_POINTS)
            values = S0*np.exp(np.cumsum(log_r))
        elif "ARIMA" in MODEL:
            from statsmodels.tsa.arima_process import ArmaProcess
            values = ArmaProcess(np.array([1,-0.75,0.25]),np.array([1,0.65])).generate_sample(N_POINTS)+100
        elif "OU" in MODEL:
            theta,mu_ou,sigma_ou = 0.1,50.0,2.0
            values = np.zeros(N_POINTS); values[0] = mu_ou
            for t in range(1,N_POINTS):
                values[t] = values[t-1]+theta*(mu_ou-values[t-1])+sigma_ou*np.random.randn()
        elif "Régimes" in MODEL:
            values = np.zeros(N_POINTS); regime = 0
            for t in range(N_POINTS):
                if np.random.rand()<0.02: regime=1-regime
                values[t] = 100+np.random.randn()*2 if regime==0 else 120+np.random.randn()*5
        else:
            t_arr  = np.arange(N_POINTS)
            values = 100+10*np.sin(2*np.pi*t_arr/365)+5*np.sin(2*np.pi*t_arr/7)+np.random.randn(N_POINTS)*2

        series = pd.Series(values, index=dates, name="value")
        n_test = int(N_POINTS*TEST_RATIO)
        y_train = series.iloc[:-n_test]; y_test = series.iloc[-n_test:]
        dates_train  = y_train.index
        dates_future = pd.date_range(start=y_test.index[0], periods=HORIZON, freq=FREQ)
        X = pd.DataFrame(index=series.index); y = series; df = series.to_frame()
        feature_names = []; target_name = "value"; task_type = "timeseries"
        meta = {"model": MODEL, "n_points": N_POINTS, "freq": FREQ,
                "horizon": HORIZON, "synthetic": True, "shape": df.shape}

        contract    = "tabular"
        texts_train = []; texts_test = []
        durations   = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | target='{target_name}'")
        print(f"          shape={df.shape} | n_train={len(y_train)} | n_test={len(y_test)} | horizon={HORIZON}")
        print(series.tail(5).to_frame())

    - id: synthetic_graph
      contract: tabular
      name: "Graphes Synthétiques (SBM / BA / WS / ER) → features tabulaires"
      category: "Synthétique — Graphe"
      format: "NetworkX / numpy"
      description: "Génère des graphes synthétiques et extrait des features par noeud."
      # SBM : P(u-v) = p_intra si même bloc, p_inter sinon
      # BA  : P(i) ∝ deg(i) — loi de puissance P(k)~k^{-3}
      # WS  : anneau k-voisins + rewiring p → small-world
      # ER  : chaque arête avec prob p indépendamment
      code_template: |
        import networkx as nx, numpy as np, pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        MODEL   = "SBM (Stochastic Block)"
        N_NODES = 1000; N_COMM = 4; P_INTRA = 0.3; P_INTER = 0.01; M_BA = 3

        if "SBM" in MODEL:
            sizes = [N_NODES//N_COMM]*N_COMM; sizes[-1] += N_NODES-sum(sizes)
            p_mat = [[P_INTRA if i==j else P_INTER for j in range(N_COMM)] for i in range(N_COMM)]
            G = nx.stochastic_block_model(sizes, p_mat, seed=42)
            labels_gt = np.array([G.nodes[n]["block"] for n in G.nodes()])
        elif "BA" in MODEL:
            G = nx.barabasi_albert_graph(N_NODES, M_BA, seed=42); labels_gt = None
        elif "WS" in MODEL:
            G = nx.watts_strogatz_graph(N_NODES, max(4,N_NODES//50), 0.1, seed=42); labels_gt = None
        else:
            G = nx.erdos_renyi_graph(N_NODES, 0.05, seed=42); labels_gt = None

        print(f"Graphe : {G.number_of_nodes()} noeuds | Densité : {nx.density(G):.4f}")
        rows = [{"node_id": n, "degree": dict(G.degree())[n],
                 "pagerank": nx.pagerank(G,alpha=0.85)[n],
                 "betweenness": nx.betweenness_centrality(G,normalized=True)[n],
                 "clustering_coeff": nx.clustering(G)[n]} for n in G.nodes()]
        df = pd.DataFrame(rows).set_index("node_id")
        if labels_gt is not None: df["community"] = labels_gt

        if labels_gt is not None:
            y = df.pop("community"); task_type = "node_classification"
        else:
            y = None; task_type = "graph"

        X = df.copy(); feature_names = X.columns.tolist()
        target_name = "community" if labels_gt is not None else None
        meta = {"model": MODEL, "n_nodes": G.number_of_nodes(),
                "n_edges": G.number_of_edges(), "density": nx.density(G), "graph_obj": G}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: survival_dataset
