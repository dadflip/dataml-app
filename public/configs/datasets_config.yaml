roke-dasharray="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y_test</text>    <path d="M 370 112 C 400 112, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import yfinance as yf
      import pandas as pd
      import numpy as np

      TICKER     = "AAPL"       # ou ["AAPL","MSFT","GOOG"] pour multi
      START_DATE = "2020-01-01"
      END_DATE   = "2024-12-31"
      INTERVAL   = "1d"         # "1m","5m","1h","1d","1wk","1mo"
      TARGET     = "Close"

      ticker = yf.Ticker(TICKER)
      df = ticker.history(start=START_DATE, end=END_DATE, interval=INTERVAL)

      # Multi-tickers
      # df = yf.download(["AAPL", "MSFT"], start=START_DATE, end=END_DATE)

      # Features techniques de base
      df["returns"]     = df["Close"].pct_change()
      df["log_returns"] = np.log(df["Close"] / df["Close"].shift(1))
      df["MA_20"]       = df["Close"].rolling(20).mean()
      df["MA_50"]       = df["Close"].rolling(50).mean()
      df["volatility"]  = df["returns"].rolling(20).std()
      df["RSI"]         = 100 - (100 / (1 + df["returns"].clip(lower=0).rolling(14).mean()
                                          / (-df["returns"].clip(upper=0)).rolling(14).mean()))
      df = df.dropna()

      n_test  = int(len(df) * 0.2)
      y_train = df[TARGET].iloc[:-n_test]
      y_test  = df[TARGET].iloc[-n_test:]

      task_type   = "timeseries"
      feature_names = ["Open","High","Low","Close","Volume","MA_20","MA_50","volatility","RSI"]
      X = df[feature_names]
      meta = {"ticker": TICKER, "interval": INTERVAL}


