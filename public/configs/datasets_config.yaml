    code_template: |
      from sklearn import datasets
      import pandas as pd
      import numpy as np

      # ── Choisir le dataset ───────────────────────────────────────────
      # Classification :
      #   load_iris()         — 150 obs, 4 features, 3 classes
      #   load_breast_cancer()— 569 obs, 30 features, 2 classes
      #   load_wine()         — 178 obs, 13 features, 3 classes
      #   load_digits()       — 1797 obs, 64 features (images 8x8)
      # Régression :
      #   load_diabetes()     — 442 obs, 10 features
      #   load_california_housing() — 20640 obs, 8 features
      # Clustering :
      #   make_blobs(), make_moons(), make_circles()

      bunch = datasets.load_breast_cancer(as_frame=True)

      df           = bunch.frame
      X            = bunch.data
      y            = bunch.target
      feature_names = bunch.feature_names.tolist()
      target_name  = "target"
      task_type    = "classification"  # ou "regression"

      # Datasets synthétiques
      X_cls, y_cls = datasets.make_classification(
          n_samples=10000, n_features=20, n_informative=10,
          n_redundant=5, n_classes=3, random_state=42
      )
      X_reg, y_reg = datasets.make_regression(
          n_samples=10000, n_features=20, noise=0.1, random_state=42
      )
      X_blob, y_blob = datasets.make_blobs(
          n_samples=5000, n_features=10, centers=5, random_state=42
      )

      print(f"Classification  — X: {X_cls.shape} | classes: {np.unique(y_cls)}")
      print(f"Régression      — X: {X_reg.shape}")
      print(f"Clustering      — X: {X_blob.shape} | clusters: {np.unique(y_blob)}")

      meta = {"source": "sklearn.datasets", "dataset": "breast_cancer"}

