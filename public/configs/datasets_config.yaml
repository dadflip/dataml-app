    - id: synthetic_images
      contract: vision
      name: "Images Synthétiques (formes géométriques / bruit / fractales)"
      category: "Vision — Synthétique"
      format: "numpy (N,H,W,C)"
      description: >
        Génère des datasets images synthétiques pour tester des pipelines
        vision sans téléchargement : cercles, carrés, croix, bruits colorés.
      use_cases:
        - "test de pipelines CNN sans données réelles"
        - "démo de transfer learning"
        - "vérification du contrat VISION"
      code_template: |
        import numpy as np
        from PIL import Image, ImageDraw

        # ── Paramètres ──────────────────────────────────────────────────
        N_PER_CLASS = 500
        CLASSES     = ["circle","square","cross","noise"]
        IMG_SIZE    = 64
        NORMALIZE   = True
        TEST_RATIO  = 0.2; SEED = 42
        BATCH_SIZE  = 32; NUM_WORKERS = 2

        _MEAN = np.array([0.485,0.456,0.406],dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225],dtype=np.float32)
        rng   = np.random.default_rng(SEED)

        def make_sample(cls_name, size):
            img = Image.new("RGB",(size,size),(255,255,255))
            draw = ImageDraw.Draw(img)
            c = rng.integers(50,200,3).tolist()
            m = size//2; r = size//4
            if cls_name == "circle":
                draw.ellipse([m-r,m-r,m+r,m+r], fill=tuple(c))
            elif cls_name == "square":
                draw.rectangle([m-r,m-r,m+r,m+r], fill=tuple(c))
            elif cls_name == "cross":
                draw.rectangle([m-r,m-4,m+r,m+4], fill=tuple(c))
                draw.rectangle([m-4,m-r,m+4,m+r], fill=tuple(c))
            else:
                return np.random.randint(0,255,(size,size,3),dtype=np.uint8)
            return np.array(img, dtype=np.uint8)

        all_imgs=[]; all_lbls=[]
        for cls_idx, cls_name in enumerate(CLASSES):
            for _ in range(N_PER_CLASS):
                arr = make_sample(cls_name, IMG_SIZE).astype(np.float32)/255.0
                all_imgs.append(arr); all_lbls.append(cls_idx)

        all_imgs = np.array(all_imgs,dtype=np.float32)
        all_lbls = np.array(all_lbls,dtype=np.int64)
        perm     = rng.permutation(len(all_imgs))
        n_test   = int(len(all_imgs)*TEST_RATIO)
        images_train = all_imgs[perm[n_test:]]
        images_test  = all_imgs[perm[:n_test]]
        labels_train = all_lbls[perm[n_test:]]
        labels_test  = all_lbls[perm[:n_test]]
        if NORMALIZE:
            images_train = (images_train-_MEAN)/_STD
            images_test  = (images_test -_MEAN)/_STD

        n_classes   = len(CLASSES); class_names = CLASSES
        img_shape   = (IMG_SIZE, IMG_SIZE, 3)
        split_indices = {"train":perm[n_test:],"val":np.array([]),"test":perm[:n_test]}
        transforms  = {"train":None,"test":None}
        task_type   = "image_classification"; target_name = "label"
        meta = {"classes": CLASSES, "n_per_class": N_PER_CLASS,
                "img_shape": img_shape, "synthetic": True, "shape": all_imgs.shape}

        dl_train=None; dl_test=None
        try:
            import torch
            from torch.utils.data import TensorDataset, DataLoader
            def _dl(im,lb,sh): return DataLoader(
                TensorDataset(torch.from_numpy(im).permute(0,3,1,2),torch.from_numpy(lb).long()),
                batch_size=BATCH_SIZE,shuffle=sh,num_workers=NUM_WORKERS)
            dl_train=_dl(images_train,labels_train,True); dl_test=_dl(images_test,labels_test,False)
        except ImportError: pass

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | test={len(images_test)}")
        print(f"         classes={class_names}")

