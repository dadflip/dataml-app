geospatial:
# ──────────────────────────────────────────────────────────────────────────

  - id: geospatial_vector
    name: "Données Géospatiales Vectorielles (GeoJSON / Shapefile / GeoParquet)"
    enabled: true
    category: "Géospatial"
    format: "GeoJSON · Shapefile · GeoPackage · GeoParquet · WFS"
    description: >
      Chargement de données géospatiales vectorielles via GeoPandas.
      Extraction de features géométriques (aire, périmètre, centroïde,
      distance à un point de référence) pour pipeline ML tabulaire.
      Compatible avec tout format OGR (Shapefile, GeoPackage, FlatGeobuf…).
    use_cases:
      - "prédiction de prix immobiliers (géolocalisation)"
      - "classification de parcelles agricoles (polygones)"
      - "détection d'anomalies géographiques"
      - "clustering spatial"
    pros:
      - "geopandas = pandas pour la géométrie"
      - "tous formats OGR supportés"
      - "projections et reprojections simples"
    cons:
      - "géométries complexes → features non triviales"
      - "CRS à harmoniser entre sources"
    input_parameters:
      GEO_FILE:     "str — GeoJSON, Shapefile (.shp), .gpkg, .parquet, WFS URL"
      TARGET_COL:   "str | None — colonne cible (attribut)"
      CRS_TARGET:   "str — projection cible EPSG (défaut: 'EPSG:4326')"
      REF_POINT:    "tuple[float,float] | None — (lon, lat) point de référence"
      LAYER:        "str | None — couche (GeoPackage multi-layer)"
    code_template: |
      import geopandas as gpd
      import pandas as pd
      import numpy as np
      from shapely.geometry import Point

      # ── Paramètres ────────────────────────────────────────────────────
      GEO_FILE   = "data/parcels.geojson"   # .shp, .gpkg, .parquet, WFS URL
      TARGET_COL = "land_use"               # None si clustering
      CRS_TARGET = "EPSG:4326"
      REF_POINT  = (2.3522, 48.8566)        # Paris (lon, lat) ou None
      LAYER      = None

      # ── Chargement ────────────────────────────────────────────────────
      kwargs = {"layer": LAYER} if LAYER else {}
      if GEO_FILE.endswith(".parquet"):
          gdf = gpd.read_parquet(GEO_FILE)
      else:
          gdf = gpd.read_file(GEO_FILE, **kwargs)

      print(f"Shape : {gdf.shape} | CRS : {gdf.crs}")

      # ── Reprojection ──────────────────────────────────────────────────
      if gdf.crs and str(gdf.crs) != CRS_TARGET:
          gdf = gdf.to_crs(CRS_TARGET)

      # ── Extraction features géométriques ──────────────────────────────
      gdf_proj = gdf.to_crs("EPSG:3857")   # Web Mercator pour distances métriques
      gdf["area_m2"]       = gdf_proj.geometry.area
      gdf["perimeter_m"]   = gdf_proj.geometry.length
      gdf["compactness"]   = (4 * np.pi * gdf["area_m2"]
                              / (gdf["perimeter_m"] ** 2 + 1e-8))
      gdf["centroid_lon"]  = gdf.geometry.centroid.x
      gdf["centroid_lat"]  = gdf.geometry.centroid.y
      gdf["is_valid"]      = gdf.geometry.is_valid.astype(int)
      gdf["geom_type"]     = gdf.geometry.geom_type.astype("category").cat.codes

      if REF_POINT:
          ref  = gpd.GeoSeries([Point(REF_POINT)], crs="EPSG:4326").to_crs("EPSG:3857").iloc[0]
          gdf["dist_ref_m"] = gdf_proj.geometry.centroid.distance(ref)

      # ── Nettoyage ────────────────────────────────────────────────────
      df = pd.DataFrame(gdf.drop(columns=["geometry"]))
      df = df.select_dtypes(exclude=["object"]) if TARGET_COL not in df.columns \
           else df

      # ── Variables standards ───────────────────────────────────────────
      GEO_FEAT = ["area_m2", "perimeter_m", "compactness",
                  "centroid_lon", "centroid_lat", "is_valid",
                  "geom_type"] + (["dist_ref_m"] if REF_POINT else [])

      if TARGET_COL and TARGET_COL in df.columns:
          X         = df[GEO_FEAT]
          y         = df[TARGET_COL]
          task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
      else:
          X         = df[GEO_FEAT]
          y         = None
          task_type = "geospatial"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {
          "crs"       : str(gdf.crs),
          "geom_types": gdf.geometry.geom_type.value_counts().to_dict(),
          "bbox"      : list(gdf.total_bounds),
          "shape"     : gdf.shape,
          "gdf"       : gdf,       # GeoDataFrame complet pour visualisation
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: geospatial_raster
    name: "Données Géospatiales Raster (GeoTIFF / NetCDF / Zarr)"
    enabled: true
    category: "Géospatial"
    format: "GeoTIFF · NetCDF · Zarr · HDF5"
    description: >
      Chargement de données raster (images satellite, MNT, météo, données
      climatiques) via rasterio / xarray. Extraction de features statistiques
      par bande ou par fenêtre spatiale pour pipeline ML tabulaire.
    use_cases:
      - "classification de couverture du sol (satellite)"
      - "prévision météo (ERA5, CMIP6)"
      - "détection de changement (avant/après)"
      - "NDVI, indices spectraux"
    input_parameters:
      RASTER_FILE:   "str — GeoTIFF, .nc (NetCDF), .zarr, .h5"
      BAND_NAMES:    "list[str] | None — noms des bandes (défaut: Band_1, Band_2…)"
      VARIABLE:      "str | None — variable xarray (NetCDF/Zarr)"
      WINDOW:        "tuple | None — (row_off, col_off, width, height)"
      TARGET_COL:    "str | None — via shapefile joints (None = clustering)"
    code_template: |
      import numpy as np
      import pandas as pd

      # ── Paramètres ────────────────────────────────────────────────────
      RASTER_FILE = "data/satellite.tif"   # ou .nc / .zarr
      BAND_NAMES  = ["red", "green", "blue", "nir"]   # None = auto
      VARIABLE    = None    # pour NetCDF/Zarr : ex "temperature"
      TARGET_COL  = None

      # ── Option A : GeoTIFF via rasterio ──────────────────────────────
      if RASTER_FILE.endswith((".tif", ".tiff")):
          import rasterio
          from rasterio.windows import Window

          with rasterio.open(RASTER_FILE) as src:
              print(f"Bandes : {src.count} | CRS : {src.crs} | Shape : {src.shape}")
              data    = src.read()  # (bands, height, width)
              profile = src.profile

          n_bands   = data.shape[0]
          _names    = BAND_NAMES[:n_bands] if BAND_NAMES else [f"band_{i+1}" for i in range(n_bands)]
          n_pixels  = data.shape[1] * data.shape[2]

          # Reshape → tableau (n_pixels, n_bands)
          X_arr = data.reshape(n_bands, -1).T
          df    = pd.DataFrame(X_arr, columns=_names)

          # Features dérivées (NDVI si bandes red/nir disponibles)
          if "red" in df.columns and "nir" in df.columns:
              df["ndvi"] = ((df["nir"] - df["red"]) /
                            (df["nir"] + df["red"] + 1e-8))

      # ── Option B : NetCDF / Zarr via xarray ──────────────────────────
      else:
          import xarray as xr
          ds = (xr.open_zarr(RASTER_FILE)  if RASTER_FILE.endswith(".zarr")
                else xr.open_dataset(RASTER_FILE))
          print(ds)
          var = VARIABLE or list(ds.data_vars)[0]
          da  = ds[var]
          df  = da.to_dataframe().reset_index().dropna(subset=[var])
          _names = [var]

      # ── Statistiques par bande ────────────────────────────────────────
      feat_cols = [c for c in df.columns if c not in ["x", "y", "lat", "lon",
                                                        "latitude", "longitude",
                                                        "time", "spatial_ref"]]
      df = df[feat_cols].replace([np.inf, -np.inf], np.nan).dropna()

      # ── Variables standards ───────────────────────────────────────────
      X             = df.copy()
      y             = None
      task_type     = "clustering"
      feature_names = X.columns.tolist()
      target_name   = None
      meta = {"file": RASTER_FILE, "shape": df.shape, "bands": feat_cols}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


