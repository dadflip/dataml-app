text_and_nlp_sources:
# ──────────────────────────────────────────────────────────────────────────

  - id: text_files
    name: "Corpus Texte (fichiers / dossier)"
    enabled: true
    category: "NLP"
    format: "txt / csv / jsonl"
    description: "Chargement d'un corpus texte depuis des fichiers ou un CSV."
    use_cases: ["analyse de sentiment", "classification de documents", "embedding", "LLM fine-tuning"]
    pros: ["flexible", "format universel"]
    cons: ["prétraitement nécessaire"]
    code_template: |
      import pandas as pd
      import numpy as np
      import re
      import os
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_source    = widgets.ToggleButtons(options=["CSV", "Dossier structuré"],
                                          description="SOURCE:", style={"description_width": "130px"})
      w_file      = widgets.Text(value="data/texts.csv",
                                 description="FILE_PATH:", style={"description_width": "130px"},
                                 layout=widgets.Layout(width="500px"))
      w_text_col  = widgets.Text(value="text",
                                 description="TEXT_COL:", style={"description_width": "130px"})
      w_label_col = widgets.Text(value="label",
                                 description="LABEL_COL:", style={"description_width": "130px"},
                                 placeholder="Laisser vide = non supervisé")
      w_min_len   = widgets.IntText(value=20, description="MIN_LENGTH:",
                                    style={"description_width": "130px"})
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      def on_source_change(change):
          w_file.description = "FILE_PATH:" if change["new"] == "CSV" else "CORPUS_DIR:"
          w_file.placeholder = "" if change["new"] == "CSV" else "data/corpus/ — sous-dossiers = classes"

      w_source.observe(on_source_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>📝 Corpus Texte — Paramètres</b>"),
          w_source, w_file, w_text_col, w_label_col, w_min_len, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              SOURCE    = w_source.value
              FILE_PATH = w_file.value.strip()
              TEXT_COL  = w_text_col.value.strip()
              LABEL_COL = w_label_col.value.strip() or None
              MIN_LENGTH = w_min_len.value

              if SOURCE == "CSV":
                  df = pd.read_csv(FILE_PATH)
              else:
                  records = []
                  for label in os.listdir(FILE_PATH):
                      label_dir = os.path.join(FILE_PATH, label)
                      if not os.path.isdir(label_dir):
                          continue
                      for fname in os.listdir(label_dir):
                          fpath = os.path.join(label_dir, fname)
                          try:
                              with open(fpath, encoding="utf-8") as f:
                                  records.append({TEXT_COL: f.read(), "label": label})
                          except Exception:
                              pass
                  df = pd.DataFrame(records)
                  if LABEL_COL is None:
                      LABEL_COL = "label"

              df[TEXT_COL] = (df[TEXT_COL].astype(str).str.strip()
                              .str.replace(r"\s+", " ", regex=True))
              df = df[df[TEXT_COL].str.len() >= MIN_LENGTH].dropna(subset=[TEXT_COL])

              X = df[[TEXT_COL]] if TEXT_COL in df.columns else df.copy()
              y = df[LABEL_COL] if LABEL_COL and LABEL_COL in df.columns else None

              feature_names = [TEXT_COL]
              target_name   = LABEL_COL
              task_type     = "nlp"
              texts_train   = df[TEXT_COL].astype(str).tolist()
              texts_test    = []

              meta = {
                  "shape":     df.shape,
                  "n_classes": y.nunique() if y is not None else None,
                  "avg_length": int(df[TEXT_COL].str.len().mean()),
              }

              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | texts_train={len(texts_train)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)


