    - id: multi_table_relational
      contract: tabular
      name: "Base Relationnelle Multi-Tables (DFS Featuretools)"
      category: "Base Relationnelle Multi-Tables"
      format: "SQL — schéma complet"
      description: >
        Charge l'intégralité d'un schéma relationnel, détecte les clés
        étrangères et effectue le feature engineering cross-table via
        Featuretools (Deep Feature Synthesis).
      use_cases: ["CRM", "ERP", "tout schéma relationnel complexe", "AutoML multi-tables"]
      pros: ["zéro jointure manuelle", "features agrégées automatiques", "DFS profond"]
      cons: ["explosion du nombre de features", "lent sur grands volumes"]
      # DFS (Deep Feature Synthesis) :
      #   Pour chaque entité-cible e, remonte les FK jusqu'à MAX_DEPTH et
      #   applique des primitives (sum, count, mean, std, max, min, last,
      #   n_unique) sur les tables enfants.
      code_template: |
        import pandas as pd
        import numpy as np
        from sqlalchemy import create_engine, inspect
        import featuretools as ft

        # ── Paramètres ──────────────────────────────────────────────────
        DB_URL         = "postgresql+psycopg2://user:pwd@localhost:5432/mydb"
        TARGET_TABLE   = "customers"
        TARGET_COL     = "churn"
        ENTITY_ID_COL  = "customer_id"
        EXCLUDE_TABLES = ["alembic_version", "django_migrations"]
        MAX_DEPTH      = 2
        N_JOBS         = -1

        engine    = create_engine(DB_URL, pool_pre_ping=True)
        inspector = inspect(engine)
        all_tables = [t for t in inspector.get_table_names() if t not in EXCLUDE_TABLES]
        print(f"Tables : {all_tables}")

        dfs_dict = {}
        with engine.connect() as conn:
            for table in all_tables:
                try:
                    dfs_dict[table] = pd.read_sql_table(table, conn)
                    print(f"  {table} : {dfs_dict[table].shape}")
                except Exception as e:
                    print(f"  Ignorée ({table}) : {e}")

        relationships = []
        for table in all_tables:
            for fk in inspector.get_foreign_keys(table):
                if fk["referred_table"] in dfs_dict:
                    relationships.append(ft.Relationship(
                        parent_dataframe_name=fk["referred_table"],
                        parent_column_name=fk["referred_columns"][0],
                        child_dataframe_name=table,
                        child_column_name=fk["constrained_columns"][0],
                    ))

        es = ft.EntitySet(id="db")
        for table, df_t in dfs_dict.items():
            pks = [c["name"] for c in inspector.get_pk_constraint(table)["constrained_columns"]]
            idx = pks[0] if pks and pks[0] in df_t.columns else None
            if not idx:
                df_t = df_t.copy(); df_t["_id"] = range(len(df_t)); idx = "_id"
            es.add_dataframe(dataframe_name=table, dataframe=df_t, index=idx)
        for rel in relationships:
            try: es.add_relationship(rel)
            except Exception as e: print(f"  Relation ignorée : {e}")

        feature_matrix, feature_defs = ft.dfs(
            entityset=es, target_dataframe_name=TARGET_TABLE,
            max_depth=MAX_DEPTH, n_jobs=N_JOBS, verbose=True)
        print(f"Features DFS : {feature_matrix.shape[1]}")

        df = feature_matrix.copy()
        if TARGET_COL in dfs_dict[TARGET_TABLE].columns:
            _t = dfs_dict[TARGET_TABLE].set_index(ENTITY_ID_COL)[TARGET_COL]
            df[TARGET_COL] = df.index.map(_t)
            y = df.pop(TARGET_COL)
            task_type = "classification" if y.nunique() < 20 else "regression"
        else:
            y = None; task_type = "clustering"

        X = df.select_dtypes(include=[np.number]).fillna(0)
        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"tables": list(dfs_dict.keys()), "n_dfs_features": len(feature_defs), "shape": X.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={X.shape}")
        print(X.head(3))

