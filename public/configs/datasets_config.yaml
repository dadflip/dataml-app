audio:
# ──────────────────────────────────────────────────────────────────────────

  - id: audio_features
    name: "Audio (WAV / MP3 / FLAC) → Features MFCC / Spectrogramme"
    enabled: true
    category: "Audio"
    format: "WAV · MP3 · FLAC · OGG"
    description: >
      Extraction de features audio (MFCC, chroma, spectral centroid,
      mel-spectrogramme, ZCR, RMS) depuis des fichiers audio ou un dossier.
    use_cases:
      - "classification de sons / musique / parole"
      - "détection d'anomalies sonores (maintenance)"
      - "émotion vocale, qualité audio"
      - "UrbanSound8K, GTZAN, ESC-50"
    code_template: |
      import librosa
      import numpy as np
      import pandas as pd
      import os

      # ── Paramètres ────────────────────────────────────────────────────
      SOURCE     = "Dossier structuré par classe"   # ou "Fichier unique"
      AUDIO_DIR  = "data/audio_dataset/"   # sous-dossiers = classes
      AUDIO_FILE = "audio.wav"             # utilisé si SOURCE == "Fichier unique"
      SR         = 22050
      N_MFCC     = 40
      N_FFT      = 2048
      HOP_LENGTH = 512
      DURATION   = None    # float en secondes ou None = tout

      # ── Extraction de features ────────────────────────────────────────
      def extract_features(filepath):
          y_audio, _sr = librosa.load(filepath, sr=SR, duration=DURATION, mono=True)
          mfcc      = librosa.feature.mfcc(y=y_audio, sr=SR, n_mfcc=N_MFCC,
                                           n_fft=N_FFT, hop_length=HOP_LENGTH)
          chroma    = librosa.feature.chroma_stft(y=y_audio, sr=SR)
          spec_cent = librosa.feature.spectral_centroid(y=y_audio, sr=SR)
          spec_bw   = librosa.feature.spectral_bandwidth(y=y_audio, sr=SR)
          rolloff   = librosa.feature.spectral_rolloff(y=y_audio, sr=SR)
          zcr       = librosa.feature.zero_crossing_rate(y_audio)
          rms       = librosa.feature.rms(y=y_audio)
          row = {}
          for i in range(N_MFCC):
              row[f"mfcc_{i}_mean"] = mfcc[i].mean()
              row[f"mfcc_{i}_std"]  = mfcc[i].std()
          row["chroma_mean"]    = chroma.mean()
          row["chroma_std"]     = chroma.std()
          row["spec_cent_mean"] = spec_cent.mean()
          row["spec_bw_mean"]   = spec_bw.mean()
          row["rolloff_mean"]   = rolloff.mean()
          row["zcr_mean"]       = zcr.mean()
          row["rms_mean"]       = rms.mean()
          row["duration_s"]     = len(y_audio) / SR
          return row

      EXTS    = (".wav", ".mp3", ".flac", ".ogg", ".m4a")
      records = []

      if SOURCE == "Fichier unique":
          records.append({**extract_features(AUDIO_FILE), "label": None,
                          "filename": os.path.basename(AUDIO_FILE)})
      else:
          for label in sorted(os.listdir(AUDIO_DIR)):
              label_dir = os.path.join(AUDIO_DIR, label)
              if not os.path.isdir(label_dir):
                  continue
              for fname in os.listdir(label_dir):
                  if not fname.lower().endswith(EXTS):
                      continue
                  try:
                      row = extract_features(os.path.join(label_dir, fname))
                      row["label"]    = label
                      row["filename"] = fname
                      records.append(row)
                  except Exception as e:
                      print(f"⚠ {fname} : {e}")

      df = pd.DataFrame(records)
      print(f"Shape : {df.shape} | Classes : {df['label'].unique() if 'label' in df else 'N/A'}")

      _excl         = ["label", "filename"]
      X             = df.drop(columns=[c for c in _excl if c in df.columns])
      y             = df["label"] if "label" in df.columns and df["label"].notna().any() else None
      feature_names = X.columns.tolist()
      target_name   = "label"
      task_type     = "classification" if y is not None else "clustering"
      meta = {"n_files": len(records), "sr": SR, "n_mfcc": N_MFCC, "shape": df.shape}

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | files={len(records)}")
      print(df.head(3))


