  - id: networkx_graph
    name: "Graphe NetworkX (CSV edges / JSON)"
    enabled: true
    category: "Graphe"
    format: "edge list / adjacency / GraphML / GML / GEXF"
    description: >
      Chargement d'un graphe depuis une liste d'arêtes CSV ou un format
      natif NetworkX (GraphML, GML, GEXF). Extraction des features de
      noeuds (degré, centralité, clustering) pour pipeline ML tabulaire.
    use_cases:
      - "réseaux sociaux — détection de communautés"
      - "graphes de transactions — détection de fraude"
      - "réseaux biologiques — protéines, gènes"
      - "graphes de dépendances — supply chain"
    pros:
      - "bibliothèque Python native riche (300+ algorithmes)"
      - "export vers PyG / DGL facile"
      - "formats standards multiples"
    cons:
      - "non scalable > 10M arêtes (utiliser GraphX/Spark)"
      - "représentation en mémoire non optimisée"
    code_template: |
      import networkx as nx
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_source       = widgets.ToggleButtons(
          options=["CSV edges", "Fichier graphe (GraphML/GML/GEXF)"],
          description="SOURCE:", style={"description_width": "130px"})
      w_edge_file    = widgets.Text(value="data/edges.csv",
                                    description="EDGE_FILE:", style={"description_width": "150px"},
                                    layout=widgets.Layout(width="450px"))
      w_graph_file   = widgets.Text(value="data/graph.graphml",
                                    description="GRAPH_FILE:", style={"description_width": "150px"},
                                    layout=widgets.Layout(width="450px"))
      w_graph_file.layout.visibility = "hidden"
      w_node_file    = widgets.Text(value="",
                                    description="NODE_FILE:", style={"description_width": "150px"},
                                    layout=widgets.Layout(width="450px"),
                                    placeholder="Optionnel — CSV attributs noeuds")
      w_source_col   = widgets.Text(value="source",
                                    description="SOURCE_COL:", style={"description_width": "150px"})
      w_target_col_g = widgets.Text(value="target",
                                    description="TARGET_COL_G:", style={"description_width": "150px"})
      w_weight_col   = widgets.Text(value="weight",
                                    description="WEIGHT_COL:", style={"description_width": "150px"},
                                    placeholder="Laisser vide = non pondéré")
      w_label_col    = widgets.Text(value="label",
                                    description="NODE_LABEL_COL:", style={"description_width": "150px"},
                                    placeholder="Laisser vide = non supervisé")
      w_directed     = widgets.Checkbox(value=False, description="Graphe dirigé (DiGraph)",
                                        style={"description_width": "150px"})
      w_run          = widgets.Button(description="▶ Charger", button_style="success",
                                      layout=widgets.Layout(width="150px"))
      out            = widgets.Output()

      def on_source_change(change):
          is_file = change["new"] == "Fichier graphe (GraphML/GML/GEXF)"
          w_edge_file.layout.visibility  = "hidden" if is_file else "visible"
          w_graph_file.layout.visibility = "visible" if is_file else "hidden"

      w_source.observe(on_source_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🕸 Graphe NetworkX — Paramètres</b>"),
          w_source, w_edge_file, w_graph_file, w_node_file,
          widgets.HBox([w_source_col, w_target_col_g, w_weight_col]),
          w_label_col, w_directed, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              import json as _json
              SOURCE         = w_source.value
              EDGE_FILE      = w_edge_file.value.strip()
              GRAPH_FILE     = w_graph_file.value.strip() if SOURCE != "CSV edges" else None
              NODE_FILE      = w_node_file.value.strip() or None
              SOURCE_COL     = w_source_col.value.strip()
              TARGET_COL_G   = w_target_col_g.value.strip()
              WEIGHT_COL     = w_weight_col.value.strip() or None
              NODE_LABEL_COL = w_label_col.value.strip() or None
              DIRECTED       = w_directed.value

              if GRAPH_FILE:
                  ext = GRAPH_FILE.split(".")[-1].lower()
                  G = {"graphml": nx.read_graphml,
                       "gml":     nx.read_gml,
                       "gexf":    nx.read_gexf,
                       "json":    lambda f: nx.node_link_graph(
                                      _json.load(open(f)))
                       }.get(ext, nx.read_graphml)(GRAPH_FILE)
              else:
                  df_edges = pd.read_csv(EDGE_FILE)
                  G = nx.DiGraph() if DIRECTED else nx.Graph()
                  for _, row in df_edges.iterrows():
                      kwargs = {"weight": row[WEIGHT_COL]} if WEIGHT_COL and WEIGHT_COL in row else {}
                      G.add_edge(row[SOURCE_COL], row[TARGET_COL_G], **kwargs)

              if NODE_FILE:
                  df_nodes = pd.read_csv(NODE_FILE, index_col=0)
                  for node_id, attrs in df_nodes.iterrows():
                      if G.has_node(node_id):
                          G.nodes[node_id].update(attrs.to_dict())

              print(f"Noeuds : {G.number_of_nodes()} | Arêtes : {G.number_of_edges()}")
              is_conn = nx.is_connected(G) if not DIRECTED else nx.is_weakly_connected(G)
              print(f"Connexe : {is_conn}")

              nodes       = list(G.nodes())
              degree      = dict(G.degree())
              betweenness = nx.betweenness_centrality(G, normalized=True)
              clustering  = nx.clustering(G)
              pagerank    = nx.pagerank(G, alpha=0.85)

              rows = []
              for n in nodes:
                  r = {
                      "node_id":                n,
                      "degree":                 degree[n],
                      "betweenness_centrality": betweenness[n],
                      "clustering_coeff":       clustering[n],
                      "pagerank":               pagerank[n],
                  }
                  r.update(G.nodes[n])
                  rows.append(r)

              df = pd.DataFrame(rows).set_index("node_id")

              if NODE_LABEL_COL and NODE_LABEL_COL in df.columns:
                  y             = df[NODE_LABEL_COL]
                  X             = df.drop(columns=[NODE_LABEL_COL])
                  task_type     = "node_classification"
              else:
                  X             = df.copy()
                  y             = None
                  task_type     = "graph"

              feature_names = X.columns.tolist()
              target_name   = NODE_LABEL_COL
              meta = {
                  "n_nodes":  G.number_of_nodes(),
                  "n_edges":  G.number_of_edges(),
                  "directed": DIRECTED,
                  "density":  nx.density(G),
                  "graph_obj": G,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | nodes={G.number_of_nodes()}")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: pytorch_geometric
    name: "Graphe PyTorch Geometric (PyG)"
    enabled: true
    category: "Graphe — Deep Learning"
    format: "PyG Dataset / Data object"
    description: >
      Chargement de datasets de graphes natifs PyG (Cora, CiteSeer, OGB,
      PPI, TUDataset…) ou conversion d'un graphe NetworkX vers PyG Data.
    use_cases:
      - "classification de noeuds (Cora, CiteSeer, ogbn-arxiv)"
      - "classification de graphes (TUDataset — molécules)"
      - "prédiction de liens"
      - "GNN : GCN, GAT, GraphSAGE, GIN"
    pros:
      - "accès direct à 100+ datasets benchmark"
      - "transformations et mini-batch natifs"
      - "compatible PyTorch"
    cons:
      - "CUDA requis pour l'entraînement rapide"
      - "peu adapté aux données non-graphe"
    code_template: |
      import numpy as np
      import pandas as pd
      import torch
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_source  = widgets.ToggleButtons(
          options=["Dataset PyG standard", "Conversion depuis NetworkX"],
          description="SOURCE:", style={"description_width": "130px"})
      w_dataset = widgets.Dropdown(
          options=["Cora", "CiteSeer", "PubMed", "PROTEINS", "MUTAG",
                   "IMDB-BINARY", "ogbn-arxiv"],
          value="Cora", description="PYG_DATASET:", style={"description_width": "150px"})
      w_root    = widgets.Text(value="./data/pyg",
                               description="PYG_ROOT:", style={"description_width": "150px"},
                               layout=widgets.Layout(width="400px"))
      w_run     = widgets.Button(description="▶ Charger", button_style="success",
                                 layout=widgets.Layout(width="150px"))
      out       = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🔗 PyTorch Geometric — Paramètres</b>"),
          w_source, w_dataset, w_root, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              PYG_DATASET_NAME = w_dataset.value
              PYG_ROOT         = w_root.value.strip()
              SOURCE           = w_source.value

              if SOURCE == "Dataset PyG standard":
                  from torch_geometric.datasets import Planetoid, TUDataset

                  if PYG_DATASET_NAME in ["Cora", "CiteSeer", "PubMed"]:
                      dataset = Planetoid(root=PYG_ROOT, name=PYG_DATASET_NAME)
                  else:
                      dataset = TUDataset(root=PYG_ROOT, name=PYG_DATASET_NAME)

                  data  = dataset[0]
                  X_arr = data.x.numpy() if data.x is not None else np.zeros((data.num_nodes, 1))
                  y_arr = data.y.numpy() if data.y is not None else None
              else:
                  print("⚠ Fournir NX_GRAPH dans la cellule précédente, puis relancer.")
                  return

              n_feat = X_arr.shape[1]
              X      = pd.DataFrame(X_arr, columns=[f"feat_{i}" for i in range(n_feat)])
              y      = pd.Series(y_arr, name="label") if y_arr is not None else None

              feature_names = X.columns.tolist()
              target_name   = "label"
              task_type     = "node_classification" if y is not None else "graph"
              df            = X.copy()
              if y is not None:
                  df["label"] = y.values

              meta = {
                  "dataset":    PYG_DATASET_NAME,
                  "n_nodes":    int(X_arr.shape[0]),
                  "n_features": n_feat,
                  "n_classes":  int(y.nunique()) if y is not None else None,
                  "pyg_data":   data,
                  "n_edges":    int(data.num_edges) if hasattr(data, "num_edges") else None,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape X : {X.shape}")
              print(f"\n✅ task_type='{task_type}' | features={n_feat} | nodes={X_arr.shape[0]}")
              display(df.head(3))

      w_run.on_click(on_run)


