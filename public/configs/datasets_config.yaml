4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      from kafka import KafkaConsumer
      import pandas as pd
      import json
      from collections import deque

      BOOTSTRAP_SERVERS = ["localhost:9092"]
      TOPIC             = "ml-events"
      GROUP_ID          = "ml-consumer-group"
      BATCH_SIZE        = 1000     # taille du mini-batch pour inférence
      TIMEOUT_MS        = 1000

      consumer = KafkaConsumer(
          TOPIC,
          bootstrap_servers=BOOTSTRAP_SERVERS,
          group_id=GROUP_ID,
          auto_offset_reset="latest",
          enable_auto_commit=True,
          value_deserializer=lambda m: json.loads(m.decode("utf-8")),
          consumer_timeout_ms=TIMEOUT_MS
      )

      buffer = deque(maxlen=BATCH_SIZE)

      def process_batch(records: list) -> pd.DataFrame:
          df = pd.json_normalize(records)
          # Appliquer ici le preprocessor sauvegardé
          return df

      print(f"Écoute du topic '{TOPIC}'...")
      try:
          for message in consumer:
              buffer.append(message.value)
              if len(buffer) >= BATCH_SIZE:
                  df = process_batch(list(buffer))
                  X  = df.drop(columns=["event_id", "timestamp"], errors="ignore")
                  # scores = model.predict(X)  ← inférence
                  print(f"Batch de {len(df)} messages traité.")
                  buffer.clear()
      finally:
          consumer.close()

      task_type = "anomaly"
      meta = {"topic": TOPIC, "batch_size": BATCH_SIZE}


