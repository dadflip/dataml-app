  - id: chroma_vectordb
    name: "ChromaDB (Vector Store)"
    enabled: true
    category: "Base Vectorielle"
    format: "Embeddings / numpy"
    description: >
      Extraction de vecteurs d'embeddings et métadonnées depuis ChromaDB.
    use_cases:
      - "clustering sémantique de documents"
      - "anomaly detection dans l'espace sémantique"
      - "classification sur représentations latentes"
      - "visualisation t-SNE/UMAP d'embeddings"
    pros:
      - "embeddings pré-calculés — pas de recompute"
      - "métadonnées riches récupérables"
      - "local et cloud"
    cons:
      - "embeddings = boîte noire (moins interprétable)"
      - "dépendance au modèle d'embedding"
    code_template: |
      import chromadb
      import numpy as np
      import pandas as pd
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_mode       = widgets.ToggleButtons(
          options=["Local (PersistentClient)", "Serveur (HttpClient)"],
          description="MODE:", style={"description_width": "130px"})
      w_path       = widgets.Text(value="./chroma_db",
                                  description="CHROMA_PATH:", style={"description_width": "160px"},
                                  layout=widgets.Layout(width="400px"))
      w_host       = widgets.Text(value="localhost",
                                  description="CHROMA_HOST:", style={"description_width": "160px"})
      w_port       = widgets.IntText(value=8000, description="CHROMA_PORT:",
                                     style={"description_width": "160px"})
      w_host.layout.visibility = "hidden"
      w_port.layout.visibility = "hidden"
      w_collection = widgets.Text(value="documents",
                                  description="COLLECTION_NAME:", style={"description_width": "160px"})
      w_target_key = widgets.Text(value="label",
                                  description="TARGET_METADATA_KEY:", style={"description_width": "160px"},
                                  placeholder="Laisser vide = non supervisé")
      w_n_max      = widgets.IntText(value=0, description="N_MAX (0=tout):",
                                     style={"description_width": "160px"})
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      def on_mode_change(change):
          is_server = change["new"] == "Serveur (HttpClient)"
          w_path.layout.visibility = "hidden" if is_server else "visible"
          w_host.layout.visibility = "visible" if is_server else "hidden"
          w_port.layout.visibility = "visible" if is_server else "hidden"

      w_mode.observe(on_mode_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🟡 ChromaDB — Paramètres</b>"),
          w_mode, w_path, w_host, w_port, w_collection, w_target_key, w_n_max, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              MODE              = w_mode.value
              CHROMA_PATH       = w_path.value.strip()
              CHROMA_HOST       = w_host.value.strip()
              CHROMA_PORT       = w_port.value
              COLLECTION_NAME   = w_collection.value.strip()
              TARGET_METADATA_KEY = w_target_key.value.strip() or None
              N_MAX             = w_n_max.value or None

              if MODE == "Serveur (HttpClient)":
                  client = chromadb.HttpClient(host=CHROMA_HOST, port=CHROMA_PORT)
              else:
                  client = chromadb.PersistentClient(path=CHROMA_PATH)

              collection = client.get_collection(COLLECTION_NAME)
              print(f"Collection '{COLLECTION_NAME}' : {collection.count()} vecteurs")

              query_kwargs = {"include": ["embeddings", "metadatas", "documents"]}
              if N_MAX:
                  query_kwargs["limit"] = N_MAX

              results    = collection.get(**query_kwargs)
              embeddings = np.array(results["embeddings"])
              metadatas  = results["metadatas"] or [{}] * len(embeddings)
              documents  = results.get("documents") or [""] * len(embeddings)

              df_meta   = pd.DataFrame(metadatas)
              dim       = embeddings.shape[1]
              feat_cols = [f"emb_{i}" for i in range(dim)]
              X         = pd.DataFrame(embeddings, columns=feat_cols)
              df        = X.copy()

              if df_meta.shape[1] > 0:
                  for col in df_meta.columns:
                      df[col] = df_meta[col].values

              if TARGET_METADATA_KEY and TARGET_METADATA_KEY in df_meta.columns:
                  y         = df_meta[TARGET_METADATA_KEY]
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  y         = None
                  task_type = "clustering"

              feature_names = feat_cols
              target_name   = TARGET_METADATA_KEY
              meta = {
                  "collection":    COLLECTION_NAME,
                  "n_vectors":     len(embeddings),
                  "embedding_dim": dim,
                  "documents":     documents,
                  "shape":         embeddings.shape,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | dim={dim} | n_vectors={len(embeddings)}")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: pinecone_vectordb
    name: "Pinecone (Vector Store Cloud)"
    enabled: true
    category: "Base Vectorielle"
    format: "Embeddings / JSON"
    description: >
      Extraction d'embeddings et métadonnées depuis Pinecone.
    use_cases:
      - "clustering sémantique à grande échelle"
      - "classification sur embeddings LLM"
    pros:
      - "scalable à des milliards de vecteurs"
      - "filtrage par métadonnées natif"
    cons:
      - "payant"
      - "nécessite API key"
    code_template: |
      import numpy as np
      import pandas as pd
      from pinecone import Pinecone
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_api_key    = widgets.Password(value="",
                                      description="PINECONE_API_KEY:", style={"description_width": "180px"},
                                      layout=widgets.Layout(width="450px"))
      w_index      = widgets.Text(value="my-index",
                                  description="PINECONE_INDEX:", style={"description_width": "180px"})
      w_target_key = widgets.Text(value="category",
                                  description="TARGET_METADATA_KEY:", style={"description_width": "180px"},
                                  placeholder="Laisser vide = non supervisé")
      w_fetch_n    = widgets.IntText(value=1000, description="FETCH_N:",
                                     style={"description_width": "180px"})
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🌲 Pinecone — Paramètres</b>"),
          w_api_key, w_index, w_target_key, w_fetch_n, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              PINECONE_API_KEY    = w_api_key.value.strip()
              PINECONE_INDEX      = w_index.value.strip()
              TARGET_METADATA_KEY = w_target_key.value.strip() or None
              FETCH_N             = w_fetch_n.value

              pc    = Pinecone(api_key=PINECONE_API_KEY)
              index = pc.Index(PINECONE_INDEX)
              stats = index.describe_index_stats()
              dim   = stats["dimension"]
              print(f"Index '{PINECONE_INDEX}' : {stats['total_vector_count']} vecteurs, dim={dim}")

              dummy_query = np.zeros(dim).tolist()
              result      = index.query(vector=dummy_query, top_k=FETCH_N,
                                        include_metadata=True, include_values=True)

              vectors   = np.array([m["values"]            for m in result["matches"]])
              metadatas = [m.get("metadata", {})            for m in result["matches"]]
              ids_list  = [m["id"]                          for m in result["matches"]]

              df_meta   = pd.DataFrame(metadatas)
              feat_cols = [f"emb_{i}" for i in range(dim)]
              X         = pd.DataFrame(vectors, columns=feat_cols)
              df        = X.copy()
              df["vector_id"] = ids_list

              if TARGET_METADATA_KEY and TARGET_METADATA_KEY in df_meta.columns:
                  y         = df_meta[TARGET_METADATA_KEY].reset_index(drop=True)
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  y         = None
                  task_type = "clustering"

              feature_names = feat_cols
              target_name   = TARGET_METADATA_KEY
              meta = {
                  "index":         PINECONE_INDEX,
                  "n_vectors":     len(vectors),
                  "embedding_dim": dim,
                  "shape":         vectors.shape,
              }

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | dim={dim} | n_vectors={len(vectors)}")
              display(df.head(3))

      w_run.on_click(on_run)


