      - "data lake Azure"
      - "pipelines Azure Data Factory"
      - "données Synapse Spark"
    code_template: |
      import pandas as pd
      import numpy as np
      import io

      # ── Paramètres ────────────────────────────────────────────────────
      MODE             = "Azure Blob Storage"   # ou "Synapse Serverless SQL"
      AZURE_CONN       = ""
      CONTAINER        = "raw-data"
