    - id: numpy_npz_tabular
      contract: tabular
      name: "Archives NumPy (.npy / .npz) — données tabulaires"
      category: "Fichier Scientifique"
      format: "npy / npz"
      description: >
        Chargement d'archives NumPy : tableau unique (.npy) ou archive
        multi-tableaux (.npz). Adapté aux embeddings pré-calculés et splits
        préparés. Pour les .npz contenant des images, utiliser numpy_npz_vision.
      use_cases:
        - "embeddings pré-calculés (BERT, CLIP, ResNet aplatis)"
        - "splits préparés X_train/y_train/X_test/y_test"
        - "exports de pipelines de data augmentation"
      pros: ["chargement instantané", "mmap possible", "aucune dépendance hors numpy"]
      cons: ["pas de métadonnées de colonnes", "non lisible sans Python"]
      code_template: |
        import numpy as np
        import pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/dataset.npz"
        X_KEY      = "X"          # clé dans le .npz — ignoré si .npy
        Y_KEY      = "y"          # None si non supervisé
        TARGET_IDX = -1           # si .npy : colonne target (-1=dernière), None si absent
        TARGET_COL = "target"
        MMAP_MODE  = None         # None | "r" pour grands fichiers

        is_npz = FILE_PATH.endswith(".npz")
        if is_npz:
            archive = np.load(FILE_PATH, allow_pickle=False, mmap_mode=MMAP_MODE)
            print(f"Clés .npz : {list(archive.files)}")
            # Auto-détection si clés non standard
            _xc = ["X","x","data","features","embeddings","train_data"]
            _yc = ["y","labels","label","targets","target","train_labels"]
            xk = X_KEY if X_KEY in archive.files else next((k for k in _xc if k in archive.files), None)
            yk = Y_KEY if (Y_KEY and Y_KEY in archive.files) else next((k for k in _yc if k in archive.files), None)
            if xk is None:
                xk = max(archive.files, key=lambda k: int(np.prod(archive[k].shape)))
                print(f"Fallback X='{xk}'")
            X_raw = archive[xk]
            y_raw = archive[yk] if yk else None
        else:
            arr   = np.load(FILE_PATH, allow_pickle=False, mmap_mode=MMAP_MODE)
            print(f".npy shape={arr.shape}")
            if TARGET_IDX is not None and arr.ndim == 2:
                y_raw = arr[:, TARGET_IDX].ravel()
                X_raw = np.delete(arr, TARGET_IDX, axis=1)
            else:
                X_raw = arr; y_raw = None

        if X_raw.ndim == 1:
            X_raw = X_raw.reshape(-1, 1)
        elif X_raw.ndim > 2:
            X_raw = X_raw.reshape(X_raw.shape[0], -1)

        feature_names = [f"feat_{i}" for i in range(X_raw.shape[1])]
        X = pd.DataFrame(X_raw.astype(np.float32), columns=feature_names)
        y = pd.Series(y_raw.ravel(), name=TARGET_COL) if y_raw is not None else None
        df = X.copy()
        if y is not None:
            df[TARGET_COL] = y.values

        task_type = "clustering"
        if y is not None:
            task_type = "classification" if (y.dtype == object or y.nunique() < 50) else "regression"
        target_name = TARGET_COL if y is not None else None
        meta = {"file": FILE_PATH, "format": "npz" if is_npz else "npy", "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

