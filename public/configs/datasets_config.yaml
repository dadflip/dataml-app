    description: "Chargement d'un dataset de survie avec durées, événements et covariables."
    use_cases: ["churn prediction", "durée de vie produit", "études cliniques", "time-to-event"]
    pros: ["gère la censure", "lifelines natif", "interprétable"]
    cons: ["nécessite durée + événement", "hypothèses à vérifier"]
    code_template: |
      import pandas as pd
      import numpy as np
      from lifelines.datasets import load_rossi, load_lung

      # ── Paramètres ────────────────────────────────────────────────────
      # Datasets lifelines : load_rossi(), load_lung(), load_dd(),
      #                      load_stanford_heart_transplants()
      DURATION_COL = "week"
      EVENT_COL    = "arrest"

      # ── Chargement ────────────────────────────────────────────────────
      df = load_rossi()
      # Depuis CSV :
      # df = pd.read_csv("survival_data.csv")
      print(df.head())
      print(f"Shape : {df.shape}")

      # ── Variables survival ────────────────────────────────────────────
      durations   = df[DURATION_COL]
      events      = df[EVENT_COL].astype(int)
      df_survival = df.copy()

      # ── Variables standards ───────────────────────────────────────────
      feature_cols  = [c for c in df.columns if c not in [DURATION_COL, EVENT_COL]]
      X             = df[feature_cols]
      y             = events
      feature_names = feature_cols
      target_name   = EVENT_COL
      task_type     = "survival"
      meta = {
          "duration_col": DURATION_COL,
          "event_col": EVENT_COL,
          "censoring_rate": f"{(1 - events.mean()) * 100:.1f}%",
          "shape": df.shape,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
