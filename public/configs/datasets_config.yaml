                                     style={"description_width": "140px"})
      w_user_agent = widgets.Text(value="Mozilla/5.0 (compatible; DataBot/1.0)",
                                  description="USER_AGENT:", style={"description_width": "140px"},
                                  layout=widgets.Layout(width="500px"))
      w_multi_page = widgets.Checkbox(value=False, description="Multi-pages",
                                      style={"description_width": "140px"})
      w_n_pages    = widgets.IntText(value=10, description="N_PAGES:",
                                     style={"description_width": "140px"})
      w_sleep      = widgets.FloatText(value=1.0, description="SLEEP (s):",
                                       style={"description_width": "140px"})
      w_run        = widgets.Button(description="▶ Scraper", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      def toggle_pages(change):
          w_n_pages.layout.visibility = "visible" if change["new"] else "hidden"
          w_sleep.layout.visibility   = "visible" if change["new"] else "hidden"

      w_multi_page.observe(toggle_pages, names="value")
      w_n_pages.layout.visibility = "hidden"
      w_sleep.layout.visibility   = "hidden"

      box = widgets.VBox([
          widgets.HTML("<b>🕸 Web Scraping — Paramètres</b>"),
