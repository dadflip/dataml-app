    - id: networkx_graph
      contract: tabular
      name: "Graphe NetworkX → features de noeuds tabulaires"
      category: "Graphe"
      format: "edge list CSV / GraphML / GML / GEXF"
      description: >
        Chargement d'un graphe NetworkX et extraction de features par noeud
        (degré, centralité, clustering, PageRank) pour pipeline ML tabulaire.
      use_cases: ["réseaux sociaux", "graphes de transactions", "réseaux biologiques"]
      pros: ["300+ algorithmes NetworkX", "export PyG/DGL facile"]
      cons: ["non scalable >10M arêtes", "représentation mémoire non optimisée"]
      # Métriques extraites :
      #   Degré         : deg(v) = nb d'arêtes incidentes
      #   Betweenness   : C_B(v) = Σ σ(s,t|v)/σ(s,t)
      #   Clustering    : C(v) = triangles(v) / (deg(v)*(deg(v)-1)/2)
      #   PageRank(0.85): PR(v) = (1-α)/N + α Σ_{u→v} PR(u)/deg(u)
      code_template: |
        import networkx as nx, pandas as pd, numpy as np, json

        # ── Paramètres ──────────────────────────────────────────────────
        SOURCE         = "CSV edges"
        EDGE_FILE      = "data/edges.csv"
        GRAPH_FILE     = "data/graph.graphml"
        NODE_FILE      = None
        SOURCE_COL     = "source"; TARGET_COL_G = "target"; WEIGHT_COL = "weight"
        NODE_LABEL_COL = "label"
        DIRECTED       = False

        if SOURCE != "CSV edges":
            ext = GRAPH_FILE.split(".")[-1].lower()
            G = {"graphml": nx.read_graphml, "gml": nx.read_gml, "gexf": nx.read_gexf,
                 "json": lambda f: nx.node_link_graph(json.load(open(f)))}.get(ext)(GRAPH_FILE)
        else:
            df_edges = pd.read_csv(EDGE_FILE)
            G = nx.DiGraph() if DIRECTED else nx.Graph()
            for _, row in df_edges.iterrows():
                kw = {"weight": row[WEIGHT_COL]} if WEIGHT_COL and WEIGHT_COL in row else {}
                G.add_edge(row[SOURCE_COL], row[TARGET_COL_G], **kw)

        print(f"Noeuds : {G.number_of_nodes()} | Arêtes : {G.number_of_edges()}")
        nodes = list(G.nodes())
        degree = dict(G.degree())
        betweenness = nx.betweenness_centrality(G, normalized=True)
        clustering  = nx.clustering(G)
        pagerank    = nx.pagerank(G, alpha=0.85)
        rows = [{"node_id": n, "degree": degree[n], "betweenness_centrality": betweenness[n],
                 "clustering_coeff": clustering[n], "pagerank": pagerank[n], **G.nodes[n]}
                for n in nodes]
        df = pd.DataFrame(rows).set_index("node_id")

        if NODE_LABEL_COL and NODE_LABEL_COL in df.columns:
            y = df[NODE_LABEL_COL]; X = df.drop(columns=[NODE_LABEL_COL]); task_type = "node_classification"
        else:
            X = df.copy(); y = None; task_type = "graph"

        feature_names = X.columns.tolist(); target_name = NODE_LABEL_COL
        meta = {"n_nodes": G.number_of_nodes(), "n_edges": G.number_of_edges(),
                "density": nx.density(G), "graph_obj": G}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | nodes={G.number_of_nodes()}")
        print(df.head(3))

    - id: rdf_owl_ontology
      contract: tabular
      name: "Ontologie RDF / OWL / SPARQL"
      category: "Graphe de Connaissances"
      format: "RDF/XML . Turtle . N-Triples . JSON-LD"
      description: >
        Chargement d'une ontologie RDF/OWL, requêtage SPARQL et extraction
        de features par entité pour pipeline ML tabulaire.
      use_cases: ["DBpedia", "Wikidata", "ontologies médicales (SNOMED, MeSH)"]
      pros: ["standard W3C", "raisonnement OWL", "SPARQL natif"]
      cons: ["verbeux", "lent >10M triplets", "courbe d'apprentissage"]
      code_template: |
        import rdflib, pandas as pd, numpy as np, networkx as nx

        # ── Paramètres ──────────────────────────────────────────────────
        SOURCE           = "Fichier RDF local"
        RDF_FILE         = "data/ontology.ttl"
        RDF_FORMAT       = "turtle"
        SPARQL_ENDPOINT  = "http://dbpedia.org/sparql"
        TARGET_PREDICATE = None
        SPARQL_QUERY     = """
            PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
            SELECT ?subject ?predicate ?object WHERE {
                ?subject ?predicate ?object .
                FILTER(isIRI(?subject) && isIRI(?object))
            } LIMIT 100000
        """

        g = rdflib.Graph()
        if SOURCE == "Fichier RDF local":
            g.parse(RDF_FILE, format=RDF_FORMAT)
            print(f"Triplets : {len(g)}")
            results_q = g.query(SPARQL_QUERY)
            df_triplets = pd.DataFrame(
                [(str(r.subject), str(r.predicate), str(r.object)) for r in results_q],
                columns=["subject","predicate","object"])
        else:
            from SPARQLWrapper import SPARQLWrapper, JSON
            sp = SPARQLWrapper(SPARQL_ENDPOINT); sp.setQuery(SPARQL_QUERY); sp.setReturnFormat(JSON)
            res = sp.query().convert()
            df_triplets = pd.DataFrame([{k: r[k]["value"] for k in r}
                                         for r in res["results"]["bindings"]])

        preds = df_triplets["predicate"].value_counts().head(50).index.tolist()
        subjects = df_triplets["subject"].unique()
        feat_rows = [{"entity": s,
                      **{f"pred_{p.split('/')[-1][:30]}": int(p in df_triplets[df_triplets["subject"]==s]["predicate"].values)
                         for p in preds},
                      "out_degree": len(df_triplets[df_triplets["subject"]==s])}
                     for s in subjects]
        df = pd.DataFrame(feat_rows).set_index("entity").fillna(0)

        if TARGET_PREDICATE:
            _tc = f"pred_{TARGET_PREDICATE.split('/')[-1][:30]}"
            y = df[_tc] if _tc in df.columns else None
            X = df.drop(columns=[_tc], errors="ignore"); task_type = "node_classification"
        else:
            X = df.copy(); y = None; task_type = "knowledge_graph"

        feature_names = X.columns.tolist(); target_name = TARGET_PREDICATE
        meta = {"n_triplets": len(df_triplets), "n_entities": len(subjects),
                "n_relations": df_triplets["predicate"].nunique(), "rdf_graph": g}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | entities={len(subjects)}")
        print(df.head(3))

    - id: wikidata_sparql
      contract: tabular
      name: "Wikidata (SPARQL Live)"
      category: "Graphe de Connaissances"
      format: "SPARQL / JSON"
      description: >
        Requêtage direct du endpoint SPARQL public de Wikidata.
        Extraction de propriétés structurées pour enrichissement de datasets.
      use_cases: ["enrichissement features (pays, entreprises)", "datasets ouverts structurés"]
      pros: ["endpoint public gratuit", "80M+ entités", "données fraîches"]
      cons: ["timeout 60s", "rate limiting"]
      code_template: |
        import requests, pandas as pd, numpy as np, time

        # ── Paramètres ──────────────────────────────────────────────────
        TARGET_COL  = None
        MAX_RETRIES = 3
        WIKIDATA_QUERY = """
            SELECT ?item ?itemLabel ?population ?area ?capital ?capitalLabel WHERE {
              ?item wdt:P31 wd:Q6256 .
              OPTIONAL { ?item wdt:P1082 ?population . }
              OPTIONAL { ?item wdt:P2046 ?area . }
              OPTIONAL { ?item wdt:P36 ?capital . }
              SERVICE wikibase:label { bd:serviceParam wikibase:language "fr,en" . }
            } LIMIT 500
        """

        ENDPOINT = "https://query.wikidata.org/sparql"
        HEADERS  = {"Accept": "application/sparql-results+json",
                    "User-Agent": "ML-Pipeline/1.0"}
        r = None
        for attempt in range(MAX_RETRIES):
            try:
                r = requests.get(ENDPOINT, params={"query": WIKIDATA_QUERY, "format": "json"},
                                 headers=HEADERS, timeout=55)
                r.raise_for_status(); break
            except requests.RequestException as e:
                print(f"Tentative {attempt+1} : {e}"); time.sleep(5*(attempt+1))
        if r is None: raise SystemExit("Échec Wikidata")

        data    = r.json()
        cols    = data["results"]["head"]["vars"]
        records = [{c: row.get(c,{}).get("value",None) for c in cols}
                   for row in data["results"]["bindings"]]
        df = pd.DataFrame(records)
        for col in ["population","area"]:
            if col in df.columns: df[col] = pd.to_numeric(df[col], errors="coerce")
        if "item" in df.columns:
            df["wikidata_id"] = df["item"].str.extract(r"(Q\d+)")

        _excl = ["item","itemLabel","capitalLabel","wikidata_id"]
        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[c for c in _excl+[TARGET_COL] if c in df.columns])
            y = df[TARGET_COL]
            task_type = "classification" if y.nunique() < 20 else "regression"
        else:
            X = df.drop(columns=[c for c in _excl if c in df.columns])
            y = None; task_type = "knowledge_graph"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"n_entities": len(df), "query_vars": cols, "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | entities={len(df)}")
        print(df.head(3))

