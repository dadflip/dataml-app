    - id: supabase
      contract: tabular
      name: "Supabase (PostgreSQL + API REST)"
      category: "Cloud BaaS"
      format: "REST JSON / PostgREST / psycopg2"
      description: "Chargement depuis Supabase via SDK Python ou connexion PostgreSQL directe."
      use_cases: ["apps web/mobile Supabase", "prototypage rapide BaaS"]
      pros: ["SDK officiel", "accès PostgreSQL direct", "gratuit tier généreux"]
      cons: ["RLS peut masquer des données", "latence réseau"]
      code_template: |
        import pandas as pd, numpy as np, json

        # ── Paramètres ──────────────────────────────────────────────────
        MODE                 = "Client Python (PostgREST)"
        SUPABASE_URL         = "https://xxxxxxxxxxxx.supabase.co"
        SUPABASE_SERVICE_KEY = ""
        PG_DSN               = "postgresql://postgres:pwd@db.xxx.supabase.co:5432/postgres"
        SUPABASE_TABLE       = "users"
        TARGET_COL           = None
        SELECT_COLS          = "*"
        FILTERS              = {}

        if MODE == "Client Python (PostgREST)":
            from supabase import create_client
            client = create_client(SUPABASE_URL, SUPABASE_SERVICE_KEY)
            query  = client.table(SUPABASE_TABLE).select(SELECT_COLS)
            for col, val in FILTERS.items(): query = query.eq(col, val)
            all_records = []; offset = 0; page_size = 1000
            while True:
                resp = query.range(offset, offset+page_size-1).execute()
                if not resp.data: break
                all_records.extend(resp.data)
                if len(resp.data) < page_size: break
                offset += page_size
            df = pd.json_normalize(all_records)
        else:
            from sqlalchemy import create_engine
            engine = create_engine(PG_DSN)
            _where = " AND ".join(f"{k}='{v}'" for k, v in FILTERS.items())
            q = f"SELECT {SELECT_COLS} FROM {SUPABASE_TABLE}" + (f" WHERE {_where}" if _where else "")
            with engine.connect() as conn: df = pd.read_sql(q, conn)

        print(f"Shape brut : {df.shape}")
        _id_cols = [c for c in ["id","uuid","created_at","updated_at"] if c in df.columns]
        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=_id_cols+[TARGET_COL]); y = df[TARGET_COL]
            task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
        else:
            X = df.drop(columns=_id_cols); y = None; task_type = "clustering"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"table": SUPABASE_TABLE, "n_records": len(df), "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: aws_s3_athena
      contract: tabular
      name: "AWS S3 + Athena"
      category: "Cloud Data Lake"
      format: "Parquet / CSV sur S3 + SQL Athena"
      description: "Lecture S3 directe ou requêtage Athena serverless."
      use_cases: ["data lake AWS", "logs CloudWatch", "données Kinesis Firehose"]
      pros: ["SQL sur S3 sans infrastructure", "coût très bas"]
      cons: ["latence 1-30s/requête", "coût au scan"]
      code_template: |
        import pandas as pd, numpy as np, boto3, io, time

        # ── Paramètres ──────────────────────────────────────────────────
        MODE         = "Lecture directe S3"
        AWS_REGION   = "eu-west-1"
        S3_BUCKET    = "my-data-lake"; S3_KEY = "datasets/data.parquet"
        ATHENA_DB    = "my_glue_database"
        ATHENA_OUT   = "s3://my-data-lake/athena-results/"
        TARGET_COL   = None
        ATHENA_QUERY = "SELECT * FROM my_table WHERE year='2024' LIMIT 500000"

        session = boto3.Session(region_name=AWS_REGION); exec_id = None
        if MODE == "Lecture directe S3":
            s3  = session.client("s3")
            obj = s3.get_object(Bucket=S3_BUCKET, Key=S3_KEY)
            buf = io.BytesIO(obj["Body"].read())
            df  = pd.read_parquet(buf) if S3_KEY.endswith(".parquet") else pd.read_csv(buf)
        else:
            athena = session.client("athena", region_name=AWS_REGION)
            resp   = athena.start_query_execution(
                QueryString=ATHENA_QUERY,
                QueryExecutionContext={"Database": ATHENA_DB},
                ResultConfiguration={"OutputLocation": ATHENA_OUT})
            exec_id = resp["QueryExecutionId"]
            for _ in range(60):
                st = athena.get_query_execution(QueryExecutionId=exec_id)["QueryExecution"]["Status"]["State"]
                if st in ["SUCCEEDED","FAILED","CANCELLED"]: break
                time.sleep(2)
            if st != "SUCCEEDED": raise SystemExit(f"Athena : {st}")
            s3_path = athena.get_query_execution(QueryExecutionId=exec_id)["QueryExecution"]["ResultConfiguration"]["OutputLocation"].replace("s3://","")
            bk, ky  = s3_path.split("/", 1)
            df = pd.read_csv(io.BytesIO(session.client("s3").get_object(Bucket=bk, Key=ky)["Body"].read()))

        print(f"Shape brut : {df.shape}")
        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL]); y = df[TARGET_COL]
            task_type = "classification" if y.nunique() < 20 else "regression"
        else:
            X = df.copy(); y = None; task_type = "clustering"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"bucket": S3_BUCKET, "shape": df.shape, "athena_exec_id": exec_id}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

