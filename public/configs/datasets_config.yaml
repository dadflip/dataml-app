lakehouse:
# ──────────────────────────────────────────────────────────────────────────

  - id: delta_lake
    name: "Delta Lake / Databricks"
    enabled: true
    category: "Lakehouse"
    format: "Delta Table (Parquet + transaction log)"
    description: >
      Lecture d'une Delta Table (local ou Databricks) via delta-rs ou PySpark.
      Support du time travel, Change Data Feed et schema evolution.
    use_cases:
      - "pipelines Databricks / Apache Spark"
      - "data lakehouse sur S3, ADLS, GCS"
      - "time travel — audit et reproductibilité"
    pros:
      - "ACID transactions sur data lake"
      - "time travel natif"
      - "lecture sans Spark (delta-rs)"
    cons:
      - "delta-rs ne supporte pas toutes les fonctionnalités DML"
      - "Spark requis pour écriture haute perf"
    code_template: |
      import pandas as pd
      import numpy as np
      import json

      # ── Paramètres ────────────────────────────────────────────────────
      DELTA_TABLE_PATH = "./data/delta_table"   # local ou s3://… ou abfss://…
      ENGINE           = "delta-rs (sans Spark)"   # ou "PySpark"
      TRAVEL           = "Dernière version"     # "Dernière version", "Version N", "Timestamp"
      DELTA_VERSION    = None    # entier si TRAVEL == "Version N"
      DELTA_TIMESTAMP  = None    # "2024-12-01T00:00:00" si TRAVEL == "Timestamp"
      TARGET_COL       = None    # None si non supervisé
      STORAGE_OPTIONS  = {}      # ex: {"AWS_ACCESS_KEY_ID": "…"}

      # ── Chargement ────────────────────────────────────────────────────
      if ENGINE == "delta-rs (sans Spark)":
          from deltalake import DeltaTable
          dt_kwargs = {"storage_options": STORAGE_OPTIONS} if STORAGE_OPTIONS else {}
          dt = DeltaTable(DELTA_TABLE_PATH, **dt_kwargs)
          if DELTA_VERSION is not None:
              dt.load_as_version(DELTA_VERSION)
          elif DELTA_TIMESTAMP is not None:
              dt.load_as_version(DELTA_TIMESTAMP)
          df = dt.to_pandas()
          print(f"Delta version : {dt.version()} | Shape : {df.shape}")
      else:
          from pyspark.sql import SparkSession
          spark = SparkSession.builder.appName("DeltaLoad").getOrCreate()
          _opts = {}
          if DELTA_VERSION is not None:
              _opts = {"versionAsOf": str(DELTA_VERSION)}
          elif DELTA_TIMESTAMP is not None:
              _opts = {"timestampAsOf": DELTA_TIMESTAMP}
          sdf = spark.read.format("delta").options(**_opts).load(DELTA_TABLE_PATH)
          df  = sdf.toPandas()
          print(f"Shape : {df.shape}")

      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.copy()
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"path": DELTA_TABLE_PATH, "version": DELTA_VERSION,
              "timestamp": DELTA_TIMESTAMP, "shape": df.shape}

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
      print(df.head(3))

  - id: apache_iceberg
    name: "Apache Iceberg"
    enabled: true
    category: "Lakehouse"
    format: "Iceberg Table (Parquet + metadata JSON)"
    description: >
      Lecture d'une table Iceberg via PyIceberg (sans Spark).
      Support des snapshots, schema evolution et hidden partitioning.
    code_template: |
      import pandas as pd
      import numpy as np
      from pyiceberg.catalog import load_catalog

      # ── Paramètres ────────────────────────────────────────────────────
      CATALOG_TYPE = "rest"       # "rest", "hive", "glue", "sql", "hadoop"
      CATALOG_URI  = "http://localhost:8181"
      NAMESPACE    = "default"
      TABLE        = "my_table"
      SNAPSHOT_ID  = None         # int ou None = latest
      TARGET_COL   = None         # None si non supervisé

      # ── Chargement ────────────────────────────────────────────────────
      catalog = load_catalog(CATALOG_TYPE, **{"uri": CATALOG_URI})
      table   = catalog.load_table(f"{NAMESPACE}.{TABLE}")
      print(f"Schema : {table.schema()}")
      print(f"Snapshots : {len(table.history())}")

      scan = table.scan()
      if SNAPSHOT_ID is not None:
          scan = table.scan(snapshot_id=SNAPSHOT_ID)

      df = scan.to_arrow().to_pandas()
      print(f"Shape : {df.shape}")

      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[TARGET_COL])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.copy()
          y         = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"namespace": NAMESPACE, "table": TABLE,
              "snapshot_id": SNAPSHOT_ID, "shape": df.shape}

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
      print(df.head(3))


