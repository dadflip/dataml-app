    - id: financial_data
      contract: tabular
      name: "Données Financières (yfinance)"
      category: "Séries Temporelles"
      format: "API / DataFrame OHLCV"
      description: "Téléchargement de cours boursiers via yfinance avec indicateurs techniques."
      use_cases: ["prévision de prix", "détection d'anomalies financières"]
      pros: ["gratuit", "historique long", "multi-actifs"]
      cons: ["qualité variable", "délai ~15min"]
      # Indicateurs :
      #   Rendement    : r_t = (P_t - P_{t-1}) / P_{t-1}
      #   Log-rendement: ln(P_t / P_{t-1})
      #   MA_k         : moyenne glissante sur k périodes
      #   Volatilité   : std des rendements sur 20 périodes
      #   RSI(14)      : 100 - 100/(1 + mean_gain/mean_loss)
      code_template: |
        import yfinance as yf, pandas as pd, numpy as np

        # ── Paramètres ──────────────────────────────────────────────────
        TICKER     = "AAPL"
        START_DATE = "2020-01-01"; END_DATE = "2024-12-31"
        INTERVAL   = "1d"
        TARGET_COL = "Close"
        TEST_RATIO = 0.2; HORIZON = 30

        ticker = yf.Ticker(TICKER)
        df = ticker.history(start=START_DATE, end=END_DATE, interval=INTERVAL)
        df["returns"]     = df["Close"].pct_change()
        df["log_returns"] = np.log(df["Close"] / df["Close"].shift(1))
        df["MA_20"]       = df["Close"].rolling(20).mean()
        df["MA_50"]       = df["Close"].rolling(50).mean()
        df["volatility"]  = df["returns"].rolling(20).std()
        df["RSI"] = 100 - (100 / (1 + df["returns"].clip(lower=0).rolling(14).mean()
                                     / (-df["returns"].clip(upper=0)).rolling(14).mean()))
        df = df.dropna()

        feat_cols = [c for c in ["Open","High","Low","Close","Volume",
                                  "MA_20","MA_50","volatility","RSI"] if c in df.columns]
        X = df[feat_cols]; y = df[TARGET_COL]
        feature_names = feat_cols; target_name = TARGET_COL; task_type = "timeseries"

        n_test = int(len(df) * TEST_RATIO)
        y_train = y.iloc[:-n_test]; y_test = y.iloc[-n_test:]
        dates_train  = y_train.index
        dates_future = pd.date_range(start=y_test.index[-1], periods=HORIZON+1, freq=INTERVAL)[1:]
        meta = {"ticker": TICKER, "interval": INTERVAL, "shape": df.shape, "horizon": HORIZON}

        contract    = "tabular"
        texts_train = []; texts_test = []
        durations   = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | n_train={len(y_train)} | n_test={len(y_test)} | horizon={HORIZON}")
        print(df.tail(5))

    - id: netcdf_xarray
      contract: tabular
      name: "NetCDF / Zarr (xarray → DataFrame tabulaire)"
      category: "Séries Temporelles / Géospatial"
      format: "NetCDF-3/4 . Zarr . OpenDAP"
      description: >
        Chargement xarray et conversion en DataFrame tabulaire par empilement
        des dimensions (lat × lon × time → lignes). Adapté aux features
        climatiques pour modèles ML classiques.
        Pour les séquences temporelles DL, utiliser netcdf_sequence (SEQUENCE).
      use_cases: ["ERA5 / CMIP6 features tabulaires", "données satellite aplaties", "séries météo ML"]
      pros: ["lazy loading dask", "accès OpenDAP distant", "CF-conventions"]
      cons: ["stacking → DataFrames très larges", "NaN côtiers/masques"]
      # Empilement xarray → DataFrame :
      #   ds.to_dataframe() empile (lat, lon, time) en MultiIndex
      #   .reset_index() aplatit pour obtenir des colonnes ML-compatibles
      code_template: |
        import xarray as xr, numpy as np, pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH     = "data/climate.nc"
        VARIABLES     = None        # liste ou None = toutes
        TARGET_VAR    = None        # variable cible — None = non supervisé
        LAZY          = True
        TIME_SLICE    = None        # slice("2020-01","2023-12")
        RESAMPLE_FREQ = None        # "ME","YE","6h" ou None
        DROPNA        = True
        MAX_ROWS      = 100_000

        open_kw = {"engine": "zarr"} if str(FILE_PATH).endswith(".zarr") else {}
        if LAZY: open_kw["chunks"] = "auto"
        ds = xr.open_dataset(FILE_PATH, **open_kw)
        print(f"Dims : {dict(ds.dims)} | Vars : {list(ds.data_vars)}")
        if VARIABLES: ds = ds[VARIABLES]
        if TIME_SLICE and "time" in ds.dims: ds = ds.sel(time=TIME_SLICE)
        if RESAMPLE_FREQ and "time" in ds.dims: ds = ds.resample(time=RESAMPLE_FREQ).mean()

        df = ds.to_dataframe()
        if LAZY: df = df.compute()
        df = df.reset_index()
        if DROPNA: df = df.dropna()
        if MAX_ROWS and len(df) > MAX_ROWS:
            df = df.sample(MAX_ROWS, random_state=42).reset_index(drop=True)

        coord_cols = [c for c in ["time","lat","lon","latitude","longitude","level"] if c in df.columns]
        var_cols   = [c for c in df.columns if c in list(ds.data_vars)]
        if TARGET_VAR and TARGET_VAR in df.columns:
            X = df[[c for c in var_cols+coord_cols if c != TARGET_VAR]]
            y = df[TARGET_VAR]
            task_type = "regression" if y.nunique() > 50 else "classification"
        else:
            X = df[var_cols] if var_cols else df.drop(columns=coord_cols, errors="ignore")
            y = None; task_type = "clustering"

        feature_names = X.columns.tolist(); target_name = TARGET_VAR
        meta = {"dims": dict(ds.dims), "variables": list(ds.data_vars), "shape": df.shape, "ds": ds}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

