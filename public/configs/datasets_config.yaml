      # synthesizer = GaussianCopulaSynthesizer(metadata)
      # synthesizer.fit(real_df)
      # synthetic_df = synthesizer.sample(num_rows=N)

      X = df.drop(columns=["target"])
      y_series = df["target"]
      feature_names = X.columns.tolist()
      target_name   = "target"
