    - id: matlab_mat_vision
      contract: vision
      name: "Fichier MATLAB .mat — images + labels (Oxford Flowers style)"
      category: "Vision — Scientifique"
      format: "MAT-file v5 (scipy) + JPEG (dossier jpg/)"
      description: >
        Chargement de datasets académiques dont les images sont des fichiers JPEG
        et les labels/splits sont dans des fichiers .mat (Oxford Flowers 102,
        Stanford Cars, FGVC-Aircraft...).
      use_cases:
        - "Oxford 102 Flowers (imagelabels.mat + setid.mat)"
        - "Stanford Cars (cars_annos.mat)"
        - "FGVC-Aircraft (variants.mat)"
        - "tout dataset académique avec .mat de labels"
      # Structure Oxford Flowers 102 :
      #   DATA_DIR/
      #     jpg/image_00001.jpg ... image_08189.jpg
      #     imagelabels.mat  → 'labels'  (1,8189) valeurs 1..102
      #     setid.mat        → 'trnid','valid','tstid' (1-based)
      code_template: |
        import numpy as np, pandas as pd, scipy.io, os
        from PIL import Image

        # ── Paramètres ──────────────────────────────────────────────────
        DATA_DIR      = "data/flowers102/"
        IMG_DIR       = os.path.join(DATA_DIR, "jpg")
        LABELS_MAT    = os.path.join(DATA_DIR, "imagelabels.mat")
        SETID_MAT     = os.path.join(DATA_DIR, "setid.mat")
        DIST_MAT      = os.path.join(DATA_DIR, "D_hsv.mat")   # optionnel
        LABELS_KEY    = "labels"     # clé dans LABELS_MAT
        IMG_SIZE      = 224
        NORMALIZE     = True
        MAX_IMAGES    = None         # None = tout
        BATCH_SIZE    = 32; NUM_WORKERS = 4
        IMG_PATTERN   = "image_{idx:05d}.jpg"   # pattern nom de fichier (1-indexed)

        _MEAN = np.array([0.485,0.456,0.406],dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225],dtype=np.float32)

        def load_img(idx_0based):
            fname = IMG_PATTERN.format(idx=idx_0based+1)
            arr   = np.array(Image.open(os.path.join(IMG_DIR,fname)).convert("RGB")
                             .resize((IMG_SIZE,IMG_SIZE)), dtype=np.float32) / 255.0
            return (arr-_MEAN)/_STD if NORMALIZE else arr

        # ── Labels (1-indexed → 0-indexed) ────────────────────────────
        labels_mat = scipy.io.loadmat(LABELS_MAT, squeeze_me=True)
        labels_all = labels_mat[LABELS_KEY].ravel() - 1   # 0..n_classes-1
        n_total    = len(labels_all)
        n_classes  = int(labels_all.max()) + 1
        print(f"Images : {n_total} | Classes : {n_classes}")

        # ── Split officiel ou aléatoire ────────────────────────────────
        if os.path.isfile(SETID_MAT):
            setid   = scipy.io.loadmat(SETID_MAT, squeeze_me=True)
            idx_trn = setid["trnid"].ravel() - 1
            idx_val = setid["valid"].ravel() - 1
            idx_tst = setid["tstid"].ravel() - 1
            print(f"Split officiel : train={len(idx_trn)} val={len(idx_val)} test={len(idx_tst)}")
        else:
            perm    = np.random.default_rng(42).permutation(n_total)
            n_tst   = int(n_total*0.2); n_val = int(n_total*0.1)
            idx_tst = perm[:n_tst]; idx_val = perm[n_tst:n_tst+n_val]
            idx_trn = perm[n_tst+n_val:]
            print("Split aléatoire 70/10/20 (setid.mat absent)")

        all_indices = np.concatenate([idx_trn, idx_val, idx_tst])
        if MAX_IMAGES: all_indices = all_indices[:MAX_IMAGES]

        print(f"Chargement de {len(all_indices)} images...")
        imgs=[]; lbls=[]; split_tags=[]
        set_trn=set(idx_trn); set_val=set(idx_val); set_tst=set(idx_tst)
        for i_abs in all_indices:
            try:
                imgs.append(load_img(i_abs)); lbls.append(labels_all[i_abs])
                split_tags.append("train" if i_abs in set_trn
                                  else "val" if i_abs in set_val else "test")
            except Exception as e: print(f"Image {i_abs} ignorée : {e}")

        imgs = np.array(imgs,dtype=np.float32); lbls = np.array(lbls,dtype=np.int64)
        split_tags = np.array(split_tags)
        images_train = imgs[split_tags=="train"]; labels_train = lbls[split_tags=="train"]
        images_test  = imgs[split_tags=="test"];  labels_test  = lbls[split_tags=="test"]
        _val_imgs    = imgs[split_tags=="val"];   _val_lbls    = lbls[split_tags=="val"]

        # ── Matrice de distance optionnelle ───────────────────────────
        dist_matrix = None
        if os.path.isfile(DIST_MAT):
            dm = scipy.io.loadmat(DIST_MAT, squeeze_me=True)
            dk = [k for k in dm if not k.startswith("_")][0]
            dist_matrix = dm[dk]; print(f"Matrice distance '{dk}' : {dist_matrix.shape}")

        img_shape   = (IMG_SIZE, IMG_SIZE, 3)
        class_names = [str(i) for i in range(n_classes)]
        split_indices = {"train": np.where(split_tags=="train")[0],
                         "val":   np.where(split_tags=="val")[0],
                         "test":  np.where(split_tags=="test")[0]}
        transforms  = {"train": None, "test": None}
        task_type   = "image_classification"
        target_name = "label"
        meta = {"dataset": DATA_DIR, "n_classes": n_classes, "img_shape": img_shape,
                "normalize": NORMALIZE, "class_names": class_names,
                "n_train": len(images_train), "n_val": len(_val_imgs), "n_test": len(images_test),
                "val_images": _val_imgs, "val_labels": _val_lbls,
                "dist_matrix": dist_matrix,
                "official_split": os.path.isfile(SETID_MAT)}

        dl_train=None; dl_test=None
        try:
            import torch
            from torch.utils.data import TensorDataset, DataLoader
            def _dl(im,lb,sh): return DataLoader(
                TensorDataset(torch.from_numpy(im).permute(0,3,1,2),torch.from_numpy(lb).long()),
                batch_size=BATCH_SIZE,shuffle=sh,num_workers=NUM_WORKERS)
            dl_train=_dl(images_train,labels_train,True); dl_test=_dl(images_test,labels_test,False)
        except ImportError: pass

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | val={len(_val_imgs)} | test={len(images_test)}")

    - id: hdf5_vision
      contract: vision
      name: "HDF5 — tenseur images (N,H,W,C) ou (N,C,H,W)"
      category: "Vision — Scientifique"
      format: "HDF5 (.h5 / .hdf5)"
      description: >
        Chargement d'un tenseur d'images stocké en HDF5.
        Gère les formats (N,H,W,C) et (N,C,H,W) avec détection automatique.
      use_cases:
        - "datasets prépackagés en HDF5 (h5py, Keras)"
        - "données médicales (IRM, scanner) — NIfTI dérivés"
        - "datasets satellites prétraités"
      code_template: |
        import h5py, numpy as np, pandas as pd
        from PIL import Image

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH    = "data/images.h5"
        X_KEY        = "images"     # clé tenseur images
        Y_KEY        = "labels"     # None si non supervisé
        IMG_SIZE     = None         # None = garder taille native ; int = redimensionner
        NORMALIZE    = True
        TEST_RATIO   = 0.2; SEED = 42
        BATCH_SIZE   = 32; NUM_WORKERS = 4
        MAX_IMAGES   = None

        _MEAN = np.array([0.485,0.456,0.406],dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225],dtype=np.float32)

        def _list_h5(f):
            leaves={}
            def v(name,obj):
                if isinstance(obj,h5py.Dataset): leaves[name]=(obj.shape,str(obj.dtype))
            f.visititems(v); return leaves

        with h5py.File(FILE_PATH,"r") as f:
            print("─── Structure HDF5 ───")
            for path,(shape,dtype) in sorted(_list_h5(f).items()):
                print(f"  /{path}  shape={shape}  dtype={dtype}")
            imgs_raw = f[X_KEY][()]
            y_raw    = f[Y_KEY][()] if Y_KEY and Y_KEY in f else None
            if MAX_IMAGES: imgs_raw=imgs_raw[:MAX_IMAGES]; y_raw=(y_raw[:MAX_IMAGES] if y_raw is not None else None)

        # ── Normalisation de la forme : toujours (N,H,W,C) ────────────
        if imgs_raw.ndim == 3:                         # (N,H,W) → (N,H,W,1)
            imgs_raw = imgs_raw[..., np.newaxis]
        if imgs_raw.shape[1] in (1,3,4) and imgs_raw.shape[1] < imgs_raw.shape[2]:
            imgs_raw = imgs_raw.transpose(0,2,3,1)     # (N,C,H,W) → (N,H,W,C)
        print(f"Tenseur normalisé (N,H,W,C) : {imgs_raw.shape}")

        # ── Redimensionnement si demandé ───────────────────────────────
        if IMG_SIZE and imgs_raw.shape[1] != IMG_SIZE:
            resized = np.zeros((len(imgs_raw),IMG_SIZE,IMG_SIZE,imgs_raw.shape[3]),dtype=np.float32)
            for i,img in enumerate(imgs_raw):
                pil = Image.fromarray((img*255).astype(np.uint8) if img.max()<=1 else img.astype(np.uint8))
                resized[i] = np.array(pil.resize((IMG_SIZE,IMG_SIZE)),dtype=np.float32)/255.0
            imgs_raw = resized
        else:
            imgs_raw = imgs_raw.astype(np.float32)
            if imgs_raw.max() > 1.0: imgs_raw /= 255.0

        if NORMALIZE: imgs_raw = (imgs_raw - _MEAN) / _STD

        # ── Split ─────────────────────────────────────────────────────
        rng = np.random.default_rng(SEED); perm=rng.permutation(len(imgs_raw))
        n_test = int(len(imgs_raw)*TEST_RATIO)
        idx_test=perm[:n_test]; idx_train=perm[n_test:]
        images_train=imgs_raw[idx_train]; images_test=imgs_raw[idx_test]
        labels_train=(y_raw[idx_train].ravel().astype(np.int64) if y_raw is not None else None)
        labels_test =(y_raw[idx_test].ravel().astype(np.int64)  if y_raw is not None else None)

        n_classes   = int(labels_train.max()+1) if labels_train is not None else None
        class_names = [str(i) for i in range(n_classes)] if n_classes else None
        img_shape   = tuple(images_train.shape[1:])
        split_indices = {"train":idx_train,"val":np.array([]),"test":idx_test}
        transforms  = {"train":None,"test":None}
        task_type   = "image_classification" if labels_train is not None else "image_clustering"
        target_name = "label"
        meta = {"file": FILE_PATH,"x_key": X_KEY,"y_key": Y_KEY,
                "n_classes": n_classes,"img_shape": img_shape,
                "normalize": NORMALIZE,"shape": imgs_raw.shape}

        dl_train=None; dl_test=None
        try:
            import torch
            from torch.utils.data import TensorDataset, DataLoader
            def _dl(im,lb,sh): return DataLoader(
                TensorDataset(torch.from_numpy(im).permute(0,3,1,2),
                              torch.from_numpy(lb).long() if lb is not None
                              else torch.zeros(len(im),dtype=torch.long)),
                batch_size=BATCH_SIZE,shuffle=sh,num_workers=NUM_WORKERS)
            dl_train=_dl(images_train,labels_train,True); dl_test=_dl(images_test,labels_test,False)
        except ImportError: pass

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | test={len(images_test)}")

    - id: numpy_npz_vision
      contract: vision
      name: "NumPy .npz — tenseur images (MNIST style)"
      category: "Vision — Scientifique"
      format: "npz (archive multi-tableaux)"
      description: >
        Chargement d'un tenseur images depuis un .npz.
        Compatible avec MNIST, Fashion-MNIST, CIFAR-10 en format NumPy.
      use_cases:
        - "MNIST (x_train.npy + y_train.npy)"
        - "Fashion-MNIST, KMNIST"
        - "datasets prépackagés NumPy"
        - "exports de pipelines d'augmentation"
      # Convention MNIST npz :
      #   x_train (60000,28,28) uint8  y_train (60000,) uint8
      #   x_test  (10000,28,28) uint8  y_test  (10000,) uint8
      code_template: |
        import numpy as np, pandas as pd
        from PIL import Image

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/mnist.npz"
        X_TRAIN_KEY = "x_train"; Y_TRAIN_KEY = "y_train"
        X_TEST_KEY  = "x_test";  Y_TEST_KEY  = "y_test"
        # Si pas de split natif, laisser TEST_KEYS vides et utiliser TEST_RATIO
        HAS_NATIVE_SPLIT = True
        TEST_RATIO = 0.2; SEED = 42
        IMG_SIZE   = None    # None = taille native ; int = resize
        NORMALIZE  = True    # normalisation ImageNet ou [0,1] selon n_channels
        BATCH_SIZE = 64; NUM_WORKERS = 4

        _MEAN = np.array([0.485,0.456,0.406],dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225],dtype=np.float32)

        archive = np.load(FILE_PATH, allow_pickle=False)
        print(f"Clés .npz : {list(archive.files)}")

        if HAS_NATIVE_SPLIT:
            X_tr = archive[X_TRAIN_KEY]; y_tr = archive[Y_TRAIN_KEY]
            X_te = archive[X_TEST_KEY];  y_te = archive[Y_TEST_KEY]
        else:
            _xc = ["X","x","data","images","x_train"]
            _yc = ["y","labels","label","y_train"]
            xk  = next((k for k in _xc if k in archive.files), archive.files[0])
            yk  = next((k for k in _yc if k in archive.files), None)
            X_all = archive[xk]; y_all = archive[yk] if yk else None
            rng = np.random.default_rng(SEED); perm=rng.permutation(len(X_all))
            n_te = int(len(X_all)*TEST_RATIO)
            X_tr,X_te = X_all[perm[n_te:]], X_all[perm[:n_te]]
            y_tr,y_te = ((y_all[perm[n_te:]],y_all[perm[:n_te]]) if y_all is not None else (None,None))

        def prep(arr):
            """(N,H,W) ou (N,H,W,C) ou (N,C,H,W) → (N,H,W,C) float32 [0,1]"""
            if arr.ndim == 3: arr = arr[...,np.newaxis]    # grayscale → channel last
            if arr.shape[1] in (1,3) and arr.shape[1]<arr.shape[2]:
                arr = arr.transpose(0,2,3,1)               # NCHW → NHWC
            arr = arr.astype(np.float32)
            if arr.max() > 1.0: arr /= 255.0
            if IMG_SIZE and arr.shape[1] != IMG_SIZE:
                resized = np.zeros((len(arr),IMG_SIZE,IMG_SIZE,arr.shape[3]),dtype=np.float32)
                for i,img in enumerate(arr):
                    resized[i] = np.array(Image.fromarray((img.squeeze()*255).astype(np.uint8))
                                          .convert("RGB").resize((IMG_SIZE,IMG_SIZE)),dtype=np.float32)/255.0
                arr = resized
            if arr.shape[3] == 1: arr = np.repeat(arr,3,axis=3)   # grey→RGB si normalize ImageNet
            return (arr-_MEAN)/_STD if NORMALIZE else arr

        images_train = prep(X_tr); images_test = prep(X_te)
        labels_train = y_tr.ravel().astype(np.int64) if y_tr is not None else None
        labels_test  = y_te.ravel().astype(np.int64) if y_te is not None else None

        n_classes   = int(labels_train.max()+1) if labels_train is not None else None
        class_names = [str(i) for i in range(n_classes)] if n_classes else None
        img_shape   = tuple(images_train.shape[1:])
        split_indices = {"train":np.arange(len(images_train)),"val":np.array([]),
                         "test": np.arange(len(images_test))}
        transforms  = {"train":None,"test":None}
        task_type   = "image_classification" if labels_train is not None else "image_clustering"
        target_name = "label"
        meta = {"file": FILE_PATH,"n_classes": n_classes,"img_shape": img_shape,
                "normalize": NORMALIZE,"shape": images_train.shape}

        dl_train=None; dl_test=None
        try:
            import torch
            from torch.utils.data import TensorDataset, DataLoader
            def _dl(im,lb,sh): return DataLoader(
                TensorDataset(torch.from_numpy(im).permute(0,3,1,2),
                              torch.from_numpy(lb).long() if lb is not None
                              else torch.zeros(len(im),dtype=torch.long)),
                batch_size=BATCH_SIZE,shuffle=sh,num_workers=NUM_WORKERS)
            dl_train=_dl(images_train,labels_train,True); dl_test=_dl(images_test,labels_test,False)
        except ImportError: pass

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | test={len(images_test)}")

    benchmark:

    - id: torchvision_datasets
      contract: vision
      name: "Torchvision Datasets (CIFAR-10/100, STL-10, ImageNet, ...)"
      category: "Vision — Benchmark"
      format: "torchvision.datasets"
      description: >
        Chargement de datasets vision de référence via torchvision avec
        transforms augmentation train/test et DataLoaders prêts à l'emploi.
      use_cases:
        - "CIFAR-10, CIFAR-100, STL-10, SVHN"
        - "Flowers102, Food101, EuroSAT, DTD"
        - "ImageNet (nécessite téléchargement manuel)"
        - "benchmark transfer learning"
      code_template: |
        import numpy as np, pandas as pd
        import torchvision.transforms as T
        import torchvision.datasets as tvd
        from torch.utils.data import DataLoader
        import torch

        # ── Paramètres ──────────────────────────────────────────────────
        DATASET_NAME = "CIFAR10"
        # CIFAR10, CIFAR100, STL10, SVHN, Flowers102, Food101, EuroSAT, DTD
        # ImageNet (root = chemin du dossier ILSVRC), MNIST, FashionMNIST
        DATA_ROOT   = "./data/torchvision"
        IMG_SIZE    = 224
        BATCH_SIZE  = 64; NUM_WORKERS = 4
        DOWNLOAD    = True
        AUGMENT_TRAIN = True    # RandomCrop + HorizontalFlip pour train

        _MEAN = [0.485,0.456,0.406]; _STD = [0.229,0.224,0.225]

        train_transform = T.Compose([
            T.Resize(256), T.RandomCrop(IMG_SIZE), T.RandomHorizontalFlip(),
            T.ToTensor(), T.Normalize(_MEAN, _STD)
        ] if AUGMENT_TRAIN else [T.Resize(IMG_SIZE), T.CenterCrop(IMG_SIZE),
                                  T.ToTensor(), T.Normalize(_MEAN, _STD)])
        test_transform = T.Compose([T.Resize(256), T.CenterCrop(IMG_SIZE),
                                     T.ToTensor(), T.Normalize(_MEAN, _STD)])

        DatasetClass = getattr(tvd, DATASET_NAME)
        try:
            train_ds = DatasetClass(root=DATA_ROOT, train=True,  transform=train_transform, download=DOWNLOAD)
            test_ds  = DatasetClass(root=DATA_ROOT, train=False, transform=test_transform,  download=DOWNLOAD)
        except TypeError:
            train_ds = DatasetClass(root=DATA_ROOT, split="train", transform=train_transform, download=DOWNLOAD)
            test_ds  = DatasetClass(root=DATA_ROOT, split="test",  transform=test_transform,  download=DOWNLOAD)

        dl_train = DataLoader(train_ds, batch_size=BATCH_SIZE, shuffle=True,  num_workers=NUM_WORKERS, pin_memory=True)
        dl_test  = DataLoader(test_ds,  batch_size=BATCH_SIZE, shuffle=False, num_workers=NUM_WORKERS, pin_memory=True)

        # ── Extraction d'un sous-ensemble NumPy pour meta ────────────
        N_PREVIEW = min(1000, len(train_ds))
        preview_loader = DataLoader(train_ds, batch_size=N_PREVIEW, shuffle=False, num_workers=2)
        _imgs_preview, _lbls_preview = next(iter(preview_loader))
        images_train = _imgs_preview.permute(0,2,3,1).numpy()   # NCHW→NHWC pour contrat
        labels_train = _lbls_preview.numpy()
        # images_test / labels_test : extrait pareil en production — DataLoader suffit pour DL
        _test_loader_preview = DataLoader(test_ds, batch_size=min(500,len(test_ds)), shuffle=False)
        _t_imgs, _t_lbls = next(iter(_test_loader_preview))
        images_test = _t_imgs.permute(0,2,3,1).numpy()
        labels_test = _t_lbls.numpy()

        class_names = (train_ds.classes if hasattr(train_ds,"classes") else
                       [str(i) for i in range(len(train_ds.class_to_idx))] if hasattr(train_ds,"class_to_idx") else None)
        n_classes   = len(class_names) if class_names else None
        img_shape   = (IMG_SIZE, IMG_SIZE, 3)
        split_indices = {"train": np.arange(len(train_ds)), "val": np.array([]),
                         "test":  np.arange(len(test_ds))}
        transforms  = {"train": train_transform, "test": test_transform}
        task_type   = "image_classification"
        target_name = "label"
        meta = {"dataset": DATASET_NAME, "n_classes": n_classes, "img_shape": img_shape,
                "n_train": len(train_ds), "n_test": len(test_ds),
                "augment_train": AUGMENT_TRAIN, "class_names": class_names}

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(train_ds)} | test={len(test_ds)}")
        print(f"         class_names={class_names[:5] if class_names else 'N/A'}")

    - id: huggingface_vision
      contract: vision
      name: "Hugging Face Datasets — Vision (image classification)"
      category: "Vision — Benchmark"
      format: "Arrow / Parquet (HuggingFace Hub)"
      description: >
        Chargement de datasets image depuis le Hub HuggingFace.
        Conversion automatique PIL → NumPy (N,H,W,C) avec normalisation.
      use_cases:
        - "beans, cats_vs_dogs, oxford_flowers102 (HF version)"
        - "food101, stanford-dogs, oxford-iiit-pet"
        - "datasets personnels poussés sur le Hub"
      code_template: |
        import numpy as np, pandas as pd
        from datasets import load_dataset
        from PIL import Image
        import torch
        from torch.utils.data import DataLoader

        # ── Paramètres ──────────────────────────────────────────────────
        DATASET_NAME  = "beans"
        SUBSET        = None
        IMG_SIZE      = 224
        NORMALIZE     = True
        IMAGE_COL     = "image"
        LABEL_COL     = "labels"
        BATCH_SIZE    = 32; NUM_WORKERS = 4
        STREAMING     = False

        _MEAN = np.array([0.485,0.456,0.406],dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225],dtype=np.float32)

        def pil_to_arr(pil_img):
            arr = np.array(pil_img.convert("RGB").resize((IMG_SIZE,IMG_SIZE)),dtype=np.float32)/255.0
            return (arr-_MEAN)/_STD if NORMALIZE else arr

        dataset = load_dataset(DATASET_NAME, SUBSET, streaming=STREAMING)
        print(dataset)

        def process_split(split_name):
            if split_name not in dataset: return np.array([]),np.array([])
            split = dataset[split_name]
            if STREAMING: split = list(split.take(2000))
            imgs=[]; lbls=[]
            for ex in (split if STREAMING else split):
                try:
                    pil = ex[IMAGE_COL] if isinstance(ex[IMAGE_COL],Image.Image) else Image.open(ex[IMAGE_COL])
                    imgs.append(pil_to_arr(pil))
                    if LABEL_COL in ex: lbls.append(ex[LABEL_COL])
                except Exception as e: print(f"Ignorée : {e}")
            return np.array(imgs,dtype=np.float32), np.array(lbls,dtype=np.int64) if lbls else None

        print("Traitement train..."); images_train, labels_train = process_split("train")
        print("Traitement test...");  images_test,  labels_test  = process_split("test")

        # Noms de classes
        class_names = None
        if LABEL_COL in dataset["train"].features and hasattr(dataset["train"].features[LABEL_COL],"names"):
            class_names = dataset["train"].features[LABEL_COL].names
        n_classes = len(class_names) if class_names else (
            int(labels_train.max()+1) if labels_train is not None and len(labels_train)>0 else None)

        img_shape = (IMG_SIZE, IMG_SIZE, 3)
        split_indices = {"train": np.arange(len(images_train)), "val": np.array([]),
                         "test":  np.arange(len(images_test))}
        transforms  = {"train": None, "test": None}
        task_type   = "image_classification"
        target_name = "label"
        meta = {"dataset": DATASET_NAME, "n_classes": n_classes, "img_shape": img_shape,
                "class_names": class_names, "n_train": len(images_train), "n_test": len(images_test)}

        dl_train=None; dl_test=None
        try:
            from torch.utils.data import TensorDataset
            def _dl(im,lb,sh): return DataLoader(
                TensorDataset(torch.from_numpy(im).permute(0,3,1,2),
                              torch.from_numpy(lb).long() if lb is not None
                              else torch.zeros(len(im),dtype=torch.long)),
                batch_size=BATCH_SIZE,shuffle=sh,num_workers=NUM_WORKERS)
            dl_train=_dl(images_train,labels_train,True); dl_test=_dl(images_test,labels_test,False)
        except Exception: pass

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | test={len(images_test)}")

