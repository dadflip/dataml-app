audio:
# ──────────────────────────────────────────────────────────────────────────

  - id: audio_features
    name: "Audio (WAV / MP3 / FLAC) → Features MFCC / Spectrogramme"
    enabled: true
    category: "Audio"
    format: "WAV · MP3 · FLAC · OGG"
    description: >
      Extraction de features audio (MFCC, chroma, spectral centroid,
      mel-spectrogramme, ZCR, RMS) depuis des fichiers audio ou un dossier.
    use_cases:
      - "classification de sons / musique / parole"
      - "détection d'anomalies sonores (maintenance)"
      - "émotion vocale, qualité audio"
      - "UrbanSound8K, GTZAN, ESC-50"
    code_template: |
      import librosa
      import numpy as np
      import pandas as pd
      import os
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_source      = widgets.ToggleButtons(
          options=["Dossier structuré par classe", "Fichier unique"],
          description="SOURCE:", style={"description_width": "130px"})
      w_path        = widgets.Text(value="data/audio_dataset/",
                                   description="AUDIO_DIR:", style={"description_width": "150px"},
                                   layout=widgets.Layout(width="450px"),
                                   placeholder="sous-dossiers = classes")
      w_file        = widgets.Text(value="audio.wav",
                                   description="AUDIO_FILE:", style={"description_width": "150px"},
                                   layout=widgets.Layout(width="450px"))
      w_file.layout.visibility = "hidden"
      w_sr          = widgets.IntSlider(value=22050, min=8000, max=48000, step=1000,
                                        description="SR:", style={"description_width": "150px"})
      w_n_mfcc      = widgets.IntSlider(value=40, min=13, max=128, step=1,
                                        description="N_MFCC:", style={"description_width": "150px"})
      w_n_fft       = widgets.Dropdown(options=[512, 1024, 2048, 4096],
                                       value=2048, description="N_FFT:",
                                       style={"description_width": "150px"})
      w_hop         = widgets.Dropdown(options=[128, 256, 512, 1024],
                                       value=512, description="HOP_LENGTH:",
                                       style={"description_width": "150px"})
      w_duration    = widgets.FloatText(value=0.0, description="DURATION (s, 0=tout):",
                                        style={"description_width": "150px"})
      w_run         = widgets.Button(description="▶ Extraire features", button_style="success",
                                     layout=widgets.Layout(width="180px"))
      out           = widgets.Output()

      def on_source_change(change):
          is_file = change["new"] == "Fichier unique"
          w_path.layout.visibility = "hidden" if is_file else "visible"
          w_file.layout.visibility = "visible" if is_file else "hidden"

      w_source.observe(on_source_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🎵 Audio Features — Paramètres</b>"),
          w_source, w_path, w_file,
          widgets.HBox([w_sr, w_n_mfcc]),
          widgets.HBox([w_n_fft, w_hop, w_duration]),
          w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              SOURCE     = w_source.value
              AUDIO_DIR  = w_path.value.strip()
              AUDIO_FILE = w_file.value.strip()
              SR         = w_sr.value
              N_MFCC     = w_n_mfcc.value
              N_FFT      = w_n_fft.value
              HOP_LENGTH = w_hop.value
              DURATION   = w_duration.value or None

              def extract_features(filepath):
                  y_audio, _sr = librosa.load(filepath, sr=SR, duration=DURATION, mono=True)
                  mfcc      = librosa.feature.mfcc(y=y_audio, sr=SR, n_mfcc=N_MFCC,
                                                   n_fft=N_FFT, hop_length=HOP_LENGTH)
                  chroma    = librosa.feature.chroma_stft(y=y_audio, sr=SR)
                  spec_cent = librosa.feature.spectral_centroid(y=y_audio, sr=SR)
                  spec_bw   = librosa.feature.spectral_bandwidth(y=y_audio, sr=SR)
                  rolloff   = librosa.feature.spectral_rolloff(y=y_audio, sr=SR)
                  zcr       = librosa.feature.zero_crossing_rate(y_audio)
                  rms       = librosa.feature.rms(y=y_audio)
                  row = {}
                  for i in range(N_MFCC):
                      row[f"mfcc_{i}_mean"] = mfcc[i].mean()
                      row[f"mfcc_{i}_std"]  = mfcc[i].std()
                  row["chroma_mean"]    = chroma.mean()
                  row["chroma_std"]     = chroma.std()
                  row["spec_cent_mean"] = spec_cent.mean()
                  row["spec_bw_mean"]   = spec_bw.mean()
                  row["rolloff_mean"]   = rolloff.mean()
                  row["zcr_mean"]       = zcr.mean()
                  row["rms_mean"]       = rms.mean()
                  row["duration_s"]     = len(y_audio) / SR
                  return row

              EXTS    = (".wav", ".mp3", ".flac", ".ogg", ".m4a")
              records = []

              if SOURCE == "Fichier unique":
                  records.append({**extract_features(AUDIO_FILE), "label": None,
                                  "filename": os.path.basename(AUDIO_FILE)})
              else:
                  for label in sorted(os.listdir(AUDIO_DIR)):
                      label_dir = os.path.join(AUDIO_DIR, label)
                      if not os.path.isdir(label_dir):
                          continue
                      for fname in os.listdir(label_dir):
                          if not fname.lower().endswith(EXTS):
                              continue
                          try:
                              row = extract_features(os.path.join(label_dir, fname))
                              row["label"]    = label
                              row["filename"] = fname
                              records.append(row)
                          except Exception as e:
                              print(f"⚠ {fname} : {e}")

              df = pd.DataFrame(records)
              print(f"Shape : {df.shape} | Classes : {df['label'].unique() if 'label' in df else 'N/A'}")

              _excl         = ["label", "filename"]
              X             = df.drop(columns=[c for c in _excl if c in df.columns])
              y             = df["label"] if "label" in df.columns and df["label"].notna().any() else None
              feature_names = X.columns.tolist()
              target_name   = "label"
