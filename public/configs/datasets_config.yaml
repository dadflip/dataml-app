ay="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 130 C 400 130, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 130 C 400 130, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import pandas as pd
      import json

      FILE_PATH  = "data/dataset.json"  # ou .jsonl
      TARGET_COL = "label"
      TEXT_COL   = None   # ex: "text" pour NLP
      IS_JSONL   = FILE_PATH.endswith(".jsonl")

      if IS_JSONL:
          # JSON Lines : un objet JSON par ligne
          records = []
          with open(FILE_PATH, encoding="utf-8") as f:
              for line in f:
                  records.append(json.loads(line.strip()))
          df = pd.DataFrame(records)
      else:
          df = pd.read_json(FILE_PATH, encoding="utf-8")

      # Aplatissement des colonnes imbriquées (nested dicts)
      nested_cols = [c for c in df.columns if df[c].apply(lambda x: isinstance(x, dict)).any()]
      for col in nested_cols:
          expanded = pd.json_normalize(df[col])
          expanded.columns = [f"{col}.{c}" for c in expanded.columns]
          df = pd.concat([df.drop(columns=[col]), expanded], axis=1)

      print(f"Shape : {df.shape}")

      if TARGET_COL and TARGET_COL in df.columns:
          X = df.drop(columns=[TARGET_COL])
          y = df[TARGET_COL]
          task_type = "classification" if y.dtype == object or y.nunique() < 20 else "regression"
      elif TEXT_COL:
          X = df[[TEXT_COL]]
          y = df[TARGET_COL] if TARGET_COL in df.columns else None
          task_type = "nlp"
      else:
          X = df.copy()
          y = None
          task_type = "clustering"

      feature_names = [c for c in X.columns if c != TEXT_COL]
      target_name   = TARGET_COL
      meta = {"text_col": TEXT_COL, "nested_cols_expanded": nested_cols}


