    - id: image_folder
      contract: vision
      name: "Dossier d'images structuré par classe"
      category: "Vision — Local"
      format: "JPEG / PNG / BMP (arborescence classe/image)"
      description: >
        Chargement d'images depuis un dossier organisé en sous-dossiers par
        classe. Produit le contrat VISION complet avec split train/val/test,
        normalisation et DataLoaders PyTorch optionnels.
      use_cases: ["classification fine-grained locale", "datasets personnels", "transfer learning"]
      pros: ["flexibilité totale", "augmentation facile", "torchvision compatible"]
      cons: ["lent sans GPU sur grands datasets"]
      # Structure attendue :
      #   DATA_DIR/
      #     train/  class_A/ img1.jpg ...  class_B/ ...
      #     val/    class_A/ ...           class_B/ ...
      #     test/   class_A/ ...           class_B/ ...
      #   OU
      #   DATA_DIR/
      #     class_A/ img1.jpg ...
      #     class_B/ img1.jpg ...
      code_template: |
        import numpy as np, pandas as pd, os
        from PIL import Image

        # ── Paramètres ──────────────────────────────────────────────────
        DATA_DIR    = "data/images/"
        HAS_SPLITS  = False      # True si DATA_DIR contient train/val/test
        IMG_SIZE    = 224
        NORMALIZE   = True       # normalisation ImageNet
        BATCH_SIZE  = 32
        NUM_WORKERS = 4
        VAL_RATIO   = 0.15       # ignoré si HAS_SPLITS=True
        TEST_RATIO  = 0.15       # ignoré si HAS_SPLITS=True
        SEED        = 42
        EXTS        = (".jpg",".jpeg",".png",".bmp",".webp")

        _MEAN = np.array([0.485,0.456,0.406], dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225], dtype=np.float32)

        def load_img(path):
            arr = np.array(Image.open(path).convert("RGB").resize((IMG_SIZE,IMG_SIZE)),
                           dtype=np.float32) / 255.0
            return (arr - _MEAN) / _STD if NORMALIZE else arr

        # ── Découverte des fichiers ────────────────────────────────────
        if HAS_SPLITS:
            splits_map = {"train":[], "val":[], "test":[]}
            for split in ["train","val","test"]:
                split_dir = os.path.join(DATA_DIR, split)
                if not os.path.isdir(split_dir): continue
                for cls in sorted(os.listdir(split_dir)):
                    cls_dir = os.path.join(split_dir, cls)
                    if not os.path.isdir(cls_dir): continue
                    for fname in os.listdir(cls_dir):
                        if fname.lower().endswith(EXTS):
                            splits_map[split].append((os.path.join(cls_dir,fname), cls))
            all_classes = sorted({c for entries in splits_map.values() for _,c in entries})
            cls2idx = {c:i for i,c in enumerate(all_classes)}
        else:
            all_files = []
            all_classes = sorted([d for d in os.listdir(DATA_DIR)
                                   if os.path.isdir(os.path.join(DATA_DIR,d))])
            cls2idx = {c:i for i,c in enumerate(all_classes)}
            for cls in all_classes:
                for fname in os.listdir(os.path.join(DATA_DIR,cls)):
                    if fname.lower().endswith(EXTS):
                        all_files.append((os.path.join(DATA_DIR,cls,fname), cls))
            rng = np.random.default_rng(SEED); perm = rng.permutation(len(all_files))
            n_val = int(len(all_files)*VAL_RATIO); n_test = int(len(all_files)*TEST_RATIO)
            idx_test = perm[:n_test]; idx_val = perm[n_test:n_test+n_val]
            idx_train = perm[n_test+n_val:]
            splits_map = {"train":[all_files[i] for i in idx_train],
                          "val":  [all_files[i] for i in idx_val],
                          "test": [all_files[i] for i in idx_test]}

        # ── Chargement ────────────────────────────────────────────────
        def load_split(entries):
            imgs=[]; lbls=[]
            for path, cls in entries:
                try: imgs.append(load_img(path)); lbls.append(cls2idx[cls])
                except Exception as e: print(f"Ignorée ({path}) : {e}")
            return np.array(imgs,dtype=np.float32), np.array(lbls,dtype=np.int64)

        print("Chargement train..."); images_train, labels_train = load_split(splits_map["train"])
        print("Chargement test...");  images_test,  labels_test  = load_split(splits_map["test"])
        _val_imgs, _val_lbls = load_split(splits_map["val"])
        print(f"train={len(images_train)} | val={len(_val_imgs)} | test={len(images_test)}")

        img_shape  = (IMG_SIZE, IMG_SIZE, 3)
        n_classes  = len(all_classes)
        class_names = all_classes
        split_indices = {
            "train": np.array([i for i,_ in enumerate(splits_map["train"])]),
            "val":   np.array([i for i,_ in enumerate(splits_map["val"])]),
            "test":  np.array([i for i,_ in enumerate(splits_map["test"])]),
        }
        transforms = {"train": None, "test": None}   # pipeline PIL déjà appliqué
        task_type  = "image_classification"
        target_name = "label"
        meta = {"data_dir": DATA_DIR, "n_classes": n_classes, "img_shape": img_shape,
                "normalize": NORMALIZE, "class_names": class_names,
                "n_train": len(images_train), "n_val": len(_val_imgs),
                "n_test": len(images_test), "val_images": _val_imgs, "val_labels": _val_lbls}

        # ── DataLoaders PyTorch ────────────────────────────────────────
        dl_train = None; dl_test = None
        try:
            import torch
            from torch.utils.data import TensorDataset, DataLoader
            def _dl(imgs, lbls, shuffle):
                return DataLoader(
                    TensorDataset(torch.from_numpy(imgs).permute(0,3,1,2),
                                  torch.from_numpy(lbls).long()),
                    batch_size=BATCH_SIZE, shuffle=shuffle, num_workers=NUM_WORKERS)
            dl_train = _dl(images_train, labels_train, True)
            dl_test  = _dl(images_test,  labels_test,  False)
            print(f"DataLoaders créés (batch_size={BATCH_SIZE})")
        except ImportError:
            print("PyTorch absent — dl_train/dl_test = None")

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | test={len(images_test)}")
        print(f"         class_names={class_names[:5]}{'...' if len(class_names)>5 else ''}")

    - id: lmdb_vision
      contract: vision
      name: "LMDB (Lightning Memory-Mapped Database)"
      category: "Vision — Haute Performance"
      format: "LMDB (clé/valeur binaire — JPEG bytes / numpy pickle)"
      description: >
        Chargement depuis une base LMDB. Format courant pour ImageNet, LSUN,
        CelebA-HQ. Accès O(1) via mémoire mappée.
      use_cases: ["ImageNet", "LSUN", "CelebA-HQ", "FFHQ", "pipelines haute performance"]
      pros: ["accès O(1) sans décompression totale", "lecture parallèle", "empreinte mémoire ~0"]
      cons: ["écriture lente", "map_size fixé à la création"]
      code_template: |
        import lmdb, numpy as np, pandas as pd, pickle, io
        from PIL import Image

        # ── Paramètres ──────────────────────────────────────────────────
        LMDB_PATH    = "data/images.lmdb"
        VALUE_FORMAT = "jpeg_bytes"   # "jpeg_bytes" | "numpy_pickle" | "msgpack"
        IMG_SIZE     = 224
        NORMALIZE    = True
        MAX_IMAGES   = 5000
        LABEL_KEY    = b"__labels__"  # clé spéciale labels globaux — None si absent
        TEST_RATIO   = 0.2; SEED = 42
        BATCH_SIZE   = 32; NUM_WORKERS = 4

        _MEAN = np.array([0.485,0.456,0.406],dtype=np.float32)
        _STD  = np.array([0.229,0.224,0.225],dtype=np.float32)

        def decode_value(val_bytes):
            if VALUE_FORMAT == "jpeg_bytes":
                img = Image.open(io.BytesIO(val_bytes)).convert("RGB")
                return np.array(img.resize((IMG_SIZE,IMG_SIZE)),dtype=np.float32)/255.0
            elif VALUE_FORMAT == "numpy_pickle":
                return pickle.loads(val_bytes)
            elif VALUE_FORMAT == "msgpack":
                import msgpack; return msgpack.unpackb(val_bytes, raw=False)

        env = lmdb.open(LMDB_PATH, readonly=True, lock=False, readahead=False, meminit=False)
        with env.begin(write=False) as txn:
            n_total = txn.stat()["entries"]
            if LABEL_KEY and txn.get(LABEL_KEY): n_total -= 1
            print(f"Entrées LMDB : {n_total}")
            labels_global = pickle.loads(txn.get(LABEL_KEY)) if LABEL_KEY and txn.get(LABEL_KEY) else None
            n_load = min(MAX_IMAGES, n_total) if MAX_IMAGES else n_total
            images=[]; indices=[]; cursor=txn.cursor()
            for i,(key,value) in enumerate(cursor.iternext(keys=True,values=True)):
                if key == LABEL_KEY: continue
                if len(images) >= n_load: break
                try:
                    arr = decode_value(value)
                    if isinstance(arr,np.ndarray) and arr.ndim==3 and arr.shape[2]==3:
                        if arr.shape[:2] != (IMG_SIZE,IMG_SIZE):
                            arr = np.array(Image.fromarray((arr*255).astype(np.uint8)).resize((IMG_SIZE,IMG_SIZE)),dtype=np.float32)/255.0
                        if NORMALIZE: arr = (arr-_MEAN)/_STD
                        images.append(arr); indices.append(int(key) if key.isdigit() else i)
                except Exception as e: print(f"Entrée {i} ignorée : {e}")
        env.close()
        images = np.array(images,dtype=np.float32)
        print(f"Images chargées : {images.shape}")

        labels_all = np.array(labels_global)[indices] if labels_global is not None else None
        rng = np.random.default_rng(SEED); perm = rng.permutation(len(images))
        n_test = int(len(images)*TEST_RATIO)
        idx_test=perm[:n_test]; idx_train=perm[n_test:]
        images_train=images[idx_train]; images_test=images[idx_test]
        labels_train=(labels_all[idx_train] if labels_all is not None else None)
        labels_test =(labels_all[idx_test]  if labels_all is not None else None)

        n_classes   = int(labels_train.max()+1) if labels_train is not None else None
        class_names = [str(i) for i in range(n_classes)] if n_classes else None
        img_shape   = (IMG_SIZE, IMG_SIZE, 3)
        split_indices = {"train": idx_train, "val": np.array([]), "test": idx_test}
        transforms  = {"train": None, "test": None}
        task_type   = "image_classification" if labels_train is not None else "image_clustering"
        target_name = "label"
        meta = {"lmdb_path": LMDB_PATH, "n_total": n_total, "img_size": IMG_SIZE,
                "value_format": VALUE_FORMAT, "n_classes": n_classes, "shape": images.shape}

        dl_train=None; dl_test=None
        try:
            import torch
            from torch.utils.data import TensorDataset, DataLoader
            def _dl(imgs,lbls,shuffle):
                t_l = torch.from_numpy(lbls).long() if lbls is not None else torch.zeros(len(imgs),dtype=torch.long)
                return DataLoader(TensorDataset(torch.from_numpy(imgs).permute(0,3,1,2),t_l),
                                  batch_size=BATCH_SIZE,shuffle=shuffle,num_workers=NUM_WORKERS)
            dl_train=_dl(images_train,labels_train,True); dl_test=_dl(images_test,labels_test,False)
        except ImportError: pass

        contract = "vision"
        print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
        print(f"         train={len(images_train)} | test={len(images_test)}")

