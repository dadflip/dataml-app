4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 148 C 400 148, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 148 C 400 148, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">target_name</text>    <path d="M 370 148 C 400 148, 420 194, 440 194" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="180" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="198" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import pandas as pd

      FILE_PATH  = "data/dataset.parquet"  # ou dossier partitionné
      TARGET_COL = "target"
      COLUMNS    = None   # liste de colonnes à lire, ou None pour tout

      # Lecture (pyarrow est le backend par défaut)
      df = pd.read_parquet(FILE_PATH, columns=COLUMNS, engine="pyarrow")

      # Lecture partitionnée (ex: dossier Spark)
