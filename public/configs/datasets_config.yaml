  - id: free_source
    name: "Nœud Source Libre"
    enabled: true
    category: "Générique"
    format: "any"
    description: >
      Nœud d'échappement pour toute source de données hors catalogue.
      OBLIGATION : produire toutes les variables du contrat I/O Bloc 1.
      Toutes les variables non applicables DOIVENT être initialisées explicitement.
    use_cases:
      - "source propriétaire ou interne non répertoriée"
      - "API custom, bus de messages, MQTT, OPC-UA (IoT)"
      - "données en mémoire (pipeline en cours)"
      - "source expérimentale"
    input_parameters:
      CUSTOM_PARAMS: "dict — paramètres libres de la source"
    code_template: |
      # ══════════════════════════════════════════════════════════════════
      # NŒUD SOURCE LIBRE — Remplacer ce bloc par votre logique de chargement
      #
      # RÈGLE ABSOLUE : produire TOUTES les variables ci-dessous.
      # Variables non applicables → valeur nulle listée, ne pas supprimer.
      # ══════════════════════════════════════════════════════════════════
      import pandas as pd
      import numpy as np

      # ── Paramètres libres ─────────────────────────────────────────────
      CUSTOM_PARAMS = {}

      # ── Votre logique de chargement ───────────────────────────────────
      # Exemple minimal — remplacer par votre source
      df = pd.DataFrame({
          "feature_1": np.random.randn(100),
          "feature_2": np.random.randint(0, 5, 100),
          "target"   : np.random.randint(0, 2, 100),
      })

      # ── Variables obligatoires ─────────────────────────────────────────
      TARGET_COL    = "target"    # adapter ou None
      X             = df.drop(columns=[TARGET_COL]) if TARGET_COL in df.columns else df.copy()
      y             = df[TARGET_COL] if TARGET_COL in df.columns else None
      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      task_type     = "classification"   # adapter : voir liste task_type en tête de fichier
      meta          = {"source": "free_source", "shape": df.shape,
                       "custom_params": CUSTOM_PARAMS}

      # ── Initialisation OBLIGATOIRE de toutes les variables optionnelles ─
      # NLP
      texts_train  = []
      texts_test   = []
      # Timeseries (split temporel — si task_type == "timeseries", remplir ces variables)
      y_train      = None   # pd.Series si timeseries
      y_test       = None   # pd.Series si timeseries
      dates_train  = None   # pd.DatetimeIndex si timeseries
      dates_future = None   # pd.DatetimeIndex si timeseries
      # Survival
      durations    = None   # pd.Series si survival
      events       = None   # pd.Series si survival
      df_survival  = None   # pd.DataFrame si survival
