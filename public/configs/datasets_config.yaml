    code_template: |
      import pandas as pd
      import numpy as np
      from pyiceberg.catalog import load_catalog
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_catalog_type = widgets.Dropdown(
          options=["rest", "hive", "glue", "sql", "hadoop"],
          value="rest", description="CATALOG_TYPE:", style={"description_width": "180px"})
