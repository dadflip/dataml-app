    - id: geospatial_vector
      contract: tabular
      name: "Données Géospatiales Vectorielles (GeoJSON / Shapefile / GeoParquet)"
      category: "Géospatial"
      format: "GeoJSON . Shapefile . GeoPackage . GeoParquet . WFS"
      description: >
        Chargement via GeoPandas et extraction de features géométriques
        pour pipeline ML tabulaire.
      use_cases: ["prix immobiliers", "classification parcelles agricoles", "clustering spatial"]
      pros: ["geopandas = pandas géométrique", "tous formats OGR"]
      cons: ["CRS à harmoniser", "géométries complexes"]
      # Features géométriques :
      #   Aire         : surface en m² (EPSG:3857)
      #   Périmètre    : longueur contour en m
      #   Compacité    : C = 4π·A / P²  (C=1 pour cercle)
      #   Centroïde    : (lon, lat) barycentre
      #   Distance ref : distance euclidienne centroïde ↔ point de référence
      code_template: |
        import geopandas as gpd, pandas as pd, numpy as np
        from shapely.geometry import Point

        # ── Paramètres ──────────────────────────────────────────────────
        GEO_FILE   = "data/parcels.geojson"
        TARGET_COL = None; CRS_TARGET = "EPSG:4326"; LAYER = None
        USE_REF    = True; REF_LON = 2.3522; REF_LAT = 48.8566

        kw = {"layer": LAYER} if LAYER else {}
        gdf = (gpd.read_parquet(GEO_FILE) if GEO_FILE.endswith(".parquet")
               else gpd.read_file(GEO_FILE, **kw))
        print(f"Shape : {gdf.shape} | CRS : {gdf.crs}")
        if gdf.crs and str(gdf.crs) != CRS_TARGET: gdf = gdf.to_crs(CRS_TARGET)

        gdf_proj = gdf.to_crs("EPSG:3857")
        gdf["area_m2"]      = gdf_proj.geometry.area
        gdf["perimeter_m"]  = gdf_proj.geometry.length
        gdf["compactness"]  = 4*np.pi*gdf["area_m2"] / (gdf["perimeter_m"]**2 + 1e-8)
        gdf["centroid_lon"] = gdf.geometry.centroid.x
        gdf["centroid_lat"] = gdf.geometry.centroid.y
        gdf["is_valid"]     = gdf.geometry.is_valid.astype(int)
        gdf["geom_type"]    = gdf.geometry.geom_type.astype("category").cat.codes
        if USE_REF:
            ref = gpd.GeoSeries([Point(REF_LON,REF_LAT)],crs="EPSG:4326").to_crs("EPSG:3857").iloc[0]
            gdf["dist_ref_m"] = gdf_proj.geometry.centroid.distance(ref)

        df = pd.DataFrame(gdf.drop(columns=["geometry"]))
        GEO_FEAT = ["area_m2","perimeter_m","compactness","centroid_lon","centroid_lat",
                    "is_valid","geom_type"] + (["dist_ref_m"] if USE_REF else [])

        if TARGET_COL and TARGET_COL in df.columns:
            X = df[GEO_FEAT]; y = df[TARGET_COL]
            task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
        else:
            X = df[GEO_FEAT]; y = None; task_type = "geospatial"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"crs": str(gdf.crs), "bbox": list(gdf.total_bounds), "shape": gdf.shape, "gdf": gdf}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(GEO_FEAT)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df[GEO_FEAT].head(3))

    - id: geospatial_raster
      contract: tabular
      name: "Raster Géospatial (GeoTIFF / NetCDF) → features tabulaires"
      category: "Géospatial"
      format: "GeoTIFF . NetCDF . Zarr . HDF5"
      description: >
        Chargement de rasters satellite/météo et extraction de features
        scalaires (NDVI, indices spectraux, statistiques de bandes) pour
        pipeline ML tabulaire.
      use_cases: ["classification couverture du sol", "NDVI agricole", "features météo pixel"]
      pros: ["rasterio/xarray natifs", "NDVI et indices calculés automatiquement"]
      cons: ["pixels → DataFrame potentiellement très large"]
      # NDVI = (NIR - Red) / (NIR + Red)  ∈ [-1, 1]
      # Végétation dense : >0.5 ; sol nu : ~0 ; eau : <0
      code_template: |
        import numpy as np, pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        RASTER_FILE  = "data/satellite.tif"
        BAND_NAMES   = ["red","green","blue","nir"]
        VARIABLE     = None      # variable NetCDF — None = première
        COMPUTE_NDVI = True

        if RASTER_FILE.endswith((".tif",".tiff")):
            import rasterio
            with rasterio.open(RASTER_FILE) as src:
                print(f"Bandes : {src.count} | CRS : {src.crs} | Shape : {src.shape}")
                data = src.read()
            n_bands = data.shape[0]
            _names  = BAND_NAMES[:n_bands] if BAND_NAMES else [f"band_{i+1}" for i in range(n_bands)]
            df      = pd.DataFrame(data.reshape(n_bands,-1).T, columns=_names)
            if COMPUTE_NDVI and "red" in df.columns and "nir" in df.columns:
                df["ndvi"] = (df["nir"]-df["red"]) / (df["nir"]+df["red"]+1e-8)
        else:
            import xarray as xr
            ds  = xr.open_zarr(RASTER_FILE) if RASTER_FILE.endswith(".zarr") else xr.open_dataset(RASTER_FILE)
            var = VARIABLE or list(ds.data_vars)[0]
            df  = ds[var].to_dataframe().reset_index().dropna(subset=[var])

        feat_cols = [c for c in df.columns if c not in
                     ["x","y","lat","lon","latitude","longitude","time","spatial_ref"]]
        df = df[feat_cols].replace([np.inf,-np.inf], np.nan).dropna()
        X = df.copy(); y = None; task_type = "clustering"
        feature_names = X.columns.tolist(); target_name = None
        meta = {"file": RASTER_FILE, "shape": df.shape, "bands": feat_cols}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

