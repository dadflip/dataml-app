# ══════════════════════════════════════════════════════════════════════════
# DATASETS_CONFIG.YAML — Pipeline ML/DL : Catalogue de Sources de Données
# ══════════════════════════════════════════════════════════════════════════
#
#  ARCHITECTURE : 3 contrats parallèles selon la nature des données
#
#   CONTRACT_TABULAR  → données tabulaires (CSV, SQL, TS, NLP features...)
#   CONTRACT_VISION   → images (classification, segmentation, détection...)
#   CONTRACT_SEQUENCE → séquences brutes (NLP tokens, audio wav, TS DL...)
#
#  RÈGLE DE ROUTAGE :
#    Images 2D/3D                        → CONTRACT_VISION
#    Séquences pour RNN/CNN1D/Transformer → CONTRACT_SEQUENCE
#    Tout le reste                        → CONTRACT_TABULAR
#
#  TRONC COMMUN (produit par TOUS les contrats) :
#    contract     str   — "tabular" | "vision" | "sequence"
#    task_type    str   — identifiant de tâche ML (voir chaque contrat)
#    target_name  str | None
#    meta         dict  — métadonnées source
#
#  RÈGLE D'OR : ne jamais renommer les variables entre les blocs.
#  Seuls les paramètres en MAJUSCULES sont à adapter.
# ══════════════════════════════════════════════════════════════════════════


# ══════════════════════════════════════════════════════════════════════════
# SECTION 1 — CONTRATS I/O
# ══════════════════════════════════════════════════════════════════════════

pipeline_contracts:

  # ────────────────────────────────────────────────────────────────────────
  contract_tabular:
  # ────────────────────────────────────────────────────────────────────────
    contract: "tabular"
    description: >
      Données tabulaires. Produit un DataFrame X avec colonnes nommées.
      Le split train/test est délégué au Bloc 2 (sauf timeseries).

    task_types:
      - classification
      - regression
      - clustering
      - timeseries
      - nlp             # features texte → DataFrame (TF-IDF, embeddings aplatis)
      - anomaly
      - survival
      - graph
      - node_classification
      - knowledge_graph
      - geospatial

    output_variables:
      # ── Toujours produits ──────────────────────────────────────────
      df:            "pd.DataFrame — données brutes complètes"
      X:             "pd.DataFrame — features"
      y:             "pd.Series | None — target"
      feature_names: "list[str]"
      target_name:   "str | None"
      contract:      "str = 'tabular'"
      task_type:     "str"
      meta:          "dict"

      # ── Timeseries uniquement ──────────────────────────────────────
      y_train:       "pd.Series | None"
      y_test:        "pd.Series | None"
      dates_train:   "pd.DatetimeIndex | None"
      dates_future:  "pd.DatetimeIndex | None"

      # ── NLP tabulaire uniquement ───────────────────────────────────
      texts_train:   "list[str]  — [] sinon"
      texts_test:    "list[str]  — [] sinon"

      # ── Survival uniquement ────────────────────────────────────────
      durations:     "pd.Series | None"
      events:        "pd.Series | None"
      df_survival:   "pd.DataFrame | None"

    init_snippet: |
      # Initialisation systématique — copier en fin de chaque snippet TABULAR
      contract     = "tabular"
      texts_train  = texts_train  if task_type == "nlp"        else []
      texts_test   = texts_test   if task_type == "nlp"        else []
      y_train      = y_train      if task_type == "timeseries" else None
      y_test       = y_test       if task_type == "timeseries" else None
      dates_train  = dates_train  if task_type == "timeseries" else None
      dates_future = dates_future if task_type == "timeseries" else None
      durations    = durations    if task_type == "survival"   else None
      events       = events       if task_type == "survival"   else None
      df_survival  = df_survival  if task_type == "survival"   else None
      print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
      print(f"          shape={df.shape}")
      print(df.head(3))

  # ────────────────────────────────────────────────────────────────────────
  contract_vision:
  # ────────────────────────────────────────────────────────────────────────
    contract: "vision"
    description: >
      Données images. Produit des tenseurs NumPy (N,H,W,C) et
      optionnellement des DataLoaders PyTorch. Aucun DataFrame tabulaire
      n'est requis. Le split est toujours effectué dans ce bloc.

    task_types:
      - image_classification
      - image_segmentation
      - object_detection
      - image_regression
      - image_clustering
      - image_anomaly
      - image_similarity

    output_variables:
      # ── Toujours produits ──────────────────────────────────────────
      images_train:  "np.ndarray (N_train, H, W, C) float32 — valeurs [0,1] ou normalisées"
      images_test:   "np.ndarray (N_test,  H, W, C) float32 — array vide si pas de split"
      labels_train:  "np.ndarray (N_train,) int | None"
      labels_test:   "np.ndarray (N_test,)  int | None"
      class_names:   "list[str] | None — noms lisibles des classes"
      split_indices: "dict {'train': np.ndarray, 'val': np.ndarray, 'test': np.ndarray}"
      img_shape:     "tuple (H, W, C) — shape d'une image après preprocessing"
      n_classes:     "int | None"
      transforms:    "dict {'train': callable|None, 'test': callable|None}"
      dl_train:      "torch.utils.data.DataLoader | None"
      dl_test:       "torch.utils.data.DataLoader | None"
      target_name:   "str = 'label' par convention"
      contract:      "str = 'vision'"
      task_type:     "str"
      meta:          "dict — source, n_classes, img_shape, normalize, dataset_name..."

    normalizations:
      imagenet: "mean=[0.485,0.456,0.406]  std=[0.229,0.224,0.225]  (valeurs [0,1])"
      formula:  "x_norm = (x - mean) / std  par canal RGB"

    init_snippet: |
      # Initialisation systématique — copier en fin de chaque snippet VISION
      contract    = "vision"
      target_name = "label"
      if dl_train is None and torch is not None:
          try:
              from torch.utils.data import TensorDataset, DataLoader
              import torch
              ds_tr   = TensorDataset(torch.from_numpy(images_train).permute(0,3,1,2),
                                      torch.from_numpy(labels_train).long() if labels_train is not None
                                      else torch.zeros(len(images_train), dtype=torch.long))
              dl_train = DataLoader(ds_tr, batch_size=32, shuffle=True,  num_workers=4)
              ds_te    = TensorDataset(torch.from_numpy(images_test).permute(0,3,1,2),
                                       torch.from_numpy(labels_test).long() if labels_test is not None
                                       else torch.zeros(len(images_test), dtype=torch.long))
              dl_test  = DataLoader(ds_te, batch_size=32, shuffle=False, num_workers=4)
          except Exception:
              dl_train = None
              dl_test  = None
      print(f"[VISION] task_type='{task_type}' | classes={n_classes} | img_shape={img_shape}")
      print(f"         train={len(images_train)} | test={len(images_test)}")

  # ────────────────────────────────────────────────────────────────────────
  contract_sequence:
  # ────────────────────────────────────────────────────────────────────────
    contract: "sequence"
    description: >
      Séquences brutes pour modèles RNN, TCN, Transformer, CNN1D.
      Couvre NLP (tokens), audio (waveforms), timeseries DL (fenêtres glissantes),
      vidéo (frames). Le split est toujours effectué dans ce bloc.

    task_types:
      - text_classification
      - text_generation
      - ner
      - qa
      - audio_classification
      - audio_regression
      - timeseries_classification
      - timeseries_forecasting
      - video_classification

    output_variables:
      # ── Toujours produits ──────────────────────────────────────────
      sequences_train: "np.ndarray (N, T, F) ou list[np.ndarray] — séquences train"
      sequences_test:  "np.ndarray (N, T, F) ou list[np.ndarray] — séquences test"
      seq_lengths:     "np.ndarray (N,) int — longueurs réelles avant padding"
      labels_train:    "np.ndarray | pd.Series | None"
      labels_test:     "np.ndarray | pd.Series | None"
      n_features:      "int — F : nb de features par pas de temps (1 pour univarié)"
      n_classes:       "int | None"
      target_name:     "str | None"
      contract:        "str = 'sequence'"
      task_type:       "str"
      meta:            "dict"

      # ── NLP uniquement ─────────────────────────────────────────────
      vocab:           "dict token→int | None"
      tokenizer:       "callable | None — tokenizer HF ou custom"

      # ── Audio uniquement ───────────────────────────────────────────
      sr:              "int | None — sample rate (Hz)"

      # ── Timeseries DL uniquement ───────────────────────────────────
      seq_dates:       "pd.DatetimeIndex | None — index temporel"
      horizon:         "int | None — pas de prévision"

      # ── Deep Learning ──────────────────────────────────────────────
      dl_train:        "torch.utils.data.DataLoader | None"
      dl_test:         "torch.utils.data.DataLoader | None"

    init_snippet: |
      # Initialisation systématique — copier en fin de chaque snippet SEQUENCE
      contract = "sequence"
      vocab        = vocab        if task_type in ("text_classification","text_generation","ner","qa") else None
      tokenizer    = tokenizer    if task_type in ("text_classification","text_generation","ner","qa") else None
      sr           = sr           if task_type in ("audio_classification","audio_regression")          else None
      seq_dates    = seq_dates    if task_type in ("timeseries_classification","timeseries_forecasting") else None
      horizon      = horizon      if task_type == "timeseries_forecasting"                              else None
      print(f"[SEQUENCE] task_type='{task_type}' | n_features={n_features} | n_classes={n_classes}")
      print(f"           train={len(sequences_train)} | test={len(sequences_test)}")


# ══════════════════════════════════════════════════════════════════════════
# SECTION 2 — CATALOGUE TABULAR
# ══════════════════════════════════════════════════════════════════════════

catalog:
  tabular:

    # ──────────────────────────────────────────────────────────────────────
    flat_files:
    # ──────────────────────────────────────────────────────────────────────

    - id: csv_local
      contract: tabular
      name: "CSV / TSV Local"
      category: "Fichier Plat"
      format: "csv / tsv"
      description: "Chargement d'un fichier CSV ou TSV local."
      use_cases: ["données tabulaires standards", "exports Excel/SQL", "Kaggle datasets"]
      pros: ["universel", "simple", "pandas natif"]
      cons: ["pas de types stricts", "lent sur très grands fichiers"]
      code_template: |
        import pandas as pd
        import numpy as np

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/dataset.csv"
        TARGET_COL = "target"   # None si non supervisé
        SEPARATOR  = ","
        ENCODING   = "utf-8"
        COLUMNS    = None       # liste de colonnes ou None = toutes

        # ── Chargement ──────────────────────────────────────────────────
        df = pd.read_csv(
            FILE_PATH, sep=SEPARATOR, encoding=ENCODING,
            usecols=COLUMNS, low_memory=False,
            parse_dates=True, infer_datetime_format=True,
        )
        print(f"Shape brut : {df.shape}")
        print(df.dtypes)
        print(df.isnull().sum())

        # ── Features / target ────────────────────────────────────────────
        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL])
            y = df[TARGET_COL]
            task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
        else:
            X = df.copy(); y = None; task_type = "clustering"

        feature_names = X.columns.tolist()
        target_name   = TARGET_COL
        meta = {"file_path": FILE_PATH, "shape": df.shape, "encoding": ENCODING}

        # ── Init contrat ─────────────────────────────────────────────────
        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: excel_local
      contract: tabular
      name: "Excel (xlsx / xls)"
      category: "Fichier Plat"
      format: "xlsx / xls"
      description: "Chargement d'un classeur Excel avec sélection de feuille."
      use_cases: ["données métier", "rapports financiers", "exports ERP/CRM"]
      pros: ["très répandu en entreprise", "plusieurs feuilles"]
      cons: ["lent à lire", "formules non évaluées par pandas"]
      code_template: |
        import pandas as pd
        import numpy as np

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/dataset.xlsx"
        SHEET_NAME = 0
        TARGET_COL = "target"
        HEADER_ROW = 0
        SKIP_ROWS  = None

        # ── Chargement ──────────────────────────────────────────────────
        xl = pd.ExcelFile(FILE_PATH)
        print("Feuilles :", xl.sheet_names)
        df = pd.read_excel(FILE_PATH, sheet_name=SHEET_NAME,
                           header=HEADER_ROW, skiprows=SKIP_ROWS, engine="openpyxl")
        df.columns = df.columns.str.strip().str.lower().str.replace(" ", "_")
        df = df.dropna(how="all").dropna(axis=1, how="all")
        print(f"Shape brut : {df.shape}")

        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL]); y = df[TARGET_COL]
            task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
        else:
            X = df.copy(); y = None; task_type = "clustering"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"file": FILE_PATH, "sheet": SHEET_NAME, "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: parquet_local
      contract: tabular
      name: "Parquet"
      category: "Fichier Colonnaire"
      format: "parquet"
      description: "Format colonnaire compressé. Standard data engineering et gros volumes."
      use_cases: ["gros volumes (>1M lignes)", "données Spark/Databricks", "pipelines de production"]
      pros: ["très rapide en lecture", "compressé", "types stricts"]
      cons: ["non lisible à l'oeil nu", "nécessite pyarrow ou fastparquet"]
      code_template: |
        import pandas as pd
        import numpy as np

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/dataset.parquet"
        TARGET_COL = "target"
        COLUMNS    = None
        ENGINE     = "pyarrow"

        # ── Chargement ──────────────────────────────────────────────────
        df = pd.read_parquet(FILE_PATH, columns=COLUMNS, engine=ENGINE)
        print(f"Shape brut : {df.shape}")
        print(df.dtypes)

        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL]); y = df[TARGET_COL]
            task_type = "classification" if y.nunique() < 20 else "regression"
        else:
            X = df.copy(); y = None; task_type = "clustering"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"engine": ENGINE, "file": FILE_PATH, "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: json_local
      contract: tabular
      name: "JSON / JSONL"
      category: "Fichier Semi-Structuré"
      format: "json / jsonl"
      description: "Chargement de JSON tabulaire ou imbriqué, et de JSONL pour le streaming."
      use_cases: ["données API", "logs applicatifs", "exports NoSQL"]
      pros: ["flexible", "hiérarchique", "omniprésent"]
      cons: ["imbrication complexe à aplatir", "lent sur gros volumes"]
      code_template: |
        import pandas as pd
        import numpy as np
        import json

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/dataset.json"
        TARGET_COL = "label"

        # ── Chargement ──────────────────────────────────────────────────
        IS_JSONL = FILE_PATH.endswith(".jsonl")
        if IS_JSONL:
            with open(FILE_PATH, encoding="utf-8") as f:
                records = [json.loads(l.strip()) for l in f]
            df = pd.DataFrame(records)
        else:
            df = pd.read_json(FILE_PATH, encoding="utf-8")

        nested_cols = [c for c in df.columns if df[c].apply(lambda x: isinstance(x, dict)).any()]
        for col in nested_cols:
            expanded = pd.json_normalize(df[col])
            expanded.columns = [f"{col}.{c}" for c in expanded.columns]
            df = pd.concat([df.drop(columns=[col]), expanded], axis=1)
        print(f"Shape brut : {df.shape}")

        if TARGET_COL and TARGET_COL in df.columns:
            X = df.drop(columns=[TARGET_COL]); y = df[TARGET_COL]
            task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
        else:
            X = df.copy(); y = None; task_type = "clustering"

        feature_names = X.columns.tolist(); target_name = TARGET_COL
        meta = {"nested_cols_expanded": nested_cols, "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: matlab_mat_tabular
      contract: tabular
      name: "Fichier MATLAB .mat — données tabulaires (v5 / v7.3)"
      category: "Fichier Scientifique"
      format: "MAT-file v5 (scipy) / v7.3 (h5py)"
      description: >
        Chargement de matrices numériques depuis un fichier .mat.
        Détection automatique de version (scipy v5, h5py v7.3).
        Réservé aux données tabulaires (pas d'images).
        Pour les .mat contenant des images, utiliser oxford_flowers102 (VISION).
      use_cases:
        - "datasets académiques à structure matricielle"
        - "données de simulation MATLAB/Simulink"
        - "labels et splits issus de fichiers .mat (hors images)"
      pros: ["scipy natif v5", "h5py pour v7.3", "aplatissement struct automatique"]
      cons: ["cell arrays imbriqués difficiles", "version à détecter par try/except"]
      code_template: |
        import numpy as np
        import pandas as pd
        import scipy.io
        import h5py

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH  = "data/dataset.mat"
        DATA_KEY   = None        # clé MATLAB pour X — None = auto (plus grande matrice)
        TARGET_KEY = "labels"    # clé MATLAB pour y — None si non supervisé
        TARGET_COL = "target"
        FLATTEN    = True        # aplatir les tableaux >2D en vecteurs

        # ── Chargement avec détection de version ─────────────────────────
        try:
            mat = scipy.io.loadmat(FILE_PATH, squeeze_me=True, struct_as_record=False)
            mat = {k: v for k, v in mat.items() if not k.startswith("_")}
            version = "v5"
            print(f"[MAT v5] Clés : {list(mat.keys())}")
        except NotImplementedError:
            version = "v7.3"
            mat = {}
            with h5py.File(FILE_PATH, "r") as f:
                def _visit(name, obj):
                    if isinstance(obj, h5py.Dataset):
                        mat[name] = obj[()]
                f.visititems(_visit)
            print(f"[MAT v7.3/HDF5] Clés : {list(mat.keys())}")

        # ── Sélection automatique de X ────────────────────────────────────
        if DATA_KEY and DATA_KEY in mat:
            X_raw = np.array(mat[DATA_KEY])
        else:
            candidates = {k: np.array(v) for k, v in mat.items()
                          if isinstance(v, np.ndarray)
                          and np.issubdtype(np.array(v).dtype, np.number)}
            if not candidates:
                raise ValueError(f"Aucune matrice numérique. Clés : {list(mat.keys())}")
            DATA_KEY = max(candidates, key=lambda k: candidates[k].size)
            X_raw = candidates[DATA_KEY]
            print(f"Clé auto X='{DATA_KEY}' | shape={X_raw.shape}")

        # Convention MATLAB : colonnes = observations → transposer si ndim==2
        if X_raw.ndim == 2 and X_raw.shape[0] < X_raw.shape[1]:
            X_raw = X_raw.T
        if X_raw.ndim > 2:
            if FLATTEN:
                X_raw = X_raw.reshape(X_raw.shape[0], -1)
            else:
                raise ValueError(f"Tenseur {X_raw.ndim}D : activez FLATTEN=True")

        feature_names = [f"feat_{i}" for i in range(X_raw.shape[1])]
        X = pd.DataFrame(X_raw.astype(np.float32), columns=feature_names)

        # ── Labels ───────────────────────────────────────────────────────
        if TARGET_KEY and TARGET_KEY in mat:
            y_raw = np.array(mat[TARGET_KEY]).ravel()
            y     = pd.Series(y_raw, name=TARGET_COL)
            task_type = "classification" if (y.dtype == object or y.nunique() < 50) else "regression"
        else:
            y = None; task_type = "clustering"

        df = X.copy()
        if y is not None:
            df[TARGET_COL] = y.values
        target_name = TARGET_COL if y is not None else None
        meta = {"file": FILE_PATH, "version": version,
                "mat_keys": list(mat.keys()), "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape}")
        print(df.head(3))

    - id: hdf5_tabular
      contract: tabular
      name: "HDF5 / H5 — données tabulaires (HDFStore / matrices)"
      category: "Fichier Scientifique"
      format: "HDF5 (.h5 / .hdf5)"
      description: >
        Chargement de fichiers HDF5 en mode tabulaire : HDFStore pandas
        (df.to_hdf) ou extraction d'une matrice numérique via h5py.
        Pour les HDF5 contenant des images (N,H,W,C), utiliser hdf5_vision (VISION).
      use_cases:
        - "HDFStore pandas (to_hdf / read_hdf)"
        - "données de simulation HPC (LAMMPS, GROMACS) — features scalaires"
        - "données climatiques ERA5 extraites en matrice"
      pros: ["compression transparente", "accès partiel efficace", "pandas natif HDFStore"]
      cons: ["structure à explorer avant chargement", "non lisible à l'oeil nu"]
      code_template: |
        import h5py
        import numpy as np
        import pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        FILE_PATH     = "data/dataset.h5"
        MODE          = "HDFStore pandas"   # "HDFStore pandas" | "h5py direct"
        H5_KEY        = "data"              # clé HDFStore ou chemin h5py
        H5_LABEL_PATH = "/y"               # chemin labels (h5py direct) — None si absent
        TARGET_COL    = "target"
        MAX_ROWS      = None

        def _list_datasets(f):
            leaves = {}
            def v(name, obj):
                if isinstance(obj, h5py.Dataset):
                    leaves[name] = (obj.shape, str(obj.dtype))
            f.visititems(v)
            return leaves

        if MODE == "HDFStore pandas":
