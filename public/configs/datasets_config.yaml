graph_sources:
# ──────────────────────────────────────────────────────────────────────────

  - id: networkx_graph
    name: "Graphe NetworkX (CSV edges / JSON)"
    enabled: true
    category: "Graphe"
    format: "edge list / adjacency / GraphML / GML / GEXF"
    description: >
      Chargement d'un graphe depuis une liste d'arêtes CSV ou un format
      natif NetworkX (GraphML, GML, GEXF). Extraction des features de
      noeuds (degré, centralité, clustering) pour pipeline ML tabulaire.
    use_cases:
      - "réseaux sociaux — détection de communautés"
      - "graphes de transactions — détection de fraude"
      - "réseaux biologiques — protéines, gènes"
      - "graphes de dépendances — supply chain"
    pros:
      - "bibliothèque Python native riche (300+ algorithmes)"
      - "export vers PyG / DGL facile"
      - "formats standards multiples"
    cons:
      - "non scalable > 10M arêtes (utiliser GraphX/Spark)"
      - "représentation en mémoire non optimisée"
    code_template: |
      import networkx as nx
      import pandas as pd
      import numpy as np
      import json

      # ── Paramètres ────────────────────────────────────────────────────
      SOURCE         = "CSV edges"   # "CSV edges" ou "Fichier graphe (GraphML/GML/GEXF)"
      EDGE_FILE      = "data/edges.csv"
      GRAPH_FILE     = "data/graph.graphml"   # utilisé si SOURCE != "CSV edges"
      NODE_FILE      = None          # CSV attributs noeuds (optionnel)
      SOURCE_COL     = "source"
      TARGET_COL_G   = "target"
      WEIGHT_COL     = "weight"      # None si non pondéré
      NODE_LABEL_COL = "label"       # None si non supervisé
      DIRECTED       = False

      # ── Chargement ────────────────────────────────────────────────────
      if SOURCE != "CSV edges":
          ext = GRAPH_FILE.split(".")[-1].lower()
          G = {"graphml": nx.read_graphml,
               "gml":     nx.read_gml,
               "gexf":    nx.read_gexf,
               "json":    lambda f: nx.node_link_graph(json.load(open(f)))
               }.get(ext, nx.read_graphml)(GRAPH_FILE)
      else:
          df_edges = pd.read_csv(EDGE_FILE)
          G = nx.DiGraph() if DIRECTED else nx.Graph()
          for _, row in df_edges.iterrows():
              kwargs = {"weight": row[WEIGHT_COL]} if WEIGHT_COL and WEIGHT_COL in row else {}
              G.add_edge(row[SOURCE_COL], row[TARGET_COL_G], **kwargs)

      if NODE_FILE:
          df_nodes = pd.read_csv(NODE_FILE, index_col=0)
          for node_id, attrs in df_nodes.iterrows():
              if G.has_node(node_id):
                  G.nodes[node_id].update(attrs.to_dict())

      print(f"Noeuds : {G.number_of_nodes()} | Arêtes : {G.number_of_edges()}")
      is_conn = nx.is_connected(G) if not DIRECTED else nx.is_weakly_connected(G)
      print(f"Connexe : {is_conn}")

      nodes       = list(G.nodes())
      degree      = dict(G.degree())
      betweenness = nx.betweenness_centrality(G, normalized=True)
      clustering  = nx.clustering(G)
      pagerank    = nx.pagerank(G, alpha=0.85)

      rows = []
      for n in nodes:
          r = {
              "node_id":                n,
              "degree":                 degree[n],
              "betweenness_centrality": betweenness[n],
              "clustering_coeff":       clustering[n],
              "pagerank":               pagerank[n],
          }
          r.update(G.nodes[n])
          rows.append(r)

      df = pd.DataFrame(rows).set_index("node_id")

      if NODE_LABEL_COL and NODE_LABEL_COL in df.columns:
          y             = df[NODE_LABEL_COL]
          X             = df.drop(columns=[NODE_LABEL_COL])
          task_type     = "node_classification"
      else:
          X             = df.copy()
          y             = None
          task_type     = "graph"

      feature_names = X.columns.tolist()
      target_name   = NODE_LABEL_COL
      meta = {
          "n_nodes":  G.number_of_nodes(),
          "n_edges":  G.number_of_edges(),
          "directed": DIRECTED,
          "density":  nx.density(G),
          "graph_obj": G,
      }

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | nodes={G.number_of_nodes()}")
      print(df.head(3))

  - id: pytorch_geometric
    name: "Graphe PyTorch Geometric (PyG)"
    enabled: true
    category: "Graphe — Deep Learning"
    format: "PyG Dataset / Data object"
    description: >
      Chargement de datasets de graphes natifs PyG (Cora, CiteSeer, OGB,
      PPI, TUDataset…) ou conversion d'un graphe NetworkX vers PyG Data.
    use_cases:
      - "classification de noeuds (Cora, CiteSeer, ogbn-arxiv)"
      - "classification de graphes (TUDataset — molécules)"
      - "prédiction de liens"
      - "GNN : GCN, GAT, GraphSAGE, GIN"
    pros:
      - "accès direct à 100+ datasets benchmark"
      - "transformations et mini-batch natifs"
      - "compatible PyTorch"
    cons:
      - "CUDA requis pour l'entraînement rapide"
      - "peu adapté aux données non-graphe"
    code_template: |
      import numpy as np
      import pandas as pd
      import torch

      # ── Paramètres ────────────────────────────────────────────────────
      SOURCE           = "Dataset PyG standard"   # ou "Conversion depuis NetworkX"
      PYG_DATASET_NAME = "Cora"   # "Cora", "CiteSeer", "PubMed", "PROTEINS",
                                   # "MUTAG", "IMDB-BINARY", "ogbn-arxiv"
      PYG_ROOT         = "./data/pyg"

      # ── Chargement ────────────────────────────────────────────────────
      if SOURCE == "Dataset PyG standard":
          from torch_geometric.datasets import Planetoid, TUDataset

          if PYG_DATASET_NAME in ["Cora", "CiteSeer", "PubMed"]:
              dataset = Planetoid(root=PYG_ROOT, name=PYG_DATASET_NAME)
          else:
              dataset = TUDataset(root=PYG_ROOT, name=PYG_DATASET_NAME)

          data  = dataset[0]
          X_arr = data.x.numpy() if data.x is not None else np.zeros((data.num_nodes, 1))
          y_arr = data.y.numpy() if data.y is not None else None
      else:
          print("⚠ Fournir NX_GRAPH dans la cellule précédente, puis relancer.")
          raise SystemExit

      n_feat = X_arr.shape[1]
      X      = pd.DataFrame(X_arr, columns=[f"feat_{i}" for i in range(n_feat)])
      y      = pd.Series(y_arr, name="label") if y_arr is not None else None

      feature_names = X.columns.tolist()
      target_name   = "label"
      task_type     = "node_classification" if y is not None else "graph"
      df            = X.copy()
      if y is not None:
          df["label"] = y.values

      meta = {
          "dataset":    PYG_DATASET_NAME,
          "n_nodes":    int(X_arr.shape[0]),
          "n_features": n_feat,
          "n_classes":  int(y.nunique()) if y is not None else None,
          "pyg_data":   data,
          "n_edges":    int(data.num_edges) if hasattr(data, "num_edges") else None,
      }

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"Shape X : {X.shape}")
      print(f"\n✅ task_type='{task_type}' | features={n_feat} | nodes={X_arr.shape[0]}")
      print(df.head(3))


# ──────────────────────────────────────────────────────────────────────────
ontology_knowledge:
# ──────────────────────────────────────────────────────────────────────────

  - id: rdf_owl_ontology
    name: "Ontologie RDF / OWL / SPARQL"
    enabled: true
    category: "Graphe de Connaissances"
    format: "RDF/XML · Turtle · N-Triples · JSON-LD"
    description: >
      Chargement d'une ontologie ou d'un graphe de connaissances RDF/OWL.
      Requêtage SPARQL pour extraire des triplets (sujet, prédicat, objet).
    use_cases:
      - "DBpedia, Wikidata, YAGO, Freebase"
      - "ontologies médicales (SNOMED, MeSH, ICD)"
      - "graphes de connaissances d'entreprise"
      - "enrichissement de features par KG embedding"
    pros:
      - "standard W3C — interopérabilité maximale"
      - "raisonnement OWL natif (rdflib + owlrl)"
      - "SPARQL = SQL pour les triplets"
    cons:
      - "verbeux et complexe à modéliser"
      - "lent sur grands graphes (> 10M triplets)"
      - "requiert une compréhension des ontologies"
    code_template: |
      import rdflib
      from rdflib import Graph, Namespace, RDF, RDFS, OWL, URIRef, Literal
      import pandas as pd
      import numpy as np
      import networkx as nx

      # ── Paramètres ────────────────────────────────────────────────────
      SOURCE           = "Fichier RDF local"   # ou "Endpoint SPARQL distant"
      RDF_FILE         = "data/ontology.ttl"
      RDF_FORMAT       = "turtle"   # "turtle", "xml", "n3", "nt", "json-ld"
      SPARQL_ENDPOINT  = "http://dbpedia.org/sparql"
      TARGET_PREDICATE = None       # URI du prédicat cible — None = non supervisé
      SPARQL_QUERY     = """
          PREFIX rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          SELECT ?subject ?predicate ?object
          WHERE {
              ?subject ?predicate ?object .
              FILTER(isIRI(?subject) && isIRI(?object))
          }
          LIMIT 100000
      """

      # ── Chargement ────────────────────────────────────────────────────
      g = Graph()
      if SOURCE == "Fichier RDF local":
          g.parse(RDF_FILE, format=RDF_FORMAT)
          print(f"Triplets chargés : {len(g)}")
          results_q = g.query(SPARQL_QUERY)
          df_triplets = pd.DataFrame(
              [(str(r.subject), str(r.predicate), str(r.object))
               for r in results_q],
              columns=["subject", "predicate", "object"])
      else:
          from SPARQLWrapper import SPARQLWrapper, JSON
          sparql = SPARQLWrapper(SPARQL_ENDPOINT)
          sparql.setQuery(SPARQL_QUERY)
          sparql.setReturnFormat(JSON)
          results = sparql.query().convert()
          rows_raw = [{k: r[k]["value"] for k in r}
                      for r in results["results"]["bindings"]]
          df_triplets = pd.DataFrame(rows_raw)
          g = None

      print(f"Triplets extraits : {len(df_triplets)}")
      print(df_triplets.head())

      G_kg = nx.DiGraph()
      for _, row in df_triplets.iterrows():
          G_kg.add_edge(row["subject"], row["object"], relation=row["predicate"])

      preds    = df_triplets["predicate"].value_counts().head(50).index.tolist()
      subjects = df_triplets["subject"].unique()
      feat_rows = []
      for s in subjects:
          sub_df = df_triplets[df_triplets["subject"] == s]
          row_d  = {"entity": s}
          for p in preds:
              row_d[f"pred_{p.split('/')[-1][:30]}"] = int(p in sub_df["predicate"].values)
          row_d["out_degree"] = len(sub_df)
          feat_rows.append(row_d)

      df = pd.DataFrame(feat_rows).set_index("entity").fillna(0)

      if TARGET_PREDICATE:
          _target_col = f"pred_{TARGET_PREDICATE.split('/')[-1][:30]}"
          y         = df[_target_col] if _target_col in df.columns else None
          X         = df.drop(columns=[_target_col], errors="ignore")
          task_type = "node_classification"
      else:
          X         = df.copy()
          y         = None
          task_type = "knowledge_graph"

      feature_names = X.columns.tolist()
      target_name   = TARGET_PREDICATE
      meta = {
          "n_triplets":  len(df_triplets),
          "n_entities":  len(subjects),
          "n_relations": df_triplets["predicate"].nunique(),
          "graph_obj":   G_kg,
          "rdf_graph":   g,
          "triplets_df": df_triplets,
      }

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | entities={len(subjects)}")

  - id: wikidata_sparql
    name: "Wikidata (SPARQL Live)"
    enabled: true
    category: "Graphe de Connaissances"
    format: "SPARQL / JSON"
    description: >
      Requêtage direct du endpoint SPARQL public de Wikidata.
      Extraction de propriétés structurées sur des entités pour
      enrichissement de datasets ML.
    use_cases:
      - "enrichissement de features (pays, entreprises, personnes)"
      - "datasets ouverts structurés"
      - "alignement d'entités"
    pros:
      - "endpoint public gratuit"
      - "80M+ entités"
      - "données fraîches"
    cons:
      - "timeout à 60s — requêtes à optimiser"
      - "rate limiting"
    code_template: |
      import requests
      import pandas as pd
      import numpy as np
      import time

      # ── Paramètres ────────────────────────────────────────────────────
      TARGET_COL     = None    # None si non supervisé
      LANG           = "fr"
      MAX_RETRIES    = 3
      WIKIDATA_QUERY = """
          SELECT ?item ?itemLabel ?population ?area ?capital ?capitalLabel WHERE {
            ?item wdt:P31 wd:Q6256 .
            OPTIONAL { ?item wdt:P1082 ?population . }
            OPTIONAL { ?item wdt:P2046 ?area . }
            OPTIONAL { ?item wdt:P36 ?capital . }
            SERVICE wikibase:label {
              bd:serviceParam wikibase:language "fr,en" .
            }
          }
          LIMIT 500
      """

      # ── Requête ───────────────────────────────────────────────────────
      ENDPOINT = "https://query.wikidata.org/sparql"
      headers  = {
          "Accept":     "application/sparql-results+json",
          "User-Agent": "ML-Pipeline/1.0 (research)",
      }
      r = None
      for attempt in range(MAX_RETRIES):
          try:
              r = requests.get(ENDPOINT,
                               params={"query": WIKIDATA_QUERY, "format": "json"},
                               headers=headers, timeout=55)
              r.raise_for_status()
              break
          except requests.RequestException as e:
              print(f"Tentative {attempt+1}/{MAX_RETRIES} : {e}")
              time.sleep(5 * (attempt + 1))

      if r is None:
          print("❌ Échec de la requête Wikidata")
          raise SystemExit

      data    = r.json()
      cols    = data["results"]["head"]["vars"]
      records = [{c: row.get(c, {}).get("value", None) for c in cols}
                 for row in data["results"]["bindings"]]
      df      = pd.DataFrame(records)

      for col in ["population", "area"]:
          if col in df.columns:
              df[col] = pd.to_numeric(df[col], errors="coerce")

      if "item" in df.columns:
          df["wikidata_id"] = df["item"].str.extract(r"(Q\d+)")

      print(f"Shape : {df.shape}")

      _exclude = ["item", "itemLabel", "capitalLabel", "wikidata_id"]
      if TARGET_COL and TARGET_COL in df.columns:
          X         = df.drop(columns=[c for c in _exclude + [TARGET_COL] if c in df.columns])
          y         = df[TARGET_COL]
          task_type = "classification" if y.nunique() < 20 else "regression"
      else:
          X         = df.drop(columns=[c for c in _exclude if c in df.columns])
          y         = None
          task_type = "knowledge_graph"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta          = {"n_entities": len(df), "query_vars": cols, "shape": df.shape}

      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None

      print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | entities={len(df)}")
      print(df.head(3))


