asharray="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 130 C 400 130, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 130 C 400 130, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import pandas as pd
      from sqlalchemy import create_engine

      # ── Connexions possibles ──────────────────────────────────────────
      # PostgreSQL : "postgresql+psycopg2://user:pwd@host:5432/dbname"
      # MySQL      : "mysql+pymysql://user:pwd@host:3306/dbname"
      # SQLite     : "sqlite:///path/to/file.db"
      # MSSQL      : "mssql+pyodbc://user:pwd@dsn"
      DB_URL     = "postgresql+psycopg2://user:password@localhost:5432/mydb"
      TARGET_COL = "target"

      engine = create_engine(DB_URL, pool_pre_ping=True)

      QUERY = """
          SELECT
              t.*,
              f.feature_extra
          FROM   main_table t
          JOIN   features_table f ON t.id = f.id
          WHERE  t.created_at >= '2023-01-01'
            AND  t.status = 'active'
          LIMIT  500000
      """

      with engine.connect() as conn:
          df = pd.read_sql(QUERY, conn, parse_dates=["created_at"])

      print(f"Shape : {df.shape}")

      # Exclure les colonnes non-features (IDs, dates, textes)
      EXCLUDE = ["id", "created_at", "updated_at", TARGET_COL]
      X = df.drop(columns=[c for c in EXCLUDE if c in df.columns])
      y = df[TARGET_COL] if TARGET_COL in df.columns else None
      task_type = "classification" if y is not None and y.nunique() < 20 else "regression"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL
      meta = {"query": QUERY, "db_url": DB_URL.split("@")[1]}  # masquer le mdp

