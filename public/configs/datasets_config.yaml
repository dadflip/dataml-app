  - id: kafka_stream
    name: "Kafka (Streaming)"
    enabled: true
    category: "Streaming"
    format: "Kafka Messages / JSON"
    description: "Consommation d'un flux Kafka en mini-batches."
    use_cases: ["détection de fraude temps réel", "monitoring de capteurs", "scoring à faible latence"]
    pros: ["temps réel", "scalable", "durable"]
    cons: ["infrastructure lourde", "complexité opérationnelle"]
    code_template: |
      from kafka import KafkaConsumer
      import pandas as pd
      import numpy as np
      import json
      from collections import deque

      # ── Paramètres ────────────────────────────────────────────────────
      BOOTSTRAP_SERVERS = ["localhost:9092"]
      TOPIC             = "ml-events"
      GROUP_ID          = "ml-consumer-group"
      BATCH_SIZE        = 1000
      TIMEOUT_MS        = 1000

      consumer = KafkaConsumer(
          TOPIC,
          bootstrap_servers=BOOTSTRAP_SERVERS,
          group_id=GROUP_ID,
          auto_offset_reset="latest",
          enable_auto_commit=True,
          value_deserializer=lambda m: json.loads(m.decode("utf-8")),
          consumer_timeout_ms=TIMEOUT_MS,
      )

      buffer = deque(maxlen=BATCH_SIZE)
      records_collected = []

      try:
          for message in consumer:
              buffer.append(message.value)
              if len(buffer) >= BATCH_SIZE:
                  records_collected.extend(list(buffer))
                  buffer.clear()
                  break   # retirer pour streaming continu
      finally:
          consumer.close()

      # ── Variables standards ───────────────────────────────────────────
      df = pd.json_normalize(records_collected)
      X  = df.drop(columns=["event_id", "timestamp"], errors="ignore")
      y  = None

      feature_names = X.columns.tolist()
      target_name   = None
      task_type     = "anomaly"
      meta = {"topic": TOPIC, "batch_size": BATCH_SIZE, "shape": df.shape}

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


