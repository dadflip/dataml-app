      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_servers   = widgets.Text(value="localhost:9092",
                                 description="BOOTSTRAP_SERVERS:", style={"description_width": "180px"},
                                 layout=widgets.Layout(width="450px"),
                                 placeholder="host1:9092,host2:9092")
      w_topic     = widgets.Text(value="ml-events",
                                 description="TOPIC:", style={"description_width": "180px"})
      w_group_id  = widgets.Text(value="ml-consumer-group",
                                 description="GROUP_ID:", style={"description_width": "180px"})
      w_batch     = widgets.IntText(value=1000, description="BATCH_SIZE:",
                                    style={"description_width": "180px"})
      w_timeout   = widgets.IntText(value=1000, description="TIMEOUT_MS:",
                                    style={"description_width": "180px"})
      w_offset    = widgets.Dropdown(options=["latest", "earliest"],
                                     value="latest", description="AUTO_OFFSET_RESET:",
                                     style={"description_width": "180px"})
      w_run       = widgets.Button(description="▶ Consommer batch", button_style="success",
                                   layout=widgets.Layout(width="190px"))
      out         = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🌊 Kafka Streaming — Paramètres</b>"),
          w_servers, w_topic, w_group_id,
          widgets.HBox([w_batch, w_timeout]),
          w_offset, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              BOOTSTRAP_SERVERS = [s.strip() for s in w_servers.value.split(",")]
              TOPIC             = w_topic.value.strip()
              GROUP_ID          = w_group_id.value.strip()
              BATCH_SIZE        = w_batch.value
              TIMEOUT_MS        = w_timeout.value
              OFFSET_RESET      = w_offset.value

              consumer = KafkaConsumer(
                  TOPIC,
                  bootstrap_servers=BOOTSTRAP_SERVERS,
                  group_id=GROUP_ID,
                  auto_offset_reset=OFFSET_RESET,
                  enable_auto_commit=True,
                  value_deserializer=lambda m: json.loads(m.decode("utf-8")),
                  consumer_timeout_ms=TIMEOUT_MS,
              )

              buffer           = deque(maxlen=BATCH_SIZE)
              records_collected = []

              try:
                  for message in consumer:
                      buffer.append(message.value)
                      if len(buffer) >= BATCH_SIZE:
                          records_collected.extend(list(buffer))
                          buffer.clear()
                          break
              finally:
                  consumer.close()

              df = pd.json_normalize(records_collected)
              X  = df.drop(columns=["event_id", "timestamp"], errors="ignore")
              y  = None

              feature_names = X.columns.tolist()
              target_name   = None
              task_type     = "anomaly"
              meta = {"topic": TOPIC, "batch_size": BATCH_SIZE, "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | records={len(records_collected)}")
              display(df.head(3))

      w_run.on_click(on_run)


