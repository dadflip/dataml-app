                                  placeholder="Laisser vide = non supervisé")
      w_storage    = widgets.Text(value="{}",
                                  description="STORAGE_OPTIONS (JSON):", style={"description_width": "180px"},
                                  layout=widgets.Layout(width="500px"),
                                  placeholder='ex: {"AWS_ACCESS_KEY_ID": "…"}')
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      def on_travel_change(change):
          w_version.layout.visibility   = "visible" if change["new"] == "Version N" else "hidden"
          w_timestamp.layout.visibility = "visible" if change["new"] == "Timestamp" else "hidden"

      w_travel.observe(on_travel_change, names="value")

      box = widgets.VBox([
          widgets.HTML("<b>🔺 Delta Lake — Paramètres</b>"),
          w_path, w_engine, w_travel, w_version, w_timestamp,
          w_target, w_storage, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              import json as _json
              DELTA_TABLE_PATH = w_path.value.strip()
              ENGINE           = w_engine.value
              TRAVEL           = w_travel.value
              DELTA_VERSION    = w_version.value if TRAVEL == "Version N" else None
              DELTA_TIMESTAMP  = w_timestamp.value.strip() if TRAVEL == "Timestamp" else None
              TARGET_COL       = w_target.value.strip() or None
              STORAGE_OPTIONS  = _json.loads(w_storage.value.strip() or "{}")

              if ENGINE == "delta-rs (sans Spark)":
                  from deltalake import DeltaTable
                  dt_kwargs = {"storage_options": STORAGE_OPTIONS} if STORAGE_OPTIONS else {}
                  dt = DeltaTable(DELTA_TABLE_PATH, **dt_kwargs)
                  if DELTA_VERSION is not None:
                      dt.load_as_version(DELTA_VERSION)
                  elif DELTA_TIMESTAMP is not None:
                      dt.load_as_version(DELTA_TIMESTAMP)
                  df = dt.to_pandas()
                  print(f"Delta version : {dt.version()} | Shape : {df.shape}")
              else:
                  from pyspark.sql import SparkSession
                  spark = SparkSession.builder.appName("DeltaLoad").getOrCreate()
                  _opts = {}
                  if DELTA_VERSION is not None:
                      _opts = {"versionAsOf": str(DELTA_VERSION)}
                  elif DELTA_TIMESTAMP is not None:
                      _opts = {"timestampAsOf": DELTA_TIMESTAMP}
                  sdf = spark.read.format("delta").options(**_opts).load(DELTA_TABLE_PATH)
                  df  = sdf.toPandas()
                  print(f"Shape : {df.shape}")

              if TARGET_COL and TARGET_COL in df.columns:
                  X         = df.drop(columns=[TARGET_COL])
                  y         = df[TARGET_COL]
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  X         = df.copy()
                  y         = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"path": DELTA_TABLE_PATH, "version": DELTA_VERSION,
                      "timestamp": DELTA_TIMESTAMP, "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

