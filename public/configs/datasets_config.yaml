synthetic_advanced:
# ──────────────────────────────────────────────────────────────────────────

  - id: synthetic_graph_data
    name: "Données de Graphe Synthétiques (Stochastic Block Model / Barabási-Albert)"
    enabled: true
    category: "Synthétique — Graphe"
    format: "NetworkX / numpy"
    description: >
      Génère des graphes synthétiques avec structure communautaire (SBM),
      scale-free (Barabási-Albert), small-world (Watts-Strogatz) ou
      aléatoire (Erdős-Rényi). Produit les features tabulaires par noeud
      pour benchmark des algorithmes de graphe.
    input_parameters:
      GRAPH_MODEL:    "str — 'sbm'|'ba'|'ws'|'er'"
      N_NODES:        "int — nombre de noeuds"
      N_COMMUNITIES:  "int — communautés pour SBM (défaut: 4)"
      P_INTRA:        "float — proba arête intra-communauté (SBM)"
      P_INTER:        "float — proba arête inter-communauté (SBM)"
      M_BA:           "int — arêtes par noeud nouveau (BA, défaut: 2)"
    code_template: |
      import networkx as nx
      import numpy as np
      import pandas as pd

      # ── Paramètres ────────────────────────────────────────────────────
      GRAPH_MODEL   = "sbm"
      N_NODES       = 1000
      N_COMMUNITIES = 4
      P_INTRA       = 0.3
      P_INTER       = 0.01
      M_BA          = 3

      # ── Génération ────────────────────────────────────────────────────
      if GRAPH_MODEL == "sbm":
          sizes = [N_NODES // N_COMMUNITIES] * N_COMMUNITIES
          sizes[-1] += N_NODES - sum(sizes)
          p_matrix = [[P_INTRA if i==j else P_INTER
                       for j in range(N_COMMUNITIES)]
                      for i in range(N_COMMUNITIES)]
          G = nx.stochastic_block_model(sizes, p_matrix, seed=42)
          # Attribut 'block' = label communauté (ground truth)
          labels_gt = np.array([G.nodes[n]["block"] for n in G.nodes()])

      elif GRAPH_MODEL == "ba":
          G = nx.barabasi_albert_graph(N_NODES, M_BA, seed=42)
          labels_gt = None

      elif GRAPH_MODEL == "ws":
          k = max(4, N_NODES // 50)
          G = nx.watts_strogatz_graph(N_NODES, k, 0.1, seed=42)
          labels_gt = None

      else:  # er
          G = nx.erdos_renyi_graph(N_NODES, 0.05, seed=42)
          labels_gt = None

      print(f"Graphe {GRAPH_MODEL} : {G.number_of_nodes()} noeuds, "
            f"{G.number_of_edges()} arêtes | Densité : {nx.density(G):.4f}")

      # ── Features par noeud ────────────────────────────────────────────
      pagerank    = nx.pagerank(G, alpha=0.85)
      betweenness = nx.betweenness_centrality(G, normalized=True)
      clustering  = nx.clustering(G)
      degree      = dict(G.degree())

      rows = [{
          "node_id"          : n,
          "degree"           : degree[n],
          "pagerank"         : pagerank[n],
          "betweenness"      : betweenness[n],
          "clustering_coeff" : clustering[n],
      } for n in G.nodes()]

      df = pd.DataFrame(rows).set_index("node_id")
      if labels_gt is not None:
          df["community"] = labels_gt

      # ── Variables standards ───────────────────────────────────────────
      if labels_gt is not None:
          y         = df.pop("community")
          task_type = "node_classification"
      else:
          y         = None
          task_type = "graph"

      X             = df.copy()
      feature_names = X.columns.tolist()
      target_name   = "community" if labels_gt is not None else None
      meta = {
          "model"   : GRAPH_MODEL,
          "n_nodes" : G.number_of_nodes(),
          "n_edges" : G.number_of_edges(),
          "density" : nx.density(G),
          "graph_obj": G,
          "shape"   : df.shape,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train  = []
      texts_test   = []
      y_train      = None
      y_test       = None
      dates_train  = None
      dates_future = None
      durations    = None
      events       = None
      df_survival  = None


  - id: synthetic_time_series_advanced
    name: "Séries Temporelles Synthétiques (ARIMA / GBM / Navier-Stokes)"
    enabled: true
    category: "Synthétique — Timeseries"
    format: "numpy / pandas"
    description: >
      Génère des séries temporelles synthétiques réalistes avec différents
      processus stochastiques : ARIMA, Geometric Brownian Motion (finance),
      Ornstein-Uhlenbeck (retour à la moyenne), sinusoïdes + bruit.
      Utile pour tester des modèles de prévision.
    input_parameters:
      TS_MODEL:    "str — 'arima'|'gbm'|'ou'|'seasonal_noise'|'regime_switch'"
      N_POINTS:    "int — nombre de points temporels"
      FREQ:        "str — fréquence (défaut: 'D')"
      TEST_RATIO:  "float — ratio test (défaut: 0.2)"
      HORIZON:     "int — horizon de prévision"
    code_template: |
      import numpy as np
      import pandas as pd

      # ── Paramètres ────────────────────────────────────────────────────
      TS_MODEL   = "gbm"
      N_POINTS   = 1000
      FREQ       = "D"
      TEST_RATIO = 0.2
      HORIZON    = 30
      np.random.seed(42)

      dates = pd.date_range("2020-01-01", periods=N_POINTS, freq=FREQ)

      # ── Génération ────────────────────────────────────────────────────
      if TS_MODEL == "arima":
          from statsmodels.tsa.arima_process import ArmaProcess
          ar = np.array([1, -0.75, 0.25])
          ma = np.array([1,  0.65])
          values = ArmaProcess(ar, ma).generate_sample(nsample=N_POINTS,
                                                        scale=1.0) + 100

      elif TS_MODEL == "gbm":
          mu, sigma, S0, dt = 0.0005, 0.02, 100.0, 1.0
          log_returns = (mu - 0.5*sigma**2)*dt + sigma*np.sqrt(dt)*np.random.randn(N_POINTS)
          values = S0 * np.exp(np.cumsum(log_returns))

      elif TS_MODEL == "ou":
          theta, mu_ou, sigma_ou = 0.1, 50.0, 2.0
          values = np.zeros(N_POINTS)
          values[0] = mu_ou
          for t in range(1, N_POINTS):
              values[t] = (values[t-1]
                           + theta*(mu_ou - values[t-1])
                           + sigma_ou*np.random.randn())

      elif TS_MODEL == "regime_switch":
          values = np.zeros(N_POINTS)
          regime = 0
          for t in range(N_POINTS):
              if np.random.rand() < 0.02:
                  regime = 1 - regime
              values[t] = (100 + np.random.randn() * 2 if regime == 0
                           else 120 + np.random.randn() * 5)

      else:  # seasonal_noise
          t_arr  = np.arange(N_POINTS)
          values = (100 + 10*np.sin(2*np.pi*t_arr/365)
                       + 5*np.sin(2*np.pi*t_arr/7)
                       + np.random.randn(N_POINTS)*2)

      series = pd.Series(values, index=dates, name="value")

      # ── Variables standards timeseries ─────────────────────────────────
      n_test       = int(N_POINTS * TEST_RATIO)
      y_train      = series.iloc[:-n_test]
      y_test       = series.iloc[-n_test:]
      dates_train  = y_train.index
      dates_future = pd.date_range(start=y_test.index[0],
                                   periods=HORIZON, freq=FREQ)

      X             = pd.DataFrame(index=series.index)
      y             = series
      df            = series.to_frame()
      feature_names = []
      target_name   = "value"
      task_type     = "timeseries"
      meta = {
          "model"  : TS_MODEL,
          "n_points": N_POINTS,
          "freq"   : FREQ,
          "horizon": HORIZON,
          "shape"  : df.shape,
          "synthetic": True,
      }

      # ── Initialisation variables non applicables ──────────────────────
      texts_train = []
      texts_test  = []
      durations   = None
      events      = None
      df_survival = None


