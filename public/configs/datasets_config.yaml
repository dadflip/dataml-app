      code_template: |
        from sklearn import datasets
        import pandas as pd, numpy as np

        # ── Paramètres ──────────────────────────────────────────────────
        # load_breast_cancer, load_iris, load_wine, load_digits,
        # load_diabetes, load_california_housing,
        # make_classification, make_regression, make_blobs
        LOADER_NAME  = "load_breast_cancer"
        DEFAULT_TASK = "classification"
        N_SAMPLES  = 1000; N_FEATURES = 20; N_CLASSES = 2

        if LOADER_NAME == "make_classification":
            X_arr, y_arr = datasets.make_classification(
                n_samples=N_SAMPLES, n_features=N_FEATURES, n_classes=N_CLASSES,
                n_informative=max(2, N_FEATURES//2), random_state=42)
            feat_names = [f"feat_{i}" for i in range(X_arr.shape[1])]; bunch = None
        elif LOADER_NAME == "make_regression":
            X_arr, y_arr = datasets.make_regression(
                n_samples=N_SAMPLES, n_features=N_FEATURES, noise=0.1, random_state=42)
            feat_names = [f"feat_{i}" for i in range(X_arr.shape[1])]; bunch = None
        elif LOADER_NAME == "make_blobs":
            X_arr, y_arr = datasets.make_blobs(
                n_samples=N_SAMPLES, n_features=N_FEATURES, centers=N_CLASSES, random_state=42)
            feat_names = [f"feat_{i}" for i in range(X_arr.shape[1])]; bunch = None
        else:
            bunch = getattr(datasets, LOADER_NAME)(as_frame=True)
            X_arr = bunch.data.values; y_arr = bunch.target.values
            feat_names = list(bunch.feature_names)

        df = pd.DataFrame(X_arr, columns=feat_names); df["target"] = y_arr
        X = bunch.data if bunch else pd.DataFrame(X_arr, columns=feat_names)
        y = bunch.target if bunch else pd.Series(y_arr, name="target")
        feature_names = feat_names; target_name = "target"; task_type = DEFAULT_TASK
        meta = {"source": "sklearn", "dataset": LOADER_NAME, "shape": df.shape,
                "classes": list(bunch.target_names) if bunch and hasattr(bunch,"target_names") else None}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
