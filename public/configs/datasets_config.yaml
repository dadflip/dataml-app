    - id: federated_flower
      contract: tabular
      name: "Apprentissage Fédéré (Flower / Flwr) — export client tabulaire"
      category: "Federated Learning"
      format: "Partitions distribuées NumPy"
      description: >
        Simule un apprentissage fédéré local (FedAvg) et exporte les données
        d'un client comme DataFrame tabulaire standard.
      use_cases: ["données sensibles non centralisables", "simulation scénarios fédérés"]
      # FedAvg : w^{t+1} = Σ_k (n_k/N)·w_k^{t+1}
      # Dirichlet(α) : proportions_k ~ Dir(α·1_C)
      #   α faible (<0.5) = forte hétérogénéité
      code_template: |
        import numpy as np, pandas as pd
        from sklearn.datasets import make_classification
        from sklearn.model_selection import train_test_split
        from sklearn.linear_model import LogisticRegression

        # ── Paramètres ──────────────────────────────────────────────────
        NUM_CLIENTS=5; NUM_ROUNDS=3; ALPHA_DIR=0.5
        N_SAMPLES=5000; N_FEATURES=20; SEED=42; CLIENT_ID=0

        np.random.seed(SEED)
        X_all, y_all = make_classification(
            n_samples=N_SAMPLES, n_features=N_FEATURES,
            n_informative=N_FEATURES//2, random_state=SEED)
        n_classes = len(np.unique(y_all))
        client_data = [[] for _ in range(NUM_CLIENTS)]
        for c in range(n_classes):
            idx_c = np.where(y_all==c)[0]; np.random.shuffle(idx_c)
            props = np.random.dirichlet([ALPHA_DIR]*NUM_CLIENTS)
            splits = (props*len(idx_c)).astype(int); splits[-1] += len(idx_c)-splits.sum()
            cum = 0
            for k, s in enumerate(splits): client_data[k].append(idx_c[cum:cum+s]); cum += s

        clients = []
        for k in range(NUM_CLIENTS):
            idx_k = np.concatenate(client_data[k])
            X_k, y_k = X_all[idx_k], y_all[idx_k]
            X_tr,X_te,y_tr,y_te = train_test_split(X_k,y_k,test_size=0.2,random_state=SEED)
            clients.append({"X_train":X_tr,"X_test":X_te,"y_train":y_tr,"y_test":y_te})

        global_coef = None; global_intercept = None
        for rnd in range(NUM_ROUNDS):
            lcoefs=[]; lints=[]
            for k, client in enumerate(clients):
                clf = LogisticRegression(max_iter=200, random_state=SEED, warm_start=True)
                if global_coef is not None:
                    clf.coef_=global_coef.copy(); clf.intercept_=global_intercept.copy()
                    clf.classes_=np.unique(client["y_train"])
                clf.fit(client["X_train"],client["y_train"])
                lcoefs.append(clf.coef_); lints.append(clf.intercept_)
            wts = [len(c["X_train"]) for c in clients]; tot = sum(wts)
            global_coef      = sum(w*c/tot for w,c in zip(wts,lcoefs))
            global_intercept = sum(w*i/tot for w,i in zip(wts,lints))
            print(f"Round {rnd+1}/{NUM_ROUNDS} — FedAvg agrégé")

        CLIENT_ID = min(CLIENT_ID, NUM_CLIENTS-1)
        df = pd.DataFrame(clients[CLIENT_ID]["X_train"],
                          columns=[f"feat_{i}" for i in range(X_all.shape[1])])
        df["target"] = clients[CLIENT_ID]["y_train"]
        X = df.drop(columns=["target"]); y = df["target"]
        feature_names = X.columns.tolist(); target_name = "target"; task_type = "classification"
        meta = {"num_clients": NUM_CLIENTS, "num_rounds": NUM_ROUNDS,
                "global_coef": global_coef, "clients": clients, "shape": df.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | client_id={CLIENT_ID}")
        print(df.head(3))

