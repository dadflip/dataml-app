  - id: rest_api
    name: "REST API (HTTP/JSON)"
    enabled: true
    category: "API Web"
    format: "JSON / XML"
    description: "Collecte depuis une API REST avec pagination, authentification et retry."
    use_cases: ["données financières", "météo", "réseaux sociaux", "SaaS"]
    pros: ["données fraîches", "standardisé", "flexible"]
    cons: ["rate limiting", "pagination complexe", "instable"]
    code_template: |
      import requests
      import pandas as pd
      import numpy as np
      import time
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_base_url   = widgets.Text(value="https://api.example.com/v1",
                                  description="BASE_URL:", style={"description_width": "140px"},
                                  layout=widgets.Layout(width="500px"))
      w_api_key    = widgets.Password(value="",
                                      description="API_KEY:", style={"description_width": "140px"},
                                      layout=widgets.Layout(width="400px"))
      w_endpoint   = widgets.Text(value="/data",
                                  description="ENDPOINT:", style={"description_width": "140px"})
      w_target     = widgets.Text(value="label",
                                  description="TARGET_COL:", style={"description_width": "140px"},
                                  placeholder="Laisser vide = non supervisé")
      w_page_size  = widgets.IntText(value=100, description="PAGE_SIZE:",
                                     style={"description_width": "140px"})
      w_max_pages  = widgets.IntText(value=100, description="MAX_PAGES:",
                                     style={"description_width": "140px"})
      w_sleep      = widgets.FloatText(value=0.2, description="SLEEP (s):",
                                       style={"description_width": "140px"})
      w_auth_type  = widgets.Dropdown(options=["Bearer", "Basic", "None"],
                                      value="Bearer", description="AUTH_TYPE:",
                                      style={"description_width": "140px"})
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🌐 REST API — Paramètres</b>"),
          w_base_url, w_api_key, w_endpoint, w_target,
          widgets.HBox([w_page_size, w_max_pages, w_sleep]),
          w_auth_type, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              BASE_URL  = w_base_url.value.strip()
              API_KEY   = w_api_key.value.strip()
              ENDPOINT  = w_endpoint.value.strip()
              TARGET_COL = w_target.value.strip() or None
              PAGE_SIZE = w_page_size.value
              MAX_PAGES = w_max_pages.value
              SLEEP     = w_sleep.value
              AUTH_TYPE = w_auth_type.value

              HEADERS = {"Content-Type": "application/json"}
              if AUTH_TYPE == "Bearer" and API_KEY:
                  HEADERS["Authorization"] = f"Bearer {API_KEY}"
              elif AUTH_TYPE == "Basic" and API_KEY:
                  HEADERS["Authorization"] = f"Basic {API_KEY}"

              def fetch_all_pages(endpoint, params, page_key="page", max_pages=MAX_PAGES):
                  records = []
                  for page in range(1, max_pages + 1):
                      params[page_key] = page
                      try:
                          r = requests.get(BASE_URL + endpoint, headers=HEADERS,
                                           params=params, timeout=30)
                          r.raise_for_status()
                          data  = r.json()
                          items = data.get("results", data.get("data", []))
                          if not items:
                              break
                          records.extend(items)
                          print(f"Page {page} : {len(items)} enregistrements")
                          time.sleep(SLEEP)
                      except requests.RequestException as e:
                          print(f"Erreur page {page} : {e}")
                          break
                  return records

              records = fetch_all_pages(ENDPOINT, {"limit": PAGE_SIZE, "format": "json"})
              df = pd.json_normalize(records)
              print(f"Shape : {df.shape}")

              if TARGET_COL and TARGET_COL in df.columns:
                  X = df.drop(columns=[TARGET_COL])
                  y = df[TARGET_COL]
                  task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
              else:
                  X = df.copy()
                  y = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"base_url": BASE_URL, "n_records": len(records), "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

