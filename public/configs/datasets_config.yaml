free_source:
# ──────────────────────────────────────────────────────────────────────────

  - id: free_source
    name: "Nœud Source Libre"
    enabled: true
    category: "Générique"
    format: "any"
    description: >
      Nœud d'échappement pour toute source de données hors catalogue.
      OBLIGATION : produire toutes les variables du contrat I/O Bloc 1.
      Toutes les variables non applicables DOIVENT être initialisées explicitement.
    use_cases:
      - "source propriétaire ou interne non répertoriée"
      - "API custom, bus de messages, MQTT, OPC-UA (IoT)"
      - "données en mémoire (pipeline en cours)"
      - "source expérimentale"
    code_template: |
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_target    = widgets.Text(value="target",
                                 description="TARGET_COL:", style={"description_width": "140px"},
                                 placeholder="Laisser vide = non supervisé")
      w_task_type = widgets.Dropdown(
          options=["classification", "regression", "clustering", "timeseries",
                   "nlp", "anomaly", "survival", "graph", "node_classification",
                   "knowledge_graph", "geospatial"],
          value="classification", description="TASK_TYPE:", style={"description_width": "140px"})
      w_n_rows    = widgets.IntText(value=100, description="N_ROWS (demo):",
                                    style={"description_width": "140px"})
      w_n_feats   = widgets.IntText(value=5,   description="N_FEATURES (demo):",
                                    style={"description_width": "140px"})
      w_run       = widgets.Button(description="▶ Générer exemple", button_style="warning",
                                   layout=widgets.Layout(width="200px"))
      out         = widgets.Output()

      hint = widgets.HTML(
          "<b>⚠ Nœud source libre</b> : remplacez le code dans <code>on_run()</code> "
          "par votre logique de chargement. Toutes les variables du contrat I/O "
          "doivent être produites.")

      box = widgets.VBox([
          widgets.HTML("<b>🔓 Nœud Source Libre — Paramètres</b>"),
          hint,
          widgets.HBox([w_target, w_task_type]),
          widgets.HBox([w_n_rows, w_n_feats]),
          w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              TARGET_COL = w_target.value.strip() or None
              task_type  = w_task_type.value
              N_ROWS     = w_n_rows.value
              N_FEATS    = w_n_feats.value

              # ════════════════════════════════════════════════════════════
              # ↓↓↓  REMPLACEZ CE BLOC PAR VOTRE LOGIQUE DE CHARGEMENT  ↓↓↓
              # ════════════════════════════════════════════════════════════
              df = pd.DataFrame({
                  **{f"feature_{i}": np.random.randn(N_ROWS) for i in range(N_FEATS)},
                  "target": np.random.randint(0, 2, N_ROWS),
              })
              # ════════════════════════════════════════════════════════════
              # ↑↑↑  FIN DU BLOC À REMPLACER                            ↑↑↑
              # ════════════════════════════════════════════════════════════

              if TARGET_COL and TARGET_COL in df.columns:
                  X = df.drop(columns=[TARGET_COL])
                  y = df[TARGET_COL]
              else:
                  X = df.copy()
                  y = None

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta          = {"source": "free_source", "shape": df.shape}

              # ── Initialisation OBLIGATOIRE de toutes les variables optionnelles ──
              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"Shape : {df.shape}")
              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)
