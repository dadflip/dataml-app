    - id: chroma_vectordb
      contract: tabular
      name: "ChromaDB (Vector Store)"
      category: "Base Vectorielle"
      format: "Embeddings / numpy"
      description: >
        Extraction d'embeddings et métadonnées depuis ChromaDB.
        Les vecteurs sont aplatis en DataFrame tabulaire.
      use_cases: ["clustering sémantique", "anomaly detection sémantique", "classification embeddings"]
      pros: ["embeddings pré-calculés", "métadonnées riches", "local et cloud"]
      cons: ["boîte noire (moins interprétable)", "dépendance au modèle d'embedding"]
      code_template: |
        import chromadb, numpy as np, pandas as pd

        # ── Paramètres ──────────────────────────────────────────────────
        MODE                = "Local (PersistentClient)"
        CHROMA_PATH         = "./chroma_db"
        CHROMA_HOST         = "localhost"; CHROMA_PORT = 8000
        COLLECTION_NAME     = "documents"
        TARGET_METADATA_KEY = None
        N_MAX               = None

        client = (chromadb.HttpClient(host=CHROMA_HOST, port=CHROMA_PORT)
                  if MODE != "Local (PersistentClient)"
                  else chromadb.PersistentClient(path=CHROMA_PATH))
        collection = client.get_collection(COLLECTION_NAME)
        print(f"'{COLLECTION_NAME}' : {collection.count()} vecteurs")

        kw = {"include": ["embeddings","metadatas","documents"]}
        if N_MAX: kw["limit"] = N_MAX
        results    = collection.get(**kw)
        embeddings = np.array(results["embeddings"])
        metadatas  = results["metadatas"] or [{}]*len(embeddings)
        dim        = embeddings.shape[1]
        feat_cols  = [f"emb_{i}" for i in range(dim)]
        X  = pd.DataFrame(embeddings, columns=feat_cols)
        df = X.copy()
        df_meta = pd.DataFrame(metadatas)
        if df_meta.shape[1] > 0:
            for col in df_meta.columns: df[col] = df_meta[col].values

        y = df_meta[TARGET_METADATA_KEY] if TARGET_METADATA_KEY and TARGET_METADATA_KEY in df_meta.columns else None
        task_type = ("classification" if y is not None and y.nunique() < 20
                     else "regression" if y is not None else "clustering")
        feature_names = feat_cols; target_name = TARGET_METADATA_KEY
        meta = {"collection": COLLECTION_NAME, "n_vectors": len(embeddings),
                "embedding_dim": dim, "shape": embeddings.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | dim={dim}")
        print(df.head(3))

    - id: pinecone_vectordb
      contract: tabular
      name: "Pinecone (Vector Store Cloud)"
      category: "Base Vectorielle"
      format: "Embeddings / JSON"
      description: "Extraction d'embeddings depuis Pinecone en DataFrame tabulaire."
      use_cases: ["clustering sémantique à grande échelle", "classification embeddings LLM"]
      pros: ["scalable milliards de vecteurs", "filtrage métadonnées natif"]
      cons: ["payant", "API key requise"]
      code_template: |
        import numpy as np, pandas as pd
        from pinecone import Pinecone

        # ── Paramètres ──────────────────────────────────────────────────
        PINECONE_API_KEY    = ""
        PINECONE_INDEX      = "my-index"
        TARGET_METADATA_KEY = None
        FETCH_N             = 1000

        pc = Pinecone(api_key=PINECONE_API_KEY)
        index = pc.Index(PINECONE_INDEX)
        stats = index.describe_index_stats()
        dim   = stats["dimension"]
        print(f"'{PINECONE_INDEX}' : {stats['total_vector_count']} vecteurs, dim={dim}")

        result    = index.query(vector=np.zeros(dim).tolist(), top_k=FETCH_N,
                                include_metadata=True, include_values=True)
        vectors   = np.array([m["values"]  for m in result["matches"]])
        metadatas = [m.get("metadata",{})  for m in result["matches"]]
        df_meta   = pd.DataFrame(metadatas)
        feat_cols = [f"emb_{i}" for i in range(dim)]
        X = pd.DataFrame(vectors, columns=feat_cols)
        df = X.copy()
        df["vector_id"] = [m["id"] for m in result["matches"]]

        y = (df_meta[TARGET_METADATA_KEY].reset_index(drop=True)
             if TARGET_METADATA_KEY and TARGET_METADATA_KEY in df_meta.columns else None)
        task_type = ("classification" if y is not None and y.nunique() < 20
                     else "regression" if y is not None else "clustering")
        feature_names = feat_cols; target_name = TARGET_METADATA_KEY
        meta = {"index": PINECONE_INDEX, "n_vectors": len(vectors),
                "embedding_dim": dim, "shape": vectors.shape}

        contract     = "tabular"
        texts_train  = []; texts_test = []
        y_train      = None; y_test = None
        dates_train  = None; dates_future = None
        durations    = None; events = None; df_survival = None
        print(f"[TABULAR] task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
        print(f"          shape={df.shape} | dim={dim}")
        print(df.head(3))

