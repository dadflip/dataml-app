      # Censure droite : event=1_{T≤C}
      # Cox : log h(t) = log h₀(t) + β'x
      code_template: |
        import pandas as pd, numpy as np

        # ── Paramètres ──────────────────────────────────────────────────
        # lifelines : load_rossi, load_lung, load_dd, load_stanford_heart_transplants
