# ══════════════════════════════════════════════════════════════════════════
# CONTRAT I/O GLOBAL DU PIPELINE ML
# ══════════════════════════════════════════════════════════════════════════
#
#  BLOC 1 — datasets_config.yaml
#    INPUT  : paramètres utilisateur (FILE_PATH, TARGET_COL, …)
#    OUTPUT : df, X, y, feature_names, target_name, task_type, meta
#             + texts_train / texts_test  (NLP)
#             + y_train / y_test / dates_train / dates_future  (timeseries)
#
#  BLOC 2 — eda_config.yaml
#    INPUT  : df, X, y, feature_names, target_name, task_type, meta
#             + texts_train / texts_test  (NLP)
#             + TARGET_COL  (param local à préciser)
#    OUTPUT : X_train, X_test, y_train, y_test
#             preprocessor  (sklearn Pipeline/ColumnTransformer — fitted)
#             feature_names_out  (list[str] — après OHE/poly/selection)
#             task_type  (confirmé / inchangé)
#             + dates_train / dates_future  (timeseries, pass-through)
#             + texts_train / texts_test    (NLP, pass-through)
#
#  BLOC 3 — model_config.yaml
#    INPUT  : X_train, X_test, y_train, y_test
#             feature_names  (= feature_names_out du bloc 2)
#             task_type, preprocessor
#             + texts_train / texts_test     (NLP)
#             + dates_train / dates_future   (timeseries)
#    OUTPUT : model, y_pred, y_proba, metrics, shap_values
#             + labels  (clustering)
#             + forecast  (timeseries)
#             + scores   (anomaly)
#
#  RÈGLE D'OR : ne jamais renommer ces variables entre les blocs.
#  Seuls les paramètres en MAJUSCULES (FILE_PATH, TARGET_COL, etc.)
#  sont à adapter selon le projet — tout le reste est câblé.
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
# CONTRAT I/O — BLOC 1 : datasets_config.yaml
# ──────────────────────────────────────────────────────────────────────────

pipeline_contract:
  bloc: 1
  role: "Source de données — produit les variables standards du pipeline"

  input_variables:
    # Paramètres utilisateur à configurer avant exécution
    FILE_PATH:        "str — chemin ou URL vers la source de données"
    TARGET_COL:       "str | None — nom de la colonne cible (None si non supervisé)"
    SEPARATOR:        "str — séparateur CSV (défaut : ',')"
    ENCODING:         "str — encodage fichier (défaut : 'utf-8')"
    SHEET_NAME:       "int | str — feuille Excel (défaut : 0)"
    COLUMNS:          "list[str] | None — colonnes à lire (None = toutes)"
    TEXT_COL:         "str | None — colonne texte pour NLP"
    DATE_COL:         "str — colonne datetime pour timeseries"
    FREQ:             "str — fréquence TS : 'D','W','M','H'…"
    TEST_RATIO:       "float — ratio test pour split temporel (défaut : 0.2)"
    HORIZON:          "int — nombre de pas à prévoir (timeseries)"
    DB_URL:           "str — chaîne de connexion SQLAlchemy"
    MONGO_URI:        "str — URI MongoDB"
    PROJECT_ID:       "str — projet Google BigQuery"
    API_KEY:          "str — clé API REST"
    DATASET_NAME:     "str — nom dataset HuggingFace"
    DATASET_ID:       "int — ID dataset OpenML"

  output_variables:
    # Variables TOUJOURS produites (données tabulaires)
    df:               "pd.DataFrame — données brutes complètes"
    X:                "pd.DataFrame — features (sans la target)"
    y:                "pd.Series | None — target (None si non supervisé)"
    feature_names:    "list[str] — noms des colonnes features"
    target_name:      "str | None — nom de la colonne target"
    task_type:        "str — 'classification' | 'regression' | 'clustering' | 'timeseries' | 'nlp' | 'anomaly' | 'survival'"
    meta:             "dict — métadonnées source (path, shape, encoding, ticker…)"

    # Variables supplémentaires selon task_type
    texts_train:      "list[str] — corpus train (NLP uniquement)"
    texts_test:       "list[str] — corpus test  (NLP uniquement)"
    y_train:          "pd.Series — série train (timeseries uniquement)"
    y_test:           "pd.Series — série test  (timeseries uniquement)"
    dates_train:      "pd.DatetimeIndex — index dates train (timeseries)"
    dates_future:     "pd.DatetimeIndex — index dates prévision (timeseries)"
    durations:        "pd.Series — durées (survival uniquement)"
    events:           "pd.Series — indicateurs événement 0/1 (survival)"
    df_survival:      "pd.DataFrame — df complet avec duration+event+features (survival)"


# ══════════════════════════════════════════════════════════════════════════
# DATASET CATALOG — Sources · Formats · Domaines
#   Fichiers locaux · APIs · Bases de données · Web · Streaming · Synthétiques
# ══════════════════════════════════════════════════════════════════════════
#
# Structure de chaque entrée :
#   id, name, enabled, category, format, description,
#   use_cases, pros, cons,
#   output_contract        ← ce que le code produit (variables standards)
#   code_template          ← snippet prêt à l'emploi
#
# Convention output_contract (variables standards pour EDA/Preprocessing/Modèles) :
#   df          : pd.DataFrame brut complet
#   X           : np.ndarray ou pd.DataFrame — features (après split éventuel)
#   y           : pd.Series ou np.ndarray — target (si supervisé)
#   feature_names : list[str]
#   target_name   : str | None
#   task_type     : "classification" | "regression" | "clustering" |
#                   "timeseries" | "nlp" | "anomaly" | "survival"
#   meta          : dict — infos supplémentaires (dates, ids, textes bruts…)
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
flat_files:
# ──────────────────────────────────────────────────────────────────────────

  - id: csv_local
    name: "CSV / TSV Local"
    enabled: true
    category: "Fichier Plat"
    format: "csv / tsv"
    description: "Chargement d'un fichier CSV ou TSV local. Format universel, base de tout pipeline ML."
    use_cases: ["données tabulaires standards", "exports Excel/SQL", "Kaggle datasets"]
    pros: ["universel", "simple", "pandas natif"]
    cons: ["pas de types stricts", "pas de compression native", "lent sur très grands fichiers"]
    output_contract:
      df: "pd.DataFrame — données brutes"
      X: "pd.DataFrame — features numériques/catégorielles"
      y: "pd.Series — target"
      feature_names: "list[str]"
      target_name: "str"
      task_type: "classification | regression"
    illustration_svg: '<svg viewBox="0 0 600 296" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto drop-shadow-xl rounded-xl"><rect width="600" height="296" fill="#0A0A0A" rx="12"/><!-- Grid pattern --><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.5"/></pattern><rect width="600" height="296" fill="url(#grid)" rx="12"/><!-- Inputs --><g transform="translate(20, 40)">    <rect y="0" width="140" height="28" fill="#1a1a1a" stroke="#333333" rx="6"/>    <text x="10" y="18" fill="#A0A0A0" font-family="monospace" font-size="11" alignment-baseline="middle">Config/Params</text>    <path d="M 140 14 C 180 14, 200 148, 230 148" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/></g><!-- Central Node --><rect x="230" y="108" width="140" height="80" fill="#1a1a1a" stroke="#444" rx="10" stroke-width="2"/><text x="300" y="138" fill="#EEEEEE" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">CSV / TSV Local</text><text x="300" y="158" fill="#888888" font-family="sans-serif" font-size="10" text-anchor="middle">Dataset Loader</text><!-- Outputs --><g transform="translate(440, 40)">    <path d="M 370 148 C 400 148, 420 14, 440 14" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="0" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="18" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">df</text>    <path d="M 370 148 C 400 148, 420 50, 440 50" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="36" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="54" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">X</text>    <path d="M 370 148 C 400 148, 420 86, 440 86" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="72" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="90" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">y</text>    <path d="M 370 148 C 400 148, 420 122, 440 122" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="108" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="126" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">feature_names</text>    <path d="M 370 148 C 400 148, 420 158, 440 158" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="144" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="162" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">target_name</text>    <path d="M 370 148 C 400 148, 420 194, 440 194" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4"/>    <rect y="180" width="140" height="28" fill="#0A0A0A" stroke="#3b82f6" stroke-width="1.5" rx="6"/>    <text x="10" y="198" fill="#bfdbfe" font-family="monospace" font-size="11" alignment-baseline="middle">task_type</text></g></svg>'
    code_template: |
      import pandas as pd
      import numpy as np

      # ── Paramètres à adapter ──────────────────────────────────────────
      FILE_PATH   = "data/dataset.csv"
      TARGET_COL  = "target"          # None si non supervisé
      SEPARATOR   = ","               # ";" ou "\t" pour TSV
      ENCODING    = "utf-8"           # "latin-1" si caractères spéciaux
      # ─────────────────────────────────────────────────────────────────

      df = pd.read_csv(
          FILE_PATH,
          sep=SEPARATOR,
          encoding=ENCODING,
          low_memory=False,
          parse_dates=True,     # tente de parser les colonnes date
          infer_datetime_format=True,
      )

      print(f"Shape : {df.shape}")
      print(f"Colonnes : {df.columns.tolist()}")
      print(f"Types :\n{df.dtypes}")
      print(f"Valeurs manquantes :\n{df.isnull().sum()}")

      # ── Séparation features / target ─────────────────────────────────
      if TARGET_COL and TARGET_COL in df.columns:
          X = df.drop(columns=[TARGET_COL])
          y = df[TARGET_COL]
          task_type = "classification" if y.dtype == object or y.nunique() < 20 else "regression"
      else:
          X = df.copy()
          y = None
          task_type = "clustering"

      feature_names = X.columns.tolist()
      target_name   = TARGET_COL

      meta = {"file_path": FILE_PATH, "shape": df.shape, "encoding": ENCODING}

