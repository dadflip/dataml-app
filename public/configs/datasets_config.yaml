# ══════════════════════════════════════════════════════════════════════════
# CONTRAT I/O GLOBAL DU PIPELINE ML
# ══════════════════════════════════════════════════════════════════════════
#
#  BLOC 1 — datasets_config.yaml
#    INPUT  : paramètres utilisateur (FILE_PATH, TARGET_COL, …)
#    OUTPUT : df, X, y, feature_names, target_name, task_type, meta
#             + texts_train / texts_test  (NLP)
#             + y_train / y_test / dates_train / dates_future  (timeseries)
#
#  RÈGLE D'OR : ne jamais renommer ces variables entre les blocs.
#  Seuls les paramètres en MAJUSCULES sont à adapter — tout le reste est câblé.
#
#  NOTE BLOC 1 : le split train/test N'EST PAS effectué ici.
#  Exception timeseries : y_train/y_test/dates_train/dates_future sont produits
#  car le split temporel est inhérent à la source (ordre non mélangeable).
#  Pour NLP : texts_train/texts_test sont produits si la source les fournit
#  nativement (ex: HuggingFace train/test split). Sinon texts_train = corpus entier.
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
# CONTRAT I/O — BLOC 1 : datasets_config.yaml
# ──────────────────────────────────────────────────────────────────────────

pipeline_contract:
  bloc: 1
  role: "Source de données — produit les variables standards du pipeline"

  input_variables:
    FILE_PATH:        "str — chemin ou URL vers la source de données"
    TARGET_COL:       "str | None — nom de la colonne cible (None si non supervisé)"
    SEPARATOR:        "str — séparateur CSV (défaut : ',')"
    ENCODING:         "str — encodage fichier (défaut : 'utf-8')"
    SHEET_NAME:       "int | str — feuille Excel (défaut : 0)"
    COLUMNS:          "list[str] | None — colonnes à lire (None = toutes)"
    TEXT_COL:         "str | None — colonne texte pour NLP"
    DATE_COL:         "str — colonne datetime pour timeseries"
    FREQ:             "str — fréquence TS : 'D','W','M','H'…"
    TEST_RATIO:       "float — ratio test pour split temporel timeseries (défaut : 0.2)"
    HORIZON:          "int — nombre de pas à prévoir (timeseries)"
    DB_URL:           "str — chaîne de connexion SQLAlchemy"
    MONGO_URI:        "str — URI MongoDB"
    PROJECT_ID:       "str — projet Google BigQuery"
    API_KEY:          "str — clé API REST"
    DATASET_NAME:     "str — nom dataset HuggingFace"
    DATASET_ID:       "int — ID dataset OpenML"

  output_variables:
    # ── Variables TOUJOURS produites (tous task_type) ──────────────────
    df:               "pd.DataFrame — données brutes complètes"
    X:                "pd.DataFrame — features (sans la target, sans colonnes date/texte)"
    y:                "pd.Series | None — target (None si non supervisé)"
    feature_names:    "list[str] — noms des colonnes features de X"
    target_name:      "str | None — nom de la colonne target"
    task_type:        "str — 'classification'|'regression'|'clustering'|'timeseries'|'nlp'|'anomaly'|'survival'"
    meta:             "dict — métadonnées source (path, shape, encoding, ticker…)"

    # ── Variables supplémentaires NLP ─────────────────────────────────
    texts_train:      "list[str] — corpus train NLP (= corpus entier si pas de split natif)"
    texts_test:       "list[str] — corpus test NLP (= [] si pas de split natif)"

    # ── Variables supplémentaires timeseries ──────────────────────────
    y_train:          "pd.Series — série train (timeseries uniquement)"
    y_test:           "pd.Series — série test  (timeseries uniquement)"
    dates_train:      "pd.DatetimeIndex — index dates train (timeseries)"
    dates_future:     "pd.DatetimeIndex — index dates prévision (timeseries)"

    # ── Variables supplémentaires survival ────────────────────────────
    durations:        "pd.Series — durées (survival uniquement)"
    events:           "pd.Series — indicateurs événement 0/1 (survival)"
    df_survival:      "pd.DataFrame — df complet avec duration+event+features (survival)"


# ══════════════════════════════════════════════════════════════════════════
# DATASET CATALOG
# ══════════════════════════════════════════════════════════════════════════
#
# CONVENTION DE SORTIE UNIVERSELLE :
#   Chaque snippet DOIT produire toutes les variables du contrat.
#   Les variables non applicables sont initialisées à None ou [].
#
#   Initialisation systématique en fin de bloc :
#     texts_train = texts_train if task_type == "nlp" else []
#     texts_test  = texts_test  if task_type == "nlp" else []
#     y_train = y_train if task_type == "timeseries" else None
#     y_test  = y_test  if task_type == "timeseries" else None
#     dates_train  = dates_train  if task_type == "timeseries" else None
#     dates_future = dates_future if task_type == "timeseries" else None
#     durations    = durations    if task_type == "survival"    else None
#     events       = events       if task_type == "survival"    else None
#     df_survival  = df_survival  if task_type == "survival"    else None
# ══════════════════════════════════════════════════════════════════════════


# ──────────────────────────────────────────────────────────────────────────
flat_files:
# ──────────────────────────────────────────────────────────────────────────

  - id: csv_local
    name: "CSV / TSV Local"
    enabled: true
    category: "Fichier Plat"
    format: "csv / tsv"
    description: "Chargement d'un fichier CSV ou TSV local."
    use_cases: ["données tabulaires standards", "exports Excel/SQL", "Kaggle datasets"]
    pros: ["universel", "simple", "pandas natif"]
    cons: ["pas de types stricts", "lent sur très grands fichiers"]
    code_template: |
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file      = widgets.Text(value="data/dataset.csv",
                                 description="FILE_PATH:", style={"description_width": "130px"},
                                 layout=widgets.Layout(width="500px"))
      w_target    = widgets.Text(value="target",
                                 description="TARGET_COL:", style={"description_width": "130px"},
                                 layout=widgets.Layout(width="400px"),
                                 placeholder="Laisser vide = non supervisé")
      w_sep       = widgets.Dropdown(options=[(",", "Virgule ,"), (";", "Point-virgule ;"),
                                              ("\t", "Tabulation \\t"), ("|", "Pipe |")],
                                     value=",", description="SEPARATOR:",
                                     style={"description_width": "130px"})
      w_encoding  = widgets.Dropdown(options=["utf-8", "latin-1", "utf-16", "cp1252"],
                                     value="utf-8", description="ENCODING:",
                                     style={"description_width": "130px"})
      w_columns   = widgets.Text(value="",
                                 description="COLUMNS:", style={"description_width": "130px"},
                                 layout=widgets.Layout(width="500px"),
                                 placeholder="col1,col2,col3 — vide = toutes")
      w_run       = widgets.Button(description="▶ Charger", button_style="success",
                                   layout=widgets.Layout(width="150px"))
      out         = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>📂 CSV / TSV Local — Paramètres</b>"),
          w_file, w_target, w_sep, w_encoding, w_columns, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              # ── Lecture des paramètres ─────────────────────────────────
              FILE_PATH  = w_file.value.strip()
              TARGET_COL = w_target.value.strip() or None
              SEPARATOR  = w_sep.value
              ENCODING   = w_encoding.value
              COLUMNS    = [c.strip() for c in w_columns.value.split(",") if c.strip()] or None

              # ── Chargement ─────────────────────────────────────────────
              df = pd.read_csv(
                  FILE_PATH, sep=SEPARATOR, encoding=ENCODING,
                  usecols=COLUMNS, low_memory=False,
                  parse_dates=True, infer_datetime_format=True,
              )
              print(f"Shape : {df.shape}")
              print(df.dtypes)
              print(df.isnull().sum())

              # ── Séparation features / target ───────────────────────────
              if TARGET_COL and TARGET_COL in df.columns:
                  X = df.drop(columns=[TARGET_COL])
                  y = df[TARGET_COL]
                  task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
              else:
                  X = df.copy()
                  y = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"file_path": FILE_PATH, "shape": df.shape, "encoding": ENCODING}

              # ── Initialisation variables non applicables ───────────────
              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: excel_local
    name: "Excel (xlsx / xls)"
    enabled: true
    category: "Fichier Plat"
    format: "xlsx / xls"
    description: "Chargement d'un classeur Excel avec sélection de feuille."
    use_cases: ["données métier", "rapports financiers", "exports ERP/CRM"]
    pros: ["très répandu en entreprise", "plusieurs feuilles"]
    cons: ["lent à lire", "formules non évaluées par pandas"]
    code_template: |
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file       = widgets.Text(value="data/dataset.xlsx",
                                  description="FILE_PATH:", style={"description_width": "130px"},
                                  layout=widgets.Layout(width="500px"))
      w_sheet      = widgets.Text(value="0",
                                  description="SHEET_NAME:", style={"description_width": "130px"},
                                  placeholder="0 = première feuille, ou nom ex: Sheet1")
      w_target     = widgets.Text(value="target",
                                  description="TARGET_COL:", style={"description_width": "130px"},
                                  placeholder="Laisser vide = non supervisé")
      w_header_row = widgets.IntText(value=0, description="HEADER_ROW:",
                                     style={"description_width": "130px"})
      w_skip_rows  = widgets.Text(value="",
                                  description="SKIP_ROWS:", style={"description_width": "130px"},
                                  placeholder="Vide = aucune, ex: 1,2,3")
      w_run        = widgets.Button(description="▶ Charger", button_style="success",
                                    layout=widgets.Layout(width="150px"))
      out          = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>📊 Excel — Paramètres</b>"),
          w_file, w_sheet, w_target, w_header_row, w_skip_rows, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              FILE_PATH  = w_file.value.strip()
              TARGET_COL = w_target.value.strip() or None
              HEADER_ROW = w_header_row.value
              _skip_raw  = w_skip_rows.value.strip()
              SKIP_ROWS  = [int(x) for x in _skip_raw.split(",") if x.strip()] or None
              _sheet_raw = w_sheet.value.strip()
              SHEET_NAME = int(_sheet_raw) if _sheet_raw.isdigit() else _sheet_raw

              xl = pd.ExcelFile(FILE_PATH)
              print("Feuilles disponibles :", xl.sheet_names)

              df = pd.read_excel(
                  FILE_PATH, sheet_name=SHEET_NAME,
                  header=HEADER_ROW, skiprows=SKIP_ROWS, engine="openpyxl",
              )
              df.columns = df.columns.str.strip().str.lower().str.replace(" ", "_")
              df = df.dropna(how="all").dropna(axis=1, how="all")
              print(f"Shape : {df.shape}")

              if TARGET_COL and TARGET_COL in df.columns:
                  X = df.drop(columns=[TARGET_COL])
                  y = df[TARGET_COL]
                  task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
              else:
                  X = df.copy()
                  y = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"file": FILE_PATH, "sheet": SHEET_NAME, "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: parquet_local
    name: "Parquet"
    enabled: true
    category: "Fichier Colonnaire"
    format: "parquet"
    description: "Format colonnaire compressé. Standard pour la data engineering et les gros volumes."
    use_cases: ["gros volumes (>1M lignes)", "données Spark/Databricks", "pipelines de production"]
    pros: ["très rapide en lecture", "compressé", "types stricts"]
    cons: ["non lisible à l'œil nu", "nécessite pyarrow ou fastparquet"]
    code_template: |
      import pandas as pd
      import numpy as np
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file    = widgets.Text(value="data/dataset.parquet",
                               description="FILE_PATH:", style={"description_width": "130px"},
                               layout=widgets.Layout(width="500px"))
      w_target  = widgets.Text(value="target",
                               description="TARGET_COL:", style={"description_width": "130px"},
                               placeholder="Laisser vide = non supervisé")
      w_columns = widgets.Text(value="",
                               description="COLUMNS:", style={"description_width": "130px"},
                               layout=widgets.Layout(width="500px"),
                               placeholder="col1,col2 — vide = toutes")
      w_engine  = widgets.Dropdown(options=["pyarrow", "fastparquet"],
                                   value="pyarrow", description="ENGINE:",
                                   style={"description_width": "130px"})
      w_run     = widgets.Button(description="▶ Charger", button_style="success",
                                 layout=widgets.Layout(width="150px"))
      out       = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🗜 Parquet — Paramètres</b>"),
          w_file, w_target, w_columns, w_engine, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              FILE_PATH  = w_file.value.strip()
              TARGET_COL = w_target.value.strip() or None
              COLUMNS    = [c.strip() for c in w_columns.value.split(",") if c.strip()] or None
              ENGINE     = w_engine.value

              df = pd.read_parquet(FILE_PATH, columns=COLUMNS, engine=ENGINE)
              print(f"Shape : {df.shape}")
              print(df.dtypes)

              if TARGET_COL and TARGET_COL in df.columns:
                  X = df.drop(columns=[TARGET_COL])
                  y = df[TARGET_COL]
                  task_type = "classification" if y.nunique() < 20 else "regression"
              else:
                  X = df.copy()
                  y = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"engine": ENGINE, "file": FILE_PATH, "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: json_local
    name: "JSON / JSONL"
    enabled: true
    category: "Fichier Semi-Structuré"
    format: "json / jsonl"
    description: "Chargement de JSON tabulaire ou imbriqué, et de JSONL pour le streaming."
    use_cases: ["données API", "logs applicatifs", "exports NoSQL", "NLP datasets"]
    pros: ["flexible", "hiérarchique", "omniprésent"]
    cons: ["imbrication complexe à aplatir", "lent sur gros volumes"]
    code_template: |
      import pandas as pd
      import numpy as np
      import json
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_file     = widgets.Text(value="data/dataset.json",
                                description="FILE_PATH:", style={"description_width": "130px"},
                                layout=widgets.Layout(width="500px"),
                                placeholder="chemin .json ou .jsonl")
      w_target   = widgets.Text(value="label",
                                description="TARGET_COL:", style={"description_width": "130px"},
                                placeholder="Laisser vide = non supervisé")
      w_text_col = widgets.Text(value="",
                                description="TEXT_COL:", style={"description_width": "130px"},
                                placeholder="Colonne texte pour NLP — vide si N/A")
      w_run      = widgets.Button(description="▶ Charger", button_style="success",
                                  layout=widgets.Layout(width="150px"))
      out        = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>📄 JSON / JSONL — Paramètres</b>"),
          w_file, w_target, w_text_col, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              FILE_PATH  = w_file.value.strip()
              TARGET_COL = w_target.value.strip() or None
              TEXT_COL   = w_text_col.value.strip() or None
              IS_JSONL   = FILE_PATH.endswith(".jsonl")

              if IS_JSONL:
                  records = []
                  with open(FILE_PATH, encoding="utf-8") as f:
                      for line in f:
                          records.append(json.loads(line.strip()))
                  df = pd.DataFrame(records)
              else:
                  df = pd.read_json(FILE_PATH, encoding="utf-8")

              nested_cols = [c for c in df.columns if df[c].apply(lambda x: isinstance(x, dict)).any()]
              for col in nested_cols:
                  expanded = pd.json_normalize(df[col])
                  expanded.columns = [f"{col}.{c}" for c in expanded.columns]
                  df = pd.concat([df.drop(columns=[col]), expanded], axis=1)

              print(f"Shape : {df.shape}")

              if TARGET_COL and TARGET_COL in df.columns:
                  X = df.drop(columns=[TARGET_COL] + ([TEXT_COL] if TEXT_COL and TEXT_COL in df.columns else []))
                  y = df[TARGET_COL]
                  task_type = "classification" if (y.dtype == object or y.nunique() < 20) else "regression"
              elif TEXT_COL and TEXT_COL in df.columns:
                  X = df.drop(columns=[TEXT_COL])
                  y = None
                  task_type = "nlp"
              else:
                  X = df.copy()
                  y = None
                  task_type = "clustering"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"text_col": TEXT_COL, "nested_cols_expanded": nested_cols, "shape": df.shape}

              if task_type == "nlp" and TEXT_COL and TEXT_COL in df.columns:
                  texts_train = df[TEXT_COL].astype(str).tolist()
                  texts_test  = []
              else:
                  texts_train = []
                  texts_test  = []

              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)


# ──────────────────────────────────────────────────────────────────────────
databases:
# ──────────────────────────────────────────────────────────────────────────

  - id: sql_relational
    name: "Base SQL (PostgreSQL / MySQL / SQLite)"
    enabled: true
    category: "Base de Données Relationnelle"
    format: "SQL"
    description: "Chargement depuis une base relationnelle via SQLAlchemy."
    use_cases: ["données de production", "entrepôts de données", "systèmes transactionnels"]
    pros: ["données fraîches", "requêtes complexes", "jointures"]
    cons: ["accès réseau nécessaire", "charge sur la DB"]
    code_template: |
      import pandas as pd
      import numpy as np
      from sqlalchemy import create_engine
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_dialect  = widgets.Dropdown(
          options=[
              ("PostgreSQL", "postgresql+psycopg2://{user}:{pwd}@{host}:5432/{db}"),
              ("MySQL",      "mysql+pymysql://{user}:{pwd}@{host}:3306/{db}"),
              ("SQLite",     "sqlite:///{path}"),
          ],
          description="Dialect:", style={"description_width": "130px"})
      w_db_url   = widgets.Text(
          value="postgresql+psycopg2://user:password@localhost:5432/mydb",
          description="DB_URL:", style={"description_width": "130px"},
          layout=widgets.Layout(width="600px"))
      w_target   = widgets.Text(value="target",
                                description="TARGET_COL:", style={"description_width": "130px"})
      w_query    = widgets.Textarea(
          value=(
              "SELECT t.*, f.feature_extra\n"
              "FROM   main_table t\n"
              "JOIN   features_table f ON t.id = f.id\n"
              "WHERE  t.created_at >= '2023-01-01'\n"
              "  AND  t.status = 'active'\n"
              "LIMIT  500000"
          ),
          description="QUERY:", style={"description_width": "130px"},
          layout=widgets.Layout(width="700px", height="150px"))
      w_run      = widgets.Button(description="▶ Charger", button_style="success",
                                  layout=widgets.Layout(width="150px"))
      out        = widgets.Output()

      box = widgets.VBox([
          widgets.HTML("<b>🗄 Base SQL Relationnelle — Paramètres</b>"),
          w_dialect, w_db_url, w_target, w_query, w_run, out
      ])
      display(box)

      def on_run(b):
          with out:
              clear_output()
              DB_URL     = w_db_url.value.strip()
              TARGET_COL = w_target.value.strip() or None
              QUERY      = w_query.value.strip()

              engine = create_engine(DB_URL, pool_pre_ping=True)
              with engine.connect() as conn:
                  df = pd.read_sql(QUERY, conn, parse_dates=["created_at"])
              print(f"Shape : {df.shape}")

              EXCLUDE = ["id", "created_at", "updated_at", TARGET_COL]
              X = df.drop(columns=[c for c in EXCLUDE if c in df.columns])
              y = df[TARGET_COL] if TARGET_COL in df.columns else None
              task_type = "classification" if (y is not None and y.nunique() < 20) else "regression"

              feature_names = X.columns.tolist()
              target_name   = TARGET_COL
              meta = {"query": QUERY[:200], "db": DB_URL.split("@")[-1], "shape": df.shape}

              texts_train  = []
              texts_test   = []
              y_train      = None
              y_test       = None
              dates_train  = None
              dates_future = None
              durations    = None
              events       = None
              df_survival  = None

              print(f"\n✅ task_type='{task_type}' | features={len(feature_names)} | target='{target_name}'")
              display(df.head(3))

      w_run.on_click(on_run)

  - id: mongodb
    name: "MongoDB"
    enabled: true
    category: "Base de Données NoSQL"
    format: "BSON / Documents"
    description: "Extraction depuis MongoDB et aplatissement en DataFrame tabulaire."
    use_cases: ["données semi-structurées", "logs", "profils utilisateurs", "IoT"]
    pros: ["flexible (schemaless)", "requêtes riches", "scalable"]
    cons: ["imbrication à aplatir", "pas de jointures natives"]
    code_template: |
      import pandas as pd
      import numpy as np
      from pymongo import MongoClient
      import ipywidgets as widgets
      from IPython.display import display, clear_output

      # ── Interface ipywidgets ───────────────────────────────────────────
      w_uri        = widgets.Text(value="mongodb://localhost:27017/",
                                  description="MONGO_URI:", style={"description_width": "140px"},
                                  layout=widgets.Layout(width="500px"))
