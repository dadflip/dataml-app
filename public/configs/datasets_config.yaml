    code_template: |
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt

      FILE_PATH   = "data/timeseries.csv"
      DATE_COL    = "date"
      TARGET_COL  = "value"
      FREQ        = "D"         # "D"=day, "W"=week, "M"=month, "H"=hour
      TEST_RATIO  = 0.2
      HORIZON     = 30          # nombre de pas à prévoir

      df = pd.read_csv(FILE_PATH, parse_dates=[DATE_COL])
      df = df.set_index(DATE_COL).sort_index()

      # Ré-échantillonnage à fréquence régulière (si irrégulier)
      df = df.resample(FREQ).agg({TARGET_COL: "sum"}).fillna(method="ffill")

      # Vérification de la stationnarité (optionnel)
      # from statsmodels.tsa.stattools import adfuller
      # print(adfuller(df[TARGET_COL].dropna()))

      # Visualisation rapide
      df[TARGET_COL].plot(figsize=(14, 4), title="Série temporelle")
      plt.tight_layout(); plt.show()

      # Split temporel (pas de shuffle !)
      n_test = int(len(df) * TEST_RATIO)
      y_train = df[TARGET_COL].iloc[:-n_test]
      y_test  = df[TARGET_COL].iloc[-n_test:]
      dates_train  = y_train.index
      dates_future = pd.date_range(start=y_test.index[0], periods=HORIZON, freq=FREQ)

      task_type   = "timeseries"
      target_name = TARGET_COL
      meta = {"freq": FREQ, "horizon": HORIZON, "n_train": len(y_train), "n_test": len(y_test)}

